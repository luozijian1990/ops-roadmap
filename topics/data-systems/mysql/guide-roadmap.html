MySQL 5.7+）\n[mysqld]\nslave_parallel_workers = 16\nslave_parallel_type = LOGICAL_CLOCK\nslave_preserve_commit_order = ON\n\n-- 主库配置WRITESET（MySQL 5.7.22+）\nbinlog_transaction_dependency_tracking = WRITESET\ntransaction_write_set_extraction = XXHASH64\n```\n\n**WRITESET模式限制条件**：\n\n| 限制 | 说明 |\n|------|------|\n| 需要主键或唯一键 | 无法计算writeset的表不可用 |\n| 不支持外键 | 外键约束导致依赖复杂 |\n| binlog_format需为ROW | STATEMENT格式无法精确计算writeset |\n\n---", "subs": ["26.1 并行复制基本原则", "26.2 并行复制策略演进", "26.3 并行复制参数配置详解"]}, {"title": "第27章 主库故障场景下的从库处理策略", "content": "> **核心要点**：一主多从切换时的位点问题，以及GTID模式如何简化切换流程。\n\n#### 27.1 基于位点的主备切换问题\n\n切换时需要找同步位点，但位点很难精确：\n\n```sql\n-- 传统方式需要手动跳过错误\nSET GLOBAL sql_slave_skip_counter = 1;\nSTART SLAVE;\n\n-- 或设置跳过指定错误\nSET GLOBAL slave_skip_errors = '1032,1062';\n```\n\n#### 27.2 GTID模式\n\n**GTID格式**：`server_uuid:gno`\n\n```sql\n-- 启用GTID模式\ngtid_mode = on\nenforce_gtid_consistency = on\n```\n\n**GTID主备切换**：\n\n```sql\nCHANGE MASTER TO\n  MASTER_HOST = $host_name,\n  MASTER_PORT = $port,\n  MASTER_USER = $user_name,\n  MASTER_PASSWORD = $password,\n  MASTER_AUTO_POSITION = 1;  -- 使用GTID协议\n```\n\n> [!TIP]\n> GTID模式下无需指定位点，系统自动计算差集。\n\n#### 27.3 跳过指定GTID\n\n```sql\nSET GTID_NEXT = 'aaaaaaaa-cccc-dddd-eeee-ffffffffffff:10';\nBEGIN;\nCOMMIT;\nSET GTID_NEXT = automatic;\nSTART SLAVE;\n```\n\n---", "subs": ["27.1 基于位点的主备切换问题", "27.2 GTID模式", "27.3 跳过指定GTID"]}, {"title": "第28章 读写分离架构的常见陷阱", "content": "> **核心要点**：读写分离场景下的过期读问题及多种解决方案。\n\n#### 28.1 读写分离架构\n\n```mermaid\ngraph LR\n    C[客户端] --> P[Proxy]\n    P --> M[主库写]\n    P --> S1[从库1读]\n    P --> S2[从库2读]\n```\n\n#### 28.2 过期读解决方案\n\n| 方案 | 原理 | 优缺点 |\n|------|------|--------|\n| 强制走主库 | 关键查询走主库 | 简单有效但压力集中 |\n| Sleep方案 | 查询前等待1秒 | 不精确 |\n| 判断无延迟 | 检查seconds_behind_master=0 | 精度秒级 |\n| Semi-sync | 半同步复制 | 一主多从时仍有问题 |\n| 等主库位点 | master_pos_wait函数 | 推荐 |\n| 等GTID | wait_for_executed_gtid_set函数 | 最推荐 |\n\n#### 28.3 等GTID方案\n\n```sql\n-- 1. 事务完成后获取GTID\n-- 2. 在从库等待GTID\nSELECT wait_for_executed_gtid_set('gtid1', 1);\n-- 返回0表示已执行，可以查询\n-- 返回1表示超时，需要走主库\n```\n\n**开启GTID返回**：\n\n```sql\nSET session_track_gtids = OWN_GTID;\n```\n\n> [!IMPORTANT]\n> 过期读方案应根据业务需求混合使用，并做好限流策略。\n\n#### 28.4 Semi-sync半同步复制配置\n\n**安装插件**：\n\n```sql\n-- 主库安装\nINSTALL PLUGIN rpl_semi_sync_master SONAME 'semisync_master.so';\n\n-- 从库安装\nINSTALL PLUGIN rpl_semi_sync_slave SONAME 'semisync_slave.so';\n```\n\n**配置参数**：\n\n```sql\n-- 主库配置（my.cnf）\n[mysqld]\nrpl_semi_sync_master_enabled = 1\nrpl_semi_sync_master_timeout = 1000  -- 超时回退异步（毫秒）\nrpl_semi_sync_master_wait_for_slave_count = 1  -- 等待几个从库确认\n\n-- 从库配置\n[mysqld]\nrpl_semi_sync_slave_enabled = 1\n```\n\n**监控Semi-sync状态**：\n\n```sql\nSHOW STATUS LIKE 'Rpl_semi_sync%';\n```\n\n#### 28.5 过期读方案决策表\n\n| 方案 | 实现复杂度 | 可靠性 | 性能影响 | 推荐场景 |\n|------|-----------|--------|----------|----------|\n| 强制走主库 | 低 | 高 | 高 | 关键业务查询 |\n| Sleep方案 | 低 | 低 | 低 | 不推荐 |\n| 判断SBM=0 | 中 | 中 | 低 | 一般场景 |\n| Semi-sync | 中 | 高 | 中 | 数据一致性要求高 |\n| 等GTID | 高 | 高 | 低 | **推荐：大多数场景** |\n\n---", "subs": ["28.1 读写分离架构", "28.2 过期读解决方案", "28.3 等GTID方案", "28.4 Semi-sync半同步复制配置", "28.5 过期读方案决策表"]}, {"title": "第29章 数据库健康检测与监控方法", "content": "> **核心要点**：本章介绍判断MySQL实例健康状态的多种方法及其优缺点。\n\n#### 29.1 检测方法对比\n\n| 方法 | 原理 | 优点 | 缺点 |\n|------|------|------|------|\n| select 1 | 验证进程存活 | 简单 | 无法检测InnoDB问题 |\n| 查表判断 | 查询health_check表 | 能检测并发问题 | 无法检测磁盘满 |\n| 更新判断 | 更新health_check表 | 能检测磁盘问题 | 判定慢 |\n| 内部统计 | performance_schema | 精确检测IO问题 | 有性能损耗 |\n\n#### 29.2 并发连接 vs 并发查询\n\n```mermaid\ngraph LR\n    A[并发连接] -->|show processlist| B[几千个连接]\n    C[并发查询] -->|正在执行的语句| D[受innodb_thread_concurrency限制]\n```\n\n> [!TIP]\n> 建议设置`innodb_thread_concurrency`为64~128，等待行锁的线程不计入并发数。\n\n#### 29.3 更新判断最佳实践\n\n```sql\n-- 创建健康检查表\nCREATE TABLE health_check (\n  id INT NOT NULL PRIMARY KEY,\n  t_modified TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP\n) ENGINE=InnoDB;\n\n-- 检测命令（使用server_id区分主备）\nINSERT INTO health_check(id, t_modified) \nVALUES (@@server_id, now()) \nON DUPLICATE KEY UPDATE t_modified=now();\n```\n\n#### 29.4 内部统计监控\n\n```sql\n-- 开启redo log监控\nUPDATE setup_instruments SET ENABLED='YES', Timed='YES' \nWHERE name LIKE '%wait/io/file/innodb/innodb_log_file%';\n\n--- 检测逻辑（单次IO超过200ms告警）\nSELECT event_name, MAX_TIMER_WAIT \nFROM performance_schema.file_summary_by_event_name;\n```\n\n#### 29.5 select 1问题复现\n\n**问题场景**：即使执行 `SELECT 1` 成功，数据库可能仍无法正常工作。\n\n```sql\n-- 设置并发线程数为3\nSET GLOBAL innodb_thread_concurrency = 3;\n\n-- 用3个会话执行sleep，第4个会话被阻塞\n-- Session 1-3:\nSELECT sleep(100) FROM t;\n\n-- Session 4 执行 SELECT 1 成功，但实际业务查询阻塞\nSELECT 1;  -- 成功\nSELECT * FROM t WHERE id = 1;  -- 阻塞！\n```\n\n#### 29.6 innodb_thread_concurrency配置建议\n\n| 场景 | 建议值 | 说明 |\n|------|--------|------|\n| CPU密集型业务 | 64 | 减少上下文切换 |\n| IO密集型业务 | 128 | 允许更多并发等待IO |\n| 小型实例 | 0 | 禁用限制（默认） |\n\n```sql\n-- 查看当前配置\nSHOW VARIABLES LIKE 'innodb_thread_concurrency';\n\n-- 动态调整\nSET GLOBAL innodb_thread_concurrency = 64;\n```\n\n> [!TIP]\n> 等待行锁的线程**不计入**并发线程数，只有正在执行的线程才计入。\n\n#### 29.7 performance_schema IO统计查询\n\n```sql\n-- 查询文件IO等待时间\nSELECT \n    file_name,\n    count_read,\n    sum_timer_read/1000000000 AS read_time_ms,\n    count_write,\n    sum_timer_write/1000000000 AS write_time_ms\nFROM performance_schema.file_summary_by_instance\nORDER BY sum_timer_read DESC\nLIMIT 10;\n\n-- 查询锁等待事件\nSELECT \n    event_name,\n    count_star,\n    sum_timer_wait/1000000000 AS total_wait_ms\nFROM performance_schema.events_waits_summary_global_by_event_name\nWHERE event_name LIKE 'wait/synch/mutex%'\nORDER BY sum_timer_wait DESC\nLIMIT 10;\n```\n\n---", "subs": ["29.1 检测方法对比", "29.2 并发连接 vs 并发查询", "29.3 更新判断最佳实践", "29.4 内部统计监控", "29.5 select 1问题复现", "29.6 innodb_thread_concurrency配置建议", "29.7 performance_schema IO统计查询"]}, {"title": "第30章 动态视角理解MySQL锁机制", "content": "> **核心要点**：本章从动态执行的角度深入分析加锁规则。\n\n#### 30.1 加锁规则回顾\n\n| 规则 | 说明 |\n|------|------|\n| 原则1 | 加锁基本单位是next-key lock（前开后闭） |\n| 原则2 | 查找过程中访问到的对象才会加锁 |\n| 优化1 | 唯一索引等值查询，next-key lock退化为行锁 |\n| 优化2 | 等值查询向右遍历时，next-key lock退化为间隙锁 |\n\n#### 30.2 死锁分析\n\n```sql\n-- 查看最后一次死锁信息\nSHOW ENGINE INNODB STATUS;\n```\n\n**死锁示例**：\n\n```sql\n-- Session A\nSELECT id FROM t WHERE c IN(5,20,10) LOCK IN SHARE MODE;\n-- 加锁顺序：c=5 -> c=10 -> c=20\n\n-- Session B  \nSELECT id FROM t WHERE c IN(5,20,10) ORDER BY c DESC FOR UPDATE;\n-- 加锁顺序：c=20 -> c=10 -> c=5（相反顺序导致死锁）\n```\n\n> [!IMPORTANT]\n> 避免死锁的关键：对同一组资源按相同顺序访问。\n\n#### 30.3 间隙的动态变化\n\n间隙由\"右边的记录\"定义：\n\n```sql\n-- Session A 锁住 (5,10] 和 (10,15]\nSELECT * FROM t WHERE c>=5 AND c<10 FOR UPDATE;\n\n-- Session B 删除 id=10\nDELETE FROM t WHERE id=10;\n-- 此时间隙变为 (5,15)\n\n-- Session B 插入回 id=10 会被阻塞\nINSERT INTO t VALUES(10,10,10);  -- 被锁住\n```\n\n---", "subs": ["30.1 加锁规则回顾", "30.2 死锁分析", "30.3 间隙的动态变化"]}, {"title": "第31章 数据误删恢复与预防策略", "content": "> **核心要点**：本章讲解误删数据的恢复方法和预防措施。\n\n#### 31.1 误删类型与恢复方法\n\n| 误删类型 | 恢复方法 | 前提条件 |\n|----------|----------|----------|\n| DELETE误删行 | Flashback闪回 | binlog_format=row |\n| DROP TABLE/DATABASE | 全量备份+binlog | 定期备份+实时binlog备份 |\n| rm删除实例 | HA切换+数据恢复 | 高可用架构 |\n\n#### 31.2 Flashback恢复原理\n\n```mermaid\ngraph LR\n    A[INSERT] -->|修改为| B[DELETE]\n    C[DELETE] -->|修改为| D[INSERT]\n    E[UPDATE] -->|对调前后值| F[UPDATE]\n```\n\n#### 31.3 误删库/表恢复流程\n\n```mermaid\ngraph TD\n    A[发现误删] --> B[取最近全量备份]\n    B --> C[恢复到临时库]\n    C --> D[应用binlog跳过误操作]\n    D --> E[验证数据正确性]\n    E --> F[恢复到生产库]\n```\n\n**加速恢复技巧**：\n\n1. 临时库设为备库从库，使用`replicate_do_table`过滤\n2. 利用并行复制加速\n\n#### 31.4 延迟复制备库\n\n```sql\n-- 设置备库延迟1小时\nCHANGE MASTER TO MASTER_DELAY = 3600;\n```\n\n#### 31.5 Flashback工具使用步骤\n\n**使用MariaDB Flashback**：\n\n```bash\n# 1. 从binlog中提取DELETE语句并反转为INSERT\nmysqlbinlog -vv --base64-output=decode-rows mysql-bin.000001 \\\n  | grep -E \"^###\" \\\n  | sed 's/### //g' \\\n  | sed 's/DELETE FROM/INSERT INTO/g'\n\n# 2. 使用binlog2sql工具（推荐）\n# 安装\npip install binlog2sql\n\n# 解析binlog生成回滚SQL\nbinlog2sql -h127.0.0.1 -P3306 -uroot -p'password' \\\n  --start-file='mysql-bin.000001' \\\n  --start-datetime='2024-01-01 10:00:00' \\\n  --stop-datetime='2024-01-01 10:30:00' \\\n  --flashback \\\n  -d testdb -t users > rollback.sql\n```\n\n#### 31.6 binlog恢复完整流程\n\n```bash\n#!/bin/bash\n# 全量+增量恢复脚本\n\n# 1. 恢复全量备份\nmysql -uroot -p < full_backup_20240101.sql\n\n# 2. 找到误操作的binlog位置\nmysqlbinlog --base64-output=decode-rows -vv mysql-bin.000010 | grep -B 5 \"DROP TABLE\"\n\n# 3. 应用binlog到误操作前\nmysqlbinlog mysql-bin.000008 mysql-bin.000009 \\\n  --stop-position=123456 | mysql -uroot -p\n\n# 4. 跳过误操作，继续应用后续binlog\nmysqlbinlog mysql-bin.000010 \\\n  --start-position=123500 | mysql -uroot -p\n```\n\n#### 31.7 延迟从库配置方法\n\n```sql\n-- 查看当前延迟设置\nSHOW SLAVE STATUS\\G\n-- SQL_Delay: 3600\n\n-- 设置延迟（秒）\nSTOP SLAVE;\nCHANGE MASTER TO MASTER_DELAY = 3600;\nSTART SLAVE;\n\n-- 发生误操作时的恢复步骤\nSTOP SLAVE;\n-- 应用到误操作前的位点\nSTART SLAVE UNTIL SQL_BEFORE_GTIDS = 'uuid:gno';\n```\n\n#### 31.8 预防措施\n\n| 措施 | 说明 |\n|------|------|\n| 账号分离 | 业务账号只给DML权限 |\n| sql_safe_updates=on | 禁止无WHERE的DELETE/UPDATE |\n| 改名后删除 | 先改名观察再删除 |\n| 跨机房备份 | 防止机房级故障 |\n\n---", "subs": ["31.1 误删类型与恢复方法", "31.2 Flashback恢复原理", "31.3 误删库/表恢复流程", "31.4 延迟复制备库", "31.5 Flashback工具使用步骤", "31.6 binlog恢复完整流程", "31.7 延迟从库配置方法", "31.8 预防措施"]}, {"title": "第32章 MySQL Kill命令失效的原因分析", "content": "> **核心要点**：本章分析kill命令无法立即停止线程的原因。\n\n#### 32.1 Kill命令的工作原理\n\n```mermaid\nsequenceDiagram\n    participant C as kill命令\n    participant T as 目标线程\n    \n    C->>T: 设置状态为KILL_QUERY\n    C->>T: 发送信号唤醒\n    T->>T: 执行到埋点检查状态\n    T->>T: 进入终止逻辑\n```\n\n#### 32.2 Kill无效的两类情况\n\n| 情况 | 原因 | 示例 |\n|------|------|------|\n| 未执行到检查点 | 线程在等待进入InnoDB | innodb_thread_concurrency满了 |\n| 终止逻辑耗时长 | 需要做大量回滚 | 大事务回滚、DDL回滚 |\n\n#### 32.3 Killed状态的含义\n\n```sql\nSHOW PROCESSLIST;\n-- Command=Killed 表示：\n-- 1. 线程状态已设为KILL_CONNECTION\n-- 2. 但终止逻辑尚未完成\n```\n\n> [!WARNING]\n> Ctrl+C只是客户端操作，会自动发送kill query命令，但不能强制停止服务端线程。\n\n#### 32.4 客户端连接慢的原因\n\n```bash\n# 加-A跳过自动补全，加速连接\nmysql -h host -u user -p -A\n\n# -quick参数的作用\n# 1. 跳过自动补全\n# 2. 使用mysql_use_result（可能导致服务端阻塞）\n```\n\n---", "subs": ["32.1 Kill命令的工作原理", "32.2 Kill无效的两类情况", "32.3 Killed状态的含义", "32.4 客户端连接慢的原因"]}, {"title": "第33章 大查询内存管理与安全机制", "content": "> **核心要点**：本章解释为什么大查询不会打爆数据库内存。\n\n#### 33.1 Server层：边读边发\n\n```mermaid\ngraph LR\n    A[读取一行] --> B[写入net_buffer]\n    B -->|buffer满| C[发送到网络]\n    C -->|发送成功| D[清空buffer继续读]\n    C -->|网络栈满| E[等待网络可写]\n```\n\n**关键参数**：\n\n- `net_buffer_length`：默认16KB\n- 结果集不会全部缓存，边读边发\n\n#### 33.2 状态区分\n\n| 状态 | 含义 |\n|------|------|\n| Sending to client | 等待客户端接收结果 |\n| Sending data | 正在执行（不一定在发数据） |\n\n#### 33.3 InnoDB层：改进的LRU算法\n\n```mermaid\ngraph LR\n    subgraph Buffer Pool\n    Y[Young区域 5/8] --> O[Old区域 3/8]\n    end\n    N[新数据页] -->|首次访问| O\n    O -->|1秒后再访问| Y\n```\n\n**策略**：\n\n- 新数据页先放入Old区域\n- 1秒内再次访问不移动到Young区域\n- 防止全表扫描污染Buffer Pool\n\n#### 33.4 最佳实践\n\n```sql\n-- 查看Buffer Pool命中率\nSHOW ENGINE INNODB STATUS;\n-- 关注 Buffer pool hit rate，应保持>99%\n\n-- 建议配置\ninnodb_buffer_pool_size = 物理内存的60%~80%\ninnodb_old_blocks_time = 1000  -- 默认1秒\n```\n\n---", "subs": ["33.1 Server层：边读边发", "33.2 状态区分", "33.3 InnoDB层：改进的LRU算法", "33.4 最佳实践"]}, {"title": "第34章 JOIN查询的使用原则与性能考量", "content": "> **核心要点**：本章介绍JOIN的执行算法及使用建议。\n\n#### 34.1 JOIN算法对比\n\n| 算法 | 全称 | 条件 | 特点 |\n|------|------|------|------|\n| NLJ | Index Nested-Loop Join | 被驱动表有索引 | 性能好 |\n| Simple NLJ | Simple Nested-Loop Join | 无索引 | MySQL不使用 |\n| BNL | Block Nested-Loop Join | 无索引 | 使用join_buffer |\n\n#### 34.2 NLJ算法流程\n\n```mermaid\ngraph TD\n    A[从驱动表t1读一行R] --> B[取R.a到t2索引查找]\n    B --> C[组合结果返回]\n    C --> D{t1还有数据?}\n    D -->|是| A\n    D -->|否| E[结束]\n```\n\n**复杂度**：`N + N*2*log₂M`（N为驱动表行数，M为被驱动表行数）\n\n#### 34.3 BNL算法流程\n\n```mermaid\ngraph TD\n    A[读取t1数据到join_buffer] --> B[扫描t2每一行]\n    B --> C[与join_buffer对比]\n    C --> D{join_buffer满?}\n    D -->|是| E[清空join_buffer继续]\n    D -->|否| F[继续扫描t2]\n```\n\n#### 34.4 使用建议\n\n| 场景 | 建议 |\n|------|------|\n| 被驱动表有索引 | 可以使用JOIN |\n| 无索引（BNL） | 尽量避免使用 |\n| 驱动表选择 | 始终用小表做驱动表 |\n\n**判断方法**：\n\n```sql\nEXPLAIN SELECT * FROM t1 JOIN t2 ON t1.a=t2.b;\n-- Extra有\"Block Nested Loop\"说明用了BNL，需要优化\n```\n\n> [!TIP]\n> \"小表\"定义：按条件过滤后，参与JOIN的字段总数据量小的表。\n\n#### 34.5 join_buffer_size配置建议\n\n| 场景 | 建议值 | 说明 |\n|------|--------|------|\n| OLTP在线业务 | 256KB | 默认值，避免过大占用内存 |\n| 复杂报表查询 | 4-8MB | 会话级别临时调大 |\n| 大表BNL JOIN | 16-64MB | 必须在会话级别设置 |\n\n```sql\n-- 查看当前配置\nSHOW VARIABLES LIKE 'join_buffer_size';\n\n-- 会话级别调大（大报表查询前）\nSET SESSION join_buffer_size = 8*1024*1024;  -- 8MB\n\n-- 全局配置（my.cnf）\n[mysqld]\njoin_buffer_size = 256K\n```\n\n#### 34.6 驱动表选择的量化分析\n\n**成本计算公式**：\n\n| 算法 | 扫描行数 | 内存使用 |\n|------|----------|----------|\n| NLJ | N + N×logM | 无join_buffer |\n| BNL | N + N×M×D | join_buffer×D |\n\n其中：N=驱动表行数，M=被驱动表行数，D=join_buffer分批次数\n\n**选择驱动表原则**：\n\n```text\n驱动表大小 = 过滤后行数 × 参与JOIN的字段大小\n\n选择原则：总是选\"小表\"做驱动表\n```\n\n#### 34.7 被驱动表扫描次数计算\n\n```text\n扫描次数 = CEIL(驱动表数据量 / join_buffer_size)\n\n示例：\n- 驱动表数据量 = 10000行 × 100字节 = 1MB\n- join_buffer_size = 256KB\n- 扫描次数 = CEIL(1MB / 256KB) = 4次\n```\n\n---", "subs": ["34.1 JOIN算法对比", "34.2 NLJ算法流程", "34.3 BNL算法流程", "34.4 使用建议", "34.5 join_buffer_size配置建议", "34.6 驱动表选择的量化分析", "34.7 被驱动表扫描次数计算"]}, {"title": "第35章 JOIN查询的优化技巧", "content": "> **核心要点**：本章介绍MRR、BKA优化及BNL转BKA的方法。\n\n#### 35.1 MRR优化（Multi-Range Read）\n\n**原理**：将随机读改为顺序读\n\n```mermaid\ngraph LR\n    A[索引查找得到id] --> B[放入read_rnd_buffer]\n    B --> C[按id排序]\n    C --> D[顺序回表查询]\n```\n\n```sql\n-- 启用MRR\nSET optimizer_switch='mrr=on,mrr_cost_based=off';\n```\n\n#### 35.2 BKA优化（Batched Key Access）\n\nNLJ算法的优化版，复用join_buffer：\n\n```mermaid\ngraph LR\n    A[批量取驱动表数据] --> B[放入join_buffer]\n    B --> C[批量到被驱动表查询]\n    C --> D[利用MRR优化]\n```\n\n```sql\n-- 启用BKA\nSET optimizer_switch='mrr=on,mrr_cost_based=off,batched_key_access=on';\n```\n\n#### 35.3 BNL的问题\n\n1. 多次扫描被驱动表，IO压力大\n2. M*N次判断，CPU消耗高\n3. 污染Buffer Pool，影响命中率\n\n#### 35.4 BNL转BKA优化\n\n**方法1：直接加索引**\n\n```sql\n-- 在被驱动表join字段加索引\nALTER TABLE t2 ADD INDEX idx_b(b);\n```\n\n**方法2：使用临时表**\n\n```sql\n-- 适用于低频SQL，不想建永久索引的情况\nCREATE TEMPORARY TABLE temp_t(id INT PRIMARY KEY, b INT, INDEX(b));\nINSERT INTO temp_t SELECT id, b FROM t2 WHERE b>=1 AND b<=2000;\nSELECT * FROM t1 JOIN temp_t ON t1.b=temp_t.b;\n```\n\n#### 35.5 Hash Join（业务端实现）\n\nMySQL目前不支持Hash Join，可在业务端模拟：\n\n```python\n# 伪代码\nt1_data = query(\"SELECT * FROM t1\")\nhash_map = {row.b: row for row in t1_data}\n\nt2_data = query(\"SELECT * FROM t2 WHERE b>=1 AND b<=2000\")\nfor row in t2_data:\n    if row.b in hash_map:\n        result.append(merge(hash_map[row.b], row))\n```\n\n---", "subs": ["35.1 MRR优化（Multi-Range Read）", "35.2 BKA优化（Batched Key Access）", "35.3 BNL的问题", "35.4 BNL转BKA优化", "35.5 Hash Join（业务端实现）"]}, {"title": "第36章 临时表的特性与使用场景", "content": "> **核心要点**：本章介绍用户临时表的特性及其在分库分表场景中的应用。\n\n#### 36.1 临时表 vs 内存表\n\n| 类型 | 创建语法 | 存储位置 | 重启后 |\n|------|----------|----------|--------|\n| 临时表 | CREATE TEMPORARY TABLE | 可用任何引擎 | 自动删除 |\n| 内存表 | ENGINE=Memory | 内存 | 数据丢失但表结构保留 |\n\n#### 36.2 临时表的特性\n\n1. 只对创建它的Session可见\n2. 可与普通表同名（优先访问临时表）\n3. Session结束时自动删除\n4. `SHOW TABLES`不显示临时表\n\n#### 36.3 临时表的命名机制\n\n```mermaid\ngraph LR\n    A[创建临时表temp_t] --> B[frm文件]\n    B --> C[\"#sql{进程id}_{线程id}_序列号.frm\"]\n    A --> D[table_def_key]\n    D --> E[\"库名+表名+server_id+thread_id\"]\n```\n\n#### 36.4 分库分表查询场景\n\n```mermaid\ngraph TD\n    A[Proxy接收查询] --> B[分发到各分库]\n    B --> C1[分库1: limit 100]\n    B --> C2[分库2: limit 100]\n    B --> C3[分库N: limit 100]\n    C1 --> D[汇总到临时表]\n    C2 --> D\n    C3 --> D\n    D --> E[排序输出最终结果]\n```\n\n#### 36.5 临时表与主备复制\n\n- `binlog_format=row`时，临时表操作不记录binlog\n- `binlog_format=statement`时，需要记录CREATE/DROP TEMPORARY TABLE\n- binlog中记录主库线程id，用于备库区分不同临时表\n\n#### 36.6 临时表文件位置和命名规则\n\n```sql\n-- 查看临时表存放目录\nSHOW VARIABLES LIKE 'tmpdir';\n-- 结果通常为 /tmp 或 /var/tmp/mysql\n\n-- 临时表文件命名格式\n-- InnoDB临时表：ibtmp1（共享临时表空间）\n-- MySQL 8.0+：#innodb_temp/temp_*.ibt（会话临时表空间）\n```\n\n**文件命名规则**：\n\n| 组件 | 格式 | 示例 |\n|------|------|------|\n| frm文件 | `#sql{进程id}_{线程id}_序列号.frm` | `#sql4d2_3_0.frm` |\n| ibd文件 | `#sql{进程id}_{线程id}_序列号.ibd` | `#sql4d2_3_0.ibd` |\n| table_def_key | `库名+表名+server_id+thread_id` | 内存中唯一标识 |\n\n#### 36.7 binlog_format对临时表的影响\n\n| binlog_format | CREATE TEMP TABLE | DML操作 | DROP TEMP TABLE |\n|---------------|-------------------|---------|-----------------|\n| ROW | 不记录 | 不记录 | 不记录 |\n| STATEMENT | 记录 | 记录 | 记录 |\n| MIXED | 视情况 | 视情况 | 视情况 |\n\n> [!WARNING]\n> 使用statement格式时，从库崩溃后临时表可能丢失，导致后续binlog执行报错。推荐使用ROW格式。\n\n#### 36.8 分库分表查询完整示例\n\n```sql\n-- Proxy层汇总各分库数据\n-- 步骤1：创建临时表\nCREATE TEMPORARY TABLE temp_result (\n    id INT PRIMARY KEY,\n    name VARCHAR(100),\n    amount DECIMAL(10,2)\n) ENGINE=InnoDB;\n\n-- 步骤2：从各分库获取数据（Proxy依次执行）\n-- 分库1\nINSERT INTO temp_result \nSELECT id, name, amount FROM db1.orders WHERE date='2024-01-01' ORDER BY amount DESC LIMIT 100;\n\n-- 分库2\nINSERT INTO temp_result \nSELECT id, name, amount FROM db2.orders WHERE date='2024-01-01' ORDER BY amount DESC LIMIT 100;\n\n-- 步骤3：合并排序输出\nSELECT * FROM temp_result ORDER BY amount DESC LIMIT 100;\n\n-- 步骤4：清理（Session结束后自动清理）\nDROP TEMPORARY TABLE IF EXISTS temp_result;\n```\n\n---", "subs": ["36.1 临时表 vs 内存表", "36.2 临时表的特性", "36.3 临时表的命名机制", "36.4 分库分表查询场景", "36.5 临时表与主备复制", "36.6 临时表文件位置和命名规则", "36.7 binlog_format对临时表的影响", "36.8 分库分表查询完整示例"]}, {"title": "第37章 内部临时表的触发条件与优化", "content": "> **核心要点**：本章分析union和group by语句使用内部临时表的场景。\n\n#### 37.1 Union执行流程\n\n```mermaid\ngraph TD\n    A[创建内存临时表] --> B[执行第一个子查询]\n    B --> C[结果存入临时表]\n    C --> D[执行第二个子查询]\n    D --> E{结果已存在?}\n    E -->|是| F[跳过-去重]\n    E -->|否| G[插入临时表]\n    G --> H[返回结果]\n    F --> H\n```\n\n> [!TIP]\n> `UNION ALL`不需要去重，因此不使用临时表。\n\n#### 37.2 Group By执行流程\n\n```sql\nSELECT id%10 AS m, COUNT(*) AS c FROM t1 GROUP BY m;\n```\n\n使用临时表的原因：\n\n1. 需要保存中间状态（分组计数）\n2. 需要唯一键约束确保分组唯一\n\n#### 37.3 Group By优化方法\n\n| 方法 | 原理 | 适用场景 |\n|------|------|----------|\n| 加索引 | 输入有序则无需临时表 | 可加索引的列 |\n| order by null | 跳过排序阶段 | 不需要排序的场景 |\n| SQL_BIG_RESULT | 直接用sort_buffer | 数据量大 |\n\n**索引优化示例**：\n\n```sql\n-- 添加生成列并创建索引\nALTER TABLE t1 ADD COLUMN z INT GENERATED ALWAYS AS(id % 100), ADD INDEX(z);\n-- 使用索引的group by\nSELECT z, COUNT(*) AS c FROM t1 GROUP BY z;\n```\n\n#### 37.4 何时使用内部临时表\n\n1. 需要二维表特性（唯一键约束、多字段）\n2. 执行过程无法边读边输出结果\n3. join_buffer和sort_buffer无法满足需求\n\n---", "subs": ["37.1 Union执行流程", "37.2 Group By执行流程", "37.3 Group By优化方法", "37.4 何时使用内部临时表"]}, {"title": "第38章 InnoDB与Memory引擎对比分析", "content": "> **核心要点**：本章对比两种引擎的数据组织方式和适用场景。\n\n#### 38.1 数据组织方式对比\n\n| 特性 | InnoDB | Memory |\n|------|--------|--------|\n| 数据组织 | 索引组织表（B+树） | 堆组织表（数组） |\n| 主键存储 | 数据在主键索引上 | 数据单独存放 |\n| 范围查询 | 支持 | 需B-Tree索引 |\n| 默认索引 | B+树 | Hash |\n\n```mermaid\ngraph LR\n    subgraph InnoDB\n    A[主键索引B+树] --> B[数据按主键有序]\n    end\n    subgraph Memory\n    C[数据数组] --> D[Hash索引指向位置]\n    end\n```\n\n#### 38.2 Memory引擎的问题\n\n| 问题 | 说明 |\n|------|------|\n| 锁粒度 | 只支持表锁，不支持行锁 |\n| 数据持久性 | 重启后数据丢失 |\n| 主备同步 | 备库重启导致同步停止 |\n\n#### 38.3 Memory引擎的适用场景\n\n内存临时表是唯一推荐使用Memory引擎的场景：\n\n```sql\n-- Join优化使用内存临时表\nCREATE TEMPORARY TABLE temp_t(id INT PRIMARY KEY, b INT, INDEX(b)) ENGINE=Memory;\nINSERT INTO temp_t SELECT id, b FROM t2 WHERE b>=1 AND b<=2000;\nSELECT * FROM t1 JOIN temp_t ON t1.b=temp_t.b;\n```\n\n> [!IMPORTANT]\n> 生产环境不建议使用Memory引擎的普通表，建议全部改用InnoDB。\n\n---", "subs": ["38.1 数据组织方式对比", "38.2 Memory引擎的问题", "38.3 Memory引擎的适用场景"]}, {"title": "第39章 自增主键不连续的原因与影响", "content": "> **核心要点**：本章分析自增主键出现\"空洞\"的三种原因。\n\n#### 39.1 自增值存储位置\n\n| MySQL版本 | 存储位置 | 重启后行为 |\n|-----------|----------|------------|\n| 5.7及之前 | 内存 | 重新计算max(id)+1 |\n| 8.0 | redo log | 恢复为重启前的值 |\n\n#### 39.2 自增不连续的三种原因\n\n```mermaid\ngraph TD\n    A[自增不连续原因] --> B[唯一键冲突]\n    A --> C[事务回滚]\n    A --> D[批量插入预分配]\n    B --> E[\"申请id后插入失败<br>自增值不回退\"]\n    C --> E\n    D --> F[\"按1,2,4,8...预分配<br>用不完的id被浪费\"]\n```\n\n#### 39.3 为什么自增值不能回退\n\n```mermaid\nsequenceDiagram\n    participant A as 事务A\n    participant B as 事务B\n    \n    A->>A: 申请id=2\n    B->>B: 申请id=3\n    B->>B: 提交成功\n    A->>A: 唯一键冲突失败\n    Note over A: 如果回退id=2<br>下次申请会得到id=2<br>与已存在的id=3冲突\n```\n\n#### 39.4 自增锁优化参数\n\n```sql\n-- innodb_autoinc_lock_mode参数值\n-- 0: 语句级锁（5.0行为）\n-- 1: 默认值，普通insert立即释放，批量insert语句级\n-- 2: 所有insert都立即释放\n\n-- 推荐配置\nSET innodb_autoinc_lock_mode=2;\nSET binlog_format=row;\n```\n\n#### 39.5 双M架构自增ID配置示例\n\n```sql\n-- 避免双主自增冲突的配置\n\n-- 主库A（my.cnf）\n[mysqld]\nserver-id = 1\nauto_increment_increment = 2  -- 步长\nauto_increment_offset = 1      -- 起始值\n\n-- 主库B（my.cnf）\n[mysqld]\nserver-id = 2\nauto_increment_increment = 2\nauto_increment_offset = 2\n\n-- 结果：\n-- 主库A生成的ID: 1, 3, 5, 7, 9...\n-- 主库B生成的ID: 2, 4, 6, 8, 10...\n```\n\n#### 39.6 批量插入ID申请策略详解\n\n| 操作类型 | ID申请策略 |\n|----------|-----------|\n| 单行INSERT | 申请1个ID |\n| INSERT...SELECT | 按1,2,4,8...指数增长预申请 |\n| REPLACE/LOAD DATA | 同上，可能浪费大量ID |\n\n```sql\n-- 示例：INSERT...SELECT分配策略\n-- 第1次：申请1个ID\n-- 第2次：申请2个ID（用不完的废弃）\n-- 第3次：申请4个ID\n-- 第4次：申请8个ID...\n```\n\n#### 39.7 MySQL 8.0自增值持久化原理\n\n```sql\n-- MySQL 8.0将自增值写入redo log\n-- 重启后能恢复到正确值\n\n-- 5.7及之前版本问题演示：\n-- 1. 表当前自增值=10\n-- 2. 插入一行后删除（自增值变为11）\n-- 3. 重启MySQL\n-- 4. 自增值变回max(id)+1（可能是10）\n\n-- 8.0解决方案：\n-- 自增值变更记入redo log\n-- 重启后恢复为11\n```\n\n| 版本 | 自增值存储 | 重启后行为 |\n|------|-----------|-----------|\n| 5.7及之前 | 内存 | max(id)+1 |\n| 8.0+ | redo log | 保持原值 |\n\n---", "subs": ["39.1 自增值存储位置", "39.2 自增不连续的三种原因", "39.3 为什么自增值不能回退", "39.4 自增锁优化参数", "39.5 双M架构自增ID配置示例", "39.6 批量插入ID申请策略详解", "39.7 MySQL 8.0自增值持久化原理"]}, {"title": "第40章 INSERT语句的加锁机制详解", "content": "> **核心要点**：本章分析insert语句的几种特殊加锁场景。\n\n#### 40.1 INSERT...SELECT的加锁\n\n```sql\n-- 可重复读隔离级别下，此语句会锁住源表t\nINSERT INTO t2(c,d) SELECT c,d FROM t;\n```\n\n锁源表的原因：防止binlog回放时数据不一致\n\n#### 40.2 循环写入问题\n\n```sql\n-- 同表INSERT...SELECT会导致全表扫描\nINSERT INTO t(c,d) (SELECT c+1, d FROM t ORDER BY c DESC LIMIT 1);\n-- 优化方案：使用临时表\nCREATE TEMPORARY TABLE temp_t ENGINE=Memory;\nINSERT INTO temp_t SELECT c+1, d FROM t ORDER BY c DESC LIMIT 1;\nINSERT INTO t SELECT * FROM temp_t;\n```\n\n#### 40.3 唯一键冲突加锁\n\n```sql\n-- 唯一键冲突时会加next-key lock (S锁)\nINSERT INTO t VALUES(11, 10, 10);  -- c=10已存在\n-- 持有索引c上的(5,10]共享锁\n```\n\n#### 40.4 唯一键冲突导致的死锁\n\n```mermaid\nsequenceDiagram\n    participant A as Session A\n    participant B as Session B\n    participant C as Session C\n    \n    A->>A: INSERT c=5 (加记录锁)\n    B->>A: INSERT c=5 (等待，加读锁)\n    C->>A: INSERT c=5 (等待，加读锁)\n    A->>A: ROLLBACK\n    B->>C: 两个session都要加写锁\n    Note over B,C: 互相等待对方的读锁释放<br>产生死锁\n```\n\n> [!WARNING]\n> 唯一键冲突后应尽快提交或回滚事务，避免长时间持有锁。\n\n---", "subs": ["40.1 INSERT...SELECT的加锁", "40.2 循环写入问题", "40.3 唯一键冲突加锁", "40.4 唯一键冲突导致的死锁"]}, {"title": "第41章 数据表快速复制方案对比", "content": "> **核心要点**：本章对比三种表数据复制方法的优缺点。\n\n#### 41.1 三种复制方法对比\n\n| 方法 | 速度 | 灵活性 | 适用场景 |\n|------|--------|--------|----------|\n| mysqldump | 中 | 高（支持where） | 跨库、部分数据 |\n| SELECT INTO OUTFILE | 中 | 最高（支持复杂SQL） | 导出CSV文件 |\n| 物理拷贝 | 最快 | 低（全表） | 大表快速复制 |\n\n#### 41.2 mysqldump方法\n\n```bash\n# 导出数据\nmysqldump -h$host -P$port -u$user \\\n  --single-transaction --set-gtid-purged=OFF \\\n  db1 t --where=\"a>900\" > t.sql\n\n# 导入数据\nmysql -h$host -P$port -u$user db2 -e \"source t.sql\"\n```\n\n#### 41.3 CSV文件方法\n\n```sql\n-- 导出CSV\nSELECT * FROM db1.t WHERE a>900 INTO OUTFILE '/tmp/t.csv';\n\n-- 导入CSV\nLOAD DATA INFILE '/tmp/t.csv' INTO TABLE db2.t;\n```\n\n#### 41.4 物理拷贝方法（可传输表空间）\n\n```mermaid\ngraph TD\n    A[\"CREATE TABLE r LIKE t\"] --> B[\"ALTER TABLE r DISCARD TABLESPACE\"]\n    B --> C[\"FLUSH TABLE t FOR EXPORT\"]\n    C --> D[\"cp t.cfg r.cfg; cp t.ibd r.ibd\"]\n    D --> E[\"UNLOCK TABLES\"]\n    E --> F[\"ALTER TABLE r IMPORT TABLESPACE\"]\n```\n\n> [!TIP]\n> 物理拷贝仅适用于InnoDB引擎，且只能全表复制。\n\n---", "subs": ["41.1 三种复制方法对比", "41.2 mysqldump方法", "41.3 CSV文件方法", "41.4 物理拷贝方法（可传输表空间）"]}, {"title": "第42章 权限管理命令的正确使用", "content": "> **核心要点**：本章解释grant/revoke的生效机制及flush privileges的正确用法。\n\n#### 42.1 权限层级\n\n```mermaid\ngraph TD\n    A[MySQL权限层级] --> B[全局权限 mysql.user]\n    A --> C[库权限 mysql.db]\n    A --> D[表权限 mysql.tables_priv]\n    A --> E[列权限 mysql.columns_priv]\n```\n\n#### 42.2 GRANT命令的行为\n\n| 权限类型 | 磁盘操作 | 内存操作 | 对现有连接影响 |\n|----------|----------|----------|----------------|\n| 全局权限 | 更新mysql.user | 更新acl_users | 新连接生效 |\n| 库权限 | 更新mysql.db | 更新acl_dbs | 立即生效 |\n| 表/列权限 | 更新tables_priv | 更新hash结构 | 立即生效 |\n\n#### 42.3 flush privileges的正确用法\n\n```sql\n-- 正常情况: grant命令已同时更新磁盘和内存\nGRANT SELECT ON db1.* TO 'ua'@'%';\n-- 不需要执行 FLUSH PRIVILEGES\n\n-- 异常情况: 直接DML操作系统表\nDELETE FROM mysql.user WHERE user='ua';\n-- 此时内存和磁盘不一致，需要刷新\nFLUSH PRIVILEGES;\n```\n\n> [!IMPORTANT]\n> 只有直接DML修改权限表时才需要flush privileges，正常使用grant/revoke无需执行。\n\n#### 42.4 最佳实践\n\n| 做法 | 推荐度 | 原因 |\n|------|--------|------|\n| 使用grant/revoke | ✅ 推荐 | 自动同步内存和磁盘 |\n| grant后加flush | ❌ 多余 | grant已经同步更新 |\n| 直接DML权限表 | ❌ 避免 | 导致内存不一致 |\n| grant带identified by | ❌ 避免 | 可能意外修改密码 |\n\n---", "subs": ["42.1 权限层级", "42.2 GRANT命令的行为", "42.3 flush privileges的正确用法", "42.4 最佳实践"]}, {"title": "第43章 分区表的适用场景与注意事项", "content": "> **核心要点**：本章分析分区表的工作原理及其优缺点。\n\n#### 43.1 分区表的本质\n\n| 层面 | 视角 |\n|------|------|\n| Server层 | 1个表（共用MDL锁） |\n| 引擎层 | N个表（每个分区一个.ibd文件） |\n\n#### 43.2 分区策略对比\n\n| 策略 | 引擎 | 描述 | 版本 |\n|------|------|------|------|\n| 通用分区策略 | MyISAM | Server层控制，性能差 | 已弃用 |\n| 本地分区策略 | InnoDB/NDB | 引擎内部管理 | 5.7.9+ |\n\n> [!WARNING]\n> MySQL 8.0开始只允许使用本地分区策略的引擎创建分区表。\n\n#### 43.3 分区表的行为特点\n\n```mermaid\ngraph TD\n    A[访问分区表] --> B[打开所有分区文件]\n    B --> C[获取表级MDL锁]\n    C --> D{分析WHERE条件}\n    D -->|包含分区键| E[只访问相关分区]\n    D -->|不含分区键| F[访问所有分区]\n```\n\n#### 43.4 分区表的优缺点\n\n| 优点 | 缺点 |\n|------|------|\n| 对业务透明 | 首次访问需打开所有分区 |\n| 方便清理历史数据 | 共用MDL锁影响DDL |\n| DROP PARTITION比DELETE快 | 分区过多影响性能 |\n\n#### 43.5 使用建议\n\n1. 不要创建太多分区（避免超过1000个）\n2. 单表/单分区千万行是可接受的\n3. 按需创建分区，及时清理历史分区\n4. 优先使用InnoDB引擎\n\n---", "subs": ["43.1 分区表的本质", "43.2 分区策略对比", "43.3 分区表的行为特点", "43.4 分区表的优缺点", "43.5 使用建议"]}, {"title": "第44章 技术答疑：实践中的常见疑难问题", "content": "> **核心要点**：本章解答JOIN写法、性能对比、自增主键等常见问题。\n\n#### 44.1 LEFT JOIN的驱动表选择\n\n```sql\n-- Q1: 条件在ON中，保持LEFT JOIN语义\nSELECT * FROM a LEFT JOIN b ON(a.f1=b.f1) AND (a.f2=b.f2);\n\n-- Q2: 条件在WHERE中，可能被优化为INNER JOIN\nSELECT * FROM a LEFT JOIN b ON(a.f1=b.f1) WHERE (a.f2=b.f2);\n```\n\n> [!IMPORTANT]\n> 使用LEFT JOIN时，被驱动表的条件必须写在ON里，否则可能被优化器改写为INNER JOIN。\n\n#### 44.2 BNL vs Simple Nested Loop Join\n\n| 算法 | 数据存储 | 访问方式 | 性能 |\n|------|----------|----------|------|\n| BNL | join_buffer数组 | 内存遍历 | 快 |\n| Simple NLJ | 磁盘/Buffer Pool | 指针操作 | 慢 |\n\nBNL更快的原因：\n\n1. 避免磁盘IO等待\n2. 数组遍历比指针操作成本低\n3. 不影响Buffer Pool命中率\n\n#### 44.3 DISTINCT vs GROUP BY\n\n```sql\n-- 当不需要聚合函数时，两者等价\nSELECT a FROM t GROUP BY a ORDER BY NULL;\nSELECT DISTINCT a FROM t;\n```\n\n执行流程相同：创建临时表 → 唯一索引去重 → 返回结果\n\n#### 44.4 备库自增主键一致性\n\nbinlog中会记录`SET INSERT_ID`语句，确保备库使用相同的自增值：\n\n```sql\nSET INSERT_ID=2;\nINSERT INTO t VALUES(null, ...);  -- 使用id=2\n```\n\n---", "subs": ["44.1 LEFT JOIN的驱动表选择", "44.2 BNL vs Simple Nested Loop Join", "44.3 DISTINCT vs GROUP BY", "44.4 备库自增主键一致性"]}, {"title": "第45章 自增ID耗尽的应对策略", "content": "> **核心要点**：本章分析各种自增ID达到上限后的行为及应对方案。\n\n#### 45.1 各类自增ID上限\n\n| ID类型 | 字节数 | 上限值 | 达到上限后的行为 |\n|--------|--------|--------|------------------|\n| 表自增主键(int) | 4 | 2³²-1 | 报主键冲突 |\n| 表自增主键(bigint) | 8 | 2⁶⁴-1 | 报主键冲突 |\n| InnoDB row_id | 6 | 2⁴⁸-1 | 归0覆盖数据 |\n| Xid | 8 | 2⁶⁴-1 | 理论可重复 |\n| trx_id | 8 | 2⁴⁸-1 | 可能脏读 |\n| thread_id | 4 | 2³²-1 | 唯一数组保证不重复 |\n\n#### 45.2 表自增主键耗尽\n\n```sql\n-- 验证自增主键耗尽\nCREATE TABLE t(id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY) AUTO_INCREMENT=4294967295;\nINSERT INTO t VALUES(null);  -- 成功\nINSERT INTO t VALUES(null);  -- 报主键冲突\n```\n\n**解决方案**：使用BIGINT UNSIGNED\n\n#### 45.3 row_id的风险\n\n```mermaid\ngraph TD\n    A[无主键表] --> B[使用6字节row_id]\n    B --> C{达到2^48-1}\n    C -->|是| D[归0重新计数]\n    D --> E[覆盖旧数据]\n```\n\n> [!CAUTION]\n> 无主键表的row_id达到上限会覆盖数据，应始终创建主键。\n\n#### 45.4 trx_id脏读Bug\n\n理论上存在但实际极难触发：\n\n```\nTPS=50万/秒 × 17.8年 ≈ 2^48次事务\n```\n\n#### 45.5 最佳实践\n\n| 场景 | 建议 |\n|------|------|\n| 高频插入表 | 使用BIGINT自增主键 |\n| 任何InnoDB表 | 始终显式创建主键 |\n| 长期运行实例 | 监控自增值使用情况 |\n\n#### 45.6 各类ID的监控方法\n\n```sql\n-- 1. 表自增主键监控\nSELECT \n    table_schema,\n    table_name,\n    auto_increment,\n    CASE \n        WHEN data_type = 'int' THEN 4294967295\n        WHEN data_type = 'bigint' THEN 18446744073709551615\n    END AS max_value,\n    ROUND(auto_increment / \n        CASE \n            WHEN data_type = 'int' THEN 4294967295\n            WHEN data_type = 'bigint' THEN 18446744073709551615\n        END * 100, 2) AS usage_percent\nFROM information_schema.tables t\nJOIN information_schema.columns c \n  ON t.table_schema = c.table_schema \n AND t.table_name = c.table_name\nWHERE c.extra = 'auto_increment'\n  AND t.auto_increment IS NOT NULL\nORDER BY usage_percent DESC;\n\n-- 2. trx_id监控（通过information_schema）\nSELECT trx_id FROM information_schema.innodb_trx ORDER BY trx_id DESC LIMIT 1;\n\n-- 3. thread_id使用情况\nSHOW STATUS LIKE 'threads_created';\n```\n\n> [!TIP]\n> 建议设置监控告警，当自增ID使用率超过80%时及时扩容或迁移。\n\n---\n\n```", "subs": ["45.1 各类自增ID上限", "45.2 表自增主键耗尽", "45.3 row_id的风险", "45.4 trx_id脏读Bug", "45.5 最佳实践", "45.6 各类ID的监控方法"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
