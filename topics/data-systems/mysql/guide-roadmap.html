<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({startOnLoad:false, theme:'base', themeVariables:{
    background:'#fffdf5', primaryColor:'#fff9d6', primaryBorderColor:'#1f2933',

  window.__mermaid = mermaid;

<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

  <div class="meta">
    <a class="back" href="../../../index.html">← 返回总览</a>
    <div class="legend">
      <span><span class="dot todo"></span>待学</span>
      <span><span class="dot doing"></span>在学</span>
      <span><span class="dot done"></span>已学</span>

    <span class="search"><input id="search" type="search" placeholder="搜索小节…"></span>
    <button class="reset" id="reset">重置进度</button>
  </div>
</header>
<main id="roadmap"></main>

<div class="backdrop" id="backdrop"></div>

  <div class="drawer-resizer" id="drawer-resizer" role="separator" aria-orientation="vertical"
    aria-label="调整笔记面板宽度" aria-valuemin="360" tabindex="0"></div>
  <header>
    <h2 id="d-title"></h2>
    <div class="toggle-group" data-role="status">
      <button data-status="todo">待学</button>
      <button data-status="doing">在学</button>
      <button data-status="done">已学</button>
    </div>
    <button class="edit-btn edit-only" id="edit-section">编辑</button>
    <button class="close" id="d-close">×</button>

  <div class="edit-actions edit-only" id="edit-actions">
    <input class="edit-title" id="edit-title" type="text" aria-label="小节标题">
    <button class="save" id="save-section">保存</button>
    <button class="cancel" id="cancel-edit">取消</button>
    <span class="save-state" id="save-state"></span>

</aside>
<div class="diagram-backdrop" id="diagram-backdrop"></div>
<section class="diagram-modal" id="diagram-modal" role="dialog" aria-modal="true" aria-label="放大图表">
  <header>
    <strong>Mermaid 图表</strong>
    <div class="diagram-controls" aria-label="图表缩放">
      <button id="diagram-zoom-out" title="缩小">-</button>
      <span class="diagram-zoom" id="diagram-zoom">100%</span>
      <button id="diagram-zoom-in" title="放大">+</button>
    </div>
    <button class="diagram-close" id="diagram-close" title="关闭">×</button>
  </header>
  <div class="diagram-body" id="diagram-body">
    <div class="diagram-canvas" id="diagram-canvas">
      <div class="diagram-inner" id="diagram-inner"></div>
    </div>
  </div>

<script id="data" type="application/json">{"title": "MySQL深度学习笔记", "intro": "> **适用读者**：运维工程师 / SRE / DBA  \n> **学习目标**：系统性掌握MySQL核心原理与实践技能  \n> **文档版本**：v1.0\n\n---", "parts": [{"title": "第一篇：MySQL核心架构与基础原理", "sections": [{"title": "第1章 MySQL体系架构与查询执行全流程解析", "content": "> **核心要点**：理解MySQL的分层架构是深入学习的基础。本章将拆解MySQL的核心组件，并通过一条查询语句的完整执行流程，帮助你建立对MySQL整体运行机制的认知。\n\n#### 1.1 MySQL整体架构概览\n\nMySQL采用经典的**分层架构**设计，从逻辑上可以划分为两个主要层次：\n\n```mermaid\ngraph TD\n    subgraph Client[\"客户端层\"]\n        A[MySQL Client]\n        B[JDBC/ODBC]\n        C[其他连接器]\n    end\n    \n    subgraph Server[\"Server层\"]\n        D[连接器<br>Connection Manager]\n        E[查询缓存<br>Query Cache]\n        F[分析器<br>Parser]\n        G[优化器<br>Optimizer]\n        H[执行器<br>Executor]\n    end\n    \n    subgraph Engine[\"存储引擎层\"]\n        I[InnoDB]\n        J[MyISAM]\n        K[Memory]\n        L[...]\n    end\n    \n    A --> D\n    B --> D\n    C --> D\n    D --> E\n    E --> F\n    F --> G\n    G --> H\n    H --> I\n    H --> J\n    H --> K\n    H --> L\n```\n\n##### 1.1.1 Server层职责\n\nServer层是MySQL的核心服务层，包含以下关键组件：\n\n| 组件 | 职责 | 说明 |\n|------|------|------|\n| **连接器** | 连接管理 | 建立连接、身份认证、权限获取 |\n| **查询缓存** | 结果缓存 | 缓存查询结果（MySQL 8.0已移除） |\n| **分析器** | SQL解析 | 词法分析、语法分析 |\n| **优化器** | 执行优化 | 索引选择、JOIN顺序决策 |\n| **执行器** | 语句执行 | 调用存储引擎接口执行操作 |\n\n此外，Server层还负责：\n\n- 所有**内置函数**的实现（日期、时间、数学、加密函数等）\n- 所有**跨存储引擎功能**的实现（存储过程、触发器、视图等）\n\n##### 1.1.2 存储引擎层职责\n\n存储引擎层负责**数据的存储和提取**，采用**插件式架构**设计：\n\n| 引擎 | 特点 | 适用场景 |\n|------|------|----------|\n| **InnoDB** | 支持事务、行锁、外键、崩溃恢复 | 默认引擎，适用于大多数OLTP场景 |\n| **MyISAM** | 不支持事务、表锁、全文索引 | 只读或读多写少的场景 |\n| **Memory** | 数据存储在内存、速度快 | 临时表、缓存表 |\n\n> [!IMPORTANT]\n> 从MySQL 5.5.5版本开始，**InnoDB**成为默认存储引擎。创建表时如果不指定引擎类型，默认使用InnoDB。\n\n```sql\n-- 显式指定存储引擎\nCREATE TABLE t_memory (id INT) ENGINE=MEMORY;\n\n-- 查看表的存储引擎\nSHOW TABLE STATUS LIKE 'table_name';\n```\n\n---\n\n#### 1.2 连接管理与权限验证\n\n##### 1.2.1 连接器的工作原理\n\n当客户端发起连接请求时，**连接器**负责完成以下工作：\n\n```mermaid\ngraph LR\n    A[客户端] -->|TCP握手| B[连接器]\n    B -->|用户名/密码| C{身份认证}\n    C -->|失败| D[Access denied]\n    C -->|成功| E[查询权限表]\n    E --> F[获取权限]\n    F --> G[连接就绪]\n```\n\n**连接命令示例**：\n\n```bash\nmysql -h 192.168.1.100 -P 3306 -u root -p\n```\n\n> [!TIP]\n> **安全建议**：不要在命令行中直接写密码（如 `-pMyPassword`），这样密码会被记录在命令历史中，存在泄露风险。\n\n##### 1.2.2 权限验证的时机\n\n权限验证发生在**连接建立时**，有一个重要特性需要注意：\n\n> [!WARNING]\n> **权限缓存特性**：用户成功建立连接后，即使管理员修改了该用户的权限，**已存在的连接不会受到影响**。新权限只对后续新建的连接生效。\n\n这意味着，如果需要权限变更立即生效，需要：\n\n1. 让用户重新连接\n2. 或者使用 `KILL` 命令断开现有连接\n\n##### 1.2.3 连接状态查看与诊断\n\n```sql\n-- 查看当前所有连接\nSHOW PROCESSLIST;\n\n-- 查看完整SQL（不截断）\nSHOW FULL PROCESSLIST;\n```\n\n**输出字段解读**：\n\n| 字段 | 说明 | 典型值 |\n|------|------|--------|\n| Id | 连接ID，可用于KILL | 12345 |\n| User | 连接用户 | root |\n| Host | 客户端地址:端口 | 192.168.1.100:54321 |\n| db | 当前数据库 | test_db |\n| Command | 当前命令状态 | Sleep/Query/Execute |\n| Time | 当前状态持续秒数 | 300 |\n| State | 线程详细状态 | Sending data |\n| Info | 正在执行的SQL | SELECT * FROM ... |\n\n**Command常见值**：\n\n| 值 | 说明 |\n|----|------|\n| Sleep | 空闲连接，等待客户端发送请求 |\n| Query | 正在执行查询 |\n| Connect | 正在建立连接 |\n| Killed | 连接被标记为终止 |\n\n**实战示例**：找出长时间运行的查询\n\n```sql\nSELECT id, user, host, db, command, time, state, \n       LEFT(info, 50) AS sql_preview\nFROM information_schema.processlist \nWHERE command != 'Sleep' \n  AND time > 30\nORDER BY time DESC;\n```\n\n##### 1.2.4 连接超时参数配置\n\n| 参数 | 说明 | 默认值 | 建议值 |\n|------|------|--------|--------|\n| `wait_timeout` | 非交互连接空闲超时（秒） | 28800 (8小时) | 600-3600 |\n| `interactive_timeout` | 交互式连接空闲超时（秒） | 28800 | 28800 |\n| `connect_timeout` | 连接建立超时（秒） | 10 | 10 |\n\n```sql\n-- 查看当前超时设置\nSHOW VARIABLES LIKE '%timeout%';\n\n-- 设置非交互连接超时为10分钟\nSET GLOBAL wait_timeout = 600;\n\n-- 会话级设置\nSET SESSION wait_timeout = 300;\n```\n\n> [!TIP]\n> `wait_timeout`过长会导致空闲连接占用资源；过短会导致连接频繁断开。建议根据应用特性设置为10-60分钟。\n\n##### 1.2.5 权限修改生效验证\n\n**验证权限缓存特性**：\n\n```sql\n-- Session A: 查看当前用户权限\nSHOW GRANTS FOR CURRENT_USER;\n\n-- 管理员Session B: 修改权限（此时Session A不受影响）\nREVOKE SELECT ON test_db.* FROM 'user1'@'%';\nFLUSH PRIVILEGES;\n\n-- Session A: 仍可执行查询（旧权限仍有效）\nSELECT * FROM test_db.some_table;  -- ✓ 成功\n\n-- 断开Session A重连后\nSELECT * FROM test_db.some_table;  -- ✗ 权限不足\n```\n\n##### 1.2.6 长连接与短连接的权衡\n\n| 连接类型 | 定义 | 优点 | 缺点 |\n|----------|------|------|------|\n| **长连接** | 连接成功后持续使用同一连接 | 减少连接开销 | 可能导致内存占用过高 |\n| **短连接** | 每次查询后断开，下次重新连接 | 资源及时释放 | 频繁连接开销大 |\n\n**建议**：尽量使用长连接，但需要注意内存管理。\n\n##### 1.2.7 长连接内存问题及解决方案\n\n**问题根源**：MySQL在执行过程中使用的临时内存是绑定在连接对象上的，只有在连接断开时才会释放。长连接累积可能导致**OOM（内存溢出）**。\n\n**解决方案**：\n\n| 方案 | 适用版本 | 说明 |\n|------|----------|------|\n| 定期断开重连 | 所有版本 | 执行大查询后主动断开连接 |\n| `mysql_reset_connection` | MySQL 5.7+ | 重置连接状态，无需重连和重新认证 |\n\n```c\n// C API调用示例\nmysql_reset_connection(mysql);\n```\n\n```sql\n-- 查看连接内存使用\nSELECT thread_id, \n       FORMAT_BYTES(CURRENT_COUNT_USED) AS memory_used\nFROM performance_schema.memory_summary_by_thread_by_event_name\nWHERE thread_id = CONNECTION_ID()\nORDER BY CURRENT_COUNT_USED DESC\nLIMIT 10;\n```\n\n---\n\n#### 1.3 查询缓存机制\n\n> [!CAUTION]\n> **MySQL 8.0已完全移除查询缓存功能**。以下内容仅适用于MySQL 8.0之前的版本。\n\n##### 1.3.1 查询缓存的工作原理\n\n```mermaid\ngraph TD\n    A[收到查询请求] --> B{是否命中缓存}\n    B -->|是| C[直接返回缓存结果]\n    B -->|否| D[执行查询]\n    D --> E[执行结果]\n    E --> F[存入缓存]\n    F --> G[返回结果]\n    C --> G\n```\n\n- 缓存以 **key-value** 形式存储\n- **key**：查询语句（完全匹配）\n- **value**：查询结果\n\n##### 1.3.2 为什么不建议使用查询缓存\n\n查询缓存的**失效机制**过于激进：\n\n> [!WARNING]\n> 只要对一个表有**任何更新操作**，该表上的**所有查询缓存都会被清空**。\n\n这导致：\n\n- 对于更新频繁的表，缓存命中率极低\n- 维护缓存的开销可能大于收益\n\n**适用场景**：仅适合**静态配置表**等极少更新的场景。\n\n##### 1.3.3 按需使用查询缓存\n\n```sql\n-- 设置默认不使用查询缓存\nSET GLOBAL query_cache_type = DEMAND;\n\n-- 对特定查询启用缓存\nSELECT SQL_CACHE * FROM config_table WHERE id = 1;\n```\n\n---\n\n#### 1.4 SQL解析与优化\n\n##### 1.4.1 分析器：词法分析与语法分析\n\n当查询未命中缓存时，进入**分析器**阶段：\n\n**词法分析**：识别SQL语句中的各个元素\n\n```\nSELECT * FROM T WHERE ID = 10\n   ↓      ↓    ↓     ↓    ↓\n 关键字  通配符 表名  列名  值\n```\n\n**语法分析**：验证SQL是否符合语法规则\n\n```sql\n-- 语法错误示例\nmysql> elect * from t where ID=1;\nERROR 1064 (42000): You have an error in your SQL syntax...\n```\n\n> [!TIP]\n> 语法错误提示中，重点关注 **\"use near\"** 后面的内容，那是第一个出错的位置。\n\n##### 1.4.2 优化器：执行计划生成\n\n分析器完成后，**优化器**决定如何执行这条SQL：\n\n**优化器的主要决策**：\n\n1. **索引选择**：当表有多个索引时，选择使用哪个\n2. **JOIN顺序**：多表关联时，决定表的连接顺序\n\n**示例**：\n\n```sql\nSELECT * FROM t1 JOIN t2 USING(ID) WHERE t1.c=10 AND t2.d=20;\n```\n\n优化器可能选择的执行路径：\n\n| 方案 | 执行顺序 |\n|------|----------|\n| 方案A | 先查t1(c=10) → 关联t2 → 过滤t2.d=20 |\n| 方案B | 先查t2(d=20) → 关联t1 → 过滤t1.c=10 |\n\n两种方案逻辑等价，但**执行效率可能差异巨大**。优化器会基于统计信息选择代价最小的方案。\n\n---\n\n#### 1.5 执行器与存储引擎交互\n\n##### 1.5.1 执行器的工作流程\n\n执行器是SQL执行的最后一站，负责：\n\n1. **权限校验**（表级权限）\n2. **调用存储引擎接口**执行操作\n\n```mermaid\ngraph TD\n    A[执行器开始] --> B{检查表权限}\n    B -->|无权限| C[返回权限错误]\n    B -->|有权限| D[打开表]\n    D --> E[调用引擎接口获取第一行]\n    E --> F{是否满足条件}\n    F -->|是| G[加入结果集]\n    F -->|否| H[跳过]\n    G --> I[获取下一行]\n    H --> I\n    I --> J{是否还有数据}\n    J -->|是| F\n    J -->|否| K[返回结果集]\n```\n\n**无索引的全表扫描执行流程**：\n\n```\n1. 调用InnoDB接口获取表的第一行\n2. 判断ID是否等于10\n   - 是：加入结果集\n   - 否：跳过\n3. 调用接口获取\"下一行\"，重复步骤2\n4. 直到遍历完所有行\n5. 返回结果集\n```\n\n**有索引的执行流程**：\n\n```\n1. 调用\"取满足条件的第一行\"接口\n2. 调用\"取满足条件的下一行\"接口\n3. 循环直到没有满足条件的行\n4. 返回结果集\n```\n\n##### 1.5.2 rows_examined指标解读\n\n在慢查询日志中，`rows_examined` 字段表示执行过程中**扫描的行数**：\n\n```sql\n-- 慢查询日志示例\n# Query_time: 0.001234  Lock_time: 0.000100 Rows_sent: 1  Rows_examined: 1000\n```\n\n> [!NOTE]\n> `rows_examined` 是执行器调用引擎获取数据行时累加的。但在某些场景下（如使用InnoDB的某些批量扫描优化），执行器调用一次可能对应引擎内部扫描多行，因此 **引擎实际扫描行数 ≥ rows_examined**。\n\n---\n\n#### 1.6 本章小结\n\n本章介绍了MySQL的逻辑架构和SQL查询的完整执行流程：\n\n```mermaid\ngraph LR\n    A[客户端] --> B[连接器]\n    B --> C[查询缓存]\n    C --> D[分析器]\n    D --> E[优化器]\n    E --> F[执行器]\n    F --> G[存储引擎]\n    G --> H[返回结果]\n```\n\n**核心知识点回顾**：\n\n| 组件 | 关键职责 | 注意事项 |\n|------|----------|----------|\n| 连接器 | 认证、权限、连接管理 | 权限在连接时确定，修改后需重连生效 |\n| 查询缓存 | 缓存查询结果 | 8.0已移除，之前版本也不建议使用 |\n| 分析器 | 词法、语法解析 | 语法错误在此阶段报出 |\n| 优化器 | 生成执行计划 | 选择索引、决定JOIN顺序 |\n| 执行器 | 调用引擎执行 | 权限校验、结果汇总 |\n\n**思考题答案**：\n> 如果执行 `SELECT * FROM T WHERE k=1`，而表T中没有字段k，会报 `Unknown column 'k' in 'where clause'` 错误。这个错误发生在**分析器**阶段——在语法分析时，分析器会验证表和列是否存在。\n\n---", "subs": ["1.1 MySQL整体架构概览", "1.2 连接管理与权限验证", "1.3 查询缓存机制", "1.4 SQL解析与优化", "1.5 执行器与存储引擎交互", "1.6 本章小结"]}, {"title": "第2章 Redo Log与Binlog：更新语句背后的日志机制", "content": "> **核心要点**：MySQL的日志系统是保证数据可靠性和可恢复性的关键。本章深入讲解redo log和binlog的设计原理、两阶段提交协议，以及如何利用这套机制实现crash-safe和数据恢复。\n\n#### 2.1 更新语句的执行流程\n\n更新语句与查询语句一样，都会经过连接器、分析器、优化器、执行器的处理流程。但更新操作还涉及两个关键的日志模块：\n\n- **redo log**（重做日志）—— InnoDB引擎层\n- **binlog**（归档日志）—— Server层\n\n**示例场景**：\n\n```sql\nCREATE TABLE T(ID int primary key, c int);\nUPDATE T SET c = c + 1 WHERE ID = 2;\n```\n\n---\n\n#### 2.2 WAL技术核心思想\n\n##### 2.2.1 先写日志再写磁盘的设计哲学\n\n**WAL**（Write-Ahead Logging，预写日志）是MySQL提升更新效率的核心技术。\n\n**类比理解**：\n\n| 角色 | 类比对象 | 说明 |\n|------|----------|------|\n| redo log | 酒店掌柜的粉板 | 快速记录，空间有限 |\n| 磁盘数据文件 | 掌柜的账本 | 正式记录，持久保存 |\n\n**核心思路**：\n\n1. 更新操作先写入redo log（粉板）并更新内存\n2. 系统空闲时再将redo log中的操作同步到磁盘（账本）\n\n这种方式避免了每次更新都要进行随机磁盘IO，大幅提升了写入性能。\n\n##### 2.2.2 性能与持久性的平衡\n\n```mermaid\ngraph LR\n    A[UPDATE请求] --> B[写入redo log]\n    B --> C[更新内存]\n    C --> D[返回成功]\n    D -.-> E[后台刷盘]\n    E --> F[数据持久化]\n```\n\n---\n\n#### 2.3 Redo Log深度解析\n\n##### 2.3.1 InnoDB的Crash-Safe能力\n\n**Crash-Safe**：数据库发生异常重启后，之前已提交的事务不会丢失。\n\n这种能力的实现依赖于redo log：\n\n- 只要更新操作被记录到redo log并持久化，即使数据还没写入磁盘，重启后也能通过redo log恢复\n\n##### 2.3.2 Redo Log的循环写机制\n\nInnoDB的redo log是**固定大小**的，采用**循环写**的方式：\n\n```mermaid\ngraph TD\n    subgraph RedoLog[\"Redo Log文件组 (示例: 4 x 1GB)\"]\n        F0[\"ib_logfile0\"]\n        F1[\"ib_logfile1\"]\n        F2[\"ib_logfile2\"]\n        F3[\"ib_logfile3\"]\n    end\n    \n    WP[\"write pos<br>(当前写入位置)\"]\n    CP[\"checkpoint<br>(当前擦除位置)\"]\n    \n    WP --> F1\n    CP --> F0\n```\n\n**关键指针**：\n\n| 指针 | 作用 | 移动方向 |\n|------|------|----------|\n| **write pos** | 当前记录写入的位置 | 循环向后移动 |\n| **checkpoint** | 当前要擦除的位置 | 循环向后移动 |\n\n**空间管理规则**：\n\n- `write pos` 到 `checkpoint` 之间的空间：可用于写入新记录\n- 当 `write pos` 追上 `checkpoint`：必须暂停写入，先将部分记录刷到磁盘，推进 `checkpoint`\n\n> [!WARNING]\n> **Redo Log写满的影响**：当redo log空间耗尽时，MySQL会停止所有更新操作，先执行刷盘，这会导致明显的性能抖动。因此，合理配置redo log大小非常重要。\n\n---\n\n#### 2.4 Binlog归档日志机制\n\n##### 2.4.1 Binlog的设计目的\n\nBinlog是MySQL Server层实现的日志，最初设计用于：\n\n- **数据归档**\n- **主从复制**\n- **数据恢复**\n\n**历史背景**：MySQL最初使用MyISAM引擎，没有crash-safe能力。InnoDB作为第三方插件引入后，为实现crash-safe，自行实现了redo log。\n\n##### 2.4.2 Redo Log与Binlog的本质区别\n\n| 对比维度 | Redo Log | Binlog |\n|----------|----------|--------|\n| **所属层次** | InnoDB引擎层 | Server层 |\n| **日志类型** | 物理日志 | 逻辑日志 |\n| **记录内容** | \"在数据页X偏移Y处做了Z修改\" | \"给ID=2的c字段加1\" |\n| **写入方式** | 循环写，空间固定 | 追加写，文件依次切换 |\n| **主要用途** | Crash恢复 | 主从复制、数据恢复 |\n\n> [!NOTE]\n> **物理日志 vs 逻辑日志**\n>\n> - 物理日志：记录数据的物理变化，恢复速度快\n> - 逻辑日志：记录SQL逻辑，可读性好，可用于异构系统同步\n\n---\n\n#### 2.5 两阶段提交协议\n\n##### 2.5.1 UPDATE语句的完整执行流程\n\n```mermaid\nsequenceDiagram\n    participant E as 执行器\n    participant I as InnoDB引擎\n    participant R as Redo Log\n    participant B as Binlog\n    \n    E->>I: 1. 查询ID=2的行\n    I-->>E: 返回行数据\n    E->>E: 2. 计算新值 c=c+1\n    E->>I: 3. 写入新数据\n    I->>R: 4. 写redo log (prepare状态)\n    I-->>E: 准备完成\n    E->>B: 5. 写binlog\n    E->>I: 6. 提交事务\n    I->>R: 7. 写redo log (commit状态)\n```\n\n**详细步骤说明**：\n\n| 步骤 | 执行者 | 操作 |\n|------|--------|------|\n| 1 | 执行器 → 引擎 | 通过主键索引查找ID=2的行 |\n| 2 | 执行器 | 计算新值（N → N+1） |\n| 3 | 执行器 → 引擎 | 调用引擎接口写入新数据 |\n| 4 | 引擎 | 更新内存，写redo log（**prepare状态**） |\n| 5 | 执行器 | 写binlog到磁盘 |\n| 6-7 | 执行器 → 引擎 | 提交事务，redo log改为**commit状态** |\n\n##### 2.5.2 为什么需要两阶段提交\n\n两阶段提交的目的是保证**redo log和binlog的逻辑一致性**。\n\n**反证：不使用两阶段提交会怎样？**\n\n假设 `ID=2, c=0`，执行 `UPDATE T SET c=c+1 WHERE ID=2`：\n\n| 场景 | Crash时机 | 恢复后结果 | Binlog恢复结果 | 问题 |\n|------|-----------|-----------|----------------|------|\n| 先redo后binlog | redo写完，binlog未写 | c=1 | c=0 | **主从不一致** |\n| 先binlog后redo | binlog写完，redo未写 | c=0 | c=1 | **主从不一致** |\n\n**两阶段提交如何解决**：\n\n```mermaid\ngraph TD\n    A[开始事务] --> B[写redo log - prepare]\n    B --> C[写binlog]\n    C --> D[写redo log - commit]\n    D --> E[事务完成]\n    \n    B -.->|Crash| F[回滚：两个日志都没有]\n    C -.->|Crash| G[检查binlog: 完整则提交, 否则回滚]\n```\n\n**恢复时的判断逻辑**：\n\n1. 如果redo log处于commit状态 → 直接提交\n2. 如果redo log处于prepare状态：\n   - 检查binlog是否完整\n   - 完整 → 提交\n   - 不完整 → 回滚\n\n##### 2.5.3 数据恢复与主从一致性保障\n\n**数据库恢复到任意时间点的能力**依赖于：\n\n1. **定期全量备份**（每天或每周）\n2. **binlog持续归档**\n\n**恢复流程**：\n\n```mermaid\ngraph LR\n    A[发现误操作<br>如12:00误删表] --> B[找到最近的全量备份<br>如昨晚备份]\n    B --> C[恢复到临时库]\n    C --> D[重放binlog<br>到误操作前一刻]\n    D --> E[从临时库提取数据]\n    E --> F[恢复到线上库]\n```\n\n---\n\n#### 2.6 关键参数配置建议\n\n##### 2.6.1 数据安全性参数\n\n| 参数 | 推荐值 | 说明 |\n|------|--------|------|\n| `innodb_flush_log_at_trx_commit` | **1** | 每次事务提交时redo log持久化到磁盘 |\n| `sync_binlog` | **1** | 每次事务提交时binlog持久化到磁盘 |\n\n> [!IMPORTANT]\n> **双1配置**：将这两个参数都设为1，可以保证MySQL异常重启后**数据不丢失、binlog不丢失**。这是生产环境的推荐配置。\n\n```sql\n-- 查看当前配置\nSHOW VARIABLES LIKE 'innodb_flush_log_at_trx_commit';\nSHOW VARIABLES LIKE 'sync_binlog';\n\n-- 设置（需要超级权限）\nSET GLOBAL innodb_flush_log_at_trx_commit = 1;\nSET GLOBAL sync_binlog = 1;\n```\n\n##### 2.6.2 参数值含义\n\n**innodb_flush_log_at_trx_commit**：\n\n| 值 | 行为 | 安全性 | 性能 |\n|----|------|--------|------|\n| 0 | 每秒刷盘一次 | 可能丢失1秒数据 | 最高 |\n| 1 | 每次提交都刷盘 | 最安全 | 较低 |\n| 2 | 每次提交写到OS缓存 | 可能丢失1秒数据 | 较高 |\n\n**sync_binlog**：\n\n| 值 | 行为 | 安全性 |\n|----|------|--------|\n| 0 | 由文件系统决定何时刷盘 | 最低 |\n| 1 | 每次提交都刷盘 | 最高 |\n| N | 每N个事务刷盘一次 | 中等 |\n\n##### 2.6.3 双1配置的性能影响量化\n\n| 配置 | TPS（参考值） | 数据安全性 | 适用场景 |\n|------|---------------|------------|----------|\n| 双1配置 | ~5000 | 最高 | 生产环境 |\n| sync_binlog=100 | ~8000 | 可能丢100个事务 | 日志类系统 |\n| 非双1配置 | ~12000 | 可能丢1秒数据 | 测试环境 |\n\n> [!NOTE]\n> 实际性能取决于磁盘类型：SSD下双1配置的性能损失较小，HDD下损失较大。\n\n##### 2.6.4 组提交优化参数\n\nMySQL通过**组提交（Group Commit）**机制优化双1配置的性能：\n\n```sql\n-- 查看组提交参数\nSHOW VARIABLES LIKE 'binlog_group_commit%';\n```\n\n| 参数 | 说明 | 默认值 | 建议值 |\n|------|------|--------|--------|\n| `binlog_group_commit_sync_delay` | 等待组提交的延迟（微秒） | 0 | 1000-10000 |\n| `binlog_group_commit_sync_no_delay_count` | 达到此事务数立即提交 | 0 | 10-100 |\n\n**组提交原理**：\n\n```mermaid\ngraph TD\n    A[多个事务准备提交] --> B[Leader收集事务]\n    B --> C{达到条件?}\n    C -->|延迟到期或数量达标| D[一次fsync提交多个事务]\n    C -->|否| B\n    D --> E[返回各事务成功]\n```\n\n**配置示例**：\n\n```sql\n-- 等待最多2ms或10个事务，然后批量fsync\nSET GLOBAL binlog_group_commit_sync_delay = 2000;\nSET GLOBAL binlog_group_commit_sync_no_delay_count = 10;\n```\n\n##### 2.6.5 两阶段提交异常场景分析\n\n**场景1：prepare完成后崩溃**\n\n```mermaid\ngraph TD\n    A[写redo log prepare] --> B{MySQL崩溃}\n    B --> C[重启恢复]\n    C --> D{检查binlog}\n    D -->|binlog完整| E[提交事务]\n    D -->|binlog不完整| F[回滚事务]\n```\n\n**场景2：binlog写入后崩溃**\n\n此时redo log是prepare状态，binlog已完整写入：\n\n- 恢复时发现binlog完整 → 提交事务\n- 确保主备一致性\n\n---\n\n#### 2.7 本章小结\n\n本章介绍了MySQL日志系统的核心：redo log和binlog。\n\n**核心知识点回顾**：\n\n| 概念 | 要点 |\n|------|------|\n| **WAL技术** | 先写日志再写磁盘，提升写入性能 |\n| **Redo Log** | InnoDB特有，物理日志，循环写，保证crash-safe |\n| **Binlog** | Server层，逻辑日志，追加写，用于归档和复制 |\n| **两阶段提交** | 保证redo log和binlog的一致性 |\n| **双1配置** | 生产环境必开，保证数据安全 |\n\n**思考题答案**：\n> 一天一备相比一周一备的优势是什么？\n>\n> **答案**：恢复时间更短（RTO更低）。\n>\n> - 一天一备：最多需要重放1天的binlog\n> - 一周一备：最多需要重放7天的binlog\n>\n> 这影响的是数据库的**RTO（Recovery Time Objective，恢复时间目标）**指标。备份越频繁，恢复所需的时间越短，但备份本身也会消耗更多资源。\n\n---", "subs": ["2.1 更新语句的执行流程", "2.2 WAL技术核心思想", "2.3 Redo Log深度解析", "2.4 Binlog归档日志机制", "2.5 两阶段提交协议", "2.6 关键参数配置建议", "2.7 本章小结"]}, {"title": "第3章 事务隔离级别与MVCC原理详解", "content": "> **核心要点**：事务隔离是数据库并发控制的核心机制。本章深入讲解SQL标准的四种隔离级别、InnoDB的MVCC实现原理，以及长事务的危害与规避策略。\n\n#### 3.1 事务的ACID特性回顾\n\n**ACID**是事务的四个基本特性：\n\n| 特性 | 英文 | 含义 |\n|------|------|------|\n| **原子性** | Atomicity | 事务中的操作要么全部成功，要么全部失败 |\n| **一致性** | Consistency | 事务执行前后，数据库从一个一致状态变到另一个一致状态 |\n| **隔离性** | Isolation | 并发事务之间互不影响 |\n| **持久性** | Durability | 事务提交后，数据永久保存 |\n\n本章重点讨论**隔离性（Isolation）**的实现。\n\n---\n\n#### 3.2 SQL标准事务隔离级别\n\n当多个事务并发执行时，可能出现以下问题：\n\n| 问题 | 描述 |\n|------|------|\n| **脏读** (Dirty Read) | 读取到其他事务未提交的数据 |\n| **不可重复读** (Non-repeatable Read) | 同一事务内，两次读取同一数据结果不同 |\n| **幻读** (Phantom Read) | 同一事务内，两次查询的行数不同 |\n\nSQL标准定义了四种隔离级别来解决这些问题：\n\n```mermaid\ngraph LR\n    A[读未提交] --> B[读已提交]\n    B --> C[可重复读]\n    C --> D[串行化]\n    \n    style A fill:#ff6b6b\n    style B fill:#ffd93d\n    style C fill:#6bcb77\n    style D fill:#4d96ff\n```\n\n##### 3.2.1 读未提交（Read Uncommitted）\n\n- **定义**：一个事务还没提交时，它做的变更就能被别的事务看到\n- **问题**：存在脏读、不可重复读、幻读\n- **使用场景**：几乎不使用\n\n##### 3.2.2 读已提交（Read Committed）\n\n- **定义**：一个事务提交之后，它做的变更才会被其他事务看到\n- **问题**：存在不可重复读、幻读\n- **使用场景**：Oracle默认隔离级别\n\n##### 3.2.3 可重复读（Repeatable Read）\n\n- **定义**：一个事务执行过程中看到的数据，总是跟这个事务启动时看到的数据一致\n- **问题**：标准SQL下存在幻读（InnoDB通过间隙锁解决）\n- **使用场景**：**MySQL InnoDB默认隔离级别**\n\n##### 3.2.4 串行化（Serializable）\n\n- **定义**：对同一行记录，读会加读锁，写会加写锁\n- **问题**：无并发问题，但性能最差\n- **使用场景**：对一致性要求极高的场景\n\n---\n\n#### 3.3 隔离级别实例分析\n\n假设有表 `T(c int)`，初始值 `c=1`：\n\n```sql\nCREATE TABLE T(c int) ENGINE=InnoDB;\nINSERT INTO T(c) VALUES(1);\n```\n\n两个事务按以下时序执行：\n\n| 时刻 | 事务A | 事务B |\n|------|-------|-------|\n| T1 | start transaction; | |\n| T2 | | start transaction; |\n| T3 | | UPDATE T SET c=2 WHERE c=1; |\n| T4 | SELECT c FROM T; -- V1 | |\n| T5 | | COMMIT; |\n| T6 | SELECT c FROM T; -- V2 | |\n| T7 | COMMIT; | |\n| T8 | SELECT c FROM T; -- V3 | |\n\n**不同隔离级别下的结果**：\n\n| 隔离级别 | V1 | V2 | V3 | 说明 |\n|----------|----|----|----|----|\n| 读未提交 | 2 | 2 | 2 | V1就能看到B未提交的修改 |\n| 读已提交 | 1 | 2 | 2 | V2才能看到B已提交的修改 |\n| 可重复读 | 1 | 1 | 2 | V1、V2都看到事务启动时的快照 |\n| 串行化 | 1 | 1 | 2 | B的UPDATE会等待A提交 |\n\n---\n\n#### 3.4 事务隔离的实现原理\n\n##### 3.4.1 视图（View）机制\n\n不同隔离级别通过**视图**机制实现：\n\n| 隔离级别 | 视图创建时机 |\n|----------|-------------|\n| 读未提交 | 不使用视图，直接读最新值 |\n| 读已提交 | 每条SQL开始时创建新视图 |\n| 可重复读 | 事务启动时创建，整个事务使用同一视图 |\n| 串行化 | 不使用视图，通过加锁实现 |\n\n##### 3.4.2 配置隔离级别\n\n```sql\n-- 查看当前隔离级别\nSHOW VARIABLES LIKE 'transaction_isolation';\n\n-- 设置隔离级别（会话级）\nSET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;\n\n-- 设置隔离级别（全局）\nSET GLOBAL TRANSACTION ISOLATION LEVEL REPEATABLE READ;\n```\n\n> [!TIP]\n> **迁移建议**：从Oracle迁移到MySQL时，为保持行为一致，建议将MySQL隔离级别设置为`READ COMMITTED`。\n\n---\n\n#### 3.5 MVCC多版本并发控制\n\n##### 3.5.1 回滚日志与版本链\n\nInnoDB通过**MVCC（Multi-Version Concurrency Control）**实现事务隔离：\n\n- 每条记录更新时，同时记录一条**回滚日志（undo log）**\n- 通过回滚日志可以得到记录的历史版本\n\n```mermaid\ngraph LR\n    subgraph VersionChain[\"数据版本链\"]\n        V4[\"当前值: 4\"]\n        V3[\"历史值: 3\"]\n        V2[\"历史值: 2\"]\n        V1[\"历史值: 1\"]\n    end\n    \n    V4 -->|\"undo: 4->3\"| V3\n    V3 -->|\"undo: 3->2\"| V2\n    V2 -->|\"undo: 2->1\"| V1\n    \n    RA[\"read-view A\"] -.-> V1\n    RB[\"read-view B\"] -.-> V2\n    RC[\"read-view C\"] -.-> V4\n```\n\n**MVCC的优势**：\n\n- 同一条记录在系统中可以存在多个版本\n- 不同事务可以看到不同版本，互不冲突\n- 实现了**非阻塞读**\n\n##### 3.5.2 一致性视图的实现\n\nInnoDB在实现可重复读时：\n\n1. 事务启动时，创建一个**一致性视图（consistent read view）**\n2. 视图记录了当时所有**活跃事务**的ID列表\n3. 读取数据时，根据视图判断数据版本的可见性\n\n##### 3.5.3 回滚日志的清理\n\n**问题**：回滚日志什么时候删除？\n\n**答案**：当没有事务需要用到这些回滚日志时才删除。\n\n具体来说：当系统中没有比某个回滚日志更早的read-view时，该日志就可以被删除。\n\n---\n\n#### 3.6 长事务的危害与规避\n\n##### 3.6.1 长事务的危害\n\n长事务会导致以下问题：\n\n| 问题 | 说明 |\n|------|------|\n| **回滚日志膨胀** | 长事务存在期间，所有可能用到的回滚日志都不能删除 |\n| **锁资源占用** | 长事务持有的锁不会释放，可能阻塞其他事务 |\n| **数据库性能下降** | 大量历史版本和锁等待会拖慢整个数据库 |\n\n> [!CAUTION]\n> 在MySQL 5.5及之前版本，回滚日志存放在共享表空间ibdata文件中。即使长事务提交，ibdata文件也**不会自动缩小**，可能导致文件膨胀到数百GB。\n\n##### 3.6.2 事务的两种启动方式\n\n| 方式 | 命令 | 特点 |\n|------|------|------|\n| 显式启动 | `BEGIN` 或 `START TRANSACTION` | 推荐使用 |\n| 隐式启动 | `SET autocommit=0` | 容易造成长事务 |\n\n> [!WARNING]\n> **避免使用 `SET autocommit=0`**：某些客户端框架会默认执行这个命令，导致后续所有查询都在事务中，容易产生意外的长事务。\n\n**建议**：始终使用 `autocommit=1`，通过显式的 `BEGIN/COMMIT` 管理事务。\n\n##### 3.6.3 减少交互次数的技巧\n\n如果担心 `BEGIN` 增加交互次数，可以使用：\n\n```sql\n-- 提交当前事务并自动开启下一个事务\nCOMMIT WORK AND CHAIN;\n```\n\n##### 3.6.4 监控长事务\n\n```sql\n-- 查找持续时间超过60秒的事务\nSELECT * \nFROM information_schema.innodb_trx \nWHERE TIME_TO_SEC(TIMEDIFF(NOW(), trx_started)) > 60;\n\n-- 查看长事务详细信息\nSELECT trx_id, trx_state, trx_started, \n       trx_mysql_thread_id, trx_query,\n       trx_rows_locked, trx_rows_modified\nFROM information_schema.innodb_trx \nORDER BY trx_started;\n\n-- 强制终止长事务（谨慎使用）\nKILL <trx_mysql_thread_id>;\n```\n\n##### 3.6.5 可重复读 vs 读提交的业务选型\n\n| 对比维度 | 可重复读(RR) | 读提交(RC) |\n|----------|--------------|------------|\n| 默认使用 | MySQL默认 | Oracle默认 |\n| 间隙锁 | 有 | 无 |\n| 锁范围 | 较大 | 较小 |\n| 死锁概率 | 较高 | 较低 |\n| 幻读问题 | 通过间隙锁解决 | 存在幻读 |\n| 适用场景 | 金融、交易系统 | 日志、分析系统 |\n\n**选型建议**：\n\n| 场景 | 推荐隔离级别 | 原因 |\n|------|--------------|------|\n| 金融交易 | 可重复读 | 需要强一致性 |\n| 日志记录 | 读提交 | 无需强一致性，锁更少 |\n| 高并发OLTP | 读提交 | 减少锁冲突 |\n| 报表查询 | 读提交 | 允许读到最新已提交数据 |\n\n**配置方法**：\n\n```sql\n-- 修改全局隔离级别\nSET GLOBAL transaction_isolation = 'READ-COMMITTED';\n\n-- 修改会话隔离级别\nSET SESSION transaction_isolation = 'READ-COMMITTED';\n\n-- 在my.cnf中配置\n[mysqld]\ntransaction_isolation = READ-COMMITTED\n```\n\n> [!IMPORTANT]\n> 从可重复读改为读提交时，必须设置`binlog_format=ROW`，否则可能导致主备数据不一致。\n\n---\n\n#### 3.7 本章小结\n\n本章介绍了MySQL事务隔离的核心概念和实现原理：\n\n| 概念 | 要点 |\n|------|------|\n| **四种隔离级别** | 读未提交 < 读已提交 < 可重复读 < 串行化 |\n| **InnoDB默认** | 可重复读（Repeatable Read） |\n| **MVCC** | 通过版本链和一致性视图实现非阻塞读 |\n| **长事务危害** | 回滚日志膨胀、锁资源占用 |\n| **最佳实践** | 使用autocommit=1，显式管理事务 |\n\n**思考题答案**：\n> 如何避免长事务？\n>\n> **从应用开发角度**：\n>\n> 1. 设置 `autocommit=1`，显式开启事务\n> 2. 评估业务逻辑，尽量缩短事务执行时间\n> 3. 避免在事务中进行网络调用等耗时操作\n>\n> **从数据库运维角度**：\n>\n> 1. 监控 `information_schema.innodb_trx` 表，设置告警\n> 2. 设置合理的 `lock_wait_timeout` 和 `innodb_lock_wait_timeout`\n> 3. 定期 kill 超时的长事务\n\n---", "subs": ["3.1 事务的ACID特性回顾", "3.2 SQL标准事务隔离级别", "3.3 隔离级别实例分析", "3.4 事务隔离的实现原理", "3.5 MVCC多版本并发控制", "3.6 长事务的危害与规避", "3.7 本章小结"]}, {"title": "第4章 索引数据结构与存储模型", "content": "> **核心要点**：索引是提高数据库查询效率的关键技术。本章深入讲解常见的索引数据结构，重点分析InnoDB的B+树索引模型，以及聚簇索引与二级索引的区别。\n\n#### 4.1 索引的本质与作用\n\n**索引的本质**：就像书的目录，用于快速定位数据，提高查询效率。\n\n没有索引的查询是**全表扫描**，时间复杂度O(N)；有了合适的索引，查询可以优化到O(log(N))甚至O(1)。\n\n---\n\n#### 4.2 常见索引数据结构对比\n\n##### 4.2.1 哈希表索引\n\n**原理**：通过哈希函数将key映射到数组位置，冲突时使用链表解决。\n\n```mermaid\ngraph LR\n    subgraph HashTable[\"哈希表\"]\n        A0[\"0: NULL\"]\n        A1[\"1: User1\"]\n        A2[\"2: NULL\"]\n        AN[\"N: User2 -> User4\"]\n    end\n    \n    K1[\"key: ID_card_1\"] -->|hash| A1\n    K2[\"key: ID_card_2\"] -->|hash| AN\n    K4[\"key: ID_card_4\"] -->|hash| AN\n```\n\n| 优点 | 缺点 |\n|------|------|\n| 等值查询O(1)，速度极快 | 不支持范围查询 |\n| 插入速度快 | 需要处理哈希冲突 |\n\n**适用场景**：等值查询，如Memcached、Redis等NoSQL引擎。\n\n##### 4.2.2 有序数组索引\n\n**原理**：数据按key有序排列，通过二分查找定位。\n\n| 优点 | 缺点 |\n|------|------|\n| 等值查询O(log(N)) | 插入需要移动大量数据 |\n| 范围查询高效 | 更新成本高 |\n\n**适用场景**：静态数据，如历史归档数据。\n\n##### 4.2.3 搜索树索引\n\n**二叉搜索树**特点：\n\n- 左子节点 < 父节点 < 右子节点\n- 查询和更新复杂度都是O(log(N))\n\n**问题**：树高太大，磁盘IO次数多\n\n```text\n100万节点的平衡二叉树：\n- 树高约20层\n- 一次查询可能需要20次磁盘IO\n- 每次IO约10ms → 总共200ms，太慢！\n```\n\n**解决方案**：使用**N叉树**减少树高\n\n---\n\n#### 4.3 InnoDB的B+树索引\n\n##### 4.3.1 为什么选择B+树\n\n**B+树**是一种多路平衡搜索树，专为磁盘存储优化：\n\n| 特性 | 说明 |\n|------|------|\n| **多叉结构** | 每个节点可以有N个子节点，大幅降低树高 |\n| **数据在叶子节点** | 非叶子节点只存索引，叶子节点存数据 |\n| **叶子节点链表** | 叶子节点之间通过链表连接，便于范围查询 |\n\n**存储能力示例**：\n\n```text\nInnoDB整数索引，N ≈ 1200\n树高=4时，可存储 1200³ ≈ 17亿 条记录\n一次查询最多访问 3-4 次磁盘\n```\n\n##### 4.3.2 B+树结构示意\n\n```mermaid\ngraph TD\n    subgraph BPlusTree[\"B+树结构\"]\n        Root[\"根节点<br>[P1|10|P2|20|P3]\"]\n        N1[\"[1,3,5,7]\"]\n        N2[\"[10,12,15,18]\"]\n        N3[\"[20,25,30,35]\"]\n    end\n    \n    Root --> N1\n    Root --> N2\n    Root --> N3\n    N1 -.-> N2 -.-> N3\n```\n\n---\n\n#### 4.4 聚簇索引与二级索引\n\n##### 4.4.1 InnoDB的索引组织表\n\nInnoDB中，表数据按照**主键顺序**存储，这种结构称为**索引组织表**。\n\n**示例表结构**：\n\n```sql\nCREATE TABLE T(\n    id INT PRIMARY KEY,\n    k INT NOT NULL,\n    name VARCHAR(16),\n    INDEX (k)\n) ENGINE=InnoDB;\n```\n\n##### 4.4.2 两种索引类型\n\n```mermaid\ngraph TD\n    subgraph Primary[\"主键索引 (聚簇索引)\"]\n        P1[\"100\"] --> D1[\"整行数据R1\"]\n        P2[\"200\"] --> D2[\"整行数据R2\"]\n        P3[\"300\"] --> D3[\"整行数据R3\"]\n    end\n    \n    subgraph Secondary[\"二级索引 (非聚簇索引)\"]\n        S1[\"k=1\"] --> ID1[\"ID=100\"]\n        S2[\"k=2\"] --> ID2[\"ID=200\"]\n        S3[\"k=3\"] --> ID3[\"ID=300\"]\n    end\n```\n\n| 索引类型 | 叶子节点存储内容 | 别名 |\n|----------|-----------------|------|\n| **主键索引** | 整行数据 | 聚簇索引（Clustered Index） |\n| **二级索引** | 主键值 | 非聚簇索引（Secondary Index） |\n\n##### 4.4.3 回表操作\n\n**主键查询**：只需搜索主键索引树\n\n```sql\nSELECT * FROM T WHERE id = 100;  -- 搜索1次\n```\n\n**二级索引查询**：需要**回表**\n\n```sql\nSELECT * FROM T WHERE k = 1;  \n-- 1. 搜索k索引树，找到id=100\n-- 2. 再搜索主键索引树，获取完整行数据\n```\n\n> [!IMPORTANT]\n> 基于二级索引的查询需要多扫描一棵索引树，因此应**尽量使用主键查询**。\n\n##### 4.4.4 主键选择深度分析\n\n**自增主键 vs 业务主键对比**：\n\n| 对比维度 | 自增主键 | 业务主键（如UUID） |\n|----------|----------|-------------------|\n| 插入顺序 | 顺序写入 | 随机写入 |\n| 页分裂 | 极少发生 | 频繁发生 |\n| 存储效率 | 4-8字节 | 通常32+字节 |\n| 二级索引大小 | 较小 | 较大 |\n| 查询性能 | 范围查询友好 | 范围查询差 |\n\n**主键长度对存储的影响计算**：\n\n```text\n假设：100万行数据，10个二级索引\n\n自增主键(BIGINT=8字节)：\n  二级索引额外存储 = 100万 × 10 × 8字节 = 80MB\n\nUUID主键(36字节)：\n  二级索引额外存储 = 100万 × 10 × 36字节 = 360MB\n  \n差异 = 280MB（仅索引存储，还不含主键本身）\n```\n\n**建议**：除非有特殊业务需求（如分布式ID生成），否则**优先使用自增主键**。\n\n##### 4.4.5 B+树存储容量计算\n\n**InnoDB页大小与节点容量**：\n\n```text\nInnoDB页大小 = 16KB\n假设主键为BIGINT(8字节)，指针大小为6字节\n\n非叶子节点一层可存: 16KB / (8+6) ≈ 1170 个指针\n叶子节点假设每行1KB: 16KB / 1KB = 16 行\n\n树高3时: 1170 × 1170 × 16 ≈ 2.2亿行\n树高4时: 1170 × 1170 × 1170 × 16 ≈ 2500亿行\n```\n\n> [!TIP]\n> 大多数业务表树高不超过4层，即一次查询最多4次磁盘IO。\n\n---\n\n#### 4.5 索引维护：页分裂与页合并\n\n##### 4.5.1 页分裂\n\n当向已满的数据页插入新记录时，需要：\n\n1. 申请新的数据页\n2. 将部分数据迁移到新页\n3. 更新索引指针\n\n```mermaid\ngraph LR\n    subgraph Before[\"分裂前\"]\n        P1[\"页1: [100,200,300,400,500]<br>已满\"]\n    end\n    \n    subgraph After[\"分裂后\"]\n        P2[\"页1: [100,200,300]\"]\n        P3[\"页2: [400,500,新记录]\"]\n    end\n    \n    Before -->|\"插入350\"| After\n```\n\n**影响**：\n\n- 性能下降（需要额外的IO操作）\n- 空间利用率降低（约50%）\n\n##### 4.5.2 页合并\n\n当相邻页的数据因删除而变得稀疏时，会进行页合并。\n\n---\n\n#### 4.6 自增主键的优势\n\n##### 4.6.1 性能优势\n\n自增主键的插入模式是**追加写**：\n\n| 主键类型 | 插入模式 | 是否触发页分裂 |\n|----------|----------|----------------|\n| 自增主键 | 追加到最后 | 很少 |\n| 业务主键 | 随机位置 | 频繁 |\n\n##### 4.6.2 空间优势\n\n二级索引的叶子节点存储主键值：\n\n| 主键类型 | 主键大小 | 二级索引空间占用 |\n|----------|----------|------------------|\n| INT | 4字节 | 较小 |\n| BIGINT | 8字节 | 较小 |\n| VARCHAR(20) | 约20字节 | 较大 |\n\n> [!TIP]\n> **建议**：一般情况下优先使用自增主键，除非是纯KV场景（只有一个唯一索引）。\n\n---", "subs": ["4.1 索引的本质与作用", "4.2 常见索引数据结构对比", "4.3 InnoDB的B+树索引", "4.4 聚簇索引与二级索引", "4.5 索引维护：页分裂与页合并", "4.6 自增主键的优势"]}, {"title": "第5章 索引优化与覆盖索引策略", "content": "> **核心要点**：本章介绍索引优化的核心技术，包括覆盖索引、最左前缀原则和索引下推，帮助你设计高效的索引策略。\n\n#### 5.1 回表问题分析\n\n**示例查询**：\n\n```sql\nSELECT * FROM T WHERE k BETWEEN 3 AND 5;\n```\n\n**执行流程**：\n\n1. 在k索引树找到k=3，获取ID=300\n2. **回表**：到主键索引树查找ID=300的完整数据\n3. 在k索引树找到k=5，获取ID=500\n4. **回表**：到主键索引树查找ID=500的完整数据\n5. 在k索引树找到k=6，不满足条件，结束\n\n**问题**：回表操作增加了磁盘IO和查询时间。\n\n---\n\n#### 5.2 覆盖索引\n\n##### 5.2.1 什么是覆盖索引\n\n当索引中**已经包含**查询所需的所有字段时，就不需要回表，这种情况称为**覆盖索引**。\n\n**示例**：\n\n```sql\n-- 需要回表\nSELECT * FROM T WHERE k BETWEEN 3 AND 5;\n\n-- 覆盖索引，不需要回表\nSELECT id FROM T WHERE k BETWEEN 3 AND 5;\n```\n\n第二个查询中，id已经在k索引树上，无需回表。\n\n##### 5.2.2 覆盖索引的应用\n\n**场景**：高频查询\"根据身份证号查姓名\"\n\n```sql\nCREATE TABLE tuser (\n    id INT PRIMARY KEY,\n    id_card VARCHAR(32),\n    name VARCHAR(32),\n    age INT,\n    INDEX idx_id_card (id_card),\n    INDEX idx_id_card_name (id_card, name)  -- 覆盖索引\n);\n```\n\n| 索引 | 查询 | 是否回表 |\n|------|------|---------|\n| idx_id_card | SELECT * FROM tuser WHERE id_card = '123' | 是 |\n| idx_id_card_name | SELECT name FROM tuser WHERE id_card = '123' | **否** |\n\n> [!TIP]\n> 覆盖索引可以显著减少回表次数，是**常用的性能优化手段**。但要权衡索引维护成本。\n\n---\n\n#### 5.3 最左前缀原则\n\n##### 5.3.1 原则说明\n\n联合索引按照定义的字段顺序排序，查询时可以利用索引的**最左前缀**。\n\n```mermaid\ngraph TD\n    subgraph NameAge[\"索引 (name, age)\"]\n        A[\"张三, 10\"]\n        B[\"张三, 20\"]\n        C[\"张四, 15\"]\n        D[\"李四, 25\"]\n    end\n    \n    A --> B --> C --> D\n```\n\n**可以使用索引的查询**：\n\n```sql\nWHERE name = '张三'                    -- 使用name前缀\nWHERE name = '张三' AND age = 10       -- 使用完整索引\nWHERE name LIKE '张%'                  -- 使用name前缀\n```\n\n**无法使用索引的查询**：\n\n```sql\nWHERE age = 10                         -- 没有name，无法使用\nWHERE name LIKE '%三'                   -- 前缀不确定\n```\n\n##### 5.3.2 联合索引字段顺序设计\n\n**原则一**：复用性优先\n\n如果已有索引(a,b)，通常不需要单独创建索引(a)。\n\n**原则二**：空间优先\n\n如果需要同时支持(a)和(b)的单独查询：\n\n- 创建联合索引(a,b)\n- 再创建单字段索引(b)\n- 选择较小的字段作为单独索引\n\n---\n\n#### 5.4 索引下推优化\n\n##### 5.4.1 问题场景\n\n```sql\nSELECT * FROM tuser \nWHERE name LIKE '张%' AND age = 10 AND ismale = 1;\n```\n\n使用索引(name, age)，只能利用\"张%\"定位到第一条记录。\n\n##### 5.4.2 MySQL 5.6之前\n\n```mermaid\ngraph TD\n    A[在索引中找到name以张开头的记录] --> B[回表获取完整数据]\n    B --> C[在Server层判断age和ismale]\n    C --> D[返回符合条件的记录]\n```\n\n**问题**：即使age不等于10，也要回表后才能判断。\n\n##### 5.4.3 索引下推（Index Condition Pushdown）\n\nMySQL 5.6引入的优化，可以在索引遍历过程中，对索引包含的字段**先做判断**。\n\n```mermaid\ngraph TD\n    A[在索引中找到name以张开头的记录] --> B{age=10?}\n    B -->|是| C[回表获取完整数据]\n    B -->|否| D[跳过，不回表]\n    C --> E[在Server层判断ismale]\n    E --> F[返回符合条件的记录]\n```\n\n**效果**：减少回表次数，提升查询性能。\n\n##### 5.4.4 覆盖索引和索引下推的EXPLAIN识别\n\n**覆盖索引特征**：\n\n```sql\nEXPLAIN SELECT id FROM tuser WHERE name = '张三'\\G\n\n-- 关键输出：\n-- type: ref\n-- key: idx_name\n-- Extra: Using index    <-- 表示使用了覆盖索引\n```\n\n**索引下推特征**：\n\n```sql\nEXPLAIN SELECT * FROM tuser \nWHERE name LIKE '张%' AND age = 10\\G\n\n-- 关键输出：\n-- type: range\n-- key: idx_name_age\n-- Extra: Using index condition    <-- 表示使用了索引下推\n```\n\n**EXPLAIN Extra字段常见值**：\n\n| 值 | 含义 |\n|----|------|\n| Using index | 覆盖索引，不回表 |\n| Using index condition | 索引下推（ICP） |\n| Using where | Server层过滤 |\n| Using filesort | 需要额外排序 |\n| Using temporary | 需要临时表 |\n\n---\n\n#### 5.5 本章小结\n\n| 优化技术 | 原理 | 效果 |\n|----------|------|------|\n| **覆盖索引** | 索引包含所有查询字段 | 避免回表 |\n| **最左前缀** | 利用联合索引的左侧字段 | 复用索引 |\n| **索引下推** | 在索引层过滤数据 | 减少回表 |\n\n**索引设计原则**：\n\n1. 尽量使用覆盖索引\n2. 合理设计联合索引的字段顺序\n3. MySQL 5.6+自动启用索引下推\n\n**思考题答案**：\n> 对于联合主键(a,b)的表，为什么需要额外创建(c,a)和(c,b)索引？\n>\n> **答案**：\n>\n> - `SELECT * FROM t WHERE c=N ORDER BY a`：需要索引(c,a)来避免排序\n> - `SELECT * FROM t WHERE c=N ORDER BY b`：需要索引(c,b)来避免排序\n>\n> 虽然索引c已经包含了主键(a,b)，但索引c内部是按c值排序的，a和b值是无序的。要利用索引避免排序，必须创建(c,a)或(c,b)。\n\n---", "subs": ["5.1 回表问题分析", "5.2 覆盖索引", "5.3 最左前缀原则", "5.4 索引下推优化", "5.5 本章小结"]}, {"title": "第6章 全局锁与表级锁机制解析", "content": "> **核心要点**：MySQL的锁机制用于处理并发访问问题。本章介绍全局锁和表级锁的使用场景、工作原理，以及如何安全地执行DDL操作。\n\n#### 6.1 MySQL锁的分类\n\n根据加锁范围，MySQL的锁分为三类：\n\n```mermaid\ngraph TD\n    A[MySQL锁] --> B[全局锁]\n    A --> C[表级锁]\n    A --> D[行锁]\n    \n    C --> E[表锁]\n    C --> F[元数据锁 MDL]\n```\n\n---\n\n#### 6.2 全局锁\n\n##### 6.2.1 全局锁的使用\n\n**加锁命令**：\n\n```sql\nFLUSH TABLES WITH READ LOCK (FTWRL);\n```\n\n**效果**：\n\n- 整个数据库处于只读状态\n- 阻塞：数据更新（DML）、表结构变更（DDL）、更新类事务提交\n\n##### 6.2.2 全局锁的应用场景：全库逻辑备份\n\n**为什么备份需要加锁？**\n\n考虑不加锁备份的场景：\n\n```mermaid\nsequenceDiagram\n    participant B as 备份进程\n    participant U as 用户操作\n    \n    B->>B: 备份账户表（余额100）\n    U->>U: 购买课程：扣款50，增加课程\n    B->>B: 备份课程表（已有新课程）\n    \n    Note over B: 备份结果不一致：<br/>余额100，但多了一门课\n```\n\n**结论**：不加锁的备份会导致数据在**逻辑上不一致**。\n\n##### 6.2.3 更好的备份方案：single-transaction\n\n对于InnoDB表，可以使用mysqldump的 `--single-transaction` 参数：\n\n```bash\nmysqldump --single-transaction -u root -p database > backup.sql\n```\n\n**原理**：利用MVCC机制，在可重复读隔离级别下获取一致性视图。\n\n| 方案 | 适用场景 | 影响 |\n|------|----------|------|\n| FTWRL | 所有引擎 | 阻塞所有写入 |\n| --single-transaction | 仅InnoDB | 不阻塞业务 |\n\n> [!IMPORTANT]\n> `--single-transaction` 只适用于所有表都使用InnoDB的情况。如果有MyISAM表，必须使用FTWRL。\n\n##### 6.2.4 FTWRL vs readonly\n\n为什么不用 `SET GLOBAL readonly=true`？\n\n| 对比项 | FTWRL | readonly |\n|--------|-------|----------|\n| 影响范围 | 仅当前会话 | 全局，可能影响主备判断逻辑 |\n| 异常处理 | 客户端断开自动释放 | 保持readonly状态 |\n| 风险 | 较低 | 可能导致数据库长时间不可写 |\n\n---\n\n#### 6.3 表级锁\n\n##### 6.3.1 表锁\n\n**语法**：\n\n```sql\n-- 加锁\nLOCK TABLES t1 READ, t2 WRITE;\n\n-- 解锁\nUNLOCK TABLES;\n```\n\n**特点**：\n\n- 限制其他线程的读写\n- 也限制本线程的操作（只能操作被锁的表）\n\n> [!NOTE]\n> 对于支持行锁的InnoDB引擎，一般**不使用表锁**，因为锁粒度太大。\n\n##### 6.3.2 元数据锁（MDL）\n\n**MDL（Metadata Lock）**是MySQL 5.5引入的机制：\n\n| 操作 | MDL锁类型 |\n|------|-----------|\n| 增删改查（DML） | MDL读锁 |\n| 表结构变更（DDL） | MDL写锁 |\n\n**锁兼容性**：\n\n- 读锁之间：兼容\n- 读锁与写锁：互斥\n- 写锁之间：互斥\n\n##### 6.3.3 MDL锁导致的问题\n\n```mermaid\nsequenceDiagram\n    participant A as Session A\n    participant B as Session B\n    participant C as Session C\n    participant D as Session D\n    \n    A->>A: SELECT（获取MDL读锁）\n    B->>B: SELECT（获取MDL读锁）✓\n    C->>C: ALTER TABLE（等待MDL写锁）阻塞\n    D->>D: SELECT（等待MDL读锁）阻塞\n    \n    Note over C,D: C在等A释放读锁<br/>D被C阻塞\n```\n\n> [!CAUTION]\n> **MDL锁在事务结束时才释放**。如果Session A开启事务后不提交，会导致后续所有对该表的操作都被阻塞。\n\n##### 6.3.4 如何安全地给小表加字段\n\n**步骤**：\n\n1. 检查是否有长事务：查询 `information_schema.innodb_trx`\n2. 如有长事务，kill掉或等待其结束\n3. 使用带超时的DDL语法：\n\n```sql\n-- MariaDB/AliSQL支持的语法\nALTER TABLE tbl_name NOWAIT ADD COLUMN ...;\nALTER TABLE tbl_name WAIT N ADD COLUMN ...;\n```\n\n##### 6.3.5 MDL锁诊断查询\n\n```sql\n-- 查看当前MDL锁等待（需开启performance_schema）\nSELECT * FROM performance_schema.metadata_locks;\n\n-- 查看MDL锁等待关系\nSELECT \n    waiting.object_name AS waiting_table,\n    waiting.lock_type AS waiting_lock_type,\n    waiting.owner_thread_id AS waiting_thread,\n    blocking.lock_type AS blocking_lock_type,\n    blocking.owner_thread_id AS blocking_thread\nFROM performance_schema.metadata_locks waiting\nJOIN performance_schema.metadata_locks blocking\n  ON waiting.object_name = blocking.object_name\nWHERE waiting.lock_status = 'PENDING'\n  AND blocking.lock_status = 'GRANTED';\n```\n\n##### 6.3.6 Online DDL锁降级过程\n\n**MySQL 5.6+ Online DDL流程**：\n\n```mermaid\nsequenceDiagram\n    participant DDL as DDL操作\n    participant MDL as MDL锁\n    participant DATA as 数据处理\n    \n    DDL->>MDL: 获取MDL写锁\n    DDL->>MDL: 降级为MDL读锁\n    DDL->>DATA: 执行DDL（允许DML并发）\n    DDL->>MDL: 升级为MDL写锁\n    DDL->>MDL: 释放锁\n```\n\n| 阶段 | 持有锁类型 | DML是否可执行 |\n|------|-----------|---------------|\n| 开始 | MDL写锁 | 否 |\n| 执行中 | MDL读锁 | 是 |\n| 结束 | MDL写锁 | 否 |\n\n---", "subs": ["6.1 MySQL锁的分类", "6.2 全局锁", "6.3 表级锁"]}, {"title": "第7章 行锁原理与死锁预防策略", "content": "> **核心要点**：行锁是InnoDB实现高并发的关键。本章讲解两阶段锁协议、死锁的产生和检测机制，以及如何优化热点行更新。\n\n#### 7.1 行锁基础\n\n**行锁**：针对数据表中**行记录**的锁，由存储引擎实现。\n\n| 引擎 | 行锁支持 |\n|------|----------|\n| InnoDB | 支持 |\n| MyISAM | 不支持（只有表锁） |\n\n---\n\n#### 7.2 两阶段锁协议\n\n##### 7.2.1 协议内容\n\n> **InnoDB的行锁是在需要的时候才加上的，但并不是不需要了就立刻释放，而是要等到事务结束时才释放。**\n\n```mermaid\nsequenceDiagram\n    participant A as 事务A\n    participant B as 事务B\n    \n    A->>A: UPDATE t SET c=c+1 WHERE id=1（加锁）\n    A->>A: UPDATE t SET c=c+1 WHERE id=2（加锁）\n    B->>B: UPDATE t SET c=c+1 WHERE id=1（等待...）\n    A->>A: COMMIT（释放所有锁）\n    B->>B: 获取锁，继续执行\n```\n\n##### 7.2.2 优化建议\n\n**原则**：把最可能造成锁冲突的操作放到事务最后。\n\n**示例**：电影票购买事务\n\n```sql\n-- 操作1：扣除用户余额\n-- 操作2：增加影院余额（热点行）\n-- 操作3：记录交易日志\n```\n\n**优化后的顺序**：3 → 1 → 2\n\n这样\"影院余额\"这一热点行的锁持有时间最短。\n\n---\n\n#### 7.3 死锁与死锁检测\n\n##### 7.3.1 什么是死锁\n\n**死锁**：多个事务循环等待对方持有的锁资源。\n\n```mermaid\ngraph LR\n    A[事务A] -->|持有id=1的锁| R1[行1]\n    A -->|等待id=2的锁| R2[行2]\n    B[事务B] -->|持有id=2的锁| R2\n    B -->|等待id=1的锁| R1\n```\n\n##### 7.3.2 死锁处理策略\n\n| 策略 | 参数 | 默认值 | 说明 |\n|------|------|--------|------|\n| **等待超时** | innodb_lock_wait_timeout | 50s | 超时后放弃等待 |\n| **死锁检测** | innodb_deadlock_detect | on | 主动检测并回滚 |\n\n**等待超时的问题**：\n\n- 设置太长（50s）：用户体验差\n- 设置太短（1s）：可能误杀正常的锁等待\n\n**死锁检测的问题**：\n\n- 每个被阻塞的事务都要检测是否有死锁\n- 时间复杂度O(n)，n个并发更新同一行时，检测成本是O(n²)\n\n##### 7.3.3 热点行更新优化\n\n**问题场景**：1000个并发事务更新同一行，死锁检测消耗大量CPU。\n\n**解决方案**：\n\n| 方案 | 说明 | 风险 |\n|------|------|------|\n| 关闭死锁检测 | 临时方案 | 可能出现大量超时 |\n| 控制并发度 | 在中间件或数据库层面排队 | 需要开发支持 |\n| 业务拆分 | 将一行拆分为多行 | 需要改造业务逻辑 |\n\n**热点行拆分示例**：\n\n```sql\n-- 原设计：一个影院一条记录\nUPDATE theater SET balance = balance + 100 WHERE id = 1;\n\n-- 优化后：一个影院拆成10条记录\nUPDATE theater SET balance = balance + 100 \nWHERE id = 1 AND slot = FLOOR(RAND() * 10);\n\n-- 查询时汇总\nSELECT SUM(balance) FROM theater WHERE id = 1;\n```\n\n##### 7.3.4 死锁日志解读\n\n**查看死锁日志**：\n\n```sql\nSHOW ENGINE INNODB STATUS\\G\n```\n\n**日志关键段落解读**：\n\n```text\n------------------------\nLATEST DETECTED DEADLOCK\n------------------------\n2024-01-01 10:00:00 0x7f...\n\n*** (1) TRANSACTION:\nTRANSACTION 421234, ACTIVE 0 sec starting index read\nmysql tables in use 1, locked 1\nLOCK WAIT 3 lock struct(s)\n...\n*** (1) WAITING FOR THIS LOCK TO BE GRANTED:\nRECORD LOCKS space id 23 page no 3 n bits 72 index PRIMARY of table `test`.`t`\nlock_mode X locks rec but not gap waiting\n...\n\n*** (2) TRANSACTION:\nTRANSACTION 421235, ACTIVE 0 sec starting index read\n...\n*** (2) HOLDS THE LOCK(S):\nRECORD LOCKS space id 23 page no 3 n bits 72 index PRIMARY of table `test`.`t`\nlock_mode X locks rec but not gap\n...\n*** (2) WAITING FOR THIS LOCK TO BE GRANTED:\nRECORD LOCKS space id 23 page no 4 n bits 72 index PRIMARY of table `test`.`t`\nlock_mode X locks rec but not gap waiting\n\n*** WE ROLL BACK TRANSACTION (1)\n```\n\n**解读要点**：\n\n| 关键字 | 含义 |\n|--------|------|\n| TRANSACTION xxx | 涉及的事务ID |\n| lock_mode X | 排他锁 |\n| lock_mode S | 共享锁 |\n| locks rec but not gap | 行锁 |\n| locks gap | 间隙锁 |\n| ROLL BACK TRANSACTION (1) | 被回滚的事务 |\n\n---\n\n#### 7.4 本章小结\n\n| 概念 | 要点 |\n|------|------|\n| **两阶段锁** | 锁在需要时加，事务结束时释放 |\n| **死锁** | 循环等待导致相互阻塞 |\n| **死锁检测** | 默认开启，但有CPU开销 |\n| **优化方向** | 减少锁冲突、拆分热点行 |\n\n**思考题答案**：\n> 删除表前10000行数据，三种方法选哪个？\n>\n> **推荐方案二**：在一个连接中循环执行20次 `DELETE FROM T LIMIT 500`\n>\n> **分析**：\n>\n> - 方案一：一次删除太多行，事务太大，可能导致主从延迟\n> - 方案二：分批删除，每次删除后可以自动释放锁，对业务影响小\n> - 方案三：20个连接并发删除，可能造成大量锁竞争和死锁\n\n---", "subs": ["7.1 行锁基础", "7.2 两阶段锁协议", "7.3 死锁与死锁检测", "7.4 本章小结"]}, {"title": "第8章 事务可见性与一致性读深度剖析", "content": "> **核心要点**：本章深入讲解MVCC的工作原理、一致性视图的实现机制，以及\"快照读\"与\"当前读\"的区别，帮助你从底层理解事务隔离的实现。\n\n#### 8.1 问题引入\n\n在可重复读隔离级别下，考虑以下场景：\n\n```sql\nCREATE TABLE t (id INT PRIMARY KEY, k INT) ENGINE=InnoDB;\nINSERT INTO t VALUES(1,1),(2,2);\n```\n\n| 时刻 | 事务A | 事务B | 事务C |\n|------|-------|-------|-------|\n| T1 | start transaction with consistent snapshot; | | |\n| T2 | | start transaction with consistent snapshot; | |\n| T3 | | | UPDATE t SET k=k+1 WHERE id=1; (自动提交) |\n| T4 | | UPDATE t SET k=k+1 WHERE id=1; | |\n| T5 | | SELECT k FROM t WHERE id=1; | |\n| T6 | SELECT k FROM t WHERE id=1; | | |\n| T7 | | COMMIT; | |\n\n**结果**：事务A查到k=1，事务B查到k=3\n\n这看似矛盾：事务B在事务A之后启动，为什么查到的值更大？\n\n---\n\n#### 8.2 事务启动时机\n\n**关键区别**：\n\n| 命令 | 事务启动时机 |\n|------|-------------|\n| `BEGIN` / `START TRANSACTION` | 执行第一条SQL时才真正启动 |\n| `START TRANSACTION WITH CONSISTENT SNAPSHOT` | 命令执行时立即启动 |\n\n---\n\n#### 8.3 MVCC快照的实现原理\n\n##### 8.3.1 事务ID与行版本\n\nInnoDB为每个事务分配一个唯一的**事务ID（transaction id）**，按申请顺序递增。\n\n每行数据的每个版本都有一个**row trx_id**，记录生成该版本的事务ID。\n\n```mermaid\ngraph LR\n    subgraph Versions[\"数据版本链\"]\n        V4[\"V4: k=22<br/>row trx_id=25\"]\n        V3[\"V3: k=11<br/>row trx_id=20\"]\n        V2[\"V2: k=10<br/>row trx_id=15\"]\n        V1[\"V1: k=1<br/>row trx_id=10\"]\n    end\n    \n    V4 -->|\"undo log\"| V3\n    V3 -->|\"undo log\"| V2\n    V2 -->|\"undo log\"| V1\n```\n\n> [!NOTE]\n> 历史版本（V1、V2、V3）不是物理存储的，而是通过当前版本和undo log**计算**出来的。\n\n##### 8.3.2 一致性视图（Read View）的结构\n\n事务启动时，InnoDB构建一个**一致性视图**，包含：\n\n1. **活跃事务数组**：启动时所有\"已启动但未提交\"的事务ID\n2. **低水位**：数组中的最小事务ID\n3. **高水位**：当前系统已分配的最大事务ID + 1\n\n```mermaid\ngraph LR\n    subgraph ReadView[\"一致性视图\"]\n        L[\"低水位: min_trx_id\"]\n        A[\"活跃事务数组: [trx1, trx2, ...]\"]\n        H[\"高水位: max_trx_id + 1\"]\n    end\n```\n\n##### 8.3.3 数据可见性判断规则\n\n对于一个数据版本的row trx_id：\n\n```mermaid\ngraph TD\n    A[row trx_id] --> B{与高水位比较}\n    B -->|\">= 高水位\"| C[红色区域：不可见<br/>未来事务生成]\n    B -->|\"< 高水位\"| D{与低水位比较}\n    D -->|\"< 低水位\"| E[绿色区域：可见<br/>已提交的事务]\n    D -->|\">= 低水位\"| F{是否在活跃数组中}\n    F -->|在数组中| G[黄色区域：不可见<br/>未提交的事务]\n    F -->|不在数组中| H[黄色区域：可见<br/>已提交的事务]\n```\n\n**简化判断规则**：\n\n1. 版本未提交 → 不可见\n2. 版本已提交，但在视图创建**后**提交 → 不可见\n3. 版本已提交，且在视图创建**前**提交 → 可见\n4. 自己的更新 → 始终可见\n\n---\n\n#### 8.4 一致性读与当前读\n\n##### 8.4.1 一致性读（Consistent Read）\n\n普通的SELECT语句使用**一致性读**，根据视图判断数据可见性。\n\n```sql\nSELECT * FROM t WHERE id = 1;  -- 一致性读\n```\n\n##### 8.4.2 当前读（Current Read）\n\n以下语句使用**当前读**，读取数据的最新版本：\n\n```sql\n-- 加锁的SELECT\nSELECT * FROM t WHERE id = 1 LOCK IN SHARE MODE;  -- 加S锁\nSELECT * FROM t WHERE id = 1 FOR UPDATE;          -- 加X锁\n\n-- 更新语句\nUPDATE t SET k = k + 1 WHERE id = 1;\nDELETE FROM t WHERE id = 1;\nINSERT INTO t VALUES(...);\n```\n\n> [!IMPORTANT]\n> **更新语句必须使用当前读**，否则会丢失其他事务的更新。这就是为什么事务B能看到事务C的修改。\n\n**当前读 vs 快照读分类表**：\n\n| 语句类型 | 读取方式 | 说明 |\n|----------|----------|------|\n| `SELECT ...` | 快照读 | 读取视图创建时刻的版本 |\n| `SELECT ... LOCK IN SHARE MODE` | 当前读 | 加S锁，读最新已提交版本 |\n| `SELECT ... FOR UPDATE` | 当前读 | 加X锁，读最新已提交版本 |\n| `UPDATE ...` | 当前读 | 更新前需读取最新值 |\n| `DELETE ...` | 当前读 | 删除前需确定最新行 |\n| `INSERT ...` | 当前读 | 需检查唯一键冲突 |\n\n##### 8.4.3 回顾开头的问题\n\n```mermaid\nsequenceDiagram\n    participant A as 事务A (id=100)\n    participant B as 事务B (id=101)\n    participant C as 事务C (id=102)\n    \n    Note over A: 启动，视图[99,100]\n    Note over B: 启动，视图[99,100,101]\n    C->>C: UPDATE k=k+1 (k: 1->2)\n    Note over C: 提交\n    B->>B: UPDATE k=k+1 (当前读k=2, 更新为k=3)\n    B->>B: SELECT k (自己更新的，看到k=3)\n    A->>A: SELECT k (一致性读，看到k=1)\n```\n\n---\n\n#### 8.5 可重复读与读已提交的区别\n\n| 隔离级别 | 视图创建时机 |\n|----------|-------------|\n| 可重复读 | 事务启动时创建，整个事务共用 |\n| 读已提交 | 每条SQL执行前重新创建 |\n\n**读已提交下的结果**：\n\n- 事务A查询时，(1,2)已提交 → 可见，返回k=2\n- 事务B查询时，(1,3)是自己的更新 → 返回k=3\n\n---\n\n#### 8.6 本章小结\n\n| 概念 | 说明 |\n|------|------|\n| **事务ID** | 按申请顺序递增的唯一标识 |\n| **row trx_id** | 数据版本的创建者事务ID |\n| **一致性视图** | 活跃事务数组 + 高低水位 |\n| **一致性读** | 普通SELECT，根据视图判断可见性 |\n| **当前读** | 加锁SELECT和更新语句，读最新版本 |\n\n**思考题答案**：\n> 如何构造\"改不掉\"的情况？\n>\n> **场景**：事务A执行 `UPDATE t SET c=0 WHERE id=c`，但在此之前，另一个事务B修改了某行的c值，导致A看不到（当前读的版本id≠c）。\n>\n> **示例**：\n>\n> 1. 事务B先执行 `UPDATE t SET c=c+1 WHERE id=1`（c从1变成2）\n> 2. 事务A再执行 `UPDATE t SET c=0 WHERE id=c`\n> 3. 当前读时id=1的行c=2，条件id=c不满足，所以\"改不掉\"\n\n---", "subs": ["8.1 问题引入", "8.2 事务启动时机", "8.3 MVCC快照的实现原理", "8.4 一致性读与当前读", "8.5 可重复读与读已提交的区别", "8.6 本章小结"]}]}, {"title": "第二篇：MySQL实践优化", "sections": [{"title": "第9章 普通索引与唯一索引：选型指南", "content": "> **核心要点**：本章对比普通索引和唯一索引的性能差异，重点介绍change buffer机制及其适用场景，帮助你做出正确的索引选型决策。\n\n#### 9.1 查询性能对比\n\n对于等值查询，两类索引的性能差异**微乎其微**：\n\n| 索引类型 | 查询行为 |\n|----------|----------|\n| 普通索引 | 找到第一条满足条件的记录后，继续查找下一条直到不满足 |\n| 唯一索引 | 找到第一条满足条件的记录后，立即停止 |\n\n由于InnoDB按**数据页**读取（默认16KB），多查一条记录的成本几乎可以忽略。\n\n---\n\n#### 9.2 更新性能对比：Change Buffer机制\n\n##### 9.2.1 Change Buffer原理\n\n当更新的数据页**不在内存**时，InnoDB的处理方式不同：\n\n| 索引类型 | 更新流程 |\n|----------|----------|\n| 唯一索引 | 必须读取数据页到内存，判断唯一性后更新 |\n| 普通索引 | 将更新操作记录到change buffer，无需读取磁盘 |\n\n```mermaid\ngraph TD\n    A[UPDATE请求] --> B{目标页在内存?}\n    B -->|是| C[直接更新内存]\n    B -->|否| D{唯一索引?}\n    D -->|是| E[读磁盘到内存] --> C\n    D -->|否| F[写change buffer]\n    F --> G[返回成功]\n    C --> G\n```\n\n##### 9.2.2 Merge操作\n\nChange buffer中的操作会在以下时机**merge**到数据页：\n\n- 访问该数据页时\n- 后台线程定期merge\n- 数据库正常关闭\n\n##### 9.2.3 Change Buffer的适用场景\n\n| 业务模式 | Change Buffer效果 |\n|----------|-------------------|\n| **写多读少** | 效果最好（账单、日志系统） |\n| 写后立即读 | 反而有副作用 |\n\n> [!TIP]\n> **建议**：如果业务能保证数据唯一性，优先选择普通索引配合change buffer，性能更优。\n\n---\n\n#### 9.3 Change Buffer vs Redo Log\n\n| 机制 | 优化目标 |\n|------|----------|\n| Redo Log | 减少随机**写**磁盘IO（WAL） |\n| Change Buffer | 减少随机**读**磁盘IO |\n\n#### 9.4 Change Buffer配置参数\n\n```sql\n-- 查看change buffer相关参数\nSHOW VARIABLES LIKE 'innodb_change_buffer%';\n\n-- 设置change buffer最大占Buffer Pool的比例（默认25%）\nSET GLOBAL innodb_change_buffer_max_size = 25;\n\n-- 查看change buffer使用情况\nSHOW ENGINE INNODB STATUS\\G\n-- 查找 INSERT BUFFER AND ADAPTIVE HASH INDEX 段落\n```\n\n| 参数 | 说明 | 默认值 |\n|------|------|--------|\n| `innodb_change_buffer_max_size` | 占Buffer Pool的最大比例 | 25% |\n| `innodb_change_buffering` | 启用的操作类型 | all |\n\n**innodb_change_buffering取值**：\n\n| 值 | 缓冲的操作 |\n|----|-----------|\n| none | 不缓冲 |\n| inserts | 缓冲INSERT |\n| deletes | 缓冲DELETE标记操作 |\n| changes | 缓冲INSERT和DELETE标记 |\n| purges | 缓冲后台物理删除 |\n| all | 缓冲所有操作（默认） |\n\n#### 9.5 普通索引 vs 唯一索引决策树\n\n```mermaid\ngraph TD\n    A[需要创建索引] --> B{业务是否需要唯一约束?}\n    B -->|是| C[必须使用唯一索引]\n    B -->|否| D{业务能否保证数据唯一?}\n    D -->|是| E[推荐普通索引+change buffer]\n    D -->|否| F{读写比例?}\n    F -->|读多写少| G[唯一索引]\n    F -->|写多读少| E\n```\n\n---", "subs": ["9.1 查询性能对比", "9.2 更新性能对比：Change Buffer机制", "9.3 Change Buffer vs Redo Log", "9.4 Change Buffer配置参数", "9.5 普通索引 vs 唯一索引决策树"]}, {"title": "第10章 索引选择失误的根因分析与解决方案", "content": "> **核心要点**：优化器有时会选错索引。本章分析选错的原因，并提供多种解决方案。\n\n#### 10.1 优化器的选择逻辑\n\n优化器选择索引时考虑的因素：\n\n1. **扫描行数**（通过索引基数估算）\n2. **是否需要回表**\n3. **是否需要排序**\n4. **是否使用临时表**\n\n#### 10.2 索引基数与采样统计\n\n**基数（Cardinality）**：索引上不同值的个数，越大区分度越好。\n\n```sql\n-- 查看索引基数\nSHOW INDEX FROM table_name;\n```\n\n**采样统计的问题**：\n\n- InnoDB采样N个数据页估算\n- 数据变更超过1/M时重新统计\n- 采样导致统计值**不精确**\n\n#### 10.3 索引选错的解决方案\n\n| 方案 | 说明 | 适用场景 |\n|------|------|----------|\n| `ANALYZE TABLE` | 重新统计索引信息 | 统计信息偏差大 |\n| `FORCE INDEX` | 强制使用指定索引 | 临时解决方案 |\n| 修改SQL语句 | 引导优化器选择 | 有技巧要求 |\n| 新建/删除索引 | 提供更合适的选择 | 长期方案 |\n\n```sql\n-- 重新统计索引信息\nANALYZE TABLE t;\n\n-- 强制使用索引\nSELECT * FROM t FORCE INDEX(a) WHERE a BETWEEN 1 AND 1000;\n```\n\n#### 10.4 使用optimizer_trace诊断优化器选择\n\n```sql\n-- 开启optimizer_trace\nSET optimizer_trace = 'enabled=on';\n\n-- 执行查询\nSELECT * FROM t WHERE a BETWEEN 1 AND 1000;\n\n-- 查看优化器选择过程\nSELECT * FROM information_schema.optimizer_trace\\G\n\n-- 关闭trace\nSET optimizer_trace = 'enabled=off';\n```\n\n**trace输出关键段落**：\n\n```json\n{\n  \"analyzing_range_alternatives\": {\n    \"range_scan_alternatives\": [\n      {\n        \"index\": \"a\",\n        \"chosen\": true,\n        \"cost\": 123.45    // 估算成本\n      }\n    ]\n  }\n}\n```\n\n> [!TIP]\n> 通过对比不同索引的cost值，可以理解优化器为何选择或放弃某个索引。\n\n---", "subs": ["10.1 优化器的选择逻辑", "10.2 索引基数与采样统计", "10.3 索引选错的解决方案", "10.4 使用optimizer_trace诊断优化器选择"]}, {"title": "第11章 字符串字段索引优化技巧", "content": "> **核心要点**：本章介绍字符串字段的多种索引方案，包括前缀索引、倒序存储和hash字段。\n\n#### 11.1 前缀索引\n\n```sql\n-- 完整索引\nALTER TABLE t ADD INDEX idx_email(email);\n\n-- 前缀索引（只取前6个字节）\nALTER TABLE t ADD INDEX idx_email_6(email(6));\n```\n\n| 方式 | 空间占用 | 扫描行数 | 覆盖索引 |\n|------|----------|----------|---------|\n| 完整索引 | 大 | 少 | ✓ 支持 |\n| 前缀索引 | 小 | 可能多 | ✗ 不支持 |\n\n##### 确定前缀长度\n\n```sql\n-- 统计不同前缀长度的区分度\nSELECT \n  COUNT(DISTINCT LEFT(email, 4)) AS L4,\n  COUNT(DISTINCT LEFT(email, 5)) AS L5,\n  COUNT(DISTINCT LEFT(email, 6)) AS L6\nFROM t;\n```\n\n#### 11.2 前缀区分度不够时的方案\n\n##### 方案一：倒序存储\n\n适用于前缀相同、后缀不同的场景（如身份证号）：\n\n```sql\n-- 存储时倒序\nINSERT INTO t(id_card) VALUES(REVERSE('110101199001011234'));\n\n-- 查询时也倒序\nSELECT * FROM t WHERE id_card = REVERSE('110101199001011234');\n```\n\n##### 方案二：Hash字段\n\n```sql\n-- 增加hash字段\nALTER TABLE t ADD id_card_crc INT UNSIGNED, ADD INDEX(id_card_crc);\n\n-- 查询同时判断原值（防止hash冲突）\nSELECT * FROM t WHERE id_card_crc = CRC32('110101199001011234') \n                  AND id_card = '110101199001011234';\n```\n\n| 方案 | 额外空间 | CPU消耗 | 范围查询 |\n|------|----------|---------|----------|\n| 倒序存储 | 无 | reverse函数 | 不支持 |\n| Hash字段 | 4字节 | crc32函数 | 不支持 |\n\n---", "subs": ["11.1 前缀索引", "11.2 前缀区分度不够时的方案"]}, {"title": "第12章 MySQL性能抖动与Flush机制揭秘", "content": "> **核心要点**：SQL执行偶尔变慢可能是刷脏页导致的。本章讲解flush触发条件和优化策略。\n\n#### 12.1 脏页与干净页\n\n| 状态 | 定义 |\n|------|------|\n| **脏页** | 内存数据页与磁盘不一致（有修改未刷盘） |\n| **干净页** | 内存与磁盘数据一致 |\n\n#### 12.2 触发Flush的四种场景\n\n```mermaid\ngraph TD\n    A[Flush触发场景] --> B[redo log写满]\n    A --> C[内存不足需淘汰脏页]\n    A --> D[系统空闲时]\n    A --> E[数据库正常关闭]\n    \n    B --> F[\"严重：更新全部阻塞\"]\n    C --> G[\"常见：可能影响查询\"]\n    D --> H[\"正常：无影响\"]\n    E --> H\n```\n\n#### 12.3 Flush策略优化\n\n##### 核心参数\n\n```sql\n-- 设置磁盘IO能力（建议用fio测试后设置）\nSET GLOBAL innodb_io_capacity = 2000;\n\n-- 脏页比例上限（默认75%）\nSET GLOBAL innodb_max_dirty_pages_pct = 75;\n\n-- 是否连带刷邻居（SSD建议设为0）\nSET GLOBAL innodb_flush_neighbors = 0;\n```\n\n##### 监控脏页比例\n\n```sql\nSELECT \n  VARIABLE_VALUE INTO @dirty FROM global_status WHERE VARIABLE_NAME = 'Innodb_buffer_pool_pages_dirty';\nSELECT \n  VARIABLE_VALUE INTO @total FROM global_status WHERE VARIABLE_NAME = 'Innodb_buffer_pool_pages_total';\nSELECT @dirty/@total AS dirty_ratio;\n```\n\n> [!WARNING]\n> 脏页比例经常接近75%时，说明flush能力不足，需要调大innodb_io_capacity。\n\n#### 12.4 SSD vs HDD参数配置差异\n\n| 参数 | HDD推荐值 | SSD推荐值 | 说明 |\n|------|-----------|-----------|------|\n| `innodb_io_capacity` | 200-400 | 2000-10000 | 根据fio测试结果设置 |\n| `innodb_io_capacity_max` | 400-800 | 10000-40000 | 最大IO能力 |\n| `innodb_flush_neighbors` | 1 | 0 | SSD随机IO快，无需连带刷 |\n| `innodb_flush_method` | O_DIRECT | O_DIRECT | 两者相同 |\n\n**测试磁盘IO能力（fio工具）**：\n\n```bash\n# 测试随机写IOPS\nfio -filename=/data/test -direct=1 -iodepth 1 -thread \\\n    -rw=randwrite -ioengine=psync -bs=16k -size=500M \\\n    -numjobs=10 -runtime=10 -group_reporting -name=mytest\n```\n\n---", "subs": ["12.1 脏页与干净页", "12.2 触发Flush的四种场景", "12.3 Flush策略优化", "12.4 SSD vs HDD参数配置差异"]}, {"title": "第13章 数据删除与表空间回收机制", "content": "> **核心要点**：delete删除数据后，表文件大小不变。本章讲解空间回收的正确方法。\n\n#### 13.1 Delete的真实行为\n\ndelete命令只是将记录**标记**为可复用，并不释放磁盘空间：\n\n```mermaid\ngraph LR\n    A[DELETE操作] --> B[记录标记为deleted]\n    B --> C[空间可被后续插入复用]\n    C --> D[磁盘文件大小不变]\n```\n\n#### 13.2 表空间碎片的产生\n\n| 操作 | 碎片产生方式 |\n|------|-------------|\n| 删除记录 | 留下可复用的空洞 |\n| 随机插入 | 页分裂产生空洞 |\n| 更新索引 | 相当于删除+插入 |\n\n#### 13.3 重建表回收空间\n\n```sql\n-- 重建表（Online DDL，MySQL 5.6+）\nALTER TABLE t ENGINE=InnoDB;\n\n-- 等价写法\nALTER TABLE t ENGINE=InnoDB, ALGORITHM=inplace;\n```\n\n##### Online DDL流程\n\n```mermaid\nsequenceDiagram\n    participant DDL as ALTER TABLE\n    participant A as 表A\n    participant TMP as 临时文件\n    participant LOG as row log\n\n    DDL->>A: 获取MDL写锁\n    DDL->>DDL: 退化为MDL读锁\n    DDL->>A: 扫描数据\n    DDL->>TMP: 写入临时文件\n    A->>LOG: 记录期间的DML操作\n    DDL->>TMP: 应用row log\n    DDL->>A: 用临时文件替换\n```\n\n> [!TIP]\n> 对于大表重建，推荐使用 **gh-ost** 工具，对线上业务影响更小。\n\n---", "subs": ["13.1 Delete的真实行为", "13.2 表空间碎片的产生", "13.3 重建表回收空间"]}, {"title": "第14章 count(*)性能优化与统计方案", "content": "> **核心要点**：InnoDB的count(*)需要遍历全表。本章分析原因并提供高效统计方案。\n\n#### 14.1 不同引擎的count(*)实现\n\n| 引擎 | 实现方式 | 性能 |\n|------|----------|------|\n| MyISAM | 直接读取存储的行数 | O(1) |\n| InnoDB | 遍历全表逐行统计 | O(N) |\n\n**InnoDB为什么不存行数？**\n\n由于MVCC的存在，不同事务看到的行数可能不同，无法存储一个\"准确\"的值。\n\n#### 14.2 自行维护计数的方案\n\n##### 方案一：Redis计数\n\n| 优点 | 缺点 |\n|------|------|\n| 读写快 | 可能丢失更新 |\n| | 与MySQL数据不一致 |\n\n##### 方案二：数据库计数表（推荐）\n\n```sql\nCREATE TABLE counter (\n  table_name VARCHAR(64) PRIMARY KEY,\n  row_count BIGINT\n);\n```\n\n利用事务保证一致性：\n\n```sql\nBEGIN;\nINSERT INTO data_table VALUES(...);\nUPDATE counter SET row_count = row_count + 1 WHERE table_name = 'data_table';\nCOMMIT;\n```\n\n#### 14.3 不同count用法的效率\n\n```sql\ncount(*)      -- 优化过，不取值，最快\ncount(1)      -- 不取值，快\ncount(主键id)  -- 需要取id值\ncount(字段)    -- 需要取值并判断NULL，最慢\n```\n\n**效率排序**：`count(*) ≈ count(1) > count(主键id) > count(字段)`\n\n> [!TIP]\n> **结论**：尽量使用 `count(*)`。\n\n---", "subs": ["14.1 不同引擎的count(*)实现", "14.2 自行维护计数的方案", "14.3 不同count用法的效率"]}, {"title": "第15章 技术答疑：日志与索引常见问题", "content": "> **核心要点**：本章针对Redo Log、Binlog的两阶段提交进行深入答疑，并讨论一个索引设计案例。\n\n#### 15.1 两阶段提交的崩溃恢复\n\n崩溃恢复时的判断规则：\n\n1. 如果redo log里有**commit标识**，直接提交\n2. 如果redo log只有**prepare**，则判断对应binlog是否存在且完整：\n   - 是 → 提交事务\n   - 否 → 回滚事务\n\n**关键问答汇总**：\n\n| 问题 | 答案 |\n|------|------|\n| binlog如何判断完整？ | statement格式有COMMIT，row格式有XID event |\n| redo log与binlog如何关联？ | 通过XID字段 |\n| 为什么只有prepare+完整binlog就提交？ | binlog可能已传到备库，需保持一致 |\n| 只用binlog可以吗？ | 不行，binlog无法恢复\"数据页\" |\n| 只用redo log可以吗？ | 崩溃恢复可以，但无法归档和做主备复制 |\n| redo log设置多大？ | 建议4个文件，每个1GB |\n\n#### 15.2 数据最终落盘的来源\n\n**重要澄清**：\n\n- **正常运行**：数据落盘是从**内存**写入磁盘（脏页刷盘），跟redo log无关\n- **崩溃恢复**：数据页读入内存后，用redo log更新内存，然后再刷盘\n\n---", "subs": ["15.1 两阶段提交的崩溃恢复", "15.2 数据最终落盘的来源"]}, {"title": "第16章 ORDER BY排序原理与优化策略", "content": "> **核心要点**：本章详解ORDER BY的两种排序算法（全字段排序和rowid排序），以及如何通过联合索引避免排序。\n\n#### 16.1 全字段排序\n\n```mermaid\ngraph TD\n    A[使用city索引定位] --> B[回表取需要的字段]\n    B --> C[存入sort_buffer]\n    C --> D[继续取下一条]\n    D --> E{city满足?}\n    E -->|是| B\n    E -->|否| F[在sort_buffer排序]\n    F --> G[返回前N行]\n```\n\n**特点**：\n\n- 一次回表，将所有需要的字段放入sort_buffer\n- 排序后直接返回结果\n- 适用于内存足够的场景\n\n#### 16.2 Rowid排序\n\n当单行数据太大时（超过`max_length_for_sort_data`），MySQL切换为rowid排序：\n\n```mermaid\ngraph TD\n    A[使用city索引定位] --> B[回表取排序字段和主键id]\n    B --> C[存入sort_buffer]\n    C --> D{继续取?}\n    D -->|是| B\n    D -->|否| E[在sort_buffer排序]\n    E --> F[取前N个id]\n    F --> G[回表取完整数据]\n    G --> H[返回结果]\n```\n\n**特点**：\n\n- sort_buffer只存排序字段和主键\n- 排序后需要**二次回表**\n\n#### 16.3 利用联合索引避免排序\n\n```sql\n-- 原查询需要排序\nSELECT * FROM t WHERE city='杭州' ORDER BY name LIMIT 1000;\n\n-- 创建联合索引后，无需排序\nALTER TABLE t ADD INDEX city_name(city, name);\n```\n\n| 优化方案 | Extra | 说明 |\n|----------|-------|------|\n| 无优化 | Using filesort | 需要排序 |\n| 联合索引(city,name) | 无filesort | 利用索引有序性 |\n| 覆盖索引(city,name,age) | Using index | 无需回表 |\n\n#### 16.4 排序相关参数配置\n\n| 参数 | 说明 | 默认值 | 建议值 |\n|------|------|--------|--------|\n| `sort_buffer_size` | 排序缓冲区大小 | 256KB | 1-4MB |\n| `max_length_for_sort_data` | 触发rowid排序的阈值 | 1024字节 | 4096-8192 |\n| `max_sort_length` | 排序字段最大长度 | 1024 | 保持默认 |\n\n```sql\n-- 查看当前排序参数\nSHOW VARIABLES LIKE 'sort_buffer_size';\nSHOW VARIABLES LIKE 'max_length_for_sort_data';\n\n-- 调整参数（会话级）\nSET SESSION sort_buffer_size = 4*1024*1024;  -- 4MB\nSET SESSION max_length_for_sort_data = 8192;\n```\n\n**排序算法选择逻辑**：\n\n```mermaid\ngraph TD\n    A[需要排序] --> B{单行长度}\n    B -->|<= max_length_for_sort_data| C[全字段排序]\n    B -->|> max_length_for_sort_data| D[Rowid排序]\n    C --> E{sort_buffer够用?}\n    D --> F{sort_buffer够用?}\n    E -->|是| G[内存排序]\n    E -->|否| H[磁盘临时文件排序]\n    F -->|是| G\n    F -->|否| H\n```\n\n> [!TIP]\n> 优化排序的优先级：1.利用索引避免排序 > 2.调大sort_buffer > 3.减少返回字段\n\n---", "subs": ["16.1 全字段排序", "16.2 Rowid排序", "16.3 利用联合索引避免排序", "16.4 排序相关参数配置"]}, {"title": "第17章 随机数据查询的最佳实践", "content": "> **核心要点**：`ORDER BY rand()`性能极差，本章介绍更高效的随机查询方法。\n\n#### 17.1 ORDER BY rand()的问题\n\n```sql\nSELECT word FROM words ORDER BY rand() LIMIT 3;\n```\n\n**执行流程**：\n\n1. 创建临时表（内存或磁盘）\n2. 为每行生成随机数存入临时表\n3. 对临时表排序\n4. 取前3行\n\n**代价**：扫描行数 = 表行数 × 2 + 结果行数\n\n#### 17.2 更高效的随机算法\n\n##### 算法一：基于主键范围（不精确）\n\n```sql\nSELECT MAX(id), MIN(id) INTO @M, @N FROM t;\nSET @X = FLOOR((@M-@N+1)*rand() + @N);\nSELECT * FROM t WHERE id >= @X LIMIT 1;\n```\n\n**问题**：如果id有空洞，各行被选中概率不同。\n\n##### 算法二：基于行数（精确）\n\n```sql\nSELECT COUNT(*) INTO @C FROM t;\nSET @Y = FLOOR(@C * rand());\nSET @sql = CONCAT(\"SELECT * FROM t LIMIT \", @Y, \",1\");\nPREPARE stmt FROM @sql;\nEXECUTE stmt;\n```\n\n**扫描行数**：C + Y + 1（远小于ORDER BY rand()）\n\n---", "subs": ["17.1 ORDER BY rand()的问题", "17.2 更高效的随机算法"]}, {"title": "第18章 SQL等价语句的性能差异分析", "content": "> **核心要点**：逻辑等价的SQL语句，性能可能天差地别。核心原因是**对索引字段做函数操作会导致全索引扫描**。\n\n#### 18.1 案例一：条件字段函数操作\n\n```sql\n-- 慢：无法使用索引快速定位\nSELECT COUNT(*) FROM tradelog WHERE month(t_modified) = 7;\n\n-- 快：使用范围查询\nSELECT COUNT(*) FROM tradelog \nWHERE (t_modified >= '2016-7-1' AND t_modified < '2016-8-1')\n   OR (t_modified >= '2017-7-1' AND t_modified < '2017-8-1');\n```\n\n#### 18.2 案例二：隐式类型转换\n\n```sql\n-- 慢：tradeid是varchar，发生隐式转换\nSELECT * FROM tradelog WHERE tradeid = 110717;\n\n-- 相当于\nSELECT * FROM tradelog WHERE CAST(tradeid AS signed int) = 110717;\n```\n\n**MySQL转换规则**：字符串和数字比较时，**字符串转数字**。\n\n#### 18.3 案例三：隐式字符编码转换\n\n```sql\n-- 两表字符集不同时（utf8 vs utf8mb4）\nSELECT * FROM tradelog l, trade_detail d \nWHERE d.tradeid = l.tradeid AND l.id = 2;\n```\n\n**问题**：被驱动表的tradeid需要转换编码（utf8→utf8mb4），相当于对索引字段做函数操作。\n\n**解决方案**：\n\n```sql\n-- 方案一：修改字段字符集\nALTER TABLE trade_detail MODIFY tradeid VARCHAR(32) CHARACTER SET utf8mb4;\n\n-- 方案二：手动转换驱动表字段\nSELECT * FROM tradelog l, trade_detail d \nWHERE d.tradeid = CONVERT(l.tradeid USING utf8) AND l.id = 2;\n```\n\n---", "subs": ["18.1 案例一：条件字段函数操作", "18.2 案例二：隐式类型转换", "18.3 案例三：隐式字符编码转换"]}, {"title": "第19章 单行查询慢的原因诊断", "content": "> **核心要点**：查一行数据也可能很慢，原因可能是锁等待或一致性读回溯。\n\n#### 19.1 查询长时间不返回\n\n使用`SHOW PROCESSLIST`诊断：\n\n| 状态 | 原因 | 解决方案 |\n|------|------|----------|\n| Waiting for table metadata lock | MDL锁等待 | kill持有MDL写锁的线程 |\n| Waiting for table flush | flush被阻塞 | kill阻塞flush的长查询 |\n| 无特殊状态 | 等待行锁 | 查sys.innodb_lock_waits |\n\n```sql\n-- 查找MDL锁\nSELECT * FROM sys.schema_table_lock_waits;\n\n-- 查找行锁\nSELECT * FROM sys.innodb_lock_waits WHERE locked_table = '`test`.`t`';\n```\n\n#### 19.2 查询执行慢\n\n**场景**：一致性读需要回溯大量undo log\n\n```mermaid\nsequenceDiagram\n    participant A as Session A\n    participant B as Session B\n\n    A->>A: START TRANSACTION WITH CONSISTENT SNAPSHOT\n    B->>B: UPDATE t SET c=c+1 WHERE id=1 (执行100万次)\n    A->>A: SELECT * FROM t WHERE id=1\n    Note over A: 需要从100万个版本回溯到事务开始时的版本\n```\n\n**结论**：\n\n- 普通SELECT是一致性读，需要回溯undo log\n- 加锁SELECT是当前读，直接读取最新版本\n\n---", "subs": ["19.1 查询长时间不返回", "19.2 查询执行慢"]}, {"title": "第20章 幻读现象与间隙锁防护机制", "content": "> **核心要点**：行锁无法防止新行插入，需要间隙锁（Gap Lock）来解决幻读问题。\n\n#### 20.1 什么是幻读\n\n**幻读定义**：同一事务中，前后两次查询同一范围，后一次看到了前一次没有的**新插入行**。\n\n> [!NOTE]\n> 幻读仅指\"新插入的行\"，不包括其他事务的更新。\n\n#### 20.2 幻读的问题\n\n1. **语义破坏**：FOR UPDATE声明\"锁住所有满足条件的行\"，但无法锁住还不存在的行\n2. **数据不一致**：binlog顺序与实际执行顺序不同，导致备库数据不一致\n\n#### 20.3 间隙锁（Gap Lock）\n\n```mermaid\ngraph LR\n    subgraph 表t\n        R0[\"(0,0,0)\"]\n        G1[\"间隙\"]\n        R5[\"(5,5,5)\"]\n        G2[\"间隙\"]\n        R10[\"(10,10,10)\"]\n    end\n```\n\n**间隙锁特性**：\n\n- 锁的是两个值之间的\"空隙\"\n- 间隙锁之间**不冲突**\n- 间隙锁只与\"往间隙插入数据\"这个操作冲突\n\n#### 20.4 Next-Key Lock\n\n**Next-Key Lock = 间隙锁 + 行锁**，是前开后闭区间。\n\n例如表t初始化后，会产生这些next-key lock：\n`(-∞,0]、(0,5]、(5,10]、(10,15]、(15,20]、(20,25]、(25,+∞)`\n\n> [!CAUTION]\n> 间隙锁可能导致死锁，因为两个事务可以同时持有同一个间隙的间隙锁，然后互相阻塞对方的插入操作。\n\n---", "subs": ["20.1 什么是幻读", "20.2 幻读的问题", "20.3 间隙锁（Gap Lock）", "20.4 Next-Key Lock"]}, {"title": "第21章 单行更新的加锁规则详解", "content": "> **核心要点**：本章总结InnoDB的加锁规则，包含两个原则、两个优化和一个bug。\n\n#### 21.1 加锁规则总结\n\n| 类型 | 规则 |\n|------|------|\n| **原则1** | 加锁的基本单位是next-key lock（前开后闭区间） |\n| **原则2** | 查找过程中访问到的对象才会加锁 |\n| **优化1** | 唯一索引上的等值查询，next-key lock退化为**行锁** |\n| **优化2** | 索引上的等值查询，向右遍历且最后一个值不满足条件时，退化为**间隙锁** |\n| **Bug** | 唯一索引上的范围查询会访问到不满足条件的第一个值为止 |\n\n#### 21.3 更多案例分析\n\n##### 案例1：主键索引范围锁\n\n```sql\n-- 表t初始化数据: (0,0,0),(5,5,5),(10,10,10),(15,15,15),(20,20,20),(25,25,25)\n-- Session A:\nBEGIN;\nSELECT * FROM t WHERE id >= 10 AND id < 11 FOR UPDATE;\n```\n\n**加锁分析**：\n\n1. 从id=10开始，扫描到第一个满足条件的行\n2. id=10加next-key lock (5,10]\n3. 由于是唯一索引等值查询，退化为**行锁**\n4. 继续扫描到id=15，不满足条件，但范围查询会加上(10,15]\n\n**结论**：最终加锁范围是 `id=10行锁` + `(10,15] next-key lock`\n\n##### 案例2：非唯一索引等值锁\n\n```sql\n-- Session A:\nBEGIN;\nSELECT id FROM t WHERE c = 5 LOCK IN SHARE MODE;\n```\n\n**加锁分析**：\n\n1. 在索引c上加(0,5] next-key lock\n2. 继续向右遍历到c=10，不满足条件\n3. 根据优化2，退化为间隙锁(5,10)\n4. 由于是覆盖索引查询，主键索引上**不加锁**\n\n**验证方法**：\n\n```sql\n-- Session B 可以执行（主键不加锁）\nUPDATE t SET d = d + 1 WHERE id = 5;  -- ✓ 成功\n\n-- Session C 会阻塞（c索引有间隙锁）\nINSERT INTO t VALUES (7, 7, 7);  -- ✗ 阻塞\n```\n\n##### 案例3：唯一索引范围锁的Bug\n\n```sql\n-- Session A:\nBEGIN;\nSELECT * FROM t WHERE id > 10 AND id <= 15 FOR UPDATE;\n```\n\n**预期**：只锁(10,15]\n**实际**：还会加上(15,20] next-key lock\n\n**原因**：InnoDB会向右扫描到第一个不满足条件的值为止\n\n#### 21.4 锁诊断命令\n\n##### 查看当前锁等待\n\n```sql\n-- 查看锁等待关系\nSELECT * FROM sys.innodb_lock_waits\\G\n\n-- 输出示例：\n-- wait_started: 2024-01-01 10:00:00\n-- wait_age: 00:00:03\n-- locked_table: `test`.`t`\n-- waiting_trx_id: 421234\n-- blocking_trx_id: 421230\n```\n\n##### 查看死锁日志\n\n```sql\n-- 查看最近一次死锁信息\nSHOW ENGINE INNODB STATUS\\G\n\n-- 关键段落：\n-- LATEST DETECTED DEADLOCK\n-- *** (1) TRANSACTION\n-- *** (1) WAITING FOR THIS LOCK TO BE GRANTED\n-- *** (2) TRANSACTION\n-- *** (2) HOLDS THE LOCK(S)\n-- *** WE ROLL BACK TRANSACTION (1)\n```\n\n##### 查看当前活跃锁\n\n```sql\n-- MySQL 8.0+\nSELECT * FROM performance_schema.data_locks;\n\n-- MySQL 5.7\nSELECT * FROM information_schema.innodb_locks;\n```\n\n#### 21.5 实践建议\n\n| 建议 | 说明 | 效果 |\n|------|------|------|\n| 删除语句加LIMIT | `DELETE FROM t WHERE c = 5 LIMIT 1;` | 减少锁范围 |\n| 使用读已提交隔离级别 | 无间隙锁，锁范围更小 | 需配合binlog_format=row |\n| 控制事务大小 | 避免大事务持锁时间过长 | 减少冲突概率 |\n| 精确查询条件 | 避免范围查询扫描过多数据 | 减少加锁行数 |\n\n---", "subs": ["21.1 加锁规则总结", "21.3 更多案例分析", "21.4 锁诊断命令", "21.5 实践建议"]}, {"title": "第22章 紧急场景下的性能优化手段", "content": "> **核心要点**：本章介绍业务高峰期临时提升MySQL性能的\"饮鸩止渴\"方法，这些方法有风险，仅用于紧急救火。\n\n#### 22.1 短连接风暴\n\n当连接数暴涨超过`max_connections`时的处理方法：\n\n| 方法 | 说明 | 风险 |\n|------|------|------|\n| 直接调高max_connections | 增加连接容量 | 可能加剧压力 |\n| kill掉事务外空闲连接 | 释放不必要的连接 | 低风险 |\n| kill掉事务内空闲连接 | 事务会回滚 | 需谨慎 |\n| 使用--skip-grant-tables | 跳过权限验证 | **极高风险** |\n\n**判断事务状态**：\n\n```sql\n-- 查看哪些线程在事务中\nSELECT * FROM information_schema.innodb_trx;\n-- trx_mysql_thread_id 就是线程id\n```\n\n#### 22.2 慢查询性能问题\n\n| 原因 | 紧急处理方案 |\n|------|--------------|\n| 索引没设计好 | 直接执行ALTER TABLE（Online DDL） |\n| SQL语句没写好 | 使用query_rewrite功能改写 |\n| MySQL选错索引 | 使用force index |\n\n**query_rewrite用法**：\n\n```sql\nINSERT INTO query_rewrite.rewrite_rules(pattern, replacement, pattern_database)\nVALUES ('select * from t where id + 1 = ?', 'select * from t where id = ? - 1', 'test');\nCALL query_rewrite.flush_rewrite_rules();\n```\n\n#### 22.3 QPS突增问题\n\n1. 如果是新业务导致：去掉白名单或删除账号\n2. 如果无法下线：用query_rewrite把语句改写为`SELECT 1`\n\n#### 22.4 kill命令详解\n\n**kill connection vs kill query**：\n\n| 命令 | 说明 | 风险 |\n|------|------|------|\n| `KILL QUERY <id>` | 终止当前正在执行的语句 | 事务继续，可重试 |\n| `KILL CONNECTION <id>` | 断开整个连接 | 事务回滚 |\n| `KILL <id>` | 等同于KILL CONNECTION | 事务回滚 |\n\n```sql\n-- 查找需要kill的连接\nSELECT id, user, host, time, state, info \nFROM information_schema.processlist \nWHERE command != 'Sleep' AND time > 60;\n\n-- 终止查询但保持连接\nKILL QUERY 12345;\n\n-- 断开连接（事务会回滚）\nKILL CONNECTION 12345;\n```\n\n> [!WARNING]\n> kill大事务时，回滚可能需要很长时间。建议先KILL QUERY，等待事务完成后再断开连接。\n\n#### 22.5 pt-query-digest使用示例\n\n**安装**：\n\n```bash\n# Percona Toolkit\nyum install percona-toolkit\n# 或\napt-get install percona-toolkit\n```\n\n**分析慢查询日志**：\n\n```bash\n# 基本分析\npt-query-digest /var/log/mysql/slow.log\n\n# 输出前20条最慢查询\npt-query-digest --limit=20 /var/log/mysql/slow.log\n\n# 分析时间范围内的查询\npt-query-digest --since=\"2024-01-01 00:00:00\" --until=\"2024-01-01 12:00:00\" slow.log\n```\n\n#### 22.6 force index适用场景\n\n| 场景 | 是否适用 | 原因 |\n|------|----------|------|\n| 优化器统计信息不准 | ✅ 适用 | 临时强制使用正确索引 |\n| 索引设计有问题 | ❌ 不适用 | 应修改索引设计 |\n| SQL语句有问题 | ❌ 不适用 | 应优化SQL |\n| 数据分布不均匀 | ✅ 适用 | 配合ANALYZE TABLE |\n\n```sql\n-- 强制使用指定索引\nSELECT * FROM orders FORCE INDEX(idx_user_id) \nWHERE user_id = 123 AND status = 'paid';\n```\n\n---", "subs": ["22.1 短连接风暴", "22.2 慢查询性能问题", "22.3 QPS突增问题", "22.4 kill命令详解", "22.5 pt-query-digest使用示例", "22.6 force index适用场景"]}, {"title": "第23章 数据持久化与刷盘策略", "content": "> **核心要点**：本章深入讲解binlog和redo log的写入机制、组提交优化以及\"双1\"配置的含义。\n\n#### 23.1 Binlog写入机制\n\n```mermaid\ngraph LR\n    A[binlog cache] -->|write| B[page cache]\n    B -->|fsync| C[磁盘]\n```\n\n**sync_binlog参数**：\n\n| 值 | 行为 |\n|----|------|\n| 0 | 只write，由OS决定何时fsync |\n| 1 | 每次提交都fsync |\n| N | 每N次提交fsync一次 |\n\n#### 23.2 Redo Log写入机制\n\n**innodb_flush_log_at_trx_commit参数**：\n\n| 值 | 行为 |\n|----|------|\n| 0 | 只留在redo log buffer |\n| 1 | 每次提交都fsync |\n| 2 | 每次提交write到page cache |\n\n#### 23.3 组提交（Group Commit）\n\n```mermaid\nsequenceDiagram\n    participant T1 as trx1\n    participant T2 as trx2\n    participant T3 as trx3\n    participant L as Leader\n\n    T1->>L: 准备提交 LSN=50\n    T2->>L: 准备提交 LSN=120\n    T3->>L: 准备提交 LSN=160\n    L->>L: fsync LSN=160\n    L-->>T1: 完成\n    L-->>T2: 完成\n    L-->>T3: 完成\n```\n\n**双1配置**：`sync_binlog=1 && innodb_flush_log_at_trx_commit=1`\n\n> [!IMPORTANT]\n> 双1配置最安全但性能最低，在IO瓶颈时可适当调整。\n\n---", "subs": ["23.1 Binlog写入机制", "23.2 Redo Log写入机制", "23.3 组提交（Group Commit）"]}, {"title": "第24章 主从复制与数据一致性保障", "content": "> **核心要点**：本章介绍binlog格式、主备同步原理以及循环复制问题的解决。\n\n#### 24.1 主备同步流程\n\n```mermaid\nsequenceDiagram\n    participant M as 主库\n    participant S as 备库\n\n    S->>M: CHANGE MASTER TO\n    S->>S: START SLAVE\n    S->>M: 请求binlog\n    M->>S: 发送binlog\n    S->>S: 写入relay log\n    S->>S: SQL线程执行relay log\n```\n\n#### 24.2 Binlog三种格式对比\n\n| 格式 | 内容 | 优点 | 缺点 |\n|------|------|------|------|\n| statement | SQL原文 | 日志量小 | 可能主备不一致 |\n| row | 行数据 | 精确可恢复数据 | 日志量大 |\n| mixed | 自动选择 | 折中 | 不常用 |\n\n> [!TIP]\n> **建议**：生产环境建议使用row格式，便于数据恢复。\n\n#### 24.3 循环复制问题\n\n在双M结构中，通过`server_id`防止循环复制：\n\n1. 主备`server_id`必须不同\n2. 备库重放binlog时保留原`server_id`\n3. 收到与自己`server_id`相同的日志时丢弃\n\n---", "subs": ["24.1 主备同步流程", "24.2 Binlog三种格式对比", "24.3 循环复制问题"]}, {"title": "第25章 高可用架构与故障切换策略", "content": "> **核心要点**：主备延迟是影响高可用的关键因素，本章分析延迟原因和切换策略。\n\n#### 25.1 主备延迟来源\n\n| 来源 | 解决方案 |\n|------|----------|\n| 备库机器性能差 | 对称部署 |\n| 备库压力大 | 一主多从 |\n| 大事务 | 拆分事务使用gh-ost |\n| 大表DDL | 使用gh-ost |\n| 备库并行复制能力差 | 升级并行复制策略 |\n\n**查看主备延迟**：\n\n```sql\nSHOW SLAVE STATUS\\G\n-- seconds_behind_master: 延迟秒数\n```\n\n#### 25.2 主备切换策略\n\n```mermaid\ngraph TD\n    A[检测SBM小于5秒] -->|是| B[主库设为只读]\n    B --> C[等待SBM等于0]\n    C --> D[备库设为可读写]\n    D --> E[切换业务连接]\n    A -->|否| A\n```\n\n| 策略 | 特点 | 适用场景 |\n|------|------|----------|\n| 可靠性优先 | 有不可用时间数据一致 | 大多数场景 |\n| 可用性优先 | 几乎无不可用时间可能数据不一致 | 日志类系统 |\n\n#### 25.3 seconds_behind_master计算方式\n\n```text\nseconds_behind_master = 备库当前时间 - binlog事件时间戳\n\n备库当前时间: 执行relay log中某事件的时刻\nbinlog事件时间戳: 主库执行该事件时记录的时间\n```\n\n**SBM不准确的情况**：\n\n| 情况 | 原因 | 解决方案 |\n|------|------|----------|\n| 网络延迟 | binlog才刚到备库 | 配合pt-heartbeat |\n| 并行复制 | 某个worker阻塞 | 检查各worker状态 |\n| 大事务 | 一个事务执行很久 | 拆分大事务 |\n\n#### 25.4 主备切换脚本示例\n\n```bash\n#!/bin/bash\n# 可靠性优先切换脚本\n\nMASTER_HOST=\"192.168.1.1\"\nSLAVE_HOST=\"192.168.1.2\"\n\n# 1. 检查从库延迟\nSBM=$(mysql -h $SLAVE_HOST -e \"SHOW SLAVE STATUS\\G\" | grep Seconds_Behind_Master | awk '{print $2}')\nif [ \"$SBM\" -gt 5 ]; then\n    echo \"Slave delay too high: $SBM seconds\"\n    exit 1\nfi\n\n# 2. 主库设为只读\nmysql -h $MASTER_HOST -e \"SET GLOBAL read_only=ON;\"\n\n# 3. 等待从库追上\nwhile [ \"$SBM\" -ne 0 ]; do\n    sleep 1\n    SBM=$(mysql -h $SLAVE_HOST -e \"SHOW SLAVE STATUS\\G\" | grep Seconds_Behind_Master | awk '{print $2}')\ndone\n\n# 4. 从库设为可写\nmysql -h $SLAVE_HOST -e \"STOP SLAVE; SET GLOBAL read_only=OFF;\"\n\necho \"Switch completed!\"\n```\n\n---", "subs": ["25.1 主备延迟来源", "25.2 主备切换策略", "25.3 seconds_behind_master计算方式", "25.4 主备切换脚本示例"]}, {"title": "第26章 主从延迟的原因与优化方案", "content": "> **核心要点**：本章介绍MySQL各版本的并行复制策略演进。\n\n#### 26.1 并行复制基本原则\n\n1. 不能造成更新覆盖（同一行的事务必须在同一worker）\n2. 同一事务不能被拆开\n\n#### 26.2 并行复制策略演进\n\n| 版本 | 策略 | 说明 |\n|------|------|------|\n| 5.5 | 单线程 | 无并行复制 |\n| 5.6 | 按库并行 | 适用于多库场景 |\n| MariaDB | 按组提交 | 同一组的事务可并行 |\n| 5.7 | LOGICAL_CLOCK | 同时处于prepare状态的事务可并行 |\n| 5.7.22 | WRITESET | 基于行的写集合 |\n\n**WRITESET策略优势**：\n\n- 主库生成writeset写入binlog\n- 备库不需要解析binlog内容\n- 支持statement格式\n\n```sql\n-- 配置参数\nSET binlog_transaction_dependency_tracking = 'WRITESET';\n```\n\n#### 26.3 并行复制参数配置详解\n\n| 参数 | 说明 | 建议值 |\n|------|------|--------|\n| `slave_parallel_workers` | 并行复制worker数量 | 8-16 |\n| `slave_parallel_type` | 并行策略类型 | LOGICAL_CLOCK |\n| `binlog_transaction_dependency_tracking` | 依赖跟踪方式 | WRITESET |\n| `slave_preserve_commit_order` | 保持提交顺序 | ON |\n\n```sql\n-- 从库配置并行复制（
