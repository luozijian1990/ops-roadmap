<script id="data" type="application/json">{"title": "Loki 学习笔记 · 第二卷：架构、存储与部署", "intro": "> 面向已经完成文件或 OTLP 日志接入的运维、SRE 与平台工程师。重点是数据在哪里、谁拥有状态，以及故障时哪些操作仍能成立。\n> 资料核查：2026-09-24。Loki 3.7.8，Community Helm Chart 18.13.5；Chart 与应用版本独立锁定。[Loki 3.7.8 发布][S-release-loki][Chart 18.13.5 发布][S-chart-release]\n> 示例中的资源大小是学习起点，不是压测结论。没有执行真实 Kubernetes、S3、Helm 渲染或 Loki 集群联调；实际验收必须包含配置校验、渲染审查、持久化检查和故障测试。\n> 默认沿用第一卷 `lab/`。新存储实验使用新数据目录或新 Release，不覆盖已有实验的历史 Schema。\n\n| 章节 | 学完后应能回答的问题 |\n| --- | --- |\n| 第 9 章 | 组件名称、部署进程和数据状态是什么关系？ |\n| 第 10 章 | 写入成功时，哪些副本已经保存了什么？ |\n| 第 11 章 | 查询为什么有时读内存、有时读对象存储？ |\n| 第 12 章 | Schema 变更为什么必须保留旧时间段？ |\n| 第 13 章 | S3 接入失败时，如何区分认证、路径与存储布局？ |\n| 第 14 章 | 单体高可用需要哪些条件，而不只是 replicas=3？ |\n| 第 15 章 | 微服务拆分如何对应独立的资源与故障边界？ |\n| 第 16 章 | 保留策略、删除标记和对象生命周期怎样协作？ |", "parts": [{"title": "第 9 章：组件职责与整体数据流", "sections": [{"title": "9.1 同一二进制可以承担不同角色", "content": "Loki 将多个逻辑组件编译在同一个程序中，通过启动 target 选择实际运行的模块。第一卷的单体实例没有消除这些职责，只是把它们放进同一个进程。分布式部署则把职责分到不同工作负载，增加独立扩缩容能力，也增加网络与状态管理成本。[Loki 架构][S-architecture][Loki 组件][S-components]\n\n因此，“看见三个 Pod”不能说明正在使用三副本，也不能说明有三个独立日志后端。先检查实际启动参数、挂载配置和服务路由，再判断组件分工。\n\n```bash\n# 在第一卷 lab 中，只读检查镜像、启动参数和构建信息。\ndocker compose images\ndocker compose config --quiet\ncurl --fail --show-error \\\n  http://127.0.0.1:3100/loki/api/v1/status/buildinfo\n\n# 固定版本二进制可列出支持的 targets。\ndocker compose run --rm --no-deps loki -list-targets\n```\n\nKubernetes 中也要检查容器 args，而不是仅依赖 Deployment 的名字。名字叫 `loki-write` 的工作负载可能在迁移后改变了 target；旧 ConfigMap 的挂载也可能没有随新镜像更新。", "subs": []}, {"title": "9.2 把请求路径与后台任务分开", "content": "请求进入时最容易观察到的是 HTTP 成功或失败，后台组件却承担长期保存和清理。缺少后台健康监控时，系统可以暂时读写正常，随后逐步出现容量和历史查询问题。\n\n| 逻辑角色 | 主要工作 | 主要状态或依赖 |\n| --- | --- | --- |\n| Distributor | 接收、校验、限流、选择写入副本 | Ring 视图、租户限制、下游连接 |\n| Ingester | 接收日志、维护最近流与 Chunk、WAL、上传 | 内存流、WAL、本地工作目录、对象存储 |\n| Query Frontend | 查询入口、拆分、结果合并、部分缓存协作 | 查询上下文、缓存与调度连接 |\n| Query Scheduler | 查询排队与分配 | 等待队列、租户公平性、工作连接 |\n| Querier | 执行查询、读取最近和历史数据、聚合 | 查询内存、对象读、Ingester RPC |\n| Index Gateway | 提供索引访问能力 | 本地索引副本、同步与对象存储 |\n| Compactor | 压缩索引、保留与删除处理 | 工作目录、删除标记、请求存储 |\n| Ruler | 定时计算规则与产生派生指标/告警 | 规则、计算状态、remote write WAL |\n\n上表用于定位责任，并不意味着所有模式都会独立部署所有角色。单体下部分内部调用与分布式网络路径不同；当前实验不主动启用 Bloom 等可选组件。[Loki 组件][S-components]", "subs": []}, {"title": "9.3 在图中标出两种主要路径", "content": "```mermaid\nflowchart LR\n    A[Alloy] --> W[可信入口与 Distributor]\n    W --> I1[Ingester A]\n    W --> I2[Ingester B]\n    W --> I3[Ingester C]\n    I1 --> O[对象存储 TSDB 与 Chunks]\n    I2 --> O\n    I3 --> O\n    U[Grafana 或 LogCLI] --> F[Query Frontend]\n    F --> S[Query Scheduler]\n    S --> Q[Querier]\n    Q --> I1\n    Q --> I2\n    Q --> I3\n    Q --> X[Index Gateway]\n    X --> O\n    Q --> O\n    C[Compactor] --> O\n```\n\n图里没有画出全部监控与控制面请求，也没有把缓存当作唯一事实来源。理解架构时，先问某条日志当前是否还在 Ingester，再问历史索引与 Chunk 能否从对象存储重新找到。\n\n把 Grafana 直接连某个随机组件的 HTTP 端口，可能导致部分 API 正常、另一些返回 404。微服务模式的入口必须把写入、查询、规则管理和删除等路径转到正确角色。第四卷安全章节还要进一步限制哪些角色允许调用哪些路径。", "subs": []}, {"title": "9.4 区分数据面、控制面和缓存", "content": "数据面承担日志内容的流动，控制面让组件知道成员、配置和租户限制，缓存减少重复工作。三者任何一个异常都可能表现成“查不到”，但修复方法不同。\n\n```text\n数据面：日志请求、Chunk 上传、查询结果。\n控制面：Ring 成员、服务发现、配置与运行时限制。\n缓存：索引下载副本、Chunk 缓存、查询结果缓存。\n```\n\n例如对象存储权限失效是数据路径问题；memberlist 无法互通是成员发现问题；缓存容量太小可能只是查询性能下降。不要遇到查询慢就重建 Ring，也不要把临时缓存清空当作所有存储故障的修复方式。\n\n| 场景 | 先验证 | 错误操作的风险 |\n| --- | --- | --- |\n| 所有写入副本突然不健康 | Ring 和网络 | 删除 WAL 不能修复成员发现 |\n| 历史查询出现对象 403 | 存储身份与权限 | 增加 Querier 只会增加失败请求 |\n| 某次重启后查询暂时变慢 | 缓存冷启动 | 反复重启导致缓存永远不热 |\n| 清理长期没有进展 | Compactor 与删除权限 | 缩短保留期可能加剧任务量 |", "subs": []}, {"title": "9.5 用状态所有权决定扩容与备份", "content": "“无状态组件”通常表示不拥有必须长期保留的日志事实，并不表示可以在任意时刻杀死进程而毫无影响。查询队列、重试批次和进行中的请求仍可能被中断。\n\n| 状态 | 所有者 | 扩容后的处理 | 是否可只靠重建进程恢复 |\n| --- | --- | --- | --- |\n| 未刷新的日志 Chunk | Ingester | 旧实例仍须排空或恢复 | 取决于副本、WAL与存储 |\n| 源文件读取位置 | Alloy 文件组件 | 保持节点和组件归属 | 丢失后可能重读或跳过 |\n| 正在等待的查询 | Frontend/Scheduler | 客户端可能重试 | 不能还原用户已经超时的请求 |\n| 已上传日志与索引 | 对象存储 | 所有读写节点遵守同一布局 | 依赖对象仍存在 |\n| Compactor 删除标记 | 本地持久目录或受支持对象标记 | 不可任意遗失 | 遗失可能使清理悬而未决 |\n| 规则定义 | 配置库或 Ruler 存储 | 统一发布 | 没有外部副本就会丢失策略 |\n\n初始部署设计时给每个状态写一个“归属、保存位置、恢复来源”。这一张表，比单独增加一个名为 backup 的定时任务更接近可恢复系统。", "subs": []}]}, {"title": "第 10 章：写入、Ring、副本与 WAL", "sections": [{"title": "10.1 一次 HTTP Push 内部可能包含多个流", "content": "客户端批量发送的请求可包含多个流和多条日志。Distributor 根据租户及标签集合定位目标 Ingester，并进行协议、时间、标签和配额校验。一个请求失败，不应该直接解释为“里面所有行都完全没有到达”，重试必须考虑部分处理与响应丢失的可能。[Loki HTTP API][S-http][Loki 组件][S-components]\n\n```mermaid\nsequenceDiagram\n    participant A as Alloy\n    participant D as Distributor\n    participant I as Ingester 副本集合\n    participant O as 对象存储\n    A->>D: 一批日志\n    D->>D: 身份与限制检查\n    D->>I: 按流分发并复制\n    I->>I: WAL 与最近 Chunk 处理\n    I-->>D: 副本确认\n    D-->>A: 满足写入确认条件\n    I->>O: 后续上传 Chunk 与索引\n```\n\n最后一条对象存储上传不是默认等待每个 HTTP Push 同步完成的阶段。因此，“Push 返回成功”不等于“所有日志已经出现在对象存储最终对象里”。需要区分短期可靠性和长期持久化。", "subs": []}, {"title": "10.2 Ring 的用途不是保存日志正文", "content": "Ring 描述成员和负责的数据范围，使 Distributor 知道同一流应写到哪些节点。memberlist 是传播成员与键值状态的一种方式，不是用于复制日志正文的消息队列。[Hash Rings][S-rings]\n\n初学者常见混淆是：memberlist 端口通了，就认为写入复制也通了。实际还要检查 HTTP 入口、Ingester gRPC、对象存储和查询路径。某些网络策略只允许 TCP 7946 而遗漏成员发现需要的其他流量，同样会让故障变得间歇。\n\n| 配置或概念 | 要回答的问题 |\n| --- | --- |\n| 实例 ID | 重启前后是否符合设计，多个实例是否意外同名？ |\n| 广播地址 | 其他节点能否访问，不是只在本机可用的回环地址？ |\n| 加入成员 | 初始种子是否可解析且端口互通？ |\n| 心跳与健康 | 实例是故障、离开中，还是还在恢复？ |\n| Token 分布 | 数据范围是否合理分配？ |\n| 副本选择 | 是否覆盖期望节点与故障域？ |\n\n单体实验使用 `inmemory` Ring，是因为只有一个进程。将它复制成三个彼此独立的进程，不会自动成为一个集群；它们甚至可能各自认为自己是唯一成员。", "subs": []}, {"title": "10.3 副本数、确认数与故障域", "content": "本专题的经典写入路径使用复制和法定数量确认。以复制因子 3 为例，正常设计应有足够的健康 Ingester 来承载三个副本；多数确认通常对应至少两个副本确认。[Loki 架构][S-architecture]\n\n但“两个确认”不能单独转化为“可以在任何时间任意损坏两个节点”。还要考虑故障发生时哪些节点已经保存数据、对象存储是否上传完成、WAL 是否可恢复，以及副本是否落在同一个故障域。\n\n```text\n3 个副本位于同一物理节点：进程级重复，不是节点故障隔离。\n3 个副本位于同一机架：可抵御部分节点故障，不一定抵御机架故障。\n3 个副本跨可用区：需配套区域感知选择与网络、存储设计。\n```\n\nKubernetes 反亲和保证调度分散，Zone-aware 复制影响副本选择和相关运维，两者不是同一个开关。必须同时检查实际 Pod 分布和 Loki 看到的区域信息，而不是只看 `topologySpreadConstraints` 已写进 YAML。\n\n#### 一个设计验收问题\n\n随机停止一个 Ingester 之前，先回答：当前所有流有几个健康副本？另两个节点是否具备承接新写入的容量？重启节点的 WAL 恢复需要多久？在这段时间是否还允许第二次维护？这些条件比“允许 maxUnavailable=1”更完整。", "subs": ["一个设计验收问题"]}, {"title": "10.4 Ingester WAL 的保护范围", "content": "WAL 的目标是帮助 Ingester 在重启后恢复尚未完成长期保存的数据。它依赖持久化目录与恢复过程，不是简单加一个 `enabled: true` 就获得所有场景的零丢失保证。[Ingester WAL][S-wal]\n\n```yaml\n# 增量，合并到已有 ingester 块；路径必须位于每实例自己的持久卷。\ningester:\n  wal:\n    enabled: true\n    dir: /var/loki/wal\n    replay_memory_ceiling: 1GB\n    flush_on_shutdown: true\n```\n\n`replay_memory_ceiling` 是恢复过程中的内存约束，不等于容器总内存限制。恢复时还需要索引、Chunk、运行时和查询等额外内存。给容器 1Gi 限制再把 WAL 恢复上限设成 1GB，通常没有给其他部分留出足够余量。\n\n| 故障 | WAL 能提供的帮助 | 仍然存在的边界 |\n| --- | --- | --- |\n| 进程重启，盘仍在 | 恢复本地记录 | 恢复耗时、损坏段和资源限制 |\n| Pod 重建，PVC 重新挂载 | 保持原状态来源 | 调度与卷挂载必须成功 |\n| 节点永久损坏且本地盘丢失 | 本地 WAL 本身无法恢复 | 需要其他副本或已上传对象 |\n| 磁盘满或写入异常 | 不能继续提供相同持久化保障 | 必须观察写盘错误与告警 |\n| 客户端还未发到 Ingester | 无法保护这些日志 | 仍靠来源和采集端缓冲 |\n\n官方 WAL 文档特别讨论磁盘满时的行为：系统可能继续接收数据但无法再以同样方式记录 WAL。因此要监控 WAL 磁盘与写入失败，不能把“HTTP 仍成功”当成 WAL 一定健康。[Ingester WAL][S-wal]", "subs": []}, {"title": "10.5 Chunk 为什么会有大小和时间边界", "content": "Ingester 不会为每条日志单独写一个对象。它把相同流的一段日志组织成 Chunk，再按大小、年龄、空闲等条件刷新。流切得过细，Chunk 可能长期填不满；单个流吞吐过高，又可能形成热点。[Loki 架构][S-architecture]\n\n理解这一点后，才能解释以下现象：相同每日原始字节数，一组日志可能比另一组产生更多对象请求；一个高基数字段即使没有增加很多正文长度，也可能显著改变后端行为。\n\n| 观察 | 候选解释 | 下一步 |\n| --- | --- | --- |\n| 大量小 Chunk | 流过细、低速来源多、刷新时间策略 | 统计活跃流和每流速率 |\n| 单流限流频繁 | 少数来源形成热点 | 核对标签与自动分流策略 |\n| 内存持续增长 | 活跃状态、未刷数据、后端阻塞 | 同时观察流数与上传失败 |\n| 对象请求费用高 | 对象碎片、缓存或查询模式 | 不只压缩正文，还看访问次数 |\n\n不在本章给出对所有环境适用的 Chunk 大小调参值。先收集基线和分布，再做单变量调整；同时验证恢复时间和查询性能，避免只让写入指标变好。", "subs": []}, {"title": "10.6 过旧、未来与乱序是不同限制", "content": "一条日志可以“不是过旧日志”，却仍然因为在同一流中到达太晚而被拒绝。过旧限制通常相对于接收端当前时间，乱序限制则与同一流已经接受的数据时间进度有关。未来日志还可能来源于时钟漂移或单位错误。[配置参考][S-limits][限流与写入校验][S-ingestion]\n\n```text\n接收时间：12:00\n流中已接受最新事件：11:59\n待写事件 A：11:58，轻微迟到。\n待写事件 B：当天 01:00，仍在全局保留窗口内，但可能超出乱序窗口。\n待写事件 C：明天 12:00，可能是时钟或单位错误。\n```\n\n处理顺序应为检查时钟、单位和业务时间，然后评估是否需要分离回放流、限速回放或调整明确的窗口。不要先把所有时间校验关闭。\n\n对于 Kafka 积压恢复，需要计算最旧消息年龄，而不是只看 Lag 条数。如果恢复速度不够，积压可能在消费前已过源端保留或接收端允许窗口。第四卷将把这些约束放进同一个恢复预算。", "subs": []}, {"title": "10.7 安全地验证写入确认边界", "content": "仅在第一卷隔离环境执行，先生成 A 批次并对账，再停止 Loki，生成 B 批次，随后恢复 Loki 并观察重试和对账。B 批次是否完整取决于中断时长、采集端状态和重试边界；实验目标是测出这些条件，而不是预设一定成功。\n\n```bash\n# 只影响本实验的 Loki，不删除卷。\ndocker compose stop loki\npython3 scripts/generate.py --count 100 --rate 10\n# 保存新 manifest 和 Alloy 日志，再恢复。\ndocker compose start loki\ncurl --fail --show-error http://127.0.0.1:3100/ready\n```\n\n恢复后分别查询中断前后数据，并保存第一次查询和稳定后的查询结果。单次空结果可能只是传播未结束；持续缺号才需要沿源文件、读取位置、发送失败和后端拒绝逐层检查。\n\n测试进程崩溃和节点丢失是另一类实验，不能用一次正常停止来替代。不要在生产上直接执行强制 kill，以免绕过排空流程造成不可控风险。", "subs": []}]}, {"title": "第 11 章：查询路径与缓存", "sections": [{"title": "11.1 最近数据和历史数据可能来自不同位置", "content": "一条刚写入的日志还可能由 Ingester 提供，较早的数据通常需要从索引和对象存储读取。查询覆盖两类数据时，需要合并结果和处理副本重复。由于路径不同，“最近五分钟正常、昨天失败”本身就能帮助缩小候选原因。[Loki 架构][S-architecture][Loki 组件][S-components]\n\n```mermaid\nflowchart TD\n    A[有标签和时间范围的查询] --> B[确定候选流与查询时间段]\n    B --> C[可能需要的最近数据]\n    B --> D[历史索引与 Chunk]\n    C --> E[Ingester RPC]\n    D --> F[Index Gateway 或本地索引读取]\n    F --> G[对象存储 Chunk 获取]\n    E --> H[过滤 解析 聚合 合并]\n    G --> H\n    H --> I[返回日志或指标]\n```\n\n这张图是职责示意，不代表后端总是先完整查询内存、没有结果才读取对象。实际查询会根据配置、时间范围和执行计划访问相应来源；排障时应检查真实请求统计与日志，而不是假定固定顺序。", "subs": []}, {"title": "11.2 Frontend 拆分与 Scheduler 排队", "content": "查询一整天的日志，不一定由一个 Querier 从头处理到尾。Frontend 可以按时间等维度拆成多个子查询，由调度层安排工作，再合并结果。拆分有助于并行，也可能增加下游请求和队列压力。[Query Frontend][S-query-frontend][查询公平性][S-query-fairness]\n\n| 阶段 | 主要开销 | 为什么增加 Querier 不一定有效 |\n| --- | --- | --- |\n| 入口解析与计划 | 查询结构、限制、拆分 | 入口本身可能受资源或连接限制 |\n| 队列等待 | 并发配额与工作者供给 | 租户限制仍然约束可执行数量 |\n| 索引定位 | 索引同步与读取 | 对象或索引服务可能是瓶颈 |\n| Chunk 读取 | 网络、请求数、缓存命中 | 存储已达到带宽或请求上限 |\n| 解压与计算 | CPU、内存、解析复杂度 | 过宽查询仍会扫描大量数据 |\n| 合并返回 | 结果集和序列数 | 最终响应规模也可能不可控 |\n\n在大查询期间保护在线排障能力，需要租户公平性、查询预算和必要的工作负载隔离。只把超时从一分钟改成十分钟，可能让更多请求堆积而不是解决问题。", "subs": []}, {"title": "11.3 三类缓存不要混为一谈", "content": "缓存可能保存查询结果、Chunk 内容或本地索引下载副本。它们位于不同位置、键不同、有效期和失效条件不同。观察“缓存命中率”时，必须说明是哪一类缓存。[缓存][S-cache]\n\n| 缓存对象 | 命中后减少的工作 | 不解决的问题 |\n| --- | --- | --- |\n| 查询结果 | 重复查询的部分执行 | 新时间范围或不同查询仍可能昂贵 |\n| Chunk 内容 | 重复对象读取 | JSON/正则解析仍消耗计算 |\n| 索引本地副本 | 重复索引下载 | 找到 Chunk 不等于无需读取正文 |\n\n不要把缓存当作数据备份。缓存可淘汰、可能不完整，也不保证包含当前恢复所需对象。删除正式对象后仍能短暂查到某些数据，可能只是缓存尚未过期，并不证明删除安全。", "subs": []}, {"title": "11.4 冷查询与热查询要分开测量", "content": "使用相同选择器和相同绝对时间范围查询两次，第二次更快可能是缓存效果。使用“最近十五分钟”每次查询，起止范围在变化，不能严格称为同一查询。\n\n```bash\n# 为一次实验固定绝对起止时间；示例值需要替换为真实样本区间。\ncurl --fail --show-error --get \\\n  http://127.0.0.1:3100/loki/api/v1/query_range \\\n  --data-urlencode 'query={cluster=\"lab\",job=\"access\"} |= \"503\"' \\\n  --data-urlencode 'start=1790208000000000000' \\\n  --data-urlencode 'end=1790208600000000000' \\\n  --data-urlencode 'limit=1000' \\\n  --data-urlencode 'direction=forward' > reports-query.json\n```\n\n查询原始 JSON 可以保存 `data.stats`，但其中字段会随版本和执行路径变化。报告应保留原结构，随后按实际字段提取扫描字节数、执行时间、排队时间和缓存等信息，不把缺失字段自动补零当成事实。[Loki HTTP API][S-http]\n\n| 实验项 | 固定条件 | 记录结果 |\n| --- | --- | --- |\n| 首次查询 | 同一绝对范围与查询 | 耗时、扫描量、缓存、条数 |\n| 重复查询 | 不改变范围和正文过滤 | 同上，并注明热缓存 |\n| 增加选择器 | 同一事件集目标 | 结果是否一致、扫描是否减少 |\n| 先过滤后解析 | 同一语义 | 结果相同才可比较性能 |", "subs": []}, {"title": "11.5 全量导出不是滚动浏览", "content": "Grafana 显示的最大行数、API `limit` 和后端查询限制各自独立。Live tail 是观察新日志的工具，不是完整历史导出接口。第一卷客户端通过半开时间分片处理饱和窗口，仍需要稳定数据和明确预算。[Loki HTTP API][S-http]\n\n一个常见错误是每次用最后一行时间作为下一页起点，再加一纳秒。若同一纳秒内还有未返回日志，这些日志会被永久跳过。另一种错误是一直使用相同起点，导致循环读取重复页。\n\n```text\n错误分页：上一页最后 ts + 1 → 可能跳过同一 ts 剩余事件。\n错误去重：正文相同就只留一行 → 不同请求可能恰好打印同样内容。\n受控做法：分割时间范围；饱和的单纳秒窗口明确失败；保留唯一事件 ID。\n```\n\n对审计或严格对账用途，还要定义服务端查询合并重复的语义、迟到数据窗口和导出期间的保留清理影响。一个成功退出的脚本不应自动获得“不可否认的全量事实”地位。", "subs": []}, {"title": "11.6 查询路径的故障分层", "content": "| 现象 | 优先检查 | 不宜先做 |\n| --- | --- | --- |\n| 新日志能查，旧日志不行 | Schema、索引、对象权限 | 全部重装 Alloy |\n| 旧日志正常，新日志不行 | Ingester 状态、写入拒绝、最近查询路径 | 删除对象缓存 |\n| API 能查，Grafana 不行 | 数据源、租户、时间、查询限制 | 重建集群 |\n| 简单查询正常，聚合失败 | `__error__`、序列上限、内存 | 提高所有限制 |\n| 同一查询重复后更快 | 缓存和对象读取 | 把热缓存成绩当成稳定基线 |\n\n本章的目标不是记住所有指标名，而是能根据现象判断下一次请求应该打到哪一层，并保留足以证明判断的响应和配置。", "subs": []}]}, {"title": "第 12 章：TSDB、Schema 与历史时间段", "sections": [{"title": "12.1 TSDB 索引不是 Prometheus 指标数据库的完整替代", "content": "Loki 使用 TSDB 形式的索引来定位日志流及关联的数据块，但日志内容仍在 Chunk 中。它借用了适合索引的结构，不表示可以用 PromQL 查询 Loki 的原始日志，也不表示把日志文本全部变成了指标样本。[TSDB 索引][S-tsdb][Loki 架构][S-architecture]\n\n新建实验采用 TSDB、Schema v13 和 24 小时索引周期。读者不需要先搭建旧式分离索引数据库，再为了“最新”迁移一次；旧 BoltDB Shipper 只作为识别存量配置的知识。\n\n| 概念 | 决定什么 | 不决定什么 |\n| --- | --- | --- |\n| `store: tsdb` | 索引实现 | 采集端用什么协议 |\n| `schema: v13` | 存储 Schema 能力 | 日志业务字段的语义版本 |\n| `object_store: s3` | 该时间段的数据存储后端类型 | S3 服务自身的可靠性级别 |\n| `index.period: 24h` | 索引组织时间周期 | 日志只保存 24 小时 |\n| `from` | 此配置段的生效日期 | 容器镜像发布日期 |", "subs": []}, {"title": "12.2 Schema 配置是一条时间轴", "content": "Schema 的每一段对应一个从某日期开始适用的存储规则。已有数据仍需要原来的段来解释与定位，所以修改配置时保留历史段，并在未来 UTC 日期追加新段。[存储 Schema][S-schema]\n\n```yaml\n# 教学结构：假设这是一个原本就使用 S3 的实例。\nschema_config:\n  configs:\n    - from: \"2026-01-01\"\n      store: tsdb\n      object_store: s3\n      schema: v13\n      index:\n        prefix: index_\n        period: 24h\n    - from: \"2026-10-01\"\n      store: tsdb\n      object_store: s3\n      schema: v13\n      index:\n        prefix: index_v2_\n        period: 24h\n```\n\n示例只是展示“保留原段、追加新段”，不是推荐无理由修改索引前缀。新段日期是 2026-10-01 的 UTC 零点；在 UTC+8 的机器上，不能误以为本地零点就已经切换。\n\n如果旧实例原来使用 filesystem，把旧段的 `object_store` 直接改成 s3，会让过去的时间范围按错误后端查找。数据不会因为修改一个字符串自动迁移到 Bucket 中。", "subs": []}, {"title": "12.3 迁移前准备三张表", "content": "| 时间段 | 当前 Schema | 数据实际位置 | 后续查询需要保留什么 |\n| --- | --- | --- | --- |\n| 旧时间范围 | 原始段 | 原目录/原 Bucket | 原段及可访问的原后端 |\n| 切换边界附近 | 新旧并存 | 可能跨两个后端 | 两段都可解析，时钟一致 |\n| 新时间范围 | 新增段 | 新 Bucket/新布局 | 新配置与写入权限 |\n\n第二张表记录每个运行组件拿到的配置摘要，避免某些节点已经使用新 Schema、另一些仍停留在旧配置。第三张表记录回滚条件：如果新段已经产生数据，旧版本或旧配置是否还能读取它？\n\n“回滚 Deployment 镜像”不能自动回滚已经写出的数据布局。真正的回滚步骤必须说明如何维持新旧数据的可读性，或在隔离环境明确接受丢弃测试数据。", "subs": []}, {"title": "12.4 只读 Schema 检查脚本", "content": "文件：`lab/scripts/check_schema.py`。脚本需要 PyYAML，仅检查时间顺序、基础约定和历史段是否被改写，不替代 Loki 的配置校验。\n\n```python\n#!/usr/bin/env python3\n\"\"\"只读检查 Schema 时间段；需要 PyYAML，不等同于 Loki -verify-config。\"\"\"\nfrom __future__ import annotations\nimport argparse\nfrom datetime import date, datetime, timezone\nfrom pathlib import Path\nimport sys\nimport yaml\n\nclass UniqueLoader(yaml.SafeLoader):\n    pass\n\ndef unique_map(loader, node, deep=False):\n    result = {}\n    for key_node, value_node in node.value:\n        key = loader.construct_object(key_node, deep=deep)\n        if key in result:\n            raise ValueError(f\"重复 YAML 键：{key}\")\n        result[key] = loader.construct_object(value_node, deep=deep)\n    return result\n\nUniqueLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, unique_map)\n\ndef normalize_day(value) -> date:\n    if isinstance(value, datetime):\n        raise ValueError(\"from 使用 UTC 日期，不接受带任意时刻的 datetime\")\n    if isinstance(value, date):\n        return value\n    return date.fromisoformat(str(value))\n\ndef inspect(config: dict, now: datetime) -> list[dict]:\n    blocks = config.get(\"schema_config\", {}).get(\"configs\", [])\n    if not blocks:\n        raise ValueError(\"缺少 schema_config.configs\")\n    result = []\n    previous = None\n    for block in blocks:\n        day = normalize_day(block[\"from\"])\n        if previous is not None and day <= previous:\n            raise ValueError(\"from 必须严格递增，不能重复或倒序\")\n        previous = day\n        if block.get(\"store\") == \"tsdb\" and block.get(\"index\", {}).get(\"period\") != \"24h\":\n            raise ValueError(\"本专题 TSDB 基线要求 index.period=24h\")\n        result.append({\"from\": day.isoformat(), \"store\": block.get(\"store\"),\n                       \"schema\": block.get(\"schema\"),\n                       \"object_store\": block.get(\"object_store\"),\n                       \"future\": day > now.astimezone(timezone.utc).date()})\n    active = [b for b in result if not b[\"future\"]]\n    if not active:\n        raise ValueError(\"当前 UTC 时间没有生效 Schema\")\n    return result\n\ndef check_history(old: dict, new: dict) -> None:\n    old_blocks = old.get(\"schema_config\", {}).get(\"configs\", [])\n    new_blocks = new.get(\"schema_config\", {}).get(\"configs\", [])\n    if new_blocks[:len(old_blocks)] != old_blocks:\n        raise ValueError(\"历史 Schema 段被删除或修改；需要人工迁移评审\")\n\ndef load(path: Path) -> dict:\n    data = yaml.load(path.read_text(encoding=\"utf-8\"), Loader=UniqueLoader)\n    if not isinstance(data, dict):\n        raise ValueError(\"配置必须是 YAML 映射\")\n    return data\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"config\", type=Path)\n    parser.add_argument(\"--previous\", type=Path)\n    args = parser.parse_args()\n    try:\n        new = load(args.config)\n        if args.previous:\n            check_history(load(args.previous), new)\n        report = inspect(new, datetime.now(timezone.utc))\n        import json\n        print(json.dumps(report, ensure_ascii=False, indent=2))\n    except (OSError, ValueError, KeyError, TypeError, yaml.YAMLError) as exc:\n        parser.exit(1, f\"Schema 检查失败：{exc}\\n\")\n\nif __name__ == \"__main__\":\n    main()\n```\n\n```bash\n# 在独立虚拟环境准备脚本依赖，生产应由依赖锁定文件管理。\npython3 -m venv .venv\n. .venv/bin/activate\npython -m pip install 'PyYAML==6.0.2'\n\npython scripts/check_schema.py loki/loki.yaml\npython scripts/check_schema.py loki/proposed.yaml --previous loki/current.yaml\n```\n\n这里固定 PyYAML 只是让教学解析行为有明确落点，不表示它是核查日最新版。组织若已有受维护依赖基线，应使用其锁定版本并重新测试。\n\n脚本将“历史段发生变化”作为需要人工评审的错误。某些真实迁移确实需要复杂调整，但不能让一个通用脚本为了方便自动放行所有差异。", "subs": []}, {"title": "12.5 本地索引目录与共享存储", "content": "`active_index_directory` 保存写入侧的活动索引文件，`cache_location` 保存本地读取缓存，两者都不等于远端对象存储。不同 Ingester 的活动目录不应指向同一可写共享路径，除非明确了解组件的并发访问契约。\n\n```yaml\nstorage_config:\n  tsdb_shipper:\n    active_index_directory: /var/loki/tsdb-index\n    cache_location: /var/loki/tsdb-cache\n```\n\n缓存可能可以重建，但活动状态与未上传数据需要单独评估。不要因为目录名都在 `/var/loki` 下，就在清理脚本中用一个通配符删除所有子目录。\n\n| 目录或对象 | 常见责任 | 清理前的问题 |\n| --- | --- | --- |\n| WAL | 最近接收数据的恢复 | 是否仍有未完成持久化记录？ |\n| Active index | 当前索引构建与上传 | 是否已经上传并能重建？ |\n| Index cache | 加速访问 | 冷启动影响是否可承受？ |\n| Compactor working | 压缩与删除处理状态 | 删除标记是否还在这里？ |\n| Bucket 中的 index | 历史查询定位 | 不能套用普通临时文件规则 |", "subs": []}, {"title": "12.6 验证跨日与跨配置段查询", "content": "至少生成三组样本：边界前、边界后，以及查询窗口横跨边界。对于真实未来切换，可以提前定义验收计划，等日期到达后执行；对于隔离实验，可以使用过去的两个有效时间段和受控历史样本，但要同时调整接收时间限制并记录原因。\n\n测试结果要包含原始事件时间和请求时间。时间边界附近的“偶发缺失”可能来自时区、写入拒绝、Schema 配置不一致或查询端实际范围，而不一定是对象存储随机丢失。\n\n不要在生产系统为了演示而修改历史 Schema 日期。学习目的可以用独立实例完成，生产变更必须有完整的数据定位与恢复方案。", "subs": []}]}, {"title": "第 13 章：对象存储与存储客户端", "sections": [{"title": "13.1 从“桶里有对象”到“数据能够恢复”", "content": "对象存储承担长期保存，但“能上传一个文件”不是 Loki 存储验收。日志 Chunk、索引、规则以及删除任务状态有不同生命周期；访问权限、目录前缀、租户、Schema 和加密密钥任何一项不一致，都可能使对象存在却无法被当前查询找到。[存储配置][S-storage][Thanos 存储客户端][S-thanos]\n\n本章使用已经由存储管理员创建的**独立实验 Bucket**。不把某个 S3 兼容产品的镜像、磁盘、IAM、证书配置藏在一条安装命令里。具体服务必须另外记录产品版本、持久卷、恢复策略及运维责任；支持 S3 接口不自动意味着具有云对象存储同等的容错能力。\n\n| 验证层 | 必须取得的证据 | 仍不能说明什么 |\n| --- | --- | --- |\n| DNS / TCP | 从实际 Loki Pod 到 Endpoint 可达 | TLS、权限与请求签名正确 |\n| TLS | 证书链、名称、有效期正确 | Bucket 和 Prefix 授权正确 |\n| 写入 | 独立实验前缀能 Put | 历史对象能读，索引能列举 |\n| 读取 | Get 返回已知内容与校验值 | Loki Schema 和租户匹配 |\n| 列举 | 指定前缀列表可读 | 删除请求有权限 |\n| 删除 | 实验对象能删除 | 保留规则真的命中业务流 |\n| 应用恢复 | 新查询进程能查到已上传的旧事件 | 尚在 WAL 中的数据也已进入对象存储 |\n\n把这些检查在**和 Loki 相同的网络与身份条件下**执行。笔记本能够访问，不证明 Kubernetes 节点出网、防火墙、私有 DNS 或 Workload Identity 正常。\n\n#### 不用生产桶做权限实验\n\n用于权限验证的对象名可以是 `diagnostics/<随机批次>/probe.txt`，且实验账号只允许该测试范围。不要为了证明删除权限执行整桶递归删除，也不要把生产 Loki Prefix 当成临时测试路径。\n\n存储提供商的 SDK、CLI、签名和证书选项应以其对应版本为准。本文不提供一个默认关闭 TLS 校验的“万能 S3 检查命令”。", "subs": ["不用生产桶做权限实验"]}, {"title": "13.2 两套 S3 配置空间不能拼接", "content": "Loki 当前提供传统存储客户端以及 Thanos object-store 客户端路径。本笔记的独立 S3 配置使用后者；后面的 Helm 教学值则使用 Chart 明确提供的传统 `loki.storage.s3` 字段。两条路径都是有版本落点的示例，不应把它们复制到同一个配置层级。[Thanos 存储客户端][S-thanos][Chart 18.13.5 values][S-chart-values]\n\n| 项目 | 直接 Loki 配置：Thanos 路径 | Chart 高层传统 S3 配置 |\n| --- | --- | --- |\n| 启用入口 | `storage_config.use_thanos_objstore` | `loki.storage.type: s3` |\n| S3 参数父键 | `storage_config.object_store.s3` | `loki.storage.s3` |\n| Bucket | `bucket_name` | `loki.storage.bucketNames.chunks` 等 |\n| Access Key | `access_key_id` | `accessKeyId` |\n| Secret Key | `secret_access_key` | `secretAccessKey` |\n| Endpoint 示例 | `s3.example.internal:443` | `https://s3.example.internal` |\n| 生成结果 | 直接交给 Loki | 先由 Helm 模板转换为 Loki 配置 |\n\nThanos 示例的 `insecure: false` 表示使用安全传输。**不要把 `insecure: true` 理解为“安全地信任一个自签证书”**；需要私有 CA 时应配置对应客户端的 CA 信任链，而不是改成明文 HTTP。供应商的 Region、路径寻址方式和签名行为也必须与客户端一致。\n\n环境变量替换需要 Loki 参数 `-config.expand-env=true`；仅在 Pod 中定义变量不会自动替换配置文本。查看渲染结果时保留 `${S3_ACCESS_KEY_ID}` 是正常的，但查看实际进程配置时可能泄露展开后的秘密，因此配置调试输出必须当成敏感数据。", "subs": []}, {"title": "13.3 独立的 S3 单体实验", "content": "完整文件：`lab/loki/loki-s3.yaml`。这份配置用于一个**新建的 S3 实验实例**，不是将第一卷已经有日志的 `filesystem` 配置直接覆盖。\n\n```yaml\n# 新建隔离单实例的完整 S3 配置。不能覆盖已有 filesystem 实例的历史 Schema。\nauth_enabled: false\nserver:\n  http_listen_port: 3100\n  grpc_listen_port: 9095\n  log_level: info\ncommon:\n  instance_addr: 127.0.0.1\n  path_prefix: /loki\n  replication_factor: 1\n  ring:\n    kvstore:\n      store: inmemory\nschema_config:\n  configs:\n    - from: \"2026-01-01\"\n      store: tsdb\n      object_store: s3\n      schema: v13\n      index:\n        prefix: index_\n        period: 24h\nstorage_config:\n  tsdb_shipper:\n    active_index_directory: /loki/tsdb-index\n    cache_location: /loki/tsdb-cache\n  use_thanos_objstore: true\n  object_store:\n    s3:\n      bucket_name: ${S3_BUCKET}\n      endpoint: ${S3_ENDPOINT}\n      region: ${S3_REGION}\n      access_key_id: ${S3_ACCESS_KEY_ID}\n      secret_access_key: ${S3_SECRET_ACCESS_KEY}\n      insecure: false\ningester:\n  wal:\n    enabled: true\n    dir: /loki/wal\n    replay_memory_ceiling: 256MB\n    flush_on_shutdown: true\ncompactor:\n  working_directory: /loki/compactor\nlimits_config:\n  allow_structured_metadata: true\n  reject_old_samples: true\n  reject_old_samples_max_age: 168h\n  max_entries_limit_per_query: 5000\n  query_timeout: 1m\nanalytics:\n  reporting_enabled: false\n```\n\n准备以下环境变量，值由已建好的实验存储提供：\n\n```text\nS3_BUCKET            独立实验桶名称\nS3_ENDPOINT          不带协议的 Endpoint，例如 s3.example.internal:443\nS3_REGION            该服务要求的 Region\nS3_ACCESS_KEY_ID     限定实验范围的 Access Key\nS3_SECRET_ACCESS_KEY 对应 Secret Key\n```\n\n从已有 lab 创建独立目录 `s3-lab/`，保留原实验不动。将这份文件作为新 Loki 的配置，为新实例分配不同 named volume 和宿主端口，并把所需变量通过 `env_file` 或 Secret 注入容器。不要把 `.env` 里的变量仅用于 Compose 文本替换，却忘记传入 Loki 进程环境。\n\n以下是该新实例所需的 Compose 服务结构；它不包含 Grafana 和采集器，客户端暂时用第 1 卷的 HTTP 脚本连接新端口。\n\n```yaml\n# s3-lab/compose.yaml；独立实验。s3.env 不提交到版本控制。\nname: loki-s3-lab\nservices:\n  loki:\n    image: grafana/loki:3.7.8\n    command:\n      - -config.file=/etc/loki/loki.yaml\n      - -config.expand-env=true\n    env_file:\n      - ./s3.env\n    ports:\n      - 127.0.0.1:13100:3100\n    volumes:\n      - ./loki.yaml:/etc/loki/loki.yaml:ro\n      - loki-s3-state:/loki\n    stop_grace_period: 120s\nvolumes:\n  loki-s3-state: {}\n```\n\n完整配置检查和启动：\n\n```bash\n# 在 s3-lab 目录执行；配置文件由上面的 Loki S3 文件保存为 loki.yaml。\nchmod 600 s3.env\n# config 输出可能包含凭据，使用 -q 只检查结构。\ndocker compose config -q\ndocker compose run --rm --no-deps loki \\\n  -config.file=/etc/loki/loki.yaml \\\n  -config.expand-env=true \\\n  -verify-config=true\ndocker compose up -d\ncurl --fail --max-time 10 http://127.0.0.1:13100/ready\n```\n\n验证命令是读者应执行的步骤，本次未在真实存储上执行。配置语法通过也不验证外部 Bucket 权限与持久化行为。", "subs": []}, {"title": "13.4 证明历史查询真的使用了对象存储", "content": "简单重启可能从原 WAL 恢复，因而不能单独证明对象存储可读。建议采用以下隔离实验，且全程保留原卷作为恢复点：\n\n1. 向新 S3 实验写入少量有唯一事件 ID 的日志，记录时间窗口。\n2. 等待或通过正常关闭触发当前配置的刷新过程，观察上传成功和相应对象出现。\n3. 保留原实例，另外创建**只用于查询验证**的隔离实例或部署，使用相同历史 Schema、相同租户、同一实验对象存储，但不同本地状态目录；禁止它接收业务写入和执行删除。\n4. 在这个查询环境中检索原事件，并对照内容，而不是只观察“有若干行”。\n5. 结束后只清理临时查询资源，保留实验数据直到对账记录完成。\n\n这不是让两套互不知情的生产集群同时管理同一个桶。实际恢复部署需要明确哪个集群拥有写入、Compactor 和删除职责；直接让两个完整 `target=all` 实例群独立维护同一存储可能造成控制职责冲突。\n\n#### 日常需要保存哪些信息\n\n| 信息 | 用途 |\n| --- | --- |\n| Bucket 与实际对象前缀 | 防止恢复时指向另一个存储范围 |\n| 租户标识 | 单租户 `fake` 与多租户不能随意互换 |\n| 完整 Schema 历史 | 正确解释各时间段的数据位置与格式 |\n| KMS / SSE 密钥依赖 | 对象存在但密钥不可用仍不能恢复 |\n| Loki 版本、启动参数、镜像摘要 | 避免恢复环境使用不兼容配置 |\n| Compactor 与删除任务状态 | 防止恢复中重复或错误执行删除 |\n| 经验证的时间窗口和事件 ID | 给恢复结果一个可以复查的目标 |", "subs": ["日常需要保存哪些信息"]}, {"title": "13.5 从存储流量理解费用与性能", "content": "日志存储费用不是只看“压缩后多少 GB”。一次宽范围查询还可能产生大量 List/Get 请求、网络传输、解压与解析 CPU。很多很小的 Stream 产生很多小 Chunk，既增加元数据管理，也可能增加对象操作次数。[存储配置][S-storage][缓存][S-cache]\n\n一个面向日志平台的成本表至少分成四栏：\n\n| 成本项 | 建议计量方式 | 常见误判 |\n| --- | --- | --- |\n| 保存数据 | 物理对象字节 × 保留时间 | 把原始文本字节直接当最终存储量 |\n| 对象请求 | Put/Get/List/Delete 调用次数 | 认为查询不产生额外费用 |\n| 网络 | 同区、跨区、出网分别统计 | 所有流量套用一个单价 |\n| 计算与缓存 | 组件 CPU、内存、缓存命中及重建 | 缓存加倍就假设总费用下降 |\n\n优化前先记录一段稳定负载，再改变标签、Chunk 或缓存策略中的一个变量。仅看到 Bucket 增长速度下降，不足以证明查询体验和恢复目标仍然满足要求。", "subs": []}]}, {"title": "第 14 章：Monolithic 与高可用单体部署", "sections": [{"title": "14.1 固定 Chart，而不是复制浮动安装命令", "content": "本节采用已发布的 Community Chart `18.13.5`，Loki 镜像固定 `3.7.8`。Chart 声明 Kubernetes 最低版本为 `>=1.25.0-0`；这是模板兼容门槛，不是建议现在新建一个已经陈旧的 Kubernetes 1.25 集群。[Chart 18.13.5 发布][S-chart-release][Chart 18.13.5 values][S-chart-values]\n\nHelm、kubectl 与实际 Kubernetes 版本记录到实验清单中；本笔记不指定一个未经验证的宿主集群组合。\n\n```bash\nhelm repo add grafana-community https://grafana-community.github.io/helm-charts\nhelm repo update\nmkdir -p lab/vendor lab/rendered\nhelm pull grafana-community/loki --version 18.13.5 --destination lab/vendor\nhelm show chart lab/vendor/loki-18.13.5.tgz\nhelm show values lab/vendor/loki-18.13.5.tgz > lab/vendor/loki-18.13.5.values.yaml\n```\n\n保存 Chart 包、摘要和实际镜像清单，而不是只保存一条 `helm install` 历史。仓库里的 values 变化时，旧实验仍应该可以被重现。\n\n#### `Monolithic` 不等于把所有键改成 `monolithic`\n\n在这版 Chart 中，`deploymentMode` 使用 `Monolithic`，组件配置仍在 `singleBinary` 下。模板中的组件标签也可能保留 `single-binary`。旧命名与新模式名同时存在，不表示其中一个可随意删除。[Chart 18.13.5 values][S-chart-values]\n\n同样，`loki.structuredConfig` 是高级替代入口，可能覆盖模板生成的完整配置。只想改一个限额时优先使用专门的 values 区域，不要提供一个只有两行的 structuredConfig 却以为其他自动配置会保留。", "subs": ["Monolithic 不等于把所有键改成 monolithic"]}, {"title": "14.2 单副本 Kubernetes 实验", "content": "完整文件：`lab/helm/values-monolithic.yaml`。这是**单副本、本地 PVC、未认证、仅集群内部访问**的教学起点。\n\n```yaml\n# 固定 Chart 18.13.5；隔离 Kubernetes 学习环境，不提供外部认证。\ndeploymentMode: Monolithic\nloki:\n  image:\n    tag: \"3.7.8\"\n  auth_enabled: false\n  commonConfig:\n    replication_factor: 1\n  schemaConfig:\n    configs:\n      - from: \"2026-01-01\"\n        store: tsdb\n        object_store: filesystem\n        schema: v13\n        index:\n          prefix: index_\n          period: 24h\n  storage:\n    type: filesystem\n  limits_config:\n    allow_structured_metadata: true\n    volume_enabled: true\n  ingester:\n    wal:\n      enabled: true\n      dir: /var/loki/wal\n      replay_memory_ceiling: 256MB\n      flush_on_shutdown: true\n  analytics:\n    reporting_enabled: false\nsingleBinary:\n  replicas: 1\n  sidecar: false\n  persistence:\n    enabled: true\n    size: 10Gi\n    enableStatefulSetAutoDeletePVC: false\n  terminationGracePeriodSeconds: 120\n  resources:\n    requests:\n      cpu: 250m\n      memory: 512Mi\n    limits:\n      cpu: \"2\"\n      memory: 2Gi\nread:\n  replicas: 0\nwrite:\n  replicas: 0\nbackend:\n  replicas: 0\ngateway:\n  enabled: true\n  replicas: 1\n  service:\n    type: ClusterIP\nchunksCache:\n  enabled: false\nresultsCache:\n  enabled: false\nlokiCanary:\n  enabled: false\nminio:\n  enabled: false\n```\n\n先渲染，不直接安装：\n\n```bash\nhelm template loki-mono lab/vendor/loki-18.13.5.tgz \\\n  --namespace loki-mono-lab \\\n  -f lab/helm/values-monolithic.yaml \\\n  > lab/rendered/monolithic.yaml\n\n# 需要实际集群上下文；server dry-run 会访问 API，但不会保存对象。\nkubectl create namespace loki-mono-lab --dry-run=client -o yaml | kubectl apply -f -\nkubectl apply --dry-run=server -f lab/rendered/monolithic.yaml\n```\n\n在渲染结果里至少核对：真实镜像 tag、单体副本数、`-target=all`、实际 Loki 配置、PVC 与挂载位置、服务端口、网关路由、是否意外启用了额外缓存和 Canary。由于这组值没有启用认证，不能直接加一个公共 LoadBalancer 了事。\n\n完整只读清单检查器：`lab/scripts/render_inventory.py`。依赖前一章的 `check_schema.py` 与同一 PyYAML 环境；只列出对象结构，不打印 ConfigMap 或 Secret 内容。\n\n```python\n#!/usr/bin/env python3\n\"\"\"Read a Helm-rendered multi-document YAML; never contact a cluster.\"\"\"\nfrom __future__ import annotations\nimport argparse\nimport base64\nimport json\nfrom pathlib import Path\nimport yaml\nfrom check_schema import UniqueLoader\n\n\ndef inspect(text: str) -> dict:\n    objects = list(yaml.load_all(text, Loader=UniqueLoader))\n    result = {\"workloads\": [], \"services\": [], \"configs\": []}\n    for obj in objects:\n        if not obj:\n            continue\n        if not isinstance(obj, dict):\n            raise ValueError(\"manifest document must be an object\")\n        kind, name = obj.get(\"kind\"), obj.get(\"metadata\", {}).get(\"name\", \"\")\n        spec = obj.get(\"spec\", {})\n        if kind in (\"Deployment\", \"StatefulSet\", \"DaemonSet\"):\n            pod = spec.get(\"template\", {}).get(\"spec\", {})\n            result[\"workloads\"].append({\n                \"kind\": kind, \"name\": name, \"replicas\": spec.get(\"replicas\"),\n                \"containers\": [{\"name\": c.get(\"name\"), \"image\": c.get(\"image\"),\n                                \"args\": c.get(\"args\", []),\n                                \"mounts\": c.get(\"volumeMounts\", [])}\n                               for c in pod.get(\"containers\", [])],\n                \"claims\": spec.get(\"volumeClaimTemplates\", []),\n                \"volumes\": pod.get(\"volumes\", []),\n            })\n        elif kind == \"Service\":\n            result[\"services\"].append({\"name\": name, \"type\": spec.get(\"type\"),\n                                       \"ports\": spec.get(\"ports\", [])})\n        elif kind in (\"ConfigMap\", \"Secret\"):\n            # Do not print content or credentials; report keys and byte lengths only.\n            for key, value in obj.get(\"data\", {}).items():\n                if not isinstance(value, str):\n                    continue\n                size = len(value.encode())\n                if kind == \"Secret\":\n                    size = len(base64.b64decode(value, validate=True))\n                result[\"configs\"].append({\"kind\": kind, \"name\": name,\n                                          \"key\": key, \"bytes\": size})\n    return result\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"manifest\", type=Path)\n    args = parser.parse_args()\n    print(json.dumps(inspect(args.manifest.read_text()), ensure_ascii=False, indent=2))\n\n\nif __name__ == \"__main__\":\n    main()\n```\n\n```bash\npython lab/scripts/render_inventory.py lab/rendered/monolithic.yaml \\\n  > lab/rendered/monolithic.inventory.json\n```\n\n清单检查器不会验证每个 Chart 字段的语义，也不会调用 Loki。它的作用是把“我以为生成了什么”变成一个可以阅读的资源摘要。JSON 输出中的命令参数也可能被使用者写入秘密，生产环境仍应避免把参数当成凭据载体。\n\n确认渲染和准入结果后再安装：\n\n```bash\nhelm upgrade --install loki-mono lab/vendor/loki-18.13.5.tgz \\\n  --namespace loki-mono-lab \\\n  -f lab/helm/values-monolithic.yaml \\\n  --wait --timeout 10m\nkubectl -n loki-mono-lab get pods,pvc,svc\n```\n\n`--wait` 通过仍然只是资源就绪。继续从网关写入一批日志并查询，核对实际事件 ID。网关 Service 名称以 `kubectl get svc` 输出为准，尤其使用 `fullnameOverride` 时不要盲猜名字。", "subs": []}, {"title": "14.3 PVC 与进程启动问题", "content": "PVC 是 Kubernetes 存储声明，不是数据自动备份。一个 PVC 指向本地磁盘时，Pod 跨节点重调度不一定能使用该盘；网络存储也需要单独讨论吞吐、故障域和快照恢复能力。[Kubernetes 持久卷][S-k8s-storage]\n\n```bash\nkubectl -n loki-mono-lab get pvc -o wide\nkubectl -n loki-mono-lab describe pvc\nkubectl -n loki-mono-lab get events --sort-by=.lastTimestamp\nkubectl -n loki-mono-lab get pods -o wide\n```\n\n| 现象 | 先检查 | 不应立即执行 |\n| --- | --- | --- |\n| PVC Pending | StorageClass、配额、拓扑、Provisioner | 删除所有 PVC 重装 |\n| Permission denied | UID/GID、fsGroup、目录实际权限 | 给全部 Pod 加 privileged |\n| Pod Pending | 资源、反亲和、节点选择、PVC 可挂载性 | 无差别关闭反亲和 |\n| 启动反复超时 | WAL 重放、磁盘速度、Startup Probe | 清空 WAL 换取“正常启动” |\n| 网关 502 | Ready Endpoint、目标端口、路由配置 | 在采集端无限增加重试 |\n\n状态目录路径必须与渲染出来的 Loki 配置一致。PVC 挂在 `/var/loki`，但 WAL 配到了容器临时目录，是一个看上去“已经配置持久化”的隐蔽错误。", "subs": []}, {"title": "14.4 高可用单体的新建实验", "content": "HA 示例基于三个可调度节点、独立 S3 实验桶以及可用的存储凭据。这里使用**新 Release 与新 Namespace**，而不是把单副本 filesystem 存量数据一键改成 S3。\n\n增量文件：`lab/helm/values-ha-overlay.yaml`，叠加到上面的单体值文件。\n\n```yaml\n# 新建 HA 实验：叠加到 values-monolithic.yaml，不用于把已有 filesystem 数据原地迁移。\nloki:\n  commonConfig:\n    replication_factor: 3\n  schemaConfig:\n    configs:\n      - from: \"2026-01-01\"\n        store: tsdb\n        object_store: s3\n        schema: v13\n        index:\n          prefix: index_\n          period: 24h\n  storage:\n    type: s3\n    bucketNames:\n      chunks: loki-lab-chunks\n      ruler: loki-lab-rules\n    # 此例采用当前 Chart 仍支持的经典客户端；13.2 节另给 Thanos 配置。\n    use_thanos_objstore: false\n    s3:\n      endpoint: https://s3.example.internal\n      region: lab-region\n      s3ForcePathStyle: true\n      insecure: false\n      accessKeyId: ${S3_ACCESS_KEY_ID}\n      secretAccessKey: ${S3_SECRET_ACCESS_KEY}\nsingleBinary:\n  replicas: 3\n  extraArgs:\n    - -config.expand-env=true\n  extraEnvFrom:\n    - secretRef:\n        name: loki-s3-auth\n  persistence:\n    enabled: true\n    size: 20Gi\n    enableStatefulSetAutoDeletePVC: false\n  podDisruptionBudget:\n    enabled: true\n    maxUnavailable: 1\n  terminationGracePeriodSeconds: 300\ngateway:\n  replicas: 2\n```\n\n这个文件采用传统 S3 Chart 入口，所以 Endpoint 写法与第 13 章的 Thanos 直接配置不同。请先用自己实验存储的 Bucket、Region 和 Endpoint 替换示例值。它还依赖名为 `loki-s3-auth` 的 Secret，提供 `S3_ACCESS_KEY_ID`、`S3_SECRET_ACCESS_KEY`；通过已有 Secret 管理流程创建，不把真实值写进 values 或 shell 历史。\n\n```bash\n# 先创建 loki-ha-lab Namespace 与 Secret，再渲染和验证。\nhelm template loki-ha lab/vendor/loki-18.13.5.tgz \\\n  --namespace loki-ha-lab \\\n  -f lab/helm/values-monolithic.yaml \\\n  -f lab/helm/values-ha-overlay.yaml \\\n  > lab/rendered/ha.yaml\npython lab/scripts/render_inventory.py lab/rendered/ha.yaml\n\nhelm upgrade --install loki-ha lab/vendor/loki-18.13.5.tgz \\\n  --namespace loki-ha-lab \\\n  -f lab/helm/values-monolithic.yaml \\\n  -f lab/helm/values-ha-overlay.yaml \\\n  --wait --timeout 10m\n```\n\n合并顺序有意义：后面的 map 覆盖前面的同名值，列表通常整体替换。尤其 `schemaConfig.configs`、环境变量列表、PVC claims，不是按元素语义自动合并。\n\n#### 要同时成立的高可用条件\n\n三副本只是起点。还需要三个实例实际分布在不同故障域，Ring 成员相互可见，RPC 可达，副本确认条件成立，共享对象存储可用，网关不成为单点，且监控能够发现副本退化。\n\n本例保留 Chart 对单体的节点级反亲和，三个副本需要足够节点。节点级隔离不等于可用区隔离；跨区方案必须连同网络、对象存储与应用流量一起设计。", "subs": ["要同时成立的高可用条件"]}, {"title": "14.5 滚动更新、PDB 与恢复验收", "content": "PDB 限制的是受其约束的自愿中断，不会阻止服务器突然断电、磁盘损坏或进程 OOM，也不能代替 Replica 数和对象存储恢复方案。[PodDisruptionBudget][S-k8s-pdb]\n\n教学故障实验仅删除明确选定的一个实验 Pod，保留 PVC；不要使用带通配符的节点关机或批量强制删除。实验前写一批日志，实验期间继续低速写入，恢复后按批次 ID 对账。\n\n| 阶段 | 记录内容 |\n| --- | --- |\n| 故障前 | 三个健康实例、Ring、写入和查询基线 |\n| 单实例退出 | 入口返回、重试计数、剩余健康副本 |\n| 实例恢复 | WAL 重放时间、Ready 时间、首次可查时间 |\n| 完整恢复 | 缺失与重复、查询延迟、对象上传恢复 |\n| 剩余风险 | 网关、对象存储、同区资源、监控的单点 |\n\n不要把客户端重试后的最终成功掩盖为“无任何影响”。重试延迟、恢复时间和应用侧缓冲消耗也属于可用性的组成部分。", "subs": []}, {"title": "14.6 何时继续使用单体", "content": "单体的优势是部署面少、排障路径短；代价是写入、查询、后台维护竞争同一组资源。微服务能分开扩容，但会增加网络、配置、服务发现和状态管理成本。[部署模式][S-modes]\n\n一个适合团队的决策问题是：当前瓶颈是否已经被证据定位到某一个独立角色，且拆分带来的收益是否超过维护成本？不要只按“每天多少 GB”机械选择架构，因为相同写入量在 Stream 数、日志大小、查询跨度和并发不同的情况下，资源需求可能差异很大。", "subs": []}]}, {"title": "第 15 章：Distributed 微服务部署", "sections": [{"title": "15.1 从瓶颈出发拆分，而不是先增加组件", "content": "假设一次大范围查询占满 CPU，导致同一单体上的日志接收出现延迟。拆出查询层可以改善资源隔离；但如果真正瓶颈是共享对象存储的 Get 限流，增加 Querier 反而可能把后端压得更重。\n\n微服务部署把前面已经理解的职责放进不同进程。它不改变标签的基数，不自动修复错误的 Schema，也不会替你提供租户认证。优先保留同一组样本和查询，在拓扑变化前后验证结果等价。[Loki 组件][S-components][部署模式][S-modes]\n\n| 角色 | 初始实验副本 | 扩容前重点观察 |\n| --- | ---: | --- |\n| Distributor | 2 | 接收速率、验证成本、下游错误 |\n| Ingester | 3 | 活跃 Stream、内存、WAL、刷新压力 |\n| Query Frontend | 2 | 入口并发、缓存与请求拆分 |\n| Query Scheduler | 2 | 排队、租户公平性与工作者连接 |\n| Querier | 2 | CPU、扫描量、对象下载、查询内存 |\n| Index Gateway | 2 | 索引请求、缓存和冷启动 |\n| Compactor | 1 | 后台任务耗时、清理状态和对象权限 |\n| Gateway | 2 | 身份接入、路由、连接与流量 |\n\n这些副本数和资源值只是教学起点，不是经过压测的生产标准。当前 Loki 支持特定的 Compactor 水平扩展方案，但不能只改 `replicas` 而不配置协调、角色与工作分配；本实验保留一个 Compactor，复杂扩展单独评审。[Compactor 横向扩容][S-compactor-scale]", "subs": []}, {"title": "15.2 完整的拓扑覆盖文件", "content": "文件：`lab/helm/values-distributed-overlay.yaml`。这是**第三个独立实验部署**，使用与 HA 实验不同的 Bucket 或经过明确隔离的对象范围。不要让两套互不协调的完整实验共同写入、压缩和删除同一租户数据。\n\n```yaml\n# 新建微服务实验，叠加在 monolithic 与 ha-overlay 后。\n# 保留连接参数，但改用独立实验 Bucket；提前创建并授予对应实验凭据权限。\ndeploymentMode: Distributed\nloki:\n  storage:\n    bucketNames:\n      chunks: loki-dist-lab-chunks\n      ruler: loki-dist-lab-ruler\n  pattern_ingester:\n    enabled: false\n  bloom_build:\n    enabled: false\n  bloom_gateway:\n    enabled: false\ndefaults:\n  extraArgs:\n    - -config.expand-env=true\n  extraEnvFrom:\n    - secretRef:\n        name: loki-s3-auth\nsingleBinary:\n  replicas: 0\nread:\n  replicas: 0\nwrite:\n  replicas: 0\nbackend:\n  replicas: 0\ndistributor:\n  replicas: 2\n  resources:\n    requests:\n      cpu: 250m\n      memory: 256Mi\n    limits:\n      cpu: \"2\"\n      memory: 1Gi\ningester:\n  replicas: 3\n  zoneAwareReplication:\n    enabled: false\n  persistence:\n    enabled: true\n    claims:\n      - name: data\n        accessModes: [ReadWriteOnce]\n        size: 20Gi\n    enableStatefulSetAutoDeletePVC: false\n  terminationGracePeriodSeconds: 300\n  resources:\n    requests:\n      cpu: 500m\n      memory: 1Gi\n    limits:\n      cpu: \"2\"\n      memory: 4Gi\nquerier:\n  replicas: 2\n  resources:\n    requests:\n      cpu: 250m\n      memory: 512Mi\n    limits:\n      cpu: \"2\"\n      memory: 2Gi\nqueryFrontend:\n  replicas: 2\nqueryScheduler:\n  replicas: 2\nindexGateway:\n  replicas: 2\n  # 索引缓存可重建；是否持久化按该组件 values 与冷启动成本评估。\ncompactor:\n  replicas: 1\n  persistence:\n    enabled: true\n    size: 10Gi\nruler:\n  enabled: false\n  replicas: 0\n# 需要在渲染结果中核对未启用的可选功能，不能仅看 replicas 表。\n```\n\n这版 Chart 的 Ingester 持久化容量写在 `persistence.claims` 中，而不是所有组件统一使用 `persistence.size`。Compactor 和单体的配置又不同。阅读同一 Chart 的各组件段落，不要靠字段名字相似推断配置。[Chart 18.13.5 values][S-chart-values]\n\n渲染顺序：\n\n```bash\nhelm template loki-dist lab/vendor/loki-18.13.5.tgz \\\n  --namespace loki-dist-lab \\\n  -f lab/helm/values-monolithic.yaml \\\n  -f lab/helm/values-ha-overlay.yaml \\\n  -f lab/helm/values-distributed-overlay.yaml \\\n  > lab/rendered/distributed.yaml\npython lab/scripts/render_inventory.py lab/rendered/distributed.yaml \\\n  > lab/rendered/distributed.inventory.json\n```\n\n随后按照独立实验对象存储、Secret、集群资源和认证边界完成准入检查，再用同样的 `-f` 顺序执行 `helm upgrade --install`。本节不重复第 14 章的完整安装流程。\n\n#### 最值得检查的渲染差异\n\n预期不再出现运行中的单体，也不应该出现 SSD 的 `read/write/backend` 工作负载。查询工作者连接 Query Scheduler，写入入口进入 Distributor，Compactor 的工作目录位于持久卷，Ingester 的数据和 WAL 不落在无意使用的 `emptyDir` 中。\n\nIndex Gateway 的索引缓存可以从对象存储重建，本例没有额外指定其持久卷参数；是否持久化应结合该组件实际 values 和冷启动成本选择。**缓存可重建与 WAL 可丢弃是两回事。**", "subs": ["最值得检查的渲染差异"]}, {"title": "15.3 网络路径与路由验收", "content": "组件拆开后，`/ready` 全部为 200 仍不意味着所有方向的数据连接都正常。以下端口以本例渲染结果为准，若覆盖端口必须同步修改 Service、NetworkPolicy 和监控。\n\n| 连接方向 | 常见协议 / 本例端口 | 验证重点 |\n| --- | --- | --- |\n| 客户端 → 可信网关 | HTTPS，外部入口自定 | 认证、租户、请求体与限额 |\n| 网关 → HTTP 组件 | HTTP 3100 | 写入、查询、规则和删除分开路由 |\n| Loki 内部 RPC | gRPC 9095 | 不把 HTTP 3100 当成 RPC 地址 |\n| Memberlist 成员 | TCP/UDP 7946 | Pod 到 Pod 可达，DNS 与加入地址正确 |\n| 组件 → 对象存储 | HTTPS，服务自定 | 出网、代理、CA、签名和权限 |\n| 组件 → 缓存 | Memcached，通常 11211 | 仅内部访问、容量和超时 |\n| 监控 → 指标接口 | HTTP metrics | 不通过未授权公网暴露 |\n\n生产网络策略应该从这张连接矩阵推导，而不是复制一个“全部允许”的 YAML。Memberlist 既涉及 TCP 也涉及 UDP，只放开一个协议可能导致间歇性成员问题。[Hash Rings][S-rings][Chart 18.13.5 values][S-chart-values]\n\n写入路径至少分别验证 `/loki/api/v1/push` 和实际使用时的 `/otlp/v1/logs`。查询路径验证 `query_range`、标签发现和索引统计。删除与规则管理接口不能因为网关模板支持路由就默认向所有客户端开放。", "subs": []}, {"title": "15.4 有状态角色的扩缩容", "content": "Distributor 的一次扩容主要改变接收能力；Ingester 扩缩容还涉及 Ring、分片归属和未刷新数据；Compactor 与 Ruler 又各有协调和状态要求。把所有 Deployment/StatefulSet 统一挂上同一个 CPU HPA 策略，不能表达这些差异。\n\n对 Ingester 缩容，至少确认停止接收新流、已有数据的刷新/转移策略、WAL 保存、终止宽限期和 PVC 保留。缩容后若旧 PVC 被自动删除，恢复方案就失去了一个潜在数据来源。[Ingester WAL][S-wal]\n\n```text\n缩容申请\n  → 评估目标副本数是否满足 RF 与故障域\n  → 检查当前 Ring / 上传 / WAL / 积压\n  → 按版本流程有序退出一个实例\n  → 验证读写与缺失对账\n  → 再决定是否继续下一步\n```\n\n仅执行 `kubectl scale` 后看到 Replica 数变小，不是缩容验收。还要观察剩余实例是否过载、是否出现写入拒绝，以及历史查询是否完整。", "subs": []}, {"title": "15.5 节点与可用区的差别", "content": "本实验显式关闭 Ingester 的 zone-aware replication，使用三个节点的初始布局，避免隐藏一个需要额外规划的可用区拓扑。生产跨区部署应结合实际区标签、Replica 分配、Zone Aware 配置和升级顺序一起设计。[可用区副本][S-zones]\n\n| 失败类型 | 节点级分散能否单独解决 |\n| --- | --- |\n| 单个节点宕机 | 有助于保留其他节点上的副本 |\n| 一个可用区整体故障 | 不足，副本可能都在该区 |\n| 共享对象存储故障 | 不足，所有副本仍依赖后端 |\n| 错误配置同步发布 | 不足，所有区可能一起受影响 |\n| 错误删除操作 | 不足，副本不是独立备份 |\n\n把“高可用”写成故障假设集合：允许哪些故障同时发生、哪些证据仍能读取、多久恢复。这个定义比一个固定副本数更有用。", "subs": []}, {"title": "15.6 拆分后的验收记录", "content": "把上一套实验相同的输入批次送到 Distributed 环境，并使用相同统计窗口。观察差异而不预设它一定更快。\n\n| 指标 | 单体记录 | 分布式记录 | 必須说明的条件 |\n| --- | --- | --- | --- |\n| 事件覆盖 | 实际填写 | 实际填写 | 同一批次、是否完整分页 |\n| 首次可查询延迟 | 实际填写 | 实际填写 | 发送速率、查询轮询周期 |\n| 错误/重复 | 实际填写 | 实际填写 | 客户端重试与查询去重影响 |\n| 冷查询耗时 | 实际填写 | 实际填写 | 缓存是否已被预热 |\n| 峰值资源 | 实际填写 | 实际填写 | 全部组件合计，不只看一个 Pod |\n| 维护成本 | 实际填写 | 实际填写 | 对象数量、升级和排障步骤 |\n\n表中没有给出伪造的实测数值。是否切换架构，应由相同业务目标下的这些记录支持。", "subs": []}]}, {"title": "第 16 章：日志保留、删除与 Compactor", "sections": [{"title": "16.1 先区分查询期限、保留期限和物理删除", "content": "查询限制决定用户能查多大时间范围；Retention 决定数据何时进入清理流程；对象存储空间下降又取决于异步删除和后端统计。三者不等价。[日志保留][S-retention][日志删除][S-delete]\n\n```mermaid\nflowchart LR\n    A[到达保留条件] --> B[Compactor 处理索引]\n    B --> C[移除相应引用并保存删除标记]\n    C --> D[等待删除延迟]\n    D --> E[异步删除 Chunk 对象]\n    E --> F[对象列表与容量统计反映变化]\n```\n\n删除延迟不是无意义的等待。查询组件可能缓存索引，过早删除对象会让尚未更新的索引指向不存在的 Chunk。实验里应观察各阶段，不应该为了让磁盘曲线马上下降就随意压缩延迟。\n\nCompactor 默认没有启用 Retention 时，不会因为你记得“日志只保留一周”就自动清理。文件系统磁盘满也不会自动转成安全的按时间淘汰策略。", "subs": []}, {"title": "16.2 一份明确的保留配置", "content": "下面是第 13 章 S3 单体实验的**合并片段**。保持既有 Schema、S3、WAL 和其他配置不变，在对应顶层键中合并，不能把整个片段直接追加到文件末尾造成重复 YAML 键。\n\n```yaml\ncompactor:\n  working_directory: /loki/compactor\n  compaction_interval: 10m\n  retention_enabled: true\n  retention_delete_delay: 2h\n  retention_delete_worker_count: 10\n  delete_request_store: s3\nlimits_config:\n  retention_period: 168h\n  retention_stream:\n    - selector: '{environment=\"lab\", job=\"access\"}'\n      priority: 10\n      period: 48h\n```\n\n所有时长和并发只是教学起点。确保 Compactor 的工作目录持久化，且对象存储账号允许相应删除操作；否则索引/标记处理与实际删除可能停在不同阶段。[日志保留][S-retention]\n\n使用日级实验数据，观察超过 48 小时的目标日志和不匹配流的差别。不要为了快速演示直接向已有活跃流注入极旧时间戳：它可能先被写入校验拒绝，根本没有进入清理实验。\n\n#### 保留规则按索引标签匹配\n\n`retention_stream.selector` 的标签选择不是一个任意 LogQL 正文过滤程序。要按正文中的用户 ID 或消息关键词清理特定日志，应评估显式删除接口和其权限/审计流程，而不是把 `| json` 放进流保留 selector。\n\n也不要为了让保留规则更细而把每个请求 ID都提升成索引标签。安全、基数和保留粒度需要一起设计。", "subs": ["保留规则按索引标签匹配"]}, {"title": "16.3 租户级覆盖与优先级", "content": "Runtime overrides 用于部分租户配置。示例文件 `runtime-overrides.yaml`：\n\n```yaml\noverrides:\n  training:\n    retention_period: 336h\n    retention_stream:\n      - selector: '{environment=\"lab\", job=\"access\"}'\n        priority: 20\n        period: 72h\n```\n\n在 Loki 配置中指定实际挂载路径：\n\n```yaml\nruntime_config:\n  file: /etc/loki/runtime-overrides.yaml\n```\n\n注意第一卷 `auth_enabled: false` 使用单租户语义；写一个 `training` override 并不会自动把原数据搬进该租户。多租户接入见第四卷，必须同时对齐可信租户 Header、数据源和验证脚本。[多租户][S-tenancy]\n\n当前保留规则的优先级应按官方文档核对：同一规则层优先取较高 priority，匹配的同优先级规则取较短期限；租户级流规则与全局流规则不是把两个列表无条件拼起来统一排序。没有命中流规则时，再考虑该租户或全局 period。变更前为每种标签组合手工算出预期结果。[日志保留][S-retention]\n\n| 样本 | 预期采用的规则 | 验证方法 |\n| --- | --- | --- |\n| training / lab / access | 租户流规则 72h | 记录边界前后的事件 |\n| training / 其他 job | 租户默认 336h | 避免误套全局流策略 |\n| 其他租户 / lab / access | 全局流规则 48h | 在对应租户查询 |\n| 其他租户 / 未命中流 | 全局默认 168h | 同时验证未过期事件仍在 |\n\n这张表对应本节给定的两份规则，不是所有可能配置的通用优先级速记。", "subs": []}, {"title": "16.4 显式删除：先查询，再审批", "content": "删除是不可恢复风险操作，不能作为普通只读 MCP 工具暴露。测试只针对隔离租户、确知的事件和窄时间窗口，并先保存查询结果与操作审批。[日志删除][S-delete][Loki HTTP API][S-http]\n\n启用删除通常需要配置允许相应 deletion mode；生产必须审核此开关。HTTP 删除接口的时间参数按 API 文档使用 Unix 秒或 RFC3339，**不是前面 query_range 脚本使用的纳秒字符串**。\n\n只读列出删除请求：\n\n```bash\n# 使用已授权的实验管理入口；不在命令行放明文密钥。\ncurl --fail --max-time 10 \\\n  -H 'X-Scope-OrgID: training' \\\n  http://127.0.0.1:13100/loki/api/v1/delete\n```\n\n下面仅演示经过审核后的请求形状，不附通用“全量清空”命令：\n\n```text\n方法：POST\n路径：/loki/api/v1/delete\n租户：由可信认证入口固定为 training\nquery：{environment=\"lab\",job=\"access\"} | event_id=\"已核实的实验事件 ID\"\nstart：明确的 RFC3339 起点\nend：明确的 RFC3339 终点\n```\n\n请求被接受只证明创建了删除任务。继续检查任务状态、取消窗口、查询可见性和对象清理情况，且保留审计记录。对象版本控制或保留锁还可能使“逻辑删除”与实际占用空间不同；这属于存储产品的独立策略，不能通过 Loki API 状态推断全部物理副本消失。", "subs": []}, {"title": "16.5 对象存储生命周期只能作为经过评审的配合机制", "content": "对象存储 Lifecycle 可以作为成本治理的一环，但不能与 Loki 索引状态脱节。期限必须覆盖日志保留时间、异步删除延迟和安全余量；使用独立 Prefix 规则时还要证明命中的确是可淘汰 Chunk，而不是索引、规则、删除标记或集群元数据。[日志保留][S-retention]\n\n**不要给共享 Bucket 配一条空前缀的 N 天删除规则。**也不要把 `index.prefix` 理解成云存储中某个可以直接删除的路径，它是 Schema 配置中的索引表前缀，必须以实际对象布局核对。\n\n| 操作 | 可能结果 | 更稳妥的做法 |\n| --- | --- | --- |\n| 桶级 TTL 比 Loki 更短 | 索引指向已删除对象 | 先确定 Retention 与标记清理 |\n| 手工删除 `index` 对象 | Chunk 还在却难以查询 | 恢复已验证的索引与 Schema |\n| 删除 Compactor 工作目录 | 清理状态丢失或重做 | 先备份并依据版本恢复流程 |\n| 仅调查询最大跨度 | 存储空间不下降 | 区分查询限额与保存策略 |\n| 一次性缩短全部保留期 | 大规模删除与后端负载 | 先用隔离租户灰度并评估不可逆影响 |", "subs": []}, {"title": "16.6 清理故障的定位顺序", "content": "保留设置没有达到预期时，按以下顺序取得证据：\n\n```text\n对象真的属于当前租户/Schema吗？\n  → 规则是否命中这组索引标签？\n  → 当前处理的是哪个事件时间和索引时间段？\n  → Compactor是否启用Retention并健康工作？\n  → 是否产生了标记，是否仍在删除延迟内？\n  → 删除请求是否遇到权限/限流/后端错误？\n  → 统计是否包含旧版本对象、其他租户和规则数据？\n```\n\n修复前保存配置、任务状态和对应日志。不要先清目录再调查原因，否则可能同时破坏故障证据和恢复来源。\n\n#### 本卷回顾\n\n读完本卷，应能把“日志已经安全保存”拆成可验证的状态：客户端确认、Ingester/WAL、对象上传、索引可读、查询覆盖和清理状态。单体、HA 单体和微服务只是这些职责的不同部署方式，不是三个互不相关的产品。\n\n[上一卷：基础与采集](01-foundations-and-alloy.md) · [返回阅读入口](README.md) · [下一卷：LogQL、Grafana 与告警](03-logql-grafana-and-alerting.md)\n\n---\n\n**资料说明：** 文中链接为官方文档或固定版本源码；在线文档可能后续更新，配置应以本书锁定版本和目标环境验收为准。\n\n[S-architecture]: https://grafana.com/docs/loki/latest/get-started/architecture/\n[S-cache]: https://grafana.com/docs/loki/latest/operations/caching/\n[S-chart-release]: https://github.com/grafana-community/helm-charts/releases/tag/loki-18.13.5\n[S-chart-values]: https://github.com/grafana-community/helm-charts/blob/loki-18.13.5/charts/loki/values.yaml\n[S-compactor-scale]: https://grafana.com/docs/loki/latest/operations/storage/compactor-horizontal-scaling/\n[S-components]: https://grafana.com/docs/loki/latest/get-started/components/\n[S-delete]: https://grafana.com/docs/loki/latest/operations/storage/logs-deletion/\n[S-http]: https://grafana.com/docs/loki/latest/reference/loki-http-api/\n[S-ingestion]: https://grafana.com/docs/loki/latest/operations/request-validation-rate-limits/\n[S-k8s-pdb]: https://kubernetes.io/docs/tasks/run-application/configure-pdb/\n[S-k8s-storage]: https://kubernetes.io/docs/concepts/storage/persistent-volumes/\n[S-limits]: https://grafana.com/docs/loki/latest/configure/\n[S-modes]: https://grafana.com/docs/loki/latest/get-started/deployment-modes/\n[S-query-fairness]: https://grafana.com/docs/loki/latest/operations/query-fairness/\n[S-query-frontend]: https://grafana.com/docs/loki/latest/configure/examples/query-frontend/\n[S-release-loki]: https://github.com/grafana/loki/releases/tag/v3.7.8\n[S-retention]: https://grafana.com/docs/loki/latest/operations/storage/retention/\n[S-rings]: https://grafana.com/docs/loki/latest/get-started/hash-rings/\n[S-schema]: https://grafana.com/docs/loki/latest/operations/storage/schema/\n[S-storage]: https://grafana.com/docs/loki/latest/configure/storage/\n[S-tenancy]: https://grafana.com/docs/loki/latest/operations/multi-tenancy/\n[S-thanos]: https://grafana.com/docs/loki/latest/configure/examples/thanos-storage-configs/\n[S-tsdb]: https://grafana.com/docs/loki/latest/operations/storage/tsdb/\n[S-wal]: https://grafana.com/docs/loki/latest/operations/storage/wal/\n[S-zones]: https://grafana.com/docs/loki/latest/operations/zone-ingesters/", "subs": ["本卷回顾"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
