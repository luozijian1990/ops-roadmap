<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

<script id="data" type="application/json">{"title": "GitOps 原则、工作流与组织落地学习笔记", "intro": "", "parts": [{"title": "第 1 章 · 从操作脚本走向持续调谐", "sections": [{"title": "命令式、声明式与控制循环分别保存什么状态", "content": "GitOps 首先是一种系统操作方法，不是某个产品的别名。它把“系统应该是什么样”写成声明，由控制器不断比较期望状态与实际状态，再执行创建、修改、删除或等待。用户不需要把每一个过程步骤写进发布脚本，但仍然必须理解控制器会采取什么动作、什么情况下拒绝动作，以及失败后留下什么证据。\n\n命令式和声明式的差异可以从三个问题观察：谁保存目标、谁决定步骤、失败后谁继续收敛。\n\n| 维度 | 命令式发布 | 声明式交付 |\n|---|---|---|\n| 输入 | 一串有顺序的操作 | 完整的期望状态 |\n| 当前状态 | 脚本临时读取或操作者记忆 | 控制器持续观察 |\n| 重试 | 需要脚本显式处理 | 下一轮调谐重新评估 |\n| 幂等 | 取决于每条命令 | 由资源模型和控制器共同保证 |\n| 审计 | 分散在流水线日志和终端历史 | 版本历史加控制器事件 |\n| 删除 | 往往另写清理脚本 | 通过声明移除和删除策略表达 |\n\n声明式并没有消灭过程，只是把过程封装进控制器。例如声明一个 Deployment 副本数为 3，背后仍然包含 ReplicaSet 创建、Pod 调度、镜像拉取、探针检查和旧副本缩容。控制器替操作者执行重复决策，但资源约束、依赖顺序和错误恢复仍要设计。\n\n```mermaid\nflowchart LR\n    User[Engineer] -->|Commit desired state| Store[Versioned state store]\n    Agent[Reconciliation agent] -->|Pull declaration| Store\n    Agent -->|Observe| Runtime[Runtime system]\n    Agent -->|Apply change| Runtime\n    Runtime -->|Status and events| Agent\n    Agent -->|Report convergence| Status[Delivery status]\n```\n\n判断一个流程是否真正声明式，可以做一个简单实验：停止控制器，手工改变运行对象，再恢复控制器。如果控制器能够根据版本化声明识别偏差、按策略恢复并报告结果，这才形成闭环；如果每次仍要人工重新点击流水线，它只是把命令藏进了另一个按钮。\n\n#### 把现有发布脚本拆成可迁移的状态模型\n\n迁移前先逐行盘点脚本，不要直接把 Shell 塞进控制器 Hook。每条命令可以归入五类：\n\n| 命令意图 | 声明式承载方式 | 仍需过程控制时的做法 |\n|---|---|---|\n| 创建或更新资源 | Kubernetes、IaC 或策略对象 | 由控制器计算差异并应用 |\n| 等待条件 | Status、Condition、Health Check | 设置超时和失败状态 |\n| 一次性数据变更 | Job、Migration 资源 | 记录版本、幂等键和完成证明 |\n| 外部系统调用 | 专用 Operator 或工作流 | 限制重试并保存外部请求 ID |\n| 人工判断 | 审批、Analysis 或策略门禁 | 明确输入、时限和默认动作 |\n\n迁移步骤如下：\n\n1. 保存脚本当前输入、输出、凭据、外部依赖和失败恢复方式。\n2. 找出脚本隐含读取的状态，例如“上次发布版本”或共享目录中的标记文件。\n3. 为每种状态选择稳定的声明位置和观察接口。\n4. 把可重复动作交给控制器，把不可重复动作包装成有身份、有状态的任务。\n5. 定义中断后重跑语义，证明任务不会重复扣款、重复迁移或重复发送通知。\n6. 在隔离环境比较旧流程与新流程的最终对象和业务结果。\n\n验收时至少执行三次：从空环境创建、无变更重复同步、从中间失败恢复。只验证首次成功，不能证明声明式流程具备幂等和收敛能力。\n\n仍需手工执行的步骤要显式保留，而不是假装已经自动化。为它定义负责人、输入证据、最长等待时间和超时后的安全状态，后续再决定是否值得控制器化。\n\n#### 命令式、声明式与控制循环分别保存什么状态的机制边界\n\n用部署脚本、Kubernetes 声明和控制器三种模型比较输入、状态、重试、幂等和删除语义；增加“首次执行、重复执行、中途失败恢复”实验。\n\n- **命令式、声明式与控制循环分别保存什么状态的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **命令式、声明式与控制循环分别保存什么状态的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **命令式、声明式与控制循环分别保存什么状态的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **命令式、声明式与控制循环分别保存什么状态的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“命令式、声明式与控制循环分别保存什么状态”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“命令式、声明式与控制循环分别保存什么状态”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### 命令式、声明式与控制循环分别保存什么状态的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `命令式、声明式与控制循环分别保存什么状态` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `命令式、声明式与控制循环分别保存什么状态` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `命令式、声明式与控制循环分别保存什么状态` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `命令式、声明式与控制循环分别保存什么状态` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“命令式、声明式与控制循环分别保存什么状态”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 命令式、声明式与控制循环分别保存什么状态的静态检查模板\n\n下面命令为“命令式、声明式与控制循环分别保存什么状态”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 命令式、声明式与控制循环分别保存什么状态\nevidence_file=\"./evidence/check-1487a21e39.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“命令式、声明式与控制循环分别保存什么状态”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 命令式、声明式与控制循环分别保存什么状态的故障实验与恢复\n\n“命令式、声明式与控制循环分别保存什么状态”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“命令式、声明式与控制循环分别保存什么状态”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“命令式、声明式与控制循环分别保存什么状态”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“命令式、声明式与控制循环分别保存什么状态”执行恢复策略：冻结后续变更并保留当前稳定状态，恢复版本化输入后等待控制器重新收敛，再用业务证据关闭事件。\n4. 重新采集“命令式、声明式与控制循环分别保存什么状态”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“命令式、声明式与控制循环分别保存什么状态”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["把现有发布脚本拆成可迁移的状态模型", "命令式、声明式与控制循环分别保存什么状态的机制边界", "命令式、声明式与控制循环分别保存什么状态的决策与证据", "命令式、声明式与控制循环分别保存什么状态的静态检查模板", "命令式、声明式与控制循环分别保存什么状态的故障实验与恢复"]}, {"title": "OpenGitOps 四原则如何共同形成闭环", "content": "OpenGitOps 用四条原则描述 GitOps 管理系统的期望状态：声明式、版本化且不可变、由软件代理自动拉取、由软件代理持续调谐。这四条原则必须同时存在，缺一条都会改变系统的安全和恢复性质。\n\n#### 原则一：声明式\n\n声明描述结果，而不是一次性过程。Kubernetes YAML、Terraform 配置或策略对象都可能成为声明，但“用了 YAML”并不自动等于声明式。若 YAML 内嵌大量不可重复的 Shell 操作，或外部状态完全不受观察，它仍然可能是命令式包装。\n\n#### 原则二：版本化且不可变\n\n期望状态必须保留完整版本历史。这里的不可变不是永远不能修改文件，而是已经形成的版本身份不能被悄悄替换。Git Commit、OCI Digest 和签名证明分别固定配置、制品与来源；可变 Tag 只能作为导航，不能独自承担生产追溯。\n\n#### 原则三：自动拉取\n\n运行环境中的代理主动取得期望状态，而不是让外部流水线持有高权限凭据并直接推入每个集群。拉取模型缩小了跨网络凭据暴露面，但控制器本身因此成为高价值组件，需要限制仓库、项目、目标命名空间和可创建资源类型。\n\n#### 原则四：持续调谐\n\n控制器不仅在 Commit 到来时运行，还会周期性或事件驱动地观察实际状态。手工改动、节点恢复、依赖暂时不可用都可能触发新的调谐。持续调谐的目标是收敛，不是保证每轮都成功；长时间无法收敛必须进入指标、告警和人工处置流程。\n\n| 缺失原则 | 表面现象 | 实际风险 |\n|---|---|---|\n| 无声明式 | Git 中存脚本 | 无法可靠计算差异 |\n| 无版本历史 | 共享目录覆盖文件 | 不知道部署过什么 |\n| 无自动拉取 | CI 直连所有集群 | 凭据扩散和故障域放大 |\n| 无持续调谐 | 只在合并时部署一次 | 漂移长期不被发现 |\n\n#### 用四原则审查现有发布流程\n\n不要从“是否安装了 Argo CD”开始审查，而要从一次真实发布留下的输入、身份和恢复行为开始。选择最近一次正常发布和一次失败发布，分别回答以下问题：\n\n1. 期望状态是否完整写在机器可读的声明中，还是仍依赖发布人员记住参数、顺序或手工补丁？\n2. 生产正在运行的配置能否定位到一个不可被覆盖的版本，制品能否定位到 Digest？\n3. 运行环境是否由内部代理读取声明，还是外部 Runner 仍持有跨环境管理员凭据？\n4. 发布完成后，代理是否继续观察漂移，还是只有下一次流水线运行才会重新检查？\n\n审查结果可以记录成一张差距表：\n\n| 检查对象 | 当前证据 | 缺失原则 | 修复动作 | 验证方式 |\n|---|---|---|---|---|\n| 生产 Deployment | 流水线日志 | 版本化、持续调谐 | 纳入配置仓库和 Application | 手工改副本后观察恢复 |\n| 镜像版本 | `stable` Tag | 版本化且不可变 | 记录并部署 Digest | 从 Pod 反查 Registry Manifest |\n| 集群凭据 | CI 长期 kubeconfig | 自动拉取 | 改为集群内控制器身份 | 撤销 Runner 凭据后仍可发布 |\n| 临时修复 | 终端历史 | 声明式、版本化 | 建立 Break Glass 回写流程 | 核对事件、工单和补交 Commit |\n\n通过标准不是表格全部写成“已安装”，而是每一条都能用现场证据复现。若某项只能由当事人口述，说明这部分交付事实还没有进入系统记录。\n\n#### OpenGitOps 四原则如何共同形成闭环的机制边界\n\n每条原则分别给出合规示例、伪 GitOps 反例、验证问题和缺失后的风险，不只保留定义表。\n\n- **OpenGitOps 四原则如何共同形成闭环的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **OpenGitOps 四原则如何共同形成闭环的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **OpenGitOps 四原则如何共同形成闭环的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **OpenGitOps 四原则如何共同形成闭环的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“OpenGitOps 四原则如何共同形成闭环”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“OpenGitOps 四原则如何共同形成闭环”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### OpenGitOps 四原则如何共同形成闭环的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `OpenGitOps 四原则如何共同形成闭环` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `OpenGitOps 四原则如何共同形成闭环` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `OpenGitOps 四原则如何共同形成闭环` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `OpenGitOps 四原则如何共同形成闭环` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“OpenGitOps 四原则如何共同形成闭环”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### OpenGitOps 四原则如何共同形成闭环的静态检查模板\n\n下面命令为“OpenGitOps 四原则如何共同形成闭环”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: OpenGitOps 四原则如何共同形成闭环\nevidence_file=\"./evidence/check-fdf541cb1d.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“OpenGitOps 四原则如何共同形成闭环”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### OpenGitOps 四原则如何共同形成闭环的故障实验与恢复\n\n“OpenGitOps 四原则如何共同形成闭环”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“OpenGitOps 四原则如何共同形成闭环”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“OpenGitOps 四原则如何共同形成闭环”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“OpenGitOps 四原则如何共同形成闭环”执行恢复策略：冻结后续变更并保留当前稳定状态，恢复版本化输入后等待控制器重新收敛，再用业务证据关闭事件。\n4. 重新采集“OpenGitOps 四原则如何共同形成闭环”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新 ccepted | 发布门禁 | SLI 结果、观察窗口、决策人 | 关闭发布或继续晋级 |\n\n事件可以是 API 对象、消息或结构化记录，关键是有幂等身份和可查询生命周期。同一个 CI 重试不应制造多个不同候选版本，同一个配置 Commit 的重复调谐也不应被计算为多次发布。\n\n边界故障要有明确语义：CI 成功而配置 PR 创建失败时，制品保持“已验证、未晋级”；配置已合并但控制器未检测时，事实来源仍是新 Commit，运行态则保持旧 Revision；资源收敛但业务门禁失败时，发布状态是“运行中但未接受”。\n\n不要用一个布尔字段 `success` 压平这些阶段。至少保留候选、已提议、已接受期望、已收敛和已通过业务验证几种状态，排障人员才能判断安全的下一动作。\n\n平台提供的黄金路径应把这些字段自动贯穿，但允许团队附加业务证据。平台负责通用身份和状态机，业务团队负责定义功能正确性与风险阈值。\n\n```mermaid\nflowchart LR\n    Code[Source commit] --> CI[CI verification]\n    CI --> Artifact[Immutable artifact]\n    CI --> Evidence[SBOM signature provenance]\n    Artifact --> Change[Desired state change]\n    Evidence --> Gate[Policy gate]\n    Change --> Gate\n    Gate --> Repo[Configuration repository]\n    Repo --> CD[GitOps reconciler]\n    CD --> Runtime[Runtime environment]\n```\n\n#### CI 的终点和 GitOps 的起点如何定义制品契约的机制边界\n\n定义 Source SHA、Digest、验证结果、候选状态和配置提案，区分“构建成功”“可以晋级”“已经发布”。\n\n- **CI 的终点和 GitOps 的起点如何定义制品契约的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **CI 的终点和 GitOps 的起点如何定义制品契约的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **CI 的终点和 GitOps 的起点如何定义制品契约的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **CI 的终点和 GitOps 的起点如何定义制品契约的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“CI 的终点和 GitOps 的起点如何定义制品契约”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“CI 的终点和 GitOps 的起点如何定义制品契约”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### CI 的终点和 GitOps 的起点如何定义制品契约的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `CI 的终点和 GitOps 的起点如何定义制品契约` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `CI 的终点和 GitOps 的起点如何定义制品契约` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `CI 的终点和 GitOps 的起点如何定义制品契约` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `CI 的终点和 GitOps 的起点如何定义制品契约` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“CI 的终点和 GitOps 的起点如何定义制品契约”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### CI 的终点和 GitOps 的起点如何定义制品契 的机制边界", "平台黄金路径怎样提供自助而不隐藏风险的决策与证据", "平台黄金路径怎样提供自助而不隐藏风险的静态检查模板", "平台黄金路径怎样提供自助而不隐藏风险的故障实验与恢复"]}, {"title": "控制器、仓库和集群分别形成什么信任边界", "content": "控制器只能对它能够观察和表达的状态负责。数据库 Schema 是否向后兼容、第三方支付是否正确、缓存是否污染、用户路径是否成功，通常不在 Kubernetes 对象状态里。即使所有资源都显示 Synced 和 Healthy，业务仍可能不可用。\n\n设计声明式交付时要同时列出四类边界：\n\n1. **表达边界**：哪些状态能写进声明，哪些必须由外部流程管理。\n2. **观察边界**：控制器能读取哪些资源、指标和依赖状态。\n3. **动作边界**：控制器可以创建、更新、删除到什么范围。\n4. **时间边界**：多久未收敛算异常，多久后必须停止重试或转人工。\n\n控制器持续重试可能带来正反馈故障。例如错误清单不断创建失败 Pod，拉高镜像仓库和调度器负载；错误的自动修复反复删除实例，扩大抖动。生产系统需要为并发、重试、超时、删除和失败暂停设置上限。\n\n| 观察结果 | 合理动作 | 不合理动作 |\n|---|---|---|\n| 仓库暂时不可达 | 保持现状并告警 | 删除当前工作负载 |\n| 新清单校验失败 | 拒绝同步并保留旧版本 | 尝试部分字段更新 |\n| 实际状态被手工修改 | 按策略恢复或只告警 | 无审计地覆盖所有差异 |\n| 业务 SLO 恶化 | 暂停晋级并保留证据 | 仅因资源 Ready 继续放量 |\n\n#### 用故障注入确认控制器边界\n\n边界设计必须通过受控实验验证。实验应在非生产环境执行，并预先定义停止条件、观察窗口和清理动作。\n\n| 故障 | 预期控制器行为 | 必须观察的证据 | 停止条件 |\n|---|---|---|---|\n| 暂停仓库访问 | 保持当前运行对象，不主动删除 | 拉取错误、上次成功 Revision、现有副本 | 出现非预期删除 |\n| 提交无效清单 | 渲染或准入失败，旧版本继续运行 | ComparisonError、准入拒绝、旧 Pod 状态 | 旧版本可用性下降 |\n| 手工修改副本数 | 按 Self Heal 策略恢复或只报告 | Diff、事件、恢复耗时 | 恢复动作超出应用范围 |\n| 让依赖返回 5xx | 资源可能 Healthy，但业务探测失败 | SLI、探测日志、发布门禁状态 | 错误预算消耗超过阈值 |\n| 制造无法调度的 Pod | 持续报告未收敛并触发告警 | Pending 原因、调度事件、超时告警 | 重试压垮控制面 |\n\n每次实验要同时记录“控制器做了什么”和“控制器没有能力做什么”。例如它能恢复 Deployment 副本，却不能判断新 Schema 是否兼容；后一个判断必须进入发布分析或外部变更流程。\n\n实验结束后检查所有临时对象、策略例外和告警静默是否已清理。能够触发故障却无法证明环境恢复干净，不算完成边界验收。\n\n\n传统推模式常由 CI Runner 持有 kubeconfig，在构建完成后执行 `kubectl apply` 或 `helm upgrade`。它容易上手，但随着环境和集群增加，Runner 会积累大量高权限凭据，并需要穿透每个集群的网络边界。\n\n拉模式把部署身份放到目标环境内部。控制器只读取被允许的仓库和路径，并在本地使用受限 ServiceAccount 操作资源。CI 只需提出配置变更，不需要直接访问生产集群。\n\n| 风险 | 推模式 | 拉模式 |\n|---|---|---|\n| 集群凭据 | 集中在外部 Runner | 留在目标环境 |\n| 网络入口 | 集群 API 需允许外部访问 | 控制器向外读取仓库 |\n| 变更恢复 | 重新运行流水线 | 控制器持续收敛 |\n| 多集群扩展 | Runner 凭据和路由膨胀 | 每个集群独立 Agent |\n| 中央故障 | CI 故障阻断所有部署 | 仓库或策略故障仍可能影响全部集群 |\n\n拉模式不是自动安全。控制器通常有较强权限；若它能读取任意仓库、模板任意 Project、部署集群级资源，攻击者只需控制一条输入路径就可能扩大到整个环境。因此必须同时限制 Repository、Revision、Path、Destination、Resource Kind 和删除策略。\n\n#### 控制器、仓库和集群分别形成什么信任边界的机制边界\n\n比较 Push、Pull 和混合模式的网络、凭据、审计与中央故障域；增加凭据撤销和仓库不可达实验。\n\n- **控制器、仓库和集群分别形成什么信任边界的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **控制器、仓库和集群分别形成什么信任边界的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **控制器、仓库和集群分别形成什么信任边界的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **控制器、仓库和集群分别形成什么信任边界的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n写入者必须声明字段所有权、目标分支和冲突策略，远端 HEAD 变化后重新计算而不是覆盖。\nCommit 已产生但本地状态丢失时先按变更 ID 查重，避免同一候选生成重复提交或 PR。\n\n#### 控制器、仓库和集群分别形成什么信任边界的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `控制器、仓库和集群分别形成什么信任边界` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `控制器、仓库和集群分别形成什么信任边界` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `控制器、仓库和集群分别形成什么信任边界` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `控制器、仓库和集群分别形成什么信任边界` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“控制器、仓库和集群分别形成什么信任边界”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 控制器、仓库和集群分别形成什么信任边界的静态检查模板\n\n下面命令为“控制器、仓库和集群分别形成什么信任边界”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 控制器、仓库和集群分别形成什么信任边界\nevidence_file=\"./evidence/check-966e70051e.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“控制器、仓库和集群分别形成什么信任边界”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 控制器、仓库和集群分别形成什么信任边界的故障实验与恢复\n\n“控制器、仓库和集群分别形成什么信任边界”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“控制器、仓库和集群分别形成什么信任边界”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“控制器、仓库和集群分别形成什么信任边界”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“控制器、仓库和集群分别形成什么信任边界”执行恢复策略：冻结新的写回，按变更 ID 查找已存在的 Commit 或 PR，重新读取远端 HEAD 后重算；错误提交使用显式 Revert。\n4. 重新采集“控制器、仓库和集群分别形成什么信任边界”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“控制器、仓库和集群分别形成什么信任边界”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["用故障注入确认控制器边界", "控制器、仓库和集群分别形成什么信任边界的机制边界", "控制器、仓库和集群分别形成什么信任边界的决策与证据", "控制器、仓库和集群分别形成什么信任边界的静态检查模板", "控制器、仓库和集群分别形成什么信任边界的故障实验与恢复"]}]}, {"title": "第 3 章 · 从代码提交到运行实例建立完整证据链", "sections": [{"title": "源码、制品、配置和运行状态四类存储如何交接", "content": "一个可审计的 GitOps 系统通常至少涉及源码仓库、制品仓库、配置仓库和目标集群。把所有对象混成“代码仓库”会掩盖不同生命周期和权限模型。\n\n#### 源码仓库\n\n保存业务代码、测试和构建定义。开发者对其有日常写权限，合并门禁关注代码质量。源码 Commit 是制品来源，但它本身不等于可部署制品。\n\n#### 制品仓库\n\n保存镜像、Chart、包和证明。写入者通常是 CI 身份，运行环境只有拉取权限。生产引用应落到 Digest 或等价不可变身份。\n\n#### 配置仓库\n\n保存环境期望状态。其写权限通常比源码仓库更严格，可以由发布机器人提交变更，再由环境 Owner 审批。配置仓库中的 Commit 是一次期望状态变更，而不是“脚本执行记录”。\n\n#### 目标集群\n\n保存运行态和控制器状态。它不是事实来源，而是被持续观察的实际系统。事件、状态字段、指标和审计日志用于解释为什么尚未收敛。\n\n```mermaid\nflowchart TB\n    Developer[Developer] --> Source[Source repository]\n    Source --> CI[CI system]\n    CI --> Registry[Artifact registry]\n    CI --> Proposal[Configuration change proposal]\n    Proposal --> Config[Configuration repository]\n    Config --> Reconciler[Reconciler]\n    Registry --> Cluster[Target cluster]\n    Reconciler --> Cluster\n    Cluster --> Evidence[Status events metrics logs]\n```\n\n四类存储要用稳定标识连接，而不是靠人猜测版本。最小关联字段包括源码 SHA、镜像 Digest、配置 Commit、环境、资源名称和部署时间窗口。\n\n#### 为四类存储定义交接契约\n\n每个交接点都要明确生产者、消费者、不可变身份、保留期限和失败语义。下面是一份最小契约示例：\n\n| 交接 | 生产者 | 消费者 | 必须携带 | 失败时保持什么 |\n|---|---|---|---|---|\n| 源码到 CI | 开发者与合并门禁 | 构建任务 | Commit SHA、分支保护结果 | 不产生可发布制品 |\n| CI 到 Registry | 构建身份 | 配置更新器、运行节点 | Digest、平台、签名、SBOM | 旧 Digest 仍可拉取 |\n| CI 到配置仓库 | 发布机器人 | 审批者、GitOps 控制器 | 旧/新 Digest、来源 SHA、证据链接 | 旧配置保持有效 |\n| 配置仓库到集群 | GitOps 控制器 | Kubernetes API | 配置 Commit、对象清单、同步选项 | 已运行版本不被误删 |\n| 集群到观测系统 | 工作负载与控制器 | SRE、发布门禁 | Revision、应用、环境、时间 | 保留足够排障窗口 |\n\n契约应写入仓库规范和自动校验，而不是只放在架构图里。例如配置 PR 缺少镜像 Digest 时拒绝合并，Pod 缺少版本标签时由策略引擎拒绝，证据保留时间短于回滚窗口时触发平台告警。\n\n灾备评审还要问：若任意一个存储暂时不可用，其他三类存储中的信息是否足以保持现有服务，并在恢复后重新建立关联。只能依赖单个平台页面查询的关联不是可靠契约。\n\n从合并到收敛至少经历“检测、生成、比较、计划、执行、观察”六个阶段。把它们拆开有助于排障：仓库检测失败和 Manifest 渲染失败看起来都像“没发布”，但责任组件完全不同。\n\n```mermaid\nsequenceDiagram\n    participant G as Git repository\n    participant R as Repository service\n    participant C as Application controller\n    participant K as Kubernetes API\n    participant W as Workload controllers\n    G->>R: New revision becomes visible\n    R->>R: Fetch and render manifests\n    R-->>C: Desired objects\n    C->>K: Read live objects\n    C->>C: Diff and build sync plan\n    C->>K: Apply approved changes\n    K->>W: Persist desired resources\n    W->>K: Update runtime status\n    K-->>C: Conditions events health inputs\n    C-->>G: Report revision status externally\n```\n\n排障时按阶段提问：\n\n1. 控制器是否看到了新的 Revision？\n2. 仓库凭据和网络是否允许读取？\n3. Kustomize、Helm 或插件是否成功渲染？\n4. Diff 是否被忽略规则、默认值或字段管理者影响？\n5. Sync Window、RBAC、准入策略是否允许执行？\n6. Kubernetes 控制器是否把对象推进到可用状态？\n7. 业务探测是否证明真实请求成功？\n\n#### 为六个阶段建立状态与证据矩阵\n\n同一个“发布失败”需要根据停留阶段分配给不同责任人。建议把阶段矩阵放进运行手册：\n\n| 阶段 | 成功信号 | 常见失败 | 首个检查点 | 责任角色 |\n|---|---|---|---|---|\n| 检测 | 控制器看到目标 Revision | Webhook 丢失、轮询延迟 | Refresh 时间与仓库 HEAD | 平台团队 |\n| 生成 | 清单渲染成功 | Values 缺失、插件错误 | Repository 服务日志 | 应用与平台团队 |\n| 比较 | 得到稳定 Diff | 默认值抖动、忽略规则过宽 | Desired/Live 字段差异 | 平台团队 |\n| 计划 | 资源顺序与策略允许执行 | Sync Window、依赖不满足 | Sync Plan 与策略结果 | 发布负责人 |\n| 执行 | API 接受期望对象 | RBAC、Quota、Webhook 拒绝 | Kubernetes 审计与事件 | 平台/SRE |\n| 观察 | 资源和业务在窗口内达标 | 探针、容量、依赖故障 | Conditions、SLI、日志 | 应用/SRE |\n\n演练时选择一个 Revision，逐阶段保存时间戳。若只能看到最终状态，无法解释哪一段占用了交付时间，也无法设置针对性的超时和服务目标。\n\n阶段超时不应统一设置。仓库拉取通常是秒级，镜像拉取受镜像大小和节点缓存影响，业务指标则需要足够样本窗口。每个超时都要说明依据、误报代价和超时后的动作。\n\n#### 源码、制品、配置和运行状态四类存储如何交接的机制边界\n\n为每个交接点定义生产者、消费者、不可变身份、保留期和失败语义，增加正常链路 Mermaid。\n\n- **源码、制品、配置和运行状态四类存储如何交接的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **源码、制品、配置和运行状态四类存储如何交接的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **源码、制品、配置和运行状态四类存储如何交接的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **源码、制品、配置和运行状态四类存储如何交接的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“源码、制品、配置和运行状态四类存储如何交接”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“源码、制品、配置和运行状态四类存储如何交接”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### 源码、制品、配置和运行状态四类存储如何交接的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `源码、制品、配置和运行状态四类存储如何交接` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `源码、制品、配置和运行状态四类存储如何交接` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `源码、制品、配置和运行状态四类存储如何交接` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `源码、制品、配置和运行状态四类存储如何交接` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“源码、制品、配置和运行状态四类存储如何交接”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 源码、制品、配置和运行状态四类存储如何交接的静态检查模板\n\n下面命令为“源码、制品、配置和运行状态四类存储如何交接”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 源码、制品、配置和运行状态四类存储如何交接\nevidence_file=\"./evidence/check-7cd4ad5cca.txt\"\ngit rev-parse HEAD | tee -a \"${evidence_file}\"\nkubectl get pod -n demo -l app=checkout -o wide | tee -a \"${evidence_file}\"\nkubectl get rs -n demo -l app=checkout -o wide | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“源码、制品、配置和运行状态四类存储如何交接”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 源码、制品、配置和运行状态四类存储如何交接的故障实验与恢复\n\n“源码、制品、配置和运行状态四类存储如何交接”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“源码、制品、配置和运行状态四类存储如何交接”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“源码、制品、配置和运行状态四类存储如何交接”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“源码、制品、配置和运行状态四类存储如何交接”执行恢复策略：冻结后续变更并保留当前稳定状态，恢复版本化输入后等待控制器重新收敛，再用业务证据关闭事件。\n4. 重新采集“源码、制品、配置和运行状态四类存储如何交接”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“源码、制品、配置和运行状态四类存储如何交接”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["源码仓库", "制品仓库", "配置仓库", "目标集群", "为四类存储定义交接契约", "为六个阶段建立状态与证据矩阵", "源码、制品、配置和运行状态四类存储如何交接的机制边界", "源码、制品、配置和运行状态四类存储如何交接的决策与证据", "源码、制品、配置和运行状态四类存储如何交接的静态检查模板", "源码、制品、配置和运行状态四类存储如何交接的故障实验与恢复"]}, {"title": "检测、生成、比较、计划、执行和观察六阶段如何排障", "content": "每阶段给出成功信号、常见错误、首个查询和责任角色，并用一个失败 Revision 串完整时间线。\n\n#### 检测、生成、比较、 重新收敛，再用业务证据关闭事件。\n4. 重新采集“检测、生成、比较、计划、执行和观察六阶段如何排障”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“检测、生成、比较、计划、执行和观察六阶段如何排障”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["检测、生成、比较、计划、执行和观察六阶段如何排障的机制边界", "检测、生成、比较、计划、执行和观察六阶段如何排障的决策与证据", "检测、生成、比较、计划、执行和观察六阶段如何排障的静态检查模板", "检测、生成、比较、计划、执行和观察六阶段如何排障的故障实验与恢复"]}, {"title": "从 Commit 到 Pod ImageID 应保存哪些稳定身份", "content": "“现在生产跑的是哪个版本”不能只回答一个 Tag。可审计的答案至少包含：业务源码 Commit、构建运行、镜像 Digest、配置 Commit、应用 Revision、Rollout 或 ReplicaSet、Pod UID，以及请求级版本标识。\n\n建议把非敏感追溯字段写入标准 Labels 和 Annotations：\n\n```yaml\nmetadata:\n  labels:\n    app.kubernetes.io/name: checkout-api\n    app.kubernetes.io/version: \"2.8.4\"\n    app.kubernetes.io/managed-by: argocd\n  annotations:\n    delivery.example.com/source-revision: \"4d2a7d9\"\n    delivery.example.com/config-revision: \"91af623\"\n    delivery.example.com/image-digest: \"sha256:0123456789abcdef\"\n```\n\n这些字段不是安全证明，攻击者可能伪造它们；它们用于导航。真正验证时要回到 Registry Manifest、签名、来源证明和 Git 历史。运行时还可以暴露 `/version`，返回构建 SHA 和启动配置摘要，帮助黑盒请求与部署记录对齐。\n\n#### 最小证据查询\n\n```bash\nkubectl get deployment checkout-api -n production -o jsonpath='{.metadata.annotations}'\nkubectl get pods -n production -l app.kubernetes.io/name=checkout-api \\\n  -o custom-columns='NAME:.metadata.name,IMAGE:.spec.containers[0].image,IMAGE_ID:.status.containerStatuses[0].imageID'\n```\n\n`spec.containers[].image` 可能仍显示 Tag，`status.containerStatuses[].imageID` 才能反映节点实际拉取的内容身份。二者不一致时，应暂停“发布成功”结论。\n\n#### 完成一次从请求到源码的逆向演练\n\n正向记录链路容易在设计评审里显得完整，逆向查询才能暴露断点。选择一条真实测试请求，从最靠近用户的证据开始：\n\n1. 从 Trace 或访问日志取得请求时间、服务名、实例和响应结果。\n2. 用实例标识定位 Pod UID、所在节点、容器镜像 ID 和 ReplicaSet。\n3. 从 OwnerReference 定位 Deployment 或 Rollout，并读取其配置 Revision。\n4. 用镜像 Digest 查询 Registry 元数据、签名、SBOM 和来源证明。\n5. 从配置 Revision 打开版本变更 PR、审批和自动校验结果。\n6. 从制品来源证明返回业务源码 Commit 和 CI 运行。\n\n演练输出至少包含代码合并、制品完成、配置合并、控制器检测、资源可用和业务门禁通过六个时间点。它们可以把总交付时间拆成排队、处理和观察时间。\n\n若某一步只能依赖 Tag、Pod 名称或人工记忆继续查询，就登记为证据断点。修复后要重新从请求开始演练，不能只验证新增字段“看起来存在”。\n\n还要随机抽取一个已经下线但仍在审计保留期内的 Revision，确认其 PR、Digest 和发布证据仍可查询，避免系统只支持“查当前版本”。\n\n#### 从 Commit 到 Pod ImageID 应保存哪些稳定身份的机制边界\n\n给出 Labels、Annotations、`/version`、Registry Manifest 和 Pod Status 示例，说明导航字段与安全证明的区别。\n\n- **从 Commit 到 Pod ImageID 应保存哪些稳定身份的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **从 Commit 到 Pod ImageID 应保存哪些稳定身份的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **从 Commit 到 Pod ImageID 应保存哪些稳定身份的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **从 Commit 到 Pod ImageID 应保存哪些稳定身份的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“从 Commit 到 Pod ImageID 应保存哪些稳定身份”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“从 Commit 到 Pod ImageID 应保存哪些稳定身份”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### 从 Commit 到 Pod ImageID 应保存哪些稳定身份的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `从 Commit 到 Pod ImageID 应保存哪些稳定身份` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `从 Commit 到 Pod ImageID 应保存哪些稳定身份` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `从 Commit 到 Pod ImageID 应保存哪些稳定身份` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `从 Commit 到 Pod ImageID 应保存哪些稳定身份` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“从 Commit 到 Pod ImageID 应保存哪些稳定身份”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 从 Commit 到 Pod ImageID 应保存哪些稳定身份的静态检查模板\n\n下面命令为“从 Commit 到 Pod ImageID 应保存哪些稳定身份”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 从 Commit 到 Pod ImageID 应保存哪些稳定身份\nevidence_file=\"./evidence/check-4960285447.txt\"\ngit rev-parse HEAD | tee -a \"${evidence_file}\"\nkubectl get pod -n demo -l app=checkout -o wide | tee -a \"${evidence_file}\"\nkubectl get rs -n demo -l app=checkout -o wide | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“从 Commit 到 Pod ImageID 应保存哪些稳定身份”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 从 Commit 到 Pod ImageID 应保存哪些稳定身份的故障实验与恢复\n\n“从 Commit 到 Pod ImageID 应保存哪些稳定身份”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“从 Commit 到 Pod ImageID 应保存哪些稳定身份”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“从 Commit 到 Pod ImageID 应保存哪些稳定身份”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“从 Commit 到 Pod ImageID 应保存哪些稳定身份”执行恢复策略：冻结后续变更并保留当前稳定状态，恢复版本化输入后等待控制器重新收敛，再用业务证据关闭事件。\n4. 重新采集“从 Commit 到 Pod ImageID 应保存哪些稳定身份”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“从 Commit 到 Pod ImageID 应保存哪些稳定身份”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["最小证据查询", "完成一次从请求到源码的逆向演练", "从 Commit 到 Pod ImageID 应保存哪些稳定身份的机制边界", "从 Commit 到 Pod ImageID 应保存哪些稳定身份的决策与证据", "从 Commit 到 Pod ImageID 应保存哪些稳定身份的静态检查模板", "从 Commit 到 Pod ImageID 应保存哪些稳定身份的故障实验与恢复"]}, {"title": "如何从一条失败请求逆向追溯到源码和审批", "content": "从 Request ID、Pod UID、ReplicaSet、配置 Revision、Digest、构建运行到源码 Commit 完成一次可复查演练。\n\n#### 如何从一条失败请求逆向追溯到源码和审批的机制边界\n\n\n- **如何从一条失败请求逆向追溯到源码和审批的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **如何从一条失败请求逆向追溯到源码和审批的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **如何从一条失败请求逆向追溯到源码和审批的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **如何从一条失败请求逆向追溯到源码和审批的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“如何从一条失败请求逆向追溯到源码和审批”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“如何从一条失败请求逆向追溯到源码和审批”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### 如何从一条失败请求逆向追溯到源码和审批的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `如何从一条失败请求逆向追溯到源码和审批` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `如何从一条失败请求逆向追溯到源码和审批` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `如何从一条失败请求逆向追溯到源码和审批` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `如何从一条失败请求逆向追溯到源码和审批` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“如何从一条失败请求逆向追溯到源码和审批”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 如何从一条失败请求逆向追溯到源码和审批的静态检查模板\n\n下面命令为“如何从一条失败请求逆向追溯到源码和审批”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 如何从一条失败请求逆向追溯到源码和审批\nevidence_file=\"./evidence/check-91d67f53f2.txt\"\ngit rev-parse HEAD | tee -a \"${evidence_file}\"\nkubectl get pod -n demo -l app=checkout -o wide | tee -a \"${evidence_file}\"\nkubectl get rs -n demo -l app=checkout -o wide | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“如何从一条失败请求逆向追溯到源码和审批”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 如何从一条失败请求逆向追溯到源码和审批的故障实验与恢复\n\n“如何从一条失败请求逆向追溯到源码和审批”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“如何从一条失败请求逆向追溯到源码和审批”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“如何从一条失败请求逆向追溯到源码和审批”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“如何从一条失败请求逆向追溯到源码和审批”执行恢复策略：冻结后续变更并保留当前稳定状态，恢复版本化输入后等待控制器重新收敛，再用业务证据关闭事件。\n4. 重新采集“如何从一条失败请求逆向追溯到源码和审批”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“如何从一条失败请求逆向追溯到源码和审批”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["如何从一条失败请求逆向追溯到源码和审批的机制边界", "如何从一条失败请求逆向追溯到源码和审批的决策与证据", "如何从一条失败请求逆向追溯到源码和审批的静态检查模板", "如何从一条失败请求逆向追溯到源码和审批的故障实验与恢复"]}]}, {"title": "第 4 章 · 仓库、目录和环境如何建模", "sections": [{"title": "源码与环境配置何时同仓库，何时必须分离", "content": "源码和环境配置放在同一个仓库，优点是变更原子、开发者容易理解，适合小团队或单一服务。随着团队职责、环境数量和合规要求增加，二者的发布节奏和权限边界通常会分离。\n\n| 决策问题 | 同仓库倾向 | 分仓库倾向 |\n|---|---|---|\n| 团队规模 | 一个团队同时负责开发和运行 | 平台与业务团队职责分离 |\n| 环境数量 | 少量环境 | 多区域、多集群、多租户 |\n| 发布审批 | 与代码合并一致 | 生产配置需要独立审批 |\n| 生命周期 | 代码和配置同步演进 | 平台模板与应用版本独立演进 |\n| 权限 | 开发者可修改全部目标 | 生产仓库权限严格受控 |\n\n分仓库的代价是跨仓库原子性消失。CI 推出新 Digest 后，配置变更可能失败、被拒绝或延迟；平台必须记录候选制品状态，并能清理长期无人晋级的镜像。不要用“自动改另一个仓库”掩盖这一事实，应明确机器人身份、Pull Request、审批和超时处理。\n\n#### 用变更记录验证拆分边界\n\n抽取最近二十次代码和环境变更，统计它们是否总要同时合并、由谁审批、失败时回退哪一侧。\n\n- 若绝大多数代码 Commit 都伴随配置变化，同仓库可减少协调成本。\n- 若生产配置常由独立角色修改，分仓库更符合权限边界。\n- 若平台模板升级需要跨大量应用，需建立版本化依赖和批量晋级机制。\n- 若候选制品长期等待环境 PR，应增加过期状态和清理策略。\n\n仓库拆分后执行一次“CI 成功、配置 PR 失败”的演练，确认制品不会被误报为已发布，旧环境声明仍然有效，候选能被安全重试或清理。\n\n开发、测试、预生产、生产不是简单的分支名称，而是风险和证据逐步增加的状态。环境晋级应移动已经验证的制品身份，不应在每个环境重新构建。\n\n```mermaid\nflowchart LR\n    Build[Build once] --> Candidate[Candidate digest]\n    Candidate --> Dev[Development validation]\n    Dev --> Stage[Staging validation]\n    Stage --> Approval[Production approval]\n    Approval --> Prod[Production rollout]\n    Prod --> Observe[Post deployment observation]\n```\n\n临时预览环境适合验证 Pull Request，但必须设置生命周期和资源上限。ApplicationSet Pull Request Generator 可以创建应用，也必须能在 PR 关闭后安全删除；外部数据库、DNS、证书和云资源若不受同一 Owner Reference 管理，可能留下长期费用或敏感数据。\n\n建议每个环境对象包含：Owner、来源 PR、过期时间、资源预算、数据级别和删除策略。生产晋级则要求不可变 Digest、前一环境证据、审批记录和回滚目标。\n\n#### 设计一条可执行的环境晋级路径\n\n先为每类环境写清入口、退出和证据，不要只画一条从开发到生产的箭头：\n\n| 环境 | 进入条件 | 必须验证 | 退出产物 | 自动清理 |\n|---|---|---|---|---|\n| PR Preview | PR 通过基础校验 | 页面、契约、迁移预检 | 预览地址与测试报告 | PR 关闭后回收 |\n| Integration | 制品已签名并登记 | 跨服务契约、共享依赖 | 候选 Digest 与兼容结果 | 按版本保留 |\n| Staging | 候选版本获准晋级 | 容量、告警、回滚演练 | 生产变更提案 | 下一候选替换 |\n| Production | 风险门禁和审批通过 | SLI、错误预算、关键业务路径 | 发布证据包 | 按策略归档 |\n\n晋级的是同一不可变制品，不是在每个环境重新构建。环境差异通过声明式配置表达，并限制为允许变化的维度。\n\n分别模拟“候选制品失败”和“环境配置失败”。前者应阻止该 Digest 继续前进；后者不应迫使重新构建源码，而应修复配置并保留同一制品身份。\n\n固定环境必须有配置所有者和漂移策略；临时环境必须有 TTL、最大资源和销毁失败告警。两者不能共用一套默认生命周期。\n\n#### 源码与环境配置何时同仓库，何时必须分离的机制边界\n\n用团队所有权、审批、生命周期、候选等待和跨仓库原子性建立决策树与迁移步骤。\n\n- **源码与环境配置何时同仓库，何时必须分离的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **源码与环境配置何时同仓库，何时必须分离的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **源码与环境配置何时同仓库，何时必须分离的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **源码与环境配置何时同仓库，何时必须分离的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n写入者必须声明字段所有权、目标分支和冲突策略，远端 HEAD 变化后重新计算而不是覆盖。\nCommit 已产生但本地状态丢失时先按变更 ID 查重，避免同一候选生成重复提交或 PR。\n\n#### 源码与环境配置何时同仓库，何时必须分离的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `源码与环境配置何时同仓库，何时必须分离` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `源码与环境配置何时同仓库，何时必须分离` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `源码与环境配置何时同仓库，何时必须分离` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `源码与环境配置何时同仓库，何时必须分离` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“源码与环境配置何时同仓库，何时必须分离”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 源码与环境配置何时同仓库，何时必须分离的静态检查模板\n\n下面命令为“源码与环境配置何时同仓库，何时必须分离”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 源码与环境配置何时同仓库，何时必须分离\nevidence_file=\"./evidence/check-7871c5a04e.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“源码与环境配置何时同仓库，何时必须分离”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 源码与环境配置何时同仓库，何时必须分离的故障实验与恢复\n\n“源码与环境配置何时同仓库，何时必须分离”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“源码与环境配置何时同仓库，何时必须分离”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“源码与环境配置何时同仓库，何时必须分离”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“源码与环境配置何时同仓库，何时必须分离”执行恢复策略：冻结新的写回，按变更 ID 查找已存在的 Commit 或 PR，重新读取远端 HEAD 后重算；错误提交使用显式 Revert。\n4. 重新采集“源码与环境配置何时同仓库，何时必须分离”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“源码与环境配置何时同仓库，何时必须分离”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["用变更记录验证拆分边界", "设计一条可执行的环境晋级路径", "源码与环境配置何时同仓库"]}, {"title": "Monorepo 与 Polyrepo 分别需要哪些防扩散护栏", "content": "Monorepo 把多个应用或环境放在同一仓库，便于统一策略和跨服务变更；Polyrepo 按服务、租户或平台边界拆分，减少权限和故障半径。选择不应基于流行程度，而应基于变更耦合、所有权和控制器规模。\n\n#### Monorepo 需要的护栏\n\n- 控制器只监听明确路径，避免任意目录变更触发全量刷新。\n- CODEOWNERS 按环境和平台目录分配审批人。\n- CI 根据变更路径选择性渲染和验证。\n- ApplicationSet Generator 设定数量预算，防止错误 glob 生成大量应用。\n\n#### Polyrepo 需要的护栏\n\n- 用统一模板、策略包和版本规则避免每个仓库自行演化。\n- 仓库注册采用标签和项目边界，不允许控制器读取任意 URL。\n- 统一记录依赖版本，避免共享组件升级无法追踪消费者。\n- 跨仓库变更使用晋级清单或变更编排，而不是假设同时合并。\n\n一个可维护的目录示意：\n\n```text\napplications/\n  checkout-api/\n    base/\n    overlays/\n      staging/\n      production/\nclusters/\n  sg-prod-01/\n    applications.yaml\n  sg-staging-01/\n    applications.yaml\npolicies/\n  admission/\n  delivery/\n```\n\n#### Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的机制边界\n\n补完整目录树、CODEOWNERS、路径选择性验证、仓库注册限制、共享组件版本和批量变更控制。\n\n- **Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n写入者必须声明字段所有权、目标分支和冲突策略，远端 HEAD 变化后重新计算而不是覆盖。\nCommit 已产生但本地状态丢失时先按变更 ID 查重，避免同一候选生成重复提交或 PR。\n\n#### Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `Monorepo 与 Polyrepo 分别需要哪些防扩散护栏` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `Monorepo 与 Polyrepo 分别需要哪些防扩散护栏` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `Monorepo 与 Polyrepo 分别需要哪些防扩散护栏` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `Monorepo 与 Polyrepo 分别需要哪些防扩散护栏` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“Monorepo 与 Polyrepo 分别需要哪些防扩散护栏”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的静态检查模板\n\n下面命令为“Monorepo 与 Polyrepo 分别需要哪些防扩散护栏”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: Monorepo 与 Polyrepo 分别需要哪些防扩散护栏\nevidence_file=\"./evidence/check-2c0f874032.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“Monorepo 与 Polyrepo 分别需要哪些防扩散护栏”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的故障实验与恢复\n\n“Monorepo 与 Polyrepo 分别需要哪些防扩散护栏”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“Monorepo 与 Polyrepo 分别需要哪些防扩散护栏”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“Monorepo 与 Polyrepo 分别需要哪些防扩散护栏”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“Monorepo 与 Polyrepo 分别需要哪些防扩散护栏”执行恢复策略：冻结后续变更并保留当前稳定状态，恢复版本化输入后等待控制器重新收敛，再用业务证据关闭事件。\n4. 重新采集“Monorepo 与 Polyrepo 分别需要哪些防扩散护栏”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“Monorepo 与 Polyrepo 分别需要哪些防扩散护栏”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["Monorepo 需要的护栏", "Polyrepo 需要的护栏", "Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的机制边界", "Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的决策与证据", "Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的静态检查模板", "Monorepo 与 Polyrepo 分别需要哪些防扩散护栏的故障实验与恢复"]}, {"title": "Kustomize Overlay 如何表达稳定差异并避免 Patch 失控", "content": "Kustomize 从完整 Kubernetes 对象出发，通过资源组合和补丁表达差异；Helm 从参数化模板出发，通过 Values 渲染对象。二者都能管理多环境，但失败方式不同。\n\n| 关注点 | Kustomize | Helm |\n|---|---|---|\n| 基础模型 | 原生资源加 Overlay | 模板加 Values |\n| 差异表达 | Patch、Replacement、Component | 条件、循环、函数、Values |\n| 可读性风险 | Patch 叠加后难看最终对象 | 模板逻辑过强变成程序 |\n| 验证重点 | 目标选择和补丁命中 | Values Schema 和渲染分支 |\n| 适合场景 | 团队掌控具体资源 | 可复用应用包和产品化分发 |\n\n环境差异应限制在真正不同的字段，例如副本、域名、资源配额和外部依赖引用。若整个 Deployment 在每个环境复制一份，基础改动容易漏同步；若所有字段都变成 Values，Chart 又会变成难以理解的通用编程框架。\n\n无论选择哪种方式，合并前都要渲染最终清单并验证：\n\n```bash\nkustomize build applications/checkout-api/overlays/production > /tmp/checkout-rendered.yaml\nhelm template checkout-api ./chart \\\n  --namespace production \\\n  --values values-production.yaml > /tmp/checkout-rendered.yaml\nkubectl apply --dry-run=server -f /tmp/checkout-rendered.yaml\n```\n\n静态渲染证明模板可生成 YAML，Server-side Dry Run 才能覆盖目标集群的 CRD、默认值和准入策略；两者都不能证明真实发布成功。\n\n#### 为配置复用建立分层验证流水线\n\n配置验证应从便宜、确定的检查逐步进入依赖真实集群的检查：\n\n1. 校验 YAML、Chart Schema、Kustomize 引用和文件路径。\n2. 对每个受支持环境渲染最终清单，禁止只验证默认 Values。\n3. 检查重复资源身份、空 Namespace、可变镜像 Tag 和缺失资源约束。\n4. 对渲染结果执行策略检查，验证安全上下文、网络和组织标签。\n5. 在匹配版本的集群上执行 Server-side Dry Run，覆盖 CRD 和准入链。\n6. 在临时命名空间创建资源，观察默认化、Webhook 变更和控制器状态。\n\n每层失败都应返回最终文件、对象路径和原因。只返回 Helm 模板栈或 JSONPath，会迫使应用团队理解平台内部实现。\n\n多环境验证要防止组合爆炸。平台先定义受支持的基础版本、功能开关和环境等级，CI 只遍历合法组合；未声明的自由组合不承诺兼容。\n\n对 Patch 和 Values 建立预算也很重要：\n\n| 信号 | 可能问题 | 建议动作 |\ 有者和预防动作。只把对象改回绿色，没有消除双控制器或流程旁路，漂移会再次发生。\n\n#### 环境差异如何通过策略阻止复制和隐式漂移的机制边界\n\n建立允许变化字段、渲染快照、语义 Diff、策略检查和环境配置 Owner。\n\n- **环境差异如何通过策略阻止复制和隐式漂移的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **环境差异如何通过策略阻止复制和隐式漂移的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **环境差异如何通过策略阻止复制和隐式漂移的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **环境差异如何通过策略阻止复制和隐式漂移的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“环境差异如何通过策略阻止复制和隐式漂移”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“环境差异如何通过策略阻止复制和隐式漂移”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### 环境差异如何通过策略阻止复制和隐式漂移的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `环境差异如何通过策略阻止复制和隐式漂移` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `环境差异如何通过策略阻止复制和隐式漂移` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `环境差异如何通过策略阻止复制和隐式漂移` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `环境差异如何通过策略阻止复制和隐式漂移` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“环境差异如何通过策略阻止复制和隐式漂移”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 环境差异如何通过策略阻止复制和隐式漂移的静态检查模板\n\n下面命令为“环境差异如何通过策略阻止复制和隐式漂移”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 环境差异如何通过策略阻止复制和隐式漂移\nevidence_file=\"./evidence/check-2f4ed29e54.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“环境差异如何通过策略阻止复制和隐式漂移”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 环境差异如何通过策略阻止复制和隐式漂移的故障实验与恢复\n\n“环境差异如何通过策略阻止复制和隐式漂移”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“环境差异如何通过策略阻止复制和隐式漂移”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“环境差异如何通过策略阻止复制和隐式漂移”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“环境差异如何通过策略阻止复制和隐式漂移”执行恢复策略：停止后续环境和集群批次，保持已验证区域不变，回退当前批次并完成临时资源、DNS 与权限清理。\n4. 重新采集“环境差异如何通过策略阻止复制和隐式漂移”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“环境差异如何通过策略阻止复制和隐式漂移”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["对漂移先分类再决定动作", "环境差异如何通过策略阻止复制和隐式漂移的机制边界", "环境差异如何通过策略阻止复制和隐式漂移的决策与证据", "环境差异如何通过策略阻止复制和隐式漂移的静态检查模板", "环境差异如何通过策略阻止复制和隐式漂移的故障实验与恢复"]}]}, {"title": "第 6 章 · 漂移、回滚、紧急变更和灾备如何闭环", "sections": [{"title": "Sync、Health、Ready 和业务可用性为何是不同维度", "content": "GitOps 控制器常展示 Sync 和 Health。Sync 回答期望对象与实际对象是否存在差异；Health 根据资源状态判断对象是否推进。二者都不能完整回答用户请求是否成功。\n\n| 状态组合 | 可能含义 | 下一步 |\n|---|---|---|\n| Synced + Healthy | 对象收敛且 Kubernetes 状态正常 | 验证业务 SLI 和关键路径 |\n| OutOfSync + Healthy | 旧版本仍可用或存在无害默认值差异 | 查差异来源和忽略规则 |\n| Synced + Degraded | 期望已应用但工作负载失败 | 查事件、探针、镜像和依赖 |\n| OutOfSync + Degraded | 既未收敛又运行异常 | 先确认最新安全版本和止损路径 |\n| Unknown | 控制器无法读取或评估 | 查仓库、集群连接、权限和自定义健康脚本 |\n\n业务可用性需要额外证据：入口请求成功率、延迟、核心交易、队列积压、依赖错误和用户侧监控。发布门禁应以“资源状态 + 业务指标”组合，而不是看到绿色图标就结束。\n\n#### 用三层检查关闭发布\n\n关闭发布前按层验证：\n\n1. **声明层**：目标 Revision 正确，Diff 没有被宽泛忽略规则隐藏。\n2. **资源层**：Rollout、Pod、Service、证书和依赖对象达到预期状态。\n3. **业务层**：真实入口、关键交易、错误预算和异步积压通过观察窗口。\n\n任一层失败都保留其他两层结果。例如业务失败但资源 Healthy 是重要线索，不能把整体状态压成一个红灯后丢失细节。\n\n还要验证观测链自身可用；没有指标和没有错误是不同状态。数据源不可用时默认暂停关闭结论。\n\n#### Sync、Health、Ready 和业务可用性为何是不同维度的机制边界\n\n建立状态组合矩阵和三层发布关闭条件，补观测链不可用时的未知状态处理。\n\n- **Sync、Health、Ready 和业务可用性为何是不同维度的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **Sync、Health、Ready 和业务可用性为何是不同维度的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **Sync、Health、Ready 和业务可用性为何是不同维度的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **Sync、Health、Ready 和业务可用性为何是不同维度的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“Sync、Health、Ready 和业务可用性为何是不同维度”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“Sync、Health、Ready 和业务可用性为何是不同维度”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### Sync、Health、Ready 和业务可用性为何是不同维度的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `Sync、Health、Ready 和业务可用性为何是不同维度` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `Sync、Health、Ready 和业务可用性为何是不同维度` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `Sync、Health、Ready 和业务可用性为何是不同维度` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `Sync、Health、Ready 和业务可用性为何是不同维度` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“Sync、Health、Ready 和业务可用性为何是不同维度”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### Sync、Health、Ready 和业务可用性为何是不同维度的静态检查模板\n\n下面命令为“Sync、Health、Ready 和业务可用性为何是不同维度”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: Sync、Health、Ready 和业务可用性为何是不同维度\nevidence_file=\"./evidence/check-02b0998b37.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“Sync、Health、Ready 和业务可用性为何是不同维度”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### Sync、Health、Ready 和业务可用性为何是不同维度的故障实验与恢复\n\n“Sync、Health、Ready 和业务可用性为何是不同维度”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“Sync、Health、Ready 和业务可用性为何是不同维度”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“Sync、Health、Ready 和业务可用性为何是不同维度”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“Sync、Health、Ready 和业务可用性为何是不同维度”执行恢复策略：冻结后续变更并保留当前稳定状态，恢复版本化输入后等待控制器重新收敛，再用业务证据关闭事件。\n4. 重新采集“Sync、Health、Ready 和业务可用性为何是不同维度”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“Sync、Health、Ready 和业务可用性为何是不同维度”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["用三层检查关闭发布", "Sync、Health、Ready 和业务可用性为何是不同维度的机制边界", "Sync、Health、Ready 和业务可用性为何是不同维度的决策与证据", "Sync、Health、Ready 和业务可用性为何是不同维度的静态检查模板", "Sync、Health、Ready 和业务可用性为何是不同维度的故障实验与恢复"]}, {"title": "漂移如何按字段所有权分类并选择 Self Heal 策略", "content": "覆盖人工修改、默认化、Webhook、HPA、Operator 和多控制器竞争，给出忽略规则审查与复验。\n\n#### 漂移如何按字段所有权分类并选择 Self Heal 策略的机制边界\n\n\n- **漂移如何按字段所有权分类并选择 Self Heal 策略的声明输入
