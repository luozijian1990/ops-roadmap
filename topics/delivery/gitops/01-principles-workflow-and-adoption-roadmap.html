才发布一次 |\n| 依赖 | 可枚举、可模拟 | 大量隐式人工依赖 |\n\n试点交付物不只是“安装 Argo CD”，而是完整工作流：仓库结构、变更门禁、控制器权限、发布证据、回滚演练、值班手册和支持边界。\n\n#### 明确不适合作为首批试点的原因\n\n以下任一条件尚未解决时应延后试点：\n\n- 没有稳定 Owner 或值班人员。\n- 关键路径没有可重复探测和指标基线。\n- 数据库变更无法兼容旧版本，也没有恢复演练。\n- 依赖大量共享管理员凭据和人工审批口令。\n- 环境清单与实际运行对象长期不一致。\n\n延后不是拒绝 GitOps，而是先补齐可观测、可恢复和所有权前置条件。否则控制器只会更快放大模糊流程。\n\n#### 怎样选择有真实收益且可恢复的试点的机制边界\n\n给出适合与不适合信号、前置条件、基线指标和退出条件。\n\n- **怎样选择有真实收益且可恢复的试点的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **怎样选择有真实收益且可恢复的试点的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **怎样选择有真实收益且可恢复的试点的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **怎样选择有真实收益且可恢复的试点的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“怎样选择有真实收益且可恢复的试点”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“怎样选择有真实收益且可恢复的试点”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### 怎样选择有真实收益且可恢复的试点的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `怎样选择有真实收益且可恢复的试点` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `怎样选择有真实收益且可恢复的试点` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `怎样选择有真实收益且可恢复的试点` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `怎样选择有真实收益且可恢复的试点` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“怎样选择有真实收益且可恢复的试点”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 怎样选择有真实收益且可恢复的试点的静态检查模板\n\n下面命令为“怎样选择有真实收益且可恢复的试点”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 怎样选择有真实收益且可恢复的试点\nevidence_file=\"./evidence/check-c6e8eea2af.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“怎样选择有真实收益且可恢复的试点”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 怎样选择有真实收益且可恢复的试点的故障实验与恢复\n\n“怎样选择有真实收益且可恢复的试点”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“怎样选择有真实收益且可恢复的试点”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“怎样选择有真实收益且可恢复的试点”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“怎样选择有真实收益且可恢复的试点”执行恢复策略：按副作用范围选择 Git Revert、应用回退、向前修复或数据恢复，并分别验证配置、流量与持久化状态。\n4. 重新采集“怎样选择有真实收益且可恢复的试点”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“怎样选择有真实收益且可恢复的试点”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["明确不适合作为首批试点的原因", "怎样选择有真实收益且可恢复的试点的机制边界", "怎样选择有真实收益且可恢复的试点的决策与证据", "怎样选择有真实收益且可恢复的试点的静态检查模板", "怎样选择有真实收益且可恢复的试点的故障实验与恢复"]}, {"title": "Inner Loop、Outer Loop 与最小工作流变更如何协作", "content": "成熟团队通常已经有 Jenkins、GitLab CI、制品仓库和审批流程。迁移不必同时替换所有组件。第一阶段可以保留 CI，只把“直接部署生产”改为“提交配置变更”；第二阶段再逐步更新构建、签名和制品管理。\n\n```mermaid\nflowchart LR\n    ExistingCI[Existing CI] --> Artifact[Existing artifact registry]\n    Artifact --> Proposal[Configuration proposal]\n    Proposal --> Review[Existing review process]\n    Review --> GitOps[GitOps reconciliation]\n    GitOps --> Cluster[Target cluster]\n```\n\n最小变化不等于永久保留所有历史包袱。每一期都要声明退出条件：何时撤销 CI 的集群凭据，何时禁止手工发布，何时统一镜像身份和配置模板。没有退出条件的“双轨运行”会让故障时没人知道哪条链路才是事实来源。\n\n#### Inner Loop、Outer Loop 与最小工作流变更如何协作的机制边界\n\n分解编辑、构建、测试、制品发布、配置变更、集群调谐和反馈的等待时间；区分本地反馈与共享环境反馈，按最少角色切换、最少新增工具和可回退迁移逐步接入 GitOps，不展开 Nocalhost 产品教程。\n\n- **Inner Loop、Outer Loop 与最小工作流变更如何协作的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **Inner Loop、Outer Loop 与最小工作流变更如何协作的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **Inner Loop、Outer Loop 与最小工作流变更如何协作的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **Inner Loop、Outer Loop 与最小工作流变更如何协作的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“Inner Loop、Outer Loop 与最小工作流变更如何协作”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“Inner Loop、Outer Loop 与最小工作流变更如何协作”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### Inner Loop、Outer Loop 与最小工作流变更如何协作的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `Inner Loop、Outer Loop 与最小工作流变更如何协作` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `Inner Loop、Outer Loop 与最小工作流变更如何协作` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `Inner Loop、Outer Loop 与最小工作流变更如何协作` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `Inner Loop、Outer Loop 与最小工作流变更如何协作` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“Inner Loop、Outer Loop 与最小工作流变更如何协作”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### Inner Loop、Outer Loop 与最小工作流变更如何协作的静态检查模板\n\n下面命令为“Inner Loop、Outer Loop 与最小工作流变更如何协作”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: Inner Loop、Outer Loop 与最小工作流变更如何协作\nevidence_file=\"./evidence/check-aa1f3abea0.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“Inner Loop、Outer Loop 与最小工作流变更如何协作”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### Inner Loop、Outer Loop 与最小工作流变更如何协作的故障实验与恢复\n\n“Inner Loop、Outer Loop 与最小工作流变更如何协作”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“Inner Loop、Outer Loop 与最小工作流变更如何协作”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“Inner Loop、Outer Loop 与最小工作流变更如何协作”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“Inner Loop、Outer Loop 与最小工作流变更如何协作”执行恢复策略：冻结后续变更并保留当前稳定状态，恢复版本化输入后等待控制器重新收敛，再用业务证据关闭事件。\n4. 重新采集“Inner Loop、Outer Loop 与最小工作流变更如何协作”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“Inner Loop、Outer Loop 与最小工作流变更如何协作”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["Inner Loop、Outer Loop 与最小工作流变更如何协作的机制边界", "Inner Loop、Outer Loop 与最小工作流变更如何协作的决策与证据", "Inner Loop、Outer Loop 与最小工作流变更如何协作的静态检查模板", "Inner Loop、Outer Loop 与最小工作流变更如何协作的故障实验与恢复"]}, {"title": "开发、平台、安全和 SRE 如何落实责任与权限", "content": "GitOps 落地会重新分配变更权限，因此必须把责任写成明确契约。\n\n| 角色 | 负责 | 不负责 |\n|---|---|---|\n| 开发团队 | 应用代码、测试、运行需求、业务 SLI | 集群级策略和共享控制器运维 |\n| 平台团队 | 模板、控制器、仓库接入、环境能力 | 替业务判断功能正确性 |\n| 安全团队 | 身份、策略、签名、审计和例外流程 | 手工审批每一次低风险变更 |\n| SRE | SLO、发布风险、告警、恢复演练 | 承担所有应用日常配置维护 |\n| 变更审批人 | 风险接受和生产晋级 | 修改未经技术验证的制品 |\n\n责任边界应落实到 CODEOWNERS、AppProject、RBAC、策略对象和 On-call，而不是只写在 PPT。每个失败场景都要能回答谁收到信号、谁有权限、谁决定继续或停止。\n\n#### 用失败场景验证责任分配\n\n静态 RACI 表经常在事故中失效，因为“负责”没有对应信号和权限。选择五个场景进行桌面演练：仓库不可达、渲染失败、准入拒绝、Rollout 指标恶化和业务依赖故障。\n\n每个场景依次确认：\n\n1. 哪个系统最先发出信号，信号是否包含应用、环境和 Revision。\n2. 第一响应人是谁，多久未确认会升级给谁。\n3. 响应人是否有读取证据和执行止损的权限。\n4. 谁能决定继续、暂停、回退或启用 Break Glass。\n5. 修复后由谁关闭告警、补全 Git 状态并推动复盘动作。\n\n若一个动作需要跨团队临时寻找审批人，或值班人只有告警没有读取权限，责任模型还没有落地。修复方式可能是调整权限、补充自动上下文或重设升级链路，而不是继续增加文档。\n\n团队交接时要重跑场景，验证新成员能独立完成。只由平台创建者本人处置成功，不能证明平台具备可运营性。\n\n#### 开发、平台、安全和 SRE 如何落实责任与权限的机制边界\n\n把 RACI 落到 CODEOWNERS、RBAC、AppProject、On-call、决策权限和升级路径，并做桌面演练。\n\n- **开发、平台、安全和 SRE 如何落实责任与权限的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **开发、平台、安全和 SRE 如何落实责任与权限的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **开发、平台、安全和 SRE 如何落实责任与权限的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **开发、平台、安全和 SRE 如何落实责任与权限的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“开发、平台、安全和 SRE 如何落实责任与权限”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“开发、平台、安全和 SRE 如何落实责任与权限”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### 开发、平台、安全和 SRE 如何落实责任与权限的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `开发、平台、安全和 SRE 如何落实责任与权限` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `开发、平台、安全和 SRE 如何落实责任与权限` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `开发、平台、安全和 SRE 如何落实责任与权限` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `开发、平台、安全和 SRE 如何落实责任与权限` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“开发、平台、安全和 SRE 如何落实责任与权限”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 开发、平台、安全和 SRE 如何落实责任与权限的静态检查模板\n\n下面命令为“开发、平台、安全和 SRE 如何落实责任与权限”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 开发、平台、安全和 SRE 如何落实责任与权限\nevidence_file=\"./evidence/check-37f42072b8.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“开发、平台、安全和 SRE 如何落实责任与权限”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 开发、平台、安全和 SRE 如何落实责任与权限的故障实验与恢复\n\n“开发、平台、安全和 SRE 如何落实责任与权限”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“开发、平台、安全和 SRE 如何落实责任与权限”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“开发、平台、安全和 SRE 如何落实责任与权限”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“开发、平台、安全和 SRE 如何落实责任与权限”执行恢复策略：冻结后续变更并保留当前稳定状态，恢复版本化输入后等待控制器重新收敛，再用业务证据关闭事件。\n4. 重新采集“开发、平台、安全和 SRE 如何落实责任与权限”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“开发、平台、安全和 SRE 如何落实责任与权限”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["用失败场景验证责任分配", "开发、平台、安全和 SRE 如何落实责任与权限的机制边界", "开发、平台、安全和 SRE 如何落实责任与权限的决策与证据", "开发、平台、安全和 SRE 如何落实责任与权限的静态检查模板", "开发、平台、安全和 SRE 如何落实责任与权限的故障实验与恢复"]}, {"title": "用流动效率、稳定性、安全和操作负担证明价值", "content": "GitOps 的价值不能用“接入应用数量”独自证明。接入数量可能增长，但发布仍慢、失败仍多，甚至只是把人工命令改成手工合并。应在试点前建立基线，并按同一口径观察至少一个完整发布周期。\n\n#### 流动效率\n\n- 从代码合并到候选制品产生的时间。\n- 从配置变更提出到目标环境收敛的时间。\n- 等待审批、等待容量、等待窗口分别占多少。\n\n#### 稳定性\n\n- 变更失败率和自动暂停比例。\n- 从异常检测到止损、从止损到恢复的时间。\n- 回滚或向前修复是否在预算内完成。\n\n#### 操作负担\n\n- 人工命令次数、共享凭据数量和紧急变更次数。\n- 控制器长期 OutOfSync、Unknown 或重试积压数量。\n- 平台支持工单、重复排障和环境差异问题。\n\n#### 安全与审计\n\n- 生产变更能否关联审批、制品和运行实例。\n- 高权限凭据是否缩减并定期轮换。\n- 策略拒绝是否能给出可操作原因。\n\n#### 建立可比较的指标口径\n\n每个指标都应包含起止事件、统计对象、排除条件和数据来源。例如“部署频率”按生产配置 Revision 还是 CI 运行计数，会产生完全不同的结论。\n\n迁移前至少采集四周基线，并保留应用类型、风险等级和发布窗口等分组维度。不能把低风险服务自动发布后的改善，直接归因到所有生产系统。\n\n指标需要成对阅读：交付前置时间下降时，同时检查变更失败率；自动同步比例上升时，同时检查人工修复和 Break Glass 次数；接入应用增加时，同时检查平台支持负担。\n\n建议每月抽样核对原始事件：\n\n- 一个成功发布是否被重复计数。\n- 一个失败后重试是否被误算为多次独立变更。\n- 回退是否同时记录为恢复动作和新变更。\n- 控制器短暂 OutOfSync 是否达到用户影响阈值。\n- 没有业务流量的环境是否混入稳定性指标。\n\n指标用于判断系统改进，不用于惩罚团队。若团队为了数据好看而减少发布、关闭告警或绕过记录，说明激励设计破坏了反馈真实性。\n\n#### 用流动效率、稳定性、安全和操作负担证明价值的机制边界\n\n明确指标起止事件、基线、分组、反指标和数据质量，避免用接入应用数替代真实收益。\n\n- **用流动效率、稳定性、安全和操作负担证明价值的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **用流动效率、稳定性、安全和操作负担证明价值的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **用流动效率、稳定性、安全和操作负担证明价值的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **用流动效率、稳定性、安全和操作负担证明价值的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“用流动效率、稳定性、安全和操作负担证明价值”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“用流动效率、稳定性、安全和操作负担证明价值”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### 用流动效率、稳定性、安全和操作负担证明价值的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `用流动效率、稳定性、安全和操作负担证明价值` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `用流动效率、稳定性、安全和操作负担证明价值` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `用流动效率、稳定性、安全和操作负担证明价值` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `用流动效率、稳定性、安全和操作负担证明价值` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“用流动效率、稳定性、安全和操作负担证明价值”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 用流动效率、稳定性、安全和操作负担证明价值的静态检查模板\n\n下面命令为“用流动效率、稳定性、安全和操作负担证明价值”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 用流动效率、稳定性、安全和操作负担证明价值\nevidence_file=\"./evidence/check-63b561e748.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“用流动效率、稳定性、安全和操作负担证明价值”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 用流动效率、稳定性、安全和操作负担证明价值的故障实验与恢复\n\n“用流动效率、稳定性、安全和操作负担证明价值”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“用流动效率、稳定性、安全和操作负担证明价值”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“用流动效率、稳定性、安全和操作负担证明价值”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“用流动效率、稳定性、安全和操作负担证明价值”执行恢复策略：隔离候选 Digest 并保留原证明，补齐或重新签发证据后由消费者独立复验，不通过修改 Tag 绕过门禁。\n4. 重新采集“用流动效率、稳定性、安全和操作负担证明价值”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“用流动效率、稳定性、安全和操作负担证明价值”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["流动效率", "稳定性", "操作负担", "安全与审计", "建立可比较的指标口径", "用流动效率、稳定性、安全和操作负担证明价值的机制边界", "用流动效率、稳定性、安全和操作负担证明价值的决策与证据", "用流动效率、稳定性、安全和操作负担证明价值的静态检查模板", "用流动效率、稳定性、安全和操作负担证明价值的故障实验与恢复"]}, {"title": "用端到端实验和迁移计分卡决定是否扩面", "content": "每阶段给出成功信号、常见错误、首个查询和责任角色，并用一个失败 Revision 串完整时间线。\n\n\n\n\n迁移应按可验证阶段推进，而不是以“全部应用接入”为单一里程碑。\n\n| 阶段 | 主要目标 | 进入下一阶段的门禁 |\n|---|---|---|\n| 发现 | 盘点流程、权限、依赖和风险 | 有当前链路图和指标基线 |\n| 试点 | 一条应用完成闭环 | 发布、回滚、漂移和故障演练通过 |\n| 产品化 | 提供模板和自助接入 | 新应用不需要平台手工定制 |\n| 扩展 | 覆盖更多团队和环境 | 控制器容量、权限和支持模型可扩展 |\n| 治理 | 稳定策略和持续改进 | 指标可见、例外可审计、升级可演练 |\n\n每个阶段都要有退出条件。若试点应用无法建立可靠健康信号、数据库变更不可回退、团队没有 Owner，就应停止扩大范围，先解决前置问题。GitOps 控制器可以加速一个成熟流程，也会更快地放大一个没有边界的流程。\n\n最后形成的不是“一个工具上线”，而是一套可持续运行的交付产品：开发者知道如何提出变更，平台知道如何提供护栏，安全知道如何审计，SRE 知道如何判读和恢复，管理者能用真实指标判断投资是否有效。\n\n#### 用迁移计分卡决定是否扩面\n\n每个阶段结束时由开发、平台、安全和 SRE 共同填写计分卡。关键项没有证据时，不能用平均分掩盖：\n\n| 维度 | 通过条件 | 证据 | 未通过动作 |\n|---|---|---|---|\n| 正确性 | 连续发布均收敛到目标 Revision | 控制器历史与资源快照 | 保持当前范围并修复流程 |\n| 可恢复性 | 回退和仓库故障演练达标 | 演练记录、恢复时间 | 禁止扩大生产应用数 |\n| 安全 | CI 无生产集群长期凭据 | 身份清单与审计日志 | 先完成凭据收敛 |\n| 可观测 | Revision 能关联指标、日志和请求 | 逆向追溯报告 | 补字段与证据索引 |\n| 可运营 | 值班人员能按手册独立处置 | 演练结果和交接记录 | 培训并重跑演练 |\n| 用户体验 | 团队操作步骤未异常增加 | 流程数据与访谈 | 优化平台接口和模板 |\n\n门禁分成必须通过、允许限期豁免和仅观察趋势三类。凭据边界与恢复能力通常必须通过；界面便利性可以限期优化；新流程采用率可以先观察趋势。\n\n扩大范围时一次只改变一个主要变量，例如从单应用扩到同团队多应用，或从测试环境扩到生产。若同时增加团队、集群和策略，失败后很难定位原因。\n\n当同步失败率、人工干预或恢复时间连续恶化时，应停止扩面并回到最近稳定阶段。迁移完成的定义不是“清单全部导入”，而是常规变更、漂移恢复、紧急变更和灾备恢复都能在新控制模型下执行并留下证据。\n\n扩面评审还要检查平台自身容量：\n\n- Repository 请求量和渲染队列是否接近上限。\n- 控制器分片、并发和重试是否有容量预算。\n- Application 数量增长是否扩大单次错误配置的影响面。\n- 审计、指标和日志保留是否覆盖新增环境。\n- On-call、升级和支持工单是否随团队规模增长。\n\n技术容量充足但支持模型失效，同样不应继续扩面。大量团队依赖少数平台人员手工接入，说明还没有形成可复用产品。\n\n每次扩面都保留一个对照组，比较迁移前后同类应用的交付时间、失败率和人工操作。这样能区分 GitOps 改造效果与业务周期、团队成熟度等外部因素。\n\n最终把计分卡、容量趋势和剩余风险放进季度评审，决定继续扩展、集中偿还平台债务，还是调整适用边界。\n\n评审结论需要指定 Owner、完成期限和复验方式。\n\n没有进入下一周期验证的改进项，不算真正关闭。\n\n这让 GitOps 落地本身也遵循声明、观察、调谐和反馈的闭环。\n\n完成发布、漂移注入、回滚、Break Glass、逆向追溯和角色交接；以证据决定扩面、暂停或回到前一阶段。\n\n#### 用端到端实验和迁移计分卡决定是否扩面的机制边界\n\n\n- **用端到端实验和迁移计分卡决定是否扩面的声明输入**：版本化期望状态必须拥有稳定身份、明确 Owner 和可比较的前后版本。\n- **用端到端实验和迁移计分卡决定是否扩面的控制过程**：调谐代理与配置仓库分别保存观察结果、决策原因和最后成功时间，避免把多个阶段压成一个“成功”。\n- **用端到端实验和迁移计分卡决定是否扩面的运行结果**：目标环境与业务探针必须能回指同一变更 ID，无法回指时发布状态只能是未知。\n- **用端到端实验和迁移计分卡决定是否扩面的恢复入口**：在执行前确定 Revert、Abort、凭据撤销或人工接管的触发条件和负责人。\n\n围绕“用端到端实验和迁移计分卡决定是否扩面”先固定输入和 Owner，再观察控制器是否接受、推进并报告结果。\n“用端到端实验和迁移计分卡决定是否扩面”出现绿色状态时仍只回答当前层次的问题，不能替代下一层的数据面或业务验收。\n\n#### 用端到端实验和迁移计分卡决定是否扩面的决策与证据\n\n| 判定层 | 本节点要核对的事实 | 合格证据 | 拒绝或暂停条件 |\n|---|---|---|---|\n| 输入 | `用端到端实验和迁移计分卡决定是否扩面` 使用的版本、参数与审批是否唯一 | Commit、Digest、对象 generation 或工单 ID | 使用浮动引用或来源不明 |\n| 控制 | `用端到端实验和迁移计分卡决定是否扩面` 的各控制器是否观察到同一输入并完成自己的动作 | Status、Condition、事件与控制器日志 | 永久错误、超时或状态互相矛盾 |\n| 数据面 | `用端到端实验和迁移计分卡决定是否扩面` 的最终对象、路由或制品是否与声明一致 | 对象快照、Manifest、Endpoint 或真实请求 | 只有 API 接受记录，没有运行结果 |\n| 恢复 | `用端到端实验和迁移计分卡决定是否扩面` 的回退入口与清理动作能否重复执行 | Revert 记录、恢复耗时与残留检查 | 回退依赖临时口令或个人记忆 |\n\n为“用端到端实验和迁移计分卡决定是否扩面”预先定义成功、暂未完成、失败、未知四种结果。暂未完成必须有最大等待时间；未知表示证据链不可用，默认不得自动晋级。\n\n#### 用端到端实验和迁移计分卡决定是否扩面的静态检查模板\n\n下面命令为“用端到端实验和迁移计分卡决定是否扩面”建立最小证据快照。资源名、命名空间、仓库和地址需按环境替换；未接入真实系统时不能写成运行验证结论。\n\n```bash\n# check: 用端到端实验和迁移计分卡决定是否扩面\nevidence_file=\"./evidence/check-38b337cb30.txt\"\ngit show --stat --oneline HEAD | tee -a \"${evidence_file}\"\nkubectl get applications.argoproj.io -A | tee -a \"${evidence_file}\"\nkubectl get events -n demo --sort-by=.lastTimestamp | tee -a \"${evidence_file}\"\ndate -u +%FT%TZ | tee -a \"${evidence_file}\"\n```\n“用端到端实验和迁移计分卡决定是否扩面”的命令返回零只说明查询完成。验收记录还要保存对象版本、查询时间和关键输出；若权限不足而缺失一层证据，应修复取证权限或把结果标为未知。\n\n#### 用端到端实验和迁移计分卡决定是否扩面的故障实验与恢复\n\n“用端到端实验和迁移计分卡决定是否扩面”的可逆故障场景是：冻结配置晋级，保留当前运行版本，修复声明或控制器后再重新比较。实验前保存基线并设置停止条件，故障中不得顺手修改第二个变量。\n\n1. 保存“用端到端实验和迁移计分卡决定是否扩面”的输入 Revision、对象 `resourceVersion`、运行身份、最近事件和当前业务基线。\n2. 注入与“用端到端实验和迁移计分卡决定是否扩面”直接相关的单一故障，记录第一个异常信号、告警延迟和是否越过门禁。\n3. 为“用端到端实验和迁移计分卡决定是否扩面”执行恢复策略：冻结后续变更并保留当前稳定状态，恢复版本化输入后等待控制器重新收敛，再用业务证据关闭事件。\n4. 重新采集“用端到端实验和迁移计分卡决定是否扩面”的同一组证据，确认控制器不再重试旧变更，数据面回到稳定版本，临时权限与对象已经清理。\n\n恢复完成的判据不是页面重新变绿，而是“用端到端实验和迁移计分卡决定是否扩面”的输入、控制状态、运行结果和清理记录再次对齐。若仍有旧连接、旧凭据、悬挂任务或无法解释的指标窗口，事件不能关闭。", "subs": ["用迁移计分卡决定是否扩面", "用端到端实验和迁移计分卡决定是否扩面的机制边界", "用端到端实验和迁移计分卡决定是否扩面的决策与证据", "用端到端实验和迁移计分卡决定是否扩面的静态检查模板", "用端到端实验和迁移计分卡决定是否扩面的故障实验与恢复"]}]}, {"title": "第 8 章 · DevOps 价值流与组织协作", "sections": [{"title": "DevOps、持续交付、CI、CD 与 GitOps 如何分工", "content": "DevOps 是围绕交付结果组织协作、反馈和改进的工作方式；持续交付是其中负责让软件保持可发布状态的一组工程实践。CI 关注变更集成和验证，CD 负责把已验证制品安全地部署或发布，GitOps 则用版本化期望状态和控制循环管理运行环境。它们是同一条价值流上的不同责任边界。\n\n#### 用交付边界避免工具职责漂移\n\n| 能力 | 主要输入 | 主要输出 | 不应承担的责任 |\n| --- | --- | --- | --- |\n| CI | 提交、依赖、构建参数 | 测试报告、不可变制品、证明 | 直接修改生产运行状态 |\n| CD | 已验证制品、发布策略、审批 | 部署结果、健康证据、回滚记录 | 重新构建或猜测制品版本 |\n| GitOps | 声明式配置、制品引用、策略 | 收敛状态、漂移报告、审计记录 | 代替 CI 生成二进制制品 |\n| DevOps 协作 | 业务目标、反馈、运行数据 | 更短反馈周期和更低交付风险 | 只设一个“DevOps 工具负责人” |\n\n接口契约应明确 Commit、制品 Digest、配置 Revision 和运行环境之间的关联。下游系统只能消费上游已经声明并验证的输入，不能通过 `latest`、默认分支或操作者本地配置补齐缺失信息。\n\n#### 用一条变更链识别责任交接\n\n```mermaid\nsequenceDiagram\n    participant Dev as 开发团队\n    participant CI as CI系统\n    participant Repo as 配置仓库\n    participant CD as GitOps控制器\n    participant Run as 运行环境\n    Dev->>CI: 提交变更和测试请求\n    CI->>CI: 构建测试扫描并签名\n    CI->>Repo: 写入不可变制品引用\n    Repo->>CD: 触发或等待配置变化\n    CD->>Run: 调谐声明状态\n    Run-->>CD: 返回健康和运行证据\n    CD-->>Dev: 发布结果和可追溯证据\n```", "subs": ["用交付边界避免工具职责漂移", "用一条变更链识别责任交接"]}, {"title": "价值流如何暴露交付瓶颈和返工", "content": "价值流分析从需求进入到用户获得可用结果，记录等待、处理、返工和失败恢复的时间。只有把排队时间与处理时间分开，团队才知道瓶颈在审批、测试环境、构建资源、发布窗口还是运行验证。\n\n#### 建立最小价值流事件表\n\n| 事件 | 必需字段 | 关注指标 | 典型改进 |\n| --- | --- | --- | --- |\n| 需求就绪 | 需求 ID、负责人 | 就绪到首次提交时间 | 缩小批次、明确入口 |\n| 首次提交 | Commit、仓库、分支 | 编码到构建等待时间 | 减少长分支、优化触发 |\n| 构建完成 | 制品 Digest、测试结果 | 构建时长、失败率 | 缓存、并行、弹性 Agent |\n| 发布开始 | 环境、审批、策略 | 等待发布时间 | 自动门禁、分批发布 |\n| 用户可用 | 业务结果、观测窗口 | Lead Time、恢复时间 | 自动验证、快速回滚 |\n\n事件字段必须能连接到同一次变更。只记录流水线状态而没有用户结果时，得到的是工具吞吐，不是交付价值。\n\n#### 用瓶颈假设驱动改进\n\n一次改进只验证一个主要假设，例如“构建等待占总时长一半，增加弹性 Agent 能降低等待”。先保存一周基线，再实施小范围变化，比较中位数、P95、失败率和返工比例。指标改善但缺陷率或事故率上升时，不能判定改进成功。", "subs": ["建立最小价值流事件表", "用瓶颈假设驱动改进"]}, {"title": "分支策略如何影响集成频率和发布风险", "content": "分支策略约束“变更何时集成、谁能发布、如何撤销”。长期分支降低短期冲突，却会积累集成风险；短生命周期分支减少漂移，但要求自动化验证足够快。\n\n#### 选择策略时比较四个变量\n\n1. 集成频率：每天多次集成的团队应避免长期特性分支。\n2. 发布节奏：需要独立发布的版本应有明确的制品分支或标签。\n3. 变更隔离：高风险实验优先用功能开关和小流量，而不是复制长期分支。\n4. 回滚方式：回滚应恢复已验证的制品或配置，不依赖重新构建历史代码。\n\n分支保护、合并检查、提交签名和发布权限应共同形成策略。规则数量不是质量，关键是每条规则都能阻止一个已知风险并提供失败反馈。\n\n#### 用集成实验验证分支策略\n\n选择一个包含并行变更的真实小项目，连续两周记录合并等待、冲突返工、构建失败和回滚次数。若短分支降低了等待却让主干红灯时间增加，应先修复测试反馈速度，而不是继续压缩分支生命周期。", "subs": ["选择策略时比较四个变量", "用集成实验验证分支策略"]}, {"title": "DORA 指标和 PDCA 如何形成持续改进闭环", "content": "DORA 类指标适合衡量交付系统结果，但不应单独作为个人绩效排名。部署频率、变更前置时间、变更失败率和恢复时间，应与缺陷逃逸、返工、业务成功率和操作负担一起观察。\n\n#### 把指标接入 PDCA\n\n| 环节 | 问题 | 产物 |\n| --- | --- | --- |\n| Plan | 哪个瓶颈最影响用户或团队 | 基线、假设、停止条件 |\n| Do | 在什么范围实施变化 | 版本化配置、实验记录 |\n| Check | 指标和业务结果是否改善 | 对比报告、异常解释 |\n| Act | 保留、回退还是扩大 | 决策记录、后续任务 |\n\n指标采集要保留变更版本、环境、时间窗和数据口径。没有这些维度的总平均值无法解释因果，也不应作为平台升级或组织调整的唯一依据。\n\n#### 为指标设置反作弊约束\n\n部署频率上升但变更批次变小、失败率被人为分类或恢复时间漏记，都会让指标失真。统计规则应版本化，保留原始事件和修订记录，并定期抽样回放一条变更链，确认指标与发布证据一致。", "subs": ["把指标接入 PDCA", "为指标设置反作弊约束"]}]}, {"title": "第 9 章 · 敏捷流动、技术债务与团队协作", "sections": [{"title": "业务敏捷如何为持续交付提供真实输入", "content": "持续交付无法单独修复需求批次过大、优先级频繁变化或验收标准模糊的问题。业务敏捷需要把用户结果拆成可验证的小批次，并让产品、研发、测试和运维共享完成定义。团队规模本身不是目标，关键是一次变更涉及的协作边界足够小，能够独立完成交付和恢复。\n\n#### 用完成定义连接业务和流水线\n\n完成定义至少包含：需求验收条件、自动化测试范围、观测字段、发布窗口、回滚条件和业务负责人。缺少其中任一项时，流水线可以构建成功，但不能把变更标记为可发布。平台模板应把这些字段作为输入，而不是由每个团队临时解释。\n\n#### 用小批次控制协作成本\n\n把跨团队任务拆成可独立发布的垂直切片，优先用功能开关、兼容接口和旁路读写降低一次变更的耦合。切片完成后记录等待、返工和交接次数；如果小批次反而增加人工协调，说明团队边界或服务契约仍需调整。", "subs": ["用完成定义连接业务和流水线", "用小批次控制协作成本"]}, {"title": "精益看板如何识别等待和在制品堆积", "content": "看板的重点不是把任务画成更多列，而是限制在制品数量，让阻塞尽早暴露。交付看板应同时展示需求、代码、测试、环境、审批和发布状态；某一列长期堆积，通常表示下游容量或入口质量存在问题。\n\n#### 为每个状态定义进入和退出条件\n\n| 状态 | 进入条件 | 退出条件 | 阻塞信号 |\n| --- | --- | --- | --- |\n| 开发中 | 已分配负责人和验收条件 | Commit 已提交并通过基础检查 | 长时间无提交 |\n| 验证中 | 测试环境和数据已准备 | 自动化检查和人工验收完成 | 环境等待或反复返工 |\n| 待发布 | 制品和配置已固定 | 审批、门禁和观察计划齐全 | 审批队列堆积 |\n| 观察中 | 小比例流量已切换 | 业务与技术指标达标 | 指标未知或持续异常 |\n\n状态定义必须能映射到系统事件，否则看板只是手工报表。每天检查超时卡片和阻塞原因，每周复盘最常见阻塞类型，再决定是改流程、扩容量还是收紧入口。\n\n#### 用流动效率而不是完成数量评估改进\n\n流动效率可用处理时间除以端到端经过时间估算。效率提高但失败率、返工或值班负担增加时，说明系统只是把工作推得更快，并没有创造更稳定的交付结果。改进实验应同时记录吞吐、等待、质量和恢复四类指标。", "subs": ["为每个状态定义进入和退出条件", "用流动效率而不是完成数量评估改进"]}, {"title": "技术债务如何进入交付优先级", "content": "技术债务是未来变化需要支付的额外成本，不等同于“代码不漂亮”。慢构建、脆弱测试、不可回滚配置、共享数据库和无人维护的插件都会在交付时表现为等待、返工或事故风险。债务条目必须连接到实际损失，才能与业务需求做优先级比较。\n\n#### 建立债务登记表\n\n债务记录至少包含触发场景、影响范围、当前成本、风险趋势、偿还方案、Owner 和复查日期。可以用构建失败率、发布等待、故障恢复时间、人工操作次数或维护工时估算成本；没有证据的“以后可能有问题”只能作为观察项，不能直接阻断所有发布。\n\n#### 用门禁和预算防止债务继续增长\n\n为高风险债务设置停止条件，例如禁止新增依赖、禁止扩大共享数据库写入或限制未签名镜像晋级；为低风险债务设置每个迭代的偿还预算。偿还后要重新测量原指标，确认成本确实下降，并把新的约束写回模板、测试或策略，避免债务再次积累。", "subs": ["建立债务登记表", "用门禁和预算防止债务继续增长"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
