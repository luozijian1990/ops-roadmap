<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

<script id="data" type="application/json">{"title": "Ansible 学习笔记 · 第一册：基础、Inventory 与模块", "intro": "> **适用对象**：运维工程师、SRE、平台工程师和自动化初学者<br>\n> **学习目标**：建立 Ansible 的运行环境，理解受管主机组织方式，并能安全地使用 Ad-Hoc 命令与模块完成批量操作<br>\n> **版本说明**：原始课程来自 Ansible 1.x 文档。本册保留其教学主线，并按 2026-08-19 的 Ansible 官方文档更新术语、命令和推荐实践；已经淘汰的机制会明确标为历史内容。", "parts": [{"title": "第一章 · 建立 Ansible 的基础运行环境", "sections": [{"title": "认识 Ansible 的安装方式与运行前提", "content": "Ansible 是一种无代理自动化工具。它安装在控制节点上，通过 SSH、PowerShell Remoting 或其他连接插件管理远端设备，不要求每台受管主机长期运行 Ansible 守护进程，也不依赖中央数据库。\n\n```mermaid\ngraph LR\n    U[运维人员] --> C[控制节点]\n    C -->|SSH| L[Linux 与 Unix 主机]\n    C -->|PSRP 或 WinRM| W[Windows 主机]\n    C -->|API 或连接插件| N[网络与云资源]\n    C --> I[Inventory]\n    C --> P[Playbook 与 Collections]\n```\n\n#### 控制节点和受管节点分别承担什么职责\n\n| 角色 | 主要职责 | 常见要求 |\n| --- | --- | --- |\n| 控制节点 | 保存 Inventory、配置、Playbook 和凭据并发起自动化 | POSIX 环境、受支持的 Python、网络可达性 |\n| 受管节点 | 接收模块并执行任务 | Linux/Unix 通常需要 Python；Windows 使用 PowerShell；网络设备取决于 Collection |\n| Inventory | 描述主机、分组、变量和连接参数 | INI、YAML、目录或动态插件 |\n| Module | 执行一个具体动作并返回结构化结果 | 来自 `ansible.builtin` 或其他 Collection |\n\n“无代理”不等于“零依赖”。Linux/Unix 主机执行大多数模块时仍需要可用的 Python；缺少 Python 的新主机可以先用 `ansible.builtin.raw` 引导安装。Windows 模块在 PowerShell 中执行，并需要配置可用的远程连接方式。\n\n#### 选择 `ansible` 还是 `ansible-core`\n\n当前发行形态分为两个层次：\n\n| 软件包 | 包含内容 | 适用场景 |\n| --- | --- | --- |\n| `ansible-core` | 核心命令、执行引擎、内置插件和 `ansible.builtin` | 希望严格控制 Collection 的平台团队 |\n| `ansible` | `ansible-core` 加一组社区 Collections | 学习、通用自动化和希望开箱即用的用户 |\n\n生产环境应固定经过验证的版本，不要让同一仓库在不同机器上任意漂移。可以把版本写入工具链文件，例如：\n\n```text\n# requirements.txt\nansible-core==2.21.*\n```\n\n这里的 `2.21` 是本册核对时的当前稳定核心系列。以后使用本笔记时，应先查看官方维护矩阵，再把约束更新到团队实际验证的受支持版本。\n\n具体兼容版本应以项目执行时的官方支持矩阵为准，而不是照抄旧教程里的 Python 2 或 Ansible 1.x 要求。\n\n#### 使用隔离环境安装\n\n`pipx` 能为命令行应用创建隔离的 Python 环境，避免污染系统 Python：\n\n```bash\n# 安装完整社区包\npipx install --include-deps ansible\n\n# 或仅安装核心执行引擎\npipx install ansible-core\n\n# 查看实际使用的核心版本和配置位置\nansible --version\n\n# 查看社区包版本\nansible-community --version\n```\n\n也可以使用虚拟环境：\n\n```bash\npython3 -m venv .venv\nsource .venv/bin/activate\npython3 -m pip install --upgrade pip\npython3 -m pip install 'ansible-core==2.21.*'\nansible --version\n```\n\n不要在未理解系统 Python 管理策略的情况下执行 `sudo pip install ansible`。现代 Linux 发行版可能启用外部管理环境限制，而全局安装也容易让多个项目发生依赖冲突。\n\n#### 验证安装而不是只看命令是否存在\n\n```bash\nansible --version\nansible-config --version\nansible-galaxy --version\nansible-doc ansible.builtin.ping\n```\n\n`ansible --version` 会显示：\n\n- `ansible-core` 版本；\n- 配置文件位置；\n- 模块和 Collection 搜索路径；\n- Python 解释器和版本；\n- 可执行文件路径。\n\n若团队成员的结果不同，应先统一执行环境，再排查 Playbook。许多“同一份代码在另一台机器失败”的问题，本质上来自核心版本、Collection 版本或配置文件不同。\n\n#### 历史材料中哪些安装方式不应直接照搬\n\n原课程中的 Python 2、`easy_install`、旧 PPA、`git://` 克隆地址、`ansible-modules-core` 子模块和全局 `sudo pip` 都属于旧版本语境。它们有助于理解 Ansible 的演进，但不应作为新环境的默认安装步骤。\n\n#### 按使用场景选择安装与升级路径\n\n安装方式不是“哪条命令最短”的问题，而是由控制节点、升级责任和可复现要求共同决定：\n\n| 场景 | 建议方式 | 升级与回退责任 |\n| --- | --- | --- |\n| 个人学习或临时控制节点 | `pipx` 安装 `ansible` | 学习者记录并更新版本 |\n| 项目级开发与 CI | 虚拟环境加锁定文件 | 仓库维护者评审依赖升级 |\n| 企业自动化平台 | Execution Environment 容器镜像 | 平台团队构建、扫描、签名和回退 |\n| 发行版自带包 | 系统包管理器 | 接受发行版的版本和补丁节奏 |\n| 参与 Ansible 本身开发 | 源码检出和开发环境 | 仅用于开发与测试，不作为生产部署 |\n\n操作系统包通常集成稳定，但版本可能落后；Python 包更新较快，却要求团队自己管理解释器与依赖。生产环境不应从 Git 主分支直接运行，也不应在发布当天无验证地升级核心版本。一个稳妥升级过程是：读取端口指南与维护矩阵，在隔离环境锁定新版本，执行语法检查和集成测试，最后逐步更新控制节点或 Execution Environment。\n\n```mermaid\ngraph LR\n    R[Read porting guide] --> L[Lock candidate version]\n    L --> S[Static checks]\n    S --> I[Integration environment]\n    I --> C[Canary automation job]\n    C --> P[Promote execution image]\n    P --> B[Keep rollback image]\n```\n\n当前安装与版本选择可继续查阅 [Ansible 官方安装指南](https://docs.ansible.com/projects/ansible/latest/installation_guide/intro_installation.html)。", "subs": ["控制节点和受管节点分别承担什么职责", "选择 ansible 还是 ansible", "使用隔离环境安装", "验证安装而不是只看命令是否存在", "历史材料中哪些安装方式不应直接照搬", "按使用场景选择安装与升级路径"]}, {"title": "从 SSH 连接到第一条 Ansible 命令", "content": "完成安装后，应先建立一个最小实验项目。把 Inventory、配置和后续 Playbook 放在同一目录，便于版本控制和复现。\n\n```bash\nmkdir ansible-quickstart\ncd ansible-quickstart\n```\n\n创建 `inventory.yml`：\n\n```yaml\nall:\n  children:\n    linux:\n      hosts:\n        web01:\n          ansible_host: 192.0.2.10\n        web02:\n          ansible_host: 192.0.2.11\n      vars:\n        ansible_user: ops\n```\n\n#### 先验证原生 SSH\n\nAnsible 无法替你修复所有底层连接问题。应先确认控制节点可以直接连接：\n\n```bash\nssh ops@192.0.2.10\n```\n\n若使用密钥，推荐让 `ssh-agent` 管理已加密的私钥：\n\n```bash\neval \"$(ssh-agent -s)\"\nssh-add ~/.ssh/id_ed25519\nssh-add -l\n```\n\n然后查看 Ansible 对 Inventory 的解析结果：\n\n```bash\nansible-inventory -i inventory.yml --graph\nansible-inventory -i inventory.yml --host web01\n```\n\n#### 用 ping 模块验证完整执行链路\n\n```bash\nansible linux -i inventory.yml -m ansible.builtin.ping\n```\n\n`ansible.builtin.ping` 不是 ICMP ping。它会建立 Ansible 连接、在受管节点执行 Python 模块并检查返回值 `pong`，因此能够同时验证 Inventory 匹配、身份认证、远端 Python 和模块传输链路。\n\n```mermaid\nsequenceDiagram\n    participant O as Operator\n    participant A as Ansible\n    participant H as Managed Host\n    O->>A: ansible linux -m ping\n    A->>A: Parse inventory and variables\n    A->>H: Establish SSH connection\n    A->>H: Transfer or pipeline module\n    H-->>A: Return JSON result\n    A-->>O: Display pong or failure\n```\n\n常见失败可按层次判断：\n\n| 现象 | 常见原因 | 优先检查 |\n| --- | --- | --- |\n| `Could not match supplied host pattern` | 主机或组不在 Inventory | `ansible-inventory --graph` |\n| `UNREACHABLE` | DNS、路由、端口、账号或密钥问题 | 原生 `ssh -vvv` |\n| Python not found | 受管节点没有合适的解释器 | `ansible_python_interpreter` 或 `raw` |\n| `FAILED` 且模块已执行 | 参数、权限或目标状态问题 | 模块返回值和 `-vvv` |\n\n#### 使用现代提权参数\n\n原课程使用 `--sudo`、`--sudo-user` 和 `ansible_sudo_*`。这些写法已经被通用的 become 机制替代：\n\n```bash\n# 以当前远程用户连接并提权为 root\nansible linux -i inventory.yml -b -m ansible.builtin.command -a 'id'\n\n# 提权为指定用户\nansible linux -i inventory.yml -b --become-user postgres \\\n  -m ansible.builtin.command -a 'id'\n\n# 需要交互输入提权密码时\nansible linux -i inventory.yml -b --ask-become-pass \\\n  -m ansible.builtin.command -a 'id'\n```\n\n| 旧写法 | 当前写法 |\n| --- | --- |\n| `--sudo` | `--become` 或 `-b` |\n| `--ask-sudo-pass` | `--ask-become-pass` 或 `-K` |\n| `--sudo-user` | `--become-user` |\n| `ansible_ssh_user` | `ansible_user` |\n| `ansible_ssh_port` | `ansible_port` |\n| `ansible_ssh_host` | `ansible_host` |\n\n#### 谨慎处理主机密钥检查\n\n主机密钥检查用于发现中间人攻击或主机身份意外变化。实验环境可以临时调整，生产环境不应为了省事长期关闭：\n\n```bash\n# 先通过受控渠道写入可信主机密钥\nssh-keyscan -H 192.0.2.10 >> ~/.ssh/known_hosts\n```\n\n如果出现主机重装导致的密钥变化，应先核实主机身份，再删除旧记录，而不是直接关闭检查。", "subs": ["先验证原生 SSH", "用 ping 模块验证完整执行链路", "使用现代提权参数", "谨慎处理主机密钥检查"]}, {"title": "理解配置文件的查找顺序与常用选项", "content": "Ansible 可以从配置文件、环境变量、命令行选项、Playbook 关键字和变量中获得行为设置。排障时必须同时回答两个问题：加载了哪一个配置文件，以及最终值被哪一层覆盖。\n\n#### `ansible.cfg` 只使用找到的第一份\n\n配置文件查找顺序为：\n\n1. `ANSIBLE_CONFIG` 指向的文件；\n2. 当前目录中的 `ansible.cfg`；\n3. 用户目录中的 `~/.ansible.cfg`；\n4. `/etc/ansible/ansible.cfg`。\n\nAnsible 使用第一个找到的文件，不会把多份配置文件叠加。可直接确认当前结果：\n\n```bash\nansible --version\nansible-config view\nansible-config dump --only-changed\n```\n\n`ansible-config dump --only-changed` 比手工翻阅一份巨大配置模板更适合排障，因为它只显示偏离默认值的配置及其来源。\n\n#### 配置优先级不等于变量优先级\n\n从低到高可以先记住以下大类：\n\n```mermaid\ngraph LR\n    A[Configuration settings] --> B[Command line options]\n    B --> C[Playbook keywords]\n    C --> D[Variables]\n    D --> E[Direct assignment]\n```\n\n同一个行为既可能由配置项控制，也可能由连接变量控制。例如 `remote_user` 是配置项，而 `ansible_user` 是变量；后者通常会覆盖前者。额外变量 `-e` 在变量体系中优先级很高，因此不应把它当作日常配置入口滥用。\n\n#### 为项目创建最小配置\n\n```ini\n[defaults]\ninventory = ./inventory.yml\nforks = 20\ntimeout = 15\nhost_key_checking = True\nretry_files_enabled = False\ninterpreter_python = auto_silent\n\n[ssh_connection]\npipelining = True\nssh_args = -o ControlMaster=auto -o ControlPersist=60s\n```\n\n关键设置：\n\n| 设置 | 作用 | 注意事项 |\n| --- | --- | --- |\n| `inventory` | 默认 Inventory 来源 | 项目内相对路径更易复现 |\n| `forks` | 同时处理的主机数量 | 受控制节点资源和下游承载能力限制 |\n| `timeout` | 连接超时 | 不等于模块整体执行超时 |\n| `host_key_checking` | 校验 SSH 主机身份 | 生产环境建议保持开启 |\n| `interpreter_python` | 选择远端 Python | 优先依赖自动发现，例外再按主机覆盖 |\n| `pipelining` | 减少 SSH 往返与临时文件传输 | 需结合提权和安全策略验证 |\n| `roles_path` | 补充 Role 搜索路径 | 不宜隐藏跨项目的隐式依赖 |\n| `collections_paths` | Collection 搜索路径 | 与项目依赖管理保持一致 |\n\n生成带注释的配置模板：\n\n```bash\nansible-config init --disabled > ansible.cfg.example\n```\n\n不要把模板中的每个选项都启用。配置越少，默认行为升级时的认知负担越低。\n\n#### 按行为类别管理配置\n\n旧课程逐项罗列配置很容易让人忽略选项之间的关系。现代项目更适合按用途分组，并只启用确有需求的设置：\n\n```ini\n[defaults]\n# Facts 与缓存\ngathering = smart\nfact_caching = jsonfile\nfact_caching_connection = ./.cache/ansible-facts\nfact_caching_timeout = 3600\n\n# 输出与审计\ncallbacks_enabled = ansible.posix.profile_tasks\nlog_path = ./.cache/ansible.log\n\n# 故障行为\nforce_handlers = False\n\n# 依赖与秘密入口\ncollections_paths = ./collections\nroles_path = ./roles\nvault_identity_list = development@prompt,production@./scripts/vault-password-client\n```\n\n| 类别 | 典型设置 | 设计问题 |\n| --- | --- | --- |\n| Facts | `gathering`、`fact_caching*` | 数据是否允许跨运行复用，多久过期 |\n| 输出 | callback、display、`log_path` | 谁能读日志，是否可能包含秘密 |\n| 故障 | `force_handlers`、重试文件 | 失败后还应执行哪些一致性动作 |\n| 路径 | `roles_path`、`collections_paths` | 依赖是否随项目交付而不是依赖控制机全局状态 |\n| Vault | `vault_identity_list` | 不同环境如何选择密钥，脚本如何从秘密系统取值 |\n\n示例中的 `jsonfile` 适合单机实验，不适合多个并发控制节点共享；`log_path` 和缓存目录要加入忽略规则并限制权限。启用第三方 callback 或 cache plugin 前，还要把对应 Collection 写入依赖文件。用以下命令确认名称、默认值和生效来源：\n\n```bash\nansible-config list | less\nansible-config dump --only-changed\nansible-doc -t cache -l\nansible-doc -t callback -l\n```\n\n#### 配置中的安全边界\n\n- 不把 SSH 密码、become 密码或 Vault 密码明文写进 `ansible.cfg`；\n- 不把 `host_key_checking = False` 当作通用修复；\n- 不把日志写到所有用户可读的路径；\n- 对可能包含秘密的任务设置 `no_log: true`，但不要把它当作完整的秘密管理方案；\n- 不从不可信、可被其他用户写入的当前目录加载 `ansible.cfg`。\n\n配置细节可使用本机 `ansible-config list` 查询，也可查阅 [官方配置参考](https://docs.ansible.com/projects/ansible/latest/reference_appendices/config.html) 与 [优先级规则](https://docs.ansible.com/projects/ansible/latest/reference_appendices/general_precedence.html)。\n\n#### 历史配置项如何处理\n\n旧材料中的 `hostfile`、`sudo_*`、`accelerate_*`、`module_name` 等配置属于旧版本。现代项目应先用 `ansible-config list` 确认选项是否存在；Accelerated Mode 已退出当前架构，SSH ControlPersist 与 pipelining 承担了原先大量性能优化诉求。", "subs": ["ansible", "配置优先级不等于变量优先级", "为项目创建最小配置", "按行为类别管理配置", "配置中的安全边界", "历史配置项如何处理"]}, {"title": "管理 Windows 主机需要哪些额外准备", "content": "Windows 不是“把 Linux 模块换个目标地址”那么简单。它有独立的连接方式、模块命名空间、Shell 语义、路径格式和认证模型。\n\n```mermaid\ngraph TD\n    C[Ansible 控制节点] --> P[PSRP connection]\n    C --> R[WinRM connection]\n    C --> S[SSH connection]\n    P --> W[Windows PowerShell Remoting]\n    R --> W\n    S --> O[Windows OpenSSH]\n    W --> M[ansible.windows modules]\n    O --> M\n```\n\n#### 当前支持边界\n\n当前官方文档以 Windows Server 2016 或 Windows 10 及更新版本作为受支持起点，这些系统自带 Windows PowerShell 5.1。旧课程中的 Windows 7、Server 2008 R2、PowerShell 3.0 升级脚本和早期热修复流程，只适合历史环境研究。\n\nWindows 可以作为受管节点。控制节点通常使用 Linux 或其他 POSIX 环境；原生 Windows 不能直接作为常规 Ansible 控制节点，但可以通过 WSL 等 POSIX 环境运行。具体限制应以所用 `ansible-core` 版本文档为准。\n\n#### 选择连接插件\n\n| 连接方式 | 特点 | 常见用途 |\n| --- | --- | --- |\n| `psrp` | 较新的 PowerShell Remoting 插件，性能和高负载稳定性通常更好 | 新建 Windows 自动化项目 |\n| `winrm` | 历史使用广、资料多 | 兼容既有 WinRM 配置 |\n| `ssh` | 使用 Windows OpenSSH | 已标准化 SSH 管理的环境 |\n\n安装额外依赖时要注入安装 Ansible 的同一 Python 环境：\n\n```bash\n# pipx 安装的完整 ansible 包\npipx inject ansible 'pypsrp<=1.0.0'\npipx inject ansible 'pywinrm>=0.4.0'\n```\n\n#### 配置 Windows Inventory\n\n以下示例采用 YAML 和 PSRP：\n\n```yaml\nall:\n  children:\n    windows:\n      hosts:\n        win-app-01:\n          ansible_host: 192.0.2.30\n      vars:\n        ansible_connection: psrp\n        ansible_user: 'EXAMPLE\\ansible-ops'\n        ansible_psrp_auth: negotiate\n        ansible_port: 5986\n        ansible_psrp_protocol: https\n        ansible_psrp_cert_validation: validate\n```\n\n不要把 `ansible_password` 直接提交到普通变量文件。可以使用 Ansible Vault、外部秘密系统，或自动化控制器的 Credential 机制。\n\n域环境优先考虑 Kerberos；本地账号可以选择 HTTPS 上的 Basic 或 NTLM。CredSSP 支持凭据委托，但由于双跳和无约束委托风险，只应在明确需要并理解信任边界时启用。\n\n#### 准备并验证 Windows 主机\n\nWindows Server 2012 之后通常默认启用 WinRM，但监听器、认证、证书和防火墙仍可能需要配置。检查监听器：\n\n```powershell\nwinrm enumerate winrm/config/Listener\nGet-PSSessionConfiguration | Select-Object Name, PSVersion\n```\n\n验证 Ansible 通道：\n\n```bash\nansible windows -i inventory.yml -m ansible.windows.win_ping\nansible windows -i inventory.yml -m ansible.windows.setup\n```\n\n`win_ping` 与 Linux 的 `ping` 一样验证模块执行链路，不发送 ICMP 报文。\n\n#### 使用 Windows 专用模块\n\n```yaml\n- name: 验证 Windows 文件并读取系统信息\n  hosts: windows\n  gather_facts: false\n  tasks:\n    - name: 获取 PowerShell 版本\n      ansible.windows.win_powershell:\n        script: $PSVersionTable.PSVersion.ToString()\n      register: ps_version\n\n    - name: 检查配置文件\n      ansible.windows.win_stat:\n        path: C:\\Windows\\win.ini\n      register: win_ini\n\n    - name: 展示结果\n      ansible.builtin.debug:\n        msg: \"PowerShell={{ ps_version.output[0] }} file_exists={{ win_ini.stat.exists }}\"\n```\n\n现代模块通常使用完全限定名称，例如 `ansible.windows.win_service`。旧材料里的 `win_*` 短名称有时仍能解析，但 FQCN 能明确模块来自哪个 Collection。\n\n#### 理解 Windows 模块的执行与开发边界\n\nLinux 模块通常由控制节点传输 Python 代码后在目标执行；Windows 模块主要以 PowerShell 实现，并通过 PowerShell Remoting 或 Windows OpenSSH 进入目标。因而 Linux 的 `ansible.builtin.shell`、路径、环境变量和返回结构不能原样套到 Windows。优先选择 `ansible.windows` 或相应 Collection 中的专用模块，只有没有声明式模块时才使用 `ansible.windows.win_powershell`。\n\nWindows Facts 同样进入 `ansible_facts`，但字段取决于平台和模块版本。先用 `ansible.windows.setup` 查看实际数据，再在条件或模板中读取，不要假设 Linux 网卡名、服务管理器和文件权限模型存在于 Windows。\n\n如果需要编写自定义 Windows 模块，应将模块放进 Collection、使用 PowerShell 参数规范和结构化 JSON 返回，并用 FQCN 调用。模块需要明确 `changed`、失败信息、check mode 行为和敏感参数；不要把一段只能在某台机器运行的脚本包装后就称为可复用模块。\n\n更多当前要求见 [Windows 主机管理指南](https://docs.ansible.com/projects/ansible/latest/os_guide/intro_windows.html) 和 [WinRM 指南](https://docs.ansible.com/projects/ansible/latest/os_guide/windows_winrm.html)。", "subs": ["当前支持边界", "选择连接插件", "配置 Windows Inventory", "准备并验证 Windows 主机", "使用 Windows 专用模块", "理解 Windows 模块的执行与开发边界"]}]}, {"title": "第二章 · 用 Inventory 和 Patterns 组织受管主机", "sections": [{"title": "使用静态 Inventory 描述主机与分组", "content": "Inventory 是 Ansible 对受管对象的视图。它不仅列出地址，还定义主机的稳定标识、业务分组、环境分组、连接参数和变量来源。Patterns 再从这个视图中选出本次执行的目标集合。\n\n```mermaid\ngraph TD\n    I[Inventory sources] --> A[all]\n    A --> P[production]\n    A --> T[staging]\n    P --> W[webservers]\n    P --> D[dbservers]\n    W --> H1[web01]\n    W --> H2[web02]\n    D --> H3[db01]\n    H1 --> V1[host_vars]\n    W --> V2[group_vars]\n```\n\n#### INI 与 YAML 两种常用格式\n\nINI 适合小型清单：\n\n```ini\n[webservers]\nweb01 ansible_host=192.0.2.10\nweb02 ansible_host=192.0.2.11\n\n[dbservers]\ndb01 ansible_host=192.0.2.20\n\n[production:children]\nwebservers\ndbservers\n\n[production:vars]\nansible_user=ops\n```\n\nYAML 更适合表达层次和复杂变量：\n\n```yaml\nall:\n  children:\n    production:\n      children:\n        webservers:\n          hosts:\n            web01:\n              ansible_host: 192.0.2.10\n            web02:\n              ansible_host: 192.0.2.11\n        dbservers:\n          hosts:\n            db01:\n              ansible_host: 192.0.2.20\n      vars:\n        ansible_user: ops\n```\n\nAnsible 自动创建 `all` 和 `ungrouped` 两个组。一个主机可以同时属于功能、环境、区域等多个组，但组维度要有清晰含义，避免用组名承载临时执行状态。\n\n#### Inventory 别名与连接参数\n\n```yaml\nall:\n  hosts:\n    bastion:\n      ansible_host: 192.0.2.50\n      ansible_port: 2222\n      ansible_user: ops\n      ansible_ssh_private_key_file: ~/.ssh/ops_ed25519\n```\n\n这里 `bastion` 是 `inventory_hostname`，也是 Patterns 应使用的稳定标识；`192.0.2.50` 才是实际连接地址。即使 IP 变化，Playbook 仍可继续引用 `bastion`。\n\n常见连接变量包括：\n\n| 变量 | 含义 |\n| --- | --- |\n| `ansible_host` | 实际连接地址 |\n| `ansible_port` | 连接端口 |\n| `ansible_user` | 远程用户 |\n| `ansible_connection` | `ssh`、`local`、`psrp` 等连接插件 |\n| `ansible_python_interpreter` | 远端 Python 路径 |\n| `ansible_become` | 是否提权 |\n| `ansible_become_user` | 提权后的用户 |\n\n连接变量是行为控制，不应与业务变量混在一起随意覆盖。旧名称 `ansible_ssh_host`、`ansible_ssh_port`、`ansible_ssh_user` 应迁移到通用名称。\n\n#### 用 `group_vars` 和 `host_vars` 分离变量\n\n推荐目录：\n\n```text\ninventory/\n├── hosts.yml\n├── group_vars/\n│   ├── all.yml\n│   ├── production.yml\n│   └── webservers/\n│       ├── defaults.yml\n│       └── vault.yml\n└── host_vars/\n    └── web01.yml\n```\n\n`group_vars/webservers/defaults.yml`：\n\n```yaml\nhttp_port: 8080\nhealthcheck_path: /healthz\n```\n\n`host_vars/web01.yml`：\n\n```yaml\nmaintenance_window: sunday-02:00\n```\n\n原则上，共同策略放组变量，真正的主机例外才放主机变量。大量主机特例通常说明分组模型需要重构。\n\n#### 将环境分开，而不是靠变量切换所有内容\n\n```text\ninventories/\n├── staging/\n│   ├── hosts.yml\n│   └── group_vars/\n└── production/\n    ├── hosts.yml\n    └── group_vars/\n```\n\n```bash\nansible-inventory -i inventories/staging --graph\nansible-inventory -i inventories/production --graph\n```\n\n分离环境能降低一次命令误选生产主机的概率，也方便对生产 Inventory 实施更严格的审核和权限控制。\n\n#### 在执行前验证清单\n\n```bash\nansible-inventory -i inventory/hosts.yml --graph\nansible-inventory -i inventory/hosts.yml --list\nansible-inventory -i inventory/hosts.yml --host web01\n```\n\n把 Inventory 和变量文件纳入版本控制，但将 Vault 密文或外部秘密引用与普通变量分开管理。官方的完整组织方式见 [Inventory 构建指南](https://docs.ansible.com/projects/ansible/latest/inventory_guide/intro_inventory.html)。", "subs": ["INI 与 YAML 两种常用格式", "Inventory 别名与连接参数", "用 group_vars 和 host_vars 分离变量", "将环境分开，而不是靠变量切换所有内容", "在执行前验证清单"]}, {"title": "从外部系统动态生成 Inventory", "content": "静态 Inventory 适合变化较慢的环境。当主机由云平台、自动伸缩组、CMDB、LDAP 或容器平台动态维护时，手工清单会产生漂移：已经销毁的主机仍被执行，新建主机却没有进入自动化范围。\n\n```mermaid\nsequenceDiagram\n    participant A as Ansible\n    participant P as Inventory Plugin\n    participant S as Cloud or CMDB\n    A->>P: Load inventory source\n    P->>S: Query resources\n    S-->>P: Hosts tags and metadata\n    P-->>A: Groups hosts and variables\n    A->>A: Apply pattern and execute\n```\n\n#### 优先使用 Inventory Plugin\n\n旧材料大量介绍可执行脚本，如 `ec2.py` 和 `cobbler.py`。现代 Ansible 同时支持脚本与插件，但官方推荐 Inventory Plugin，因为插件能直接复用核心解析、缓存、构造分组和错误处理能力。许多云插件随各自 Collection 发布。\n\n查看可用插件：\n\n```bash\nansible-doc -t inventory -l\nansible-doc -t inventory amazon.aws.aws_ec2\n```\n\n安装 Collection 并记录依赖：\n\n```yaml\n# requirements.yml\ncollections:\n  # 首次验证后在实际项目中补充明确的 version 约束\n  - name: amazon.aws\n```\n\n```bash\nansible-galaxy collection install -r requirements.yml\n```\n\n一个简化的 AWS 动态源示意：\n\n```yaml\n# inventories/production/10-aws.aws_ec2.yml\nplugin: amazon.aws.aws_ec2\nregions:\n  - ap-southeast-1\nfilters:\n  instance-state-name: running\nkeyed_groups:\n  - key: tags.Role\n    prefix: role\n  - key: placement.region\n    prefix: region\ncompose:\n  ansible_host: private_ip_address\n```\n\n具体字段取决于 Collection 版本，编写前必须查阅该插件的 `ansible-doc`。\n\n#### 区分 `compose`、`groups` 与 `keyed_groups`\n\n许多 Inventory Plugin 复用了 constructed 能力，但三个选项解决的是不同问题：\n\n| 选项 | 输入 | 输出 | 示例 |\n| --- | --- | --- | --- |\n| `compose` | 已取得的主机元数据 | 新的主机变量 | 用私网 IP 生成 `ansible_host` |\n| `groups` | 条件表达式 | 固定名称的条件组 | 磁盘加密的主机进入 `encrypted` |\n| `keyed_groups` | 某个字段的值 | 按值生成的一系列组 | `Role=api` 生成 `role_api` |\n\n```yaml\nplugin: amazon.aws.aws_ec2\nregions:\n  - ap-southeast-1\ncompose:\n  ansible_host: private_ip_address\n  deployment_ring: tags.DeploymentRing | default('stable')\ngroups:\n  monitored: tags.Monitoring | default('disabled') == 'enabled'\nkeyed_groups:\n  - key: tags.Role\n    prefix: role\n  - key: placement.availability_zone\n    prefix: az\n    parent_group: aws_zones\n```\n\n动态生成的组名可能被插件清洗，例如连字符被转换为下划线。不要凭云平台标签猜 Pattern；以 `ansible-inventory --graph` 的实际结果为准。`strict: true` 能让缺少变量时立即失败，但只有在元数据契约稳定时才适合开启。\n\n#### 混合静态与动态来源\n\nInventory 目录可以同时放入多个来源：\n\n```text\ninventories/production/\n├── 00-groups.yml\n├── 10-aws.aws_ec2.yml\n├── 20-on-prem.yml\n└── group_vars/\n```\n\n文件名的数字前缀明确加载顺序。Ansible 按来源顺序加载内容；同一变量重复定义时，后加载值可能覆盖先前值，因此不能依赖含糊的文件名顺序。\n\n静态源还可以把多个动态组纳入一个稳定的父组。因为某些解析器会丢弃尚无主机的空组，父组文件通常应在产生子组之后加载：\n\n```yaml\n# inventories/production/90-parent-groups.yml\nall:\n  children:\n    production_apps:\n      children:\n        role_api:\n        role_worker:\n```\n\n```bash\n# 多个 -i 参数也按给定顺序合并，后者的同名变量可能覆盖前者\nansible-inventory -i inventories/base.yml -i inventories/production --graph\n```\n\n```bash\nansible-inventory -i inventories/production --graph\nansible-inventory -i inventories/production --list --yaml\n```\n\n#### 缓存动态 Inventory 并接受新鲜度边界\n\n支持缓存的插件通常可以在源文件中启用 `cache: true` 并配置 cache plugin。缓存减少云 API 或 CMDB 查询，但也意味着已经删除或重新标记的资源会在 TTL 内继续存在。生产变更前必须根据风险判断是接受缓存、刷新缓存，还是让流水线先完成一次 Inventory 同步。\n\n```yaml\nplugin: amazon.aws.aws_ec2\ncache: true\ncache_plugin: ansible.builtin.jsonfile\ncache_connection: ./.cache/inventory\ncache_timeout: 300\n```\n\n不同插件支持的缓存选项不完全相同，应以 `ansible-doc -t inventory <plugin>` 为准。不要让多个作业无协调地共享本地文件缓存，也不要直接编辑 cache plugin 的内部数据。\n\n#### 动态 Inventory 的生产检查清单\n\n- API 凭据来自环境、工作负载身份或秘密系统，不写入插件配置；\n- 只查询需要的区域、项目和资源状态，避免慢查询与意外扩域；\n- 用稳定标签构造组，不依赖短生命周期 IP；\n- 明确缓存有效期，知道资源销毁后多久从清单消失；\n- 在正式执行前检查 `--graph` 与 `--host`；\n- 对插件和 Collection 固定版本；\n- 给生产命令叠加 Patterns 和 `--limit` 双重约束。\n\n官方说明见 [动态 Inventory 指南](https://docs.ansible.com/projects/ansible/latest/inventory_guide/intro_dynamic_inventory.html)。", "subs": ["优先使用 Inventory Plugin", "区分 compose、groups 与 keyed_groups", "混合静态与动态来源", "缓存动态 Inventory 并接受新鲜度边界", "动态 Inventory 的生产检查清单"]}, {"title": "使用 Patterns 精确选择目标主机", "content": "Patterns 是集合表达式。它只能选择 Inventory 已知的主机，不会因为写入了一个新 IP 就自动绕过 Inventory。\n\n| 目标 | Pattern |\n| --- | --- |\n| 全部主机 | `all` 或 `*` |\n| 单台主机 | `web01` |\n| 两组并集 | `webservers:dbservers` |\n| 排除某组 | `webservers:!canary` |\n| 两组交集 | `webservers:&staging` |\n| 组合选择 | `webservers:dbservers:&staging:!disabled` |\n| 通配符 | `*.example.com` |\n| 正则表达式 | `~(web|db).*\\.example\\.com` |\n\nShell 会解释 `!`、`*` 等字符，复杂 Pattern 应使用单引号：\n\n```bash\nansible 'webservers:&production:!canary' \\\n  -i inventories/production \\\n  -m ansible.builtin.ping\n```\n\n#### `hosts` 和 `--limit` 共同决定执行范围\n\nPlaybook：\n\n```yaml\n- name: 更新 Web 服务\n  hosts: webservers\n  tasks:\n    - name: 验证目标\n      ansible.builtin.debug:\n        var: inventory_hostname\n```\n\n运行时进一步收窄：\n\n```bash\nansible-playbook -i inventories/production site.yml \\\n  --limit 'webservers:&ap_southeast_1:!canary'\n```\n\n`--limit` 与 Play 中的 `hosts` 取交集，不能扩大 Play 原本的目标范围。生产变更前可以先运行：\n\n```bash\nansible-playbook -i inventories/production site.yml \\\n  --limit 'webservers:&ap_southeast_1:!canary' \\\n  --list-hosts\n```\n\n#### 使用切片与主机列表时明确风险\n\nPattern 支持以零为起点的位置与范围切片，且范围末端包含在结果中：\n\n```bash\n# 第一台和最后一台\nansible 'webservers[0]' -i inventories/production -m ansible.builtin.ping\nansible 'webservers[-1]' -i inventories/production -m ansible.builtin.ping\n\n# 选择索引 0 到 2 共三台\nansible 'webservers[0:2]' -i inventories/production -m ansible.builtin.ping\n```\n\n切片适合实验和临时排查，但动态 Inventory 的顺序可能随来源变化，不应把 `webservers[0]` 当作稳定 canary。生产灰度应使用明确的 `canary` 标签或组。\n\n审核后生成的主机名文件可直接作为限制条件：\n\n```text\n# approved-hosts.txt\nweb01\nweb02\n```\n\n```bash\nansible-playbook -i inventories/production site.yml \\\n  --limit @approved-hosts.txt --list-hosts\n```\n\n文件中的名称仍需存在于 Inventory。将主机列表与发布工单关联，比在流水线里拼接一长串临时 Pattern 更容易审计。\n\n#### 常见陷阱\n\n- 使用连接 IP 而不是 Inventory 别名，导致匹配失败；\n- 把并集误写成交集，扩大执行范围；\n- 忘记给 `!` Pattern 加单引号，被 Shell 处理；\n- 对动态组名的清洗规则作假设，没有先看 `--graph`；\n- 使用组切片依赖不稳定顺序，把它当作可靠灰度机制；\n- 直接对 `all` 执行破坏性命令，没有 `--limit` 和目标预览。\n\nPatterns 的完整语法与处理顺序见 [官方 Patterns 指南](https://docs.ansible.com/projects/ansible/latest/inventory_guide/intro_patterns.html)。", "subs": ["hosts 和", "使用切片与主机列表时明确风险", "常见陷阱"]}]}, {"title": "第三章 · 使用 Ad-Hoc 命令与模块完成一次性任务", "sections": [{"title": "用 Ad-Hoc 命令执行批量运维操作", "content": "Ad-Hoc 命令是在命令行中直接调用一个模块，适合一次性检查、紧急操作和小范围变更。需要反复执行、需要评审或包含多个步骤的工作，应写成 Playbook 并纳入版本控制。\n\n```text\nansible <pattern> -i <inventory> -m <module> -a '<arguments>' [options]\n```\n\n```bash\nansible webservers -i inventory.yml \\\n  -m ansible.builtin.ping\n```\n\n```mermaid\ngraph TD\n    Q{任务是否需要复用或审计}\n    Q -->|否| A[Ad-Hoc command]\n    Q -->|是| P[Playbook]\n    A --> C{是否改变状态}\n    C -->|否| R[先做只读检查]\n    C -->|是| S[限制目标并确认参数]\n    S --> E[执行并检查返回值]\n```\n\n#### 控制并发和提权\n\n```bash\n# 每批最多并发处理 10 台主机\nansible webservers -i inventory.yml -f 10 \\\n  -m ansible.builtin.ping\n\n# 使用 become 执行需要权限的命令\nansible webservers -i inventory.yml -f 5 -b \\\n  -m ansible.builtin.command \\\n  -a 'systemctl status nginx'\n```\n\n提高 `forks` 不会自动提高安全性或总吞吐。包仓库、数据库、负载均衡器和控制节点都可能成为瓶颈。批量变更先在小组或单台 canary 上验证，再逐步扩大。\n\n#### `command`、`shell` 与 `raw` 的区别\n\n| 模块 | 是否经过 Shell | 典型用途 | 风险 |\n| --- | --- | --- | --- |\n| `ansible.builtin.command` | 否 | 运行普通可执行程序 | 不支持管道、重定向和 Shell 变量 |\n| `ansible.builtin.shell` | 是 | 确实需要管道或重定向 | 引号、注入和幂等性风险更高 |\n| `ansible.builtin.raw` | 直接通过连接执行 | 引导无 Python 主机、网络设备特殊命令 | 返回结构少，通常不幂等 |\n\n```bash\n# command 不展开远端 Shell 变量\nansible linux -i inventory.yml \\\n  -m ansible.builtin.command -a 'id'\n\n# 仅在需要 Shell 语义时使用 shell\nansible linux -i inventory.yml \\\n  -m ansible.builtin.shell -a 'set -o pipefail && journalctl -u nginx | tail -20'\n\n# 为极简 Linux 主机引导 Python\nansible bootstrap -i inventory.yml -b \\\n  -m ansible.builtin.raw -a 'apt-get update && apt-get install -y python3'\n```\n\nShell 参数用单引号包围，可避免本地 Shell 提前展开 `$TERM` 等变量，但这并不能消除远端命令注入风险。\n\n#### 用声明式模块管理目标状态\n\n复制文件：\n\n```bash\nansible webservers -i inventory.yml -b \\\n  -m ansible.builtin.copy \\\n  -a 'src=files/motd dest=/etc/motd owner=root group=root mode=0644 backup=true'\n```\n\n创建目录：\n\n```bash\nansible webservers -i inventory.yml -b \\\n  -m ansible.builtin.file \\\n  -a 'path=/srv/example state=directory owner=www-data group=www-data mode=0755'\n```\n\n安装软件包：\n\n```bash\nansible webservers -i inventory.yml -b \\\n  -m ansible.builtin.package \\\n  -a 'name=nginx state=present'\n```\n\n启动服务：\n\n```bash\nansible webservers -i inventory.yml -b \\\n  -m ansible.builtin.service \\\n  -a 'name=nginx state=started enabled=true'\n```\n\n通用 `package` 和 `service` 模块便于跨发行版，但平台专用模块通常暴露更多能力。选择前先查看模块文档和支持属性。\n\n#### 管理账号、代码与文件生命周期\n\nAd-Hoc 不只适合 ping。原课程中的账号、Git 和文件操作仍然重要，但应使用声明式模块并限制目标：\n\n```bash\n# 创建服务组和不可交互的服务账号\nansible 'webservers:&staging' -i inventories/staging -b \\\n  -m ansible.builtin.group -a 'name=example-app state=present system=true'\nansible 'webservers:&staging' -i inventories/staging -b \\\n  -m ansible.builtin.user \\\n  -a 'name=example-app group=example-app shell=/usr/sbin/nologin create_home=false system=true state=present'\n\n# 检出明确版本，避免部署漂移的默认分支\nansible 'webservers:&staging' -i inventories/staging -b \\\n  -m ansible.builtin.git \\\n  -a 'repo=https://git.example/app.git dest=/srv/example/releases/1.4.2 version=v1.4.2 update=true'\n\n# 删除前先用 stat 或 check mode 确认目标，state=absent 无法自动恢复数据\nansible 'webservers:&staging' -i inventories/staging -b \\\n  -m ansible.builtin.file -a 'path=/srv/example/tmp/obsolete state=absent'\n```\n\n文件权限的 YAML 与命令行参数都建议写成字符串形式，如 `mode=0640`；删除、改所有者和递归权限操作要先验证路径是否由变量安全生成。Git 检出还涉及代码来源认证、提交签名和构建产物一致性；正式部署通常应交给可审查的 Playbook，而不是长期依赖 Ad-Hoc。\n\n#### 在命令行启动并收集后台任务\n\nAd-Hoc 也支持异步上限与轮询间隔：\n\n```bash\n# 最多运行 30 分钟，每 15 秒轮询\nansible batch_workers -i inventory.yml \\\n  -B 1800 -P 15 \\\n  -m ansible.builtin.command -a '/opt/app/bin/rebuild-index'\n\n# -P 0 表示只启动，输出中要保存 ansible_job_id\nansible batch_workers -i inventory.yml \\\n  -B 1800 -P 0 \\\n  -m ansible.builtin.command -a '/opt/app/bin/rebuild-index'\n\n# 使用返回的 job id 查询结果\nansible batch_workers -i inventory.yml \\\n  -m ansible.builtin.async_status -a 'jid=<ansible_job_id>'\n```\n\n后台启动不等于任务成功。必须保存 job id、轮询最终状态并处理超时后的远端进程。包管理器等有全局锁的操作不应为了“更快”而无边界并发。\n\n#### 收集 Facts 与快速诊断\n\n```bash\n# 收集完整 Facts\nansible linux -i inventory.yml -m ansible.builtin.setup\n\n# 只查看网络相关 Facts\nansible linux -i inventory.yml \\\n  -m ansible.builtin.setup \\\n  -a 'filter=ansible_default_ipv4'\n\n# 查看磁盘空间但不改变状态\nansible linux -i inventory.yml \\\n  -m ansible.builtin.command -a 'df -h'\n```\n\nFacts 可能包含网络、硬件和系统细节。不要在公开日志中无筛选地输出敏感主机信息。\n\n#### Ad-Hoc 安全执行清单\n\n1. 用 `ansible-inventory --graph` 确认清单来源；\n2. 用精确 Pattern 与 `--limit` 收窄目标；\n3. 先执行 `ping` 或只读命令；\n4. 查阅 `ansible-doc` 确认参数和 check mode 支持；\n5. 对变更操作先在 canary 主机验证；\n6. 检查 `changed`、`failed`、`rc`、`stderr` 等返回字段；\n7. 可复用的命令立即沉淀为 Playbook。", "subs": ["控制并发和提权", "command、shell 与 raw 的区别", "用声明式模块管理目标状态", "管理账号、代码与文件生命周期", "在命令行启动并收集后台任务", "收集 Facts 与快速诊断", "Ad-Hoc 安全执行清单"]}, {"title": "理解模块如何承载 Ansible 的实际操作", "content": "模块是 Ansible 的工作单元。Ad-Hoc 命令调用一个模块；Playbook 中的每个 Task 通常也调用一个模块。连接插件负责“怎么到达目标”，模块负责“到达后做什么”。\n\n```mermaid\ngraph LR\n    T[Task or Ad-Hoc] --> A[Action plugin]\n    A --> C[Connection plugin]\n    C --> M[Module on target]\n    M --> J[JSON result]\n    J --> R[Result processing]\n```\n\n#### 优先描述状态而不是拼接命令\n\n下面的命令式写法每次都会执行：\n\n```yaml\n- name: 创建应用目录\n  ansible.builtin.command: mkdir -p /srv/app\n```\n\n声明式模块可以检查当前状态，只在必要时变更：\n\n```yaml\n- name: 确保应用目录存在\n  ansible.builtin.file:\n    path: /srv/app\n    state: directory\n    owner: app\n    group: app\n    mode: '0750'\n```\n\n幂等性意味着重复执行在目标已满足时通常返回 `changed: false`，但不是所有模块和所有参数都天然幂等。`command`、`shell`、第三方 API 和外部脚本尤其需要审查。\n\n#### 使用 `ansible-doc` 作为本地权威入口\n\n```bash\n# 阅读模块文档\nansible-doc ansible.builtin.file\n\n# 查看模块片段\nansible-doc -s ansible.builtin.file\n\n# 列出模块\nansible-doc -t module -l\n\n# 阅读 Inventory Plugin\nansible-doc -t inventory amazon.aws.aws_ec2\n```\n\n模块文档会说明参数、返回值、平台、check mode、diff mode 和示例。它与本机实际安装版本一致，比搜索到其他版本的网页更可靠。\n\n#### 在 YAML 中使用完全限定集合名称\n\n```yaml\n- name: 确保 Nginx 已启动\n  ansible.builtin.service:\n    name: nginx\n    state: started\n    enabled: true\n```\n\n`ansible.builtin.service` 是 FQCN，格式为 `<namespace>.<collection>.<content>`。它能避免同名模块冲突，并让读者直接知道依赖来自核心还是外部 Collection。", "subs": ["优先描述状态而不是拼接命令", "使用 ansible", "在 YAML 中使用完全限定集合名称"]}, {"title": "辨析核心模块与额外模块的历史分类", "content": "旧版 Ansible 把模块分成 `ansible-modules-core` 和 `ansible-modules-extras` 两个仓库。这个分类已经被 Collections 架构替代，不应继续用“核心模块比额外模块更受支持”判断现代依赖。\n\n| 历史模型 | 当前模型 |\n| --- | --- |\n| `ansible-modules-core` | `ansible-core` 中的 `ansible.builtin` |\n| `ansible-modules-extras` | 各 namespace 下独立发布的 Collections |\n| 随 Ansible 单体版本升级 | Collection 可独立安装和固定版本 |\n| 依据 core/extras 判断来源 | 依据 FQCN、维护者、版本和支持状态判断 |\n\n声明依赖：\n\n```yaml\ncollections:\n  # 首次验证后在实际项目中补充明确的 version 约束\n  - name: ansible.posix\n  - name: community.general\n```\n\n```bash\nansible-galaxy collection install -r requirements.yml\nansible-galaxy collection list\n```\n\n选择外部 Collection 时检查：\n\n- 是否仍在维护，发布日期是否合理；\n- 支持哪些 `ansible-core` 版本；\n- 模块是否支持 check mode、diff mode 和幂等操作；\n- 依赖的 Python SDK 与系统库；\n- 变更日志和破坏性升级；\n- 团队是否固定版本并在隔离环境验证。", "subs": ["是否仍在维护", "支持哪些 ansible", "模块是否支持 check mode、diff mode 和幂等操作", "依赖的 Python SDK 与系统库", "变更日志和破坏性升级", "团队是否固定版本并在隔离环境验证"]}, {"title": "读取模块的通用返回值与 Facts", "content": "模块返回结构化数据。Ad-Hoc 命令会直接显示它；Playbook 可以使用 `register` 保存结果，再用于判断、输出和后续任务。\n\n```yaml\n- name: 查询服务状态\n  ansible.builtin.command:\n    argv:\n      - systemctl\n      - is-active\n      - nginx\n  register: nginx_status\n  changed_when: false\n  failed_when: nginx_status.rc not in [0, 3]\n\n- name: 展示标准输出\n  ansible.builtin.debug:\n    var: nginx_status.stdout_lines\n```\n\n#### 常见返回字段\n\n| 字段 | 含义 | 使用提示 |\n| --- | --- | --- |\n| `changed` | 模块是否改变目标 | 不是成功与否的同义词 |\n| `failed` | 任务是否失败 | 可由模块或 `failed_when` 决定 |\n| `skipped` | 任务是否被跳过 | 常见于条件或 check mode |\n| `msg` | 面向用户的说明 | 失败排障首先阅读 |\n| `rc` | 命令返回码 | 常见于 command、shell、raw |\n| `stdout` / `stderr` | 标准输出与错误 | 注意可能含敏感数据 |\n| `stdout_lines` / `stderr_lines` | 按行拆分的输出 | 便于循环或展示 |\n| `results` | 循环中每一项的结果 | 需要逐项判断失败和变更 |\n| `diff` | 变更前后差异 | 需要模块与运行模式支持 |\n| `backup_file` | 备份文件路径 | 模块启用备份时出现 |\n| `ansible_facts` | 写入主机 Facts 的字典 | 部分内部字段会被 Ansible 消费 |\n\n#### 不要只解析人类可读输出\n\n自动化逻辑应优先读取返回字段，而不是对终端彩色文本做字符串匹配。需要观察详细返回时可提高 verbosity：\n\n```bash\nansible web01 -i inventory.yml \\\n  -m ansible.builtin.command -a 'id' -vvv\n```\n\n但 `-vvv` 可能暴露连接细节，日志共享前需要脱敏。\n\n#### Facts 与注册变量的生命周期不同\n\n- `register` 保存当前任务对当前主机的返回结果；\n- `ansible_facts` 会合入当前主机的 Facts；\n- facts cache 可以跨执行保存部分 Facts，但需要明确缓存后端和有效期；\n- `set_fact` 创建的变量不等同于长期资产数据库；\n- 主机之间读取 `hostvars` 时，要确认目标主机的数据已经被收集。\n\n完整字段以模块自身 `RETURN` 文档和 [官方通用返回值](https://docs.ansible.com/projects/ansible/latest/reference_appendices/common_return_values.html) 为准。\n\n#### 第一册学习闭环\n\n完成本册后，应能执行以下最小闭环：\n\n1. 在隔离环境安装并固定 Ansible；\n2. 创建静态或动态 Inventory；\n3. 用 `ansible-inventory` 验证主机、组和变量；\n4. 用 Patterns 与 `--limit` 精确圈定目标；\n5. 用 `ping` 验证 Linux 或 Windows 执行链路；\n6. 用 FQCN 调用幂等模块完成小型任务；\n7. 读取结构化返回值判断成功、失败和变更；\n8. 把需要复用和审计的操作迁移到第二册的 Playbook。", "subs": ["常见返回字段", "不要只解析人类可读输出", "Facts 与注册变量的生命周期不同", "第一册学习闭环"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
