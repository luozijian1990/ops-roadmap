  mermaid.initialize({startOnLoad:false, theme:'base', themeVariables:{

<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

<script id="data" type="application/json">{"title": "Jenkins 学习笔记", "intro": "> 本文档是 Jenkins 系统化学习笔记，涵盖安装配置、Pipeline 使用和常用插件详解。\n\n---", "parts": [{"title": "📖 文档说明", "sections": [{"title": "概述", "content": "**目标读者**: Jenkins 初学者和运维工程师\n**内容特点**: 系统化、实践导向、包含图示说明\n**学习路径**: 从安装配置到高级特性，循序渐进\n\n---", "subs": []}]}, {"title": "第一章：Jenkins 安装与配置", "sections": [{"title": "1.1 Docker 环境安装", "content": "#### 1.1.1 Docker 部署 Jenkins 的优势\n\n使用 Docker 部署 Jenkins 具有以下优势：\n\n- **环境隔离**：容器化部署避免依赖冲突\n- **快速部署**：几分钟内即可启动 Jenkins 实例\n- **易于迁移**：可以在不同环境间快速迁移\n- **版本管理**：通过镜像标签控制 Jenkins 版本\n- **资源控制**：可以限制容器的资源使用\n\n#### 1.1.2 官方镜像介绍\n\nJenkins 提供多种官方 Docker 镜像：\n\n| 镜像类型                      | 说明         | 适用场景       |\n| ----------------------------- | ------------ | -------------- |\n| `jenkins/jenkins:lts`       | 长期支持版本 | 生产环境推荐   |\n| `jenkins/jenkins:latest`    | 最新版本     | 测试新特性     |\n| `jenkins/jenkins:lts-jdk21` | LTS + JDK21  | 指定 Java 版本 |\n\n> **注意**: 官方镜像不包含 Docker CLI 和 Blue Ocean 插件，需要自定义构建。\n\n#### 1.1.3 macOS/Linux 安装步骤\n\n##### 步骤 1: 创建 Docker 网络\n\n```bash\ndocker network create jenkins\n```\n\n##### 步骤 2: 运行 Docker-in-Docker (DinD) 容器\n\n```bash\ndocker run \\\n  --name jenkins-docker \\\n  --rm \\\n  --detach \\\n  --privileged \\\n  --network jenkins \\\n  --network-alias docker \\\n  --env DOCKER_TLS_CERTDIR=/certs \\\n  --volume jenkins-docker-certs:/certs/client \\\n  --volume jenkins-data:/var/jenkins_home \\\n  --publish 2376:2376 \\\n  docker:dind \\\n  --storage-driver overlay2\n```\n\n**参数说明**：\n\n- `--privileged`: 特权模式（DinD 需要）\n- `--volume jenkins-docker-certs:/certs/client`: 挂载证书卷\n- `--volume jenkins-data:/var/jenkins_home`: 持久化 Jenkins 数据\n\n##### 步骤 3: 自定义 Jenkins 镜像\n\n创建 `Dockerfile`:\n\n```dockerfile\nFROM jenkins/jenkins:2.528.2-jdk21\nUSER root\nRUN apt-get update && apt-get install -y docker-ce-cli\nUSER jenkins\nRUN jenkins-plugin-cli --plugins \"blueocean docker-workflow\"\n```\n\n##### 步骤 4: 构建并运行\n\n```bash\ndocker build -t myjenkins-blueocean:2.528.2-1 .\n\ndocker run \\\n  --name jenkins-blueocean \\\n  --restart=on-failure \\\n  --detach \\\n  --network jenkins \\\n  --env DOCKER_HOST=tcp://docker:2376 \\\n  --publish 8080:8080 \\\n  --publish 50000:50000 \\\n  --volume jenkins-data:/var/jenkins_home \\\n  myjenkins-blueocean:2.528.2-1\n```\n\n#### 1.1.4 访问 Jenkins 容器\n\n```bash\n# 访问容器终端\ndocker exec -it jenkins-blueocean bash\n\n# 查看日志\ndocker logs -f jenkins-blueocean\n\n# 获取初始密码\ndocker exec jenkins-blueocean cat /var/jenkins_home/secrets/initialAdminPassword\n```\n\n#### 1.1.5 数据持久化方案\n\n**方案1: Docker Volume（推荐）**\n\n```bash\ndocker volume create jenkins-data\n--volume jenkins-data:/var/jenkins_home\n```\n\n**方案2: 本地目录挂载**\n\n```bash\n--volume $HOME/jenkins:/var/jenkins_home\n```\n\n#### 1.1.6 最佳实践\n\n1. **使用特定版本标签** - 避免使用 `:latest`\n2. **定期备份数据卷**\n3. **设置资源限制**: `--memory=\"2g\" --cpus=\"2.0\"`\n4. **使用 Docker Compose 管理**（推荐生产环境）\n\n---", "subs": ["1.1.1 Docker 部署 Jenkins 的优势", "1.1.2 官方镜像介绍", "1.1.3 macOS/Linux 安装步骤", "1.1.4 访问 Jenkins 容器", "1.1.5 数据持久化方案", "1.1.6 最佳实践"]}, {"title": "1.2 Kubernetes 环境安装", "content": "#### 1.2.1 Kubernetes 部署架构\n\n在 Kubernetes 上部署 Jenkins 提供了更好的可扩展性和资源管理能力。\n\n```mermaid\ngraph TD\n    A[Kubernetes集群] --> B[Jenkins Master Pod]\n    B --> C[PersistentVolume 数据持久化]\n    B --> D[Service NodePort/LoadBalancer]\n    B --> E[动态 Jenkins Agent Pods]\n    E --> F[构建任务1]\n    E --> G[构建任务2]\n    E --> H[构建任务3]\n```\n\n#### 1.2.2 基础部署方式\n\n##### 步骤 1: 创建命名空间\n\n```bash\nkubectl create namespace devops-tools\n```\n\n##### 步骤 2: 创建 ServiceAccount\n\n文件: `jenkins-serviceaccount.yaml`\n\n```yaml\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: jenkins-admin\nrules:\n  - apiGroups: [\"\"]\n    resources: [\"*\"]\n    verbs: [\"*\"]\n---\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: jenkins-admin\n  namespace: devops-tools\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n  name: jenkins-admin\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: jenkins-admin\nsubjects:\n- kind: ServiceAccount\n  name: jenkins-admin\n  namespace: devops-tools\n```\n\n应用配置:\n\n```bash\nkubectl apply -f jenkins-serviceaccount.yaml\n```\n\n##### 步骤 3: 创建持久化卷\n\n文件: `jenkins-volume.yaml`\n\n```yaml\nkind: StorageClass\napiVersion: storage.k8s.io/v1\nmetadata:\n  name: local-storage\nprovisioner: kubernetes.io/no-provisioner\nvolumeBindingMode: WaitForFirstConsumer\n---\napiVersion: v1\nkind: PersistentVolume\nmetadata:\n  name: jenkins-pv-volume\n  labels:\n    type: local\nspec:\n  storageClassName: local-storage\n  claimRef:\n    name: jenkins-pv-claim\n    namespace: devops-tools\n  capacity:\n    storage: 10Gi\n  accessModes:\n    - ReadWriteOnce\n  local:\n    path: /mnt\n  nodeAffinity:\n    required:\n      nodeSelectorTerms:\n      - matchExpressions:\n        - key: kubernetes.io/hostname\n          operator: In\n          values:\n          - worker-node01  # 替换为实际节点名\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: jenkins-pv-claim\n  namespace: devops-tools\nspec:\n  storageClassName: local-storage\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: 3Gi\n```\n\n> **生产环境建议**: 使用云提供商的存储类（如 AWS EBS、GCE PD）以保证数据持久性。\n\n应用配置:\n\n```bash\nkubectl create -f jenkins-volume.yaml\n```\n\n##### 步骤 4: 创建 Deployment\n\n文件: `jenkins-deployment.yaml`\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: jenkins\n  namespace: devops-tools\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: jenkins-server\n  strategy:\n    type: Recreate\n  template:\n    metadata:\n      labels:\n        app: jenkins-server\n    spec:\n      securityContext:\n        fsGroup: 1000\n        runAsUser: 1000\n      serviceAccountName: jenkins-admin\n      containers:\n        - name: jenkins\n          image: jenkins/jenkins:lts\n          imagePullPolicy: Always\n          resources:\n            limits:\n              memory: \"2Gi\"\n              cpu: \"1000m\"\n            requests:\n              memory: \"500Mi\"\n              cpu: \"500m\"\n          ports:\n            - name: httpport\n              containerPort: 8080\n            - name: jnlpport\n              containerPort: 50000\n          livenessProbe:\n            httpGet:\n              path: \"/login\"\n              port: 8080\n            initialDelaySeconds: 90\n            periodSeconds: 10\n            timeoutSeconds: 5\n            failureThreshold: 5\n          readinessProbe:\n            httpGet:\n              path: \"/login\"\n              port: 8080\n            initialDelaySeconds: 60\n            periodSeconds: 10\n            timeoutSeconds: 5\n            failureThreshold: 3\n          volumeMounts:\n            - name: jenkins-data\n              mountPath: /var/jenkins_home\n      volumes:\n        - name: jenkins-data\n          persistentVolumeClaim:\n              claimName: jenkins-pv-claim\n```\n\n应用配置:\n\n```bash\nkubectl apply -f jenkins-deployment.yaml\n```\n\n##### 步骤 5: 创建 Service\n\n文件: `jenkins-service.yaml`\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: jenkins-service\n  namespace: devops-tools\n  annotations:\n      prometheus.io/scrape: 'true'\n      prometheus.io/path:   /\n      prometheus.io/port:   '8080'\nspec:\n  selector:\n    app: jenkins-server\n  type: NodePort\n  ports:\n    - port: 8080\n      targetPort: 8080\n      nodePort: 32000\n```\n\n应用配置:\n\n```bash\nkubectl apply -f jenkins-service.yaml\n```\n\n访问 Jenkins:\n\n```bash\n# 获取节点IP\nkubectl get nodes -o wide\n\n# 访问地址\nhttp://<node-ip>:32000\n```\n\n#### 1.2.3 使用 Helm 安装（推荐）\n\n##### 步骤 1: 添加 Jenkins Helm 仓库\n\n```bash\nhelm repo add jenkinsci https://charts.jenkins.io\nhelm repo update\n```\n\n##### 步骤 2: 创建 values 配置文件\n\n文件: `jenkins-values.yaml`\n\n```yaml\ncontroller:\n  serviceType: NodePort\n  nodePort: 32000\n  installPlugins:\n    - kubernetes:4389.v3e60b_3e4c6b_3\n    - workflow-aggregator:657.v7539b_b_25a_61f\n    - git:5.6.0\n    - configuration-as-code:1890.v88e1e8dcbfa_c\n  \npersistence:\n    enabled: true\n    storageClass: \"jenkins-pv\"\n    size: \"10Gi\"\n\nserviceAccount:\n  create: false\n  name: jenkins\n\nresources:\n  limits:\n    cpu: \"2000m\"\n    memory: \"4Gi\"\n  requests:\n    cpu: \"500m\"\n    memory: \"1Gi\"\n```\n\n##### 步骤 3: 安装 Jenkins\n\n```bash\nhelm install jenkins jenkinsci/jenkins \\\n  -n devops-tools \\\n  -f jenkins-values.yaml\n```\n\n##### 步骤 4: 获取管理员密码\n\n```bash\njsonpath=\"{.data.jenkins-admin-password}\"\nsecret=$(kubectl get secret -n devops-tools jenkins -o jsonpath=$jsonpath)\necho $(echo $secret | base64 --decode)\n```\n\n#### 1.2.4 配置动态 Agent\n\nJenkins Kubernetes Plugin 允许动态创建Agent Pod：\n\n```groovy\npipeline {\n    agent {\n        kubernetes {\n            yaml '''\napiVersion: v1\nkind: Pod\nmetadata:\n  labels:\n    jenkins: agent\nspec:\n  containers:\n  - name: maven\n    image: maven:3.8.1-jdk-11\n    command:\n    - sleep\n    args:\n    - 99d\n'''\n        }\n    }\n    stages {\n        stage('Build') {\n            steps {\n                container('maven') {\n                    sh 'mvn --version'\n                }\n            }\n        }\n    }\n}\n```\n\n#### 1.2.5 高可用配置建议\n\n1. **使用 StatefulSet** - 保证 Pod 名称稳定\n2. **配置持久化存储** - 使用云存储类\n3. **设置资源限制和请求**\n4. **配置健康检查** - Liveness 和 Readiness Probes\n5. **使用 HPA** - 水平自动扩缩容（仅适用于无状态组件）\n\n---", "subs": ["1.2.1 Kubernetes 部署架构", "1.2.2 基础部署方式", "1.2.3 使用 Helm 安装（推荐）", "1.2.4 配置动态 Agent", "1.2.5 高可用配置建议"]}, {"title": "1.3 Linux 环境安装", "content": "#### 1.3.1 系统要求\n\n- **操作系统**: Debian/Ubuntu, RHEL/CentOS, Fedora\n- **Java版本**: OpenJDK 21 或兼容版本\n- **硬件**: 最小 256MB RAM, 推荐 4GB+ RAM\n- **磁盘**: 最小 1GB，推荐 50GB+\n\n#### 1.3.2 Debian/Ubuntu 安装\n\n##### 步骤 1: 安装 Java\n\n```bash\nsudo apt update\nsudo apt install fontconfig openjdk-21-jre\njava -version\n```\n\n输出示例:\n\n```\nopenjdk 21.0.8 2025-07-15\nOpenJDK Runtime Environment (build 21.0.8+9-Debian-1)\n```\n\n> **重要**: 必须先安装 Java，否则 Jenkins 服务可能无法启动。\n\n##### 步骤 2: 添加 Jenkins 仓库\n\n**LTS 版本（推荐）**:\n\n```bash\nsudo wget -O /etc/apt/keyrings/jenkins-keyring.asc \\\n  https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key\necho \"deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc]\" \\\n  https://pkg.jenkins.io/debian-stable binary/ | sudo tee \\\n  /etc/apt/sources.list.d/jenkins.list > /dev/null\n```\n\n**Weekly 版本**:\n\n```bash\nsudo wget -O /etc/apt/keyrings/jenkins-keyring.asc \\\n  https://pkg.jenkins.io/debian/jenkins.io-2023.key\necho \"deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc]\" \\\n  https://pkg.jenkins.io/debian binary/ | sudo tee \\\n  /etc/apt/sources.list.d/jenkins.list > /dev/null\n```\n\n##### 步骤 3: 安装 Jenkins\n\n```bash\nsudo apt update\nsudo apt install jenkins\n```\n\n安装过程会自动：\n\n- 创建 `jenkins` 用户和用户组\n- 配置 systemd 服务\n- 设置 `/var/lib/jenkins` 为 JENKINS_HOME\n- 配置Jenkins监听8080端口\n\n#### 1.3.3 RHEL/CentOS 安装\n\n##### 使用 yum (RHEL/CentOS 7)\n\n```bash\n# 添加仓库\nsudo wget -O /etc/yum.repos.d/jenkins.repo \\\n    https://pkg.jenkins.io/redhat-stable/jenkins.repo\nsudo rpm --import https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key\n\n# 安装依赖和Jenkins\nsudo yum upgrade\nsudo yum install fontconfig java-21-openjdk\nsudo yum install jenkins\nsudo systemctl daemon-reload\n```\n\n##### 使用 dnf (Fedora/RHEL 8+)\n\n```bash\nsudo wget -O /etc/yum.repos.d/jenkins.repo \\\n    https://pkg.jenkins.io/redhat-stable/jenkins.repo\nsudo rpm --import https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key\nsudo dnf upgrade\nsudo dnf install fontconfig java-21-openjdk\nsudo dnf install jenkins\nsudo systemctl daemon-reload\n```\n\n#### 1.3.4 启动和管理 Jenkins 服务\n\n##### 启用开机自启\n\n```bash\nsudo systemctl enable jenkins\n```\n\n##### 启动服务\n\n```bash\nsudo systemctl start jenkins\n```\n\n##### 检查状态\n\n```bash\nsudo systemctl status jenkins\n```\n\n正常输出:\n\n```\n● jenkins.service - Jenkins Continuous Integration Server\n   Loaded: loaded (/lib/systemd/system/jenkins.service; enabled)\n   Active: active (running) since Tue 2024-12-04 16:19:01 CST\n```\n\n##### 重启服务\n\n```bash\nsudo systemctl restart jenkins\n```\n\n##### 停止服务\n\n```bash\nsudo systemctl stop jenkins\n```\n\n##### 查看日志\n\n```bash\n# 查看实时日志\nsudo journalctl -u jenkins.service -f\n\n# 查看所有日志\nsudo journalctl -u jenkins.service\n\n# 查看最近100行\nsudo journalctl -u jenkins.service -n 100\n```\n\n#### 1.3.5 修改端口配置\n\n如果8080端口被占用，需要修改端口：\n\n```bash\nsudo systemctl edit jenkins\n```\n\n添加以下内容:\n\n```ini\n[Service]\nEnvironment=\"JENKINS_PORT=8081\"\n```\n\n重启服务:\n\n```bash\nsudo systemctl restart jenkins\n```\n\n#### 1.3.6 防火墙配置\n\n##### firewalld 配置\n\n```bash\nYOURPORT=8080\nPERM=\"--permanent\"\nSERV=\"$PERM --service=jenkins\"\n\nfirewall-cmd $PERM --new-service=jenkins\nfirewall-cmd $SERV --set-short=\"Jenkins ports\"\nfirewall-cmd $SERV --set-description=\"Jenkins port exceptions\"\nfirewall-cmd $SERV --add-port=$YOURPORT/tcp\nfirewall-cmd $PERM --add-service=jenkins\nfirewall-cmd --zone=public --add-service=http --permanent\nfirewall-cmd --reload\n```\n\n##### ufw 配置 (Ubuntu)\n\n```bash\nsudo ufw allow 8080/tcp\nsudo ufw reload\n```\n\n#### 1.3.7 文件位置说明\n\n| 路径                                    | 说明                      |\n| --------------------------------------- | ------------------------- |\n| `/var/lib/jenkins`                    | JENKINS_HOME 目录         |\n| `/etc/default/jenkins`                | 配置文件（Debian/Ubuntu） |\n| `/etc/sysconfig/jenkins`              | 配置文件（RHEL/CentOS）   |\n| `/lib/systemd/system/jenkins.service` | systemd 服务文件          |\n| `/var/log/jenkins/jenkins.log`        | 日志文件                  |\n\n#### 1.3.8 常见问题\n\n##### 问题1: 端口已被占用\n\n```bash\n# 查看端口占用\nsudo netstat -tulpn | grep 8080\n# 或\nsudo lsof -i :8080\n```\n\n##### 问题2: Java 未找到\n\n```bash\n# 设置 JAVA_HOME\necho 'export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64' | sudo tee -a /etc/profile\nsource /etc/profile\n```\n\n##### 问题3: 权限问题\n\n```bash\n# 修复权限\nsudo chown -R jenkins:jenkins /var/lib/jenkins\n```\n\n---", "subs": ["1.3.1 系统要求", "1.3.2 Debian/Ubuntu 安装", "1.3.3 RHEL/CentOS 安装", "1.3.4 启动和管理 Jenkins 服务", "1.3.5 修改端口配置", "1.3.6 防火墙配置", "1.3.7 文件位置说明", "1.3.8 常见问题"]}, {"title": "1.4 初始化配置", "content": "安装完成后，需要进行初始化配置才能开始使用 Jenkins。\n\n#### 1.4.1 解锁 Jenkins\n\n##### 访问 Web 界面\n\n打开浏览器访问:\n\n```\nhttp://localhost:8080\n```\n\n或者（如果是远程服务器）:\n\n```\nhttp://<server-ip>:8080\n```\n\n##### 获取初始密码\n\n**方法1: 查看文件**\n\n```bash\nsudo cat /var/lib/jenkins/secrets/initialAdminPassword\n```\n\n**方法2: 查看日志**\n\n```bash\nsudo journalctl -u jenkins.service | grep -A 5 \"初始密码\"\n```\n\n**方法3: Docker环境**\n\n```bash\ndocker exec jenkins-blueocean cat /var/jenkins_home/secrets/initialAdminPassword\n```\n\n**方法4: Kubernetes环境**\n\n```bash\nkubectl exec -it deployment/jenkins -n devops-tools -- \\\n  cat /var/jenkins_home/secrets/initialAdminPassword\n```\n\n将密码粘贴到 Web 界面即可解锁。\n\n#### 1.4.2 安装插件\n\n解锁后会看到插件安装选项：\n\n##### 选项1: 安装推荐插件（推荐新手）\n\n包含常用插件：\n\n- Git\n- Pipeline\n- Credentials\n- SSH Agents\n- Blue Ocean (如果选择)\n\n##### 选项2: 选择插件安装（推荐熟练用户）\n\n可以自定义选择需要的插件。\n\n**推荐安装的插件**:\n\n- **源码管理**: Git, GitHub, GitLab\n- **构建工具**: Maven, Gradle, NodeJS\n- **容器**: Docker, Kubernetes\n- **通知**: Email Extension, Slack\n- **安全**: LDAP, Role-based Authorization\n\n插件安装过程可能需要几分钟。\n\n#### 1.4.3 创建管理员用户\n\n##### 填写用户信息\n\n- **用户名**: admin（或自定义）\n- **密码**: 设置强密码\n- **全名**: 管理员姓名\n- **电子邮件**: 管理员邮箱\n\n> **提示**: 如果跳过此步骤，默认用户名为 `admin`，密码为初始密码。\n\n#### 1.4.4 配置 Jenkins URL\n\n设置 Jenkins 访问地址，用于：\n\n- 生成邮件通知链接\n- Configure webhook URLs\n- Agent连接地址\n\n示例:\n\n```\nhttp://jenkins.example.com:8080/\n```\n\n或保持默认的本地地址。\n\n#### 1.4.5 全局工具配置\n\n进入 `Manage Jenkins` > `Global Tool Configuration`:\n\n##### JDK 配置\n\n```\nName: JDK-21\nJAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64\n```\n\n或勾选\"自动安装\"。\n\n##### Maven 配置\n\n```\nName: Maven-3.9\nVersion: 3.9.x\n```\n\n##### Git 配置\n\n通常自动检测系统安装的 Git。\n\n##### Docker 配置\n\n```\nName: Docker\nDocker URL: unix:///var/run/docker.sock\n```\n\n#### 1.4.6 安全配置\n\n##### 启用安全策略\n\n`Manage Jenkins` > `Configure Global Security`:\n\n**授权策略**:\n\n- **Matrix-based security**: 精细权限控制\n- **Role-Based Strategy**: 基于角色（需安装插件）\n- **Project-based**: 基于项目\n\n**访问控制**:\n\n- 禁用匿名访问\n- 启用\"Allow users to sign up\"（可选）\n- 配置CSRF Protection（默认启用）\n\n##### LDAP/AD集成（可选）\n\n如果企业使用LDAP:\n\n```\nServer: ldap://ldap.example.com\nRoot DN: dc=example,dc=com\nUser search base: ou=users\n```\n\n#### 1.4.7 系统配置\n\n`Manage Jenkins` > `Configure System`:\n\n##### Jenkins Location\n\n```\nJenkins URL: http://jenkins.example.com:8080/\nSystem Admin e-mail address: admin@example.com\n```\n\n##### 邮件通知\n\n```\nSMTP server: smtp.example.com\nDefault user e-mail suffix: @example.com\n```\n\n测试邮件配置:\n\n```\nTest e-mail recipient: your-email@example.com\n```\n\n##### 执行器数量\n\n```\n# of executors: 2  # 根据CPU核心数调整\n```\n\n> **建议**: `执行器数量 = CPU核心数 - 1`\n\n##### Quiet period\n\n```\nQuiet period: 5  # 秒，任务触发后的静默期\n```\n\n#### 1.4.8 凭据管理\n\n`Manage Jenkins` > `Manage Credentials`:\n\n##### 添加SSH密钥\n\n```\nKind: SSH Username with private key\nID: github-ssh\nUsername: git\nPrivate Key: [粘贴私钥内容]\n```\n\n##### 添加用户名密码\n\n```\nKind: Username with password\nScope: Global\nUsername: your-username\nPassword: your-password\nID: docker-registry\n```\n\n##### 添加Secret text\n\n```\nKind: Secret text\nSecret: your-api-token\nID: api-token\n```\n\n#### 1.4.9 配置代理（可选）\n\n如果Jenkins服务器需要通过代理访问外网:\n\n`Manage Jenkins` > `Manage Plugins` > `Advanced`:\n\n```\nHTTP Proxy Configuration:\nServer: proxy.example.com\nPort: 8080\nNo Proxy Host: localhost,127.0.0.1,*.internal.com\n```\n\n#### 1.4.10 Jenkins CLI 配置（可选）\n\n下载CLI工具:\n\n```bash\nwget http://localhost:8080/jnlpJars/jenkins-cli.jar\n```\n\n使用示例:\n\n```bash\njava -jar jenkins-cli.jar -s http://localhost:8080/ -auth admin:password help\n```\n\n#### 1.4.11 备份配置\n\n初始配置完成后，建议立即备份:\n\n```bash\n# 备份JENKINS_HOME\nsudo tar -czf jenkins-backup-$(date +%Y%m%d).tar.gz /var/lib/jenkins\n\n# 或使用ThinBackup插件\n```\n\n---", "subs": ["1.4.1 解锁 Jenkins", "1.4.2 安装插件", "1.4.3 创建管理员用户", "1.4.4 配置 Jenkins URL", "1.4.5 全局工具配置", "1.4.6 安全配置", "1.4.7 系统配置", "1.4.8 凭据管理", "1.4.9 配置代理（可选）", "1.4.10 Jenkins CLI 配置（可选）", "1.4.11 备份配置"]}, {"title": "1.5 Jenkins 部署架构图", "content": "#### 1.5.1 部署方式对比\n\n```mermaid\ngraph TD\n    A[Jenkins部署方式选择] --> B[Docker部署]\n    A --> C[Kubernetes部署]\n    A --> D[Linux直接部署]\n  \n    B --> B1[单机Docker]\n    B --> B2[Docker Compose]\n    B --> B3[Docker Swarm]\n  \n    C --> C1[Deployment]\n    C --> C2[StatefulSet]\n    C --> C3[Helm Chart]\n    C --> C4[Operator]\n  \n    D --> D1[单机部署]\n    D --> D2[主从架构]\n  \n    style A fill:#f9f,stroke:#333,stroke-width:4px\n    style C fill:#bbf,stroke:#333,stroke-width:2px\n```\n\n#### 1.5.2 Master-Agent 架构\n\n```mermaid\ngraph TB\n    subgraph \"Jenkins Master\"\n        M[Jenkins Controller]\n        M --> M1[任务调度]\n        M --> M2[配置管理]\n        M --> M3[UI界面]\n    end\n  \n    subgraph \"Static Agents\"\n        A1[Agent 1<br/>Linux]\n        A2[Agent 2<br/>Windows]\n    end\n  \n    subgraph \"Dynamic Agents K8s\"\n        K1[Pod Agent 1]\n        K2[Pod Agent 2]\n        K3[Pod Agent N]\n    end\n  \n    subgraph \"Docker Agents\"\n        D1[Container 1]\n        D2[Container 2]\n    end\n  \n    M --> A1\n    M --> A2\n    M --> K1\n    M --> K2\n    M --> K3\n    M --> D1\n    M --> D2\n  \n    style M fill:#faa,stroke:#333,stroke-width:4px\n    style K1 fill:#afa,stroke:#333,stroke-width:2px\n    style K2 fill:#afa,stroke:#333,stroke-width:2px\n    style K3 fill:#afa,stroke:#333,stroke-width:2px\n```\n\n#### 1.5.3 数据流架构\n\n```mermaid\ngraph LR\n    subgraph \"用户层\"\n        U1[开发人员]\n        U2[运维人员]\n        U3[测试人员]\n    end\n  \n    subgraph \"Jenkins Master\"\n        UI[Web UI]\n        API[REST API]\n        SCH[调度器]\n    end\n  \n    subgraph \"数据存储\"\n        PV[PersistentVolume]\n        DB[(配置数据)]\n        WS[工作空间]\n    end\n  \n    subgraph \"外部集成\"\n        GIT[Git/SVN]\n        REG[Docker Registry]\n        K8S[Kubernetes]\n        NOTIFY[通知服务]\n    end\n  \n    U1 --> UI\n    U2 --> API\n    U3 --> UI\n  \n    UI --> SCH\n    API --> SCH\n  \n    SCH --> PV\n    SCH --> DB\n    SCH --> WS\n  \n    SCH --> GIT\n    SCH --> REG\n    SCH --> K8S\n    SCH --> NOTIFY\n```\n\n#### 1.5.4 高可用架构（推荐生产环境）\n\n```mermaid\ngraph TB\n    subgraph \"负载均衡层\"\n        LB[Load Balancer<br/>Nginx/HAProxy]\n    end\n  \n    subgraph \"Jenkins Controllers\"\n        J1[Jenkins Master 1<br/>Active]\n        J2[Jenkins Master 2<br/>Standby]\n    end\n  \n    subgraph \"共享存储\"\n        NFS[NFS/EFS<br/>JENKINS_HOME]\n    end\n  \n    subgraph \"数据库\"\n        DB[(PostgreSQL<br/>MySQL)]\n    end\n  \n    subgraph \"Agent Pool\"\n        A1[Agent Pool]\n    end\n  \n    LB --> J1\n    LB -.备份.-> J2\n  \n    J1 --> NFS\n    J2 --> NFS\n  \n    J1 --> DB\n    J2 --> DB\n  \n    J1 --> A1\n    J2 -.-> A1\n  \n    style J1 fill:#afa,stroke:#333,stroke-width:2px\n    style J2 fill:#ffa,stroke:#333,stroke-width:2px\n    style NFS fill:#aaf,stroke:#333,stroke-width:2px\n```\n\n#### 1.5.5 部署方式选择建议\n\n| 场景          | 推荐方式          | 理由                 |\n| ------------- | ----------------- | -------------------- |\n| 个人学习/测试 | Docker单机        | 快速、简单、易于清理 |\n| 小团队开发    | Linux直接部署     | 稳定、易维护         |\n| 中型团队      | Kubernetes + Helm | 扩展性好、易管理     |\n| 大型企业      | K8s + 高可用架构  | 高可用、动态扩展     |\n| CI/CD密集型   | K8s + 动态Agent   | 资源利用率高         |\n\n#### 1.5.6 资源规划建议\n\n##### 小型部署（< 10个任务/天）\n\n- **CPU**: 2核\n- **内存**: 4GB\n- **存储**: 20GB\n- **Agent**: 1-2个\n\n##### 中型部署（10-100个任务/天）\n\n- **CPU**: 4核\n- **内存**: 8GB\n- **存储**: 100GB\n- **Agent**: 3-10个\n\n##### 大型部署（> 100个任务/天）\n\n- **CPU**: 8核+\n- **内存**: 16GB+\n- **存储**: 500GB+\n- **Agent**: 10+个（动态扩展）\n\n---\n\n**第一章小结**\n\n本章介绍了 Jenkins 的三种主要安装方式：\n\n- ✅ Docker 部署 - 适合快速部署和测试\n- ✅ Kubernetes 部署 - 适合云原生环境和大规模使用\n- ✅ Linux 部署 - 适合传统服务器环境\n\n完成安装后，进行了初始化配置，包括解锁、插件安装、用户创建、安全配置等关键步骤。\n\n**下一步**: 学习第二章 Jenkins Pipeline 详解\n\n---", "subs": ["1.5.1 部署方式对比", "1.5.2 Master-Agent 架构", "1.5.3 数据流架构", "1.5.4 高可用架构（推荐生产环境）", "1.5.5 部署方式选择建议", "1.5.6 资源规划建议"]}]}, {"title": "第二章：Jenkins Pipeline 详解", "sections": [{"title": "2.1 Pipeline 基础概念", "content": "#### 什么是 Jenkins Pipeline\n\nJenkins Pipeline 是一套插件集合，支持将持续交付流程实现并集成到 Jenkins 中。\n\n**Pipeline 核心优势**：\n\n- ✅ **代码化（Code）**：Pipeline 以代码形式定义，可纳入版本控制\n- ✅ **持久性（Durable）**：Pipeline 可在控制器重启后继续执行\n- ✅ **可暂停（Pausable）**：可等待人工输入或审批\n- ✅ **多功能（Versatile）**：支持复杂的真实 CD 需求\n- ✅ **可扩展（Extensible）**：支持自定义扩展和插件集成\n\n#### 声明式 vs 脚本式 Pipeline\n\n**声明式 Pipeline（推荐）**：\n\n```groovy\npipeline {\n    agent any\n    stages {\n        stage('Build') {\n            steps {\n                echo 'Building..'\n            }\n        }\n    }\n}\n```\n\n**脚本式 Pipeline**：\n\n```groovy\nnode {\n    stage('Build') {\n        echo 'Building..'\n    }\n}\n```\n\n---", "subs": ["什么是 Jenkins Pipeline", "声明式 vs 脚本式 Pipeline"]}, {"title": "2.2 Jenkinsfile 核心要点", "content": "#### 环境变量\n\n**常用系统变量**：\n\n- `BUILD_NUMBER` - 构建编号\n- `JOB_NAME` - 任务名称\n- `WORKSPACE` - 工作空间路径\n- `JENKINS_URL` - Jenkins URL\n\n**使用示例**：\n\n```groovy\necho \"Running build ${env.BUILD_NUMBER}\"\n```\n\n#### 凭据管理最佳实践\n\n```groovy\nenvironment {\n    AWS_KEY = credentials('aws-key-id')\n}\n```\n\n> **重要提示**：始终使用单引号避免 Groovy 插值泄露敏感信息\n\n---", "subs": ["环境变量", "凭据管理最佳实践"]}, {"title": "2.3 Pipeline 中使用 Docker", "content": "#### 基本用法\n\n```groovy\nagent {\n    docker { \n        image 'maven:3.9.9' \n        args '-v $HOME/.m2:/root/.m2'\n    }\n}\n```\n\n#### 多容器支持\n\n```groovy\nstages {\n    stage('Backend') {\n        agent { docker { image 'maven:3.9.9' } }\n        steps { sh 'mvn --version' }\n    }\n    stage('Frontend') {\n        agent { docker { image 'node:20' } }\n        steps { sh 'node --version' }\n    }\n}\n```\n\n---", "subs": ["基本用法", "多容器支持"]}, {"title": "2.4 共享库", "content": "#### 目录结构\n\n```\n(root)\n+- src/              # Groovy 类\n+- vars/             # 全局变量  \n+- resources/        # 资源文件\n```\n\n#### 使用示例\n\n```groovy\n@Library('my-lib') _\n\npipeline {\n    stages {\n        stage('Example') {\n            steps {\n                script {\n                    log.info 'Starting build'\n                }\n            }\n        }\n    }\n}\n```\n\n---", "subs": ["目录结构", "使用示例"]}, {"title": "2.5 Pipeline 高级特性", "content": "#### When 条件\n\n```groovy\nwhen {\n    branch 'production'\n    environment name: 'DEPLOY', value: 'true'\n}\n```\n\n#### Parallel 并行\n\n```groovy\nstage('Tests') {\n    parallel {\n        stage('Unit') {\n            steps { sh 'make unit-test' }\n        }\n        stage('Integration') {\n            steps { sh 'make integration-test' }\n        }\n    }\n}\n```\n\n#### Post 处理\n\n```groovy\npost {\n    always { junit '**/*.xml' }\n    success { echo 'Success!' }\n    failure { mail to: 'team@example.com' }\n}\n```\n\n---", "subs": ["When 条件", "Parallel 并行", "Post 处理"]}, {"title": "2.6 Pipeline 流程图", "content": "#### 基本执行流程\n\n```\nPipeline 开始\n    ↓\n分配 Agent\n    ↓\n设置环境变量\n    ↓\n执行 Stages\n    ↓\nPost 处理\n    ↓\nPipeline 结束\n```\n\n---\n\n**第二章小结**：\n\n- Pipeline 提供了代码化的 CI/CD 解决方案\n- 声明式语法更易读易维护\n- Docker 集成简化了构建环境管理\n- 共享库促进代码复用\n- 高级特性支持复杂的流程控制", "subs": ["基本执行流程"]}, {"title": "2.7 Declarative Pipeline 完整语法", "content": "#### 2.7.1 When 条件详解\n\n##### 内置条件类型\n\n**1. branch** - 分支匹配\n\n```groovy\nwhen { branch 'master' }\nwhen { branch pattern: \"release-\\\\d+\", comparator: \"REGEXP\" }\n```\n\n**2. buildingTag** - 构建标签时执行\n\n```groovy\nwhen { buildingTag() }\n```\n\n**3. changelog** - 变更日志匹配\n\n```groovy\nwhen { changelog '.*^\\\\[DEPENDENCY\\\\] .+$' }\n```\n\n**4. changeset** - 文件变更匹配\n\n```groovy\nwhen { changeset \"**/*.js\" }\nwhen { changeset pattern: \".TEST\\\\.java\", comparator: \"REGEXP\" }\n```\n\n**5. changeRequest** - PR/MR触发\n\n```groovy\nwhen { changeRequest() }\nwhen { changeRequest target: 'master' }\nwhen { changeRequest authorEmail: \"[\\\\w_-.]+@example.com\", comparator: 'REGEXP' }\n```\n\n**6. environment** - 环境变量匹配\n\n```groovy\nwhen { environment name: 'DEPLOY_TO', value: 'production' }\n```\n\n**7. expression** - Groovy 表达式\n\n```groovy\nwhen { expression { return params.DEBUG_BUILD } }\nwhen { expression { BRANCH_NAME ==~ /(production|staging)/ } }\n```\n\n**8. tag** - 标签匹配\n\n```groovy\nwhen { tag \"release-*\" }\nwhen { tag pattern: \"release-\\\\d+\", comparator: \"REGEXP\" }\n```\n\n**9. triggeredBy** - 触发方式\n\n```groovy\nwhen { triggeredBy 'SCMTrigger' }\nwhen { triggeredBy 'TimerTrigger' }\nwhen { triggeredBy 'BuildUpstreamCause' }\nwhen { triggeredBy cause: \"UserIdCause\", detail: \"vlinde\" }\n```\n\n##### 条件组合\n\n**not** - 条件取反\n\n```groovy\nwhen { not { branch 'master' } }\n```\n\n**allOf** - 所有条件都满足（AND）\n\n```groovy\nwhen { \n    allOf { \n        branch 'master'\n        environment name: 'DEPLOY_TO', value: 'production' \n    } \n}\n```\n\n**anyOf** - 任一条件满足（OR）\n\n```groovy\nwhen { \n    anyOf { \n        branch 'master'\n        branch 'staging' \n    } \n}\n```\n\n##### When 条件执行时机控制\n\n**beforeAgent** - 在分配 Agent 之前评估\n\n```groovy\nstage('Deploy') {\n    agent { label \"production-server\" }\n    when {\n        beforeAgent true\n        branch 'production'\n    }\n    steps {\n        echo 'Deploying'\n    }\n}\n```\n\n**beforeInput** - 在 Input 之前评估\n\n```groovy\nwhen {\n    beforeInput true\n    branch 'production'\n}\ninput {\n    message \"Deploy to production?\"\n}\n```\n\n**beforeOptions** - 在 Options 之前评估\n\n```groovy\nwhen {\n    beforeOptions true\n    branch 'testing'\n}\noptions {\n    lock label: 'testing-deploy-envs'\n}\n```\n\n优先级：`beforeOptions` > `beforeInput` > `beforeAgent`\n\n---", "subs": ["2.7.1 When 条件详解"]}, {"title": "2.8 Sequential Stages（顺序嵌套阶段）", "content": "#### 2.8.1 基本用法\n\n```groovy\npipeline {\n    agent none\n    stages {\n        stage('Sequential') {\n            agent { label 'for-sequential' }\n            environment {\n                FOR_SEQUENTIAL = \"some-value\"\n            }\n            stages {\n                stage('In Sequential 1') {\n                    steps {\n                        echo \"In Sequential 1\"\n                    }\n                }\n                stage('In Sequential 2') {\n                    steps {\n                        echo \"In Sequential 2\"\n                    }\n                }\n                stage('Parallel In Sequential') {\n                    parallel {\n                        stage('In Parallel 1') {\n                            steps {\n                                echo \"In Parallel 1\"\n                            }\n                        }\n                        stage('In Parallel 2') {\n                            steps {\n                                echo \"In Parallel 2\"\n                            }\n                        }\n                    }\n                }\n            }\n        }\n    }\n}\n```\n\n**关键点**：\n\n- 嵌套的 stages 会继承父 stage 的 agent 和 environment\n- 可以在嵌套 stages 内部使用 parallel\n- 每个 stage 必须有且仅有一个：steps、stages、parallel 或 matrix\n\n---", "subs": ["2.8.1 基本用法"]}, {"title": "2.9 Parallel（并行执行）", "content": "#### 2.9.1 基本并行\n\n```groovy\nstage('Parallel Stage') {\n    parallel {\n        stage('Branch A') {\n            agent { label \"for-branch-a\" }\n            steps {\n                echo \"On Branch A\"\n            }\n        }\n        stage('Branch B') {\n            agent { label \"for-branch-b\" }\n            steps {\n                echo \"On Branch B\"\n            }\n        }\n    }\n}\n```\n\n#### 2.9.2 failFast 快速失败\n\n```groovy\nstage('Parallel Stage') {\n    failFast true  // 任一并行分支失败时，中止所有并行分支\n    parallel {\n        stage('Branch A') { ... }\n        stage('Branch B') { ... }\n    }\n}\n```\n\n**全局并行快速失败**：\n\n```groovy\npipeline {\n    agent any\n    options {\n        parallelsAlwaysFailFast()  // 所有并行阶段都使用 failFast\n    }\n    stages { ... }\n}\n```\n\n---", "subs": ["2.9.1 基本并行", "2.9.2 failFast 快速失败"]}, {"title": "2.10 Matrix（矩阵构建）", "content": "#### 2.10.1 Matrix 概念\n\nMatrix 允许定义多维度的名称-值组合，并行执行。每个组合称为一个\"单元格（cell）\"。\n\n#### 2.10.2 单轴 Matrix\n\n```groovy\nmatrix {\n    axes {\n        axis {\n            name 'PLATFORM'\n            values 'linux', 'mac', 'windows'\n        }\n    }\n    stages {\n        stage('build') {\n            steps {\n                echo \"Building on ${PLATFORM}\"\n            }\n        }\n    }\n}\n```\n\n**结果**：创建 3 个并行单元格（linux, mac, windows）\n\n#### 2.10.3 多轴 Matrix\n\n```groovy\nmatrix {\n    axes {\n        axis {\n            name 'PLATFORM'\n            values 'linux', 'mac', 'windows'\n        }\n        axis {\n            name 'BROWSER'\n            values 'chrome', 'edge', 'firefox', 'safari'\n        }\n    }\n    stages {\n        stage('test') {\n            steps {\n                echo \"Testing on ${PLATFORM} with ${BROWSER}\"\n            }\n        }\n    }\n}\n```\n\n**结果**：创建 12 个并行单元格（3 × 4）\n\n#### 2.10.4 Excludes（排除组合）\n\n```groovy\nmatrix {\n    axes {\n        axis {\n            name 'PLATFORM'\n            values 'linux', 'mac', 'windows'\n        }\n        axis {\n            name 'BROWSER'\n            values 'chrome', 'edge', 'firefox', 'safari'\n        }\n        axis {\n            name 'ARCHITECTURE'\n            values '32-bit', '64-bit'\n        }\n    }\n    excludes {\n        exclude {\n            // 排除 mac + 32-bit 组合（4个单元格）\n            axis {\n                name 'PLATFORM'\n                values 'mac'\n            }\n            axis {\n                name 'ARCHITECTURE'\n                values '32-bit'\n            }\n        }\n        exclude {\n            // 排除 linux + safari 组合（2个单元格）\n            axis {\n                name 'PLATFORM'\n                values 'linux'\n            }\n            axis {\n                name 'BROWSER'\n                values 'safari'\n            }\n        }\n        exclude {\n            // 排除非 windows 平台的 edge（3个单元格）\n            axis {\n                name 'PLATFORM'\n                notValues 'windows'  // notValues 表示\"不是\"\n            }\n            axis {\n                name 'BROWSER'\n                values 'edge'\n            }\n        }\n    }\n    stages {\n        stage('test') {\n            steps {\n                echo \"Testing ${PLATFORM}-${BROWSER}-${ARCHITECTURE}\"\n            }\n        }\n    }\n}\n```\n\n**总单元格数**：3 × 4 × 2 = 24\n**排除数**：4 + 2 + 3 = 9\n**实际执行**：24 - 9 = 15 个单元格\n\n#### 2.10.5 Matrix 单元格级别指令\n\n可以在 matrix 级别使用以下指令，它们会应用到每个单元格：\n\n```groovy\nmatrix {\n    agent {\n        label \"${PLATFORM}-agent\"  // 根据平台选择 agent\n    }\n    when { \n        anyOf {\n            expression { params.PLATFORM_FILTER == 'all' }\n            expression { params.PLATFORM_FILTER == env.PLATFORM }\n        } \n    }\n    environment {\n        TEST_ENV = \"${PLATFORM}-${BROWSER}\"\n    }\n    axes { ... }\n    stages { ... }\n}\n```\n\n**支持的指令**：\n\n- agent\n- environment\n- input\n- options\n- post\n- tools\n- when\n\n#### 2.10.6 完整 Matrix 示例\n\n```groovy\npipeline {\n    parameters {\n        choice(name: 'PLATFORM_FILTER', \n               choices: ['all', 'linux', 'windows', 'mac'], \n               description: 'Run on specific platform')\n    }\n    agent none\n    stages {\n        stage('BuildAndTest') {\n            matrix {\n                agent {\n                    label \"${PLATFORM}-agent\"\n                }\n                when { \n                    anyOf {\n                        expression { params.PLATFORM_FILTER == 'all' }\n                        expression { params.PLATFORM_FILTER == env.PLATFORM }\n                    } \n                }\n                axes {\n                    axis {\n                        name 'PLATFORM'\n                        values 'linux', 'windows', 'mac'\n                    }\n                    axis {\n                        name 'BROWSER'\n                        values 'firefox', 'chrome', 'safari', 'edge'\n                    }\n                }\n                excludes {\n                    exclude {\n                        axis {\n                            name 'PLATFORM'\n                            values 'linux'\n                        }\n                        axis {\n                            name 'BROWSER'\n                            values 'safari'\n                        }\n                    }\n                    exclude {\n                        axis {\n                            name 'PLATFORM'\n                            notValues 'windows'\n                        }\n                        axis {\n                            name 'BROWSER'\n                            values 'edge'\n                        }\n                    }\n                }\n                stages {\n                    stage('Build') {\n                        steps {\n                            echo \"Building on ${PLATFORM} - ${BROWSER}\"\n                        }\n                    }\n                    stage('Test') {\n                        steps {\n                            echo \"Testing on ${PLATFORM} - ${BROWSER}\"\n                        }\n                    }\n                }\n            }\n        }\n    }\n}\n```\n\n---", "subs": ["2.10.1 Matrix 概念", "2.10.2 单轴 Matrix", "2.10.3 多轴 Matrix", "2.10.4 Excludes（排除组合）", "2.10.5 Matrix 单元格级别指令", "2.10.6 完整 Matrix 示例"]}, {"title": "2.11 Script 块（Groovy 脚本）", "content": "#### 2.11.1 在 Declarative Pipeline 中使用 Scripted Pipeline\n\n```groovy\npipeline {\n    agent any\n    stages {\n        stage('Example') {\n            steps {\n                echo 'Hello World'\n            \n                script {\n                    def browsers = ['chrome', 'firefox']\n                    for (int i = 0; i < browsers.size(); ++i) {\n                        echo \"Testing the ${browsers[i]} browser\"\n                    }\n                }\n            }\n        }\n    }\n}\n```\n\n**Script 块使用建议**：\n\n- ✅ 适用于简单的逻辑处理\n- ✅ 复杂逻辑应移至共享库\n- ⚠️ 不要在 script 块中嵌入大量代码\n- ⚠️ script 块会降低声明式 Pipeline 的可读性\n\n---", "subs": ["2.11.1 在 Declarative Pipeline 中使用 Scripted"]}, {"title": "2.12 Scripted Pipeline 详解", "content": "#### 2.12.1 基本结构\n\n```groovy\nnode {\n    stage('Checkout') {\n        checkout scm\n    }\n    stage('Build') {\n        sh 'make'\n    }\n    stage('Test') {\n        sh 'make check'\n    }\n}\n```\n\n#### 2.12.2 流程控制\n\n**if/else 条件**：\n\n```groovy\nnode {\n    stage('Example') {\n        if (env.BRANCH_NAME == 'master') {\n            echo 'I only execute on the master branch'\n        } else {\n            echo 'I execute elsewhere'\n        }\n    }\n}\n```\n\n**try/catch/finally 异常处理**：\n\n```groovy\nnode {\n    stage('Example') {\n        try {\n            sh 'exit 1'\n        }\n        catch (exc) {\n            echo 'Something failed!'\n            throw\n        }\n        finally {\n            echo 'This always runs'\n        }\n    }\n}\n```\n\n---", "subs": ["2.12.1 基本结构", "2.12.2 流程控制"]}, {"title": "2.13 Pipeline 语法最佳实践总结", "content": "#### 2.13.1 选择合适的 Pipeline 类型\n\n| 场景            | 推荐类型    | 原因             |\n| --------------- | ----------- | ---------------- |\n| 标准 CI/CD 流程 | Declarative | 结构清晰、易维护 |\n| 复杂逻辑处理    | Scripted    | 灵活性高         |\n| 团队协作项目    | Declarative | 统一规范         |\n| 原型快速验证    | Scripted    | 开发迅速         |\n\n#### 2.13.2 When 条件使用技巧\n\n```groovy\n// ✅ 推荐：使用 beforeAgent 节省资源\nwhen {\n    beforeAgent true\n    branch 'production'\n}\n\n// ✅ 推荐：组合条件使用 allOf/anyOf\nwhen {\n    allOf {\n        branch 'release'\n        expression { return params.DEPLOY }\n    }\n}\n\n// ❌ 不推荐：过度嵌套\nwhen {\n    allOf {\n        anyOf {\n            branch 'a'\n            branch 'b'\n        }\n        not {\n            expression { ... }\n        }\n    }\n}\n```\n\n#### 2.13.3 Parallel/Matrix 使用建议\n\n```groovy\n// ✅ 推荐：为并行阶段命名清晰\nparallel {\n    stage('Unit Tests') { ... }\n    stage('Integration Tests') { ... }\n    stage('E2E Tests') { ... }\n}\n\n// ✅ 推荐：使用 failFast 快速反馈\nstage('Tests') {\n    failFast true\n    parallel { ... }\n}\n\n// ✅ 推荐：Matrix 排除无效组合\nmatrix {\n    axes { ... }\n    excludes {\n        exclude {\n            // 排除不支持的组合\n        }\n    }\n}\n```\n\n#### 2.13.4 性能优化建议\n\n1. **合理使用 Agent**\n\n   ```groovy\n   pipeline {\n       agent none  // 不在全局分配\n       stages {\n           stage('Build') {\n               agent any  // 仅在需要时分配\n           }\n       }\n   }\n   ```\n\n2. **使用 stash/unstash 传递构建产物**\n\n   ```groovy\n   stash includes: '**/target/*.jar', name: 'app'\n   unstash 'app'\n   ```\n\n3. **设置合理的超时**\n\n   ```groovy\n   options {\n       timeout(time: 1, unit: 'HOURS')\n   }\n   ```\n\n4. **并行执行独立任务**\n\n   ```groovy\n   parallel {\n       stage('Unit Tests') { ... }\n       stage('Lint') { ... }\n   }\n   ```\n\n---\n\n**第二章完整小结**：\n\n本章详细介绍了 Jenkins Pipeline 的完整语法体系：\n\n- ✅ **When 条件**：9 种内置条件 + 组合条件 + 执行时机控制\n- ✅ **Sequential Stages**：顺序嵌套阶段构建复杂流程\n- ✅ **Parallel**：并行执行 + failFast 快速失败\n- ✅ **Matrix**：多维度矩阵构建 + 智能排除\n- ✅ **Script 块**：声明式中嵌入脚本式逻辑\n- ✅ **Scripted Pipeline**：完全的 Groovy DSL 支持\n- ✅ **最佳实践**：性能优化和代码规范\n\n掌握这些语法，您就可以构建任何复杂度的 CI/CD Pipeline！\n\n---\n\n---", "subs": ["2.13.1 选择合适的 Pipeline 类型", "2.13.2 When 条件使用技巧", "2.13.3 Parallel/Matrix 使用建议", "2.13.4 性能优化建议"]}]}, {"title": "第三章：常用插件详解", "sections": [{"title": "3.1 Git 插件", "content": "#### 基本用法\n\n```groovy\ngit branch: 'main',\n    credentialsId: 'github-creds',\n    url: 'https://github.com/user/repo.git'\n```\n\n#### 高级特性\n\n**多仓库管理**：\n\n```groovy\ndir('app') {\n    git url: 'https://github.com/user/app.git'\n}\ndir('config') {\n    git url: 'https://github.com/user/config.git'\n}\n```\n\n**浅克隆**：\n\n```groovy\ncheckout([\n    $class: 'GitSCM',\n    extensions: [[$class: 'CloneOption', depth: 1, shallow: true]]\n])\n```\n\n---", "subs": ["基本用法", "高级特性"]}, {"title": "3.2 withCredentials 插件", "content": "#### 凭据类型支持\n\n| 类型              | 用途       | 示例              |\n| ----------------- | ---------- | ----------------- |\n| Secret Text       | API Token  | 认证令牌          |\n| Username/Password | 数据库登录 | MySQL、PostgreSQL |\n| SSH Key           | Git访问    | GitHub、GitLab    |\n| Secret File       | 证书文件   | Kubeconfig、证书  |\n\n#### 使用示例\n\n**Secret Text**：\n\n```groovy\nwithCredentials([string(credentialsId: 'api-token', variable: 'TOKEN')]) {\n    sh 'curl -H \"Authorization: Bearer $TOKEN\" https://api.example.com'\n}\n```\n\n**用户名密码**：\n\n```groovy\nwithCredentials([usernamePassword(\n    credentialsId: 'db-creds',\n    usernameVariable: 'USER',\n    passwordVariable: 'PASS')]) {\n    sh 'mysql -u $USER -p$PASS'\n}\n```\n\n---", "subs": ["凭据类型支持", "使用示例"]}, {"title": "3.3 HTTP Request 插件", "content": "#### GET 请求\n\n```groovy\ndef response = httpRequest 'https://api.example.com/status'\nprintln \"Status: ${response.status}\"\n```\n\n#### POST 请求\n\n```groovy\nhttpRequest httpMode: 'POST',\n            url: 'https://api.example.com/data',\n            contentType: 'APPLICATION_JSON',\n            requestBody: '{\"key\":\"value\"}'\n```\n\n#### 认证请求\n\n```groovy\nhttpRequest url: 'https://api.example.com/data',\n            authentication: 'api-credentials',\n            validResponseCodes: '200:299'\n```\n\n---", "subs": ["GET 请求", "POST 请求", "认证请求"]}, {"title": "3.4 Kubernetes 插件", "content": "#### Pod Template\n\n```groovy\npodTemplate(containers: [\n    containerTemplate(\n        name: 'maven',\n        image: 'maven:3.9.9',\n        command: 'sleep',\n        args: '99d'\n    )\n]) {\n    node(POD_LABEL) {\n        container('maven') {\n            sh 'mvn clean package'\n        }\n    }\n}\n```\n\n#### YAML 定义\n\n```groovy\ndef podYaml = '''\napiVersion: v1\nkind: Pod\nspec:\n  containers:\n  - name: build\n    image: gradle:8.14.0\n    command: ['sleep']\n    args: ['infinity']\n'''\n\npipeline {\n    agent {\n        kubernetes { yaml podYaml }\n    }\n    stages {\n        stage('Build') {\n            steps {\n                container('build') {\n                    sh 'gradle build'\n                }\n            }\n        }\n    }\n}\n```\n\n#### 资源限制\n\n```groovy\ncontainerTemplate(\n    name: 'build',\n    image: 'maven:3.9.9',\n    resourceRequestCpu: '500m',\n    resourceRequestMemory: '1Gi',\n    resourceLimitCpu: '1000m',\n    resourceLimitMemory: '2Gi'\n)\n```\n\n---", "subs": ["Pod Template", "YAML 定义", "资源限制"]}, {"title": "3.5 ThinBackup 插件", "content": "#### 配置要点\n\n**备份目录**：`/var/jenkins_backup`\n\n**备份计划**（Cron）：\n\n```\nH 2 * * *    # 每天凌晨2点\n```\n\n**保留策略**：\n\n- 完整备份：保留 7 天\n- 差异备份：保留 30 天\n\n#### 备份内容选项\n\n- ✅ 配置文件（推荐）\n- ✅ 任务配置（推荐）\n- ✅ 构建历史（可选）\n- ⬜ 工作空间（通常不需要）\n\n#### 恢复流程\n\n1. 停止 Jenkins 服务\n2. 恢复备份到 `JENKINS_HOME`\n3. 启动 Jenkins 服务\n4. 验证配置正确性\n\n---", "subs": ["配置要点", "备份内容选项", "恢复流程"]}, {"title": "3.6 插件使用最佳实践", "content": "#### 推荐插件组合\n\n**基础组合**：\n\n- Git + Credentials + Pipeline\n\n**通知组合**：\n\n- Email Extension + Slack Notification\n\n**云原生组合**：\n\n- Kubernetes + Docker Pipeline\n\n**代码质量组合**：\n\n- SonarQube Scanner + Warnings Next Generation\n\n#### 插件安全建议\n\n1. **定期更新插件** - 修复安全漏洞\n2. **最小权限原则** - 限制插件访问权限\n3. **审计插件来源** - 仅使用官方插件\n4. **备份配置** - 使用 ThinBackup 定期备份\n\n---\n\n**第三章小结**：\n\n- Git 插件是源码管理的核心\n- withCredentials 提供安全的凭据管理\n- HTTP Request 实现外部系统集成\n- Kubernetes 插件支持云原生构建\n- ThinBackup 保障配置安全\n\n**推荐学习路径**：\n\n1. 掌握 Git 和 Credentials 基础\n2. 学习 Pipeline 集成\n3. 探索 Kubernetes 动态 Agent\n4. 建立完善的备份策略\n\n---\n\n**Jenkins 学习笔记完结**\n\n🎉 恭喜完成 Jenkins 系统化学习！\n\n**学习成果**：\n\n- ✅ 掌握 Jenkins 三种安装方式\n- ✅ 理解 Pipeline 核心概念\n- ✅ 熟悉常用插件使用\n- ✅ 建立 CI/CD 最佳实践\n\n**下一步建议**：\n\n1. 搭建实验环境实践\n2. 创建示例 Pipeline 项目\n3. 探索高级特性（如 Blue Ocean）\n4. 关注 Jenkins 社区动态\n\n祝您 Jenkins 之旅顺利！🚀", "subs": ["推荐插件组合", "插件安全建议"]}]}]}</script>

(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
