  mermaid.initialize({startOnLoad:false, theme:'base', themeVariables:{

<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

<script id="data" type="application/json">{"title": "Jenkins 学习笔记", "intro": "> 本文档是 Jenkins 系统化学习笔记，涵盖安装配置、Pipeline 使用和常用插件详解。\n\n---", "parts": [{"title": "📖 文档说明", "sections": [{"title": "概述", "content": "**目标读者**: Jenkins 初学者和运维工程师\n**内容特点**: 系统化、实践导向、包含图示说明\n**学习路径**: 从安装配置到高级特性，循序渐进\n\n---", "subs": []}]}, {"title": "第一章：Jenkins 安装与配置", "sections": [{"title": "1.1 Docker 环境安装", "content": "#### 1.1.1 Docker 部署 Jenkins 的优势\n\n使用 Docker 部署 Jenkins 具有以下优势：\n\n- **环境隔离**：容器化部署避免依赖冲突\n- **快速部署**：几分钟内即可启动 Jenkins 实例\n- **易于迁移**：可以在不同环境间快速迁移\n- **版本管理**：通过镜像标签控制 Jenkins 版本\n- **资源控制**：可以限制容器的资源使用\n\n#### 1.1.2 官方镜像介绍\n\nJenkins 提供多种官方 Docker 镜像：\n\n| 镜像类型                      | 说明         | 适用场景       |\n| ----------------------------- | ------------ | -------------- |\n| `jenkins/jenkins:lts`       | 长期支持版本 | 生产环境推荐   |\n| `jenkins/jenkins:latest`    | 最新版本     | 测试新特性     |\n| `jenkins/jenkins:lts-jdk21` | LTS + JDK21  | 指定 Java 版本 |\n\n> **注意**：`lts` 会随时间移动，适合实验环境。生产环境应先核对 Jenkins 与 Java 支持矩阵，再把镜像固定到明确版本或摘要。Blue Ocean 已进入弃用状态，不应作为新平台的默认组件；流水线可视化可按需评估 Stage View 或 Pipeline Graph View。\n\n#### 1.1.3 macOS/Linux 安装步骤\n\n##### 步骤 1: 创建 Docker 网络\n\n```bash\ndocker network create jenkins\n```\n\n##### 步骤 2: 仅在隔离实验环境运行 Docker-in-Docker\n\n```bash\ndocker run \\\n  --name jenkins-docker \\\n  --rm \\\n  --detach \\\n  --privileged \\\n  --network jenkins \\\n  --network-alias docker \\\n  --env DOCKER_TLS_CERTDIR=/certs \\\n  --volume jenkins-docker-certs:/certs/client \\\n  --volume jenkins-data:/var/jenkins_home \\\n  --publish 2376:2376 \\\n  docker:dind \\\n  --storage-driver overlay2\n```\n\n**参数说明**：\n\n- `--privileged`: DinD 需要的特权模式，同时意味着接近宿主机级别的控制能力\n- `--volume jenkins-docker-certs:/certs/client`: 挂载证书卷\n- `--volume jenkins-data:/var/jenkins_home`: 持久化 Jenkins 数据\n\n> **安全边界**：该模式只用于一次性实验。不要把通用构建任务直接连接宿主机 Docker Socket，也不要把特权 DinD 当作生产默认方案。生产中优先使用短生命周期 Agent、无特权镜像构建工具或受隔离的专用构建节点，并限制谁能修改 Jenkinsfile。\n\n##### 步骤 3: 自定义 Jenkins 镜像\n\n创建 `Dockerfile`:\n\n```dockerfile\nFROM jenkins/jenkins:lts-jdk21\nUSER root\nRUN apt-get update && apt-get install -y docker-ce-cli\nUSER jenkins\nRUN jenkins-plugin-cli --plugins \"workflow-aggregator docker-workflow\"\n```\n\n##### 步骤 4: 构建并运行\n\n```bash\ndocker build -t local/jenkins-lab:lts-jdk21 .\n\ndocker run \\\n  --name jenkins-lab \\\n  --restart=on-failure \\\n  --detach \\\n  --network jenkins \\\n  --env DOCKER_HOST=tcp://docker:2376 \\\n  --publish 8080:8080 \\\n  --publish 50000:50000 \\\n  --volume jenkins-data:/var/jenkins_home \\\n  local/jenkins-lab:lts-jdk21\n```\n\n#### 1.1.4 访问 Jenkins 容器\n\n```bash\n# 访问容器终端\ndocker exec -it jenkins-lab bash\n\n# 查看日志\ndocker logs -f jenkins-lab\n\n# 获取初始密码\ndocker exec jenkins-lab cat /var/jenkins_home/secrets/initialAdminPassword\n```\n\n#### 1.1.5 数据持久化方案\n\n**方案1: Docker Volume（推荐）**\n\n```bash\ndocker volume create jenkins-data\n--volume jenkins-data:/var/jenkins_home\n```\n\n**方案2: 本地目录挂载**\n\n```bash\n--volume $HOME/jenkins:/var/jenkins_home\n```\n\n#### 1.1.6 最佳实践\n\n1. **使用特定版本标签** - 避免使用 `:latest`\n2. **定期备份数据卷**\n3. **设置资源限制**: `--memory=\"2g\" --cpus=\"2.0\"`\n4. **生产镜像固定版本或摘要**，升级前在测试 Controller 验证插件兼容性\n\n---", "subs": ["1.1.1 Docker 部署 Jenkins 的优势", "1.1.2 官方镜像介绍", "1.1.3 macOS/Linux 安装步骤", "1.1.4 访问 Jenkins 容器", "1.1.5 数据持久化方案", "1.1.6 最佳实践"]}, {"title": "1.2 Kubernetes 环境安装", "content": "#### 1.2.1 Kubernetes 部署架构\n\n在 Kubernetes 上部署 Jenkins 提供了更好的可扩展性和资源管理能力。\n\n```mermaid\ngraph TD\n    A[Kubernetes集群] --> B[Jenkins Controller Pod]\n    B --> C[PersistentVolume 数据持久化]\n    B --> D[Service NodePort/LoadBalancer]\n    B --> E[动态 Jenkins Agent Pods]\n    E --> F[构建任务1]\n    E --> G[构建任务2]\n    E --> H[构建任务3]\n```\n\n#### 1.2.2 基础部署方式\n\n##### 步骤 1: 创建命名空间\n\n```bash\nkubectl create namespace devops-tools\n```\n\n##### 步骤 2: 创建 ServiceAccount\n\n文件: `jenkins-serviceaccount.yaml`\n\n```yaml\n---\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: jenkins-agent-manager\n  namespace: devops-tools\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: jenkins-agent-manager\n  namespace: devops-tools\nrules:\n  - apiGroups: [\"\"]\n    resources: [\"pods\"]\n    verbs: [\"create\", \"get\", \"list\", \"watch\", \"delete\"]\n  - apiGroups: [\"\"]\n    resources: [\"pods/exec\", \"pods/log\"]\n    verbs: [\"create\", \"get\"]\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: jenkins-agent-manager\n  namespace: devops-tools\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: Role\n  name: jenkins-agent-manager\nsubjects:\n- kind: ServiceAccount\n  name: jenkins-agent-manager\n  namespace: devops-tools\n```\n\n应用配置:\n\n```bash\nkubectl apply -f jenkins-serviceaccount.yaml\n```\n\n这组权限只允许在 `devops-tools` 命名空间管理动态 Agent Pod。业务部署应使用另一套按环境、Namespace 和资源类型收敛的身份，不能复用 Agent 管理身份，更不能授予通配的集群管理员权限。\n\n##### 步骤 3: 创建持久化卷\n\n文件: `jenkins-volume.yaml`\n\n```yaml\nkind: StorageClass\napiVersion: storage.k8s.io/v1\nmetadata:\n  name: local-storage\nprovisioner: kubernetes.io/no-provisioner\nvolumeBindingMode: WaitForFirstConsumer\n---\napiVersion: v1\nkind: PersistentVolume\nmetadata:\n  name: jenkins-pv-volume\n  labels:\n    type: local\nspec:\n  storageClassName: local-storage\n  claimRef:\n    name: jenkins-pv-claim\n    namespace: devops-tools\n  capacity:\n    storage: 10Gi\n  accessModes:\n    - ReadWriteOnce\n  local:\n    path: /mnt\n  nodeAffinity:\n    required:\n      nodeSelectorTerms:\n      - matchExpressions:\n        - key: kubernetes.io/hostname\n          operator: In\n          values:\n          - worker-node01  # 替换为实际节点名\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: jenkins-pv-claim\n  namespace: devops-tools\nspec:\n  storageClassName: local-storage\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: 3Gi\n```\n\n> **生产环境建议**: 使用云提供商的存储类（如 AWS EBS、GCE PD）以保证数据持久性。\n\n应用配置:\n\n```bash\nkubectl create -f jenkins-volume.yaml\n```\n\n#### 1.2.3 Kubernetes 部署验收与排障\n\nController Pod Running 只说明容器进程存在。正式验收还要验证持久化、反向代理、权限、重启恢复和动态 Agent。\n\n```bash\nkubectl --namespace devops-tools get pod,service,pvc\nkubectl --namespace devops-tools describe deployment jenkins\nkubectl --namespace devops-tools get events --sort-by=.lastTimestamp\nkubectl --namespace devops-tools logs deployment/jenkins --tail=200\n```\n\n| 现象 | 优先证据 | 常见原因 | 操作 |\n| --- | --- | --- | --- |\n| Pod Pending | Pod Events、PVC | 存储未绑定、配额或调度约束 | 修复 StorageClass、容量或节点条件 |\n| CrashLoopBackOff | 上一次容器日志 | Home 权限、插件或 Java 不兼容 | 保存日志，恢复兼容组合 |\n| 页面不可达 | Service、Ingress、Endpoints | 端口、路径或 TLS 配置错误 | 分层验证 Pod、Service、入口 |\n| 登录后链接错误 | Jenkins URL、代理 Header | 外部 URL 或转发 Header 不一致 | 修正 Location 和代理配置 |\n| Agent Pod 创建失败 | Controller 与 Kubernetes Events | RBAC、模板、镜像或配额 | 用最小身份复现 API 操作 |\n| 重启后配置丢失 | PVC 挂载和 Home 路径 | 数据写在容器临时层 | 修复挂载后从备份恢复 |\n\n##### 持久化验收\n\n1. 创建一个无敏感内容的测试 Job 和 Folder。\n2. 记录当前插件清单与 Controller Pod UID。\n3. 删除 Controller Pod，让 Deployment 重新创建。\n4. 验证 Folder、Job、用户权限和插件仍然存在。\n5. 运行代表性 Pipeline，确认凭据能够解密。\n6. 验证存储快照与独立备份，不把 PVC 当成备份。\n\n##### 动态 Agent 验收\n\n```groovy\npipeline {\n    agent {\n        kubernetes {\n            yaml '''\napiVersion: v1\nkind: Pod\nspec:\n  containers:\n    - name: shell\n      image: alpine:3.22\n      command: [sleep]\n      args: [99d]\n      resources:\n        requests:\n          cpu: 100m\n          memory: 128Mi\n        limits:\n          cpu: 500m\n          memory: 512Mi\n'''\n        }\n    }\n    stages {\n        stage('Smoke') {\n            steps {\n                container('shell') {\n                    sh 'id && uname -a'\n                }\n            }\n        }\n    }\n}\n```\n\n测试结束后 Agent Pod 应按策略销毁，Workspace 不保留秘密。若 Pod 残留，检查 Jenkins 构建是否仍等待、插件垃圾回收配置和 Kubernetes 删除权限。\n\n##### 步骤 4: 创建 Deployment\n\n文件: `jenkins-deployment.yaml`\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: jenkins\n  namespace: devops-tools\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: jenkins-server\n  strategy:\n    type: Recreate\n  template:\n    metadata:\n      labels:\n        app: jenkins-server\n    spec:\n      securityContext:\n        fsGroup: 1000\n        runAsUser: 1000\n      serviceAccountName: jenkins-agent-manager\n      containers:\n        - name: jenkins\n          image: jenkins/jenkins:lts\n          imagePullPolicy: Always\n          resources:\n            limits:\n              memory: \"2Gi\"\n              cpu: \"1000m\"\n            requests:\n              memory: \"500Mi\"\n              cpu: \"500m\"\n          ports:\n            - name: httpport\n              containerPort: 8080\n            - name: jnlpport\n              containerPort: 50000\n          livenessProbe:\n            httpGet:\n              path: \"/login\"\n              port: 8080\n            initialDelaySeconds: 90\n            periodSeconds: 10\n            timeoutSeconds: 5\n            failureThreshold: 5\n          readinessProbe:\n            httpGet:\n              path: \"/login\"\n              port: 8080\n            initialDelaySeconds: 60\n            periodSeconds: 10\n            timeoutSeconds: 5\n            failureThreshold: 3\n          volumeMounts:\n            - name: jenkins-data\n              mountPath: /var/jenkins_home\n      volumes:\n        - name: jenkins-data\n          persistentVolumeClaim:\n              claimName: jenkins-pv-claim\n```\n\n应用配置:\n\n```bash\nkubectl apply -f jenkins-deployment.yaml\n```\n\n##### 步骤 5: 创建 Service\n\n文件: `jenkins-service.yaml`\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: jenkins-service\n  namespace: devops-tools\n  annotations:\n      prometheus.io/scrape: 'true'\n      prometheus.io/path:   /\n      prometheus.io/port:   '8080'\nspec:\n  selector:\n    app: jenkins-server\n  type: NodePort\n  ports:\n    - port: 8080\n      targetPort: 8080\n      nodePort: 32000\n```\n\n应用配置:\n\n```bash\nkubectl apply -f jenkins-service.yaml\n```\n\n访问 Jenkins:\n\n```bash\n# 获取节点IP\nkubectl get nodes -o wide\n\n# 访问地址\nhttp://<node-ip>:32000\n```\n\n#### 1.2.3 使用 Helm 安装（推荐）\n\n##### 步骤 1: 添加 Jenkins Helm 仓库\n\n```bash\nhelm repo add jenkinsci https://charts.jenkins.io\nhelm repo update\n```\n\n##### 步骤 2: 创建 values 配置文件\n\n文件: `jenkins-values.yaml`\n\n```yaml\ncontroller:\n  serviceType: NodePort\n  nodePort: 32000\n  installPlugins:\n    - kubernetes:4389.v3e60b_3e4c6b_3\n    - workflow-aggregator:657.v7539b_b_25a_61f\n    - git:5.6.0\n    - configuration-as-code:1890.v88e1e8dcbfa_c\n  \npersistence:\n    enabled: true\n    storageClass: \"jenkins-pv\"\n    size: \"10Gi\"\n\nserviceAccount:\n  create: false\n  name: jenkins\n\nresources:\n  limits:\n    cpu: \"2000m\"\n    memory: \"4Gi\"\n  requests:\n    cpu: \"500m\"\n    memory: \"1Gi\"\n```\n\n##### 步骤 3: 安装 Jenkins\n\n```bash\nhelm install jenkins jenkinsci/jenkins \\\n  -n devops-tools \\\n  -f jenkins-values.yaml\n```\n\n##### 步骤 4: 获取管理员密码\n\n```bash\njsonpath=\"{.data.jenkins-admin-password}\"\nsecret=$(kubectl get secret -n devops-tools jenkins -o jsonpath=$jsonpath)\necho $(echo $secret | base64 --decode)\n```\n\n#### 1.2.4 配置动态 Agent\n\nJenkins Kubernetes Plugin 允许动态创建Agent Pod：\n\n```groovy\npipeline {\n    agent {\n        kubernetes {\n            yaml '''\napiVersion: v1\nkind: Pod\nmetadata:\n  labels:\n    jenkins: agent\nspec:\n  containers:\n  - name: maven\n    image: maven:3.8.1-jdk-11\n    command:\n    - sleep\n    args:\n    - 99d\n'''\n        }\n    }\n    stages {\n        stage('Build') {\n            steps {\n                container('maven') {\n                    sh 'mvn --version'\n                }\n            }\n        }\n    }\n}\n```\n\n#### 1.2.5 高可用配置建议\n\n1. **使用 StatefulSet** - 保证 Pod 名称稳定\n2. **配置持久化存储** - 使用云存储类\n3. **设置资源限制和请求**\n4. **配置健康检查** - Liveness 和 Readiness Probes\n5. **使用 HPA** - 水平自动扩缩容（仅适用于无状态组件）\n\n---", "subs": ["1.2.1 Kubernetes 部署架构", "1.2.2 基础部署方式", "1.2.3 Kubernetes 部署验收与排障", "1.2.3 使用 Helm 安装（推荐）", "1.2.4 配置动态 Agent", "1.2.5 高可用配置建议"]}, {"title": "1.3 Linux 环境安装", "content": "#### 1.3.1 系统要求\n\n- **操作系统**: Debian/Ubuntu, RHEL/CentOS, Fedora\n- **Java版本**: OpenJDK 21 或兼容版本\n- **硬件**: 最小 256MB RAM, 推荐 4GB+ RAM\n- **磁盘**: 最小 1GB，推荐 50GB+\n\n#### 1.3.2 Debian/Ubuntu 安装\n\n##### 步骤 1: 安装 Java\n\n```bash\nsudo apt update\nsudo apt install fontconfig openjdk-21-jre\njava -version\n```\n\n输出示例:\n\n```\nopenjdk 21.0.8 2025-07-15\nOpenJDK Runtime Environment (build 21.0.8+9-Debian-1)\n```\n\n> **重要**: 必须先安装 Java，否则 Jenkins 服务可能无法启动。\n\n##### 步骤 2: 添加 Jenkins 仓库\n\n**LTS 版本（推荐）**:\n\n```bash\nsudo wget -O /etc/apt/keyrings/jenkins-keyring.asc \\\n  https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key\necho \"deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc]\" \\\n  https://pkg.jenkins.io/debian-stable binary/ | sudo tee \\\n  /etc/apt/sources.list.d/jenkins.list > /dev/null\n```\n\n**Weekly 版本**:\n\n```bash\nsudo wget -O /etc/apt/keyrings/jenkins-keyring.asc \\\n  https://pkg.jenkins.io/debian/jenkins.io-2023.key\necho \"deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc]\" \\\n  https://pkg.jenkins.io/debian binary/ | sudo tee \\\n  /etc/apt/sources.list.d/jenkins.list > /dev/null\n```\n\n##### 步骤 3: 安装 Jenkins\n\n```bash\nsudo apt update\nsudo apt install jenkins\n```\n\n安装过程会自动：\n\n- 创建 `jenkins` 用户和用户组\n- 配置 systemd 服务\n- 设置 `/var/lib/jenkins` 为 JENKINS_HOME\n- 配置Jenkins监听8080端口\n\n#### 1.3.3 RHEL/CentOS 安装\n\n##### 使用 yum (RHEL/CentOS 7)\n\n```bash\n# 添加仓库\nsudo wget -O /etc/yum.repos.d/jenkins.repo \\\n    https://pkg.jenkins.io/redhat-stable/jenkins.repo\nsudo rpm --import https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key\n\n# 安装依赖和Jenkins\nsudo yum upgrade\nsudo yum install fontconfig java-21-openjdk\nsudo yum install jenkins\nsudo systemctl daemon-reload\n```\n\n##### 使用 dnf (Fedora/RHEL 8+)\n\n```bash\nsudo wget -O /etc/yum.repos.d/jenkins.repo \\\n    https://pkg.jenkins.io/redhat-stable/jenkins.repo\nsudo rpm --import https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key\nsudo dnf upgrade\nsudo dnf install fontconfig java-21-openjdk\nsudo dnf install jenkins\nsudo systemctl daemon-reload\n```\n\n#### 1.3.4 启动和管理 Jenkins 服务\n\n##### 启用开机自启\n\n```bash\nsudo systemctl enable jenkins\n```\n\n##### 启动服务\n\n```bash\nsudo systemctl start jenkins\n```\n\n##### 检查状态\n\n```bash\nsudo systemctl status jenkins\n```\n\n正常输出:\n\n```\n● jenkins.service - Jenkins Continuous Integration Server\n   Loaded: loaded (/lib/systemd/system/jenkins.service; enabled)\n   Active: active (running) since Tue 2024-12-04 16:19:01 CST\n```\n\n##### 重启服务\n\n```bash\nsudo systemctl restart jenkins\n```\n\n##### 停止服务\n\n```bash\nsudo systemctl stop jenkins\n```\n\n##### 查看日志\n\n```bash\n# 查看实时日志\nsudo journalctl -u jenkins.service -f\n\n# 查看所有日志\nsudo journalctl -u jenkins.service\n\n# 查看最近100行\nsudo journalctl -u jenkins.service -n 100\n```\n\n#### 1.3.5 修改端口配置\n\n如果8080端口被占用，需要修改端口：\n\n```bash\nsudo systemctl edit jenkins\n```\n\n添加以下内容:\n\n```ini\n[Service]\nEnvironment=\"JENKINS_PORT=8081\"\n```\n\n重启服务:\n\n```bash\nsudo systemctl restart jenkins\n```\n\n#### 1.3.6 防火墙配置\n\n##### firewalld 配置\n\n```bash\nYOURPORT=8080\nPERM=\"--permanent\"\nSERV=\"$PERM --service=jenkins\"\n\nfirewall-cmd $PERM --new-service=jenkins\nfirewall-cmd $SERV --set-short=\"Jenkins ports\"\nfirewall-cmd $SERV --set-description=\"Jenkins port exceptions\"\nfirewall-cmd $SERV --add-port=$YOURPORT/tcp\nfirewall-cmd $PERM --add-service=jenkins\nfirewall-cmd --zone=public --add-service=http --permanent\nfirewall-cmd --reload\n```\n\n##### ufw 配置 (Ubuntu)\n\n```bash\nsudo ufw allow 8080/tcp\nsudo ufw reload\n```\n\n#### 1.3.7 文件位置说明\n\n| 路径                                    | 说明                      |\n| --------------------------------------- | ------------------------- |\n| `/var/lib/jenkins`                    | JENKINS_HOME 目录         |\n| `/etc/default/jenkins`                | 配置文件（Debian/Ubuntu） |\n| `/etc/sysconfig/jenkins`              | 配置文件（RHEL/CentOS）   |\n| `/lib/systemd/system/jenkins.service` | systemd 服务文件          |\n| `/var/log/jenkins/jenkins.log`        | 日志文件                  |\n\n#### 1.3.8 常见问题\n\n##### 问题1: 端口已被占用\n\n```bash\n# 查看端口占用\nsudo netstat -tulpn | grep 8080\n# 或\nsudo lsof -i :8080\n```\n\n##### 问题2: Java 未找到\n\n```bash\n# 设置 JAVA_HOME\necho 'export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64' | sudo tee -a /etc/profile\nsource /etc/profile\n```\n\n##### 问题3: 权限问题\n\n```bash\n# 修复权限\nsudo chown -R jenkins:jenkins /var/lib/jenkins\n```\n\n---\n\n#### 1.3.8 Java 与 Jenkins LTS 如何配套升级\n\nJenkins Controller、Agent 进程和 CLI 必须运行在当前 Jenkins 版本支持的 Java 上；项目构建使用的 JDK 可以不同。不要根据旧课程固定写“JDK 8+”，应在每次升级前查 Jenkins 官方 Java 支持矩阵和 LTS 升级指南。\n\n| 对象 | 版本依据 | 验证方式 |\n| --- | --- | --- |\n| Controller Java | Jenkins 核心支持矩阵 | 启动日志、系统信息、代表性任务 |\n| Agent Java | Controller 与 Remoting 要求 | 节点日志、连接与重连测试 |\n| 项目 JDK | 应用源码和构建插件要求 | Maven、Gradle 或项目测试 |\n| 插件 Java | 插件最低 Jenkins 与 Java 要求 | 测试 Controller 插件加载 |\n\n升级顺序不能凭经验一概而论。先从当前版本的官方升级指南确定是否需要经过中间 LTS、先升级插件还是先切换 Java。对跨度较大的实例，分阶段升级能降低插件和配置迁移同时发生的风险。\n\n```bash\njava -version\nsystemctl show jenkins --property=Environment\njournalctl --unit jenkins --since '30 minutes ago'\n```\n\n##### 升级前检查\n\n- 记录 Jenkins 核心、Java、操作系统和全部插件版本。\n- 检查弃用插件、停更插件、被安全公告影响的版本和依赖链。\n- 从生产备份恢复测试 Controller，而不是创建空实例做升级。\n- 运行 SCM、凭据、Pipeline、动态 Agent 和制品操作等代表性任务。\n- 确认旧版本安装介质、容器摘要、插件清单和 Home 快照可用。\n\n##### 升级后检查\n\n- Controller 启动日志没有插件加载失败、配置迁移异常和反复重启。\n- 所有预期节点重新连接，Agent Java 版本满足要求。\n- Folder 权限、凭据解密、共享库加载和 Queue 调度正常。\n- 代表性 Pipeline 能跨暂停点继续，外部 Webhook 与回调可达。\n- 磁盘、Heap、GC、线程、响应时间和失败率完成观察窗口。\n\n回退是恢复兼容组合，不是只把 Jenkins WAR 或单个插件降级。若新版本已经写入不可逆配置，直接复用升级后的 Home 启动旧版本可能失败，因此回退应使用变更前的一致性快照。\n\n#### 1.3.9 Linux 服务运行基线\n\nJenkins 使用独立系统用户运行，不使用 `root`。Home、日志和缓存目录由该用户拥有；系统服务限制、文件句柄和进程资源应根据任务规模评估，不能通过给整个目录 `777` 解决权限问题。\n\n```bash\nsystemctl status jenkins --no-pager\nsystemctl cat jenkins\nsystemctl show jenkins \\\n  --property=User,Group,Environment,LimitNOFILE,MemoryCurrent\njournalctl --unit jenkins --since today\n```\n\n##### systemd 变更方式\n\n不要直接修改发行包自带 Unit 文件。使用 `systemctl edit jenkins` 建立 Drop-in，并把变更纳入配置管理：\n\n```ini\n[Service]\nEnvironment=\"JAVA_OPTS=-Djava.awt.headless=true\"\nLimitNOFILE=65536\n```\n\n```bash\nsudo systemctl daemon-reload\nsudo systemctl restart jenkins\nsudo systemctl status jenkins --no-pager\n```\n\n变更 JVM Heap 前先观察 Heap、GC 和系统内存。把 Heap 设得接近主机总内存会挤压文件缓存和其他进程；频繁 Full GC 也可能来自插件、超大 Pipeline 状态或任务跑在 Controller，不能只靠继续加内存。\n\n##### Linux 故障证据\n\n- 进程退出：查看 systemd 状态、退出码和最后一次启动日志。\n- 端口未监听：确认进程是否启动、绑定地址和反向代理目标。\n- Home 权限错误：确认服务用户、挂载 UID/GID 和 SELinux/AppArmor 事件。\n- 磁盘满：区分构建记录、Workspace、插件缓存、日志和备份增长。\n- 文件句柄耗尽：检查进程限制和打开文件类型，再决定调整限制。\n- 时间异常：检查 NTP；时间漂移会影响 TLS、日志关联和 Token 有效期。\n\n安全组或防火墙规则应只开放必要来源和端口。排障不能通过关闭防火墙获得长期“修复”；应从连接方向、源地址、目标端口和拒绝日志收敛规则。\n\n---", "subs": ["1.3.1 系统要求", "1.3.2 Debian/Ubuntu 安装", "1.3.3 RHEL/CentOS 安装", "1.3.4 启动和管理 Jenkins 服务", "1.3.5 修改端口配置", "1.3.6 防火墙配置", "1.3.7 文件位置说明", "1.3.8 常见问题", "1.3.8 Java 与 Jenkins LTS 如何配套升级", "1.3.9 Linux 服务运行基线"]}, {"title": "1.4 初始化配置与平台治理", "content": "安装完成后，需要进行初始化配置才能开始使用 Jenkins。\n\n#### 1.4.1 解锁 Jenkins\n\n##### 访问 Web 界面\n\n打开浏览器访问:\n\n```\nhttp://localhost:8080\n```\n\n或者（如果是远程服务器）:\n\n```\nhttp://<server-ip>:8080\n```\n\n##### 获取初始密码\n\n**方法1: 查看文件**\n\n```bash\nsudo cat /var/lib/jenkins/secrets/initialAdminPassword\n```\n\n**方法2: 查看日志**\n\n```bash\nsudo journalctl -u jenkins.service | grep -A 5 \"初始密码\"\n```\n\n**方法3: Docker环境**\n\n```bash\ndocker exec jenkins-lab cat /var/jenkins_home/secrets/initialAdminPassword\n```\n\n**方法4: Kubernetes环境**\n\n```bash\nkubectl exec -it deployment/jenkins -n devops-tools -- \\\n  cat /var/jenkins_home/secrets/initialAdminPassword\n```\n\n将密码粘贴到 Web 界面即可解锁。\n\n#### 1.4.2 安装插件\n\n解锁后会看到插件安装选项：\n\n##### 选项1: 安装推荐插件（推荐新手）\n\n包含常用插件：\n\n- Git\n- Pipeline\n- Credentials\n- SSH Agents\n- Pipeline 基础插件与凭据插件\n\n##### 选项2: 选择插件安装（推荐熟练用户）\n\n可以自定义选择需要的插件。\n\n**按能力评估的插件候选**:\n\n- **源码管理**: Git, GitHub, GitLab\n- **构建工具**: Maven, Gradle, NodeJS\n- **容器**: Docker, Kubernetes\n- **通知**: Email Extension, Slack\n- **安全**: LDAP, Role-based Authorization\n\n插件不是越多越好。安装前记录用途、维护状态、依赖链、最低 Jenkins 版本和回退方式；先在测试 Controller 安装并运行代表性任务，再进入生产变更窗口。\n\n#### 1.4.3 创建管理员用户\n\n##### 填写用户信息\n\n- **用户名**: 使用可审计的个人管理账号，避免多人共享 `admin`\n- **密码**: 设置强密码\n- **全名**: 管理员姓名\n- **电子邮件**: 管理员邮箱\n\n> **提示**: 如果跳过此步骤，默认用户名为 `admin`，密码为初始密码。\n\n#### 1.4.4 配置 Jenkins URL\n\n设置 Jenkins 访问地址，用于：\n\n- 生成邮件通知链接\n- Configure webhook URLs\n- Agent连接地址\n\n示例:\n\n```\nhttp://jenkins.example.com:8080/\n```\n\n或保持默认的本地地址。\n\n#### 1.4.5 全局工具配置\n\n进入 `Manage Jenkins` > `Global Tool Configuration`:\n\n##### JDK 配置\n\n```\nName: JDK-21\nJAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64\n```\n\n或勾选\"自动安装\"。\n\n##### Maven 配置\n\n```\nName: Maven-3.9\nVersion: 3.9.x\n```\n\n##### Git 配置\n\n通常自动检测系统安装的 Git。\n\n##### Docker 配置\n\n```\nName: Docker\nDocker URL: unix:///var/run/docker.sock\n```\n\n#### 1.4.6 安全配置\n\n##### 启用安全策略\n\n`Manage Jenkins` > `Configure Global Security`:\n\n**授权策略**:\n\n- **Matrix-based security**: 精细权限控制\n- **Role-Based Strategy**: 基于角色（需安装插件）\n- **Project-based**: 基于项目\n\n**访问控制**:\n\n- 禁用匿名访问\n- 启用\"Allow users to sign up\"（可选）\n- 配置CSRF Protection（默认启用）\n\n##### LDAP/AD集成（可选）\n\n如果企业使用LDAP:\n\n```\nServer: ldap://ldap.example.com\nRoot DN: dc=example,dc=com\nUser search base: ou=users\n```\n\n#### 1.4.7 系统配置\n\n`Manage Jenkins` > `Configure System`:\n\n##### Jenkins Location\n\n```\nJenkins URL: http://jenkins.example.com:8080/\nSystem Admin e-mail address: admin@example.com\n```\n\n##### 邮件通知\n\n```\nSMTP server: smtp.example.com\nDefault user e-mail suffix: @example.com\n```\n\n测试邮件配置:\n\n```\nTest e-mail recipient: your-email@example.com\n```\n\n##### Controller 执行器数量\n\n```\n# of executors: 0\n```\n\n> **建议**：Controller 负责调度、配置、队列和 Pipeline 状态，不承载常规构建。把执行器设为 `0`，将编译、测试、镜像构建和部署动作放到静态或动态 Agent；只有经过风险评估的轻量管理任务才例外运行在 Controller。\n\n##### Quiet period\n\n```\nQuiet period: 5  # 秒，任务触发后的静默期\n```\n\n#### 1.4.8 凭据管理\n\n`Manage Jenkins` > `Manage Credentials`:\n\n##### 添加SSH密钥\n\n```\nKind: SSH Username with private key\nID: github-ssh\nUsername: git\nPrivate Key: [粘贴私钥内容]\n```\n\n##### 添加用户名密码\n\n```\nKind: Username with password\nScope: Global\nUsername: your-username\nPassword: your-password\nID: docker-registry\n```\n\n##### 添加Secret text\n\n```\nKind: Secret text\nSecret: your-api-token\nID: api-token\n```\n\n##### 凭据治理规则\n\n| 维度 | 推荐做法 | 需要避免 |\n| --- | --- | --- |\n| 作用域 | 放在能满足任务的最低 Folder 或 Item 层级 | 所有项目共享全局高权限凭据 |\n| 身份 | 使用机器人账号、项目 Token 或短期身份 | 管理员个人账号参与日常流水线 |\n| ID | 使用稳定且可读的命名，如 `prod-harbor-push` | 把密码、用户名或环境地址写进 ID |\n| 注入 | 使用 `withCredentials` 并让 Shell 展开变量 | 在 Groovy 双引号中插值秘密 |\n| 生命周期 | 记录所有者、到期日、轮换和撤销流程 | 永久 Token 无人负责 |\n| 审计 | 追踪使用任务与最近使用时间 | 只确认凭据“仍能登录” |\n\n凭据掩码只能降低误打印概率，不能防御恶意 Jenkinsfile。能修改 Pipeline 或受信任共享库的人，理论上可能把凭据发送到外部，因此代码评审权与凭据使用权必须一起设计。\n\n#### 1.4.9 配置代理（可选）\n\n如果Jenkins服务器需要通过代理访问外网:\n\n`Manage Jenkins` > `Manage Plugins` > `Advanced`:\n\n```\nHTTP Proxy Configuration:\nServer: proxy.example.com\nPort: 8080\nNo Proxy Host: localhost,127.0.0.1,*.internal.com\n```\n\n#### 1.4.10 Jenkins CLI 配置（可选）\n\n下载CLI工具:\n\n```bash\nwget http://localhost:8080/jnlpJars/jenkins-cli.jar\n```\n\n使用示例:\n\n```bash\nexport JENKINS_USER_ID='operator'\nexport JENKINS_API_TOKEN='从安全终端注入的短期或可轮换令牌'\njava -jar jenkins-cli.jar -s https://jenkins.example.com/ \\\n  -auth \"$JENKINS_USER_ID:$JENKINS_API_TOKEN\" help\n```\n\n#### 1.4.11 备份配置\n\n初始配置完成后，应设计“可恢复的备份”，而不是只生成压缩包：\n\n```bash\n# 进入 quiet down 后，由受控备份系统读取一致性快照\ncurl --fail --user \"$JENKINS_USER_ID:$JENKINS_API_TOKEN\" \\\n  --request POST https://jenkins.example.com/quietDown\nsudo tar -czf /backup/jenkins-home-$(date +%Y%m%d).tar.gz /var/lib/jenkins\n```\n\n备份范围至少覆盖任务与系统配置、插件清单、用户配置、`secrets/` 和主密钥；构建制品应由外部制品库保管，Workspace 可重建。主密钥应单独加密托管，否则恢复出的凭据无法解密。每个周期都要在隔离环境完成一次恢复演练，并验证登录、凭据解密、任务加载、插件依赖和代表性 Pipeline。\n\n#### 1.4.12 `JENKINS_HOME` 的逻辑边界\n\nJenkins 主要把状态保存在文件系统中。目录可以帮助定位问题，但目录结构不是稳定 API，迁移或自动化脚本不能假定所有插件永远使用同一布局。\n\n| 逻辑对象 | 常见位置 | 备份与恢复关注点 |\n| --- | --- | --- |\n| 系统配置 | 根目录 XML、插件配置文件 | URL、安全域、云和全局工具配置是否正确加载 |\n| 任务与文件夹 | `jobs/` | `config.xml`、构建编号和嵌套 Folder 是否完整 |\n| Agent | `nodes/` | 节点定义可恢复，但工作节点本身仍需重新连通 |\n| 插件 | `plugins/` | 同时保存插件清单、版本与依赖，不只复制 `.jpi` |\n| 用户 | `users/` | 身份源映射与授权策略需一起验证 |\n| 凭据 | `credentials.xml` 与 `secrets/` | 缺少主密钥时密文不可用，应分离加密保管 |\n| 构建记录 | `jobs/.../builds/` | 体积增长快，按审计要求设置保留策略 |\n| Workspace | `workspace/` | 原则上可重建，不作为唯一制品保存位置 |\n\n#### 1.4.13 任务类型如何选择\n\n| 类型 | 适用场景 | 运维判断 |\n| --- | --- | --- |\n| Pipeline | 单条明确流程，Jenkinsfile 可纳入代码库 | 新项目的默认起点 |\n| Multibranch Pipeline | 同一仓库按分支或合并请求自动发现任务 | 配合分支发现、孤儿任务清理和 SCM 凭据 |\n| Folder | 按团队或系统建立命名、权限和凭据边界 | 不只是 UI 分组，也是治理边界 |\n| 参数化任务 | 需要受控人工输入的构建或发布入口 | 参数必须校验，不能把自由文本直接拼入 Shell |\n| Freestyle | 维护遗留任务或简单兼容场景 | 应逐步把关键逻辑迁入版本控制 |\n\n任务名称便于人读，但不应成为业务名、环境名和版本号的唯一事实来源。流水线应显式携带这些元数据，并在触发、制品和发布记录之间保持一致。\n\n#### 1.4.14 全局、项目与节点三级权限\n\nRole-Based Authorization Strategy 常用于把权限分成 Global、Item 和 Agent 三个层次。Global Read 是进入 Jenkins 的基础权限，但不意味着用户可以读取所有任务；Item Role 用正则匹配 Folder 或 Job；Agent Role 控制节点配置与连接相关操作。\n\n| 角色 | Global 权限 | Item 权限 | Agent 权限 | 典型人员 |\n| --- | --- | --- | --- | --- |\n| 平台只读 | Overall Read | Job Read | Agent 只读 | 审计与值班观察者 |\n| 项目开发 | Overall Read | 指定 Folder 的 Read、Build、Cancel、Workspace | 无 | 开发与测试 |\n| 项目维护 | Overall Read | 指定 Folder 的 Configure、Build、Read | 无 | 项目流水线维护者 |\n| Agent 运维 | Overall Read | 必要任务只读 | 指定节点 Connect、Disconnect | 基础设施维护者 |\n| Jenkins 管理 | Administer | 全部 | 全部 | 极少数平台管理员 |\n\n权限正则要锚定 Folder 边界。例如 `^commerce(/.*)?$` 比包含式的 `commerce.*` 更容易避免误匹配。新建 Folder 时应自动继承可解释的角色模板，并用测试账号验证允许和拒绝路径。\n\n##### 权限验收场景\n\n1. 项目开发者能查看、构建和取消本项目任务。\n2. 项目开发者不能修改凭据、脚本审批、节点和全局配置。\n3. 项目维护者能修改 Jenkinsfile 入口配置，但不能读取其他 Folder 凭据。\n4. Agent 运维能处理指定节点离线，不能重配生产任务。\n5. 匿名用户不能读取任务、构建日志、制品或系统信息。\n6. 离职或团队调动后，通过身份组变化统一撤权，不依赖逐用户残留授权。\n\n任务配置权具有间接执行代码的能力。能修改 Jenkinsfile、SCM 地址、共享库或构建参数的人可能在 Agent 上执行任意命令，因此不能把 Configure 当成普通编辑权限；高权限凭据也不能授予允许不受信任 Pull Request 的任务。\n\n#### 1.4.15 从遗留任务迁移到 Pipeline\n\n迁移不是把自由风格任务的 Shell 原样粘进 Jenkinsfile。先盘点触发器、参数、SCM、构建步骤、构建后动作、凭据、节点标签、制品和上下游依赖，再逐项定义新契约。\n\n| 遗留配置 | Pipeline 目标 | 验证重点 |\n| --- | --- | --- |\n| UI 中的 SCM | `checkout scm` 或受控 Checkout | Commit 与凭据一致 |\n| UI 参数 | `parameters` 加初始化校验 | 类型、默认值和注入风险 |\n| Execute Shell | 仓库脚本或共享库 Step | 退出码、引用、超时 |\n| 构建后归档 | `archiveArtifacts` 或制品库 | 不能把 Workspace 当制品库 |\n| 邮件通知 | `post` 与统一通知能力 | 通知失败不篡改发布事实 |\n| 上下游 Job | 显式 API、事件或共享制品 | 避免隐藏耦合和递归触发 |\n| 节点绑定 | Stage Agent 与资源需求 | Label 存在且容量充足 |\n| UI 凭据 | Credentials ID | 最低作用域和机器人身份 |\n\n##### 迁移步骤\n\n1. 冻结遗留任务配置，导出 `config.xml` 并记录所有插件依赖。\n2. 在代码库创建 Jenkinsfile 与构建脚本，先只做 Checkout、Build 和 Test。\n3. 对同一 Commit 并行运行旧、新任务，对比产物摘要和测试报告。\n4. 接入质量门禁和候选制品库，验证失败不会产生正式版本。\n5. 在非生产环境验证参数、审批、部署和回滚。\n6. 把 Webhook 切换到新任务，并保留短期可回退窗口。\n7. 禁用旧任务而不是立即删除，观察没有调用方后再归档。\n8. 移除旧插件、凭据和节点引用，更新运行手册与所有权。\n\n##### 对比验收\n\n- 相同 Commit 的关键产物内容一致，或差异有明确现代化原因。\n- 新 Pipeline 在 Controller 重启、Agent 中断和用户取消时状态正确。\n- 旧任务中的明文秘密、管理员账号和不安全网络操作没有迁移。\n- Build、Quality、Publish、Deploy 状态不再被一个长 Shell 混在一起。\n- 失败能够定位到责任层级，通知中包含构建与制品链接。\n- 新任务的 Folder 权限和凭据作用域通过正向、负向测试。\n\n#### 1.4.16 配置变更与审计\n\n平台配置变更至少记录操作者、时间、对象、变更前后差异、变更原因和验证结果。可以用 JCasC 管理适合声明化的系统配置，但凭据值仍由秘密系统注入，Job 业务逻辑继续保存在代码仓库。\n\n配置备份解决恢复，配置审计解决“谁改了什么”。二者不能互相替代。发现异常变更时，先保存证据和当前状态，再按受控版本恢复；不要在生产页面连续试改导致差异不可追踪。\n\n---", "subs": ["1.4.1 解锁 Jenkins", "1.4.2 安装插件", "1.4.3 创建管理员用户", "1.4.4 配置 Jenkins URL", "1.4.5 全局工具配置", "1.4.6 安全配置", "1.4.7 系统配置", "1.4.8 凭据管理", "1.4.9 配置代理（可选）", "1.4.10 Jenkins CLI 配置（可选）", "1.4.11 备份配置", "1.4.12 JENKINS_HOME 的逻辑边界", "1.4.13 任务类型如何选择", "1.4.14 全局、项目与节点三级权限", "1.4.15 从遗留任务迁移到 Pipeline", "1.4.16 配置变更与审计"]}, {"title": "1.5 Controller 与 Agent 部署架构", "content": "#### 1.5.1 部署方式对比\n\n```mermaid\ngraph TD\n    A[Jenkins部署方式选择] --> B[Docker部署]\n    A --> C[Kubernetes部署]\n    A --> D[Linux直接部署]\n  \n    B --> B1[单机Docker]\n    B --> B2[Docker Compose]\n    B --> B3[Docker Swarm]\n  \n    C --> C1[Deployment]\n    C --> C2[StatefulSet]\n    C --> C3[Helm Chart]\n    C --> C4[Operator]\n  \n    D --> D1[单机部署]\n    D --> D2[Controller Agent 架构]\n  \n    style A fill:#f9f,stroke:#333,stroke-width:4px\n    style C fill:#bbf,stroke:#333,stroke-width:2px\n```\n\n#### 1.5.2 Controller-Agent 架构\n\n```mermaid\ngraph TB\n    subgraph \"Jenkins Controller\"\n        M[Jenkins Controller]\n        M --> M1[任务调度]\n        M --> M2[配置管理]\n        M --> M3[UI界面]\n    end\n  \n    subgraph \"Static Agents\"\n        A1[Agent 1<br/>Linux]\n        A2[Agent 2<br/>Windows]\n    end\n  \n    subgraph \"Dynamic Agents K8s\"\n        K1[Pod Agent 1]\n        K2[Pod Agent 2]\n        K3[Pod Agent N]\n    end\n  \n    subgraph \"Docker Agents\"\n        D1[Container 1]\n        D2[Container 2]\n    end\n  \n    M --> A1\n    M --> A2\n    M --> K1\n    M --> K2\n    M --> K3\n    M --> D1\n    M --> D2\n  \n    style M fill:#faa,stroke:#333,stroke-width:4px\n    style K1 fill:#afa,stroke:#333,stroke-width:2px\n    style K2 fill:#afa,stroke:#333,stroke-width:2px\n    style K3 fill:#afa,stroke:#333,stroke-width:2px\n```\n\n#### 1.5.3 数据流架构\n\n```mermaid\ngraph LR\n    subgraph \"用户层\"\n        U1[开发人员]\n        U2[运维人员]\n        U3[测试人员]\n    end\n  \n    subgraph \"Jenkins Controller\"\n        UI[Web UI]\n        API[REST API]\n        SCH[调度器]\n    end\n  \n    subgraph \"数据存储\"\n        PV[PersistentVolume]\n        DB[(配置数据)]\n        WS[工作空间]\n    end\n  \n    subgraph \"外部集成\"\n        GIT[Git/SVN]\n        REG[Docker Registry]\n        K8S[Kubernetes]\n        NOTIFY[通知服务]\n    end\n  \n    U1 --> UI\n    U2 --> API\n    U3 --> UI\n  \n    UI --> SCH\n    API --> SCH\n  \n    SCH --> PV\n    SCH --> DB\n    SCH --> WS\n  \n    SCH --> GIT\n    SCH --> REG\n    SCH --> K8S\n    SCH --> NOTIFY\n```\n\n#### 1.5.4 恢复优先的生产架构\n\n```mermaid\ngraph TB\n    U[用户与 Webhook] --> GW[反向代理]\n    GW --> C[单个活动 Controller]\n    C --> H[JENKINS_HOME 持久存储]\n    C --> A[静态与动态 Agent 池]\n    H --> B[一致性备份]\n    B --> V[隔离恢复验证]\n    I[版本固定的基础设施声明] --> R[替代 Controller]\n    B --> R\n    R -.故障切换后重新连接.-> A\n```\n\n开源 Jenkins 不能通过让两个 Controller 同时读写同一个 `JENKINS_HOME` 就获得通用的 Active-Active 能力；这会带来文件锁、缓存和状态一致性风险。更可操作的目标是明确 RPO 与 RTO：快速重建 Controller、挂载经过验证的恢复副本、恢复密钥和插件，再让 Agent 重新连接。若要拆分故障域，应按团队或业务把任务分散到多个独立 Controller，而不是共享同一数据目录。\n\n#### 1.5.5 Controller、静态 Agent 与动态 Agent 的职责\n\n| 组件 | 核心职责 | 主要故障表现 | 隔离策略 |\n| --- | --- | --- | --- |\n| Controller | 配置、认证授权、队列、调度、Pipeline 状态与 UI | 所有新任务停止调度，页面或 API 不可用 | 不运行常规构建，限制插件面，重点备份恢复 |\n| 静态 Agent | 长期工具链、特殊硬件、稳定缓存或传统系统构建 | 指定标签任务排队，节点磁盘持续增长 | 专用账号、标签和工作目录，定期清理与补丁 |\n| 动态 Agent | 按任务创建隔离环境，任务后销毁 | Pod 创建失败、拉镜像慢、配额不足 | 固定镜像、资源请求限制、超时和残留清理 |\n\n动态 Agent 解决的是执行环境弹性，不会替代 Controller 的状态保护。反过来，Controller 正常也不代表构建能力正常；监控必须同时覆盖队列、Agent 在线率、调度失败与基础设施配额。\n\n#### 1.5.6 部署方式选择建议\n\n| 场景          | 推荐方式          | 理由                 |\n| ------------- | ----------------- | -------------------- |\n| 个人学习/测试 | Docker单机        | 快速、简单、易于清理 |\n| 小团队开发    | Linux直接部署     | 稳定、易维护         |\n| 中型团队      | Kubernetes + Helm | 扩展性好、易管理     |\n| 大型企业      | K8s + 高可用架构  | 高可用、动态扩展     |\n| CI/CD密集型   | K8s + 动态Agent   | 资源利用率高         |\n\n#### 1.5.7 资源规划建议\n\n##### 小型部署（< 10个任务/天）\n\n- **CPU**: 2核\n- **内存**: 4GB\n- **存储**: 20GB\n- **Agent**: 1-2个\n\n##### 中型部署（10-100个任务/天）\n\n- **CPU**: 4核\n- **内存**: 8GB\n- **存储**: 100GB\n- **Agent**: 3-10个\n\n##### 大型部署（> 100个任务/天）\n\n- **CPU**: 8核+\n- **内存**: 16GB+\n- **存储**: 500GB+\n- **Agent**: 10+个（动态扩展）\n\n---\n\n**第一章小结**\n\n本章介绍了 Jenkins 的三种主要安装方式：\n\n- ✅ Docker 部署 - 适合快速部署和测试\n- ✅ Kubernetes 部署 - 适合云原生环境和大规模使用\n- ✅ Linux 部署 - 适合传统服务器环境\n\n完成安装后，进行了初始化配置，包括解锁、插件安装、用户创建、安全配置等关键步骤。\n\n**下一步**: 学习第二章 Jenkins Pipeline 详解\n\n---", "subs": ["1.5.1 部署方式对比", "1.5.2 Controller-Agent 架构", "1.5.3 数据流架构", "1.5.4 恢复优先的生产架构", "1.5.5 Controller、静态 Agent 与动态 Agent 的职责", "1.5.6 部署方式选择建议", "1.5.7 资源规划建议"]}]}, {"title": "第二章：Jenkins Pipeline 详解", "sections": [{"title": "2.1 Pipeline 基础概念", "content": "#### 什么是 Jenkins Pipeline\n\nJenkins Pipeline 是一套插件集合，支持将持续交付流程实现并集成到 Jenkins 中。\n\n**Pipeline 核心优势**：\n\n- ✅ **代码化（Code）**：Pipeline 以代码形式定义，可纳入版本控制\n- ✅ **持久性（Durable）**：Pipeline 可在控制器重启后继续执行\n- ✅ **可暂停（Pausable）**：可等待人工输入或审批\n- ✅ **多功能（Versatile）**：支持复杂的真实 CD 需求\n- ✅ **可扩展（Extensible）**：支持自定义扩展和插件集成\n\n#### 声明式 vs 脚本式 Pipeline\n\n**声明式 Pipeline（推荐）**：\n\n```groovy\npipeline {\n    agent any\n    stages {\n        stage('Build') {\n            steps {\n                echo 'Building..'\n            }\n        }\n    }\n}\n```\n\n**脚本式 Pipeline**：\n\n```groovy\nnode {\n    stage('Build') {\n        echo 'Building..'\n    }\n}\n```\n\n---", "subs": ["什么是 Jenkins Pipeline", "声明式 vs 脚本式 Pipeline"]}, {"title": "2.2 Jenkinsfile 核心要点与开发工具", "content": "#### Pipeline 开发工具如何分工\n\n- **Snippet Generator** 根据当前 Controller 已安装插件生成单个 Step 的参数，适合 `checkout`、`withCredentials`、`httpRequest` 等调用。\n- **Declarative Directive Generator** 生成 `agent`、`options`、`when`、`post` 等声明式结构，适合检查嵌套位置。\n- **Pipeline Steps Reference** 用于核对 Step 的参数与所属插件；生成结果仍需代码评审，不能把带真实凭据 ID、地址或临时调试输出的片段直接提交。\n- **Replay** 适合隔离环境快速定位语法问题。生产修复必须回写源码并经过评审，不能让 Replay 成为不可追踪的长期版本。\n\n#### 环境变量\n\n**常用系统变量**：\n\n- `BUILD_NUMBER` - 构建编号\n- `JOB_NAME` - 任务名称\n- `WORKSPACE` - 工作空间路径\n- `JENKINS_URL` - Jenkins URL\n\n**使用示例**：\n\n```groovy\necho \"Running build ${env.BUILD_NUMBER}\"\n```\n\n#### 参数、环境变量与普通变量的作用域\n\n| 形式 | 读取方式 | 适合保存 | 主要边界 |\n| --- | --- | --- | --- |\n| 构建参数 | `params.RELEASE_VERSION` | 用户或触发器输入 | 在流水线开始前校验，不可信输入不能直接拼接命令 |\n| 环境变量 | `env.BUILD_NUMBER` | Step 与外部进程之间传递字符串 | 值会字符串化，作用域可为 Pipeline 或 Stage |\n| Groovy 变量 | `def manifest = ...` | 流水线内部结构化数据 | 跨暂停点对象必须可序列化 |\n| 凭据绑定变量 | Shell 中 `$TOKEN` | 短时间调用外部系统 | 只在最小代码块内存在，避免 Groovy 插值与调试输出 |\n\n在 Stage 中用 `def` 定义的局部变量不会自动变成后续 Stage 的环境变量。跨节点传递文件使用 `stash/unstash` 或外部制品库，跨阶段传递少量字符串才考虑 `env`；不要把大型对象或客户端连接保存在 Pipeline 状态里。\n\n#### 凭据管理最佳实践\n\n```groovy\nenvironment {\n    AWS_KEY = credentials('aws-key-id')\n}\n```\n\n> **重要提示**：始终使用单引号避免 Groovy 插值泄露敏感信息\n\n#### DSL Step 与普通 Groovy 方法的差异\n\n`sh`、`checkout`、`timeout`、`withCredentials` 等是 Jenkins Pipeline Step，由插件提供并参与暂停、恢复、日志和执行上下文。普通 Groovy 方法在 JVM 中计算数据，不自动拥有 Workspace、Agent 或 Step 上下文。\n\n| 能力 | Pipeline Step | 普通 Groovy 方法 |\n| --- | --- | --- |\n| 来源 | Jenkins 核心或插件 DSL | Jenkinsfile、共享库类 |\n| 可暂停 | 可以，如 `input`、`sleep` | 普通方法本身不提供 Pipeline 暂停语义 |\n| 需要 Agent | `sh`、`checkout` 等需要 | 纯计算通常不需要 |\n| 重启恢复 | 由 Pipeline 引擎保存状态 | 跨暂停点对象必须可序列化 |\n| 测试方式 | 模拟 Step 或测试 Controller | 普通单元测试优先 |\n\n```groovy\nString normalizeVersion(String raw) {\n    String value = raw?.trim()\n    if (!(value ==~ /[0-9]+\\.[0-9]+\\.[0-9]+/)) {\n        throw new IllegalArgumentException('invalid version')\n    }\n    return value\n}\n\nstage('Validate') {\n    steps {\n        script {\n            env.RELEASE_VERSION = normalizeVersion(params.VERSION)\n        }\n        sh './ci/validate.sh \"$RELEASE_VERSION\"'\n    }\n}\n```\n\n普通方法适合校验和转换；外部进程仍通过 Step 执行。不要在普通 Groovy 方法中创建网络客户端并跨 `input` 或 `sh` 保存，恢复时这类对象通常不可序列化或连接已经失效。\n\n#### Snippet Generator 的正确使用流程\n\n1. 在与生产插件组合一致的测试 Controller 选择需要的 Step。\n2. 只填示例或凭据 ID，不粘贴真实秘密到普通字符串字段。\n3. 生成片段后查 Pipeline Steps Reference，确认参数语义和默认值。\n4. 补上超时、允许状态码、失败处理和日志脱敏。\n5. 将片段放入最小测试 Pipeline，验证成功、失败和取消路径。\n6. 通过代码评审进入 Jenkinsfile 或共享库，不能只保留在 Replay。\n\n---", "subs": ["Pipeline 开发工具如何分工", "环境变量", "参数、环境变量与普通变量的作用域", "凭据管理最佳实践", "DSL Step 与普通 Groovy 方法的差异", "Snippet Generator 的正确使用流程"]}, {"title": "2.3 Pipeline 中使用 Docker", "content": "#### 基本用法\n\n```groovy\nagent {\n    docker { \n        image 'maven:3.9.9' \n        args '-v $HOME/.m2:/root/.m2'\n    }\n}\n```\n\n#### 多容器支持\n\n```groovy\nstages {\n    stage('Backend') {\n        agent { docker { image 'maven:3.9.9' } }\n        steps { sh 'mvn --version' }\n    }\n    stage('Frontend') {\n        agent { docker { image 'node:20' } }\n        steps { sh 'node --version' }\n    }\n}\n```\n\n---", "subs": ["基本用法", "多容器支持"]}, {"title": "2.4 共享库的结构、版本与信任边界", "content": "#### 目录结构\n\n```\n(root)\n+- src/              # Groovy 类\n+- vars/             # 全局变量  \n+- resources/        # 资源文件\n```\n\n- `vars/` 暴露面向 Jenkinsfile 的全局步骤，应保持接口小而清晰，并用同名 `.txt` 提供帮助。\n- `src/` 放置包结构下的 Groovy 类和可测试逻辑；需要调用 Pipeline Step 时显式传入 `steps` 或脚本上下文。\n- `resources/` 保存模板、配置片段等静态资源，通过 `libraryResource` 读取，不能拿它充当秘密仓库。\n\n#### 使用示例\n\n```groovy\n@Library('delivery-lib@v3.4.1') _\n\npipeline {\n    stages {\n        stage('Example') {\n            steps {\n                script {\n                    log.info 'Starting build'\n                }\n            }\n        }\n    }\n}\n```\n\n生产任务应使用受保护标签或不可变提交固定库版本。`@Library('delivery-lib@main')` 和由用户参数决定库分支都会扩大供应链风险：库仓库一旦被篡改，所有使用它的流水线可能同时获得恶意逻辑。\n\n共享库升级采用“兼容变更 → 库级测试 → 试点 Folder → 扩大使用范围”的顺序。接口变更至少保留一个迁移窗口；出现问题时把 Jenkinsfile 回退到上一不可变版本，而不是在线修改受信任库。全局受信任库可绕过 Groovy Sandbox，能提交该仓库的人等同于拥有高权限 Jenkins 代码执行能力，因此必须限制写权限、强制评审和分支保护。\n\n#### 共享库的测试与发布清单\n\n| 层次 | 测试对象 | 失败能说明什么 |\n| --- | --- | --- |\n| 纯单元测试 | 参数、版本、路径、元数据转换 | 业务逻辑回归，不依赖 Jenkins |\n| Pipeline 单元测试 | Step 调用、阶段、异常和状态 | Jenkinsfile 契约发生变化 |\n| 契约仓库 | Maven、Gradle、Go、npm 示例项目 | 语言适配器输入输出不一致 |\n| 测试 Controller | 插件、Sandbox、凭据和重启 | 真实运行环境兼容性问题 |\n| 试点 Folder | 少量生产形态任务 | 权限、性能和外部系统风险 |\n\n发布前确认：\n\n- `vars/` 公共入口的参数、默认值、返回值和异常有文档。\n- `src/` 逻辑不持有不可序列化对象跨越 Pipeline 暂停点。\n- `resources/` 模板无秘密、真实内网地址和环境专用硬编码。\n- 外部请求包含超时、状态码判断、幂等边界和脱敏日志。\n- 新版本兼容旧 Jenkinsfile，或提供明确的 Major 迁移说明。\n- 受保护标签解析到唯一 Commit，禁止移动已发布标签。\n- 上一稳定版本和回退操作已经在试点任务验证。\n\n共享库失败时先区分编译期加载失败、运行期 Step 失败和外部系统失败。编译期失败通常会影响所有阶段，优先检查版本解析、SCM 凭据和 Groovy 语法；运行期失败按标准错误码定位，不要立即切换到可变分支规避。\n\n---", "subs": ["目录结构", "使用示例", "共享库的测试与发布清单"]}, {"title": "2.5 Pipeline 高级特性与变量作用域", "content": "#### When 条件\n\n```groovy\nwhen {\n    branch 'production'\n    environment name: 'DEPLOY', value: 'true'\n}\n```\n\n#### Parallel 并行\n\n```groovy\nstage('Tests') {\n    parallel {\n        stage('Unit') {\n            steps { sh 'make unit-test' }\n        }\n        stage('Integration') {\n            steps { sh 'make integration-test' }\n        }\n    }\n}\n```\n\n#### Post 处理\n\n```groovy\npost {\n    always { junit '**/*.xml' }\n    success { echo 'Success!' }\n    failure { mail to: 'team@example.com' }\n}\n```\n\n---", "subs": ["When 条件", "Parallel 并行", "Post 处理"]}, {"title": "2.6 Pipeline 流程图", "content": "#### 基本执行流程\n\n```\nPipeline 开始\n    ↓\n分配 Agent\n    ↓\n设置环境变量\n    ↓\n执行 Stages\n    ↓\nPost 处理\n    ↓\nPipeline 结束\n```\n\n---\n\n**第二章小结**：\n\n- Pipeline 提供了代码化的 CI/CD 解决方案\n- 声明式语法更易读易维护\n- Docker 集成简化了构建环境管理\n- 共享库促进代码复用\n- 高级特性支持复杂的流程控制", "subs": ["基本执行流程"]}, {"title": "2.7 Declarative Pipeline 完整语法", "content": "#### 2.7.1 When 条件详解\n\n##### 内置条件类型\n\n**1. branch** - 分支匹配\n\n```groovy\nwhen { branch 'main' }\nwhen { branch pattern: \"release-\\\\d+\", comparator: \"REGEXP\" }\n```\n\n**2. buildingTag** - 构建标签时执行\n\n```groovy\nwhen { buildingTag() }\n```\n\n**3. changelog** - 变更日志匹配\n\n```groovy\nwhen { changelog '.*^\\\\[DEPENDENCY\\\\] .+$' }\n```\n\n**4. changeset** - 文件变更匹配\n\n```groovy\nwhen { changeset \"**/*.js\" }\nwhen { changeset pattern: \".TEST\\\\.java\", comparator: \"REGEXP\" }\n```\n\n**5. changeRequest** - PR/MR触发\n\n```groovy\nwhen { changeRequest() }\nwhen { changeRequest target: 'main' }\nwhen { changeRequest authorEmail: \"[\\\\w_-.]+@example.com\", comparator: 'REGEXP' }\n```\n\n**6. environment** - 环境变量匹配\n\n```groovy\nwhen { environment name: 'DEPLOY_TO', value: 'production' }\n```\n\n**7. expression** - Groovy 表达式\n\n```groovy\nwhen { expression { return params.DEBUG_BUILD } }\nwhen { expression { BRANCH_NAME ==~ /(production|staging)/ } }\n```\n\n**8. tag** - 标签匹配\n\n```groovy\nwhen { tag \"release-*\" }\nwhen { tag pattern: \"release-\\\\d+\", comparator: \"REGEXP\" }\n```\n\n**9. triggeredBy** - 触发方式\n\n```groovy\nwhen { triggeredBy 'SCMTrigger' }\nwhen { triggeredBy 'TimerTrigger' }\nwhen { triggeredBy 'BuildUpstreamCause' }\nwhen { triggeredBy cause: \"UserIdCause\", detail: \"vlinde\" }\n```\n\n##### 条件组合\n\n**not** - 条件取反\n\n```groovy\nwhen { not { branch 'main' } }\n```\n\n**allOf** - 所有条件都满足（AND）\n\n```groovy\nwhen { \n    allOf { \n        branch 'main'\n        environment name: 'DEPLOY_TO', value: 'production' \n    } \n}\n```\n\n**anyOf** - 任一条件满足（OR）\n\n```groovy\nwhen { \n    anyOf { \n        branch 'main'\n        branch 'staging' \n    } \n}\n```\n\n##### When 条件执行时机控制\n\n**beforeAgent** - 在分配 Agent 之前评估\n\n```groovy\nstage('Deploy') {\n    agent { label \"production-server\" }\n    when {\n        beforeAgent true\n        branch 'production'\n    }\n    steps {\n        echo 'Deploying'\n    }\n}\n```\n\n**beforeInput** - 在 Input 之前评估\n\n```groovy\nwhen {\n    beforeInput true\n    branch 'production'\n}\ninput {\n    message \"Deploy to production?\"\n}\n```\n\n**beforeOptions** - 在 Options 之前评估\n\n```groovy\nwhen {\n    beforeOptions true\n    branch 'testing'\n}\noptions {\n    lock label: 'testing-deploy-envs'\n}\n```\n\n优先级：`beforeOptions` > `beforeInput` > `beforeAgent`\n\n---", "subs": ["2.7.1 When 条件详解"]}, {"title": "2.8 Sequential Stages（顺序嵌套阶段）", "content": "#### 2.8.1 基本用法\n\n```groovy\npipeline {\n    agent none\n    stages {\n        stage('Sequential') {\n            agent { label 'for-sequential' }\n            environment {\n                FOR_SEQUENTIAL = \"some-value\"\n            }\n            stages {\n                stage('In Sequential 1') {\n                    steps {\n                        echo \"In Sequential 1\"\n                    }\n                }\n                stage('In Sequential 2') {\n                    steps {\n                        echo \"In Sequential 2\"\n                    }\n                }\n                stage('Parallel In Sequential') {\n                    parallel {\n                        stage('In Parallel 1') {\n                            steps {\n                                echo \"In Parallel 1\"\n                            }\n                        }\n                        stage('In Parallel 2') {\n                            steps {\n                                echo \"In Parallel 2\"\n                            }\n                        }\n                    }\n                }\n            }\n        }\n    }\n}\n```\n\n**关键点**：\n\n- 嵌套的 stages 会继承父 stage 的 agent 和 environment\n- 可以在嵌套 stages 内部使用 parallel\n- 每个 stage 必须有且仅有一个：steps、stages、parallel 或 matrix\n\n---", "subs": ["2.8.1 基本用法"]}, {"title": "2.9 Parallel（并行执行）", "content": "#### 2.9.1 基本并行\n\n```groovy\nstage('Parallel Stage') {\n    parallel {\n        stage('Branch A') {\n            agent { label \"for-branch-a\" }\n            steps {\n                echo \"On Branch A\"\n            }\n        }\n        stage('Branch B') {\n            agent { label \"for-branch-b\" }\n            steps {\n                echo \"On Branch B\"\n            }\n        }\n    }\n}\n```\n\n#### 2.9.2 failFast 快速失败\n\n```groovy\nstage('Parallel Stage') {\n    failFast true  // 任一并行分支失败时，中止所有并行分支\n    parallel {\n        stage('Branch A') { ... }\n        stage('Branch B') { ... }\n    }\n}\n```\n\n**全局并行快速失败**：\n\n```groovy\npipeline {\n    agent any\n    options {\n        parallelsAlwaysFailFast()  // 所有并行阶段都使用 failFast\n    }\n    stages { ... }\n}\n```\n\n---", "subs": ["2.9.1 基本并行", "2.9.2 failFast 快速失败"]}, {"title": "2.10 Matrix（矩阵构建）", "content": "#### 2.10.1 Matrix 概念\n\nMatrix 允许定义多维度的名称-值组合，并行执行。每个组合称为一个\"单元格（cell）\"。\n\n#### 2.10.2 单轴 Matrix\n\n```groovy\nmatrix {\n    axes {\n        axis {\n            name 'PLATFORM'\n            values 'linux', 'mac', 'windows'\n        }\n    }\n    stages {\n        stage('build') {\n            steps {\n                echo \"Building on ${PLATFORM}\"\n            }\n        }\n    }\n}\n```\n\n**结果**：创建 3 个并行单元格（linux, mac, windows）\n\n#### 2.10.3 多轴 Matrix\n\n```groovy\nmatrix {\n    axes {\n        axis {\n            name 'PLATFORM'\n            values 'linux', 'mac', 'windows'\n        }\n        axis {\n            name 'BROWSER'\n            values 'chrome', 'edge', 'firefox', 'safari'\n        }\n    }\n    stages {\n        stage('test') {\n            steps {\n                echo \"Testing on ${PLATFORM} with ${BROWSER}\"\n            }\n        }\n    }\n}\n```\n\n**结果**：创建 12 个并行单元格（3 × 4）\n\n#### 2.10.4 Excludes（排除组合）\n\n```groovy\nmatrix {\n    axes {\n        axis {\n            name 'PLATFORM'\n            values 'linux', 'mac', 'windows'\n        }\n        axis {\n            name 'BROWSER'\n            values 'chrome', 'edge', 'firefox', 'safari'\n        }\n        axis {\n            name 'ARCHITECTURE'\n            values '32-bit', '64-bit'\n        }\n    }\n    excludes {\n        exclude {\n            // 排除 mac + 32-bit 组合（4个单元格）\n            axis {\n                name 'PLATFORM'\n                values 'mac'\n            }\n            axis {\n                name 'ARCHITECTURE'\n                values '32-bit'\n            }\n        }\n        exclude {\n            // 排除 linux + safari 组合（2个单元格）\n            axis {\n                name 'PLATFORM'\n                values 'linux'\n            }\n            axis {\n                name 'BROWSER'\n                values 'safari'\n            }\n        }\n        exclude {\n            // 排除非 windows 平台的 edge（3个单元格）\n            axis {\n                name 'PLATFORM'\n                notValues 'windows'  // notValues 表示\"不是\"\n            }\n            axis {\n                name 'BROWSER'\n                values 'edge'\n            }\n        }\n    }\n    stages {\n        stage('test') {\n            steps {\n                echo \"Testing ${PLATFORM}-${BROWSER}-${ARCHITECTURE}\"\n            }\n        }\n    }\n}\n```\n\n**总单元格数**：3 × 4 × 2 = 24\n**排除数**：4 + 2 + 3 = 9\n**实际执行**：24 - 9 = 15 个单元格\n\n#### 2.10.5 Matrix 单元格级别指令\n\n可以在 matrix 级别使用以下指令，它们会应用到每个单元格：\n\n```groovy\nmatrix {\n    agent {\n        label \"${PLATFORM}-agent\"  // 根据平台选择 agent\n    }\n    when { \n        anyOf {\n            expression { params.PLATFORM_FILTER == 'all' }\n            expression { params.PLATFORM_FILTER == env.PLATFORM }\n        } \n    }\n    environment {\n        TEST_ENV = \"${PLATFORM}-${BROWSER}\"\n    }\n    axes { ... }\n    stages { ... }\n}\n```\n\n**支持的指令**：\n\n- agent\n- environment\n- input\n- options\n- post\n- tools\n- when\n\n#### 2.10.6 完整 Matrix 示例\n\n```groovy\npipeline {\n    parameters {\n        choice(name: 'PLATFORM_FILTER', \n               choices: ['all', 'linux', 'windows', 'mac'], \n               description: 'Run on specific platform')\n    }\n    agent none\n    stages {\n        stage('BuildAndTest') {\n            matrix {\n                agent {\n                    label \"${PLATFORM}-agent\"\n                }\n                when { \n                    anyOf {\n                        expression { params.PLATFORM_FILTER == 'all' }\n                        expression { params.PLATFORM_FILTER == env.PLATFORM }\n                    } \n                }\n                axes {\n                    axis {\n                        name 'PLATFORM'\n                        values 'linux', 'windows', 'mac'\n                    }\n                    axis {\n                        name 'BROWSER'\n                        values 'firefox', 'chrome', 'safari', 'edge'\n                    }\n                }\n                excludes {\n                    exclude {\n                        axis {\n                            name 'PLATFORM'\n                            values 'linux'\n                        }\n                        axis {\n                            name 'BROWSER'\n                            values 'safari'\n                        }\n                    }\n                    exclude {\n                        axis {\n                            name 'PLATFORM'\n                            notValues 'windows'\n                        }\n                        axis {\n                            name 'BROWSER'\n                            values 'edge'\n                        }\n                    }\n                }\n                stages {\n                    stage('Build') {\n                        steps {\n                            echo \"Building on ${PLATFORM} - ${BROWSER}\"\n                        }\n                    }\n                    stage('Test') {\n                        steps {\n                            echo \"Testing on ${PLATFORM} - ${BROWSER}\"\n                        }\n                    }\n                }\n            }\n        }\n    }\n}\n```\n\n---", "subs": ["2.10.1 Matrix 概念", "2.10.2 单轴 Matrix", "2.10.3 多轴 Matrix", "2.10.4 Excludes（排除组合）", "2.10.5 Matrix 单元格级别指令", "2.10.6 完整 Matrix 示例"]}, {"title": "2.11 Script 块（Groovy 脚本）", "content": "#### 2.11.1 在 Declarative Pipeline 中使用 Scripted Pipeline\n\n```groovy\npipeline {\n    agent any\n    stages {\n        stage('Example') {\n            steps {\n                echo 'Hello World'\n            \n                script {\n                    def browsers = ['chrome', 'firefox']\n                    for (int i = 0; i < browsers.size(); ++i) {\n                        echo \"Testing the ${browsers[i]} browser\"\n                    }\n                }\n            }\n        }\n    }\n}\n```\n\n**Script 块使用建议**：\n\n- ✅ 适用于简单的逻辑处理\n- ✅ 复杂逻辑应移至共享库\n- ⚠️ 不要在 script 块中嵌入大量代码\n- ⚠️ script 块会降低声明式 Pipeline 的可读性\n\n---", "subs": ["2.11.1 在 Declarative Pipeline 中使用 Scripted"]}, {"title": "2.12 Scripted Pipeline 详解", "content": "#### 2.12.1 基本结构\n\n```groovy\nnode {\n    stage('Checkout') {\n        checkout scm\n    }\n    stage('Build') {\n        sh 'make'\n    }\n    stage('Test') {\n        sh 'make check'\n    }\n}\n```\n\n#### 2.12.2 流程控制\n\n**if/else 条件**：\n\n```groovy\nnode {\n    stage('Example') {\n        if (env.BRANCH_NAME == 'main') {\n            echo 'I only execute on the main branch'\n        } else {\n            echo 'I execute elsewhere'\n        }\n    }\n}\n```\n\n**try/catch/finally 异常处理**：\n\n```groovy\nnode {\n    stage('Example') {\n        try {\n            sh 'exit 1'\n        }\n        catch (exc) {\n            echo 'Something failed!'\n            throw\n        }\n        finally {\n            echo 'This always runs'\n        }\n    }\n}\n```\n\n---", "subs": ["2.12.1 基本结构", "2.12.2 流程控制"]}, {"title": "2.13 CPS、重启恢复与 Pipeline 最佳实践", "content": "#### 2.13.1 CPS 与重启恢复边界\n\nJenkins 会对大部分 Pipeline Groovy 做 CPS 转换，在可暂停 Step 之间保存执行状态，从而在 Controller 重启后恢复。代价是流水线代码并不等同于普通 Groovy 程序：跨暂停点保留的对象需要可序列化，某些 Java 或 Groovy 方法与 CPS 闭包混用会产生方法不匹配。\n\n`@NonCPS` 只适合纯计算，例如对已存在的普通数据排序或转换。它不能调用 `sh`、`echo`、`timeout` 等 Pipeline Step，也不应返回不可序列化对象供后续长期保存。\n\n```groovy\n@NonCPS\nList<String> sortedNames(List<String> names) {\n    names.collect { it.toString() }.sort()\n}\n\nstage('Normalize') {\n    steps {\n        script {\n            def names = sortedNames(['api', 'worker'])\n            echo \"components=${names.join(',')}\"\n        }\n    }\n}\n```\n\n排查重启恢复问题时，先查异常对象类型和发生的暂停 Step，再缩小跨 Step 生命周期的数据；不要靠给大段逻辑加 `@NonCPS` 掩盖问题。\n\n#### 2.13.2 选择合适的 Pipeline 类型\n\n| 场景            | 推荐类型    | 原因             |\n| --------------- | ----------- | ---------------- |\n| 标准 CI/CD 流程 | Declarative | 结构清晰、易维护 |\n| 复杂逻辑处理    | Scripted    | 灵活性高         |\n| 团队协作项目    | Declarative | 统一规范         |\n| 原型快速验证    | Scripted    | 开发迅速         |\n\n#### 2.13.3 When 条件使用技巧\n\n```groovy\n// ✅ 推荐：使用 beforeAgent 节省资源\nwhen {\n    beforeAgent true\n    branch 'production'\n}\n\n// ✅ 推荐：组合条件使用 allOf/anyOf\nwhen {\n    allOf {\n        branch 'release'\n        expression { return params.DEPLOY }\n    }\n}\n\n// ❌ 不推荐：过度嵌套\nwhen {\n    allOf {\n        anyOf {\n            branch 'a'\n            branch 'b'\n        }\n        not {\n            expression { ... }\n        }\n    }\n}\n```\n\n#### 2.13.4 Parallel/Matrix 使用建议\n\n```groovy\n// ✅ 推荐：为并行阶段命名清晰\nparallel {\n    stage('Unit Tests') { ... }\n    stage('Integration Tests') { ... }\n    stage('E2E Tests') { ... }\n}\n\n// ✅ 推荐：使用 failFast 快速反馈\nstage('Tests') {\n    failFast true\n    parallel { ... }\n}\n\n// ✅ 推荐：Matrix 排除无效组合\nmatrix {\n    axes { ... }\n    excludes {\n        exclude {\n            // 排除不支持的组合\n        }\n    }\n}\n```\n\n#### 2.13.5 性能优化建议\n\n1. **合理使用 Agent**\n\n   ```groovy\n   pipeline {\n       agent none  // 不在全局分配\n       stages {\n           stage('Build') {\n               agent any  // 仅在需要时分配\n           }\n       }\n   }\n   ```\n\n2. **使用 stash/unstash 传递构建产物**\n\n   ```groovy\n   stash includes: '**/target/*.jar', name: 'app'\n   unstash 'app'\n   ```\n\n3. **设置合理的超时**\n\n   ```groovy\n   options {\n       timeout(time: 1, unit: 'HOURS')\n   }\n   ```\n\n4. **并行执行独立任务**\n\n   ```groovy\n   parallel {\n       stage('Unit Tests') { ... }\n       stage('Lint') { ... }\n   }\n   ```\n\n---\n\n**第二章完整小结**：\n\n本章详细介绍了 Jenkins Pipeline 的完整语法体系：\n\n- ✅ **When 条件**：9 种内置条件 + 组合条件 + 执行时机控制\n- ✅ **Sequential Stages**：顺序嵌套阶段构建复杂流程\n- ✅ **Parallel**：并行执行 + failFast 快速失败\n- ✅ **Matrix**：多维度矩阵构建 + 智能排除\n- ✅ **Script 块**：声明式中嵌入脚本式逻辑\n- ✅ **Scripted Pipeline**：完全的 Groovy DSL 支持\n- ✅ **最佳实践**：性能优化和代码规范\n\n掌握这些语法，您就可以构建任何复杂度的 CI/CD Pipeline！\n\n---\n\n---", "subs": ["2.13.1 CPS 与重启恢复边界", "2.13.2 选择合适的 Pipeline 类型", "2.13.3 When 条件使用技巧", "2.13.4 Parallel/Matrix 使用建议", "2.13.5 性能优化建议"]}]}, {"title": "第三章：常用插件详解", "sections": [{"title": "3.1 Git 插件", "content": "#### 基本用法\n\n```groovy\ngit branch: 'main',\n    credentialsId: 'github-creds',\n    url: 'https://github.com/user/repo.git'\n```\n\n#### 高级特性\n\n**多仓库管理**：\n\n```groovy\ndir('app') {\n    git url: 'https://github.com/user/app.git'\n}\ndir('config') {\n    git url: 'https://github.com/user/config.git'\n}\n```\n\n**浅克隆**：\n\n```groovy\ncheckout([\n    $class: 'GitSCM',\n    extensions: [[$class: 'CloneOption', depth: 1, shallow: true]]\n])\n```\n\n---", "subs": ["基本用法", "高级特性"]}, {"title": "3.2 Credentials Binding 插件", "content": "#### 凭据类型支持\n\n| 类型              | 用途       | 示例              |\n| ----------------- | ---------- | ----------------- |\n| Secret Text       | API Token  | 认证令牌          |\n| Username/Password | 数据库登录 | MySQL、PostgreSQL |\n| SSH Key           | Git访问    | GitHub、GitLab    |\n| Secret File       | 证书文件   | Kubeconfig、证书  |\n\n#### 使用示例\n\n**Secret Text**：\n\n```groovy\nwithCredentials([string(credentialsId: 'api-token', variable: 'TOKEN')]) {\n    sh 'curl -H \"Authorization: Bearer $TOKEN\" https://api.example.com'\n}\n```\n\n**用户名密码**：\n\n```groovy\nwithCredentials([usernamePassword(\n    credentialsId: 'db-creds',\n    usernameVariable: 'USER',\n    passwordVariable: 'PASS')]) {\n    sh '''\n      set +x\n      MYSQL_PWD=\"$PASS\" mysql --user=\"$USER\" --execute='SELECT 1'\n    '''\n}\n```\n\n凭据绑定应尽量贴近使用位置，并为外部请求设置超时。不要把秘密写入命令行参数、归档文件、构建描述或 Workspace 中的普通配置；结束后还要清理工具可能产生的登录缓存。若任务允许不受信任的 Pull Request 修改 Jenkinsfile，该任务不应获得生产凭据。\n\n#### 凭据注入失败如何排查\n\n| 现象 | 可能原因 | 检查方法 |\n| --- | --- | --- |\n| 找不到 Credentials ID | ID 错误或不在 Folder 作用域 | 从任务上下文查看可选凭据，不扩大到 Global 规避 |\n| 绑定成功但认证失败 | 外部凭据已过期或权限不足 | 用专用安全终端验证身份和服务端审计 |\n| 日志出现秘密片段 | Groovy 插值、工具回显或编码绕过掩码 | 立即撤销凭据，保存证据并修复脚本 |\n| 临时文件残留 | Secret File 使用范围过大或清理失败 | 缩小绑定块并检查 Workspace |\n| 并行阶段串用身份 | 共享环境变量或登录目录 | 每个分支独立绑定和工作目录 |\n| Pull Request 获取生产凭据 | 信任模型配置错误 | 分离可信分支任务与外部贡献任务 |\n\n##### 泄露处置\n\n1. 立即在外部系统撤销或轮换身份，不等待 Jenkins 构建结束。\n2. 暂停可能继续使用该凭据的任务和共享库入口。\n3. 查询 Jenkins 使用关系、构建日志、外部认证与操作审计。\n4. 识别凭据可访问的仓库、制品、环境和数据范围。\n5. 删除或限制含秘密的日志与制品，同时保留受控事故证据。\n6. 使用新 Credentials ID 或受控轮换机制恢复，验证旧值失效。\n7. 修复注入、权限和评审流程，记录根因与长期行动。\n\n掩码不是安全边界：Base64、分段输出、工具调试和恶意脚本都可能绕过。真正的边界是最小权限、短生命周期、可信代码路径和可快速撤销。\n\n---", "subs": ["凭据类型支持", "使用示例", "凭据注入失败如何排查"]}, {"title": "3.3 HTTP Request 插件", "content": "#### GET 请求\n\n```groovy\ndef response = httpRequest 'https://api.example.com/status'\nprintln \"Status: ${response.status}\"\n```\n\n#### POST 请求\n\n```groovy\nhttpRequest httpMode: 'POST',\n            url: 'https://api.example.com/data',\n            contentType: 'APPLICATION_JSON',\n            requestBody: '{\"key\":\"value\"}',\n            timeout: 15,\n            validResponseCodes: '200:299'\n```\n\n#### 认证请求\n\n```groovy\nhttpRequest url: 'https://api.example.com/data',\n            authentication: 'api-credentials',\n            timeout: 15,\n            validResponseCodes: '200:299'\n```\n\n只对明确的瞬时错误做有限重试，例如连接重置或服务端短暂不可用。认证失败、权限不足、请求格式错误和业务校验失败应立即停止；请求体与响应体可能含敏感数据，默认不要打印完整内容。\n\n---", "subs": ["GET 请求", "POST 请求", "认证请求"]}, {"title": "3.4 Kubernetes 插件", "content": "#### Pod Template\n\n```groovy\npodTemplate(containers: [\n    containerTemplate(\n        name: 'maven',\n        image: 'maven:3.9.9',\n        command: 'sleep',\n        args: '99d'\n    )\n]) {\n    node(POD_LABEL) {\n        container('maven') {\n            sh 'mvn clean package'\n        }\n    }\n}\n```\n\n#### YAML 定义\n\n```groovy\ndef podYaml = '''\napiVersion: v1\nkind: Pod\nspec:\n  containers:\n  - name: build\n    image: gradle:8.14.0\n    command: ['sleep']\n    args: ['infinity']\n'''\n\npipeline {\n    agent {\n        kubernetes { yaml podYaml }\n    }\n    stages {\n        stage('Build') {\n            steps {\n                container('build') {\n                    sh 'gradle build'\n                }\n            }\n        }\n    }\n}\n```\n\n#### 资源限制\n\n```groovy\ncontainerTemplate(\n    name: 'build',\n    image: 'maven:3.9.9',\n    resourceRequestCpu: '500m',\n    resourceRequestMemory: '1Gi',\n    resourceLimitCpu: '1000m',\n    resourceLimitMemory: '2Gi'\n)\n```\n\n---", "subs": ["Pod Template", "YAML 定义", "资源限制"]}, {"title": "3.5 备份能力与 ThinBackup 边界", "content": "#### 配置要点\n\n**备份目录**：`/var/jenkins_backup`\n\n**备份计划**（Cron）：\n\n```\nH 2 * * *    # 每天凌晨2点\n```\n\n**示例保留策略**：\n\n- 完整备份：保留 7 天\n- 差异备份：保留 30 天\n\n#### ThinBackup 能做什么、不能做什么\n\n- 可按计划备份系统与任务配置，并选择部分构建记录。\n- 默认不备份 Workspace 和归档制品，这些内容应由可重建流程或外部制品库承担。\n- `credentials.xml` 中的密文依赖 Controller 密钥；若没有安全备份 `secrets/` 与主密钥，迁移后凭据可能无法解密。\n- 插件备份不是一致性快照的自动保证。长任务、文件变更和外部存储都需要纳入恢复设计。\n\n#### 恢复流程\n\n1. 在隔离环境准备与源环境兼容的 Jenkins 和 Java。\n2. 恢复 `JENKINS_HOME`、密钥与经过记录的插件版本。\n3. 以只允许管理员访问的方式启动，检查升级日志和插件加载失败。\n4. 验证身份登录、凭据解密、Folder 权限和代表性 Pipeline。\n5. 记录恢复耗时、缺失项和回退条件，再决定是否恢复服务流量。\n\n---", "subs": ["配置要点", "ThinBackup 能做什么、不能做什么", "恢复流程"]}, {"title": "3.6 插件最小化、升级与回滚", "content": "#### 从能力需求出发选择插件\n\n先写明缺少的能力，再比较 Jenkins 核心、现有插件、共享库或外部平台能否满足。插件会运行在 Controller 进程内并形成依赖链，新增一个插件不仅增加一个页面，也增加升级、兼容、安全公告和恢复成本。\n\n| 评估项 | 上线前证据 | 不通过时的处理 |\n| --- | --- | --- |\n| 维护状态 | 官方插件站的维护者、更新与弃用标记 | 寻找替代方案或保留在隔离旧实例 |\n| 兼容性 | 最低 Jenkins 版本、依赖插件和 Java 要求 | 先升级测试环境，不在生产强装 |\n| 权限与秘密 | 插件读取的凭据、网络与文件权限 | 缩小作用域或改用外部服务 |\n| 可恢复性 | 配置能否备份、JCasC 支持与回退步骤 | 建立手工恢复记录后再上线 |\n| 可观测性 | 失败日志、指标和健康检查 | 补齐告警与排障手册 |\n\nBlue Ocean 已被标记为弃用，不再获得常规功能增强。已有实例可基于兼容性继续使用，但新平台不把它作为默认依赖；流水线编写优先使用 Snippet Generator 和源码评审，可视化按需评估 Stage View 或 Pipeline Graph View。\n\n#### 插件安全建议\n\n1. 导出当前插件与版本清单，阅读 Jenkins 安全公告和依赖变化。\n2. 在与生产相近的测试 Controller 升级，运行启动检查和代表性任务。\n3. 同一变更窗口只处理可归因的一组插件，避免一次升级整条依赖树后无法定位。\n4. 变更前备份 `JENKINS_HOME`、密钥与插件清单，写清 Jenkins 核心、Java 和插件的整体回退组合。\n5. 生产升级后观察 Controller 日志、队列、Agent 连接和任务失败率，再结束观察窗口。\n\n#### 插件升级事故如何回退\n\n插件运行在 Controller JVM 内，一个依赖冲突可能让多个能力同时失效。回退前先进入 Quiet Down，保存启动日志、插件加载错误、当前插件目录和变更记录，避免丢失根因证据。\n\n```mermaid\nflowchart TD\n    A[插件升级异常] --> B[停止新任务进入]\n    B --> C[保存日志和插件清单]\n    C --> D{Controller能稳定启动}\n    D -- 是 --> E[禁用受影响能力并验证]\n    D -- 否 --> F[停止Controller]\n    E --> G{可单插件安全回退}\n    G -- 是 --> H[恢复兼容插件组合]\n    G -- 否 --> I[恢复变更前Home快照]\n    F --> I\n    H --> J[运行代表性任务]\n    I --> J\n    J --> K[观察队列Agent和失败率]\n```\n\n##### 回退判断\n\n- 若插件页面功能异常但 Controller 稳定，先验证是否能禁用该插件及其依赖能力。\n- 若插件升级伴随核心或 Java 升级，不要只复制一个旧 `.jpi`，应恢复经过验证的整体组合。\n- 若插件写入新格式配置，旧插件是否可读必须从官方说明或恢复演练确认。\n- 恢复后不仅检查页面，还要运行使用该插件的代表性 Pipeline Step。\n- 将事故暴露出的缺失测试补入升级门禁，并更新插件所有者与替代计划。\n\n#### 插件面的长期收敛\n\n每季度按“仍有任务使用、能力不可替代、维护状态可接受”三个条件复核。计划删除插件时，先搜索 Job、Jenkinsfile、共享库和 JCasC 引用，在测试 Controller 卸载并重启验证，再进入生产变更。仅禁用而长期保留仍可能留下依赖和安全风险，应为迁移设定完成日期。\n\n#### 插件引入记录模板\n\n```yaml\npluginId: example-plugin\ncapability: 需要解决的明确平台能力\nowner: platform-team\nalternatives:\n  core: evaluated\n  sharedLibrary: evaluated\n  externalService: evaluated\nmaintenance:\n  status: verified-on-official-plugin-site\n  minimumJenkins: verified\n  dependencies: recorded\nsecurity:\n  credentials: none-or-described\n  networkAccess: described\n  controllerFileAccess: described\nvalidation:\n  testController: passed\n  representativeJobs: passed\nrollback:\n  previousPluginSet: recorded\n  homeSnapshot: available\nreviewAt: next-quarter\n```\n\n记录中的“verified”必须对应变更时实际查看的官方插件站和测试结果，不能复制旧文档结论。每次 Jenkins LTS 或 Java 升级都重新评估最低版本；插件虽然没有直接改动，也可能因依赖升级而改变行为。\n\n##### 删除前的负向检查\n\n- 测试 Controller 重启后没有 `Failed Loading plugin` 和缺失类异常。\n- Job 配置页面没有因未知插件节点丢失关键配置。\n- Jenkinsfile 和共享库不再调用该插件提供的 Step。\n- JCasC 不再包含该插件的配置键。\n- 替代能力的失败、超时、权限与回退路径已经验证。\n- 生产变更保留原插件文件和 Home 快照到观察窗口结束。\n\n---\n\n**第三章小结**：\n\n- Git 插件是源码管理的核心\n- withCredentials 提供安全的凭据管理\n- HTTP Request 实现外部系统集成\n- Kubernetes 插件支持云原生构建\n- 备份插件只能辅助备份，恢复演练才证明可恢复性\n\n**推荐学习路径**：\n\n1. 掌握 Git 和 Credentials 基础\n2. 学习 Pipeline 集成\n3. 探索 Kubernetes 动态 Agent\n4. 建立完善的备份策略\n\n---\n\n**Jenkins 基础册结束**\n\n**学习成果**：\n\n- 理解 Jenkins 三种安装方式及其安全边界\n- 理解 Pipeline、共享库和 CPS 的核心约束\n- 能按能力、维护状态和回退成本治理插件\n- 能为 Controller、Agent、凭据和备份建立运行规则\n\n**下一步建议**：\n\n1. 搭建实验环境实践\n2. 创建示例 Pipeline 项目\n3. 继续学习《Jenkins 持续交付实践》，把事件、质量、制品和发布串成完整链路\n4. 持续核对 Jenkins 官方文档、插件站和安全公告", "subs": ["从能力需求出发选择插件", "插件安全建议", "插件升级事故如何回退", "插件面的长期收敛", "插件引入记录模板"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
