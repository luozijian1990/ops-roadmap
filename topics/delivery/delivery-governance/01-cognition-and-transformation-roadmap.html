<style>
  :root{

  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);

  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));

    border-radius:10px;padding:12px 14px;cursor:pointer;

<script id="data" type="application/json">{"title": "交付治理与容量保障学习笔记·第一册：认知与转型决策", "intro": "", "parts": [{"title": "第 1 章 · DevOps 因何而生与它修复的错位", "sections": [{"title": "开发与运维之间的协作断层", "content": "这套笔记讨论的是软件交付链路上的治理问题：一个变更从提交到用户可用，中间要做哪些判断、由谁负责、拿什么证据收尾。四册的推进顺序是——先建立认知与转型判断（本册），再进入工程治理的具体命题（第二册），接着落到度量与平台产品化（第三册），最后是容量与稳定性（第四册）。\n\nDevOps 这个名字经常被当成起点，但它其实是结论。要理解它，先要看清它要解决的那个问题：**开发与运维两类角色在同一条交付链路上各自追求局部最优，最终共同把交付效率压到了最低。**\n\n#### 协作断层不是沟通问题，是目标函数不一致\n\n很多人把开发与运维的摩擦理解为\"沟通不畅\"，于是解法是开会、拉群、搞团建。但真正的成因是结构性错位：两类角色的**考核口径不同**，而变更同时作用于双方。\n\n- **开发侧**的关注点是需求交付量：完成了多少功能、需求状态流转到哪一步。功能一旦进入\"开发完成\"，开发侧的绩效就已经兑现，至于它是否好测试、好运维、好回滚，不在考核范围内。\n- **运维侧**的关注点是稳定性、可用性和安全性：系统不挂、指标达标、事故不发生。而在这三项上，**变更是最大的风险来源**——大多数线上故障都伴随某次变更。\n\n于是双方的最优策略自然分道扬镳，并且互相强化：\n\n```mermaid\ngraph TD\n    A[开发侧考核 需求交付量] --> B[持续堆砌新功能]\n    B --> C[可测试性 可运维性 可回滚性被忽略]\n    C --> D[上线后缺陷与回滚增多]\n    D --> E[运维侧考核 稳定性与可用性受损]\n    E --> F[抬高发布门槛 收紧发布窗口]\n    F --> G[变更积压 交付周期拉长]\n    G --> A\n```\n\n这个循环的关键特征是：**双方都在做对自己正确的事**。开发多交付功能没错，运维保护稳定性也没错。错位发生在接口上——没有人对\"这次变更从提交到用户可用\"这条完整链路负责。\n\n从软件工程的发展脉络看，每一代研发模式都在修上一代留下的口子，而 DevOps 修的是交付出口这一段：\n\n| 阶段 | 组织方式 | 解决了什么 | 遗留了什么 |\n| --- | --- | --- | --- |\n| 瀑布式 | 按需求、开发、测试、运维划分阶段，重流程重管控 | 大规模协作的可管理性，各阶段有明确交付物与标准 | 目标在信息最少的时点被锁定，后期变更代价极高 |\n| 敏捷式 | 目标拆小、小步迭代，测试注入开发过程 | 需求不确定时的响应能力，质量内建在研发环节 | 研发内部变快了，但发布出口仍由另一套节奏控制 |\n| DevOps | 打通开发到运维的协作边界，把交付当作一条链路治理 | 交付出口、责任共担与反馈闭环 | 要求平台、流程、人同时到位，任何一块缺失都会退化 |\n\n敏捷时代的典型症状是：研发迭代速度提上来了，功能却卡在发布环节——迭代产出的价值无法按同样节奏抵达用户。这不是研发不够快，而是**链路上有一段的节拍由另一套目标控制**。\n\n#### 识别断层的六个信号\n\n判断一个组织是否处在断层状态，不需要看组织架构图，看行为就够：\n\n| 信号 | 说明 | 背后的问题 |\n| --- | --- | --- |\n| 发布是需要专门安排的事件 | 发布要挑时间、要提前通知、要暂停其他工作 | 发布不具备日常性，风险未被工程手段消化 |\n| 存在稀缺的发布窗口 | 窗口数量有限，需要排队竞争 | 变更批量变大，单次风险随之放大 |\n| 上线需要多方签字 | 审批链条长，且审批人不了解变更细节 | 用流程约束替代了用工程约束 |\n| 变更失败后先追责再追因 | 复盘从\"谁干的\"开始 | 反馈机制退化为问责机制 |\n| 环境靠手工维护和口头同步 | 环境状态没有声明式描述 | 环境成为不可复现的隐性资产 |\n| 回滚依赖重新构建或手工操作 | 没有可复用的制品与版本 | 恢复时间不可控 |\n\n#### 常见误区与边界\n\n**误区一：把断层当成人的问题。** 换人、加人、强调协作态度，都不改变考核口径不一致这个结构。真正有效的干预是改变约束——把可运维性、可回滚性变成交付完成的必要条件，而不是事后要求。\n\n**误区二：把\"打通\"理解为岗位合并。** 让运维去写业务代码，或者让开发轮流值班，都不等于责任共担。共担的前提是**双方对同一组结果指标负责**，并且有共同可见的证据。\n\n**误区三：认为断层只存在于大公司。** 小团队的断层通常更隐蔽：同一个人既开发又发布，看似没有对立，但因为没有区分\"构建一次\"和\"发布多次\"的边界，变更风险往往被个人经验掩盖，一旦这个人不在，链路就失效。\n\n**边界提醒**：本节的诊断适用于\"变更需要跨越多个角色的责任边界才能到达用户\"的场景。如果交付链路确实只有一个人且变更频率极低，投入完整治理体系的收益有限——这时更该关注的是把手工步骤固化成可重复的流程，而不是引入一套平台。\n\n#### 落地练习\n\n拿当前系统做一次自测，只记录事实不做评价：\n\n1. 列出最近 10 次生产变更，标出每次的**提交时间**、**开始发布时间**、**用户可用时间**。三个时间点之间的差值，就是等待时间。\n2. 统计这 10 次变更中，有多少次回滚或热修复，以及每次的恢复耗时。\n3. 统计这 10 次变更分别经过了几个角色、几次审批。\n4. 检查这些数据是否留存在系统里，还是只能靠回忆重建。\n\n第 4 条最关键：**如果重建这些数据只能靠回忆，说明交付链路目前没有留下可分析的证据**，后面几章讨论的度量与治理都无从下手。", "subs": ["协作断层不是沟通问题", "识别断层的六个信号", "常见误区与边界", "落地练习"]}, {"title": "DevOps 的定义之争与三类误读", "content": "#### 为什么没有官方定义\n\nDevOps 从运动诞生起就没有权威机构给出正式定义，这既是优势也是负担。\n\n优势在于开放性：不限定人群和范围，每个角色都能从自己的立场参与进来，于是关注面不断扩大——从最早的开发与运维协作，扩展到业务侧（BizDevOps）、安全侧（DevSecOps），再到数据、职能等部门。概念的扩张带来了参与度，也带来了生命力。\n\n负担在于认知成本：范围没有边界，新人就无从判断什么属于 DevOps、什么不属于。概念越宽，越难回答\"我们做到哪一步了\"。这也解释了为什么同一个词在不同组织里含义可以完全不同——**在缺少边界的地方，每个人都会按自己的经验填充定义。**\n\n#### 三类常见误读及其代价\n\n比\"定义不清\"更麻烦的是\"错误定义被当成共识\"。下面三类误读在实践中出现频率最高：\n\n| 误读 | 典型说法 | 引发的实际后果 | 更可用的表述 |\n| --- | --- | --- | --- |\n| 工具化误读 | 平台建好了，DevOps 就落地了 | 采购与集成替代了组织改进；工具上线后指标不动 | DevOps 是组织交付能力，平台只是承载物之一 |\n| 角色误读 | DevOps 就是开发兼运维，或者运维转开发 | 职责被合并，但授权、技能、值守机制没有配套 | 结果责任共担，岗位不必合并 |\n| 概念通胀 | 一切好实践都属于 DevOps，不好的都是反模式 | 无法排序，也无法验收；任何工作都能挂上 DevOps 的名义 | 用可观测的结果界定范围，而不是用实践清单 |\n\n三类误读有一个共同点：**它们都无法被证伪**。工具化误读可以用\"工具上线了但指标没变\"来检验，后两类则容易停留在争论里。\n\n#### 一个可操作的定义\n\n与其争论定义，不如选一个能指导行动的。把 DevOps 看作三个维度的乘积，而不是任意一个维度：\n\n```text\nDevOps = 平台 Platform × 流程 Process × 人 People\n        以 CALMS 文化为指引\n        目标：快速交付价值 + 具备持续改进能力\n```\n\n这个表述的价值在于它是**乘法关系**：任何一个维度为零，结果就是零。\n\n- 只有平台没有流程：工具能力闲置，团队仍按老流程走，自动化只覆盖了局部步骤。\n- 只有流程没有平台：流程靠人遵守，无法规模化，一旦人员变动就退化。\n- 有人和平台但文化缺失：指标被用于排名，数据开始失真，改进变成表演。\n\n#### 如何判断一个定义是否可用\n\n不必追求\"正确的定义\"，只需要用三个问题筛掉不好用的定义：\n\n1. **能否区分做与没做？** 如果一个定义让\"什么也没改变\"和\"真正改善了交付\"都能算合规，它就不可用。\n2. **能否指导取舍？** 当资源有限时，一个好定义应该能告诉你先做什么。比如\"先建平台还是先改流程\"，在乘法模型里有明确答案：先补最短的那块。\n3. **能否被观察？** 定义的每个维度都应对应可采集的证据。如果某个维度只能靠主观评价，说明它还没被拆到可操作的程度。\n\n练习：把你所在组织当前对 DevOps 的口头定义写下来，用上面三问逐条检验，记录哪一问答不上来。答不上来的那一问，通常就是下一阶段最该投入的方向。", "subs": ["为什么没有官方定义", "三类常见误读及其代价", "一个可操作的定义", "如何判断一个定义是否可用"]}, {"title": "用 CALMS 划清 DevOps 与工具平台的边界", "content": "#### 五个要素分别约束什么\n\nCALMS 是判断\"是不是真的在做 DevOps\"最实用的框架，因为它把抽象的文化拆成了可观察的五项：\n\n| 要素 | 核心主张 | 缺位时的表现 | 可观察信号 | 常见切入点 |\n| --- | --- | --- | --- | --- |\n| Culture 协作 | 交付结果由跨角色共同负责 | 出事先划责任边界；改进事项互相推诿 | 复盘是否产出可执行的改进项；跨角色是否共同对指标负责 | 把可运维性、可测试性写入交付完成定义 |\n| Automation 自动化 | 重复且易错的环节交给机器 | 关键步骤依赖人工执行与口头确认 | 从提交到发布的人工触点数量 | 先把最频繁、最易错的一步自动化 |\n| Lean 精益 | 关注价值流动，消除等待与返工 | 优化只做局部，交付周期不变 | 等待时间占总周期的比例 | 从价值流图上定位最长等待段 |\n| Measurement 度量 | 用数据判断改进是否有效 | 决策靠感觉与个案 | 是否存在可复现的基线数据 | 先建立一条变更链的完整时间线 |\n| Sharing 共享 | 实践、工具、失败经验在组织内流转 | 各团队重复造轮子，同样的坑反复踩 | 是否有可复用的内部模板与复盘库 | 把一次故障的处置过程沉淀成可检索的记录 |\n\n#### 五要素是闭环，不是清单\n\nCALMS 最容易犯的错是当成待办清单逐项打勾。实际上它是一套相互支撑的闭环：度量为改进提供方向，自动化为改进提供杠杆，精益保证改进打在了瓶颈上，协作保证改进能跨边界落地，共享让改进不必重复付学费。\n\n```mermaid\ngraph LR\n    M[Measurement 度量] -->|指出差距| L[Lean 精益]\n    L -->|定位瓶颈| A[Automation 自动化]\n    A -->|释放人力| C[Culture 协作]\n    C -->|经验流转| S[Sharing 共享]\n    S -->|复用与反馈| M\n```\n\n闭环里任何一条边被切断，整圈都会退化。最常见的断裂是 **Culture → Sharing** 这一段：团队不认为失败经验值得公开，于是共享变成单向的文档下发，度量和自动化拿不到真实的失败样本。\n\n#### DevOps 平台、自动化运维平台、持续交付平台的边界\n\n这三个概念经常被混用，但它们的输入、输出和责任范围并不同：\n\n| 名称 | 主要输入 | 主要输出 | 边界外的事 |\n| --- | --- | --- | --- |\n| 自动化运维平台 | 运维操作需求、主机与中间件清单 | 批量化、可重复的执行结果 | 不负责需求到制品的构建过程 |\n| 持续交付平台 | 代码提交、构建配置、部署描述 | 可追溯的制品与可回滚的发布记录 | 不负责运行期的容量与故障处置 |\n| DevOps 平台 | 上述两者的能力，加上流程约束与度量数据 | 端到端的交付证据与改进依据 | 不能替代组织协作方式的改变 |\n\n一个实用的判断方法：**看它能否回答\"这次变更从提交到用户可用，中间发生了什么\"**。能回答的才接近 DevOps 平台；只能回答\"某类操作执行成功了\"的，是自动化工具。\n\n#### 只做 Automation 会怎样\n\n只投入自动化是最常见的路径依赖，因为它是五要素里最容易采购、最容易展示成果的一项。但它单独推进会有明确的退化路径：\n\n1. 自动化覆盖了执行步骤，但没有覆盖判断步骤，于是人工审批仍是瓶颈；\n2. 为了绕开瓶颈，审批被放宽，风险直接进入生产；\n3. 故障发生后又收紧审批，回到起点；\n4. 反复几轮之后，团队得出\"自动化没用\"的结论，实际上是**自动化被放在了错误的环节**。\n\n对应的判断标准是：如果一个自动化改造完成后，端到端的**等待时间**没有下降，那么它优化的是处理时间，而没有触及瓶颈。等待时间才是这条链路上真正的大头。", "subs": ["五个要素分别约束什么", "五要素是闭环", "DevOps 平台、自动化运维平台、持续交付平台的边界", "只做 Automation 会怎样"]}, {"title": "数字化转型中的投入回报与论证方式", "content": "#### 软件角色的变化\n\n软件在企业中的位置在过去十几年发生了性质变化：从企业内部的支持系统和成本中心，变成了面向用户的**服务载体和收入触点**。用户对服务的第一印象来自软件本身——它是否可用、是否顺手、是否出错，直接等同于对企业的评价。\n\n这个变化带来两个后果：\n\n1. **交付能力成为经营能力的一部分**，而不只是技术部门的内部效率。响应市场变化的速度取决于变更能否快速、安全地到达用户。\n2. **效率本身变成可经营的资产**。当交付链路存在大量等待与返工时，被浪费的是可量化的产能。\n\n同时，外部环境的不确定性在提高。用 VUCA 描述这个环境比较准确：\n\n| 维度 | 含义 | 对交付的要求 |\n| --- | --- | --- |\n| Volatility 易变性 | 外部条件变化快 | 变更成本要低，能随时调整 |\n| Uncertainty 不确定性 | 未来状态难以预测 | 方案要可回退，允许试错 |\n| Complexity 复杂性 | 系统与依赖关系庞杂 | 要有端到端的可观测与可追溯 |\n| Ambiguity 模糊性 | 因果关系不清晰 | 要能通过实验和小流量验证假设 |\n\n这四点共同指向同一个结论：**交付效率与质量需要同时改善，不能互相交换。**\n\n#### 用共同语言论证价值\n\n在组织内部推动交付改进，最大的障碍往往不是技术，而是无法把收益讲成管理层能评估的语言。业内通用的做法是使用一组已被广泛接受的结果指标，把\"改进\"翻译成可比对的数字。\n\n| 指标 | 定义 | 反映的方面 |\n| --- | --- | --- |\n| 部署频率 | 单位时间内向生产部署的次数 | 交付效率 |\n| 变更前置时间 | 从代码提交到成功运行在生产环境的时长 | 交付效率 |\n| 服务恢复时间 | 从线上故障发生到服务恢复的时长 | 交付质量 |\n| 变更失败率 | 部署失败或部署后导致服务降级的比例 | 交付质量 |\n\n这四项的价值不在于具体数值，而在于它们**把效率和质量的权衡关系摆到了台面上**。行业内多年统计的一个稳定观察是：这四项表现并不互相牵制，表现为\"要快要稳\"的二选一是伪命题——但在缺少度量时，团队只能凭个案争论。\n\n需要注意：这四个指标用于衡量**交付系统**，不适合直接用于个人绩效排名。一旦与个人考核挂钩，数据会以各种方式失真（详见第三册第 9 章对度量失真的讨论）。\n\n#### 立项论证的骨架\n\n推动转型需要一份能被批准的说明。可用的结构比华丽的措辞更重要：\n\n```text\n1. 现状基线\n   - 最近 N 次变更的：提交到发布耗时、发布到可用耗时、失败与回滚次数\n   - 数据来源与采集方式（必须可重复采集）\n\n2. 瓶颈判断\n   - 从基线上看，时间主要消耗在哪一段：等待还是处理\n   - 该段的当前约束是什么（人力、窗口、环境、审批）\n\n3. 干预方案\n   - 只针对瓶颈段设计一个干预，说明它改变了什么约束\n   - 明确不做什么（避免范围蔓延）\n\n4. 预期与停止条件\n   - 预期改哪个指标、改到什么程度\n   - 什么情况下判定无效并停止（前置约定，避免事后找理由）\n\n5. 成本\n   - 人力、工具、迁移期效率下降、学习成本\n```\n\n第 4 条里的\"停止条件\"最容易被省略，但它决定了这次投入是实验还是消耗。没有停止条件的改进项目，通常会在效果不明显时不断追加资源，最终既没有结论也没有复用价值。\n\n#### 收益测算示例\n\n下面是一个演示用的测算，其中所有数字都是**示例假设**，不是任何组织的实测数据：\n\n```text\n假设条件（示例）\n  团队规模            10 人\n  每人每周可投入交付相关工时   20 小时\n  变更平均等待占比        60%\n  自动化与流程优化后可压缩等待  30%\n\n当前每周等待耗时 = 10 × 20 × 60% = 120 人时\n优化后每周等待耗时 = 120 × (1 - 30%) = 84 人时\n每周回收 = 36 人时\n```\n\n这个测算的意义不在于数字本身，而在于它把\"提升交付效率\"这种不可评估的说法，转换成了\"每周回收多少可支配产能\"这种可以核对的说法。使用时必须同时给出假设来源，并说明哪一项假设最脆弱——上例中最脆弱的是\"等待占比 60%\"，它应当来自真实基线而非估算。\n\n#### 常见论证误区\n\n| 误区 | 表现 | 后果 |\n| --- | --- | --- |\n| 没有基线，先承诺结果 | 直接给出\"提升 50% 效率\"的目标 | 无法验证，也无法在过程中修正方向 |\n| 只算收益不算成本 | 不提及迁移期效率下降与学习成本 | 中期出现预期外阻力时项目失去信任 |\n| 把工具采购当作改进方案 | 用平台上线作为完成标志 | 工具上线而指标不动，投入无法回收 |\n| 用行业数据替代自身数据 | 引用外部报告说明差距很大 | 无法回答\"我们的瓶颈在哪\"，改进无的放矢 |\n| 指标与个人绩效挂钩 | 用部署频率排名团队 | 数据失真，团队开始拆分变更以制造好看的数字 |\n\n#### 落地练习\n\n为当前团队写一份不超过一页的立项说明，只需填上面骨架的五项。如果第 1 项\"现状基线\"填不出来，先不要往下写——**先去采集基线**。基线缺失是这类项目最常见的失败起点，因为它让后续所有判断都失去参照。", "subs": ["软件角色的变化", "用共同语言论证价值", "立项论证的骨架", "收益测算示例", "常见论证误区", "落地练习"]}]}, {"title": "第 2 章 · 持续交付的定位与约束条件", "sections": [{"title": "持续交付的交付对象与反馈环", "content": "上一章把\"为什么要做\"讲到了立项这一层，但立项通过之后立刻会遇到一个更具体的问题：持续交付的验收对象是什么。如果这一条没定清楚，项目很容易变成\"把流水线搭起来\"——工具齐了，指标没动。\n\n#### 定义与实际目标\n\n持续交付常见的一个表述是：把软件开发人员的一个好想法，以最快的速度交付给用户。这个说法容易让人以为目标是\"快\"，但它真正要建立的是**反馈环**。\n\n```\nCoding -> Build -> Packing -> Testing -> Deploy -> Rollout\n   研发团队                                    ->    最终用户\n        ^                                               |\n        +---------------- 反馈（价值验证） --------------+\n```\n\n流水线只是环的一半。如果没有把用户的真实使用结果回传回来，这条流水线只能证明\"改动被部署了\"，不能证明\"改动有价值\"。所以持续交付的完整目标是：\n\n> 通过持续交付新的软件版本，验证新想法与软件改动的正确性，并衡量这些改动对业务价值的影响。\n\n这里说的业务价值是收入、日活、转化率这类业务指标。**把交付能力与业务指标连起来，是持续交付区别于\"自动化部署\"的分水岭。**\n\n#### 一个关键判据：代码上线与业务上线解耦\n\n判断一套持续交付体系是否成立，有一个很硬的标准：**代码上线和业务上线是否可以分开决定。**\n\n- 如果功能必须\"代码合并的那一刻\"就对所有用户生效，那么代码上线与业务上线是绑定的，任何一次合并都是业务决策，风险无法分批消化。\n- 如果功能可以先随代码上线、再按业务节奏对用户开放，那么两次决策解耦，工程风险和业务风险分别管理。\n\n这一条也解释了为什么功能开关、灰度能力不是\"额外的锦上添花\"，而是持续交付的组成部分——它们是把一次决策拆成两次的手段。\n\n#### 显性价值与隐性价值\n\n持续交付的价值常被简化成\"交付速度变快\"，但不同角色实际获得的收益并不相同。按角色拆开看，收益更容易被论证：\n\n| 角色 | 显性诉求 | 隐性价值 | 可验证信号 |\n| --- | --- | --- | --- |\n| 技术管理者 | 交付速度与质量 | 技术选型变得可验证；标准与流程有了落地载体；跨部门有了统一接口 | 同一标准在多个团队的实际执行率 |\n| 业务负责人 | 快速获得市场反馈 | 能实时看到进度与质量，不再依赖口头汇报；产品随时处于可发布状态 | 从提出需求到用户可用的端到端时长 |\n| 测试与质量 | 减少回归负担 | 测试与生产环境行为差异收敛，减少\"测过但线上仍有问题\"的情形 | 缺陷在测试阶段与生产阶段的分布比例 |\n| 研发工程师 | 减少重复工程工作 | 团队规范（代码风格、检查项、测试脚本）以可执行形式沉淀，而不是靠记忆 | 新人上手独立提交变更所需时间 |\n| 运维与 SRE | 降低变更风险 | 恢复手段可复用，故障影响时间由恢复时间主导 | 变更失败后的恢复耗时分布 |\n\n注意表格最后一列：每一项价值都配了一个**可采集的信号**。没有信号的收益无法被验收，也无法在下一轮改进中被复盘。\n\n#### 团队侧的三个隐性收益\n\n除了角色视角，还有几项收益属于团队整体：\n\n1. **知识以可执行形式传承。** 工作流程被固化进流水线，代码规范被固化成静态检查项，测试经验被固化成自动化用例。人员流动时，这些资产不随之流失。\n2. **工程问题从业务研发中剥离。** 持续交付体系可以被看作与中间件同一性质的抽象层——区别只在于中间件解决架构问题，它解决工程问题。团队不必反复处理\"申请测试机、准备编译环境\"这类与业务无关的事务。\n3. **工作节奏变平稳。** 实施初期因为要适应新流程会有一次效率下降，之后随自动化程度提高而回升并稳定，从而避免发布前夕集中赶工的极端节奏。\n\n#### 难点：整体价值难以量化\n\n一个现实问题是：持续交付的整体价值很难直接量化。原因是影响交付速度的因素太多，无法把改善归因到单一举措上；而可量化的部分（编译耗时、发布耗时、回滚耗时）又只覆盖了价值的一小部分，标准统一、流程改造、环境治理这些收益都没有体现。\n\n实践中更可行的做法是**换一个代理指标**：不去度量\"整体提升了多少\"，而是维护一份清单，列出当前研发人员无法自助完成、必须依赖他人或等待排期的事项。例如：\n\n```text\n自助阻碍清单（示例条目）\n- 开发无法按需获取隔离的测试环境\n- 生产回滚后需要人工同步代码分支状态\n- 预发布流量无法自动分离，需要人工导流\n- 新增环境需要提交工单等待基础设施排期\n- 变更失败后无法自助查看上一次成功版本的完整配置\n```\n\n这份清单的价值在于：\n\n- **每条都可验证**：事项存在与否是事实判断，不依赖主观评价。\n- **天然可排序**：按发生频率和阻塞时长排序即可定优先级。\n- **可直接当目标用**：把\"消灭清单中的条目\"作为目标、把拆解出的动作作为关键结果，就能把难以量化的价值转换成可考核的工作项。\n\n要注意这份清单会不断变长、也会超出纯技术范畴（可能涉及权限、流程、组织授权）。这不是问题——**清单变长说明观察粒度变细了**，而条目本身的消灭过程就是持续交付落地的过程。\n\n#### 常见误区\n\n| 误区 | 表现 | 修正方向 |\n| --- | --- | --- |\n| 把流水线搭建当作目标 | 工具链完整但交付周期不变 | 把端到端时长作为验收对象 |\n| 只做自动化不做解耦 | 部署很快，但功能仍必须整批上线 | 先补功能开关与灰度能力 |\n| 用\"整体提升了多少\"作为唯一口径 | 无法归因，结论不可信 | 用自助阻碍清单作为代理指标 |\n| 把工程性收益排除在汇报之外 | 只讲速度，不讲风险与人力 | 按角色列收益并配可采集信号 |\n\n#### 落地练习\n\n列出当前团队的\"自助阻碍清单\"，只写事实不写评价，每条注明：**谁被阻塞、发生频率、当前绕过方式**。写完按频率排序，取前三项作为下一阶段的改进候选。如果一份清单列不出 5 条以上，通常说明观察粒度还不够细，或者团队已经习惯了绕过阻碍而不再把它当作问题。", "subs": ["定义与实际目标", "一个关键判据", "显性价值与隐性价值", "团队侧的三个隐性收益", "难点：整体价值难以量化", "常见误区", "落地练习"]}, {"title": "持续集成、持续交付、持续部署、持续发布的边界", "content": "#### 四个概念各自的结束条件\n\n这四个词在日常生活中被大量混用，但它们指向流水线上不同的段落，混用会直接导致验收标准错位——比如用\"是否自动部署\"来验收一个本该以\"可发布\"为目标的阶段。\n\n| 概念 | 输入 | 输出 | 结束条件 | 典型责任主体 |\n| --- | --- | --- | --- | --- |\n| 持续集成 CI | 代码提交、依赖、构建配置 | 通过验证的构建结果与检查报告 | 构建与自动化检查通过，产物可在受控环境运行 | 研发团队 |\n| 持续交付 CD | 已验证的构建结果、环境与配置 | 处于**可发布状态**的候选版本 | 版本随时可以发布，且发布动作已被验证 | 研发 + 测试 + 平台 |\n| 持续部署 | 可发布版本、发布策略 | 运行在生产环境的新版本 | 新版本在生产可用并通过观察窗口 | 平台 / 运维 |\n| 持续发布 | 可运行的新版本、放量策略 | 面向用户逐步生效的功能 | 放量达到目标比例且业务指标正常 | 业务 + 平台 |\n\n四个概念是递进包含的关系，不是同义词：\n\n```mermaid\ngraph LR\n    A[持续集成 可运行的构建结果] --> B[持续交付 随时可发布的候选版本]\n    B --> C[持续部署 新版本已运行在生产]\n    C --> D[持续发布 功能已对目标用户生效]\n```\n\n关键区分点在 **B → C**：持续交付的产出是\"可发布\"，不是\"已发布\"。一个团队完全可能做到随时可发布，同时出于业务原因选择每周只发布一次——这仍然是持续交付。\n\n#### 一个常被忽略的中间态：可交付但不自动部署\n\n把 CI 与持续部署直接等同，会让两类问题被掩盖：\n\n1. **交付能力本身的问题**：环境不一致、配置靠手工、回滚没验证过。这些会在\"不自动部署\"的组织里长期潜伏，因为生产变更频率低，问题的暴露概率也低。\n2. **业务节奏的问题**：变更需要配套运营动作、需要避开业务高峰。这类约束不应该被工程手段\"消灭\"，而应该通过解耦（代码上线与业务上线分离）来容纳。\n\n因此判断一个组织停在哪个阶段的正确方法，不是看有没有自动化部署，而是看**在需要的时候能否随时发布，且失败后能否在可接受时间内恢复**。\n\n#### 落地次序：为什么常从\"持续部署\"切入\n\n概念上的顺序是 CI → 持续交付 → 持续部署，但从实践角度，从**持续部署（自动化发布）**切入往往更有效，原因是：\n\n- 发布是链路上最容易观测、也最容易痛的一段。它的改善能被业务侧直接感知，容易获得支持。\n- 发布环节的改造会反向暴露上游问题（构建产物不可复用、环境配置靠手工、测试不充分），从而自然牵引出 CI 与交付能力建设。\n- 恢复能力（回滚、重新部署）与发布链路共用同一套制品与配置管理，投入不会重复。\n\n这个次序与第二册讨论的发布治理、第三册讨论的度量体系是同一件事的三个视角，可以互相参照。\n\n#### 与已有主题的交叉点\n\n- 流水线上各环节的责任边界与接口契约（谁是上游、谁不能替下游补信息），见 [GitOps 第一册 第 8 章](../gitops/01-principles-workflow-and-adoption.md)。\n- CI 的最小闭环、触发契约与制品边界的具体实现，见 [Jenkins 第二册 第 9 章](../jenkins/delivery-practice.md)。\n- 制品在 CI 与 CD 之间的晋级，见 [Jenkins 第二册 第 5 章](../jenkins/delivery-practice.md)。\n\n本节不重复这些机制，只界定概念边界，避免不同笔记给出互相冲突的口径。\n\n#### 常见误区\n\n| 误区 | 后果 |\n| --- | --- |\n| 用\"是否自动部署\"验收持续交付 | 把业务节奏约束误判为技术能力不足，逼出高风险的全自动发布 |\n| 把持续发布等同于持续部署 | 忽略放量策略与业务指标观察，功能一次性全量生效 |\n| 认为 CI 通过就等于可交付 | 缺少环境验证与回滚验证，可发布状态未真正成立 |\n| 术语不统一就开工 | 各部门按各自理解建设，验收时无法对齐 |\n\n#### 落地练习\n\n画出当前团队的交付链路，在图上标出四个概念的边界位置，然后回答三个问题：终点在哪一段？各段的产出物是什么？谁对每段的完成负责？如果同一段被两个团队同时认为\"不是我的责任\"，那正是需要先定义契约的位置。", "subs": ["四个概念各自的结束条件", "一个常被忽略的中间态", "落地次序：为什么常从\"持续部署\"切入", "与已有主题的交叉点", "常见误区", "落地练习"]}, {"title": "拖慢持续交付的六类约束", "content": "推进乏力时，最容易的做法是加大技术投入。但约束往往不在技术上。把影响因素按\"人、事、物\"三类展开，可以定位得更准，其中人和事通常比物更难改。\n\n#### 约束一：组织边界\n\n按职能划分部门是常规做法，不同的职能产生不同的角色，不同的角色掌握不同的资源，不同的资源又形成不同的工作方式。问题出在目标上——产品希望尽快上线，测试希望保留更完整的验证时间，开发希望拿到更大权限，运维需要守住生产环境的控制权。\n\n这些矛盾在各自的小目标下都合理，但它们会整体拖慢交付。**靠部门自身很难解决，因为协调成本高于各自局部最优的收益**，通常需要组织层面的介入。\n\n| 组织介入方式 | 优点 | 代价 | 适用条件 |\n| --- | --- | --- | --- |\n| 设立专职推进机构 | 推进力强，跨部门协调快 | 容易依赖流程管控，反而把流程做得更重 | 规模较大、跨部门摩擦明显 |\n| 设立独立的工程效能团队 | 能长期聚焦交付效率本身 | 人力成本高 | 研发规模足以支撑专职团队 |\n| 以产品为中心重组团队 | 从源头消除职能隔离墙 | 对个人能力要求高，磨合期长 | 中小团队 |\n\n选择哪一种取决于当前的主要矛盾：如果堵点是**决策推不动**，第二种更合适；如果堵点是**各职能目标不一致**，第三种更根本。\n\n#### 约束二：文化层次\n\n组织的协作程度可以分成三个层次，它们决定了持续交付能推进到哪一步：\n\n| 层次 | 特征 | 对持续交付的影响 |\n| --- | --- | --- |\n| 紧密配合 | 各职能按分工协同，交付流水线基本顺畅 | 可以支撑常规交付，但改进动力依赖上级推动 |\n| 集思广益 | 各角色愿为共同目标跳出本职视角，组织透明度提高，能接受互相批评 | 跨职能问题可以被主动发现并解决 |\n| 自我驱动 | 形成自我学习与自我驱动的飞轮，能预见并自发解决问题 | 改进不再依赖外部推动，具备持续演化能力 |\n\n多数组织停留在第一层。第二层之所以难，是因为它要求各部门**承认自身工作方式也是问题的一部分**，而不只是指出别人的问题。诊断方法很直接：看最近三次跨部门问题的复盘，结论是否只指向某一个部门。\n\n#### 约束三：流程\n\n持续交付一定会冲击三类流程，其中审批是最需要谨慎处理的：\n\n| 流程类型 | 特征 | 处理方向 |\n| --- | --- | --- |\n| 耗时较长的流程 | 单次耗时接近或超过迭代周期（例如上线审核占用数天） | 拆解环节，识别其中真正产生价值的部分 |\n| 完全人工的流程 | 全靠人执行，效率低且质量不稳定 | 用自动化替代执行动作 |\n| 信息报备类流程 | 目的是让相关方知晓 | 改为异步通知，不阻塞主流程 |\n\n审批流程要单独讨论，因为它承载的是**授权与责任**，不能简单视为低效环节直接删除。可行的改造方向有三个，按风险从低到高排列：\n\n1. **判断是否真的需要人工审批**：如果某项风险可以被系统机制保证（例如自动化检查、策略校验、制品签名），那么人工审批可以被替换。\n2. **把事前审批改为事后审核**：适合风险可控、可快速回滚的变更。事前审批本质是用时间换确定性，如果恢复能力足够强，这个交换就不划算。\n3. **简化审批**：保留审批但对齐颗粒度，例如从\"每次变更都审批\"改为\"对特定风险类别审批\"。\n\n改造顺序建议先做第 1 条，因为它同时降低了流程负担和人为失误。\n\n#### 约束四：系统架构\n\n系统架构决定了持续集成的成本。三类架构的差异非常明确：\n\n| 架构 | 对持续集成的有利面 | 对持续交付的挑战 |\n| --- | --- | --- |\n| 单体 | 单仓库、单部署包，系统简单时构建快、部署直接 | 规模变大后仓库膨胀，多团队协作冲突剧增；构建时间与部署代价随体积上升；变更触发全量回归 |\n| SOA | 服务拆分后代码管理、构建、测试各自变轻 | 分布式部署导致环境治理与依赖管理复杂；需要额外适配服务发现、配置中心、路由、网关等组件 |\n| 微服务 | 按业务域拆分，可独立部署、松耦合，理论上最利于交付 | 与 SOA 类似的复杂度挑战；若用容器承载则进入另一套治理体系 |\n\n一个实用的判断：**单体架构在团队和代码规模可控时是持续交付成本最低的形态**，一旦规模超出可控范围，问题会集中爆发。因此架构演进的关键不是追赶微服务，而是识别当前是否已经到了\"单体开始失控\"的临界点。\n\n容器化会显著改变这套权衡，其影响涉及环境、镜像与发布方式，见 [Docker 第五册](../../cloud-native/docker/05-application-containerization-and-multi-platform-builds.md)；K8s 上的工作负载与发布方式见 [Kubernetes 第二册](../../cloud-native/kubernetes/02-scheduling-and-workloads.md)。\n\n#### 约束五：部署架构\n\n部署架构是\"最后一公里\"中最容易被低估的一环，它由四件事构成：\n\n1. **是否有统一的部署标准与方式**。同一应用在不同环境、不同设备上的部署方式和验收标准应当一致且可复用；更进一步，组织内所有应用最好共用同一套部署方式。否则每个应用在每套环境上都要单独适配，成本随组合数增长。\n2. **发布编排次序**。在大集群、多机房场景下需要灰度策略支撑（如金丝雀发布、滚动发布），且需要交付系统具备编排能力。发布策略的选型矩阵见本册第 8 章。\n3. **流量拉入拉出机制**。部署过程中要保证业务无损，就需要在实例下线前优雅地摘除流量、在就绪后再接入流量。缺少这一机制的直接后果是：每次交付都伴随可观测的请求异常。\n4. **预热与自检**。部分应用启动后需要先加载缓存、建立连接池才能承载正常流量。交付的完成标准不应是\"进程启动了\"，而应是\"自检通过且能承载流量\"。\n\n#### 约束六：环境与知识承载\n\n这条约束容易被归类为\"基础设施问题\"而不被重视，实际上它的影响面很宽：\n\n- **测试环境的供给方式与隔离程度**直接决定技术选型能否被验证。当环境差异导致测试数据缺乏说服力、或缺少隔离环境导致服务相互干扰时，技术决策就失去了可靠依据，选型变成凭经验拍板。\n- **知识传承的载体**决定了人员流动的影响。团队规范如果只存在于成员记忆和老代码里，就无法被自动校验，也无法随流水线复制。把规范写进静态检查项、把测试经验写进自动化用例，是让知识脱离个人的唯一办法。\n\n#### 约束之间的优先级\n\n六类约束权重不同，处理顺序也不同：\n\n| 约束 | 重要程度 | 改造成本 | 建议顺序 |\n| --- | --- | --- | --- |\n| 组织边界 | 高 | 高 | 先对齐目标，不必先改架构 |\n| 文化层次 | 高 | 极高 | 长期培育，与具体改进同步推进 |\n| 流程 | 高 | 中 | 优先处理审批与全人工流程 |\n| 系统架构 | 中高 | 高 | 随交付改进逐步重构，不单独立项 |\n| 部署架构 | 中高 | 中 | 与发布治理同步，见效快 |\n| 环境与知识 | 中 | 中低 | 可与其他改造并行，收益明确 |\n\n**架构问题比组织问题更容易解决**，因为技术方案容易被验证和接受，且可以随交付改进一起渐进重构；但这不意味着应该先做架构——如果组织目标没对齐，架构改造的收益无法被识别，改进会失去动力。\n\n#### 常见误区\n\n| 误区 | 表现 | 后果 |\n| --- | --- | --- |\n| 只改技术不改组织 | 平台建好了但协作方式没变 | 平台沦为执行工具，价值无法兑现 |\n| 直接删除审批 | 把审批当作纯负担 | 风险失去约束，出事后更严厉的管控回归 |\n| 追赶微服务架构 | 在团队规模不匹配时强行拆分 | 复杂度上升，交付反而变慢 |\n| 把部署完成当交付完成 | 进程启动即标记成功 | 预热未完成导致上线即异常 |\n\n#### 落地练习\n\n对六类约束各打一个 1–5 分（1 表示完全不构成阻碍，5 表示明显阻碍），然后在打分最高的两类中各写一条具体的干预动作。注意区分**阻碍程度**和**改进难度**：先选\"阻碍高但难度中低\"的那一类，通常能最快看到效果并建立改进信心。", "subs": ["约束一：组织边界", "约束二：文化层次", "约束三：流程", "约束四：系统架构", "约束五：部署架构", "约束六：环境与知识承载", "约束之间的优先级", "常见误区", "落地练习"]}, {"title": "持续交付与 DevOps 的合流点与分工", "content": "#### 四种常见读法及其问题\n\n关于 DevOps 是什么，实践中大致有四类读法。它们的共同点是把其中一个侧面当成了整体：\n\n| 读法 | 主张 | 主要问题 | 更完整的表述 |\n| --- | --- | --- | --- |\n| 一组技术 | 自动化运维、持续交付、高频部署、容器等技术集合 | 任何技术都是为解决特定问题而生的，把因果倒置；且只站在工程师视角 | 技术是文化的产物，不是文化的定义 |\n| 一个职能 | 设立 DevOps 部门，招聘同时具备开发与运维技能的工程师 | 忽略了 Dev 与 Ops 的技能本质不同——运维所需的线上处置经验并非开发天然具备 | 目标一致不等于方法一致，共担目标不需要合并岗位 |\n| 一种文化 | 打掉 Dev 与 Ops 之间的墙，通过合作解决责任模糊与互相推诿 | 方向正确，但缺少可操作的抓手，容易停留在口号 | 文化需要被流程、工具和度量承载，否则无法落地 |\n| 一种组织架构 | 把 Dev 与 Ops 放进同一团队，目标同化 | Ops 通常是共享资源，与各 Dev 团队的配比难以满足，全部嵌入不现实 | 视组织具体情况而定，职责可以由成员兼任但要明确 |\n\n这四类读法与第一章讨论的三类误读（工具化、角色化、概念通胀）是同一问题的不同切面，可以对照阅读。\n\n#### 两者的上下位关系\n\n理清关系只需要抓住三条：\n\n1. **目标一致**：都指向快速向用户交付高质量软件。差别在手段与范畴。\n2. **范畴不同**：DevOps 的外延更宽，涉及业务侧（BizDevOps）、安全侧（DevSecOps）、组织与文化；持续交付聚焦研发工程实践。\n3. **实践承载不同**：持续交付是 DevOps 中偏技术与实践的那部分，是 DevOps 理念的具体实现载体。\n\n| 维度 | DevOps 关注 | 持续交付关注 |\n| --- | --- | --- |\n| 范围 | 组织、文化、协作、业务与安全的参与 | 从提交到可发布的工程链路 |\n| 产出 | 可持续演进的交付能力与协作机制 | 处于可发布状态的版本、可复用的制品与流水线 |\n| 判断方式 | 协作行为、责任共担、改进自驱 | 端到端时长、可发布率、恢复耗时 |\n| 失败表现 | 有工具无改进、复盘互相推责 | 流水线完整但交付周期不变 |\n\n#### 二者在落地时的分工\n\n实践中两者并非分头推进，而是同一件事的两个层面：\n\n- **DevOps 提供方向与边界**：确定由谁共同负责交付结果、哪些约束需要组织层面解决、改进的依据是什么。\n- **持续交付提供抓手与证据**：把方向落成具体的流水线、环境、制品与度量数据，同时用这些证据反过来验证方向是否正确。\n\n因此不存在\"先做文化还是先做工具\"的绝对答案：工具改造可以提供组织协作的**共同事实**，减少空谈；而协作机制不改善，工具改造会迅速触到瓶颈。第一章讨论的\"工具先行还是文化先行\"的判据（见第 3 章）正是为解决这个先有鸡还是先有蛋的问题。\n\n#### 与已有主题的交叉点\n\nDevOps、持续交付、CI、CD 与 GitOps 五者如何划分责任边界与接口契约，[GitOps 第一册 第 8 章](../gitops/01-principles-workflow-and-adoption.md) 已给出对照表。本节不重复该对照，只补充一点：**这些概念的分工只有在同一条价值流上才有意义**——脱离具体的变更链路讨论概念边界，很容易退化为名词之争。\n\n#### 常见误区\n\n| 误区 | 后果 |\n| --- | --- |\n| 用 DevOps 名义成立新部门，但职责与原团队重叠 | 责任反而更模糊，出现两套并行的推进力量 |\n| 把持续交付当作 DevOps 的全部 | 忽略组织与文化约束，改进得不到支撑 |\n| 只做文化宣讲不做工程改造 | 无法产生共同事实，协作改善停留在口号层面 |\n| 用概念边界争论代替交付改进 | 讨论成本高但没有可验证产出 |\n\n#### 落地练习\n\n用一页纸回答四个问题：本组织当前最想改善的是**协作方式**还是**交付链路**？谁对交付结果负共同责任？改进的依据来自哪些可采集的信号？下一步动作落在哪一类约束上？四个问题的答案应当互相自洽——如果第一个问题答\"协作方式\"，而下一步动作全是采购工具，说明方向与动作没有对齐。", "subs": ["四种常见读法及其问题", "两者的上下位关系", "二者在落地时的分工", "与已有主题的交叉点", "常见误区", "落地练习"]}]}, {"title": "第 3 章 · 起步姿势、路线图与转型路径", "sections": [{"title": "工具先行与文化先行的适用条件", "content": "#### 争论的实质是问错了问题\n\n\"工具先行还是文化先行\"是转型初期最常见的一对争论，双方通常都能举出支持证据，因此长期没有结论。这个僵局来自提问方式本身：**它把\"先后\"当成了\"主次\"**，隐含假设是两者可以分开排序。\n\n实际约束是：工具和文化分属不同的可操作性层级。\n\n- **文化不可直接改变**。文化是一组行为准则的集合，无法通过宣导、口号或培训直接写入组织。任何试图\"先改变文化\"的方案，都会落回\"先改变行为\"。\n- **工具不能单独生效**。工具把流程固化下来，但只有当流程本身已经被标准化、且行为已经按新流程运转时，工具才产生杠杆。把线下审批原样搬到线上、用敏捷工具执行项目制流程，都能让工具跑起来却看不到效果。\n\n所以真正可操作的起点既不是工具也不是文化，而是**行为**，而驱动行为的是机制。\n\n#### 机制是行为的杠杆\n\n判据可以压缩成一句话：**机制就是人们愿意做、而且做了有好处的事情。**\n\n这个定义有两个必要条件，缺一不可：\n\n| 条件 | 缺失时的表现 |\n| --- | --- |\n| 愿意做（动力） | 靠行政要求推行，执行走形，数据为了达标而制造 |\n| 做了有好处（回报） | 长期投入但看不到收益，热情消退，改进停摆 |\n\n由此可以推出转型初期的设计要点：不要从\"我们应该有什么文化\"出发，而要从\"什么样的机制能让正确行为自然发生\"出发。\n\n一个常见的机制形态是**交接与退回**：上游把服务移交给下游运维之前，必须先自行运营一段时间并达到约定质量指标；移交之后若稳定性不达标，可以退回上游负责。这个机制之所以有效，是因为它改变了**收益归属**——上游为自己的交付质量承担后续成本，于是会自动开始关注可运维性。类似的还有**故障预算**形态的机制：在约定额度内允许出现问题而不追责，超出额度才收紧，从而把\"敢不敢变更\"这个心理约束变成一个可管理的量。\n\n这两种机制的共同点是：它们都不要求任何人先把态度改过来，而是**通过改变规则让新的行为成为理性选择**，文化随之形成。\n\n#### 三个支柱与两两组合\n\n把转型的工作面拆开，可以归纳为三个支柱：人（People）、流程（Process）、平台（Platform）。它们两两组合，分别对应转型的三个工作面：\n\n| 组合 | 产出 | 缺位时的表现 |\n| --- | --- | --- |\n| 人 + 流程 | 文化：在具体流程下形成的、稳定的行为准则 | 流程存在但执行靠人盯，人员变动即失效 |\n| 流程 + 平台 | 工具：被平台承载的标准化流程 | 有平台但没有统一流程，各团队用法不一，平台沦为记录工具 |\n| 平台 + 人 | 培训赋能：同一操作获得同一结果的保障 | 平台能力闲置，使用方式因人而异，跨角色交接仍需专家介入 |\n\n三个组合对应三种可落地的抓手：**文化靠机制设计、工具靠流程标准化、赋能靠培训与反馈**。任何一个抓手单独推进都会有明显的天花板。\n\n#### 平台与工具的分界\n\n平台上线的数量经常被当作转型进度，但平台和工具是两个不同层次的东西。判断一个系统是平台还是工具，看三个特征：\n\n1. **吸附效应**：平台会持续吸收周边的小工具，逐渐成为能力集合体；工具则功能边界固定。\n2. **规模效应**：平台的成本不随使用方数量线性增长；工具通常按团队、按项目重复投入。\n3. **积木效应**：平台提供通用共享能力，能快速拼装出新的业务实现；工具面向具体场景。\n\n一个更直白的区分是分工：**平台负责提供场地、入口、道具和数据分析，工具负责在场地里完成具体演出。** 两者的选择无关优劣：做平台却深度介入具体业务实现，会因无法聚焦而失去复用性；做工具却分散精力去搭平台，工具本身的品质难以精进。\n\n#### 判据：补最短的一块\n\n既然三者缺一不可，推进会面临一个现实问题：人手有限，先补哪一块？\n\n可用的判据是**按最短的一块补**，判断方法如下：\n\n| 观察到的现象 | 最短的一块 | 优先动作 |\n| --- | --- | --- |\n| 流程已标准化但靠人执行，错误率随规模上升 | 平台 | 把标准化流程固化进工具，规则内建于平台 |\n| 平台已具备能力但各团队用法不一 | 流程 | 先统一流程与契约，再扩平台覆盖面 |\n| 有平台有流程，但使用率低、绕开现象普遍 | 人 | 培训与反馈机制，让使用者参与改进平台 |\n| 三者都有，但改进动力不足 | 机制 | 调整激励与责任归属，让正确行为成为理性选择 |\n\n注意最后一行：机制不是第四根支柱，而是让三根支柱互相驱动的动力来源。当三根支柱都在但组织仍在原地，问题通常不在能力上。\n\n#### 常见误区\n\n| 误区 | 表现 | 后果 |\n| --- | --- | --- |\n| 工具决定论 | 把引入工具当作实施路径，用\"我们已经在用某某工具\"回答转型进度 | 工具同质化泛滥，完成从 0 到 1 后停滞，效率没有质变 |\n| 空谈文化 | 反复宣导协作、共担，但没有对应流程与制度变化 | 脱离实践的文化变成无根之水，组织失去转型信心 |\n| 用培训替代机制 | 认为\"学会就会做\" | 培训结束即回到旧行为，因为旧行为仍然是理性选择 |\n| 平台与工具定位混同 | 平台深度介入具体业务实现 | 复用性下降，平台退化为一个更大的工具 |\n\n#### 落地练习\n\n针对当前最想改善的一项交付问题，回答三个问题：这项工作**目前的行为**是什么？这个行为对执行者**有什么好处**（这是它能持续的原因）？要改变这个行为，需要改哪条规则，使新行为比旧行为更划算？\n\n如果第三问答不出来，说明还没有找到机制，此时的宣导与培训都不会产生持久效果。", "subs": ["争论的实质是问错了问题", "机制是行为的杠杆", "三个支柱与两两组合", "平台与工具的分界", "判据：补最短的一块", "常见误区", "落地练习"]}, {"title": "分期目标与成熟度判据", "content": "#### 为什么需要模型和框架\n\n一项技术在早期靠先行者摸索，进入大规模采纳阶段后，就需要模型和框架来让后来者快速定位自己的位置。软件开发有 CMMI（能力成熟度模型），运维有 ITIL，它们的作用都是在技术扩散期提供共同坐标。\n\nDevOps 同样需要这一层。转型中最难回答的三个问题都指向同一个需求：\n\n1. 我们当前处在什么水平？\n2. 最大的瓶颈在哪里？\n3. 阶段性的预期成果是什么？\n\n没有坐标，这三个问题只能靠感觉回答，而感觉既不可度量，也无法在改进后被对比。\n\n需要明确的是模型的层级定位：成熟度模型属于**方法论层面**，是一张战略地图，作用是建立领域与能力的全景认知并识别差距。它**不提供**实施顺序——顺序必须结合自身约束来确定。\n\n#### 应用模型的四个步骤\n\n| 步骤 | 要做的事 | 产出 | 常见错误 |\n| --- | --- | --- | --- |\n| 识别差距 | 用模型对标，梳理能力短板 | 能力状态基线，用于对比改进后的效果 | 直接采纳全部差距项，范围失控 |\n| 锚定目标 | 判断哪个差距是当前最大瓶颈，哪些可快速补齐 | 少量高优先级改进目标，且目标可量化 | 把\"别人有的能力\"当成\"我们缺的能力\" |\n| 关注能力 | 从目标反推所需能力，再导入匹配的实践 | 能力与实践的对应关系 | 直接比较结果数字，忽略自身业务形态差异 |\n| 持续改进 | 用改进后的基线重新对标，进入下一轮 | 新的差距清单与目标 | 把它当成一次性评级项目，评完即停 |\n\n这里面第二个步骤最容易被跳过，也最关键。识别差距的结果通常是几十项，全部推进必然失败。有效的做法是做一次**真实有效性筛选**：判断每项差距是否确实影响当前的核心目标。\n\n一个典型的筛选判断是这样的：对于一家以交付内部系统为主的组织，\"容器化部署\"虽然在环境管理上有明确优势，但如果当前瓶颈是审批流程与需求流转，那么容器化就不该进入近期改进清单。**差距项本身没有优先级，只有与当前目标的关联度有优先级。**\n\n第三个步骤要注意的是\"结果数字不可直接比较\"。不同形态的应用，构建耗时、部署频率的可达范围差异极大：客户端应用可能在几分钟内完成构建，而大型系统软件的构建可能需要数小时。因此部署频率这类结果指标只能与自己纵向对比，不能横向照搬其他组织的绝对值。\n\n#### 部署引力：频率提升需要同步改变的能力\n\n一个实用的视角是\"部署引力\"——当发布频率提升一个数量级时，链路上多个能力必须同步演进，否则会被其中的短板卡住：\n\n| 发布频率档位 | 分支策略 | 测试能力 | 架构 | 发布策略 | 基础设施 | 数据层能力 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 数月一次 | 长期分支可接受 | 手工回归为主 | 单体 | 停机发布 | 固定环境 | 人工变更脚本 |\n| 每月一次 | 短周期分支 | 关键路径自动化 | 单体或初拆 | 滚动发布 | 环境可复用 | 版本化变更脚本 |\n| 每周一次 | 特性分支 | 自动化回归覆盖率上升 | 服务拆分 | 金丝雀发布 | 环境按需创建 | 向后兼容的变更规范 |\n| 每天多次 | 主干开发 | 分层自动化 + 契约测试 | 解耦服务 | 灰度与自动回滚 | 声明式、按需弹性 | 在线变更与兼容窗口管理 |\n\n这张表的价值在于它把\"提高发布频率\"这个模糊目标，拆成了六个必须同步改变的具体能力。**只改其中一两项，频率提升会在其余项上撞墙。**\n\n#### 常见误区\n\n| 误区 | 表现 | 后果 |\n| --- | --- | --- |\n| 把模型当成实施计划 | 按模型条目逐项建设 | 建设了一大堆能力，瓶颈依然存在 |\n| 照搬外部组织的成就数字 | 直接以行业最高水平作为目标 | 目标脱离自身业务形态，无法达成也无法解释 |\n| 把成熟度评级当作目标 | 以通过评估为完成标志 | 评级通过后改进停止，能力回落 |\n| 认为模型一成不变 | 一次对标后长期沿用 | 行业能力整体提升，原有水平相对倒退 |\n\n#### 落地练习\n\n用上面的部署引力表做一次定位：先确定当前实际的发布频率档位，再逐列检查六项能力是否与之匹配，把不匹配的项标出来。不匹配项通常就是下一阶段改进的直接候选。注意要按**当前档位**检查，而不是按目标档位——先让现有频率下的六项能力对齐，再谈升档。", "subs": ["为什么需要模型和框架", "应用模型的四个步骤", "部署引力：频率提升需要同步改变的能力", "常见误区", "落地练习"]}, {"title": "价值流：把等待与处理时长分开", "content": "#### 定义与来源\n\n价值流分析（Value Stream Mapping，VSM）源自制造业的精益思想，用于分析一个产品交付给用户所经历的业务流、信息流以及各阶段的移交过程。在软件交付中，它的作用是：**把需求从提出到上线所经历的全过程建模，识别其中的浪费环节与依赖关系。**\n\n价值在这里指带给组织生存发展的核心资源——生产力、盈利能力、市场份额、用户满意度等。VSM 关注的不是单个环节做得好不好，而是**环节之间的流动**：单个环节能力再强，如果环节之间大量割裂，整体交付效率依然很低。\n\nVSM 通常被放在\"三步工作法\"的框架下理解，这三步概括了通用的实施路径：\n\n| 步骤 | 主张 | 对应手段 |\n| --- | --- | --- |\n| 流动 | 让价值从开发到运营加速流动，实现低风险发布 | 工作可视化、限制在制品数量、导入工程实践 |\n| 反馈 | 让缺陷与用户反馈第一时间被发现 | 在流程各环节注入反馈能力 |\n| 持续学习和试验 | 把持续改进注入日常工作 | 激励学习与分享，允许试验 |\n\nVSM 是第一步\"流动\"中最先要做的事——因为看不见全貌，就无从判断该优化哪里。\n\n#### 三个关键要素\n\nVSM 的核心要素只有三个，但每一个都容易在采集时走形：\n\n| 要素 | 定义 | 用途 | 采集陷阱 |\n| --- | --- | --- | --- |\n| 前置时间 LT | 从需求提出（创建任务）到最终上线交付给用户的时间周期 | 直接体现交付速率，可用以计算交付吞吐量 | 状态被批量拖动，导致耗时被压缩成几秒，失去意义 |\n| 增值 / 不增值活动时间 VAT / NVAT | 流程中真正产生价值的时长与不产生价值的时长 | 定位浪费所在 | 初期难以精确切分，建议先只统计等待时长 |\n| 完成度与准确度 %C/A | 有多少工作因质量不达标被下游打回 | 反映沟通与返工成本 | 初期可暂不采集，先用质量门禁类指标近似 |\n\n前置时间需要区分两种口径，混用会导致严重误判：\n\n| 口径 | 起点 | 反映什么 |\n| --- | --- | --- |\n| 需求前置时间 | 需求提出（创建任务） | 团队整体交付能力，也是用户实际感知的周期 |\n| 开发前置时间 | 需求进入开发中状态 | 开发能力与工程能力 |\n\n差异在于\"需求提出到进入开发\"这段等待。对于一个需求排队等待排期的组织，两种口径可以相差数倍——**只报开发前置时间会显著乐观**。因此两个指标应当同时采集：它们的差值是需求侧等待，本身就是改进对象。\n\n采集时还有一个具体的失真来源：如果状态流转依赖人工修改，研发习惯把多个需求一次性拖到\"开发中\"、完成后再逐个处理，那么等待时间就整体消失了。解决办法不是要求大家手动改得更勤，而是**把状态流转绑定到系统事件**——提交测试时自动从\"开发中\"变为\"待测试\"，用流程与平台的结合替代人工操作。\n\n#### 两种开展方式\n\n| 方式 | 做法 | 优点 | 代价与风险 |\n| --- | --- | --- | --- |\n| 工作坊 / 梳理会议 | 选取核心业务模块，召集覆盖全流程各环节的资深成员一起梳理 | 能当场对齐认知、快速建立共识；跨角色面对面最容易暴露误解 | 关键角色难凑齐；面对面时各方倾向于保留，真实问题被隐藏 |\n| 内部走访 | 由转型小组或牵头人逐个走访各环节团队 | 时间灵活，受访者更容易坦诚 | 对走访人要求高：既需要专业判断力，又需要内部信任基础 |\n\n工作坊不一定非要单独组织，团队现有的回顾会、版本发布总结会都是成本最低的场次，只需额外邀请几位平时不参会的上下游成员。\n\n无论采用哪种方式，都要有一个问题清单来收窄谈话范围，避免漫无目的地发散：\n\n```text\n1. 你所在团队在价值交付中的主要职责是什么\n2. 你的上下游团队分别是哪些\n3. 你所在环节的处理方式与典型时长是多少\n4. 支持本环节工作的关键系统有哪些\n5. 存在哪些等待或其他类型的浪费\n6. 工作流转到下游后被打回的比例大概是多少\n```\n\n第 5、6 两问是重点：**第 5 问暴露等待，第 6 问暴露返工**，而这两类浪费通常占端到端时间的绝大部分。\n\n#### VSM 的五大价值\n\n| 价值 | 说明 |\n| --- | --- |\n| 看见全貌 | 避免陷入局部优化；单点能力强但环节间割裂时，整体效率依然低下 |\n| 识别问题 | 用可量化的前置时间、等待时长、打回比例替代\"感觉效率不高\"这类判断 |\n| 促进沟通 | 梳理过程本身让上下游第一次了解彼此的职责与难点，产生改进意愿 |\n| 驱动度量 | 访谈中答不上来的指标，直接暴露该环节度量缺失或平台采集能力不足 |\n| 价值展现 | 从价值分析出发、到价值优化结束，天然回答了投入的价值问题 |\n\n第 4 条值得单独强调：**访谈时的\"答不上来\"是重要信号**。如果一个团队对自己的交付周期支支吾吾，或需要人工数数才能得到数据，说明该环节要么关键指标不清晰，要么平台无法自动采集。这两类问题都应当在转型早期优先处理，因为它们会让后续所有改进失去衡量依据。\n\n#### 常见误区\n\n| 误区 | 表现 | 后果 |\n| --- | --- | --- |\n| 只画图不采集数据 | 产出一张流程图就结束 | 无法量化，改进无法验证 |\n| 只在局部环节建模 | 只覆盖开发测试段 | 看不到端到端瓶颈，优化了非瓶颈环节 |\n| 只统计处理时间 | 忽略等待 | 错失最大的优化空间 |\n| 混用前置时间口径 | 汇报用开发前置时间，用户感知的是需求前置时间 | 结论与实际体验脱节，改进无的放矢 |\n\n#### 落地练习\n\n选取一个正在交付中的真实需求（不要选已完成的，避免回忆失真），记录它经过的每个环节的**进入时间**与**离开时间**，然后把时长分成两类：有人正在处理的时长、在队列中等待的时长。\n\n做完之后计算等待占比。如果等待占比超过一半，那么下一阶段的改进重点应当放在等待上，而不是优化任一环节的处理速度——**优化处理时间对端到端时长的影响，被等待稀释了。**", "subs": ["定义与来源", "三个关键要素", "两种开展方式", "VSM 的五大价值", "常见误区", "落地练习"]}, {"title": "规模化转型的路径与失败模式", "content": "#### 两种轨迹\n\n推行新模式只有两条轨迹，它们各有明确的适用条件与失效方式：\n\n| 轨迹 | 优势 | 主要风险 | 适用条件 |\n| --- | --- | --- | --- |\n| 自底向上 | 团队小、资源调动容易，局部容易见效；改进动力来自真实痛点 | 局限在小团队内部，不构成组织级转型；缺少授权时改进会撞到组织边界 | 组织过大难以整体改变，且存在有意愿且有能力的局部团队 |\n| 自顶向下 | 目标清晰、资源有保障、跨部门协调快 | 上层难以掌握细节，团队为达标而选择性地定义和呈现数据 | 高层有明确意愿并愿意持续投入资源 |\n\n两种轨迹有一个共同的前提：**管理层认可与资源投入都是必选项**。组织架构、团队文化、工程能力、协作方式都是长期沉淀的结果，不会因为一次项目立项而改变；而没有持续的资源投入，改进会在第一个瓶颈处停滞。\n\n第二种轨迹的风险值得单独说明。当目标以行政方式下达时，会出现一个结构性张力：上层要结果，下层掌握过程细节，于是\"如何定义指标\"变成了可以操作的空间。同一项指标可以有多种口径，口径选择直接决定结论：\n\n```text\n场景（示例）\n  指标名：前置时间\n  口径 A：从开发开始 → 功能测试完成       得到 1 周\n  口径 B：从需求提出 → 上线发布           得到 2 个月\n\n两个口径都不是错的，但只有口径 B 对应业务方的真实体验。\n```\n\n因此配套措施必须是**口径前置约定**：在设定目标时同步约定指标的起止点、数据来源与采集方式，并在过程中核对原始记录。否则改进会在纸面上完成。\n\n自底向上的轨迹则要处理\"如何扩展到组织\"的问题。可行原则是**由点及面**：先在自身团队内部，以及与自身有强依赖的上下游团队之间建立联系，一方面扩展自身能力范围，另一方面逐步模糊团队边界，形成小的交付共同体。但要注意，小团队内部的改进还不构成转型——**必须让高层看见局部改进的效果并认可这种尝试**，才可能横向铺开。\n\n#### 通用路径的四步\n\n| 步骤 | 关键动作 | 判据 |\n| --- | --- | --- |\n| 寻找试点项目 | 选一个合适的业务对象作为改进载体 | 见下表的三个特征 |\n| 寻找团队痛点 | 识别当前最影响效率、且改进后收益最大的环节 | 用价值流分析产出，而不是凭印象 |\n| 快速建立初期成功 | 只选一个改进点、定义一个量化目标 | 能在数周内产出可见结果 |\n| 快速展示与持续改进 | 向管理层汇报、团队内部总结，再进入下一轮 | 基线与改进后数据可对比 |\n\n第三步是转型初期最典型的陷阱所在。把面铺得太广、战线拉太长会有三重代价：初期资源有限难以并行支撑；团队之间尚未建立信任，生搬最佳实践容易水土不服；管理层的耐心有限，长期看不到效果会影响后续投入。因此正确的策略是**收敛到一个改进点 + 一个可量化目标**，例如把\"环境准备时长缩短一半\"作为目标，这样任务可以拆解、几周内可见结果。\n\n试点项目的选择有三个特征：\n\n| 特征 | 理由 |\n| --- | --- |\n| 贴近核心业务 | 管理层关注度高、业务指标完善，改进效果可通过业务指标呈现；资源投入有长期保障 |\n| 偏敏捷性质的业务 | 需求与变更频繁，改进效果容易在短时间内被验证；以稳定维护为主、变更极少的业务不适合作为试点 |\n| 改进意愿强 | 意愿强的团队愿意配合，精力可以聚焦于做事而非反复沟通；自我评价已经很好的团队推进成本极高 |\n\n第二个特征容易被忽略：如果一个业务的变更诉求本身很低，那么交付链路的改进对它几乎没有价值，这时先做交付治理是错配。**判断标准是变更频率，而不是业务规模。**\n\n#### J 型曲线\n\n即便完全按上面的路径推进，过程也不会是线性的。转型的典型形态是一条先降后升的 J 型曲线：\n\n```mermaid\ngraph TD\n    A[初期 识别问题并快速见效] --> B[交付能力提升 自动化与工具落地]\n    B --> C[质量与债务问题显现]\n    C --> D[测试周期与集成问题成为新瓶颈]\n    D --> E{是否继续投入核心能力建设}\n    E -->|继续| F[构建优化 自动化覆盖率提升]\n    E -->|暂缓| G[改进停滞 回到起点]\n    F --> H[交付能力再次上升]\n```\n\n曲线中段的成因是：初期的改进集中于执行效率，但质量能力与技术债务没有同步提升。手工回归测试无法压缩测试周期，架构耦合导致改动牵一发动全身，这些都会在交付频率上升后集中暴露。此时团队面临选择——继续推进意味着要分出额外精力做长期投入（优化构建时长、提升自动化覆盖率），短期内交付能力甚至可能下降；暂缓则意味着改进无法真正落地。\n\n同时，与组织固有流程和边界相关的人为因素也会在此阶段成为约束：能否减少评审与审批流程，取决于质量保障体系是否足以替代人工把关。**质量能力不达标时，收紧审批是组织的理性反应，因此减少审批的前提是先建立可替代的信任机制。**\n\n很多转型项目就停在这一段。识别出 J 型曲线的存在本身就是有价值的——它让团队在中段的下滑期不至于误判为\"方向错了\"。\n\n#### 转型小组的构成\n\n转型初期组建专职小组是有必要的，主要作用是承担\"设计\"工作：转型计划制定、改进目标识别、技术方案设计、流程改造。小组构成通常分三层：\n\n| 层级 | 成员 | 职责 |\n| --- | --- | --- |\n| 核心层 | 各关联团队负责人、领域专家、必要时的外部顾问 | 制定计划、识别目标、设计方案 |\n| 管理层 | 有一定决策权的管理者 | 资源投入、跨部门协调、消除组织障碍 |\n| 工具层 | 平台与工具团队 | 把确定的流程与规则固化进工具 |\n\n成员选择上要偏好**一专多能**的跨领域成员，因为转型的核心问题恰好落在领域交界处。\n\n#### 常见误区\n\n| 误区 | 表现 | 后果 |\n| --- | --- | --- |\n| 没有管理层支持就启动 | 仅靠少数人推动 | 撞到组织边界后无法推进，改进成果无法固化 |\n| 试点选择只看规模 | 选了核心但变更极少的业务 | 改进效果无从验证，项目被判定为无效 |\n| 目标口径未前置约定 | 事后解释指标含义 | 数据被选择性呈现，改进在纸面完成 |\n| 铺开范围过早 | 同时推进多个改进点 | 资源分散、信任未建立、管理层失去耐心 |\n| 在 J 型曲线中段放弃 | 把阶段性的效率下降当作方向错误 | 投入无法回收，回到起点 |\n\n#### 落地练习\n\n写一份转型启动说明，回答五个问题：采用哪条轨迹？为什么？试点项目的三个特征分别如何满足？第一个改进点是什么、量化目标是多少？在什么条件下判定这一轮无效并调整方向？\n\n最后一个问题同样重要——**没有停止条件的改进项目会在效果不明时不断追加投入**，既得不到结论，也无法沉淀经验。", "subs": ["两种轨迹", "通用路径的四步", "J 型曲线", "转型小组的构成", "常见误区", "落地练习"]}, {"title": "业务敏捷与精益看板提供什么输入", "content": "这一节的机制细节（看板状态的进入与退出条件、流动效率的计算与解读）已由 [GitOps 第一册 第 9 章](../gitops/01-principles-workflow-and-adoption.md) 承担，此处不重复。本节只回答一个此前未被覆盖的问题：**在交付治理的视角下，敏捷框架该选哪一个，以及看板的状态如何与交付系统对接。**\n\n#### Scrum 与看板的选择边界\n\n两者都源自敏捷思想，但对组织的要求和引入方式差别很大：\n\n| 维度 | Scrum | 精益看板 |\n| --- | --- | --- |\n| 变革方式 | 引入迭代节奏与固定角色，属于较明确的组织调整 | 在现有流程上叠加可视化与规则，渐进式改变 |\n| 对组织的要求 | 角色定义（产品负责人、敏捷教练、团队）不易被理解，涉及组织变革时推进困难 | 初期只需忠实呈现现有流程，对组织冲击小 |\n| 引入风险 | 形式化风险高：角色由原有管理者兼任时，会议容易退化为汇报会 | 容易停留在\"可视化板\"，缺少在制品限制时不成其为看板 |\n| 适用场景 | 需求边界相对清晰、团队可稳定组队、组织愿意做结构调整 | 流程跨多个既有团队、组织结构短期无法调整、需要温和切入 |\n\n选择的关键不是哪个更先进，而是**组织当前能承受多大幅度的调整**。当组织结构短期无法变动时，强行引入 Scrum 会产生大量形式化成本；反过来，当团队可以稳定组队且需求边界清晰时，Scrum 的迭代节奏能提供更强的目标聚焦。\n\n看板方法的一条重要实践是分五步推进：可视化流程 → 定义清晰规则 → 限制在制品数量 → 管理工作流 → 建立反馈与持续改进。这五步的顺序本身就是设计：**先如实呈现现状，再定义规则，最后才施加约束**，使得引入过程中的组织反弹最小。\n\n#### 在制品限制为什么是核心\n\n如果只能记住看板的一条要点，那是在制品限制。原因是它与交付周期和质量是同一组因果：\n\n- 平均吞吐率 = 在制品数量 / 平均前置时间（利特尔法则）。在吞吐率稳定时，**在制品越多，前置时间越长**。\n- 并行任务切换有固定开销。同时处理十件事时，每件事实际获得的时间远小于十分之一，因为每次切换都要重建上下文。\n- 前置时间拉长会降低质量。需求理解在沟通当下最清晰，时间拉长后理解偏差累积，最终以返工的形式回到流程里。\n\n这三条会形成向下螺旋：交付周期长 → 紧急插入任务增多 → 在制品进一步增加 → 交付周期更长。极端情况下团队大部分精力都在处理问题，没有余力交付需求与创新。\n\n这个螺旋还有一个组织层面的后果：业务方无法预测交付时间，于是倾向于一次性批量提交需求，反过来又推高了在制品数量。由此可见**在制品数量是团队与业务方之间信任水平的直接结果**，限制它不只是流程技术问题。\n\n增加人手能缓解但不能解决：沟通成本随人数上升而超线性增长，新成员在短期内还会因为培训和适应拖慢原有节奏。\n\n#### 与交付链路的接口：状态必须映射到系统事件\n\n看板要真正改善交付，而不只是改善可见性，需要满足两个条件：\n\n1. **每一列对应一个可识别的交付阶段**，并且有明确的进入与退出条件。列的划分标准是两条：是否构成独立环节（是否由不同角色负责），是否存在状态流转与移交（是否跨越交付边界）。\n2. **列的状态变化由系统事件驱动，而不是由人工拖动**。这与本章价值流分析中\"前置时间失真\"的成因是同一个问题：人工维护的状态无法保证时效性，批量拖动会让数据整体失效。\n\n第 2 条是把看板从\"手工报表\"变成\"交付证据\"的分界线。实现方式是让流水线与需求管理系统绑定：代码提交、构建完成、提测、发布这些事件自动触发对应状态流转。做到这一步，看板上的前置时间就变成了可采信的度量数据。\n\n#### 常见误区\n\n| 误区 | 表现 | 后果 |\n| --- | --- | --- |\n| 有形无约束 | 建了看板但未限制在制品数量 | 只是可视化板，交付周期与质量无改善 |\n| 状态靠人工维护 | 状态流转依赖成员手动修改 | 数据失真，度量结论不可用 |\n| 敏捷形式化 | 角色由原管理者兼任，站会变汇报会 | 产出结果无变化，转型随组织调整不了了之 |\n| 列划分过细或过粗 | 按工具功能而非交付阶段划分 | 看板无法反映真实瓶颈 |\n\n#### 落地练习\n\n从当前团队选一个正在进行的迭代，做两件事：数出同时在\"进行中\"的工作项数量；测量其中最早进入的项已经停留多久。然后对照利特尔法则估算：如果保持在制品数量不变，完成全部在制工作大约需要多长时间？\n\n如果这个估算结果明显超出业务方预期，那么在制品限制就是一个值得优先引入的约束——**它几乎不需要额外平台投入，只需要团队就上限数量达成一致并执行。**", "subs": ["Scrum 与看板的选择边界", "在制品限制为什么是核心", "与交付链路的接口", "常见误区", "落地练习"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);

    part.sections.forEach((sec, si) => {
      totalCount++;

      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `

      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
