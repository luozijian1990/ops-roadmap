<script id="data" type="application/json">{"title": "交付治理与容量保障学习笔记·第二册：工程治理命题", "intro": "", "parts": [{"title": "第 1 章 · 配置、分支与依赖的治理", "sections": [{"title": "配置管理：那层常被跳过的基础", "content": "本册进入\"工程治理命题\"：在真正选择和使用工具之前，必须先完成一批判断。这些判断决定了后续 Ansible、Jenkins、GitOps、Docker、Kubernetes 等工具层笔记能否真正落地，还是只变成一套新的手工习惯。第一册讨论的是认知与转型；本册讨论的是工程治理里那些\"不动手就能先想清楚\"的命题——配置怎么管、分支怎么选、依赖怎么收口、环境怎么定义、质量门禁放在哪、制品如何可信、发布如何低风险。凡是命令怎么写、配置项怎么配，本册一律只给判据并指向已有主题，不重复展开。\n\n配置管理是交付链路里最不起眼、却最先崩的一环。一个变更能不能被重复、可追溯地送达用户，取决于它在出发时有没有被当作\"资产\"而非\"临时物\"对待。**把配置当成代码一样纳入版本控制、标准化和单一可信源，是后面所有自动化动作能够成立的前提；跳过的代价不是立刻出错，而是故障来临时无法回放\"当时到底发了什么\"。**\n\n#### 配置治理的四个支点\n\n源材料（devops/10）把配置管理的理念收敛为四条，它们不是并列的清单，而是层层递进的约束：\n\n| 支点 | 断言 | 违反后的典型症状 |\n| --- | --- | --- |\n| 版本变更标准化 | 任何对交付物的修改都走同一套\"提交-评审-生效\"通道 | 有人直接改线上文件，变更无记录、无评审 |\n| 将一切纳入版本控制 | 代码、配置、脚本、环境定义都可被版本化 | 环境靠口头同步，回滚靠记忆 |\n| 全流程可追溯 | 任意时刻的线上状态都能对应到具体版本与提交 | 出问题时说不清\"这一版和上一版差在哪\" |\n| 单一可信数据源 | 同一个事实只有一份权威来源，其他都是派生 | 多份配置互相矛盾，以哪份为准说不清 |\n\n这四个支点里，最容易被执行成形式主义的是\"纳入版本控制\"——把文件丢进 Git 不等于治理。真正的判据是：**任何一份线上生效的配置，是否都能在不依赖当事人记忆的前提下，从版本库里还原出它的完整历史与生效时点。**\n\n#### 机制与链路：配置如何流到环境\n\n配置管理的链路可以抽象为一条\"声明→版本→分发→生效→回看\"的回路。配置先在版本库中作为声明存在，经过评审合入主干，再由分发机制落到各环境，最终在运行时生效；当线上出现异常，回看环节要能回答\"此刻生效的是哪一份、它从哪次提交来\"。\n\n```mermaid\ngraph TD\n    A[配置声明进入版本库] --> B[评审合入主干]\n    B --> C[分发机制推到各环境]\n    C --> D[运行时生效]\n    D --> E[异常时回看版本与提交]\n    E --> A\n```\n\n这条回路成立的关键不在工具，而在\"单一可信源\"是否被守住。一旦允许\"线上直接改、事后补录\"，回路就从闭环退化成开环，后续所有监控与回滚都建立在不可信的事实上。\n\n#### 观察与判断：怎样算管好了\n\n判断配置管理是否达标，看三件具体的事：\n\n1. 任意一个生产配置项，能否在 5 分钟内定位到它的当前版本、上一个版本、以及两者的差异。\n2. 一次回滚是否只需要\"切回某个版本\"这一种动作，而不需要\"对比两份文件再手工改回去\"。\n3. 新人和离职者交接时，配置知识是否沉淀在系统里，而不是在某人的本地笔记里。\n\n这三条都满足，配置才真正成了资产；否则它只是\"被 Git 托管的临时物\"。\n\n#### 边界与风险：配置管理与配置中心的分工\n\n配置管理是治理原则，配置中心是其中一种实现手段，二者不能混为一谈。把治理原则错配成\"我们上了配置中心就等于管好配置了\"，是常见的退坡。**配置中心解决的是\"运行时动态下发\"，它不自动带来\"版本化\"和\"单一可信源\"；如果中心里的配置本身可以绕开版本库随意修改，治理反而更隐蔽地失效。** 关于运行时配置与配置中心的取舍，第 2 章会专门展开。\n\n#### 落地练习\n\n1. 在当前系统里随机抽一个生产配置项，尝试还原它的版本历史与最近一次生效时间，记录用了多久、是否借助了当事人。\n2. 列出所有\"可以绕过版本库直接改\"的配置入口，标出其中哪些一旦被改会造成线上不一致。\n3. 模拟一次回滚：假设某配置引发故障，你的回滚动作是\"切版本\"还是\"手工比对再改\"？前者记为达标，后者记为缺口。", "subs": ["配置治理的四个支点", "机制与链路：配置如何流到环境", "观察与判断：怎样算管好了", "边界与风险：配置管理与配置中心的分工", "落地练习"]}, {"title": "分支策略选型要比较哪几个变量", "content": "分支策略没有\"最好的\"，只有\"与你的集成频率、发布节奏、回滚方式相匹配的\"。**选型的本质不是挑一种流行模型，而是先确定四个相互牵制的变量，再反过来让分支模型去适配它们；把变量反过来由模型决定，是大多数团队分叉混乱的根源。** 分支模型的机制细节（集成频率、发布节奏、变更隔离、回滚方式四变量的拆解）本册不重述，已在 [GitOps 第一册第 8 章](../gitops/01-principles-workflow-and-adoption.md) 给出。\n\n#### 四种主流模型的取舍\n\n业界常见模型可归为三类基础形态再加一类混合形态，它们的差异不在\"分支图画得好看\"，而在下面这张表里承载的四个变量：\n\n| 模型 | 集成频率 | 发布节奏 | 变更隔离 | 回滚方式 |\n| --- | --- | --- | --- | --- |\n| 主干开发 + 分支发布 | 高，频繁合入主干 | 发布从主干拉出，节奏独立 | 靠发布分支隔离，主干长期可部署 | 回滚发布分支或重发旧版 |\n| 分支开发 + 主干发布 | 中，特性分支定期合主干 | 主干即发布源，节奏受合入约束 | 靠短生命周期特性分支隔离 | 主干回退或热修 |\n| 主干开发 + 主干发布 | 极高，每次提交即候选 | 发布与提交高度同步 | 几乎不隔离，靠开关与特性隐藏 | 依赖快速前进修复 |\n| 主干 + 短特性分支（混合） | 高，特性分支存活短 | 发布从主干出，隔离在分支侧 | 特性分支存活期短、每日合入 | 关开关或重发 |\n\n#### 机制与链路：四个变量如何互相牵制\n\n四个变量不是独立旋钮，而是耦合的：集成频率越高，单条分支存活越短，变更隔离越依赖\"开关\"而非\"分支\"；发布节奏越独立，越需要主干长期保持可部署；回滚方式若依赖\"代码回退\"，则会反向要求分支模型保留清晰的合入边界。\n\n```mermaid\ngraph TD\n    A[集成频率] --> B[分支存活期]\n    B --> C[变更隔离手段]\n    C --> D[回滚方式]\n    D --> E[发布节奏]\n    E --> A\n```\n\n这条回路的结论是：**当你说\"我们要高频发布\"时，真正要改的不是分支图画法，而是把回滚从\"代码回退\"升级为\"重发旧版 + 功能开关\"，否则高频只会放大混乱。**\n\n#### 观察与判断：怎样算选对了\n\n不必追求\"最优模型\"，用三个问题自测：\n\n1. 一条特性分支从创建到合入，平均存活几天？超过一周往往意味着隔离变成了堆积。\n2. 主干是否在任何工作日结束时都处于\"可部署\"状态？若不能，说明集成频率与发布节奏错配。\n3. 一次回滚需要几个人、几种动作？若超过\"切版本/关开关\"两种，模型与回滚方式不匹配。\n\n#### 边界与风险：不要被\"演进故事\"带偏\n\n很多材料喜欢用某家公司的分支演进史来证明\"最终都收敛到主干开发\"。这种叙事有因果倒置的风险：**大公司收敛到某种模型，是因为它已经有了高频集成与强回滚能力；对小团队而言，先补回滚与集成能力，比照搬模型更关键。** 模型是结果，不是起点。\n\n#### 落地练习\n\n1. 画出你当前团队的分支图，并在图上标出\"集成频率、发布节奏、变更隔离、回滚方式\"四个变量的实际取值。\n2. 找出当前模型里最别扭的一个变量，判断它是\"模型不匹配\"还是\"能力没到位\"。\n3. 把\"主干是否每日可部署\"作为每周一次的体检项，连续记录四周。", "subs": ["四种主流模型的取舍", "机制与链路：四个变量如何互相牵制", "观察与判断：怎样算选对了", "边界与风险：不要被\"演进故事\"带偏", "落地练习"]}, {"title": "小团队的轻量分支实践", "content": "小团队的分支治理不需要照搬大厂的复杂模型，但需要一套能防止\"分支堆积\"和\"合入冲突集中爆发\"的轻量纪律。**轻量分支实践的核心判据只有两条：特性分支必须短命且每日合入，以及发布节奏与分支清理必须同步；做不到这两条，小团队的分支数会随时间线性膨胀，最终退化成大团队才有的合并地狱。**\n\n#### 机制与链路：短生命周期的工作方式\n\n把\"小团队轻量分支\"抽象成机制，它包含三个动作，缺一不可：\n\n| 动作 | 具体做法 | 为什么必须 |\n| --- | --- | --- |\n| 特性分支短命 | 每个特性从主干拉出，目标是在数天内合回，不长期悬挂 | 存活越久，冲突面越大，合入越痛苦 |\n| 每日合入主干 | 无论是否完成，每日至少向主干同步一次 | 把冲突从\"发版前一次性\"拆成\"每日小额\" |\n| 发布后清理 | 每次发布窗口结束后，清理已合并的废弃分支 | 防止分支列表变成无人认领的坟场 |\n\n这三个动作合起来，使小团队既保留了\"按特性隔离开发\"的灵活性，又避免了\"分支越多越难合\"的陷阱。它不依赖复杂工具，依赖的是纪律——而纪律的可行性，正来自团队规模小、沟通半径短。\n\n#### 操作与实现的边界\n\n这一节只讲治理判据，分支与合并的具体命令、保护分支的配置写法，见 [GitOps 第一册](../gitops/01-principles-workflow-and-adoption.md)。本册要你先决定的是：**你的特性分支存活上限设为几天、每日合入是强制还是约定、谁来在发布后清理。** 这三个决定的缺失，才是小团队分支腐化的真实原因，而不是工具不够。\n\n#### 观察与判断：怎样算轻量且有效\n\n- 分支总数是否随项目周期近似常数，而不是单调上升。\n- 一次常规合入的冲突解决时间是否在分钟级，而非小时级。\n- 新人是否能在一张图里看懂\"当前有哪些活跃分支、各自归属谁\"。\n\n#### 边界与风险：小团队不是\"随便分\"\n\n轻量不等于无约束。最常见的误判是\"人少就不需要规范分支\"，结果当团队从 3 人涨到 10 人时，分支模型没有任何演进预案，直接撞上合并墙。**小团队的轻量实践应当把\"何时升级到带发布分支的模型\"写进约定里，而不是等痛了再补。**\n\n#### 落地练习\n\n1. 统计当前所有未合入分支的创建日期，列出超过你设定存活上限的分支。\n2. 设定一个\"发布后清理日\"，把清理动作加进发布 checklist。\n3. 写下分支升级预案：当团队规模或发布频率越过哪条线时，启用发布分支。", "subs": ["机制与链路：短生命周期的工作方式", "操作与实现的边界", "观察与判断：怎样算轻量且有效", "边界与风险：小团队不是\"随便分\"", "落地练习"]}, {"title": "代码回滚与包回滚是两件不同的事", "content": "回滚是交付链路里最容易被一句\"回退一下\"带过的动作，但\"回退代码\"和\"回退制品\"在机制、风险和可逆性上完全不同。**把代码回滚和包回滚混为一谈，是线上恢复时间失控的主要人为原因；正确的判据是：能重发旧制品就不回退代码，集成分支上严禁用破坏性重置来\"擦掉\"历史。**\n\n#### 定义与问题：两种回滚的本质差异\n\n| 维度 | 包回滚（重发旧制品） | 代码回滚（回退提交） |\n| --- | --- | --- |\n| 作用对象 | 已构建好的制品/部署包 | 版本库中的提交历史 |\n| 可逆性 | 高，随时可再发任一历史版 | 低，破坏性重置会改写共享历史 |\n| 影响范围 | 仅运行环境 | 可能影响所有基于此分支的后续工作 |\n| 适用场景 | 上线后发现问题、需快速恢复 | 集成分支上的错误尚未广泛传播 |\n\n包回滚的本质是\"换一个已知良好的制品重新部署\"，它不触碰历史，因此可逆、可控、可重复。代码回滚的本质是\"让版本库的当前状态回到某个过去点\"，它在共享分支上是一道危险操作。\n\n#### 机制与链路：三类代码回滚场景\n\n代码回滚按发生位置分为三类，治理要求各不相同：\n\n```mermaid\ngraph TD\n    A[个人分支回滚] --> B[本地重置 影响仅自己]\n    C[集成分支上线前回滚] --> D[用反向提交抵消 保留历史]\n    E[集成分支上线后回滚] --> F[优先包回滚 而非重置主干]\n    D --> G[历史完整 可审计]\n    F --> G\n```\n\n关键判据在第三类：**上线后的集成分支（如主干）发现问题，首选是包回滚或快速前进修复，而不是对主干做破坏性重置（reset --hard）。** 破坏性重置会改写共享历史，让其他人的本地状态与远端产生分叉，恢复成本远高于一次重发。\n\n#### 操作与实现的边界\n\n具体的回退命令、反向提交如何生成、制品仓库如何保留历史版本，属于工具层内容，见 [Jenkins 第二册第 9 章](../jenkins/delivery-practice.md) 与制品管理相关主题。本册的治理命题是：**在发布流程里把\"包回滚为首选、代码回退为受限\"写成明确规则，并禁止在集成分支上执行破坏性重置。**\n\n#### 观察与判断：回滚能力是否达标\n\n- 一次线上故障，从\"决定回滚\"到\"流量恢复\"，是否只消耗\"切制品\"这一动作的时间。\n- 集成分支的历史是否始终连续、可审计，没有任何\"被重写\"的痕迹。\n- 团队是否清楚：哪些分支允许本地重置，哪些分支只能反向提交。\n\n#### 边界与风险：重置的诱惑\n\n破坏性重置之所以常被误用，是因为它\"看起来最快\"——一行命令让分支回到过去。但它的代价在事后才显现：协作者的本地分支全部失效、CI 缓存与制品对应关系错乱、审计链条断裂。**判据必须前置：集成分支的写权限里，应当从机制上排除破坏性重置，而不是靠提醒。**\n\n#### 落地练习\n\n1. 检查你当前的集成分支保护规则，确认是否从机制上禁止了破坏性重置。\n2. 演练一次纯包回滚：不碰版本库，仅用历史制品恢复服务，记录耗时。\n3. 把\"上线后优先包回滚\"写入发布预案，并标注禁用 reset --hard 的分支清单。", "subs": ["定义与问题：两种回滚的本质差异", "机制与链路：三类代码回滚场景", "操作与实现的边界", "观察与判断：回滚能力是否达标", "边界与风险：重置的诱惑", "落地练习"]}, {"title": "依赖管理要维护的几条治理线", "content": "依赖不是\"能编译通过就行\"的附属物，而是交付物里最容易被忽视、却最难追溯的组成部分。**依赖治理的目标是让\"我的系统到底由哪些外部代码组成、各自是什么版本、是否冲突\"这件事始终可回答；做不到这一点，安全漏洞和版本冲突都会在你最不想面对的时候爆发。**\n\n#### 机制与链路：依赖仲裁与冲突消解\n\n以 Maven 体系为例，依赖治理依赖几条可执行的规则，它们解决的是\"同一个库出现多个版本时听谁的\"：\n\n| 规则 | 含义 | 治理价值 |\n| --- | --- | --- |\n| 最短路径优先 | 依赖树中路径更短（更直接）的版本胜出 | 防止深层传递依赖悄悄覆盖预期版本 |\n| 第一声明优先 | 路径长度相同时，先声明者胜出 | 让显式声明拥有确定性话语权 |\n| BOM 统一管理 | 用物料清单集中锁定一组版本 | 避免同一库在各模块版本漂移 |\n| dependencyManagement | 声明但不引入，由使用者决定 | 把版本决策权上收，使用下放 |\n\n这四条里，最短路径和第一声明解决\"冲突时听谁的\"，BOM 与 dependencyManagement 解决\"如何让版本不漂移\"。二者配合，依赖树才是可预测的。\n\n#### 操作与实现的边界\n\nsuper-pom 继承树如何组织、dependencyManagement 块怎么写，属于工具层，不在此展开。本册要你先定的治理线是：**是否禁止向共享仓库上传 SNAPSHOT 版本，以及是否禁止\"不改版本号就覆盖上传\"——这两条是依赖可信度的底线。**\n\n#### 观察与判断：依赖是否失控\n\n- 能否在一分钟内列出某应用的直接依赖与传递依赖的完整树。\n- 是否存在同一个库在依赖树里出现多个大版本且无人知晓。\n- SNAPSHOT 是否出现在任何生产构建的路径上（出现即风险）。\n\n#### 边界与风险：SNAPSHOT 与版本覆盖\n\nSNAPSHOT 版本的本质是\"随时可能变的同一坐标\"，它一旦进入生产构建，就意味着\"两次构建同一版本号可能得到不同内容\"。**\"不改版本号上传\"则更直接地破坏了单一可信源——同一个坐标指向了不可区分的多份内容，回滚和审计同时失效。** 这两条必须作为硬性禁令，而非约定。\n\n#### 落地练习\n\n1. 对核心应用跑一次依赖树分析，标出所有出现多版本的库及其仲裁结果。\n2. 检查生产构建链路，确认没有任何 SNAPSHOT 坐标进入。\n3. 在制品仓库策略里确认\"同版本号覆盖上传\"被禁用，并记录例外清单（应为空）。", "subs": ["机制与链路：依赖仲裁与冲突消解", "操作与实现的边界", "观察与判断：依赖是否失控", "边界与风险：SNAPSHOT 与版本覆盖", "落地练习"]}]}, {"title": "第 2 章 · 环境治理与配置决策", "sections": [{"title": "要几个环境：从现实需求推导", "content": "环境的个数不是拍脑袋定的，而是由\"每套环境要服务谁\"推导出来的。**判断环境数量的第一性原理是：好环境的标准不是数量，而是它能否满足其目标用户的需求；先把每套环境的核心用户定义清楚，数量自然浮现，而不是反过来用数量去硬凑流程。**\n\n#### 定义与问题：环境为谁而建\n\n一套典型的研发到生产链路会经过开发、功能测试、验收、预发布、生产五类环境，但关键不在于\"必须有五套\"，而在于每套的核心用户不同，诉求也不同：\n\n| 环境 | 核心用户 | 核心诉求 | 判断标准 |\n| --- | --- | --- | --- |\n| 开发环境 | 开发者本人 | 改完立刻能跑、能自测 | 启动快、可随意破坏 |\n| 功能测试环境 | 测试人员 | 稳定可重复地验证功能 | 数据可控、不被他人打断 |\n| 验收环境 | 产品/业务方 | 按业务视角确认可接受 | 贴近生产的数据与配置 |\n| 预发布环境 | 运维/发布负责人 | 上线前做最后验证 | 软硬件尽量等同生产 |\n| 生产环境 | 真实用户 | 持续可用 | 一切以稳定性为先 |\n\n每套环境只要能服务好它的核心用户，就是\"好环境\"；一套环境若试图同时满足所有用户，往往会谁都满足不好。\n\n#### 机制与链路：从用户诉求推环境职责\n\n```mermaid\ngraph TD\n    A[开发者改完代码] --> B[开发环境自测]\n    B --> C[功能测试环境验证]\n    C --> D[验收环境业务确认]\n    D --> E[预发布环境上线前验证]\n    E --> F[生产环境对用户开放]\n```\n\n这条链路的每一跳都对应一类用户交接。判断\"要不要某套环境\"，等价于判断\"有没有一类用户必须在此被服务\"。例如验收环境存在的理由，是产品和业务方需要一个独立于测试的确认点；若业务方直接在测试环境确认，这套环境就可以合并掉。\n\n#### 观察与判断：环境是否过多或过少\n\n- 是否存在\"没人真正使用、只是流程要求\"的环境——过多信号。\n- 是否存在\"一类用户被迫借用别人的环境完成本职工作\"——过少信号。\n- 环境之间是否在重复承担同一类用户诉求——应当合并。\n\n#### 边界与风险：用数量掩盖需求不清\n\n用\"多加一套环境\"来解决协作摩擦，是典型的治标。比如测试和开发总是互相打断，根因往往是\"没有稳定的功能测试环境归属规则\"，而非\"环境不够\"。**加环境解决的是容量，解决不了归属；先把每套环境服务谁定义清楚，再谈加不加。**\n\n#### 落地练习\n\n1. 列出当前所有环境，为每套标注\"核心用户\"和\"它真正解决了谁的什么问题\"。\n2. 找出既无明确核心用户、又无人日常使用的环境，评估能否合并或下线。\n3. 找出某类用户被迫借用他人环境的场景，判断是否需要独立的归属环境。", "subs": ["定义与问题：环境为谁而建", "机制与链路：从用户诉求推环境职责", "观察与判断：环境是否过多或过少", "边界与风险：用数量掩盖需求不清", "落地练习"]}, {"title": "环境数量决策：成本与效率视角", "content": "从需求侧推导完环境职责后，还要从成本侧做一次反向约束，否则环境会无限膨胀。**环境的总成本由机器资源、管理开销、流程损耗三部分构成；控制成本的核心判据是：用\"公共环境 + 泳道隔离\"替代\"多套全等公共环境\"，并尽量压低每套环境的配置复杂度。**\n\n#### 定义与问题：三类成本\n\n| 成本类型 | 含义 | 容易被忽视的点 |\n| --- | --- | --- |\n| 机器资源成本 | 环境占用的计算、存储、网络 | 闲置环境仍在计费 |\n| 管理成本 | 环境创建、维护、升级的人力 | 环境越多，一致性越难保证 |\n| 流程损耗 | 环境排队、等待、冲突导致的交付延迟 | 隐性但持续，随规模放大 |\n\n三类成本里，流程损耗最隐蔽：当环境成为稀缺资源，团队会花大量时间排队和协调，这种损耗不会出现在账单上，却直接拉长交付周期。\n\n#### 机制与链路：公共环境 + 泳道隔离\n\n降低成本的经典做法是区分\"公共基础环境\"与\"个人/特性泳道\"：公共环境承载稳定共享的部分，泳道只隔离变动中的那部分流量与数据。这样大多数团队共享一套底层，只有正在开发的特性才占用独立资源。\n\n```mermaid\ngraph TD\n    A[公共基础环境 稳定共享] --> B[特性泳道1 隔离变动]\n    A --> C[特性泳道2 隔离变动]\n    A --> D[特性泳道N 隔离变动]\n    B --> E[合并后释放泳道]\n    C --> E\n    D --> E\n```\n\n判据是：**能靠泳道隔离解决的问题，就不要新建一整套公共环境。** 多套完全对等的公共环境，往往是成本失控而不是效率提升。\n\n#### 观察与判断：成本是否失衡\n\n- 环境的总体机器成本中，闲置占比是否过高（示例假设，非实测数据：若某环境周利用率低于 20%，应评估合并或按需启停）。\n- 是否存在\"为不同项目各建一套全等公共环境\"的情况——这是泳道可替代的典型。\n- 配置复杂度是否随环境数线性上升，导致一致性维护成为主要负担。\n\n#### 边界与风险：压低成本牺牲可信度\n\n强调成本不等于无脑合并。预发布环境之所以贵，是因为它要尽可能等同生产；用一套简化环境冒充预发布，省下的是机器钱，赔上的是上线前最后一道验证的可信度。**成本约束的底线是：不能为了省钱，把\"需要等同生产\"的环境降级成\"近似生产\"。**\n\n#### 落地练习\n\n1. 估算每套环境的周利用率，标出闲置严重的环境并给出合并或按需启停建议。\n2. 检查是否存在多套对等公共环境，评估其中哪些可用泳道替代。\n3. 确认预发布环境的\"等同生产\"程度，记录任何为省钱而做的降级及其风险。", "subs": ["定义与问题：三类成本", "机制与链路：公共环境 + 泳道隔离", "观察与判断：成本是否失衡", "边界与风险：压低成本牺牲可信度", "落地练习"]}, {"title": "环境自描述：可读的环境事实", "content": "环境一旦变多，最大的麻烦不是创建，而是\"没人说得清某套环境现在到底是什么状态\"。**环境自描述的核心判据是：环境的状态、版本、配置应当由环境自身声明，而不是由文档或人口头维护；当环境能\"自报家门\"，环境的创建、交接与回收才具备可扩展性。**\n\n#### 定义与问题：运行时配置与环境配置分离\n\n环境配置通常拆成两层：一层是应用运行时的通用配置（如框架参数），一层是环境特有的配置（如该环境的地址、依赖端点）。前者应随应用走，后者应随环境走，二者混淆是环境不可复现的根源。\n\n| 配置层 | 归属 | 错误合并的后果 |\n| --- | --- | --- |\n| 运行时配置 | 跟随应用版本 | 环境差异被写死进代码，换环境要改代码 |\n| 环境配置 | 跟随环境实例 | 环境状态无法独立声明与还原 |\n\n#### 机制与链路：标准化与自发现\n\n环境自描述依赖三条机制：标准化（约定大于配置，同名即同义）、服务自发现（组件登记后自动被识别）、Server Spec（环境以声明式规格存在）。当环境以规格文件描述自己，创建环境就等于\"应用一份规格\"，回收环境就等于\"删除一份规格\"。\n\n```mermaid\ngraph TD\n    A[环境规格文件声明自身] --> B[标准化命名与约定]\n    B --> C[组件自发现并注册]\n    C --> D[环境状态可被程序读取]\n    D --> E[创建即应用规格 回收即删规格]\n```\n\n#### 观察与判断：环境是否自描述\n\n- 新成员能否不看任何人，仅凭环境自身暴露的元信息知道\"这是哪套环境、跑的什么版本\"。\n- 一套环境的完整状态能否用一份文件表达，而不依赖 wiki 或聊天记录。\n- 环境被克隆或重建后，是否自动带上正确的身份，而非需要人工贴标签。\n\n#### 边界与风险：过度声明反而复杂\n\n自描述不是\"把所有细节都写进规格\"。过度声明会让规格文件本身变成需要维护的负担，违背\"降低复杂度\"的初衷。**判据是：只声明那些\"区分环境身份与状态所必须\"的字段，其余交给约定。**\n\n#### 落地练习\n\n1. 任取一套环境，尝试仅凭它自身暴露的元信息重建一份\"环境身份卡\"，看是否缺字段。\n2. 找出当前靠口头/文档维护的环境状态，评估能否改为环境自声明。\n3. 检查规格文件是否过度膨胀，删去非身份必需的字段。", "subs": ["定义与问题：运行时配置与环境配置分离", "机制与链路：标准化与自发现", "观察与判断：环境是否自描述", "边界与风险：过度声明反而复杂", "落地练习"]}, {"title": "配置方法的两面性与常见陷阱", "content": "配置手段的丰富程度，几乎和它能制造的问题数量成正比。**选型的第一判据是：配置的生效时机越晚（运行时），灵活性越高，但回滚与一致性越难；构建时配置简单可控，却把环境差异提前固化进制品。没有\"最好\"的配置方法，只有\"风险是否可见\"的配置方法。**\n\n#### 定义与问题：三种配置时机\n\n| 配置方法 | 生效时机 | 灵活性 | 主要陷阱 |\n| --- | --- | --- | --- |\n| 构建时配置 | 编译打包阶段写死 | 低，环境差异固化进制品 | 同一制品无法跨环境，制品不再唯一 |\n| 打包时配置 | 打包容器的阶段注入 | 中 | 仍需为不同环境准备不同包 |\n| 运行时配置（配置中心） | 应用启动/运行期下发 | 高，可动态变更 | 回滚配置与回滚代码容易死循环 |\n\n#### 机制与链路：配置回滚的死循环\n\n运行时配置最危险的陷阱，是\"配置错了先回滚配置，但代码依赖新配置；回滚代码又要求旧配置\"——配置与代码互相绑架，形成无法一次性恢复的死循环。\n\n```mermaid\ngraph TD\n    A[新配置上线引发异常] --> B[回滚配置到旧值]\n    B --> C[旧配置与新代码不兼容]\n    C --> D[被迫回滚代码]\n    D --> E[旧代码又需新配置]\n    E --> A\n```\n\n打破死循环的唯一干净做法是**让配置与代码作为一个整体版本化、一起发布、一起回滚**，而不是把它们当作两个独立可变的实体分别处置。\n\n#### 观察与判断：配置风险是否可见\n\n- 一次配置变更，能否和对应的代码变更绑定到同一个发布单元。\n- 运行时配置变更是否有独立的审计与回滚通道，且不与代码回滚冲突。\n- 是否存在\"配置和代码由不同人、不同节奏变更\"的情况——这是死循环的前提。\n\n#### 边界与风险：不要为灵活而灵活\n\n配置中心带来的动态能力很诱人，但把本应固定的环境参数也做成运行时可改，等于把稳定性寄托在\"没人误改\"上。**判据：凡是不需要在运行时动态切换的参数，优先在构建/打包阶段固定，而不是放进配置中心增加攻击面。**\n\n#### 落地练习\n\n1. 列出当前所有运行时配置项，标出哪些其实不需要动态变更、可以下沉到构建期。\n2. 设计一次\"配置-代码联合回滚\"演练，验证能否一次性恢复而不死循环。\n3. 检查配置中心里是否存在\"本应固定却被频繁改\"的参数，评估收回。", "subs": ["定义与问题：三种配置时机", "机制与链路：配置回滚的死循环", "观察与判断：配置风险是否可见", "边界与风险：不要为灵活而灵活", "落地练习"]}, {"title": "分钟级环境：可行路径与隐藏代价", "content": "\"分钟级搭建一套环境\"是很多团队的理想，但它真实可行的前提比想象中苛刻。**分钟级环境的判据不在\"能不能快\"，而在\"资源池是否预置、部署是否可并行、变更是否幂等\"；跳过这三件事谈提速，得到的是偶尔快、经常卡的环境创建，而不是可承诺的分钟级。**\n\n#### 机制与链路：提速的三根支柱\n\n| 支柱 | 作用 | 缺失的后果 |\n| --- | --- | --- |\n| 资源池预置 | 提前备好可分配的计算资源 | 现申请资源，创建被底层配额卡住 |\n| 应用部署并行度 | 多应用同时部署而非串行 | 应用数一多，总时间线性膨胀 |\n| 容错与幂等 | 失败可重试且不留脏状态 | 一次中断导致整批环境半残 |\n\n容错尤其关键：环境创建常常遇到\"某个应用部署失败要不要中断整批\"的取舍。两种策略各有权衡——中断能让问题暴露得干净，优先完成+幂等则能保证大部分环境可用。选择哪种，取决于\"你更怕脏状态还是更怕不完整\"。\n\n#### 操作与实现的边界\n\n资源池如何预置、并行度如何在编排工具里配置，属于 Ansible 与编排层内容，见 [Ansible 第二册第 8 章](../ansible/02-playbooks-operations-and-delivery.md)。本册的治理命题是：**先确认你的资源池、并行度、幂等策略这三件事是否就绪，再承诺分钟级。**\n\n#### 观察与判断：是否真分钟级\n\n- 环境创建耗时的分布（P50/P95）是否稳定，而非只在最好情况下达标（示例假设，非实测数据：若 P95 是 P50 的 5 倍以上，说明存在不可控瓶颈）。\n- 创建失败后，残留的半残环境是否需要人工清理——需要即幂等没做好。\n- 环境变更（合并、拆分、克隆）是否也具备同等速度，还是只在\"从零新建\"时快。\n\n#### 边界与风险：速度掩盖的不一致\n\n分钟级创建的副作用，是环境之间更容易出现\"创建顺序不同导致状态不同\"的细微差异。容器通过分层镜像部分缓解了这个问题（见本章\"容器解决了什么、没解决什么\"），但若底层仍是传统虚拟机，快速克隆可能克隆出不一致。**速度承诺必须绑定\"一致性承诺\"，否则快出来的环境不可信。**\n\n#### 落地练习\n\n1. 统计近一个月环境创建的 P50 与 P95 耗时，判断是否稳定达标。\n2. 检查创建失败的环境是否自动回到干净状态，标出需要人工清理的环节。\n3. 确认资源池、并行度、幂等三项中哪项是当前瓶颈，给出优先补强顺序。", "subs": ["机制与链路：提速的三根支柱", "操作与实现的边界", "观察与判断：是否真分钟级", "边界与风险：速度掩盖的不一致", "落地练习"]}, {"title": "容器解决了什么、没解决什么", "content": "容器常被宣传成环境管理的救星，但它在治理层面的真实贡献和边界需要分开看。**容器真正解决的是\"交付标准统一\"——结果一致、自动化、个性化可控、版本可追溯；它没解决的是\"个性化配置本身依旧痛苦\"，以及\"有状态部分依旧不可一刀切不可变\"。把容器当银弹，会让团队在个性化与有状态两处踩坑。**\n\n#### 定义与问题：重定义交付标准\n\n容器把交付物从\"一份可能在不同机器表现不同的包\"变成\"一份分层、只读、带版本的图像\"，从而重新定义了交付标准：\n\n| 交付标准维度 | 容器带来的改变 |\n| --- | --- |\n| 结果一致 | 同一镜像在任何节点运行行为一致 |\n| 自动化 | 创建即运行，启停标准化 |\n| 个性化 | 通过分层与个人化镜像满足差异 |\n| 版本控制 | 镜像 tag 即版本，可追溯 |\n\n#### 机制与链路：不可变基础设施的落地\n\n容器是\"不可变基础设施\"最易获得的实现：实例一旦创建即为只读，变更靠\"建新替旧\"而非\"改旧\"。这与第 5 章的不可变交付一脉相承。容器镜像的构建与多平台分发细节，见 [Docker 第五册](../../cloud-native/docker/05-application-containerization-and-multi-platform-builds.md)。\n\n```mermaid\ngraph TD\n    A[变更需求] --> B[构建新镜像 新tag]\n    B --> C[新实例替换旧实例]\n    C --> D[旧实例保留待回滚]\n    D --> E[确认无误后回收旧实例]\n```\n\n#### 观察与判断：容器是否用对了\n\n- 镜像是否真正只读、不可被运行时修改（若允许运行时改，不可变即失效）。\n- 个性化差异是否通过分层/不同镜像表达，而非\"启动后脚本改一大堆\"。\n- 有状态部分（数据库等）是否被明确排除在不可变之外、单独治理。\n\n#### 边界与风险：不是银弹\n\n容器的两个未解之题必须正视：一是个性化——当每个环境差异很大，维护一堆细微不同的镜像本身就很痛苦；二是有状态——数据库等有状态组件无法每次重建。把这两类强行容器化不可变，只会制造新的运维灾难。**判据：容器适合无状态交付物，有状态与高度个性化要另立治理，不要强行统一。**\n\n#### 落地练习\n\n1. 检查当前镜像是否在运行时被修改，标出破坏不可变的入口。\n2. 列出所有\"高度个性化\"的环境差异，判断哪些是镜像分层能解决、哪些需要别的手段。\n3. 明确有状态组件的治理方案，确认它们没有被错误地纳入不可变镜像流。", "subs": ["定义与问题：重定义交付标准", "机制与链路：不可变基础设施的落地", "观察与判断：容器是否用对了", "边界与风险：不是银弹", "落地练习"]}, {"title": "一切皆代码的适用边界", "content": "\"环境管理一切皆代码\"是基础设施即代码（IaC）理念的延伸，它能带来一致、可审计、可回滚的环境生命周期，但并非所有环境环节都适合代码化。**适用边界的判据是：凡是\"高频变更、需要审计、希望可重建\"的环境定义，应当代码化；凡是\"低频、强依赖人工判断、或成本高于收益\"的环节，强行代码化反而增加负担。**\n\n#### 定义与问题：IaC 承载的治理价值\n\nIaC 把环境的创建、配置、变更都表达为代码，带来三件事：一致性（同一份代码永远建出同一环境）、可追溯（每次变更有版本与评审）、可重建（出事能按代码重来）。这与第 1 章\"配置管理四支点\"完全对齐。\n\n| 环境环节 | 是否适合代码化 | 理由 |\n| --- | --- | --- |\n| 环境拓扑与资源定义 | 适合 | 高频、需一致、需审计 |\n| 应用部署编排 | 适合 | 需可重复执行 |\n| 一次性排障操作 | 不适合 | 低频、强依赖现场判断 |\n| 极特殊的人工调参 | 谨慎 | 成本可能高于收益 |\n\n#### 机制与链路：代码化环境的生命周期\n\n```mermaid\ngraph TD\n    A[环境定义写成代码] --> B[评审合入版本库]\n    B --> C[流水线应用代码建环境]\n    C --> D[环境状态与代码一致]\n    D --> E[变更走同一代码通道]\n    E --> B\n```\n\nGitOps 是把这套生命周期进一步推向\"以 Git 为唯一控制面\"的实践，细节见 [GitOps 第一册](../gitops/01-principles-workflow-and-adoption.md)。\n\n#### 观察与判断：代码化是否适度\n\n- 环境的\"定义\"与\"运行中的临时状态\"是否被正确分离——只有前者该代码化。\n- 是否存在为了代码化而把本该一次性的排障动作也塞进模板，导致模板臃肿。\n- 代码化后，重建一套环境的耗时是否真的显著低于手工，收益是否覆盖维护成本。\n\n#### 边界与风险：代码化不是目的\n\n最常见的退坡是\"为了 IaC 而 IaC\"：把大量本可参数化的内容写死进模板，结果模板比手工还难改。**判据：代码化环境的目标是可重建与可审计，如果一份环境代码半年不变且从未被重建引用，它更可能是负担而非资产。**\n\n#### 落地练习\n\n1. 列出当前环境定义里\"真正被频繁重建/审计\"的部分，确认它们已代码化。\n2. 找出写死在模板里却几乎不变的配置，评估是否应参数化或移出。\n3. 演练一次\"按代码重建核心环境\"，记录是否比手工更可信、更快。", "subs": ["定义与问题：IaC 承载的治理价值", "机制与链路：代码化环境的生命周期", "观察与判断：代码化是否适度", "边界与风险：代码化不是目的", "落地练习"]}]}, {"title": "第 3 章 · 质量、债务与破坏性验证的决策", "sections": [{"title": "自动化测试：先投哪里、能覆盖什么", "content": "自动化测试是质量保障的主力，但它既不是免费的，也不是处处适用的。**投入的第一判据是：先把测试资源投向\"重复、稳定、跨平台、长耗时\"的场景，这些场景自动化的收益最高；把自动化塞进\"易变、低频、依赖人工判断\"的场景，往往得不偿失。测试三角形之类模型只是提醒你别只测一端，不是必须严格遵循的形状。**\n\n#### 定义与问题：适用与不适用的分界\n\n| 场景特征 | 适合自动化 | 不适合自动化 |\n| --- | --- | --- |\n| 执行频率 | 高，反复跑 | 极低，偶尔一次 |\n| 结果稳定性 | 稳定，同输入同输出 | 易变，依赖主观判断 |\n| 平台差异 | 需跨多平台验证 | 单一且稳定 |\n| 耗时 | 长，手工不划算 | 短，手工更快 |\n\n误报率是自动化测试的生命线：一个经常误报的用例，会被团队默默忽略，等于没有。覆盖率高也不等于质量高——追求数字会诱导出大量无意义断言。\n\n#### 机制与链路：测试分层与反馈速度\n\n测试分层（单元、集成、端到端）的价值在于把\"快而窄\"的反馈放在底层、\"慢而广\"的反馈放在顶层，让大部分问题在低成本处被发现。但分层形状（三角形或菱形）取决于系统形态，不应教条。\n\n```mermaid\ngraph TD\n    A[代码提交] --> B[单元测试 快而窄]\n    B --> C[集成测试 中速中广]\n    C --> D[端到端测试 慢而广]\n    D --> E[反馈回到开发者]\n    E --> A\n```\n\n#### 观察与判断：测试投入是否健康\n\n- 自动化用例的误报率是否低于可接受阈值（示例假设，非实测数据：持续高于某比例则应降级或重写，而非保留）。\n- 测试是否在\"该快的地方慢、该稳的地方飘\"——即分层错位。\n- 覆盖率是否被当作目标本身，而非\"哪里该补测试\"的线索。\n\n#### 边界与风险：穷尽测试是伪命题\n\n随着发布频率上升，留给测试的时间被压缩，而系统复杂度指数上升，\"把所有测试都做完再发\"在现实中不可达。**DevOps 模式下的质量思想转变是：在保障一定质量水平的前提下加快节奏，把剩余风险交给低风险发布与线上监控去兜，而不是试图在发布前穷尽一切。** 这一转变在第 5 章发布治理里展开。\n\n#### 落地练习\n\n1. 统计自动化用例的误报次数，标出误报率最高的用例并决定重写或下线。\n2. 检查测试分层是否存在\"底层慢、顶层快\"的畸形，调整投入比例。\n3. 把覆盖率从\"达标数字\" reinterpret 为\"未覆盖区的业务风险清单\"。", "subs": ["定义与问题：适用与不适用的分界", "机制与链路：测试分层与反馈速度", "观察与判断：测试投入是否健康", "边界与风险：穷尽测试是伪命题", "落地练习"]}, {"title": "内建质量：从下游检测转向上游预防", "content": "传统质量观把测试放在链路末端，等缺陷被\"检出来\"；内建质量主张把质量能力前置到开发环节，让缺陷尽量在产生时被阻断。**转型的第一判据是：质量不再是测试团队单独背的责任，而是整个交付团队共用的一组结果指标；上游预防的性价比远高于下游检测的堆积。**\n\n#### 定义与问题：从检测到预防的范式\n\n下游检测模式的问题是\"缺陷已经存在才被发现\"，修复成本随阶段后移急剧上升。上游预防通过把检查能力嵌入开发过程，让问题在提交前或合入前就被暴露。\n\n| 模式 | 缺陷发现时点 | 修复成本 | 责任归属 |\n| --- | --- | --- | --- |\n| 下游检测 | 测试/验收阶段 | 高 | 测试团队 |\n| 上游预防（内建质量） | 开发/合入前 | 低 | 交付团队共担 |\n\n#### 机制与链路：内建质量的五步落地\n\n把\"内建质量\"抽象成可执行的五步，而不依赖任何特定公司的实践叙事：\n\n```mermaid\ngraph TD\n    A[选定要检查的质量类型] --> B[定义可量化指标]\n    B --> C[把检查自动化嵌入流水线]\n    C --> D[定义不达标时的处置]\n    D --> E[持续优化配置与阈值]\n    E --> A\n```\n\n其中\"即时止错机制\"是上游预防的关键装置：当某环节检测到质量红线被触碰，应能在最小范围内暂停并报警，而不是让缺陷继续流向后续阶段。这与第 4 章\"构建门禁\"、第 5 章\"发布刹车\"是同一思路在不同环节的体现。\n\n#### 观察与判断：是否真内建\n\n- 质量问题是否在开发自测阶段就被大量暴露，而非堆到测试阶段集中爆发。\n- 团队是否对\"同一组质量结果指标\"共同负责，还是仍把质量等同于测试通过率。\n- 检查能力是否嵌入流水线自动执行，还是靠人工自觉。\n\n#### 边界与风险：预防不等于零缺陷\n\n内建质量降低缺陷流入下游的概率，但不承诺消灭缺陷。把它宣传成\"上游做完下游就不用测\"，会反过来削弱端到端验证。**判据：上游预防减少的是\"本可在源头拦住的问题\"，端到端验证保留的是\"只有整体才暴露的问题\"，二者互补而非替代。**\n\n#### 落地练习\n\n1. 画出当前缺陷从产生到发现的流向，标出\"本可在上游拦住却流到下游\"的比例。\n2. 选定一类质量红线（如空指针、未处理异常），设计其上游自动检查与即时止错动作。\n3. 把质量结果指标从\"测试通过率\"扩展为团队共用指标，记录责任共担的变化。", "subs": ["定义与问题：从检测到预防的范式", "机制与链路：内建质量的五步落地", "观察与判断：是否真内建", "边界与风险：预防不等于零缺陷", "落地练习"]}, {"title": "技术债务的定价与资源竞争", "content": "技术债务的治理在 [GitOps 第一册第 9 章](../gitops/01-principles-workflow-and-adoption.md) 已有完整的\"登记表与预算机制\"，本册不再展开机制，只补一个上游决策命题：**技术债务的偿还不能只按\"技术洁癖\"排序，而必须和容量投入、稳定性投入放在同一个优先级池里竞争资源；否则债务治理会永远排在业务需求之后，直到某次事故把它强行提上日程。**\n\n#### 治理判据：债务与容量/稳定性的资源竞争\n\n技术债务、容量余量、稳定性加固三者都消耗同一批研发资源，却常被不同角色分别主张。判据是：**任何一笔技术债务的偿还，都应显式说明它\"避免了哪类未来风险、释放了哪部分容量或稳定性预算\"，否则它无法在优先级会议上胜出。**\n\n| 候选投入 | 主张的收益 | 错配的风险 |\n| --- | --- | --- |\n| 偿还技术债务 | 长期可维护、减少意外 | 若不与风险挂钩，常被业务需求挤掉 |\n| 容量投入 | 扛住峰值、降低延迟 | 过度投入造成资源浪费 |\n| 稳定性加固 | 减少故障、缩短恢复 | 与债务偿还争同一资源 |\n\n#### 取舍与副作用\n\n把债务\"定价\"的具体做法（触发场景、影响范围、成本、风险趋势、Owner、复查日期、门禁预算）已在上述 GitOps 主题中给出。本册补充的取舍点是：**债务登记表的预算不应是独立额度，而应和业务需求、容量、稳定性进入同一优先级评审；当债务的风险趋势持续上升时，它应当自动获得更高权重，而不是等事故发生。**\n\n#### 边界与风险：别把债务当万能理由\n\n技术债务如果被任何人随时拿来阻塞发布，会变成另一种形式的\"流程约束替代工程约束\"。**判据：债务的偿还动作本身也要评估成本与收益，不能用\"这是技术债\"一句话无限期拖延业务交付。**\n\n#### 链接与落地练习\n\n1. 阅读并沿用 [GitOps 第一册第 9 章](../gitops/01-principles-workflow-and-adoption.md) 的技术债务登记表模板。\n2. 在当前优先级评审里，确认技术债务是否与容量、稳定性进入同一资源池竞争，而非独立额度。\n3. 挑一笔风险趋势上升的债务，尝试用\"它避免的未来故障/释放的容量\"说服一次排期。", "subs": ["治理判据：债务与容量/稳定性的资源竞争", "取舍与副作用", "边界与风险：别把债务当万能理由", "链接与落地练习"]}, {"title": "静态检查的落地姿势与豁免治理", "content": "静态检查是把质量门禁前移到\"代码尚未运行\"阶段的最便宜手段，但落地不当会变成噪音源头。**落地判据是：先建最小规则集再逐步加严，坚持增量检查为主、全量检查为辅，并为不可避免的豁免建立透明机制；没有豁免治理的静态检查，最终会被团队用\"全部忽略\"反噬。**\n\n#### 定义与问题：三个检查时点\n\n静态检查贯穿三个时点，治理重点不同：\n\n| 时点 | 目的 | 治理要点 |\n| --- | --- | --- |\n| IDE 内 | 开发者即时反馈 | 规则应轻，避免打断心流 |\n| 合入前 | 阻断明显问题进主干 | 规则可较严，但需增量 |\n| 发布前 | 最后一道静态红线 | 规则聚焦高危项 |\n\n#### 机制与链路：最小规则集与增量检查\n\n最小规则集（Profile）的核心思想是\"先只开那些共识高、误报低的规则\"，避免一开始就海量报错导致团队放弃。增量检查只对新改动生效，既控制噪音又保证新代码不引入新问题。\n\n```mermaid\ngraph TD\n    A[代码改动提交] --> B[IDE轻规则即时反馈]\n    B --> C[合入前增量检查阻断高危]\n    C --> D[发布前静态红线终审]\n    D --> E[豁免需显式登记]\n    E --> C\n```\n\n#### 观察与判断：静态检查是否健康\n\n- 规则集是否从最小集长起来的，还是一次性全开导致大量误报。\n- 豁免是\"显式登记、有期限、有 Owner\"，还是\"默默加 ignore\"——后者是腐化信号。\n- 增量检查是否真正生效，老代码的问题是否在逐步收敛而非被全量噪音淹没。\n\n#### 边界与风险：豁免的两面\n\n豁免机制必须存在（否则特殊合理情况无处安放），但豁免一旦无门槛，检查就名存实亡。**判据：豁免必须可审计——文件级/方法级/级别调整都要登记原因与有效期，定期回顾，过期的豁免自动失效。**\n\n#### 落地练习\n\n1. 检查当前静态检查规则集是否从最小集演进，标出误报率高却仍开启的规则。\n2. 统计豁免条数，确认每条都有原因、Owner 与有效期，清理过期项。\n3. 验证增量检查是否只对新改动生效，避免老代码噪音掩盖新问题。", "subs": ["定义与问题：三个检查时点", "机制与链路：最小规则集与增量检查", "观察与判断：静态检查是否健康", "边界与风险：豁免的两面", "落地练习"]}, {"title": "破坏性测试与混沌工程的引入时机", "content": "破坏性测试与混沌工程代表质量验证的另一端：不再只验证\"功能正确\"，而是主动验证\"系统在部分失效时是否仍可控\"。**引入的第一判据是：当你已经能把常规功能与性能验证做扎实、且系统已有基本的可观测性与熔断能力时，才值得投入混沌实验；在基础薄弱时做混沌，只会产生无法归因的事故。**\n\n#### 定义与问题：破坏性测试是什么\n\n破坏性测试刻意制造异常（断网、杀进程、延迟、丢包），观察系统是否能降级、恢复、不雪崩。混沌工程是它的系统化形态，强调用实验而非随机破坏。\n\n| 要素 | 说明 |\n| --- | --- |\n| 稳定状态假设 | 先定义\"系统正常时长什么样\" |\n| 真实事件 | 注入的是现实中可能发生的故障 |\n| 生产实验 | 在真实环境验证（或高度等同） |\n| 持续自动化 | 实验可重复、可纳入流水线 |\n| 最小影响范围 | 控制爆炸半径，可随时中止 |\n\n#### 机制与链路：四步引入混沌实验\n\n```mermaid\ngraph TD\n    A[定义稳定状态假设] --> B[建立对照组与实验组]\n    B --> C[注入可控变量 如杀节点]\n    C --> D[比对两组差异 找薄弱点]\n    D --> E[修复并重复实验]\n    E --> A\n```\n\n四步里最容易被跳过的是\"定义稳定状态假设\"——没有基线，就无法判断实验是否暴露了问题。\n\n#### 观察与判断：是否具备引入条件\n\n- 系统是否已有基本的可观测性（指标、日志、链路），否则实验无据可依。\n- 是否已有熔断/降级/重试等弹性能力，否则混沌只会制造真实事故。\n- 常规功能与性能测试是否已扎实，混沌应是增量而非替代。\n\n#### 边界与风险：混沌不是制造事故的借口\n\n混沌工程要求\"最小影响范围\"和\"可随时中止\"，把它当成对生产随意搞破坏，是严重误用。**判据：任何混沌实验都必须预设爆炸半径与中止开关，且先在预发布等同环境跑通，再慎重上生产。**\n\n#### 落地练习\n\n1. 为当前核心服务定义一条\"稳定状态假设\"（如错误率、延迟的常态区间）。\n2. 在预发布环境设计一个最小混沌实验（如杀掉一个无状态实例），验证系统是否自动恢复。\n3. 确认实验具备中止开关与爆炸半径控制，记录首次实验暴露的薄弱点。", "subs": ["定义与问题：破坏性测试是什么", "机制与链路：四步引入混沌实验", "观察与判断：是否具备引入条件", "边界与风险：混沌不是制造事故的借口", "落地练习"]}, {"title": "Mock 与流量回放的适用边界", "content": "自动化回归长期受三座大山压制：测试数据难造、分布式依赖难控、环境难高度仿真。Mock 与流量回放是绕过它们的两类手段，但各有适用边界。**判据是：Mock 适合隔离不稳定依赖、加速单点验证；流量回放适合在高度仿真层面验证整体行为。二者互补，用 Mock 替代真实交互过多会失去真实性，用回放替代构造数据过多会失去可控性。**\n\n#### 定义与问题：两类手段的定位\n\n| 手段 | 适用 | 风险 |\n| --- | --- | --- |\n| Mock（对象/服务级） | 依赖不稳定、难构造、需加速 | 过度 Mock 让测试脱离真实交互 |\n| 流量回放 | 需高度仿真、验证真实行为 | 数据治理与脱敏成本高、可控性差 |\n\n#### 机制与链路：回放的三段\n\n流量回放可拆为抽样、拦截、压缩回放三个阶段：从线上抽样真实流量，拦截并脱敏，再以压缩/倍速方式回放到待测环境，比对结果。它和混沌工程的\"流量镜像\"、发布治理的\"暗部署\"在技术上同源，都是\"用真实流量验证\"的思路。\n\n```mermaid\ngraph TD\n    A[线上抽样真实流量] --> B[拦截并脱敏]\n    B --> C[压缩或倍速回放]\n    C --> D[比对回放与线上结果]\n    D --> E[发现行为差异]\n```\n\n#### 观察与判断：用对了没有\n\n- Mock 是否只用于\"确实需要隔离\"的依赖，而非为了方便把所有外部调用都打桩。\n- 回放流量是否经过脱敏，且是否覆盖到边界与异常场景，而非只回放成功路径。\n- 回放结果的比对是否自动，还是靠人工看日志。\n\n#### 边界与风险：真实性与可控性的权衡\n\nMock 越重，测试越快越稳，但也越偏离真实；回放越重，越真实，但也越难构造异常与边界。**判据：核心链路的回归应以回放保真为主、Mock 为辅；边缘依赖的单元测试可以 Mock 为主。**\n\n#### 落地练习\n\n1. 列出当前所有外部依赖，标出哪些该 Mock、哪些该用回放验证。\n2. 检查回放流量是否覆盖异常路径，而非只有成功样本。\n3. 评估 Mock 比例是否过高，挑一个过度 Mock 的用例改为回放验证核心行为。", "subs": ["定义与问题：两类手段的定位", "机制与链路：回放的三段", "观察与判断：用对了没有", "边界与风险：真实性与可控性的权衡", "落地练习"]}]}, {"title": "第 4 章 · 构建与制品治理", "sections": [{"title": "CI 的常见误解与最小可信闭环", "content": "持续集成（CI）是被误读最多的实践之一：很多人以为\"配了流水线\"就是 CI，但流水线只是载体。**CI 的真正判据是：每次提交都触发自动化构建与测试，且一旦失败要求在约定时间内（常以十分钟为量级）修复；做不到\"失败即修\"，流水线再漂亮也只是延迟暴露问题的传送带。**\n\n#### 定义与问题：CI 的三段内核\n\n| 内核 | 含义 | 缺失后果 |\n| --- | --- | --- |\n| 每次提交触发流水线 | 变更不堆积，问题早发现 | 批量合入，冲突与缺陷集中爆发 |\n| 自动化测试随行 | 每次构建都跑测试 | 构建通过但功能已坏 |\n| 快速修复（约 10 分钟级） | 红就要立刻修 | 红灯长亮，流水线失信 |\n\n#### 机制与链路：最小可信闭环\n\nCI 的最小闭环可以画成\"提交→构建→测试→红则修\"的回路。它的前置条件包括：清晰的分支策略（见第 1 章）、明确的集成规则、可用的资源池、可控的反馈周期。这些前置不齐，CI 就无法闭环。\n\n```mermaid\ngraph TD\n    A[开发者提交] --> B[自动构建]\n    B --> C[自动跑测试]\n    C --> D{通过}\n    D -->|是| E[合入并通知]\n    D -->|否| F[十日内修复 红灯即停]\n    F --> B\n```\n\nCI 触发的契约细节（Webhook 如何驱动、流水线如何定义）属于工具层，见 [Jenkins 第二册第 9 章](../jenkins/delivery-practice.md)。本册先确定的是：**你的 CI 是否真的\"每次提交都跑且红灯必修\"，还是只是定时批量构建。**\n\n#### 观察与判断：CI 是否可信\n\n- 流水线红灯的平均存在时长是否在分钟级，还是以天计。\n- 是否存在\"红灯但大家照常合入\"的文化——这是 CI 失效的标志。\n- 提交到反馈的时长是否短到开发者愿意等，而非转向本地自测绕过。\n\n#### 边界与风险：CI 不是 CD\n\nCI 解决的是\"集成\"，不自动解决\"交付到用户\"。把 CI 当成持续交付完成的标志，会忽略后续发布治理（第 5 章）。**判据：CI 的终点是\"可部署的制品 + 可信的绿灯\"，从绿灯到用户可用之间，仍需要发布治理兜底。**\n\n#### 落地练习\n\n1. 统计近一周流水线红灯的平均持续时长，判断是否达到\"分钟级修复\"。\n2. 找出\"红灯仍合入\"的案例，分析是规则缺失还是文化缺失。\n3. 确认 CI 产出的是\"可部署制品\"，而非仅\"编译通过\"，记录差距。", "subs": ["定义与问题：CI 的三段内核", "机制与链路：最小可信闭环", "观察与判断：CI 是否可信", "边界与风险：CI 不是 CD", "落地练习"]}, {"title": "构建提速：先定位瓶颈再谈优化", "content": "构建提速的具体阶段拆解与优化表已在 [Jenkins 第二册第 9 章](../jenkins/delivery-practice.md) 完整给出（硬件、私有仓库、本地缓存、规范流程、工具选择等）。本册只补一个治理命题：**优化动作必须按\"先定位瓶颈、再决定顺序、并评估副作用\"的节奏进行；不定位就全面优化，往往把资源投到非瓶颈环节，且某些提速手段会以可重现性或安全性为代价。**\n\n#### 治理判据：优化顺序与副作用\n\n构建提速常见手段及其潜在副作用，需要按瓶颈排序而非全上：\n\n| 手段 | 加速来源 | 可能的副作用 |\n| --- | --- | --- |\n| 升级硬件/并行 | 直接缩短时间 | 成本上升，边际递减 |\n| 私有仓库/本地缓存 | 减少下载等待 | 缓存一致性风险，可能用到陈旧依赖 |\n| 规范流程 | 减少无效步骤 | 需团队纪律配合 |\n| 工具/增量构建 | 只构建变化部分 | 增量逻辑错误会导致漏构建 |\n\n#### 取舍与副作用\n\n判据核心是\"瓶颈在哪先动哪\"。若耗时主要在下载，上缓存立竿见影；若主要在编译，并行与增量更有效。**副作用要前置评估：本地缓存可能用到陈旧依赖破坏可重现性；增量构建若逻辑有误会漏掉必要步骤——这些代价必须在提速方案里写明对冲措施。**\n\n#### 边界与风险：速度不能牺牲可信\n\n构建提速的底线是\"构建结果仍可重现、仍可追溯\"。为了快而引入不可重现的缓存或跳跃步骤，会让\"绿灯\"失去意义，与第 3 章内建质量的目标冲突。**判据：任何提速手段上线前，必须验证它不会让同一份源码产出不可区分却不同的构建结果。**\n\n#### 链接与落地练习\n\n1. 沿用 [Jenkins 第二册第 9 章](../jenkins/delivery-practice.md) 的阶段耗时拆解表，先测出你的瓶颈环节。\n2. 对拟采用的提速手段逐条标注副作用与对冲措施。\n3. 提速后做一次\"同源码两次构建结果一致性\"验证，确认未破坏可重现性。", "subs": ["治理判据：优化顺序与副作用", "取舍与副作用", "边界与风险：速度不能牺牲可信", "链接与落地练习"]}, {"title": "构建检测、门禁与阻断策略", "content": "构建检测是在\"构建通过\"之外再加一道质量与合规闸门，确保流向下游的制品满足最低红线。**门禁的第一判据是：门禁要可量化、可阻断、且阻断范围清晰；只报警不阻断的门禁，最终会被红灯疲劳吞噬。**\n\n#### 定义与问题：检测什么、如何阻断\n\n以 Maven 体系为例，构建检测关注依赖合规与一致性：\n\n| 检测项 | 作用 | 阻断策略 |\n| --- | --- | --- |\n| 禁止依赖（bannedDependencies） | 拦掉不允许的库 | 命中即失败 |\n| 依赖收敛（dependencyConvergence） | 防止同库多版本 | 视严重度阻断或告警 |\n| 重复类（banDuplicateClasses） | 防止类冲突 | 命中即失败 |\n\n此外，自定义规则与独立的依赖检查服务可以把组织级策略从\"口头规范\"变成\"构建期硬约束\"。\n\n#### 机制与链路：门禁的层级\n\n门禁应按\"越基础越前置\"的原则分层：编译期拦语法与依赖，静态检查拦代码质量（见第 3 章），合规扫描拦许可证与漏洞，最后才是发布门禁。\n\n```mermaid\ngraph TD\n    A[编译与依赖检测] --> B[静态检查门禁]\n    B --> C[合规与漏洞扫描]\n    C --> D[发布门禁]\n    D --> E[制品进入仓库]\n```\n\n#### 观察与判断：门禁是否有效\n\n- 门禁是\"命中即阻断\"还是\"仅告警\"——关键红线必须可阻断。\n- 是否存在\"门禁长期红但没人管\"的疲劳现象，说明门禁过多或阈值不合理。\n- 阻断范围是否清晰（只拦当前提交还是整条流水线），避免误伤。\n\n#### 边界与风险：门禁不是越多越好\n\n门禁越多，开发者绕过的心思越重。**判据：门禁应聚焦\"会流向生产且后果严重\"的红线，低频或后果轻的检查降级为告警，保持阻断通道的权威性。**\n\n#### 落地练习\n\n1. 列出当前所有构建门禁，标出哪些是\"阻断\"、哪些是\"仅告警\"，评估合理性。\n2. 检查是否存在长期红色却被忽略的门禁，决定修复或降级。\n3. 为一条新的组织级依赖策略设计\"构建期硬约束\"的落地方式。", "subs": ["定义与问题：检测什么、如何阻断", "机制与链路：门禁的层级", "观察与判断：门禁是否有效", "边界与风险：门禁不是越多越好", "落地练习"]}, {"title": "构建算力的弹性供给与成本约束", "content": "构建是典型的\"突发、高峰明显\"的负载：白天提交密集，夜间空闲。固定资源要么白天排队要么夜间浪费。**弹性伸缩的判据是：构建资源应按负载伸缩，且控制面高可用、执行节点可弹性扩缩；但弹性本身有成本与一致性代价，需要为\"何时扩、扩多少、缩时是否丢状态\"定规则。**\n\n#### 定义与问题：控制面与执行节点\n\n构建系统一般分两层：控制面（调度、分发、状态）必须高可用，不能随波逐流；执行节点（真正跑构建的 worker）可以弹性。把执行节点放进容器编排（如 K8s）是常见的弹性手段，具体调度机制见 [Kubernetes 第二册](../../cloud-native/kubernetes/02-scheduling-and-workloads.md)。\n\n| 层 | 是否弹性 | 治理要点 |\n| --- | --- | --- |\n| 控制面 | 否，需高可用 | 不能单点，状态持久化 |\n| 执行节点 | 是 | 按队列长度扩缩，缩时确保无在跑任务 |\n\n#### 机制与链路：弹性如何生效\n\n```mermaid\ngraph TD\n    A[提交涌入 队列变长] --> B[控制面检测负载]\n    B --> C[弹性扩出执行节点]\n    C --> D[任务被分发执行]\n    D --> E[负载回落 缩容节点]\n    E --> F[确保无在跑任务才回收]\n```\n\n#### 观察与判断：弹性是否健康\n\n- 构建队列在高峰是否仍接近零等待，而非越积越长。\n- 缩容时是否有\"先 drain 再回收\"的机制，避免杀掉在跑任务。\n- 弹性成本是否随负载合理波动，而非为峰值常备大量空闲节点。\n\n#### 边界与风险：弹性的一致性与成本陷阱\n\n弹性节点常为无状态、临时，这意味着本地缓存随节点消失而失效，下次构建又要从头拉取——弹性可能和\"本地缓存提速\"冲突（见本章\"构建提速\"）。**判据：弹性节点应挂载共享缓存或采用就近仓库，否则省下的机器钱会花在重复下载上。**\n\n#### 落地练习\n\n1. 统计构建队列高峰等待时长，判断是否需要弹性扩缩。\n2. 检查缩容逻辑是否确保无在跑任务才回收，标出风险点。\n3. 评估弹性节点的缓存策略，确认未因节点临时化而反复全量拉取。", "subs": ["定义与问题：控制面与执行节点", "机制与链路：弹性如何生效", "观察与判断：弹性是否健康", "边界与风险：弹性的一致性与成本陷阱", "落地练习"]}, {"title": "镜像构建方式选型", "content": "容器镜像的构建方式决定了制品的一致性、分层复用与安全边界。**选型判据是：优先选择\"分层清晰、只读、可缓存、构建可重现\"的方式；构建时应当精选基础镜像、控制层数、善用缓存，并明确 DooD 与 DinD 的隔离代价。**\n\n#### 定义与问题：分层与只读的本质\n\n镜像由只读层堆叠而成，每一层对应一段构建指令。分层清晰带来两个好处：复用（相同底层只存一份）与缓存（未变的层不必重建）。相反，把所有动作塞进一层，既慢又不可复用。\n\n| 构建关注点 | 好的做法 | 坏的做法 |\n| --- | --- | --- |\n| 基础镜像 | 精选最小可信基础 | 直接用超大全量镜像 |\n| 层数 | 合并可合并的指令 | 每条命令一层，层数爆炸 |\n| 缓存 | 稳定指令放前，易变放后 | 易变指令在前，缓存全失效 |\n\n#### 机制与链路：构建上下文与隔离模式\n\n镜像构建有两种执行隔离模式：构建在宿主机 Docker 守护进程外（DooD，挂载守护进程）与构建在独立容器内的 Docker（DinD）。前者快但共享守护进程、隔离弱；后者隔离好但更重。选型取决于你对隔离与安全的权衡，而非默认。镜像多平台构建细节见 [Docker 第五册](../../cloud-native/docker/05-application-containerization-and-multi-platform-builds.md)。\n\n```mermaid\ngraph TD\n    A[编写 Dockerfile] --> B[精选基础镜像 控制层数]\n    B --> C[指令排序利于缓存]\n    C --> D[选 DooD 或 DinD 构建]\n    D --> E[产出只读分层镜像]\n```\n\n#### 观察与判断：镜像构建是否健康\n\n- 镜像是否最小化（无多余工具与 secrets），基础镜像是否可信。\n- 层缓存命中率是否高，还是每次几乎全量重建。\n- 构建隔离模式是否与安全诉求匹配，而非图省事默认一种。\n\n#### 边界与风险：不要把 secrets 烤进镜像\n\n镜像一旦推送，其中的任何内容都不可撤回地被分发。把凭证、密钥烤进层里，比在运行时注入危险得多。**判据：任何敏感信息都必须走运行时注入或密钥管理，绝不作为构建层内容。**\n\n#### 落地练习\n\n1. 检查核心镜像是否最小化，标出可移除的工具与疑似 secrets。\n2. 分析一次镜像构建的缓存命中情况，调整指令顺序提升复用。\n3. 确认构建隔离模式（DooD/DinD）与安全诉求匹配，记录选型理由。", "subs": ["定义与问题：分层与只读的本质", "机制与链路：构建上下文与隔离模式", "观察与判断：镜像构建是否健康", "边界与风险：不要把 secrets 烤进镜像", "落地练习"]}, {"title": "镜像个性化与合规检查", "content": "镜像既要满足不同业务的个性化差异，又不能因此破坏一致性与安全性。**治理判据是：个性化应通过\"分层叠加\"或\"参数化选项\"实现，而非在运行时大改；合规检查必须作为镜像进入仓库前的硬门禁，重点盯基础镜像来源、运行身份、权限与已知漏洞。**\n\n#### 定义与问题：个性化三法\n\n| 个性化方式 | 做法 | 治理要点 |\n| --- | --- | --- |\n| 自定义脚本/钩子 | 在固定点注入个性化动作 | 钩子需受控、可审计 |\n| 平台选项 + 服务集市 | 通过选择项组合差异 | 选项需有边界，避免组合爆炸 |\n| 自定义镜像 | 基于基础镜像派生 | 派生链需清晰、可追溯 |\n\n无论哪种，原则是\"差异表达在可声明的层里\"，而不是\"启动后随意改\"，否则又破坏了第 2 章讲的不可变。\n\n#### 机制与链路：合规检查门禁\n\n镜像合规通常借助镜像仓库的扫描能力（如镜像仓库 + 漏洞扫描组件）实现：镜像推送后自动扫描 CVE，按严重度决定是否允许放行。\n\n```mermaid\ngraph TD\n    A[镜像推送到仓库] --> B[自动漏洞扫描]\n    B --> C{严重度达标}\n    C -->|是| D[打标签允许分发]\n    C -->|否| E[阻断并告警]\n    E --> F[修复基础或配置后重推]\n```\n\n五条通用合规建议（与具体工具无关）：使用官方/可信基础镜像并校验签名、不以 root 运行、不把密码烤进镜像、不开启特权模式、使用经安全加固的内核与运行时。\n\n#### 观察与判断：镜像治理是否到位\n\n- 每个个性化镜像是否都能追溯到其基础镜像与派生链。\n- 镜像仓库是否在入库前自动扫描，而非事后抽查。\n- 是否存在以 root/特权运行的镜像，以及它们的必要性说明。\n\n#### 边界与风险：个性化侵蚀一致性\n\n个性化越自由，镜像种类越爆炸，安全与一致性越难保证。**判据：个性化必须控制在\"可声明、可追溯、不破坏只读\"的框内，超出框的定制应回到\"重新设计基础镜像\"而非\"临时打补丁\"。**\n\n#### 落地练习\n\n1. 列出所有个性化镜像，标出各自的基础镜像与派生关系是否清晰。\n2. 确认镜像仓库在入库前有自动漏洞扫描门禁，记录放行/阻断策略。\n3. 审计以 root/特权运行的镜像，评估能否改为非特权并留痕。", "subs": ["定义与问题：个性化三法", "机制与链路：合规检查门禁", "观察与判断：镜像治理是否到位", "边界与风险：个性化侵蚀一致性", "落地练习"]}]}, {"title": "第 5 章 · 发布治理与不可变交付", "sections": [{"title": "低风险发布策略的选型矩阵", "content": "发布是交付链路里风险最集中的动作，低风险发布策略的价值就是用机制把\"一次性全量切换\"变成\"可控、可观察、可回退\"的过程。**选型判据是：先按\"系统规模、成本承受、是否需要真实用户验证\"三个轴去选，而不是追流行；蓝绿、灰度（金丝雀）、暗部署各自适配不同场景，没有一种是万能的。**\n\n#### 定义与问题：三种典型策略\n\n| 策略 | 机制 | 最适合 | 主要代价 |\n| --- | --- | --- | --- |\n| 蓝绿部署 | 两套对等环境，切路由 | 规模不大、追求高可用 | 资源翻倍，成本高 |\n| 灰度/金丝雀 | 渐进放量，按批滚动 | 大规模、性价比优先 | 需保证用户行为一致 |\n| 暗部署 | 线上无声验证新功能 | 需真实反馈的 A/B 类 | 实现复杂，需流量复制 |\n\n灰度发布的用户体验一致性是硬要求：同一用户不能时而新功能、时而老功能，需靠用户标识或路由分组保证。\n\n#### 机制与链路：策略如何降低风险\n\n```mermaid\ngraph TD\n    A[新版本就绪] --> B{系统规模与成本}\n    B -->|小 重可用| C[蓝绿 切路由]\n    B -->|大 重性价比| D[灰度 渐进放量]\n    B -->|需真实反馈| E[暗部署 流量复制]\n    C --> F[观察后全量或回退]\n    D --> F\n    E --> F\n```\n\n#### 观察与判断：选对没有\n\n- 是否因\"蓝绿简单\"而在大规模系统上硬扛翻倍成本，或反之因\"省钱\"在关键系统上赌全量。\n- 灰度是否真的做到用户一致性，还是只按机器随机导致同用户体验跳变。\n- 暗部署的流量复制是否隔离了\"只观察不影响用户\"的边界。\n\n#### 边界与风险：发布与部署要分开\n\n严格说，部署是技术动作（变更服务器），发布是业务动作（对用户生效）。二者不一定要同步——很多业务需要在特定时点才让功能对用户可见。**把部署与发布混为一谈，会迫使你在业务时点前 1 秒完成所有服务器变更，既不现实也高风险。判据：用功能开关解耦\"部署完成\"与\"发布生效\"。**\n\n#### 落地练习\n\n1. 对你当前系统按\"规模/成本/是否需真实反馈\"三轴定位，确认当前发布策略是否匹配。\n2. 检查灰度是否保证用户一致性，标出跳变风险。\n3. 确认是否存在\"部署即发布\"的被迫同步，评估引入功能开关解耦。", "subs": ["定义与问题：三种典型策略", "机制与链路：策略如何降低风险", "观察与判断：选对没有", "边界与风险：发布与部署要分开", "落地练习"]}, {"title": "发布：交付链路的收口环节", "content": "发布作为持续交付的最后一步，既要快、易用，又要稳、可回退。**治理判据是：先把单机发布抽象成\"拉出→下载→安装→验证→拉入\"五个阶段，再扩展到集群的分批灰度；集群发布的本质是把单机理念在更高维度重做一遍，而非发明新概念。**\n\n#### 定义与问题：单机发布的五个阶段\n\n把任意技术栈的单机发布高度抽象，可归为五个阶段，顺序不可颠倒：\n\n| 阶段 | 动作 | 目的 |\n| --- | --- | --- |\n| 拉出（drain） | 通知上游暂停发流量 | 避免新请求打进将停的服务 |\n| 下载 | 取回新版本制品 | 不覆盖旧版，保留回滚可能 |\n| 安装 | 停止旧服务、替换、重启 | 版本切换 |\n| 验证（点火） | 健康检查与预热 | 确认新版本真能用 |\n| 拉入（markup） | 重新接入流量 | 对用户生效 |\n\n这五个阶段里有三个基石概念：版本（完整可执行产物）、通知调用方（拉出/拉入）、验证健康（点火）。它们共同支撑\"快速、易用、稳定、容错、回滚顺滑\"。\n\n#### 机制与链路：从单机到集群\n\n集群发布把单机五阶段提升到批量维度：同批次并行、批次间串行，每批验证通过再放下一批。这正是灰度发布的底层实现。\n\n```mermaid\ngraph TD\n    A[堡垒批次先发并验证] --> B[通知用户拉入生产流量]\n    B --> C[其余批次分批并行]\n    C --> D[批次间串行等待]\n    D --> E[全量完成或中断回退]\n```\n\n#### 观察与判断：发布是否可靠\n\n- 单机发布的五个阶段是否齐全，尤其\"验证点火\"是否被自动化而非手工跳过。\n- 集群发布是否做到\"批次间串行、批次内并行\"，而非一波流全量。\n- 回滚是否等于\"用旧版本再发一次\"，旧版本制品是否本地缓存可秒切。\n\n#### 边界与风险：全量还是增量\n\n集群发布的\"增量还是全量\"是个独立命题（见本章\"业务与系统架构如何约束发布方案\"）。**判据：后台高频发布应以全量为主，回滚简单清晰；增量发布对回滚极不友好，仅在带宽受限或移动端静态资源场景才有价值。**\n\n#### 落地练习\n\n1. 画出当前应用的单机发布过程，对照五阶段找缺失（尤其点火是否自动化）。\n2. 确认集群发布是分批灰度而非一波流，记录批次策略。\n3. 演练一次\"旧版本本地缓存秒切\"回滚，验证回滚是否等于重发旧版。", "subs": ["定义与问题：单机发布的五个阶段", "机制与链路：从单机到集群", "观察与判断：发布是否可靠", "边界与风险：全量还是增量", "落地练习"]}, {"title": "不可变交付：变更一律经发布通道落地", "content": "不可变基础设施的思想对持续交付影响深远：任何实例一旦创建即为只读，变更靠\"建新替旧\"。**不可变交付的判据是：任何变更——代码、配置、环境甚至资源规格——都必须做成独立版本的制品并通过发布生效；它的前提是\"无状态\"，有状态部分（如数据库）必须被明确排除在不可变之外。**\n\n#### 定义与问题：从发散、收敛到一致\n\n理解不可变，可借助三种基础设施模型：发散（想改就改，最终不一致）、收敛（定期趋向目标，但永远在追）、一致（每天当作第一天，按完整有序变更重建）。重复\"发散→收敛\"无法解决三个问题：顺序依赖、频率瓶颈、蝴蝶效应（小偏差放大）。容器通过分层镜像让\"每次变更都是一次发布、每次发布都是重建\"，从而达成一致模型。\n\n| 模型 | 特征 | 对交付的含义 |\n| --- | --- | --- |\n| 发散 | 随意改，逐渐不一致 | 环境不可信、难回滚 |\n| 收敛 | 趋向目标但永不完全 | 需频繁收敛，规模不可扩展 |\n| 一致 | 按完整有序变更重建 | 任一实例等价，顺序不再是问题 |\n\n#### 机制与链路：每次变更都是发布\n\n不可变模型落到持续交付，变成四条可执行规则：\n\n```mermaid\ngraph TD\n    A[任何变更需求] --> B[制作独立版本制品]\n    B --> C[提前构建新实例]\n    C --> D[发布切换引用指向新实例]\n    D --> E[旧实例保留待回滚]\n    E --> F[确认后回收旧实例]\n```\n\n由此，代码、配置、环境的变更都被统一为\"发一个新版本\"，回滚就是切回旧版本，顺序问题消失（因为每个实例等价）。\n\n#### 观察与判断：是否真的不可变\n\n- 生产实例是否在运行时被修改过（改了即破坏不可变）。\n- 配置与代码的变更是否都走\"发新版\"而非\"线上直接改\"。\n- 有状态组件是否被明确排除，并有独立的变更治理。\n\n#### 边界与风险：无状态前提与人的不适\n\n不可变对\"个性化、常改的环境\"确实违反直觉，且数据库等有状态组件无法每次重建。**判据：不可变适用于无状态交付物，强行把有状态纳入会制造灾难；接受\"一部分不可变、一部分传统治理\"的混合现实，比强行统一更务实。**\n\n#### 落地练习\n\n1. 检查生产实例是否存在运行时修改，标出破坏不可变的入口。\n2. 确认配置/代码变更是否都\"发新版\"，而非线上直改。\n3. 列出有状态组件并确认其独立治理方案，避免被错误纳入不可变流。", "subs": ["定义与问题：从发散、收敛到一致", "机制与链路：每次变更都是发布", "观察与判断：是否真的不可变", "边界与风险：无状态前提与人的不适", "落地练习"]}, {"title": "业务与系统架构如何约束发布方案", "content": "发布系统最终服务的是业务应用，而应用的架构直接约束发布方案能做什么、不能做什么。**治理判据是：发布方案必须顺应\"单机单应用优于单机多应用、全量优于增量、多角色状态位解耦\"这三条架构事实；逆着架构硬做，只会把复杂度转嫁成故障。**\n\n#### 定义与问题：三对架构抉择\n\n| 抉择 | 推荐 | 理由 |\n| --- | --- | --- |\n| 单机单应用 vs 单机多应用 | 单应用 | 隔离好、端口/故障/配置都简单 |\n| 全量发布 vs 增量发布 | 全量（后台） | 版本清晰、回滚简单 |\n| 多角色状态位 vs 单一锁 | 多标志位解耦 | 发布/运维/健康检测不互相阻塞 |\n\n单机多应用（如一个容器内多 Web 应用共享进程）会让\"发布一个应用\"波及同进程的其他应用，发布单元定义被迫复杂化。单机单应用则让每个实例边界清晰，是发布系统最希望的状态。\n\n#### 机制与链路：多角色对服务的拉出/拉入\n\n除了发布系统，运维检修、健康检测、服务负责人都会对服务做\"拉出/拉入\"。若用单一锁，四方会互相阻塞。更好的做法是每个角色维护独立标志位，只有全部为\"拉入\"时才对外暴露——四方解耦，互不排他。\n\n```mermaid\ngraph TD\n    A[发布系统标志位] --> E[对外暴露需全部拉入]\n    B[运维检修标志位] --> E\n    C[健康检测标志位] --> E\n    D[负责人标志位] --> E\n    E --> F[任一拉出即暂停服务]\n```\n\n#### 观察与判断：架构是否善待发布\n\n- 是否存在单机多应用导致\"发一个殃一片\"，是否需要重构为单应用。\n- 增量发布是否让回滚困难，是否应切全量。\n- 多方对服务的拉出/拉入是否互相阻塞，标志位是否解耦。\n\n#### 边界与风险：利用架构能力而非对抗\n\n发布系统应善用既有架构能力（软负载、通信中间件）解决堡垒流量路由、自动化点火等问题，而不是自己重造。**判据：让\"验证（点火）\"通过中间件强制自动执行，可避免人为遗漏；让堡垒流量经标识只在上下游堡垒间流转，可保证灰度不被打破。**\n\n#### 落地练习\n\n1. 检查是否存在单机多应用造成的发布波及，评估向单应用演进。\n2. 确认增量发布对回滚的阻碍，评估切全量的可行性。\n3. 验证多方拉出/拉入是否解耦，未解耦的引入独立标志位。", "subs": ["定义与问题：三对架构抉择", "机制与链路：多角色对服务的拉出/拉入", "观察与判断：架构是否善待发布", "边界与风险：利用架构能力而非对抗", "落地练习"]}, {"title": "发布系统的架构与控制面设计", "content": "发布系统的用户体验、控制面状态机与失败恢复机制已在 [Jenkins 第二册第 10 章](../jenkins/delivery-practice.md) 完整覆盖，本册只补一个上游抽象命题：**面对多形态业务（Web、移动端、小程序、H5 等多端并发），发布系统的核心抽象必须是\"与端无关\"的——把发布单元、批次、状态机沉淀为端无关的模型，各端差异留在接入层，而不是把每端做成一套平行系统。**\n\n#### 治理判据：端无关的发布抽象\n\n多形态业务的发布难点在于\"一次业务变更要同时抵达多个端，且各端审核与生效节奏不同\"。若每端各建一套发布流程，状态机与回滚会碎片化。判据是：**发布控制面只认\"发布单元 + 批次 + 状态\"，不认具体端；移动端的外部审核、各端的灰度节奏作为异步状态挂接在统一模型上。**\n\n| 抽象层 | 端无关部分 | 端相关部分（接入层） |\n| --- | --- | --- |\n| 发布单元 | 组/实例/版本 | 各端包格式差异 |\n| 批次与状态机 | 拉出/下载/安装/验证/拉入 | 各端审核与外部商店节奏 |\n| 失败恢复 | 重试/回退/刹车 | 各端回滚通道 |\n\n#### 取舍与副作用\n\n把差异收到接入层的好处是控制面稳定、可复用；副作用是接入层会变厚，需要为每个端维护适配。移动端交付与外部审核的更多细节见 [Jenkins 第二册第 11 章](../jenkins/delivery-practice.md)。**判据：差异留在接入层而非污染控制面，是发布系统能否 scale 到多端的关键架构决策。**\n\n#### 边界与风险：别让控制面感知业务形态\n\n控制面一旦开始\"if 移动端 then… if 小程序 then…\"，就走上了不可维护的路。**判据：任何业务形态的差异，都应表达为控制面模型上的\"参数或异步状态\"，而非代码分支。**\n\n#### 链接与落地练习\n\n1. 沿用 [Jenkins 第二册第 10 章](../jenkins/delivery-practice.md) 的状态机与失败恢复设计。\n2. 检查当前发布系统是否在控制面里写死了某端的特殊分支，评估能否下沉到接入层。\n3. 把移动端外部审核建模为\"异步状态\"而非独立发布流，验证状态机是否统一。", "subs": ["治理判据：端无关的发布抽象", "取舍与副作用", "边界与风险：别让控制面感知业务形态", "链接与落地练习"]}, {"title": "用监控闭环发布质量", "content": "发布结束不是终点，恰恰是最危险的开始——故障往往伴随变更而来。**治理判据是：发布后必须靠监控闭环来发现异常，监控要覆盖\"用户侧、网络、业务、应用、系统\"五个层面；并且要回答三个发布特有问题：测试环境要不要监控、发布后盯多久、异常是不是这次发布引起的。**\n\n#### 定义与问题：五个监控层面\n\n| 层面 | 关注 | 采集方式 |\n| --- | --- | --- |\n| 用户侧 | 真实访问速度/结果 | 打点、日志回收 |\n| 网络 | CDN/核心网络 | 模拟请求、采样 |\n| 业务 | 核心指标波动 | 定义正确指标+实时采集 |\n| 应用 | 调用链/错误量 | 中间件埋点、日志联合 |\n| 系统 | 基础设施指标 | 定期采样（≤5 分钟） |\n\n发布场景下，优先看业务监控最直接，但业务监控对\"累积效应\"和\"阴跌\"不敏感，必须配合应用监控看被发布服务及其调用链的整体表现。\n\n#### 机制与链路：发布监控闭环\n\n```mermaid\ngraph TD\n    A[发布完成] --> B[业务监控看核心指标]\n    B --> C[应用监控看调用链异常]\n    C --> D{是否异常}\n    D -->|否| E[延时观察后关闭]\n    D -->|是| F[运维事件时间线相关性分析]\n    F --> G[定位是否本次发布引起]\n    G --> H[回滚或前进修复]\n```\n\n三个发布特有问题：测试环境是否监控取决于监控系统能力（若只到系统级则不必全配，若已全链路则必配）；发布后建议延时监控约 30 分钟（示例假设，非实测数据：发布完成 30 分钟后的异常多属运行时而非发布引入）；异常归因需靠完整运维事件时间线做相关性分析。\n\n#### 观察与判断：监控是否兜住发布\n\n- 发布后是否在业务+应用两层同时观察，而非只看其一。\n- 是否有完整的运维事件记录体系，能把\"是不是这次发布引起\"说清。\n- 测试环境的监控投入是否与其能提供的定位价值匹配，而非盲目全套。\n\n#### 边界与风险：监控不是救命稻草\n\n监控能\"快速发现\"，但不能\"自动避免\"。把发布质量寄托在监控上而放松前面的门禁与灰度，是本末倒置。**判据：监控是发布后的兜底与学习机制，前面的低风险发布与门禁才是第一道闸；二者顺序不能颠倒。** 监控体系的设计与指标采集见 [Prometheus 观测主题](../../observability/prometheus/guide.md)，容量视角下的指标分析见 [架构设计第二册](../../architecture/02-performance-and-capacity.md)。\n\n#### 落地练习\n\n1. 确认发布后在业务+应用两层同时观察，补上缺失的那一层。\n2. 建立或核对运维事件时间线，确保能归因\"是否本次发布引起\"。\n3. 为测试环境按\"监控能力\"而非\"跟风\"决定监控投入，记录依据。", "subs": ["定义与问题：五个监控层面", "机制与链路：发布监控闭环", "观察与判断：监控是否兜住发布", "边界与风险：监控不是救命稻草", "落地练习"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
