<script id="data" type="application/json">{"title": "交付治理与容量保障学习笔记·第四册：容量保障与稳定性工程", "intro": "", "parts": [{"title": "第 1 章 · 容量目标的口径与量化", "sections": [{"title": "用户视角与技术视角下的容量", "content": "容量保障这门工程实践，第一步不是动手压测，而是先回答\"保的是什么、对谁而言是充足的\"。这一章的任务就是把容量目标讲清楚、把度量口径对齐，否则后续所有的测试、治理、预测都会失去锚点。容量问题之所以容易被忽视，正是因为不同角色对\"容量\"的理解完全不同，技术团队看到的是指标，用户看到的是体验，两者如果脱节，技术目标就会越做越偏。\n\n#### 两种视角看到的不是同一件事\n\n同一个系统，用户视角和技术视角描述的是两种容量：\n\n| 视角 | 关注点 | 典型判据 | 容量不足的表现 |\n| --- | --- | --- | --- |\n| 用户视角 | 我要的功能能不能用、快不快 | 功能可访问、耗时可接受、不报错 | 页面打不开、付款卡住、刷新转圈 |\n| 技术视角 | 系统资源与关键路径是否健康 | 可用性、关键路径时延、资源水位 | 错误率上升、响应变慢、实例过载 |\n\n关键结论是：**任何技术目标最终都要落到用户视角上才有意义**。脱离业务场景去定容量目标，几乎一定会跑偏。不同业务的容量画像天差地别：一个用户规模和产品功能都极其稳定的内部系统，容量保障是一次性工程；而一个有明显流量峰值的电商系统，容量保障则是一部\"连续剧\"——峰谷差异、大促活动、突发流量都要纳入考量。\n\n#### 用户视角如何转化为技术指标\n\n技术团队不能直接拿\"用户觉得慢\"去评估容量，必须把它翻译成可采集、可验收的指标。后面几节会给出具体的三类量化口径，但先建立一个映射习惯：\n\n```text\n用户视角诉求          技术可度量指标\n功能能用            接口成功率、核心链路可用性\n访问快              P95/P99 响应时间、首屏耗时\n不卡顿不报错        错误率、异常数、消息队列延迟\n容量有余量          资源水位（CPU/内存/连接数）与阈值差\n```\n\n#### 边界与误区\n\n- 误区一：只盯技术指标不看用户。CPU 很闲但用户已经大量报错的情况并不罕见，单看资源会漏判。\n- 误区二：把用户视角当成\"玄学\"而放弃量化。用户投诉、内测反馈都可以挂到具体接口与资源指标上，是可追踪的。\n- 边界：本章给出的是目标与度量框架；业务行为如何换算成 QPS、单机容量如何建模，属于模型与算法层，已在第一册之外由 [架构设计第二册 第 1–4 章](../../architecture/02-performance-and-capacity.md) 覆盖。\n\n#### 落地练习\n\n列出你当前负责系统的三个核心接口，分别写出：用户视角下\"出问题\"是什么样、对应的技术指标是什么、现在有没有在监控。凡是\"用户觉得慢但指标上没体现\"的接口，就是度量口径的盲区。\n\n\n#### 目标拆解：从用户诉求到技术口径\n\n两类视角最终要汇成可执行的技术口径，中间是一条拆解链：用户诉求 到 业务场景 到 技术目标 到 度量指标。\n\n```mermaid\ngraph LR\n    U[用户诉求 功能可用 访问快] --> B[业务场景 峰值 活动]\n    B --> T[技术目标 容量充足]\n    T --> M[度量指标 SLA QPS 体验]\n```\n\n不同业务形态对应的容量保障形态差异很大，目标拆解时先定性再定量：\n\n| 业务形态 | 容量特征 | 保障形态 |\n| --- | --- | --- |\n| 内部稳定系统 | 用户与功能稳定 几乎无峰值 | 一次性工程保障 |\n| 外部 C 端系统 | 明显流量峰值 常有大促 | 周期性工程 常态化监测 |\n| 存储传输型服务 | 瓶颈在 IO 与吞吐 | 以吞吐量与磁盘 IO 为目标 |\n| 计算型服务 | 瓶颈在 CPU | 以 QPS 与 CPU 水位为目标 |", "subs": ["两种视角看到的不是同一件事", "用户视角如何转化为技术指标", "边界与误区", "落地练习", "目标拆解：从用户诉求到技术口径"]}, {"title": "容量规划与容量治理：两句话讲清目标", "content": "容量保障的目标如果用一句话概括会失之笼统，但拆成两句话就非常清晰——这也是后续所有工作的总纲。\n\n#### 两句话定义目标\n\n容量保障的目标可以精确拆分为两部分：\n\n1. **容量规划**：在成本约束下，确保系统当前和未来的容量充足，把资源规划到相对安全的\"水位\"上。\n2. **容量治理**：解决已知的容量问题、预防未知的容量问题，事前防治、事后止损。\n\n这两句不是并列口号，而是分工：**规划回答\"要多少\"，治理回答\"不够了怎么办\"**。规划偏事前推算与验证，治理偏事中控制与事后恢复。\n\n#### 成本是贯穿两者的硬约束\n\n容量保障不是无限保障。公司能投入的服务器、能投入的人力都存在上限，这些上限决定了\"安全水位\"不是一个固定值，而是在成本边界内反复权衡的结果。安全水位指的是各项资源消耗与业务指标保持在一个相对安全的范围——它可以通过推算得到、通过容量测试验证得到，也可以由真实流量体现出来。\n\n| 维度 | 规划侧重 | 治理侧重 |\n| --- | --- | --- |\n| 目标 | 推算并验证\"够不够\" | 控制与恢复\"出问题\" |\n| 时机 | 变更前、大促前 | 运行中、故障中 |\n| 手段 | 模型、压测、弹性 | 扩容、限流、降级 |\n| 衡量 | 是否达到安全水位 | 问题是否止血与根治 |\n\n#### 分布式系统的不确定性是治理的源头\n\n规划可以把水位算得很准，但分布式系统充满不确定性：网络会抖、磁盘会崩、依赖会超时。这正是治理存在的理由——一方面要在不可靠环境下预防容量问题，另一方面出问题时要能在短时间消除影响，最好能全自动止损。做到了规划与治理的配合，容量目标自然达成。\n\n#### 落地练习\n\n针对下一次版本发布或大促，分别写出一条\"容量规划\"动作和一条\"容量治理\"动作。如果只能写出治理动作（临时扩容、限流），说明规划环节缺失，应补上发布前的容量验证。\n\n#### 容量目标对齐清单\n\n每次定容量目标前，用一张清单自测是否说清了\"保障形态—规划—治理—成本\"四件事：\n\n| 自测项 | 要回答的问题 | 答不出意味着 |\n| --- | --- | --- |\n| 业务形态 | 峰值特征是什么 | 保障形态可能选错 |\n| 规划动作 | 发布前怎么验证够 | 只备扩容无预案 |\n| 治理动作 | 不够了怎么办 | 缺事中控制手段 |\n| 成本边界 | 资源与人力上限 | 安全水位无依据 |\n\n清单通过才进入指标拆解，避免目标虚化。", "subs": ["两句话定义目标", "成本是贯穿两者的硬约束", "分布式系统的不确定性是治理的源头", "落地练习", "容量目标对齐清单"]}, {"title": "三类量化口径：SLA、QPS/TPS 与用户体验", "content": "目标定了，下一步是把它拆成可量化、可验收的指标。容量保障工作中最常用且互补的三类口径是 SLA、QPS/TPS 与用户体验，三者从\"契约—处理能力—感受\"三个层次覆盖了容量的不同侧面。\n\n#### 口径一：SLA 是可用性的契约表达\n\nSLA（服务等级协议）通俗地说就是对服务可用性的保证，可进一步拆为 SLI（具体测量指标，如 QPS、带宽）与 SLO（期望状态，如 QPS 的 P99 ≤ 100ms）。SLA 可描述为一个公式：**SLA = SLO + 后果**，后果指不满足 SLO 时的补偿协议（赔款、延长使用期等）。\n\n可用性是最基础的容量保障维度。常用\"几个 9\"表达，其换算属于公共数学，可直接用：\n\n```text\n年时长 8760 小时\n可用性 99.99%  →  年不可用 = 8760 × 0.0001 = 0.876 小时 ≈ 52.56 分钟\n```\n\n示例假设（非实测数据）：若整体 SLA 目标为 4 个 9，且历年容量问题对可用性的影响占比约为 1/5，可将\"容量问题造成的可用性损失不高于约 10 分钟\"作为子目标，再向下拆解到具体服务。\n\nSLA 易量化但难测量。一个可测量的 SLA 应具备：边界清晰（如\"下单接口成功率 ≥ 95% 且低于该值的时长不超过 1 分钟\"）、可监控（通过接口监控直接观测）、可理解（用业务语言而非仅技术语言描述）。\n\n#### 口径二：QPS/TPS 是处理能力的直接度量\n\nQPS（每秒查询数，多为读）与 TPS（每秒事务数，多为写）是容量保障最常用的目标指标。说\"系统容量是否足够\"，通常指系统能否在可接受的响应时间与成功率下支撑目标 QPS/TPS。\n\n业务侧往往只给业务指标（PV、UV、DAU、GMV），需要转换成技术目标。下面是一个自构造的可复算示例（示例假设，非实测数据）：\n\n```text\n假设某活动页面日 PV = 2000 万\n按二八原则 80% 集中在 20% 时间（4.8 小时）:\n  峰值段均摊页面 QPS = 2000万 × 0.8 / 17280秒（4.8小时换算） ≈ 926 QPS\n若该页面每次访问调用接口 X 一次，而 X 下游的 a0 接口被调用 2 次:\n  a0 接口目标 QPS = 926 × 2 ≈ 1852 QPS\n```\n\n这里有两个工程要点：（1）调用链越长，下游扩散比越大，必须逐跳计算而非只看入口；（2）局部活动流量还要叠加接口在其他链路上的背景流量。\n\n#### 口径三：用户体验是最高级的度量\n\n有些容量问题没击穿可用性，却让用户明显感到卡顿、延迟，这类体验问题同样要纳入目标。体验问题定性较难，但绝大多数都能挂到系统或业务指标上：某操作等待过长，可关联到该接口背后服务的 CPU、内存、响应时间、消息队列延迟等。把体验诉求翻译成指标，是容量目标闭环的最后一环。\n\n| 口径 | 回答的问题 | 优点 | 局限 |\n| --- | --- | --- | --- |\n| SLA | 可用性契约是否达成 | 对外可承诺、可补偿 | 易量化难测量，边界易模糊 |\n| QPS/TPS | 处理能力是否够 | 直接、可验收 | 需从业务指标换算，易漏掉扩散比 |\n| 用户体验 | 用户是否\"用得爽\" | 直接反映价值 | 需挂接到客观指标才能度量 |\n\n#### 边界与误区\n\n- 误区：把 SLA 写成无法落地的承诺（如\"24 小时内解决用户上报问题\"却不定义沟通耗时是否计入）。写 SLA 要用最浅显的语言围绕用户实际需求。\n- 误区：认为 QPS/TPS 万能。存储型服务（大数据、传输型）更应关注吞吐量与磁盘 IO，目标要因地制宜。\n\n#### 落地练习\n\n为你负责的一个接口，分别给出它的 SLA 表达、目标 QPS/TPS（从业务量换算）、以及一条对应的用户体验指标。三者缺一则目标不完整。\n\n\n#### 目标设定常见误区与正解\n\n把目标写清楚，比写得多更重要。常见反模式与正解：\n\n| 误区 | 后果 | 正解 |\n| --- | --- | --- |\n| 只写 SLA 不写技术目标 | 无法验收 | SLA 拆到接口级可监控指标 |\n| 目标无业务来源 | 拍脑袋 | 业务指标换算并标注假设 |\n| 只看峰值不看水位 | 平时浪费 | 峰值与日常水位都要定 |\n| 体验目标不可测 | 形同虚设 | 挂接到具体系统指标 |", "subs": ["口径一：SLA 是可用性的契约表达", "口径二：QPS/TPS 是处理能力的直接度量", "口径三：用户体验是最高级的度量", "边界与误区", "落地练习", "目标设定常见误区与正解"]}, {"title": "容量指标解读的五个常见追问", "content": "指标摆在那里只是数据，能从中识别出容量隐患才算会分析。这一节用五个经典问题，建立\"看指标不能只看单一维度\"的基本功。每一个问题背后都是一类真实踩坑。\n\n#### 问题一：响应时间看平均还是分位线\n\n结论：**互联网服务应更关注分位线（P95/P99）而非平均值**。平均值很容易\"冲淡\"长尾请求，掩盖容量隐患。\n\n示例假设（非实测数据）：某服务常态响应 100ms，可接受上限 150ms。负载接近瓶颈时，约 20% 请求响应升到 200ms。取 100 个请求，平均 = (80×100 + 20×200)/100 = 120ms，看似正常；但 P95 = 200ms，已暴露隐患。关注分位线的本质：即使只有少数请求变慢，也意味着容量已进入不充足的萌芽状态。\n\n#### 问题二：响应时间越短越好吗\n\n结论：**响应时间短必须建立在场景正确、服务无异常的前提下**。容量测试中如果响应时间异常短，反而可能是测试数据走入了异常分支、业务逻辑没真正执行。\n\n判据：观察响应时间的同时必须联动错误率、TPS、成功率、异常率。每次容量测试前，应与研发一起把要观察的指标配成监控面板，多条线一起看。\n\n#### 问题三：CPU 利用率越低越好吗\n\n结论：**CPU 低只能说明 CPU 不忙，不代表没有容量瓶颈**。瓶颈可能发生在数据库、缓存、第三方同步调用或线程池上。\n\n示例假设（非实测数据）：某服务响应时间暴增，但 8 核 CPU 总利用率很低。排查发现它用默认线程池处理含大量数据库 IO 的任务，线程被长时间阻塞、队列无界堆积，瓶颈在数据库而非 CPU。这就提示：线程池大小与排队策略要随下游特征调整，单一指标会误导。\n\n#### 问题四：压不上去就是服务到瓶颈了吗\n\n结论：**服务是否到瓶颈，要看服务端指标，不能看施压端能否\"压上去\"**。压不上去常常是因为施压端自身先到瓶颈。\n\n常见施压端瓶颈在 CPU 与带宽：传统 BIO 线程模型的压测工具，单机线程数有上限，CPU 打满后加线程数无效；大响应体还可能打满带宽。判据：发现加压力但 TPS 不升、响应也没明显增加时，先查施压机资源。\n\n#### 问题五：指标偶尔抖动要不要管\n\n结论：**抖动绝不能忽视**。没有根因的抖动是未来事故的潜伏期。\n\n示例假设（非实测数据）：某服务每隔不固定周期响应时间突刺，排查发现它在特殊场景下调用第三方做补偿，而第三方有配额且超限无兜底，一旦特殊场景增多或遭攻击就会雪崩。对抖动的处理顺序：先查服务内部性能与不合理调用，再查第三方同步调用与基础设施；实在查不到根因的，也要加强监控并备好恢复预案。\n\n#### 联合判读的原则\n\n| 问题 | 核心结论 | 工程动作 |\n| --- | --- | --- |\n| 平均 vs 分位 | 看分位线 | 监控面板默认展示 P95/P99 |\n| 越短越好？ | 需无异常 | 响应时间联动错误率 |\n| CPU 越低越好？ | 看全局 | 多指标大盘联动 |\n| 压不上去？ | 看服务端 | 监控施压端资源 |\n| 抖动？ | 必查根因 | 建预案兜底 |\n\n#### 落地练习\n\n从你系统的监控里挑一个近期出现过的\"抖动\"或\"异常短响应\"，按问题二到问题五的顺序逐条排查一遍，记录每一条结论是否成立，最后判断是否已有预案。\n\n\n#### 五问落地检查清单\n\n把前述五问沉淀成每次容量分析前的自检表：\n\n| 检查项 | 判据 | 不通过的表现 |\n| --- | --- | --- |\n| 看分位线 | P95/P99 已配置 | 只看平均值 |\n| 响应短要查异常 | 错误率联动 | 响应短即放行 |\n| CPU 低查全局 | 多指标联动 | 单看 CPU |\n| 压不上查施压端 | 施压端有监控 | 误判服务端瓶颈 |\n| 抖动必查根因 | 有预案兜底 | 忽视尖刺 |", "subs": ["问题一：响应时间看平均还是分位线", "问题二：响应时间越短越好吗", "问题三：CPU 利用率越低越好吗", "问题四：压不上去就是服务到瓶颈了吗", "问题五：指标偶尔抖动要不要管", "联合判读的原则", "落地练习", "五问落地检查清单"]}, {"title": "响应时间、吞吐与错误率的联合判读", "content": "单指标分析是基本功，但真实容量判读必须回到\"响应时间、吞吐、错误率\"三者的联合关系上。这一节给出联合判读的方法和一个最小监控看板的设计。\n\n#### 三个指标构成容量三角形的三条边\n\n- **响应时间**：用户最直观的感受，但单独看会被平均值误导（见上一节）。\n- **吞吐（QPS/TPS）**：系统处理能力的体现，与响应时间通常呈反向张力——吞吐上升常伴随响应时间上升。\n- **错误率**：容量不足的最硬信号，往往最后出现但最不容商量。\n\n三者同时观察才能下结论。例如：吞吐上不去、响应时间稳定、错误率正常，多半是施压端或上游问题；吞吐到顶、响应时间陡增、错误率抬头，才是服务端真实瓶颈。\n\n#### 单调递增的拐点不是唯一判据\n\n很多资料教人\"找拐点\"，但现实中清晰的拐点在无节制加压前很少出现。更实用的判据是：**当吞吐上升速率开始变缓，且响应时间同步走高时，容量可能已进入瓶颈区**，再用资源指标（CPU、连接数、队列长度）确诊。\n\n#### 最小联合判读看板\n\n建议每个被压测/被保障的服务都配置如下联动面板（指标均要带分位线）：\n\n```text\n面板分组          必含指标\n流量层          QPS/TPS 当前值与目标值\n时延层          P50 / P95 / P99 响应时间\n健康层          错误率 成功率 异常数\n资源层          CPU 内存 连接数 线程池队列长度\n依赖层          下游调用耗时 消息队列积压\n```\n\n#### 用错误率划定\"红区\"\n\n错误率应作为联合判读里的\"一票否决\"项：一旦超过约定阈值（如 0.5%），无论响应时间和吞吐多好看，都判定为容量不足或功能异常。响应时间变长只是\"黄区\"预警，错误率抬头才是\"红区\"。\n\n#### 边界与误区\n\n- 误区：只看响应时间达标就放行。测试数据走异常分支时响应时间反而会很短，必须错误率联合判读。\n- 误区：把吞吐当成容量上限。吞吐受施压端限制，需先排除施压端瓶颈。\n\n#### 落地练习\n\n为你当前的核心服务画出上面这张五分组看板清单，核对哪些指标已经在监控中、哪些缺失。缺失的指标就是下次容量测试前要补上的观测能力。\n\n#### 用 PromQL 刻画联合判读\n\n联合判读可沉淀为告警规则，下面是一条示意性的错误率与 P99 联动告警：\n\n```promql\n# 错误率超过 0.5% 触发红区\nsum(rate(http_requests_total{code=~\"5..\"}[5m]))\n  / sum(rate(http_requests_total[5m])) > 0.005\n\n# P99 响应时间较基线上涨超 50% 触发黄区\nhistogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))\n  > 1.5 * 基线P99\n```", "subs": ["三个指标构成容量三角形的三条边", "单调递增的拐点不是唯一判据", "最小联合判读看板", "用错误率划定\"红区\"", "边界与误区", "落地练习", "用 PromQL 刻画联合判读"]}]}, {"title": "第 2 章 · 容量测试的实施路径", "sections": [{"title": "先界定容量测试的范围", "content": "容量测试不是\"把全公司所有服务都压一遍\"。在动手之前先界定范围，是性价比最高的第一步——尤其对微服务架构，全盘覆盖既不可能也不经济。\n\n#### 容量测试的本质是\"验证\"而非\"探测\"\n\n传统定义常把容量测试等同于\"压到瓶颈、记录水位\"，但在微服务体系下这种定义几乎落不了地。更现代的定位是：**容量测试是验证手段，不是测试手段**——先按容量目标把服务设计建造好，再用容量测试去验证它能否承载目标，而不是靠反复压测去\"试\"出极限。\n\n一句话区分：压力测试是\"先斩后奏\"（先压再发现问题），容量测试是\"有备而来\"（目标先行、验证承载）。\n\n#### 风险驱动的范围选择\n\n规模大时不可能全覆盖，应按风险高低取舍。下面六类服务最该优先纳入：\n\n| 优先级 | 服务对象 | 纳入理由 |\n| --- | --- | --- |\n| 高 | 关键路径上的核心服务 | 一旦出问题影响面大；被依赖且不可降级者同等重要 |\n| 高 | 有明显流量峰值特征的服务 | 峰谷差异大、活动突增易引发风险 |\n| 高 | 对响应时间敏感的服务 | 被上游多次调用时时延会被放大数倍 |\n| 中 | 占用资源大的服务 | 带宽/内存消耗大，易资源耗尽 |\n| 中 | 历史出过容量事故/高峰已有隐患的服务 | 复用历史风险清单 |\n| 中 | 新上线且容量未知的服务 | 无基线可参考，必须验证 |\n\n#### 专项场景与日常场景的差异\n\n- **专项场景**（如大促）：直接梳理活动涉及的服务与依赖，纳入保障范围即可。\n- **日常场景**：除非服务规模很小，否则要取舍。风险驱动是默认策略——只保障\"易出容量风险\"的服务。\n\n#### 边界与误区\n\n- 误区：认为\"全量压测才保险\"。资源有限时全量压测必然浅尝辄止，不如聚焦高风险服务做深。\n- 边界：单服务/单链路压测与全链路压测的分工见第四册第 4 章；容量模型与估算方法见 [架构设计第二册 第 8 章](../../architecture/02-performance-and-capacity.md)。\n\n#### 落地练习\n\n按上表给当前系统做一次风险分级，列出 Top 5 必测服务及每条的纳入理由。如果列不出高风险服务，说明你对链路依赖和 historical 风险还不清楚，先补链路梳理。\n\n\n#### 范围选择的量化打分\n\n风险驱动不能只凭感觉，可用一张打分表把\"该不该测\"量化：\n\n| 评分维度 | 高分信号 | 低分信号 |\n| --- | --- | --- |\n| 链路关键度 | 关键路径 不可降级 | 旁支 可降级 |\n| 峰值特征 | 峰谷差异大 有活动 | 流量平稳 |\n| 时延敏感度 | 被多次调用 放大明显 | 单次独立调用 |\n| 资源占用 | 带宽 内存消耗大 | 资源占用小 |\n| 历史风险 | 出过事故或已有隐患 | 无记录 |\n\n得分高于阈值即纳入保障范围。", "subs": ["容量测试的本质是\"验证\"而非\"探测\"", "风险驱动的范围选择", "专项场景与日常场景的差异", "边界与误区", "落地练习", "范围选择的量化打分"]}, {"title": "测试方案设计与方案评审", "content": "范围定了，下一步是把\"怎么测\"写成可评审、可追溯的方案。方案不是写给机器看的，是写给团队对齐认知用的。\n\n#### 方案模板的六要素\n\n把经验抽象成模板，照模板填空，好处是：带备忘性质不漏项、标准化降低理解成本（也是一种契约）、便于事后追溯。通用模板包含：\n\n| 要素 | 内容 | 易遗漏点 |\n| --- | --- | --- |\n| 测试背景 | 为什么测、关注什么 | 背景与业务目标脱节 |\n| 测试目标 | 场景与预期（如 QPS 达 X、错误率 < Y） | 目标不可量化 |\n| 测试模型与数据 | 对象、依赖、扩散比、部署、数据 | 漏算下游背景流量 |\n| 测试计划 | 每轮线程数/TPS、时长 | 缺少渐进加压节奏 |\n| 监控指标 | CPU/内存/响应时间/Redis 延迟/带宽 | 只配响应时间 |\n| 止损策略 | 降级方案、补偿方案 | 预案未提前演练 |\n\n#### 止损预案必须提前演练\n\n方案里的降级与补偿不是写给人看的，真把业务压出问题却降不下来，比没写更糟。判据：**凡是线上要用的降级/补偿预案，必须在测试前离线演练过一次**，确认可触发、可恢复。\n\n#### 评审的协作机制\n\n评审目的是交叉审查、降低个体疏忽概率。相关研发与测试都应参与，确保模型与数据合理；关键服务、重大活动或复杂场景，建议架构师二次复核。\n\n评审形式建议\"内容正式、形式轻松、集中精力、高效评审\"：限定时长（如 1 小时内）、主讲外不带电脑、选非正式场地，反而更利于思维迸发。核心是让评审成为信息对齐，而不是走过场。\n\n#### 边界与误区\n\n- 误区：不写方案凭经验上。个体隐蔽的疏忽只有靠评审兜底，方案是团队间的契约。\n- 误区：方案写完后束之高阁。方案要成为执行与追溯的档案。\n\n#### 落地练习\n\n用上面六要素模板，为你的一个高风险服务填一份容量测试方案（哪怕只有一页），重点检查\"止损策略\"是否真的演练过。", "subs": ["方案模板的六要素", "止损预案必须提前演练", "评审的协作机制", "边界与误区", "落地练习"]}, {"title": "测试准备、执行、反馈与跟进闭环", "content": "方案通过后就进入执行。容量测试是高危操作（尤其线上），必须用闭环流程把风险关在笼子里。\n\n#### 准备阶段：越贴近真实越好\n\n准备阶段写脚本、备数据、调试脚本与数据。数据准备的核心是\"贴近真实业务场景\"：\n\n- **压测用户数量要足够**：生产环境多用分库分表，若压测用户过少会集中落在少数分片，造成单片过热，与真实不符。\n- **比例要真实**：如真实会员:非会员 = 1:5，压测用户也按此比例构造。\n\n```mermaid\ngraph LR\n    A[方案设计] --> B[方案评审]\n    B --> C[测试准备]\n    C --> D[测试执行]\n    D --> E[测试反馈]\n    E --> F[持续跟进]\n    F -->|发现问题| C\n```\n\n#### 执行阶段：渐进加压、严密盯盘\n\n执行是在线上居多（线下难构建对等环境，容量表现未必线性）。推荐的安全流程：\n\n1. 脚本/服务先小流量自验，确认无异常；\n2. 逐步加压，全程监控关键指标，异常时确认无风险才继续；\n3. 达到目标值后，可做摸高（更高压力维持一段时间）、脉冲（瞬时高并发）、限流验证。\n\n高危红线（任一都不可为）：直接压到预估峰值、只测不盯盘、单次测试过长、无止损预案、把生产当试验场不熟悉上下游。\n\n#### 反馈与跟进：结论要敢给，问题要闭环\n\n反馈阶段要有明确结论：数据不完整则当轮作废；结论简明、风险点也要写明；测试局限性（如可测性限制）要标明。跟进阶段要求研发负责人在约定时限内（如 3 个工作日）给解决措施并约再次验证，确保改进有效。\n\n#### 制度化的运营动作\n\n流程要运转起来需要制度：容量测试人员应在技术方案/需求阶段就介入熟悉业务，评估目标后快速出方案；测试发现的问题必须限期整改并复验。这把\"一次性测试\"变成\"持续治理\"。\n\n#### 边界与误区\n\n- 误区：测完即结束。暴露的问题不跟进，等于没测。\n- 误区：线上测试图省事不做数据隔离。写流量会污染真实数据，必须隔离（见第 4 章）。\n\n#### 落地练习\n\n画出你团队当前的容量测试流程图，标出\"反馈→跟进→复验\"这一段是否存在。若不存在，先补一个\"问题限期整改\"的制度，哪怕只写一句话。\n\n\n#### 渐进加压的节奏示例\n\n执行阶段不是一键压满，而是分档递进。示例节奏（示例假设，非实测数据）：\n\n| 阶段 | 目标比例 | 时长 | 观察重点 |\n| --- | --- | --- | --- |\n| 预热 | 20% | 5 min | 错误率 基本指标 |\n| 爬坡 | 60% | 10 min | 响应时间 资源水位 |\n| 目标 | 100% | 15 min | 是否达目标 有无拐点 |\n| 摸高 | 120% | 10 min | 边界与失败模式 |\n| 脉冲 | 瞬时 150% | 1 min x3 | 突发承受力 |", "subs": ["准备阶段：越贴近真实越好", "执行阶段：渐进加压、严密盯盘", "反馈与跟进：结论要敢给，问题要闭环", "制度化的运营动作", "边界与误区", "落地练习", "渐进加压的节奏示例"]}, {"title": "基线容量测试：另一种常用形态", "content": "线下难构建对等环境，传统容量测试又偏重线上，那有没有低成本、可常态化的替代？基线容量测试就是答案。\n\n#### 做法：用\"昨天的自己\"做对照\n\n基线容量测试在测试环境即可完成，做法：\n\n1. 按与线上相同的部署方式搭\"基线环境\"（含中间件与网络），资源可等比例缩小；\n2. 部署当前各服务主干版本，跑容量测试记录\"基线指标\"；\n3. 某服务要发新版本时，在基线环境部署新版本再跑同样的测试；\n4. 与基线指标对比，若关键指标（响应时间、CPU 利用率等）大幅异动，介入排查。\n\n#### 收益与局限\n\n| 维度 | 基线容量测试 | 线上容量测试 |\n| --- | --- | --- |\n| 环境 | 测试环境，低成本 | 生产环境，高成本高风险 |\n| 能力 | 定性发现差异 | 定量验证目标 |\n| 自动化 | 极易与 CI/CD 打通 | 需严格管控 |\n| 局限 | 环境不对等，无法定量 | 风险高、频率低 |\n\n核心结论：**基线测试虽不能定量，但能极早（修复成本最低时）暴露明显容量隐患**，且天然适合自动化。\n\n#### 退而求其次的变相基线\n\n若连基线环境都人力不足，可在生产环境灰度阶段，对比发布前后的响应时间等指标来发现隐患。发现问题先回滚再排查，也是一种变相基线。\n\n#### 边界与误区\n\n- 误区：用基线测试结论代替线上验证。基线只做早期定性，大促/关键变更仍需线上或准线上验证。\n- 边界：基线测试可纳入持续交付流水线，相关 CI 机制见 [Jenkins 第二册 第 9–11 章](../jenkins/delivery-practice.md)。\n\n#### 落地练习\n\n在你团队的 CI 流程里找一个\"构建后、发布前\"的节点，尝试接入一次基线容量测试（哪怕只测一个核心服务），观察是否能自动发现回归性容量退化。", "subs": ["做法：用\"昨天的自己\"做对照", "收益与局限", "退而求其次的变相基线", "边界与误区", "落地练习"]}]}, {"title": "第 3 章 · 容量治理手段的取舍", "sections": [{"title": "扩容的实践要点与代价", "content": "找到容量问题后就要治理。扩容、限流、降级是最常用的三种手段，分别对应\"加资源、控流量、弃功能\"三种视角。本节先讲扩容——它最直接，也最容易被滥用。\n\n#### 扩容的本质与代价\n\n扩容往服务集群加入新实例以应对流量增长，是资源层面最直接的容量提升手段。容器化让拉起一个新实例只需秒级，应急成本大幅下降。但扩容不是免费的：\n\n- **成本约束**：纯粹靠扩容支撑性能低劣的服务，浪费的是资源与金钱；\n- **边际递减**：资源到一定规模后，再扩容的代价大幅上升；\n- **连带影响**：扩容不只影响自身，还会放大对数据库、中间件、注册中心等下游资源的压力。\n\n#### 警惕\"无脑扩容\"\n\n实践态度：**鼓励把快速扩容作为应急手段，但作为治理手段要谨慎**。常见反模式是研发一遇容量不足就扩容，而忽略异步处理、读写分离、加缓存、SQL 调优等自身优化。判据：若扩容工单只提\"要资源\"却不提任何服务层优化，应被退回。\n\n#### 扩容要联动整体资源规划\n\n扩容不能只看服务自身资源，必须同步评估下游。示例假设（非实测数据）：某服务 10 个实例，每实例建约 100 个数据库连接，共约 1000 连接，数据库支持上限 1200，刚好够。若因业务增长需扩容 5 个实例，总连接将达约 1500，必然撑不住——所以扩容服务时要同步扩容数据库。注册中心长连接、消息队列积压等同样会被实例数放大。\n\n通用做法：先梳理被扩容服务的调用链路，看流量经过哪些地方、这些地方会不会被扩容影响，再决定配套动作。\n\n| 只看服务自身 | 联动整体规划 |\n| --- | --- |\n| 加实例解决表面瓶颈 | 同步评估 DB/中间件/注册中心容量 |\n| 响应快、看似有效 | 避免把瓶颈转移到下游 |\n| 易触发边际递减 | 先优化再扩容，成本更优 |\n\n#### 边界与误区\n\n- 误区：扩容是治理首选。它应是\"应急优先、治理谨慎\"，优化腾容量优于堆机器。\n- 误区：扩容只加应用实例。下游资源不联动，问题会换地方爆发。\n\n#### 落地练习\n\n找一条近期\"扩容解决\"的容量问题，回看当时是否先做了服务优化评估、是否同步扩了下游。若两者都否，把它作为案例写进团队的扩容评审清单。\n\n\n#### 扩容代价的三种形态\n\n扩容不是零成本，代价至少体现在三处：\n\n| 代价形态 | 说明 | 缓解 |\n| --- | --- | --- |\n| 直接资源成本 | 实例 带宽 存储费用 | 先优化再扩容 |\n| 边际递减 | 规模到一定后增益骤降 | 定位真实瓶颈 |\n| 下游放大 | DB 中间件 注册中心被连带 | 联动规划下游 |", "subs": ["扩容的本质与代价", "警惕\"无脑扩容\"", "扩容要联动整体资源规划", "边界与误区", "落地练习", "扩容代价的三种形态"]}, {"title": "限流的实践要点与参数来源", "content": "限流是在成本约束下对系统的过载保护：流量超过承载极限时，提前设好限流比紧急扩容更主动。\n\n#### 算法原理的边界（本节不展开）\n\n固定窗口、滑动窗口、漏桶、令牌桶四种限流算法的实现与特点属于模型与算法层，已由 [架构设计第二册 第 6 章](../../architecture/02-performance-and-capacity.md) 覆盖，本节只讲\"怎么选、在哪限、参数从哪来\"。\n\n#### 策略要与业务场景高度挂钩\n\n限流策略可归纳为三种流量控制形态：**流量整形**（乱进齐出，匀速输出）、**容忍突发流量**（短时突增不影响后续限流）、**平滑限流**（周期内均匀分布）。四种策略对这三者的支持不同，选择要按业务场景：\n\n| 策略 | 流量整形 | 容忍突发 | 平滑限流 | 实现复杂度 |\n| --- | --- | --- | --- | --- |\n| 固定窗口 | 不支持 | 不支持 | 不支持 | 低 |\n| 滑动窗口 | 不支持 | 不支持 | 不支持 | 中 |\n| 漏桶算法 | 支持 | 不支持 | 支持 | 高 |\n| 令牌桶算法 | 支持 | 支持 | 支持 | 高 |\n\n判据：流量平缓、无整形需求，固定窗口简单经济；常需应对大促等突发流量，令牌桶更合适但要接受更高复杂度。**算法不是越复杂越好，匹配业务才是好**。\n\n#### 分层次的限流体系\n\n限流位置应分层，每一层都不信任上层，形成全方位保护：\n\n```mermaid\ngraph TD\n    G[入口网关层 粗放限流 CDN拦截非法请求] --> L[接入层 负载均衡限流]\n    L --> A[应用服务层 单机与集群限流]\n    A --> D[数据层 读写分离与限流]\n```\n\n- 第一层：入口网关按域名/IP 粗放限流，静态资源走 CDN，非法请求不流入下游；\n- 第二层：硬负载与接入层做负载均衡与限流，粒度比网关细；\n- 第三层：应用服务层有单机/集群限流，调用第三方也可单独限流；\n- 第四层：数据库层用读写分离分流，并对读写请求限流。\n\n核心思想是\"不信任上层\"：某一层限流失效也不致全局失控。\n\n#### 限流参数的来源\n\n限流阈值不是拍脑袋，常见来源：容量测试得出的目标 QPS/TPS、历史峰值叠加安全系数、下游可承受的最大并发、业务可接受的拒绝率。参数应可配置、可灰度、可观测。\n\n#### 边界与误区\n\n- 误区：追求复杂算法。奥卡姆剃刀——简单且适合的最有效。\n- 误区：只在单层限流。单层失效即全局失效，必须分层。\n\n#### 落地练习\n\n为你的一条核心链路画出\"网关→接入→应用→数据\"四层限流图，标出每一层当前的限流策略与阈值来源。任一层缺失或阈值无来源，都是改进点。\n\n\n#### 分层限流的配置示意\n\n分层限流落到配置上，每一层独立设阈值与策略（示意，非特定产品）：\n\n```yaml\nlimit:\n  gateway:\n    strategy: fixed_window\n    qps: 50000\n  接入层:\n    strategy: token_bucket\n    qps: 20000\n 应用层:\n    strategy: token_bucket\n    qps_per_instance: 800\n 数据层:\n    read_write_split: true\n    max_connections: 1200\n```", "subs": ["算法原理的边界（本节不展开）", "策略要与业务场景高度挂钩", "分层次的限流体系", "限流参数的来源", "边界与误区", "落地练习", "分层限流的配置示意"]}, {"title": "降级的实践要点与业务分级", "content": "限流是牺牲一部分流量保容量，降级则是牺牲一部分功能或体验保核心。两者本质不同，适用面也不同。\n\n#### 降级与限流的根本区别\n\n| 维度 | 限流 | 降级 |\n| --- | --- | --- |\n| 视角 | 控制流量 | 牺牲功能/体验 |\n| 适用 | 理论上每个服务都可限流 | 并非每个服务都能降级（交易、库存不可降级） |\n| 本质 | 弃流量保容量 | 弃功能保核心 |\n\n降级常见策略：降低准确性、降低一致性、降低数据量、关闭非核心功能等。技术实现多是通过开关收口到配置中心集中管理。\n\n#### 自动触发与人工执行的平衡\n\n- **自动降级**适合触发条件明确可控的场景：接口超时、调用失败次数超阈值、旁路服务（如审计日志）压力过大。\n- **人工降级**适合条件难判断或涉及外部合约的场景：偶发抖动下\"降还是不降\"需综合判断；涉及第三方支付等合约的功能降级需先确认。\n\n判据：能明确写清触发条件的就自动化，条件复杂或影响大的留人工。\n\n#### 业务分级：最小可用降级\n\n降级都有损（无损就该考虑功能是否多余），所以要做**分级**。示例假设（非实测数据）：导购链路中，个性化推荐与滚动热词的降级对用户影响小，定为 1 级；不展示商品图片与评价内容影响大，定为 2 级。真实出问题时先执行 1 级，恢复则无需 2 级，做到\"温柔降级\"。\n\n#### 高频演练是生命线\n\n降级逻辑会随代码迭代失效。通过高频演练暴露失效开关，防患于未然。判据：凡是预案里的降级开关，季度内至少演练一次并记录结果。\n\n#### 边界与误区\n\n- 误区：降级越多越安全。过度降级损伤体验且无必要，分级即可。\n- 误区：降级开关配完就放心。不演练=没有，代码演进会让开关悄悄失效。\n\n#### 落地练习\n\n为你负责的服务列出所有降级开关，按\"影响程度\"分级，并标注最近一次演练时间。超过一个季度没演练的，排期补一次。\n\n#### 降级开关演练清单\n\n降级开关腐化是常态，用一张清单保证有效：\n\n| 检查项 | 要求 |\n| --- | --- |\n| 开关可触发 | 自动或人工能真实生效 |\n| 影响已评估 | 明确影响面与用户感知 |\n| 分级清晰 | 1级与2级边界明确 |\n| 定期演练 | 季度内至少一次 |\n| 回滚验证 | 关闭后服务恢复 |", "subs": ["降级与限流的根本区别", "自动触发与人工执行的平衡", "业务分级：最小可用降级", "高频演练是生命线", "边界与误区", "落地练习", "降级开关演练清单"]}]}, {"title": "第 4 章 · 全链路压测", "sections": [{"title": "全链路压测的由来与它解决的问题", "content": "单链路压测能把局部服务压得很透，却屡屡在真实流量洪峰前失灵。全链路压测正是为弥补\"整体容量不等于局部之和\"这一盲区而生。\n\n#### 单链路压测的盲区\n\n系统整体容量不是各单链路容量的简单相加。一个服务的容量既受自身影响，也受依赖服务（甚至外部服务）影响，多层累积后影响面极难判断。只做单链路压测，等于默认\"每个零件合格，整车就合格\"——显然不成立。\n\n```mermaid\ngraph TD\n    S[单链路压测 局部最优] --> P[全链路压测 全局视角]\n    P --> R[模拟峰值流量 暴露整体瓶颈]\n```\n\n#### 全链路压测的定义与价值\n\n全链路压测的本质是：**基于线上真实环境与真实业务场景，通过模拟海量用户请求，对整个系统的容量进行评估**。它把\"未来可能的流量峰值\"提前发生一次，把不确定性变成确定性，从而提前暴露整体容量问题。类比地说，就像用一次洪水演练来验证大坝能否扛住千年一遇的洪峰。\n\n#### 适用边界\n\n- 擅长：定期摸底系统整体容量、验证峰值场景；\n- 不擅长：替代单链路/单服务压测。全链路成本高、频率低，毛细血管式的每个接口仍需单链路保障。\n- 判据：全链路压测实施频率应远低于业务变更频率，常态保障靠单链路补齐。\n\n| 压测方式 | 范围 | 维护成本 | 实施频次 |\n| --- | --- | --- | --- |\n| 单服务压测 | 服务 | 低 | 高 |\n| 单链路压测 | 链路 | 中 | 中 |\n| 全链路压测 | 全局 | 高 | 低 |\n\n#### 落地练习\n\n盘点你团队当前压测资产，判断\"整体容量\"是否有任何手段验证。若只有单链路，列出一次全链路压测最可能暴露、而单链路发现不了的 3 个风险点。", "subs": ["单链路压测的盲区", "全链路压测的定义与价值", "适用边界", "落地练习"]}, {"title": "压测流量的完整性与可识别性", "content": "全链路压测要像真实用户一样走完整个链路，因此压测流量必须在所有依赖服务与中间件间顺畅流动（完整性），且能被一路识别出来（可识别性）。\n\n#### 完整性：流量要能\"流得通\"\n\n压测流量要能在各依赖服务、中间件之间流动，不能半路因为某些环节不识别压测标识而走偏或报错。完整性的反面是：压测流量在某一跳被当成真实请求、或因为缺少数据而失败，导致压测结果失真。\n\n#### 可识别性：流量要能\"被认出\"\n\n可识别性指压测流量从入口到数据层始终带着可辨别的标识，便于：\n- 中间件/数据层据此做隔离（写入影子表）；\n- 链路追踪系统据此单独展示压测链路，方便监控与排查。\n\n#### 对正常业务的影响控制\n\n全链路压测遵循与用户相同的流量轨迹，必然涉及大规模流量。要平衡\"压出瓶颈\"与\"不影响业务\"：通过数据隔离避免污染真实数据，通过标识透传确保压测流量可被单独处置，通过严格止损预案控制风险。\n\n#### 边界与误区\n\n- 误区：认为\"造出局部流量\"就是全链路。全链路的关键是全局视角与真实链路轨迹。\n- 误区：只关心能不能压上去，不关心流量是否可识别。不可识别就无法隔离与观测。\n\n#### 落地练习\n\n画一条你系统的核心链路（从网关到数据库），在每一跳标注\"压测标识能否透传、数据能否隔离\"。任一跳写\"不确定\"的，就是全链路改造要先啃的硬骨头。", "subs": ["完整性：流量要能\"流得通\"", "可识别性：流量要能\"被认出\"", "对正常业务的影响控制", "边界与误区", "落地练习"]}, {"title": "三项改造之一：数据隔离", "content": "线上压测必然涉及写流量，数据隔离是全链路压测建设中最重要、最不可替代的工作——做不好就会污染真实用户数据。\n\n#### 逻辑隔离：打标区分\n\n逻辑隔离通过在数据实体（用户、商户、订单等）上加压测类型标识来区分真实与压测数据，各系统据此硬编码走隔离逻辑。优点是中间件改造量小、对数据实体侵入小；缺点是难标准化（每个实体字段名可能不同）、可扩展性弱（新实体都要新设计标识）、安全性弱（与真实数据同表，隔离逻辑有疏漏就影响真实用户）。\n\n#### 物理隔离：影子表\n\n物理隔离先给压测流量打标，再把压测数据写入与真实表结构对等的\"影子表\"，物理上与真实数据分开。核心两步：\n\n1. **流量打标**：入口（多为 HTTP）把压测标识放入 Header，进入内网后由中间件把标识转移到 RPC 上下文；遇消息队列等异步组件也要特殊处理，保证标识一路透传不丢失；\n2. **影子表路由**：数据层（如数据库中间件）识别标识后将操作重定向到影子表。\n\n```mermaid\ngraph LR\n    Req[入口请求 带压测标识] --> MW[中间件透传标识]\n    MW --> DB[数据库中间件 路由影子表]\n    DB --> ST[影子表 物理隔离]\n```\n\n额外收益：统一的压测标识让链路追踪系统能单独展示压测链路，便于监控排查。\n\n#### 两种隔离对比与选型\n\n| 隔离类型 | 中间件改造量 | 安全性 | 可扩展性 |\n| --- | --- | --- | --- |\n| 逻辑隔离 | 小，几乎不改造 | 弱，同表易污染 | 弱，新实体需新标识 |\n| 物理隔离 | 大，标识需一路透传 | 强，分表存储 | 强，标识统一与数据无关 |\n\n判据：技术体系成熟、栈统一、有中间件团队支撑，优先物理隔离（影子表）；体系不完整或大量用开源框架、二次开发成本高，则用逻辑隔离。\n\n#### 影子表构建步骤（示例）\n\n示例假设（非实测数据）的构建过程：\n\n1. 真实表 `User` 对应影子表 `User_T`（加 `_T` 后缀）；\n2. 真实表数据脱敏，ID 类字段做偏移（如真实订单号以 1 开头，影子表偏移为 9 开头）避免与真实增长冲突；\n3. 脱敏偏移后的数据导入影子表；\n4. 完整性检查（数据量、表结构）确认无误。\n\n#### 落地练习\n\n评估你所在技术体系：是否有统一的中间件团队、能否保证标识透传。据此给出\"逻辑隔离 or 物理隔离\"的建议，并列出落地物理隔离需要改造的中间件清单。\n\n\n#### 影子表的创建与校验\n\n物理隔离的落地从建影子表开始，下面是示意性的建表与校验（示意，非特定方言）：\n\n```sql\n-- 真实表 User 对应影子表 User_T\nCREATE TABLE User_T LIKE User;\n-- 导入脱敏偏移后的数据后做完整性校验\nSELECT COUNT(*) FROM User_T;\nSELECT COUNT(*) FROM User;\n-- 校验影子表数据量与结构是否对齐\n```", "subs": ["逻辑隔离：打标区分", "物理隔离：影子表", "两种隔离对比与选型", "影子表构建步骤（示例）", "落地练习", "影子表的创建与校验"]}, {"title": "三项改造之二：中间件改造", "content": "数据隔离一节已提到，压测标识透传与物理隔离都依赖中间件改造。凡是\"和压测数据打交道\"的地方，都可能是改造点。\n\n#### 数据库中间件对影子表的支持\n\n实现机制：基于压测标识，数据库中间件在收到带标识的请求时，将操作目的地重定向到影子表。影子表信息与真实表的映射关系可统一管控，供中间件调用。这属于相对标准的改造。\n\n#### 消息队列对标识的透传\n\n消息队列是微服务常见中间件，难点在异步场景：生产者写入压测数据后使命结束，消费者再取出时已无从判断数据真假，破坏了可识别性。改造方式：生产者推送时把压测标识转存进消息体；消费者取出时再把标识恢复到请求体/上下文继续传递。\n\n```mermaid\ngraph LR\n    P[生产者 请求A 带标识] --> Q[消息队列 标识转存消息体]\n    Q --> C[消费者 请求B 恢复标识]\n```\n\n#### 改造的通用判断\n\n中间件改造方案的制定要对\"数据\"特别敏感：凡涉及数据存取、传递、消费的地方，都可能是潜在改造点。梳理链路时，把\"哪些中间件会碰这份数据\"列全，再逐一评估是否要识别/透传/隔离标识。\n\n#### 边界与误区\n\n- 误区：只改应用不改中间件。标识在中间件处丢失，物理隔离前功尽弃。\n- 误区：改造一次就完事。新引入的中间件（新 MQ、新缓存）要纳入同一套标识规范。\n\n#### 落地练习\n\n列出你系统使用的所有中间件（MQ、缓存、DB 代理、网关等），对每一项回答：压测标识能否透传？数据能否隔离？把\"不能\"的项排成改造 backlog。", "subs": ["数据库中间件对影子表的支持", "消息队列对标识的透传", "改造的通用判断", "边界与误区", "落地练习"]}, {"title": "三项改造之三：应用服务改造", "content": "除了中间件，应用服务也要改造，确保压测请求能反复执行且不影响真实场景。\n\n#### 绕开限制逻辑\n\n系统常有一些针对真实用户的限流/防刷逻辑（如短时间内反复下单的用户被限制），对压测流量需放开，否则压测请求跑不通。\n\n#### 数据隔离前置\n\n把隔离尽量前移，能减轻下游改造。例如大数据报表需剔除压测数据，若数据源都在数据仓库，完全可以在压测数据生成时就隔离、不进数据仓库，这样大数据服务无需改造。\n\n#### Mock 外部交互\n\n部分对外交互不便大量发真实请求（如支付、清结算），识别到压测流量后走 Mock 服务，返回正常响应而非调用真实服务。\n\n#### 安全与风控放开\n\n风控拦截等安全限制也要适当放开，让压测请求能重复执行。总原则：**所有可能限制或阻碍压测请求流动的地方，要么打通，要么 Mock**。\n\n#### 边界与误区\n\n- 误区：所有改造都堆在应用层。能前置到数据生成/中间件层的，就不要让每个应用服务各自改。\n- 误区：放开限制后忘了收口。压测结束后相关开关要复位，避免误伤真实流量。\n\n#### 落地练习\n\n针对一个要纳入全链路压测的核心服务，列出它需要\"绕开/前置/Mock/放开\"的清单，并标注每项由哪个团队负责。", "subs": ["绕开限制逻辑", "数据隔离前置", "Mock 外部交互", "安全与风控放开", "边界与误区", "落地练习"]}, {"title": "压测模型构建", "content": "三项改造完成后进入压测实施。先构建模型——模型的准确度直接决定压测结果的可参考性。\n\n#### 模型 = 业务模型 + 数据\n\n压测模型包含业务模型和数据两部分。模型不准的典型反例（示例假设，非实测数据）：下单链路压测用户没用红包，导致营销服务结果偏优；压测用户未考虑分片分布，致数据库单片过热；压测用户过少反复下单，单用户订单量爆炸；压测商户过少，库存锁争抢激烈。\n\n#### 读请求：直接回放\n\n读请求不污染数据，可直接用真实请求与数据回放。示例：商家列表与关键词查询场景，业务模型是拉取线上日志按真实接口比例回放，数据用真实数据。\n\n#### 写请求：单独构造并隔离\n\n写请求需单独构造模型，做好隔离与清理。示例：用户下单场景，业务模型来自生产监控/日志的链路信息与上下游依赖（产品、研发、测试共同评审链路完整性，评估需 Mock 的环节如支付/短信）；数据上构建测试用户/商户/菜品，数量与线上等比例缩放，并及时清理或用影子表。\n\n#### 核心要点\n\n充分利用生产环境的各种信息（依赖关系、调用比例、数据特征）来构建贴近真实的模型。生产环境是\"聚宝盆\"，把这些素材抽出来精加工，即得贴合实际的模型。\n\n#### 落地练习\n\n选一个写请求为主的场景，尝试产出它的\"业务模型 + 数据模型\"草稿，并标出需要 Mock 的环节与需要隔离的数据。\n\n\n#### 模型失真反例与修正动作\n\n压测模型不实则结果无效，典型反例对应修正：\n\n| 失真反例 | 根因 | 修正动作 |\n| --- | --- | --- |\n| 未用红包致营销偏优 | 业务模型不全 | 补 Mock 与场景 |\n| 用户未分片致单片过热 | 数据分布失真 | 按分片均匀造数 |\n| 单用户反复下单 | 数据量不足 | 扩大用户规模 |\n| 单商户扣库存锁争抢 | 商户过少 | 增加商户数量 |", "subs": ["模型 = 业务模型 + 数据", "读请求：直接回放", "写请求：单独构造并隔离", "核心要点", "落地练习", "模型失真反例与修正动作"]}, {"title": "压测流量构造", "content": "模型和数据就绪，最后临门一脚是构造压测流量实施施压。\n\n#### 工具选型与规模\n\n流量规模决定技术选型：规模不大时，传统压测工具（JMeter、Locust、Gatling、nGrinder 等）即可；百万级乃至超大规模请求时，自研压测平台更经济（分布式压测平台建设见第 5 章）。\n\n#### 组织协调比技术更难\n\n全链路压测的建设难度常被低估，但真正难过的是组织协调与运营：中间件改造、业务改造几乎覆盖大半个技术团队，需跨团队协同；建设完成后还要靠机制把它运营成常态化能力。\n\n通用经验（非特定公司实践）：推动这类\"航空母舰\"级项目需要自上而下的授权机制——由高层牵头对跨团队技术改造项目做必要性与优先级评定，公共团队与业务团队的技术 Leader 定期同步进展与风险，业务团队须在约定时间内完成公共团队的技术改造需求，公共团队提供方案与支持。\n\n#### 常态化运营与问题分级\n\n全链路压测需要被充分授权的集中式团队管理。两项可落地的运营规范：\n\n1. **常态化执行制度**：固定低峰时段执行（示例：每周三晚间），核心链路人员现场值守，其余远程；出现可用性或资损问题及时报告暂停。\n2. **容量问题分级规范**：按风险严重程度定级（示例假设，非实测数据，用于说明思路），每级对应解决时限，并定期统计解决时长达标率作为团队绩效参考：\n\n| 级别 | 示例判定（示意） | 解决时限 |\n| --- | --- | --- |\n| S0 严重 | 多数实例 CPU ≥ 100% 或内存 100% | 次日高峰期前 |\n| S1 高 | 多数实例 CPU ≥ 90% | 24 小时内 |\n| S2 中高 | 多数实例 CPU ≥ 80% | 72 小时内 |\n| S3 低 | 少量实例 CPU ≥ 80% | 1 周内 |\n\n#### 边界与误区\n\n- 误区：把全链路压测当银弹。它无法替代单链路/单服务压测，实施频率应远低于变更频率。\n- 误区：只建不运营。没有常态化制度与问题分级，暴露的问题不会被真正解决。\n\n#### 落地练习\n\n如果你要推动一次全链路压测，写出两份清单：（1）需要协同的团队与各自改造项；（2）压测发现问题的分级与时限规则草案。", "subs": ["工具选型与规模", "组织协调比技术更难", "常态化运营与问题分级", "边界与误区", "落地练习"]}]}, {"title": "第 5 章 · 压测平台：分布式架构与状态机", "sections": [{"title": "平台架构设计思路", "content": "开源压测工具（JMeter、Locust 等）多为 C/S 架构，存在功能局限、缺乏持久化、分布式配置复杂、过程监控弱、难与外部系统联动、维护成本高等问题。企业通过自研平台主要满足三点诉求：平台化（多团队协作）、标准化（对接审批与流程）、控制成本（规模大时自研优于开源）。\n\n#### 平台定位：只调度，不施压\n\n设计理念是\"取其精华去其糟粕\"：复用开源工具稳定成熟的执行能力，规避其不成熟能力，在平台层实现其缺失的能力。典型做法是 **Java Web 平台只做调度，真正的施压交给挂载的 JMeter Agent**，平台对压测机做心跳检测，用例/数据存对象存储，热数据进时序库、冷数据进关系库。\n\n```mermaid\ngraph TD\n    User[用户] --> Plat[压测平台 调度]\n    Plat --> Agent[Agent 长连接]\n    Agent --> JM[JMeter 施压]\n    Plat --> Inf[InfluxDB 热数据]\n    Plat --> Cold[数据库 冷数据]\n    Plat --> Mon[外部监控 反向干预]\n```\n\n#### 冷热数据分离\n\n| 数据类型 | 内容 | 时效 | 存储 |\n| --- | --- | --- | --- |\n| 热数据 | 响应时间、吞吐、错误率等概要 | 压测中高频关注 | 时序库，定期清理 |\n| 冷数据 | 均值、P90/P95/P99 等详尽结果 | 压测后分析 | 关系库持久化 |\n\n冷热分离让实时观测快、事后分析全，扩展性友好。\n\n#### 规避 JMeter 原生分布式的缺陷\n\nJMeter 原生分布式：master/slave 差异大、配置繁琐；master 只收集不施压，浪费资源；slave 每个请求打点实时回传 master，带宽消耗大。平台做法是在每台压测机植入 Agent，通过长连接由平台统一调度——脚本统一分发、数据异步回传聚合入库，相当于在平台层重写了分布式调度。\n\n#### 边界与误区\n\n- 误区：自研就要从零造轮子。复用成熟执行引擎、只在平台层补齐缺失，性价比最高。\n- 边界：平台形态的云原生演进见 [云原生 Kubernetes 第二册](../../cloud-native/kubernetes/02-scheduling-and-workloads.md)。\n\n#### 落地练习\n\n列出你当前压测流程中\"最痛的一个环节\"（如多人协作、历史不可查、监控弱），判断它属于平台化的哪类诉求，作为平台建设的第一个迭代目标。\n\n\n#### 开源工具原生能力 vs 平台补齐\n\n自研平台的价值在于补齐开源短板：\n\n| 能力 | 开源原生 | 平台补齐 |\n| --- | --- | --- |\n| 协作 | C/S 难共享 | 多团队同一平台 |\n| 持久化 | 缺历史追溯 | 用例与结果存档 |\n| 超大流量 | 易遇瓶颈 | 分布式调度 |\n| 过程监控 | 仅概要 | 内外监控联动 |\n| 标准化 | 各用各的 | 对接审批流程 |", "subs": ["平台定位：只调度，不施压", "冷热数据分离", "规避 JMeter 原生分布式的缺陷", "边界与误区", "落地练习", "开源工具原生能力 vs 平台补齐"]}, {"title": "测试状态流转与实时数据展示", "content": "测试生命周期管理是平台核心。每一轮测试都要经历配置、触发、运行、收集、清理等内部行为，也可能被外部行为（手动停止、监控熔断）干预，所有分支最终必须闭环。\n\n#### 状态机：无论正常异常都要闭环\n\n状态流转的主线（示例状态名）：\n\n```mermaid\nstateDiagram-v2\n    [*] --> BOOTING\n    BOOTING --> LAUNCHING : 配置完成触发\n    LAUNCHING --> RUNNING : 触发完成\n    RUNNING --> NORMAL : 运行完成\n    RUNNING --> STOP : 手动停止\n    RUNNING --> FUSE : 监控自动熔断\n    BOOTING --> BOOTERROR : 配置错误\n    LAUNCHING --> LAUNCHERROR : 触发错误\n    NORMAL --> [*]\n```\n\n关键判据：**任何分支最后都要回到终点（清理/正常/失败），不能卡在中间状态**。卡死即平台对该测试失去管理、信息丢失，是健壮性的大忌。\n\n#### 实时数据（热数据）展示\n\nJMeter 本身缺图形化实时展示，平台通过 Backend Listener 把结果实时发往时序库（如 InfluxDB），平台轮询查询并绘图；也可直接对接 Grafana。这样运行中就能看到响应时间、错误率等概要，及时发现异常。\n\n```text\nBackend Listener 配置要点（示意）:\n  implementation = InfluxdbBackendListenerClient\n  influxDbUrl     = http://influx-host:8086\n  measurement     = jmeter\n  percentiles     = 90;95;99\n```\n\n#### 边界与误区\n\n- 误区：状态机只画正常路径。异常分支（配置错、触发错、熔断、停止）必须都覆盖并能闭环。\n- 误区：实时只看响应时间。错误率、吞吐应同屏展示。\n\n#### 落地练习\n\n用状态机思维梳理你当前一次压测的\"生命周期\"，标出哪些异常分支现在无法自动闭环，列为平台待补能力。\n\n\n#### 实时错误率告警示例\n\n平台把热数据写入时序库后，可用一条规则实时盯盘：\n\n```promql\n# 运行中的服务错误率\nsum(rate(jmeter_samples{result=\"failure\"}[1m]))\n  / sum(rate(jmeter_samples_total[1m])) > 0.01\n```\n超过阈值即说明压测已影响业务或脚本有误，应暂停排查。", "subs": ["状态机：无论正常异常都要闭环", "实时数据（热数据）展示", "边界与误区", "落地练习", "实时错误率告警示例"]}, {"title": "结果数据、吞吐限速与配置集", "content": "平台的高阶能力围绕\"结果怎么存、压力怎么控、用例怎么批量\"展开。\n\n#### 冷数据预聚合\n\n压测生成的原始结果文件（如 JTL）单行很小但总量极大，直接全量存储浪费空间。平台应对结果做预聚合：以 label 为大分类，errorMsg/errorCode 等为小分类，时间固定聚合为有限个点，固定存储大小。\n\n```text\n聚合结构示意（伪代码）:\n  {\n    \"label\": \"upload\",\n    \"totalCount\": 428,\n    \"totalErrorCount\": 12,\n    \"errorMsg\": [ {\"msg\": \"io.exception\", \"count\": 12} ],\n    \"errorCode\": [ {\"code\": \"404\", \"count\": 12} ],\n    \"count\": [12, 15, ...],      // 固定 60 个点\n    \"maxRt\": [12, 15, ...]\n  }\n```\n\n#### 吞吐量动态调节\n\nJMeter 按线程数控压，但目标常是 QPS/TPS，手动来回调线程数很低效。平台用吞吐量控制器设定上限，再把上限设为占位符，运行时通过外部命令注入具体值实现动态调节：\n\n```text\nConstant Throughput Timer:\n  Target throughput = ${__P(throughput, 99999999)}\n运行时: 执行外部命令更新 throughput 属性即可实时调 QPS\n```\n\n#### 配置集：多用例批量编排\n\n配置集本质是用一个结构映射多个用例、每个用例对应多轮配置，实现一键批量触发与轮次差异。典型场景：某用例先跑一段、其他再启动（先单独触发再延迟触发其余）；或运行时临时改某几个用例的 QPS 上限（单用例调节）。\n\n公式：**配置集 1:N 测试用例；测试用例 1:N 轮次配置**。\n\n#### 落地练习\n\n把你团队\"每次手动逐个触发多个用例\"的痛点，写成一个配置集需求：包含哪些用例、几轮配置、每轮线程/QPS/时长。\n\n\n#### 配置集结构示意\n\n配置集把多个用例与多轮配置结构化（示意）：\n\n```yaml\nconfigSet:\n  name: 大促核心链路\n  cases:\n    - id: case_order\n      rounds:\n        - {thread: 100, duration: 60, qps: 1000}\n        - {thread: 200, duration: 60, qps: 2000}\n    - id: case_pay\n      rounds:\n        - {thread: 50, duration: 60, qps: 500}\n```", "subs": ["冷数据预聚合", "吞吐量动态调节", "配置集：多用例批量编排", "落地练习", "配置集结构示意"]}, {"title": "监控模块与平台自身可观测性", "content": "监控模块是几乎所有开源压测工具都缺失、却关乎安全的部分，分内部与外部两类。\n\n#### 内部监控：保平台自身\n\n针对压测平台自身运行监控与干预：触发压测同时启动对压测机的监控任务（磁盘、数据流状态等），识别到线程异常终止、无数据流出、磁盘打满等异常，立即终止测试、反馈异常并记日志。\n\n#### 外部监控：反向干预业务压测\n\n对接外部监控系统，既方便观察系统指标，更能反向干预压测、规避线上风险。例如监控到服务端错误率达阈值，立刻停止当次测试。最简实现是用 Webhook：在监控系统配置回调接口，告警事件发生时回调平台触发停止（或指定其他动作）。\n\n```mermaid\ngraph LR\n    G[外部监控 如 Grafana] -->|Webhook 告警| P[压测平台 接口]\n    P -->|触发| S[停止测试 或 其他动作]\n```\n\n#### 平台自身的可观测性\n\n平台自身也要被观测：调度延迟、Agent 心跳、压测机资源、数据回传成功率等都应有指标。判据：平台出问题要能在压测机之外被发现，不能\"压测平台和压测一起挂\"。\n\n#### 边界与误区\n\n- 误区：只做内部监控。线上压测的高风险靠外部监控反向干预兜底。\n- 误区：平台无自身监控。平台失联会让人误以为\"压测正常\"。\n\n#### 落地练习\n\n为你的压测平台（或计划中的平台）列出\"内部监控指标\"与\"外部监控联动动作\"两份清单，确认 Webhook 回调能真正触发停止。\n\n#### 内外部监控职责表\n\n两类监控职责不同，都要有：\n\n| 监控类型 | 对象 | 动作 |\n| --- | --- | --- |\n| 内部监控 | 压测机 平台自身 | 异常即终止并记日志 |\n| 外部监控 | 被压测服务 | 超阈值反向停止测试 |\n| 平台自监控 | 调度 Agent 回传 | 失联即告警 |", "subs": ["内部监控：保平台自身", "外部监控：反向干预业务压测", "平台自身的可观测性", "边界与误区", "落地练习", "内外部监控职责表"]}]}, {"title": "第 6 章 · 容量预测与建模", "sections": [{"title": "用 AI 做容量预测的完整流程", "content": "容量预测是容量规划中最重要的一环：大促要多少服务器才够又不浪费，本质就是预测问题。把预测完全建立在个人经验上（\"凭感觉扩 500 核\"）会让容量规划变成玄学，风险依旧。科学的做法是用数据驱动的方法建立预测模型。\n\n#### 为什么用 AI/机器学习\n\n影响容量的因素极多，经验法几乎不可能覆盖。AI 预测的本质可类比\"找规律\"：给定若干输入特征，找到它们与容量结果之间的映射，再用映射预测新输入下的结果。三大步骤构成闭环：\n\n```mermaid\ngraph LR\n    F[特征选取] --> M[建立模型]\n    M --> E[准确度评价]\n    E -->|不达标| F\n    M --> P[预测]\n```\n\n#### 三大步骤\n\n1. **特征选取**：选影响容量的特征作输入（因），选表示容量结果的特征作输出（果）。\n2. **建立模型**：寻找能完整描述输入与输出关系的规律（回归模型）。\n3. **准确度评价**：检查是否正确，不对则调特征或模型直至收敛。\n\n#### 流程的工程化\n\n模型建立后即可投入预测：输入特征值（如服务流量）得到容量结果（如 CPU 利用率）。这套流程可自动化：定时拉取生产指标 → 训练/更新模型 → 输出各服务的容量预测 → 与阈值比对告警。\n\n#### 边界与误区\n\n- 误区：容量预测=拍脑袋。经验法在多数情况下既不可解释也不可复现。\n- 误区：预测一次永久有效。服务迭代与场景变化会让模型失效（见后两节）。\n\n#### 落地练习\n\n选一个你熟悉的服务，凭经验写下\"流量翻倍时 CPU 会到多少\"的估计，再记录真实发生时的数值，对比差距——这就是经验法的误差，也是引入数据驱动预测的动机。\n\n\n#### 经验法 vs 数据驱动\n\n为什么要用模型替代经验：\n\n| 维度 | 经验法 | 数据驱动 |\n| --- | --- | --- |\n| 可解释 | 靠人脑 | 特征权重可查 |\n| 可复现 | 易变 | 模型可重训 |\n| 可扩展 | 难规模化 | 自动化批量 |\n| 风险 | 易拍脑袋 | 依赖数据质量 |", "subs": ["为什么用 AI/机器学习", "三大步骤", "流程的工程化", "边界与误区", "落地练习", "经验法 vs 数据驱动"]}, {"title": "特征选取、模型建立与准确度评价", "content": "这一节展开三大步骤的技术细节，全部基于公共的机器学习知识。\n\n#### 特征选取：少而代表性\n\n影响容量的特征至少三类：资源配置（CPU 核数、内存）、业务量（TPS、并发）、上下游依赖（依赖服务 TPS）。但**特征不是越多越好**——过多易过拟合（模型在训练集完美、解决实际差）。\n\n实践中的有效选择（示例假设，非实测数据）：以服务自身 TPS 及所依赖服务的 TPS 为输入特征，以 CPU 利用率为输出。理由：绝大多数业务指标最终会表现在 TPS 上（并发升 TPS 一般升、响应时间增 TPS 可能降），TPS 已能囊括多数特征；多数计算型服务 CPU 利用率是容量主体现。IO 型服务则把特征换成内存/磁盘利用率。\n\n#### 模型建立：回归 + 多入单出\n\n模型须满足：回归（输入输出连续）、支持多输入单输出、可离线计算并持久化。常见回归模型有线性回归、多项式回归、神经网络。线性/多项式在很多实际关系中表现不佳（TPS 与 CPU 未必线性、也非简单多项式），实践中多用学习能力更强的神经网络：输入各 TPS，经权重与偏置求和、激活函数转换，输出 CPU 利用率；多神经元组合成输入层+隐藏层+输出层，训练即调权重，保存即可预测。\n\n```python\n# 公共 API 示例（示意，非特定业务）:\nfrom sklearn.neural_network import MLPRegressor\nmodel = MLPRegressor(hidden_layer_sizes=(16, 16), max_iter=2000)\nmodel.fit(X_train, y_train)   # X: 各服务 TPS, y: 目标 CPU 利用率\npred = model.predict(X_test)\n```\n\n#### 准确度评价：K 折交叉验证\n\n用拟合曲线可视化可直观评判，但自动化选特征组合时需定量指标。**K 折交叉验证**是工程界常用法：把数据集均分 K 份，逐次取 1 份作测试集、其余训练，重复 K 次取平均准确度。其无重复抽样特性使结论稳定，理论证明 K=10 通用效果最好。\n\n```python\nfrom sklearn.model_selection import KFold, cross_val_score\nkf = KFold(n_splits=10, shuffle=True)\nscores = cross_val_score(model, X, y, cv=kf, scoring=\"r2\")\nprint(scores.mean())   # 平均准确度\n```\n\n#### Badcase 与数据清洗\n\n模型初期总有 Badcase，要抽象归纳、修正。常见根因几乎都在数据：依赖服务 TPS 某天异常突增被学进模型致失效；训练数据毛刺（噪点）影响拟合；数据源采集出错（如 CPU 数据错）。启示：**重视输入数据准确性，及时清洗去噪**，否则模型再强也大打折扣。\n\n#### 边界与误区\n\n- 误区：特征越多越准。过拟合比少特征更危险。\n- 误区：只看拟合曲线。自动化选特征需定量交叉验证。\n\n#### 落地练习\n\n用你服务的近 30 天\"TPS—CPU 利用率\"数据，尝试画一张散点+拟合图，肉眼判断两者是否强相关（为下一节的相关度分析做准备）。\n\n\n#### 回归模型选型对照\n\n不同回归模型适配不同关系：\n\n| 模型 | 适配 | 局限 |\n| --- | --- | --- |\n| 线性回归 | 近似线性 | 非线性失效 |\n| 多项式回归 | 简单曲线 | 高阶易过拟合 |\n| 神经网络 | 复杂非线性 多入单出 | 需数据量与调参 |\n\n结论：计算型服务的 TPS-CPU 多非线性，神经网络更稳。", "subs": ["特征选取：少而代表性", "模型建立：回归 + 多入单出", "准确度评价：K 折交叉验证", "Badcase 与数据清洗", "边界与误区", "落地练习", "回归模型选型对照"]}, {"title": "相关度分析与服务画像", "content": "上一节的\"草率\"选特征，有时会对某些服务永远不准。本节讲如何用相关度分析诊断，并用\"服务画像\"提升准确性。\n\n#### 皮尔逊相关系数诊断\n\nTPS 与 CPU 利用率的映射，可能紧密（理想）也可能一个 TPS 对应多个 CPU 值（有遗漏因素）。用皮尔逊相关系数 r（∈[-1,1]）定量：\n\n| |r| 区间 | 相关强度 | 处理 |\n| --- | --- | --- | --- |\n| 0.5 – 1 | 强相关 | 直接建 TPS→CPU 模型 |\n| 0.1 – 0.5 | 弱相关 | 需补特征或服务画像 |\n| 0 – 0.1 | 不相关 | 批处理/任务型服务，可过滤 |\n\n#### 强相关与不相关\n\n- 强相关：CPU 几乎只受 TPS 影响，直接用 TPS→CPU 模型即可拟合。\n- 不相关：多为无外部流量的批处理/任务型服务，可特殊处理或直接过滤。\n\n#### 弱相关：服务画像四法\n\n弱相关说明 CPU 还受其他因素制约，两种思路：\n\n1. **服务画像**：为每个服务选不同特征建模。常见特征筛选法：\n\n| 方法 | 做法 |\n| --- | --- |\n| 目测法 | 能从他特征推导出的为多余特征，剔除；与应用 Owner 无关的为无关特征 |\n| 过滤法 | 去掉取值变化小/不变的特征（如成功率长期 100% 则不考虑） |\n| 包裹法 | 排列组合选特征子集，逐次评优取最佳 |\n| 嵌入法 | 训练中得到各特征权值系数，按系数从大到小选（如 featureImportance） |\n\n2. **概率表法**：建 TPS→CPU 的概率表，取出现频率最高的 CPU 值参与建模（频次最高通常最可靠）。适用于难以找全特征时\"曲线救国\"。\n\n#### 画像与概率表的取舍\n\n能找全准确特征时，服务画像准确性更高；特征难寻时，概率表更实用。两者都服务于\"让模型贴合真实\"。\n\n#### 边界与误区\n\n- 误区：所有服务用同一组特征。服务异构，强相关才可用统一特征。\n- 误区：弱相关就放弃预测。服务画像/概率表能挽救大部分。\n\n#### 落地练习\n\n对你最关心的 3 个服务，分别计算 TPS 与 CPU 的皮尔逊相关系数，按上表定强/弱/不相关，并给弱相关服务选一种画像方法。\n\n\n#### 用代码算皮尔逊相关系数\n\n相关度分析可直接用公共库实现（示意）：\n\n```python\nimport numpy as np\nfrom scipy.stats import pearsonr\nr, p = pearsonr(tps_list, cpu_list)\nprint(f\"r={r:.3f} p={p:.3f}\")   # |r|>=0.5 强相关\n```\n\n|r| 在 0.5-1 强相关，0.1-0.5 弱相关，0-0.1 不相关。", "subs": ["皮尔逊相关系数诊断", "强相关与不相关", "弱相关：服务画像四法", "画像与概率表的取舍", "边界与误区", "落地练习", "用代码算皮尔逊相关系数"]}, {"title": "预测的迭代、校准与业务变化风险", "content": "模型建好不是终点。服务持续迭代、业务场景变化都会让预测失真，必须有迭代与校准机制。\n\n#### 服务迭代：滑动窗口重建模\n\n服务变更（发布、改配置、扩缩容）常使旧预测失效。简单做法是变更后对该服务重建模覆盖旧结果，但**它忽略了变更对其他服务容量的影响**。\n\n更优做法：依托链路追踪找依赖网状结构，在滑动时间窗口内对所有服务重建模。示例假设（非实测数据）：规定每周三为发布期、容量时效性 3 天，设跨度 3 天的滑动窗口，第 4 天统一重建模，窗口每周前移。多发布窗口则设多个窗口。兼顾了迭代频率与计算量。\n\n#### 业务场景变化：双向校准\n\n风险随流量增高而放大，预测常用高峰期数据建模。若未来业务场景变化（如将办大促），旧模型可能不适用。\n\n解法与全链路压测双向校准：\n\n- **预测校准压测**：常态下对整体容量预测——取高峰期某时刻所有服务 TPS 的\"快照\"（比例关系），保持比例递增各服务 TPS 输入模型，直到某关键服务预测 CPU 超阈值（如 90%），即触达整体最大容量；排序输出高危服务列表，再与全链路压测同 TPS 下的 CPU 比对，差距过大则查压测场景失真。\n- **压测校准预测**：保证常态压测模型无误后，加入变化场景更新压测脚本再压，数据回灌模型重学；上线后据线上真实数据再校准几次。\n\n#### 核心结论\n\n\"唯一不变的是变化\"。业务场景变化必然发生，应通过定期校准保持预测准确；全链路压测是变化的未来场景的重要（有时唯一）数据来源，预测结果也可反向校验压测模型。\n\n#### 边界与误区\n\n- 误区：模型一次建好用一年。服务迭代会让它悄悄失效。\n- 误区：只靠预测不做压测验证。两者应双向校准。\n\n#### 落地练习\n\n为你团队制定一个\"模型重训练节奏\"：发布窗口怎么设、滑动窗口跨度多少、谁负责触发重建模。", "subs": ["服务迭代：滑动窗口重建模", "业务场景变化", "核心结论", "边界与误区", "落地练习"]}, {"title": "排队论基础：容量为什么可以算出来", "content": "容量不仅能压出来、测出来，也能用数学算出来。排队论（运筹学分支，1909 年源于话务理论）研究带随机因素的拥挤现象，互联网系统的\"请求排队\"本质就是排队系统。\n\n#### 排队系统三要素\n\n```mermaid\ngraph LR\n    Arr[请求到达] --> Q[队列等待]\n    Q --> S[服务节点处理]\n    S --> Leave[离开]\n```\n\n任何排队系统关注三点：\n\n1. **输入过程**：请求按什么规律到达（互联网多认为独立同分布）；\n2. **排队规则**：单/多队列、串行/并行、有界/无界；\n3. **服务规则**：服务节点数、处理顺序（如先来先服务 FCFS）。\n\n#### M/M/c 模型\n\n模型记法 A/B/n/S/Z：到达规律/服务时间分布/服务窗口数/容量限制/服务规则。为实用，常假定容量充足（S→∞）、FCFS，简化为 A/B/n。互联网典型是 **M/M/c**（M=无记忆性指数分布，c 个服务节点共享一个到达池）。c=1 即退化为 M/M/1。\n\n#### 三大基本公式（公共数学）\n\n对 M/M/c，三个基础公式（公共知识，推导见 [架构设计第二册 排队边界](../../architecture/02-performance-and-capacity.md)）：\n\n| 公式 | 含义 | 互联网对应 |\n| --- | --- | --- |\n| ρ = λ / (c·μ) | 系统利用率 | 系统负载 |\n| R = λ / μ | 资源需求 | 维持稳定最少服务器数 |\n| E[T] = 1 / (c·μ − λ) | 平均等待时间 | 平均响应时间 |\n\n其中 λ 为到达率（每秒请求数，即流量），μ 为单节点服务率（每秒处理数）。\n\n#### 推导的边界\n\n上面公式的严格推导需要数理基础，本册定位工程与组织层，**公式的推导过程见 [架构设计第二册](../../architecture/02-performance-and-capacity.md)，本节只把公式当可用武器**。理解参数含义、会代入实际问题即可。\n\n#### 落地练习\n\n对一个单节点服务，已知 μ=200 请求/秒，λ=120 请求/秒，用上面公式算 ρ 与 E[T]，感受 λ 接近 c·μ 时 E[T] 的变化趋势。\n\n\n#### M/M/c 参数对照\n\n把公式参数与工程含义对齐：\n\n| 参数 | 含义 | 工程对应 |\n| --- | --- | --- |\n| lambda | 到达率 | 流量 QPS |\n| mu | 单节点服务率 | 单机处理能力 |\n| c | 服务节点数 | 实例数 |\n| rho | 利用率 | 系统负载 |\n| E[T] | 平均等待 | 平均响应时间 |\n\n#### M/M/c 计算代码示例\n\n把公式翻译成可运行代码，便于把\"算容量\"嵌入容量评审或自动化巡检。下面示例对给定到达率、单节点服务率、节点数计算利用率与平均等待，并判断系统是否稳定（示例假设，非实测数据）。\n\n```python\nimport math\n\ndef mmc(lam, mu, c):\n    rho = lam / (c * mu)              # 系统利用率\n    if rho >= 1:\n        return {\"rho\": rho, \"stable\": False}\n    e_t = 1.0 / (c * mu - lam)        # 平均等待时间\n    return {\"rho\": rho, \"e_t\": e_t, \"stable\": True}\n\n# 示例：单节点 200 QPS，目标承载 1500 QPS，候选实例数 8/10/12\nfor c in (8, 10, 12):\n    r = mmc(1500, 200, c)\n    print(f\"c={c} rho={r['rho']:.3f} stable={r['stable']}\")\n```\n\n代入得到：\n\n| 实例数 c | 利用率 ρ | E[T] | 是否稳定 |\n| --- | --- | --- | --- |\n| 8 | 0.94 | 0.0050 | 稳定但偏高 |\n| 10 | 0.75 | 0.0007 | 安全 |\n| 12 | 0.625 | 0.0005 | 安全且有余量 |\n\n经验：ρ 越接近 1，E[T] 上升越快；选 c=10 而非 8 多出的余量不是浪费，是吸收到达随机波动的必要代价。这段代码可直接接进容量评审脚本，对候选扩容方案批量算一遍再决策，避免只看平均流量拍脑袋。\n\n#### 排队论辅助容量评审的闭环\n\n```mermaid\ngraph LR\n    I[输入 流量与单机能力] --> C[代入公式算 rho E_T]\n    C --> J[判断是否稳定 是否超阈值]\n    J --> D[决策 扩容或维持]\n    D --> I\n```\n\n把上述计算固化成例行动作：每次扩容评审先跑一遍 M/M/c，输出 ρ 与 E[T] 再开会，评审从\"感觉够了\"变成\"算出来够\"。", "subs": ["排队系统三要素", "M/M/c 模型", "三大基本公式（公共数学）", "推导的边界", "落地练习", "M/M/c 参数对照", "M/M/c 计算代码示例", "排队论辅助容量评审的闭环"]}, {"title": "用排队论设定水位阈值与做容量规划", "content": "公式到手，就能解决两个典型工程问题：定水位阈值、做容量规划。\n\n#### 用 M/M/1 定 CPU 水位阈值\n\n问题：CPU 利用率到多少算有风险？用 M/M/1（单节点）推算。由 ρ=λ/μ 得 λ=ρμ，代入 E[T]=1/(μ−λ)=1/(μ(1−ρ))，可见平均响应时间与 1/(1−ρ) 成正比。\n\n画出曲线会发现：ρ（即 CPU 利用率）在约 0.8 处出现拐点，之后响应时间急剧上升。因此**对符合 M/M/1 的计算型服务，把 CPU 利用率风险阈值定为 80% 较合理**。容器超卖场景下可据超卖比例适当上浮，不必教条。\n\n#### 平方根配置规则做容量规划\n\n问题（公共教材改编，示例假设，非实测数据）：平均流量 λ，单节点每秒处理 μ，最多接受 a 比例请求排队，需多少节点？选 M/M/c，c 为所求。\n\n关键定理\"平方根配置规则\"：令 R=λ/μ（资源需求），确保\"排队概率 < a\"的最少节点数 k ≈ R + c·√R，其中 c 由方程 Φ(c)/φ(c) = (1−a)/a 解出（Φ 为标准正态 CDF，φ 为密度）。c 只与 a 有关，可查表：\n\n| a（可接受排队比例） | c |\n| --- | --- |\n| 0.8 | 0.173 |\n| 0.5 | 0.506 |\n| 0.2 | 1.06 |\n| 0.1 | 1.42 |\n\n若最多接受 20% 请求排队（a=0.2），c≈1，即 k ≈ R + √R。结论：**除满足平均需求 R 外，还要加 c·√R 的余量来吸收到达的随机波动**。\n\n#### 工程应用要点\n\n- 水位阈值不是拍脑袋，可用排队论推导并据实际（超卖、服务模型差异）修正；\n- 容量规划中的\"余量\"来自到达的随机性，不是浪费，是数学要求；\n- 排队论不挑的生产环境、不需建模调参，适合作为快速工程判据。\n\n#### 边界与误区\n\n- 误区：CPU 到 90% 才扩容。对 M/M/1 类服务，80% 附近响应已急剧恶化。\n- 误区：按平均流量配资源。不看方差会低估所需节点数。\n\n#### 落地练习\n\n对某服务用\"平方根配置规则\"算一遍：已知 λ=1000 请求/秒、μ=100 请求/秒/节点、a=0.2，求最少节点数 k，并解释\"多加的那部分\"在吸收什么风险。\n\n#### 平方根配置规则算例\n\n接前例：lambda=1000, mu=100, a=0.2 时 c≈1.06≈1：\n\n| 项 | 值 |\n| --- | --- |\n| 资源需求 R = 1000/100 | 10 |\n| 余量 c*sqrt(R) = 1.06*3.16 | 约 3.35 |\n| 最少节点 k | 约 14 |\n\n即除满足平均 10 节点外，再加约 4 节点吸收随机波动（示例假设，非实测数据）。", "subs": ["用 M/M/1 定 CPU 水位阈值", "平方根配置规则做容量规划", "工程应用要点", "边界与误区", "落地练习", "平方根配置规则算例"]}]}, {"title": "第 7 章 · 云原生形态与大促场景的容量保障", "sections": [{"title": "弹性伸缩作为容量保障利器", "content": "云原生把应用服务\"生在云上、为云设计\"，其中最改变容量保障工作方式的，是弹性伸缩——根据业务与流量自动调整计算资源。\n\n#### 弹性伸缩的本质\n\n弹性伸缩根据流量自动增减实例，足够快时可免去提前容量规划、直接实时扩容；且主流云厂商按需付费，只按实际消耗计费，还能省成本。它把资源管理工作下沉到基础设施，管控粒度更细、更实时。\n\n对比传统规划：传统需提前扩容，从扩容点到流量峰值点之间资源超出实际需求，时间越长浪费越多；且业务方\"只扩不缩\"（没人愿背稳定性指标而主动缩容），全网平均利用率常偏低。弹性伸缩快速高效、底层管理，恰好破解这一困局。\n\n#### 成本与侵入优势\n\n| 维度 | 传统容量规划 | 弹性伸缩 |\n| --- | --- | --- |\n| 时机 | 提前扩容，存在空窗浪费 | 实时/预测扩容，按需 |\n| 缩容 | 业务方抵触 | 基础设施自动 |\n| 侵入 | 研发需懂容量 | 研发无感 |\n| 成本 | 常冗余保稳 | 按需付费 |\n\n结论：**弹性伸缩 + 容量预测，能更快速更经济地保障容量安全**，容量保障正逐渐成为云基础设施能力的一部分。\n\n#### 边界与误区\n\n- 误区：弹性伸缩能完全取代规划。当前落地规模仍有限，且缩容有风险。\n- 边界：弹性伸缩的 K8s 实现（HPA 等）见 [云原生 Kubernetes 第二册](../../cloud-native/kubernetes/02-scheduling-and-workloads.md)。\n\n#### 落地练习\n\n统计你系统当前\"为保稳而冗余\"的实例数，估算若按真实峰值弹性伸缩可节省的比例，作为推动弹性伸缩的论据。\n\n\n#### 弹性伸缩的反馈闭环\n\n弹性伸缩是观测 决策 执行的持续闭环：\n\n```mermaid\ngraph LR\n    O[观测 利用率 流量] --> D[决策 是否伸缩]\n    D --> E[执行 增减实例]\n    E --> O\n```\n动态伸缩维持目标水位，预测伸缩提前执行，本质都是这个闭环。", "subs": ["弹性伸缩的本质", "成本与侵入优势", "边界与误区", "落地练习", "弹性伸缩的反馈闭环"]}, {"title": "云原生容量保障的新趋势", "content": "弹性伸缩的落地仍在演进，行业主要在两个方向探索。\n\n#### 两种自动伸缩模式\n\n主流云厂商普遍提供两类模式（公共实践，不特指某厂商）：\n\n- **动态伸缩**：讲究实时性，按资源利用率实际变化调整，类似空调控温——设定目标利用率（如 75%），超则加实例、低则缩，维持在该线。\n- **预测伸缩**：用机器学习分析历史负载（如近 14 天）预测未来（如 2 天）的容量需求，提前完成扩容；类似天气预报。适用于可预测的高峰（如午晚高峰的外卖场景），突发营销活动则更适合动态伸缩。\n\n```mermaid\ngraph LR\n    M[监控指标 实时] --> D[动态伸缩 维持目标水位]\n    H[历史负载 预测] --> P[预测伸缩 提前扩容]\n```\n\n#### 落地的现实阻碍\n\n弹性伸缩尚未大规模落地，原因：容量预测不够精确难以支撑全自动；缩容风险高（可能引发线上异常甚至事故）；扩缩容速度不够快。\n\n两个前沿方向：\n\n1. **减少冷启动时间**：真正实时伸缩需缩短\"进程重启到完全可用\"的时间，AOT 编译、特定运行时优化是业界探索方向；\n2. **与容量规划结合**：用服务画像让预测更及时，伸缩逼近实时——即使冷启动不够快，也能在较短空窗前完成。\n\n#### 边界与误区\n\n- 误区：上了 K8s 就自动弹性。HPA 需合理指标与阈值，否则会振荡或失效。\n- 误区：预测伸缩万能。它对可预测场景好，突发仍靠动态。\n\n#### 落地练习\n\n为你系统选一种伸缩模式并说明理由：是午晚高峰可预测的（预测伸缩），还是活动突发多的（动态伸缩）。", "subs": ["两种自动伸缩模式", "落地的现实阻碍", "边界与误区", "落地练习"]}, {"title": "大促重点链路梳理与服务架构治理", "content": "大促是检验容量保障的试金石，其特点（特定场景、业务指标变化、一次性不可返场）对保障提出极高要求。大促保障应先搭框架再填空。\n\n#### 明确背景与目标（前置项）\n\n先找产品/业务方了解大促背景、拿 PRD 与量化业务指标（活动策略、周期、预估访问量），再对接技术团队看各活动技术方案与上下游链路，把业务指标转换为技术指标。核心原则：**先理解业务目标，再切入技术目标**。\n\n#### 四类重点链路梳理\n\n| 链路类型 | 特征 | 保障重点 |\n| --- | --- | --- |\n| 同步链路 | 强依赖，调用方等被调用方完成 | 入口接口协同看待，避免被下游牵绊 |\n| 异步链路 | 无强依赖，回调通知 | 明确异步流量来源/量级，防消息重投雪崩 |\n| 旁支业务链路 | 平时小、大促可能放大叠加 | 从业务场景层层筛查调用关系 |\n| 高并发链路 | 秒杀、红包雨瞬时极高并发 | 集群物理隔离、分层过滤、容量测试 |\n\n高并发链路最易出问题（常含新场景、涉及面广）。梳理法：先识别\"爆点\"（最高并发的环节/接口），再从两方面下手——爆点逻辑能否化简（如预先算好中奖结果放缓存）、以及设计匹配的压测方案（压测也要按相同策略预热）。\n\n#### 新服务与新功能的架构治理\n\n倾向用架构图（调用关系图、部署图、时序图）在架构评审时弱化文字、倒逼体系化思考。重点图：\n\n- **调用关系图**：识别上下游与外部依赖，是容量保障基础信息；\n- **部署图**：物理拓扑，判断双活/跨机房带来的专线带宽与延迟因素；\n- **时序图**：快速识别同步/异步调用，定 MQ 等容量重点。\n\n#### 存量服务的架构治理\n\n时间有限时优先梳理历史事故与冒烟：曾经出过容量事故且未根治的是定时炸弹，大促前必须从根上解决。另一切入点是代码评审，由架构师牵头联合研发与测试，按脉络查：代码逻辑、依赖管理（强弱依赖）、数据库使用（连接池/热 Key）、中间件使用（Redis 热 Key、MQ 堆积）。\n\n| 评审维度 | 关注点 |\n| --- | --- |\n| 代码逻辑 | 是否冗余、嵌套过深 |\n| 依赖管理 | 强弱依赖是否明确 |\n| 数据库使用 | 表字段合理、连接池足够 |\n| 中间件使用 | 热 Key、MQ 堆积、过度堆积 |\n\n#### 边界与误区\n\n- 误区：大促前才搞架构治理。架构治理应落平时，大促只做高效补全。\n- 误区：只盯新功能。存量历史隐患更致命。\n\n#### 落地练习\n\n为你下一次大促，列出\"同步/异步/旁支/高并发\"四类链路各一条，并标出每条的爆点与拟采取的优化。\n\n\n#### 四类链路保障动作表\n\n把链路类型映射到具体保障动作：\n\n| 链路类型 | 保障动作 |\n| --- | --- |\n| 同步链路 | 协同压测 入口与下游同目标 |\n| 异步链路 | 查 MQ 容量 防重投雪崩 |\n| 旁支链路 | 场景化逐层筛查放大 |\n| 高并发链路 | 物理隔离 分层过滤 限流 |", "subs": ["明确背景与目标（前置项）", "四类重点链路梳理", "新服务与新功能的架构治理", "存量服务的架构治理", "边界与误区", "落地练习", "四类链路保障动作表"]}, {"title": "大促流量预估、容量测试与保障预案", "content": "目标与准备就绪后，进入大促保障的\"进行时\"三项重点。\n\n#### 大促流量预估\n\n流量预估是容量测试的前提。除第一册提到的扩散比计算，关键实践有：\n\n- **上游负责制（入口服务负责制）**：所有依赖方负责预估对被依赖方的调用量并通知下游保障；调用量高且关键时，下游可切出独立物理集群专供，降低相互容量影响。\n- **通用场景**：依常态流量加业务涨幅，注意对比清楚场景勿简单相加；\n- **二八法则**：流量不均时，预期 80% 流量在 20% 时间，据此估峰值 TPS；\n- **竞品对比**：全新无历史场景，可参考公开行业数据横向对比。\n\n#### 大促容量测试：单链路 + 混压\n\n单链路压测通过后，必须再与全链路压测叠加做**混压**，方能确保全局容量。示例假设（非实测数据）：三个营销服务单压都满足目标，混压却全不达标。排查发现三者数据库节点恰好混部在同一台服务器，单压时互不干扰、混压时叠加打满。这说明**哪怕表现无关联的服务，底层也可能相互牵扯，必须用混压还原真实**。\n\n时间节奏：早期安排常态全链路压测保常态安全；大促准备期穿插单链路压测；封版后密集组织若干次混压保全局。\n\n#### 大促保障预案\n\n预防不能百分百规避问题，预案是主动型保障手段。预案组织为五要素：**负责人、服务对象、执行条件、预案内容与操作步骤、影响面**。判据：预案要具体可操作、落实到人、可演练。\n\n```text\n预案示例（示意）:\n  负责人: 张三\n  服务对象: 天气服务\n  执行条件: 第三方天气供应商异常\n  内容与步骤: 降级, 不显示天气\n  影响面: 用户无法获取准确天气\n```\n\n完善预案覆盖率是快速恢复的有效手段，落脚点是**频繁演练**——提升熟练度、减少误判、防止预案腐化。\n\n#### 边界与误区\n\n- 误区：单压通过=全局安全。混压才能暴露底层共享资源的叠加风险。\n- 误区：预案写了就行。不演练的预案在真实故障时会失效。\n\n#### 落地练习\n\n为你大促的一个核心服务写一份五要素预案，并安排一次演练，记录演练中暴露的问题。\n\n\n#### 自动伸缩规则示意\n\n弹性伸缩在 Kubernetes 上常以 HPA 表达（示意，详见 [K8s 第二册](../../cloud-native/kubernetes/02-scheduling-and-workloads.md)）：\n\n```yaml\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nspec:\n  scaleTargetRef:\n    name: order-service\n  minReplicas: 4\n  maxReplicas: 40\n  metrics:\n    - type: Resource\n      resource:\n        name: cpu\n        target:\n          type: Utilization\n          averageUtilization: 70\n```", "subs": ["大促流量预估", "大促容量测试", "大促保障预案", "边界与误区", "落地练习", "自动伸缩规则示意"]}, {"title": "大促保障的整体框架", "content": "把前几节抽象成体系大图，可直接作为你大促保障方案的蓝本。\n\n#### 体系大图\n\n```mermaid\ngraph TD\n    G[目标与背景] --> L[链路梳理 架构治理]\n    L --> T[流量预估 容量测试 预案]\n    T --> R[全局评审 前置校对 混压]\n    R --> Z[复盘]\n```\n\n几个关键机制（通用经验，非特定公司）：\n\n- **全局评审**：各场景预估完成后组织一次全局评审，拉齐各方信息、查遗补漏（单场景常因信息不足而漏链路或算错量）；\n- **前置校对**：全场景混压前 1 小时做流程通气会（彩排），测试数据与资源协调化整为零异步完成，彩排前小流量调试确保脚本数据无误；\n- **复盘**：大促后及时复盘，暴露不足免再犯。\n\n#### 为什么需要这些机制\n\n单场景疏漏不一定是人不细心，常是信息不足；超大规模团队的混压协调极难，文档宣讲保证不了人人知晓，彩排式前置校对更可靠；人的认知螺旋发展，复盘是闭环最后一环。\n\n#### 边界与误区\n\n- 误区：保障=技术压测。组织机制（评审、校对、复盘）决定大促成败。\n- 误区：大促结束就散。复盘沉淀才是资产。\n\n#### 落地练习\n\n用上面大图，为你团队下次大促画出类似的体系图，并标出\"全局评审/前置校对/复盘\"当前是否已有，缺失的排期补上。\n\n#### 复盘检查项\n\n大促后复盘要落到可改进项：\n\n| 检查项 | 目的 |\n| --- | --- |\n| 目标达成度 | 是否达到容量目标 |\n| 混压暴露问题 | 是否发现单压遗漏 |\n| 预案有效性 | 演练是否到位 |\n| 组织协同 | 跨团队卡点 |\n| 资产沉淀 | 文档与模板更新 |", "subs": ["体系大图", "为什么需要这些机制", "边界与误区", "落地练习", "复盘检查项"]}]}, {"title": "第 8 章 · 容量保障的组织与团队", "sections": [{"title": "容量保障团队的职责与能力模型", "content": "容量保障不是单一技术命题，背后组织建设极重要——大促时产品、研发、测试、运维、项目经理等多角色共同投入，组织建设决定协同效率。\n\n#### 容量保障团队不是\"包干团队\"\n\n不推荐建一个通吃所有容量工作的独立团队。优秀实践是：容量保障需要团队去建设与统筹，但其最大价值是通过自身输出（工具、流程、规范）**推动公司整体容量保障水平与意识的提升**，而非单打独斗。\n\n#### 团队的能力模型\n\n一个有效的容量保障团队，能力可拆为：\n\n| 能力维度 | 内容 |\n| --- | --- |\n| 工程能力 | 全链路压测、容量预测等平台建设 |\n| 规范能力 | 制度建设、流程标准、评审机制 |\n| 联动能力 | 跨团队协调、推动整改 |\n| 数据能力 | 客观度量与打分，而非主观评价 |\n\n团队形式可多样，基于 SRE 团队或容量/性能测试团队都有成功案例。关键是\"通过输出辐射全员\"。\n\n#### 边界与误区\n\n- 误区：建独立团队包揽一切。结果团队痛苦、全员意识仍缺。\n- 误区：只做技术不做规范。没有规范联动，技术成果难以固化。\n\n#### 落地练习\n\n评估你所在组织：当前容量工作是否堆在某个团队？若是，列出该团队\"应下放给其他团队、自己只做统筹\"的三件事。\n\n\n#### 团队组织形态对照\n\n不同形态各有适用：\n\n| 形态 | 适用 | 注意 |\n| --- | --- | --- |\n| 包干团队 | 不推荐 | 全员意识难建立 |\n| SRE 团队 | 成熟组织 | 需授权与工具 |\n| 容量测试团队 | 变革期 | 需实权牵头 |\n| 虚拟加实线 | 多团队协同 | 权责要对等 |", "subs": ["容量保障团队不是\"包干团队\"", "团队的能力模型", "边界与误区", "落地练习", "团队组织形态对照"]}, {"title": "GOC 团队与独立性能测试团队之辨", "content": "集中式组织（如 GOC，全局运营指挥中心）与独立容量/性能测试团队，是两种常见形态，需分清边界与适用。\n\n#### GOC：作曲与指挥\n\nGOC 是一种集中式的生产环境应急指挥组织形态，负责统一监控、发现、通告、快速恢复、复盘的全生命周期管控。它适合做\"作曲家与指挥家\"：制定容量保障规范、统一跟进线上容量风险、大促期间协调各团队编作战手册、组织预案演练、牵头快速应急。它不直接介入技术细节，而是指导推动业务技术团队。\n\n```mermaid\ngraph LR\n    D[故障发现 监控告警] --> A[GOC 统一指挥]\n    A --> L[故障定位与恢复]\n    L --> R[故障复盘与改进]\n```\n\n#### 是否独立建容量/性能测试团队：阶段性判断\n\n是否有必要把容量测试团队化零为整，取决于业务发展阶段：\n\n| 业务阶段 | 特点 | 容量测试团队建议 |\n| --- | --- | --- |\n| 探索期 | 验证模式，从 0 到 1 | 形式无所谓 |\n| 进攻期 | 市占率唯一目标 | 形式无所谓 |\n| 发展期 | 业务成熟 | 可分而治之 |\n| 变革期 | 增速放缓，要优化出容量 | 必须集中式，有实权牵头监督 |\n\n在发展期后可考虑分而治之，变革期一定要有集中式团队（提供统一工具支撑、监督优化），团队不一定大，甚至可是 GOC/SRE 的一部分。\n\n#### 误区\n\n- 误区：GOC 包办技术细节。GOC 是指挥而非执行，技术恢复仍靠业务团队。\n- 误区：任何阶段都建独立测试团队。早期没必要，变革期才必需。\n\n#### 落地练习\n\n判断你组织当前业务阶段，据此给出\"现在是否需要独立容量测试团队\"的结论与理由。\n\n\n#### GOC 与独立测试团队分工\n\n两者不互斥，分工清晰：\n\n| 角色 | 职责 | 不做什么 |\n| --- | --- | --- |\n| GOC | 统一指挥 规范 应急 | 不直接写业务代码 |\n| 容量测试团队 | 压测 预测 工具 | 不替代业务 owner |\n| 业务团队 | 自身容量 owner | 不依赖他人兜底 |", "subs": ["GOC：作曲与指挥", "是否独立建容量/性能测试团队", "误区", "落地练习", "GOC 与独立测试团队分工"]}, {"title": "谁为容量负责：责任分配与团队运营", "content": "有团队还要明责任。容量保障牵扯角色太多，单一角色负责制通常行不通。\n\n#### 单一负责不可行\n\n除非团队极小，否则很难有一人或一团队 carry 全场。即便 GOC/容量测试团队，也无法单独解决所有容量问题，若让它负全责就违背权责对等，不可长久。\n\n#### 虚拟团队与\"虚实结合\"\n\n可行思路：GOC 牵头，各业务团队架构师与容量测试人员组成虚拟团队，有部分共同 KPI 受 GOC 统管。更落地的\"虚实结合\"做法：每个业务技术团队设一名容量保障负责人（架构师或资深研发），**双实线汇报**给业务负责人与 GOC 负责人，定义明确目标与产出。\n\n```mermaid\ngraph TD\n    B[业务负责人] --> O[容量保障负责人 双线汇报]\n    G[GOC 负责人] --> O\n    O --> Team[业务技术团队 不少于15pct人力统筹]\n```\n\n该负责人遵循\"首问负责制\"，对每个服务容量有第一手责任；其统筹的人力资源（如不少于 15% 人力）由团队保障；其他参与方保留原汇报关系，但有部分 KPI 对应容量职责，由 GOC 按客观数据打分。形成有层次、权责对等的负责制度。\n\n#### 团队运营：激励与竞争\n\n无论何种组织，激励与惩罚都必不可少：\n\n- **激励**：鼓励服务优化而非简单扩容。示例（通用做法，非特定公司）：某大团队内若某服务通过优化缩容，释放的资源不回收、可转给其他服务甚至奖励，立竿见影促使团队\"榨\"容量。\n- **竞争**：各业务域横向对比，但要小心度量公平性（非 CPU 密集型服务不宜只用 CPU 水位评判）。更客观的做法是直接看结果：给各团队一定\"容量事故配额\"，周期内按事故个数与严重程度扣减，形成\"容量健康分\"。\n\n#### 边界与误区\n\n- 误区：容量责任全推给 GOC。权责不对等不可长久。\n- 误区：用固定指标度量所有团队。服务类型不同，指标要适配。\n\n#### 落地练习\n\n设计你团队的\"虚实结合\"草图：容量保障负责人向谁双线汇报、统筹多少人力、KPI 中容量占比多少。\n\n\n#### 容量健康分计算示意\n\n用结果而非固定指标度量好坏（示例假设，非实测数据）：\n\n| 团队 | 事故配额 | 实际扣减 | 健康分 |\n| --- | --- | --- | --- |\n| A | 10 | 2 | 8 |\n| B | 10 | 6 | 4 |\n| C | 10 | 0 | 10 |\n\n健康分越接近配额初始值越好，驱动各团队自主优化。", "subs": ["单一负责不可行", "虚拟团队与\"虚实结合\"", "团队运营：激励与竞争", "边界与误区", "落地练习", "容量健康分计算示意"]}, {"title": "小规模组织的容量保障打法", "content": "小公司要不要做容量保障？结论：**与公司大小无关，与业务形态和发展趋势有关**。面向外部用户、有明显流量峰值的系统，再小也要做，只是做法不同。\n\n#### 方法一：粗放式保障（抓大放小）\n\n投入有限时不做面面俱到，优先性价比高的\"大头\"：\n\n- **观测**：对容量指标划警戒值（如 CPU ≥ 80%、P99 ≥ 500ms、成功率 ≤ 95%），超即告警。大多数线上容量问题靠这些简单对比就能第一时间感知；趋势型、带业务语义的监控成本高，可次要考虑。\n- **测试**：无条件做全链路压测，就加强基线容量测试；再无力，就在生产灰度阶段同比响应时间发现隐患（变相基线），发现问题先回滚再排查。\n\n粗放不是放弃，而是**有策略地选性价比最高的大头先堵住最严重风险**。\n\n#### 方法二：善用云服务商的收费机制\n\n业务有明显峰谷时，为保高峰需维持资源、低峰又浪费。云厂商提供低侵入机制：\n\n- **停机不收费**：计算与存储分离，低峰释放计算力保留存储，下次开机续用，相当于低峰缩容，只需评估安全缩多少（不要求精确、可演练）；\n- **弹性伸缩**：设伸缩规则，流量增自动加实例、减自动缩，按实际创建实例计费。它把\"容量预测不准\"的潜在风险用云基础设施能力去承载，类似用大池子分摊个体风险。\n\n#### 方法三：用好开源工具\n\n容量保障各环节几乎都有开源工具支撑：压测可用 JMeter（老牌、可插件扩展，并发不大时 BIO 模型劣势不显）；预测与规划可用 TensorFlow、PyTorch、Spark MLlib 等（从多项式拟合到神经网络皆有现成封装，精力可投在调参验证）。开源社区维护未必快，若有刚需的定制需求可做二次开发——附加值仍高。小公司队伍精简、组织扁平，对平台化需求一般不高，简单二次开发基本够用。\n\n#### 方法四：购买解决方案的边界\n\n业务不敏感时，把容量保障外包给云厂商或咨询机构不失为选择。但**若容量保障是长期常态化工作（如持续峰谷特征），不建议长期购买**——可持续保障需要全员\"容量意识\"（写代码想性能、设计想少瓶颈），这只能在实战中锻造，购买方案给不了。\n\n#### 边界与误区\n\n- 误区：小公司不用做容量保障。业务有峰值的外部系统，再小也要做。\n- 误区：买了方案就一劳永逸。长期保障靠内部意识沉淀。\n\n#### 落地练习\n\n为你团队（无论大小）按\"粗放观测→开源工具→云收费机制→必要时购买\"四级，列出当前可立即落地的两项低成本动作。\n\n#### 容量保障成熟度自测\n\n无论团队大小，都能用一张表快速定位当前所处阶段与下一步：\n\n| 成熟度 | 标志 | 下一步 |\n| --- | --- | --- |\n| L1 被动救火 | 只在大促前临时扩、出问题才限流 | 建立基线容量测试 |\n| L2 工程化 | 有压测与监控、能复现容量问题 | 做全链路压测闭环 |\n| L3 预测化 | 用模型预测容量、弹性伸缩常态化 | 预测与压测双向校准 |\n| L4 组织化 | 容量意识融入研发、权责对等 | 沉淀规范与平台 |\n\n定位不准时，先补上一档的缺口，比盲目上复杂平台更划算。", "subs": ["方法一：粗放式保障（抓大放小）", "方法二：善用云服务商的收费机制", "方法三：用好开源工具", "方法四：购买解决方案的边界", "边界与误区", "落地练习", "容量保障成熟度自测"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
