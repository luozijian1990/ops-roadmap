<title>方向二：运维知识工程与人机协作 · Roadmap</title>

<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({startOnLoad:false, theme:'base', themeVariables:{
    background:'#fffdf5', primaryColor:'#fff9d6', primaryBorderColor:'#1f2933',

<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>方向二：运维知识工程与人机协作</h1>
  <div class="meta">
    <a class="back" href="../../../index.html">← 返回总览</a>
    <div class="legend">
      <span><span class="dot todo"></span>待学</span>
      <span><span class="dot doing"></span>在学</span>
      <span><span class="dot done"></span>已学</span>
    </div>
    <div class="progress" title="学习进度"><span id="bar"></span></div>
    <span id="progress-text">0 / 0</span>
    <span class="search"><input id="search" type="search" placeholder="搜索小节…"></span>
    <button class="reset" id="reset">重置进度</button>
  </div>
</header>
<main id="roadmap"></main>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-resizer" id="drawer-resizer" role="separator" aria-orientation="vertical"
    aria-label="调整笔记面板宽度" aria-valuemin="360" tabindex="0"></div>
  <header>
    <h2 id="d-title"></h2>
    <div class="toggle-group" data-role="status">
      <button data-status="todo">待学</button>
      <button data-status="doing">在学</button>
      <button data-status="done">已学</button>
    </div>
    <button class="edit-btn edit-only" id="edit-section">编辑</button>
    <button class="close" id="d-close">×</button>
  </header>
  <div class="nav-hint"><kbd>←</kbd><kbd>→</kbd> 切换小节</div>
  <div class="tags-bar empty" id="d-tags"></div>
  <div class="edit-actions edit-only" id="edit-actions">
    <input class="edit-title" id="edit-title" type="text" aria-label="小节标题">
    <button class="save" id="save-section">保存</button>
    <button class="cancel" id="cancel-edit">取消</button>
    <span class="save-state" id="save-state"></span>
  </div>
  <div class="body" id="d-body"></div>
  <textarea class="editor-body" id="edit-content" spellcheck="false" aria-label="小节内容"></textarea>
</aside>
<div class="diagram-backdrop" id="diagram-backdrop"></div>
<section class="diagram-modal" id="diagram-modal" role="dialog" aria-modal="true" aria-label="放大图表">
  <header>
    <strong>Mermaid 图表</strong>
    <div class="diagram-controls" aria-label="图表缩放">
      <button id="diagram-zoom-out" title="缩小">-</button>
      <span class="diagram-zoom" id="diagram-zoom">100%</span>
      <button id="diagram-zoom-in" title="放大">+</button>
    </div>
    <button class="diagram-close" id="diagram-close" title="关闭">×</button>
  </header>
  <div class="diagram-body" id="diagram-body">
    <div class="diagram-canvas" id="diagram-canvas">
      <div class="diagram-inner" id="diagram-inner"></div>
    </div>
  </div>
</section>

<script id="data" type="application/json">{"title": "方向二：运维知识工程与人机协作", "intro": "> 本方向讨论如何把告警、工单、聊天、SOP、Runbook 和复盘记录组织为可核对、可检索、可演进的运维知识，并让 AI 在明确的人机边界内辅助事件理解。", "parts": [{"title": "📚 目录", "sections": [{"title": "阅读导航", "content": "- [方向定位](#方向定位)\n- [学习目标](#学习目标)\n- [落地之前的思考](#落地之前的思考)\n- [第一阶段：认识运维知识资产](#第一阶段认识运维知识资产)\n- [第二阶段：从原始信息形成事件叙事](#第二阶段从原始信息形成事件叙事)\n- [第三阶段：构建运维问答与 RAG](#第三阶段构建运维问答与-rag)\n- [第四阶段：构建统一 Incident Context](#第四阶段构建统一-incident-context)\n- [第五阶段：设计人机协作与知识闭环](#第五阶段设计人机协作与知识闭环)\n- [论文阅读路线](#论文阅读路线)\n- [来源索引](#来源索引)", "subs": ["方向定位", "学习目标", "落地之前的思考", "第一阶段：认识运维知识资产", "第二阶段：从原始信息形成事件叙事", "第三阶段：构建运维问答与 RAG"]}]}, {"title": "方向定位", "sections": [{"title": "这个方向研究什么", "content": "运维知识工程研究的是知识如何被取得、整理、检索、使用、修订和治理。\n\n它面对的原料非常杂乱：\n\n- 监控系统输出告警和指标。\n- 工单系统记录现象、影响和处理过程。\n- 即时通信保存工程师的临时判断。\n- CMDB 与服务目录描述对象关系。\n- SOP、TSG 和 Runbook 描述预期操作。\n- Postmortem 记录事件结束后的确认事实和改进项。\n- 历史事件保存相似但未必仍然适用的经验。\n\nLLM 的价值不只是“把文档问答做得更像聊天”。\n\n它更重要的能力是把自然语言材料转成结构化候选信息，连接用户意图与异构资料，并用可读语言解释检索结果。\n\n但模型生成的内容不是天然事实。\n\n知识系统必须保存来源、版本、时间、环境、权限和人工确认状态。", "subs": ["监控系统输出告警和指标", "工单系统记录现象、影响和处理过程", "即时通信保存工程师的临时判断", "CMDB 与服务目录描述对象关系", "SOP、TSG 和 Runbook 描述预期操作", "Postmortem 记录事件结束后的确认事实和改进项"]}, {"title": "与其他方向的边界", "content": "本方向关注知识如何组织和流转。\n\n日志解析、时间序列异常检测属于方向三。\n\n故障定位和根因推理属于方向四。\n\n生成并执行修复动作属于方向五。\n\n这里会讨论告警聚合、事件分诊和 Incident Context，因为它们把原始信号加工成可供诊断使用的知识。\n\n它们仍不等于 RCA：\n\n| 任务             | 主要问题                 | 输出                   | 是否确认根因 |\n| ---------------- | ------------------------ | ---------------------- | ------------ |\n| 告警聚合         | 哪些告警可能属于同一事件 | 告警组与关联依据       | 否           |\n| 事件摘要         | 目前发生了什么           | 时间线、影响和状态     | 否           |\n| 事件分诊         | 谁应先处理               | 严重性、类别、负责团队 | 否           |\n| Incident Context | 诊断需要哪些证据         | 分层上下文包           | 否           |\n| RCA              | 为什么发生               | 经证据支持的根因       | 是           |", "subs": []}, {"title": "本方向的核心判断", "content": "知识工程的目标不是堆积更多向量。\n\n目标是让正确的人在正确的时间取得正确版本、正确权限范围内的证据。\n\n一个可用的知识助手必须能回答三个附加问题：\n\n1. 这条信息来自哪里？\n2. 它对当前服务、环境和版本仍然适用吗？\n3. 它是已确认事实、历史经验，还是模型提出的假设？", "subs": []}]}, {"title": "学习目标", "sections": [{"title": "学完后应该能回答的问题", "content": "- 运维知识有哪些来源？\n- 为什么时间、服务、版本、环境和权限是必要元数据？\n- SOP、TSG、Runbook 与 Postmortem 分别承担什么职责？\n- 告警聚合、事件摘要和分诊如何形成事件叙事？\n- 运维 RAG 为什么需要意图检测和元数据过滤？\n- 如何识别召回错误、知识缺失和过期文档？\n- Incident Context 怎样区分事实、观测、经验和假设？\n- 哪些工作适合 AI，哪些判断必须由工程师负责？\n- 人工反馈如何回写而不污染事实源？", "subs": ["运维知识有哪些来源？", "为什么时间、服务、版本、环境和权限是必要元数据？", "SOP、TSG、Runbook 与 Postmortem 分别承担什么职责？", "告警聚合、事件摘要和分诊如何形成事件叙事？", "运维 RAG 为什么需要意图检测和元数据过滤？", "如何识别召回错误、知识缺失和过期文档？"]}, {"title": "学完后应该具备的设计能力", "content": "- 为运维知识对象设计最小元数据。\n- 把一份混乱工单整理成证据化事件摘要。\n- 为 OpsQA 设计意图分类、检索、重排和拒答流程。\n- 为 Incident Context 设计事实分层和冲突处理。\n- 为知识闭环设置审核、发布、过期和回滚机制。\n- 用任务指标与工作流指标共同评价人机协作。", "subs": ["为运维知识对象设计最小元数据", "把一份混乱工单整理成证据化事件摘要", "为 OpsQA 设计意图分类、检索、重排和拒答流程", "为 Incident Context 设计事实分层和冲突处理", "为知识闭环设置审核、发布、过期和回滚机制", "用任务指标与工作流指标共同评价人机协作"]}]}, {"title": "落地之前的思考", "sections": [{"title": "先确认知识问题，而不是直接建设向量库", "content": "本章是工程性综合，用来帮助团队判断知识工程是否值得启动，不代表某篇论文的原始实验结论。\n\n知识项目最容易从“把所有文档接入 RAG”开始，但这通常绕过了真正的问题。\n\n落地前应先回答：\n\n- 工程师找不到的是哪一类信息。\n- 信息缺失、过期、权限不清还是检索入口不统一。\n- 当前问题在文档、工单、聊天还是服务目录中发生。\n- 人工需要做的是搜索、判断、组合还是承担责任。\n- 哪些知识可以被引用，哪些知识只能作为未确认线索。\n\n同样的“问答效果差”，可能来自不同原因：\n\n| 症状 | 更可能的根因 | 第一优先级 |\n|---|---|---|\n| 搜不到文档 | 索引覆盖或权限过滤错误 | 盘点摄取范围和 ACL |\n| 找到旧 Runbook | owner、版本和有效期缺失 | 知识治理 |\n| 结果很多但无法判断 | 文档缺少适用条件 | 补充结构化元数据 |\n| 摘要看似完整但不可信 | 事实和推测混写 | 设计证据分层 |\n| 相似事件误导当前事件 | 服务、版本或环境不匹配 | 元数据过滤和重排 |\n| 工程师不用助手 | 不在现有事件流程里 | 工作流集成和责任设计 |\n\n如果只是把混乱资料换成向量索引，系统会更快地返回混乱资料。", "subs": ["工程师找不到的是哪一类信息", "信息缺失、过期、权限不清还是检索入口不统一", "当前问题在文档、工单、聊天还是服务目录中发生", "人工需要做的是搜索、判断、组合还是承担责任", "哪些知识可以被引用"]}, {"title": "先画知识生命周期和责任边界", "content": "运维知识不是一次性文档，而是随着服务、版本、架构和事故不断变化的资产。\n\n在编码前先画出一条生命周期：\n\n```mermaid\nstateDiagram-v2\n    [*] --> Draft\n    Draft --> Review: owner review\n    Review --> Published: evidence accepted\n    Published --> Superseded: version changed\n    Published --> Expired: validity window ended\n    Published --> Revoked: unsafe or incorrect\n    Superseded --> Archived\n    Expired --> Review: revalidate\n    Revoked --> Draft: rewrite\n```\n\n每一种知识对象都应有责任人和状态，而不只是一个文件路径。\n\n至少记录：\n\n- 服务、组件、环境和租户。\n- 适用版本与变更范围。\n- 创建者、审核者和 owner。\n- 来源事件或原始文档。\n- 生效时间和失效时间。\n- 权限范围与敏感等级。\n- 是否允许模型引用。\n- 是否允许生成行动建议。\n- 发生错误时如何撤回。\n\n可以先选择一种高频知识对象建立最小治理，而不是一次治理所有资料：\n\n| 对象 | 适合的第一步 | 不应直接做的事 |\n|---|---|---|\n| Runbook | 加前置条件、版本和回滚 | 直接让 Agent 执行全部命令 |\n| Postmortem | 标记确认事实与推测 | 把全文当成当前 SOP |\n| 工单 | 保留时间线和责任人 | 不加状态就直接向量化 |\n| 聊天记录 | 脱敏并标记临时判断 | 直接当作权威知识 |\n| 服务目录 | 补 owner、依赖和环境 | 只维护展示名称 |\n\n知识 owner 不是“资料上传人”。\n\nowner 要能回答当前内容是否仍然有效，并承担撤回、修订和冲突处理。", "subs": ["服务、组件、环境和租户", "适用版本与变更范围", "创建者、审核者和 owner", "来源事件或原始文档", "生效时间和失效时间", "权限范围与敏感等级"]}, {"title": "证明知识质量能改善工作流", "content": "知识系统的质量不能只用召回率或答案相似度证明。\n\n落地前应把收益拆成几个可观察层次：\n\n1. 是否找到相关资料。\n2. 资料是否适用于当前服务和版本。\n3. 回答是否引用正确证据。\n4. 工程师是否减少搜索和切换时间。\n5. 事件处理是否减少错误分支和重复劳动。\n\n建议建立如下基线：\n\n| 指标层 | 示例指标 | 采样方式 |\n|---|---|---|\n| 覆盖 | 目标服务有 owner 和有效 Runbook 的比例 | 服务目录盘点 |\n| 新鲜度 | 过期文档比例、最近审核间隔 | 版本与时间字段 |\n| 检索 | Top-k 相关率、无结果率 | 标注问题集 |\n| 事实 | 引用证据支持率、冲突率 | 专家抽样复核 |\n| 协作 | 采纳率、修改率、拒答率 | 事件工作流日志 |\n| 结果 | 分诊时间、重复查询次数、MTTR 变化 | 线上对照 |\n\n检索质量评估要覆盖“应该拒答”的问题。\n\n例如：\n\n- 当前版本没有对应 Runbook。\n- 用户没有访问该租户的权限。\n- 历史事件与当前拓扑不匹配。\n- 两份文档对同一参数给出冲突值。\n- 资料只描述实验环境，没有生产适用范围。\n\n这些样本如果被排除，系统的高分只说明它擅长回答简单问题。", "subs": ["当前版本没有对应 Runbook", "用户没有访问该租户的权限", "历史事件与当前拓扑不匹配", "两份文档对同一参数给出冲突值", "资料只描述实验环境"]}, {"title": "先处理数据权限和事实污染", "content": "知识系统把原本分散的访问边界集中到一个检索入口，权限错误会被放大。\n\n落地前至少画出三条边界：\n\n- 谁可以摄取某类资料。\n- 谁可以检索某类资料。\n- 谁可以把资料用于行动建议。\n\n“工程师能看到”不自动等于“模型可以跨事件复用”。\n\n权限设计应考虑：\n\n- 租户和组织边界。\n- 生产与测试环境。\n- 个人信息、凭据和安全事件。\n- 临时授权和撤销传播。\n- 缓存、Embedding 和日志中的副本。\n\n事实污染也需要单独处理。\n\n一条错误的自动摘要、未经确认的聊天判断或模型生成的 Postmortem，如果没有状态标记，就可能被下一轮检索当成事实。\n\n最低限度应区分：\n\n| 状态 | 是否可作为事实引用 | 是否可生成建议 |\n|---|---:|---:|\n| 原始观测 | 可以，需保留时间和来源 | 仅作为证据输入 |\n| 专家确认事实 | 可以 | 可以 |\n| 历史经验 | 需检查适用条件 | 可以作为候选 |\n| 未确认判断 | 不可以直接断言 | 只能明确标注为假设 |\n| 模型生成内容 | 不可以作为事实源 | 需人工审核后回写 |\n\n删除和撤回必须传播到索引、缓存、向量库和下游摘要。\n\n如果团队无法回答“撤回一份错误 Runbook 后多久不再被召回”，就不应把系统接入高风险诊断流程。", "subs": ["谁可以摄取某类资料", "谁可以检索某类资料", "谁可以把资料用于行动建议", "租户和组织边界", "生产与测试环境", "个人信息、凭据和安全事件"]}, {"title": "选择最小知识闭环并设置停止条件", "content": "首个试点最好选择一个 owner 明确、资料相对完整、问题高频且错误可人工拦截的场景。\n\n例如只做某一类服务的事件上下文生成：\n\n```mermaid\ngraph LR\n    A[Approved sources] --> B[Metadata filter]\n    B --> C[Retrieval]\n    C --> D[Evidence grouped context]\n    D --> E[Engineer review]\n    E --> F[Feedback and correction]\n    F --> A\n```\n\n试点不应一开始就接入所有聊天记录和所有租户。\n\n可以按以下顺序逐步扩展：\n\n1. 一个服务族。\n2. 一类事件问题。\n3. 只读检索和引用。\n4. 人工确认后的知识回写。\n5. 多服务关联。\n6. 与诊断或行动流程集成。\n\n每一步都要保留回退到原有搜索和人工流程的入口。\n\n成功条件可以包括：\n\n- 目标资料覆盖率达到约定阈值。\n- 过期和权限错误不高于基线。\n- 引用支持率达到专家可接受水平。\n- 工程师搜索时间减少且无需增加复核负担。\n- 错误知识能在约定时间内撤回。\n\n退出条件可以包括：\n\n- 资料 owner 无法持续维护。\n- 权限过滤无法证明可靠。\n- 检索结果不如现有目录或搜索。\n- 工程师需要花更多时间核对模型摘要。\n- 反馈回写会污染事实源。\n- 业务价值只来自一次性资料清理，无法持续。\n\n真正的知识工程不是“上线一个聊天框”，而是建立可追溯、可撤回、有人负责的知识供应链。", "subs": ["目标资料覆盖率达到约定阈值", "过期和权限错误不高于基线", "引用支持率达到专家可接受水平", "工程师搜索时间减少且无需增加复核负担", "错误知识能在约定时间内撤回", "资料 owner 无法持续维护"]}]}, {"title": "第一阶段：认识运维知识资产", "sections": [{"title": "结构化知识与非结构化知识", "content": "结构化知识拥有稳定字段和显式关系。\n\n常见例子包括：\n\n- 服务标识与负责人。\n- 集群、区域、环境和租户。\n- 资源依赖与调用拓扑。\n- 告警名称、级别和触发时间。\n- 变更单号、版本号和发布时间。\n- 工单状态、优先级和处理团队。\n\n非结构化知识以自然语言为主。\n\n常见例子包括：\n\n- 排障聊天记录。\n- 工单描述与处理备注。\n- Runbook 的解释性段落。\n- 事故复盘与经验总结。\n- 外部故障新闻和供应商公告。\n\n两类知识不能互相替代。\n\n结构化字段适合过滤、连接、统计和权限控制。\n\n自然语言适合保存背景、条件、例外和判断过程。\n\n一个稳健系统通常先用结构化字段缩小范围，再对范围内文本做语义检索。\n\n```mermaid\ngraph TD\n    A[User question] --> B[Intent and entity extraction]\n    B --> C[Metadata filtering]\n    C --> D[Lexical and vector retrieval]\n    D --> E[Evidence reranking]\n    E --> F[Grounded answer]\n    F --> G[Human verification]\n```\n\n上图是本路线图的编辑性综合，不是某篇论文原图。", "subs": ["服务标识与负责人", "集群、区域、环境和租户", "资源依赖与调用拓扑", "告警名称、级别和触发时间", "变更单号、版本号和发布时间", "工单状态、优先级和处理团队"]}, {"title": "运维知识对象的最小元数据", "content": "只保存正文会让检索得到“语义相似但操作上错误”的结果。\n\n建议每个知识对象至少附带：\n\n| 字段               | 作用                  | 缺失风险           |\n| ------------------ | --------------------- | ------------------ |\n| `source_id`      | 回到事实源            | 无法核对           |\n| `source_type`    | 区分工单、SOP、复盘等 | 混淆权威等级       |\n| `service`        | 限定服务范围          | 跨服务误用         |\n| `environment`    | 区分生产、预发和测试  | 在生产套用测试步骤 |\n| `region`         | 限定地域              | 忽略区域差异       |\n| `version_range`  | 指明适用版本          | 使用过期命令       |\n| `valid_from`     | 表示生效时间          | 不知道何时开始适用 |\n| `expires_at`     | 触发复审              | 陈旧知识长期存活   |\n| `owner`          | 指定维护责任          | 无人修订           |\n| `classification` | 表示敏感级别          | 权限泄漏           |\n| `review_status`  | 区分草稿与已发布      | 模型草稿被当成事实 |\n\n这些字段不是为了建立复杂标签数据库。\n\n它们服务于可追溯、可过滤和可治理三个直接目标。", "subs": []}, {"title": "SOP、TSG、Runbook 和 Postmortem", "content": "不同团队可能对这些词有不同习惯。\n\n本路线图采用以下工作定义：\n\n| 资产       | 主要目的       | 典型内容                   | 使用时机       |\n| ---------- | -------------- | -------------------------- | -------------- |\n| SOP        | 规范标准操作   | 前置条件、职责、步骤       | 日常重复流程   |\n| TSG        | 引导故障排查   | 症状、检查项、决策分支     | 已知故障场景   |\n| Runbook    | 支撑可执行操作 | 命令、参数、验证、回滚     | 人工或自动执行 |\n| Postmortem | 沉淀确认经验   | 时间线、影响、根因、行动项 | 事件结束后     |\n\nSOP 强调“应该怎样做”。\n\nTSG 强调“看到这个症状时怎样查”。\n\nRunbook 强调“怎样可靠执行”。\n\nPostmortem 强调“这次实际发生了什么”。\n\n同一段文本不能因为被向量化就获得相同权威等级。\n\n生产 Runbook 的已审核命令通常比聊天中的临时建议更适合作为操作依据。\n\n最近一次 Postmortem 的确认时间线通常比事件期间的猜测更适合作为历史事实。", "subs": []}, {"title": "文档新鲜度不是可选属性", "content": "运维知识会随系统变化而失效。\n\n变化来源包括：\n\n- 服务重命名。\n- API 或 CLI 参数变化。\n- 拓扑迁移。\n- 权限模型调整。\n- 告警规则更新。\n- 依赖版本升级。\n- 团队职责转移。\n\n“检索到了文档”不表示“文档仍可执行”。\n\n新鲜度检查可以包含：\n\n1. 是否在有效版本范围内。\n2. 最近一次审核距今多久。\n3. 文档引用的资源是否仍存在。\n4. 命令是否在隔离环境通过验证。\n5. 负责人是否仍是当前 owner。\n6. 是否存在更新版本或废弃标记。", "subs": ["服务重命名", "API 或 CLI 参数变化", "拓扑迁移", "权限模型调整", "告警规则更新", "依赖版本升级"]}, {"title": "企业私有知识为何重要", "content": "通用模型可能理解 Kubernetes、BGP 或数据库复制的公共概念。\n\n它通常不知道企业内部服务别名、部署约束、审批流程和历史事故。\n\nOWL、工业领域问答和 NetOps 能力研究从不同角度表明，领域数据、任务适配和评测集会显著影响模型表现。\n\n这不意味着每个团队都应训练一个大模型。\n\n可以按成本从低到高逐步选择：\n\n1. 结构化 Prompt。\n2. 受控词表与术语展开。\n3. RAG。\n4. 工具调用。\n5. Instruction Tuning。\n6. 领域继续预训练或专用模型。\n\n先解决知识可用性和评测问题，通常比直接扩大模型更重要。", "subs": []}, {"title": "知识资产盘点示例", "content": "选择一个真实服务，列出以下内容：\n\n- 服务目录入口。\n- 当前 Runbook。\n- 最近三次事件工单。\n- 最近一次 Postmortem。\n- 关键告警规则。\n- 负责人和升级路径。\n- 相关变更记录。\n\n然后为每项记录 owner、更新时间、适用环境、权限和权威等级。\n\n若无法填写，说明问题首先是知识治理，而不是生成模型能力。", "subs": ["服务目录入口", "当前 Runbook", "最近三次事件工单", "最近一次 Postmortem", "关键告警规则", "负责人和升级路径"]}, {"title": "本阶段小结", "content": "- 运维知识同时包含结构化关系与自然语言经验。\n- 元数据决定检索结果能否安全落地。\n- 文档类型代表不同目的和权威等级。\n- 私有术语和环境差异限制通用模型。\n- 知识新鲜度必须进入检索和审核流程。", "subs": ["运维知识同时包含结构化关系与自然语言经验", "元数据决定检索结果能否安全落地", "文档类型代表不同目的和权威等级", "私有术语和环境差异限制通用模型", "知识新鲜度必须进入检索和审核流程"]}]}, {"title": "第二阶段：从原始信息形成事件叙事", "sections": [{"title": "从信号到事件叙事", "content": "单条告警只表达某个规则在某时刻被触发。\n\n事件叙事需要回答更完整的问题：\n\n- 什么时候开始？\n- 哪些服务和客户受影响？\n- 观察到了什么症状？\n- 做过哪些诊断和缓解动作？\n- 当前状态是什么？\n- 哪些内容仍待确认？\n\n加工过程可以理解为：\n\n```mermaid\ngraph LR\n    A[Raw alerts] --> B[Alert groups]\n    C[Tickets and chat] --> D[Timeline extraction]\n    E[Topology and changes] --> F[Context enrichment]\n    B --> G[Incident narrative]\n    D --> G\n    F --> G\n    G --> H[Triage and diagnosis input]\n```\n\n上图是跨论文编辑性综合。", "subs": ["什么时候开始？", "哪些服务和客户受影响？", "观察到了什么症状？", "做过哪些诊断和缓解动作？", "当前状态是什么？", "哪些内容仍待确认？"]}, {"title": "告警聚合解决什么问题", "content": "大规模系统中，同一底层故障可能沿依赖关系触发多层告警。\n\nKnowledge-aware Alert Aggregation 给出的案例从 SSD 低电压开始，依次出现 OSD I/O 阻塞、进程异常、节点不健康、存储集群异常和 Redis 连接下降。\n\n这些告警跨越硬件、平台和应用层。\n\n它们未必具有高文本相似度。\n\n罕见但关键的严重告警也未必有足够共现历史。\n\n因此论文提出的 COLA 采用混合路线：\n\n- 对频繁告警关系使用时间共现和拓扑知识。\n- 对统计信息不足的关系使用 SOP 与 LLM 推断。\n- 以轻量嵌入检索相似正负样本辅助 ICL。", "subs": ["对频繁告警关系使用时间共现和拓扑知识", "对统计信息不足的关系使用 SOP 与 LLM 推断", "以轻量嵌入检索相似正负样本辅助 ICL"]}, {"title": "时间关联与空间关联", "content": "论文用滑动窗口收集短时间内出现的告警。\n\n若两个告警常在同一窗口出现，时间关联较强。\n\n若两个告警所在组件在知识图或服务拓扑上接近，空间关联较强。\n\n可将其学习化表示为：\n\n$$\nR(a_i,a_j)=T(a_i,a_j)-\\alpha \\hat{S}(a_i,a_j)\n$$\n\n其中：\n\n- $T$ 表示由条件概率得到的时间关联。\n- $\\hat{S}$ 表示归一化后的嵌入距离。\n- 距离越大，空间相似性越低，因此公式采用减法。\n- $\\alpha$ 控制空间项影响。\n\n这是对论文关联评分的学习化转写。\n\n实际符号与完整定义应以译文相应公式为准。\n\n运维含义是：共时发生不足以证明相关，拓扑接近也不足以单独证明相关，二者结合能减少偶然共现。", "subs": ["$T$ 表示由条件概率得到的时间关联", "$\\hat{S}$ 表示归一化后的嵌入距离", "距离越大，空间相似性越低，因此公式采用减法", "$\\alpha$ 控制空间项影响"]}, {"title": "告警聚合的边界", "content": "聚合结果是候选事件集合，不是因果链证明。\n\n常见错误包括：\n\n- 周期性告警造成虚假共现。\n- 时间窗口过大合并无关事件。\n- 时间窗口过小切断传播链。\n- 拓扑信息过期。\n- SOP 对新故障没有覆盖。\n- LLM 用语义合理性替代真实依赖。\n\n输出应保留每条关联的依据和不确定性。\n\n例如：\n\n```yaml\nalert_pair:\n  left: osd_io_blocked\n  right: storage_cluster_unhealthy\n  decision: related\n  evidence:\n    temporal_score: 0.86\n    topology_path: osd_node -> storage_cluster\n    sop_reference: SOP-STORAGE-017\n  status: candidate\n```", "subs": ["周期性告警造成虚假共现", "时间窗口过大合并无关事件", "时间窗口过小切断传播链", "拓扑信息过期", "SOP 对新故障没有覆盖", "LLM 用语义合理性替代真实依赖"]}, {"title": "事件摘要不是压缩文字", "content": "Assess and Summarize 研究用 LLM 从多个关联事件生成云服务中断摘要。\n\n它说明自动摘要可以显著缩短整理时间。\n\n但生产摘要的价值不只由流畅性决定。\n\n摘要必须覆盖：\n\n- 受影响对象。\n- 用户可见症状。\n- 时间范围。\n- 严重程度。\n- 已确认技术事实。\n- 当前处理状态。\n\n缺少关键影响信息的短文本，即使语言流畅，也不是好摘要。", "subs": ["受影响对象", "用户可见症状", "时间范围", "严重程度", "已确认技术事实", "当前处理状态"]}, {"title": "事实、推断与待确认项", "content": "推荐把摘要拆为明确区块：\n\n```markdown\n#### 已确认事实\n- 10:02 起 checkout-api 的 5xx 比例持续升高。\n- 影响区域为 ap-southeast-1。\n\n#### 工具观测\n- 数据库连接池使用率在 10:01 达到 100%。\n- 10:00 有一次应用版本发布。\n\n#### 当前假设\n- 发布可能改变连接复用行为，尚未确认。\n\n#### 待确认\n- 是否存在数据库侧限流。\n- 回滚能否恢复连接池水位。\n```\n\n这种格式阻止模型把“时间上接近”写成“已经证明”。", "subs": []}, {"title": "事件时间线的最小结构", "content": "每个时间点建议包含：\n\n| 字段           | 含义                                      |\n| -------------- | ----------------------------------------- |\n| `timestamp`  | 统一时区后的时间                          |\n| `event_type` | 告警、变更、观测、动作或状态更新          |\n| `subject`    | 服务、资源或团队                          |\n| `statement`  | 发生的事情                                |\n| `source`     | 工单、监控或聊天链接                      |\n| `confidence` | confirmed、observed、reported、hypothesis |\n\n时间戳冲突时不应静默选择一个。\n\n应保留两个来源并标注时钟、采集延迟或人工记录误差。", "subs": []}, {"title": "FAIL 展示了外部事件知识的价值与偏差", "content": "FAIL 使用 LLM 从新闻报道中抽取软件故障信息，构建可分析的故障数据库。\n\n它说明组织外部材料也能支持跨组织学习。\n\n外部新闻并不是内部遥测的替代品。\n\n新闻材料存在明显选择偏差：\n\n- 更倾向报道影响大的事件。\n- 技术细节可能不完整。\n- 根因可能来自早期声明。\n- 不同媒体可能重复同一来源。\n- 公开描述会省略敏感信息。\n\n因此外部案例适合用作风险模式和培训材料，不宜直接作为当前事件根因证据。", "subs": ["更倾向报道影响大的事件", "技术细节可能不完整", "根因可能来自早期声明", "不同媒体可能重复同一来源", "公开描述会省略敏感信息"]}, {"title": "事件分诊的任务边界", "content": "事件分诊通常预测：\n\n- 严重性或优先级。\n- 故障类别。\n- 负责团队。\n- 是否需要升级。\n- 分类理由或可解释证据。\n\nIncident Triage 论文研究 LLM 生成准确且可解释的分诊结果。\n\n分诊价值在于缩短路由时间、减少错误转派和帮助值班人员理解候选分类。\n\n分诊输出仍是决策建议。\n\n特别是高严重性判断和跨团队责任划分，应保留人工确认与升级机制。", "subs": ["严重性或优先级", "故障类别", "负责团队", "是否需要升级", "分类理由或可解释证据"]}, {"title": "FaultProfIT 的层次标签视角", "content": "云事件类别常有层次结构。\n\n例如：\n\n```text\nStorage\n├── Disk\n│   ├── Capacity\n│   └── Hardware failure\n└── Database\n    ├── Connection\n    └── Replication\n```\n\nFaultProfIT 把工单故障画像建模为层次化多标签问题，并用层次结构引导表示学习和对比学习。\n\n这比平面分类更贴近运维现实：\n\n- 一个事件可能同时属于多个标签。\n- 父类正确但子类不确定仍有路由价值。\n- 稀有子类可以利用父类结构学习。\n- 分类错误应区分“同父类误差”和“跨大类误差”。", "subs": ["一个事件可能同时属于多个标签", "父类正确但子类不确定仍有路由价值", "稀有子类可以利用父类结构学习", "分类错误应区分“同父类误差”和“跨大类误差”"]}, {"title": "分类结果如何进入知识系统", "content": "预测标签不应覆盖原始工单字段。\n\n推荐同时保存：\n\n```yaml\nclassification:\n  predicted:\n    labels: [storage, disk, hardware_failure]\n    model_version: fault-profiler-v3\n    confidence: 0.78\n  reviewed:\n    labels: [storage, disk, power_issue]\n    reviewer: oncall@example\n    reviewed_at: 2026-08-03T10:30:00+08:00\n```\n\n这样可以分析模型偏差，也能避免预测值伪装成人工事实。", "subs": []}, {"title": "从聚合到叙事的生产检查表", "content": "- [ ] 所有时间是否统一时区？\n- [ ] 告警组是否保留关联依据？\n- [ ] 是否过滤周期性噪声？\n- [ ] 摘要是否包含客户影响？\n- [ ] 推断是否与确认事实分开？\n- [ ] 每个关键句是否可回到来源？\n- [ ] 分诊标签是否标明模型版本？\n- [ ] 高严重性事件是否进入人工审核？\n- [ ] 是否保存无法解决的冲突？", "subs": ["[ ] 所有时间是否统一时区？", "[ ] 告警组是否保留关联依据？", "[ ] 是否过滤周期性噪声？", "[ ] 摘要是否包含客户影响？", "[ ] 推断是否与确认事实分开？", "[ ] 每个关键句是否可回到来源？"]}, {"title": "本阶段小结", "content": "- 告警聚合把信号归并为候选事件。\n- 摘要把多源记录组织成事件叙事。\n- 分诊把事件路由到类别、优先级和团队。\n- 层次标签比单一平面标签更贴近复杂系统。\n- 所有生成内容都应保留来源和确认状态。", "subs": ["告警聚合把信号归并为候选事件", "摘要把多源记录组织成事件叙事", "分诊把事件路由到类别、优先级和团队", "层次标签比单一平面标签更贴近复杂系统", "所有生成内容都应保留来源和确认状态"]}]}, {"title": "第三阶段：构建运维问答与 RAG", "sections": [{"title": "从通用问答到 OpsQA", "content": "OpsQA 不是普通企业文档搜索的简单改名。\n\n一个运维问题常隐含：\n\n- 当前服务和资源。\n- 生产或测试环境。\n- 软件与硬件版本。\n- 用户权限。\n- 期望答案类型。\n- 当前事件阶段。\n\n“如何重启节点”可能是在问标准操作，也可能是在事件中询问风险和前置检查。\n\n系统必须先理解意图，再选择知识与回答形式。", "subs": ["当前服务和资源", "生产或测试环境", "软件与硬件版本", "用户权限", "期望答案类型", "当前事件阶段"]}, {"title": "模型适配路线", "content": "| 路线               | 优势           | 主要代价       | 适合场景       |\n| ------------------ | -------------- | -------------- | -------------- |\n| Prompt             | 上手快         | 稳定性有限     | 原型与明确任务 |\n| RAG                | 可更新、可引用 | 依赖检索质量   | 私有文档问答   |\n| Instruction Tuning | 格式和任务适配 | 需要训练数据   | 稳定重复任务   |\n| 领域继续预训练     | 学习术语与分布 | 训练成本高     | 大规模专用模型 |\n| Tool Use           | 获取实时状态   | 权限和轨迹复杂 | 动态运维查询   |\n\nOWL 代表面向 IT 运维的领域模型路线。\n\n工业领域问答研究通过领域数据与增强方法考察专门问答能力。\n\nNetOps 实证研究比较模型规模、少样本、指令微调、思维链和 RAG 等因素。\n\n这些论文共同提醒：不能仅凭通用 benchmark 选择运维模型。", "subs": []}, {"title": "一个基础 RAG 管线", "content": "```mermaid\nsequenceDiagram\n    participant U as User\n    participant I as Intent layer\n    participant R as Retriever\n    participant G as Generator\n    participant H as Human\n    U->>I: Ops question\n    I->>I: Extract service version env intent\n    I->>R: Filtered query\n    R->>R: Retrieve and rerank evidence\n    R->>G: Evidence with citations\n    G->>G: Check support and knowledge gaps\n    G->>H: Answer or abstention\n    H->>U: Verified decision\n```", "subs": []}, {"title": "iKnow 的意图感知设计", "content": "iKnow 先研究云运维人员常问的问题，以及基础 RAG 为什么失败。\n\n其系统流程包含：\n\n- 向量数据库。\n- 意图检测与元数据提取。\n- 意图引导的查询改写。\n- 两阶段证据检索。\n- 知识缺失检测。\n- 意图引导的生成。\n\n关键思想是：不同意图需要不同证据和答案结构。\n\n例如：\n\n| 意图     | 重点检索对象       | 期望回答               |\n| -------- | ------------------ | ---------------------- |\n| 概念解释 | 产品文档与术语表   | 定义、适用范围         |\n| 操作步骤 | 当前版本 Runbook   | 前置、步骤、验证、回滚 |\n| 故障排查 | TSG 与相似事件     | 检查顺序和证据需求     |\n| 配置查询 | 实时工具与配置文档 | 当前值与来源           |\n| 责任查询 | 服务目录与值班表   | owner 和升级路径       |", "subs": ["向量数据库", "意图检测与元数据提取", "意图引导的查询改写", "两阶段证据检索", "知识缺失检测", "意图引导的生成"]}, {"title": "查询改写不能丢失约束", "content": "用户原问题：\n\n```text\n新加坡生产集群升级 1.29 后 ingress 频繁 502，先看什么？\n```\n\n一个有用的内部查询表示可以是：\n\n```yaml\nintent: troubleshoot\nservice: ingress\nenvironment: production\nregion: singapore\nversion: \"1.29\"\nsymptom: frequent_http_502\nrequested_output: diagnostic_first_steps\n```\n\n若改写只保留“ingress 502 troubleshooting”，检索可能混入旧版本、测试环境或其他区域文档。", "subs": []}, {"title": "文档分块应尊重操作语义", "content": "固定字符分块可能把前置条件与危险命令分开。\n\n运维知识更适合按以下边界切分：\n\n- 文档标题与适用范围。\n- 一个完整决策分支。\n- 一组不可分割的操作步骤。\n- 命令及其验证、失败和回滚说明。\n- Postmortem 的时间线、根因和行动项。\n\n每个块应继承文档级元数据。\n\n同时保留相邻块或父章节引用，避免生成器只看到孤立命令。", "subs": ["文档标题与适用范围", "一个完整决策分支", "一组不可分割的操作步骤", "命令及其验证、失败和回滚说明", "Postmortem 的时间线、根因和行动项"]}, {"title": "混合检索与重排", "content": "运维资料既有自然语言，也有精确标识符。\n\n向量检索擅长语义近似。\n\n关键词检索擅长：\n\n- 错误码。\n- 告警名。\n- 服务 ID。\n- 配置键。\n- 工单号。\n- 命令参数。\n\n因此常用混合检索：\n\n$$\nscore(d,q)=\\beta score_{semantic}(d,q)+(1-\\beta)score_{lexical}(d,q)\n$$\n\n这是通用学习化表达，不是 iKnow 原论文公式。\n\n最终还需结合元数据约束、文档权威等级和新鲜度重排。", "subs": ["错误码", "告警名", "服务 ID", "配置键", "工单号", "命令参数"]}, {"title": "两阶段证据检索", "content": "第一阶段追求召回，找出可能相关的材料。\n\n第二阶段追求精确，判断候选材料是否真正回答当前意图。\n\n第二阶段可以检查：\n\n1. 服务是否匹配。\n2. 环境和区域是否匹配。\n3. 版本是否兼容。\n4. 文档类型是否适合当前意图。\n5. 内容是否覆盖问题实体。\n6. 权限是否允许用户读取。\n7. 文档是否已废弃。", "subs": []}, {"title": "知识缺失检测", "content": "RAG 最重要的能力之一是知道“没有足够知识”。\n\n知识缺失可能表现为：\n\n- 没有召回任何材料。\n- 只召回低相似内容。\n- 候选文档环境不匹配。\n- 多个权威来源互相冲突。\n- 文档只覆盖旧版本。\n- 用户请求实时状态但系统只有静态文档。\n\n此时系统应拒绝编造，并说明缺少什么。\n\n示例：\n\n```text\n现有证据只覆盖 Kubernetes 1.27，无法确认 1.29 的操作步骤。\n我找到了相关旧版 Runbook，但不会把它作为当前版本指令。\n需要查询当前集群版本对应的发布说明或请 ingress owner 确认。\n```", "subs": ["没有召回任何材料", "只召回低相似内容", "候选文档环境不匹配", "多个权威来源互相冲突", "文档只覆盖旧版本", "用户请求实时状态但系统只有静态文档"]}, {"title": "引用必须支持句子而不只是主题", "content": "“有引用”不等于“有证据”。\n\n一个引用可能只与主题相关，却不支持具体结论。\n\n建议逐条检查：\n\n- 引用是否包含该事实。\n- 引用是否适用于当前环境。\n- 引用是否为当前版本。\n- 引用是否具有足够权威。\n- 引用是否遗漏相反条件。\n\n回答可采用：\n\n```yaml\nanswer_item:\n  claim: \"执行 drain 前需要确认 PodDisruptionBudget\"\n  source: \"RUNBOOK-K8S-NODE-012#prechecks\"\n  applicability:\n    environment: production\n    version: \">=1.28,<1.31\"\n  evidence_status: supported\n```", "subs": ["引用是否包含该事实", "引用是否适用于当前环境", "引用是否为当前版本", "引用是否具有足够权威", "引用是否遗漏相反条件"]}, {"title": "RAG 的典型失败方式", "content": "#### 召回错误\n\n语义相似但属于其他服务。\n\n处理方式是结构化过滤、实体识别和负样本评测。\n\n#### 文档过期\n\n旧命令仍然具有高文本相关性。\n\n处理方式是版本元数据、废弃标记和复审周期。\n\n#### 相似事件误类比\n\n症状相似不表示根因相同。\n\n处理方式是把历史事件标为经验，不作为当前根因事实。\n\n#### 无来源生成\n\n模型用参数知识补全了看似合理的操作。\n\n处理方式是强制句级支持、拒答和输出验证。\n\n#### 权限泄漏\n\n索引或缓存返回用户无权查看的材料。\n\n处理方式是在检索前执行访问控制，并让缓存键包含权限上下文。\n\n#### Prompt Injection\n\n文档中的恶意文本诱导模型忽略系统规则。\n\n处理方式是将检索内容视为不可信数据，隔离指令与证据，并限制工具权限。", "subs": ["召回错误", "文档过期", "相似事件误类比", "无来源生成", "权限泄漏", "Prompt Injection"]}, {"title": "OpsQA 的评价方法", "content": "不应只看答案文本相似度。\n\n建议评价：\n\n| 层次   | 指标                             |\n| ------ | -------------------------------- |\n| 意图   | 意图分类准确率、实体提取 F1      |\n| 检索   | Recall@k、MRR、有效文档命中率    |\n| 证据   | 引用支持率、版本适配率           |\n| 生成   | 正确性、完整性、可执行性         |\n| 拒答   | 缺失知识识别率、错误拒答率       |\n| 工作流 | 首次解决率、人工节省时间、升级率 |\n| 安全   | 越权召回率、危险建议率           |\n\n离线问题集应包含“不可回答问题”。\n\n否则系统会被奖励为任何问题都给出答案。", "subs": []}, {"title": "本阶段小结", "content": "- OpsQA 必须显式理解服务、环境、版本和意图。\n- RAG 的核心是证据选择，不只是向量搜索。\n- 分块应保持操作步骤的完整语义。\n- 混合检索适合同时处理自然语言与精确标识符。\n- 知识缺失检测和拒答是生产能力。\n- 权限控制必须发生在检索层。", "subs": ["OpsQA 必须显式理解服务、环境、版本和意图", "RAG 的核心是证据选择", "分块应保持操作步骤的完整语义", "混合检索适合同时处理自然语言与精确标识符", "知识缺失检测和拒答是生产能力", "权限控制必须发生在检索层"]}]}, {"title": "第四阶段：构建统一 Incident Context", "sections": [{"title": "Incident Context 是什么", "content": "Incident Context 是为一次事件诊断组织的、带时间和来源的证据包。\n\n它不是把所有日志塞进模型上下文窗口。\n\n它也不是一段模型自由生成的摘要。\n\n一个有效上下文应让工程师知道：\n\n- 当前确认了什么。\n- 观察到了什么。\n- 哪些变化与事件时间接近。\n- 哪些历史案例可供参考。\n- 哪些假设等待验证。\n- 下一步还缺什么证据。", "subs": ["当前确认了什么", "观察到了什么", "哪些变化与事件时间接近", "哪些历史案例可供参考", "哪些假设等待验证", "下一步还缺什么证据"]}, {"title": "证据分层", "content": "建议至少分为四层：\n\n| 层次       | 内容                   | 示例                  |\n| ---------- | ---------------------- | --------------------- |\n| 已确认事实 | 经人工或权威系统确认   | 影响区域和开始时间    |\n| 工具观测   | 查询返回的当前状态     | 5xx、延迟、连接池水位 |\n| 历史知识   | SOP、Runbook、相似事件 | 已知故障模式          |\n| 模型假设   | 待验证解释             | 发布导致连接泄漏      |\n\n四层可以互相引用，但不能互相覆盖。\n\n工具观测也有采样、延迟和查询错误。\n\n因此每项仍需保留时间和查询来源。", "subs": []}, {"title": "多源上下文的数据模型", "content": "```yaml\nincident_context:\n  incident_id: INC-2026-0803-017\n  scope:\n    services: [checkout-api, payment-db]\n    environment: production\n    regions: [ap-southeast-1]\n  confirmed_facts: []\n  observations: []\n  changes: []\n  alert_groups: []\n  timeline: []\n  historical_cases: []\n  hypotheses: []\n  evidence_gaps: []\n  access_scope: sre-oncall\n  generated_at: 2026-08-03T10:20:00+08:00\n```\n\n该结构是编辑性示例。\n\n生产实现应按现有事件平台的数据契约裁剪。", "subs": []}, {"title": "关联键如何选择", "content": "多源信息通常通过以下键关联：\n\n- `incident_id`：事件平台中的统一编号。\n- `service_id`：稳定服务标识。\n- `resource_id`：主机、Pod、数据库等对象。\n- `trace_id`：连接同一请求路径。\n- 时间窗口：连接同时或相邻发生的事件。\n- 变更 ID：连接发布、配置和审批记录。\n- 拓扑边：连接上游、下游和依赖关系。\n\n服务名称不应作为唯一键。\n\n别名、重命名和多语言显示会造成错误连接。", "subs": ["incident_id", "service_id", "resource_id", "trace_id", "时间窗口：连接同时或相邻发生的事件", "变更 ID：连接发布、配置和审批记录"]}, {"title": "时间对齐", "content": "事件材料可能来自不同时间系统：\n\n- 监控采集时间。\n- 日志事件时间。\n- 日志接收时间。\n- Trace span 时间。\n- 变更平台记录时间。\n- 工程师聊天时间。\n\n上下文需要记录原始时间、标准化时间和可能的时钟偏差。\n\n只按显示顺序拼接会产生虚假的先后关系。", "subs": ["监控采集时间", "日志事件时间", "日志接收时间", "Trace span 时间", "变更平台记录时间", "工程师聊天时间"]}, {"title": "冲突处理", "content": "冲突不是需要被模型润色掉的噪声。\n\n常见冲突包括：\n\n- 两个工单给出不同开始时间。\n- Runbook 与产品文档步骤不同。\n- 监控显示恢复但用户仍报告失败。\n- 历史事件对同一症状给出不同根因。\n\n处理策略：\n\n1. 保留冲突双方。\n2. 标注来源和时间。\n3. 比较权威等级与适用范围。\n4. 请求工具查询或人工确认。\n5. 决议后记录选择理由。", "subs": ["两个工单给出不同开始时间", "Runbook 与产品文档步骤不同", "监控显示恢复但用户仍报告失败", "历史事件对同一症状给出不同根因"]}, {"title": "上下文预算", "content": "上下文窗口有限，更多文本未必更好。\n\n选择内容时应按诊断价值排序：\n\n1. 当前影响与范围。\n2. 最近异常和关键变化。\n3. 与候选症状直接相关的观测。\n4. 当前服务的权威 Runbook。\n5. 高相似且环境匹配的历史事件。\n6. 低优先级背景信息。\n\n原始大对象应保留引用，让模型按需进一步查询，而不是一次性复制。", "subs": []}, {"title": "Incident Context 生命周期", "content": "```mermaid\nstateDiagram-v2\n    [*] --> Collecting\n    Collecting --> Enriched\n    Enriched --> UnderReview\n    UnderReview --> Confirmed\n    UnderReview --> Collecting: Evidence gap\n    Confirmed --> Archived\n    Archived --> Reopened: New evidence\n```\n\n这是编辑性状态模型。\n\n事件进行中，上下文会持续变化。\n\n因此每份快照应有生成时间和版本。", "subs": []}, {"title": "上下文的消费方", "content": "同一 Context 可被不同任务消费：\n\n| 消费方     | 需要内容                   | 不应默认获得     |\n| ---------- | -------------------------- | ---------------- |\n| 值班工程师 | 影响、时间线、证据缺口     | 无关敏感数据     |\n| 分诊系统   | 症状、服务、严重性         | 未审核根因       |\n| RCA Agent  | 观测、拓扑、变化、工具入口 | 高风险写权限     |\n| 状态页     | 已确认影响和进展           | 内部假设与秘密   |\n| Postmortem | 完整确认时间线             | 未解决的匿名猜测 |\n\n上下文不是“一份文本给所有人”。\n\n它必须根据目的和权限投影。", "subs": []}, {"title": "本阶段小结", "content": "- Incident Context 是带来源、时间和状态的证据包。\n- 事实、观测、历史知识和假设必须分层。\n- 多源关联依赖稳定标识、时间和拓扑。\n- 冲突需要保留并解决，不能被生成模型抹平。\n- 上下文应按诊断价值和权限裁剪。", "subs": ["Incident Context 是带来源、时间和状态的证据包", "事实、观测、历史知识和假设必须分层", "多源关联依赖稳定标识、时间和拓扑", "冲突需要保留并解决", "上下文应按诊断价值和权限裁剪"]}]}, {"title": "第五阶段：设计人机协作与知识闭环", "sections": [{"title": "AI 适合承担什么", "content": "AI 适合处理高信息量、可复核、低风险的认知劳动：\n\n- 汇总重复告警。\n- 抽取时间线候选项。\n- 生成事件摘要草稿。\n- 推荐分类标签。\n- 检索相似案例。\n- 找出知识冲突和缺口。\n- 生成 Runbook 修订草稿。\n- 把自然语言问题转成只读查询候选。\n\n这些任务的共同点是输出可由人或工具验证。", "subs": ["汇总重复告警", "抽取时间线候选项", "生成事件摘要草稿", "推荐分类标签", "检索相似案例", "找出知识冲突和缺口"]}, {"title": "人必须负责什么", "content": "以下职责不应因为模型表达流畅而自动转移：\n\n- 确认业务影响。\n- 确认根因。\n- 批准高风险或不可逆动作。\n- 决定跨团队责任。\n- 发布外部沟通。\n- 审核知识入库。\n- 接受剩余风险。\n\n人机边界应由风险和可验证性决定，而不是由模型名称决定。", "subs": ["确认业务影响", "确认根因", "批准高风险或不可逆动作", "决定跨团队责任", "发布外部沟通", "审核知识入库"]}, {"title": "三种协作模式", "content": "| 模式            | AI 行为       | 人工行为         | 适用场景           |\n| --------------- | ------------- | ---------------- | ------------------ |\n| Suggest         | 生成候选      | 选择、修订、执行 | 新任务和高风险任务 |\n| Review          | AI 先完成草稿 | 审核后发布       | 摘要、分类、文档   |\n| Guarded Execute | 在策略内执行  | 审批例外并监督   | 已验证、可逆动作   |\n\n本方向主要覆盖 Suggest 与 Review。\n\nGuarded Execute 的详细设计属于方向五。", "subs": []}, {"title": "人工反馈的四种类型", "content": "#### 对话反馈\n\n用户表示某次回答有用或无用。\n\n它适合用于体验统计，不足以直接修改事实库。\n\n#### 事实修订\n\n工程师更正服务、时间、影响或状态。\n\n它应写入事件系统，并保留修改人和审计记录。\n\n#### 文档修订\n\n工程师指出 Runbook 步骤过期。\n\n它应进入文档评审流程，而不是直接覆盖已发布版本。\n\n#### 模型监督信号\n\n审核结果被用于训练或排序优化。\n\n它需要去标识、质量筛选和数据版本管理。", "subs": ["对话反馈", "事实修订", "文档修订", "模型监督信号"]}, {"title": "不要把所有反馈自动写回向量库", "content": "未经审核的自动回写会形成知识污染闭环：\n\n```mermaid\ngraph TD\n    A[Model output] --> B[Automatic writeback]\n    B --> C[Knowledge index]\n    C --> D[Future retrieval]\n    D --> E[Model repeats claim]\n    E --> F[False confidence grows]\n```\n\n正确闭环应加入审核和发布：\n\n```mermaid\ngraph TD\n    A[Model draft] --> B[Human review]\n    B --> C{Approved}\n    C -->|No| D[Reject or revise]\n    C -->|Yes| E[Versioned source update]\n    E --> F[Index rebuild]\n    F --> G[Quality monitoring]\n```", "subs": []}, {"title": "知识回写状态机", "content": "```text\ncandidate -> reviewed -> approved -> published -> deprecated\n              |            |\n              v            v\n           rejected      superseded\n```\n\n每次状态变化应记录：\n\n- 操作者。\n- 时间。\n- 变更内容。\n- 审核依据。\n- 关联事件。\n- 上一个版本。\n- 回滚方式。", "subs": ["操作者", "时间", "变更内容", "审核依据", "关联事件", "上一个版本"]}, {"title": "如何评价协作效果", "content": "文本相似度无法完整反映人机协作价值。\n\n应同时观察：\n\n#### 任务质量\n\n- 摘要事实准确率。\n- 关键影响覆盖率。\n- 分诊准确率。\n- 检索有效证据命中率。\n- 引用支持率。\n\n#### 人工工作量\n\n- 摘要编辑距离或修改率。\n- 单事件审核时间。\n- 工程师追查来源的时间。\n- 错误转派次数。\n- 重复查询次数。\n\n#### 工作流结果\n\n- 分诊耗时。\n- 首次正确路由率。\n- 知识复用率。\n- 建议采纳率。\n- 因错误知识造成的返工率。\n\n#### 安全与治理\n\n- 越权检索次数。\n- 过期文档命中次数。\n- 无证据结论比例。\n- 高风险建议拦截率。\n- 未审核内容入库次数。", "subs": ["任务质量", "人工工作量", "工作流结果", "安全与治理"]}, {"title": "自动指标与人工评估", "content": "自动指标适合持续回归和大规模比较。\n\n人工评估适合判断事实遗漏、可操作性、语境适配和风险。\n\n推荐组合：\n\n1. 用固定测试集检查意图、检索和引用。\n2. 用专家双人抽样审核生成答案。\n3. 用线上日志观察修改率和升级率。\n4. 对高风险失败做案例复盘。\n5. 按服务、语言、事件类型分层报告。", "subs": []}, {"title": "上线闸门", "content": "一个知识助手进入生产前至少应满足：\n\n- [ ] 可以回到原始来源。\n- [ ] 权限在检索前执行。\n- [ ] 文档版本和新鲜度可过滤。\n- [ ] 不可回答问题会拒答。\n- [ ] 模型输出不会直接覆盖事实字段。\n- [ ] 高风险建议有人工确认。\n- [ ] 所有反馈回写有审核流程。\n- [ ] 模型、索引和文档版本可追踪。\n- [ ] 有离线回归集和线上质量指标。\n- [ ] 系统故障时有人工流程可用。", "subs": ["[ ] 可以回到原始来源", "[ ] 权限在检索前执行", "[ ] 文档版本和新鲜度可过滤", "[ ] 不可回答问题会拒答", "[ ] 模型输出不会直接覆盖事实字段", "[ ] 高风险建议有人工确认"]}, {"title": "本阶段小结", "content": "- AI 更适合生成可验证候选，不适合独占事实确认权。\n- 人机边界由风险、可逆性和验证成本决定。\n- 反馈必须按类型进入不同系统。\n- 自动回写会放大模型错误。\n- 协作评价要同时覆盖质量、工作量、结果和治理。", "subs": ["AI 更适合生成可验证候选", "人机边界由风险、可逆性和验证成本决定", "反馈必须按类型进入不同系统", "自动回写会放大模型错误", "协作评价要同时覆盖质量、工作量、结果和治理"]}]}, {"title": "工程补充：知识摄取、租户隔离与发布治理", "sections": [{"title": "端到端摄取不止是分块和 Embedding", "content": "一个可运营的知识管线需要覆盖完整生命周期：\n\n```mermaid\ngraph LR\n    A[Collect sources] --> B[Parse and clean]\n    B --> C[Deduplicate]\n    C --> D[Resolve entities and versions]\n    D --> E[Attach ACL and owner]\n    E --> F[Semantic chunking]\n    F --> G[Index and cache]\n    G --> H[Quality validation]\n    H --> I[Publish]\n    I --> J[Rebuild update or delete]\n    J --> K[Audit propagation]\n```\n\n上图是工程性综合。各阶段都要记录输入版本、处理器版本、输出对象、错误和审计事件，否则无法解释某条引用为什么出现或为什么删除后仍能被召回。", "subs": []}, {"title": "采集、清洗与去重", "content": "采集器应保留来源 URL 或仓库路径、源系统对象 ID、修订版本、时间、作者、owner、密级和租户。清洗时移除导航噪声和重复模板，但不能丢失命令前置条件、警告、代码块和标题层级。\n\n去重至少分三层：\n\n| 层次         | 目标                 | 注意事项                 |\n| ------------ | -------------------- | ------------------------ |\n| 精确去重     | 相同字节或规范化文本 | 保留所有来源关系         |\n| 近重复去重   | 同一文档的轻微改写   | 不能合并不同权限版本     |\n| 语义冲突检测 | 同主题但结论不同     | 冲突不是重复，应进入审阅 |\n\n若两个租户拥有相同内容，也不能为了节省空间而丢掉租户边界。物理内容可复用，授权元数据必须独立验证。", "subs": []}, {"title": "实体消歧与版本关联", "content": "`payment` 可能指服务、团队、Dashboard 或数据库。实体解析应结合对象类型、命名空间、环境、集群和有效时间，并保留不能确定的候选。\n\n文档还要关联适用版本：\n\n- 服务与 API 版本。\n- Kubernetes 或云 Provider 版本。\n- Runbook 修订与生效区间。\n- 变更、事件和 Postmortem 的时间关系。\n- 被替代文档和当前权威文档。\n\n检索时若当前环境为 v42，v31 的 Runbook 可以作为历史证据，但不能无标记地排在当前版本之前。", "subs": ["服务与 API 版本", "Kubernetes 或云 Provider 版本", "Runbook 修订与生效区间", "变更、事件和 Postmortem 的时间关系", "被替代文档和当前权威文档"]}, {"title": "权限标注必须早于分块", "content": "若先分块再猜测权限，标题、表格或代码块可能失去原文的访问标签。推荐把租户、主体、资源范围、密级和可引用字段在文档级解析后传播到每个 chunk，并在发布前验证继承结果。\n\n每个 chunk 至少带：\n\n```yaml\nchunk_id: stable-document-and-section-id\ntenant_id: tenant-a\nsource_id: runbook-184\nsource_version: 12\nowner: team-payment\nclassification: internal\nallowed_groups: [payment-oncall]\nvalid_from: 2026-07-01T00:00:00Z\nvalid_to: null\ncontent_hash: sha256-placeholder\n```\n\n这是教学 Schema，不要求仓库建立数据库。", "subs": []}, {"title": "分块、索引和重建", "content": "分块应尊重操作语义：命令、前置条件、验证和回滚不能拆散。表格行若离开表头会失去含义，代码块若离开版本和环境说明会变成危险建议。\n\n索引版本应绑定：Embedding 模型、分词或切分器、字段映射、过滤策略和构建时间。任何一项变化都应并行构建新索引，经离线回放和影子查询验证后再切换别名。\n\n重建期间要定义：\n\n- 新旧索引的一致性窗口。\n- 增量更新如何与全量快照衔接。\n- 缓存键是否包含索引和 ACL 版本。\n- 构建失败时是否继续使用旧索引。\n- 切换后怎样回滚且不复活已删除内容。", "subs": ["新旧索引的一致性窗口", "增量更新如何与全量快照衔接", "缓存键是否包含索引和 ACL 版本", "构建失败时是否继续使用旧索引", "切换后怎样回滚且不复活已删除内容"]}, {"title": "删除传播是一等能力", "content": "删除或撤权必须传播到源对象、chunk、稠密与稀疏索引、重排缓存、问答缓存、引用快照和下游副本。不能只从主数据库删一行。\n\n```mermaid\nstateDiagram-v2\n    [*] --> Active\n    Active --> Tombstoned: Delete or revoke requested\n    Tombstoned --> Purging\n    Purging --> Verified: Indexes and caches checked\n    Verified --> Deleted\n    Purging --> Escalated: Propagation timeout\n```\n\n删除记录需要不可变审计，但审计中不应保留被要求删除的敏感正文。可以保留对象 ID、hash、操作者、原因、时间和各副本确认状态。", "subs": []}, {"title": "多租户 RAG 的检索顺序", "content": "安全流程应为：认证主体，解析租户与授权范围，在召回前过滤，再重排和生成。不能先跨租户召回后依赖模型“不说出来”。\n\n```mermaid\ngraph LR\n    U[Authenticated user] --> P[Resolve tenant and policy]\n    P --> Q[Rewrite query with constraints]\n    Q --> F[Pre retrieval ACL filter]\n    F --> R[Retrieve and rerank]\n    R --> S[Redact citations]\n    S --> A[Generate grounded answer]\n    A --> L[Cross tenant audit]\n```\n\n上图是工程性综合。", "subs": []}, {"title": "chunk 级 ACL、索引与缓存隔离", "content": "- 检索前过滤使用授权主体和 chunk ACL，不能只按文档首页权限。\n- 高隔离租户可使用独立索引；共享索引必须有不可绕过的租户过滤。\n- 查询缓存、Embedding 缓存和答案缓存的键必须包含租户、权限版本和索引版本。\n- 引用输出要脱敏标题、路径、作者和相邻片段，避免元数据泄漏。\n- 审计要能发现跨租户零结果异常、过滤器缺失和缓存串租。\n\n测试至少包含同文本不同权限、权限刚撤销、共享缓存命中、引用标题泄漏和管理员切换租户等用例。", "subs": ["检索前过滤使用授权主体和 chunk ACL", "高隔离租户可使用独立索引", "查询缓存、Embedding 缓存和答案缓存的键必须包含租户、权限版本和索引版本", "引用输出要脱敏标题、路径、作者和相邻片段", "审计要能发现跨租户零结果异常、过滤器缺失和缓存串租"]}, {"title": "轻量 Incident Knowledge Schema", "content": "下面的 Schema 用于统一术语和关联键，不要求实现复杂图数据库：\n\n| 对象     | 最小字段                             | 关键关系                   |\n| -------- | ------------------------------------ | -------------------------- |\n| Service  | ID、名称、环境、owner、版本          | 依赖资源、团队和 Runbook   |\n| Resource | ID、类型、区域、状态、owner          | 被服务使用，受变更影响     |\n| Team     | ID、值班组、升级路径                 | 拥有服务和知识             |\n| Incident | ID、时间、严重度、状态、影响         | 关联告警、证据、变更和行动 |\n| Change   | ID、版本、窗口、操作者、对象         | 可能影响服务或资源         |\n| Alert    | ID、规则版本、时间窗、实体           | 触发或关联事件             |\n| Evidence | ID、来源、事件时间、provenance、质量 | 支持或反驳候选结论         |\n| Runbook  | ID、版本、owner、适用范围、审批状态  | 指导诊断或缓解步骤         |\n\n所有关系都应带来源和有效时间。`Service A depends_on B` 若没有时间范围，会在拓扑变化后误导诊断。", "subs": []}, {"title": "值班交接是状态转移", "content": "高质量交接包应包含：\n\n- 当前影响、事件阶段和 Incident Commander。\n- 已确认事实、候选解释、反证和未知项。\n- 已执行查询与可复现链接。\n- 正在进行、已停止和禁止执行的动作。\n- 下一个区分性检查及其 owner。\n- 关键时间点、审批、风险和升级路径。\n\n接班人应显式确认已读取并指出冲突，不把聊天记录长度当成交接质量。", "subs": ["当前影响、事件阶段和 Incident Commander", "已确认事实、候选解释、反证和未知项", "已执行查询与可复现链接", "正在进行、已停止和禁止执行的动作", "下一个区分性检查及其 owner", "关键时间点、审批、风险和升级路径"]}, {"title": "冲突审阅与权威发布", "content": "新知识进入发布态前经过：\n\n1. 自动检测与现有 Runbook、配置和 Postmortem 的冲突。\n2. 路由给拥有该服务或知识域的 owner。\n3. reviewer 判断替代、并存、过期或需实验验证。\n4. 审批后的版本成为权威入口，旧版本保留明确状态。\n5. 发布事件触发索引、缓存与引用更新。\n\n没有 owner 的知识不能自动成为权威知识。紧急事件中的临时笔记可以快速发布为 `provisional`，但必须有到期时间和后续审阅任务。", "subs": []}, {"title": "审批疲劳与 owner 责任", "content": "不是每个拼写修复都需要高级专家，也不能把模型生成的 Runbook 批量一键批准。按风险分级：\n\n| 变更                     | 审批建议              |\n| ------------------------ | --------------------- |\n| 元数据和格式，不改变语义 | 自动检查后轻量审核    |\n| 检索关键词和非执行说明   | 单 owner 审核         |\n| 诊断命令与阈值           | owner 加值班 reviewer |\n| 写操作、权限或不可逆步骤 | 双人复核并演练        |\n\nOwner 对适用范围、新鲜度、冲突处置和撤回负责；平台团队负责管线、ACL 和审计，不替业务 owner 判断操作真伪。", "subs": []}, {"title": "知识质量指标和 SLO", "content": "| 指标          | 定义示例                      | 说明                         |\n| ------------- | ----------------------------- | ---------------------------- |\n| 过期率        | 超过复审期的已发布对象占比    | 按风险等级设置不同周期       |\n| 冲突率        | 未解决冲突对象占比            | 冲突不能靠选最新时间自动消失 |\n| 无 owner 比例 | owner 缺失或不可达对象占比    | 应阻止高风险知识发布         |\n| 零结果率      | 授权查询无召回的比例          | 按租户、意图和服务分层       |\n| 引用覆盖率    | 可核对事实中带有效引用的比例  | 还要检查引用是否真正支持句子 |\n| 删除传播时延  | 撤权到所有副本确认的时间      | 同时报告超时和残留副本       |\n| ACL 过滤失败  | 未授权 chunk 进入候选集的次数 | 安全指标应接近零容忍         |\n| 新鲜度        | 来源更新到可检索版本的时间    | 区分正常更新与紧急撤回       |\n\n质量指标要与 owner 和处置流程绑定。Dashboard 上的红色数字若没有升级和修复路径，不构成治理闭环。", "subs": []}]}, {"title": "论文阅读路线", "sections": [{"title": "入门：先理解信息整理任务", "content": "1. [Assess and Summarize](https://arxiv.org/pdf/2305.18084)：理解多事件信息如何形成中断摘要。\n2. [Knowledge-aware Alert Aggregation](https://arxiv.org/pdf/2403.06485.pdf)：理解统计、拓扑知识、SOP 与 LLM 如何互补。\n3. [Incident Triage](https://www.microsoft.com/en-us/research/uploads/prod/2024/08/ISSRE24_LLM4triage.pdf)：理解事件路由和解释任务。\n\n阅读时先记录每篇论文的输入、输出和人工角色。\n\n不要先比较不同实验中的绝对指标。", "subs": []}, {"title": "进阶：再理解领域知识适配", "content": "1. [工业领域问答](https://aclanthology.org/2023.emnlp-industry.29.pdf)：理解领域数据、增强和问答评测。\n2. [OWL](https://openreview.net/pdf?id=SZOQ9RKYJu)：理解 IT 运维专用模型路线。\n3. [iKnow](https://jun-jie-huang.github.io/assets/papers/ase25_iknow.pdf)：理解意图感知 OpsQA RAG。\n4. [NetOps 能力实证](https://arxiv.org/pdf/2309.05557.pdf)：比较 Prompt、模型规模、微调、思维链和 RAG。", "subs": []}, {"title": "深入：研究事件知识的结构化", "content": "1. [FaultProfIT](https://dl.acm.org/doi/pdf/10.1145/3639477.3639754)：理解层次化多标签事件画像。\n2. [FAIL](https://arxiv.org/pdf/2406.08221)：理解外部故障知识抽取及其偏差。", "subs": []}, {"title": "代表性论文对比", "content": "| 论文                              | 主要输入         | 主要输出       | 技术主线                 | 人工角色       |\n| --------------------------------- | ---------------- | -------------- | ------------------------ | -------------- |\n| Assess and Summarize              | 相关事件记录     | 中断摘要       | 领域处理与生成           | 审核摘要       |\n| Knowledge-aware Alert Aggregation | 告警、拓扑、SOP  | 相关告警对或组 | 统计、图嵌入、LLM        | 核对事件范围   |\n| Incident Triage                   | 事件文本         | 类别和解释     | LLM 分诊                 | 确认路由       |\n| FaultProfIT                       | 事件工单         | 层次化标签     | 编码、层次表示、对比学习 | 修订标签       |\n| iKnow                             | 运维问题与知识库 | 带证据答案     | 意图感知 RAG             | 验证与执行     |\n| OWL                               | IT 运维数据      | 领域模型能力   | 领域适配                 | 任务使用与评测 |\n| FAIL                              | 新闻材料         | 故障数据库     | LLM 信息抽取             | 验证抽取与偏差 |", "subs": []}]}, {"title": "本方向总结", "sections": [{"title": "最值得记住的结论", "content": "1. 运维知识的价值取决于来源、适用范围、新鲜度和权限，而不取决于向量数量。\n2. 告警聚合、事件摘要和分诊共同构成事件叙事，但都不等于 RCA。\n3. OpsQA 需要意图、实体、结构化过滤、混合检索、证据重排和拒答。\n4. Incident Context 必须区分确认事实、工具观测、历史知识与模型假设。\n5. AI 应提供可验证候选，人应保留事实确认和高风险决策权。\n6. 未经审核的自动回写会把模型错误变成未来检索证据。", "subs": []}, {"title": "推荐学习顺序", "content": "1. 先盘点一个服务的知识资产。\n2. 再把原始事件整理成证据化叙事。\n3. 然后实现带版本与环境过滤的基础 RAG。\n4. 再增加意图感知、缺失检测和权限控制。\n5. 最后设计 Incident Context 与知识回写流程。", "subs": []}]}, {"title": "来源索引", "sections": [{"title": "本方向主要来源", "content": "以下论文入口统一指向仓库 `README.md` 中维护的公开原文地址，便于独立分享 HTML 后继续阅读。\n\n- [评估与总结：利用大语言模型提升对服务中断的理解](https://arxiv.org/pdf/2305.18084)\n- [大规模云系统中的知识感知告警聚合](https://arxiv.org/pdf/2403.06485.pdf)\n- [大语言模型可实现准确且可解释的事件分诊](https://www.microsoft.com/en-us/research/uploads/prod/2024/08/ISSRE24_LLM4triage.pdf)\n- [FaultProfIT：层次化故障模式分析](https://dl.acm.org/doi/pdf/10.1145/3639477.3639754)\n- [FAIL：使用大语言模型分析新闻中的软件故障](https://arxiv.org/pdf/2406.08221)\n- [工业领域特定问答](https://aclanthology.org/2023.emnlp-industry.29.pdf)\n- [OWL：面向 IT 运维的大语言模型](https://openreview.net/pdf?id=SZOQ9RKYJu)\n- [iKnow：意图引导的云运维 RAG](https://jun-jie-huang.github.io/assets/papers/ase25_iknow.pdf)\n- [预训练大语言模型 NetOps 能力实证](https://arxiv.org/pdf/2309.05557.pdf)", "subs": ["评估与总结：利用大语言模型提升对服务中断的理解", "大规模云系统中的知识感知告警聚合", "大语言模型可实现准确且可解释的事件分诊", "FaultProfIT", "FAIL：使用大语言模型分析新闻中的软件故障", "工业领域特定问答"]}, {"title": "资料与结论边界", "content": "正文中的论文方法、案例和实验判断以链接译文为依据。\n\nIncident Context 分层、数据结构、状态机、上线清单和部分公式是本路线图为教学目的做的编辑性综合。\n\n它们不冒充单篇论文原图或作者直接结论。\n\n不同论文使用的数据集、模型、指标和实验环境不同。\n\n本笔记不跨实验环境直接比较绝对数值。\n\n跨方向涉及日志异常、RCA 和自动修复的内容只用于说明知识的上游和下游边界，详细方法分别放在方向三、方向四和方向五。", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
