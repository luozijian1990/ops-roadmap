<title>方向六：基础设施与 AI 平台智能运维 · Roadmap</title>

<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({startOnLoad:false, theme:'base', themeVariables:{
    background:'#fffdf5', primaryColor:'#fff9d6', primaryBorderColor:'#1f2933',

  window.__mermaid = mermaid;

<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

</aside>

<section class="diagram-modal" id="diagram-modal" role="dialog" aria-modal="true" aria-label="放大图表">
  <header>
    <strong>Mermaid 图表</strong>
    <div class="diagram-controls" aria-label="图表缩放">
      <button id="diagram-zoom-out" title="缩小">-</button>
      <span class="diagram-zoom" id="diagram-zoom">100%</span>
      <button id="diagram-zoom-in" title="放大">+</button>
    </div>
    <button class="diagram-close" id="diagram-close" title="关闭">×</button>
  </header>
  <div class="diagram-body" id="diagram-body">
    <div class="diagram-canvas" id="diagram-canvas">
      <div class="diagram-inner" id="diagram-inner"></div>
    </div>
  </div>

<script id="data" type="application/json">{"title": "方向六：基础设施与 AI 平台智能运维", "intro": "> 本方向把前五个方向的方法落到 IaC、云资源生命周期和大规模 LLM 训练平台。现有直接译文只有四篇，因此正文强调学习框架、工程控制和证据边界，不扩写不存在的实验共识。", "parts": [{"title": "📚 目录", "sections": [{"title": "阅读导航", "content": "- IaC 语义、生成与评测。\n- [落地之前的思考](#落地之前的思考)。\n- 语义检查和变更风险。\n- 基础设施 Agent 的接口与权限。\n- LLM 训练平台的黑盒诊断。\n- DevOps、SRE 和 Platform Engineering 集成。\n- 阅读路线和来源。", "subs": ["IaC 语义、生成与评测", "落地之前的思考", "语义检查和变更风险", "基础设施 Agent 的接口与权限", "LLM 训练平台的黑盒诊断", "DevOps、SRE 和 Platform Engineering 集成"]}]}, {"title": "方向定位", "sections": [{"title": "三类问题", "content": "#### 基础设施定义\n\n怎样生成、解释和验证 Terraform 等 IaC。\n\n#### 基础设施管理\n\n怎样让 Agent 通过 CLI、SDK、IaC 或平台 API 读取和修改云资源。\n\n#### AI 平台运维\n\n怎样诊断 GPU、网络、存储、调度器和训练框架共同构成的大规模训练平台。", "subs": ["基础设施定义", "基础设施管理", "AI 平台运维"]}, {"title": "与前五个方向的关系", "content": "```mermaid\ngraph TD\n    A[Foundation and evaluation] --> F[Infrastructure domain]\n    B[Knowledge and context] --> F\n    C[Signals and observability] --> F\n    D[Diagnosis and RCA] --> F\n    E[Controlled remediation] --> F\n    F --> G[IaC lifecycle]\n    F --> H[Cloud agent]\n    F --> I[AI training platform]\n```\n\n方向六不是独立的新方法栈。\n\n它把可信评测、知识、信号、诊断和安全执行应用到基础设施对象。", "subs": []}, {"title": "资料覆盖边界", "content": "本方向直接来源为：\n\n- IaC-Eval。\n- Cloud Infrastructure Management in the Age of AI Agents。\n- Unearthing Semantic Checks for IaC。\n- LLMPrism。\n\nIaC-Eval 提供基准与功能正确性证据。\n\nSemantic Checks 提供部署语义护栏研究。\n\nCloud Agent 论文提供管理模态、生命周期与初步案例。\n\nLLMPrism 提供生产训练平台黑盒性能诊断证据。\n\n四篇论文不能代表整个行业已形成自治基础设施共识。", "subs": ["IaC-Eval", "Cloud Infrastructure Management in the Age", "Unearthing Semantic Checks for IaC", "LLMPrism"]}]}, {"title": "学习目标", "sections": [{"title": "学完后应该能回答的问题", "content": "- IaC 与普通代码的语义差别是什么？\n- 为什么语法正确和 `terraform plan` 成功仍不足？\n- 基础设施意图规约怎样评价生成代码？\n- 语义检查怎样发现跨属性和跨资源约束？\n- IaC Plan 中 create、update、replace 和 delete 风险如何不同？\n- CLI、SDK、IaC 与 ClickOps Agent 各有什么边界？\n- 基础设施 Agent 为什么需要短期凭据和策略层？\n- LLM 训练平台的性能问题为什么难以黑盒诊断？\n- 网络流怎样恢复训练作业、并行策略和时间线？", "subs": ["IaC 与普通代码的语义差别是什么？", "为什么语法正确和 terraform plan 成功仍不足？", "基础设施意图规约怎样评价生成代码？", "语义检查怎样发现跨属性和跨资源约束？", "IaC Plan 中 create、update、replace 和 delete", "CLI、SDK、IaC 与 ClickOps Agent 各有什么边界？"]}, {"title": "学完后应该具备的能力", "content": "- 审查生成 IaC 的语法、意图、安全和变更风险。\n- 为 IaC 构造机器可验证的意图条件。\n- 为只读盘点、Plan 生成和执行定义不同权限。\n- 识别训练减速的 GPU、网络、存储、调度和框架假设。\n- 把 Agent 放入现有 CI/CD 和平台 API，而不是绕过控制。", "subs": ["审查生成 IaC 的语法、意图、安全和变更风险", "为 IaC 构造机器可验证的意图条件", "为只读盘点、Plan 生成和执行定义不同权限", "识别训练减速的 GPU、网络、存储、调度和框架假设", "把 Agent 放入现有 CI/CD 和平台 API"]}]}, {"title": "落地之前的思考", "sections": [{"title": "先确认基础设施问题不是控制面问题", "content": "本章是工程性综合，讨论基础设施和 AI 平台引入 Agent 前的准备条件，不把少量论文外推成行业共识。\n\n基础设施团队经常把不同问题混在“需要一个云 Agent”里：\n\n- 资源盘点慢。\n- Terraform 模块难写。\n- Plan 难以审查。\n- 云 API 参数太多。\n- State 与远端资源不一致。\n- GPU、网络和存储问题难以定位。\n- 容量、成本和可靠性之间缺少共同视图。\n\n这些问题的第一解法可能是模块、策略、State 修复、服务目录、容量报表或更好的平台 API，而不是 LLM。\n\n先记录当前控制面：\n\n| 对象 | 需要确认的事实 | 常见缺口 |\n|---|---|---|\n| IaC | 模块、Provider、Plan 和 Apply 流程 | 直接 ClickOps 绕过审查 |\n| State | owner、备份、锁和恢复流程 | 只相信本地状态文件 |\n| 云资源 | 资源、标签、租户和生命周期 | 资源没有责任人 |\n| 权限 | 角色、短期身份和策略 | Agent 复用个人长效凭据 |\n| AI 平台 | 作业、GPU、网络、存储和调度指标 | 只有训练日志没有平台时间线 |\n| 成本 | 资源、模型、存储和网络成本归属 | 只看账单总额 |\n\n如果控制面本身不可审计，Agent 会把不一致和隐含权限变成更快的错误操作。", "subs": ["资源盘点慢", "Terraform 模块难写", "Plan 难以审查", "云 API 参数太多", "State 与远端资源不一致", "GPU、网络和存储问题难以定位"]}, {"title": "先定义基础设施意图和状态真相", "content": "IaC 生成的难点不是 HCL 或 YAML 能否通过语法检查，而是生成结果是否表达了真实意图。\n\n落地前应把意图写成可验证条件：\n\n- 资源类型和数量。\n- 网络边界和暴露范围。\n- 加密、备份和保留策略。\n- 可用区、容量和弹性要求。\n- 依赖关系和生命周期。\n- 成本上限和 owner 标签。\n- 允许替换、禁止删除的对象。\n\n一个 Plan 通过并不等于最终状态正确。\n\n基础设施系统可能存在部分成功、最终一致和漂移，因此要明确三种状态：\n\n```mermaid\ngraph LR\n    A[Declared intent] --> B[IaC state]\n    B --> C[Plan]\n    C --> D[Remote resources]\n    D --> E[Observed service and cost]\n    E --> F[Reconciliation]\n    F --> B\n    F --> A\n```\n\n状态真相应由多方对账，而不是由 Agent 的命令返回值决定。\n\n至少要能回答：\n\n- State 是否为最新版本。\n- 远端资源是否被 ClickOps 修改。\n- Apply 是否只完成了一部分。\n- 业务 SLI 是否真的恢复。\n- 成本和配额是否发生异常变化。", "subs": ["资源类型和数量", "网络边界和暴露范围", "加密、备份和保留策略", "可用区、容量和弹性要求", "依赖关系和生命周期", "成本上限和 owner 标签"]}, {"title": "判断 Agent 接口是否足够受控", "content": "基础设施 Agent 的工具模态各有边界：\n\n| 模态 | 适合任务 | 落地前要补的控制 |\n|---|---|---|\n| CLI | 单次查询、现有脚本复用 | 参数白名单、输出审计 |\n| SDK | 结构化资源读取和操作 | 资源范围、异常和速率限制 |\n| IaC | 可评审、可回滚的声明变更 | Plan、Policy、State 和 PR |\n| ClickOps | 临时人工操作 | 严格限制，不作为默认路径 |\n| 平台 API | 封装后的自助能力 | 业务约束、租约和审计 |\n\n工具接口越接近底层云 API，模型搜索空间越大，越难证明不会越界。\n\n更稳妥的做法是提供窄接口：\n\n- `list_resources` 只读并限制租户。\n- `generate_plan` 只写入分支或临时目录。\n- `validate_policy` 返回机器可读违规项。\n- `apply_plan` 必须携带 Plan Hash、审批号和租约。\n- `reconcile_state` 只负责比较，不直接修复。\n\n短期凭据应绑定动作和资源范围，执行结束立即失效。\n\n不能让 Agent 通过解释自然语言的方式取得更高权限。", "subs": ["list_resources 只读并限制租户", "generate_plan 只写入分支或临时目录", "validate_policy 返回机器可读违规项", "apply_plan 必须携带 Plan Hash、审批号和租约", "reconcile_state 只负责比较"]}, {"title": "检查 AI 平台是否有诊断所需的时间线", "content": "LLM 训练和推理平台的问题经常跨越多个层次：\n\n- 作业调度。\n- GPU 利用率和显存。\n- 节点健康。\n- 网络通信和 Collective。\n- 数据加载和存储。\n- Checkpoint 与模型分发。\n- 推理批处理、队列和 KV Cache。\n\n在接入诊断 Agent 前，先确认这些对象能否按同一时间线关联：\n\n| 关联键 | 连接的对象 |\n|---|---|\n| Job ID | 调度、训练日志和状态 |\n| Run ID | 实验、模型版本和指标 |\n| Node/GPU ID | 资源、错误和拓扑 |\n| Rank/Worker ID | 并行策略和通信 |\n| Checkpoint ID | 存储、恢复和数据完整性 |\n| Deployment ID | 推理版本、流量和回滚 |\n\n没有稳定关联键时，模型只能根据相似文本猜测原因。\n\n平台诊断还应保留正常基线：\n\n- 同类作业的吞吐和 step time。\n- 网络通信的延迟与重传。\n- GPU 空闲、降频和显存异常。\n- 数据读取和 Checkpoint 时间。\n- 调度等待与资源碎片。\n- 推理延迟、吞吐和错误预算。", "subs": ["作业调度", "GPU 利用率和显存", "节点健康", "网络通信和 Collective", "数据加载和存储", "Checkpoint 与模型分发"]}, {"title": "选择最小基础设施试点并设退出条件", "content": "第一阶段可以从只读和代码评审开始：\n\n1. 资源盘点和 owner 标签检查。\n2. IaC 草稿和意图规约生成。\n3. Plan 风险摘要。\n4. Policy 违规解释。\n5. 训练作业性能时间线摘要。\n6. 人工确认后的低风险资源建议。\n\n不要从跨租户写操作、State 自动修复或 GPU 集群自动调度开始。\n\n试点流程可以保持在既有控制面内：\n\n```text\n自然语言需求 → Agent 草稿 → IaC/Policy/Plan → 人工评审 → 现有流水线执行 → 对账\n```\n\n成功条件可以包括：\n\n- 生成 IaC 的意图检查和 Plan 风险识别优于简单基线。\n- Agent 无法访问未授权租户和资源。\n- 所有写操作都关联变更 ID、Plan Hash 和审批号。\n- Apply 后能对账 State、远端资源、业务 SLI 和成本。\n- AI 平台诊断能够定位到可执行的下一步只读查询。\n\n退出条件可以包括：\n\n- State 漂移无法可靠检测。\n- Policy 或 Provider 版本变化后无法回放。\n- 资源 owner 和成本归属不完整。\n- Agent 输出只能解释语法，不能解释意图和影响。\n- 训练平台的关键时间线无法关联。\n- 自动化收益不足以覆盖安全审查和维护成本。\n\n基础设施场景还要提前明确跨团队责任：\n\n- 平台团队维护模块、Provider 和自助 API。\n- IaC owner 负责意图、Plan 和 State。\n- SRE 负责运行指标、对账和恢复演练。\n- 安全团队负责身份、策略和越权测试。\n- 财务或平台运营负责成本归属和预算。\n\n没有 owner 的资源、模块和训练作业不能交给 Agent 托管。\n\n基础设施 Agent 的成熟标志不是能调用更多 API，而是能在状态不确定时停止，在意图不清时请求补充，在执行后主动对账，并始终留在现有工程控制面之内。", "subs": ["生成 IaC 的意图检查和 Plan 风险识别优于简单基线", "Agent 无法访问未授权租户和资源", "所有写操作都关联变更 ID、Plan Hash 和审批号", "Apply 后能对账 State、远端资源、业务 SLI 和成本", "AI 平台诊断能够定位到可执行的下一步只读查询", "State 漂移无法可靠检测"]}]}, {"title": "第一阶段：理解 IaC 语义与代码生成", "sections": [{"title": "IaC 不是配置文本", "content": "IaC 声明期望基础设施状态。\n\n它包含：\n\n- 资源类型。\n- 属性。\n- 资源引用。\n- 显式和隐式依赖。\n- 模块。\n- Provider 行为。\n- 状态文件。\n- 生命周期规则。\n- 输入和输出。\n\n一个字符差异可能导致资源替换或删除。", "subs": ["资源类型", "属性", "资源引用", "显式和隐式依赖", "模块", "Provider 行为"]}, {"title": "Terraform 基本对象", "content": "```hcl\nresource \"aws_s3_bucket\" \"logs\" {\n  bucket = var.bucket_name\n\n  lifecycle {\n    prevent_destroy = true\n  }\n}\n```\n\n这里同时包含资源类型、逻辑名、用户输入和生命周期约束。\n\n模型必须理解它们的部署语义，而不是只生成合法 HCL。", "subs": []}, {"title": "资源引用", "content": "```hcl\nresource \"aws_s3_bucket_versioning\" \"logs\" {\n  bucket = aws_s3_bucket.logs.id\n\n  versioning_configuration {\n    status = \"Enabled\"\n  }\n}\n```\n\n引用建立依赖。\n\n硬编码字符串可能绕过依赖图并引用错误资源。", "subs": []}, {"title": "State 的作用", "content": "Terraform State 映射代码对象和真实云资源。\n\nAgent 修改 IaC 前必须知道：\n\n- 当前 state 后端。\n- 锁是否可用。\n- 工作区。\n- 是否有漂移。\n- 是否存在 import 或 moved block。\n- 敏感值如何保护。\n\n不能把完整 state 直接发送到外部模型。", "subs": ["当前 state 后端", "锁是否可用", "工作区", "是否有漂移", "是否存在 import 或 moved block", "敏感值如何保护"]}, {"title": "Provider 语义", "content": "Provider 定义资源 Schema 和 API 行为。\n\n同一属性在不同版本中可能：\n\n- 默认值变化。\n- 从可选变成必填。\n- 触发资源替换。\n- 被废弃。\n- 改变枚举范围。\n\n生成代码必须绑定 Provider 版本。", "subs": ["默认值变化", "从可选变成必填", "触发资源替换", "被废弃", "改变枚举范围"]}, {"title": "IaC 生成任务", "content": "输入通常是自然语言意图。\n\n输出是一个或多个资源和约束。\n\n任务难点：\n\n- 云服务数量多。\n- 资源关系复杂。\n- 文档快速变化。\n- 安全默认值不总安全。\n- 用户需求常不完整。\n- 部署验证昂贵。", "subs": ["云服务数量多", "资源关系复杂", "文档快速变化", "安全默认值不总安全", "用户需求常不完整", "部署验证昂贵"]}, {"title": "IaC-Eval", "content": "IaC-Eval 包含 458 个人工整理场景，覆盖 AWS 服务和不同难度。\n\n每个场景包含：\n\n- 自然语言问题。\n- 基础设施意图规约。\n\n评估不直接部署资源。\n\n它采用两阶段：\n\n1. `terraform plan` 检查语法、Provider 要求并生成依赖图。\n2. OPA 用 Rego 意图规约检查依赖图是否满足用户需求。", "subs": ["自然语言问题", "基础设施意图规约"]}, {"title": "评估流程", "content": "```mermaid\ngraph LR\n    A[Natural language intent] --> B[LLM generated IaC]\n    B --> C[Terraform plan]\n    C -->|Fail| D[Incorrect]\n    C -->|Pass| E[Dependency graph]\n    E --> F[OPA intent checks]\n    F -->|Fail| D\n    F -->|Pass| G[Functionally correct in benchmark]\n```\n\n这是对 IaC-Eval 流程的简化表达。", "subs": []}, {"title": "为什么不直接部署", "content": "部署：\n\n- 需要真实云账号和权限。\n- 可能耗时数分钟到数小时。\n- 产生费用。\n- 有安全和配额风险。\n- 成功创建也不保证满足意图。\n\n编译期意图验证更适合大规模 benchmark。\n\n它仍不能替代真实环境验证。", "subs": ["需要真实云账号和权限", "可能耗时数分钟到数小时", "产生费用", "有安全和配额风险", "成功创建也不保证满足意图"]}, {"title": "基础设施意图规约", "content": "意图应拆成可判定条件：\n\n```rego\npackage intent\n\ndeny[msg] {\n  bucket := input.resources[_]\n  bucket.type == \"aws_s3_bucket\"\n  not bucket.encryption_enabled\n  msg := \"log bucket must enable encryption\"\n}\n```\n\n真实 IaC-Eval 规约以论文和仓库为准。", "subs": []}, {"title": "pass@k", "content": "若每题生成 $n$ 个程序，其中 $c$ 个正确，从中选择 $k$ 个至少一个正确的无偏估计常写为：\n\n$$\npass@k=1-\\frac{\\binom{n-c}{k}}{\\binom{n}{k}}\n$$\n\npass@1 最接近一次生成的成功率。", "subs": []}, {"title": "IaC-Eval 的关键结果", "content": "论文报告最佳模型 GPT-4 在 IaC-Eval 上 pass@1 为 19.36%。\n\n同一模型在 EvalPlus Python 基准上的结果显著更高。\n\n这说明通用代码能力不能直接外推到 IaC。", "subs": []}, {"title": "意图检查过滤假阳性", "content": "论文观察到，只做 Terraform 编译会把大量未满足用户意图的程序判为正确。\n\n加入意图规约后过滤了超过约一半编译阶段假阳性。\n\n语法合法不是基础设施正确。", "subs": []}, {"title": "文本相似度不够", "content": "BLEU 和 CodeBERTScore 比较生成文本与参考代码。\n\nIaC 可以有多个语义等价写法。\n\n也可能只差一个关键属性却产生完全不同结果。\n\n因此功能和意图验证优于文本相似。", "subs": []}, {"title": "LLM-as-a-Judge 的局限", "content": "IaC-Eval 中 LLM 裁判会把大量错误解判为正确。\n\n关键正确性不能只由另一个生成模型决定。\n\n更可靠的是：\n\n- 编译器。\n- Provider Schema。\n- OPA 策略。\n- 静态分析。\n- dry-run。\n- 沙箱或临时账号部署。", "subs": ["编译器", "Provider Schema", "OPA 策略", "静态分析", "dry-run", "沙箱或临时账号部署"]}, {"title": "增强策略", "content": "论文比较少样本、思维链、多轮编译反馈和 RAG。\n\n少样本与 CoT 改进并不稳定。\n\n多轮编译反馈对部分强模型有效。\n\nRAG 在论文实验中是平均改善最明显的策略。\n\n仍需防止检索旧 Provider 文档。", "subs": []}, {"title": "IaC 生成安全检查", "content": "- [ ] 版本固定。\n- [ ] 语法和 Schema 正确。\n- [ ] 用户意图满足。\n- [ ] 加密和访问策略符合要求。\n- [ ] 没有公开暴露。\n- [ ] 没有硬编码 Secret。\n- [ ] 删除和替换受保护。\n- [ ] 标签和成本约束满足。\n- [ ] Plan 可审查。", "subs": ["[ ] 版本固定", "[ ] 语法和 Schema 正确", "[ ] 用户意图满足", "[ ] 加密和访问策略符合要求", "[ ] 没有公开暴露", "[ ] 没有硬编码 Secret"]}, {"title": "本阶段小结", "content": "- IaC 表达资源、依赖、状态和生命周期。\n- IaC-Eval 用 Plan 与 OPA 意图检查评价功能正确性。\n- 编译通过、文本相似和 LLM 裁判都不足以确认正确。\n- 通用代码 benchmark 不能代表 IaC 能力。\n- RAG 需要版本化 Provider 文档。", "subs": ["IaC 表达资源、依赖、状态和生命周期", "IaC-Eval 用 Plan 与 OPA 意图检查评价功能正确性", "编译通过、文本相似和 LLM 裁判都不足以确认正确", "通用代码 benchmark 不能代表 IaC 能力", "RAG 需要版本化 Provider 文档"]}]}, {"title": "第二阶段：语义检查与变更风险", "sections": [{"title": "语法、类型与语义", "content": "| 层次 | 示例错误 |\n|---|---|\n| 语法 | HCL 括号错误 |\n| 类型 | 字符串传给数值字段 |\n| Provider Schema | 缺少必填属性 |\n| 资源内语义 | 属性组合不兼容 |\n| 跨资源语义 | 子网与资源区域冲突 |\n| 业务意图 | 缺少高可用副本 |\n| 安全策略 | 存储桶公开 |\n\n越往下越需要领域和组织知识。", "subs": []}, {"title": "通过 Plan 仍可能失败", "content": "Provider 只在部署 API 调用时检查部分条件。\n\n可能出现：\n\n- 标识符冲突。\n- 创建请求失败。\n- 异步轮询失败。\n- 资源已创建但 State 不一致。\n- 跨资源前置不满足。", "subs": ["标识符冲突", "创建请求失败", "异步轮询失败", "资源已创建但 State 不一致", "跨资源前置不满足"]}, {"title": "Unearthing Semantic Checks", "content": "该研究提出 Zodiac，自动挖掘和验证额外 IaC 语义检查。\n\n它针对 Terraform 编译后仍会在部署中失败的语义约束。\n\n方法学习主线：\n\n1. 从 IaC 语料和文档发现候选关系。\n2. 用统计信号过滤。\n3. 用 LLM 补充候选细节。\n4. 生成最小负例。\n5. 通过部署测试验证候选检查。", "subs": []}, {"title": "LLM 不是最终验证器", "content": "论文明确把 LLM 用于补全和辅助，而不是承担正确性关键验证。\n\n候选检查需要形式推理和部署测试。\n\n这是基础设施 LLM 系统的重要设计原则。", "subs": []}, {"title": "资源内约束", "content": "同一资源多个属性之间可能存在条件：\n\n```text\nif mode == private then public_ip must be false\n```\n\nSchema 可能只知道字段类型，不知道组合语义。", "subs": []}, {"title": "跨资源约束", "content": "例如：\n\n- 负载均衡器与目标组协议兼容。\n- 实例和子网位于兼容区域。\n- 磁盘类型支持目标实例。\n- 安全组规则允许必需流量。\n- 加密密钥区域与资源一致。", "subs": ["负载均衡器与目标组协议兼容", "实例和子网位于兼容区域", "磁盘类型支持目标实例", "安全组规则允许必需流量", "加密密钥区域与资源一致"]}, {"title": "隐式依赖", "content": "资源引用会生成显式依赖。\n\n但业务关系可能由字符串、标签或外部名称表达。\n\nAgent 应优先使用真实引用，避免依靠创建顺序。", "subs": []}, {"title": "默认值风险", "content": "省略属性可能采用 Provider 或云端默认值。\n\n默认值随版本、区域或账号策略变化。\n\n安全关键属性应显式声明。", "subs": []}, {"title": "开放世界限制", "content": "Zodiac 受开放世界假设限制。\n\n语料中未出现或模板无法表达的检查可能无法发现。\n\n部署失败也可能由未知检查造成，从而误归因于候选。\n\n自动挖掘不能宣称完整覆盖。", "subs": []}, {"title": "IaC 变更类型", "content": "#### Create\n\n新增资源。\n\n风险包括费用、配额、公开暴露和依赖错误。\n\n#### Update in place\n\n原地修改。\n\n可能造成短暂中断或重载。\n\n#### Replace\n\n销毁旧资源并创建新资源。\n\n可能丢失身份、IP、数据或连接。\n\n#### Delete\n\n删除资源。\n\n通常风险最高，需保护和审批。\n\n#### Read or refresh\n\n同步真实状态。\n\n可能暴露漂移，不应自动覆盖代码。", "subs": ["Create", "Update in place", "Replace", "Delete", "Read or refresh"]}, {"title": "Plan 审查", "content": "```text\nPlan: 2 to add, 1 to change, 1 to destroy\n```\n\n审查不能只看数量。\n\n必须看：\n\n- 被替换的资源类型。\n- 数据持久性。\n- 依赖者。\n- 生命周期规则。\n- 是否跨区域或租户。\n- 是否改变网络边界。\n- 是否增加成本。", "subs": ["被替换的资源类型", "数据持久性", "依赖者", "生命周期规则", "是否跨区域或租户", "是否改变网络边界"]}, {"title": "Plan 结构化风险", "content": "```yaml\nchange:\n  address: aws_db_instance.primary\n  action: replace\n  reasons: [engine_version_change]\n  data_class: persistent\n  dependents: 7\n  estimated_downtime: unknown\n  rollback: restore_snapshot\n  approval: two_person\n```", "subs": []}, {"title": "Drift", "content": "漂移表示真实资源与 IaC State 或代码不一致。\n\n原因包括：\n\n- ClickOps 手工变更。\n- 外部控制器。\n- 云端默认变化。\n- 紧急修复。\n- 失败的部分部署。\n\nAgent 应先报告漂移，再决定 import、修改代码或恢复资源。", "subs": ["ClickOps 手工变更", "外部控制器", "云端默认变化", "紧急修复", "失败的部分部署"]}, {"title": "Policy as Code", "content": "OPA、Sentinel 或组织策略可检查：\n\n- 允许区域。\n- 标签。\n- 加密。\n- 公开访问。\n- 资源规格。\n- 删除保护。\n- 成本预算。\n\n策略层应独立于生成模型。", "subs": ["允许区域", "标签", "加密", "公开访问", "资源规格", "删除保护"]}, {"title": "变更流水线", "content": "```mermaid\ngraph TD\n    A[Pull request] --> B[Format and validate]\n    B --> C[Semantic checks]\n    C --> D[Plan]\n    D --> E[Policy checks]\n    E --> F[Risk summary]\n    F --> G[Human approval]\n    G --> H[Staged apply]\n    H --> I[Verification]\n    I --> J[State and audit]\n```\n\nLLM 可以生成解释和风险摘要，但不能绕过任何确定性闸门。", "subs": []}, {"title": "本阶段小结", "content": "- 编译器只覆盖部分部署语义。\n- Zodiac 挖掘并通过部署测试验证额外检查。\n- LLM 可辅助候选生成，不能承担最终正确性验证。\n- Plan 的 replace 和 delete 需要特殊风险处理。\n- Drift、策略和 State 是 IaC 生产流程的一部分。", "subs": ["编译器只覆盖部分部署语义", "Zodiac 挖掘并通过部署测试验证额外检查", "LLM 可辅助候选生成", "Plan 的 replace 和 delete 需要特殊风险处理", "Drift、策略和 State 是 IaC 生产流程的一部分"]}]}, {"title": "第三阶段：基础设施 Agent", "sections": [{"title": "四种管理模态", "content": "Cloud Infrastructure Management in the Age of AI Agents 比较：\n\n- CLI。\n- SDK。\n- IaC。\n- ClickOps。\n\n它们为 Agent 提供不同交互表面。", "subs": ["CLI", "SDK", "IaC", "ClickOps"]}, {"title": "CLI Agent", "content": "优点：\n\n- 命令易发现。\n- 适合一次性查询。\n- 输出可记录。\n\n限制：\n\n- 参数复杂。\n- 多步骤状态管理困难。\n- 文本输出易变化。\n- shell 扩大注入风险。", "subs": ["命令易发现", "适合一次性查询", "输出可记录", "参数复杂", "多步骤状态管理困难", "文本输出易变化"]}, {"title": "SDK Agent", "content": "优点：\n\n- 类型化接口。\n- 适合复杂程序控制。\n- 错误结构较明确。\n\n限制：\n\n- API 面积巨大。\n- 需要分页、重试和幂等。\n- 云与版本差异明显。", "subs": ["类型化接口", "适合复杂程序控制", "错误结构较明确", "API 面积巨大", "需要分页、重试和幂等", "云与版本差异明显"]}, {"title": "IaC Agent", "content": "优点：\n\n- 声明式。\n- Plan 可审查。\n- State 支持更新。\n- 变更可进入 Git 流程。\n\n限制：\n\n- 上下文包含大量 State。\n- 语义正确性困难。\n- Apply 可能替换资源。\n- 紧急交互速度较慢。", "subs": ["声明式", "Plan 可审查", "State 支持更新", "变更可进入 Git 流程", "上下文包含大量 State", "语义正确性困难"]}, {"title": "ClickOps Agent", "content": "优点：\n\n- 能看到控制台当前状态。\n- 无需编写代码。\n\n限制：\n\n- 多步骤容易失败。\n- UI 变化脆弱。\n- 慢且难以审计。\n- 多云界面不同。\n\n论文初步案例观察到复杂任务会放大 ClickOps 错误。", "subs": ["能看到控制台当前状态", "无需编写代码", "多步骤容易失败", "UI 变化脆弱", "慢且难以审计", "多云界面不同"]}, {"title": "管理生命周期", "content": "基础设施 Agent 可能参与：\n\n- 设计。\n- 供应。\n- 更新。\n- 监控。\n- 诊断。\n- 修复。\n- 优化。\n- 退役。\n\n每阶段风险不同。", "subs": ["设计", "供应", "更新", "监控", "诊断", "修复"]}, {"title": "只读能力", "content": "Agent 可以读取：\n\n- 资源清单。\n- 当前配置。\n- 健康状态。\n- 监控和事件。\n- 账单和配额。\n- 策略与合规结果。\n- Plan 和变更历史。\n\n只读仍需租户和敏感字段隔离。", "subs": ["资源清单", "当前配置", "健康状态", "监控和事件", "账单和配额", "策略与合规结果"]}, {"title": "写能力", "content": "Agent 可以候选生成：\n\n- IaC patch。\n- 扩缩容计划。\n- 标签修订。\n- 网络规则变更。\n- 资源替换计划。\n- 退役计划。\n\n实际执行复用方向五闭环。", "subs": ["IaC patch", "扩缩容计划", "标签修订", "网络规则变更", "资源替换计划", "退役计划"]}, {"title": "受控访问模型", "content": "```mermaid\ngraph LR\n    U[User] --> A[Agent]\n    A --> P[Policy gateway]\n    P --> I[Short lived identity]\n    I --> C[Cloud API]\n    C --> S[State observation]\n    S --> V[Independent verifier]\n    V --> L[Audit log]\n```\n\n上图是编辑性综合。", "subs": []}, {"title": "Tool Gateway", "content": "工具网关负责：\n\n- 身份映射。\n- 参数 Schema。\n- 资源范围。\n- 速率限制。\n- dry-run。\n- 风险分类。\n- 审批校验。\n- 审计。\n\nLLM 不直接持有云密钥。", "subs": ["身份映射", "参数 Schema", "资源范围", "速率限制", "dry-run", "风险分类"]}, {"title": "最小权限分层", "content": "| 场景 | 权限 |\n|---|---|\n| 资源盘点 | list、get |\n| 成本分析 | billing read |\n| 生成 Plan | State read、无 Apply |\n| 执行低风险变更 | 特定资源动作 |\n| 删除或跨租户 | 默认禁止 |", "subs": []}, {"title": "短期身份", "content": "凭据应绑定：\n\n- 用户或服务身份。\n- 事件或变更单。\n- 精确环境。\n- 允许动作。\n- 到期时间。\n- 最大资源数。", "subs": ["用户或服务身份", "事件或变更单", "精确环境", "允许动作", "到期时间", "最大资源数"]}, {"title": "状态感知", "content": "论文观察到更新任务需要看到已有云状态。\n\nAgent 的上下文窗口无法容纳完整 State。\n\n解决方式：\n\n- 结构化查询。\n- 资源子图。\n- 按需工具。\n- 快照引用。\n- 差异摘要。\n\n不要把全量 State 复制进 Prompt。", "subs": ["结构化查询", "资源子图", "按需工具", "快照引用", "差异摘要"]}, {"title": "随机性与多步骤错误", "content": "Agent 行为具有随机性。\n\n每增加一步，都增加失败概率和状态分支。\n\n复杂任务应：\n\n- 先生成完整计划。\n- 由确定性执行器推进。\n- 每步验证。\n- 保存 checkpoint。\n- 有总步数限制。", "subs": ["先生成完整计划", "由确定性执行器推进", "每步验证", "保存 checkpoint", "有总步数限制"]}, {"title": "IaC 优先于 ClickOps 的场景", "content": "- 多资源供应。\n- 重复环境。\n- 需要审计和复现。\n- 复杂依赖。\n- 长期维护。\n\nClickOps 更适合人工探索或无法编程访问的极少场景。", "subs": ["多资源供应", "重复环境", "需要审计和复现", "复杂依赖", "长期维护"]}, {"title": "多云抽象风险", "content": "统一 Agent 接口可能隐藏云差异。\n\n相同“VM”在身份、磁盘、网络和抢占语义上不同。\n\n抽象层必须保留 Provider 特定约束。", "subs": []}, {"title": "成本优化 Agent", "content": "成本动作可能降低可靠性。\n\n删除闲置资源前要验证：\n\n- 是否由灾备使用。\n- 是否有外部依赖。\n- 是否在维护窗口临时空闲。\n- 数据保留要求。\n- 重建成本。", "subs": ["是否由灾备使用", "是否有外部依赖", "是否在维护窗口临时空闲", "数据保留要求", "重建成本"]}, {"title": "Agent 生产闸门", "content": "- [ ] 只读和写工具分离。\n- [ ] 身份短期且场景绑定。\n- [ ] 资源范围明确。\n- [ ] Plan 与策略独立检查。\n- [ ] 审批绑定计划 Hash。\n- [ ] Apply 幂等。\n- [ ] 分阶段发布。\n- [ ] 状态和业务验证。\n- [ ] 回滚或停止。\n- [ ] 审计不可变。", "subs": ["[ ] 只读和写工具分离", "[ ] 身份短期且场景绑定", "[ ] 资源范围明确", "[ ] Plan 与策略独立检查", "[ ] 审批绑定计划 Hash", "[ ] Apply 幂等"]}, {"title": "本阶段小结", "content": "- CLI、SDK、IaC 和 ClickOps 具有不同 Agent 适配性。\n- 多步骤管理任务会放大随机错误。\n- IaC 为复杂变更提供 Plan、State 和 Git 审计。\n- Tool Gateway 隔离模型和云凭据。\n- 基础设施写操作必须复用方向五闭环。", "subs": ["CLI、SDK、IaC 和 ClickOps 具有不同 Agent 适配性", "多步骤管理任务会放大随机错误", "IaC 为复杂变更提供 Plan、State 和 Git 审计", "Tool Gateway 隔离模型和云凭据", "基础设施写操作必须复用方向五闭环"]}]}, {"title": "第四阶段：AI 训练平台黑盒诊断", "sections": [{"title": "训练平台为何特殊", "content": "大规模 LLM 训练：\n\n- 使用数百到数万 GPU。\n- 运行时间长。\n- 同步通信密集。\n- 单个慢节点拖慢全局。\n- 多租户隐藏作业配置。\n- GPU 小时成本极高。\n\n性能下降即使不导致作业失败，也会浪费大量资源。", "subs": ["使用数百到数万 GPU", "运行时间长", "同步通信密集", "单个慢节点拖慢全局", "多租户隐藏作业配置", "GPU 小时成本极高"]}, {"title": "诊断层次", "content": "| 层次 | 候选问题 |\n|---|---|\n| Job | 数据、batch、checkpoint |\n| Framework | PyTorch、DeepSpeed 配置 |\n| Parallelism | DP、PP、TP 策略 |\n| GPU | 降频、错误、利用率 |\n| Node | CPU、内存、PCIe、NUMA |\n| Network | 拥塞、带宽、丢包 |\n| Storage | 数据和 checkpoint 吞吐 |\n| Scheduler | 放置、碎片、抢占 |", "subs": []}, {"title": "平台提供方的黑盒视角", "content": "租户可能不允许平台读取：\n\n- 模型结构。\n- 训练代码。\n- 数据。\n- 并行配置。\n- 框架内部指标。\n\n侵入式 profiler 还会增加开销和兼容性问题。", "subs": ["模型结构", "训练代码", "数据", "并行配置", "框架内部指标"]}, {"title": "LLMPrism", "content": "LLMPrism 使用底层网络流非侵入式诊断生产 LLM 训练平台。\n\n四个阶段：\n\n1. 识别训练作业。\n2. 识别并行策略。\n3. 重建每个 GPU rank 的训练时间线。\n4. 多维诊断性能退化。", "subs": []}, {"title": "诊断流程", "content": "```mermaid\ngraph LR\n    A[Network flows] --> B[Job identification]\n    B --> C[Parallel strategy inference]\n    C --> D[Rank timeline reconstruction]\n    D --> E[Cross step diagnosis]\n    D --> F[Cross group diagnosis]\n    D --> G[Switch level diagnosis]\n```\n\n这是对论文图 2 的简化表达。", "subs": []}, {"title": "作业识别", "content": "同一训练作业内的 GPU rank 会通信。\n\n空间通信图可以从数千 GPU 中聚类出作业。\n\n还需结合物理拓扑重建完整作业资源集合。", "subs": []}, {"title": "并行策略", "content": "常见策略：\n\n#### Data Parallelism\n\n多个 rank 处理不同数据分片并同步梯度。\n\n常见集合通信为 AllReduce。\n\n#### Pipeline Parallelism\n\n模型层被分到不同 stage，激活在 stage 间传递。\n\n通信模式更接近相邻流水阶段。\n\n#### Tensor Parallelism\n\n单层张量计算拆到多个 GPU。\n\n通信频繁且对网络敏感。\n\n实际作业可能组合多种策略。", "subs": ["Data Parallelism", "Pipeline Parallelism", "Tensor Parallelism"]}, {"title": "时间线重建", "content": "LLMPrism 使用通信的时间规律识别训练步骤边界。\n\nDP 通信结束可以标志步骤结束。\n\n通信间隔近似代表计算阶段。\n\n黑盒网络流由此转成每个 rank 的训练时间线。", "subs": []}, {"title": "变点检测", "content": "论文使用 BOCD 识别通信流间隔中的变化点。\n\n变点划分离散训练步骤。\n\n它依赖训练通信规律稳定这一观察。", "subs": []}, {"title": "跨步骤诊断", "content": "正常训练步骤时长相对稳定。\n\n某些步骤突然变长，可能表示：\n\n- 计算延迟。\n- 网络慢。\n- checkpoint。\n- 数据加载阻塞。\n- 节点抖动。\n\n需要结合其他维度区分。", "subs": ["计算延迟", "网络慢", "checkpoint", "数据加载阻塞", "节点抖动"]}, {"title": "跨组诊断", "content": "不同 DP 组在同一步骤的通信时长应接近。\n\n某个组显著慢，说明问题集中在其 rank、节点或网络路径。", "subs": []}, {"title": "交换机级诊断", "content": "按交换机聚合流可以识别：\n\n- 并发 DP 通信过多。\n- 平均带宽下降。\n- 局部网络拥塞。\n- 特定交换机瓶颈。", "subs": ["并发 DP 通信过多", "平均带宽下降", "局部网络拥塞", "特定交换机瓶颈"]}, {"title": "生产证据", "content": "论文报告 LLMPrism 自 2024 年 10 月部署在 Platform-X。\n\n其评估包括 2,880 GPU 集群和多个 1,024 GPU 作业。\n\n论文报告作业与并行策略识别、时间线重建误差和真实性能告警结果。\n\n这是本方向中最直接的生产部署证据。", "subs": []}, {"title": "0.3% 误差怎样理解", "content": "论文报告时间线重建误差低于 0.3%。\n\n它评价重建时间线与真值的接近程度。\n\n不能直接解释为根因诊断准确率 99.7%。\n\n时间线准确是后续诊断的基础能力。", "subs": []}, {"title": "隐私与可见性", "content": "网络流方法避免读取租户训练数据和代码。\n\n但网络元数据本身仍可能敏感。\n\n需要：\n\n- 租户隔离。\n- 保留期限。\n- 访问审计。\n- 聚合与脱敏。\n- 用途限制。", "subs": ["租户隔离", "保留期限", "访问审计", "聚合与脱敏", "用途限制"]}, {"title": "网络流的盲区", "content": "网络流难以直接确认：\n\n- GPU 内核低效。\n- 数据预处理慢。\n- 代码锁竞争。\n- checkpoint 逻辑错误。\n- 模型数值问题。\n\n它能定位性能阶段和网络候选，再引导租户或平台进一步查询。", "subs": ["GPU 内核低效", "数据预处理慢", "代码锁竞争", "checkpoint 逻辑错误", "模型数值问题"]}, {"title": "训练平台 Incident Context", "content": "```yaml\ntraining_incident:\n  job_id: job-1842\n  ranks: 1024\n  inferred_parallelism:\n    dp: 128\n    pp: 8\n  symptom:\n    step_time_increase: 34%\n  localization:\n    dp_group: 17\n    switches: [leaf-23, leaf-24]\n  evidence:\n    timeline_window: 10m\n    bandwidth_drop: \"140Gbps to 45Gbps\"\n  conclusion:\n    status: network_bottleneck_candidate\n    root_cause_confirmed: false\n```", "subs": []}, {"title": "从瓶颈到根因", "content": "“某交换机路径带宽下降”是强定位证据。\n\n真实原因可能是：\n\n- 拥塞配置。\n- 硬件故障。\n- 路由异常。\n- 并发作业放置。\n- 流量突发。\n\n还需网络工具和干预验证。", "subs": ["拥塞配置", "硬件故障", "路由异常", "并发作业放置", "流量突发"]}, {"title": "训练平台验证", "content": "候选优化或修复后检查：\n\n- step time。\n- 训练吞吐。\n- GPU 利用率。\n- 通信带宽。\n- checkpoint 时长。\n- loss 曲线连续性。\n- 作业是否保持正确。\n\n性能恢复不能破坏训练语义。", "subs": ["step time", "训练吞吐", "GPU 利用率", "通信带宽", "checkpoint 时长", "loss 曲线连续性"]}, {"title": "本阶段小结", "content": "- LLM 训练平台跨 GPU、节点、网络、存储和框架。\n- 多租户隐私让平台提供方处于黑盒视角。\n- LLMPrism 用网络流识别作业、并行策略并重建时间线。\n- 跨步骤、跨组和交换机分析支持性能定位。\n- 时间线重建准确率不等于根因准确率。", "subs": ["LLM 训练平台跨 GPU、节点、网络、存储和框架", "多租户隐私让平台提供方处于黑盒视角", "LLMPrism 用网络流识别作业、并行策略并重建时间线", "跨步骤、跨组和交换机分析支持性能定位", "时间线重建准确率不等于根因准确率"]}]}, {"title": "第五阶段：与现有工程实践结合", "sections": [{"title": "LLM 不绕过 CI/CD", "content": "LLM 适合：\n\n- 生成 IaC 草稿。\n- 解释 Plan。\n- 总结风险。\n- 推荐测试。\n- 解释策略失败。\n\n它不应绕过：\n\n- 代码评审。\n- 编译和静态检查。\n- OPA 策略。\n- 审批。\n- 分阶段 Apply。\n- 验证与审计。", "subs": ["生成 IaC 草稿", "解释 Plan", "总结风险", "推荐测试", "解释策略失败", "代码评审"]}, {"title": "Pull Request 工作流", "content": "```mermaid\nsequenceDiagram\n    participant U as Engineer\n    participant A as IaC assistant\n    participant C as CI\n    participant R as Reviewer\n    participant E as Executor\n    U->>A: Infrastructure intent\n    A->>U: IaC patch with assumptions\n    U->>C: Open pull request\n    C->>C: Validate semantic policy plan\n    C->>R: Risk summary and diff\n    R->>E: Approved plan hash\n    E->>E: Staged apply and verify\n```", "subs": []}, {"title": "SRE 集成", "content": "方向三提供：\n\n- 指标、日志和 Trace。\n- 异常检测。\n- 信号关联。\n\n方向四提供：\n\n- 候选根因。\n- 工具查询。\n- 传播与因果。\n\n方向五提供：\n\n- 审批。\n- 执行。\n- 验证。\n- 回滚。\n\n方向六提供基础设施对象和平台 API。", "subs": ["指标、日志和 Trace", "异常检测", "信号关联", "候选根因", "工具查询", "传播与因果"]}, {"title": "Platform Engineering", "content": "平台团队应提供“铺好的路”：\n\n- 标准模块。\n- 自助 API。\n- 策略和配额。\n- 安全默认值。\n- 可观测性。\n- 审计。\n- 生命周期管理。\n\nAgent 应通过这些受控入口工作。", "subs": ["标准模块", "自助 API", "策略和配额", "安全默认值", "可观测性", "审计"]}, {"title": "Golden Module", "content": "相比从零生成资源，优先选择审核过的模块：\n\n```hcl\nmodule \"service_database\" {\n  source  = \"registry.example/db/service\"\n  version = \"4.2.1\"\n\n  service_id = \"checkout\"\n  tier       = \"critical\"\n}\n```\n\n模块把组织策略编码成默认结构。", "subs": []}, {"title": "自助 API", "content": "平台可暴露：\n\n```json\n{\n  \"operation\": \"create_service_database\",\n  \"parameters\": {\n    \"service_id\": \"checkout\",\n    \"tier\": \"critical\",\n    \"region\": \"ap-southeast-1\"\n  }\n}\n```\n\n它比让 Agent 组合几十个底层云 API 更可靠。", "subs": []}, {"title": "变更和事件连接", "content": "每次 Apply 生成 `deployment_id`。\n\n可观测信号应携带或可关联该 ID。\n\n事件 Context 才能回答：\n\n- 哪次变更发生在异常前。\n- 哪些资源被替换。\n- 哪个 Plan 和审批生效。\n- 能否回滚。", "subs": ["哪次变更发生在异常前", "哪些资源被替换", "哪个 Plan 和审批生效", "能否回滚"]}, {"title": "成本、可靠性与安全三目标", "content": "基础设施优化不是单目标。\n\n降低成本可能减少冗余。\n\n提高可靠性可能增加资源。\n\n提高安全可能增加操作摩擦。\n\nAgent 应展示权衡，不能只优化一个数字。", "subs": []}, {"title": "组织职责", "content": "| 角色 | 职责 |\n|---|---|\n| 应用团队 | 声明需求与 SLO |\n| 平台团队 | 提供模块、API 和策略 |\n| SRE | 诊断与可靠性治理 |\n| 安全团队 | 权限和策略 |\n| 财务运营 | 成本约束 |\n| Agent | 生成候选、查询和解释 |\n\n责任不能因 Agent 出现而消失。", "subs": []}, {"title": "采用路径", "content": "#### 阶段一：只读\n\n资源盘点、Plan 解释和训练性能摘要。\n\n#### 阶段二：代码草稿\n\n生成 IaC PR，由现有 CI 验证。\n\n#### 阶段三：审批后执行\n\n绑定 Plan Hash 和短期身份。\n\n#### 阶段四：低风险有限自动化\n\n只覆盖长期验证、可逆场景。", "subs": ["阶段一：只读", "阶段二：代码草稿", "阶段三：审批后执行", "阶段四：低风险有限自动化"]}, {"title": "本阶段小结", "content": "- LLM 应进入现有工程控制，而不是替代它们。\n- Golden Module 和自助 API 缩小 Agent 搜索空间。\n- 变更 ID 连接 IaC 与可观测事件。\n- 基础设施优化同时考虑成本、可靠性和安全。\n- 采用路径应从只读开始逐步增加权限。", "subs": ["LLM 应进入现有工程控制", "Golden Module 和自助 API 缩小 Agent 搜索空间", "变更 ID 连接 IaC 与可观测事件", "基础设施优化同时考虑成本、可靠性和安全", "采用路径应从只读开始逐步增加权限"]}]}, {"title": "工程补充：状态恢复与 AI 平台运行边界", "sections": [{"title": "资料边界先行", "content": "本方向四篇主方向译文直接支持 IaC 生成评测、IaC 语义检查、基础设施 Agent 管理方式和生产 LLM 训练平台黑盒性能诊断。下面关于 Terraform 事务故障、GPU 调度、推理服务、容量、灾备和资源退役的内容，是面向生产闭环的工程性综合或待补资料地图，不作为四篇论文的直接实验结论。", "subs": []}, {"title": "Apply 不是一个原子事务", "content": "IaC Apply 可能在创建部分资源后失败。此时“命令失败”不等于“基础设施没有变化”。恢复流程先回答：\n\n- 哪些 API 请求已提交。\n- 哪些资源已创建但尚未写入 State。\n- 哪些资源仍在创建或最终一致传播中。\n- State 中记录的对象是否与远端身份一致。\n- 重试会继续、替换还是重复创建。\n\n```mermaid\nstateDiagram-v2\n    [*] --> Planned\n    Planned --> Applying\n    Applying --> Completed\n    Applying --> Partial: Error or interruption\n    Partial --> Reconciling\n    Reconciling --> Imported: Remote object exists\n    Reconciling --> Retrying: Operation is safe\n    Reconciling --> ManualReview: Identity is ambiguous\n    Imported --> Planned\n    Retrying --> Applying\n```\n\n上图是工程性综合。", "subs": ["哪些 API 请求已提交", "哪些资源已创建但尚未写入 State", "哪些资源仍在创建或最终一致传播中", "State 中记录的对象是否与远端身份一致", "重试会继续、替换还是重复创建"]}, {"title": "State 锁丢失与双写", "content": "State 锁用于阻止多个执行者同时写同一状态，但锁服务故障、租约过期或操作者强制解锁可能产生双写。处理原则：\n\n1. 停止新的 Apply，不立即再次强制解锁。\n2. 确认锁持有者进程和远端操作是否仍在运行。\n3. 备份 State 与版本历史，记录序列号和 lineage。\n4. 比较 State、Provider 远端对象和执行日志。\n5. 只在确认旧持有者不会继续写后恢复锁。\n6. 重新生成 Plan，禁止复用锁丢失前的旧 Plan。\n\nAgent 不应拥有无条件 `force-unlock` 权限。", "subs": []}, {"title": "State 恢复与资源导入", "content": "State 损坏或丢失时，恢复顺序通常是：优先使用后端版本恢复；验证 lineage 和资源身份；对真实存在但未记录的对象使用 import；最后重新 Plan 并逐项审查。\n\nImport 只把远端身份关联进 State，不会自动生成正确配置，也不会证明所有属性符合意图。恢复后 Plan 若显示大规模替换，应停止并检查 Provider Schema、默认值、敏感字段和对象 ID。", "subs": []}, {"title": "Provider 最终一致性与执行中断", "content": "云 API 返回成功后，资源可能尚不能被读取、关联或删除。Provider 的重试和超时若不匹配服务语义，会出现：\n\n- 创建成功但读取暂时 404。\n- 对象存在但标签或策略尚未传播。\n- 删除返回成功但名称仍被占用。\n- 超时后远端继续创建，重试产生重复对象。\n\n执行器应保存操作 ID 和客户端 token，使用资源唯一身份对账，并区分 `failed`、`unknown` 和 `eventually_consistent`。不能把所有超时都归为失败。", "subs": ["创建成功但读取暂时 404", "对象存在但标签或策略尚未传播", "删除返回成功但名称仍被占用", "超时后远端继续创建"]}, {"title": "重复创建和事后对账", "content": "事后对账清单：\n\n| 检查 | 目标 |\n|---|---|\n| State 资源地址与远端 ID | 找到未记录或错误关联对象 |\n| 名称、标签和创建时间 | 识别重复资源 |\n| Provider 操作 ID | 区分重试与独立请求 |\n| 账单与配额变化 | 发现未被业务使用的残留资源 |\n| 依赖资源引用 | 避免删除已被使用的“孤儿” |\n| 新 Plan | 验证系统是否重新收敛 |\n\n清理重复资源是潜在破坏性动作，必须由 owner 确认身份、流量和数据状态。", "subs": []}, {"title": "四类声明式工具的状态所有权", "content": "| 维度 | Terraform | CloudFormation | Pulumi | Kubernetes CRD 或 Operator |\n|---|---|---|---|---|\n| 状态所有权 | 外部 State 记录资源映射 | 云端 Stack 管理 | State 后端加语言程序 | API Server 期望状态与控制器协调 |\n| Plan 或预览 | `plan` 显式差异 | Change Set | `preview` | 常见为 diff 或 dry-run，不等同统一 Plan |\n| 漂移处理 | refresh 和 Plan 暴露差异 | Drift Detection 能力依资源而异 | refresh 与 preview | 控制器持续协调，人工改动可能被覆写 |\n| 回滚语义 | 通过反向配置再 Apply | Stack 级回滚但可能失败 | 更新历史与反向部署 | 回到旧 Spec 仍取决于控制器和外部副作用 |\n| Agent 接入风险 | State 锁、旧 Plan、Provider 副作用 | Stack 权限和回滚中间态 | 任意语言代码扩大执行面 | 持续 reconcile 可能与 Agent 竞争 |\n\nAgent 接入前必须确认谁拥有最终期望状态。若 Agent 直接用 CLI 修改由 Operator 管理的资源，控制器可能立即改回；若 Agent 改 Spec，则必须理解控制器的异步收敛和失败状态。", "subs": []}, {"title": "AI 平台覆盖边界", "content": "| 层 | 关键对象 | 主要信号 | 常见故障 |\n|---|---|---|---|\n| GPU | 卡、显存、互联、ECC、驱动 | 利用率、显存、温度、Xid | OOM、降频、坏卡、驱动异常 |\n| 网络 | NIC、交换机、RDMA、Collective | 吞吐、重传、拥塞、通信耗时 | 链路退化、热点、集合通信拖尾 |\n| 存储 | 对象存储、并行文件系统、本地盘 | IOPS、吞吐、元数据延迟、错误 | checkpoint 慢、读取抖动、容量满 |\n| 调度器 | 队列、配额、拓扑和优先级 | 等待、抢占、碎片、公平性 | 饥饿、gang 调度失败、资源碎片 |\n| 数据管线 | 数据集、shard、缓存、预处理 | 吞吐、空闲、失败样本、新鲜度 | 数据倾斜、坏 shard、供给不足 |\n| 训练框架 | rank、step、collective、checkpoint | step time、loss、通信占比 | straggler、hang、数值异常 |\n| 推理服务 | 模型副本、路由、批处理、缓存 | TTFT、TPOT、吞吐、拒绝、OOM | 冷启动、尾延迟、错误版本、过载 |\n\nLLMPrism 直接覆盖生产训练平台黑盒性能诊断的一部分；其余各层需要专门资料、平台文档和故障数据补充。", "subs": []}, {"title": "推理服务的模型加载与预热", "content": "模型发布不是容器启动成功即完成。就绪条件至少包含：权重和 tokenizer 版本一致、分片完整、GPU kernel 初始化、关键 shape 编译或缓存、代表性请求预热，以及输出契约检查。\n\n冷副本过早接流量会抬高 TTFT；预热又可能占用大量显存和 I/O。滚动发布要限制同时加载副本数，并保留旧版本容量直到新版本完成健康与质量验证。", "subs": []}, {"title": "KV Cache、批处理和显存碎片", "content": "KV Cache 占用随并发、上下文长度、生成长度和模型结构增长。连续批处理能提升吞吐，但长请求可能造成队头阻塞或挤压短请求。\n\n容量模型至少分解：\n\n```text\nGPU memory = model weights + runtime workspace + KV cache + fragmentation reserve\n```\n\n显存总量看似充足仍可能因碎片无法分配连续块。监控应同时看已分配、已保留、最大连续可用块、KV 驱逐、批大小和 OOM 类型。", "subs": []}, {"title": "路由、灰度与版本回滚", "content": "推理路由应考虑模型版本、adapter、上下文上限、硬件能力、租户配额和数据驻留。灰度时比较：\n\n- TTFT、TPOT、端到端 P50/P99。\n- 吞吐、排队、拒绝和超时。\n- OOM、重启、KV Cache 命中与驱逐。\n- 输出质量、安全和结构契约。\n- 单请求 Token、GPU 时间和成本。\n\n回滚不仅切回镜像，还要恢复权重、tokenizer、模板、adapter、路由规则、量化配置和兼容缓存。新版本生成的缓存若与旧版本不兼容，应隔离或失效。", "subs": ["TTFT、TPOT、端到端 P50/P99", "吞吐、排队、拒绝和超时", "OOM、重启、KV Cache 命中与驱逐", "输出质量、安全和结构契约", "单请求 Token、GPU 时间和成本"]}, {"title": "容量规划、配额与公平共享", "content": "平均 GPU 利用率不能直接代表可承载量。容量规划需要工作负载分布：输入与输出 Token、并发、SLO、模型组合、批处理效率、故障冗余和发布预留。\n\n多租户平台至少提供：\n\n- 硬配额防止单租户耗尽集群。\n- 保障配额为关键业务保留容量。\n- 借用与回收策略利用空闲资源。\n- 公平队列或优先级防止长请求饥饿其他租户。\n- 抢占前提、通知和可恢复性要求。\n\nAgent 的扩缩容建议必须受预算、配额和公平策略约束，不能只优化单个服务延迟。", "subs": ["硬配额防止单租户耗尽集群", "保障配额为关键业务保留容量", "借用与回收策略利用空闲资源", "公平队列或优先级防止长请求饥饿其他租户", "抢占前提、通知和可恢复性要求"]}, {"title": "灾备、RTO 与 RPO", "content": "训练和推理的恢复目标不同：\n\n- 训练 RPO 由 checkpoint 间隔、异步写入和数据可重放性决定。\n- 训练 RTO 包含重新分配 GPU、加载 checkpoint 和恢复数据游标。\n- 推理 RPO 常关注路由配置、adapter 或会话状态丢失。\n- 推理 RTO 包含权重分发、模型预热、DNS 或全局流量切换。\n\n灾备演练要验证权重、镜像、配置、密钥、数据和容量是否在备用区域真实可用，而不是只验证对象已复制。", "subs": ["训练 RPO 由 checkpoint 间隔、异步写入和数据可重放性决定", "训练 RTO 包含重新分配 GPU、加载 checkpoint 和恢复数据游标", "推理 RPO 常关注路由配置、adapter 或会话状态丢失", "推理 RTO 包含权重分发、模型预热、DNS 或全局流量切换"]}, {"title": "成本与资源退役", "content": "成本治理连接利用率、SLO 与生命周期：\n\n- 识别长时间空闲 GPU、过度预留和低批处理效率。\n- 把存储、网络、checkpoint 和模型分发纳入成本。\n- 区分可回收实验资源和必须保留的生产冗余。\n- 对过期模型、adapter、快照、镜像和缓存设置 owner 与保留期。\n\n退役流程先确认无流量、无训练引用、无回滚依赖和合规保留要求，再撤销路由、归档必要证据、删除副本并核对账单与配额。模型权重或数据删除还要传播到缓存和灾备副本。", "subs": ["识别长时间空闲 GPU、过度预留和低批处理效率", "把存储、网络、checkpoint 和模型分发纳入成本", "区分可回收实验资源和必须保留的生产冗余", "对过期模型、adapter、快照、镜像和缓存设置 owner 与保留期"]}, {"title": "待补资料地图", "content": "后续扩展应优先补充可核对资料：GPU 与 Collective 通信故障、调度公平性、推理服务 SLO、KV Cache 和批处理、跨区域模型分发、训练 checkpoint 恢复，以及 AI 平台成本与退役。补充前，本章对这些主题保持工程性综合标记，不引用不存在的生产数字。", "subs": []}]}, {"title": "论文阅读路线", "sections": [{"title": "第一步：IaC 生成评测", "content": "阅读 [IaC-Eval](https://proceedings.neurips.cc/paper_files/paper/2024/file/f26b29298ae8acd94bd7e839688e329b-Paper-Datasets_and_Benchmarks_Track.pdf)。\n\n重点记录：\n\n- 458 个场景。\n- 基础设施意图规约。\n- Plan 与 OPA 两阶段。\n- pass@1。\n- 文本指标与 LLM 裁判局限。\n- RAG、多轮和提示策略结果。", "subs": ["458 个场景", "基础设施意图规约", "Plan 与 OPA 两阶段", "pass@1", "文本指标与 LLM 裁判局限", "RAG、多轮和提示策略结果"]}, {"title": "第二步：语义护栏", "content": "阅读 [Unearthing Semantic Checks](https://dl.acm.org/doi/pdf/10.1145/3694715.3695974)。\n\n重点记录：\n\n- 编译后部署失败。\n- 候选检查挖掘。\n- 统计过滤。\n- 最小负例。\n- 部署验证。\n- 开放世界限制。", "subs": ["编译后部署失败", "候选检查挖掘", "统计过滤", "最小负例", "部署验证", "开放世界限制"]}, {"title": "第三步：基础设施 Agent", "content": "阅读 [Cloud Infrastructure Management in the Age of AI Agents](https://dl.acm.org/doi/pdf/10.1145/3759441.3759443)。\n\n重点比较 CLI、SDK、IaC 和 ClickOps。\n\n把论文初步案例与方向五自治清单结合阅读。", "subs": []}, {"title": "第四步：AI 平台诊断", "content": "阅读 [LLMPrism](https://www.zhihan-jiang.com/files/DSN25/LLMPrism.pdf)。\n\n重点理解空间通信、并行策略、时间模式和多维诊断。", "subs": []}, {"title": "四篇论文对比", "content": "| 论文 | 对象 | 任务 | 证据边界 |\n|---|---|---|---|\n| IaC-Eval | Terraform 程序 | 代码生成评测 | 编译期，不真实部署 |\n| Semantic Checks | Terraform 语义 | 检查挖掘与验证 | 原型与部署测试 |\n| Cloud Agents | 云资源生命周期 | Agent 管理模态 | 愿景与初步案例 |\n| LLMPrism | LLM 训练平台 | 黑盒性能诊断 | 生产部署与网络流 |", "subs": []}]}, {"title": "本方向总结", "sections": [{"title": "最值得记住的结论", "content": "1. IaC 正确性包含语法、Provider、语义、意图、安全和真实变更影响。\n2. IaC-Eval 说明通用代码能力不能直接外推到基础设施代码。\n3. LLM 可生成候选和补全检查，但最终验证应由编译器、策略和环境完成。\n4. CLI、SDK、IaC 和 ClickOps 适合不同管理任务，复杂多步任务会放大 Agent 随机错误。\n5. 基础设施 Agent 必须通过 Tool Gateway、短期身份、Plan 和审批工作。\n6. LLMPrism 展示网络流如何在黑盒训练平台中恢复作业结构和性能时间线。\n7. 四篇资料覆盖有限，不能据此宣称基础设施自治已经成熟。", "subs": []}, {"title": "推荐学习顺序", "content": "1. 先用 IaC-Eval 建立功能正确性标准。\n2. 再学习语义检查和 Plan 风险。\n3. 比较四种云管理模态。\n4. 复用方向五设计基础设施 Agent 权限。\n5. 最后学习 LLMPrism 的训练平台黑盒诊断。", "subs": []}]}, {"title": "来源索引", "sections": [{"title": "直接来源", "content": "以下链接统一采用仓库 `README.md` 中的公开原文地址；本方向的工程性扩展不额外伪造论文入口。\n\n- [IaC-Eval](https://proceedings.neurips.cc/paper_files/paper/2024/file/f26b29298ae8acd94bd7e839688e329b-Paper-Datasets_and_Benchmarks_Track.pdf)\n- [Cloud Infrastructure Management in the Age of AI Agents](https://dl.acm.org/doi/pdf/10.1145/3759441.3759443)\n- [Unearthing Semantic Checks for IaC](https://dl.acm.org/doi/pdf/10.1145/3694715.3695974)\n- [LLMPrism](https://www.zhihan-jiang.com/files/DSN25/LLMPrism.pdf)", "subs": ["IaC-Eval", "Cloud Infrastructure Management in the Age", "Unearthing Semantic Checks for IaC", "LLMPrism"]}, {"title": "跨方向来源", "content": "- [方向一](01-foundations-evaluation-trust-roadmap.html)：评测与可信性。\n- [方向二](02-ops-knowledge-and-collaboration-roadmap.html)：知识、RAG 和 Incident Context。\n- [方向三](03-observability-and-signals-roadmap.html)：可观测信号。\n- [方向四](04-diagnosis-and-rca-roadmap.html)：证据链和 RCA。\n- [方向五](05-remediation-and-autonomy-roadmap.html)：权限、审批、验证和回滚。", "subs": ["方向一：评测与可信性", "方向二：知识、RAG 和 Incident Context", "方向三：可观测信号", "方向四：证据链和 RCA", "方向五：权限、审批、验证和回滚"]}, {"title": "资料边界", "content": "IaC-Eval 的数据规模、pass@1 和评测流程，Zodiac 的语义检查路线，以及 LLMPrism 的部署观察来自对应译文。\n\n权限分层、Tool Gateway、Plan 风险结构、采用路径和部分示例是教学性综合。\n\nMermaid 图均标明或体现为简化流程，不冒充论文原图。\n\n本方向不从四篇资料推导广泛行业成熟度，也不把基础设施 Agent 愿景当作已经部署的生产自治证据。", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
