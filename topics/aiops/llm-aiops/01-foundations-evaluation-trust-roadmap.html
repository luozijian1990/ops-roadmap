<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

<header>
  <h1>方向一：基础范式、评测与可信性</h1>

    <h2 id="d-title"></h2>

      <button data-status="done">已学</button>

    <button class="close" id="d-close">×</button>

  <div class="edit-actions edit-only" id="edit-actions">
    <input class="edit-title" id="edit-title" type="text" aria-label="小节标题">
    <button class="save" id="save-section">保存</button>
    <button class="cancel" id="cancel-edit">取消</button>
    <span class="save-state" id="save-state"></span>
  </div>
  <div class="body" id="d-body"></div>

</aside>
<div class="diagram-backdrop" id="diagram-backdrop"></div>
<section class="diagram-modal" id="diagram-modal" role="dialog" aria-modal="true" aria-label="放大图表">
  <header>
    <strong>Mermaid 图表</strong>
    <div class="diagram-controls" aria-label="图表缩放">
      <button id="diagram-zoom-out" title="缩小">-</button>
      <span class="diagram-zoom" id="diagram-zoom">100%</span>
      <button id="diagram-zoom-in" title="放大">+</button>
    </div>
    <button class="diagram-close" id="diagram-close" title="关闭">×</button>
  </header>
  <div class="diagram-body" id="diagram-body">
    <div class="diagram-canvas" id="diagram-canvas">
      <div class="diagram-inner" id="diagram-inner"></div>
    </div>
  </div>
</section>

<script id="data" type="application/json">{"title": "方向一：基础范式、评测与可信性", "intro": "> 本方向是整个 LLM-AIOps 路线的入口。它先定义“运维任务是什么”和“效果如何判断”，再讨论模型是否值得被工程师信任。", "parts": [{"title": "📚 目录", "sections": [{"title": "阅读导航", "content": "- [方向定位](#方向定位)\n- [学习目标](#学习目标)\n- [落地之前的思考](#落地之前的思考)\n- [第一阶段：建立领域坐标](#第一阶段建立领域坐标)\n- [第二阶段：理解运维任务和数据](#第二阶段理解运维任务和数据)\n- [第三阶段：理解评测方法](#第三阶段理解评测方法)\n- [第四阶段：理解可信性](#第四阶段理解可信性)\n- [第五阶段：从实验到生产](#第五阶段从实验到生产)\n- [论文阅读路线](#论文阅读路线)\n- [本方向总结](#本方向总结)\n- [来源索引](#来源索引)", "subs": ["方向定位", "学习目标", "落地之前的思考", "第一阶段：建立领域坐标", "第二阶段：理解运维任务和数据", "第三阶段：理解评测方法"]}]}, {"title": "方向定位", "sections": [{"title": "这个方向研究什么", "content": "LLM-AIOps 关注的是如何用语言模型理解运维信息、组织诊断上下文、调用工具并协助事件处理。它并不意味着用一个模型替代监控、规则、统计检测或工程师判断。\n\n本方向包含四类基础问题：\n\n1. LLM-AIOps 与传统 AIOps、Copilot、Agent 和 Autonomous Operations 的关系。\n2. Incident Lifecycle 中的任务边界和数据输入。\n3. 领域问答、Agent 任务和生产事件的评测方式。\n4. 幻觉、置信度、证据链、安全和生产可用性。", "subs": []}, {"title": "为什么要先学习它", "content": "同一个“LLM 运维系统”可能只做日志摘要，也可能能调用查询工具并生成修复计划。如果不先拆开任务，容易把日志解析误读成 RCA，把方案推荐误读成自动修复，把实验室里的 Agent 误读成生产自治。", "subs": []}]}, {"title": "学习目标", "sections": [{"title": "学完后应该能回答的问题", "content": "- LLM 在 AIOps 中增加了哪些能力？\n- 一个系统是知识助手、诊断 Copilot、行动建议器还是自治 Agent？\n- 论文评价的是最终答案、诊断过程、工具调用还是实际恢复？\n- 为什么 BLEU、ROUGE 或单一准确率不足以评价运维系统？\n- 什么时候应该让 Agent 拒答或请求人工确认？\n- 如何把论文指标映射到 MTTD、MTTR、人工采纳率、误操作率和单次成本？", "subs": ["LLM 在 AIOps 中增加了哪些能力？", "一个系统是知识助手、诊断 Copilot、行动建议器还是自治 Agent？", "论文评价的是最终答案、诊断过程、工具调用还是实际恢复？", "为什么 BLEU、ROUGE 或单一准确率不足以评价运维系统？", "什么时候应该让 Agent 拒答或请求人工确认？", "如何把论文指标映射到 MTTD、MTTR、人工采纳率、误操作率和单次成本？"]}, {"title": "学完后应该具备的阅读能力", "content": "- 从论文的输入、输出和实验环境判断真实贡献。\n- 区分论文直接结论、跨论文综合和本路线图的编辑性解释。\n- 识别完整译文、仅摘要资料和原文待确认项。\n- 看到公式时能解释变量、假设和运维含义，而不是只记住名称。", "subs": ["从论文的输入、输出和实验环境判断真实贡献", "区分论文直接结论、跨论文综合和本路线图的编辑性解释", "识别完整译文、仅摘要资料和原文待确认项", "看到公式时能解释变量、假设和运维含义"]}]}, {"title": "落地之前的思考", "sections": [{"title": "先证明问题存在，而不是先选择模型", "content": "本章是面向真实项目的工程性综合，不是某一篇论文的直接结论。\n\n开始 LLM-AIOps 项目前，第一份材料不应是模型选型表，而应是当前工作流的事实记录。\n\n至少选取一类边界清楚的任务，记录：\n\n- 谁在什么事件阶段执行它。\n- 输入来自哪些系统。\n- 当前需要多少人工时间。\n- 哪些步骤最容易遗漏或返工。\n- 错误会造成什么后果。\n- 现有规则、脚本和平台能力为什么没有解决。\n\n例如“降低 MTTR”不是足够具体的问题。\n\n它可能实际指向完全不同的工作：\n\n| 表面目标 | 真实瓶颈 | 可能的优先方案 |\n|---|---|---|\n| 降低 MTTR | 值班人员找不到服务 owner | 改善服务目录与路由规则 |\n| 降低 MTTR | 告警重复且噪声高 | 告警治理与聚合 |\n| 降低 MTTR | 查询语句难写 | 查询模板或只读 Copilot |\n| 降低 MTTR | 证据分散在多个系统 | Incident Context 聚合 |\n| 降低 MTTR | Runbook 已过期 | 知识治理而不是换模型 |\n| 降低 MTTR | 修复动作执行慢 | 受控工作流自动化 |\n\n只有瓶颈包含非结构化理解、上下文组合、开放式解释或动态工具编排时，LLM 才可能提供独特价值。\n\n若问题可以被稳定规则、SQL、PromQL、状态机或固定工作流完整表达，应优先采用确定性方案。\n\n确定性方案通常更便宜、更容易测试，也更容易解释失败原因。\n\n可以先画出现状流程：\n\n```mermaid\ngraph LR\n    A[Incident trigger] --> B[Current human step]\n    B --> C[Information search]\n    C --> D[Decision]\n    D --> E[Action]\n    E --> F[Verification]\n    B --> G[Delay and rework]\n    C --> G\n    D --> H[Error exposure]\n```\n\n图中每一个延迟、返工和错误暴露点都应有真实案例支撑。\n\n不要因为团队拥有模型预算，就把所有流程问题重新命名为“智能化需求”。", "subs": ["谁在什么事件阶段执行它", "输入来自哪些系统", "当前需要多少人工时间", "哪些步骤最容易遗漏或返工", "错误会造成什么后果", "现有规则、脚本和平台能力为什么没有解决"]}, {"title": "把任务、决策和风险切成最小单元", "content": "“建设运维 Agent”不是可评测的任务定义。\n\n落地前应把系统拆成可观察的决策单元：\n\n1. 输入是什么。\n2. 输出是什么。\n3. 输出由谁使用。\n4. 是否调用工具。\n5. 是否改变环境。\n6. 错误能否被及时发现。\n7. 失败后能否恢复。\n\n同一个产品可以包含多个风险完全不同的单元：\n\n| 决策单元 | 示例输出 | 主要风险 |\n|---|---|---|\n| 信息提取 | 从工单抽取服务名和时间 | 字段遗漏 |\n| 摘要 | 生成事件时间线草稿 | 事实混入推测 |\n| 检索 | 返回相关 Runbook | 版本或权限错误 |\n| 查询建议 | 生成只读 PromQL | 查询成本和误导 |\n| 根因候选 | 给出多个解释 | 过早收敛 |\n| 行动计划 | 生成变更步骤 | 对象、顺序或前置条件错误 |\n| 自动执行 | 调用生产工具 | 扩大故障和不可逆损失 |\n\n评测、权限和审批应绑定决策单元，而不是绑定“产品名称”。\n\n一个系统可以允许模型自动完成字段提取，同时要求根因结论由工程师确认，并禁止模型直接执行写操作。\n\n落地范围越具体，越容易找到有效数据、建立基线和解释改进来源。\n\n任务边界还应包含明确的非目标。\n\n例如只读诊断试点可以写明：\n\n- 不生成唯一根因承诺。\n- 不调用写工具。\n- 不自动关闭事件。\n- 不覆盖安全事件。\n- 不在遥测缺失时继续推断。\n\n非目标不是保守声明，而是防止试点在评测前不断扩张。", "subs": ["不生成唯一根因承诺", "不调用写工具", "不自动关闭事件", "不覆盖安全事件", "不在遥测缺失时继续推断"]}, {"title": "先建立不用 LLM 的基线", "content": "没有现有流程基线，项目只能证明“系统能够运行”，不能证明“系统带来价值”。\n\n基线至少包括三组数据。\n\n#### 质量基线\n\n- 当前任务正确率或人工复核通过率。\n- 严重遗漏、误路由和错误建议的数量。\n- 不同服务、严重度和故障类型上的分层结果。\n- 工程师之间的一致性。\n\n#### 效率基线\n\n- 完成任务的中位时间与长尾时间。\n- 查询、切换系统和等待权限的次数。\n- 每个事件需要多少人参与。\n- 重复劳动和返工比例。\n\n#### 经营与风险基线\n\n- 当前工具和人工成本。\n- 错误结果造成的恢复时间或业务损失。\n- 审计、合规与数据暴露成本。\n- 因流程复杂而放弃执行的比例。\n\n评测设计应同时保留现有人工流程、确定性自动化和 LLM 方案：\n\n| 对照组 | 回答的问题 |\n|---|---|\n| 当前人工流程 | 新系统是否真的改善工作 |\n| 规则或模板 | LLM 是否带来不可替代的增量 |\n| 检索但不生成 | 改进来自知识召回还是语言生成 |\n| LLM 但不调用工具 | 工具编排是否真正增加价值 |\n| 完整候选系统 | 端到端收益能否覆盖风险和成本 |\n\n基线样本不能只选择系统擅长的成功案例。\n\n应包含常见事件、长尾事件、未知故障、数据缺失、权限拒绝和工具错误。\n\n如果专家本身无法对样本给出稳定标签，应先解决任务定义和标注分歧。\n\n模型不能替团队掩盖“什么算正确”尚未达成共识的问题。", "subs": ["质量基线", "效率基线", "经营与风险基线"]}, {"title": "检查数据、工具和组织是否准备好", "content": "模型准备好不等于组织准备好。\n\n落地前可以使用以下准备度矩阵：\n\n| 维度 | 最低前提 | 未满足时的结果 |\n|---|---|---|\n| 数据 | 可访问、可脱敏、有时间和对象标识 | 无法复现或泄漏敏感信息 |\n| 知识 | 有 owner、版本和有效期 | 检索放大过期做法 |\n| 工具 | 参数、权限、错误语义稳定 | Agent 无法区分空结果与失败 |\n| 评测 | 有代表性样本和人工裁决规则 | 分数无法解释 |\n| 安全 | 有信任边界和威胁模型 | Prompt 或工具权限失控 |\n| 运行 | 有日志、成本、延迟和版本记录 | 线上退化无法定位 |\n| 责任 | 有产品、SRE、安全和业务 owner | 错误无人接管 |\n\n尤其要提前确认责任链：\n\n- 谁批准数据进入模型上下文。\n- 谁维护 Prompt、检索器和工具 Schema。\n- 谁定义上线阈值。\n- 谁在输出有争议时裁决。\n- 谁可以停止服务或回退到人工流程。\n- 谁承担长期成本和知识维护。\n\n如果这些责任只能回答“由 AI 团队负责”，说明系统还没有进入真实业务流程。\n\nAI 团队可以维护模型，但不能替代服务 owner 对事实和风险负责。", "subs": ["谁批准数据进入模型上下文", "谁维护 Prompt、检索器和工具 Schema", "谁定义上线阈值", "谁在输出有争议时裁决", "谁可以停止服务或回退到人工流程", "谁承担长期成本和知识维护"]}, {"title": "用最小试点验证价值，并提前写退出条件", "content": "第一阶段不应追求端到端自治。\n\n更合适的试点通常具备以下特征：\n\n- 高频，能够在合理时间收集样本。\n- 低风险，错误不会直接改变生产状态。\n- 输入相对稳定，能获得历史回放。\n- 输出可以由专家快速复核。\n- 当前流程有明确痛点和基线。\n- 价值可以在任务层而不是宣传层衡量。\n\n推荐从影子模式开始：\n\n```mermaid\ngraph LR\n    A[Historical replay] --> B[Offline comparison]\n    B --> C[Shadow mode]\n    C --> D[Engineer review]\n    D --> E{Value and safety pass}\n    E -->|Yes| F[Limited workflow integration]\n    E -->|No| G[Revise or stop]\n```\n\n试点立项时同时写下成功条件和退出条件。\n\n成功条件可以包括：\n\n- 关键任务质量不低于人工或规则基线。\n- 中位处理时间有稳定改善。\n- 严重错误率低于事先约定阈值。\n- 工程师采纳率和信任理由可解释。\n- 单次成本和延迟满足预算。\n- 数据、权限和审计没有越界。\n\n退出条件可以包括：\n\n- 连续多个评测周期无法超过简单基线。\n- 收益主要来自数据清理，而非模型能力。\n- 长尾错误无法被人工及时发现。\n- 维护成本超过节省的人工成本。\n- 关键工具或知识没有稳定 owner。\n- 业务要求的可解释性无法满足。\n\n停止一个不合适的 LLM 项目不是失败。\n\n它说明团队通过低成本试点避免了把不确定系统带入生产。\n\n最终应形成一页决策记录：问题、基线、候选方案、选择理由、风险、试点范围、成功条件、退出条件和责任人。\n\n这页记录是后续阅读评测论文、比较模型和设置上线闸门的共同起点。", "subs": ["高频，能够在合理时间收集样本", "低风险，错误不会直接改变生产状态", "输入相对稳定", "输出可以由专家快速复核", "当前流程有明确痛点和基线", "价值可以在任务层而不是宣传层衡量"]}]}, {"title": "第一阶段：建立领域坐标", "sections": [{"title": "传统 AIOps 与 LLM-AIOps", "content": "传统 AIOps 通常围绕规则、统计模型、机器学习分类器和固定数据管道解决检测、聚合、预测或定位问题。LLM 的新增能力主要来自自然语言理解、跨来源摘要、开放式解释、交互式追问和工具编排。\n\n这些能力有明确代价：模型输出可能不稳定，长上下文和工具调用会增加时延与成本，模型可能生成没有证据支持的解释。因此，LLM 更适合被看作运维工作流中的一个推理和交互组件，而不是所有检测算法的替代品。\n\n**来源：** AIOps 综述；Incident Lifecycle 系统综述。", "subs": []}, {"title": "Incident Lifecycle", "content": "Incident Lifecycle 系统综述把事件处理放到生命周期中观察。路线图采用以下学习化表达：\n\n```text\nPrepare → Detect → Triage → Diagnose/Contain → Recover → Post-incident\n```\n\n- **Prepare**：准备监控、知识、值班和排障流程。\n- **Detect**：从指标、日志、Trace、告警或用户报告发现异常。\n- **Triage**：判断严重性、影响范围和负责团队。\n- **Diagnose/Contain**：收集证据、定位故障并先降低影响。\n- **Recover**：执行修复、验证恢复并在必要时回滚。\n- **Post-incident**：生成报告、复盘并更新知识。\n\n综述资料显示，已有研究更多集中在 Detect 和 Contain，Prepare 与 Post-incident 的自动化相对少。这是综述对其入选研究的统计，不应直接外推到整个行业。\n\n**来源：** [Incident Lifecycle 系统综述](https://arxiv.org/pdf/2410.04334)。", "subs": ["Prepare", "Detect", "Triage", "Diagnose/Contain", "Recover", "Post-incident：生成报告、复盘并更新知识"]}, {"title": "Copilot、Agent 与自治运维", "content": "可以把系统能力理解为一条连续谱：\n\n| 能力形态 | 主要输出 | 人工参与 |\n|---|---|---|\n| 知识助手 | 文档、历史案例和术语解释 | 全程人工判断 |\n| 诊断 Copilot | 摘要、候选原因和查询建议 | 工程师执行和确认 |\n| Tool-using Agent | 计划并调用只读工具收集证据 | 监督工具和结论 |\n| Action Recommendation | 生成缓解或修复方案 | 审核后执行 |\n| Guarded Automation | 在限定权限和场景中自动执行 | 处理例外和审批高风险动作 |\n| Limited Autonomy | 自动诊断、执行、验证和回滚 | 只覆盖有限、可逆场景 |\n\n“Autonomous”在论文中可能只是系统目标、实验环境名称或多 Agent 架构描述。判断实际自治等级时，应检查是否有真实工具、权限控制、动作验证、回滚和生产数据证据。\n\n**来源：** AIOpsLab、ITBench、Building AI Agents for Autonomous Clouds、STRATUS。", "subs": []}]}, {"title": "第二阶段：理解运维任务和数据", "sections": [{"title": "运维任务的基本分类", "content": "同一事件可以被拆成多个不同任务：\n\n| 任务 | 输入 | 输出 | 是否等于 RCA |\n|---|---|---|---|\n| Question Answering | 运维问题、文档或日志 | 解释或操作知识 | 否 |\n| Incident Reporting | 事件时间线和原始记录 | 摘要、报告或影响说明 | 否 |\n| Alert Aggregation | 多条告警和知识 | 事件分组 | 否 |\n| Triage | 告警、影响和历史信息 | 优先级、类别、责任路由 | 否 |\n| Anomaly Detection | 指标、日志或时间序列 | 异常标签或分数 | 否 |\n| Fault Localization | 观测信号和拓扑 | 异常组件或位置 | 部分相关 |\n| Root Cause Analysis | 多源证据和系统上下文 | 根因候选及解释 | 是 |\n| Mitigation/Remediation | 根因、SOP 和权限 | 方案、计划或动作结果 | 否 |\n\nOpsEval 将运维问题按任务和能力组织，而不是只用一个总分评价所有场景。这种拆分有助于理解为什么问答模型的高分不能直接推出 RCA 或自动修复能力。", "subs": []}, {"title": "运维数据和上下文", "content": "Incident Lifecycle 综述把 Logs、Metrics 和 Traces 视为常见观测数据，也记录了事件报告、代码和部署配置等额外来源。生产 GenAI 云服务事件研究进一步使用指标、日志、Trace 和值班讨论线程分析事件症状与根因。\n\n学习时可以按四层理解数据：\n\n1. **信号层**：Metrics、Logs、Traces、Events 和 Alerts。\n2. **事件层**：工单、时间线、影响范围、服务和版本。\n3. **知识层**：SOP、TSG、Runbook、历史案例和 Postmortem。\n4. **系统层**：拓扑、代码、配置、变更、数据库和网络状态。\n\nLLM 并不会自动补齐缺失上下文。上下文的时间范围、服务边界、版本和权限必须明确提供，否则模型可能把相似但不适用的历史事件当作当前事实。", "subs": []}, {"title": "数据私有性和生产事件偏差", "content": "Ops 数据经常包含企业内部架构、故障记录和凭证相关信息，公开数据集相对有限。OpsEval 通过多企业贡献、子领域分类、人工审核和部分公开的方式构建基准，但仍保留测试数据以降低泄漏风险。生产事件实证研究则提醒我们，生成式 AI 云服务的故障症状和根因分布具有领域特性。\n\n这意味着公开 benchmark 更适合比较方法和发现问题，不足以单独证明某个 Agent 在你的生产环境有效。", "subs": []}, {"title": "本阶段小结", "content": "- 先定义事件任务，再讨论模型能力。\n- 先说明数据和权限，再讨论自治等级。\n- 先确认评测环境，再比较论文数字。", "subs": ["先定义事件任务", "先说明数据和权限", "先确认评测环境"]}]}, {"title": "第三阶段：理解评测方法", "sections": [{"title": "领域问答评测", "content": "OpsEval 的核心观点是：BLEU 和 ROUGE 关注文本表面重合，无法充分判断运维答案是否覆盖关键操作、术语是否正确、证据是否充分。它将 QA 评价拆为流畅性（Fluency）、准确性（Accuracy）和证据（Evidence）三个维度。\n\n#### FAE-Score 的准确性公式\n\n译文给出的准确性是模型输出与标准答案关键词匹配的 F1：\n\n$$\n\\mathrm{Accuracy}=2\\cdot\\frac{P\\cdot R}{P+R}\n\\tag{1}\n$$\n\n其中：\n\n$$\nP=\\frac{\\\\#\\mathrm{Matched\\ Keywords}}{\\\\#\\mathrm{Keywords\\ in\\ Model\\ Output}}\n\\tag{2}\n$$\n\n$$\nR=\\frac{\\\\#\\mathrm{Matched\\ Keywords}}{\\\\#\\mathrm{Keywords\\ in\\ Ground\\ Truth}}\n\\tag{3}\n$$\n\n这里的 $P$ 表示模型回答中的关键词有多少被标准答案支持，$R$ 表示标准答案中的关键点有多少被覆盖。它比单纯比较词面更接近“关键运维知识是否被说出来”，但仍依赖关键词提取和评判模型，不能自动保证因果解释正确。\n\n#### FAE-Score 的证据公式\n\n证据分支通过相关文档检索和 ROUGE Recall 衡量回答与参考文档的重合：\n\n$$\n\\mathrm{Evidence}\n=\\frac{\\mathrm{overlap}(R,D)}{\\mathrm{words}(D)}\n\\tag{4}\n$$\n\n$R$ 是模型生成的回答，$D$ 是检索到的相关文档；$\\mathrm{overlap}(R,D)$ 是二者的重合词数，$\\mathrm{words}(D)$ 是文档总词数。这个比值对应 ROUGE Recall。它只能说明回答覆盖了参考文档中的多少内容，不能证明检索文档本身正确，也不能证明回答没有遗漏关键风险。\n\n#### 如何解读 FAE-Score\n\n译文报告的表 5b 中，FAE-Score 与专家总分的 Pearson 相关系数为 `0.91848`，高于 ROUGE、BLEU 和 RAGAS；摘要和贡献段落还出现 `0.9185`、`0.9175` 等不同写法。该数字存在原文记录差异，路线图只表达“FAE-Score 与专家评价高度相关”，不把某一个小数当作精确共识。", "subs": ["FAE-Score 的准确性公式", "FAE-Score 的证据公式", "如何解读 FAE"]}, {"title": "Agent 和系统级评测", "content": "AIOpsLab 和 ITBench 将评测从静态问答推进到更接近系统任务的环境：Agent 需要理解事件、选择工具、完成 IT 自动化任务，并由环境状态或任务结果反馈。阅读这类论文时要拆开四个层次：\n\n1. **任务定义**：故障、变更或自动化目标是否明确。\n2. **环境状态**：是公开数据、模拟系统还是真实生产快照。\n3. **行动权限**：Agent 能否只读、能否执行、执行范围是否受限。\n4. **验收条件**：只看文本答案，还是检查系统状态和业务结果。", "subs": []}, {"title": "过程指标和生产指标", "content": "论文常用准确率、Top-K、Recall、MRR、任务成功率或专家评分。生产环境还需要关心：\n\n| 生产问题 | 可对应的指标 |\n|---|---|\n| 多久发现事件 | MTTD |\n| 多久形成可用诊断 | MTTI、诊断时延 |\n| 多久恢复服务 | MTTR、业务 SLO 恢复时间 |\n| 建议是否被采用 | 建议采纳率、人工修改率 |\n| 动作是否安全 | 误操作率、回滚率、权限违规次数 |\n| 系统是否可运营 | 单次成本、调用次数、时延、失败率 |\n\n这些不是可以直接从论文分数换算出来的等价指标，而是上线评估时需要补充的观察面。", "subs": []}, {"title": "Benchmark 的常见陷阱", "content": "#### 数据泄漏\n\nOpsEval 使用测试集与改写参考集的损失差异进行泄漏检查：\n\n$$\n\\Delta L=L_{test}-L_{ref}\n$$\n\n译文说明 $\\Delta L<0$ 可能意味着测试数据泄漏。这个判断依赖参考集构造和阈值解释，使用时应结合数据生成过程，不应把公式当作普适检测器。\n\n#### 公开子集和隐藏测试集\n\nOpsEval 公开部分 QA 供初步评估，同时保留大部分测试数据以降低答案泄漏。路线图在引用结果时会标明公开程度和可复现边界。\n\n#### 评测环境与生产环境\n\n静态数据集不包含实时拓扑、数据缺失、权限、业务影响和工具失败；模拟环境可以补充交互，但仍不等于长期生产运行。", "subs": ["数据泄漏", "公开子集和隐藏测试集", "评测环境与生产环境"]}, {"title": "一个完整评测应该记录什么", "content": "评测一个运维 Agent 时，建议把一次任务记录成一条事件轨迹，而不是只保留最后一句答案：\n\n```mermaid\nsequenceDiagram\n    participant E as Incident Environment\n    participant A as LLM Agent\n    participant T as Read-only Tools\n    participant H as Human Reviewer\n    E->>A: 告警、时间线和任务目标\n    A->>A: 生成假设与下一步计划\n    A->>T: 查询日志、指标、Trace或配置\n    T-->>A: 观测结果、空结果或错误\n    A->>A: 更新证据和候选结论\n    A->>H: 结论、证据、置信度和缺失信息\n    H-->>E: 确认、修正或拒绝\n```\n\n每个步骤至少记录：\n\n| 记录项 | 为什么需要 |\n|---|---|\n| 输入上下文 | 判断模型是否一开始就缺少关键信息 |\n| 工具名称和参数 | 判断 Agent 是否选择了合理查询 |\n| 工具返回状态 | 区分没有异常和查询失败 |\n| 中间假设 | 发现过早收敛和忽略反证 |\n| 最终结论 | 评价任务目标是否完成 |\n| 证据引用 | 判断结论是否可核对 |\n| 置信度和拒答 | 判断是否适合交给人工或自动流程 |\n| 时延、Token 和费用 | 判断是否能在值班场景使用 |", "subs": []}, {"title": "为什么最终答案不够", "content": "两个 Agent 可能给出相同的根因：一个经过三次正确查询并排除了两个候选，另一个没有查询任何数据，只是生成了听起来合理的解释。只看最终文本会把两者视为同样成功，但生产风险完全不同。\n\n因此，过程评测至少要关注：\n\n- 查询是否覆盖关键数据源；\n- 查询顺序是否浪费时间或扩大权限；\n- 工具失败后是否停止并暴露不确定性；\n- 结论是否引用了真正相关的证据；\n- 人工是否能够复现和纠正推理。", "subs": ["查询是否覆盖关键数据源", "查询顺序是否浪费时间或扩大权限", "工具失败后是否停止并暴露不确定性", "结论是否引用了真正相关的证据", "人工是否能够复现和纠正推理"]}, {"title": "本阶段小结", "content": "研究指标是观察窗口，不是生产承诺。一个可用的评测需要同时看答案、过程、证据、风险、成本和业务结果。", "subs": []}]}, {"title": "第四阶段：理解可信性", "sections": [{"title": "幻觉、过度自信和缺失上下文", "content": "运维场景的错误回答可能表现为：编造不存在的命令参数、把历史事件套到当前服务、忽略反例、给出没有回滚的高风险动作，或者用很确定的语气掩盖证据不足。\n\n因此，可信输出至少应包含：\n\n- 当前结论或候选结论；\n- 支持结论的日志、指标、Trace、文档或工具结果；\n- 尚未验证的假设；\n- 缺失的信息；\n- 置信度或建议的人工复核等级；\n- 不满足条件时的拒答说明。", "subs": ["当前结论或候选结论", "支持结论的日志、指标、Trace、文档或工具结果", "尚未验证的假设", "缺失的信息；", "置信度或建议的人工复核等级", "不满足条件时的拒答说明"]}, {"title": "置信度校准", "content": "LM-PACE 将置信度理解为“预测正确的概率”，而不是模型表达得有多自信。把预测置信度为 $p$ 的样本集合记为 $B(p)$，理想校准要求：\n\n$$\n\\mathrm{acc}(B(p))=p,\\quad p\\in[0,1].\n\\tag{5}\n$$\n\n$\\mathrm{acc}(B(p))$ 是这组样本的实际正确率。直观上，所有置信度约为 $0.7$ 的样本，长期来看约有 70% 应该正确。\n\n实践中通常把概率区间分桶，并用 Expected Calibration Error（ECE）量化预测置信度与实际正确率的差异：\n\n$$\n\\mathrm{ECE}=\\sum_{m=1}^{M}\\frac{|B_m|}{n}\\left|\\mathrm{acc}(B_m)-\\mathrm{conf}(B_m)\\right|.\n\\tag{6}\n$$\n\n其中 $B_m$ 是第 $m$ 个置信度桶中的样本，$n$ 是总样本数，$\\mathrm{acc}(B_m)$ 是该桶的实际正确率，$\\mathrm{conf}(B_m)$ 是该桶的平均预测置信度。ECE 越小，通常表示校准越好；但分桶数量、样本量和任务定义都会影响结果。", "subs": []}, {"title": "黑盒模型下的置信度", "content": "LM-PACE 假设根因生成器是黑盒，只能看到事件描述和生成的根因文本，无法访问权重、logits 或 token 概率。它先检索相似历史事件，再让独立的 LLM 评估“当前证据是否足够”和“候选根因是否被历史证据支持”，最后组合评分并优化置信度。\n\n这条路线的启发是：当模型内部概率不可用时，可以构建外部评估器；但外部评估器本身仍然可能出错，历史案例也可能过时或与当前服务不匹配。", "subs": []}, {"title": "推理失败", "content": "RCA 推理失败研究关注模型停滞、偏置、困惑、过早收敛和忽略反证等现象。路线图将把“错误类型”和“改进手段”分开：Reflection、Memory、Prompt Optimization 或强化微调是手段，不是错误已经被解决的证据。", "subs": []}, {"title": "安全、隐私和成本", "content": "生产 Agent 还面临敏感日志、Prompt Injection、Telemetry Poisoning、Unsafe Tool Call、Permission Escalation、延迟和调用费用。这里只建立判断框架；具体执行和回滚设计放到方向五。", "subs": []}, {"title": "证据链的最小格式", "content": "一个面向工程师的诊断结论，可以采用下面的结构：\n\n```text\n结论：候选根因是 <组件/配置/变更>\n\n支持证据：\n1. <时间窗口内的指标或告警>\n2. <相关日志或 Trace>\n3. <变更、拓扑或历史案例>\n\n反证或未知：\n- <尚未查询的数据>\n- <与候选根因冲突的信号>\n\n置信度：<校准后的区间或等级>\n建议：<只读查询 / 人工确认 / 进入审批流程>\n拒答条件：<证据不足、数据过期或动作风险过高>\n```\n\n这不是论文统一采用的输出协议，而是结合 LM-PACE、OpsEval 和 RCA 推理失败研究整理出的编辑性模板。最终正文会明确它属于路线图的实践建议。", "subs": []}, {"title": "置信度的三种错误", "content": "#### 低置信度但正确\n\n模型给出保守分数并请求人工复核。对于高风险动作，这通常比自信执行更可接受，但会增加人工工作量。\n\n#### 高置信度且正确\n\n只有在长期评估中，置信度和实际正确率保持稳定对应，才可以把这种输出作为自动化入口。单个案例不能证明校准有效。\n\n#### 高置信度但错误\n\n这是最危险的情况。需要回溯输入上下文、检索结果、工具调用、推理步骤和评分器，而不是只调整 Prompt 语气。", "subs": ["低置信度但正确", "高置信度且正确", "高置信度但错误"]}, {"title": "本阶段小结", "content": "可信性不是一个单独的模型参数，而是数据、评测、解释、权限和人机协作共同产生的系统属性。", "subs": []}]}, {"title": "第五阶段：从实验到生产", "sections": [{"title": "四个生产距离问题", "content": "阅读任何论文时，先问：\n\n1. 数据是真实生产数据、脱敏数据、公开数据还是合成数据？\n2. 环境是静态问答、离线事件、模拟系统还是在线系统？\n3. Agent 是否调用真实工具，工具权限和失败处理是什么？\n4. 结果是否经过系统状态、业务 SLO 和长期运行验证？", "subs": []}, {"title": "可信运维 Agent 的最小条件", "content": "一个只读诊断 Agent 至少应能：\n\n- 说明它看到了哪些数据；\n- 引用支持结论的证据；\n- 区分事实、假设和建议；\n- 暴露缺失信息；\n- 在低置信度或高风险时拒答；\n- 记录工具调用和成本；\n- 由工程师确认后再进入执行流程。", "subs": ["说明它看到了哪些数据", "引用支持结论的证据", "区分事实、假设和建议", "暴露缺失信息", "在低置信度或高风险时拒答", "记录工具调用和成本"]}, {"title": "对运维工程师的启发", "content": "论文阅读不应停在“哪个模型分数更高”。更实用的问题是：这个系统减少了哪一步人工工作？是否降低了误报或 MTTR？工程师是否愿意采纳？当它错时，谁能发现并恢复？", "subs": []}, {"title": "从论文指标到上线闸门", "content": "可以用三道闸门把研究结果转成工程判断：\n\n| 闸门 | 需要回答的问题 | 不能直接接受的证据 |\n|---|---|---|\n| 数据闸门 | 数据是否代表目标服务、版本和故障分布？ | 只有公开通用数据集上的高分 |\n| 过程闸门 | Agent 是否提供证据、暴露缺失信息并正确使用工具？ | 只有最终答案文本 |\n| 动作闸门 | 建议是否可审核、可验证、可回滚且权限最小？ | 论文标题中的“Autonomous” |", "subs": []}, {"title": "一次只读诊断评估的示例", "content": "假设要评估一个只读 Agent 是否能定位 API 延迟升高：\n\n1. 输入包含告警时间、服务名、版本和影响范围。\n2. Agent 先查询延迟、错误率和请求量。\n3. 如果延迟异常但错误率正常，继续查询 Trace 和最近变更。\n4. 每个候选根因必须附带时间窗口和数据来源。\n5. 没有足够证据时输出“待确认”，而不是强行选择唯一根因。\n6. 评价项包括定位粒度、证据覆盖、查询数量、总时延和人工采纳率。\n\n这个例子不等于某篇论文的完整系统，而是把本方向的评测原则转成工程师可操作的检查流程。", "subs": []}]}, {"title": "深入专题：统计可靠性与持续回归治理", "sections": [{"title": "单次分数不是可靠结论", "content": "LLM、检索、Agent 工具轨迹和模拟环境都可能引入随机性。只报告一次运行的准确率，无法回答差异是否稳定、是否只来自抽样波动，也无法发现少数高风险服务上的退化。\n\n一份最低限度的实验报告应同时给出：\n\n- 数据集版本、划分方法和去重规则。\n- 模型、Prompt、解码参数、检索器、Embedding 与工具版本。\n- 每个随机源的种子；无法固定的外部 API 也要记录调用时间和版本标识。\n- 至少多次独立运行的均值、标准差和分位数。\n- 指标的置信区间，而不只给点估计。\n- 与基线配对比较的显著性检验和效果量。\n- 按任务、服务、严重度、已知或未知故障、权限条件分层的结果。\n- 对阈值、上下文长度、检索数量和工具预算的敏感性分析。\n\n这些要求是工程性综合，不表示本方向八篇论文都完整报告了全部项目。", "subs": ["数据集版本、划分方法和去重规则", "模型、Prompt、解码参数、检索器、Embedding 与工具版本", "每个随机源的种子", "至少多次独立运行的均值、标准差和分位数", "指标的置信区间", "与基线配对比较的显著性检验和效果量"]}, {"title": "置信区间、显著性与效果量回答不同问题", "content": "若某指标在 $n$ 个独立案例上得到样本均值 $\\bar{x}$ 和样本标准差 $s$，大样本下可用近似区间：\n\n$$\n\\bar{x}\\pm z_{1-\\alpha/2}\\frac{s}{\\sqrt{n}}\n$$\n\n小样本、比例指标、Top-K、长尾时延或同一事件多次运行时，优先使用与采样结构匹配的 bootstrap 或配对 bootstrap。不能把同一事件的多次随机运行伪装成更多独立事件。\n\n| 工具 | 回答的问题 | 常见误用 |\n|---|---|---|\n| 置信区间 | 真值可能落在多宽范围 | 把窄区间当成无偏证据 |\n| 显著性检验 | 差异是否难以用零假设解释 | 把 `p < 0.05` 当成生产价值 |\n| 效果量 | 差异有多大 | 只报告方向不报告大小 |\n| 分层结果 | 哪些子群改善或退化 | 只看总体平均掩盖高风险尾部 |\n| 敏感性分析 | 结论对参数和假设是否稳健 | 只展示最优阈值 |\n\n生产判断还要给出最小有意义差异。例如准确率提高 0.5 个百分点若换来两倍时延和三倍成本，未必值得上线。", "subs": []}, {"title": "多次运行与随机种子", "content": "固定种子用于复现，不用于隐藏波动。推荐区分三层重复：\n\n1. 同一版本、同一数据、不同种子，测模型与 Agent 随机性。\n2. 不同时间重复调用托管模型，测服务端不可见变化。\n3. 不同事件时间窗回放，测生产分布变化。\n\n报告均值时同时保留最差运行、失败类型和高风险样本。Agent 若某次成功、某次调用越权工具，平均任务完成率不能覆盖该安全失败。", "subs": []}, {"title": "分层与敏感性分析", "content": "至少按以下维度切片：\n\n| 维度 | 要发现的风险 |\n|---|---|\n| 已知与未知故障 | 历史案例记忆是否冒充泛化 |\n| 低风险与高风险动作 | 总体成功率是否掩盖危险错误 |\n| 服务与团队 | 少数长尾服务是否持续失败 |\n| 数据完整与缺失 | 系统是否会在证据不足时拒答 |\n| 工具正常与失败 | Agent 是否把失败当空结果 |\n| 短上下文与长上下文 | 关键证据是否被截断或淹没 |\n\n敏感性分析应改变一个关键假设并观察结果曲线，如 `top_k`、相似度阈值、告警窗口、最大工具轮数和置信度闸门。只在开发集搜索最优值后报告该点，会高估稳定性。", "subs": []}, {"title": "版本变化后的回归矩阵", "content": "LLM-AIOps 系统的变更面不止模型：\n\n| 变更对象 | 典型回归 | 必测内容 |\n|---|---|---|\n| 模型 | 推理、拒答、格式和工具选择变化 | Golden Set、轨迹与安全用例 |\n| Prompt | 指令优先级或字段遗漏 | 结构契约、反证和边界条件 |\n| 数据集 | 分布、标签或泄漏变化 | 去重、切片与历史可比性 |\n| Embedding | 召回集合变化 | 关键证据召回与跨租户隔离 |\n| 检索器或重排器 | 引用漂移、零结果变化 | Recall@K、引用支持和权限过滤 |\n| 工具 | 参数或返回 Schema 变化 | 契约、错误状态、幂等与权限 |\n\n任何一项变化都应产生新的系统版本指纹，不能只记录模型名。", "subs": []}, {"title": "离线回放、影子评估、灰度和回滚", "content": "```mermaid\ngraph LR\n    A[Versioned change] --> B[Static and replay tests]\n    B --> C{Offline gates pass}\n    C -->|No| D[Reject release]\n    C -->|Yes| E[Shadow evaluation]\n    E --> F{Quality and safety stable}\n    F -->|No| G[Rollback candidate]\n    F -->|Yes| H[Canary rollout]\n    H --> I[Monitor slices and incidents]\n    I --> J{Threshold breached}\n    J -->|Yes| K[Rollback and quarantine]\n    J -->|No| L[Expand rollout]\n    K --> M[Failure sample review]\n    M --> A\n```\n\n上图是编辑性工程综合。\n\n- 离线回放使用冻结事件快照，比较答案、证据、轨迹、拒答、时延和成本。\n- 影子评估接收真实流量但不影响工程师决策或生产状态。\n- 灰度按团队、服务和风险分层，避免只挑最容易的流量。\n- 阈值包括质量下限、安全事件零容忍项、成本上限和人工升级率区间。\n- 回滚必须覆盖模型、Prompt、索引、检索器和工具契约的兼容组合。\n- 失败样本先审查标签、权限和隐私，再进入 Golden Set；不能把未经确认的模型答案当真值。", "subs": ["离线回放使用冻结事件快照", "影子评估接收真实流量但不影响工程师决策或生产状态", "灰度按团队、服务和风险分层", "阈值包括质量下限、安全事件零容忍项、成本上限和人工升级率区间", "回滚必须覆盖模型、Prompt、索引、检索器和工具契约的兼容组合", "失败样本先审查标签、权限和隐私"]}, {"title": "Threat Model 从资产和信任边界开始", "content": "安全审查先定义需要保护的资产：生产状态、凭据、客户数据、内部拓扑、Runbook、模型与 Prompt、评测集、审计日志和发布闸门。\n\n潜在攻击者包括外部用户、低权限内部账号、被攻陷的遥测源或知识源、恶意依赖，以及无恶意但配置错误的自动化组件。\n\n```mermaid\ngraph LR\n    U[Untrusted telemetry and text] --> G[Input gateway]\n    G --> R[Retriever]\n    R --> M[Model planner]\n    M --> T[Tool gateway]\n    T --> P[Production systems]\n    M --> A[Audit stream]\n    H[Human approver] --> T\n```\n\n信任边界位于不可信输入与摄取网关、租户索引与检索器、模型与工具网关、审批人与执行身份、运行系统与审计存储之间。每次跨边界都要验证身份、权限、数据标签、Schema 与完整性。", "subs": []}, {"title": "八类必须进入测试集的威胁", "content": "| 威胁 | 攻击路径 | 最低控制与测试 |\n|---|---|---|\n| Prompt Injection | 日志、工单、网页或文档夹带指令 | 数据与指令分离、来源标签、恶意语料回放 |\n| 知识污染 | 错误 Runbook 或历史总结进入索引 | owner 审批、版本和撤回、冲突检测 |\n| 越权调用 | Agent 选择超出任务的工具或参数 | 最小权限、策略网关、拒绝用例 |\n| 数据泄漏 | 回答、引用、缓存或 Trace 暴露敏感信息 | chunk ACL、脱敏、租户隔离测试 |\n| 评测泄漏 | 测试样本进入训练、Prompt 或检索库 | 数据谱系、时间切分、近重复检测 |\n| 审计篡改 | 调用者修改或删除失败轨迹 | 追加写、独立存储、完整性校验 |\n| Telemetry Poisoning | 伪造指标、日志或 Trace 引导诊断 | 多源交叉验证、来源信誉、异常摄取告警 |\n| 供应链替换 | 模型、Embedding、依赖或工具镜像变化 | 签名、物料清单、版本固定和回归 |\n\nThreat Model 的输出不是“系统安全”，而是一组可复验的攻击路径、控制、残余风险和 owner。", "subs": []}, {"title": "八篇主方向论文统一对照", "content": "下表只概括本路线图使用这些译文时的学习位置。“生产证据”描述资料类型，不把实验环境推断成长期生产部署。\n\n| 论文 | 任务与数据 | 工具或环境 | 主要指标视角 | 生产证据与可复现线索 | 主要局限 |\n|---|---|---|---|---|---|\n| [AIOps 综述](https://arxiv.org/pdf/2406.11213) | 故障管理研究综述 | 文献集合 | 分类与覆盖 | 研究地图和引用链 | 不是单一系统实验 |\n| [Incident Lifecycle 综述](https://arxiv.org/pdf/2410.04334) | 微服务事件生命周期文献 | 系统性检索流程 | 阶段和数据源分布 | 纳入标准与论文索引 | 统计受检索范围限制 |\n| [AIOpsLab](https://arxiv.org/pdf/2501.06706) | 自治云 Agent 任务 | 可交互云环境和工具 | 任务结果与轨迹 | 环境化评测框架 | 与具体生产权限仍有距离 |\n| [ITBench](https://arxiv.org/pdf/2502.05352) | 多类真实 IT 自动化任务 | Benchmark 环境 | 任务成功和 Agent 行为 | 任务与评测框架 | 任务覆盖不等于目标组织分布 |\n| [生成式 AI 云事件实证](https://yinfangchen.github.io/assets/pdf/empirical_study.pdf) | 生产事件症状与根因 | 事件资料分析 | 分类分布与观察 | 真实事件研究 | 不是 Agent 能力评测 |\n| [网络事件管理全景视图](https://www.microsoft.com/en-us/research/uploads/prod/2023/09/LLM4IcMs___HotNets__23-6.pdf) | 网络事件管理全链路 | 概念与研究综合 | 生命周期能力 | 结构化研究视角 | 不能替代具体部署证据 |\n| [自治云 Agent 设计原则](https://arxiv.org/pdf/2407.12165) | 自治云 Agent 挑战 | Agent 架构讨论 | 能力和风险维度 | 设计原则与问题清单 | 原则不等于已验证控制 |\n| [OpsEval](https://arxiv.org/pdf/2310.07637.pdf) | IT 运维领域问答 | 领域数据与自动评价 | FAE 等问答指标 | 数据构建与评测流程 | QA 分数不能外推到 RCA 和执行 |", "subs": []}]}, {"title": "论文阅读路线", "sections": [{"title": "入门论文", "content": "- [AIOps 综述](https://arxiv.org/pdf/2406.11213)\n- [Incident Lifecycle 系统综述](https://arxiv.org/pdf/2410.04334)\n- [OpsEval](https://arxiv.org/pdf/2310.07637.pdf)", "subs": ["AIOps 综述", "Incident Lifecycle 系统综述", "OpsEval"]}, {"title": "进阶论文", "content": "- [OWL](https://openreview.net/pdf?id=SZOQ9RKYJu)\n- [NetOps 能力实证](https://arxiv.org/pdf/2309.05557.pdf)\n- [AIOpsLab](https://arxiv.org/pdf/2501.06706)\n- [ITBench](https://arxiv.org/pdf/2502.05352)", "subs": ["OWL", "NetOps 能力实证", "AIOpsLab", "ITBench"]}, {"title": "深入论文", "content": "- [生成式 AI 云服务生产事件实证](https://yinfangchen.github.io/assets/pdf/empirical_study.pdf)\n- [LM-PACE 置信度估计](https://arxiv.org/pdf/2309.05833.pdf)\n- [RCA 推理失败](https://arxiv.org/abs/2601.22208)\n- [低幻觉事件响应规划](https://www.ndss-symposium.org/ndss-paper/incident-response-planning-using-a-lightweight-large-language-model-with-reduced-hallucination/)", "subs": ["生成式 AI 云服务生产事件实证", "LM-PACE 置信度估计", "RCA 推理失败", "低幻觉事件响应规划"]}, {"title": "延伸阅读", "content": "- [AI 驱动的网络事件管理全景视图](https://www.microsoft.com/en-us/research/uploads/prod/2023/09/LLM4IcMs___HotNets__23-6.pdf)\n- [自治云 Agent 的挑战与设计原则](https://arxiv.org/pdf/2407.12165)", "subs": ["AI 驱动的网络事件管理全景视图", "自治云 Agent 的挑战与设计原则"]}]}, {"title": "公式和图表索引", "sections": [{"title": "本方向保留的公式", "content": "| 公式 | 用途 | 来源 |\n|---|---|---|\n| FAE Accuracy、Precision、Recall | 解释运维 QA 的关键点覆盖 | OpsEval，原 PDF 第 5 页 |\n| FAE Evidence | 解释回答与参考文档的证据重合 | OpsEval，原 PDF 第 5 页 |\n| `ΔL = L_test - L_ref` | 说明 benchmark 泄漏检查思路 | OpsEval，原 PDF 第 8–9 页 |\n| 置信度校准定义 | 解释置信度与实际正确率的关系 | LM-PACE，原 PDF 第 5–6 页 |\n| ECE | 量化置信度校准误差 | LM-PACE，原 PDF 第 6 页 |", "subs": []}, {"title": "本方向保留的图表", "content": "- Incident Lifecycle 的阶段与数据源统计：用于建立领域坐标。\n- OpsEval 数据构建、评测和 FAE-Score 流水线：用于理解领域基准。\n- AIOpsLab/ITBench 的 Agent、工具、环境和反馈流程：用于理解系统级评测。\n- LM-PACE 的黑盒预测器、历史检索和置信度估计流程：用于理解可信性。\n\n图表转为 Mermaid 或简化流程时，会标明“原论文图的改写”，不会让编辑性示意图看起来像原论文实验结果。", "subs": ["Incident Lifecycle 的阶段与数据源统计", "OpsEval 数据构建、评测和 FAE", "AIOpsLab/ITBench 的 Agent、工具、环境和反馈流程", "LM-PACE 的黑盒预测器、历史检索和置信度估计流程：用于理解可信性"]}]}, {"title": "本方向总结", "sections": [{"title": "最值得记住的结论", "content": "1. LLM-AIOps 的核心增量是跨文本、观测数据和工具的上下文组织能力。\n2. 任务定义决定评测指标；问答分数不能直接代表 RCA 或自动修复能力。\n3. 运维 QA 需要关注关键事实、证据和术语，而不只是表面文本相似度。\n4. 置信度必须与实际正确率对应，流畅语气不能代替校准。\n5. 生产可信性还需要权限控制、动作验证、回滚和长期运行证据。\n6. 论文中的 Autonomous 通常是设计目标或实验设定，不等于生产闭环自治。", "subs": []}, {"title": "本方向的学习顺序", "content": "```mermaid\ngraph LR\n    A[传统 AIOps 与 Incident Lifecycle] --> B[运维任务与数据]\n    B --> C[领域问答与 Agent 评测]\n    C --> D[过程、证据与生产指标]\n    D --> E[置信度、拒答与安全]\n    E --> F[阅读日志、RCA、自治和基础设施论文]\n```", "subs": []}, {"title": "继续学习前的检查清单", "content": "- [ ] 能区分检测、分诊、定位、RCA、缓解和修复。\n- [ ] 能说出 Logs、Metrics、Traces、Tickets 和 Runbook 的差异。\n- [ ] 能解释为什么 BLEU/ROUGE 不能单独评价 Ops QA。\n- [ ] 能解释 FAE Accuracy 和 Evidence 的变量。\n- [ ] 能解释 ECE 的含义和局限。\n- [ ] 能识别数据泄漏、上下文缺失和工具失败。\n- [ ] 能写出一条带证据、反证和拒答条件的诊断结论。\n- [ ] 能区分 benchmark 成绩和生产收益。", "subs": ["[ ] 能区分检测、分诊、定位、RCA、缓解和修复", "[ ] 能说出 Logs、Metrics、Traces、Tickets 和 Runb", "[ ] 能解释为什么 BLEU/ROUGE 不能单独评价 Ops QA", "[ ] 能解释 FAE Accuracy 和 Evidence 的变量", "[ ] 能解释 ECE 的含义和局限", "[ ] 能识别数据泄漏、上下文缺失和工具失败"]}]}, {"title": "深入专题：把论文阅读转成系统判断", "sections": [{"title": "一套 LLM-AIOps 系统通常由什么组成", "content": "论文名称各不相同，但反复出现的系统边界通常可以拆成六层：\n\n```mermaid\ngraph TB\n    S[运维信号与事件] --> C[Incident Context]\n    K[知识库与历史案例] --> C\n    C --> R[LLM/小模型推理层]\n    R --> T[工具与查询层]\n    T --> V[证据验证与置信度]\n    V --> H[工程师或受控执行]\n    H --> P[复盘与知识回写]\n    P --> K\n```\n\n#### 信号与事件层\n\n包括指标、日志、Trace、告警、工单、变更和用户报告。这个层面决定 Agent 看到的事实范围。\n\n常见问题：\n\n- 时间戳不一致；\n- 服务名或实例名发生变化；\n- 关键字段没有记录；\n- 采样导致异常片段缺失；\n- 日志中混入未经清理的用户输入；\n- 告警规则自身存在误报和重复。\n\n#### Incident Context 层\n\n它不是简单把所有文本拼接到 Prompt，而是要明确：\n\n- 当前事件的时间窗口；\n- 受影响的服务和版本；\n- 关键症状；\n- 已经执行过的查询和动作；\n- 相关变更；\n- 相似历史事件；\n- 当前用户和 Agent 的权限。\n\n#### 推理层\n\n可以是通用 LLM、领域模型、小模型和规则的组合。研究论文常比较 Prompt、ICL、RAG、Fine-tuning、Agent 或 Multi-Agent，但实现手段不等于运维任务。\n\n#### 工具层\n\n工具可以是日志查询、监控查询、数据库诊断、Kubernetes API、网络探针、代码搜索或配置读取。工具层是模型与真实系统之间的边界，也是风险的集中位置。\n\n#### 验证层\n\n验证包括证据引用、规则检查、置信度校准、专家复核、动作模拟和恢复检测。没有验证层时，系统容易把自然语言连贯性误当成正确性。\n\n#### 人和执行层\n\n人可以确认结论、修正上下文、审批动作或处理异常分支。只有低风险、可逆和可验证的动作，才适合逐步自动化。", "subs": ["信号与事件层", "Incident Context 层", "推理层", "工具层", "验证层", "人和执行层"]}, {"title": "论文中“模型能力”的四种含义", "content": "阅读论文时，模型能力至少可能指四件不同的事：\n\n| 表述 | 实际可能指什么 | 阅读时要追问 |\n|---|---|---|\n| 理解运维问题 | 能识别术语、实体和意图 | 是开放问答还是固定选项？ |\n| 生成诊断结论 | 能输出候选故障或根因 | 是否有证据和反事实验证？ |\n| 使用运维工具 | 能生成符合 API 的调用 | 参数是否经过校验？ |\n| 完成运维任务 | 环境状态达到目标 | 成功条件是否包含业务恢复？ |\n\n论文摘要中的“achieves autonomous operations”可能只覆盖其中一项。正文需要根据实验环境重新确认。", "subs": []}, {"title": "任务、方法和系统的三层阅读法", "content": "#### 第一问：论文解决的运维问题是什么\n\n例如：\n\n- LogGPT 的主问题是日志异常检测；\n- RCAgent 的主问题是云事件 RCA；\n- Nissist 的主问题是事件缓解建议；\n- OpsEval 的主问题是运维领域 LLM 评测。\n\n#### 第二问：论文用什么方法解决\n\n可能包括：\n\n- Prompt Engineering；\n- In-Context Learning；\n- RAG；\n- Fine-tuning；\n- Tool Use；\n- Planning；\n- Reflection；\n- Knowledge Graph；\n- Causal Reasoning。\n\n同一种方法可以出现在完全不同的主任务中。\n\n#### 第三问：方法是否组成了完整系统\n\n要检查论文是否定义了：\n\n- 输入数据如何接入；\n- 上下文如何筛选；\n- 工具如何调用；\n- 结果如何验证；\n- 失败如何处理；\n- 工程师如何介入；\n- 评测如何覆盖端到端流程。", "subs": ["第一问：论文解决的运维问题是什么", "第二问：论文用什么方法解决", "第三问：方法是否组成了完整系统"]}, {"title": "一个方法为什么可能只适合低风险环节", "content": "以 RAG 为例，RAG 可以很好地返回相似 Runbook，但不能自动保证：\n\n1. 文档仍然适用于当前版本；\n2. 文档描述的资源就是当前资源；\n3. 文档中的命令没有副作用；\n4. 当前事件没有新的异常条件；\n5. 执行动作后业务真的恢复。\n\n所以 RAG 常适合知识检索、摘要和建议生成；进入执行链路后，还需要版本过滤、权限控制、审批、验证和回滚。", "subs": []}]}, {"title": "深入专题：评测设计的具体方法", "sections": [{"title": "建立任务卡片", "content": "每个评测任务可以先写成一张任务卡片：\n\n| 字段 | 示例问题 |\n|---|---|\n| 任务名称 | Incident Triage |\n| 触发条件 | 告警超过持续时间阈值 |\n| 输入 | 告警、服务名、历史事件、影响范围 |\n| 输出 | 严重性、类别、责任团队、理由 |\n| 证据 | 告警时间、指标变化、相关工单 |\n| 失败条件 | 数据不足、服务未知、冲突证据 |\n| 人工动作 | 确认路由或修改优先级 |\n| 评价 | 分类正确率、路由采纳率、漏报率 |\n\n这种任务卡片可以防止把一个宽泛的“运维能力”直接交给模型评分。", "subs": []}, {"title": "静态问答评测", "content": "静态问答适合测试：\n\n- 术语理解；\n- 命令或配置解释；\n- 固定知识检索；\n- 多项选择能力；\n- 对标准答案关键点的覆盖。\n\n它不适合直接测试：\n\n- 动态系统状态判断；\n- 工具调用顺序；\n- 业务恢复；\n- 权限和回滚；\n- 长期知识更新。", "subs": ["术语理解；", "命令或配置解释", "固定知识检索", "多项选择能力", "对标准答案关键点的覆盖", "动态系统状态判断"]}, {"title": "轨迹评测", "content": "轨迹评测保留 Agent 的中间步骤。可以从以下维度评分：\n\n1. 是否先确认任务范围；\n2. 是否选择最小必要权限；\n3. 是否查询了能区分候选根因的数据；\n4. 是否理解空结果和查询错误；\n5. 是否更新了原有假设；\n6. 是否在证据不足时停止；\n7. 是否引用了与结论直接相关的证据；\n8. 是否产生不必要的高成本调用。", "subs": []}, {"title": "环境状态评测", "content": "对有工具的 Agent，还应记录环境状态变化：\n\n```text\n初始状态 → 观测状态 → 计划状态 → 执行状态 → 验证状态\n```\n\n关键区别：\n\n- 命令返回 0 不代表业务恢复；\n- 指标恢复不代表数据没有丢失；\n- 事件关闭不代表根因已确认；\n- Agent 生成了回滚命令不代表回滚真的成功。", "subs": ["命令返回 0 不代表业务恢复", "指标恢复不代表数据没有丢失", "事件关闭不代表根因已确认", "Agent 生成了回滚命令不代表回滚真的成功"]}, {"title": "人工评价和自动评价如何结合", "content": "自动指标适合大规模筛查，人类专家适合判断复杂证据和业务影响。建议采用分层策略：\n\n| 层次 | 评价方式 | 适合检查 |\n|---|---|---|\n| 第一层 | 规则或字符串 | 格式、字段、命令参数 |\n| 第二层 | 自动语义指标 | 关键点覆盖、引用重合 |\n| 第三层 | LLM Judge | 解释质量、证据相关性 |\n| 第四层 | 专家复核 | 根因正确性、业务风险、动作可接受性 |\n| 第五层 | 线上观测 | 采纳率、MTTR、回滚和误操作 |\n\nLLM-as-a-Judge 本身也需要校准，不能因为使用了另一个 LLM 就把评价当成客观事实。", "subs": []}, {"title": "评测结果的最小报告格式", "content": "每篇系统论文的评测摘要可以统一整理成：\n\n```markdown\n#### 评测摘要\n\n- 任务：\n- 数据：\n- 环境：\n- 基线：\n- 指标：\n- 最佳结果：\n- 过程是否评测：\n- 是否使用真实工具：\n- 是否有人工或生产验证：\n- 作者报告的局限：\n- 本路线图的保守解释：\n```", "subs": []}]}, {"title": "深入专题：OpsEval 案例拆解", "sections": [{"title": "为什么需要运维领域基准", "content": "OpsEval 指出，运维知识会随 IT 系统变化，涉及多个私有子领域和专业术语。通用 NLP 基准无法回答：\n\n- 模型是否理解具体运维命令；\n- 模型是否覆盖排障答案中的关键步骤；\n- 模型是否提供了有依据的解释；\n- 模型是否在不同运维子领域保持稳定。", "subs": ["模型是否理解具体运维命令", "模型是否覆盖排障答案中的关键步骤", "模型是否提供了有依据的解释", "模型是否在不同运维子领域保持稳定"]}, {"title": "数据构成", "content": "译文记录 OpsEval 包含多项选择题和开放式问答，覆盖多个运维子领域，并采用企业材料、认证考试和运维教材等来源。部分数据公开用于初步评估，其余数据保留以减少泄漏。\n\n阅读时要注意：数据规模是论文直接报告的事实，数据是否代表你的组织仍需要另行验证。", "subs": []}, {"title": "FAE-Score 的三条分支", "content": "```mermaid\ngraph LR\n    Q[问题与模型回答] --> F[流畅性]\n    Q --> A[关键词准确性]\n    Q --> E[相关文档证据]\n    F --> S[FAE-Score]\n    A --> S\n    E --> S\n```\n\n#### 流畅性\n\n流畅性关注语法、连贯性、清晰度、风格和完整性。它回答“工程师能否顺畅读懂”，不回答“内容是否正确”。\n\n#### 准确性\n\n准确性使用关键词匹配的 Precision、Recall 和 F1。它能够减少无关词重复造成的虚高分，但关键词提取错误、同义表达和因果关系仍可能影响结果。\n\n#### 证据\n\n证据分支测量回答与相关文档之间的重合。高证据分数不代表文档正确，也不代表回答覆盖了所有风险；它更接近“回答是否引用了检索到的依据”。", "subs": ["流畅性", "准确性", "证据"]}, {"title": "一个具体 QA 案例", "content": "OpsEval 译文给出了 Linux 磁盘 I/O 瓶颈问题。标准答案包含 `iotop`、`iostat`、`tune2fs` 以及增加存储或重新分配负载等关键步骤。\n\n这个案例适合用来说明：\n\n1. 只回答“使用 iotop”可能流畅但不完整；\n2. 提供很多命令但没有解释，可能增加噪声；\n3. 没有参考文档或证据时，方案可能看似专业但不可靠；\n4. 评价需要同时考虑关键点覆盖和证据支撑。", "subs": []}, {"title": "OpsEval 的可迁移启发", "content": "- 运维 QA 评价应围绕领域关键点，而不是句子相似度。\n- 基准应公开任务定义和样例，同时保护测试集。\n- 多企业数据可以缓解单一组织数据偏差，但不能消除所有分布差异。\n- 提示策略和上下文长度是运维评测的重要变量。", "subs": ["运维 QA 评价应围绕领域关键点", "基准应公开任务定义和样例", "多企业数据可以缓解单一组织数据偏差", "提示策略和上下文长度是运维评测的重要变量"]}]}, {"title": "深入专题：LM-PACE 案例拆解", "sections": [{"title": "问题背景", "content": "RCA 生成器可能是黑盒模型，无法访问 logits、权重或内部概率。工程师需要知道一个根因建议是否值得采纳，但模型的自然语言置信表达不一定经过校准。", "subs": []}, {"title": "方法流程", "content": "```mermaid\ngraph TD\n    D[当前事件描述] --> G[黑盒根因生成器]\n    D --> R[历史事件检索]\n    R --> C[Confidence-of-Evaluation]\n    G --> E[Root Cause Evaluation]\n    R --> E\n    C --> O[分数组合与优化]\n    E --> O\n    O --> P[校准后的置信度]\n```", "subs": []}, {"title": "检索数据的形式", "content": "历史数据库被表示为事件描述和真实根因的配对：\n\n$$\nD=\\{h_i=(d_i,r_i):i=1,2,\\ldots,n_{\\max}\\}.\n\\tag{7}\n$$\n\n对于查询事件，论文使用同一个编码器计算当前描述和历史描述的向量内积：\n\n$$\n\\left\\langle Enc(d_{query};\\theta_{enc}),Enc(d_i;\\theta_{enc})\\right\\rangle.\n\\tag{8}\n$$\n\n这里的重点不是记住编码器名称，而是理解：置信度估计器需要领域参考数据，单靠通用模型的语气无法保证校准。", "subs": []}, {"title": "Token 预算约束", "content": "历史案例不能无限拼接。论文在固定 token 预算 $L$ 下选择尽可能多的相关样本：\n\n$$\nk=\\max(k')\\quad\\text{s.t.}\\quad\n\\mathrm{len}([h^{[1]},\\ldots,h^{[k']}])\\le L.\n\\tag{9}\n$$\n\n这揭示了运维 RAG 的一个实际约束：更多案例不一定更好，检索质量、案例新鲜度和上下文预算必须一起设计。", "subs": []}, {"title": "置信度校准的运维含义", "content": "如果某一批输出都给出 0.9 置信度，却只有约一半正确，Agent 就是过度自信的。这样的系统不适合直接进入自动执行链路。\n\n如果输出置信度较低但长期校准良好，它仍可以用于人工分流：高分任务进入快速复核，低分任务要求更多工具查询或交给专家。", "subs": []}, {"title": "LM-PACE 的边界", "content": "- 历史案例与当前服务不匹配时，检索会误导评估；\n- 外部置信度估计器仍可能产生错误判断；\n- ECE 依赖样本量、分桶策略和正确性标签；\n- 置信度只能表示预测可靠程度，不等于动作安全性。", "subs": ["历史案例与当前服务不匹配时", "外部置信度估计器仍可能产生错误判断", "ECE 依赖样本量、分桶策略和正确性标签", "置信度只能表示预测可靠程度"]}]}, {"title": "深入专题：生产事件研究如何帮助评估", "sections": [{"title": "生产事件研究回答什么", "content": "生成式 AI 云服务生产事件实证研究关注真实服务中的事件症状、根因和缓解方式。这类研究的价值不是展示一个模型分数，而是帮助我们理解：实际事件分布是什么、哪些故障类型更常见、工程师会采取什么动作。", "subs": []}, {"title": "症状与根因不能混用", "content": "译文将症状分为无效推理、部署失败和性能下降，将根因分为基础设施、配置、代码、外部使用和操作错误等类别。\n\n学习时应保持两张表：\n\n| 症状 | 可能表现 |\n|---|---|\n| 无效推理 | 输出结果不符合预期、模型行为异常 |\n| 部署失败 | 服务无法启动、发布流程失败 |\n| 性能下降 | 延迟、吞吐、资源使用或稳定性恶化 |\n\n| 根因 | 需要核对的证据 |\n|---|---|\n| 基础设施问题 | 节点、GPU、网络、存储和依赖状态 |\n| 配置问题 | 配置差异、版本和变更记录 |\n| 代码缺陷 | 代码变更、异常栈、回归测试 |\n| 外部使用问题 | 输入、调用方式、配额和用户行为 |\n| 操作错误 | 人工动作、权限和执行日志 |\n\n一个性能下降事件可能由配置问题引起，也可能由基础设施问题引起。症状分类不能替代根因分析。", "subs": []}, {"title": "生产分布对 benchmark 的影响", "content": "如果公开 benchmark 主要包含软件故障，而生产系统主要遇到容量、依赖、配置和外部使用问题，那么 benchmark 排名不能直接代表生产适用性。规划阶段会把“数据分布是否匹配”作为所有论文的必读问题。", "subs": []}]}, {"title": "深入专题：从研究方法到选型判断", "sections": [{"title": "Prompt Engineering", "content": "适合：任务格式稳定、需要快速验证、没有足够微调数据的场景。\n\n优点：成本低、迭代快、容易解释。\n\n限制：对提示和上下文敏感，输出格式可能漂移。", "subs": []}, {"title": "RAG", "content": "适合：需要引用 SOP、历史事件、领域术语或最新配置的场景。\n\n优点：知识可更新，模型权重不必重新训练。\n\n限制：召回错误、文档过期、权限泄漏和上下文过长。", "subs": []}, {"title": "Fine-tuning", "content": "适合：任务格式和领域术语相对稳定、拥有高质量标注或指令数据的场景。\n\n优点：可以改变模型的领域表达和任务习惯。\n\n限制：数据准备、版本漂移、更新成本和灾难性遗忘。", "subs": []}, {"title": "Agent 与 Tool Use", "content": "适合：需要多步查询、主动收集证据或编排已有工具的场景。\n\n优点：可以从被动回答转向调查流程。\n\n限制：工具参数错误、权限扩大、调用成本和失败恢复。", "subs": []}, {"title": "Knowledge Graph 与 Causal Reasoning", "content": "适合：服务拓扑、依赖关系、资源关系和故障传播路径比较明确的场景。\n\n优点：为候选搜索提供结构约束。\n\n限制：图谱维护成本高，真实系统关系持续变化；图结构正确也不等于当前根因成立。", "subs": []}, {"title": "小模型协作", "content": "适合：分类、过滤、规则判断和高频低成本任务。\n\n优点：延迟和成本低，可提供稳定的边界判断。\n\n限制：复杂开放式解释能力有限，需要设计与 LLM 的交接协议。", "subs": []}, {"title": "方法选型速查表", "content": "| 需求 | 优先考虑 | 需要额外验证 |\n|---|---|---|\n| 文档问答 | RAG、领域 Prompt | 文档时效、引用和权限 |\n| 工单摘要 | Prompt、Fine-tuning | 事实覆盖和幻觉 |\n| 日志解析 | 小模型、Prompt、缓存 | 模板漂移和成本 |\n| RCA 查询 | Tool Use、RAG、拓扑 | 查询证据和工具失败 |\n| 低风险修复 | Runbook Agent | 审批、验证和回滚 |\n| IaC 变更 | 代码模型、语义检查 | 资源影响和策略 |", "subs": []}]}, {"title": "来源索引", "sections": [{"title": "来源可用性", "content": "本方向主要使用本地完整中文译文。最终正文会在论文标题旁保留译文路径，并在公式或图表旁标注原 PDF 页码。", "subs": []}, {"title": "资料边界", "content": "只有摘要或元数据的论文不会支撑详细架构、实验数字或局限性结论；它们只会出现在延伸阅读或相关研究说明中。", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
