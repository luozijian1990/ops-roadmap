name: traefik-review-dns
services:
  traefik:
    image: traefik:v3.6.25
    command:
    - --configFile=/etc/traefik/traefik.yml
    ports:
    - 127.0.0.1:38443:443
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare-token
    secrets:
    - cloudflare-token
    volumes:
    - ./dns-acme.yml:/etc/traefik/traefik.yml:ro
    - ./state/dns-routes.yml:/routes.yml:ro
    - ./state/acme:/acme
secrets:
  cloudflare-token:
    file: ./state/cloudflare-token
