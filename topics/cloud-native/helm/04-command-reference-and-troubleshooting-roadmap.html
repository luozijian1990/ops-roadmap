<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

<script id="data" type="application/json">{"title": "Helm 学习笔记 · 第四册：命令参考与排障", "intro": "> **定位**：这不是逐项复制 `--help` 的手册，而是按运维任务组织的命令地图。参数会随 Helm 版本变化，执行前使用 `helm COMMAND --help` 核对。<br>\n> **安全提示**：`--debug`、`--dry-run`、`helm get values` 和渲染输出可能包含 Secret 或敏感 Values，不要直接写入公共日志。", "parts": [{"title": "第十二章 · 按 Chart 与仓库任务选择命令", "sections": [{"title": "创建、检查、打包和验证 Chart", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-create.md; e8ddd95ed0cc1bbe/helm-lint.md; e8ddd95ed0cc1bbe/helm-package.md; e8ddd95ed0cc1bbe/helm-verify.md -->\n\n| 命令 | 输入 | 主要输出 | 使用时机 |\n| --- | --- | --- | --- |\n| `helm create NAME` | 名称或路径 | Chart 脚手架 | 开始新 Chart |\n| `helm lint CHART` | 目录或包 | 规范和模板问题 | 提交与发布前 |\n| `helm package CHART` | Chart 目录 | 版本化 `.tgz` | 进入制品仓库前 |\n| `helm verify PATH` | `.tgz` 和 `.prov` | 签名验证结果 | 使用外部制品前 |\n\n```bash\nhelm create web\nhelm lint ./web --strict -f values-ci.yaml\nhelm package ./web --destination dist\nhelm verify dist/web-1.0.0.tgz --keyring pubring.gpg\n```\n\n`helm create` 在目标已有文件时可能覆盖冲突文件，应在空目录或版本控制下执行。`lint` 通过只代表 Chart 层检查通过，不证明目标 API Server 接受资源。\n\n#### `helm create`：从可控脚手架开始\n\n基本语法是：\n\n```text\nhelm create NAME [flags]\n```\n\n`NAME` 同时影响目录名、`Chart.yaml` 的名称以及模板生成的资源名。创建后第一件事不是立刻安装，而是删除不需要的示例资源并检查以下文件：\n\n```text\nweb/\n├── Chart.yaml\n├── values.yaml\n├── charts/\n├── templates/\n│   ├── NOTES.txt\n│   ├── _helpers.tpl\n│   ├── deployment.yaml\n│   ├── service.yaml\n│   └── tests/\n└── .helmignore\n```\n\n如果组织有统一 Chart 模板，应在版本控制中维护自己的 starter，然后使用目标 Helm 版本支持的 starter 参数，而不是每个项目手工删除和复制文件。脚手架升级也要经过 diff 审查，避免意外覆盖业务模板。\n\n#### `helm lint`：静态质量门\n\n```text\nhelm lint PATH [flags]\n```\n\n高价值选项及语义：\n\n| 选项 | 作用 | 使用建议 |\n| --- | --- | --- |\n| `--strict` | 将警告按失败处理 | CI 默认启用 |\n| `-f, --values` | 加载场景 Values | 至少覆盖最小和生产形态 |\n| `--set` | 临时覆盖单值 | 用于边界测试，不代替版本化文件 |\n| `--with-subcharts` | 一并检查依赖 Chart | umbrella Chart 发布前启用 |\n| `--kube-version` | 模拟目标 Kubernetes 版本 | 兼容矩阵测试 |\n\n```bash\nhelm lint ./web --strict -f tests/values-minimal.yaml\nhelm lint ./web --strict -f tests/values-production.yaml \\\n  --kube-version 1.34.0\n```\n\nLint 失败通常分为元数据、schema、模板执行和规范建议四类。先处理第一条根因；一个缺失值可能触发后续几十条模板错误。\n\n#### `helm package`：把源码冻结为制品\n\n```text\nhelm package CHART_PATH [...] [flags]\n```\n\n打包读取 `Chart.yaml` 的 `version` 作为归档文件名的一部分。发布流水线应在打包前验证工作树来源和依赖锁，再把输出放入空的制品目录。\n\n```bash\nhelm dependency build ./web\nhelm lint ./web --strict -f values-ci.yaml\nhelm package ./web \\\n  --destination dist \\\n  --sign \\\n  --key release@example.com \\\n  --keyring secring.gpg\n```\n\n可用参数允许覆盖 Chart Version 或 App Version，但常规发布不建议在命令行临时改版本，因为源码 `Chart.yaml` 将与制品不一致。需要覆盖时，应把生成结果和源码提交关联并明确审计。\n\n打包后至少检查：文件名、Chart 元数据、依赖包、digest、`.prov`（若签名）和解包内容。不要把私钥或签名口令写在仓库和 CI 命令日志中。\n\n#### `helm verify`：消费前验证\n\n```text\nhelm verify PATH [flags]\n```\n\n验证需要 Chart 包旁存在匹配的 provenance 文件，并能从 keyring 找到签名公钥。它回答“包内容是否与签名时一致、签名者是否在我的信任环中”，不回答“Chart 是否安全”。\n\n```bash\nhelm verify dist/web-1.4.0.tgz --keyring ./keys/trusted.gpg\n```\n\n典型失败包括 `.prov` 缺失、包摘要变化、公钥缺失、签名身份不受信和 keyring 格式错误。修复应从可信渠道重新取得包或公钥，不能以跳过验证作为自动回退。\n\n#### 建议的 Chart 制品流水线\n\n```mermaid\nflowchart LR\n    S[Chart 源码] --> D[dependency build]\n    D --> L[lint strict]\n    L --> T[template/API 校验]\n    T --> P[package + sign]\n    P --> V[verify]\n    V --> R[Repository/OCI]\n```\n\n每一步都应消费上一步的固定产物。若在验证后重新打包，即使源码没变，新的归档也需要重新计算摘要并签名。", "subs": ["helm create", "helm lint", "helm package", "helm verify", "建议的 Chart 制品流水线"]}, {"title": "构建、更新和检查 Chart 依赖", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-dependency.md; e8ddd95ed0cc1bbe/helm-dependency-build.md; e8ddd95ed0cc1bbe/helm-dependency-list.md; e8ddd95ed0cc1bbe/helm-dependency-update.md -->\n\n```bash\nhelm dependency list ./web\nhelm dependency update ./web\nhelm dependency build ./web\n```\n\n| 命令 | 行为 | 可重复性 |\n| --- | --- | --- |\n| `dependency update` | 按 `Chart.yaml` 重新解析满足范围的版本并生成锁文件 | 结果可能随仓库变化 |\n| `dependency build` | 优先按 `Chart.lock` 重建 `charts/` | 适合 CI 重放 |\n| `dependency list` | 只列出声明与当前状态 | 不改文件 |\n\n依赖下载失败时依次检查仓库 URL/别名、认证、TLS、仓库索引缓存、版本范围与 OCI 路径。\n\n#### 依赖声明、锁文件和本地目录\n\n依赖声明位于父 Chart 的 `Chart.yaml`，解析结果写入 `Chart.lock`，实际包存放于 `charts/`。三者含义不同：\n\n```text\nChart.yaml    允许什么版本\nChart.lock    这次解析到了什么版本和摘要\ncharts/       当前真正参与渲染的依赖包\n```\n\n`dependency list` 会显示依赖名称、版本范围、仓库和当前状态。看到 `missing`、`unpacked` 或版本不匹配时，先确认 `charts/` 是否混入手工复制内容。\n\n#### `dependency update`：重新求解\n\n```text\nhelm dependency update CHART [flags]\n```\n\n它访问仓库，根据版本约束选取当前可用版本，下载到 `charts/` 并更新锁文件。适合维护者有意识地升级依赖：\n\n```bash\nhelm repo update\nhelm dependency update ./web\ngit diff -- ./web/Chart.lock ./web/charts\nhelm lint ./web --with-subcharts --strict\n```\n\n版本范围如 `~1.4.0` 可能在不同日期解析到不同补丁版本，因此 CI 日常构建不应无条件运行 update。\n\n#### `dependency build`：按锁重建\n\n```text\nhelm dependency build CHART [flags]\n```\n\n当 `Chart.lock` 存在时，build 按锁定版本重建 `charts/`，适合可重复构建。没有锁文件时其行为会更接近 update，因此发布仓库应提交锁文件。\n\n```bash\nhelm dependency build ./web --skip-refresh\n```\n\n`--skip-refresh` 可避免刷新传统仓库缓存，但前提是本机已经有可用索引。离线构建还需预先准备依赖包或缓存，不能只提交锁文件。\n\n#### OCI 与传统仓库依赖\n\n传统仓库依赖通常使用仓库 URL 或 `@alias`；OCI 依赖使用 `oci://` 引用。失败时不要只看最终的“could not download”，要确认：\n\n1. 当前 Helm 是否已登录目标 Registry；\n2. Chart 名和仓库路径是否重复；\n3. 版本范围能否匹配远端 tag；\n4. Registry 是否允许拉取 manifest 与 blob；\n5. 企业 CA 与代理是否作用于该进程。\n\n#### 依赖故障判读表\n\n| 现象 | 可能原因 | 下一步 |\n| --- | --- | --- |\n| repository not found | alias 未添加或拼错 | `helm repo list`，核对 `Chart.yaml` |\n| no matching version | 版本范围与索引不交集 | `search repo --versions` |\n| digest mismatch | 锁文件与远端内容不一致 | 停止构建，审计制品是否被重写 |\n| 401/403 | Registry/仓库认证或授权 | 重新登录并核对仓库级权限 |\n| timeout | DNS、代理、网络或服务端慢 | 独立测试 URL，设置有界超时 |\n| 本地成功 CI 失败 | 缓存、凭据或 CA 未带入 | 用干净容器重现并比较 `helm env` |", "subs": ["依赖声明、锁文件和本地目录", "dependency update", "dependency build", "OCI 与传统仓库依赖", "依赖故障判读表"]}, {"title": "搜索、检查和拉取 Chart", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-search.md; e8ddd95ed0cc1bbe/helm-search-hub.md; e8ddd95ed0cc1bbe/helm-search-repo.md; e8ddd95ed0cc1bbe/helm-show.md; e8ddd95ed0cc1bbe/helm-show-all.md; e8ddd95ed0cc1bbe/helm-show-chart.md; e8ddd95ed0cc1bbe/helm-show-crds.md; e8ddd95ed0cc1bbe/helm-show-readme.md; e8ddd95ed0cc1bbe/helm-show-values.md; e8ddd95ed0cc1bbe/helm-pull.md -->\n\n| 目标 | 命令 |\n| --- | --- |\n| 在 Artifact Hub 找候选 | `helm search hub KEYWORD` |\n| 在本地仓库索引查找 | `helm search repo KEYWORD --versions` |\n| 看 Chart 元数据 | `helm show chart REF` |\n| 看默认配置 | `helm show values REF` |\n| 看使用说明 | `helm show readme REF` |\n| 看 CRD | `helm show crds REF` |\n| 看全部信息 | `helm show all REF` |\n| 下载并可选解压 | `helm pull REF --version VERSION --untar` |\n\n```bash\nhelm search hub ingress --list-repo-url\nhelm search repo vendor/web --versions\nhelm show all vendor/web --version 1.4.0\nhelm pull vendor/web --version 1.4.0 --destination dist\n```\n\n搜索结果的 Chart Version 与 App Version 含义不同。生产使用始终显式传 `--version`，下载后记录 digest 或验证签名。\n\n#### `search hub` 与 `search repo` 的边界\n\n```text\nhelm search hub [KEYWORD] [flags]\nhelm search repo [KEYWORD] [flags]\n```\n\nHub 搜索面向公共目录发现，结果可能来自不同仓库；repo 搜索只读取本地已经配置并缓存的仓库索引。前者适合发现候选，后者适合从已批准来源选版本。\n\n```bash\nhelm search hub postgresql --max-col-width 80\nhelm search repo database/postgresql --versions --devel\n```\n\n`--devel` 会包含预发布版本；按 SemVer 约束搜索时要明确预发布语义。搜索命中不表示本地索引最新，执行 `repo update` 后结果可能改变。\n\n#### `show` 系列：安装前阅读 Chart\n\n`helm show` 是命令组，子命令从同一个 Chart 引用提取不同部分：\n\n```bash\nhelm show chart vendor/web --version 1.4.0\nhelm show values vendor/web --version 1.4.0 > /tmp/web-values.yaml\nhelm show readme vendor/web --version 1.4.0\nhelm show crds vendor/web --version 1.4.0\n```\n\n`show chart` 用来核对 name、version、appVersion、kubeVersion 和依赖；`show values` 是配置入口，不保证列出模板读取的所有动态值；`show crds` 用于评估集群范围影响；`show readme` 和 `show all` 用于查看作者说明。\n\n重定向 Values 到文件后应先检查内容再修改。若输出包含 YAML 注释，经过某些解析器重写可能丢失说明。\n\n#### `helm pull`：下载、验证与解包\n\n```text\nhelm pull [chart URL | repo/chartname] [flags]\n```\n\n常用选项：\n\n| 选项 | 作用 |\n| --- | --- |\n| `--version` | 固定 Chart Version |\n| `--destination` | 指定归档目录 |\n| `--untar` | 下载后解包 |\n| `--untardir` | 指定解包父目录 |\n| `--verify` | 下载后验证 provenance |\n| `--prov` | 同时取得 provenance 文件 |\n| `--keyring` | 指定受信公钥环 |\n\n```bash\nhelm pull vendor/web \\\n  --version 1.4.0 \\\n  --destination dist \\\n  --prov --verify \\\n  --keyring ./keys/trusted.gpg\n```\n\n仅审阅源码时可使用 `--untar`，但自动化应避免解包到可能已有同名目录的位置。归档和解包结果都要防止路径穿越；来源不可信时在隔离目录处理。\n\n#### 从发现到批准的流程\n\n```mermaid\nflowchart TD\n    H[search hub 发现] --> A[确认维护者与仓库]\n    A --> R[repo add 或 OCI 定位]\n    R --> S[show chart/values/crds]\n    S --> P[pull 固定版本]\n    P --> V[verify/digest/SBOM/扫描]\n    V --> C[进入内部批准仓库]\n```\n\n生产环境应从内部批准仓库消费，而不是每次安装都重新搜索公共目录。", "subs": ["search hub 与 search repo 的边界", "show 系列", "helm pull", "从发现到批准的流程"]}, {"title": "添加、索引、查看、更新和移除传统仓库", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-repo.md; e8ddd95ed0cc1bbe/helm-repo-add.md; e8ddd95ed0cc1bbe/helm-repo-index.md; e8ddd95ed0cc1bbe/helm-repo-list.md; e8ddd95ed0cc1bbe/helm-repo-remove.md; e8ddd95ed0cc1bbe/helm-repo-update.md -->\n\n```bash\nhelm repo add vendor https://charts.example.com\nhelm repo list\nhelm repo update vendor\nhelm search repo vendor/\nhelm repo remove vendor\n```\n\n仓库维护者使用：\n\n```bash\nhelm repo index ./public --url https://charts.example.com\nhelm repo index ./public --url https://charts.example.com --merge ./public/index.yaml\n```\n\n`repo add` 报错时检查 URL 末端能否取得有效 `index.yaml`。不应把 `--insecure-skip-tls-verify` 当长期修复，应部署可信 CA。\n\n#### `repo add`：建立名称到 URL 的映射\n\n```text\nhelm repo add NAME URL [flags]\n```\n\n仓库名只存在于本机 Helm 配置中，不是服务端对象。团队脚本应选择稳定别名，避免不同开发者把同一个 URL 命名成不同名称。\n\n```bash\nhelm repo add vendor https://charts.example.com \\\n  --ca-file ./pki/company-ca.pem\n```\n\n私有仓库可以使用用户名密码、证书或实现提供的认证方式。凭据文件权限要受控，命令行密码可能进入 shell 历史和进程列表，优先使用安全凭据注入。\n\n同名仓库已经存在时，先比较 URL；仅在确实要修改配置时使用强制更新类选项。静默覆盖可能把可信别名指向错误站点。\n\n#### `repo list` 与配置诊断\n\n```bash\nhelm repo list\nhelm repo list -o yaml\nhelm env\n```\n\n结构化输出适合审计脚本。若列表与预期不符，用 `helm env` 查看实际 repository config 路径；不同用户、容器或自定义 `HELM_CONFIG_HOME` 会读取不同配置。\n\n#### `repo update`：刷新本地索引\n\n```text\nhelm repo update [REPO1 [REPO2 ...]] [flags]\n```\n\n更新只刷新本地缓存，不升级已安装 Release，也不下载 Chart 包。指定仓库名可缩小失败面：\n\n```bash\nhelm repo update vendor\nhelm search repo vendor/web --versions\n```\n\n流水线若依赖稳定解析，应先在受控步骤更新并保存选定版本，而不是让每次部署的搜索结果随索引漂移。\n\n#### `repo remove`：移除本地配置\n\n```text\nhelm repo remove NAME [...] [flags]\n```\n\n它不会删除服务端仓库、已下载 Chart 或已安装 Release。移除前检查 `Chart.yaml` 是否仍通过该 alias 声明依赖；否则后续 dependency build 会失败。\n\n#### `repo index`：维护者生成索引\n\n```text\nhelm repo index DIR [flags]\n```\n\n`--url` 决定 index 条目中的下载基址，必须是客户端最终可访问的位置。`--merge` 用于合并旧索引和当前目录的新包：\n\n```bash\nhelm repo index ./public \\\n  --url https://charts.example.com \\\n  --merge ./downloaded-old-index.yaml\n```\n\n生成后先验证 YAML、包 URL 和 digest，再原子发布包与索引。若先发布 index、后上传包，客户端会短暂看到不可下载版本；若覆盖 index 时漏掉旧条目，旧版本会从搜索结果消失。\n\n#### 传统仓库故障分层\n\n```text\n配置层: repo list 中名称和 URL 是否正确\n网络层: DNS/TCP/TLS/代理是否可达\n协议层: URL 是否返回有效 index.yaml\n索引层: 目标 Chart 和版本是否存在\n制品层: 条目 URL 能否下载且 digest 是否匹配\n```\n\n用这一顺序排查可以避免在 TLS 尚未建立时反复修改 Chart 版本。", "subs": ["repo add", "repo list 与配置诊断", "repo update", "repo remove", "repo index", "传统仓库故障分层"]}, {"title": "登录 OCI Registry 并推送 Chart", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-registry.md; e8ddd95ed0cc1bbe/helm-registry-login.md; e8ddd95ed0cc1bbe/helm-registry-logout.md; e8ddd95ed0cc1bbe/helm-push.md -->\n\n```bash\nprintf '%s' \"$REGISTRY_PASSWORD\" | \\\n  helm registry login registry.example.com \\\n  --username ci --password-stdin\n\nhelm push dist/web-1.4.0.tgz oci://registry.example.com/helm\nhelm registry logout registry.example.com\n```\n\n`push` 的目标不写 Chart 名和 tag；Helm 从包元数据推导它们。401/403 通常是认证或仓库权限问题，404 可能是命名空间未创建，TLS 错误应检查 CA 与主机名。\n\n#### `registry login`：写入凭据\n\n```text\nhelm registry login HOST [flags]\n```\n\nCI 中使用 `--password-stdin`，并关闭命令回显：\n\n```bash\nset +x\nprintf '%s' \"$REGISTRY_PASSWORD\" | \\\n  helm registry login registry.example.com \\\n  --username \"$REGISTRY_USERNAME\" \\\n  --password-stdin\nset -x\n```\n\n登录目标通常是 Registry 主机，不包含 `oci://`、Chart 仓库路径或 tag。凭据保存位置可由 Helm Registry 配置路径控制；共享 Runner 应使用任务级临时配置并在结束后清理。\n\n#### `helm push`：推送已打包 Chart\n\n```text\nhelm push CHART_PACKAGE OCI_URL [flags]\n```\n\n```bash\nhelm package ./web --destination dist\nhelm push dist/web-1.4.0.tgz oci://registry.example.com/platform\n```\n\n最终引用通常形如 `oci://registry.example.com/platform/web:1.4.0`。目标参数只写父仓库，是为了避免包中 name/version 与命令行目标互相矛盾。\n\n推送成功后记录服务端返回的 digest，并用独立身份拉取验证：写权限成功不代表生产只读身份有拉取权限。\n\n#### `registry logout`：移除本地凭据\n\n```text\nhelm registry logout HOST [flags]\n```\n\nLogout 删除 Helm Registry 配置中的对应凭据，不会撤销服务端 token 或云 IAM 权限。凭据泄露时仍需在 Registry 或身份系统轮换。\n\n#### OCI 排错决策\n\n| 错误 | 核对 |\n| --- | --- |\n| unauthorized | 登录主机、token 有效期、用户名与认证域 |\n| forbidden | push/pull 仓库级权限、命名空间策略 |\n| manifest unknown | Chart 名、tag、仓库路径 |\n| blob unknown | 上传不完整、复制或垃圾回收异常 |\n| name invalid | Registry 命名规则、路径大小写 |\n| certificate unknown | CA 链、SNI、企业代理 |\n| digest mismatch | 内容被重写或传输/缓存异常，停止发布 |\n\n不要用 `latest` 代替 Chart Version。即使 Registry 允许覆盖同名 tag，发布策略也应禁止重写已发布版本。", "subs": ["registry login", "helm push", "registry logout", "OCI 排错决策"]}, {"title": "在本地渲染模板并定位配置问题", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-template.md -->\n\n```bash\nhelm template web ./chart \\\n  -n production \\\n  -f values-prod.yaml \\\n  --include-crds \\\n  --debug\n```\n\n常用模拟参数包括 `--kube-version`、`--api-versions`、`--is-upgrade` 和 `--show-only`。本地模式会伪造集群能力且不做完整服务端校验；需要调用 `lookup` 或服务端验证时使用受控的 `--dry-run=server`。\n\n#### 基本语法与 Release 上下文\n\n```text\nhelm template [NAME] [CHART] [flags]\n```\n\n虽然不创建 Release，模板仍会使用给定的 Release 名、namespace、是否升级、Kubernetes 版本和 API 能力。固定这些输入才能让 CI 与部署行为接近：\n\n```bash\nhelm template web ./chart \\\n  --namespace production \\\n  --kube-version 1.34.0 \\\n  --api-versions monitoring.coreos.com/v1/ServiceMonitor \\\n  -f values-prod.yaml \\\n  > rendered.yaml\n```\n\n#### 定位单个模板\n\n`--show-only` 可以只输出指定模板，路径相对于 Chart 根目录：\n\n```bash\nhelm template web ./chart \\\n  -f values-prod.yaml \\\n  --show-only templates/deployment.yaml \\\n  --debug\n```\n\n它适合快速定位，但完整验证仍要渲染所有模板，因为命名模板、CRD 和其他对象可能存在冲突。\n\n#### Values 输入与类型\n\n```bash\nhelm template web ./chart \\\n  -f values-common.yaml \\\n  -f values-prod.yaml \\\n  --set-string image.tag=00123 \\\n  --set replicas=3\n```\n\n多个 Values 输入按命令顺序合并，后者覆盖前者。对看似数字但必须保留前导零、布尔字面量或大整数的值，使用文件或字符串选项并通过 schema 固定类型。\n\n`--set-file` 可把文件内容作为值传入，适合证书或配置片段，但渲染输出会包含内容，仍应按敏感数据保护。\n\n#### 模拟安装与升级\n\n模板可能根据 `.Release.IsInstall`、`.Release.IsUpgrade` 或 Revision 分支：\n\n```bash\nhelm template web ./chart --is-upgrade -f values-prod.yaml\n```\n\n本地模拟无法完整重建历史 Release 状态。对依赖旧 Values、三方合并或集群查询的升级，必须在测试集群执行真正的升级演练。\n\n#### CRD 与 Hook\n\n`--include-crds` 把 `crds/` 中的 CRD 纳入输出；默认行为需按目标 Helm 版本确认。Hook 对象会带注解，但 template 不会像真实安装那样按生命周期执行。验证 Hook 要检查权重、删除策略、ServiceAccount 和超时。\n\n#### 客户端与服务端 dry-run\n\n| 方式 | 是否连接集群 | 能发现 API | 能执行 `lookup` | 是否提交资源 |\n| --- | --- | --- | --- | --- |\n| `helm template` | 否 | 仅模拟 | 否 | 否 |\n| client dry-run | 通常否 | 主要模拟 | 受模式限制 | 否 |\n| server dry-run | 是 | 是 | 是 | 否 |\n| 测试 namespace 安装 | 是 | 是 | 是 | 是 |\n\nserver dry-run 仍可能读取集群对象并在输出中带出 Secret。执行身份应使用最小只读/验证权限，日志需要脱敏。\n\n#### 渲染后继续验证\n\n```bash\nhelm template web ./chart -f values-prod.yaml > rendered.yaml\nkubectl apply --dry-run=server -f rendered.yaml\n```\n\n还可以接 schema 校验、策略检查和自定义 lint。注意离线 schema 工具的 Kubernetes 版本要与目标集群一致。\n\n#### 常见错误定位\n\n| 错误片段 | 常见原因 |\n| --- | --- |\n| nil pointer evaluating | 父级 map 缺失、`with` 范围改变 |\n| can't evaluate field | 对象类型或当前作用域不符 |\n| wrong type for value | Values 类型与函数期待不同 |\n| YAML parse error | 缩进、引号、多行文本错误 |\n| no template associated | include/template 名称拼错或未加载 |\n| could not find api | kubeVersion/API 能力分支错误 |\n\n先用 `--debug` 查看错误附近渲染片段，再缩小到 `--show-only`；不要通过注释掉大量模板来掩盖根因。\n\n```mermaid\ngraph TD\n    L[helm lint] --> T[helm template]\n    T --> D[install dry run]\n    D --> A[API Server 校验]\n    A --> I[测试命名空间安装]\n```", "subs": ["基本语法与 Release 上下文", "定位单个模板", "Values 输入与类型", "模拟安装与升级", "CRD 与 Hook", "客户端与服务端 dry", "渲染后继续验证", "常见错误定位"]}]}, {"title": "第十三章 · 按 Release 生命周期选择命令", "sections": [{"title": "安装、升级、回滚和卸载 Release", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-install.md; e8ddd95ed0cc1bbe/helm-upgrade.md; e8ddd95ed0cc1bbe/helm-rollback.md; e8ddd95ed0cc1bbe/helm-uninstall.md -->\n\n```bash\nhelm install web vendor/web --version 1.4.0 \\\n  -n production --create-namespace -f values-prod.yaml \\\n  --wait --timeout 10m\n\nhelm upgrade web vendor/web --version 1.5.0 \\\n  -n production -f values-prod.yaml \\\n  --wait --timeout 10m\n\nhelm rollback web 3 -n production --wait --timeout 10m\nhelm uninstall web -n production --dry-run\n```\n\n| 阶段 | 高价值选项 | 注意事项 |\n| --- | --- | --- |\n| 安装 | `--version`、`-f`、`--wait`、`--atomic` | 固定 Chart 和配置输入 |\n| 升级 | `--install`、`--reset-values`、`--reuse-values` | `reuse` 可能带入历史遗留值 |\n| 回滚 | 修订号、`--wait`、`--no-hooks` | 外部副作用不一定回滚 |\n| 卸载 | `--keep-history`、`--cascade`、`--dry-run` | Hook 和 keep 资源需单独清理 |\n\n多个 `-f` 与 `--set` 都是右侧优先。dry-run 输出可能包含 Secret；若当前版本提供隐藏 Secret 的选项，应显式启用并仍按敏感日志处理。\n\n#### `helm install`：创建第一个修订\n\n```text\nhelm install RELEASE CHART [flags]\n```\n\nRelease 名是目标 namespace 内 Helm 历史的身份；Chart 引用可以是目录、归档、传统仓库或 OCI。生产命令应同时固定集群上下文、namespace、Chart Version 和 Values：\n\n```bash\nhelm install web oci://registry.example.com/platform/web \\\n  --version 1.4.0 \\\n  --kube-context prod-ap-southeast \\\n  --namespace production \\\n  --create-namespace \\\n  -f values-common.yaml \\\n  -f values-production.yaml \\\n  --wait --timeout 10m\n```\n\n`--generate-name` 适合临时环境，不适合要求稳定 Release 身份的生产系统。`--name-template` 会增加命名复杂度，需防止不同输入产生相同名称。\n\n#### 安装前的模拟\n\n```bash\nhelm install web ./chart \\\n  -n production \\\n  -f values-production.yaml \\\n  --dry-run=client --debug\n\nhelm install web ./chart \\\n  -n production \\\n  -f values-production.yaml \\\n  --dry-run=server --debug\n```\n\n客户端 dry-run 主要验证定位、Values 和渲染；服务端 dry-run 还会使用集群发现与验证。二者都不替代测试 namespace 的真实安装，因为调度、镜像拉取、存储绑定和 Job 运行只有创建后才能观察。\n\n#### 等待、超时与原子安装\n\n`--wait` 等待 Helm 关注的资源达到就绪条件，`--wait-for-jobs` 把 Job 纳入等待，`--timeout` 为单次 Kubernetes 操作设置边界。`--atomic` 会在安装失败时删除本次安装创建的 Release，并隐含等待语义。\n\n```bash\nhelm install web ./chart -n production \\\n  --atomic --wait-for-jobs --timeout 15m\n```\n\n原子不等于事务：CRD、PVC、带 keep 策略对象、Hook 创建的外部资源和第三方 API 调用可能保留。超时也不说明根因，要继续检查 Pod、Job、Event、PVC 和 Admission Webhook。\n\n#### Values 的命令行入口\n\n| 入口 | 适合 | 风险 |\n| --- | --- | --- |\n| `-f file.yaml` | 可审查的环境配置 | 文件顺序决定覆盖 |\n| `--set key=value` | 少量非敏感覆盖 | shell 转义和自动类型推断 |\n| `--set-string` | 必须保持字符串 | 容易隐藏复杂配置 |\n| `--set-file` | 证书、脚本、配置块 | 内容可能进入输出与历史 |\n| `--set-json` | 数组、对象等结构值 | 引号和 shell 转义复杂 |\n\n敏感值即使由临时文件传入，也可能保存在 Release 记录中。应结合 Kubernetes Secret、外部密钥系统和最小读取权限设计。\n\n#### CRD 与 namespace\n\n`--create-namespace` 只负责目标 namespace，不会按组织标准自动添加标签、配额和网络策略。生产 namespace 应由平台预置或在安装后立即核验治理策略。\n\n`--skip-crds` 会影响 `crds/` 资源安装。使用前明确 CRD 由谁、以什么版本管理；一个应用 Chart 静默跳过 CRD 可能导致后续自定义资源创建失败。\n\n#### `helm upgrade`：创建新修订\n\n```text\nhelm upgrade RELEASE CHART [flags]\n```\n\n升级会使用当前 Release、目标 Chart 和新 Values 计算资源变化。先保存基线：\n\n```bash\nhelm status web -n production -o yaml > before-status.yaml\nhelm get values web -n production --all -o yaml > before-values.yaml\nhelm get manifest web -n production > before-manifest.yaml\nhelm history web -n production\n```\n\n再在相同输入下模拟并审阅差异：\n\n```bash\nhelm upgrade web ./chart -n production \\\n  -f values-production.yaml \\\n  --dry-run=server --debug > upgrade-preview.txt\n```\n\n#### `--install` 的便利与边界\n\n```bash\nhelm upgrade --install web ./chart \\\n  -n production --create-namespace \\\n  -f values-production.yaml\n```\n\n该模式适合幂等部署入口，但“Release 不存在”与“无权读取 Release”必须区分。权限错误不应被当成首次安装继续执行。\n\n#### reset、reuse 与显式配置\n\n| 策略 | 新修订 Values 基线 | 风险 |\n| --- | --- | --- |\n| 默认 | 依据 Helm 当前版本的升级合并语义 | 团队理解不一致 |\n| `--reset-values` | 新 Chart 默认值，再叠加本次输入 | 旧定制可能丢失 |\n| `--reuse-values` | 旧 Release 值，再叠加本次输入 | 已废弃字段长期残留 |\n| 完整 Values 文件 | 版本化期望状态 | 需要持续维护迁移 |\n\n生产平台通常更适合提交完整、版本化的环境 Values，并在升级前通过 schema 和渲染验证。reset 与 reuse 是否能同时使用、冲突时行为如何，应以目标版本帮助为准。\n\n#### `--force` 不是常规修复\n\n强制更新可能通过替换策略重建资源，会触发不可用、不可变字段变化和新身份。只有审阅具体资源、确认数据与流量影响后才使用。大多数不可变字段问题应通过显式迁移、重命名或运维窗口处理。\n\n#### 原子升级与清理\n\n`--atomic` 在升级失败时尝试回滚到上一修订；`--cleanup-on-fail` 可清理由失败升级新创建的资源。两者都不能撤销外部副作用，也不能保证有状态应用数据回到旧格式。\n\n数据库 schema 一旦向前迁移，回滚旧 Pod 可能无法工作。Chart 应将破坏性迁移设计为独立、可审计步骤，并提供向前修复策略。\n\n#### `helm rollback`：回到历史修订\n\n```text\nhelm rollback RELEASE [REVISION] [flags]\n```\n\n先查询历史并确认目标：\n\n```bash\nhelm history web -n production --max 20\nhelm get values web -n production --revision 3 --all -o yaml\nhelm get manifest web -n production --revision 3\nhelm rollback web 3 -n production --wait --timeout 10m\n```\n\n省略或使用特殊修订号的行为应以目标版本帮助为准，自动化最好始终显式写目标 revision。回滚本身会产生新的修订，并不是删除中间历史。\n\n#### 回滚前检查\n\n1. 旧 Chart 是否还使用目标集群已删除的 API；\n2. 数据库和存储格式是否向后兼容；\n3. 旧镜像是否仍可拉取且未被重写；\n4. CRD schema 是否允许旧资源字段；\n5. Hook 是否会再次发送通知或执行迁移；\n6. 流量和副本变化是否需要单独操作。\n\n`--no-hooks` 可以跳过 Hook，但可能绕过 Chart 作者预期的恢复步骤；是否使用要基于具体 Hook 分析。\n\n#### `helm uninstall`：删除 Release 管理的资源\n\n```text\nhelm uninstall RELEASE [...] [flags]\n```\n\n```bash\nhelm uninstall web -n production --dry-run\nhelm uninstall web -n production --wait --timeout 10m\n```\n\n一次可传多个 Release 时，自动化仍建议逐个处理并记录结果，避免一个失败掩盖其他对象的状态。\n\n`--keep-history` 保留 Release 历史并把状态标记为已卸载，方便审计，但会占用存储并影响同名 Release 后续操作。默认删除历史后，Helm 无法再通过该记录回滚。\n\n#### 级联删除与残留资源\n\n删除传播策略影响 ownerReference 管理的下游对象。前台删除会等待依赖清理，后台删除更快返回，孤儿策略会保留下游对象；具体参数值应与 Kubernetes 删除语义对应。\n\n卸载后检查：\n\n```bash\nhelm list -n production --all\nkubectl get all,cm,secret,pvc -n production \\\n  -l app.kubernetes.io/instance=web\nkubectl get events -n production --sort-by=.lastTimestamp\n```\n\nCRD 通常不会随应用 Release 自动删除，因为它可能服务多个实例。PVC、keep 资源和 Hook 资源也可能保留；是否删除必须由数据保留策略决定。\n\n#### 生命周期选择表\n\n| 目标 | 首选命令 | 不应混淆为 |\n| --- | --- | --- |\n| 首次创建 Release | `install` | `template` 不会创建资源 |\n| 存在则升级、不存在则安装 | `upgrade --install` | 不能吞掉读取权限错误 |\n| 恢复到历史版本 | `rollback REVISION` | 不是重新安装旧 Chart 包 |\n| 删除 Release | `uninstall` | 不保证删除外部数据与 CRD |\n| 仅预览 | dry-run/template | 不证明运行时就绪 |", "subs": ["helm install", "安装前的模拟", "等待、超时与原子安装", "Values 的命令行入口", "CRD 与 namespace", "helm upgrade", "--install 的便利与边界", "reset、reuse 与显式配置", "--force 不是常规修复", "原子升级与清理", "helm rollback", "回滚前检查", "helm uninstall", "级联删除与残留资源", "生命周期选择表"]}, {"title": "查看 Release 列表、状态和修订历史", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-list.md; e8ddd95ed0cc1bbe/helm-status.md; e8ddd95ed0cc1bbe/helm-history.md -->\n\n```bash\nhelm list -A --all --output table\nhelm status web -n production --output yaml\nhelm history web -n production --max 20\n```\n\n`list` 默认受命名空间和状态过滤影响；排障时先确认是否漏了 `-A` 或 `--all`。状态可能包括 deployed、failed、superseded、pending-install、pending-upgrade、pending-rollback、uninstalling 和 uninstalled。\n\n#### `helm list`：先理解默认过滤\n\n```text\nhelm list [flags]\n```\n\n常用查询：\n\n```bash\nhelm list -n production\nhelm list -A --all\nhelm list -n production --failed\nhelm list -n production --pending\nhelm list -n production --filter '^web-' --output json\n```\n\n`--all-namespaces` 需要跨 namespace 读取 Release 存储的权限。空结果可能表示目标 namespace 没有 Release，也可能是过滤、分页或权限导致。\n\n#### 状态过滤与输出\n\n`--deployed`、`--failed`、`--pending`、`--uninstalled` 等状态选项适合排障；具体可组合性以当前帮助为准。自动化使用 JSON/YAML 输出，不要解析对齐后的表格。\n\n列表可以按名称或更新时间排序并限制数量。大量 Release 环境要设计分页；排序反转后分页游标的含义也会变化，脚本应固定完整参数。\n\n#### `helm status`：看一个 Release 的当前视图\n\n```text\nhelm status RELEASE [flags]\n```\n\n它通常展示状态、namespace、revision、更新时间、资源摘要、Notes 和测试信息。使用 `--revision` 可以查看历史修订状态：\n\n```bash\nhelm status web -n production --revision 3 -o yaml\n```\n\nStatus 来自 Release 记录和相关查询，不等价于完整健康检查。仍要观察 Deployment condition、Pod、Event、Service Endpoint 和业务探针。\n\n某些版本提供显示资源或隐藏 Notes 的选项。包含资源详情时输出可能很大且含敏感信息，应限制日志保存范围。\n\n#### `helm history`：建立时间线\n\n```text\nhelm history RELEASE [flags]\n```\n\n每一行包含 revision、更新时间、状态、Chart 和描述。典型时间线：\n\n```text\n1  superseded  初次安装\n2  superseded  升级到 1.4.0\n3  failed      Hook 超时\n4  deployed    回滚到 revision 2 产生的新修订\n```\n\n历史长度受 `--history-max` 或 `HELM_MAX_HISTORY` 等设置影响。被裁剪的修订无法再直接回滚，因此合规环境要把发布元数据和制品另行归档。\n\n#### pending 状态的处理\n\n发现 pending-install、pending-upgrade 或 pending-rollback 时：\n\n1. 确认是否仍有 Helm 进程或流水线在运行；\n2. 查看 Hook Job、Pod、Event 和 API Server 错误；\n3. 检查操作是否因客户端断开而后台仍继续；\n4. 导出 Release 历史和存储对象作为证据；\n5. 再决定等待、回滚或人工修复。\n\n不要未经确认直接删除 Release Secret 来“解锁”，这会破坏状态历史。", "subs": ["helm list", "状态过滤与输出", "helm status", "helm history", "pending 状态的处理"]}, {"title": "获取 Release 的 Values、Manifest、Hook、Notes 与元数据", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-get.md; e8ddd95ed0cc1bbe/helm-get-all.md; e8ddd95ed0cc1bbe/helm-get-hooks.md; e8ddd95ed0cc1bbe/helm-get-manifest.md; e8ddd95ed0cc1bbe/helm-get-metadata.md; e8ddd95ed0cc1bbe/helm-get-notes.md; e8ddd95ed0cc1bbe/helm-get-values.md -->\n\n| 命令 | 回答的问题 |\n| --- | --- |\n| `helm get values` | 用户提供了哪些值，或加 `--all` 看计算值 |\n| `helm get manifest` | 该修订渲染出了什么资源 |\n| `helm get hooks` | 发布包含哪些 Hook |\n| `helm get notes` | Chart 作者给出的操作说明是什么 |\n| `helm get metadata` | Release 元数据是什么 |\n| `helm get all` | 一次获取上述主要内容 |\n\n```bash\nhelm get values web -n production --all -o yaml\nhelm get manifest web -n production --revision 3\nhelm get all web -n production --revision 3\n```\n\n比较故障前后修订时，先导出同类内容再做差异，避免把用户 Values 与计算 Values 混为一谈。\n\n#### `get values`：区分用户值与计算值\n\n```text\nhelm get values RELEASE [flags]\n```\n\n不带 `--all` 时重点是用户提交的 Values；带 `--all` 时包含与 Chart 默认值合并后的计算结果。二者用途不同：\n\n```bash\nhelm get values web -n production -o yaml > user-values.yaml\nhelm get values web -n production --all -o yaml > computed-values.yaml\n```\n\n迁移到新 Chart 版本时，不应把旧 computed Values 原样当作新用户 Values，否则旧默认值会被永久固化。\n\n#### `get manifest`：查看 Helm 保存的渲染结果\n\n```bash\nhelm get manifest web -n production --revision 4 > revision-4.yaml\n```\n\n它适合与新渲染结果、历史修订和 live 对象比较。注意 Kubernetes 默认值、Admission 变换、控制器写回和人工修改不会完整反映在保存的 Manifest 中。\n\n```text\nHelm Manifest vs 新渲染结果  -> 发布输入变化\nHelm Manifest vs live object -> 集群默认/准入/控制器/人工漂移\n```\n\n#### `get hooks`\n\nHook 输出帮助定位 pre-install、post-upgrade、test 等资源的定义、权重和删除策略。它展示定义，不保证 Hook 资源仍存在；若删除策略已经清理 Job，应结合流水线日志和事件系统追踪。\n\n#### `get notes`\n\nNotes 是 Chart 作者根据 Values 渲染的使用说明，常包含访问方法、初始化命令和警告。自动化可以展示给操作者，但不能把 Notes 中的命令无审查执行。\n\n#### `get metadata`\n\n元数据适合轻量查询 Release 名、namespace、revision、状态、Chart 版本和部署时间。若平台只需要列表摘要，不必总是拉取完整 Manifest 和 Values。\n\n#### `get all`\n\n`get all` 便于人工采集一次性诊断包，但输出面广，可能包含 Secret、Values、Hook 和 Notes。应写入权限受控的临时文件，脱敏后再共享。\n\n```bash\numask 077\nhelm get all web -n production --revision 4 > web-r4-diagnostic.txt\n```\n\n#### 修订差异操作\n\n```bash\nhelm get values web -n production --revision 3 --all -o yaml > r3-values.yaml\nhelm get values web -n production --revision 4 --all -o yaml > r4-values.yaml\ndiff -u r3-values.yaml r4-values.yaml\n\nhelm get manifest web -n production --revision 3 > r3.yaml\nhelm get manifest web -n production --revision 4 > r4.yaml\ndiff -u r3.yaml r4.yaml\n```\n\n结构化 YAML 的键顺序可能产生噪声；严谨比较可先解析并规范化，但要保留原始文件供审计。", "subs": ["get values", "get manifest", "get hooks", "get notes", "get metadata", "get all", "修订差异操作"]}, {"title": "执行 Release 测试并判断失败位置", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-test.md -->\n\n```bash\nhelm test web -n production --logs --timeout 10m\nhelm test web -n production --filter name=smoke --logs\n```\n\n测试失败后检查测试 Pod/Job、日志、Event、Service 和 NetworkPolicy。测试进程退出 0 只证明测试定义覆盖的断言通过，不代表完整业务验收。\n\n#### 测试是带 Hook 注解的工作负载\n\nChart Test 通常定义 Pod 或 Job，并使用测试 Hook 注解。它可以验证 DNS、Service、HTTP、数据库连接或迁移结果。测试镜像、ServiceAccount 和网络权限也属于 Chart 的供应链与权限面。\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: \"{{ include \\\"web.fullname\\\" . }}-smoke\"\n  annotations:\n    \"helm.sh/hook\": test\nspec:\n  restartPolicy: Never\n  containers:\n    - name: curl\n      image: curlimages/curl:8.12.1\n      command: [\"curl\"]\n      args: [\"--fail\", \"http://web/healthz\"]\n```\n\n镜像版本应固定，测试不能依赖交互输入。成功条件必须由进程退出码表达。\n\n#### 过滤和日志\n\n```bash\nhelm test web -n production \\\n  --filter name=smoke \\\n  --logs \\\n  --timeout 10m\n```\n\n过滤器可在大型 Chart 中选择测试子集，语法以目标版本帮助为准。`--logs` 便于 CI 收集证据，但日志可能包含响应正文和凭据，应在测试代码中脱敏。\n\n#### 清理策略\n\n测试资源是否在成功或失败后删除由 Hook 删除策略和 Helm 参数共同影响。排障需要保留失败 Pod 时，不要让删除策略过早清理；长期环境又不能无限堆积测试 Job。可以在 CI 保存日志和描述后再显式清理。\n\n#### 分层诊断\n\n```text\n测试对象未创建 -> Hook 注解、模板、RBAC、Admission\n对象 Pending    -> 调度、配额、PVC、镜像拉取\n对象 Running    -> DNS、Service、NetworkPolicy、依赖可达性\n对象 Failed     -> 容器退出码与日志\nHelm 超时       -> Job 未结束、删除阻塞、timeout 太短\n```\n\n测试通过后仍需监控业务 SLI。Chart Test 更适合作为发布门中的一层，而不是唯一验收。", "subs": ["测试是带 Hook 注解的工作负载", "过滤和日志", "清理策略", "分层诊断"]}]}, {"title": "第十四章 · 配置 CLI、自动补全与插件命令", "sections": [{"title": "查询 Helm 根命令、版本、环境与常用速查操作", "content": "<!-- src: e8ddd95ed0cc1bbe/helm.md; e8ddd95ed0cc1bbe/helm-version.md; e8ddd95ed0cc1bbe/helm-env.md; d6e98726a5cdc436/Cheat-Sheet.md -->\n\n```bash\nhelm help\nhelm version --short\nhelm env\nhelm COMMAND --help\n```\n\n常用环境变量包括：\n\n| 环境变量 | 用途 |\n| --- | --- |\n| `HELM_CACHE_HOME` | 缓存根目录 |\n| `HELM_CONFIG_HOME` | 配置根目录 |\n| `HELM_DATA_HOME` | 数据根目录 |\n| `HELM_NAMESPACE` | 默认命名空间 |\n| `HELM_DRIVER` | Secret、ConfigMap、Memory 或 SQL 存储驱动 |\n| `HELM_MAX_HISTORY` | 最大历史修订数 |\n| `HELM_REGISTRY_CONFIG` | Registry 凭据配置路径 |\n| `HELM_REPOSITORY_CACHE` | 传统仓库索引缓存路径 |\n| `HELM_REPOSITORY_CONFIG` | 传统仓库列表配置路径 |\n| `KUBECONFIG` | Kubernetes 连接配置 |\n\n全局参数如 `--kube-context`、`--namespace`、`--kubeconfig`、`--debug` 会影响许多子命令。自动化中显式设置 context 和 namespace，避免依赖交互式环境的隐含默认值。\n\n#### 根命令是全局行为入口\n\n```text\nhelm [command]\n```\n\n`helm help` 列出命令组，`helm help COMMAND` 与 `helm COMMAND --help` 用于查看目标版本的语法。命令文档可能来自另一版本，最终以当前二进制帮助为准。\n\n常见全局选项可分为四类：\n\n| 类别 | 示例 | 风险控制 |\n| --- | --- | --- |\n| 集群定位 | `--kubeconfig`、`--kube-context`、`--namespace` | 自动化全部显式设置 |\n| 认证与模拟 | impersonation、token、CA、TLS server name | 避免凭据出现在命令历史 |\n| 客户端性能 | QPS、burst、timeout | 不用提高限流掩盖 API Server 故障 |\n| 诊断 | `--debug` | 输出可能包含敏感内容 |\n\n不要在脚本里依赖“当前 context”。即使命令只做读取，错误集群上的 `list` 也可能泄露环境信息；写命令则可能直接造成事故。\n\n#### `helm version`：确认客户端身份\n\n```text\nhelm version [flags]\n```\n\n```bash\nhelm version\nhelm version --short\nhelm version --template '{{ .Version }}'\n```\n\n完整输出适合人工诊断，短输出适合日志，模板输出适合脚本。若发行版带 Git commit、dirty 标记或构建元数据，也应纳入问题报告。\n\nHelm 3/4 不依赖集群内 Tiller，因此 version 主要报告客户端构建；它不能证明 kubeconfig 可用。连接测试仍需执行受控的集群读取。\n\n#### `helm env`：解释配置从哪里来\n\n```text\nhelm env [flags]\n```\n\n其输出展示 Helm 解析后的关键路径和默认值。排查“同一命令不同机器结果不同”时，保存以下基线：\n\n```bash\nhelm version --short\nhelm env\nkubectl config current-context\nhelm repo list -o yaml\nhelm plugin list\n```\n\n分享 `helm env` 前检查是否含用户名、目录结构或内部地址。路径差异常常解释仓库列表、Registry 凭据和插件发现差异。\n\n#### XDG 路径的分工\n\n| 逻辑目录 | 典型内容 | 是否适合跨任务共享 |\n| --- | --- | --- |\n| Cache | 仓库索引、下载缓存 | 可缓存，但要防过期和污染 |\n| Config | repositories、Registry 配置 | 含连接与凭据信息，严格保护 |\n| Data | 插件等持久数据 | 与 Helm/插件版本绑定 |\n\nCI 中可以给每个任务设置独立根目录，避免并行任务互相覆盖配置。只缓存仓库索引时，不要连带上传 Registry 凭据。\n\n#### `HELM_DRIVER` 与历史\n\n修改 `HELM_DRIVER` 会让同一个集群和 namespace 看到另一套 Release 存储。突然“所有 Release 消失”时，应比较当前 driver 与旧环境，而不是立即重新安装同名 Release。\n\nSQL 驱动还需要数据库连接配置。连接串和密码应来自秘密注入，不能出现在 `helm env` 的公开采集物中。\n\n#### 自动化前置检查\n\n```bash\nset -euo pipefail\n\nexpected_context='prod-ap-southeast'\nactual_context=\"$(kubectl config current-context)\"\ntest \"$actual_context\" = \"$expected_context\"\n\nhelm version --short\nhelm list --kube-context \"$expected_context\" \\\n  --namespace production --all\n```\n\n这是示意性防呆，真实流水线还应校验集群 UID 或 API Server 地址，避免同名 context 指向错误集群。\n\n#### 输出格式与脚本稳定性\n\n支持 `-o json|yaml` 的命令应使用结构化输出。脚本不要依赖表格列宽、颜色和自然语言错误文本；应检查退出码，再解析稳定字段。\n\n命令升级后回归结构化 schema。即使 JSON 仍合法，字段增加、状态枚举扩展或时间格式变化也可能影响严格解析器。\n\n#### 调试信息的使用边界\n\n`--debug` 能显示 Chart 定位、渲染和 Kubernetes 操作细节，但也可能输出 Values、Manifest、Secret 或内部 URL。生产排障建议：\n\n1. 写入权限为 0600 的临时文件；\n2. 记录采集时间、命令版本和目标 context；\n3. 在分享前脱敏 token、Secret data、密码和证书；\n4. 问题结束后按保留策略销毁原始采集物。\n\n#### 常见症状快速定位\n\n| 症状 | 首查 |\n| --- | --- |\n| 找不到 Release | namespace、`helm list -A --all` |\n| 找不到 Chart | `repo list`、`repo update`、引用和版本 |\n| 模板 YAML 错误 | `lint`、`template --debug`、缩进和类型 |\n| API 不支持 | `kubectl api-resources`、`kubeVersion`、废弃 API |\n| 一直 pending | Hook、Event、权限、`--timeout` |\n| 升级后配置未变 | `get values --all`、Values 优先级、渲染 Manifest |\n| OCI push 被拒 | Registry 登录、路径权限、仓库是否存在 |\n\n#### 一套可重复的排障采集\n\n```bash\nhelm version --short\nhelm env\nhelm list -A --all -o yaml\nhelm history web -n production\nhelm status web -n production -o yaml\nhelm get values web -n production --all -o yaml\n```\n\n以上输出不应直接粘贴到公开 Issue。先缩小到目标 Release，并清除敏感字段。命令失败时同时记录退出码和 stderr；只有 stdout 可能丢掉真正原因。\n\n#### 从症状走向根因\n\n```mermaid\nflowchart TD\n    S[命令失败] --> C{Chart 定位成功?}\n    C -- 否 --> R[仓库/OCI/版本/认证]\n    C -- 是 --> T{模板成功?}\n    T -- 否 --> V[Values/Schema/模板作用域]\n    T -- 是 --> A{API 校验成功?}\n    A -- 否 --> K[权限/API 版本/准入策略]\n    A -- 是 --> W{工作负载就绪?}\n    W -- 否 --> O[Pod/Event/存储/网络/Hook]\n    W -- 是 --> B[业务测试与监控]\n```\n\n每次只跨过一个证据门，避免把“Pod 不就绪”误诊为 Chart 下载问题。", "subs": ["根命令是全局行为入口", "helm version", "helm env", "XDG 路径的分工", "HELM_DRIVER 与历史", "自动化前置检查", "输出格式与脚本稳定性", "调试信息的使用边界", "常见症状快速定位", "一套可重复的排障采集", "从症状走向根因"]}, {"title": "为 Bash、Zsh、Fish 和 PowerShell 配置自动补全", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-completion.md; e8ddd95ed0cc1bbe/helm-completion-bash.md; e8ddd95ed0cc1bbe/helm-completion-zsh.md; e8ddd95ed0cc1bbe/helm-completion-fish.md; e8ddd95ed0cc1bbe/helm-completion-powershell.md -->\n\n```bash\n# Bash current session\nsource <(helm completion bash)\n\n# Zsh current session\nsource <(helm completion zsh)\n\n# Fish persistent\nhelm completion fish > ~/.config/fish/completions/helm.fish\n```\n\n```powershell\nhelm completion powershell | Out-String | Invoke-Expression\n```\n\n持久化位置取决于 shell 和系统。补全未生效时检查补全框架是否加载、文件是否处于搜索路径、是否开启了新会话；需要精简提示可使用 `--no-descriptions`。\n\n#### Bash\n\n当前会话可直接 source：\n\n```bash\nsource <(helm completion bash)\n```\n\n持久化方式取决于发行版使用 bash-completion v1 还是 v2。常见做法是把生成文件放进系统或用户 completion 目录，再启动新 shell：\n\n```bash\nhelm completion bash > /path/in/bash_completion.d/helm\n```\n\n写系统目录可能需要管理员权限；个人机器优先使用用户目录。不要每次按 Tab 都重新执行网络或慢命令。\n\n#### Zsh\n\nZsh 必须先初始化补全系统，并确保生成文件所在目录位于 `fpath`：\n\n```zsh\nmkdir -p ~/.zfunc\nhelm completion zsh > ~/.zfunc/_helm\nfpath=(~/.zfunc $fpath)\nautoload -Uz compinit\ncompinit\n```\n\n若使用 Oh My Zsh、prezto 等框架，应遵循框架目录和加载顺序。出现 `command not found: compdef` 通常表示 `compinit` 尚未执行。\n\nZsh 的安全审计可能拒绝权限过宽的 completion 目录。修复目录所有者和写权限，不建议长期使用跳过安全检查的选项。\n\n#### Fish\n\nFish 从用户 completions 目录自动加载：\n\n```fish\nmkdir -p ~/.config/fish/completions\nhelm completion fish > ~/.config/fish/completions/helm.fish\n```\n\n环境变量 `XDG_CONFIG_HOME` 被修改时，实际目录也会变化。用 `status --current-filename` 等 Fish 工具确认文件是否加载。\n\n#### PowerShell\n\n当前会话：\n\n```powershell\nhelm completion powershell | Out-String | Invoke-Expression\n```\n\n持久化时把初始化片段加入 `$PROFILE`，并确认执行策略允许加载个人配置。生成脚本应与当前 Helm 版本匹配；升级 Helm 后重新生成。\n\n#### `--no-descriptions`\n\n四种 shell 的 completion 命令通常都可关闭候选描述。远程终端或补全框架显示异常时，这可以减少输出体积，但不会修复 PATH、fpath 或加载顺序问题。\n\n#### 补全故障检查表\n\n| 现象 | 检查 |\n| --- | --- |\n| `helm` 本身无候选 | Helm 是否在 PATH、脚本是否加载 |\n| 子命令有、动态对象无 | kubeconfig、权限、网络、插件补全能力 |\n| 新版本命令不出现 | 重新生成 completion 并开启新会话 |\n| 启动 shell 报错 | profile 语法、生成脚本与 shell 类型 |\n| 补全很慢 | 动态查询、网络超时、插件实现 |\n| Zsh 拒绝目录 | 所有者和写权限不安全 |\n\n补全只是效率工具，不是命令校验。执行前仍要读完整命令，尤其是 namespace、Release 名和删除参数。", "subs": ["Bash", "Zsh", "Fish", "PowerShell", "--no-descriptions", "补全故障检查表"]}, {"title": "安装、列出、打包、更新、校验和卸载插件", "content": "<!-- src: e8ddd95ed0cc1bbe/helm-plugin.md; e8ddd95ed0cc1bbe/helm-plugin-install.md; e8ddd95ed0cc1bbe/helm-plugin-list.md; e8ddd95ed0cc1bbe/helm-plugin-package.md; e8ddd95ed0cc1bbe/helm-plugin-update.md; e8ddd95ed0cc1bbe/helm-plugin-verify.md; e8ddd95ed0cc1bbe/helm-plugin-uninstall.md -->\n\n```bash\nhelm plugin install https://example.com/acme-plugin --version 1.2.0\nhelm plugin list\nhelm plugin verify ./acme-plugin\nhelm plugin package ./acme-plugin --destination dist\nhelm plugin update acme-plugin\nhelm plugin uninstall acme-plugin\n```\n\n插件问题可按以下顺序定位：`helm plugin list` 确认名称和版本，`helm env` 查看插件目录，检查 `plugin.yaml` API 与 Helm 主版本兼容性，再直接执行插件入口观察退出码。插件能继承敏感环境和 Kubernetes 访问能力，来源不明时不要安装。\n\n#### `plugin install`\n\n```text\nhelm plugin install PATH_OR_URL [flags]\n```\n\n来源可以是本地目录或远程仓库，实际能力随 Helm 插件 API 版本变化。远程安装应固定版本或引用，并在隔离环境检查 install Hook：\n\n```bash\nhelm plugin install https://example.com/acme-plugin \\\n  --version 1.2.0\n```\n\n安装完成不代表可信。至少执行 `plugin list`、manifest 校验、`PLUGIN --help` 和无凭据烟雾测试。\n\n#### `plugin list`\n\n```text\nhelm plugin list [flags]\n```\n\n列表通常展示名称、版本、类型或描述。若磁盘中有目录但列表不显示，检查插件数据目录、manifest 文件名/schema、权限和目标 Helm 主版本。\n\n自动化盘点应同时记录插件包 digest；仅记录声明版本无法发现同版本内容被替换。\n\n#### `plugin verify`\n\n校验面向插件包或目录的结构与契约，具体要求依当前插件 API。它能发现 manifest 和打包问题，但不能证明代码没有恶意行为。\n\n```bash\nhelm plugin verify ./acme-plugin\n```\n\n开发流水线应在每个支持平台产物上执行，而不是只验证源码目录。\n\n#### `plugin package`\n\n```text\nhelm plugin package PATH [flags]\n```\n\n打包前清除构建缓存、测试凭据和本地配置，确认二进制架构与 manifest 声明一致：\n\n```bash\nhelm plugin verify ./acme-plugin\nhelm plugin package ./acme-plugin --destination dist\n```\n\n对包计算 digest 或签名，并在另一台干净机器验证安装。不要把源码目录能运行等同于发布包完整。\n\n#### `plugin update`\n\n更新可能拉取新代码、运行 update Hook 并替换入口。执行前记录旧版本和 digest，阅读 changelog 与权限变化，准备回退包。\n\n```bash\nhelm plugin update acme-plugin\nhelm plugin list\nhelm acme-plugin --help\n```\n\n生产 CI 镜像更适合通过镜像版本升级插件，而不是在任务开始时拉取最新版。\n\n#### `plugin uninstall`\n\n```text\nhelm plugin uninstall NAME [...] [flags]\n```\n\n卸载会移除 Helm 管理的插件文件，并可能运行删除 Hook。它不会自动撤销云端 token、删除插件创建的集群资源或清理散落在其他目录的缓存。\n\n卸载后检查插件目录和凭据系统；若插件曾拥有生产访问权，应按离职式流程撤销或轮换凭据。\n\n#### 插件命令风险分级\n\n| 操作 | 状态变化 | 建议控制 |\n| --- | --- | --- |\n| list | 只读 | 可用于常规盘点 |\n| verify | 通常只读，但会解析不可信内容 | 隔离目录运行 |\n| package | 写本地制品 | 使用干净输出目录 |\n| install | 下载并执行潜在 Hook | 来源审批、固定版本、沙箱测试 |\n| update | 替换已信任代码 | 变更审查、回退包、回归测试 |\n| uninstall | 删除插件并可能执行 Hook | 先盘点外部资源和凭据 |\n\n#### 插件与 Helm 主版本兼容\n\n插件 API、manifest 字段、运行时和命令组在 Helm 主版本间可能变化。升级 Helm 前先建立矩阵：\n\n```text\n插件名 | 插件版本 | 插件 API | Helm 版本 | OS/Arch | 验证结果\n```\n\n逐个执行 list、verify、help 和核心无副作用命令，再在非生产集群做完整集成测试。某个 CLI 插件能启动，不代表它内部调用的旧 Helm 库仍与 Release 存储兼容。\n\n#### 插件事故响应\n\n若怀疑插件被篡改：停止执行，保存插件目录和 digest，隔离相关 Runner，轮换插件可访问的 Registry、云和 Kubernetes 凭据，审计它运行期间的集群与网络活动。只执行 uninstall 会丢失部分取证材料，也不会撤销已泄露凭据。", "subs": ["plugin install", "plugin list", "plugin verify", "plugin package", "plugin update", "plugin uninstall", "插件命令风险分级", "插件与 Helm 主版本兼容", "插件事故响应"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
