<script id="data" type="application/json">{"title": "Helm 学习笔记 · 第二册：Chart 开发与最佳实践", "intro": "> **适用对象**：Chart 作者、平台工程师和负责 Kubernetes 应用标准化交付的运维人员<br>\n> **学习目标**：从 Chart 结构出发，掌握 Go 模板、Values、依赖、复用、测试和生产质量约束。<br>\n> **版本说明**：材料以 Helm 4 文档快照为基础；标有上游兼容提醒的功能应通过 `helm lint`、`helm template` 和真实目标集群复核。", "parts": [{"title": "第四章 · 理解并创建一个规范的 Chart", "sections": [{"title": "从目录结构认识 Chart 的组成", "content": "<!-- src: 340051e0e422d4f0/Charts.md; 7c8a04233466d18e/Getting-Started.md -->\n\nChart 是遵循约定目录结构的一组文件。`helm create mychart` 可生成起点，但生产 Chart 应删除无关样例并按应用实际资源重建。\n\n```text\nmychart/\n├── Chart.yaml\n├── LICENSE\n├── README.md\n├── values.yaml\n├── values.schema.json\n├── charts/\n├── crds/\n└── templates/\n    ├── _helpers.tpl\n    ├── deployment.yaml\n    ├── service.yaml\n    ├── NOTES.txt\n    └── tests/\n```\n\n| 路径 | 职责 |\n| --- | --- |\n| `Chart.yaml` | Chart 身份、版本、兼容性和依赖 |\n| `values.yaml` | 用户可覆盖的默认配置 |\n| `values.schema.json` | 对 Values 做结构与类型校验 |\n| `templates/` | 渲染为 Kubernetes Manifest 的模板 |\n| `charts/` | 下载或随包携带的依赖 Chart |\n| `crds/` | 安装阶段优先创建、但不经过模板渲染的 CRD |\n\n第一个模板可以只是普通 YAML；加入 `{{ .Release.Name }}` 等动作后才开始动态化：\n\n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: {{ .Release.Name }}-config\ndata:\n  mode: {{ .Values.mode | quote }}\n```\n\n#### 保留目录与普通文件的处理规则\n\nHelm 对 `templates/`、`charts/` 和 `crds/` 有特殊语义。Chart 中其他文件会随包分发，但不会自动渲染为 Kubernetes 对象。它们可以被 `.Files` 读取，或作为 README、LICENSE 和配置片段存在。\n\n`templates/` 下以下划线开头的文件通常用于 helper，不直接生成 Manifest；`NOTES.txt` 会被渲染但不提交给 Kubernetes；空模板和只包含注释的模板不会产生资源。\n\n#### 从脚手架开始的正确步骤\n\n```bash\nhelm create web\nfind web -maxdepth 3 -type f | sort\nhelm lint web\nhelm template demo web\n```\n\n脚手架只是示范，不代表生产默认值。创建后逐项检查：\n\n- ServiceAccount 与 RBAC 是否确实需要创建。\n- Service 默认类型是否应为 ClusterIP。\n- Ingress API 与字段是否匹配支持的 Kubernetes 版本。\n- `resources`、探针、securityContext 和 PodDisruptionBudget 是否提供合理接口。\n- 测试 Pod 使用的镜像和网络访问是否适合离线环境。\n\n#### 一个模板如何变成多文档 Manifest\n\nHelm 会按模板文件读取内容，并在输出中加入 `# Source: CHART/templates/FILE` 注释。一个模板文件可以通过 `---` 生成多个 YAML 文档，但为了错误定位和代码审查，通常每个资源单独文件更清晰。\n\n```yaml\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: {{ include \"web.fullname\" . }}\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: {{ include \"web.fullname\" . }}\n```\n\n#### `crds/` 与 `templates/` 的顺序差异\n\n`crds/` 中的 CRD 是普通 YAML，不能使用模板动作。安装时 Helm 先提交 CRD，等待 API 可发现，再渲染和提交其余资源。CRD 实例放在 `templates/` 中，才能使用 Values。已有 CRD 不会在普通升级中自动更新，这一边界需要独立治理。", "subs": ["保留目录与普通文件的处理规则", "从脚手架开始的正确步骤", "一个模板如何变成多文档 Manifest", "crds/ 与 templates/ 的顺序差异"]}, {"title": "正确维护 Chart.yaml、版本和类型", "content": "<!-- src: 340051e0e422d4f0/Charts.md; ff38f0b4059545ea/General-Conventions.md -->\n\n```yaml\napiVersion: v2\nname: web-platform\ndescription: Web platform deployment chart\ntype: application\nversion: 1.4.0\nappVersion: \"2.8.1\"\nkubeVersion: \">=1.30.0 <1.34.0\"\nmaintainers:\n  - name: platform-team\nannotations:\n  example.com/source-revision: abc123\n```\n\n`version` 是 Chart 自身的 SemVer，决定包名和依赖选择；`appVersion` 是应用版本信息，不参与 Chart 版本计算，建议加引号。Chart 内容发生可观察变化时应递增 `version`。`application` Chart 可安装，`library` Chart 只提供模板能力。\n\n命名使用小写字母、数字和连字符，不用大写、下划线或点；YAML 使用两个空格，禁止 Tab。自定义元数据放进 `annotations`，不要随意增加 `Chart.yaml` 顶层字段。\n\n#### `apiVersion`、`type` 与兼容性\n\n现代 Chart 使用 `apiVersion: v2`，依赖直接声明在 `Chart.yaml`。`type` 缺省为 `application`；`library` Chart 只提供可复用定义，不能独立安装。把 application 改为 library 后，其中的普通资源模板不会作为对象输出。\n\n#### 版本字段分别服务于什么\n\n| 字段 | 约束 | 谁会读取 | 变化时机 |\n| --- | --- | --- | --- |\n| `version` | SemVer | Helm、仓库索引、依赖解析 | Chart 内容变化 |\n| `appVersion` | 推荐字符串，可非 SemVer | 用户界面、标签和说明 | 默认应用版本变化 |\n| `kubeVersion` | SemVer 约束 | 安装前兼容检查 | 支持矩阵变化 |\n\n`appVersion: 1.0` 如果不加引号可能被 YAML 当作数字，Git SHA 也可能被误解为科学计数形式。它不应被模板当作镜像 tag 的唯一来源，除非 Chart 明确设计了这一契约。\n\n#### 依赖条目的完整字段\n\n```yaml\ndependencies:\n  - name: database\n    alias: primary-db\n    version: \"~3.2.0\"\n    repository: oci://registry.example.com/charts\n    condition: primaryDb.enabled\n    tags: [database]\n    import-values:\n      - child: exports.connection\n        parent: databaseConnection\n```\n\n`alias` 允许同一依赖出现多次；`condition` 和 `tags` 控制启用；`import-values` 把子 Chart 明确导出的值映射到父 Chart。这些行为应在父 Chart README 中说明，避免用户只能阅读模板猜测。\n\n#### Chart 废弃流程\n\n废弃不是直接删除旧包。先在新版本中设置 `deprecated: true` 并递增版本，再发布该版本，最后停止维护源码。仓库中最新版本被标为 deprecated 时，客户端才能识别整个 Chart 已废弃。已安装 Release 的迁移方案要另行说明。", "subs": ["apiVersion、type 与兼容性", "版本字段分别服务于什么", "依赖条目的完整字段", "Chart 废弃流程"]}, {"title": "用 README、LICENSE、NOTES 和忽略规则完善交付物", "content": "<!-- src: 340051e0e422d4f0/Charts.md; 7c8a04233466d18e/Creating-a-NOTES.txt-File.md; 7c8a04233466d18e/The-.helmignore-file.md -->\n\nREADME 应说明用途、前提、Values、升级约束和示例；LICENSE 描述 Chart 模板代码的许可；`templates/NOTES.txt` 在安装、升级和 `helm status` 后输出简短的下一步操作。\n\n```text\nThank you for installing {{ .Chart.Name }}.\nRelease: {{ .Release.Name }}\nNamespace: {{ .Release.Namespace }}\n\nCheck status:\n  helm status {{ .Release.Name }} -n {{ .Release.Namespace }}\n```\n\n`.helmignore` 防止源码元数据、临时文件或敏感材料进入包：\n\n```gitignore\n.git\n.idea\n*.tmp\nsecrets/\ntests/fixtures/\n```\n\n它与 `.gitignore` 语义并不完全相同，例如材料指出 `**` 不受支持，且 `.helmignore` 不会自动忽略自身。打包后应使用 `tar -tzf` 检查实际内容。\n\n#### README 至少回答的使用问题\n\n1. Chart 安装什么应用，维护边界是什么。\n2. 支持哪些 Helm 与 Kubernetes 版本。\n3. 是否依赖 CRD、Ingress Controller、StorageClass 或外部 Secret。\n4. 最小安装示例和生产 Values 示例分别是什么。\n5. 哪些 Values 会创建集群级资源或改变数据持久化。\n6. 如何升级、备份、回滚和卸载。\n7. 已知限制、破坏性变更和安全建议是什么。\n\nValues 表格应从源码或 Schema 自动核对，避免 README 与默认值漂移。\n\n#### NOTES 应短而可执行\n\nNOTES 可以根据 Service 类型、Ingress 开关和 TLS 配置输出不同命令，但不要打印 Secret 明文。它适合告诉用户如何获得访问地址、查看状态和运行测试，不适合复制整份 README。\n\n```gotemplate\n{{- if .Values.ingress.enabled }}\nOpen https://{{ first .Values.ingress.hosts }}\n{{- else if eq .Values.service.type \"LoadBalancer\" }}\nkubectl get svc {{ include \"web.fullname\" . }} -n {{ .Release.Namespace }}\n{{- else }}\nkubectl port-forward svc/{{ include \"web.fullname\" . }} 8080:80 \\\n  -n {{ .Release.Namespace }}\n{{- end }}\n```\n\n#### 打包前检查忽略结果\n\n`.helmignore` 使用 Go `filepath.Match` 风格，材料同时指出它与 `.gitignore` 的否定规则存在差异。最可靠的方法不是靠记忆，而是实际打包后查看归档：\n\n```bash\nhelm package ./web --destination ./dist\ntar -tzf ./dist/web-1.0.0.tgz | sort\n```\n\n发现私钥、`.env`、本地 Values、测试凭据或 Git 元数据时，应先修正 `.helmignore` 再发布，不能只从已经上传的仓库删除索引。", "subs": ["README 至少回答的使用问题", "NOTES 应短而可执行", "打包前检查忽略结果"]}]}, {"title": "第五章 · 掌握 Go 模板语言与渲染上下文", "sections": [{"title": "从第一个模板理解渲染过程", "content": "<!-- src: 7c8a04233466d18e/Getting-Started.md -->\n\n模板动作放在 `{{` 与 `}}` 中。Helm 加载 Chart 和 Values，执行 `templates/` 下模板，将多个结果组成 Manifest，再提交给 Kubernetes。`helm get manifest` 可查看已发布版本，`helm template` 可查看本地渲染结果。\n\n```mermaid\ngraph LR\n    T[templates] --> E[Go Template Engine]\n    V[Values] --> E\n    B[Built in Objects] --> E\n    E --> Y[YAML Manifest]\n    Y --> K[Kubernetes API]\n```", "subs": []}, {"title": "使用内置对象读取 Release、Chart、Values 与集群信息", "content": "<!-- src: 7c8a04233466d18e/Built-in-Objects.md -->\n\n| 对象 | 常用成员 | 用途 |\n| --- | --- | --- |\n| `.Release` | `Name`、`Namespace`、`Revision`、`IsInstall` | 感知发布上下文 |\n| `.Values` | 用户与默认配置合并结果 | 驱动模板差异 |\n| `.Chart` | `Name`、`Version`、`AppVersion` | 生成标签和说明 |\n| `.Capabilities` | API 版本、Kubernetes 与 Helm 版本 | 兼容不同集群能力 |\n| `.Files` | `Get`、`Glob`、`AsConfig`、`AsSecrets` | 读取 Chart 普通文件 |\n| `.Template` | `Name`、`BasePath` | 定位当前模板 |\n| `.Subcharts` | 子 Chart 作用域 | 从父 Chart 读取子 Chart 上下文 |\n\n内置对象以大写字母开头。对可选配置先判断存在性，不要对空对象连续取值。\n\n#### `.Release` 的操作感知字段\n\n`.Release.IsInstall` 在安装时为真；`.Release.IsUpgrade` 在升级和回滚时为真。它们可以在确有兼容需要时控制资源，但如果同一 Chart 在安装与升级时生成完全不同的对象集合，会增加预测和测试难度。\n\n```gotemplate\nmetadata:\n  annotations:\n    release-revision: {{ .Release.Revision | quote }}\n    {{- if .Release.IsUpgrade }}\n    operation: upgrade\n    {{- else }}\n    operation: install\n    {{- end }}\n```\n\n#### `.Capabilities` 处理 API 差异\n\n```gotemplate\n{{- if .Capabilities.APIVersions.Has \"policy/v1/PodDisruptionBudget\" }}\napiVersion: policy/v1\n{{- else }}\n{{- fail \"policy/v1 PodDisruptionBudget is required\" }}\n{{- end }}\n```\n\n对已经被 Kubernetes 删除的旧 API，不应永久保留双分支；应提高 `kubeVersion` 并清理历史兼容代码。`.Capabilities.KubeVersion` 适合版本约束，具体资源能力优先用 `APIVersions.Has`。\n\n#### `.Template` 与 `.Subcharts`\n\n`.Template.Name` 给出当前模板的命名空间路径，`.Template.BasePath` 给出当前 Chart 的模板目录，可用于计算其他模板内容摘要。`.Subcharts` 允许父 Chart 查看子 Chart 的完整作用域，但这会增强耦合；稳定共享值优先使用 `global` 或明确导入契约。", "subs": [".Release 的操作感知字段", ".Capabilities 处理 API 差异", ".Template 与 .Subcharts"]}, {"title": "用函数、管道和操作符转换模板数据", "content": "<!-- src: 7c8a04233466d18e/Template-Functions-and-Pipelines.md; 7c8a04233466d18e/Template-Function-List.md -->\n\n管道把前一结果作为后一函数的最后一个参数：\n\n```yaml\ndata:\n  mode: {{ .Values.mode | default \"safe\" | upper | quote }}\n  config.yaml: |\n{{ .Values.config | toYaml | nindent 4 }}\n```\n\n常用函数族包括逻辑与比较、字符串、字典与列表、类型转换、编码、日期、加密摘要、正则、SemVer、YAML/JSON 序列化。选择原则是让输出清晰可预测，不要在模板里实现复杂业务逻辑。\n\n`lookup` 能查询在线集群对象；普通客户端 dry-run 不连接 API Server，需要服务端 dry-run 才能验证。依赖 `lookup` 会降低离线渲染的确定性，应记录权限和失败行为。\n\n#### 逻辑与默认值函数\n\n模板把以下值视为假：`false`、数值 0、空字符串、`nil`、空列表和空字典。逻辑函数可以组合这些判断：\n\n| 函数 | 作用 | 示例 |\n| --- | --- | --- |\n| `and` | 所有参数为真时返回最后一个参数 | `and .Values.enabled .Values.host` |\n| `or` | 返回第一个非空参数 | `or .Values.host \"localhost\"` |\n| `not` | 取反 | `not .Values.disabled` |\n| `eq` / `ne` | 相等或不等比较 | `eq .Values.mode \"prod\"` |\n| `lt` / `le` / `gt` / `ge` | 有序比较 | `ge .Values.replicas 2` |\n| `default` | 输入为空时使用默认值 | `default 1 .Values.replicas` |\n| `required` | 输入为空时中止渲染 | `required \"host is required\" .Values.host` |\n| `empty` | 判断值是否为空 | `empty .Values.resources` |\n| `fail` | 主动让模板失败 | `fail \"unsupported mode\"` |\n| `coalesce` | 返回第一个非空值 | `coalesce .Values.a .Values.b \"x\"` |\n| `ternary` | 根据布尔值二选一 | `ternary \"on\" \"off\" .Values.enabled` |\n\n静态默认值应写进 `values.yaml`，`default` 更适合根据 Release 名称等上下文计算的默认值。`required` 的错误信息应指出完整 Values 路径和期望格式。\n\n```gotemplate\n{{- $mode := .Values.mode | default \"standard\" -}}\n{{- if not (has $mode (list \"standard\" \"ha\")) -}}\n{{- fail (printf \"mode must be standard or ha, got %s\" $mode) -}}\n{{- end -}}\n```\n\n#### 字符串构造与清理\n\n| 函数组 | 典型用途 |\n| --- | --- |\n| `print`、`printf`、`println` | 拼接名称和错误消息 |\n| `trim`、`trimAll`、`trimPrefix`、`trimSuffix` | 清理用户输入 |\n| `lower`、`upper`、`title`、`untitle` | 统一大小写 |\n| `substr`、`trunc`、`abbrev` | 控制 Kubernetes 名称长度 |\n| `contains`、`hasPrefix`、`hasSuffix` | 条件判断 |\n| `replace` | 替换标签中不允许的字符 |\n| `quote`、`squote` | 生成 YAML 字符串 |\n| `indent`、`nindent` | 把多行输出嵌入 YAML |\n\n```gotemplate\n{{- define \"web.fullname\" -}}\n{{- printf \"%s-%s\" .Release.Name .Chart.Name | trunc 63 | trimSuffix \"-\" -}}\n{{- end -}}\n```\n\n`nindent 4` 会先添加换行再缩进四格，适合放在 `labels:` 或 `spec:` 之后；`indent 4` 只给已有各行增加缩进。二者混用不当是最常见的 YAML 损坏来源之一。\n\n随机字符串函数包括 `randAlphaNum`、`randAlpha`、`randNumeric` 和 `randAscii`。它们每次渲染都可能产生新值，因此不要直接用于希望跨升级保持稳定的 Secret。稳定凭据应从外部 Secret、已有对象或明确持久化输入取得。\n\n#### 字符串分割、列表和排序\n\n```gotemplate\n{{- $hosts := splitList \",\" (.Values.allowedHosts | default \"\") -}}\n{{- range $host := compact $hosts | uniq | sortAlpha }}\n- {{ $host | trim | quote }}\n{{- end }}\n```\n\n| 函数 | 说明 |\n| --- | --- |\n| `splitList` | 按分隔符生成列表 |\n| `join` | 把列表连接为字符串 |\n| `list` | 创建列表 |\n| `first` / `last` | 取首尾元素 |\n| `append` / `prepend` | 返回增加元素的新列表 |\n| `concat` | 合并多个列表 |\n| `reverse` | 反转列表 |\n| `uniq` | 去重 |\n| `without` | 排除指定元素 |\n| `has` | 判断元素是否在列表中 |\n| `compact` | 移除空值 |\n| `slice` | 取列表范围 |\n| `chunk` | 切分为固定大小分组 |\n\n许多函数还有 `mustXxx` 变体。普通变体可能在失败时返回空值或触发模板错误，`mustXxx` 会以可传播错误结束渲染。关键输入更适合显式失败，而不是悄悄生成不完整清单。\n\n#### 字典的创建、查询和合并\n\nHelm 模板中的字典是可变对象。`dict` 创建字典，`set` 和 `unset` 会修改它；因为函数需要返回值，通常用 `_` 接收不关心的返回值。\n\n```gotemplate\n{{- $labels := dict\n      \"app.kubernetes.io/name\" .Chart.Name\n      \"app.kubernetes.io/instance\" .Release.Name -}}\n{{- $_ := set $labels \"app.kubernetes.io/managed-by\" .Release.Service -}}\n{{- toYaml $labels | nindent 4 }}\n```\n\n| 函数 | 作用 |\n| --- | --- |\n| `get` | 按键读取，缺失时返回空值 |\n| `dig` | 沿嵌套键安全下钻并提供默认值 |\n| `hasKey` | 判断键是否存在 |\n| `pluck` | 从多个字典提取同名键 |\n| `keys` / `values` | 提取键或值列表 |\n| `pick` | 保留指定键 |\n| `omit` | 排除指定键 |\n| `merge` | 深度合并，以目标字典为优先 |\n| `mergeOverwrite` | 深度合并，右侧来源覆盖左侧 |\n| `deepCopy` | 避免嵌套对象共享引用 |\n\n合并复杂 Values 时要先确认优先方向。`merge` 与 `mergeOverwrite` 名称相似但覆盖规则不同；修改共享嵌套字典前先 `deepCopy`，否则 helper 可能意外改变后续模板看到的数据。\n\n#### 类型检查与转换\n\nYAML 解码后可能得到字符串、布尔、整数、浮点、列表或字典。模板函数不会自动把所有类型安全互换。\n\n```gotemplate\nreplicas: {{ .Values.replicaCount | int }}\nannotation: {{ .Values.buildNumber | toString | quote }}\n{{- if kindIs \"map\" .Values.extraLabels }}\n{{ toYaml .Values.extraLabels | nindent 4 }}\n{{- end }}\n```\n\n| 函数 | 用途 |\n| --- | --- |\n| `atoi`、`int`、`int64`、`float64` | 转换数值 |\n| `toString`、`toStrings` | 转成字符串或字符串列表 |\n| `typeOf`、`typeIs`、`typeIsLike` | 检查 Go 类型 |\n| `kindOf`、`kindIs` | 检查基础 kind |\n| `deepEqual` | 深度比较复杂对象 |\n\n类型转换失败不应靠默认零值掩盖。对公开 Values，优先用 `values.schema.json` 在模板执行前拒绝错误类型。\n\n#### YAML 与 JSON 序列化\n\n| 函数 | 输出 |\n| --- | --- |\n| `toYaml` / `toYamlPretty` | YAML 文本 |\n| `fromYaml` | 把 YAML 字符串解析为对象 |\n| `toJson` / `toPrettyJson` / `toRawJson` | 不同格式的 JSON |\n| `fromJson` | 把 JSON 字符串解析为对象 |\n| `fromYamlArray` / `fromJsonArray` | 解析数组文档 |\n\n```gotemplate\n{{- $policy := .Files.Get \"policies/default.yaml\" | fromYaml -}}\npolicy.json: |-\n{{ $policy | toPrettyJson | nindent 2 }}\n```\n\n序列化结果是字符串，嵌入 YAML 时仍要正确缩进。不要把用户可控字符串直接交给 `fromYaml` 后再生成高权限资源，而不做 Schema 或键白名单校验。\n\n#### Base64、摘要与证书函数\n\n`b64enc` / `b64dec` 只编码和解码，不提供保密性。`sha1sum`、`sha256sum`、`adler32sum` 等可生成内容摘要；Chart 常用 `sha256sum` 把 ConfigMap 变化传播到 PodTemplate annotation。\n\n```gotemplate\nchecksum/config: {{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}\n```\n\n材料还列出证书、密钥派生和加解密函数。它们适合受控场景，但在模板中生成随机密钥会造成升级不稳定，也难以轮换和审计。生产密钥通常交给专用 Secret 管理流程。\n\n#### 日期、时间和持续时间\n\n```gotemplate\ngeneratedAt: {{ now | date \"2006-01-02T15:04:05Z07:00\" | quote }}\nexpiresAt: {{ now | dateModify \"+24h\" | date \"2006-01-02T15:04:05Z07:00\" | quote }}\n```\n\n`now` 会让每次渲染结果不同，从而引发无意义升级。只有确实需要“本次渲染时间”的资源才使用它；声明式资源更适合由发布系统传入固定时间或版本。\n\n#### SemVer 比较\n\n`semver` 解析版本，`semverCompare` 按约束判断。它适合处理应用或能力版本分支，但 Kubernetes API 支持优先使用 `.Capabilities.APIVersions.Has`。\n\n```gotemplate\n{{- if semverCompare \">=2.0.0\" .Values.applicationVersion }}\nfeatureMode: modern\n{{- else }}\nfeatureMode: legacy\n{{- end }}\n```\n\n预发布版本的排序和约束有特定 SemVer 语义。不要用普通字符串比较版本，例如字符串 `\"10.0.0\"` 可能排在 `\"2.0.0\"` 前面。\n\n#### 正则表达式与 URL 处理\n\n`regexMatch`、`regexFind`、`regexFindAll`、`regexReplaceAll`、`regexSplit` 可做有限格式处理；对应的 `mustRegexXxx` 在表达式错误时明确失败。URL 函数可以解析、连接或修改 URL 组件。\n\n模板中的正则适合轻量格式化，不应替代 Schema 的 `pattern` 校验。复杂验证写在 CI 或应用层更容易测试和维护。\n\n#### `lookup` 的四种查询形态\n\n```gotemplate\n{{/* 查询一个命名空间对象 */}}\n{{ $ns := lookup \"v1\" \"Namespace\" \"\" \"production\" }}\n\n{{/* 查询命名空间内单个对象 */}}\n{{ $secret := lookup \"v1\" \"Secret\" .Release.Namespace \"existing\" }}\n\n{{/* 查询命名空间内列表 */}}\n{{ $services := lookup \"v1\" \"Service\" .Release.Namespace \"\" }}\n\n{{/* 查询所有命名空间 */}}\n{{ $namespaces := lookup \"v1\" \"Namespace\" \"\" \"\" }}\n```\n\n查询列表时遍历返回值的 `.items`。对象不存在通常返回空值，权限或 API 错误则让模板失败。使用 `lookup` 复用 Secret 时，必须定义首次安装、升级、卸载后重装和 dry-run 各自的行为。", "subs": ["逻辑与默认值函数", "字符串构造与清理", "字符串分割、列表和排序", "字典的创建、查询和合并", "类型检查与转换", "YAML 与 JSON 序列化", "Base64、摘要与证书函数", "日期、时间和持续时间", "SemVer 比较", "正则表达式与 URL 处理", "lookup 的四种查询形态"]}, {"title": "用 if、with、range 和变量组织控制逻辑", "content": "<!-- src: 7c8a04233466d18e/Flow-Control.md; 7c8a04233466d18e/Variables.md -->\n\n```yaml\n{{- $root := . -}}\n{{- if .Values.ingress.enabled }}\nspec:\n  rules:\n    {{- range .Values.ingress.hosts }}\n    - host: {{ .host | quote }}\n      backendService: {{ $root.Release.Name }}\n    {{- end }}\n{{- end }}\n```\n\n`if` 判断真假，`with` 临时改变点号作用域，`range` 遍历集合。进入 `with` 或 `range` 后，`.` 不再一定是根对象；用 `$` 或提前声明变量保存根作用域。`{{-` 和 `-}}` 会裁剪相邻空白，左右同时使用可能误删换行，应检查渲染后的 YAML。\n\n#### `if` 判断的是管道结果\n\n```gotemplate\n{{- if and .Values.ingress.enabled .Values.ingress.host }}\nhost: {{ .Values.ingress.host | quote }}\n{{- else if .Values.service.enabled }}\nhost: {{ printf \"%s.%s.svc\" (include \"web.fullname\" .) .Release.Namespace | quote }}\n{{- else }}\n{{- fail \"either ingress or service must be enabled\" }}\n{{- end }}\n```\n\n空映射和空列表为假，但一个存在且内部字段全为空的映射可能仍被视为非空。对结构化配置，应判断真正决定行为的字段，而不是只判断父键。\n\n#### `with` 同时完成非空判断与作用域切换\n\n```gotemplate\n{{- with .Values.podAnnotations }}\nannotations:\n  {{- toYaml . | nindent 2 }}\n{{- end }}\n```\n\n进入 `with` 后，`.` 变成 `podAnnotations`。此时 `.Release.Name` 不再可用，但 `$.Release.Name` 始终从根作用域查找。嵌套 `with` 很容易让读者迷失，复杂模板应保存具名变量或拆成 helper。\n\n#### `range` 遍历列表和字典\n\n遍历列表时可以取得索引和值：\n\n```gotemplate\nports:\n{{- range $index, $port := .Values.service.ports }}\n  - name: {{ $port.name | default (printf \"port-%d\" $index) }}\n    port: {{ $port.port }}\n    targetPort: {{ $port.targetPort | default $port.port }}\n{{- end }}\n```\n\n遍历字典时可以取得键和值，但不要依赖未明确排序的输出顺序。需要稳定结果时先用 `keys | sortAlpha`：\n\n```gotemplate\n{{- $env := .Values.env -}}\n{{- range $name := keys $env | sortAlpha }}\n- name: {{ $name }}\n  value: {{ get $env $name | toString | quote }}\n{{- end }}\n```\n\n`range` 还支持 `else`，集合为空时执行兜底分支。对必须非空的集合，更适合用 Schema 或 `required` 提前失败。\n\n#### 变量的声明、赋值与生命周期\n\n`:=` 声明变量，`=` 给已经存在的变量赋值。变量作用域延续到声明它的控制结构末尾，根变量 `$` 在整个模板中可用。\n\n```gotemplate\n{{- $count := 0 -}}\n{{- range .Values.backends }}\n{{- $count = add1 $count -}}\n{{- end }}\nbackend-count: {{ $count }}\n```\n\n变量适合保存根作用域、重复计算结果或明确命名的中间值。不要把模板写成依赖大量可变变量的程序；可复用计算应放进命名模板。\n\n#### 空白裁剪必须结合最终 YAML 检查\n\n`{{-` 删除动作左侧的空白，包括换行；`-}}` 删除右侧空白。以下写法会把两个字段粘到一行：\n\n```gotemplate\nfood: {{ .Values.food | quote }}\n{{- if .Values.mug -}}\nmug: \"true\"\n{{- end -}}\n```\n\n调整裁剪符后必须查看实际输出。模板源码排版漂亮不代表渲染 YAML 正确，反过来也不应为了减少空行牺牲可读性。", "subs": ["if 判断的是管道结果", "with 同时完成非空判断与作用域切换", "range 遍历列表和字典", "变量的声明、赋值与生命周期", "空白裁剪必须结合最终 YAML 检查"]}, {"title": "用命名模板、include 和作用域实现复用", "content": "<!-- src: 7c8a04233466d18e/Named-Templates.md -->\n\n命名模板是全局的，应以 Chart 名称作为前缀避免父子 Chart 冲突。以下 helper 返回稳定标签：\n\n```gotemplate\n{{- define \"web.labels\" -}}\napp.kubernetes.io/name: {{ .Chart.Name }}\napp.kubernetes.io/instance: {{ .Release.Name }}\napp.kubernetes.io/managed-by: {{ .Release.Service }}\n{{- end -}}\n```\n\n```yaml\nmetadata:\n  labels:\n    {{- include \"web.labels\" . | nindent 4 }}\n```\n\n`template` 是动作，输出不能继续进入管道；`include` 是函数，更适合搭配 `indent`、`nindent`、`quote` 等。调用时显式传入 `.`，否则 helper 中拿不到预期上下文。\n\n#### 命名模板是全局命名空间\n\n父 Chart、子 Chart 和 Library Chart 的所有命名模板最终进入同一全局空间。同名定义的加载结果可能覆盖另一份定义，因此只用 `labels`、`fullname` 等通用名称是不安全的。推荐名称包含 Chart 名，公共库还可以包含版本：\n\n```gotemplate\n{{- define \"platform-lib.v1.labels\" -}}\napp.kubernetes.io/managed-by: {{ .Release.Service }}\n{{- end -}}\n```\n\n#### `define`、`template` 与 `include`\n\n```gotemplate\n{{- define \"web.selectorLabels\" -}}\napp.kubernetes.io/name: {{ include \"web.name\" . }}\napp.kubernetes.io/instance: {{ .Release.Name }}\n{{- end -}}\n```\n\n```yaml\n# template 动作直接写入当前位置\nlabels:\n  {{- template \"web.selectorLabels\" . }}\n\n# include 返回字符串，可进入管道\nlabels:\n  {{- include \"web.selectorLabels\" . | nindent 2 }}\n```\n\n`include` 更容易控制缩进和后续转换，因此在 YAML 中通常更实用。\n\n#### 用 `dict` 传递多个参数\n\n命名模板只能接收一个上下文对象。需要同时传根作用域与局部配置时，可以传入字典：\n\n```gotemplate\n{{- include \"web.container\" (dict \"root\" $ \"container\" .Values.mainContainer) | nindent 2 }}\n```\n\n```gotemplate\n{{- define \"web.container\" -}}\nname: {{ .container.name }}\nimage: \"{{ .container.repository }}:{{ .container.tag }}\"\nimagePullPolicy: {{ .root.Values.imagePullPolicy }}\n{{- end -}}\n```\n\n这类接口应在 helper 注释中列出必需键，避免调用方只能阅读实现猜参数。\n\n#### Partial 文件和注释规范\n\n以下划线开头的模板文件不会直接产生 Kubernetes Manifest，`_helpers.tpl` 是常用位置。大型 Chart 可以按领域拆成 `_names.tpl`、`_labels.tpl`、`_pod.tpl`，但命名规则仍要统一。\n\n```gotemplate\n{{/*\nweb.fullname returns a DNS compatible resource name.\nInput: root Helm context\n*/}}\n{{- define \"web.fullname\" -}}\n...\n{{- end -}}\n```\n\n模板注释不会进入渲染结果，YAML 注释会保留到 Manifest；API 对象通常不会保存客户端注释，因此需要长期存在的元数据应使用 annotation。", "subs": ["命名模板是全局命名空间", "define、template 与 include", "用 dict 传递多个参数", "Partial 文件和注释规范"]}, {"title": "在模板中读取、匹配和编码文件", "content": "<!-- src: 7c8a04233466d18e/Accessing-Files-Inside-Templates.md -->\n\n`.Files` 不能读取 `templates/`、被 `.helmignore` 排除的文件或父 Chart 文件。常见用法：\n\n```yaml\ndata:\n  app.conf: |-\n{{ .Files.Get \"conf/app.conf\" | nindent 4 }}\n```\n\n```gotemplate\n{{- range $path, $_ := .Files.Glob \"conf/*.yaml\" }}\n{{ $path }}: |-\n{{ $.Files.Get $path | nindent 2 }}\n{{- end }}\n```\n\n`AsConfig` 适合 ConfigMap，`AsSecrets` 会做 Base64 编码但并不提供加密。Chart 包存在大小限制，不要把大型二进制或真正的明文凭据塞入 Chart。\n\n#### 文件访问的安全边界\n\nChart 只能访问包内允许读取的文件：不能跨到父目录，子 Chart 不能读取父 Chart 文件，模板文件本身也不能通过 `.Files` 获取。这个边界保证一个依赖不能任意读取调用方源码。\n\n#### 路径辅助函数\n\n模板提供类似文件路径处理的函数：`base` 取文件名、`dir` 取目录、`ext` 取扩展名、`clean` 规范路径、`isAbs` 判断绝对路径。它们操作的是 Chart 内逻辑路径，不是主机文件系统访问能力。\n\n```gotemplate\n{{- range $path, $_ := .Files.Glob \"dashboards/*.json\" }}\n{{ base $path }}: |-\n{{ $.Files.Get $path | nindent 2 }}\n{{- end }}\n```\n\n#### 用 `Glob` 批量构建 ConfigMap\n\n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: {{ include \"web.fullname\" . }}-configs\ndata:\n{{ (.Files.Glob \"conf/*\").AsConfig | indent 2 }}\n```\n\n批量导入时注意键名冲突：两个不同目录下的同名文件可能最终映射为相同键。需要保留目录结构时，应显式遍历并自行构造键。\n\n#### 构建 Secret 数据\n\n```yaml\napiVersion: v1\nkind: Secret\nmetadata:\n  name: {{ include \"web.fullname\" . }}-assets\ntype: Opaque\ndata:\n{{ (.Files.Glob \"assets/*\").AsSecrets | indent 2 }}\n```\n\n`AsSecrets` 只是 Base64。任何能下载 Chart 的人都能恢复原文，因此只适合非机密的二进制内容或已经加密的载荷。\n\n#### 按行处理文件\n\n```gotemplate\nallowlist: |-\n{{- range .Files.Lines \"files/allowlist.txt\" }}\n  {{ . }}\n{{- end }}\n```\n\n文件内容进入 YAML 前要考虑缩进、尾随换行、字符编码和大小。配置过大时应改用镜像、对象存储或独立配置发布流程。", "subs": ["文件访问的安全边界", "路径辅助函数", "用 Glob 批量构建 ConfigMap", "构建 Secret 数据", "按行处理文件"]}, {"title": "处理 YAML 类型、缩进、多行文本和锚点", "content": "<!-- src: 7c8a04233466d18e/Appendix:-YAML-Techniques.md; 7c8a04233466d18e/Appendix:-Go-Data-Types-and-Templates.md -->\n\nYAML 类型会影响 Kubernetes 校验：端口通常是整数，环境变量值必须是字符串。多行文本用 `|` 保留换行、用 `>` 折叠换行；模板生成嵌套块时优先用 `nindent`。\n\n```yaml\ndata:\n  retries: \"3\"\n  message: |-\n    first line\n    second line\n```\n\nGo 模板是强类型的。来自 YAML 的整数、字符串、布尔值和集合不能随意互换；必要时用 `int`、`toString` 等显式转换。YAML 锚点在解析后会被展开，Helm 再序列化时不会保留锚点本身。\n\n#### 标量类型与显式标签\n\n```yaml\nport: 80\nenabled: true\nversion: \"1.0\"\ncommit: \"1234e10\"\n```\n\nYAML 解析器可能把未引用的版本当数字，把类似科学计数法的字符串当数值。对必须保持文本的字段加引号。Kubernetes Schema 最终决定字段是否接受该类型，模板渲染成功并不代表服务端校验成功。\n\nYAML 支持 `!!str`、`!!int` 等显式类型标签，但经过模板和库的多次解析后，依赖标签表达长期类型契约往往不如 Schema 清晰。\n\n#### 多行文本的四种常见形式\n\n| 形式 | 行尾换行 | 内容换行 |\n| --- | --- | --- |\n| `|` | 保留一个 | 保留 |\n| `|-` | 删除 | 保留 |\n| `>` | 保留一个 | 折叠为空格 |\n| `>-` | 删除 | 折叠为空格 |\n\n首行错误缩进会让整个 YAML 失败。嵌入外部文件时通常让模板动作从行首开始，再用 `nindent` 控制内容缩进。\n\n#### 一个文件中的多个 YAML 文档\n\n`---` 可以分隔文档，`...` 可以表示文档结束。Helm 会分别处理模板输出中的对象。Values 文件通常只使用一个文档；在同一 Values 文件中放多个文档不能指望 Helm 自动合并。\n\n#### YAML 是 JSON 的超集\n\n复杂内联结构有时用 JSON 更不容易被缩进破坏：\n\n```yaml\nannotations: {\"example.com/mode\": \"strict\", \"example.com/owner\": \"platform\"}\n```\n\n但整份模板应保持一致可读风格。只有当 JSON 明显降低动态结构的格式风险时再使用它。\n\n#### 锚点不能作为最终去重机制\n\n```yaml\ndefaults: &defaults\n  cpu: 100m\nworker:\n  resources: *defaults\n```\n\nYAML 第一次解析后会把别名展开，重新编码时锚点消失。需要跨资源稳定复用时，应使用命名模板、Values 或 Library Chart，而不是依赖锚点保留。", "subs": ["标量类型与显式标签", "多行文本的四种常见形式", "一个文件中的多个 YAML 文档", "YAML 是 JSON 的超集", "锚点不能作为最终去重机制"]}, {"title": "调试模板并规划后续进阶路径", "content": "<!-- src: 7c8a04233466d18e/Debugging-Templates.md; 7c8a04233466d18e/Next-Steps.md -->\n\n```bash\nhelm lint ./mychart\nhelm template demo ./mychart -f values-test.yaml --debug\nhelm install demo ./mychart -f values-test.yaml --dry-run --debug\nhelm install demo ./mychart -f values-test.yaml --dry-run=server --debug\n```\n\n排障顺序是：Values 是否合并正确、模板是否执行、输出是否为有效 YAML、API 是否存在、服务端策略是否接受、运行时对象是否健康。遇到 YAML 解析错误时可暂时注释疑似模板块，让渲染输出保留为注释以观察缩进。\n\n#### 四层调试工具各自能发现什么\n\n| 工具 | 发现的问题 | 发现不了的问题 |\n| --- | --- | --- |\n| `helm lint` | Chart 元数据、常见模板与规范问题 | 真实集群策略和运行状态 |\n| `helm template` | 本地合并值和最终 YAML | 普通模式下的在线 `lookup` |\n| `--dry-run=server` | API 发现、部分服务端校验 | 真正创建后的控制器行为 |\n| 测试命名空间安装 | 调度、镜像、PVC、Hook 与探针 | 完整生产流量和数据风险 |\n\n#### 只渲染一个模板定位问题\n\n```bash\nhelm template demo ./web \\\n  -f values-test.yaml \\\n  --show-only templates/deployment.yaml \\\n  --debug\n```\n\n当错误发生在某个模板时，先缩小到单文件，再打印相关 Values 的类型或临时注释资源主体。调试语句不能进入最终 Manifest。\n\n#### 模拟目标集群能力\n\n```bash\nhelm template demo ./web \\\n  --kube-version 1.32.0 \\\n  --api-versions monitoring.coreos.com/v1/ServiceMonitor\n```\n\n模拟只影响模板看到的 Capabilities，不等同于目标集群服务端验证。最终仍应在实际版本的测试集群安装。\n\n#### 渲染成功后的下一步\n\n模板学习之后应继续掌握 Values 设计、依赖管理、Chart 最佳实践、签名和仓库分发。成熟 Chart 的目标不是使用尽可能多的模板技巧，而是给使用者提供稳定、可解释、可测试的配置接口。", "subs": ["四层调试工具各自能发现什么", "只渲染一个模板定位问题", "模拟目标集群能力", "渲染成功后的下一步"]}]}, {"title": "第六章 · 设计 Values、依赖与可复用 Chart", "sections": [{"title": "设计可覆盖、可理解且类型稳定的 Values", "content": "<!-- src: 7c8a04233466d18e/Values-Files.md; ff38f0b4059545ea/Values.md -->\n\nValues 可来自 `values.yaml`、父 Chart、多个 `-f` 文件和 `--set`。后提供的值优先。公开 Values 应使用 lowerCamelCase，键名不应重复内置对象名称。\n\n```yaml\nimage:\n  repository: example/web\n  tag: \"2.8.1\"\n  pullPolicy: IfNotPresent\nservice:\n  type: ClusterIP\n  port: 8080\nresources: {}\n```\n\n扁平值更容易通过 `--set` 覆盖，嵌套值更有组织性；选择后保持一致。每个用户可配置项都应在 `values.yaml` 注释中说明。用 `values.schema.json` 校验必填项、枚举和类型，比在模板深处才失败更友好。\n\n#### Values 的四层来源\n\n由低到高通常是：Chart 默认 `values.yaml`、父 Chart 对子 Chart 的覆盖、用户提供的一个或多个 Values 文件、命令行设置。同一层多个输入按出现顺序由右侧覆盖左侧。\n\n```bash\nhelm upgrade --install web ./web \\\n  -f values-common.yaml \\\n  -f values-production.yaml \\\n  --set-string image.tag=2026.08\n```\n\n把长期配置写进文件，把短期实验放在命令行。生产流水线应保存最终 Values，但导出或记录前要处理敏感字段。\n\n#### 扁平与嵌套的取舍\n\n```yaml\n# 扁平结构\nserverName: api\nserverPort: 8080\n\n# 嵌套结构\nserver:\n  name: api\n  port: 8080\n```\n\n扁平结构检查简单、适合 `--set`；嵌套结构能表达领域边界。嵌套每一层都可能为空，模板访问前要检查父对象。不要为了理论扁平化把完全不同的组件字段混在一起。\n\n#### 让类型在所有入口保持一致\n\n同一个键不要在默认值中是布尔、在生产文件中变成字符串。端口、数量和超时的单位要写入键名或注释。环境变量最终必须是字符串，但 Values 可以保持业务类型，再在模板边界转换。\n\n```yaml\nreplicaCount: 3\nterminationGracePeriodSeconds: 30\nfeatureEnabled: true\n```\n\n#### 用 JSON Schema 提前失败\n\n```json\n{\n  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n  \"type\": \"object\",\n  \"required\": [\"image\"],\n  \"properties\": {\n    \"replicaCount\": {\"type\": \"integer\", \"minimum\": 1},\n    \"mode\": {\"type\": \"string\", \"enum\": [\"standard\", \"ha\"]},\n    \"image\": {\n      \"type\": \"object\",\n      \"required\": [\"repository\", \"tag\"],\n      \"properties\": {\n        \"repository\": {\"type\": \"string\", \"minLength\": 1},\n        \"tag\": {\"type\": \"string\", \"minLength\": 1}\n      }\n    }\n  }\n}\n```\n\nSchema 应覆盖公开接口的关键约束，但不要把所有 Kubernetes OpenAPI 再复制一遍。`helm lint`、`template`、`install` 和 `upgrade` 都可能触发 Values 校验。\n\n#### 删除默认键\n\n用户可以把某些映射键设为 `null`，使它从合并结果中删除。这在覆盖 Chart 默认探针或安全上下文时有用，但 Chart 应明确哪些键允许删除，避免模板假设它永远存在。", "subs": ["Values 的四层来源", "扁平与嵌套的取舍", "让类型在所有入口保持一致", "用 JSON Schema 提前失败", "删除默认键"]}, {"title": "声明依赖并理解版本、仓库、条件和标签", "content": "<!-- src: 340051e0e422d4f0/Charts.md; ff38f0b4059545ea/Dependencies.md -->\n\n```yaml\ndependencies:\n  - name: postgresql\n    version: \"~16.2.0\"\n    repository: https://charts.example.com\n    condition: postgresql.enabled\n    tags:\n      - database\n```\n\n`helm dependency update` 根据 `Chart.yaml` 解析版本并更新锁文件；`helm dependency build` 按锁文件重建 `charts/`。生产构建应提交和使用锁文件，避免同一源码在不同时间解析出不同依赖。条件优先于标签，且在顶层父 Chart Values 中求值。\n\n#### 版本约束与预发布版本\n\n精确版本可重复性最高；`~1.2.3` 允许同一 Minor 的 Patch，`^1.2.3` 允许同一 Major 的兼容更新。预发布版本通常不会被普通稳定约束自动选中，需要约束显式包含预发布范围。\n\n开发阶段可以使用范围寻找兼容版本，发布时由 `Chart.lock` 固定实际解析结果。不要删除锁文件后在生产构建中临时重新解析。\n\n#### 仓库字段的几种形式\n\n```yaml\ndependencies:\n  - name: remote\n    version: 1.2.3\n    repository: https://charts.example.com\n  - name: aliased\n    version: 2.0.0\n    repository: \"@internal\"\n  - name: local\n    version: 0.1.0\n    repository: file://../local-chart\n  - name: oci-chart\n    version: 3.1.0\n    repository: oci://registry.example.com/charts\n```\n\n`file://` 方便本地组合，但打包与 CI 环境必须能解析相对路径。仓库别名依赖本机仓库配置，公共源码更适合使用明确 URL 或 OCI 路径。\n\n#### Condition、Tag 与 Alias\n\nCondition 是一个或多个布尔 Values 路径，找到的第一个有效路径决定是否启用依赖；Condition 的显式结果优先于 Tag。Tag 在顶层 `tags:` 下批量开关一组依赖。\n\n```yaml\ntags:\n  observability: true\nmetrics:\n  enabled: false\n```\n\n同一个 Chart 需要安装两次时用不同 `alias`，父 Values 也使用 alias 作为键。别名改变依赖在父 Chart 中的逻辑身份，不改变原包的 Chart 名称。\n\n#### `import-values` 的两个方向\n\n子 Chart 可以在 `exports` 下声明可导出的值，父依赖条目用字符串导入；也可以用 `child` / `parent` 映射任意子路径到父路径。导入会增加父子接口耦合，应只导出稳定信息，不要暴露子 Chart 内部全部默认值。\n\n#### 手工放入 `charts/` 的代价\n\nHelm 也能使用直接放在 `charts/` 的目录或包，即使它没有在 `Chart.yaml` 声明。这种方式难以让工具判断来源和版本，更新命令也不会随意删除未声明包。生产 Chart 应优先声明依赖并使用锁文件。", "subs": ["版本约束与预发布版本", "仓库字段的几种形式", "Condition、Tag 与 Alias", "import", "手工放入 charts/ 的代价"]}, {"title": "用父子 Chart 和全局 Values 组合应用", "content": "<!-- src: 7c8a04233466d18e/Subcharts-and-Global-Values.md -->\n\n子 Chart 应当可以独立运行，不能依赖父 Chart 的私有 Values。父 Chart 通过与子 Chart 同名的键覆盖其配置，`global` 值对父子双方可见。复杂系统可以用 umbrella Chart 组合多个组件，但要控制耦合和升级半径。\n\n```yaml\npostgresql:\n  enabled: true\n  auth:\n    database: app\nglobal:\n  imageRegistry: registry.example.com\n```\n\n命名模板全局共享，helper 必须命名空间化。不要依赖 `block` 在父子 Chart 之间覆盖实现，因为多个实现的加载顺序难以预测。\n\n#### 子 Chart 的独立性原则\n\n子 Chart 不能直接读取父 Chart 普通 Values。它只应依赖自己的默认值、父 Chart 在子键下传入的覆盖值，以及双方约定的 `global` 值。这样它才能单独执行 `helm lint` 和安装测试。\n\n```text\n父 Values\n├── global                 父子双方可见\n├── postgresql             覆盖 postgresql 子 Chart\n└── web                    仅父 Chart 自己解释\n```\n\n#### 父 Chart 覆盖子 Chart\n\n```yaml\n# parent values.yaml\ndatabase:\n  auth:\n    database: web\n    username: web\n```\n\n如果依赖使用 `alias: database`，覆盖键也应是 `database`。父 Chart 不应复制子 Chart 的全部 values，只暴露该组合场景需要的覆盖项。\n\n#### Global Values 的治理\n\n`global` 适合镜像仓库、通用 pull secret、域名后缀等真正跨组件一致的配置。滥用 global 会让子 Chart 的行为受隐藏输入影响。每个 global 键都应有明确类型、默认值和消费者清单。\n\n#### 共享模板而不是覆盖模板\n\n父子 Chart 可以使用彼此全局可见的命名模板，但无法像面向对象继承那样可靠覆盖 `block`。推荐把共享模板放进 Library Chart，使用版本化名称和明确参数。", "subs": ["子 Chart 的独立性原则", "父 Chart 覆盖子 Chart", "Global Values 的治理", "共享模板而不是覆盖模板"]}, {"title": "用 Library Chart 沉淀跨 Chart 的公共能力", "content": "<!-- src: 340051e0e422d4f0/Library-Charts.md -->\n\nLibrary Chart 在 `Chart.yaml` 中声明 `type: library`，自身不能安装，也不渲染普通资源，适合集中维护标签、容器、Service 等模板原语。应用 Chart 把它声明为依赖，再用 `include` 调用。\n\n```yaml\napiVersion: v2\nname: platform-lib\ntype: library\nversion: 1.0.0\n```\n\nLibrary Chart 应提供稳定、文档化的输入输出契约。公共模板一旦被许多 Chart 引用，破坏性修改的影响类似共享代码库，应按 SemVer 管理。\n\n#### 创建一个最小 Library Chart\n\n```text\nplatform-lib/\n├── Chart.yaml\n└── templates/\n    ├── _util.tpl\n    └── _service.tpl\n```\n\n```gotemplate\n{{- define \"platform-lib.util.merge\" -}}\n{{- $top := first . -}}\n{{- $overrides := fromYaml (include (index . 1) $top) | default dict -}}\n{{- $base := fromYaml (include (index . 2) $top) | default dict -}}\n{{- toYaml (mergeOverwrite $base $overrides) -}}\n{{- end -}}\n```\n\n常见 Library Chart 模式是定义一个完整资源基模板，再允许应用 Chart 提供覆盖模板，二者解析为字典后合并。它比复制 Service、Deployment 骨架更一致，但也更难调试，必须提供渲染示例。\n\n#### 应用 Chart 声明和调用库\n\n```yaml\ndependencies:\n  - name: platform-lib\n    version: 1.0.0\n    repository: oci://registry.example.com/charts\n```\n\n```gotemplate\n{{- include \"platform-lib.service\" (dict \"root\" . \"service\" .Values.service) }}\n```\n\n应用 Chart 的测试要锁定库版本。Library Chart 的 Major 升级可能同时影响很多下游，应提供迁移对照和分批升级策略。\n\n#### 什么内容不适合放进库\n\n- 单个应用特有的环境变量和业务端口。\n- 变化频繁、尚未形成稳定契约的模板。\n- 需要读取调用方大量私有 Values 的“万能 Deployment”。\n- 通过隐式 global 值改变资源的逻辑。\n\n库应深化接口，而不是把所有 Chart 变成难以理解的间接层。", "subs": ["创建一个最小 Library Chart", "应用 Chart 声明和调用库", "什么内容不适合放进库"]}]}, {"title": "第七章 · 把 Chart 提升到可维护的生产质量", "sections": [{"title": "遵循模板目录、命名、空白和注释约定", "content": "<!-- src: ff38f0b4059545ea/Templates.md -->\n\n每个资源通常单独成文件，文件名使用连字符；helper 放 `_helpers.tpl`。模板名称带 Chart 前缀，YAML 使用两个空格。YAML 注释会进入最终清单，模板注释 `{{/* ... */}}` 只留在源码。\n\n#### 模板目录的可维护布局\n\n```text\ntemplates/\n├── _helpers.tpl\n├── serviceaccount.yaml\n├── configmap.yaml\n├── service.yaml\n├── deployment.yaml\n├── ingress.yaml\n├── NOTES.txt\n└── tests/\n    └── test-connection.yaml\n```\n\n资源文件名应表达 Kind 或职责。一个文件包含多个资源会让 `--show-only`、错误行定位和代码所有权变得困难。生成资源的模板使用 `.yaml`，只定义 helper 的文件使用 `.tpl`。\n\n#### 格式、空白和注释\n\n- YAML 统一两个空格，不使用 Tab。\n- 模板动作两侧留空格，例如 `{{ .Values.name }}`。\n- 大块对象使用 `toYaml | nindent`，不要手工拼接每一层缩进。\n- 模板注释解释渲染逻辑，YAML 注释解释最终对象字段。\n- 生成的 YAML 也应可读，因为它是排障时的第一手证据。\n\n#### 模板输出 JSON 的边界\n\nJSON 是合法 YAML，某些复杂动态映射用 JSON 可以规避缩进问题，但普通 Kubernetes Manifest 仍建议采用 YAML 风格。模板输出必须是 YAML 或 JSON 对象文档，不能夹杂调试文本。", "subs": ["模板目录的可维护布局", "格式、空白和注释", "模板输出 JSON 的边界"]}, {"title": "规范 Labels、Annotations、PodTemplate 和镜像策略", "content": "<!-- src: ff38f0b4059545ea/Labels-and-Annotations.md; ff38f0b4059545ea/Pods-and-PodTemplates.md -->\n\n推荐使用 Kubernetes 通用标签：\n\n```yaml\nlabels:\n  app.kubernetes.io/name: {{ .Chart.Name }}\n  app.kubernetes.io/instance: {{ .Release.Name }}\n  app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}\n  app.kubernetes.io/managed-by: {{ .Release.Service }}\n  helm.sh/chart: \"{{ .Chart.Name }}-{{ .Chart.Version | replace \"+\" \"_\" }}\"\n```\n\n用于选择器的标签必须稳定，不能随升级改变。镜像标签不应默认 `latest`；显式设置 `imagePullPolicy`，Deployment selector 必须与 PodTemplate 标签匹配。\n\n#### Label 与 Annotation 的选择\n\nLabel 用于选择、分组和查询，受到字符与长度限制；Annotation 保存不参与选择的较大元数据。查询条件、Service selector 和 Deployment selector 使用 Label，校验和、说明 URL、外部系统 ID 使用 Annotation。\n\n推荐标签的作用：\n\n| 标签 | 说明 |\n| --- | --- |\n| `app.kubernetes.io/name` | 应用逻辑名称 |\n| `app.kubernetes.io/instance` | Release 实例 |\n| `app.kubernetes.io/version` | 应用版本 |\n| `app.kubernetes.io/component` | 组件角色 |\n| `app.kubernetes.io/part-of` | 所属系统 |\n| `app.kubernetes.io/managed-by` | 管理工具 |\n| `helm.sh/chart` | Chart 名与版本 |\n\n#### Selector 只能使用稳定标签\n\nDeployment 的 `.spec.selector.matchLabels` 与 PodTemplate 标签必须匹配，且 selector 在创建后通常不可变。不要把 Chart Version 或 App Version 放进 selector，否则升级会尝试改变不可变字段。\n\n```yaml\nselectorLabels:\n  app.kubernetes.io/name: web\n  app.kubernetes.io/instance: web-prod\n```\n\n#### 镜像与拉取策略\n\n镜像仓库、名称、tag 与 digest 应提供清晰 Values。生产环境避免浮动 `latest`；如果支持 digest，定义 tag 与 digest 同时设置时的优先级。`IfNotPresent`、`Always` 和 `Never` 应根据不可变标签与运行环境选择。\n\n#### PodTemplate 的关键生产字段\n\nChart 至少要考虑：Pod 与容器 securityContext、requests/limits、探针、亲和与反亲和、拓扑分布、容忍、优雅终止、ServiceAccount、镜像拉取凭据和 PodDisruptionBudget。默认值应安全但不能假装适合所有负载。\n\n#### 用 Values 暴露可治理配置\n\n不要直接把整个 PodSpec 暴露为无约束字典，否则 Chart 无法给出稳定接口。更合适的是为常见能力建立明确 Values，并为高级场景提供少量经过 schema 约束的扩展点：\n\n```yaml\nreplicaCount: 2\n\nimage:\n  repository: registry.example.com/platform/web\n  tag: \"1.4.0\"\n  digest: \"\"\n  pullPolicy: IfNotPresent\n\nresources:\n  requests:\n    cpu: 100m\n    memory: 128Mi\n  limits:\n    memory: 256Mi\n\npodSecurityContext:\n  runAsNonRoot: true\n  seccompProfile:\n    type: RuntimeDefault\n\ncontainerSecurityContext:\n  allowPrivilegeEscalation: false\n  readOnlyRootFilesystem: true\n  capabilities:\n    drop: [\"ALL\"]\n```\n\n模板用 `with` 和 `toYaml | nindent` 输出对象，同时用 `values.schema.json` 限制类型。默认安全上下文要与镜像真实运行用户和写目录兼容；不能只为通过扫描而设置一个会让容器启动失败的字段。\n\n#### 镜像 tag 与 digest 的优先级\n\n```gotemplate\nimage: \"{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ required \"image.tag is required when digest is empty\" .Values.image.tag }}{{- end }}\"\n```\n\ndigest 能锁定不可变内容，tag 更适合人类识别。两者同时配置时必须定义优先级并在 Notes 或 README 说明。镜像仓库重写功能也要避免把 digest 丢掉。\n\n#### 探针不是复制粘贴项\n\nStartup Probe 保护慢启动，Readiness Probe 控制是否接收流量，Liveness Probe 决定是否重启。Chart 可提供合理默认路径和阈值，但应允许关闭或调整：\n\n```yaml\nprobes:\n  startup:\n    enabled: true\n    path: /health/startup\n    failureThreshold: 30\n    periodSeconds: 2\n  readiness:\n    enabled: true\n    path: /health/ready\n  liveness:\n    enabled: true\n    path: /health/live\n```\n\n三个探针指向同一个依赖数据库的检查可能导致依赖故障时所有 Pod 被循环重启。探针语义应由应用负责，Chart 只负责准确表达。\n\n#### 调度策略需要可组合\n\n节点选择器、亲和、容忍和 topology spread 常被平台同时使用。模板不能在一个开关启用时覆盖另一个对象：\n\n```yaml\nnodeSelector: {}\ntolerations: []\naffinity: {}\ntopologySpreadConstraints: []\n```\n\n默认反亲和若设为 required，单节点开发集群可能完全无法调度；更稳妥的是默认 preferred，并提供严格生产配置示例。\n\n#### 优雅终止与可用性预算\n\nDeployment 更新时要协调 `terminationGracePeriodSeconds`、preStop、应用连接排空、探针和滚动策略。PodDisruptionBudget 防止自愿中断同时驱逐过多副本，但单副本应用设置 `minAvailable: 1` 会阻塞节点维护。\n\nChart 应根据 replicaCount 校验或文档化 PDB 约束，并允许平台接入现有 HPA。不要同时固定 replicas 又让 HPA 管理同一字段而产生持续漂移。\n\n#### PodTemplate 验收矩阵\n\n| 场景 | 需要验证 |\n| --- | --- |\n| 单副本开发 | 能调度，不被严格反亲和阻塞 |\n| 多副本生产 | 跨节点/区域分散，滚动更新保持可用 |\n| 非 root 镜像 | 安全上下文与写目录兼容 |\n| 资源紧张 | requests 可调，限制不会造成频繁 OOM |\n| 慢启动 | startup probe 覆盖初始化窗口 |\n| 节点维护 | PDB、优雅终止和流量摘除协同 |\n| 私有镜像 | imagePullSecrets 与 ServiceAccount 正确 |", "subs": ["Label 与 Annotation 的选择", "Selector 只能使用稳定标签", "镜像与拉取策略", "PodTemplate 的关键生产字段", "用 Values 暴露可治理配置", "镜像 tag 与 digest 的优先级", "探针不是复制粘贴项", "调度策略需要可组合", "优雅终止与可用性预算", "PodTemplate 验收矩阵"]}, {"title": "安全地创建 RBAC 与 CRD 资源", "content": "<!-- src: ff38f0b4059545ea/Role-Based-Access-Control.md; ff38f0b4059545ea/Custom-Resource-Definitions.md -->\n\nRBAC 默认遵循最小权限，并允许使用者关闭 ServiceAccount/RBAC 创建以接入现有身份。CRD 放在 `crds/`，先于模板安装且不参与模板渲染；Helm 不负责常规升级或删除 CRD，因此 CRD 演进应建立独立流程。\n\n#### 可切换的 ServiceAccount 与 RBAC\n\n```yaml\nserviceAccount:\n  create: true\n  name: \"\"\nrbac:\n  create: true\n```\n\n```gotemplate\n{{- define \"web.serviceAccountName\" -}}\n{{- if .Values.serviceAccount.create -}}\n{{ default (include \"web.fullname\" .) .Values.serviceAccount.name }}\n{{- else -}}\n{{ required \"serviceAccount.name is required when create=false\" .Values.serviceAccount.name }}\n{{- end -}}\n{{- end -}}\n```\n\nRole 只授予应用运行需要的资源和动作。是否“默认创建 RBAC”取决于 Chart 是否能在没有权限对象时工作，但一旦允许关闭，就必须要求调用方提供现有 ServiceAccount 名称。\n\n#### Role 与 ClusterRole 的选择\n\n优先创建 namespace 范围的 Role。只有应用确实需要读取 Node、Namespace、CRD 或跨 namespace 对象时才使用 ClusterRole，并在 README 单独列出原因。\n\n```yaml\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: {{ include \"web.fullname\" . }}\nrules:\n  - apiGroups: [\"\"]\n    resources: [\"configmaps\"]\n    resourceNames: [{{ include \"web.fullname\" . | quote }}]\n    verbs: [\"get\", \"watch\"]\n```\n\n可以用 `resourceNames` 进一步限制具体对象，但并非所有 verb 都支持同样约束。避免 `apiGroups: [\"*\"]`、`resources: [\"*\"]`、`verbs: [\"*\"]` 组合。\n\n#### 创建者权限与运行时权限分开\n\n安装 Helm 的身份需要创建 Deployment、Service、Role 等资源；工作负载 ServiceAccount 只需要应用运行时权限。不要为了“安装方便”把 Helm 操作者的高权限 ServiceAccount 直接挂给 Pod。\n\n```mermaid\nflowchart LR\n    O[Helm 操作者] -->|创建资源| API[Kubernetes API]\n    API --> SA[应用 ServiceAccount]\n    SA -->|最小运行时权限| CM[指定 ConfigMap]\n    SA -.不应继承.-> O\n```\n\nCI 可以先用 impersonation 或 `kubectl auth can-i` 检查安装权限；运行时权限则通过独立 ServiceAccount 和实际负向测试验证。\n\n#### RBAC Values 的完整边界\n\n```yaml\nserviceAccount:\n  create: true\n  name: \"\"\n  annotations: {}\n  automountServiceAccountToken: false\n\nrbac:\n  create: true\n```\n\n只有应用要调用 Kubernetes API 时才自动挂载 token。允许用户传 annotations 时，要在多租户平台防止其借云 IAM 注解绑定未授权身份。\n\n#### RBAC 验收\n\n测试不仅要证明允许的动作成功，也要证明越权动作失败。例如应用需要读取一个 ConfigMap，应验证它不能列出所有 Secret、不能创建 Pod、不能访问其他 namespace。\n\n#### CRD 安装的两种策略\n\n1. 把 CRD 放在主 Chart `crds/`，首次安装自动创建，升级由独立流程处理。\n2. 把 CRD 拆成单独 Chart，平台团队先安装和升级 CRD，再发布使用它的应用 Chart。\n\n第二种方式更适合多个 Release 共享 CRD。无论哪种方式，删除 CRD 都可能级联删除所有自定义资源，不应由普通 `helm uninstall` 触发。\n\n#### CRD 的限制\n\n- 已存在时不会重新安装。\n- 普通 upgrade 和 rollback 不负责升级 CRD。\n- Helm 不自动删除 CRD。\n- `crds/` 文件不能使用 Values 或模板函数。\n- CRD 建立后，模板可以通过 `.Capabilities` 看到新 API。\n\n#### CRD 升级不是普通模板升级\n\nCRD schema 可能新增字段、收紧校验、改变 served/storage version 或增加 conversion webhook。升级前要盘点现有自定义资源是否满足新 schema，并验证旧客户端仍能读写。\n\n建议流程：\n\n```text\n导出现有 CR 与 CRD\n  -> 对新 schema 做兼容检查\n  -> 部署 conversion webhook（若需要）\n  -> 更新 CRD\n  -> 迁移 storage version\n  -> 升级 controller/app Chart\n  -> 验证旧版本字段与回退方案\n```\n\n删除 CRD 可能级联删除全部 CR，不能把它放进普通清理脚本。即使备份 YAML，也可能无法恢复其控制器管理的外部状态。\n\n#### `--skip-crds` 的责任转移\n\n使用者跳过 CRD 安装时，Chart 应尽早用 capabilities 或明确校验提示缺失 API。README 需要写明所需 CRD 名称、最小版本和安装来源，而不是让应用对象在 API Server 处才报“no matches for kind”。", "subs": ["可切换的 ServiceAccount 与 RBAC", "Role 与 ClusterRole 的选择", "创建者权限与运行时权限分开", "RBAC Values 的完整边界", "RBAC 验收", "CRD 安装的两种策略", "CRD 的限制", "CRD 升级不是普通模板升级", "--skip-crds 的责任转移"]}, {"title": "用 Hook 介入 Release 生命周期", "content": "<!-- src: 340051e0e422d4f0/Chart-Hooks.md -->\n\nHook 可在 `pre-install`、`post-install`、`pre-upgrade`、`post-upgrade`、`pre-delete`、`post-delete`、`pre-rollback`、`post-rollback` 和 `test` 等阶段执行。\n\n```yaml\nmetadata:\n  annotations:\n    helm.sh/hook: pre-upgrade\n    helm.sh/hook-weight: \"-5\"\n    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded\n```\n\nHook 资源不随 Release 自动管理，必须设计删除策略或 Job TTL。Hook 失败可能阻塞发布；数据库迁移等操作还必须满足幂等和可恢复要求。\n\n#### Hook 与 Release 生命周期\n\n安装时可按“加载 Chart → 渲染 → 执行 pre-install → 创建普通资源 → 执行 post-install”理解；升级、删除和回滚有对应的前后 Hook。`crd-install` 属于旧机制，现代 CRD 使用 `crds/`。\n\n```mermaid\ngraph LR\n    A[渲染资源] --> B[pre install]\n    B --> C[创建普通资源]\n    C --> D[等待就绪]\n    D --> E[post install]\n```\n\n#### Weight 与就绪判断\n\n同一阶段多个 Hook 先按权重从小到大排序，再按资源种类和名称等规则处理。权重必须是字符串形式的整数。Job 和 Pod Hook 会等待完成；失败会让发布失败。其他资源被 API Server 接受后通常就视为就绪。\n\n#### 删除策略\n\n| 策略 | 行为 |\n| --- | --- |\n| `before-hook-creation` | 新 Hook 创建前删除旧资源 |\n| `hook-succeeded` | 成功后删除 |\n| `hook-failed` | 失败后删除 |\n\n为了保留失败证据，不一定要立即删除失败 Job；但长期保留会堆积资源。可以结合 Job TTL 和日志采集。\n\n#### Hook 不是普通 Release 资源\n\nHook 创建的对象不由 Release 常规清单跟踪，卸载时不能假设它们自动消失。子 Chart Hook 也会执行，父 Chart 无法简单关闭它们；选择依赖 Chart 时必须审查其 Hook。\n\n#### 数据库迁移 Hook 的设计\n\n迁移 Job 至少要具备：固定镜像、最小 ServiceAccount、明确超时、幂等迁移版本、并发锁、可重复查询状态和可审计日志。不要把数据库管理员密码直接写入 Values。\n\n```yaml\nmetadata:\n  annotations:\n    helm.sh/hook: pre-upgrade\n    helm.sh/hook-weight: \"-10\"\n    helm.sh/hook-delete-policy: before-hook-creation\nspec:\n  backoffLimit: 1\n  activeDeadlineSeconds: 600\n  template:\n    spec:\n      restartPolicy: Never\n```\n\n保留失败 Job 有助于排障，因此不要无条件设置 `hook-failed` 删除；可以由 TTL 或流水线在采集证据后清理。\n\n迁移若不向后兼容，`--atomic` 回滚旧 Deployment 也无法恢复数据库。更稳妥的是 expand/migrate/contract 分阶段发布。\n\n#### Hook 故障排查\n\n```bash\nkubectl get jobs,pods -n production \\\n  -l app.kubernetes.io/instance=web\nkubectl describe job -n production web-migrate\nkubectl logs -n production job/web-migrate --all-containers\nkubectl get events -n production --sort-by=.lastTimestamp\n```\n\n先判断 Hook 是否渲染、是否创建、是否调度、是否运行、退出码是否非零。Helm 只报告“Hook failed”时，真正根因通常在 Job condition、Pod 状态或 Event。\n\n#### Hook 安全审查\n\n第三方 Chart 的 Hook 可以在安装、升级、删除和回滚阶段执行，并可能拥有高权限 ServiceAccount。采用 Chart 前应把 Hook 当可执行供应链内容审查：镜像来源、命令、网络访问、Secret、RBAC 与清理策略都要检查。", "subs": ["Hook 与 Release 生命周期", "Weight 与就绪判断", "删除策略", "Hook 不是普通 Release 资源", "数据库迁移 Hook 的设计", "Hook 故障排查", "Hook 安全审查"]}, {"title": "用 Chart Test 和静态检查建立质量门", "content": "<!-- src: 340051e0e422d4f0/Chart-Tests.md -->\n\nChart Test 是带 `helm.sh/hook: test` 注解的 Pod 或 Job，进程退出码 0 表示成功。它适合验证服务连通、配置生效和基本认证。\n\n```bash\nhelm lint ./chart\nhelm template demo ./chart -f values-ci.yaml\nhelm install demo ./chart -n ci --create-namespace --wait\nhelm test demo -n ci --logs\n```\n\n单元渲染、API 校验、安装测试和业务冒烟测试是不同层次，不能互相替代。\n\n#### 一个连接测试 Pod\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: \"{{ include \"web.fullname\" . }}-test-connection\"\n  annotations:\n    helm.sh/hook: test\n    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded\nspec:\n  restartPolicy: Never\n  containers:\n    - name: wget\n      image: busybox:1.36\n      command: [\"wget\"]\n      args: [\"-qO-\", \"http://{{ include \"web.fullname\" . }}:{{ .Values.service.port }}/healthz\"]\n```\n\n测试容器退出 0 才算成功。测试镜像应固定版本，命令应有超时，不能无限等待。\n\n#### 测试套件应覆盖什么\n\n- Values 是否真正进入 ConfigMap、Secret 或容器参数。\n- Service DNS 和端口是否连通。\n- 正确凭据成功、错误凭据失败。\n- 核心依赖是否可访问。\n- 升级后数据或 API 是否保持兼容。\n\n`helm test --logs` 在测试结束后收集日志。测试失败时还要查看 Pod 状态和 Event，区分断言失败、镜像拉取失败、调度失败与网络策略阻断。\n\n#### 正向与负向测试\n\n只验证 `/healthz` 返回成功会漏掉认证和隔离问题。一个更完整的套件可包含：\n\n| 测试 | 预期 |\n| --- | --- |\n| Service DNS | 名称可解析到目标 Service |\n| 健康接口 | 返回成功且在超时内完成 |\n| 有效凭据 | 能完成最小业务请求 |\n| 无效凭据 | 被明确拒绝，不返回敏感正文 |\n| 无权限 ServiceAccount | 不能读取受保护资源 |\n| 依赖不可用 | 应用返回可诊断错误而非永久挂起 |\n\n负向测试必须确保“失败是预期结果”时测试进程仍返回 0；否则 Helm 会把正确拒绝误判为测试失败。\n\n#### 测试资源的权限\n\nTest Pod 默认可能使用 namespace 的 default ServiceAccount。若只需要访问 Service，应显式关闭 token 自动挂载；需要 Kubernetes API 时创建专用、最小权限 ServiceAccount。\n\n测试容器也应使用非 root、安全上下文和固定 digest。测试不是生产 Deployment，不代表可以忽略供应链和权限。\n\n#### 安装、升级和回滚都要测\n\n干净安装通过不能证明升级可用。CI 至少设计：\n\n```text\n安装 N-1 -> test -> 升级 N -> test -> 回滚/向前修复演练\n```\n\n对有状态系统还要准备真实旧版本数据，验证 schema 和存储兼容。回滚不可行时，应明确只支持向前修复。\n\n#### CI 质量门的顺序\n\n```text\n格式与静态扫描\n      ↓\nhelm lint\n      ↓\n多组 Values 渲染\n      ↓\n目标 API Schema 校验\n      ↓\n临时集群安装\n      ↓\nhelm test 与业务冒烟\n      ↓\n打包 签名 发布\n```\n\n只用默认 Values 测试会漏掉条件分支。至少覆盖最小配置、生产推荐配置和可选组件开启配置。", "subs": ["一个连接测试 Pod", "测试套件应覆盖什么", "正向与负向测试", "测试资源的权限", "安装、升级和回滚都要测", "CI 质量门的顺序"]}, {"title": "应用模板函数、校验、复用与幂等技巧", "content": "<!-- src: 0b443dd78fd28297/Chart-Development-Tips-and-Tricks.md -->\n\n- 用 `required` 为关键 Values 给出可理解的失败信息。\n- 字符串加引号，数字保持数值类型；环境变量值即使像数字也应是字符串。\n- 用 `include` 复用并接入管道，用 `tpl` 谨慎渲染用户提供的模板字符串。\n- 对 ConfigMap/Secret 内容计算 `sha256sum` 注入 PodTemplate annotation，触发声明式滚动更新。\n- 随机函数每次渲染都会变化，升级时可能制造无意义变更。\n- `helm.sh/resource-policy: keep` 会留下孤儿资源，必须有接管方案。\n- `helm upgrade --install` 适合幂等发布入口，但仍需锁定版本、Values 和等待策略。\n\n```yaml\nspec:\n  template:\n    metadata:\n      annotations:\nchecksum/config: {{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}\n```\n\n#### `tpl` 的能力与风险\n\n`tpl` 会把字符串再次当模板执行：\n\n```yaml\n# values.yaml\nexternalUrl: \"https://{{ .Release.Name }}.example.com\"\n```\n\n```gotemplate\nvalue: {{ tpl .Values.externalUrl . | quote }}\n```\n\n这增强了使用者能力，也允许调用模板函数和访问上下文。只对受信任 Values 开放，不能把不可信多租户输入直接交给 `tpl`。\n\n#### ConfigMap 变化触发滚动更新\n\nPod 挂载 ConfigMap 后，应用未必自动重载。把渲染内容摘要写入 PodTemplate annotation 会改变 ReplicaSet 模板，从而触发 Deployment 滚动更新。Library Chart 中无法依赖调用方 `Template.BasePath` 时，可以对命名模板输出计算摘要。\n\n#### 随机值为何破坏幂等\n\n`randAlphaNum`、证书生成和时间函数每次渲染都可能变化。即使 Values 与 Chart 未变，upgrade 也会产生新 Manifest。需要首次生成后复用的值，可以用 `lookup` 读取已有 Secret，或由外部 Secret 系统负责。\n\n#### `resource-policy: keep` 的后果\n\n保留策略可以保护 PVC、Secret 等对象不被删除，但 Helm 会放弃管理它。后续同名安装可能因对象已存在失败，安全补丁也不会自动应用。使用前要明确对象所有者、升级方式和最终删除审批。\n\n#### 大型组合 Chart 的边界\n\nUmbrella Chart 适合一起发布、一起版本化的组件。如果组件生命周期、权限边界和团队所有权完全不同，把它们强行放在一个 Release 会扩大失败与回滚半径。依赖能力不等于所有系统都应合并为一个 Chart。\n\n#### 安装或升级的幂等入口\n\n```bash\nhelm upgrade --install web ./web \\\n  --namespace production \\\n  --create-namespace \\\n  --values values-prod.yaml \\\n  --wait --timeout 10m\n```\n\n命令形式是幂等入口，但输入必须稳定。浮动 Chart 版本、随机模板、未锁定依赖和外部可变查询仍会让相同命令产生不同结果。", "subs": ["tpl 的能力与风险", "ConfigMap 变化触发滚动更新", "随机值为何破坏幂等", "resource", "大型组合 Chart 的边界", "安装或升级的幂等入口"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
