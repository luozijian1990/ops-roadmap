容器的 DNS 服务器**。\n\n```bash\ndocker run --dns 8.8.8.8 --dns 8.8.4.4 alpine\n```\n\n##### 相关选项\n\n| 选项             | 说明                       |\n| ---------------- | -------------------------- |\n| `--dns`        | DNS 服务器地址             |\n| `--dns-search` | DNS 搜索域                 |\n| `--dns-option` | DNS 选项（如 `ndots:5`） |\n\n##### 实战示例\n\n```bash\n$ docker run --rm \\\n  --dns 8.8.8.8 \\\n  --dns-search example.com \\\n  --dns-option ndots:3 \\\n  alpine cat /etc/resolv.conf\n\nnameserver 8.8.8.8\nsearch example.com\noptions ndots:3\n```\n\n---\n\n#### --add-host：添加 hosts 条目\n\n`--add-host` 选项用于**向容器的 /etc/hosts 添加条目**。\n\n##### 语法格式\n\n```bash\n--add-host=<hostname>:<ip>\n# 或\n--add-host=<hostname>=<ip>\n```\n\n##### 实战示例\n\n**示例 1：添加自定义主机**\n\n```bash\n$ docker run --add-host=myhost:192.168.1.100 alpine ping myhost\nPING myhost (192.168.1.100): 56 data bytes\n```\n\n**示例 2：IPv6 地址**\n\n```bash\ndocker run --add-host myhost=[2001:db8::33] alpine\n```\n\n**示例 3：host-gateway（访问宿主机）**\n\n```bash\n# 特殊值 host-gateway 解析为宿主机内部 IP\n$ docker run --add-host host.docker.internal=host-gateway alpine\n\n# 在容器中访问宿主机服务\n$ curl host.docker.internal:8080\n```\n\n> 💡 `host-gateway` 是一个特殊值，自动解析为宿主机的内部 IP 地址。\n\n---\n\n#### --hostname：设置容器主机名\n\n```bash\n$ docker run --hostname mycontainer alpine hostname\nmycontainer\n```\n\n---\n\n#### --domainname：设置 NIS 域名\n\n```bash\ndocker run --domainname example.com alpine\n```\n\n---\n\n#### --mac-address：设置 MAC 地址\n\n```bash\ndocker run --mac-address 92:d0:c6:0a:29:33 alpine\n```\n\n---\n\n#### 网络配置小结\n\n| 选项           | 作用         | 示例                          |\n| -------------- | ------------ | ----------------------------- |\n| `--network`  | 连接网络     | `--network=my-net`          |\n| `-p`         | 发布端口     | `-p 8080:80`                |\n| `-P`         | 发布所有端口 | `-P`                        |\n| `--dns`      | DNS 服务器   | `--dns 8.8.8.8`             |\n| `--add-host` | hosts 条目   | `--add-host=myhost:1.2.3.4` |\n| `--hostname` | 主机名       | `--hostname myapp`          |\n\n---", "subs": ["--network：连接到网络", "-p, --publish：发布端口", "-P, --publish-all：发布所有暴露端口", "--expose：暴露端口（不发布）", "--dns：设置 DNS 服务器", "--add-host：添加 hosts 条目", "--hostname：设置容器主机名", "--domainname：设置 NIS 域名", "--mac-address：设置 MAC 地址", "网络配置小结"]}, {"title": "3.6 存储与挂载选项（-v, --mount, --tmpfs, --volumes-from）", "content": "容器的存储配置决定了数据如何持久化以及如何与宿主机共享数据。\n\n#### -v, --volume：挂载卷或绑定目录\n\n`-v` 选项用于**挂载数据卷或绑定宿主机目录**。\n\n##### 语法格式\n\n```bash\n# 绑定挂载（bind mount）\n-v <host_path>:<container_path>[:options]\n\n# 命名卷（named volume）\n-v <volume_name>:<container_path>[:options]\n\n# 匿名卷（anonymous volume）\n-v <container_path>\n```\n\n##### 常用选项\n\n| 选项   | 说明             |\n| ------ | ---------------- |\n| `ro` | 只读挂载         |\n| `rw` | 读写挂载（默认） |\n| `z`  | SELinux 共享标签 |\n| `Z`  | SELinux 私有标签 |\n\n##### 实战示例\n\n**示例 1：绑定挂载宿主机目录**\n\n```bash\n# 挂载当前目录到容器\n$ docker run -v $(pwd):/app -w /app ubuntu pwd\n/app\n\n# 使用相对路径（Docker 23+）\n$ docker run -v ./content:/content ubuntu ls /content\n```\n\n**示例 2：命名卷**\n\n```bash\n# 创建并使用命名卷\n$ docker run -v mydata:/data alpine touch /data/test.txt\n\n# 查看卷\n$ docker volume ls\nDRIVER    VOLUME NAME\nlocal     mydata\n```\n\n**示例 3：只读挂载**\n\n```bash\ndocker run -v /host/config:/config:ro alpine cat /config/app.conf\n```\n\n**示例 4：挂载主机文件**\n\n```bash\ndocker run -v /etc/hosts:/etc/hosts:ro alpine cat /etc/hosts\n```\n\n> ⚠️ 如果宿主机路径不存在，Docker 会自动创建目录。\n\n---\n\n#### --mount：更明确的挂载语法\n\n`--mount` 选项提供**更清晰、更明确的挂载语法**，推荐使用。\n\n##### 语法格式\n\n```bash\n--mount type=<type>,source=<src>,target=<dst>[,options]\n```\n\n##### 挂载类型\n\n| 类型       | 说明                   |\n| ---------- | ---------------------- |\n| `bind`   | 绑定挂载（宿主机路径） |\n| `volume` | 数据卷                 |\n| `tmpfs`  | 临时文件系统           |\n\n##### 常用选项\n\n| 选项                         | 说明           |\n| ---------------------------- | -------------- |\n| `source, src`              | 源路径或卷名   |\n| `target, dst, destination` | 容器内目标路径 |\n| `readonly, ro`             | 只读挂载       |\n| `volume-opt`               | 卷驱动选项     |\n\n##### 实战示例\n\n**示例 1：绑定挂载**\n\n```bash\ndocker run --mount type=bind,src=/data,dst=/data alpine ls /data\n```\n\n**示例 2：数据卷**\n\n```bash\ndocker run --mount type=volume,src=mydata,dst=/data alpine touch /data/test\n```\n\n**示例 3：只读挂载**\n\n```bash\ndocker run --mount type=bind,src=/config,dst=/config,readonly alpine\n```\n\n**示例 4：结合 --read-only**\n\n```bash\n# 容器根文件系统只读，但指定目录可写\n$ docker run --read-only --mount type=volume,target=/writable alpine touch /writable/ok\n```\n\n---\n\n#### -v vs --mount 对比\n\n| 特性         | -v / --volume | --mount        |\n| ------------ | ------------- | -------------- |\n| 语法         | 简洁          | 明确           |\n| 自动创建目录 | 是            | 否（报错）     |\n| 推荐程度     | 兼容性好      | **推荐** |\n| 可读性       | 较低          | 较高           |\n\n---\n\n#### --tmpfs：挂载临时文件系统\n\n`--tmpfs` 选项用于**挂载内存文件系统**，数据不持久化。\n\n##### 基本用法\n\n```bash\ndocker run --tmpfs <container_path>[:options]\n```\n\n##### 常用选项\n\n与 Linux `mount -t tmpfs -o` 相同：\n\n- `rw` / `ro` - 读写/只读\n- `noexec` - 禁止执行\n- `nosuid` - 禁止 SUID\n- `size=<bytes>` - 大小限制\n\n##### 实战示例\n\n```bash\n# 挂载 tmpfs 到 /run\n$ docker run -d --tmpfs /run:rw,noexec,nosuid,size=65536k myimage\n\n# 查看挂载\n$ docker exec mycontainer mount | grep tmpfs\ntmpfs on /run type tmpfs (rw,nosuid,noexec,relatime,size=65536k)\n```\n\n##### 使用场景\n\n| 场景     | 说明                     |\n| -------- | ------------------------ |\n| 敏感数据 | 密钥、令牌等不应写入磁盘 |\n| 临时缓存 | 不需要持久化的缓存数据   |\n| 高性能   | 需要高速 I/O 的临时存储  |\n\n---\n\n#### --volumes-from：从其他容器挂载卷\n\n`--volumes-from` 选项用于**继承其他容器的卷挂载**。\n\n##### 基本用法\n\n```bash\ndocker run --volumes-from <container>[:mode] IMAGE\n```\n\n##### 模式选项\n\n| 模式   | 说明                         |\n| ------ | ---------------------------- |\n| `rw` | 读写（默认，继承原容器模式） |\n| `ro` | 只读                         |\n\n##### 实战示例\n\n**示例 1：共享数据卷**\n\n```bash\n# 创建数据容器\n$ docker run -v /data --name data-container alpine\n\n# 从数据容器挂载卷\n$ docker run --volumes-from data-container alpine ls /data\n```\n\n**示例 2：只读模式**\n\n```bash\ndocker run --volumes-from data-container:ro alpine\n```\n\n**示例 3：多容器共享卷**\n\n```bash\n# 创建带卷的容器\n$ docker run -d -v webdata:/var/www --name web nginx\n\n# 备份容器共享卷\n$ docker run --volumes-from web -v $(pwd):/backup alpine \\\n    tar cvf /backup/webdata.tar /var/www\n```\n\n---\n\n#### --read-only：根文件系统只读\n\n`--read-only` 选项使**容器根文件系统只读**，提高安全性。\n\n```bash\n$ docker run --read-only alpine touch /test\ntouch: /test: Read-only file system\n\n# 配合挂载使用\n$ docker run --read-only -v /writable alpine touch /writable/ok\n```\n\n---\n\n#### 存储配置小结\n\n| 选项               | 作用           | 示例                                  |\n| ------------------ | -------------- | ------------------------------------- |\n| `-v`             | 挂载卷或目录   | `-v /host:/container`               |\n| `--mount`        | 明确挂载语法   | `--mount type=bind,src=...,dst=...` |\n| `--tmpfs`        | 内存文件系统   | `--tmpfs /run:size=64k`             |\n| `--volumes-from` | 继承其他容器卷 | `--volumes-from data`               |\n| `--read-only`    | 根文件系统只读 | `--read-only`                       |\n\n---", "subs": ["-v, --volume：挂载卷或绑定目录", "--mount：更明确的挂载语法", "-v vs --mount 对比", "--tmpfs：挂载临时文件系统", "--volumes-from：从其他容器挂载卷", "--read-only：根文件系统只读", "存储配置小结"]}, {"title": "3.7 资源限制选项（--memory, --cpus, --ulimit, --blkio-weight）", "content": "资源限制确保容器不会过度消耗系统资源，是生产环境容器管理的关键。\n\n#### 内存限制\n\n##### -m, --memory：设置内存上限\n\n```bash\ndocker run -m <limit> IMAGE\n\n# 支持单位：b, k, m, g\ndocker run -m 512m nginx\ndocker run --memory 1g nginx\n```\n\n##### --memory-reservation：内存软限制\n\n当系统内存紧张时才生效的软限制：\n\n```bash\ndocker run -m 1g --memory-reservation 512m nginx\n```\n\n##### --memory-swap：交换空间限制\n\n| 值             | 说明                          |\n| -------------- | ----------------------------- |\n| 未设置         | swap = 2 × memory            |\n| 与 memory 相同 | 禁用 swap                     |\n| `-1`         | 无限制 swap                   |\n| 大于 memory    | `swap - memory` = 可用 swap |\n\n```bash\n# 内存 1G，禁用 swap\ndocker run -m 1g --memory-swap 1g nginx\n\n# 内存 1G，swap 1G（总共可用 2G）\ndocker run -m 1g --memory-swap 2g nginx\n```\n\n##### --oom-kill-disable：禁用 OOM Killer\n\n```bash\n# 禁用 OOM Killer（必须设置 -m）\ndocker run -m 512m --oom-kill-disable nginx\n```\n\n> ⚠️ **警告**：禁用 OOM Killer 可能导致系统不稳定。\n\n---\n\n#### CPU 限制\n\n##### --cpus：限制 CPU 数量\n\n```bash\n# 限制使用 1.5 个 CPU\ndocker run --cpus 1.5 nginx\n\n# 限制使用 0.5 个 CPU\ndocker run --cpus 0.5 nginx\n```\n\n##### --cpu-shares：CPU 相对权重\n\n默认值 1024，用于 CPU 竞争时的相对优先级：\n\n```bash\n# 高优先级容器\ndocker run --cpu-shares 2048 high-priority-app\n\n# 低优先级容器\ndocker run --cpu-shares 512 low-priority-app\n```\n\n> 💡 CPU shares 只在 CPU 竞争时生效，空闲时容器可使用所有可用 CPU。\n\n##### --cpuset-cpus：绑定 CPU 核心\n\n```bash\n# 只使用 CPU 0 和 1\ndocker run --cpuset-cpus 0,1 nginx\n\n# 使用 CPU 0-3\ndocker run --cpuset-cpus 0-3 nginx\n```\n\n##### --cpu-period / --cpu-quota：精细控制\n\n```bash\n# 每 100ms 内最多使用 50ms CPU（相当于 0.5 CPU）\ndocker run --cpu-period 100000 --cpu-quota 50000 nginx\n```\n\n---\n\n#### --ulimit：设置资源限制\n\n`--ulimit` 选项设置**容器的 ulimit 值**。\n\n##### 语法格式\n\n```bash\n--ulimit <type>=<soft>[:<hard>]\n```\n\n##### 常用限制类型\n\n| 类型        | 说明           |\n| ----------- | -------------- |\n| `nofile`  | 最大打开文件数 |\n| `nproc`   | 最大进程数     |\n| `core`    | 核心转储大小   |\n| `memlock` | 最大锁定内存   |\n| `stack`   | 最大栈大小     |\n\n##### 实战示例\n\n```bash\n# 设置最大打开文件数\n$ docker run --ulimit nofile=1024:1024 nginx\n\n# 设置多个限制\n$ docker run --ulimit nofile=65535 --ulimit nproc=4096 nginx\n\n# 查看容器内 ulimit\n$ docker run --rm --ulimit nofile=1024 alpine sh -c \"ulimit -n\"\n1024\n```\n\n> ⚠️ **注意**：`nproc` 限制的是用户可用进程数，而非容器进程数。\n\n---\n\n#### Block I/O 限制\n\n##### --blkio-weight：I/O 相对权重\n\n范围 10-1000，默认 0（禁用）：\n\n```bash\n# 高 I/O 优先级\ndocker run --blkio-weight 500 nginx\n\n# 低 I/O 优先级\ndocker run --blkio-weight 100 nginx\n```\n\n##### 设备级别限制\n\n```bash\n# 限制读取速率\ndocker run --device-read-bps /dev/sda:1mb nginx\n\n# 限制写入速率\ndocker run --device-write-bps /dev/sda:1mb nginx\n\n# 限制 IOPS\ndocker run --device-read-iops /dev/sda:100 nginx\ndocker run --device-write-iops /dev/sda:100 nginx\n```\n\n---\n\n#### --pids-limit：进程数限制\n\n限制容器内可创建的进程数量：\n\n```bash\n# 最多 100 个进程\ndocker run --pids-limit 100 nginx\n\n# 无限制\ndocker run --pids-limit -1 nginx\n```\n\n---\n\n#### --storage-opt：存储限制\n\n限制容器文件系统大小（需要特定存储驱动支持）：\n\n```bash\n# 限制容器大小为 10G\ndocker run --storage-opt size=10G fedora\n```\n\n> 💡 仅支持 `btrfs`, `overlay2`, `zfs` 等存储驱动。\n\n---\n\n#### 资源限制小结\n\n| 选项               | 作用        | 示例                     |\n| ------------------ | ----------- | ------------------------ |\n| `-m`             | 内存上限    | `-m 512m`              |\n| `--cpus`         | CPU 数量    | `--cpus 2`             |\n| `--cpu-shares`   | CPU 权重    | `--cpu-shares 1024`    |\n| `--cpuset-cpus`  | 绑定 CPU    | `--cpuset-cpus 0,1`    |\n| `--ulimit`       | ulimit 限制 | `--ulimit nofile=1024` |\n| `--blkio-weight` | I/O 权重    | `--blkio-weight 500`   |\n| `--pids-limit`   | 进程数限制  | `--pids-limit 100`     |\n\n---", "subs": ["内存限制", "CPU 限制", "--ulimit：设置资源限制", "Block I/O 限制", "--pids-limit：进程数限制", "--storage-opt：存储限制", "资源限制小结"]}, {"title": "3.8 环境变量与元数据选项（-e, --env-file, -l, -h, -w）", "content": "环境变量和元数据用于配置容器运行时的行为和标识。\n\n#### -e, --env：设置环境变量\n\n`-e` 选项用于**向容器传递环境变量**。\n\n##### 语法格式\n\n```bash\n# 指定变量名和值\n-e VAR=value\n\n# 传递宿主机环境变量\n-e VAR\n```\n\n##### 实战示例\n\n**示例 1：设置环境变量**\n\n```bash\n$ docker run -e MYVAR=foo --rm alpine env | grep MYVAR\nMYVAR=foo\n```\n\n**示例 2：多个环境变量**\n\n```bash\ndocker run -e VAR1=val1 -e VAR2=val2 alpine env\n```\n\n**示例 3：传递宿主机变量**\n\n```bash\n$ export MYVAR=hello\n$ docker run -e MYVAR --rm alpine env | grep MYVAR\nMYVAR=hello\n```\n\n**示例 4：用于数据库配置**\n\n```bash\n$ docker run -d \\\n  -e MYSQL_ROOT_PASSWORD=secret \\\n  -e MYSQL_DATABASE=myapp \\\n  -e MYSQL_USER=user \\\n  -e MYSQL_PASSWORD=password \\\n  mysql:8.0\n```\n\n---\n\n#### --env-file：从文件加载环境变量\n\n`--env-file` 选项用于**从文件批量加载环境变量**。\n\n##### 文件格式\n\n```bash\n# 环境变量文件 (.env)\nVAR1=value1\nVAR2=value2\n# 注释以 # 开头\nDB_HOST=localhost\nDB_PORT=3306\n```\n\n##### 实战示例\n\n```bash\n# 创建 .env 文件\n$ cat > .env << EOF\nAPP_ENV=production\nDB_HOST=mysql.example.com\nDB_PORT=3306\nLOG_LEVEL=info\nEOF\n\n# 加载环境变量\n$ docker run --env-file .env alpine env\n```\n\n> 💡 每行一个变量，`#` 开头的行为注释。\n\n---\n\n#### -l, --label：添加元数据标签\n\n`-l` 选项用于**为容器添加元数据标签**。\n\n##### 语法格式\n\n```bash\n-l <key>=<value>\n--label <key>=<value>\n```\n\n##### 实战示例\n\n**示例 1：添加标签**\n\n```bash\ndocker run -d -l app=nginx -l env=prod nginx\n```\n\n**示例 2：查看标签**\n\n```bash\n$ docker inspect --format '{{json .Config.Labels}}' <container>\n{\"app\":\"nginx\",\"env\":\"prod\"}\n```\n\n**示例 3：按标签过滤**\n\n```bash\n# 列出带特定标签的容器\n$ docker ps -f label=app=nginx\n\n# 删除带特定标签的容器\n$ docker rm $(docker ps -aq -f label=env=test)\n```\n\n##### 常用标签规范\n\n| 标签                        | 说明                     |\n| --------------------------- | ------------------------ |\n| `com.example.description` | 描述                     |\n| `com.example.version`     | 版本                     |\n| `maintainer`              | 维护者                   |\n| `environment`             | 环境（dev/staging/prod） |\n\n---\n\n#### --label-file：从文件加载标签\n\n类似于 `--env-file`，从文件批量加载标签：\n\n```bash\n$ cat > labels.txt << EOF\napp=myapp\nversion=1.0\nEOF\n\n$ docker run --label-file labels.txt nginx\n```\n\n---\n\n#### -h, --hostname：设置主机名\n\n`-h` 选项用于**设置容器的主机名**。\n\n```bash\n$ docker run -h mycontainer alpine hostname\nmycontainer\n\n# 等同于\n$ docker run --hostname mycontainer alpine hostname\n```\n\n---\n\n#### -w, --workdir：设置工作目录\n\n`-w` 选项用于**设置容器内的工作目录**。\n\n```bash\n$ docker run -w /app ubuntu pwd\n/app\n\n# 配合执行命令\n$ docker run -v $(pwd):/app -w /app node npm install\n```\n\n##### 工作目录与挂载\n\n```bash\n# 常用开发模式：挂载 + 设置工作目录\n$ docker run -it \\\n  -v $(pwd):/workspace \\\n  -w /workspace \\\n  --rm \\\n  python:3.11 python app.py\n```\n\n---\n\n#### --entrypoint：覆盖入口点\n\n`--entrypoint` 选项用于**覆盖镜像的 ENTRYPOINT**。\n\n```bash\n# 覆盖入口点为 sh\n$ docker run --entrypoint sh nginx -c \"echo hello\"\n\n# 清空入口点\n$ docker run --entrypoint \"\" nginx echo \"custom command\"\n```\n\n---\n\n#### 环境配置小结\n\n| 选项             | 作用           | 示例                        |\n| ---------------- | -------------- | --------------------------- |\n| `-e`           | 设置环境变量   | `-e DB_HOST=localhost`    |\n| `--env-file`   | 从文件加载变量 | `--env-file .env`         |\n| `-l`           | 添加标签       | `-l app=nginx`            |\n| `--label-file` | 从文件加载标签 | `--label-file labels.txt` |\n| `-h`           | 设置主机名     | `-h mycontainer`          |\n| `-w`           | 设置工作目录   | `-w /app`                 |\n| `--entrypoint` | 覆盖入口点     | `--entrypoint sh`         |\n\n---", "subs": ["-e, --env：设置环境变量", "--env-file：从文件加载环境变量", "-l, --label：添加元数据标签", "--label-file：从文件加载标签", "-h, --hostname：设置主机名", "-w, --workdir：设置工作目录", "--entrypoint：覆盖入口点", "环境配置小结"]}, {"title": "3.9 安全配置选项（--privileged, --cap-add/drop, --security-opt, -u）", "content": "安全配置决定了容器的权限级别和访问控制，是生产环境的关键考量。\n\n#### --privileged：特权模式\n\n`--privileged` 选项授予容器**几乎所有宿主机权限**。\n\n```bash\ndocker run --privileged IMAGE\n```\n\n##### 特权模式影响\n\n| 方面             | 影响                        |\n| ---------------- | --------------------------- |\n| 设备访问         | 可访问所有宿主机设备        |\n| 内核能力         | 拥有所有 Linux capabilities |\n| AppArmor/SELinux | 绑定不受限制                |\n| seccomp          | 禁用系统调用过滤            |\n\n##### 实战示例\n\n```bash\n# Docker-in-Docker（DinD）\n$ docker run --privileged -d docker:dind\n\n# 访问宿主机设备\n$ docker run --privileged -it ubuntu fdisk -l\n```\n\n> ⚠️ **警告**：特权模式严重降低安全性，仅在必要时使用！\n\n---\n\n#### --cap-add / --cap-drop：细粒度权限控制\n\n比 `--privileged` 更安全的权限管理方式。\n\n##### 基本用法\n\n```bash\n# 添加能力\ndocker run --cap-add <capability> IMAGE\n\n# 移除能力\ndocker run --cap-drop <capability> IMAGE\n\n# 添加所有，移除特定\ndocker run --cap-add ALL --cap-drop MKNOD IMAGE\n```\n\n##### 常用 Linux Capabilities\n\n| 能力             | 说明                         |\n| ---------------- | ---------------------------- |\n| `NET_ADMIN`    | 网络管理（修改路由、防火墙） |\n| `NET_RAW`      | 使用 RAW 和 PACKET 套接字    |\n| `SYS_ADMIN`    | 系统管理（mount, swapon）    |\n| `SYS_PTRACE`   | 跟踪进程（strace, gdb）      |\n| `SYS_TIME`     | 修改系统时间                 |\n| `MKNOD`        | 创建特殊文件                 |\n| `CHOWN`        | 改变文件所有者               |\n| `DAC_OVERRIDE` | 绕过文件权限检查             |\n\n##### 实战示例\n\n**示例 1：网络调试（tcpdump, iptables）**\n\n```bash\ndocker run --cap-add NET_ADMIN --cap-add NET_RAW alpine tcpdump\n```\n\n**示例 2：进程调试（strace）**\n\n```bash\ndocker run --cap-add SYS_PTRACE alpine strace ls\n```\n\n**示例 3：移除所有能力（最小权限）**\n\n```bash\ndocker run --cap-drop ALL alpine\n```\n\n**示例 4：修改系统时间**\n\n```bash\ndocker run --cap-add SYS_TIME alpine date -s \"2024-01-01\"\n```\n\n---\n\n#### -u, --user：指定运行用户\n\n`-u` 选项用于**指定容器内进程的运行用户**。\n\n##### 语法格式\n\n```bash\n-u <user>[:<group>]\n-u <uid>[:<gid>]\n```\n\n##### 实战示例\n\n```bash\n# 使用用户名\n$ docker run -u nobody alpine id\nuid=65534(nobody) gid=65534(nobody)\n\n# 使用 UID\n$ docker run -u 1000 alpine id\nuid=1000 gid=0(root)\n\n# 使用 UID:GID\n$ docker run -u 1000:1000 alpine id\nuid=1000 gid=1000\n\n# 使用当前用户\n$ docker run -u $(id -u):$(id -g) alpine id\n```\n\n> 💡 非 root 用户运行是容器安全最佳实践。\n\n---\n\n#### --security-opt：安全模块配置\n\n`--security-opt` 选项用于**配置 AppArmor、SELinux、seccomp 等安全模块**。\n\n##### 常用选项\n\n| 选项                    | 说明                  |\n| ----------------------- | --------------------- |\n| `label:disable`       | 禁用 SELinux 标签     |\n| `label:type:TYPE`     | 设置 SELinux 类型     |\n| `apparmor=PROFILE`    | 使用 AppArmor 配置    |\n| `apparmor=unconfined` | 禁用 AppArmor         |\n| `seccomp=PROFILE`     | 使用 seccomp 配置文件 |\n| `seccomp=unconfined`  | 禁用 seccomp          |\n| `no-new-privileges`   | 禁止进程提权          |\n\n##### 实战示例\n\n**示例 1：禁止进程提权**\n\n```bash\ndocker run --security-opt no-new-privileges:true alpine\n```\n\n**示例 2：禁用 AppArmor**\n\n```bash\ndocker run --security-opt apparmor=unconfined alpine\n```\n\n**示例 3：禁用 seccomp**\n\n```bash\ndocker run --security-opt seccomp=unconfined alpine\n```\n\n**示例 4：自定义 seccomp 配置**\n\n```bash\ndocker run --security-opt seccomp=./my-profile.json alpine\n```\n\n---\n\n#### --userns：用户命名空间\n\n```bash\n# 禁用用户命名空间重映射\n$ docker run --userns=host alpine\n```\n\n---\n\n#### --group-add：添加额外用户组\n\n```bash\n# 添加到 docker 组\n$ docker run --group-add docker alpine id\n\n# 添加多个组\n$ docker run --group-add audio --group-add video alpine\n```\n\n---\n\n#### 安全配置小结\n\n| 选项               | 作用       | 示例                                 |\n| ------------------ | ---------- | ------------------------------------ |\n| `--privileged`   | 特权模式   | `--privileged`                     |\n| `--cap-add`      | 添加能力   | `--cap-add NET_ADMIN`              |\n| `--cap-drop`     | 移除能力   | `--cap-drop ALL`                   |\n| `-u`             | 指定用户   | `-u 1000:1000`                     |\n| `--security-opt` | 安全模块   | `--security-opt no-new-privileges` |\n| `--group-add`    | 添加用户组 | `--group-add docker`               |\n\n##### 安全最佳实践\n\n```bash\n# 最安全的运行方式\n$ docker run \\\n  --cap-drop ALL \\\n  --security-opt no-new-privileges:true \\\n  --read-only \\\n  -u 1000:1000 \\\n  myapp\n```\n\n---", "subs": ["--privileged：特权模式", "--cap-add / --cap-drop：细粒度权限控制", "-u, --user：指定运行用户", "--security-opt：安全模块配置", "--userns：用户命名空间", "--group-add：添加额外用户组", "安全配置小结"]}, {"title": "3.10 设备与 GPU 选项（--device, --gpus）", "content": "设备选项允许容器访问宿主机硬件设备。\n\n#### --device：映射设备\n\n`--device` 选项用于**将宿主机设备映射到容器内**。\n\n##### 语法格式\n\n```bash\n--device=<host_device>:<container_device>:<permissions>\n```\n\n##### 权限选项\n\n| 权限    | 说明                  |\n| ------- | --------------------- |\n| `r`   | 读取                  |\n| `w`   | 写入                  |\n| `m`   | 创建设备文件（mknod） |\n| `rwm` | 完全访问（默认）      |\n\n##### 实战示例\n\n**示例 1：映射 USB 设备**\n\n```bash\ndocker run --device /dev/ttyUSB0 alpine\n```\n\n**示例 2：映射声卡**\n\n```bash\ndocker run --device /dev/snd alpine aplay test.wav\n```\n\n**示例 3：只读访问**\n\n```bash\ndocker run --device /dev/video0:/dev/video0:r alpine\n```\n\n**示例 4：访问磁盘设备**\n\n```bash\ndocker run --device /dev/sda alpine fdisk -l /dev/sda\n```\n\n---\n\n#### --gpus：GPU 访问\n\n`--gpus` 选项用于**配置容器的 GPU 访问**（需要 NVIDIA Container Toolkit）。\n\n##### 前置条件\n\n1. 安装 NVIDIA 驱动\n2. 安装 NVIDIA Container Toolkit\n3. 配置 Docker runtime\n\n##### 语法格式\n\n```bash\n--gpus <specification>\n```\n\n##### 规格选项\n\n| 选项                  | 说明         |\n| --------------------- | ------------ |\n| `all`               | 所有 GPU     |\n| `\"device=0\"`        | 指定 GPU 0   |\n| `\"device=0,1\"`      | 指定多个 GPU |\n| `\"device=GPU-UUID\"` | 按 UUID 指定 |\n\n##### 实战示例\n\n**示例 1：使用所有 GPU**\n\n```bash\ndocker run --gpus all nvidia/cuda:12.0-base nvidia-smi\n```\n\n**示例 2：指定 GPU**\n\n```bash\n# 使用 GPU 0\n$ docker run --gpus \"device=0\" nvidia/cuda:12.0-base nvidia-smi\n\n# 使用 GPU 0 和 1\n$ docker run --gpus \"device=0,1\" nvidia/cuda:12.0-base nvidia-smi\n```\n\n**示例 3：限制 GPU 能力**\n\n```bash\n# 只允许计算和图形功能\n$ docker run --gpus \"all,capabilities=compute,utility\" nvidia/cuda:12.0-base\n```\n\n##### GPU 能力列表\n\n| 能力         | 说明              |\n| ------------ | ----------------- |\n| `compute`  | CUDA / 计算       |\n| `compat32` | 32 位兼容         |\n| `graphics` | OpenGL / 图形     |\n| `utility`  | nvidia-smi 等工具 |\n| `video`    | 视频编解码        |\n| `display`  | 显示输出          |\n\n---\n\n#### 设备配置小结\n\n| 选项         | 作用     | 示例                      |\n| ------------ | -------- | ------------------------- |\n| `--device` | 映射设备 | `--device /dev/ttyUSB0` |\n| `--gpus`   | GPU 访问 | `--gpus all`            |\n\n##### 完整 GPU 容器示例\n\n```bash\n$ docker run -d \\\n  --gpus all \\\n  --name ml-training \\\n  -v $(pwd)/data:/data \\\n  tensorflow/tensorflow:latest-gpu \\\n  python train.py\n```\n\n---", "subs": ["--device：映射设备", "--gpus：GPU 访问", "设备配置小结"]}, {"title": "3.11 重启策略与信号选项（--restart, --stop-signal, --stop-timeout）", "content": "重启策略决定容器退出后的行为，信号选项控制容器的停止方式。\n\n#### --restart：重启策略\n\n`--restart` 选项用于**配置容器的重启策略**。\n\n##### 策略类型\n\n| 策略                 | 说明                             |\n| -------------------- | -------------------------------- |\n| `no`               | 不自动重启（默认）               |\n| `on-failure[:max]` | 仅在非零退出码时重启，可限制次数 |\n| `always`           | 始终重启                         |\n| `unless-stopped`   | 始终重启，除非手动停止           |\n\n##### 实战示例\n\n**示例 1：失败时重启**\n\n```bash\ndocker run --restart on-failure nginx\n```\n\n**示例 2：限制重启次数**\n\n```bash\n# 最多重启 3 次\n$ docker run --restart on-failure:3 nginx\n```\n\n**示例 3：始终重启**\n\n```bash\ndocker run --restart always nginx\n```\n\n**示例 4：unless-stopped（生产推荐）**\n\n```bash\ndocker run --restart unless-stopped nginx\n```\n\n##### always vs unless-stopped\n\n| 场景                     | always | unless-stopped   |\n| ------------------------ | ------ | ---------------- |\n| 容器退出                 | 重启   | 重启             |\n| Docker 重启              | 重启   | 重启             |\n| 手动 stop 后 Docker 重启 | 重启   | **不重启** |\n\n> 💡 生产环境推荐使用 `unless-stopped`，便于维护时手动停止容器。\n\n##### 修改运行中容器的重启策略\n\n```bash\ndocker update --restart unless-stopped <container>\n```\n\n> ⚠️ `--restart` 不能与 `--rm` 同时使用。\n\n---\n\n#### --stop-signal：停止信号\n\n`--stop-signal` 选项用于**指定停止容器时发送的信号**。\n\n##### 基本用法\n\n```bash\ndocker run --stop-signal <signal> IMAGE\n```\n\n##### 常用信号\n\n| 信号        | 编号 | 说明           |\n| ----------- | ---- | -------------- |\n| `SIGTERM` | 15   | 默认，优雅终止 |\n| `SIGKILL` | 9    | 强制终止       |\n| `SIGINT`  | 2    | 中断（Ctrl+C） |\n| `SIGQUIT` | 3    | 退出           |\n| `SIGHUP`  | 1    | 挂起           |\n| `SIGUSR1` | 10   | 用户自定义 1   |\n| `SIGUSR2` | 12   | 用户自定义 2   |\n\n##### 实战示例\n\n```bash\n# 使用 SIGINT 停止\n$ docker run --stop-signal SIGINT nginx\n\n# 使用信号编号\n$ docker run --stop-signal 2 nginx\n```\n\n> 💡 确保应用程序正确处理自定义停止信号。\n\n---\n\n#### --stop-timeout：停止超时\n\n`--stop-timeout` 选项用于**设置等待容器停止的超时时间**。\n\n##### 基本用法\n\n```bash\ndocker run --stop-timeout <seconds> IMAGE\n```\n\n##### 工作流程\n\n1. Docker 发送 `--stop-signal` 指定的信号\n2. 等待 `--stop-timeout` 秒\n3. 如果容器未停止，发送 SIGKILL\n\n##### 实战示例\n\n```bash\n# 等待 30 秒\n$ docker run --stop-timeout 30 nginx\n\n# 立即发送 SIGKILL（0 秒超时）\n$ docker run --stop-timeout 0 nginx\n```\n\n##### 停止命令的超时\n\n```bash\n# 使用 docker stop 时指定超时\n$ docker stop -t 30 <container>\n```\n\n---\n\n#### 重启与信号配置小结\n\n| 选项               | 作用     | 示例                         |\n| ------------------ | -------- | ---------------------------- |\n| `--restart`      | 重启策略 | `--restart unless-stopped` |\n| `--stop-signal`  | 停止信号 | `--stop-signal SIGINT`     |\n| `--stop-timeout` | 停止超时 | `--stop-timeout 30`        |\n\n##### 生产环境推荐配置\n\n```bash\n$ docker run -d \\\n  --restart unless-stopped \\\n  --stop-timeout 30 \\\n  --name myapp \\\n  myapp:latest\n```\n\n---", "subs": ["--restart：重启策略", "--stop-signal：停止信号", "--stop-timeout：停止超时", "重启与信号配置小结"]}, {"title": "3.12 日志配置选项（--log-driver, --log-opt）", "content": "日志配置决定了容器日志的收集和存储方式。\n\n#### --log-driver：日志驱动\n\n`--log-driver` 选项用于**指定容器的日志驱动**。\n\n##### 可用驱动\n\n| 驱动          | 说明                        |\n| ------------- | --------------------------- |\n| `json-file` | JSON 文件（默认）           |\n| `syslog`    | 系统日志                    |\n| `journald`  | systemd journal             |\n| `gelf`      | Graylog Extended Log Format |\n| `fluentd`   | Fluentd 日志收集器          |\n| `awslogs`   | AWS CloudWatch Logs         |\n| `splunk`    | Splunk HTTP Event Collector |\n| `etwlogs`   | Windows ETW                 |\n| `gcplogs`   | Google Cloud Logging        |\n| `local`     | 本地日志驱动（优化存储）    |\n| `none`      | 禁用日志                    |\n\n##### 实战示例\n\n```bash\n# 使用 syslog 驱动\n$ docker run --log-driver syslog nginx\n\n# 禁用日志\n$ docker run --log-driver none nginx\n\n# 使用 journald\n$ docker run --log-driver journald nginx\n```\n\n---\n\n#### --log-opt：日志选项\n\n`--log-opt` 选项用于**配置日志驱动的额外选项**。\n\n##### json-file 驱动选项\n\n| 选项         | 说明               | 默认值           |\n| ------------ | ------------------ | ---------------- |\n| `max-size` | 日志文件最大大小   | `-1`（无限制） |\n| `max-file` | 保留的日志文件数   | `1`            |\n| `compress` | 是否压缩轮转的日志 | `disabled`     |\n| `labels`   | 记录容器标签       | -                |\n| `env`      | 记录环境变量       | -                |\n\n##### 实战示例\n\n**示例 1：限制日志大小和文件数**\n\n```bash\n$ docker run \\\n  --log-driver json-file \\\n  --log-opt max-size=10m \\\n  --log-opt max-file=3 \\\n  nginx\n```\n\n**示例 2：启用日志压缩**\n\n```bash\n$ docker run \\\n  --log-driver json-file \\\n  --log-opt max-size=10m \\\n  --log-opt max-file=5 \\\n  --log-opt compress=true \\\n  nginx\n```\n\n**示例 3：记录容器标签和环境变量**\n\n```bash\n$ docker run \\\n  --log-opt labels=app,env \\\n  --log-opt env=APP_VERSION \\\n  -l app=myapp \\\n  -l env=prod \\\n  -e APP_VERSION=1.0 \\\n  nginx\n```\n\n---\n\n#### syslog 驱动选项\n\n| 选项                | 说明              |\n| ------------------- | ----------------- |\n| `syslog-address`  | syslog 服务器地址 |\n| `syslog-facility` | syslog facility   |\n| `syslog-format`   | 消息格式          |\n| `tag`             | 日志标签          |\n\n```bash\n$ docker run \\\n  --log-driver syslog \\\n  --log-opt syslog-address=tcp://192.168.1.100:514 \\\n  --log-opt tag=\"{{.Name}}\" \\\n  nginx\n```\n\n---\n\n#### fluentd 驱动选项\n\n| 选项                | 说明         |\n| ------------------- | ------------ |\n| `fluentd-address` | Fluentd 地址 |\n| `fluentd-async`   | 异步发送     |\n| `tag`             | 日志标签     |\n\n```bash\n$ docker run \\\n  --log-driver fluentd \\\n  --log-opt fluentd-address=localhost:24224 \\\n  --log-opt tag=docker.{{.Name}} \\\n  nginx\n```\n\n---\n\n#### awslogs 驱动选项\n\n| 选项               | 说明       |\n| ------------------ | ---------- |\n| `awslogs-region` | AWS 区域   |\n| `awslogs-group`  | 日志组名称 |\n| `awslogs-stream` | 日志流名称 |\n\n```bash\n$ docker run \\\n  --log-driver awslogs \\\n  --log-opt awslogs-region=us-east-1 \\\n  --log-opt awslogs-group=myapp-logs \\\n  --log-opt awslogs-stream=container-1 \\\n  nginx\n```\n\n---\n\n#### 日志配置小结\n\n| 选项             | 作用     | 示例                       |\n| ---------------- | -------- | -------------------------- |\n| `--log-driver` | 日志驱动 | `--log-driver json-file` |\n| `--log-opt`    | 驱动选项 | `--log-opt max-size=10m` |\n\n##### 生产环境推荐配置\n\n```bash\n$ docker run -d \\\n  --log-driver json-file \\\n  --log-opt max-size=100m \\\n  --log-opt max-file=5 \\\n  --log-opt compress=true \\\n  --name myapp \\\n  myapp:latest\n```\n\n> 💡 **提示**：可在 `/etc/docker/daemon.json` 中设置全局日志默认值。\n\n---", "subs": ["--log-driver：日志驱动", "--log-opt：日志选项", "syslog 驱动选项", "fluentd 驱动选项", "awslogs 驱动选项", "日志配置小结"]}, {"title": "3.13 其他选项（--pull, --init, --cgroup-parent）", "content": "本节介绍其他常用的 `docker run` 选项。\n\n#### --pull：镜像拉取策略\n\n`--pull` 选项用于**控制运行前是否拉取镜像**。\n\n##### 策略选项\n\n| 策略        | 说明                         |\n| ----------- | ---------------------------- |\n| `always`  | 始终拉取最新镜像             |\n| `missing` | 仅在本地不存在时拉取（默认） |\n| `never`   | 从不拉取，本地不存在则报错   |\n\n##### 实战示例\n\n```bash\n# 始终拉取最新镜像\n$ docker run --pull always nginx\n\n# 仅在本地不存在时拉取\n$ docker run --pull missing nginx\n\n# 从不拉取\n$ docker run --pull never nginx\n```\n\n> 💡 CI/CD 环境推荐使用 `--pull always` 确保使用最新镜像。\n\n---\n\n#### --init：使用 init 进程\n\n`--init` 选项用于**在容器中运行 init 进程作为 PID 1**。\n\n##### 为什么需要 init\n\n- 正确处理信号转发\n- 收割僵尸进程（zombie processes）\n- 确保子进程能被正确终止\n\n##### 实战示例\n\n```bash\ndocker run --init alpine sh -c \"sleep infinity\"\n```\n\n##### 查看 init 进程\n\n```bash\n$ docker run --init alpine ps aux\nPID   USER     TIME  COMMAND\n    1 root      0:00 /sbin/docker-init -- sh\n    7 root      0:00 sh\n    8 root      0:00 ps aux\n```\n\n> 💡 对于不处理信号的应用程序，建议使用 `--init`。\n\n---\n\n#### --cgroup-parent：控制组父级\n\n`--cgroup-parent` 选项用于**指定容器的 cgroup 父路径**。\n\n```bash\ndocker run --cgroup-parent=/mygroup nginx\n```\n\n> 💡 用于高级资源隔离场景。\n\n---\n\n#### --runtime：容器运行时\n\n指定容器使用的运行时：\n\n```bash\n# 使用 runc（默认）\n$ docker run --runtime runc nginx\n\n# 使用 nvidia 运行时（GPU）\n$ docker run --runtime nvidia nvidia/cuda:12.0-base\n```\n\n---\n\n#### --annotation：添加注解\n\n添加容器注解（元数据）：\n\n```bash\ndocker run --annotation \"com.example.key=value\" nginx\n```\n\n---\n\n#### --platform：指定平台\n\n指定容器的目标平台（多架构镜像）：\n\n```bash\n# 运行 ARM64 镜像\n$ docker run --platform linux/arm64 nginx\n\n# 运行 AMD64 镜像\n$ docker run --platform linux/amd64 nginx\n```\n\n---\n\n#### --health-cmd：健康检查\n\n配置容器健康检查：\n\n```bash\n$ docker run \\\n  --health-cmd \"curl -f http://localhost/ || exit 1\" \\\n  --health-interval 30s \\\n  --health-timeout 10s \\\n  --health-retries 3 \\\n  --health-start-period 5s \\\n  nginx\n```\n\n##### 健康检查选项\n\n| 选项                      | 说明         |\n| ------------------------- | ------------ |\n| `--health-cmd`          | 健康检查命令 |\n| `--health-interval`     | 检查间隔     |\n| `--health-timeout`      | 命令超时     |\n| `--health-retries`      | 失败重试次数 |\n| `--health-start-period` | 启动宽限期   |\n| `--no-healthcheck`      | 禁用健康检查 |\n\n---\n\n#### 其他选项小结\n\n| 选项                | 作用           | 示例                         |\n| ------------------- | -------------- | ---------------------------- |\n| `--pull`          | 镜像拉取策略   | `--pull always`            |\n| `--init`          | 使用 init 进程 | `--init`                   |\n| `--cgroup-parent` | cgroup 父级    | `--cgroup-parent=/mygroup` |\n| `--runtime`       | 容器运行时     | `--runtime nvidia`         |\n| `--platform`      | 目标平台       | `--platform linux/arm64`   |\n| `--health-cmd`    | 健康检查       | `--health-cmd \"curl ...\"`  |\n\n---", "subs": ["--pull：镜像拉取策略", "--init：使用 init 进程", "--cgroup-parent：控制组父级", "--runtime：容器运行时", "--annotation：添加注解", "--platform：指定平台", "--health-cmd：健康检查", "其他选项小结"]}, {"title": "3.14 docker run 完整示例", "content": "将本章所学选项组合成一个生产级别的容器配置：\n\n```bash\n$ docker run -d \\\n  --name myapp \\\n  --hostname myapp-1 \\\n  --restart unless-stopped \\\n  --pull always \\\n  --init \\\n  \\\n  # 网络配置\n  --network mynet \\\n  -p 8080:80 \\\n  --dns 8.8.8.8 \\\n  \\\n  # 存储配置\n  -v /data/app:/app \\\n  --tmpfs /run:size=64k \\\n  --read-only \\\n  \\\n  # 资源限制\n  -m 512m \\\n  --cpus 1 \\\n  --pids-limit 100 \\\n  \\\n  # 环境配置\n  -e APP_ENV=production \\\n  --env-file .env \\\n  -l app=myapp \\\n  -l env=prod \\\n  \\\n  # 安全配置\n  --cap-drop ALL \\\n  --security-opt no-new-privileges:true \\\n  -u 1000:1000 \\\n  \\\n  # 日志配置\n  --log-driver json-file \\\n  --log-opt max-size=100m \\\n  --log-opt max-file=5 \\\n  \\\n  # 健康检查\n  --health-cmd \"curl -f http://localhost/ || exit 1\" \\\n  --health-interval 30s \\\n  --health-retries 3 \\\n  \\\n  myapp:latest\n```\n\n---\n\n---", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
