rt: 80\n    targetPort: 8080\n---\napiVersion: v1\nkind: Endpoints\nmetadata:\n  name: legacy-api\nsubsets:\n- addresses:\n  - ip: 192.168.10.20\n  ports:\n  - port: 8080\n```\n\n这样集群内应用访问 `legacy-api` 时，可以像访问本地 Kubernetes Service 一样访问外部服务。\n\n#### Service 类型和访问入口\n\n| 类型 | 是否有 ClusterIP | 对外暴露方式 | 适用场景 |\n|---|---|---|---|\n| `ClusterIP` | 有 | 集群内部访问 | 默认类型 内部服务 |\n| `NodePort` | 有 | 每个节点开放端口 | 没有外部 LB 时临时或简单暴露 |\n| `LoadBalancer` | 有 | 云厂商或数据中心 LB | 生产外部入口 |\n| `ExternalName` | 无 | DNS CNAME | 映射外部域名 |\n| Headless | 无 | DNS 返回后端 Pod IP | StatefulSet 或客户端直连实例 |\n\n这些类型是包含关系，不是互斥关系。`ClusterIP` 是默认的集群内部入口；`NodePort` 通常在 ClusterIP 之上再给每个节点分配一个固定端口；`LoadBalancer` 通常继续复用 ClusterIP 和 NodePort，再由外部 LB 或云控制器把外部地址挂上来。对 kube-proxy 来说，这些入口最终复用同一组 EndpointSlice 后端链，只是入口匹配规则不同。因此集群内 Pod 访问 LoadBalancer Service 的名字或 ClusterIP 时，通常仍在本机转发规则中直接到后端，不需要绕到外部 LB。\n\n理解 Service 时要把 Pod 和 Service 分开：Pod 跟节点和副本生命周期绑定，Service 更像 API Server 和 etcd 中的一条相对静态记录。只要对象不被删除重建，ClusterIP 和 NodePort 就保持稳定；如果删除后重新创建，即使命名相同，也可能重新分配地址或端口。\n\n```mermaid\nflowchart TB\n    Service[\"Service\"]\n    ClusterIP[\"ClusterIP\"]\n    NodePort[\"NodePort\"]\n    LoadBalancer[\"LoadBalancer\"]\n    ExternalName[\"ExternalName\"]\n    Headless[\"Headless<br/>clusterIP None\"]\n\n    Service --> ClusterIP\n    Service --> NodePort\n    Service --> LoadBalancer\n    Service --> ExternalName\n    Service --> Headless\n```\n\nClusterIP 由 API Server 在创建 Service 时根据 `service-cluster-ip-range` 分配。NodePort 也由 API Server 在创建 Service 时根据 `service-node-port-range` 分配，默认常见范围是 30000 到 32767。这里的稳定性是“对象存续期间相对稳定”，不是永久绑定；Service 删除重建后，ClusterIP 和 NodePort 都可能重新分配。\n\nNodePort 范围不要盲目扩大。大规模平台如果把 `service-node-port-range` 从默认范围扩到更大的区间，要同时核对节点内核的临时源端口范围，例如 `net.ipv4.ip_local_port_range`。一旦 NodePort 池和主机进程使用的 ephemeral/source port range 重叠，就可能出现某个进程先占用临时端口，随后 kube-proxy 或入口组件无法使用同一 NodePort 的情况，表现为端口随机不可用。端口池不足时，更稳妥的方向通常是减少 NodePort 暴露面，或改用专门的 L4/L7 入口层。\n\nService 的拓扑和流量策略也会影响转发。它不是简单“偏向本地”，而是要区分硬策略和软策略：\n\n| 策略 | 行为 | 风险和适用场景 |\n|---|---|---|\n| 硬本地优先 | 只在本节点 本可用区或本地域选择后端 找不到就不转发 | 能强约束故障域和链路距离 但本地无副本时会直接不可用 |\n| 软本地优先 | 按 hostname zone region 全集群逐级 fallback | 兼顾就近访问和可用性 适合集群跨机房或跨地域部署 |\n\n拓扑感知流量适合让本地客户端优先访问本地实例，减少微服务调用链跨地域绕行；但它会改变后端分布，容量规划和故障演练都要把 fallback 路径算进去。", "subs": ["Endpoint 是中间表", "EndpointSlice 解决规模问题", "没有 selector 的 Service", "Service 类型和访问入口"]}, {"title": "kube-proxy iptables 和 IPVS 如何实现服务转发", "content": "Service 和 EndpointSlice 只是对象，真正把 Service IP 或 NodePort 转成后端 Pod IP 的，是每个节点上的数据面。默认情况下，这个角色由 kube-proxy 承担。\n\nkube-proxy 在每个节点运行，watch API Server 里的 Service、Endpoint、EndpointSlice 变化，然后在本机配置转发规则。由于每个节点都配置了全量 Service 规则，所以从集群任意节点发起到 Service 的访问，都能被本机规则处理并转发到后端。\n\n```mermaid\nflowchart TB\n    APIServer[\"API Server\"]\n    Service[\"Service\"]\n    Slice[\"EndpointSlice\"]\n    ProxyA[\"节点 A kube-proxy\"]\n    ProxyB[\"节点 B kube-proxy\"]\n    RulesA[\"节点 A 转发规则\"]\n    RulesB[\"节点 B 转发规则\"]\n    Client[\"客户端 Pod\"]\n    Backend[\"后端 Pod\"]\n\n    Service --> APIServer\n    Slice --> APIServer\n    APIServer -->|watch| ProxyA\n    APIServer -->|watch| ProxyB\n    ProxyA --> RulesA\n    ProxyB --> RulesB\n    Client --> RulesA\n    RulesA --> Backend\n```\n\n#### kube-proxy 模式\n\n| 模式 | 工作方式 | 特点 |\n|---|---|---|\n| `userspace` | 流量先转到用户态代理再转后端 | 早期方案 性能较低 |\n| `iptables` | 写入 iptables NAT 规则做 DNAT | 易理解 常见 规则规模大时首包慢 |\n| `ipvs` | 在内核 IPVS 中维护虚拟服务和后端 | 增量更新 性能和规模更好 |\n| `winuserspace` | Windows 用户态代理 | Windows 节点场景 |\n\n#### iptables 如何转发 Service\n\niptables 基于 Linux Netfilter hook 工作。Service 转发核心是 DNAT：把目标地址从 Service IP 改成某个后端 Pod IP。\n\n```mermaid\nflowchart LR\n    In[\"网络入口\"]\n    Pre[\"PREROUTING\"]\n    Route[\"路由判断\"]\n    Input[\"INPUT\"]\n    Forward[\"FORWARD\"]\n    Output[\"OUTPUT\"]\n    Post[\"POSTROUTING\"]\n    Out[\"网络出口\"]\n    Local[\"本地进程\"]\n\n    In --> Pre\n    Pre --> Route\n    Route --> Input\n    Route --> Forward\n    Local --> Output\n    Output --> Post\n    Forward --> Post\n    Post --> Out\n```\n\n把每个 Hook 上挂的表也展开，可以看到三类主要路径上规则的实际执行顺序：\n\n```mermaid\nflowchart TB\n    In[\"网卡接收\"]\n    Pre[\"PREROUTING<br/>raw -> conntrack -> mangle -> nat\"]\n    Route[\"Routing Decision\"]\n    Input[\"INPUT<br/>mangle -> filter\"]\n    Forward[\"FORWARD<br/>mangle -> filter\"]\n    Output[\"OUTPUT<br/>raw -> conntrack -> mangle -> nat -> filter\"]\n    Post[\"POSTROUTING<br/>mangle -> nat\"]\n    Local[\"Local Process\"]\n    Out[\"网卡发送\"]\n\n    In --> Pre --> Route\n    Route -->|\"目标是本机\"| Input --> Local\n    Route -->|\"需要转发\"| Forward --> Post --> Out\n    Local --> Output --> Post\n```\n\n- 入站本机流量：经过 `PREROUTING`，路由判断后进入 `INPUT`，最终交给本地进程。\n- 转发流量：经过 `PREROUTING`、`FORWARD` 和 `POSTROUTING`。\n- 本机发起流量：从本地进程进入 `OUTPUT`，再经过 `POSTROUTING` 发出。\n\n课程里特别强调了用户态和内核态的分工。iptables 最早是个防火墙配置工具，它本身不处理任何数据包；真正处理包的是内核协议栈里的 Netfilter 框架，iptables 和 IPVS 都是挂在这个框架上的插件。日常排查只需要关心两张表：filter 做防火墙，nat 做地址转换。一个包从网卡到规则执行的链路是：网卡收到数据包后发硬中断唤醒 CPU，CPU 触发软中断交给每个核上的 softIRQ 处理进程，由它在内核里构造 SKB（socket buffer），SKB 经过 Netfilter 的 Hook 点时，Netfilter 读取 iptables 事先写入的规则做匹配，按 NAT 规则修改包头。\n\n```mermaid\nflowchart LR\n    Iptables[\"用户空间 iptables\"]\n    Rules[\"NAT table / User-defined chains<br/>PREROUTING / OUTPUT / POSTROUTING\"]\n    NIC[\"网卡\"]\n    CPU[\"CPU\"]\n    SoftIRQ[\"softIRQ Handler\"]\n    SKB[\"构造 SKB<br/>Header + Data\"]\n    Netfilter[\"Netfilter\"]\n\n    Iptables -->|\"写入规则\"| Rules\n    NIC -->|\"硬件中断\"| CPU\n    CPU -->|\"软中断\"| SoftIRQ\n    SoftIRQ --> SKB --> Netfilter\n    Rules -->|\"读取匹配规则\"| Netfilter\n    Netfilter -->|\"按 NAT 规则修改包头\"| SKB\n```\n\nkube-proxy 在 NAT 表中安装 `KUBE-SERVICES`、`KUBE-SVC-*`、`KUBE-SEP-*` 等链。入口流量经过 `PREROUTING`，本机进程发出的流量经过 `OUTPUT`，都会跳到 Kubernetes 规则链检查是否命中 Service IP、NodePort 或 LoadBalancer IP。命中后按概率或规则选择后端，并 DNAT 到 Pod IP。\n\n一个关键点是：iptables 模式下，ClusterIP 通常不绑定在任何网卡上，它只是规则中的虚拟目标地址。因此 `ping ClusterIP` 不通不能说明 Service 不通。要用 TCP 或 HTTP 测试端口，例如 `curl`、`nc` 或应用协议请求。\n\n```bash\nkubectl get svc nginx -o wide\nkubectl get endpoints nginx -o wide\nkubectl get endpointslice -l kubernetes.io/service-name=nginx\n\niptables-save -t nat | rg KUBE-SERVICES\niptables-save -t nat | rg \"10.96.0.0|nginx\"\n```\n\niptables 模式的主要限制是规则数量。首包需要沿规则链匹配，Service 和后端越多，链越长；连接建立后可依赖 conntrack 减少后续包成本，但大规模 Service 下规则同步和首包延迟仍可能成为问题。\n\niptables 模式的负载均衡本质上是随机链。以三个后端为例，`KUBE-SVC-*` 链里第一条规则可以用 `statistics --mode random --probability 0.333...` 命中第一个 `KUBE-SEP-*` 后端，第二条在剩余流量中用约 `0.5` 概率命中第二个后端，最后一条兜底到第三个后端。真正做选择的是连接首包；首包命中 DNAT 后会写入 conntrack，后续包按连接表继续转发。规模问题也集中在这两点：大 Service 首包可能要从上到下匹配大量规则，传统 kube-proxy 同步 iptables 时又常常重新生成并替换整张 NAT 规则表，规则很多时会消耗 CPU 并影响软中断和业务进程。这也是大规模场景常评估 IPVS 或 eBPF 数据面的原因。\n\n把 kube-proxy 写入的各条链连起来，就是一个数据包命中 Service 的完整路径。课程演示时就是沿这条链一步步 `iptables-save` 看下来的：PREROUTING 和 OUTPUT 各加了一条跳转，让所有进来的包和本机发出的包都先过 `KUBE-SERVICES`；在那里按 ClusterIP、协议、端口匹配跳到某个 `KUBE-SVC-*`；再按概率撞进某个 `KUBE-SEP-*` 完成 DNAT。\n\n```mermaid\nflowchart TB\n    External[\"来自其他主机的请求\"]\n    LocalPod[\"本地 Pod\"]\n    Pre[\"PREROUTING\"]\n    Output[\"OUTPUT\"]\n    Services[\"KUBE-SERVICES\"]\n    NodePorts[\"KUBE-NODEPORTS\"]\n    SVC[\"KUBE-SVC-&lt;service hash&gt;\"]\n    SEP[\"KUBE-SEP-&lt;endpoint hash&gt;\"]\n    Mark[\"KUBE-MARK-MASQ\"]\n    DNAT[\"DNAT to Endpoint\"]\n    Post[\"POSTROUTING\"]\n    KPost[\"KUBE-POSTROUTING\"]\n    Masq[\"MASQUERADE<br/>mark 0x4000/0x4000\"]\n\n    External --> Pre --> Services\n    LocalPod --> Output --> Services\n    Services -->|\"匹配 ClusterIP\"| SVC\n    Services -->|\"匹配 NodePort\"| NodePorts\n    NodePorts --> SVC\n    SVC -->|\"statistic random<br/>按概率选择\"| SEP\n    SEP --> Mark --> DNAT --> Post --> KPost --> Masq\n```\n\n各条链的职责可以按层理解：\n\n- `KUBE-SERVICES`：Service 总入口，匹配 ClusterIP、端口和协议。\n- `KUBE-NODEPORTS`：处理 NodePort 入口。\n- `KUBE-SVC-*`：表示一个 Service，在多个 Endpoint 之间按概率选择。\n- `KUBE-SEP-*`：表示一个具体 Endpoint，执行必要的 SNAT 标记和 DNAT。\n- `KUBE-MARK-MASQ`、`KUBE-POSTROUTING`：为需要源地址转换的流量打上 `0x4000` 标记，并在出口执行 `MASQUERADE`。\n\n并非所有数据包都要 SNAT；是否进入 MASQUERADE 路径取决于来源、目标和 kube-proxy 生成的匹配条件。读懂这套链之后，`iptables-save -t nat` 的输出就从一堆乱码变成了可以按链名分层阅读的配置。\n\n#### NodePort 和 LoadBalancer 的转发\n\nNodePort 会在所有节点上打开同一个端口，并配置转发规则。外部访问任意节点的该端口，都可以被转到 Service 后端。kubelet 只关心本节点 Pod，而 kube-proxy 看到的是全量 Service，因此每个节点都能作为入口。\n\nLoadBalancer 类型依赖外部 LB 或云厂商控制器创建负载均衡器，并把外部 IP 写入 Service status。即使 Service 是 LoadBalancer 类型，集群内部 Pod 访问这个 Service 名或 ClusterIP 时，通常仍然由本机 kube-proxy 规则直接转发，不需要绕到外部 LB。\n\n外部 LB 集成大致有两条路径。通用路径是 LB 指向各节点的 NodePort，优点是后端成员相对稳定，代价是链路多一跳并依赖节点端口。另一种路径是在 Pod IP 全局可路由的网络里，让 LB 直接挂 Pod IP；这可以减少一层转发，但会把 Pod 的频繁重建、CrashLoop、readiness 变化直接传给传统 LB 配置面。很多硬件 LB 的管理 CPU 和配置接口并不是为每天成千上万次成员变更设计的，最终可能被大量 reconfigure 请求压垮。\n\n```mermaid\nflowchart LR\n    External[\"外部客户端\"]\n    LB[\"外部 LB\"]\n    NodePort[\"NodePort\"]\n    Proxy[\"kube-proxy\"]\n    ServiceIP[\"Service IP\"]\n    PodA[\"Pod A\"]\n    PodB[\"Pod B\"]\n    Internal[\"内部客户端\"]\n\n    External --> LB\n    LB --> NodePort\n    NodePort --> Proxy\n    Internal --> ServiceIP\n    ServiceIP --> Proxy\n    Proxy --> PodA\n    Proxy --> PodB\n```\n\n#### IPVS 如何扩展转发能力\n\nIPVS 是 Linux 内核中的四层负载均衡能力。相比 iptables 规则链，IPVS 用内核数据结构维护虚拟服务和真实后端，更适合大量 Service 和大量后端的场景。它支持多种调度算法，例如 round robin、least connection、source hashing 和 Maglev 等。\n\nIPVS 模式下，kube-proxy 通常会把 Service IP 绑定到一个 dummy 设备上，例如 `kube-ipvs0`，让路由判断能认为这个 VIP 属于本机，再由 IPVS 接管转发。\n\nIPVS 仍然工作在 Linux 网络包处理路径里。下面这张图把入口、路由、本地进程、转发和出口放在一起：`LOCAL_IN` 和 `LOCAL_OUT` 上的 IPVS hook 可以接管发往虚拟服务的请求，并把它导向真实后端。把它和 iptables 放在同一个 Netfilter 框架下比较时，重点不是背链名，而是理解 kube-proxy 最终是在节点内核路径上完成地址转换。\n\n```mermaid\nflowchart LR\n    In[\"网络入口\"]\n    Pre[\"PREROUTING\"]\n    Route1[\"路由\"]\n    LocalIn[\"LOCAL_IN\"]\n    Forward[\"FORWARD\"]\n    LocalOut[\"LOCAL_OUT\"]\n    Route2[\"路由\"]\n    Post[\"POSTROUTING\"]\n    Out[\"网络出口\"]\n    LocalProc[\"本地进程\"]\n\n    In --> Pre --> Route1\n    Route1 --> LocalIn --> LocalProc --> LocalOut --> Route2 --> Post --> Out\n    Route1 --> Forward --> Post\n    LocalIn -.->|\"ip_vs_remote_request / ip_vs_reply\"| Forward\n    LocalOut -.->|\"ip_vs_local_request / ip_vs_reply\"| Route2\n```\n\n```bash\nip addr show kube-ipvs0\nipvsadm -Ln\nipvsadm -Ln --stats\nconntrack -L | rg \"10.96.\"\n```\n\n| 对比项 | iptables | IPVS |\n|---|---|---|\n| 转发结构 | 规则链匹配 | 内核虚拟服务表 |\n| 更新方式 | 规则同步成本较高 | 更适合增量更新 |\n| 大规模 Service | 首包和规则维护压力较大 | 性能更稳定 |\n| 可观测命令 | `iptables-save` | `ipvsadm` |\n| 依赖 | iptables conntrack | IPVS 内核模块 conntrack |\n\n如果节点没有可用 IPVS 模块，kube-proxy 可能回退到 iptables。排查时要先确认 kube-proxy 实际启动模式，而不是只看期望配置。\n\n在更复杂的入口方案里，IPVS 还可以和 BGP、ECMP、tunnel 或 DSR 组合。一种生产入口设计是入口节点通过 VIP 承接外部流量，再用 IPIP tunnel 把请求封到后端网关 Pod；后端解封后交给 Envoy，响应可以按直回思路返回客户端。这样做的好处是保留原始客户端信息并降低入口节点回程压力，但要求网络、路由和后端网关都配合。\n\n```mermaid\nflowchart LR\n    Client[\"客户端<br/>66.0.0.1\"]\n    Router[\"路由器\"]\n    TORIn[\"TOR<br/>10.0.2.1\"]\n    TOROut[\"TOR<br/>10.0.3.1\"]\n\n    subgraph ControlNode[\"入口 K8S Node\"]\n        Director[\"Controller Pod<br/>lo: 10.0.0.1<br/>IPVS Director\"]\n    end\n\n    subgraph GatewayNode[\"后端 K8S Node\"]\n        Gateway[\"Gateway Pod<br/>eth0: 10.0.3.48<br/>tunl0: 10.0.0.1\"]\n        Envoy[\"Envoy<br/>listener 0.0.0.0:80\"]\n    end\n\n    Client -->|\"1. 原始请求<br/>src 66.0.0.1 / dst VIP 10.0.0.1\"| Router\n    Router -->|\"BGP / ECMP\"| TORIn --> Director\n    Director -->|\"2. IPVS tunnel<br/>10.0.0.1:80 -> 10.0.3.48:80\"| Gateway\n    Gateway -->|\"3. 解封装\"| Envoy\n    Envoy -->|\"4. 响应直回<br/>src VIP 10.0.0.1 / dst 66.0.0.1\"| TOROut\n    TOROut --> Client\n```", "subs": ["kube-proxy 模式", "iptables 如何转发 Service", "NodePort 和 LoadBalancer 的转发", "IPVS 如何扩展转发能力"]}, {"title": "DNS CoreDNS 和 Ingress 如何完成域名和入口管理", "content": "Service IP 比 Pod IP 稳定，但真正适合作为服务发布入口的是域名。Kubernetes 通过 CoreDNS 为 Service 和 Pod 提供集群内 DNS 解析，让消费者用服务名访问动态后端。\n\n#### CoreDNS 的工作机制\n\nCoreDNS 一方面是内存态 DNS Server，提供 UDP 和 TCP DNS 查询；另一方面也像控制器一样 watch Service、EndpointSlice、Pod 等对象，并把对象变化转成 DNS 记录。\n\n```mermaid\nflowchart LR\n    Service[\"Service\"]\n    Slice[\"EndpointSlice\"]\n    Pod[\"Pod\"]\n    CoreDNS[\"CoreDNS\"]\n    Client[\"客户端 Pod\"]\n    Resolv[\"resolv conf\"]\n    Upstream[\"上游 DNS\"]\n\n    Service --> CoreDNS\n    Slice --> CoreDNS\n    Pod --> CoreDNS\n    Client --> Resolv\n    Resolv --> CoreDNS\n    CoreDNS -->|集群记录| Client\n    CoreDNS -->|外部递归| Upstream\n```\n\n在企业网络里，也可以把这套对象到域名的控制逻辑扩展到集群外。平台自研 DNS 控制器 watch Service 或 Ingress 后，把统一的 FQDN 写入企业 DNS：集群内访问同一个名字时解析到 ClusterIP 或内部入口，集群外访问时解析到 LoadBalancer IP 或边缘入口。对于 Headless Service，外部发布要更克制，通常通过 annotation 白名单挑选少量需要暴露的实例记录，避免把海量 Pod A 记录直接灌进企业 DNS。\n\n普通 Service 的完整域名格式通常是：\n\n```text\n<service>.<namespace>.svc.<cluster-domain>\n```\n\n默认集群域常见为 `cluster.local`。例如：\n\n```text\nnginx.default.svc.cluster.local\n```\n\nPod 内的 `/etc/resolv.conf` 通常包含集群 DNS Service 的 ClusterIP、search domain 和 `ndots` 配置。短名解析依赖 search domain 自动补全。\n\n```text\nnameserver 10.96.0.10\nsearch default.svc.cluster.local svc.cluster.local cluster.local\noptions ndots:5\n```\n\n同 namespace 访问 `nginx`，解析器会按 search domain 补全并查询；跨 namespace 访问可以用 `nginx.default` 或完整 FQDN。查询外部域名时，CoreDNS 如果本地没有记录，会按配置转发到上游 DNS。\n\n客户端拿到 Service FQDN 后，实际要走的递归解析顺序可以先按下面这条链路理解：\n\n```mermaid\nsequenceDiagram\n    participant Client\n    participant Recursive\n    participant Root\n    participant TLD\n    participant Authoritative\n\n    Client->>Recursive: query www.example.com A\n    Recursive->>Root: query www.example.com A\n    Root-->>Recursive: refer com NS\n    Recursive->>TLD: query www.example.com A\n    TLD-->>Recursive: refer example.com NS\n    Recursive->>Authoritative: query www.example.com A\n    Authoritative-->>Recursive: answer address\n    Recursive-->>Client: return address\n```\n\n不过集群内 Service 查询通常止于 CoreDNS，因为 CoreDNS 已经从 Kubernetes 对象中生成了 `*.svc.cluster.local` 记录；只有外部域名才会继续转发到递归 DNS，并进一步走根、TLD 和权威 DNS。理解这条链路有助于判断 `ndots` 与上游延迟的放大效应：短名、search domain、A/AAAA 双栈查询和上游递归变慢叠加后，单次应用连接可能被放大成多次 DNS 往返。\n\n典型 DNS 延迟问题常见于默认 UDP 查询、客户端同时发送 A 和 AAAA 查询、kube-proxy 转发 CoreDNS Service，以及外部递归 DNS 偶发慢响应组合在一起，表面上可能表现为约 5 秒的解析超时。CoreDNS 扩容能解决容量不足，但不一定解决每个节点到 CoreDNS 或上游 DNS 的链路延迟。NodeLocal DNSCache 通过 DaemonSet 在每个节点提供本地缓存，减少跨节点查询和集中 CoreDNS 压力；再配合合理 TTL、减少无意义 search 尝试、关闭不需要的 IPv6 查询，才能从客户端到上游逐段收敛延迟。\n\n#### 不同 Service 的 DNS 记录\n\n| Service 类型 | DNS 记录 | 返回目标 |\n|---|---|---|\n| 普通 ClusterIP NodePort LoadBalancer | A 或 AAAA | Service ClusterIP |\n| Headless Service | A 或 AAAA | Ready Pod IP 列表 |\n| StatefulSet Headless | A 或 AAAA | 每个 Pod 的稳定 FQDN |\n| ExternalName | CNAME | 外部域名 |\n\nHeadless Service 常用于 StatefulSet，因为每个副本都需要稳定身份。例如 StatefulSet 副本可以形成如下名字：\n\n```text\nmysql-0.mysql.default.svc.cluster.local\nmysql-1.mysql.default.svc.cluster.local\nmysql-2.mysql.default.svc.cluster.local\n```\n\nHeadless Service 本身没有 ClusterIP，CoreDNS 会把 Service FQDN 解析成 Ready Pod IP 列表。如果 Pod 设置了 `hostname` 和 `subdomain`，CoreDNS 还会为单个 Pod 生成独立 FQDN。StatefulSet 正是依赖这一点：`serviceName` 指向一个 Headless Service，控制器再为每个副本填入固定序号的 hostname 和对应 subdomain，于是 `mysql-0`、`mysql-1` 这类实例名即使 Pod 重建也保持可预测，适合数据库、消息队列等需要稳定成员身份的系统。\n\n但不要把 DNS 轮询误当成完美负载均衡。DNS 有 TTL，客户端可能缓存结果，也可能忽略服务端给出的 TTL。Pod 漂移后，旧地址可能在客户端缓存里停留一段时间。普通 Service 解析到 ClusterIP 后，再由 kube-proxy 或其他数据面选择后端，通常比直接依赖 DNS 返回 Pod IP 更稳。\n\n#### DNSPolicy 和自定义 DNS\n\n| DNSPolicy | 行为 | 适用场景 |\n|---|---|---|\n| `ClusterFirst` | 优先使用集群 DNS | 默认 大多数业务 |\n| `Default` | 继承节点 DNS 配置 | 不需要解析集群内服务 |\n| `None` | 完全自定义 DNS 配置 | 特殊 DNS 后缀或自建 DNS |\n\n`ClusterFirst` 会把 Pod 的 `/etc/resolv.conf` 指向 CoreDNS Service，并配置集群 search domain。`Default` 不是“推荐默认值”，它会继承宿主机 DNS，通常无法解析 `*.svc.cluster.local` 这类集群内 Service 名称，适合确实不需要服务发现的 Pod。`None` 表示完全自定义 nameserver、search 和 ndots，适合必须使用特定 DNS 后缀或自建 DNS 的应用；但如果没有把集群 DNS 和 search domain 配进去，集群内 Service 解析也会失效。\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: custom-dns\nspec:\n  dnsPolicy: \"None\"\n  dnsConfig:\n    nameservers:\n    - 10.96.0.10\n    searches:\n    - default.svc.cluster.local\n    - svc.cluster.local\n    options:\n    - name: ndots\n      value: \"2\"\n  containers:\n  - name: app\n    image: busybox\n    command: [\"sleep\", \"3600\"]\n```\n\nCoreDNS 本身可以横向扩容。如果 DNS 查询量很高，还可以提高 TTL、使用 NodeLocal DNSCache 或在节点本地部署缓存层，减少集中 CoreDNS 的压力。优化 DNS 前要先区分是 CoreDNS 容量问题、上游 DNS 延迟、ndots 导致的多次查询，还是客户端缓存行为导致。\n\n#### Ingress 和 Ingress Controller\n\nIngress 是七层入口规则对象，描述 host、path、TLS 和后端 Service 的关系。Ingress Controller 是实际控制器，它 watch Ingress、Service、EndpointSlice、Secret 等对象，并把期望状态转成 Nginx、Envoy、HAProxy、Traefik 或云厂商 LB 的配置。\n\nIngress Controller 常以 Pod 或 Deployment 运行，里面可以同时包含控制器逻辑和数据面代理。控制器逻辑 watch Ingress、Service、EndpointSlice、Secret 等对象，生成代理配置并触发热加载；真正接收请求、做 TLS termination、按 host/path 转发的是 Nginx、Envoy、HAProxy 或 Traefik 这类代理进程。外部流量通常还要先经过一个 Service、NodePort 或 LoadBalancer，才能进入 Ingress Controller Pod。\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: web\nspec:\n  ingressClassName: nginx\n  tls:\n  - hosts:\n    - app.example.com\n    secretName: app-tls\n  rules:\n  - host: app.example.com\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: web\n            port:\n              number: 80\n```\n\n`ingressClassName` 决定这个 Ingress 由哪个 Ingress Controller 接管，避免 Nginx、Traefik、Envoy 等多个 controller 同时处理同一个对象。`tls.hosts` 应与规则里的域名匹配，`secretName` 指向当前 namespace 下保存证书和私钥的 TLS Secret；Ingress Controller 读取 Secret 后，再把证书内容转换成具体代理的数据面配置。\n\n手工理解 TLS Secret 的链路时，可以先用自签证书演示一次。生产环境通常会接入 cert-manager 或企业证书系统，但底层对象仍然是当前 namespace 里的 `kubernetes.io/tls` Secret：\n\n```bash\nopenssl req -x509 -nodes -days 365 -newkey rsa:2048 \\\n  -keyout tls.key -out tls.crt -subj \"/CN=app.example.com\"\n\nkubectl create secret tls app-tls \\\n  --cert=tls.crt \\\n  --key=tls.key\n\nkubectl describe secret app-tls\n```\n\nIngress Controller watch 到 `app-tls` 后，会读取其中的 `tls.crt` 和 `tls.key`，并把它们转换成 Nginx、Envoy 或其他代理的数据面证书配置。这样外部 HTTPS 请求在入口代理处完成 TLS 终止，再按 host/path 转发到后端 Service。\n\n```mermaid\nflowchart LR\n    Client[\"客户端\"]\n    DNS[\"DNS\"]\n    LB[\"外部 LB\"]\n    Controller[\"Ingress Controller\"]\n    Rule[\"Ingress 规则\"]\n    ServiceA[\"Service A\"]\n    ServiceB[\"Service B\"]\n\n    Client --> DNS\n    DNS --> LB\n    LB --> Controller\n    Rule --> Controller\n    Controller -->|host path A| ServiceA\n    Controller -->|host path B| ServiceB\n```\n\nIngress 让一个入口承载多个服务，适合 HTTP 和 HTTPS 的 host path 路由、TLS 终止、证书管理、灰度入口和七层观测。它不是 kube-proxy 的替代品，而是位于更外层的七层流量管理对象。\n\nIngress 标准对象也有清晰边界。它的稳定字段主要覆盖 host、path、backend 和 TLS，复杂七层治理通常超出标准 spec，例如 TLS version、cipher、DH 参数、按 Header 转发、Header 或 URI rewrite、统一正则语义、SSL redirect、细粒度灰度和安全策略等。不同 controller 往往用 annotations 扩展这些能力，结果是可移植性变差。需要长期治理能力时，应评估 Gateway API、Contour `HTTPProxy`、Istio 等模型，把 Gateway、Route 和目标策略拆成更明确的对象。", "subs": ["CoreDNS 的工作机制", "不同 Service 的 DNS 记录", "DNSPolicy 和自定义 DNS", "Ingress 和 Ingress Controller"]}, {"title": "L4 L7 负载均衡 边缘加速和实践建议如何取舍", "content": "Kubernetes 的服务发现不是单一技术。实际生产入口常常由 DNS、L4 负载均衡、L7 代理、Ingress Controller、Service、EndpointSlice、kube-proxy 和 Pod 探针共同组成。不同层解决的问题不同，取舍时要看协议、规模、延迟、可观测性和运维能力。\n\n#### L4 和 L7 的职责差异\n\n| 层级 | 主要依据 | 常见实现 | 适合能力 | 代价 |\n|---|---|---|---|---|\n| L4 | IP 端口 协议 | IPVS LVS 硬件 LB 云 LB | TCP UDP 转发 高性能 VIP | 不理解 HTTP 语义 |\n| L7 | Host Path Header TLS | Nginx Envoy HAProxy Traefik | 路由 TLS 灰度 镜像 观测 | 链路更长 代理要扩容 |\n\n四层入口通常围绕 VIP、BGP、ECMP、IPVS、DSR 或 tunnel 展开。七层入口通常围绕 Ingress、Envoy 或 Nginx 配置、TLS 证书、HTTP 路由和热加载展开。\n\n```mermaid\nflowchart LR\n    Client[\"客户端\"]\n    DNS[\"DNS Provider\"]\n    VIP[\"VIP\"]\n    Router[\"BGP ECMP\"]\n    L4[\"L4 Provider\"]\n    L7[\"L7 Proxy\"]\n    Service[\"Service\"]\n    Pod[\"Pod\"]\n\n    Client --> DNS\n    DNS --> VIP\n    VIP --> Router\n    Router --> L4\n    L4 --> L7\n    L7 --> Service\n    Service --> Pod\n```\n\n在数据中心里，L4 可以是硬件负载均衡，也可以是基于 Linux 和 IPVS 的软件负载均衡。软件方案的优势是声明式、可编排、扩容快，不完全依赖硬件采购周期。配合 BGP 和 ECMP，可以让多个入口节点同时宣告 VIP，构建多活入口。\n\n这类四层集群可以看成“声明式控制面 + 多个 VIP 宣告节点 + 后端 Pod”的组合。理解 BGP/ECMP 时要注意，多个入口节点不是主备等一个节点故障，而是 active-active 同时承接流量；只要路由和健康检查正确，入口层就可以横向扩展。\n\n```mermaid\nflowchart LR\n    Client[\"client\"]\n    Router[\"router<br/>ECMP\"]\n    API[\"k8s API Server<br/>declarative model\"]\n    L4[\"L4 cluster\"]\n    N1[\"node 1<br/>VIP adv\"]\n    N2[\"node 2<br/>VIP adv\"]\n    N3[\"node 3<br/>VIP adv\"]\n    Pod1[\"Pod\"]\n    Pod2[\"Pod\"]\n    Pod3[\"Pod\"]\n\n    API --> L4\n    Client --> Router\n    Router --> N1 --> Pod1\n    Router --> N2 --> Pod2\n    Router --> N3 --> Pod3\n    L4 --> N1\n    L4 --> N2\n    L4 --> N3\n```\n\n#### L4 Provider L7 Provider 和 Ingress Controller\n\n一个完整入口控制面通常可以拆成几个 provider：\n\n| 组件 | 职责 |\n|---|---|\n| DNS Provider | 根据 Ingress host 或 Service 注解写入 DNS 记录 |\n| L4 Provider | 分配 VIP 宣告路由 配置 IPVS 或 LB 转发 |\n| L7 Provider | 生成 Nginx Envoy HAProxy 等七层代理配置 |\n| Ingress Controller | watch Kubernetes 对象 协调各 provider 达成期望状态 |\n\n这个拆分的好处是把“域名怎么配”“VIP 怎么来”“四层怎么进”“七层怎么路由”变成可组合的声明式控制循环。对外部用户来说，只需要创建 Service 或 Ingress；对平台来说，控制器负责把对象变化转化为 DNS、路由、LB 和代理配置。\n\n七层集群关注的是 HTTP 语义，而不是只看五元组。典型例子包括 gRPC、TLS 终止、Header 路由和路径路由：长连接和应用层协议要做均衡、证书、安全策略或灰度时，需要 Nginx、Envoy、HAProxy、Traefik 这类 L7 Proxy。\n\ngRPC 是最容易误判的例子。它基于 HTTP/2，一个 TCP 连接上可以复用很多请求；而 Service 和 kube-proxy 的四层转发只在连接层按五元组选择后端。若某个客户端建立了一条很重的长连接，连接内的大量请求可能长期落在同一个 Pod 上，无法做到请求级均衡。需要请求级分摊、按方法或 Header 治理、细粒度超时和重试时，应使用 Envoy、Nginx 等七层代理，或让客户端实现应用层负载均衡。\n\n```mermaid\nflowchart LR\n    Client[\"client\"]\n    DNS[\"DNS\"]\n    L7A[\"L7 Proxy node A\"]\n    L7B[\"L7 Proxy node B\"]\n    App1[\"App1 Pod\"]\n    App2[\"App2 Pod\"]\n\n    Client --> DNS\n    DNS --> L7A\n    DNS --> L7B\n    L7A --> App1\n    L7A --> App2\n    L7B --> App1\n    L7B --> App2\n```\n\n#### CDN POP 和边缘加速\n\nCDN 主要解决静态内容就近缓存，但它不一定解决动态请求回源路径不确定的问题。跨大陆访问中，RTT 高、互联网路径绕行、TLS 握手成本和运营商链路差异都会影响体验。边缘 POP 的思路是在用户附近部署小型入口集群，把 TLS 终止、缓存、安全检查和七层路由前移，再通过更可控的线路回源。\n\n```mermaid\nflowchart LR\n    User[\"用户\"]\n    GTM[\"GTM DNS\"]\n    CDN[\"CDN\"]\n    POP[\"边缘 POP\"]\n    Security[\"安全策略\"]\n    Origin[\"源站数据中心\"]\n    App[\"后端应用\"]\n\n    User --> GTM\n    GTM --> CDN\n    CDN --> POP\n    POP --> Security\n    Security --> Origin\n    Origin --> App\n```\n\n边缘架构常见能力包括：\n\n| 能力 | 价值 |\n|---|---|\n| 就近 DNS 或 GTM | 把用户引到更近入口 |\n| CDN 缓存 | 减少静态内容回源 |\n| TLS Offload | 降低源站 TLS 压力 |\n| POP Proxy | 动态请求从边缘进入优化链路 |\n| WAF 和安全策略 | 在边缘拦截异常流量 |\n| 多区域 LB | 控制故障域和跨地域流量 |\n\neBay 的边缘 POP 思路是把小型 Kubernetes 入口集群部署到更靠近用户的位置，在边缘运行 DNS Provider、IPVS Provider 和 Ingress Provider。用户先就近进入 POP，在边缘完成 TLS offload、缓存、安全检查和七层路由，再通过专线或更可控的骨干链路回源。一个典型收益是欧洲用户访问美国源站时，传统互联网或第三方 CDN 路径可能约 140 ms，自研 POP 回源链路可降到约 40 ms，减少约 100 ms；对电商、广告和搜索类系统来说，这类百毫秒级收益会直接影响转化和收入。\n\n跨地域高可用不能只靠 DNS 或 GTM 切流。某个地域故障后，即使权威 DNS 删除坏地域记录，客户端缓存和递归 DNS 缓存仍可能在 TTL 内继续返回旧地址，流量会持续打到故障地域。更稳的入口设计是在 DNS 之下再放跨地域 L4/L7 网关：正常时可以让大部分流量回本地，例如 99% 走本地域、1% 探测或分摊到其他地域；本地故障时从 LB member 或路由成员中摘掉本地线路，让流量在入口层快速切到其他数据中心。这样 DNS 负责粗粒度就近，入口网关负责秒级健康检查和切流。\n\n#### 实践建议\n\nPod 生命周期和服务发现要一起设计，不能只写 Deployment 或只配 Ingress。\n\n| 主题 | 建议 |\n|---|---|\n| Pod 状态 | 排查时同时看 phase conditions containerStatuses events |\n| 资源 | 基于压测和监控设置 request limit 重要服务避免 BestEffort |\n| 驱逐 | 关注节点内存 磁盘 PID 压力 合理设置 tolerationSeconds |\n| 探针 | readiness 控制接流量 liveness 控制自愈 startup 保护慢启动 |\n| Hook | PostStart 做轻量初始化 PreStop 做摘流或备份 |\n| 终止 | 应用处理 SIGTERM 避免 shell 吞信号 设置合适 grace period |\n| 配置 | ConfigMap Secret Downward API 与镜像解耦 |\n| 数据 | 关键数据不要写 rootfs 持久化使用合适 Volume |\n| 部署 | 使用多副本 rolling update PDB 反亲和和拓扑分布 |\n| Service | 不直接发布 Pod IP 用 Service 和 DNS 名称暴露 |\n| EndpointSlice | 大规模 Service 优先关注 EndpointSlice 变化和 ready 条件 |\n| kube-proxy | 大规模集群评估 IPVS 排查时看实际代理模式 |\n| DNS | 注意 ndots TTL 客户端缓存 CoreDNS 容量和上游延迟 |\n| Ingress | 把 host path TLS DNS LB 证书纳入声明式管理 |\n| L4 L7 | L4 追求高性能入口 L7 负责 HTTP 治理和安全能力 |\n| CDN POP | 静态缓存和动态加速分开设计 控制回源链路和故障域 |\n\n最后可以用一条端到端链路检查服务是否真正可用：\n\n```mermaid\nflowchart LR\n    Request[\"请求\"]\n    Name[\"服务名\"]\n    CoreDNS[\"CoreDNS\"]\n    Service[\"Service\"]\n    Slice[\"EndpointSlice\"]\n    Proxy[\"kube-proxy\"]\n    Probe[\"Readiness\"]\n    Pod[\"Pod\"]\n    Termination[\"优雅终止\"]\n\n    Request --> Name\n    Name --> CoreDNS\n    CoreDNS --> Service\n    Service --> Slice\n    Slice --> Probe\n    Probe --> Proxy\n    Proxy --> Pod\n    Pod --> Termination\n```\n\n这条链路中的任一环都可能导致“服务不可访问”：DNS 解析不对、Service selector 错误、EndpointSlice 里没有 Ready 地址、kube-proxy 规则异常、Pod readiness 未通过、应用终止不优雅。生产排查时按链路分层验证，比只看一个对象更可靠。", "subs": ["L4 和 L7 的职责差异", "L4 Provider L7 Provider 和 Ingress Controll", "CDN POP 和边缘加速", "实践建议"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
