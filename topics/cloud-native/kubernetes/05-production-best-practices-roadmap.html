<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({startOnLoad:false, theme:'base', themeVariables:{
    background:'#fffdf5', primaryColor:'#fff9d6', primaryBorderColor:'#1f2933',

<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

    <button class="reset" id="reset">重置进度</button>
  </div>
</header>

    <h2 id="d-title"></h2>

    </div>
    <button class="edit-btn edit-only" id="edit-section">编辑</button>
    <button class="close" id="d-close">×</button>

  <div class="nav-hint"><kbd>←</kbd><kbd>→</kbd> 切换小节</div>

<section class="diagram-modal" id="diagram-modal" role="dialog" aria-modal="true" aria-label="放大图表">
  <header>
    <strong>Mermaid 图表</strong>
    <div class="diagram-controls" aria-label="图表缩放">
      <button id="diagram-zoom-out" title="缩小">-</button>
      <span class="diagram-zoom" id="diagram-zoom">100%</span>
      <button id="diagram-zoom-in" title="放大">+</button>
    </div>
    <button class="diagram-close" id="diagram-close" title="关闭">×</button>
  </header>
  <div class="diagram-body" id="diagram-body">
    <div class="diagram-canvas" id="diagram-canvas">
      <div class="diagram-inner" id="diagram-inner"></div>
    </div>
  </div>
</section>

<script id="data" type="application/json">{"title": "Kubernetes 生产环境最佳实践", "intro": "", "parts": [{"title": "应用开发", "sections": [{"title": "健康检查", "content": "本册以 Kubernetes 1.36 为修订基线；历史案例保留经验背景，具体参数需按负载和插件版本验证。涉及新机制时与第一至三册交叉阅读，操作验收参见第六、七册。\n\nKubernetes 应用开发的最佳实践。\n\n\nKubernetes 提供 startup、liveness 和 readiness 三类探针。startup 成功前会抑制另外两类探针执行，适合保护慢启动应用；readiness 控制就绪，liveness 判断是否需要重启，两者不应共用会被外部依赖故障拖垮的判据。\n\n**就绪性探针确定容器何时可以接收流量。**\n\nkubelet 执行检查并决定应用是否可以接收流量。\n\n**存活性探针确定容器何时应该重启。**\n\nkubelet 执行检查并决定容器是否应该重启。\n\n**资源：**\n\n- 官方 Kubernetes 文档提供了一些关于如何[配置存活性、就绪性和启动探针](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)的实用建议。\n- [存活性探针是危险的](https://srcco.de/posts/kubernetes-liveness-probes-are-dangerous.html) 提供了一些关于如何在就绪性探针中设置（或不设置）依赖关系的信息。\n\n#### 容器具有就绪性探针\n\n> 请注意，就绪性和存活性探针没有默认值。\n\n如果您不设置就绪性探针，kubelet 会假设应用在容器启动时就可以接收流量。\n\n如果容器需要 2 分钟才能启动，那么在这 2 分钟内所有对它的请求都会失败。\n\n#### 容器在出现致命错误时崩溃\n\n如果应用遇到不可恢复的错误，[您应该让它崩溃](https://blog.colinbreck.com/kubernetes-liveness-and-readiness-probes-revisited-how-to-avoid-shooting-yourself-in-the-other-foot/#letitcrash)。\n\n此类不可恢复错误的示例包括：\n\n- 未捕获的异常\n- 代码中的拼写错误（对于动态语言）\n- 无法加载头文件或依赖项\n\n请注意，您不应该发出失败的存活性探针信号。\n\n相反，您应该立即退出进程并让 kubelet 重启容器。\n\n#### 配置被动的存活性探针\n\n存活性探针旨在在容器卡住时重启容器。\n\n考虑以下场景：如果您的应用正在处理无限循环，就没有办法退出或寻求帮助。\n\n当进程消耗 100% CPU 时，它没有时间回复（其他）就绪性探针检查，最终会被从服务中移除。\n\n但是，Pod 仍然注册为当前部署的活动副本。\n\n如果您没有存活性探针，它会保持 _运行_ 状态但与服务分离。\n\n换句话说，进程不仅不处理任何请求，还在消耗资源。\n\n_您应该怎么做？_\n\n1. 从您的应用暴露一个端点\n2. 端点始终返回成功响应\n3. 从存活性探针消费该端点\n\n请注意，您不应该使用存活性探针来处理应用中的致命错误并请求 Kubernetes 重启应用。\n\n相反，您应该让应用崩溃。\n\n存活性探针应该仅用作进程无响应时的恢复机制。\n\n#### 存活性探针的值与就绪性探针不同\n\n当存活性探针和就绪性探针指向同一个端点时，探针的效果会合并。\n\n当应用发出不准备就绪或不活跃的信号时，kubelet 会同时将容器从服务中分离并删除它。\n\n您可能会注意到连接中断，因为容器没有足够的时间排空当前连接或处理传入的连接。\n\n您可以在以下[讨论优雅关闭的文章](https://freecontent.manning.com/handling-client-requests-properly-with-kubernetes/)中深入了解。", "subs": ["容器具有就绪性探针", "容器在出现致命错误时崩溃", "配置被动的存活性探针", "存活性探针的值与就绪性探针不同"]}]}, {"title": "应用是独立的", "sections": [{"title": "就绪性探针是独立的", "content": "您可能会倾向于仅在所有依赖项（如数据库或后端 API）也准备就绪时才发出应用的就绪信号。\n\n如果应用连接到数据库，您可能认为在数据库_准备就绪_之前返回失败的就绪性探针是个好主意——但这不是。\n\n考虑以下场景：您有一个依赖于后端 API 的前端应用。\n\n如果 API 不稳定（例如，由于错误而时不时不可用），就绪性探针失败，前端应用中的依赖就绪性也会失败。\n\n您就会遇到停机。\n\n更一般地说，**下游依赖项的故障可能会传播到所有上游应用**，最终也会导致面向前端的层崩溃。\n\n\n就绪性探针不包括对以下服务的依赖：\n\n- 数据库\n- 数据库迁移\n- API\n- 第三方服务\n\n您可以[在这篇文章中探索当就绪性探针中有依赖项时会发生什么](https://blog.colinbreck.com/kubernetes-liveness-and-readiness-probes-how-to-avoid-shooting-yourself-in-the-foot/#shootingyourselfinthefootwithreadinessprobes)。", "subs": ["数据库", "数据库迁移", "API", "第三方服务"]}, {"title": "应用重试连接到依赖服务", "content": "当应用启动时，它不应该因为数据库等依赖项未准备就绪而崩溃。\n\n相反，应用应该不断重试连接到数据库直到成功。\n\nKubernetes 期望应用组件可以按任何顺序启动。\n\n当您确保应用可以重新连接到数据库等依赖项时，您知道可以提供更强大和弹性的服务。", "subs": []}]}, {"title": "优雅关闭", "sections": [{"title": "SIGTERM 如何触发协议级排空和有界退出", "content": "<!-- src: temp/kubernetes-zh-docs/13-Pod/Pod-的生命周期.md; temp/kubernetes-zh-docs/11-容器/容器生命周期回调.md -->\n\nSIGTERM 是终止通知，应用收到后仍需执行有界的清理流程。HTTP 服务通常先停止接受新工作，再完成在途请求、关闭空闲连接并退出；消息消费者则要停止拉取、完成或归还已取任务，避免提前确认消息造成丢失。\n\nPod 删除时，EndpointSlice 会反映终止状态，数据面消费更新需要时间。终止端点不一定立即从切片消失，ready、serving、terminating 等条件帮助消费者处理排空；不能把对象删除请求当成所有入口已经停止转发的证据。\n\n| 步骤 | 应用动作 | 验证方式 |\n|---|---|---|\n| 收到终止通知 | 记录时间并进入排空状态 | 日志与 deletionTimestamp 对照 |\n| 停止新工作 | 关闭监听或按协议拒绝新请求 | 客户端请求与连接统计 |\n| 完成在途工作 | 等待请求、消息或事务完成 | 成功结果与未完成数量 |\n| 有界退出 | 关闭空闲连接并正常退出 | 退出码与宽限期对照 |\n\n不要无限等待长连接：应设计最大连接生命周期、协议级关闭通知和客户端重连。进程按时退出只是第一步，还要统计发布窗口中的错误、超时和重复处理；下一节再说明 kubelet 宽限期如何与这些动作配合。", "subs": []}, {"title": "终止宽限期如何覆盖摘流和请求排空", "content": "<!-- src: temp/kubernetes-zh-docs/13-Pod/Pod-的生命周期.md -->\n\nPod 删除、EndpointSlice 更新和各代理消费更新是并行推进的，应用可能在终止初期继续收到少量流量。应先进入排空状态、使 readiness 失败，再按协议停止接收新工作并完成已接受请求，不能把 SIGTERM 处理成立即退出。\n\npreStop 消耗同一份 terminationGracePeriodSeconds，不会增加独立的完整宽限期。固定 sleep 只能留出传播时间，不能证明全部代理已经摘流；应结合入口刷新周期和实测设计。\n\n| 阶段 | 观察证据 |\n|---|---|\n| 发起删除 | deletionTimestamp |\n| 后端摘流 | EndpointSlice ready/terminating、代理后端状态 |\n| 请求排空 | 未完成请求数、连接状态、应用日志 |\n| 进程退出 | 退出码、是否被强制终止 |\n\n最终验收必须从真实客户端持续请求并统计错误、超时和重复处理；仅看到 Pod 在宽限期内消失不足以证明无损发布。", "subs": []}, {"title": "容器入口如何让应用收到终止信号", "content": "<!-- src: temp/kubernetes-zh-docs/11-容器/容器生命周期回调.md -->\n\nDockerfile 的 exec 形式让应用成为容器主进程，避免额外 shell 截获信号；它本身并不会替应用实现优雅关闭。程序还必须注册信号处理、停止接收工作、等待在途请求并按时退出。\n\n```dockerfile\nENTRYPOINT [\"/app/server\"]\n```\n\n如果必须运行初始化 shell，最后用 `exec /app/server` 替换 shell；多进程程序还要处理子进程信号和回收。验证时检查进程树与实际 SIGTERM 日志，在保持连接的情况下删除 Pod，确认没有到达宽限期后被 SIGKILL。应用根本没收到信号与收到后排空超时是两类故障，应分别定位。", "subs": []}, {"title": "关闭所有空闲的保持活动套接字", "content": "如果调用应用没有关闭 TCP 连接（例如使用 TCP 保持活动或连接池），它将连接到一个 Pod 而不使用该服务中的其他 Pod。\n\n_但是当 Pod 被删除时会发生什么？_\n\n理想情况下，请求应该转到另一个 Pod。\n\n但是，调用应用与即将被终止的 Pod 有一个长期连接，它会继续使用它。\n\n另一方面，您不应该突然终止长期连接。\n\n相反，您应该在关闭应用之前终止它们。\n\n您可以在这篇关于[优雅关闭 Nodejs HTTP 服务器](http://dillonbuchanan.com/programming/gracefully-shutting-down-a-nodejs-http-server/)的文章中了解保持活动连接。", "subs": []}]}, {"title": "容错性", "sections": [{"title": "副本数量如何与故障域和容量共同设计", "content": "<!-- src: temp/kubernetes-zh-docs/13-Pod/干扰（Disruptions）.md -->\n\n您的集群节点可能因多种原因随时消失：\n\n- 物理机器的硬件故障\n- 云提供商或虚拟机管理程序故障\n- 内核恐慌\n\n部署在这些节点上的 Pod 也会丢失。\n\n此外，还有其他 Pod 可能被删除的场景：\n\n- 直接删除 pod（意外）\n- 排空节点\n- 从节点移除 pod 以允许另一个 Pod 适合该节点\n\n上述任何场景都可能影响应用的可用性并可能导致停机。\n\n您应该防止所有 Pod 都不可用且无法提供实时流量的场景。\n\n\n多副本的作用是让实例故障时仍有服务能力，但 replicas 大于一并不保证高可用。如果副本落在同一节点、可用区或共享同一个单点依赖，一次故障仍可能中断整个服务。\n\n需要一起设计拓扑分散、反亲和、滚动更新参数和 PDB；严格约束也可能在容量不足时导致 Pending。副本预算必须考虑失去一个故障域后剩余实例是否仍能承受流量，而不是只计算正常时平均 CPU。\n\n```bash\nkubectl get pods -n demo -l app=web -o wide\nkubectl get pdb -n demo\n```\n\n上述命令只能验证对象分布与预算。应通过单节点维护和真实请求对照，确认剩余副本可用、扩容有空间、下游连接数不被放大到超限，再决定最小副本数。", "subs": ["物理机器的硬件故障", "云提供商或虚拟机管理程序故障", "内核恐慌", "直接删除 pod（意外）", "排空节点", "从节点移除 pod 以允许另一个 Pod 适合该节点"]}, {"title": "避免 Pod 被放置在单个节点上", "content": "**即使您运行多个 Pod 副本，也不能保证丢失节点不会导致服务停机。**\n\n考虑以下场景：您在单个集群节点上有 11 个副本。\n\n如果节点不可用，11 个副本会丢失，您就会停机。\n\n[您应该对部署应用反亲和性规则，以便 Pod 分布在集群的所有节点上](https://cloudmark.github.io/Node-Management-In-GKE/#pod-anti-affinity-rules)。\n\n[Pod 间亲和性和反亲和性](https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#inter-pod-affinity-and-anti-affinity)文档描述了如何更改您的 Pod 位置（或不）在同一节点上。", "subs": []}, {"title": "设置 Pod 中断预算", "content": "当节点被排空时，该节点上的所有 Pod 都会被删除并重新调度。\n\n_但是如果您在重负载下并且不能丢失超过 50% 的 Pod 怎么办？_\n\n排空事件可能会影响您的可用性。\n\n为了保护部署免受可能同时关闭多个 Pod 的意外事件影响，您可以定义 Pod 中断预算。\n\n想象一下说：_\"Kubernetes，请确保我的应用始终有至少 5 个 Pod 在运行。\"_\n\n如果最终状态导致该部署的 Pod 少于 5 个，Kubernetes 将阻止排空事件。\n\n官方文档是了解[Pod 中断预算](https://kubernetes.io/docs/concepts/workloads/pods/disruptions/)的绝佳起点。", "subs": []}]}, {"title": "资源利用", "sections": [{"title": "为所有容器设置内存限制和请求", "content": "您可以将 Kubernetes 想象为一个熟练的俄罗斯方块玩家。\n\nDocker 容器是方块；服务器是棋盘，调度器是玩家。\n\n![Kubernetes 是最佳俄罗斯方块玩家](tetris.svg)\n\n为了最大化调度器的效率，您应该与 Kubernetes 分享资源利用、工作负载优先级和开销等详细信息。\n\n\n资源限制用于约束容器可以利用的 CPU 和内存量，并使用 `containerSpec` 的 resources 属性设置。\n\n调度器使用这些作为决定哪个节点最适合当前 Pod 的指标之一。\n\n没有内存限制的容器根据调度器的说法内存利用率为零。\n\n无限数量的 Pod 可以在任何节点上调度，导致资源过度分配和潜在的节点（和 kubelet）崩溃。\n\nCPU 限制也是如此。\n\n_但是您应该总是为内存和 CPU 设置限制和请求吗？_\n\n是也不是。\n\n如果您的进程超过内存限制，进程会被终止。\n\n由于 CPU 是可压缩资源，如果您的容器超过限制，进程会被限制。\n\n即使它本可以使用当时可用的一些 CPU。\n\n**[CPU 限制很难。](https://www.reddit.com/r/kubernetes/comments/cmp7jj/multithreading_in_a_container_with_limited/ew52fcj/)**\n\n如果您想深入了解 CPU 和内存限制，您应该查看以下文章：\n\n- [理解 kubernetes 中的资源限制：内存](https://medium.com/@betz.mark/understanding-resource-limits-in-kubernetes-memory-6b41e9a955f9)\n- [理解 kubernetes 中的资源限制：CPU 时间](https://medium.com/@betz.mark/understanding-resource-limits-in-kubernetes-cpu-time-9eff74d3161b)\n\n> 请注意，如果您不确定什么是_正确的_ CPU 或内存限制，您可以在 Kubernetes 中使用[垂直 Pod 自动扩缩器](https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler)，并开启推荐模式。自动扩缩器会分析您的应用并为其推荐限制。", "subs": ["理解 kubernetes 中的资源限制"]}, {"title": "CPU 请求如何依据实际负载确定", "content": "<!-- src: temp/kubernetes-zh-docs/19-配置/为-Pod-和容器管理资源.md -->\n\nCPU request 参与调度和资源竞争时的相对分配，不应设置统一的 1 CPU 上限。多线程计算、低延迟服务和专属 CPU 场景都可能合理地请求多个核；过低 request 会让调度器过度装箱，也会抬高以 request 为分母的 HPA 利用率。\n\n先观察正常、峰值、启动及故障降级窗口，结合吞吐和尾延迟确定请求。只有平均 CPU 样本不足以覆盖突发；也不要把 request 当成业务在任何时刻都独占的物理核。\n\n| 负载 | 决策重点 |\n|---|---|\n| 在线服务 | 目标延迟、突发余量和 HPA 行为 |\n| 批处理 | 总运行时间、并行度与成本 |\n| 专属 CPU | CPU Manager 策略、整数 CPU 与 QoS 条件 |\n\n调小请求后应检查节点争用、限流和业务延迟；若只看到调度成功数增加，不能据此判断资源利用更合理。", "subs": []}, {"title": "CPU 限制如何在突发性能和租户隔离之间取舍", "content": "<!-- src: temp/kubernetes-zh-docs/19-配置/为-Pod-和容器管理资源.md -->\n\nCPU limit 通过运行时与 cgroup 约束资源使用，限流可能使延迟增加而不触发容器重启。对突发敏感的在线服务，较紧的 limit 可能成为瓶颈；对共享节点和不可信任务，完全不限制又可能扩大资源争用。\n\n应结合 requests、节点余量、租户模型和工作负载特征决定是否设置及设多大，不能笼统建议所有服务禁用。CPU 使用接近限制不必然说明异常，应比较 throttling、应用吞吐、P99 与节点压力。\n\n| 现象 | 需要核对 |\n|---|---|\n| CPU 平均值低但 P99 高 | 短时突发、限流周期和应用锁竞争 |\n| 去掉 limit 后本服务变快 | 同节点其他租户延迟是否恶化 |\n| requests 很小但 limits 很大 | 调度装箱与 HPA 分母是否合理 |\n\n每次调整应保存前后同负载对照。LimitRange 可以给默认值或范围，但默认值仍需按命名空间负载类型规划。", "subs": []}, {"title": "LimitRange 如何提供默认值并限制单对象资源", "content": "<!-- src: temp/kubernetes-zh-docs/21-策略/限制范围（LimitRange）.md -->\n\nLimitRange 在准入阶段对容器等对象设置默认资源或检查允许范围。它解决的是单对象默认配置和边界，不是命名空间内全部 Pod 的资源总量，也不负责限制 ConfigMap 总数。\n\n```yaml\napiVersion: v1\nkind: LimitRange\nmetadata:\n  name: container-defaults\n  namespace: demo\nspec:\n  limits:\n    - type: Container\n      defaultRequest:\n        cpu: 100m\n        memory: 128Mi\n      default:\n        cpu: \"1\"\n        memory: 512Mi\n```\n\n这些数值仅示意配置结构。创建缺少 resources 的测试 Pod 后读取服务端对象，确认注入的请求与上限；已有 Pod 不会因此统一改写。还应测试显式 resources、Quota 约束以及 HPA 计算，避免默认请求意外改变扩缩容行为。", "subs": []}, {"title": "为 Pod 设置适当的服务质量 (QoS)", "content": "当节点进入过度提交状态（即使用过多资源）时，Kubernetes 尝试驱逐该节点中的一些 Pod。\n\nKubernetes 根据明确定义的逻辑对 Pod 进行排名和驱逐。\n\n您可以在官方文档中找到更多关于[为 Pod 配置服务质量](https://kubernetes.io/docs/tasks/configure-pod-container/quality-service-pod/)的信息。", "subs": []}]}, {"title": "标记资源", "sections": [{"title": "资源定义了技术标签", "content": "标签是您用来组织 Kubernetes 对象的机制。\n\n标签是没有预定义含义的键值对。\n\n它们可以应用于集群中从 Pod 到服务、Ingress 清单、端点等的所有资源。\n\n您可以使用标签按目的、所有者、环境或其他标准对资源进行分类。\n\n因此，您可以选择一个标签来标记环境中的 Pod，如\"此 pod 在生产环境中运行\"或\"支付团队拥有该部署\"。\n\n您也可以完全省略标签。\n\n但是，您可能想要考虑使用标签来涵盖以下类别：\n\n- 技术标签，如环境\n- 自动化标签\n- 与您的业务相关的标签，如成本中心分配\n- 与安全相关的标签，如合规要求\n\n\n您可以用以下标签标记您的 Pod：\n\n- `name`，应用的名称，如\"用户 API\"\n- `instance`，标识应用实例的唯一名称（您可以使用容器镜像标签）\n- `version`，应用的当前版本（增量计数器）\n- `component`，架构中的组件，如\"API\"或\"数据库\"\n- `part-of`，此应用所属的更高级别应用的名称，如\"支付网关\"\n- `managed-by`，用于管理应用操作的工具，如\"kubectl\"或\"Helm\"\n\n以下是如何在部署中使用这些标签的示例：\n\n```yaml|highlight=6-11,20-24|title=deployment.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: deployment\n  labels:\n    app.kubernetes.io/name: user-api\n    app.kubernetes.io/instance: user-api-5fa65d2\n    app.kubernetes.io/version: \"42\"\n    app.kubernetes.io/component: api\n    app.kubernetes.io/part-of: payment-gateway\n    app.kubernetes.io/managed-by: kubectl\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      application: my-app\n  template:\n    metadata:\n      labels:\n        app.kubernetes.io/name: user-api\n        app.kubernetes.io/instance: user-api-5fa65d2\n        app.kubernetes.io/version: \"42\"\n        app.kubernetes.io/component: api\n        app.kubernetes.io/part-of: payment-gateway\n    spec:\n      containers:\n      - name: app\n        image: myapp\n```\n\n这些标签是[官方文档推荐的](https://kubernetes.io/docs/concepts/overview/working-with-objects/common-labels/)。\n\n> 请注意，建议标记**所有资源**。", "subs": ["技术标签，如环境", "自动化标签", "与您的业务相关的标签", "与安全相关的标签", "name，应用的名称，如\"用户 API\"", "instance"]}, {"title": "资源定义了业务标签", "content": "您可以用以下标签标记您的 Pod：\n\n- `owner`，用于标识谁负责该资源\n- `project`，用于确定资源所属的项目\n- `business-unit`，用于标识与资源关联的成本中心或业务单元；通常用于成本分配和跟踪\n\n以下是如何在部署中使用这些标签的示例：\n\n```yaml|highlight=6-8,17-19|title=deployment.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: deployment\n  labels:\n    owner: payment-team\n    project: fraud-detection\n    business-unit: \"80432\"\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      application: my-app\n  template:\n    metadata:\n      labels:\n        owner: payment-team\n        project: fraud-detection\n        business-unit: \"80432\"\n    spec:\n      containers:\n      - name: app\n        image: myapp\n```\n\n您可以在[AWS 标记策略页面](https://aws.amazon.com/answers/account-management/aws-tagging-strategies/)上探索资源的标签和标记。\n\n该文章不是特定于 Kubernetes 的，但探索了一些最常见的资源标记策略。\n\n> 请注意，建议标记**所有资源**。", "subs": ["owner，用于标识谁负责该资源", "project", "business"]}, {"title": "资源定义了安全标签", "content": "您可以用以下标签标记您的 Pod：\n\n- `confidentiality`，资源支持的数据机密性级别的标识符\n- `compliance`，旨在遵守特定合规要求的工作负载的标识符\n\n以下是如何在部署中使用这些标签的示例：\n\n```yaml|highlight=6-11,20-24|title=deployment.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: deployment\n  labels:\n    confidentiality: official\n    compliance: pci\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      application: my-app\n  template:\n    metadata:\n      labels:\n        confidentiality: official\n        compliance: pci\n    spec:\n      containers:\n      - name: app\n        image: myapp\n```\n\n您可以在[AWS 标记策略页面](https://aws.amazon.com/answers/account-management/aws-tagging-strategies/)上探索资源的标签和标记。\n\n该文章不是特定于 Kubernetes 的，但探索了一些最常见的资源标记策略。\n\n> 请注意，建议标记**所有资源**。", "subs": ["confidentiality", "compliance"]}]}, {"title": "日志记录", "sections": [{"title": "应用记录到 `stdout` 和 `stderr`", "content": "应用日志可以帮助您了解应用内部发生的情况。\n\n日志对于调试问题和监控应用活动特别有用。\n\n\n有两种日志记录策略：_被动_和_主动_。\n\n使用被动日志记录的应用不知道日志记录基础设施，并将日志消息记录到标准输出。\n\n这个最佳实践是[十二要素应用](https://12factor.net/logs)的一部分。\n\n在主动日志记录中，应用与中间聚合器建立网络连接，向第三方日志服务发送数据，或直接写入数据库或索引。\n\n主动日志记录被认为是反模式，应该避免。", "subs": []}, {"title": "避免使用边车进行日志记录（如果可以）", "content": "如果您希望[对具有非标准日志事件模型的应用应用日志转换](https://rclayton.silvrback.com/container-services-logging-with-docker#effective-logging-infrastructure)，您可能想要使用边车容器。\n\n使用边车容器，您可以在将日志条目发送到其他地方之前对其进行规范化。\n\n例如，您可能想要在将其发送到日志记录基础设施之前将 Apache 日志转换为 Logstash JSON 格式。\n\n但是，如果您控制应用，您可以一开始就输出正确的格式。\n\n您可以为集群中的每个 Pod 节省运行额外容器的成本。", "subs": []}]}, {"title": "扩缩容", "sections": [{"title": "容器不在其本地文件系统中存储任何状态", "content": "容器有本地文件系统，您可能想要使用它来持久化数据。\n\n但是，在容器的本地文件系统中存储持久数据会阻止包含的 Pod 水平扩缩（即通过添加或删除 Pod 副本）。\n\n这是因为，通过使用本地文件系统，每个容器维护自己的\"状态\"，这意味着 Pod 副本的状态可能会随时间分歧。这导致从用户角度来看行为不一致（例如，当请求命中一个 Pod 时，特定用户信息可用，但当请求命中另一个 Pod 时不可用）。\n\n相反，任何持久信息都应该保存在 Pod 外部的中央位置。例如，在集群中的 PersistentVolume 中，或者更好的是在集群外部的某些存储服务中。", "subs": []}, {"title": "对具有可变使用模式的应用使用水平 Pod 自动扩缩器", "content": "[水平 Pod 自动扩缩器 (HPA)](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/) 是 Kubernetes 的内置功能，它监控您的应用并根据当前使用情况自动添加或删除 Pod 副本。\n\n配置 HPA 允许您的应用在任何流量条件下保持可用和响应，包括意外的流量峰值。\n\n要配置 HPA 自动扩缩您的应用，您必须创建一个[HorizontalPodAutoscaler](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.16/#horizontalpodautoscaler-v1-autoscaling)资源，它定义了要为您的应用监控的指标。\n\nHPA 可以监控内置资源指标（Pod 的 CPU 和内存使用情况）或自定义指标。在自定义指标的情况下，您还负责收集和暴露这些指标，例如，您可以使用[Prometheus](https://prometheus.io/)和[Prometheus 适配器](https://github.com/DirectXMan12/k8s-prometheus-adapter)来做到这一点。", "subs": []}, {"title": "VPA 如何从推荐逐步进入自动更新", "content": "<!-- src: temp/kubernetes-zh-docs/35-配置-Pods-和容器/调整分配给容器的-CPU-和内存资源.md -->\n\nVPA 是独立于 Kubernetes 核心安装的组件，其成熟度与行为由实际版本、CRD、Updater 和 Admission 配置共同决定。不能以一份历史教程的 Beta 标签，长期推出“不应在生产使用”的结论。\n\n先使用 Off 模式积累推荐并比较峰值、OOM、延迟和成本；Initial 在新建时设置资源，Recreate 通过驱逐重建更新。支持 InPlaceOrRecreate 的版本会先尝试原地调整，但可能退回重建，不能视为无中断保证。\n\n上线前检查资源上下界、PDB、节点可用容量和更新失败行为。若 HPA 按 CPU/内存利用率伸缩，VPA 修改 request 会改变 HPA 分母，需要明确二者分工。原地调整本体和 VPA 集成也应分别验收，具体机制及项目来源见[第三册 VPA 章节](./03-production-and-migration.md)。", "subs": []}, {"title": "如果您有高度变化的工作负载，请使用集群自动扩缩器", "content": "[集群自动扩缩器](https://github.com/kubernetes/autoscaler/tree/master/cluster-autoscaler)是另一种类型的\"自动扩缩器\"（除了[水平 Pod 自动扩缩器](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/)和[垂直 Pod 自动扩缩器](https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler)）。\n\n集群自动扩缩器可以通过添加或删除工作节点来自动扩缩集群的大小。\n\n当 Pod 由于现有工作节点资源不足而无法调度时，会发生扩缩操作。在这种情况下，集群自动扩缩器创建一个新的工作节点，以便可以调度 Pod。类似地，当现有工作节点的利用率较低时，集群自动扩缩器可以通过驱逐其中一个工作节点的所有工作负载并删除它来缩容。\n\n使用集群自动扩缩器对于高度可变的工作负载很有意义，例如，当 Pod 数量可能在短时间内成倍增加，然后回到之前的值时。在这种情况下，集群自动扩缩器允许您满足需求峰值，而不会因为过度配置工作节点而浪费资源。\n\n但是，如果您的工作负载变化不大，设置集群自动扩缩器可能不值得，因为它可能永远不会被触发。如果您的工作负载缓慢且单调地增长，监控现有工作节点的利用率并在它们达到临界值时手动添加额外的工作节点可能就足够了。", "subs": []}]}, {"title": "配置和密钥", "sections": [{"title": "外部化所有配置", "content": "配置应该维护在应用代码外部。\n\n这有几个好处。首先，更改配置不需要重新编译应用。其次，配置可以独立发布；能否在运行时生效取决于注入方式和应用重载能力。第三，相同的代码可以在不同的环境中使用。\n\n在 Kubernetes 中，配置可以保存在 ConfigMaps 中，然后可以作为卷挂载到容器中或作为环境变量传递。\n\n仅在 ConfigMaps 中保存非敏感配置。对于敏感信息（如凭据），使用 Secret 资源。", "subs": []}, {"title": "Secret 注入方式如何匹配轮换与应用重载", "content": "<!-- src: temp/kubernetes-zh-docs/19-配置/Secret.md -->\n\n卷挂载通常更适合需要轮换的 Secret，因为 kubelet 可以逐步更新投射内容；但应用必须重新读取文件，使用 subPath 挂载也不会获得普通投射卷的更新行为。环境变量不会随 Secret 更新自动刷新，需要重建 Pod 才获得新值。\n\n两种方式都不能阻止拥有 Pod exec、节点或等效权限的人获取凭据。Secret 的 Base64 编码也不是加密，应同时配置访问权限、静态加密或外部密钥系统，并限制日志和错误报告中的暴露。\n\n| 选择 | 适用前提 | 验收 |\n|---|---|---|\n| 文件投射 | 应用支持重新读取 | 新凭据生效且旧凭据按计划失效 |\n| 环境变量 | 明确接受重建轮换 | 新 Pod 启动并使用新凭据 |\n| 外部 Secret 组件 | 已安装并支持目标后端 | 同步状态、应用结果和故障重试 |\n\n生产中应验证完整轮换过程，而不是只确认 Secret 对象 resourceVersion 变化。", "subs": []}]}, {"title": "集群配置", "sections": [{"title": "已批准的 Kubernetes 配置", "content": "集群配置的最佳实践。\n\n\nKubernetes 很灵活，可以以多种不同的方式进行配置。\n\n但是您如何知道集群的推荐配置是什么？\n\n最佳选择是将您的集群与标准参考进行比较。\n\n对于 Kubernetes，参考是互联网安全中心 (CIS) 基准。\n\n#### 集群通过 CIS 基准测试\n\n互联网安全中心提供多个指南和基准测试，用于保护代码的最佳实践。\n\n他们还维护一个 Kubernetes 基准，您可以从[官方网站下载](https://www.cisecurity.org/benchmark/kubernetes/)。\n\n虽然您可以阅读冗长的指南并手动检查您的集群是否符合要求，但更简单的方法是下载并执行[`kube-bench`](https://github.com/aquasecurity/kube-bench)。\n\n[`kube-bench`](https://github.com/aquasecurity/kube-bench) 是一个旨在自动化 CIS Kubernetes 基准并报告集群中错误配置的工具。\n\n示例输出：\n\n```terminal|title=bash\n[INFO] 1 Master Node Security Configuration\n[INFO] 1.1 API Server\n[WARN] 1.1.1 Ensure that the --anonymous-auth argument is set to false (Not Scored)\n[PASS] 1.1.2 Ensure that the --basic-auth-file argument is not set (Scored)\n[PASS] 1.1.3 Ensure that the --insecure-allow-any-token argument is not set (Not Scored)\n[PASS] 1.1.4 Ensure that the --kubelet-https argument is set to true (Scored)\n[PASS] 1.1.5 Ensure that the --insecure-bind-address argument is not set (Scored)\n[PASS] 1.1.6 Ensure that the --insecure-port argument is set to 0 (Scored)\n[PASS] 1.1.7 Ensure that the --secure-port argument is not set to 0 (Scored)\n[FAIL] 1.1.8 Ensure that the --profiling argument is set to false (Scored)\n```\n\n> 请注意，无法使用 `kube-bench` 检查托管集群（如 GKE、EKS 和 AKS）的主节点。主节点由云提供商控制和管理。\n\n#### 禁用元数据云提供商元数据 API\n\n云平台（AWS、Azure、GCE 等）经常向实例本地暴露元数据服务。\n\n默认情况下，这些 API 可以被在实例上运行的 Pod 访问，并且可以包含该节点的云凭据或配置数据（如 kubelet 凭据）。\n\n这些凭据可用于在集群内或同一账户下的其他云服务中升级权限。\n\n#### 限制对 alpha 或 beta 功能的访问\n\nAlpha 和 beta Kubernetes 功能正在积极开发中，可能有导致安全漏洞的限制或错误。\n\n始终评估 alpha 或 beta 功能可能提供的价值与对安全态势的潜在风险。\n\n如有疑问，请禁用您不使用的功能。", "subs": ["集群通过 CIS 基准测试", "禁用元数据云提供商元数据 API", "限制对 alpha 或 beta 功能的访问"]}]}, {"title": "身份验证", "sections": [{"title": "使用 OpenID (OIDC) 令牌作为用户身份验证策略", "content": "当您使用 `kubectl` 时，您会针对 kube-api 服务器组件进行身份验证。\n\nKubernetes 支持不同的身份验证策略：\n\n- **静态令牌**：难以失效，应该避免\n- **Bootstrap 令牌**：与上面的静态令牌相同\n- **基本身份验证**通过网络以明文传输凭据\n- **X509 客户端证书**需要定期更新和重新分发客户端证书\n- **服务账户令牌**是集群中运行的应用和工作负载的首选身份验证策略\n- **OpenID Connect (OIDC) 令牌**：最终用户的最佳身份验证策略，因为 OIDC 与您的身份提供商（如 AD、AWS IAM、GCP IAM 等）集成\n\n您可以在[官方文档](https://kubernetes.io/docs/reference/access-authn-authz/authentication/)中详细了解这些策略。\n\n\nKubernetes 支持各种身份验证方法，包括 OpenID Connect (OIDC)。\n\nOpenID Connect 允许单点登录 (SSO)，如您的 Google 身份连接到 Kubernetes 集群和其他开发工具。\n\n您不需要记住或单独管理凭据。\n\n您可以让多个集群连接到同一个 OpenID 提供商。\n\n您可以在这篇文章中[了解更多关于 Kubernetes 中的 OpenID 连接](https://thenewstack.io/kubernetes-single-sign-one-less-identity/)。", "subs": ["静态令牌：难以失效，应该避免", "Bootstrap 令牌", "基本身份验证通过网络以明文传输凭据", "X509 客户端证书需要定期更新和重新分发客户端证书", "服务账户令牌是集群中运行的应用和工作负载的首选身份验证策略", "OpenID Connect (OIDC) 令牌"]}]}, {"title": "基于角色的访问控制 (RBAC)", "sections": [{"title": "工作负载身份如何使用短期令牌与最小权限", "content": "<!-- src: temp/kubernetes-zh-docs/20-安全/服务账号.md -->\n\n基于角色的访问控制 (RBAC) 允许您定义如何访问集群中资源的策略。\n\n\nServiceAccount 适用于工作负载和自动化身份，人员访问应使用独立可审计的身份体系。每类工作负载分配专用账号和必要的 RoleBinding，不应共享 cluster-admin 凭据。\n\n现代 Pod 使用 TokenRequest 与投射卷提供有期限的令牌，kubelet 负责轮换文件，客户端负责重新读取。外部自动化使用短期令牌时，还要设计凭据刷新和受众，不能把一次生成的 token 固化进长期配置。\n\n```bash\nkubectl auth can-i list pods -n demo   --as=system:serviceaccount:demo:observer\n```\n\n该检查需要调用者有模拟身份权限，验证的是授权判定；真实凭据是否过期、网络是否可达仍需应用请求证明。机制与显式投射配置见[第一册](./01-architecture-and-control-plane.md)。", "subs": []}]}, {"title": "日志记录设置", "sections": [{"title": "日志有保留和归档策略", "content": "您应该收集并集中存储集群中运行的所有工作负载的日志以及集群组件本身的日志。\n\n\n日志保留周期应按故障追溯、审计要求、敏感性和存储成本确定；30–45 天只能作为历史案例，不能替代本组织的保留策略。\n\n#### 从节点、控制平面、审计收集日志\n\n要收集日志的内容：\n\n- 节点（kubelet、容器运行时）\n- 控制平面（API 服务器、调度器、控制器管理器）\n- Kubernetes 审计（对 API 服务器的所有请求）\n\n您应该收集的内容：\n\n- 应用名称。从元数据标签中检索。\n- 应用实例。从元数据标签中检索。\n- 应用版本。从元数据标签中检索。\n- 集群 ID。从 Kubernetes 集群中检索。\n- 容器名称。从 Kubernetes API 中检索。\n- 运行此容器的集群节点。从 Kubernetes 集群中检索。\n- 运行容器的 Pod 名称。从 Kubernetes 集群中检索。\n- 命名空间。从 Kubernetes 集群中检索。\n\n#### 优先使用每个节点上的守护进程来收集日志，而不是边车\n\n应用应该记录到 stdout 而不是文件。\n\n[每个节点上的守护进程可以从容器运行时收集日志](https://rclayton.silvrback.com/container-services-logging-with-docker#effective-logging-infrastructure)（如果记录到文件，每个 pod 可能需要一个边车容器）。\n\n#### 提供日志聚合工具\n\n使用日志聚合工具，如 EFK 堆栈（Elasticsearch、Fluentd、Kibana）、DataDog、Sumo Logic、Sysdig、GCP Stackdriver、Azure Monitor、AWS CloudWatch。\n\n---", "subs": ["从节点、控制平面、审计收集日志", "优先使用每个节点上的守护进程来收集日志", "提供日志聚合工具"]}]}, {"title": "治理", "sections": [{"title": "命名空间限制", "content": "创建、管理和管理命名空间的最佳实践。\n\n\n当您决定将集群隔离到命名空间中时，您应该防止资源滥用。\n\n您不应该允许用户使用超过您事先同意的资源。\n\n集群管理员可以使用配额和限制范围来设置约束，限制项目中使用的对象数量或计算资源量。\n\n如果您需要复习[限制范围](https://kubernetes.io/docs/concepts/policy/limit-range/)，您应该查看官方文档。", "subs": []}, {"title": "命名空间配置 LimitRange", "content": "没有限制的容器可能导致与其他容器的资源争用和计算资源的未优化消耗。\n\nKubernetes 有两个用于约束资源利用的功能：ResourceQuota 和 LimitRange。\n\n使用 LimitRange 对象，您可以为命名空间内的单个容器定义资源请求和限制的默认值。\n\n在该命名空间内创建的、未明确指定请求和限制值的任何容器都会被分配默认值。\n\n如果您需要复习[资源配额](https://kubernetes.io/docs/concepts/policy/resource-quotas/)，您应该查看官方文档。", "subs": []}, {"title": "命名空间有 ResourceQuotas", "content": "使用 ResourceQuotas，您可以限制命名空间内所有容器的总资源消耗。\n\n为命名空间定义资源配额会限制属于该命名空间的所有容器可以消耗的 CPU、内存或存储资源总量。\n\n您还可以为其他 Kubernetes 对象（如当前命名空间中的 Pod 数量）设置配额。\n\n如果需要限制 ConfigMap 数量，应使用 ResourceQuota 中的 `count/configmaps` 等对象数量配额；LimitRange 不承担对象计数限制。", "subs": []}]}, {"title": "Pod 安全标准与运行隔离", "sections": [{"title": "Pod Security Admission 如何逐步落实安全标准", "content": "<!-- src: temp/kubernetes-zh-docs/20-安全/Pod-安全性准入.md -->\n\n当 Pod 部署到集群中时，您应该防范：\n\n- 容器被破坏\n- 容器使用节点上不允许的资源，如进程、网络或文件系统\n\n更一般地说，您应该将 Pod 可以做的事情限制在最低限度。\n\n\nPodSecurityPolicy 已在 Kubernetes 1.25 移除。1.36 应使用 Pod Security Standards 描述安全级别，并由 Pod Security Admission（PSA）按命名空间标签执行；自定义业务规则再交给 CEL 策略或第三方准入。\n\n```yaml\napiVersion: v1\nkind: Namespace\nmetadata:\n  name: policy-trial\n  labels:\n    pod-security.kubernetes.io/enforce: baseline\n    pod-security.kubernetes.io/enforce-version: v1.36\n    pod-security.kubernetes.io/warn: restricted\n    pod-security.kubernetes.io/warn-version: v1.36\n    pod-security.kubernetes.io/audit: restricted\n    pod-security.kubernetes.io/audit-version: v1.36\n```\n\n这个示例以 baseline 强制、restricted 预警和审计，给迁移留出观察阶段。审查镜像用户、全部 init/sidecar 容器、capabilities、seccomp 和卷类型，整改后再收紧 enforce。固定策略版本可以控制升级时的规则变化，但也需要计划更新。\n\n已有运行中 Pod 不会因标签改变立即被驱逐，因此必须验证后续创建、滚动更新和故障重建。PSA 不负责 RBAC、Secret 加密或网络流量隔离；系统组件例外应精确限定，不应为了一个 DaemonSet 放宽整个业务集群。\n\n官方参考：[Pod Security Admission](https://v1-36.docs.kubernetes.io/docs/concepts/security/pod-security-admission/)。", "subs": ["容器被破坏", "容器使用节点上不允许的资源"]}, {"title": "禁用特权容器", "content": "在 Pod 中，容器可以以\"特权\"模式运行，对主机系统上的资源具有几乎无限制的访问权限。\n\n虽然有一些特定用例需要这种级别的访问，但一般来说，让容器这样做是安全风险。\n\n少数节点基础设施组件可能需要特权；普通 GPU 工作负载应优先使用设备插件或 DRA 分配设备，不能因为申请 GPU 就默认设为 privileged。\n\n您可以[从这篇文章中了解更多关于安全上下文和特权容器的信息](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)。", "subs": []}, {"title": "在容器中使用只读文件系统", "content": "readOnlyRootFilesystem 限制容器根文件系统写入，但独立挂载的数据卷仍可按自身模式写入，不能视为整个容器及数据完全不可变。\n\n这不仅减轻了一些旧的（和危险的）做法，如热补丁，还有助于防止恶意进程在容器内存储或操作数据的风险。\n\n在容器中运行只读文件系统可能听起来很简单，但可能会带来一些复杂性。\n\n_如果您需要写入日志或将文件存储在临时文件夹中怎么办？_\n\n您可以在这篇关于[在生产中安全运行 Docker 容器](https://medium.com/@axbaretto/running-docker-containers-securely-in-production-98b8104ef68)的文章中了解权衡。", "subs": []}, {"title": "防止容器以 root 身份运行", "content": "在容器中运行的进程与主机上的任何其他进程没有什么不同，除了它有一小块元数据声明它在容器中。\n\n因此，容器中的 root 与主机机器上的 root（uid 0）相同。\n\n如果用户设法突破在容器中以 root 身份运行的应用，他们可能能够以相同的 root 用户访问主机。\n\n配置容器使用非特权用户是防止权限升级攻击的最佳方法。\n\n如果您想了解更多，以下[文章提供了当您以 root 身份运行容器时会发生什么的详细解释示例](https://medium.com/@mccode/processes-in-containers-should-not-run-as-root-2feae3f0df3b)。", "subs": []}, {"title": "限制功能", "content": "Linux 功能使进程能够执行默认情况下只有 root 用户可以执行的许多特权操作中的一些。\n\n例如，`CAP_CHOWN` 允许进程\"对文件 UID 和 GID 进行任意更改\"。\n\n即使您的进程不以 `root` 身份运行，进程也有可能通过升级权限来使用这些类似 root 的功能。\n\n换句话说，如果您不想被破坏，您应该只启用您需要的功能。\n\n_但是应该启用哪些功能以及为什么？_\n\n以下两篇文章深入探讨了 Linux 内核中功能的理论和实践最佳实践：\n\n- [Linux 功能：为什么存在以及它们如何工作](https://blog.container-solutions.com/linux-capabilities-why-they-exist-and-how-they-work)\n- [Linux 功能实践](https://blog.container-solutions.com/linux-capabilities-in-practice)", "subs": ["Linux 功能", "Linux 功能实践"]}, {"title": "allowPrivilegeEscalation 如何约束进程提权", "content": "<!-- src: temp/kubernetes-zh-docs/20-安全/针对-Pod-和容器的-Linux-内核安全约束.md -->\n\n容器以非 root 用户运行，不表示它不能利用 setuid/setgid 或文件 capabilities 获得更多权限。allowPrivilegeEscalation: false 约束进程获得新权限，但仍需结合 capabilities、运行用户和 seccomp，不能单独当成完整隔离。\n\n```yaml\nsecurityContext:\n  runAsNonRoot: true\n  allowPrivilegeEscalation: false\n  capabilities:\n    drop: [ALL]\n  seccompProfile:\n    type: RuntimeDefault\n```\n\n这是容器级片段，镜像必须支持非 root 运行并具有正确目录权限。需要额外能力的应用应按最小范围增加，不能直接改 privileged: true；特权容器和拥有 CAP_SYS_ADMIN 的容器有特殊语义。验收应同时覆盖业务正常启动和禁止操作被拒绝，避免只看 YAML 字段。", "subs": []}]}, {"title": "网络策略", "sections": [{"title": "NetworkPolicy 如何依赖 CNI 执行流量隔离", "content": "<!-- src: temp/kubernetes-zh-docs/17-服务、负载均衡和联网/网络策略.md -->\n\nKubernetes 网络必须遵守三个基本规则：\n\n1. **容器可以与网络中的任何其他容器通信**，在此过程中没有地址转换——即不涉及 NAT\n2. **集群中的节点可以与网络中的任何容器通信，反之亦然**。即使在这种情况下，也没有地址转换——即不涉及 NAT\n3. **容器的 IP 地址始终相同**，无论从另一个容器还是从自身看到都是如此。\n\n如果您计划将集群隔离成更小的块并在命名空间之间进行隔离，第一个规则没有帮助。\n\n_想象一下，如果集群中的用户能够使用集群中的任何其他服务。_\n\n现在，_想象一下，如果集群中的恶意用户获得了集群的访问权限_——他们可以向整个集群发出请求。\n\n要解决这个问题，您可以使用网络策略定义 Pod 应该如何被允许在当前命名空间内和跨命名空间进行通信。\n\n\nNetworkPolicy 声明哪些流量允许进入或离开选中的 Pod，实际执行依赖支持该能力的 CNI。API 接受策略对象只能证明资源已保存，不能证明网络已经隔离。\n\n策略通常具有叠加允许语义：某个 Pod 被多条策略选择时，允许集合会合并。需要连接双方分别满足各自适用的 ingress/egress 规则；标签、Namespace selector 和端口配置错误都会让预期边界失效。\n\n验证至少包含允许来源、禁止来源、DNS 和外部依赖四类请求，并分别保存退出码与超时。hostNetwork、NAT 前后地址和 Service 流量的具体处理还受实现影响；不能把 NetworkPolicy 当作通用七层域名或 HTTP 权限策略。", "subs": []}, {"title": "默认拒绝如何与 DNS 和业务依赖逐步配套", "content": "<!-- src: temp/kubernetes-zh-docs/17-服务、负载均衡和联网/网络策略.md -->\n\n默认拒绝可以建立清楚的网络边界，但部署后必须按依赖图逐步放行业务、DNS、监控和外部接口。下面完整策略同时隔离命名空间中全部 Pod 的 ingress 与 egress；它会影响业务，只用于已经准备好允许规则的环境。\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny\n  namespace: demo\nspec:\n  podSelector: {}\n  policyTypes: [Ingress, Egress]\n```\n\nDNS 放行要按实际 CoreDNS/NodeLocal DNS 路径验证，不能假定固定 Pod 标签和地址。分别从允许与拒绝的 Pod 发起连接，验证 TCP/UDP、超时和跨节点路径，再推广到其他命名空间。只测试“业务能通”会漏掉拒绝规则根本没有执行的情况。", "subs": []}]}, {"title": "基于角色的访问控制 (RBAC) 策略", "sections": [{"title": "禁用默认 ServiceAccount 的自动挂载", "content": "基于角色的访问控制 (RBAC) 允许您定义如何访问集群中资源的策略。\n\n通常的做法是给予最少的必要权限，_但什么是实用的，您如何量化最少权限？_\n\n细粒度策略提供更大的安全性但需要更多的管理努力。\n\n更广泛的授权可以给服务账户不必要的 API 访问，但更容易控制。\n\n_您应该为每个命名空间创建一个策略并共享它吗？_\n\n_或者也许最好在更细粒度的基础上拥有它们？_\n\n没有一刀切的方法，您应该根据具体情况判断您的需求。\n\n_但是您从哪里开始？_\n\n如果您从一个空规则的 Role 开始，您可以逐个添加您需要的所有资源，并仍然确保您没有给予太多。\n\n\n请注意，[默认 ServiceAccount 会自动挂载到所有 Pod 的文件系统中](https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#use-the-default-service-account-to-access-the-api-server)。\n\n您可能想要禁用该功能并提供更细粒度的策略。", "subs": []}, {"title": "RBAC 如何按实际操作收敛权限", "content": "<!-- src: temp/kubernetes-zh-docs/20-安全/基于角色的访问控制良好实践.md -->\n\n从应用真实调用的资源、子资源、动词和命名空间推导权限，再把读取与写入拆开。例如 get pods 不会自动授予 pods/log 或 pods/exec；watch/list 也可能暴露大量对象信息。不要为了消除一个 403 就添加 resources: [\"*\"]。\n\n```bash\nkubectl auth can-i get pods -n demo --as=system:serviceaccount:demo:observer\nkubectl auth can-i create pods/exec -n demo --as=system:serviceaccount:demo:observer\n```\n\n为预期允许与预期拒绝都设置验证项，并结合实际客户端请求检查。能创建 Pod 的用户可能间接使用该 Namespace 中的 Secret 或更高权限 ServiceAccount，因此“禁止 get secrets”不能单独保证 Secret 不可获取；还要用准入约束工作负载身份和挂载行为。", "subs": []}, {"title": "RBAC 策略是细粒度的且不共享", "content": "Zalando 有一个简洁的策略来定义角色和服务账户。\n\n首先，他们描述他们的需求：\n\n- 用户应该能够部署，但他们不应该被允许读取 Secrets 等\n- 管理员应该获得对所有资源的完全访问权限\n- 应用默认不应获得对 Kubernetes API 的写入访问权限\n- 应该可以为某些用途写入 Kubernetes API。\n\n这四个需求转化为五个独立的角色：\n\n- ReadOnly\n- PowerUser\n- Operator\n- Controller\n- Admin\n\n您可以[在此链接中阅读他们的决定](https://kubernetes-on-aws.readthedocs.io/en/latest/dev-guide/arch/access-control/adr-004-roles-and-service-accounts.html)。", "subs": ["用户应该能够部署", "管理员应该获得对所有资源的完全访问权限", "应用默认不应获得对 Kubernetes API 的写入访问权限", "应该可以为某些用途写入 Kubernetes API", "ReadOnly", "PowerUser"]}]}, {"title": "自定义策略", "sections": [{"title": "镜像来源策略如何覆盖全部容器和供应链", "content": "<!-- src: temp/kubernetes-zh-docs/11-容器/镜像.md -->\n\n即使您能够在集群中为 Secrets 和 Pod 等资源分配策略，也有一些情况，Pod Security Admission、基于角色的访问控制 (RBAC) 和网络策略无法满足需求。\n\n例如，您可能想要避免从公共互联网下载容器，并希望首先批准这些容器。\n\n也许您有一个内部注册表，只有此注册表中的镜像才能部署在您的集群中。\n\n_您如何强制只有**受信任的容器**才能部署在集群中？_\n\n没有 RBAC 策略可以做到这一点。\n\n网络策略不会起作用。\n\n_您应该做什么？_\n\n您可以使用[准入控制器](https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/)来审查提交到集群的资源。\n\n\n注册表允许列表可以减少随意拉取镜像，但已批准域名不等于镜像可信。应检查完整主机名边界，避免把 registry.example.com.evil.invalid 当作同一注册表，并覆盖 containers、initContainers 与 ephemeralContainers 的适用请求。\n\nCEL 适合验证对象中的镜像字符串和固定格式，签名、漏洞、镜像来源证明等需要相应供应链组件。建议同时使用不可变 Digest、扫描结果及签名策略，明确镜像代理缓存与离线仓库的处理方式。\n\n先在小范围返回警告，测试批准仓库、相似恶意域名、缺少 Digest 和临时调试容器的请求；再开启拒绝。故障时检查准入策略与镜像拉取事件，区分“策略拒绝”与“仓库认证/网络失败”。", "subs": []}, {"title": "在 Ingress 主机名中强制唯一性", "content": "<!-- src: temp/kubernetes-zh-docs/71-Service-资源/Ingress.md -->\n\n当用户创建 Ingress 清单时，他们可以在其中使用任何主机名。\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: example-ingress\nspec:\n  rules:\n    - host: first.example.com\n      http:\n        paths:\n          - path: /\n            pathType: Prefix\n            backend:\n              service:\n                name: service\n                port:\n                  number: 80\n```\n\n但是，您可能想要防止用户使用**相同的主机名多次**并相互覆盖。\n\n域名格式可以通过准入校验，但跨对象唯一性还需要具备一致性设计的域名分配或治理机制。仅在 Webhook 中列举已有 Ingress 再判断，可能遭遇并发创建竞态；应验证跨命名空间和跨 Controller 的域名归属。", "subs": []}, {"title": "在 Ingress 主机名中仅使用已批准的域名", "content": "<!-- src: temp/kubernetes-zh-docs/71-Service-资源/Ingress.md -->\n\n当用户创建 Ingress 清单时，他们可以在其中使用任何主机名。\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: example-ingress\nspec:\n  rules:\n    - host: first.example.com\n      http:\n        paths:\n          - path: /\n            pathType: Prefix\n            backend:\n              service:\n                name: service\n                port:\n                  number: 80\n```\n\n但是，您可能想要防止用户使用**无效的主机名**。\n\n可使用 CEL 或 Webhook 检查完整域名与受控后缀，注意通配符、空 host 和相似恶意域名。该示例还依赖明确的 IngressClass 或集群默认 Class、Service 后端与实际 Controller；准入通过不表示 DNS、证书和数据面已经生效。", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
