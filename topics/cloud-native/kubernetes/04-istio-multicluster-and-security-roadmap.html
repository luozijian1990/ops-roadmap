rvice 则负责全局服务名和 DNS 策略。它不是替代 AccessPoint，而是把 AccessPoint 暴露出来的 VIP 或 FQDN 注册成全局域名。\n\nNameService 的 Spec 可以包含：\n\n| 字段 | 说明 |\n|---|---|\n| Global Name FQDN | 对外或对内访问的全局域名 |\n| TTL | DNS 记录缓存时间 |\n| DNSPolicy | RoundRobin Locality Ratio 等策略 |\n| HealthCheck Port | DNS 设备或控制器执行健康检查的端口 |\n| Target | 指向 AccessPoint 或目标 Service FQDN |\n| Ratio | 多目标权重 |\n\n```mermaid\nflowchart LR\n    NameService[\"NameService\"]\n    Spec[\"Spec<br/>Global Name FQDN / TTL / DNSPolicy / Target\"]\n    Status[\"Status<br/>Conditions / DNS 结果 / 错误信息\"]\n    DNS[\"DNS Provider\"]\n    Targets[\"目标 Service<br/>FQDN + Ratio\"]\n\n    NameService --> Spec\n    NameService --> Status\n    Spec --> DNS\n    Spec --> Targets\n    DNS --> Status\n    Targets --> Status\n```\n\n这张图对应 DNS 层的一个重要边界：DNS 可以做权重和本地优先，但它不是最可靠的紧急切流手段。NameService 必须把 AccessPoint、网关 VIP、证书和后端健康状态汇总进 status，再决定哪些目标可以进入 DNS Provider。\n\n```yaml\napiVersion: traffic.platform.example.com/v1alpha1\nkind: NameService\nmetadata:\n  name: demo-api\nspec:\n  globalName: demo-api.global.example.com\n  ttl: 30\n  dnsPolicy:\n    type: Locality\n  healthCheck:\n    port: 8080\n  targets:\n  - fqdn: demo-api.ap-cn-east.example.com\n    ratio: 99\n  - fqdn: demo-api.ap-cn-south.example.com\n    ratio: 1\n```\n\nNameService Controller 会读取 AccessPoint status 中的入口地址。如果某个目标集群的 VIP 尚未分配、证书未就绪或网关配置未完成，就不应提前把它写入全局 DNS。这个状态联动能减少“DNS 已指向但服务未就绪”的风险。\n\nHealthCheck Port 的设计也要尽量利用 DNS 或 GTM 设备自身能力。很多 Smart DNS、GTM 或负载均衡设备已经支持按端口、HTTP 路径或 TCP 连接做健康检查，NameService 把端口和目标地址交给设备后，设备可以直接探测并从解析结果中摘除失败目标。如果由控制面频繁 watch 每个 endpoint 状态，再通过 Provider API 高频改 DNS，路径更长、写入更慢，也会给 DNS Provider 带来额外压力。NameService Controller 更适合做目标收敛和状态门禁：从 AccessPoint status 中读取 ready 的 VIP、FQDN 和证书状态，只有目标就绪后才写入 DNS；紧急切流仍应主要依赖 L4/L7 负载均衡和网格策略，因为 DNS TTL 和客户端缓存不可控。\n\n```mermaid\nflowchart LR\n    AccessPoint[\"AccessPoint 状态\"]\n    NameService[\"NameService\"]\n    Controller[\"DNS 控制器\"]\n    DNS[\"Smart DNS\"]\n    Client[\"客户端\"]\n\n    AccessPoint --> NameService\n    NameService --> Controller\n    Controller --> DNS\n    Client --> DNS\n```\n\nAccessPoint Controller 的职责可以概括为：\n\n1. 解析 TrafficTemplate，拆出 Kubernetes Service 和 Istio 对象。\n2. 根据 Scope 或 PlacementPolicy 选择目标集群。\n3. 根据 Override 渲染每个集群的最终配置。\n4. 创建或更新 L4 Service、Gateway、VirtualService、DestinationRule 和 WorkloadEntry。\n5. 读取证书、VIP、FQDN、网关路由等状态。\n6. 把目标集群状态汇总回联邦层。\n7. 把聚合后的状态再传播回成员集群，让每个集群能看到自身和兄弟集群的入口状态。\n8. 按 RolloutPolicy 控制灰度、暂停、继续和回滚。\n\n状态回灌很重要。每个成员集群不仅要知道自己的 VIP、证书和路由是否就绪，也要能看到其他成员集群的入口健康、DNS 目标和证书状态。这样本地控制器、网关和流量策略才能基于兄弟集群状态做跨集群故障判断、远端链路验证和 NameService target 生成，而不是只有联邦层知道全局状态。\n\n这种统一模型的意义是让用户不用分别理解每个集群中的所有底层对象。用户声明“我要一个入口，后端跟随这个 FederatedDeployment，本地优先，远端 1% 验证，证书用这个引用，DNS 用 Locality 策略”，平台负责把它翻译成各集群的 Service、Istio 和 DNS 配置。\n\n未来演进主要有三个方向。\n\n第一，全面构建基于 Mesh 的流量管理。传统跨地域流量大量依赖 DNS 和南北向网关，服务间调用即使发生在同一集群，也可能先解析全局域名，再绕到外部入口，最后再回到目标服务。服务网格可以把这类调用下沉到 Sidecar 层，根据 VirtualService 中的 `mesh` gateway 把原本绕外部入口的流量转成本地东西向流量。\n\n```mermaid\nflowchart LR\n    ServiceA[\"服务 A\"]\n    DNS[\"Smart DNS\"]\n    Ingress[\"入口网关\"]\n    ServiceB[\"服务 B\"]\n    Sidecar[\"Sidecar 路由\"]\n\n    ServiceA --> DNS\n    DNS --> Ingress\n    Ingress --> ServiceB\n    ServiceA --> Sidecar\n    Sidecar --> ServiceB\n```\n\n第二，在用户无感知的前提下逐步把南北流量转换成东西流量。这个过程需要基于访问日志、tracing 和拓扑分析判断“某个经由外部入口的调用，其实目标服务在本地可达”。确认后，再把 Gateway 侧配置同步到 Sidecar 侧，使调用直接在网格内部完成。这个方向需要谨慎灰度，因为它可能影响成千上万个服务和海量 Pod。\n\n第三，对数据平面做加速和按需发现。Cilium、eBPF、XDP、Lazy Load、按需服务发现等能力都可能减少控制面和数据面的压力。大规模场景下，未来平台不应默认把所有服务状态推给所有 Sidecar，而应让 Envoy 只拿到自己真正需要的服务、路由和证书。\n\n多集群治理的最终目标不是让用户记住更多 CRD，而是把“应用在哪里运行、入口在哪里暴露、流量如何本地优先、故障如何切换、配置如何灰度、状态如何汇聚”收敛成统一声明。Kubernetes 联邦负责对象和集群层面的统一，Istio 负责流量和安全层面的统一，NameService 与 AccessPoint 则把两者连接成面向业务的多集群流量模型。", "subs": []}]}, {"title": "第 11 章 · Kubernetes 和 Istio 安全保证", "sections": [{"title": "云原生语境下的安全保证覆盖哪些生命周期", "content": "云原生安全不是上线前补一个扫描步骤，而是贯穿开发、分发、部署和运行的完整生命周期。安全与效率经常存在张力：如果把安全全部放在最后验收，团队会在发布前被漏洞、权限、合规问题反复打断；如果把安全前移到开发和流水线，单次检查会增加成本，但整体修复成本更低。\n\n#### 从 CIA 到云原生安全\n\n传统安全的三个基础目标仍然适用：\n\n| 目标 | 含义 | 云原生落点 |\n|---|---|---|\n| 机密性 | 只有被授权的主体能访问数据 | 身份认证、RBAC、Secret 管理、传输加密 |\n| 完整性 | 数据和工件未被非法篡改 | 镜像签名、摘要校验、TLS、审计日志 |\n| 可用性 | 合法用户和系统能持续使用资源 | 配额、限流、节点隔离、运行时监控 |\n\n云原生场景下还要把计算、存储、访问和运行环境一起纳入治理。一个服务可能由镜像、Kubernetes 对象、ServiceAccount、Secret、Ingress、Sidecar 和多个网络策略共同组成，任何一环权限过大或缺少验证，都可能放大攻击面。\n\n```mermaid\nflowchart LR\n    Dev[\"开发\"]\n    Dist[\"分发\"]\n    Deploy[\"部署\"]\n    Run[\"运行\"]\n    Access[\"访问安全\"]\n    Storage[\"存储安全\"]\n    Compute[\"计算安全\"]\n    Env[\"环境安全\"]\n\n    Dev --> Dist --> Deploy --> Run\n    Access --> Dev\n    Access --> Dist\n    Access --> Deploy\n    Access --> Run\n    Storage --> Deploy\n    Storage --> Run\n    Compute --> Deploy\n    Compute --> Run\n    Env --> Deploy\n    Env --> Run\n```\n\n#### 开发阶段\n\n开发阶段的目标是把明显问题挡在提交前。开发者不仅写业务代码，也会写 Dockerfile、Kubernetes Manifest、IaC 模板和配置文件，这些都可能引入安全风险。\n\n```mermaid\nflowchart LR\n    IDE[\"Developer IDE\"]\n    IaC[\"Infrastructure as Code\"]\n    Dockerfile[\"Dockerfile\"]\n    Manifest[\"K8s Manifest\"]\n    Code[\"Custom Code\"]\n    PreCommit[\"Pre-commit Hook\"]\n    Scan[\"Security Scan<br/>Static Analysis / Vulnerability Scan / IaC Scan / K8s Manifest Scan\"]\n    SCM[\"Commit to SCM\"]\n\n    IDE --> IaC\n    IDE --> Dockerfile\n    IDE --> Manifest\n    IDE --> Code\n    IaC --> PreCommit\n    Dockerfile --> PreCommit\n    Manifest --> PreCommit\n    Code --> PreCommit\n    PreCommit --> Scan\n    Scan -->|Passed| SCM\n    Scan -->|Fail| IDE\n```\n\n这张图对应“安全前移”的工程思路。开发者不用成为密码学专家，但不能把 FTP、不安全端口、明文 token、root 镜像和危险 Manifest 留到上线前才处理。扫描失败回到 IDE 虽然会影响当次效率，却能避免上线前被 P0 漏洞打断整个发布计划。\n\n常见检查包括：\n\n| 检查类型 | 检查对象 | 典型问题 |\n|---|---|---|\n| 静态代码扫描 | 应用源码 | 不安全协议、敏感信息硬编码、已知危险 API |\n| 依赖漏洞扫描 | 第三方库和基础镜像 | CVE、过期组件、恶意依赖 |\n| IaC 扫描 | Terraform、Ansible 等 | 过宽安全组、未加密存储、默认密码 |\n| Dockerfile 扫描 | 镜像构建文件 | root 用户运行、过大基础镜像、泄露 token |\n| Manifest 扫描 | Pod、Deployment、Service 等 | 特权容器、hostPath、未设置资源限制 |\n\n静态扫描只能发现代码和配置中的已知模式，动态扫描还要把应用或虚机实际跑起来检查运行面暴露。例如扫描器可以发现进程监听了不该开放的端口、启用了 FTP 这类不安全服务，或把调试接口暴露到外部网络；这类问题应在开发或集成环境直接阻断，而不是等到部署阶段再靠防火墙兜底。\n\n敏感凭据也要纳入开发阶段检查。企业账号密码、API token、云访问密钥一旦被提交到公共 GitHub 仓库，即使随后删除提交，也可能已经被索引、克隆或自动化程序抓取。代码扫描、提交钩子和仓库侧 secret scanning 应同时启用，并把泄露后的 token 轮换作为标准处置流程。\n\n示例：把简单检查放到提交前。\n\n```bash\n# 示例命令仅表示检查思路\ndocker build -t app:dev .\ntrivy image app:dev\nkubectl apply --dry-run=server -f k8s/\n```\n\n#### 分发阶段\n\n分发阶段关注工件本身是否可信。容器镜像、Helm Chart、Manifest 包和二进制文件进入仓库前，需要经过测试、扫描、签名和摘要校验。\n\n```mermaid\nflowchart LR\n    Build[\"构建工件\"]\n    Test[\"测试\"]\n    Scan[\"漏洞扫描\"]\n    Sign[\"签名\"]\n    Registry[\"镜像仓库\"]\n    Verify[\"完整性校验\"]\n    Release[\"发布\"]\n\n    Build --> Test --> Scan --> Sign --> Registry --> Verify --> Release\n```\n\n镜像安全的核心不是只扫一次，而是持续扫描。即使镜像构建时没有漏洞，基础镜像和依赖库之后也可能被披露新漏洞，所以生产镜像仓库应支持漏洞更新、重新评估和阻断策略。\n\n#### 部署阶段\n\n部署阶段要在工作负载进入集群前做准入控制。典型策略包括：\n\n- 镜像必须来自可信仓库。\n- 镜像摘要或签名必须通过校验。\n- 禁止特权容器和危险 capability。\n- 限制 hostNetwork、hostPID、hostIPC、hostPath。\n- 要求显式设置 ServiceAccount，而不是复用默认账号。\n- 要求 Secret、ConfigMap、Volume 和网络策略符合租户边界。\n\n```mermaid\nflowchart TB\n    Preflight[\"Pre Flight Checks\"]\n    ImageIntegrity[\"Validate Image<br/>Integrity and Signature\"]\n    ImageRuntime[\"Apply Image Runtime Policies<br/>Vulnerabilities\"]\n    HostSecurity[\"Host Security<br/>Compliance Controls\"]\n    ContainerPolicy[\"Apply Runtime Container Policies\"]\n    RuntimePolicies[\"Runtime Policies\"]\n    Deploy[\"Deploy\"]\n\n    Preflight --> ImageIntegrity\n    Preflight --> ImageRuntime\n    Preflight --> HostSecurity\n    RuntimePolicies --> ContainerPolicy\n    ImageIntegrity --> Deploy\n    ImageRuntime --> Deploy\n    HostSecurity --> Deploy\n    ContainerPolicy --> Deploy\n```\n\n部署前检查的关键是“没过就不让进集群”。镜像签名、漏洞策略、主机合规和运行时策略都属于准入前后的一组门禁，不能只靠人工约定。启用集群级限制前，要先确认系统组件和基础设施组件有对应授权，否则 kubelet、CNI、网关等关键 Pod 可能先被自己挡住。\n\nKubernetes 的准入控制、策略引擎、Pod Security、镜像准入和 RBAC 都属于这个阶段的重要能力。\n\n#### 运行阶段\n\n运行时安全关注服务已经跑起来之后是否继续保持可信状态。重点包括：\n\n- 容器内只允许运行预期进程。\n- 运行用户最小权限，根文件系统尽量只读。\n- 监控异常网络连接、端口暴露和横向移动。\n- 通过 NetworkPolicy 和服务网格限制东西向访问。\n- 通过 mTLS、认证、授权和审计记录服务访问。\n- 通过日志、审计和告警回溯谁在什么时间做了什么。\n\n```mermaid\nflowchart TB\n    subgraph App[\"Application\"]\n        MeshCP[\"Service Mesh Control Plane\"]\n        AppProc[\"App / Process\"]\n        AppAccess[\"Access<br/>Service Mesh / Ingress\"]\n        Transit[\"In-transit Data / Mem\"]\n        OSControl[\"OS Process Control\"]\n        NetEnc[\"Network Encryption\"]\n        ServiceAccess[\"Service Access Control\"]\n        QoS[\"QoS\"]\n        MemProtect[\"Memory Protection\"]\n        MeshAudit[\"Audit<br/>Service Access Log / Mesh Audit Log\"]\n    end\n\n    subgraph Orchestration[\"Workload Orchestration\"]\n        ControlPlane[\"Control Plane\"]\n        Workload[\"Container / Pod / Function\"]\n        NetAccess[\"Access<br/>CNI / Ingress\"]\n        Volumes[\"Data Volumes\"]\n        RBAC[\"RBAC\"]\n        Admission[\"Admission Control\"]\n        NetPolicy[\"Network Policy\"]\n        PodSecurity[\"Pod Security\"]\n        ContainerSec[\"Container Security\"]\n        ImageAuth[\"Image Authorization\"]\n        OrchAudit[\"Audit<br/>Orchestration Audit Log\"]\n    end\n\n    subgraph Cloud[\"Cloud / Environment\"]\n        CloudOrch[\"Cloud Orchestration\"]\n        Compute[\"Compute<br/>VM / Bare-Metal\"]\n        CloudAccess[\"Access<br/>VPC / ELB\"]\n        Storage[\"Storage\"]\n        IAM[\"IAM / RBAC\"]\n        SecGroup[\"Security Groups\"]\n        SecureBoot[\"Secure Boot\"]\n        ImmutableOS[\"Immutable OS\"]\n        StorageEnc[\"Storage Encryption\"]\n        CloudAudit[\"Audit<br/>Cloud Access Log / OS Audit Log / Flow Logs\"]\n    end\n\n    subgraph Foundations[\"Security Foundations\"]\n        Registry[\"Artifact Registry\"]\n        Identity[\"Identity & Access Control\"]\n        Secrets[\"Secrets Management\"]\n        Threat[\"Vulnerability & Threat Intelligence Feeds\"]\n        Compliance[\"Compliance\"]\n        Policies[\"Policies\"]\n    end\n\n    App --> Orchestration --> Cloud\n    Foundations -.->|支撑| App\n    Foundations -.->|支撑| Orchestration\n    Foundations -.->|支撑| Cloud\n```\n\n运行时安全不能只看 Pod 本身。应用层要关注服务访问、传输加密和审计；编排层要关注 RBAC、准入、NetworkPolicy、Pod Security 和镜像授权；云和环境层还要关注 VPC、安全组、加密存储、不可变 OS 和云审计。任何一层松动，都会给横向移动或权限提升留下入口。\n\n运行时的关键思路是持续验证，而不是部署时验证一次就永久信任。", "subs": ["从 CIA 到云原生安全", "开发阶段", "分发阶段", "部署阶段", "运行阶段"]}, {"title": "容器运行时和 Kubernetes 集群安全如何落地", "content": "容器运行时安全从镜像、用户、Linux namespace、capability 和文件系统权限开始；Kubernetes 集群安全则在控制面通信、认证授权、准入控制、Secret 加密、Pod Security 和审计层面继续收敛权限。\n\n#### 以非 root 身份运行容器\n\n容器内 root 不应被视为安全默认值。某些运行时、挂载方式或错误配置会让容器内 root 获得对主机目录、网络或内核能力的危险访问。常见做法是在构建镜像时创建普通用户，并在 Dockerfile 中切换用户。\n\n```dockerfile\nFROM ubuntu:22.04\nRUN useradd --uid 10001 --create-home appuser\nUSER 10001\nWORKDIR /app\n```\n\n在 Kubernetes 中还应通过 `securityContext` 强制声明运行身份：\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: app\nspec:\n  securityContext:\n    runAsNonRoot: true\n    runAsUser: 10001\n    runAsGroup: 10001\n    fsGroup: 10001\n  containers:\n  - name: app\n    image: registry.example.com/app:v1\n    securityContext:\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true\n      capabilities:\n        drop:\n        - ALL\n```\n\n这里的关键点不是 YAML 本身，而是最小权限原则：\n\n- 不需要 root 就不要 root。\n- 不需要 capability 就全部 drop。\n- 不需要写根文件系统就设为只读。\n- 必须写文件时，只开放明确的目录和权限。\n\n非 root 容器落地时，日志优先写到 `stdout` 和 `stderr`，再由容器运行时、节点日志采集器或平台日志系统接走。这样应用不需要为了写日志获得根目录或系统日志目录的写权限。如果确实必须写本地文件，应只为该用户授权特定挂载目录，例如 `/var/lib/app` 或 `/tmp/app`，并避免把整个根文件系统、宿主机目录或共享卷开放为可写。\n\n#### User Namespace 和 rootless container\n\nUser Namespace 可以把容器内用户映射为主机上的非 root 用户。即使容器内看到的是 root，映射到主机后也不是主机 root，从而降低容器逃逸后的破坏能力。\n\nRootless container 则让容器运行时本身以非 root 身份启动。Podman 这类运行时更适合这种模型；Docker 传统 daemon 常以 root 运行，因此要额外关注 daemon 权限边界。\n\n这两类能力都能降低风险，但也会带来文件挂载、用户映射、目录权限和运行时兼容性的复杂度。生产落地时通常与安全基线、镜像规范和节点运行时统一规划。\n\n#### Kubernetes 控制面通信安全\n\nKubernetes 控制面默认应通过 TLS 通信：\n\n- etcd 成员之间使用 peer 证书。\n- API Server 访问 etcd 使用客户端证书。\n- kubelet、controller-manager、scheduler、kubectl 等访问 API Server 时通过 kubeconfig 或证书认证。\n- 不应开启 API Server 的 insecure 端口。\n\n```mermaid\nflowchart TB\n    subgraph EtcdCA[\"etcd CA 颁发和验证的证书\"]\n        Etcd1[\"etcd 成员 1\"]\n        Etcd2[\"etcd 成员 2\"]\n        Etcd3[\"etcd 成员 3\"]\n        Etcd1 <-->|etcd peering| Etcd2\n        Etcd2 <-->|etcd peering| Etcd3\n    end\n\n    subgraph APIServers[\"API Server 高可用层\"]\n        API1[\"API Server 1\"]\n        API2[\"API Server 2\"]\n        API3[\"API Server 3\"]\n    end\n\n    LB[\"负载均衡器 / DNS\"]\n\n    subgraph K8sCA[\"Kubernetes CA 颁发和验证的证书\"]\n        KubeletA[\"kubelet<br/>Node A\"]\n        KubeletB[\"kubelet<br/>Node B\"]\n        KubeletC[\"kubelet<br/>Node C\"]\n        Kubectl[\"kubectl / API 客户端\"]\n    end\n\n    API1 <-->|etcd 客户端证书| Etcd1\n    API2 <-->|etcd 客户端证书| Etcd2\n    API3 <-->|etcd 客户端证书| Etcd3\n    Kubectl -->|TLS| LB\n    LB --> API1\n    LB --> API2\n    LB --> API3\n    API1 <-->|TLS| KubeletA\n    API2 <-->|TLS| KubeletB\n    API3 <-->|TLS| KubeletC\n```\n\n控制面安全不只靠 TLS。认证、授权、准入、审计和配额共同组成访问控制链路：\n\n| 环节 | 作用 | 例子 |\n|---|---|---|\n| 认证 | 确认请求者是谁 | X.509、ServiceAccount、OIDC |\n| 授权 | 判断能否执行操作 | RBAC、ABAC |\n| 准入 | 创建或修改前做策略校验 | NodeRestriction、Pod Security、Webhook |\n| 审计 | 记录谁做了什么 | API Server audit log |\n| 配额 | 限制资源消耗 | ResourceQuota、LimitRange |\n\n所有访问 API Server 的客户端都要进入这条链路，不只是 `kubectl`。节点上的 kubelet、kube-proxy，控制面的 scheduler、controller-manager，卷插件、聚合 API、准入 Webhook 以及自动化运维程序，本质上都是 API 客户端。小规模集群可以使用静态 token、bootstrap token 或 X.509 客户端证书；企业集群通常会接入 OIDC、LDAP 或统一身份系统，再用 RBAC 把用户、组和 ServiceAccount 绑定到明确权限上。\n\nResourceQuota 也不只是一个抽象的“限额”开关。namespace 级配额通常会约束 CPU request/limit、内存 request/limit、持久化存储容量、PVC 数量、Pod 数量、Service 数量、LoadBalancer Service 数量以及对象总数。配额和 LimitRange 配合使用时，前者限制团队能消耗多少总量，后者限制单个工作负载的默认值和上下限。\n\n审计日志需要在 API Server 上显式配置。集群即使具备审计能力，如果没有设置 `--audit-policy-file` 和审计后端，例如 `--audit-log-path` 或 webhook 后端，就不会留下足够的 API 调用证据。生产集群应把 audit log 作为安全基线，至少记录对象写操作、权限变更、Secret 访问和准入拒绝事件，便于在事故后还原“谁在什么时间对哪个对象做了什么”。\n\n```yaml\napiVersion: audit.k8s.io/v1\nkind: Policy\nrules:\n- level: RequestResponse\n  verbs:\n  - create\n  - update\n  - patch\n  - delete\n  resources:\n  - group: \"\"\n    resources:\n    - secrets\n- level: Metadata\n  resources:\n  - group: \"*\"\n    resources:\n    - \"*\"\n```\n\n#### RBAC 和最小授权\n\nRBAC 的设计重点是按团队、namespace、服务账号和职责拆分权限。生产集群里不要把 `cluster-admin` 当作默认权限，也不要让大量应用共享同一个高权限 ServiceAccount。\n\n生产环境通常还会禁止业务 Pod 直接使用 namespace 自动创建的 `default` ServiceAccount。默认账号长期存在，容易被多个应用为了省事复用；一旦它被绑定了过宽权限，或其 token 通过日志、镜像、调试入口泄露，影响面会覆盖整个 namespace 甚至更大范围。更稳妥的做法是为每个工作负载显式创建 ServiceAccount，并只绑定它需要的 Role 或 ClusterRole。\n\n一个只允许读取 Pod 的 Role 示例：\n\n```yaml\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: pod-reader\n  namespace: team-a\nrules:\n- apiGroups:\n  - \"\"\n  resources:\n  - pods\n  verbs:\n  - get\n  - list\n  - watch\n```\n\n绑定到明确的 ServiceAccount：\n\n```yaml\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: read-pods\n  namespace: team-a\nsubjects:\n- kind: ServiceAccount\n  name: app-reader\n  namespace: team-a\nroleRef:\n  kind: Role\n  name: pod-reader\n  apiGroup: rbac.authorization.k8s.io\n```\n\nPodSecurityPolicy 的 `use` 权限说明了策略对象本身也应该纳入 RBAC 权限边界。PSP 作为一种资源，需要通过 Role 或 ClusterRole 授权给用户、组或 ServiceAccount 后才能使用。新版本集群通常会使用 Pod Security Admission 或策略引擎替代 PSP，但角色规划思路相同：系统组件、管理员、普通用户应有不同安全等级。\n\n验证 PSP 授权链路时，可以先在目标 namespace 中创建一个低权限 ServiceAccount，再用 `kubectl auth can-i` 按该身份检查它是否能 `use` 指定策略：\n\n```bash\nkubectl create namespace psp-demo\nkubectl create serviceaccount fake -n psp-demo\n\nkubectl auth can-i use podsecuritypolicy/restricted \\\n  --as system:serviceaccount:psp-demo:fake \\\n  -n psp-demo\n```\n\n未授权时，上面的检查应返回 `no`，使用该 ServiceAccount 创建需要 PSP 放行的 Pod 也会被准入控制拒绝。授权通常由一个限定 `resourceNames` 的 ClusterRole 加上 namespace 内 RoleBinding 完成：\n\n```yaml\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: use-restricted-psp\nrules:\n- apiGroups:\n  - policy\n  resources:\n  - podsecuritypolicies\n  resourceNames:\n  - restricted\n  verbs:\n  - use\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: fake-use-restricted-psp\n  namespace: psp-demo\nsubjects:\n- kind: ServiceAccount\n  name: fake\n  namespace: psp-demo\nroleRef:\n  kind: ClusterRole\n  name: use-restricted-psp\n  apiGroup: rbac.authorization.k8s.io\n```\n\n绑定后再次执行 `kubectl auth can-i use podsecuritypolicy/restricted --as system:serviceaccount:psp-demo:fake -n psp-demo`，应返回 `yes`。这条链路能帮助区分“策略本身存在”和“某个主体被授权使用该策略”两个问题。\n\n#### Secret 和存储加密\n\nSecret 常存放 token、密码、证书和私钥，因此不能只依赖对象名叫 Secret。需要同时关注三个层面：\n\n| 层面 | 风险 | 防护 |\n|---|---|---|\n| API 访问 | 用户或工作负载读取不该读的 Secret | RBAC 最小授权 |\n| etcd 落盘 | etcd 数据泄露后明文暴露 | EncryptionConfiguration |\n| 使用方式 | key 和 cert 或 token 被集中泄露 | 分离存储、动态注入、短周期轮换 |\n\nKubernetes 可以配置资源落盘加密：\n\n```yaml\napiVersion: apiserver.config.k8s.io/v1\nkind: EncryptionConfiguration\nresources:\n- resources:\n  - secrets\n  providers:\n  - aescbc:\n      keys:\n      - name: key1\n        secret: c2VjcmV0IGlzIHNlY3VyZQ==\n  - kms:\n      name: production-kms\n      endpoint: unix:///var/run/kms/socket\n      cachesize: 100\n  - identity: {}\n```\n\nProvider 顺序很重要：写入时使用第一个 provider，读取时按顺序尝试解密。`identity` 表示不加密，通常只作为兼容旧数据的兜底项。\n\n证书和私钥也不应该因为 Kubernetes Secret 支持键值存储就随意放在一起。标准 TLS Secret 常把 `tls.crt` 和 `tls.key` 放在同一个对象里，便于 Ingress 或 Istio Gateway 通过 `credentialName` 引用；但在更严格的密钥管理要求下，私钥和证书只有在最终使用的工作负载内才允许同时出现。此时应把私钥放在 KMS、HSM 或专门的 Secret provider 中，通过 CSI driver、External Secrets 或自定义 SDS/provider 动态注入，而不是长期把 key 和 cert 打包进一个可被大量主体读取的 Secret。\n\n#### NodeRestriction\n\n`NodeRestriction` 是 Kubernetes 准入控制器，用于限制 kubelet 的权限边界。它解决的是 RBAC 难以表达的节点维度问题：一个节点上的 Pod 可能来自多个 namespace，但 kubelet 只能管理调度到自己节点上的 Pod。\n\n开启后，kubelet 受到这些限制：\n\n- 只能修改自己的 Node 对象。\n- 只能修改绑定到自己节点的 Pod 对象。\n- 不能删除 Node 对象。\n- 不能修改带有 `node-restriction.kubernetes.io/` 前缀的受保护标签。\n\n这能降低 kubelet kubeconfig 泄露后的影响范围，避免攻击者借节点身份修改其他节点或其他 Pod。\n\n#### Pod Security 和安全上下文\n\nPod Security 的核心是限制 Pod 和容器能向主机申请什么权限。实际理解时可以把它拆成三层：\n\n| 层次 | 作用域 | 控制内容 | 例子 |\n|---|---|---|\n| Container-level SecurityContext | 只影响指定容器 | 容器进程权限和文件系统行为 | `privileged`、`capabilities`、`allowPrivilegeEscalation`、`readOnlyRootFilesystem` |\n| Pod-level SecurityContext | 影响 Pod 内全部容器和 Volume | 默认用户、组、SELinux、seccomp 和卷属主 | `runAsUser`、`runAsGroup`、`fsGroup`、`supplementalGroups`、`seccompProfile` |\n| 集群级 Pod 安全策略 | 准入时限制哪些声明可以被接受 | 对工作负载权限做统一约束 | 禁止特权容器、禁止 hostPath、限制 hostNetwork、限制 hostPorts |\n\n容器级安全上下文只约束对应容器，不会改变共享 Volume 的属主和权限；Pod 级安全上下文会影响 Pod 内所有容器，并可通过 `fsGroup`、`supplementalGroups` 等字段影响 Volume 挂载后的权限。集群级策略则在对象创建或更新时拦截不符合基线的 Pod。\n\n常见高风险字段：\n\n| 字段 | 风险 |\n|---|---|\n| `privileged: true` | 容器获得接近主机级别的权限 |\n| `allowPrivilegeEscalation: true` | 进程可能提升权限 |\n| `hostNetwork: true` | Pod 共享主机网络命名空间 |\n| `hostPID: true` | Pod 可看到主机进程 |\n| `hostIPC: true` | Pod 可访问主机 IPC namespace |\n| `hostPath` | Pod 可挂载主机文件路径 |\n| 未 drop capabilities | 进程保留不必要的 Linux 能力 |\n\n这些字段不能只按“出现即错误”机械判断，系统级 DaemonSet 往往确实需要更高权限，但要能解释权限来源并限制到必要组件。Calico Node 就是典型例子：init container 需要把 CNI 插件复制到主机目录，因此会挂载 CNI 相关 `hostPath`，并需要足够权限写入主机文件系统；主容器负责创建网络设备、配置路由和维护 iptables 规则，通常需要 `privileged`，并经常使用 `hostNetwork` 直接操作节点网络命名空间。这个权限模型适合 CNI 组件，不应被普通业务容器照搬。\n\nIstio sidecar 也体现了最小权限和必要权限的组合。负责流量重定向的 init container 可以先 `drop: ALL`，再只添加 `NET_ADMIN` 和 `NET_RAW`，用于写入 iptables 规则和处理网络包；主 `istio-proxy` 容器则以固定的非 root 身份运行，常见 UID/GID 为 `1337`。iptables 规则会识别这个用户，让代理自己发出的流量直接返回，避免 Envoy 出站连接再次被重定向到自己形成重复劫持。\n\nPSP 已在新版本中被 Pod Security Admission 和策略引擎取代，但它覆盖的控制项仍然是设计安全基线时的检查清单：\n\n- `privileged`、`allowPrivilegeEscalation`、capabilities 的默认添加、允许添加和强制删除。\n- 可使用的 `volumes` 类型，例如是否允许 `hostPath`。\n- `hostNetwork`、`hostPID`、`hostIPC` 以及 `hostPorts` 范围。\n- SELinux 上下文、`runAsUser`、`runAsGroup`。\n- `supplementalGroups`、`fsGroup`。\n- `readOnlyRootFilesystem`、seccomp、AppArmor 等运行时限制。\n\n生产落地时应先为系统组件准备高权限策略并完成绑定，再开启集群级限制，否则 API Server、kubelet 创建 mirror pod 或基础设施组件可能被准入控制挡住。普通用户则使用受限策略，例如禁止特权、禁止 host namespace、强制非 root、限制 volume 类型。\n\n#### 镜像安全和准入\n\n镜像安全贯穿分发和部署两个阶段。一个可落地的基线可以写成：\n\n| 要求 | 目的 |\n|---|---|\n| 使用可信基础镜像 | 降低未知依赖和恶意镜像风险 |\n| 固定镜像摘要 | 避免 tag 漂移 |\n| 构建后扫描漏洞 | 阻断已知高危问题 |\n| 镜像签名 | 证明工件来源和完整性 |\n| 准入阶段校验来源和签名 | 防止绕过流水线直接部署 |\n| 禁止镜像内写入密码和 token | 防止分发后泄露 |\n\n示例：部署时使用摘要而不是可漂移 tag。\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: api\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: api\n  template:\n    metadata:\n      labels:\n        app: api\n    spec:\n      containers:\n      - name: api\n        image: registry.example.com/api@sha256:1111111111111111111111111111111111111111111111111111111111111111\n```", "subs": ["以非 root 身份运行容器", "User Namespace 和 rootless container", "Kubernetes 控制面通信安全", "RBAC 和最小授权", "Secret 和存储加密", "NodeRestriction", "Pod Security 和安全上下文", "镜像安全和准入"]}, {"title": "Taint 和节点隔离如何控制工作负载落点", "content": "Taint 和 Toleration 用于控制 Pod 能不能调度到某些节点。它不是网络隔离，也不是运行时隔离，而是调度层面的准入机制。\n\n#### Taint 的基本用法\n\n给节点增加 taint：\n\n```bash\nkubectl taint nodes node-a tenant=team-a:NoSchedule\n```\n\n删除 taint：\n\n```bash\nkubectl taint nodes node-a tenant:NoSchedule-\n```\n\nPod 通过 toleration 表示可以容忍该 taint：\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: team-a-app\nspec:\n  tolerations:\n  - key: tenant\n    operator: Equal\n    value: team-a\n    effect: NoSchedule\n  containers:\n  - name: app\n    image: registry.example.com/app:v1\n```\n\n`operator` 有两种常见写法。`Equal` 要求 `key`、`value` 和 `effect` 都匹配，适合精确容忍某个租户或某类节点；`Exists` 只要求 taint key 存在，不关心 value，适合表达“只要是这类 taint 都能容忍”。\n\n```yaml\ntolerations:\n- key: dedicated\n  operator: Exists\n  effect: NoSchedule\n```\n\n常见 effect：\n\n| effect | 含义 |\n|---|---|\n| `NoSchedule` | 不容忍该 taint 的新 Pod 不能调度上来 |\n| `PreferNoSchedule` | 尽量不调度上来，但不是强制 |\n| `NoExecute` | 不容忍的 Pod 会被驱逐，新 Pod 也不能调度 |\n\n#### 多租户节点隔离\n\n在多租户集群中，某些租户希望关键业务不与其他租户共享节点。可以将节点打上租户 taint，再让该租户 Pod 带上 toleration。\n\n```mermaid\nflowchart TB\n    NodeA[\"节点 A 具备 tenant a taint\"]\n    NodeB[\"节点 B 具备 tenant b taint\"]\n    PodA[\"租户 A Pod\"]\n    PodB[\"租户 B Pod\"]\n    PodX[\"普通 Pod\"]\n    RejectA[\"不能调度到节点 A\"]\n    RejectB[\"不能调度到节点 B\"]\n\n    PodA --> NodeA\n    PodB --> NodeB\n    PodX --> RejectA\n    PodX --> RejectB\n```\n\n这种方案适合强隔离或合规场景，但不应滥用。把一个大集群切成许多小资源池，会降低资源利用率，也会降低故障腾挪空间。更常见的做法是：\n\n- 用 namespace、RBAC、ResourceQuota 做租户边界。\n- 用 NetworkPolicy 做网络边界。\n- 用 Pod Security 限制危险权限。\n- 用亲和性、反亲和性和拓扑约束表达调度偏好。\n- 只在确实需要独占硬件或强隔离时使用 taint 分池。\n\n对于 CPU 或延迟敏感工作负载，盲目拆节点池不一定是最好的隔离方式。可以让 kubelet 启用 `static` CPU Manager policy，并把关键 Pod 做成 Guaranteed QoS：CPU request 和 limit 相等，且申请整数个 CPU。满足条件后，kubelet 可以把独占 CPU 分配给该 Pod，使敏感工作负载和普通工作负载在 CPU 调度层面隔离，通常比把节点切成许多小池子更能兼顾性能稳定性和集群利用率。\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: latency-sensitive\nspec:\n  containers:\n  - name: app\n    image: registry.example.com/app:v1\n    resources:\n      requests:\n        cpu: \"2\"\n        memory: 2Gi\n      limits:\n        cpu: \"2\"\n        memory: 2Gi\n```", "subs": ["Taint 的基本用法", "多租户节点隔离"]}, {"title": "Kubernetes NetworkPolicy 如何定义网络访问边界", "content": "Kubernetes `NetworkPolicy` 用于在三层和四层控制 Pod 的入站和出站流量。它的本质是白名单策略：当 Pod 被策略选中后，未被允许的方向会被拒绝。\n\n#### Pod 的隔离状态\n\n默认情况下，Pod 是非隔离的，可以接受任何来源流量，也可以发出任意出站流量。只有当某个 NetworkPolicy 选择了它，它才在对应方向进入隔离状态。\n\n重要规则：\n\n- 策略必须由支持 NetworkPolicy 的 CNI 插件实现。\n- 多个策略不会互相覆盖，而是并集生效。\n- 入站访问需要目标 Pod 的 ingress 允许。\n- 出站访问需要源 Pod 的 egress 允许。\n- 两边任意一边不允许，连接就不成立。\n\n```mermaid\nflowchart LR\n    Src[\"源 Pod\"]\n    Egress[\"源端出站允许\"]\n    Ingress[\"目标入站允许\"]\n    Dst[\"目标 Pod\"]\n    Deny[\"拒绝\"]\n\n    Src --> Egress\n    Egress --> Ingress\n    Ingress --> Dst\n    Egress --> Deny\n    Ingress --> Deny\n```\n\n#### 关键字段\n\n| 字段 | 作用 |\n|---|---|\n| `podSelector` | 选择策略作用的目标 Pod |\n| `policyTypes` | 指定 Ingress、Egress 或两者 |\n| `ingress.from` | 定义允许访问目标 Pod 的来源 |\n| `egress.to` | 定义目标 Pod 允许访问的目的地 |\n| `ports` | 限制协议和端口 |\n| `namespaceSelector` | 选择 namespace |\n| `ipBlock` | 选择 CIDR 网段 |\n\n空的 `podSelector: {}` 表示选择当前 namespace 下所有 Pod。\n\n`policyTypes` 未显式填写时会按规则推导：默认至少包含 `Ingress`；如果策略里写了 `egress` 规则，则同时包含 `Egress`。为了避免读者误判策略方向，生产配置通常显式写出 `Ingress`、`Egress` 或两者。需要注意，选择了 Pod 之后，隔离只发生在对应方向：只有 Ingress 策略不会限制出站，只有 Egress 策略不会限制入站。\n\n#### 默认拒绝和精确放行\n\n默认拒绝所有入站：\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-ingress\n  namespace: prod\nspec:\n  podSelector: {}\n  policyTypes:\n  - Ingress\n```\n\n常见默认策略可以按四种基线理解：\n\n| 策略 | 语义 | 典型用途 |\n|---|---|---|\n| default deny ingress | 拒绝当前 namespace 所有 Pod 的入站流量 | 建立最小入站基线 |\n| allow all ingress | 允许当前 namespace 所有 Pod 接收入站流量 | 作为显式放行或迁移过渡 |\n| allow all egress | 允许当前 namespace 所有 Pod 发起出站流量 | 避免只启用入站隔离时误伤出站 |\n| default deny all | 入站和出站都默认拒绝 | 高安全 namespace 的起点 |\n\n允许所有入站：\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: allow-all-ingress\n  namespace: prod\nspec:\n  podSelector: {}\n  policyTypes:\n  - Ingress\n  ingress:\n  - {}\n```\n\n允许所有出站：\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: allow-all-egress\n  namespace: prod\nspec:\n  podSelector: {}\n  policyTypes:\n  - Egress\n  egress:\n  - {}\n```\n\n同时默认拒绝入站和出站：\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-all\n  namespace: prod\nspec:\n  podSelector: {}\n  policyTypes:\n  - Ingress\n  - Egress\n```\n\n隔离数据库 Pod，只允许指定前端访问 Redis 端口：\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: db-allow-frontend\n  namespace: prod\nspec:\n  podSelector:\n    matchLabels:\n      role: db\n  policyTypes:\n  - Ingress\n  - Egress\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels:\n          role: frontend\n    ports:\n    - protocol: TCP\n      port: 6379\n  egress:\n  - to:\n    - ipBlock:\n        cidr: 10.0.0.0/24\n    ports:\n    - protocol: TCP\n      port: 5978\n```\n\n来源和目的可以组合 Pod、namespace 与 CIDR。下面的示例把数据库入站限制为三类来源：同 namespace 的 frontend Pod、带 `purpose: app` 标签的 namespace 中的 client Pod、以及办公网段中排除一段子网后的地址。\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: db-allow-combined-sources\n  namespace: prod\nspec:\n  podSelector:\n    matchLabels:\n      role: db\n  policyTypes:\n  - Ingress\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels:\n          role: frontend\n    - namespaceSelector:\n        matchLabels:\n          purpose: app\n      podSelector:\n        matchLabels:\n          role: client\n    - ipBlock:\n        cidr: 172.17.0.0/16\n        except:\n        - 172.17.1.0/24\n    ports:\n    - protocol: TCP\n      port: 6379\n```\n\n同一个 `from` 列表中的多个条目是“或”的关系；同一个条目里同时写 `namespaceSelector` 和 `podSelector` 时表示二者同时满足。`ipBlock.except` 用来从大网段中排除更小的子网，常用于允许办公网或出口网段时排除不可信地址段。\n\nNetworkPolicy 很适合做 namespace 内部或 namespace 之间的基础隔离，但它通常只处理 L3/L4 条件。若要按 HTTP path、JWT claim 或 service identity 授权，需要服务网格或应用层策略。", "subs": ["Pod 的隔离状态", "关键字段", "默认拒绝和精确放行"]}, {"title": "Calico NetworkPolicy 如何扩展网络安全策略", "content": "Calico 在 Kubernetes NetworkPolicy 的基础上提供更丰富的策略能力。它既支持 Kubernetes 原生策略，也支持 `projectcalico.org/v3` 下的 Calico NetworkPolicy 和 GlobalNetworkPolicy。\n\n#### Calico 策略能力\n\nCalico NetworkPolicy 是 namespace 级资源，使用 selector 匹配 endpoint。它比原生 NetworkPolicy 更灵活，常见增强包括：\n\n| 能力 | 说明 |\n|---|---|\n| 更丰富的 selector | 支持表达式式标签选择 |\n| action | 可以显式 Allow、Deny、Log、Pass |\n| GlobalNetworkPolicy | 集群级策略，可跨 namespace 生效 |\n| HostEndpoint | 可把节点网卡纳入策略控制 |\n| 更细的顺序控制 | 通过策略层级和顺序表达优先级 |\n\n示例：允许特定来源访问 envoy 工作负载。\n\n```yaml\napiVersion: projectcalico.org/v3\nkind: NetworkPolicy\nmetadata:\n  name: allow-tcp-90\n  namespace: prod\nspec:\n  selector: app == \"envoy\"\n  types:\n  - Ingress\n  - Egress\n  ingress:\n  - action: Allow\n    protocol: TCP\n    source:\n      nets:\n      - 192.168.0.0/16\n      selector: role == \"frontend\"\n      namespaceSelector: project == \"platform\"\n    destination:\n      ports:\n      - 80\n      - 6040:6050\n  egress:\n  - action: Allow\n    destination:\n      ports:\n      - 443\n```\n\n#### Calico 的底层执行\n\n可以通过 toolbox 容器、ping 测试和 iptables 规则观察 Calico 策略效果。Calico 会把策略转换为节点上的规则链，例如 `cali-INPUT`、`cali-FORWARD` 和 workload 相关链。典型处理逻辑包括：\n\n- 已建立连接放行。\n- 无效连接丢弃。\n- 命中允许策略后打 mark 并返回。\n- 没有策略通过时丢弃。\n- 对 VXLAN 和 workload 流量做专门链路处理。\n\n```mermaid\nflowchart TB\n    Packet[\"数据包\"]\n    Input[\"Calico 输入链\"]\n    Dispatch[\"工作负载分发链\"]\n    Policy[\"策略链\"]\n    Profile[\"配置链\"]\n    Accept[\"接受\"]\n    Drop[\"丢弃\"]\n\n    Packet --> Input --> Dispatch --> Policy\n    Policy --> Accept\n    Policy --> Profile\n    Profile --> Accept\n    Profile --> Drop\n    Policy --> Drop\n```\n\nCalico 策略适合在需要更强网络隔离、全局默认拒绝、主机端点防护或策略审计时使用。它与 Kubernetes 原生 NetworkPolicy 的关系不是替代一切，而是补充更细的表达能力。", "subs": ["Calico 策略能力", "Calico 的底层执行"]}, {"title": "零信任架构如何改变服务访问模型", "content": "传统网络安全常以边界为中心：外网不可信，内网相对可信，DMZ、WAF、防火墙和入侵检测部署在边界上。这种模型在云原生环境中会遇到问题，因为服务、节点、Pod、用户、设备和办公网络都在动态变化，边界很难固定。\n\n#### 从边界信任到持续验证\n\n零信任的核心原则是：从不默认信任，始终验证。\n\n传统边界模型先把外网、DMZ 和内网切开，再把防火墙、IDS、WAF 放在入口处。它在固定机房时代有效，但到了 Pod、节点、用户设备和服务实例都频繁变化的云原生环境里，内网默认可信会变成横向移动的温床。\n\n```mermaid\nflowchart LR\n    Internet[\"Internet / Outside Zone\"]\n    Firewall[\"边界防护<br/>Firewall / IDS / WAF\"]\n    DMZ[\"DMZ Zone\"]\n    Inside[\"Inside Zone\"]\n    App[\"Application Server\"]\n    DB[\"Database Server\"]\n\n    Internet --> Firewall --> DMZ --> Inside\n    Inside --> App\n    Inside --> DB\n```\n\n因此，零信任不是不要边界，而是不把网络位置当成充分信任条件。每次访问都要重新看主体身份、设备和服务状态、请求上下文、策略条件和审计信号。\n\n| 传统边界模型 | 零信任模型 |\n|---|---|\n| 按网络位置判断可信度 | 按身份、上下文和策略判断可信度 |\n| 内网通常被默认信任 | 内外网都视为不可信 |\n| 静态访问控制 | 动态访问控制 |\n| 重点保护入口边界 | 每次访问都要认证和授权 |\n| 横向移动风险高 | 通过微隔离缩小影响范围 |\n\n```mermaid\nflowchart LR\n    Subject[\"访问主体\"]\n    Identity[\"身份验证\"]\n    Context[\"上下文评估\"]\n    Policy[\"动态策略\"]\n    Access[\"最小授权访问\"]\n    Audit[\"审计和监测\"]\n\n    Subject --> Identity --> Context --> Policy --> Access --> Audit\n    Audit --> Context\n```\n\n零信任网络建立在几个假设上：\n\n- 网络中始终存在威胁。\n- 内部和外部流量都可能不可信。\n- 不能只依靠网络位置建立信任。\n- 用户、设备、服务和流量都应被认证和授权。\n- 访问决策应基于尽可能多的数据源动态评估。\n\n#### 零信任三类关键技术\n\n零信任架构可以用 SIM 三类技术理解：\n\n| 技术 | 全称 | 作用 |\n|---|---|---|\n| SDP | Software Defined Perimeter | 软件定义边界，隐藏和保护服务入口 |\n| IAM | Identity and Access Management | 身份管理，提供唯一身份和生命周期管理 |\n| MSG | Micro Segmentation | 微隔离，将访问边界切到工作负载级别 |\n\nSDP 把控制流和数据流分开：访问主体先向控制面证明身份、设备状态和上下文，控制面通过后才暴露服务入口或下发连接信息；未通过验证的主体连目标服务的网络位置都不应该看到。IAM 负责给人、设备、服务和自动化程序建立唯一身份，并管理入职、离职、过期、异常登录、权限回收等生命周期事件。微隔离则把传统数据中心的大网段拆成工作负载级安全段，让东西向访问必须显式放行，即使攻击者进入某个 Pod 或节点，也不能天然访问同网段里的其他服务。\n\n```mermaid\nflowchart TB\n    ZT[\"Zero Trust\"]\n    Data[\"Data\"]\n    People[\"People\"]\n    Networks[\"Networks\"]\n    Workloads[\"Workloads\"]\n    Devices[\"Devices\"]\n    Visibility[\"Visibility & Analytics\"]\n    Automation[\"Automation & Orchestration\"]\n\n    ZT --> Data\n    ZT --> People\n    ZT --> Networks\n    ZT --> Workloads\n    ZT --> Devices\n    ZT --> Visibility\n    ZT --> Automation\n```\n\n把零信任落到 Kubernetes 和 Istio 时，Data 对应 Secret、存储加密和敏感接口；People 和 Devices 对应企业 IAM、OIDC 和访问上下文；Workloads 对应 ServiceAccount、SPIFFE、mTLS 和 AuthorizationPolicy；Visibility 与 Automation 则对应审计、遥测、告警和自动化策略下发。\n\n在 Kubernetes 和 Istio 中，这些理念分别落到：\n\n- ServiceAccount 和 SPIFFE 身份。\n- RBAC 和 AuthorizationPolicy。\n- NetworkPolicy 和 Calico 网络隔离。\n- mTLS 和证书轮换。\n- 请求级 JWT 认证。\n- Envoy 代理侧审计和遥测。", "subs": ["从边界信任到持续验证", "零信任三类关键技术"]}, {"title": "Istio 安全模型和身份如何建立服务信任", "content": "微服务架构让服务数量增加、调用链变长、东西向流量增多，也让安全边界从入口网关延伸到每一次服务调用。Istio 的安全目标是把服务间认证、加密、授权和审计从业务代码中剥离出来，由数据平面代理和控制平面统一管理。\n\n#### Istio 安全目标\n\n| 目标 | 含义 |\n|---|---|\n| 默认安全 | 应用不用改代码，也能获得身份、证书和加密能力 |\n| 深度防御 | 与已有身份、证书、审计和策略系统集成 |\n| 零信任网络 | 在不可信网络上建立服务到服务的安全通信 |\n\nIstio 安全架构包含：\n\n- CA 负责密钥和证书管理。\n- istiod 分发认证、授权和网络配置。\n- Envoy Sidecar 和边缘代理作为策略执行点。\n- 扩展和遥测能力用于审计、指标和访问日志。\n\n```mermaid\nflowchart TB\n    Istiod[\"istiod\"]\n    CA[\"证书机构\"]\n    Policy[\"安全策略\"]\n    ProxyA[\"服务 A 代理\"]\n    ServiceA[\"服务 A\"]\n    ProxyB[\"服务 B 代理\"]\n    ServiceB[\"服务 B\"]\n    Gateway[\"入口代理\"]\n\n    Istiod --> CA\n    Policy --> Istiod\n    Istiod --> ProxyA\n    Istiod --> ProxyB\n    Istiod --> Gateway\n    Gateway --> ProxyA\n    ProxyA --> ServiceA\n    ServiceA --> ProxyA\n    ProxyA --> ProxyB\n    ProxyB --> ServiceB\n```\n\n#### Istio 身份模型\n\nIstio 使用服务身份判断请求来源。不同平台的身份来源不同，在 Kubernetes 中通常来自 ServiceAccount。\n\n| 平台 | 身份来源 |\n|---|---|\n| Kubernetes | Kubernetes ServiceAccount |\n| GKE 或 GCE | GCP ServiceAccount |\n| AWS | IAM 用户或角色 |\n| 本地环境 | 用户账号、自定义服务账号或服务名称 |\n\nIstio 与 SPIFFE 身份模型兼容。Kubernetes 中常见身份格式如下：\n\n```text\nspiffe://cluster.local/ns/default/sa/sleep\n```\n\n这个身份表达三件事：信任域、namespace 和 ServiceAccount。服务端可以根据调用方身份做授权，客户端也可以验证服务端证书中的身份是否被授权运行目标服务。\n\n安全命名解决的是“服务名称”和“证书身份”之间的绑定问题。客户端访问 `reviews.default.svc.cluster.local` 时，真正参与 mTLS 握手的是服务端代理证书中的 SPIFFE 身份，例如 `spiffe://cluster.local/ns/default/sa/reviews`。Istio 控制面会监视 Kubernetes Service、Endpoint、Pod 和 ServiceAccount，把服务发现名称映射到被允许承载该服务的身份，再把这份映射安全分发给代理。客户端代理在校验证书时不只检查证书是否由可信 CA 签发，还会检查该身份是否被授权运行目标服务名。\n\n#### SDS 和证书供应\n\nIstio 通过 Secret Discovery Service 为 Envoy 提供证书和私钥。流程如下：\n\n```mermaid\nsequenceDiagram\n    participant Envoy as Envoy\n    participant Agent as istio agent\n    participant Istiod as istiod\n    participant CA as CA\n\n    Envoy->>Agent: 请求证书和密钥\n    Agent->>Agent: 生成私钥和 CSR\n    Agent->>Istiod: 提交 CSR 和凭据\n    Istiod->>CA: 验证并签名 CSR\n    CA-->>Istiod: 返回证书\n    Istiod-->>Agent: 下发证书\n    Agent-->>Envoy: 提供证书和私钥\n```\n\n工作负载启动后，Envoy 向同 Pod 内的 `istio-agent` 请求身份材料；agent 生成私钥和 CSR，发送给 istiod CA；CA 验证凭据并签发证书；agent 再把证书和私钥通过 SDS 提供给 Envoy。证书临近过期时，agent 会重复流程完成轮换。\n\n对于 Istio Gateway，标准做法可以通过 `credentialName` 引用 Kubernetes TLS Secret，再由 SDS 把证书材料送给网关代理。但如果安全规范要求私钥和证书不能长期存放在同一个 Secret 中，就需要定制 SDS 或 Secret provider：例如证书从证书管理系统读取，私钥从 KMS/HSM 或专用 provider 读取，只在 Gateway Pod 内存中短暂组合后交给 Envoy 使用。\n\n证书轮换依赖 istiod 和 CA 持续可用。Istio 证书通常有效期较短，短时控制面故障不会立刻切断已有数据面连接；但如果 istiod 长时间不可用，工作负载和 Gateway 无法续签证书，证书超过有效期后 mTLS 握手会失败，局部控制面故障就可能演变成全网格通信故障。生产设计需要监控 istiod 健康、CSR 签发失败、证书剩余有效期和 Gateway SDS 状态，并准备升级回滚和临时证书恢复路径。\n\n#### Gateway 升级和流量导入风险\n\nIstio Gateway 升级可以采用滚动升级或 A/B 方式，但入口网关直接承接用户流量，readiness 不能只表示进程存活。新网关 Pod 可能已经拿到 LDS/RDS 并被判定为 ready，但 EDS、AuthorizationPolicy、PeerAuthentication 或其他策略还没有全量推送到 Envoy；此时外部负载均衡器开始导流，就可能出现短暂 503 或策略不一致。\n\n生产中应把网关 ready 条件设计得更保守：简单场景可以增加 `initialDelaySeconds`，给 xDS 和策略收敛留出缓冲；高要求场景应使用自定义探针，确认关键 listener、route、cluster endpoint 和安全策略已经进入预期状态后再接流量。升级窗口还要观察 Envoy 配置同步状态、SDS 状态和 5xx 指标，而不是只看 Kubernetes Pod Ready。\n\n后端工作负载终止时也有类似风险。某个 Pod 已进入 `terminating`，但四层负载均衡或网关的 endpoint 权重尚未归零时，连接仍可能被导向正在退出的实例。滚动升级和缩容流程应先把目标实例权重调为 0 或从上游 endpoint 中摘除，等待连接排空后再终止容器。", "subs": ["Istio 安全目标", "Istio 身份模型", "SDS 和证书供应", "Gateway 升级和流量导入风险"]}, {"title": "Istio 认证如何实现 mTLS 和策略控制", "content": "Istio 认证分为两类：PeerAuthentication 处理服务到服务身份认证，RequestAuthentication 处理最终用户或请求级凭据认证。\n\n#### PeerAuthentication 和 RequestAuthentication\n\n| 类型 | 认证对象 | 典型机制 | 作用 |\n|---|---|---|---|\n| PeerAuthentication | 服务工作负载 | mTLS | 验证对端服务身份 |\n| RequestAuthentication | 最终用户请求 | JWT | 验证请求携带的用户凭据 |\n\nPeerAuthentication 由 Envoy 在服务间通信时自动执行，应用代码无需修改。RequestAuthentication 要求应用或上游网关把 token 放入请求中，Istio 根据 issuer、JWKS 和 token 位置验证请求。\n\n```mermaid\nflowchart LR\n    User[\"最终用户\"]\n    Token[\"JWT\"]\n    Client[\"客户端服务\"]\n    ProxyA[\"客户端代理\"]\n    ProxyB[\"服务端代理\"]\n    Server[\"服务端服务\"]\n\n    User --> Token --> Client --> ProxyA\n    ProxyA --> ProxyB\n    ProxyB --> Server\n```\n\n认证策略有作用域。namespace 级策略可以覆盖一组工作负载，selector 级策略只覆盖命中的工作负载；未命中的工作负载仍按更外层或默认策略处理。生产排查时不能只看 YAML 是否存在，还要看它是否真的选中了目标代理。\n\n```mermaid\nflowchart TB\n    Admin[\"Administrators\"] --> Istiod[\"istiod\"]\n    Istiod --> PolicyFoo[\"Authentication policy<br/>namespace: Foo<br/>targets: all\"]\n    Istiod --> PolicyBar[\"Authentication policy<br/>namespace: Bar<br/>target: Workload X\"]\n\n    subgraph Foo[\"namespace Foo\"]\n        WorkloadA[\"Workload A\"]\n        ProxyA[\"Proxy\"]\n        WorkloadB[\"Workload B\"]\n        ProxyB[\"Proxy\"]\n        WorkloadA <--> ProxyA\n        WorkloadB <--> ProxyB\n        ProxyA <-->|mTLS| ProxyB\n    end\n\n    subgraph Bar[\"namespace Bar\"]\n        WorkloadX[\"Workload X\"]\n        ProxyX[\"Proxy\"]\n        WorkloadY[\"Workload Y\"]\n        ProxyY[\"Proxy\"]\n        WorkloadX <--> ProxyX\n        WorkloadY <--> ProxyY\n    end\n\n    PolicyFoo -.-> ProxyA\n    PolicyFoo -.-> ProxyB\n    PolicyBar -.-> ProxyX\n```\n\n#### mTLS 认证流程\n\n当客户端工作负载访问服务端工作负载时：\n\n1. 客户端出站流量被重定向到本地 Envoy。\n2. 客户端 Envoy 与服务端 Envoy 发起 mTLS 握手。\n3. 客户端 Envoy 校验服务端证书和安全命名映射。\n4. 服务端 Envoy 校验客户端证书和身份。\n5. 双方建立加密连接。\n6. 服务端 Envoy 在授权通过后把请求转发给本地服务。\n\n```mermaid\nsequenceDiagram\n    participant Client as Client\n    participant CProxy as Client Proxy\n    participant SProxy as Server Proxy\n    participant Server as Server\n\n    Client->>CProxy: 发起请求\n    CProxy->>SProxy: mTLS 握手\n    CProxy->>CProxy: 校验服务端身份\n    SProxy->>SProxy: 校验客户端身份\n    CProxy->>SProxy: 加密请求\n    SProxy->>Server: 本地转发\n```\n\n#### mTLS 模式\n\nPeerAuthentication 常见模式：\n\n| 模式 | 含义 | 使用场景 |\n|---|---|---|\n| `PERMISSIVE` | 同时接受明文和 mTLS | 迁移期 |\n| `STRICT` | 只接受 mTLS | 网格内强制加密 |\n| `DISABLE` | 禁用 mTLS | 特殊端口或兼容场景 |\n\n未设置网格级 PeerAuthentication 时，Istio 通常采用 `PERMISSIVE`，这样能让未注入 sidecar 的客户端和已启用 mTLS 的客户端同时访问同一服务，便于迁移。但 `PERMISSIVE` 不是强制加密：它允许明文请求继续进入服务端代理。`DISABLE` 或端口级禁用 mTLS 后，代理之间会按明文通信，除非客户端侧 DestinationRule 另有 TLS 配置。因此生产中要把 `STRICT` 作为最终目标，并用指标和访问日志确认是否仍有 plaintext 流量。\n\n服务端配置严格 mTLS：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: PeerAuthentication\nmetadata:\n  name: reviews-strict\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: reviews\n  mtls:\n    mode: STRICT\n```\n\n端口级别禁用 mTLS：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: PeerAuthentication\nmetadata:\n  name: example-port-policy\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: example-app\n  portLevelMtls:\n    8080:\n      mode: DISABLE\n```\n\n客户端侧的 TLS 行为通过 DestinationRule 描述：\n\n```yaml\napiVersion: networking.istio.io/v1beta1\nkind: DestinationRule\nmetadata:\n  name: ratings-istio-mtls\n  namespace: prod\nspec:\n  host: ratings.prod.svc.cluster.local\n  trafficPolicy:\n    tls:\n      mode: ISTIO_MUTUAL\n```\n\n`ISTIO_MUTUAL` 表示使用 Istio 自动管理的证书。`SIMPLE` 表示普通 TLS，`MUTUAL` 表示手工指定客户端证书、私钥和 CA。\n\n普通 TLS 只校验服务端证书，常用于访问网格外 HTTPS 服务：\n\n```yaml\napiVersion: networking.istio.io/v1beta1\nkind: DestinationRule\nmetadata:\n  name: external-simple-tls\n  namespace: prod\nspec:\n  host: api.external.example.com\n  trafficPolicy:\n    tls:\n      mode: SIMPLE\n      sni: api.external.example.com\n```\n\n手工 mTLS 需要显式提供客户端证书、私钥和 CA，适合接入非 Istio 管理证书体系：\n\n```yaml\napiVersion: networking.istio.io/v1beta1\nkind: DestinationRule\nmetadata:\n  name: external-mutual-tls\n  namespace: prod\nspec:\n  host: payments.external.example.com\n  trafficPolicy:\n    tls:\n      mode: MUTUAL\n      clientCertificate: /etc/certs/client-cert.pem\n      privateKey: /etc/certs/client-key.pem\n      caCertificates: /etc/certs/ca-cert.pem\n      sni: payments.external.example.com\n```\n\n#### RequestAuthentication 和 JWT\n\nRequestAuthentication 用来验证请求中的 JWT。它会检查 issuer、签名和 token 位置。需要注意：只配置 RequestAuthentication 时，不带 token 的请求默认仍可能被接受；如果要强制要求认证，必须配合 AuthorizationPolicy。\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: RequestAuthentication\nmetadata:\n  name: ingress-jwt\n  namespace: istio-system\nspec:\n  selector:\n    matchLabels:\n      istio: ingressgateway\n  jwtRules:\n  - issuer: testing@secure.istio.io\n    jwksUri: https://issuer.example.com/.well-known/jwks\n```\n\n这也体现了认证和授权的边界：认证回答“你是谁”，授权回答“你能访问什么”。JWT 验证通过只说明请求者身份可信，不代表它可以访问所有服务。", "subs": ["PeerAuthentication 和 RequestAuthentication", "mTLS 认证流程", "mTLS 模式", "RequestAuthentication 和 JWT"]}, {"title": "Istio 授权如何精细化控制服务访问", "content": "Istio 授权由 Envoy 中的授权引擎执行。请求到达代理时，Envoy 根据当前 AuthorizationPolicy 评估来源、目标、操作和条件，然后返回允许或拒绝。\n\n#### 授权策略的基本规则\n\n| 规则 | 含义 |\n|---|---|\n| 支持 `ALLOW` 和 `DENY` | 允许策略和拒绝策略都可表达 |\n| `DENY` 优先 | 拒绝策略命中时优先拒绝 |\n| 有允许策略时默认拒绝未匹配请求 | 工作负载被 ALLOW 策略覆盖后，没匹配的请求不会被放行 |\n| 未设置 selector 时作用于同 namespace 所有工作负载 | 根 namespace 可作用于全网格 |\n\n策略目标由 `metadata.namespace` 和可选的 `selector` 共同决定。普通 namespace 中的策略只影响该 namespace：设置 `selector` 时只作用于匹配标签的工作负载；不设置 `selector` 时作用于同 namespace 的全部工作负载。root namespace 中的策略可以作用于整个网格，默认 root namespace 通常是 `istio-system`，也可以通过网格配置调整。全局策略要格外谨慎，因为一个空 `selector` 的 `DENY` 策略可能把全网格流量一起拒绝。\n\n```mermaid\nflowchart TB\n    Admin[\"Administrators\"]\n    ApiServer[\"API Server configuration\"]\n    Istiod[\"istiod\"]\n    Authz[\"Authorization policies\"]\n\n    subgraph Mesh[\"Istio Mesh\"]\n        WorkloadA[\"Workload A\"]\n        ProxyA[\"Proxy A<br/>authorization engine\"]\n        WorkloadB[\"Workload B\"]\n        ProxyB[\"Proxy B<br/>authorization engine\"]\n        WorkloadA <--> ProxyA\n        ProxyA <-->|mTLS| ProxyB\n        ProxyB <--> WorkloadB\n    end\n\n    Admin --> Authz --> ApiServer --> Istiod\n    Istiod -.->|policy| ProxyA\n    Istiod -.->|policy| ProxyB\n    ProxyA -->|ALLOW / DENY| WorkloadA\n    ProxyB -->|ALLOW / DENY| WorkloadB\n```\n\n授权策略由管理员提交到 API Server，经 istiod 分发到各个 Envoy，再由每个代理本地执行。它和认证的边界很清楚：mTLS 或 JWT 让代理知道请求者是谁，AuthorizationPolicy 再根据 principal、namespace、method、path、port 和 claim 判断这次访问是否被允许。\n\n#### AuthorizationPolicy 结构\n\n核心字段：\n\n| 字段 | 作用 |\n|---|---|\n| `metadata.namespace` | 策略所在 namespace |\n| `selector` | 选择目标工作负载 |\n| `action` | ALLOW 或 DENY |\n| `rules.from` | 请求来源，如 principal、namespace |\n| `rules.to` | 请求操作，如 method、path、port |\n| `rules.when` | 附加条件，如 JWT claim、请求头 |\n\n允许来自指定 ServiceAccount 或 dev namespace 的 GET 请求，并要求 issuer 匹配：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: httpbin\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: httpbin\n      version: v1\n  action: ALLOW\n  rules:\n  - from:\n    - source:\n        principals:\n        - cluster.local/ns/default/sa/sleep\n    - source:\n        namespaces:\n        - dev\n    to:\n    - operation:\n        methods:\n        - GET\n    when:\n    - key: request.auth.claims[iss]\n      values:\n      - https://accounts.google.com\n```\n\nAuthorizationPolicy 的字符串值支持多种匹配模式：\n\n| 模式 | 示例 | 含义 |\n|---|---|---|\n| 完全匹配 | `GET` | 必须完全相等 |\n| 前缀匹配 | `/api/*` | 匹配指定前缀 |\n| 后缀匹配 | `*/admin` | 匹配指定后缀 |\n| 存在匹配 | `*` | 字段存在即可 |\n\n`when` 不只适合 JWT claim，也可以引用请求头、来源属性和连接上下文。下面的策略只允许带 `version: v1` 请求头的 GET 请求访问 `/api/` 前缀路径：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: httpbin-header-version\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: httpbin\n  action: ALLOW\n  rules:\n  - to:\n    - operation:\n        methods:\n        - GET\n        paths:\n        - /api/*\n    when:\n    - key: request.headers[version]\n      values:\n      - v1\n```\n\n拒绝非 `foo` namespace 来源：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: httpbin-deny\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: httpbin\n      version: v1\n  action: DENY\n  rules:\n  - from:\n    - source:\n        notNamespaces:\n        - foo\n```\n\n#### 默认允许、默认拒绝和公开访问\n\n允许 default namespace 中所有工作负载的全部访问：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: allow-all\n  namespace: default\nspec:\n  action: ALLOW\n  rules:\n  - {}\n```\n\n拒绝 admin namespace 中所有工作负载访问：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: deny-all\n  namespace: admin\nspec: {}\n```\n\n如果只允许经过认证的主体，可以使用 principal 通配：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: authenticated-only\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: httpbin\n  action: ALLOW\n  rules:\n  - from:\n    - source:\n        principals:\n        - \"*\"\n```\n\n如果工作负载需要公开访问，则不要限制 source，只限制操作：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: public-read\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: httpbin\n  action: ALLOW\n  rules:\n  - to:\n    - operation:\n        methods:\n        - GET\n        - POST\n```\n\n#### TCP 工作负载的授权边界\n\nIstio 授权也可以用于 TCP 工作负载，但不能依赖 HTTP 专属字段。对 MongoDB 这类 TCP 服务，应使用 principal、namespace、port 等协议无关字段。\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: mongodb-policy\n  namespace: default\nspec:\n  selector:\n    matchLabels:\n      app: mongodb\n  action: ALLOW\n  rules:\n  - from:\n    - source:\n        principals:\n        - cluster.local/ns/default/sa/bookinfo-ratings-v2\n    to:\n    - operation:\n        ports:\n        - \"27017\"\n```\n\n最终可以把 Istio 安全控制理解成三层：\n\n| 层次 | 对象 | 回答的问题 |\n|---|---|---|\n| 身份 | ServiceAccount、SPIFFE、证书 | 调用方和服务端是谁 |\n| 认证 | PeerAuthentication、RequestAuthentication | 身份或请求凭据是否可信 |\n| 授权 | AuthorizationPolicy | 可信身份能访问哪些服务和操作 |\n\n这三层配合 mTLS、NetworkPolicy、RBAC 和审计，才能形成从集群控制面到服务调用面的完整安全保证。", "subs": ["授权策略的基本规则", "AuthorizationPolicy 结构", "默认允许、默认拒绝和公开访问", "TCP 工作负载的授权边界"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
