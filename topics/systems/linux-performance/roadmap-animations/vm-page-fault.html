<!-- roadmap animation: vm-page-fault -->
<!-- marker data-roadmap-animation-id="vm-page-fault" -->
<script id="vm-page-fault-script">
(function(){
  "use strict";
  var ID = "vm-page-fault";
  var NS = "http://www.w3.org/2000/svg";
  var INK="#1f2933", PAPER="#fffdf5", MUTED="#6b7280",
      ACTIVE="#bfdbfe", DONE="#bbf7d0", WARN="#fde68a", FAIL="#fecaca";
  var player=null, root=null, svg=null, ui={nodes:{},panels:{},note:null}, state={fills:{}};

  function el(tag, attrs, parent){ var n=document.createElementNS(NS, tag); for(var k in attrs) n.setAttribute(k, attrs[k]); if(parent) parent.appendChild(n); return n; }
  function txt(parent,x,y,s,size,weight,fill,anchor){ var t=el("text",{x:x,y:y,"text-anchor":anchor||"middle","font-size":size||13,"font-weight":weight||700,fill:fill||INK},parent); t.textContent=s; return t; }
  function defs(){ var d=el("defs",{},svg); var m=el("marker",{id:ID+"-arrow",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},d); el("path",{d:"M0,0 L10,5 L0,10 z",fill:"#6b7280"},m); }
  function clearSvg(){ while(svg.firstChild) svg.removeChild(svg.firstChild); defs(); ui.nodes={}; ui.note=null; }
  function node(key,x,y,w,h,title,sub){ var g=el("g",{},svg); var r=el("rect",{x:x,y:y,width:w,height:h,rx:"11",fill:PAPER,stroke:INK,"stroke-width":"2"},g); txt(g,x+w/2,sub?y+h/2-3:y+h/2+5,title,12.5,800); if(sub) txt(g,x+w/2,y+h/2+15,sub,10.5,600,MUTED); ui.nodes[key]={rect:r,cx:x+w/2,cy:y+h/2,x:x,y:y,w:w,h:h}; return ui.nodes[key]; }
  function edge(x1,y1,x2,y2,labelText,dash){ var ln=el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:"#9ca3af","stroke-width":"2","marker-end":"url(#"+ID+"-arrow)"},svg); if(dash) ln.setAttribute("stroke-dasharray","6 6"); if(labelText) txt(svg,(x1+x2)/2,(y1+y2)/2-7,labelText,11,700,MUTED); return ln; }
  function note(x,y,s){ ui.note=txt(svg,x,y,s||"",13,800,"#b45309"); }
  function colorFor(name){ return name==="active"?ACTIVE:name==="done"?DONE:name==="warn"?WARN:name==="fail"?FAIL:PAPER; }
  function paint(){ for(var k in ui.nodes){ ui.nodes[k].rect.setAttribute("fill", colorFor(state.fills[k])); } }
  function setPanel(name,v){ if(ui.panels[name]) ui.panels[name].textContent=v; }
  function apply(p){ if(p.fills) for(var k in p.fills) state.fills[k]=p.fills[k]; if(p.panels) for(var n in p.panels) setPanel(n,p.panels[n]); if("note" in p && ui.note) ui.note.textContent=p.note; paint(); }

  function drawChapter(idx){
    clearSvg(); state.fills={};
    if(idx===0){
      node("va",25,160,150,60,"进程虚拟地址","每进程独立");
      node("mmu",205,160,110,60,"MMU","地址转换");
      node("tlb",345,160,150,60,"TLB 查询","缓存页表项");
      node("pt",345,55,150,52,"查询页表","Page Table");
      node("fault",545,55,170,52,"触发缺页异常","");
      node("alloc",520,290,200,52,"内核分配/加载页","伙伴系统 / 换入");
      node("update",750,290,125,52,"更新页表","");
      node("pa",735,160,140,60,"物理地址","完成映射");
      edge(175,190,205,190); edge(315,190,345,190);
      edge(495,180,735,180,"命中");
      edge(420,160,420,107,"未命中");
      edge(495,82,735,165,"已有映射");
      edge(495,82,545,82,"无映射");
      edge(625,107,620,290,"按需");
      edge(720,316,750,316);
      edge(812,290,805,220,"回填");
      note(150,300,"");
      setPanel("stage","地址翻译"); setPanel("mean","虚拟→物理"); setPanel("cost","TLB 命中最省"); setPanel("key","缺页才进内核");
    } else if(idx===1){
      node("malloc",30,22,150,46,"malloc 申请","brk / mmap");
      node("vaddr",215,22,160,46,"返回虚拟地址","还没物理页");
      node("touch",410,22,150,46,"首次访问","读 / 写该地址");
      node("alloc",595,22,265,46,"缺页 → 分配物理页","按需分配");
      edge(180,45,215,45); edge(375,45,410,45); edge(560,45,595,45);
      node("minor",50,108,370,64,"次缺页 Minor Fault","首次匿名页 / 写时复制 / 页已在缓存");
      node("major",480,108,370,64,"主缺页 Major Fault","文件页不在缓存 / 换入 Swap 页");
      node("mcost",50,196,370,56,"成本：页表 + 内存管理","不触发存储 I/O");
      node("jcost",480,196,370,56,"成本：存储 I/O + 调度等待","会引入延迟");
      node("judge",110,288,680,56,"判断：主缺页 + 业务尾延迟同升，才查文件访问 / Swap","minflt/s 高常属正常");
      edge(235,172,235,196); edge(665,172,665,196);
      note(450,372,"");
      setPanel("stage","缺页类型"); setPanel("mean","分配≠占物理页"); setPanel("cost","Minor 省 / Major 贵"); setPanel("key","majflt 才警惕");
    } else {
      node("newp",30,28,160,52,"新页 / 再次访问","");
      node("active",300,28,190,54,"活跃集合 Active","热页留住");
      node("scan",580,28,150,52,"老化扫描","");
      node("inact",360,138,210,58,"非活跃集合 Inactive","回收候选");
      node("clean",30,250,210,54,"干净文件页","直接回收，最省");
      node("dirty",340,250,230,54,"脏文件页","写回后回收");
      node("anon",660,250,210,54,"匿名页","换出 Swap / 保留");
      edge(190,54,300,55); edge(490,55,580,54);
      edge(640,80,560,140);
      edge(450,138,400,82,"再次访问");
      edge(420,196,160,250,"干净");
      edge(470,196,460,250,"脏页");
      edge(520,196,740,250,"匿名");
      note(450,344,"");
      setPanel("stage","LRU 回收"); setPanel("mean","活跃↔非活跃"); setPanel("cost","干净页最易回收"); setPanel("key","匿名页要 Swap");
    }
    paint();
  }

  var CHAPTERS=[
    { intro:"进程看到的都是<b>虚拟地址</b>，访问时由 MMU 翻译成物理地址：先查 <b>TLB</b>，再查<b>页表</b>，没有映射才<b>触发缺页异常</b>进内核。",
      steps:[
        {text:"进程发出<b>虚拟地址</b>，交给 <b>MMU</b> 翻译——用户态各进程的地址空间相互隔离。", run:function(c){ apply({fills:{va:"active",mmu:"active"}, panels:{stage:"地址翻译",mean:"虚拟→物理"}, note:"① MMU 翻译"}); return c.wait(800);}},
        {text:"先查 <b>TLB</b>（缓存近期页表项）。<b>命中</b>就直接拿到物理地址——这是最省的路径。", run:function(c){ apply({fills:{mmu:"done",tlb:"active",pa:"done"}, panels:{stage:"TLB",cost:"命中最省",key:"局部性很重要"}, note:"② TLB 命中 → 物理地址"}); return c.wait(850);}},
        {text:"TLB <b>未命中</b>则<b>查询页表</b>。若已有映射，回填后同样得到物理地址。", run:function(c){ apply({fills:{tlb:"warn",pt:"active"}, panels:{stage:"页表",mean:"查 Page Table"}, note:"③ 查页表"}); return c.wait(800);}},
        {text:"页表里<b>没有映射</b> → <b>触发缺页异常</b>，陷入内核。这一步才有真正的开销。", run:function(c){ apply({fills:{pt:"done",fault:"warn"}, panels:{stage:"缺页异常",key:"进内核"}, note:"④ 无映射 → 缺页"}); return c.wait(800);}},
        {text:"内核<b>分配或加载内存页</b>（伙伴系统分配 / 从 Swap 或文件换入），再<b>更新页表</b>。", run:function(c){ apply({fills:{fault:"done",alloc:"active",update:"active"}, panels:{stage:"分配/加载",cost:"可能含 I/O"}, note:"⑤ 分配页 + 更新页表"}); return c.wait(850);}},
        {text:"映射建立后<b>回填物理地址</b>，恢复执行。<code>getconf PAGE_SIZE</code> 看页大小，HugePage 可减少页表项与 TLB 压力。", run:function(c){ apply({fills:{alloc:"done",update:"done",pa:"done"}, panels:{stage:"完成",key:"HugePage 减压"}, note:"⑥ 完成映射"}); return c.wait(800);}}
      ]},
    { intro:"<code>malloc()</code> 成功通常只拿到<b>虚拟地址</b>，物理页在<b>首次访问</b>时才按需分配。缺页分两类，成本差很多。",
      steps:[
        {text:"<code>malloc</code> 经 <code>brk</code>/<code>mmap</code> 拿到<b>虚拟地址</b>——此时还没有物理页。", run:function(c){ apply({fills:{malloc:"active",vaddr:"active"}, panels:{stage:"申请",mean:"分配≠占物理页"}, note:"① 只拿到虚拟地址"}); return c.wait(800);}},
        {text:"<b>首次访问</b>该地址才触发缺页，由内核<b>分配物理页</b>——这就是「按需分配」。", run:function(c){ apply({fills:{vaddr:"done",touch:"active",alloc:"active"}, panels:{stage:"首次访问",key:"按需分配"}, note:"② 首次访问才分配"}); return c.wait(800);}},
        {text:"<b>次缺页 Minor</b>：首次匿名页、写时复制、页已在缓存——<b>不需要存储 I/O</b>，成本只是页表与内存管理。", run:function(c){ apply({fills:{touch:"done",alloc:"done",minor:"active",mcost:"active"}, panels:{stage:"次缺页",cost:"无 I/O，便宜"}, note:"③ Minor：无 I/O"}); return c.wait(850);}},
        {text:"<b>主缺页 Major</b>：文件页不在缓存、换入 Swap——要<b>真做存储 I/O</b>并等待调度，成本高。", run:function(c){ apply({fills:{major:"warn",jcost:"warn"}, panels:{stage:"主缺页",cost:"有 I/O，昂贵"}, note:"④ Major：含 I/O"}); return c.wait(850);}},
        {text:"判断要点：<code>minflt/s</code> 高常属正常；<b>主缺页与业务尾延迟同升</b>时，才继续查文件访问与 Swap。", run:function(c){ apply({fills:{judge:"done"}, panels:{stage:"判断",key:"majflt + 尾延迟"}, note:"⑤ 看 majflt/s + 尾延迟"}); return c.wait(850);}}
      ]},
    { intro:"内核按访问情况维护 <b>Active / Inactive</b> 两个集合，并区分匿名页与文件页。回收时<b>干净页最省、匿名页最贵</b>。",
      steps:[
        {text:"<b>新页或再次被访问</b>的页进入<b>活跃集合 Active</b>，被认为是热数据先留住。", run:function(c){ apply({fills:{newp:"active",active:"active"}, panels:{stage:"活跃集合",mean:"热页留住"}, note:"① 进入 Active"}); return c.wait(800);}},
        {text:"<b>老化扫描</b>把不再被访问的页降级到<b>非活跃集合 Inactive</b>——成为回收候选。", run:function(c){ apply({fills:{active:"done",scan:"active",inact:"active"}, panels:{stage:"老化",mean:"降级到 Inactive"}, note:"② 老化 → Inactive"}); return c.wait(800);}},
        {text:"非活跃页若<b>再次被访问</b>，会重新提升回活跃集合。", run:function(c){ apply({fills:{scan:"done",active:"active"}, panels:{stage:"回升",key:"二次机会"}, note:"③ 再访问 → 回 Active"}); return c.wait(750);}},
        {text:"回收时：<b>干净文件页</b>可直接丢弃（能从文件重读），<b>成本最低</b>。", run:function(c){ apply({fills:{active:"done",clean:"done"}, panels:{stage:"回收·干净页",cost:"直接回收，最省"}, note:"④ 干净文件页：直接回收"}); return c.wait(800);}},
        {text:"<b>脏文件页</b>必须<b>先写回</b>再回收；<b>匿名页</b>没有文件后备，通常要<b>换出 Swap</b> 才能释放。", run:function(c){ apply({fills:{dirty:"warn",anon:"fail"}, panels:{stage:"回收·脏页/匿名",cost:"匿名页最贵",key:"匿名→Swap"}, note:"⑤ 脏页先写回 / 匿名换 Swap"}); return c.wait(850);}}
      ]}
  ];

  function buildDom(host){
    if(host.querySelector("[data-roadmap-animation-id='"+ID+"']")) return;
    root=document.createElement("div"); root.id=ID; root.className="ka-anim"; root.setAttribute("data-roadmap-animation-id", ID);
    root.innerHTML=
      '<div class="ka-head"><strong>虚拟内存映射与缺页</strong><small>地址翻译 · 主/次缺页 · LRU 回收</small><button class="ka-zoom" data-action="zoom">放大</button></div>'+
      '<div class="ka-tabs"><button data-ch="0">地址翻译</button><button data-ch="1">主缺页 vs 次缺页</button><button data-ch="2">LRU 回收</button></div>'+
      '<div class="ka-stage"><svg viewBox="0 0 900 376" role="img" aria-label="虚拟内存映射与缺页动画"></svg></div>'+
      '<div class="ka-panels"><div class="ka-panel"><b>环节</b><span data-panel="stage">—</span></div><div class="ka-panel"><b>含义</b><span data-panel="mean">—</span></div><div class="ka-panel"><b>成本</b><span data-panel="cost">—</span></div><div class="ka-panel"><b>要点</b><span data-panel="key">—</span></div></div>'+
      '<div class="ka-caption" data-role="caption"></div>'+
      '<div class="ka-ctrl"><button data-action="play">播放本幕</button><button data-action="step">下一步</button><button data-action="reset">重置本幕</button><label>速度 <select data-action="speed"><option value="1.6">慢</option><option value="1" selected>正常</option><option value="0.55">快</option></select></label></div>'+
      '<div class="ka-legend"><span><i style="background:#bfdbfe"></i>当前</span><span><i style="background:#bbf7d0"></i>已完成</span><span><i style="background:#fde68a"></i>需注意</span><span><i style="background:#fecaca"></i>高成本</span></div>';
    host.appendChild(root);
    svg=root.querySelector("svg"); ui.panels={};
    root.querySelectorAll("[data-panel]").forEach(function(p){ ui.panels[p.dataset.panel]=p; });
  }
  function mount(host){ buildDom(host); player=window.RoadmapAnimations.createPlayer({ animationId:ID, root:root, chapters:CHAPTERS, resetState:function(idx){ drawChapter(idx); }, render:function(){ paint(); }, finishedText:function(){ return "<br><b>本幕结束</b>，可切换页签重看。"; } }); }
  function unmount(){ if(player) player.destroy(); player=null; if(root) root.remove(); root=null; svg=null; ui={nodes:{},panels:{},note:null}; }
  function init(){ window.RoadmapAnimations.register({animationId:ID, mount:mount, unmount:unmount}); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
