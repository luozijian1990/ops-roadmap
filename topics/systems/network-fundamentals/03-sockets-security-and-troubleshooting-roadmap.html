<script id="data" type="application/json">{"title": "计算机网络基础学习笔记 · 第三册：Socket、安全与排障实战", "intro": "", "parts": [{"title": "第三册 · Socket、安全与排障实战", "sections": [{"title": "Socket API 如何连接应用程序与协议栈", "content": "Socket 是应用访问操作系统网络协议栈的编程接口。应用通过文件描述符执行创建、绑定、监听、连接、收发和关闭等操作；操作系统负责 TCP 状态、IP 路由、邻居解析以及网卡队列。\n\n> **材料说明**：知识覆盖参考 Brian “Beej Jorgensen” Hall 的 *Beej's Guide to Network Concepts* v1.0.40。本文按运维与 SRE 学习路径进行原创重组，不是原书的逐章翻译；原作及其许可信息以 [官方页面](https://beej.us/guide/bgnet0/) 为准。\n\n```mermaid\nflowchart TB\n    APP[应用程序] --> FD[Socket 文件描述符]\n    FD --> KERNEL[内核协议栈]\n    KERNEL --> ROUTE[路由与邻居子系统]\n    ROUTE --> NIC[网卡]\n```\n\n创建 Socket 时最重要的三个参数是地址族、类型和协议：\n\n```python\nimport socket\n\ntcp4 = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\nudp6 = socket.socket(socket.AF_INET6, socket.SOCK_DGRAM)\n```\n\n`AF_INET` 与 `AF_INET6` 分别表示 IPv4 和 IPv6，`SOCK_STREAM` 通常对应 TCP 字节流，`SOCK_DGRAM` 通常对应 UDP 数据报。应用仍需设置超时、限制资源并处理所有系统调用可能返回的错误。\n\n#### Socket 生命周期\n\n```mermaid\nflowchart LR\n    CREATE[创建] --> CONFIG[设置选项]\n    CONFIG --> ENDPOINT{角色}\n    ENDPOINT -->|客户端| CONNECT[连接]\n    ENDPOINT -->|服务端| BIND[绑定]\n    BIND --> LISTEN[监听]\n    LISTEN --> ACCEPT[接受连接]\n    CONNECT --> IO[收发]\n    ACCEPT --> IO\n    IO --> SHUTDOWN[半关闭]\n    SHUTDOWN --> CLOSE[释放描述符]\n```\n\n每个调用都可能失败。`bind` 可能遇到地址占用或权限不足；`connect` 可能解析失败、超时或被拒绝；`recv` 可能超时、被信号中断或返回 EOF。\n\n#### 阻塞、超时与非阻塞\n\n| 模式 | 调用行为 | 适合场景 |\n| --- | --- | --- |\n| 阻塞 | 等到完成或错误 | 简单客户端、线程模型 |\n| 带超时 | 最长等待指定时间 | 外部依赖调用 |\n| 非阻塞 | 不能立即完成就返回 | 事件循环 |\n\n```python\nsock.settimeout(5.0)\nsock.setblocking(False)\n```\n\n后一次调用会覆盖前面的阻塞模式。生产代码应在接口层统一约定，避免某个辅助函数悄悄改变共享 Socket 状态。", "subs": ["Socket 生命周期", "阻塞、超时与非阻塞"]}, {"title": "TCP 客户端如何解析地址、建立连接并收发数据", "content": "客户端通常先解析服务名，再依次尝试返回的地址。`socket.create_connection` 会替我们完成常见的解析和连接步骤：\n\n```python\nimport socket\n\nwith socket.create_connection((\"example.com\", 80), timeout=5) as sock:\n    request = (\n        b\"GET / HTTP/1.1\\r\\n\"\n        b\"Host: example.com\\r\\n\"\n        b\"Connection: close\\r\\n\\r\\n\"\n    )\n    sock.sendall(request)\n    chunks = []\n    while True:\n        chunk = sock.recv(4096)\n        if not chunk:\n            break\n        chunks.append(chunk)\n\nresponse = b\"\".join(chunks)\nprint(response[:200].decode(\"iso-8859-1\"))\n```\n\n`sendall` 表示持续发送直到全部数据交给内核或发生错误；一次 `recv` 不保证拿到完整响应。返回空字节串表示对端已正常关闭发送方向，而不是“暂时没有数据”。\n\n生产客户端还要区分 DNS 失败、连接拒绝、连接超时、读取超时和协议错误，因为这些错误对应不同的重试与告警策略。\n\n#### 不依赖 create_connection 的完整流程\n\n`getaddrinfo` 可以返回多个 IPv4 或 IPv6 候选。客户端应依次尝试，而不是假设域名只对应一个地址。\n\n```python\nimport socket\n\ndef connect_any(host: str, port: int, timeout: float = 5):\n    errors = []\n    for family, socktype, proto, _, sockaddr in socket.getaddrinfo(\n        host, port, type=socket.SOCK_STREAM\n    ):\n        sock = socket.socket(family, socktype, proto)\n        sock.settimeout(timeout)\n        try:\n            sock.connect(sockaddr)\n            return sock\n        except OSError as exc:\n            errors.append((sockaddr, exc))\n            sock.close()\n    raise OSError(f\"all addresses failed: {errors}\")\n```\n\n每个失败候选都必须关闭，最终错误应保留尝试过的地址，方便区分单一地址故障与服务整体故障。\n\n#### 重试边界\n\n连接超时可以在有限次数内退避重试；连接拒绝通常表示目标明确拒绝，盲目高频重试只会放大负载。非幂等业务在收到响应前断线时，客户端无法仅凭 TCP 判断服务器是否已执行操作。", "subs": ["不依赖 create_connection 的完整流程", "重试边界"]}, {"title": "TCP 服务端如何绑定、监听并接受连接", "content": "TCP 服务端的基本流程是 `socket`、`bind`、`listen`、`accept`。监听 Socket 只负责接受连接，`accept` 返回的新 Socket 才负责与特定客户端通信。\n\n```python\nimport socket\n\nwith socket.socket(socket.AF_INET, socket.SOCK_STREAM) as server:\n    server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n    server.bind((\"127.0.0.1\", 9000))\n    server.listen(128)\n    while True:\n        conn, peer = server.accept()\n        with conn:\n            conn.settimeout(10)\n            data = conn.recv(4096)\n            conn.sendall(data)\n```\n\n绑定 `127.0.0.1` 只允许本机访问；绑定 `0.0.0.0` 会监听所有 IPv4 接口，并不代表防火墙已经放行。`listen` 的 backlog 与内核连接队列有关，不是最大并发连接数。\n\n示例是串行服务端，一个慢客户端会阻塞后续连接。实际服务可选择线程、进程、事件循环或异步 I/O，并设置连接数、读取长度和空闲时间限制。\n\n#### 监听 Socket 和连接 Socket\n\n| 对象 | 主要调用 | 生命周期 |\n| --- | --- | --- |\n| 监听 Socket | `bind`、`listen`、`accept` | 通常贯穿服务进程 |\n| 连接 Socket | `recv`、`send`、`shutdown` | 对应一个客户端会话 |\n\n`accept` 返回 `(connection, peer_address)`。关闭连接 Socket 不影响继续监听；误关闭监听 Socket 则无法接受新连接。\n\n#### 地址复用不是端口共享魔法\n\n`SO_REUSEADDR` 主要帮助服务重启时处理旧连接相关状态，不意味着任意两个进程都能安全监听相同端点。不同系统对 `SO_REUSEPORT` 的行为也不同，使用前必须理解负载分配和安全边界。\n\n服务启动后应从系统视角确认真实监听：\n\n```bash\nss -lntp '( sport = :9000 )'\nlsof -nP -iTCP:9000 -sTCP:LISTEN\n```", "subs": ["监听 Socket 和连接 Socket", "地址复用不是端口共享魔法"]}, {"title": "UDP Socket 如何收发独立数据报", "content": "UDP 服务端使用 `recvfrom` 同时获得数据和来源地址，回复时用 `sendto` 指定目标。每次读取对应一个数据报；接收缓冲区太小时，超出部分会被截断，而不是留给下次读取。\n\n```python\nimport socket\n\nwith socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:\n    sock.bind((\"127.0.0.1\", 9001))\n    while True:\n        data, peer = sock.recvfrom(2048)\n        sock.sendto(data.upper(), peer)\n```\n\nUDP 没有连接建立并不代表没有状态。服务器可能仍要按客户端维护会话、请求 ID、重放保护、速率限制和超时。应用也不应相信来源地址绝对真实，因为无连接协议更容易遭遇地址伪造。\n\n#### connected UDP\n\nUDP Socket 也可以调用 `connect`，但不会产生 TCP 握手。操作系统只是保存默认对端，使应用能用 `send` 和 `recv`，并过滤其他来源的数据报。\n\n```python\nwith socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:\n    sock.settimeout(2)\n    sock.connect((\"192.0.2.53\", 53))\n    sock.send(b\"query\")\n    reply = sock.recv(2048)\n```\n\n一个数据报要么作为整体交给接收调用，要么因缓冲区不足被截断。应用应为最大合法报文准备缓冲区，并在平台支持时检查截断标志。\n\n#### UDP 错误语义\n\n无响应可能是服务未回复、请求或响应丢失、防火墙丢弃，也可能是目标不存在。ICMP Port Unreachable 有时会被传回 Socket，但中间设备不保证发送或转发它。", "subs": ["connected UDP", "UDP 错误语义"]}, {"title": "select 如何管理可读、可写、监听与超时事件", "content": "阻塞式 `recv` 会让线程等待一个连接。`select` 可以同时观察多个文件描述符是否可读、可写或异常，从而用一个事件循环管理多个连接。\n\n```python\nimport selectors\nimport socket\n\nselector = selectors.DefaultSelector()\nserver = socket.socket()\nserver.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\nserver.bind((\"127.0.0.1\", 9002))\nserver.listen()\nserver.setblocking(False)\nselector.register(server, selectors.EVENT_READ, data=None)\n\nwhile True:\n    for key, events in selector.select(timeout=1):\n        if key.data is None:\n            conn, peer = server.accept()\n            conn.setblocking(False)\n            selector.register(conn, selectors.EVENT_READ, data=peer)\n        else:\n            conn = key.fileobj\n            data = conn.recv(4096)\n            if data:\n                conn.sendall(data)\n            else:\n                selector.unregister(conn)\n                conn.close()\n```\n\nPython 的 `selectors` 会选择平台合适的底层机制。事件驱动并不自动解决所有问题：非阻塞发送可能只写入部分数据，因此真实服务要维护每个连接的输入缓冲、输出缓冲和协议状态。\n\n#### 三类集合\n\n原始 `select` 接受可读、可写和异常集合。监听 Socket 可读表示有连接等待 `accept`；普通 Socket 可读表示有数据或 EOF；Socket 可写只说明当前发送缓冲区有空间，不说明业务请求成功。\n\n永远把所有连接放进可写集合会导致事件循环持续唤醒。只有输出缓冲区非空时才订阅写事件，发送完毕后立即取消。\n\n#### 超时驱动周期任务\n\n```python\nevents = selector.select(timeout=1.0)\nif not events:\n    expire_idle_connections()\n```\n\n超时可以驱动心跳、空闲连接清理和指标上报，但不要用大量线性扫描拖慢每次循环。连接多时应使用按到期时间组织的数据结构。", "subs": ["三类集合", "超时驱动周期任务"]}, {"title": "用 select 构建多客户端事件循环", "content": "每个连接需要独立状态，至少包含输入缓冲、输出缓冲、最后活动时间和协议解析阶段。\n\n```python\nfrom dataclasses import dataclass, field\n\n@dataclass\nclass ConnectionState:\n    input: bytearray = field(default_factory=bytearray)\n    output: bytearray = field(default_factory=bytearray)\n    closing: bool = False\n```\n\n#### 主循环职责\n\n1. 监听 Socket 可读时，循环接受到暂时无新连接。\n2. 连接可读时，把字节追加到该连接缓冲。\n3. 从缓冲中提取零个或多个完整消息。\n4. 把响应编码后追加到输出缓冲。\n5. 连接可写时尽量发送，并删除已发送前缀。\n6. 对端 EOF 后决定立即关闭还是发送完剩余响应再关闭。\n\n```mermaid\nstateDiagram-v2\n    [*] --> Reading\n    Reading --> Processing: 完整消息\n    Processing --> Writing: 产生响应\n    Writing --> Reading: 输出清空\n    Reading --> Closing: 收到 EOF\n    Writing --> Closing: 写入失败\n    Closing --> [*]\n```\n\n公平性很重要。单个连接一次产生大量事件时，应限制每轮处理量，让其他连接也有机会运行。", "subs": ["主循环职责"]}, {"title": "线程的启动、共享状态与执行顺序有什么风险", "content": "线程模型直观：主线程接受连接，再由工作线程处理客户端。但并发会引入共享状态竞争、线程泄漏、锁顺序、阻塞调用和无界资源消耗等问题。\n\n```mermaid\nflowchart LR\n    ACCEPT[接受连接] --> Q[有界任务队列]\n    Q --> W1[工作线程一]\n    Q --> W2[工作线程二]\n    Q --> W3[工作线程三]\n```\n\n建议使用有界线程池而不是每个连接无限创建线程，并为读写设置超时。共享字典、计数器和连接列表需要锁或消息传递保护；关闭服务时要停止接受新任务、等待在途任务并释放 Socket。\n\nPython 中 I/O 密集型服务可以受益于线程，但 CPU 密集工作仍受运行时和资源模型影响。选择线程、进程还是异步事件循环，应依据连接数、任务性质、隔离需求和团队维护能力。\n\n#### start 和 join 的职责\n\n`Thread` 构造函数只创建对象，`start` 才启动新执行流，`join` 让调用线程等待目标结束。直接调用线程的 target 函数不会产生并发。\n\n```python\nimport threading\nimport time\n\ndef runner(name, count):\n    for index in range(count):\n        print(name, index)\n        time.sleep(0.1)\n\nthreads = [\n    threading.Thread(target=runner, args=(f\"worker-{i}\", 3))\n    for i in range(3)\n]\nfor thread in threads:\n    thread.start()\nfor thread in threads:\n    thread.join()\n```\n\n输出顺序不确定，代码不能依赖“线程按创建顺序运行”。共享可变对象需要锁、队列或所有权约束；只读数据更容易安全共享。", "subs": ["start 和 join 的职责"]}, {"title": "daemon、join 与线程练习如何管理生命周期", "content": "进程退出时不会等待 daemon 线程完成，它们可能在清理、刷新文件或发送消息中途被终止。daemon 适合“主流程结束后无需保证完成”的辅助任务，不适合承载必须持久化的关键工作。\n\n```python\nstop = threading.Event()\n\ndef receiver(sock):\n    while not stop.is_set():\n        try:\n            data = sock.recv(4096)\n        except TimeoutError:\n            continue\n        if not data:\n            break\n\nthread = threading.Thread(target=receiver, args=(sock,), daemon=True)\nthread.start()\n\ntry:\n    run_user_interface()\nfinally:\n    stop.set()\n    sock.close()\n    thread.join(timeout=2)\n```\n\n#### 分段求和练习\n\n原文练习让每个线程计算一个整数范围，并把结果写入预先分配的独立槽位。因为每个线程只写自己的索引，可以避免多个线程同时修改同一值。\n\n```python\ndef range_sum(index, start, end, result):\n    result[index] = sum(range(start, end + 1))\n```\n\n主线程先启动全部线程，再逐个 join，最后汇总结果。进一步思考：逐个循环求和是 O(n)，公式 `n*(n+1)//2` 能把每段计算降为 O(1)，算法改进往往比增加线程更有效。\n\n#### 可控退出清单\n\n- 捕获主线程退出信号。\n- 停止接受新连接。\n- 通知工作线程停止。\n- 给阻塞 I/O 设置超时或关闭 Socket。\n- 等待有界时间。\n- 记录未完成任务并释放资源。", "subs": ["分段求和练习", "可控退出清单"]}, {"title": "Python 字符串、字符编码与网络字节如何转换", "content": "Socket 只发送 `bytes`，Python 文本使用 `str`。编码把字符转换成字节，解码把字节按约定还原为字符；双方编码不一致会产生乱码或解码错误。\n\n```python\ntext = \"网络 hello\"\nwire = text.encode(\"utf-8\")\nassert wire.decode(\"utf-8\") == text\n```\n\n#### 协议元数据和正文编码\n\nHTTP/1.1 的请求行和 Header 以字节定义，实践中常用 ISO-8859-1 做一对一解码以保留原始字节；正文编码则由 `Content-Type` 的 charset 或协议约定决定。\n\n```text\nContent-Type: text/plain; charset=utf-8\nContent-Length: 12\n```\n\n`Content-Length` 计算字节数，不是字符数：\n\n```python\nbody = \"你好\".encode(\"utf-8\")\nassert len(body) == 6\n```\n\n不要先按字符截断再假设字节长度不变。流式解码还要处理一个多字节字符被拆到两次 `recv` 的情况，可以使用增量解码器或等完整消息到齐再解码。", "subs": ["协议元数据和正文编码"]}, {"title": "用原生 Socket 编写最小 HTTP 客户端和服务端", "content": "HTTP/1.1 消息由起始行、Header、空行和可选 Body 组成，行结束符是 `\\r\\n`。下面的服务端只用于观察协议，不适合公网部署：\n\n```python\nfrom http import HTTPStatus\nimport socket\n\nbody = b\"hello network\\n\"\nresponse = (\n    f\"HTTP/1.1 {HTTPStatus.OK.value} OK\\r\\n\"\n    f\"Content-Type: text/plain; charset=utf-8\\r\\n\"\n    f\"Content-Length: {len(body)}\\r\\n\"\n    \"Connection: close\\r\\n\\r\\n\"\n).encode(\"ascii\") + body\n\nwith socket.socket() as server:\n    server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n    server.bind((\"127.0.0.1\", 8080))\n    server.listen()\n    conn, _ = server.accept()\n    with conn:\n        request = conn.recv(4096)\n        print(request.decode(\"iso-8859-1\"))\n        conn.sendall(response)\n```\n\n用 `curl -v http://127.0.0.1:8080/` 可以观察请求与响应。实验应重点确认空行边界、字节长度和连接关闭语义，而不是把一次 `recv` 当成完整 HTTP 解析器。\n\n#### 不使用高级 HTTP 库的学习目的\n\n原文限制 `create_connection`、`create_server` 和 urllib，是为了暴露 DNS、Socket 创建、循环接收和协议编码步骤。生产代码应优先使用成熟库，学习项目则应明确它只支持哪些 HTTP 子集。\n\n客户端命令行可以接收主机和可选端口：\n\n```bash\npython webclient.py example.com\npython webclient.py example.com 8080\n```\n\n服务端应循环 `accept`，而不是只处理一次连接。读取请求 Header 时要等到 `\\r\\n\\r\\n`，不能等待客户端关闭，因为客户端正等着响应，这会形成双方互等。\n\n#### 最小验证矩阵\n\n| 客户端 | 服务端 | 应观察到的结果 |\n| --- | --- | --- |\n| 自写客户端 | example.com | 打印状态行、Header 和 Body |\n| curl | 自写服务端 | 收到合法 200 响应 |\n| 浏览器 | 自写服务端 | 页面显示且可能附带 favicon 请求 |\n| 分块发送测试 | 自写服务端 | Header 跨 recv 仍能解析 |\n\n浏览器发起第二个连接不一定是程序错误，可能是请求 `/favicon.ico`。服务端日志应打印对端地址、方法和路径帮助判断。", "subs": ["不使用高级 HTTP 库的学习目的", "最小验证矩阵"]}, {"title": "如何解释 HTTP 重定向、客户端错误和服务端错误", "content": "状态码分组表达处理结果：2xx 成功，3xx 需要进一步动作，4xx 表示请求侧问题，5xx 表示服务端处理失败。\n\n| 状态 | 含义 | 客户端下一步 |\n| --- | --- | --- |\n| 301 | 资源永久迁移 | 读取 Location 并更新长期引用 |\n| 302 | 临时跳转 | 本次跟随 Location |\n| 400 | 请求格式错误 | 检查请求行、CRLF 和 Header |\n| 404 | 当前路径不存在 | 核对 Host 和 Path |\n| 501 | 方法或能力未实现 | 改用服务支持的方式 |\n| 500 | 服务端内部错误 | 结合请求 ID 查看服务日志 |\n\n```text\nHTTP/1.1 301 Moved Permanently\nLocation: https://www.example.com/\nContent-Length: 0\n\n```\n\n自动跟随重定向必须设置最大次数并防止环路。跨域或从 HTTPS 跳到 HTTP 时还要考虑凭据泄漏和降级风险。\n\n#### 常见格式错误\n\n- 行尾只发送 `\\n`，没有 `\\r\\n`。\n- Header 末尾缺少空行。\n- HTTP/1.1 请求缺少正确 Host。\n- Content-Length 使用字符数而不是字节数。\n- 声明长度与实际 Body 不一致。\n\n```bash\ncurl -v --max-redirs 0 http://example.com/\ncurl -v -L --max-redirs 5 http://example.com/\n```", "subs": ["常见格式错误"]}, {"title": "静态文件服务端如何解析请求、MIME 和 Content Length", "content": "静态文件服务大致经历：读取完整 Header、解析请求行、验证方法、规范化路径、确定 MIME 类型、读取文件、生成 `Content-Length` 并发送响应。\n\n```mermaid\nflowchart TD\n    REQ[读取请求头] --> PARSE[解析方法与路径]\n    PARSE --> SAFE[规范化并限制路径]\n    SAFE --> EXISTS{文件存在}\n    EXISTS -->|是| MIME[确定类型与长度]\n    MIME --> OK[返回 200]\n    EXISTS -->|否| NF[返回 404]\n```\n\n绝不能直接把 URL 路径拼到文件根目录，否则 `../`、编码变体和符号链接可能造成目录穿越。应先解码并规范化，再确认最终路径仍位于允许根目录内。\n\n成熟 HTTP 服务器还要处理请求大小、慢速客户端、重复 Header、分块传输、持久连接、条件请求和范围请求。学习项目的边界必须写清楚，不能把最小示例误当成生产实现。\n\n#### 请求行解析\n\n完整收到 Header 后，以 CRLF 分行，再把第一行拆成方法、目标和版本。任何字段缺失或数量异常都应返回 400，而不是抛出未处理异常。\n\n```python\nrequest_line = header_bytes.split(b\"\\r\\n\", 1)[0]\nmethod, target, version = request_line.decode(\"iso-8859-1\").split(\" \", 2)\nif method != \"GET\":\n    raise ValueError(\"unsupported method\")\n```\n\n#### MIME 和长度\n\n| 后缀 | Content-Type |\n| --- | --- |\n| `.txt` | `text/plain; charset=utf-8` |\n| `.html` | `text/html; charset=utf-8` |\n| `.jpg` | `image/jpeg` |\n| `.pdf` | `application/pdf` |\n| 未知 | `application/octet-stream` |\n\n```python\nimport mimetypes\n\ncontent_type, _ = mimetypes.guess_type(file_path.name)\ncontent_type = content_type or \"application/octet-stream\"\nbody = file_path.read_bytes()\ncontent_length = len(body)\n```\n\n文件必须以二进制读取，否则换行转换和字符编码可能让实际发送字节数与 Content-Length 不一致。", "subs": ["请求行解析", "MIME 和长度"]}, {"title": "如何限制文件路径、返回 404 并安全扩展服务端", "content": "简单实验可以只取路径最后一段，但更真实的实现需要允许根目录内的子路径，同时拒绝逃逸。\n\n```python\nfrom pathlib import Path\nfrom urllib.parse import unquote, urlsplit\n\nROOT = Path(\"public\").resolve()\n\ndef resolve_target(target: str) -> Path:\n    raw_path = unquote(urlsplit(target).path).lstrip(\"/\")\n    candidate = (ROOT / raw_path).resolve()\n    if candidate != ROOT and ROOT not in candidate.parents:\n        raise PermissionError(\"path escapes document root\")\n    return candidate\n```\n\n校验必须在 URL 解码和路径规范化之后进行，并考虑符号链接。把字符串中出现 `..` 直接拒绝既可能误判，也可能漏掉编码变体。\n\n#### 404 响应\n\n```text\nHTTP/1.1 404 Not Found\nContent-Type: text/plain; charset=utf-8\nContent-Length: 14\nConnection: close\n\n404 not found\n```\n\n长度要按真实 Body 字节重新计算。错误页面也不能暴露服务器绝对路径、堆栈和配置。\n\n#### 渐进扩展顺序\n\n1. 只支持 GET 和两个固定文件。\n2. 增加 MIME 映射和二进制文件。\n3. 增加受限子目录。\n4. 增加目录索引但转义文件名。\n5. 增加并发、超时和最大 Header。\n6. 为所有异常返回明确状态并记录请求 ID。\n\n每一步先写非法路径、缺失文件和半包测试，再增加能力。", "subs": ["404 响应", "渐进扩展顺序"]}, {"title": "如何正确处理偏移量、半包与多个消息", "content": "接收循环应把新字节追加到缓冲区，再反复解析其中所有完整消息，最后保留不完整尾部。解析函数最好返回“消息”和“剩余缓冲区”，避免把读取和协议解析耦合。\n\n```python\nimport struct\n\nMAX_FRAME = 1024 * 1024\n\ndef extract_frames(buffer: bytearray):\n    frames = []\n    while len(buffer) >= 4:\n        size = struct.unpack(\"!I\", buffer[:4])[0]\n        if size > MAX_FRAME:\n            raise ValueError(\"frame too large\")\n        if len(buffer) < 4 + size:\n            break\n        frames.append(bytes(buffer[4:4 + size]))\n        del buffer[:4 + size]\n    return frames\n```\n\n测试至少覆盖：只有部分长度头、长度头完整但 Body 不完整、一次收到多帧、消息刚好到上限、长度超过上限、对端在半帧时关闭。", "subs": []}, {"title": "用 Atomic Time 实验解码固定长度二进制协议", "content": "固定长度协议适合用来练习“精确读取 N 字节”和网络字节序。读取函数必须循环，因为一次 `recv(n)` 仍可能少于 n：\n\n```python\ndef recv_exact(sock, size: int) -> bytes:\n    chunks = []\n    remaining = size\n    while remaining:\n        chunk = sock.recv(remaining)\n        if not chunk:\n            raise EOFError(\"peer closed before full message\")\n        chunks.append(chunk)\n        remaining -= len(chunk)\n    return b\"\".join(chunks)\n```\n\n解码时要明确字段宽度、符号、字节序和时间纪元。例如一个 4 字节无符号大端整数可以用 `struct.unpack(\"!I\", data)`。协议时间与 Unix 时间可能使用不同纪元，换算前应查明定义，而不是仅凭数值猜测。\n\n#### 实验流程\n\n1. 连接指定时间服务端口。\n2. 精确读取协议规定的 4 字节。\n3. 按无符号网络字节序转成整数。\n4. 根据协议纪元换算为 Unix 时间。\n5. 同时打印远端时间与本机时间。\n6. 计算差值并设置合理容差。\n\n```python\nimport struct\nimport time\n\nraw = recv_exact(sock, 4)\nremote_seconds = struct.unpack(\"!I\", raw)[0]\nunix_seconds = remote_seconds - EPOCH_DELTA\nprint(\"remote\", unix_seconds)\nprint(\"local \", int(time.time()))\n```\n\n固定长度协议也可能被提前 EOF 截断。把不足 4 字节用零补齐会制造看似合法但完全错误的时间，应直接报错。\n\n#### 纪元与溢出\n\n不同时间协议可能从 1900、1970 或其他日期计数。32 位秒数还会回绕，长期运行系统必须明确时代编号或升级字段宽度。", "subs": ["实验流程", "纪元与溢出"]}, {"title": "用 Word Server 实验实现长度前缀和流式拆包", "content": "Word Server 把每个单词封装为消息，训练从 TCP 字节流中连续提取包。可以设计两字节大端长度，后接 UTF-8 单词字节。\n\n```text\n00 05 68 65 6c 6c 6f\n长度 5  载荷 hello\n```\n\n```python\nimport struct\n\ndef encode_word(word: str) -> bytes:\n    payload = word.encode(\"utf-8\")\n    if len(payload) > 65535:\n        raise ValueError(\"word too long\")\n    return struct.pack(\"!H\", len(payload)) + payload\n\ndef extract_word(buffer: bytearray):\n    if len(buffer) < 2:\n        return None\n    size = struct.unpack(\"!H\", buffer[:2])[0]\n    if len(buffer) < 2 + size:\n        return None\n    payload = bytes(buffer[2:2 + size])\n    del buffer[:2 + size]\n    return payload.decode(\"utf-8\")\n```\n\n测试时把同一字节流按每 1 字节、随机长度和一次全部三种方式喂给解析器，结果必须一致。还要测试空单词、非法 UTF-8、超长声明和半包 EOF。", "subs": []}, {"title": "JSON 与 Python 对象如何编码、解码和验证", "content": "JSON 解决消息内容的结构表达，不解决 TCP 消息边界。常见做法是在 JSON 前加长度，或规定每行一个 JSON 对象。\n\n```python\nimport json\nimport struct\n\ndef encode_json(message: dict) -> bytes:\n    payload = json.dumps(\n        message, ensure_ascii=False, separators=(\",\", \":\")\n    ).encode(\"utf-8\")\n    return struct.pack(\"!I\", len(payload)) + payload\n```\n\n应用还应定义消息类型、必填字段、版本和错误响应，例如：\n\n```json\n{\n  \"version\": 1,\n  \"type\": \"chat\",\n  \"request_id\": \"a42\",\n  \"body\": {\"text\": \"你好\"}\n}\n```\n\n解析成功不代表消息可信。必须校验类型、长度、枚举值和权限，拒绝未知或超限输入。\n\n#### JSON 和 Python 对象并不相同\n\n| JSON | Python 常见对应 |\n| --- | --- |\n| object | dict |\n| array | list |\n| string | str |\n| number | int 或 float |\n| true 和 false | True 和 False |\n| null | None |\n\nJSON 要求字符串和键使用双引号，不能发送 Python dict 的 `repr`。数字还要考虑精度和范围，不同语言未必以相同类型解释大整数。\n\n```python\ndecoded = json.loads(payload.decode(\"utf-8\"))\nif not isinstance(decoded, dict):\n    raise ValueError(\"message must be an object\")\nif decoded.get(\"version\") != 1:\n    raise ValueError(\"unsupported version\")\nif decoded.get(\"type\") not in {\"hello\", \"chat\", \"join\", \"leave\"}:\n    raise ValueError(\"unknown message type\")\n```\n\nPretty Print 适合日志和调试，线上帧可使用紧凑分隔符。日志仍应限制长度并脱敏，不能把令牌和私人消息完整打印。", "subs": ["JSON 和 Python 对象并不相同"]}, {"title": "多用户聊天室的客户端和服务端如何协作", "content": "聊天室是综合练习：服务端管理多个连接，客户端同时处理终端输入与服务器消息，协议区分加入、聊天、离开和错误事件。\n\n```mermaid\nflowchart TB\n    C1[客户端一] --> S[聊天服务端]\n    C2[客户端二] --> S\n    C3[客户端三] --> S\n    S --> USERS[连接与用户映射]\n    S --> BROADCAST[广播队列]\n```\n\n服务端状态至少包括连接、用户名、输入缓冲和输出缓冲。用户名不能只由客户端声明后直接信任；广播时要处理慢客户端，不能让一个写不动的连接阻塞所有用户。\n\n可按以下顺序增量实现：单连接回显、长度前缀、多个连接、用户注册、消息广播、离线清理、心跳与空闲超时。每一步都保留协议测试，避免最后才调试所有层次。\n\n#### 服务端状态\n\n服务端以已连接 Socket 集合作为在线用户来源，并维护两个方向的映射：Socket 到昵称、昵称到 Socket。昵称注册成功之前，不接受普通聊天消息。\n\n```python\nclients = set()\nnick_by_socket = {}\nsocket_by_nick = {}\nbuffers = {}\n```\n\n断线时必须原子地清理这些结构，并向其余用户广播离开事件。重复昵称、注册前发消息和未知消息类型都应返回协议错误或主动断开。\n\n#### 客户端双重阻塞\n\n客户端一边等待用户输入，一边等待服务端消息。可以由主线程处理 TUI，daemon 接收线程只负责读取网络并通过线程安全队列传递事件。多个线程直接操作终端容易破坏光标和输入状态。\n\n特殊命令 `/q` 应在本地触发退出，不发送普通聊天消息。退出流程要关闭 Socket，使接收线程从阻塞读取中醒来。", "subs": ["服务端状态", "客户端双重阻塞"]}, {"title": "Hello、Chat、Join 与 Leave 消息如何设计", "content": "原文协议使用两字节大端长度和 UTF-8 JSON 载荷。长度只覆盖 JSON 字节，不包含两字节头。\n\n```text\n2 字节 payload length\nN 字节 UTF-8 JSON payload\n```\n\n四类基础消息：\n\n```json\n{\"type\":\"hello\",\"nick\":\"alice\"}\n```\n\n```json\n{\"type\":\"chat\",\"message\":\"hello\"}\n```\n\n```json\n{\"type\":\"join\",\"nick\":\"bob\"}\n```\n\n```json\n{\"type\":\"leave\",\"nick\":\"bob\"}\n```\n\n服务端广播 chat 时增加发送者昵称。客户端不应自己声明发送者，因为服务端已经把连接与昵称绑定。\n\n#### 状态约束\n\n```mermaid\nstateDiagram-v2\n    [*] --> Connected\n    Connected --> Registered: 收到合法 hello\n    Connected --> Closed: 非 hello 或昵称冲突\n    Registered --> Registered: chat\n    Registered --> Closed: EOF 或协议错误\n    Closed --> [*]\n```\n\n字段验证包括昵称和消息长度、字符范围、必填键、未知键策略及版本。广播前仍要进行服务端授权和速率限制。", "subs": ["状态约束"]}, {"title": "每连接缓冲区、并发接收与断线清理如何实现", "content": "TCP 接收缓冲必须按连接隔离。把所有客户端字节追加到同一个全局缓冲会混合不同会话，造成数据泄漏和协议损坏。\n\n```python\nbuffers = {sock: bytearray() for sock in clients}\n\ndef on_readable(sock):\n    chunk = sock.recv(4096)\n    if not chunk:\n        disconnect(sock)\n        return\n    buffers[sock].extend(chunk)\n    while packet := extract_packet(buffers[sock]):\n        handle_packet(sock, packet)\n```\n\n实际 Python 版本要避免把合法空载荷与“没有完整包”混淆，最好返回明确哨兵。\n\n#### 慢客户端治理\n\n广播时不能对每个 Socket 直接阻塞 `sendall`。应把编码后的同一帧追加到各自输出缓冲，由写事件逐步发送，并限制单连接积压上限。\n\n| 风险 | 控制手段 |\n| --- | --- |\n| 不读消息的客户端 | 输出缓冲上限、超时断开 |\n| 高频发言 | 令牌桶限速 |\n| 超长消息 | 解码前限制帧长 |\n| 昵称抢占 | 原子注册、唯一索引 |\n| 断线清理遗漏 | 单一 disconnect 函数 |\n\n扩展直接消息、房间和在线列表时，应新增消息类型，而不是在 chat 文本里塞特殊字符串；协议结构化后才容易验证和演进。", "subs": ["慢客户端治理"]}, {"title": "Wireshark 如何逐字段验证 ARP 请求与响应", "content": "先清理或等待邻居缓存失效，再向同网段目标发送流量，才能稳定观察 ARP。Linux 可结合命令行抓包：\n\n```bash\nip neigh show\nsudo tcpdump -ni eth0 arp\nping -c 1 192.168.10.1\n```\n\n在 Wireshark 中使用显示过滤器 `arp`，检查 Request 是否广播、Sender IP/MAC 是否符合发送方、Reply 是否包含目标 MAC。若只有 Request 没有 Reply，继续检查目标是否在线、VLAN 是否一致、接口是否启用及二层安全策略。\n\n抓包只看到观察点经过的流量。交换网络中，在普通主机上不能期待看到其他端口的所有单播包；必要时需要交换机端口镜像、主机本地抓包或链路两端同时抓包。\n\n#### 字段核对表\n\n| 检查项 | Request | Reply |\n| --- | --- | --- |\n| Ethernet Destination | 广播 MAC | 请求方 MAC |\n| Operation | request 1 | reply 2 |\n| Sender MAC/IP | 请求方 | 回应方 |\n| Target MAC | 通常全零 | 请求方 MAC |\n| Target IP | 被查询地址 | 请求方地址 |\n\n先记录本机邻居表，再抓包，再次查看邻居表，可以把线上的回应与内核缓存变化对应起来。\n\n```bash\nip neigh show dev eth0\nsudo tcpdump -eni eth0 -c 10 arp\n```\n\n若收到 Reply 但邻居仍 FAILED，应检查响应目标、重复地址、接口命名空间以及安全策略，而不是只重复发送 arping。", "subs": ["字段核对表"]}, {"title": "TCP 与 UDP 端口扫描能发现什么", "content": "TCP connect 扫描尝试完成操作系统的连接过程：成功通常表示端口有服务且路径允许；立即收到 RST 通常表示端口关闭；超时可能表示丢包、防火墙丢弃、目标不可达或返回路径异常。\n\n```python\nimport socket\n\ndef probe(host: str, port: int) -> str:\n    try:\n        with socket.create_connection((host, port), timeout=0.5):\n            return \"open\"\n    except ConnectionRefusedError:\n        return \"closed\"\n    except (TimeoutError, OSError):\n        return \"unknown\"\n```\n\nUDP 扫描更难判断：没有响应既可能表示端口开放，也可能是包被丢弃。扫描结果只能描述特定来源、时间和协议下的可达性，不能证明服务安全或所有路径都一致。\n\n只扫描自己拥有或明确获授权的系统，并控制速率，避免造成告警或负载影响。\n\n#### TCP 与 UDP 的结果语义\n\n| 探测结果 | TCP Connect | UDP |\n| --- | --- | --- |\n| 收到应用响应 | open | open |\n| 收到 RST | closed | 不适用 |\n| ICMP Port Unreachable | 路径相关 | 通常 closed |\n| 完全无响应 | filtered 或超时 | open 或 filtered |\n\nUDP 扫描若只发送空数据，许多开放服务也不会响应。更可靠的方法是发送目标协议能理解的最小请求，例如 DNS 查询，但仍要遵守授权范围。\n\n#### 有界并发扫描器\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor\n\nports = range(1, 1025)\nwith ThreadPoolExecutor(max_workers=32) as pool:\n    results = dict(zip(ports, pool.map(lambda p: probe(\"192.0.2.10\", p), ports)))\n```\n\n并发数、每次超时和目标数量共同决定扫描压力。记录扫描源、时间、参数和授权单，结果才能用于审计和复现。", "subs": ["TCP 与 UDP 的结果语义", "有界并发扫描器"]}, {"title": "防火墙如何与连接状态和 NAT 协同过滤流量", "content": "无状态防火墙逐包匹配地址、协议和端口；有状态防火墙还跟踪连接，能区分新建连接和已建立连接的返回流量。主机防火墙保护单机，网络防火墙保护多个网段，云安全组则在虚拟网络边界实施规则。\n\n```mermaid\nflowchart TD\n    PKT[数据包] --> ZONE[识别方向与区域]\n    ZONE --> STATE[检查连接状态]\n    STATE --> RULE[按顺序匹配规则]\n    RULE --> ALLOW[允许]\n    RULE --> REJECT[拒绝并响应]\n    RULE --> DROP[静默丢弃]\n```\n\n排查前先只读查看现状：\n\n```bash\nnft list ruleset\niptables-save\nss -lntup\n```\n\n“服务已监听”与“远端可访问”是两回事。还要检查监听地址、主机防火墙、云安全组、网络 ACL、负载均衡健康检查和返回路径。修改规则前应准备带外访问或自动回滚，防止把自己锁在远端主机之外。\n\n#### ACCEPT、REJECT 与 DROP\n\nACCEPT 允许继续处理；REJECT 丢弃并向发送方返回错误；DROP 静默丢弃。REJECT 让合法客户端更快失败，DROP 减少部分信息暴露，但会表现为超时并增加排障时间。\n\n#### NAT 与过滤顺序\n\n数据包可能先做目的地址转换，再进入某条过滤链。规则匹配的是转换前还是转换后地址，取决于具体 Hook 和平台。排查时查看计数器和完整规则集，不凭规则文件顺序猜测。\n\n```bash\nnft monitor trace\nconntrack -L\n```\n\nTrace 可能产生大量输出，只应在受控条件下加精确过滤。远程修改规则要先建立回滚任务，并保持现有管理会话。\n\n#### 最小权限策略\n\n- 默认拒绝未声明入站。\n- 只开放实际监听端口。\n- 限定来源网段而非全网。\n- 允许已建立连接的返回流量。\n- 记录关键拒绝但做速率限制。\n- 定期清理临时规则和失效对象。", "subs": ["ACCEPT、REJECT 与 DROP", "NAT 与过滤顺序", "最小权限策略"]}, {"title": "缓冲区越界和资源耗尽为什么来自不可信输入", "content": "网络输入由不受信任的对端控制。攻击者可以发送超长字段、非法编码、重复消息、极慢数据、恶意路径、注入字符串或精心构造的二进制长度。\n\n安全解析的基本原则：\n\n- 在分配内存前校验长度上限。\n- 设置连接、读取和完整请求超时。\n- 使用参数化 API，不拼接 Shell 或 SQL 命令。\n- 对路径做规范化并限制根目录。\n- 按协议状态机拒绝乱序或未知消息。\n- 认证之后仍要做授权。\n- 错误信息不泄露密钥、路径和内部栈信息。\n\n#### 内存安全和逻辑安全\n\nC 等语言中，向固定数组写入超长输入可能覆盖相邻内存，导致崩溃或代码执行。内存安全语言减少这类直接覆盖，却仍可能遭遇超大长度分配、递归嵌套、压缩炸弹和无界队列。\n\n```python\nMAX_HEADER = 16 * 1024\nMAX_FRAME = 1024 * 1024\n\nif declared_length > MAX_FRAME:\n    raise ProtocolError(\"frame too large\")\nif len(header_buffer) > MAX_HEADER:\n    raise ProtocolError(\"header too large\")\n```\n\n限制必须在分配或读取全部声明长度之前检查。只在收到完整消息后检查，攻击者已经消耗了目标资源。\n\n#### 慢速资源耗尽\n\n攻击者可以建立大量连接，每隔一段时间只发送一个字节，让服务一直保留状态。应同时限制：\n\n| 资源 | 控制方式 |\n| --- | --- |\n| Header 读取时间 | 总截止时间 |\n| 连接空闲 | Idle Timeout |\n| 单 IP 连接数 | 来源配额 |\n| 全局连接数 | 有界容量和背压 |\n| 输入与输出缓冲 | 每连接上限 |\n| 解析复杂度 | 深度和元素数量上限 |\n\n超时最好使用单调时钟计算截止时间，避免系统时间跳变延长限制。", "subs": ["内存安全和逻辑安全", "慢速资源耗尽"]}, {"title": "命令注入、SQL 注入与 XSS 应该如何防御", "content": "注入的共同根因是把不可信数据拼进另一种语言，让数据被解释成指令。不同解释器需要不同的结构化 API，不能依赖一个通用“过滤特殊字符”函数。\n\n#### 命令注入\n\n```python\nimport ipaddress\nimport subprocess\n\ntarget = str(ipaddress.ip_address(user_input))\nresult = subprocess.run(\n    [\"ping\", \"-c\", \"1\", target],\n    check=False,\n    capture_output=True,\n    text=True,\n    timeout=3,\n)\n```\n\n参数列表避免 Shell 重新解释分号、管道和重定向。仍需验证允许的目标，并以低权限身份运行。\n\n#### SQL 注入\n\n```python\ncursor.execute(\n    \"SELECT id, name FROM users WHERE name = ?\",\n    (user_name,),\n)\n```\n\n使用驱动参数绑定，不把引号转义当成完整防御。数据库账号还应只拥有业务所需权限。\n\n#### XSS\n\n服务端把用户文本输出到 HTML 时必须按 HTML 上下文转义；写入 JavaScript、URL 或属性时需要对应上下文的编码。Content Security Policy 可以降低影响，但不能替代正确转义。\n\n模板应默认转义，确需输出可信 HTML 的接口必须显式标记并经过严格清洗。\n\n#### 防御矩阵\n\n| 风险 | 首选防御 |\n| --- | --- |\n| Shell | 避免 Shell、参数数组、白名单 |\n| SQL | 参数化查询、最小权限 |\n| HTML | 上下文输出编码、模板自动转义 |\n| 路径 | 规范化后限制根目录 |\n| JSON | Schema、类型和长度验证 |\n\n安全是协议设计和资源治理的一部分，不能等功能完成后再补。", "subs": ["命令注入", "SQL 注入", "XSS", "防御矩阵"]}, {"title": "用分层思路定位连接失败与请求异常", "content": "排障应从明确现象开始：哪个客户端、访问哪个名称和端口、何时开始、稳定还是间歇、具体错误和超时时间是什么。然后沿数据路径逐层收集证据。\n\n| 层次 | 核心问题 | 常用检查 |\n| --- | --- | --- |\n| 名称 | 解析到什么地址 | `dig`、`getent hosts` |\n| 本机配置 | 地址和接口是否正确 | `ip addr`、`ip link` |\n| 路由 | 选择哪个出口和源地址 | `ip route get` |\n| 邻居 | 下一跳 MAC 是否可达 | `ip neigh` |\n| 传输 | SYN、ACK、RST 在哪里 | `ss`、`tcpdump` |\n| 防火墙 | 哪一层允许或丢弃 | `nft list ruleset` |\n| 应用 | 请求格式与服务日志 | `curl -v`、应用日志 |\n\n```mermaid\nflowchart TD\n    START[请求失败] --> DNS{名称解析正确}\n    DNS -->|否| FIXDNS[检查 DNS]\n    DNS -->|是| ROUTE{路由和邻居正常}\n    ROUTE -->|否| FIXNET[检查地址路由二层]\n    ROUTE -->|是| TCP{端口可建立连接}\n    TCP -->|否| FIXTCP[检查监听防火墙回程]\n    TCP -->|是| APP{应用响应正确}\n    APP -->|否| FIXAPP[检查协议日志依赖]\n    APP -->|是| DONE[验证恢复]\n```\n\n避免一开始就重启服务或清空规则，因为这些动作会破坏现场，还可能掩盖根因。\n\n#### 从错误文本建立假设\n\n| 客户端错误 | 优先假设 | 下一项证据 |\n| --- | --- | --- |\n| Name or service not known | DNS 或输入错误 | `getent`、`dig` |\n| No route to host | 路由或本机策略 | `ip route get` |\n| Connection refused | 端口未监听或显式拒绝 | `ss`、SYN/RST 抓包 |\n| Connection timed out | 静默丢弃或回程失败 | 双端抓包 |\n| TLS alert | 证书、协议或 SNI | `openssl s_client` |\n| HTTP 502 | 代理到上游失败 | 代理和上游日志 |\n\n错误信息不是根因，但能缩小首个检查范围。必须记录目标地址和解析结果，因为同一域名可能命中不同实例。\n\n#### 双端抓包定位边界\n\n客户端有 SYN、服务端无 SYN，问题在两者之间；服务端收到 SYN 并回复 SYN ACK、客户端没收到，重点查回程；握手完整但应用无请求，检查 TLS 或客户端；服务端发出响应而客户端没有，继续查路径和重传。\n\n```bash\nsudo tcpdump -ni any -w client.pcap 'host 203.0.113.20 and port 443'\nsudo tcpdump -ni any -w server.pcap 'host 192.0.2.10 and port 443'\n```\n\n抓包包含业务数据和凭据风险，应限制时长、过滤范围、访问权限与保存周期。", "subs": ["从错误文本建立假设", "双端抓包定位边界"]}, {"title": "建立一套从地址到应用的网络排障清单", "content": "下面是一套可重复执行的只读优先检查顺序：\n\n```bash\n# 1. 接口与地址\nip -br link\nip -br addr\n\n# 2. 路由决策\nip route get 203.0.113.10\n\n# 3. 名称解析\ngetent ahosts example.com\ndig example.com A\n\n# 4. 邻居状态\nip neigh show\n\n# 5. 本机监听与连接\nss -lntup\nss -nt state established\n\n# 6. 应用层探测\ncurl -v --connect-timeout 3 https://example.com/\n\n# 7. 必要时抓包\nsudo tcpdump -ni any 'host 203.0.113.10 and tcp port 443'\n```\n\n每一步记录命令、时间、观察点和结果。客户端抓不到响应时，在服务端同步抓包可以快速判断请求是否抵达；服务端收到请求并发出响应，但客户端没收到，则重点检查返回路由、中间防火墙和 NAT 状态。\n\n修复后要复现原始请求，并观察一段时间，而不是只用替代命令证明“似乎恢复”。最终记录根因、触发条件、修复、验证和预防措施，才能把一次排障变成可复用的运维知识。\n\n#### 证据记录模板\n\n```text\n现象：哪个客户端在什么时间访问哪个名称和端口失败\n影响：失败比例、区域、用户和持续时间\n变更：故障前后的发布、网络和证书变更\n证据：DNS、路由、邻居、握手、应用日志和指标\n根因：哪一个机制在什么条件下失效\n修复：采取了什么最小改动\n验证：原始请求如何恢复，观察了多久\n预防：监控、测试、容量或流程如何改进\n```\n\n#### 常用观察点的限制\n\n- `ping` 使用 ICMP，不能代替目标 TCP 端口测试。\n- `telnet` 或 `nc` 建连成功，只证明四层可达。\n- `curl` 经过代理环境变量时，路径可能与应用不同。\n- 主机抓包可能受校验和和分段卸载影响。\n- 负载均衡健康检查成功，不代表每个业务路径正常。\n- 单次成功不能排除间歇性丢包和实例差异。\n\n#### 修复后反证\n\n除了证明成功，还应撤销临时绕过、测试失败路径是否恢复告警、确认没有扩大访问范围，并比较修复前后重传、延迟、错误率和连接状态。", "subs": ["证据记录模板", "常用观察点的限制", "修复后反证"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
