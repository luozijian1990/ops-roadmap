<style>
  :root{

    .drawer-resizer{display:none}
  }
</style>

<script id="data" type="application/json">{"title": "计算机网络基础学习笔记 · 第一册：网络模型、地址与子网", "intro": "", "parts": [{"title": "第一册 · 网络模型、地址与子网", "sections": [{"title": "从数据交换理解计算机网络", "content": "计算机网络要解决的核心问题，是让两台或多台设备交换任意字节。围绕这个目标，网络必须回答四个问题：通信双方是谁、数据如何到达、途中是否损坏、接收方如何理解这些字节。本册从这些问题出发，逐步建立分层、寻址、封装和局域网通信的基础模型。\n\n> **材料说明**：知识覆盖参考 Brian “Beej Jorgensen” Hall 的 *Beej's Guide to Network Concepts* v1.0.40。本文按运维与 SRE 学习路径进行原创重组，不是原书的逐章翻译；原作及其许可信息以 [官方页面](https://beej.us/guide/bgnet0/) 为准。\n\n电路交换会先为一次通信建立相对固定的通道，传统电话网络是典型例子。分组交换则把数据拆成多个分组，每个分组与其他流量共享链路。互联网主要采用分组交换，因此能高效复用带宽，但也要面对延迟变化、乱序、丢包和拥塞。\n\n```mermaid\nflowchart LR\n    DATA[应用数据] --> SPLIT[拆成多个分组]\n    SPLIT --> R1[路由节点 A]\n    SPLIT --> R2[路由节点 B]\n    R1 --> DEST[目标主机]\n    R2 --> DEST\n    DEST --> JOIN[按协议还原数据]\n```\n\n| 问题 | 网络中的解决机制 | 常见例子 |\n| --- | --- | --- |\n| 设备身份 | 地址 | IPv4、IPv6、MAC |\n| 进程身份 | 端口 | TCP 443、UDP 53 |\n| 路径选择 | 路由 | 路由表、默认网关 |\n| 数据完整性 | 校验与重传 | 校验和、TCP 重传 |\n| 数据含义 | 应用协议 | HTTP、DNS、SSH |\n\n排查网络故障时，也可以把这四个问题倒过来问：地址是否正确、路径是否可达、传输是否完整、应用协议是否符合预期。\n\n#### 分组交换带来的工程约束\n\n不同分组可以经过不同路径，排队时间也会变化。发送端看到的连续写入，到达接收端之前可能经历拆分、排队、重传与重新排序。\n\n| 现象 | 直接原因 | 上层通常如何处理 |\n| --- | --- | --- |\n| 延迟 | 传播、处理、排队、序列化 | 超时和缓存 |\n| 抖动 | 每个包的排队时间不同 | 播放缓冲 |\n| 丢包 | 拥塞、误码、策略丢弃 | 重传或容错 |\n| 乱序 | 多路径或重传 | 序列号排序 |\n| 重复 | ACK 丢失后重传 | 去重 |\n\n吞吐量描述单位时间传输了多少数据，延迟描述一次交互要等待多久。大带宽链路仍可能具有高延迟，低延迟链路也可能很快耗尽带宽。\n\n#### 计算带宽时延积\n\n带宽时延积表示链路上同时“在途”的数据量。100 Mbit/s、往返时延 80 ms 的路径大约有：\n\n```text\n100000000 bit/s × 0.08 s = 8000000 bit\n8000000 bit ÷ 8 = 1000000 byte\n```\n\n若可靠传输窗口远小于约 1 MB，就可能无法填满这条路径。这解释了为什么跨地域传输不仅要看带宽，还要看 RTT 和窗口。\n\n#### 自测\n\n1. 为什么分组交换不承诺每个包走同一路径？\n2. 丢包和乱序应由哪一层处理，取决于什么？\n3. 带宽翻倍但 RTT 不变时，单次请求延迟一定减半吗？", "subs": ["分组交换带来的工程约束", "计算带宽时延积", "自测"]}, {"title": "客户端、服务端、协议与网络操作系统", "content": "客户端和服务端描述的是一次通信中的角色，不一定对应固定的设备类型。客户端主动发起请求，服务端在已知地址和端口上等待请求。同一个程序既可以是服务端，也可以在调用其他服务时充当客户端。\n\n协议是通信双方共同遵守的规则，至少要约定消息格式、字段含义、交互顺序和异常处理。例如 HTTP 约定请求行、Header 和 Body 的组织方式，TCP 则约定如何建立可靠连接。没有协议，即使字节已经到达，接收方也无法可靠解释。\n\n操作系统负责把应用的读写请求连接到底层协议栈和网卡：\n\n```mermaid\nflowchart TB\n    APP[用户态应用] --> API[Socket API]\n    API --> TRANS[传输层 TCP 或 UDP]\n    TRANS --> IP[网际层 IP]\n    IP --> LINK[链路层 Ethernet 或 WiFi]\n    LINK --> NIC[网卡与物理介质]\n```\n\n有线和无线网络在物理介质、接入方式和误码特征上不同，但上层通常仍使用相同的 IP、TCP、UDP 和应用协议。这种隔离正是分层设计带来的价值。\n\n#### 角色不等于设备\n\n浏览器访问网站时是客户端，但它也可能在本机开放调试端口成为服务端。反向代理对外是服务端，对上游又是客户端。判断角色要看某次连接由谁主动发起、谁在已知端点等待。\n\n| 架构 | 特征 | 运维关注点 |\n| --- | --- | --- |\n| 客户端与服务端 | 服务入口相对稳定 | 容量、发现、负载均衡 |\n| 对等网络 | 节点可同时请求和提供服务 | 节点发现、NAT 穿越 |\n| 发布订阅 | 生产者与消费者解耦 | Broker、积压、投递语义 |\n\n协议可以是公开标准，也可以是组织内部约定。一个可维护协议至少应明确版本、字段、边界、状态转换、超时、错误码和兼容策略。\n\n#### 有线和无线的差异\n\n无线终端共享频谱，信号强度、干扰、漫游和省电机制会显著影响时延；交换式有线链路通常更稳定。看到 TCP 重传时，仍需确认是无线误码、交换链路丢包还是路径拥塞。\n\n```bash\nip -s link\nethtool eth0 2>/dev/null\niw dev 2>/dev/null\n```\n\n这些命令分别观察接口计数、Ethernet 链路属性和无线接口，但不同平台与驱动暴露的信息并不相同。", "subs": ["角色不等于设备", "有线和无线的差异"]}, {"title": "分层为什么是理解网络的第一把钥匙", "content": "分层把复杂通信拆成职责明确的模块。每一层只依赖下层提供的服务，并向上层暴露稳定接口。应用无需知道信号如何在网线中传播，路由器也不需要理解 HTTP 页面内容。\n\n发送端从上向下逐层添加控制信息，这个过程叫封装；接收端从下向上逐层移除并解释控制信息，这个过程叫解封装。\n\n```mermaid\nflowchart TB\n    A1[应用数据] --> A2[TCP 段]\n    A2 --> A3[IP 数据包]\n    A3 --> A4[Ethernet 帧]\n    A4 --> WIRE[链路传输]\n    WIRE --> B4[Ethernet 帧]\n    B4 --> B3[IP 数据包]\n    B3 --> B2[TCP 段]\n    B2 --> B1[应用数据]\n```\n\n分层排障的基本方法是确认故障止于哪一层。例如 `ping` 成功但 HTTPS 失败，通常说明 IP 路径基本可达，应继续检查 TCP 端口、TLS 或 HTTP，而不是立即怀疑网线。\n\n#### 每层只解释自己的头部\n\n发送端应用交给 TCP 的只是字节；TCP 增加端口和序列信息；IP 增加端到端地址；Ethernet 增加当前链路的 MAC。中间路由器通常只需要解释链路层和网络层，不会解析应用正文。\n\n| 观察点 | 可见的典型变化 | 通常保持不变 |\n| --- | --- | --- |\n| 同一二层交换域 | 交换端口 | IP 与 MAC |\n| 经过路由器 | 源/目的 MAC、TTL | 端到端 IP、端口 |\n| 经过 NAT | 地址或端口、校验和 | 应用语义 |\n| 经过反向代理 | 新连接的全部四元组 | 业务请求内容 |\n\n“透明”只表示对某层看起来没有变化，不代表设备什么都没做。例如交换机对 IP 层透明，却仍会学习 MAC、实施 VLAN 和丢弃策略。\n\n#### 用抓包验证封装\n\n```bash\nsudo tcpdump -ni any -e -vv 'icmp or tcp port 443'\n```\n\n`-e` 显示链路层头，`-vv` 增加协议细节。分别在客户端、网关两侧抓取同一流量，可以对照 MAC、TTL、地址和端口在哪个边界发生变化。\n\n#### 常见分层误区\n\n- DNS 成功只证明名称获得结果，不证明目标端口可达。\n- ping 失败不等于所有 IP 流量失败，ICMP 可能被单独过滤。\n- TCP 建连成功不证明 HTTP 请求一定合法。\n- HTTP 200 不证明返回的业务数据一定正确。", "subs": ["每层只解释自己的头部", "用抓包验证封装", "常见分层误区"]}, {"title": "TCP/IP 模型与 OSI 模型如何对应", "content": "OSI 七层模型适合描述和讨论网络职责，TCP/IP 模型更贴近互联网协议的实际组织。两者不是互斥标准，而是观察同一通信系统的两种粒度。\n\n| OSI 层 | TCP/IP 层 | 典型协议或对象 | 主要职责 |\n| --- | --- | --- | --- |\n| 7 应用层 | 应用层 | HTTP、DNS、SSH | 定义业务消息 |\n| 6 表示层 | 应用层 | JSON、TLS 编码 | 表示、加密、压缩 |\n| 5 会话层 | 应用层 | 会话状态 | 管理对话 |\n| 4 传输层 | 传输层 | TCP、UDP | 进程间传输 |\n| 3 网络层 | 网际层 | IPv4、IPv6、ICMP | 跨网络寻址与路由 |\n| 2 数据链路层 | 链路层 | Ethernet、WiFi、ARP | 同一链路交付 |\n| 1 物理层 | 链路接入 | 电信号、光信号、无线电 | 传输比特 |\n\n实际排障中常见的“二层问题”“四层负载均衡”“七层代理”，就是借用 OSI 层号来快速表达职责边界。\n\n#### PDU 名称与常见设备\n\n| 层次 | 协议数据单元 | 常见标识 | 常见设备或功能 |\n| --- | --- | --- | --- |\n| 应用层 | Message | 名称、URL、方法 | DNS、代理、网关 |\n| 传输层 | Segment 或 Datagram | 端口 | L4 负载均衡、防火墙 |\n| 网络层 | Packet | IP 地址 | 路由器、L3 ACL |\n| 链路层 | Frame | MAC、VLAN | 交换机、网桥 |\n| 物理层 | Bits | 电气或光学信号 | 线缆、收发器、中继 |\n\nOSI 的会话层和表示层在互联网软件中通常由应用库承担，例如 TLS、JSON 编码和身份会话。不要为了“凑七层”把每个协议硬塞进唯一格子；模型服务于沟通，不替代真实实现。\n\n#### 排障问题模板\n\n```text\nL1  接口是否 Up  错包是否增长\nL2  VLAN 是否一致  邻居 MAC 是否可达\nL3  地址前缀是否正确  正反向路由如何选择\nL4  端口是否监听  握手停在哪一步\nL7  请求格式  响应码  依赖和日志是否正常\n```\n\n一次只用证据排除一层，比同时修改 DNS、防火墙和应用配置更容易保留根因。", "subs": ["PDU 名称与常见设备", "排障问题模板"]}, {"title": "二进制、十六进制与字节如何表达网络数据", "content": "网络上传输的最终都是比特。8 个比特组成一个字节，能表示 `0` 到 `255`。二进制适合观察位，十六进制每一位正好对应 4 个比特，因此更适合展示报文、地址和掩码。\n\n```text\n十进制  192\n二进制  11000000\n十六进制 C0\n```\n\n位运算是理解子网和协议字段的基础：\n\n| 运算 | 作用 | 网络场景 |\n| --- | --- | --- |\n| AND | 两位都为 1 才为 1 | IP 与掩码求网络地址 |\n| OR | 任意一位为 1 即为 1 | 设置标志位 |\n| NOT | 逐位翻转 | 从掩码得到主机位 |\n| 左移 | 向高位移动 | 构造位掩码 |\n| 右移 | 向低位移动 | 提取字段 |\n\n```python\nip = int.from_bytes(bytes([192, 168, 10, 42]), \"big\")\nmask = int.from_bytes(bytes([255, 255, 255, 0]), \"big\")\nnetwork = ip & mask\nprint(network.to_bytes(4, \"big\"))  # b'\\xc0\\xa8\\n\\x00'\n```", "subs": []}, {"title": "位运算如何服务于掩码和协议字段", "content": "位运算直接作用于整数的二进制位。网络程序用它们计算网段、构造标志字段、提取报文中的子字段，也用它们把多个布尔状态压缩进一个字节。\n\n#### 四类基本位运算\n\n```text\n      10110100\nAND   11110000\n    = 10110000\n\n      10110100\nOR    00001111\n    = 10111111\n\nNOT   10110100\n    = 01001011\n```\n\nAND 配合掩码保留选定位；OR 用来打开标志位；NOT 翻转所有位；左移和右移负责把字段移动到目标位置。\n\n```python\nFLAG_SYN = 1 << 1\nFLAG_ACK = 1 << 4\n\nflags = 0\nflags |= FLAG_SYN\nflags |= FLAG_ACK\n\nassert flags & FLAG_SYN\nflags &= ~FLAG_SYN\nassert not flags & FLAG_SYN\n```\n\n#### 构造连续的 1\n\n`(1 << n) - 1` 可以得到低 n 位全为 1 的掩码。例如 n 为 5 时，结果是二进制 `11111`。IPv4 `/24` 掩码可以写成：\n\n```python\nprefix = 24\nmask = ((1 << prefix) - 1) << (32 - prefix)\nprint(mask.to_bytes(4, \"big\"))\n```\n\n位运算前必须明确整数宽度。Python 整数没有固定宽度，`~value` 会得到数学意义上的负数；若要模拟 8 位或 32 位翻转，需要再与 `0xff` 或 `0xffffffff` 做 AND。", "subs": ["四类基本位运算", "构造连续的 1"]}, {"title": "大端序、小端序与网络字节序", "content": "多字节整数必须约定高位字节和低位字节的排列顺序。大端序把最高有效字节放在前面，小端序相反。互联网协议约定网络字节序为大端序，主机内部顺序则取决于 CPU 架构。\n\n以十六进制整数 `0x12345678` 为例：\n\n```text\n大端序  12 34 56 78\n小端序  78 56 34 12\n```\n\nPython 可以明确指定字节序，避免依赖主机架构：\n\n```python\nvalue = 0x12345678\nwire = value.to_bytes(4, byteorder=\"big\")\ndecoded = int.from_bytes(wire, byteorder=\"big\")\nassert decoded == value\n```\n\n抓包时如果端口、长度或序列号看起来异常，除了检查字段偏移量，还应确认解析代码是否用了正确的字节序。\n\n#### 使用 struct 描述协议布局\n\nPython `struct` 的格式前缀 `!` 表示网络字节序。下面把版本、消息类型和 32 位长度打包为 6 字节头部：\n\n```python\nimport struct\n\nHEADER = struct.Struct(\"!BBI\")\nwire = HEADER.pack(1, 3, 4096)\nversion, message_type, length = HEADER.unpack(wire)\n\nassert len(wire) == HEADER.size == 6\nassert (version, message_type, length) == (1, 3, 4096)\n```\n\n协议结构应明确字段宽度、是否有符号、字节序、固定头与载荷的关系，以及未知版本如何处理。\n\n#### 错位解析示例\n\n如果发送方写入 32 位长度，接收方却只读取 16 位，剩余两个字节会落入后续字段，使整条消息从此错位。二进制协议出错时，应先保存原始字节，再对照偏移表解析。\n\n```bash\nxxd -g 1 packet.bin\nhexdump -C packet.bin\n```\n\n直接把 C 结构体内存发送到网络也不安全，其中可能包含对齐填充、主机字节序和平台相关宽度。", "subs": ["使用 struct 描述协议布局", "错位解析示例"]}, {"title": "TCP 字节流为什么需要应用层消息边界", "content": "TCP 提供连续字节流，不保留应用执行 `send` 时的边界。发送方一次写入 100 字节，接收方可能分两次读到，也可能一次读到它和后一条消息的全部内容。这不是“粘包故障”，而是字节流接口的正常语义。\n\n应用协议必须自行定义消息边界，常见办法有：\n\n- 固定长度：适合字段稳定的小型协议。\n- 分隔符：例如以换行结束，必须处理转义和最大长度。\n- 长度前缀：先读取固定大小的长度字段，再读取指定字节数。\n- 自描述格式：例如 HTTP Header 中的 `Content-Length`。\n\n```python\nimport struct\n\ndef encode_message(payload: bytes) -> bytes:\n    return struct.pack(\"!I\", len(payload)) + payload\n\ndef try_decode(buffer: bytes):\n    if len(buffer) < 4:\n        return None, buffer\n    size = struct.unpack(\"!I\", buffer[:4])[0]\n    if len(buffer) < 4 + size:\n        return None, buffer\n    return buffer[4:4 + size], buffer[4 + size:]\n```\n\n生产代码还必须限制最大消息长度，防止恶意长度字段造成内存耗尽。\n\n#### 三种读取场景必须同时处理\n\n```text\n场景一  recv 得到半个长度头\n场景二  recv 得到完整头但只有部分载荷\n场景三  recv 一次得到第一帧和第二帧的一部分\n```\n\n解析器不应控制 `recv`，网络循环也不应理解业务字段。前者只消费缓冲区中的完整帧，后者只负责追加字节和处理连接生命周期。\n\n```python\nbuffer = bytearray()\nwhile True:\n    chunk = sock.recv(4096)\n    if not chunk:\n        if buffer:\n            raise EOFError(\"partial frame\")\n        break\n    buffer.extend(chunk)\n    while True:\n        message, remaining = try_decode(bytes(buffer))\n        if message is None:\n            break\n        handle(message)\n        buffer[:] = remaining\n```\n\n| 测试输入 | 期望结果 |\n| --- | --- |\n| 空缓冲区 | 等待更多字节 |\n| 1–3 字节长度头 | 等待更多字节 |\n| 完整头和部分载荷 | 保留全部字节 |\n| 一帧完整 | 返回一帧和余量 |\n| 两帧完整 | 连续返回两帧 |\n| 超长声明 | 立即拒绝连接 |\n| 半帧时 EOF | 报协议截断 |\n\n随机把同一字节串切成不同块喂给解析器，是发现边界依赖的有效测试方法。", "subs": ["三种读取场景必须同时处理"]}, {"title": "IP 协议负责什么又不负责什么", "content": "IP 为跨网络传输提供统一地址和尽力而为的数据包交付。它负责在包头中携带源地址、目的地址等信息，并让路由器逐跳转发。IP 不保证到达、不保证顺序，也不自动重传。\n\n```mermaid\nflowchart LR\n    HOSTA[源主机] --> R1[路由器一]\n    R1 --> R2[路由器二]\n    R2 --> HOSTB[目标主机]\n```\n\n同一 IP 数据包在不同链路上传输时，链路层帧头会逐跳更换；IP 源地址和目的地址通常保持不变，除非中间经过 NAT。这个区别对看懂抓包非常重要。\n\nIP 旁边还有 ICMP 等辅助协议。`ping` 常用 ICMP Echo，路由器也会用 ICMP 报告不可达或 TTL 超时。ICMP 不只是诊断工具，而是 IP 工作机制的一部分。\n\n#### IPv4 头中值得先认识的字段\n\n| 字段 | 作用 | 排障价值 |\n| --- | --- | --- |\n| Version | 区分 IPv4 | 防止错用解析器 |\n| Header Length | 标记头部实际长度 | 找到载荷偏移 |\n| Total Length | 整个数据包长度 | 识别截断 |\n| Identification | 关联分片 | 分析重组 |\n| Flags 与 Offset | 控制和定位分片 | MTU 排障 |\n| TTL | 限制转发跳数 | traceroute |\n| Protocol | 标记 TCP、UDP、ICMP | 上层分发 |\n| Source 与 Destination | 端到端地址 | 路由和策略 |\n\nIP 的尽力而为意味着路由器可以在资源不足、无路由、TTL 归零或策略不允许时丢包。应用不能要求 IP 本身补发。\n\n#### ICMP 与路径 MTU\n\n```bash\nping -c 3 192.0.2.10\ntracepath 192.0.2.10\n```\n\nICMP Destination Unreachable 能报告无路由、端口不可达等问题；Packet Too Big 或 Fragmentation Needed 参与路径 MTU 发现。粗暴屏蔽全部 ICMP 可能让连接表现为难以解释的超时。\n\nIPv4 允许中间路由器分片，IPv6 中间路由器不分片。任何一个分片丢失都可能使整个原始包无法重组，应优先控制报文大小与有效 MTU。", "subs": ["IPv4 头中值得先认识的字段", "ICMP 与路径 MTU"]}, {"title": "IPv4 地址、私有网络与动态分配", "content": "IPv4 地址是 32 位整数，通常写成四个十进制字节，例如 `192.0.2.10`。地址必须结合前缀长度解释；脱离掩码，仅凭 IP 不能确定设备认为哪些地址在本地网段。\n\n常见特殊范围如下：\n\n| 范围 | 用途 |\n| --- | --- |\n| `10.0.0.0/8` | 私有地址 |\n| `172.16.0.0/12` | 私有地址 |\n| `192.168.0.0/16` | 私有地址 |\n| `127.0.0.0/8` | 环回地址 |\n| `169.254.0.0/16` | 链路本地地址 |\n| `224.0.0.0/4` | 组播地址 |\n| `0.0.0.0` | 未指定地址或任意监听地址 |\n| `255.255.255.255` | 受限广播地址 |\n\n私有地址不能直接在公网中路由，通常通过 NAT 共享公网地址。文档与示例宜使用 `192.0.2.0/24`、`198.51.100.0/24` 和 `203.0.113.0/24` 等文档保留网段，避免误用真实地址。\n\n静态地址由管理员明确配置，适合网关、基础设施和需要稳定入口的服务；动态地址通常通过 DHCP 获得，适合终端和批量主机。动态并不等于随机，DHCP 服务器可以根据客户端标识保留固定租约。\n\n```bash\nip -4 addr show\nip route show\nnetworkctl status 2>/dev/null\n```\n\n查看地址时要同时记录前缀长度、接口和作用域。只抄下 `192.168.10.20` 而遗漏 `/24`，无法完整解释主机的本地网络判断。", "subs": []}, {"title": "IPv4 的历史分类、特殊地址与特殊网段", "content": "早期 IPv4 使用 A、B、C 类地址，分别隐含 `/8`、`/16`、`/24` 网络边界。这种分类分配浪费严重，已经被 CIDR 取代，但旧文档中的“C 类网段”等说法仍然常见。\n\n| 历史类别 | 首位特征 | 默认前缀 | 过去的用途 |\n| --- | --- | --- | --- |\n| A | 最高位为 0 | `/8` | 超大网络 |\n| B | 最高两位为 10 | `/16` | 中型网络 |\n| C | 最高三位为 110 | `/24` | 小型网络 |\n| D | 最高四位为 1110 | 无 | 组播 |\n\n#### 不能当普通单播使用的地址\n\n- 一个子网的主机位全为 0，表示网络地址。\n- 传统子网中主机位全为 1，表示定向广播地址。\n- `127.0.0.0/8` 保留给本机环回。\n- `0.0.0.0` 可表示未指定地址或监听全部本地 IPv4 地址。\n- `255.255.255.255` 是受限广播，不会被路由器转发。\n- `169.254.0.0/16` 常在自动配置失败时作为链路本地地址。\n\n`/31` 和 `/32` 是需要单独理解的例外。`/31` 可用于点到点链路，两个地址都能作为端点；`/32` 表示单个主机路由，常见于 Loopback、VIP 和精确路由。", "subs": ["不能当普通单播使用的地址"]}, {"title": "IPv6 地址表示、作用域、DNS 与 URL", "content": "IPv6 地址为 128 位，写成八组十六进制数。连续的零可以用一次 `::` 压缩，每组开头的零可以省略。例如：\n\n```text\n完整写法  2001:0db8:0000:0000:0000:0000:0000:0042\n压缩写法  2001:db8::42\n```\n\n| 范围 | 用途 |\n| --- | --- |\n| `::1/128` | 环回地址 |\n| `::/128` | 未指定地址 |\n| `fe80::/10` | 链路本地地址 |\n| `fc00::/7` | 唯一本地地址 |\n| `ff00::/8` | 组播地址 |\n| `2001:db8::/32` | 文档示例地址 |\n\n链路本地地址只在当前链路有效，同一主机有多个接口时还要指定区域，例如 `fe80::1%eth0`。URL 中的 IPv6 字面量必须放进方括号：`http://[2001:db8::42]:8080/`。\n\nIPv6 没有 IPv4 意义上的广播，常用组播完成邻居发现等功能。IPv6 地址更充足，但防火墙、DNS、路由和应用监听仍需正确配置，不能把“无需 NAT”误解为“无需安全控制”。\n\n#### 压缩与还原规则\n\n一个地址中只能出现一次 `::`，否则无法判断省略了多少组零。还原时先计算已写出的组数，再补足到八组。\n\n```text\n2001:db8:1::9\n2001:0db8:0001:0000:0000:0000:0000:0009\n```\n\nDNS 使用 AAAA 记录保存 IPv6 地址。应用获得 A 和 AAAA 记录后，通常按系统地址选择策略尝试连接；“DNS 同时返回两类地址”不保证两条网络路径都可用。\n\n```bash\ndig example.com AAAA\ngetent ahosts example.com\nping -6 -c 2 2001:db8::42\n```\n\nURL 需要用方括号消除地址中的冒号与端口分隔符之间的歧义：`https://[2001:db8::42]:8443/`。日志、代理配置和允许列表也必须能正确解析这一写法。", "subs": ["压缩与还原规则"]}, {"title": "CIDR、子网掩码与网络边界", "content": "CIDR 使用斜杠后的数字表示网络前缀长度。`192.168.10.42/24` 表示前 24 位是网络位，后 8 位是主机位，对应掩码 `255.255.255.0`。\n\n```text\nIP       11000000.10101000.00001010.00101010\n掩码     11111111.11111111.11111111.00000000\n按位 AND 11000000.10101000.00001010.00000000\n网络地址 192.168.10.0\n```\n\n常见前缀速算：\n\n| 前缀 | 掩码 | 地址总数 |\n| --- | --- | ---: |\n| `/8` | `255.0.0.0` | 16,777,216 |\n| `/16` | `255.255.0.0` | 65,536 |\n| `/24` | `255.255.255.0` | 256 |\n| `/25` | `255.255.255.128` | 128 |\n| `/26` | `255.255.255.192` | 64 |\n| `/27` | `255.255.255.224` | 32 |\n| `/28` | `255.255.255.240` | 16 |\n\n地址总数是 `2^(32-prefix)`。传统 IPv4 子网中通常扣除网络地址和广播地址；点到点 `/31` 等特殊场景不能机械套用这条规则。\n\n#### 从主机数反推前缀\n\n若普通 IPv4 子网需要至少 50 个主机地址，找满足 `2^h - 2 >= 50` 的最小 h。h 为 6 时可用 62 个地址，因此前缀为 `/26`。\n\n| 需要的主机数 | 主机位 | 前缀 | 可用地址 |\n| ---: | ---: | ---: | ---: |\n| 2 | 2 | `/30` | 2 |\n| 10 | 4 | `/28` | 14 |\n| 30 | 5 | `/27` | 30 |\n| 50 | 6 | `/26` | 62 |\n| 100 | 7 | `/25` | 126 |\n| 200 | 8 | `/24` | 254 |\n\n#### 前缀聚合\n\n`10.20.0.0/24` 和 `10.20.1.0/24` 边界连续且对齐，可以聚合成 `10.20.0.0/23`。聚合减少路由条目，但若覆盖了不属于该路径的地址，可能形成黑洞。\n\n```python\nimport ipaddress\n\nnets = [ipaddress.ip_network(\"10.20.0.0/24\"),\n        ipaddress.ip_network(\"10.20.1.0/24\")]\nprint(list(ipaddress.collapse_addresses(nets)))\n```", "subs": ["从主机数反推前缀", "前缀聚合"]}, {"title": "从 IP 地址计算网段、主机范围与广播地址", "content": "计算 `192.168.10.70/26`：每个 `/26` 块有 64 个地址，边界依次是 0、64、128、192，因此 70 落在 64 到 127。\n\n```text\n网络地址    192.168.10.64\n首个主机    192.168.10.65\n最后主机    192.168.10.126\n广播地址    192.168.10.127\n```\n\nPython 标准库可以用于核对手算结果：\n\n```python\nimport ipaddress\n\niface = ipaddress.ip_interface(\"192.168.10.70/26\")\nnetwork = iface.network\nprint(network.network_address)\nprint(network.broadcast_address)\nprint(network.num_addresses)\n```\n\n规划子网时不仅要考虑当前主机数，还要为网关、负载均衡地址、基础设施和增长预留空间。多个子网若重叠，会让路由、VPN、容器网络和云网络互联变得困难。\n\n#### 一套不容易出错的手算流程\n\n1. 把前缀转换成主机位数量。\n2. 计算块大小 `2^主机位`。\n3. 找出目标地址所在的对齐块。\n4. 块首是网络地址，块尾是广播地址。\n5. 普通子网中间范围是可用主机地址。\n6. 用二进制 AND 或工具复核。\n\n再计算 `172.16.35.200/20`。`/20` 的第三个字节掩码为 240，块大小为 16；35 落在 32–47：\n\n```text\n网络地址  172.16.32.0\n广播地址  172.16.47.255\n首主机    172.16.32.1\n末主机    172.16.47.254\n```\n\n```python\nimport ipaddress\n\na = ipaddress.ip_network(\"10.0.0.0/16\")\nb = ipaddress.ip_network(\"10.0.128.0/17\")\nassert a.overlaps(b)\n```\n\n在连接 VPC、VPN、Kubernetes Pod CIDR 和办公网络前做重叠审计，成本远低于上线后迁移地址。", "subs": ["一套不容易出错的手算流程"]}, {"title": "链路层、帧与数据包有什么区别", "content": "“帧”和“包”有时被泛称为 packet，但精确讨论时应区分层次：Ethernet 帧属于链路层，承载 IP 数据包；IP 数据包又承载 TCP 段或 UDP 数据报。\n\n```mermaid\nflowchart TB\n    FRAME[Ethernet 帧] --> IPPKT[IP 数据包]\n    IPPKT --> SEG[TCP 段或 UDP 数据报]\n    SEG --> PAYLOAD[应用数据]\n```\n\nEthernet 帧通常包含目的 MAC、源 MAC、EtherType、载荷和帧校验序列。网卡首先依据链路层信息接收帧，再根据 EtherType 把载荷交给 IPv4、IPv6 或 ARP 等处理逻辑。\n\nMTU 是链路一次能承载的最大网络层载荷。Ethernet 常见 MTU 为 1500 字节，但隧道封装会消耗额外空间。MTU 不匹配可能造成分片、丢包或“能 ping 小包但大请求卡住”的现象。", "subs": []}, {"title": "Ethernet 帧由哪些字段组成", "content": "一个常见 Ethernet II 帧由前导码、帧起始定界符、目的 MAC、源 MAC、EtherType、载荷和帧校验序列组成。抓包软件通常从目的 MAC 开始展示，因为网卡硬件可能已经去掉前导码和 FCS。\n\n| 字段 | 常见长度 | 作用 |\n| --- | ---: | --- |\n| Preamble | 7 字节 | 让接收端同步时钟 |\n| SFD | 1 字节 | 标记帧正式开始 |\n| Destination MAC | 6 字节 | 指定链路层接收方 |\n| Source MAC | 6 字节 | 标记链路层发送方 |\n| 802.1Q Tag | 可选 4 字节 | 携带 VLAN 和优先级 |\n| EtherType | 2 字节 | 标记上层协议 |\n| Payload | 46–1500 字节 | 承载网络层数据 |\n| FCS | 4 字节 | CRC-32 差错检测 |\n\n常见 EtherType 包括 IPv4 的 `0x0800`、ARP 的 `0x0806` 和 IPv6 的 `0x86dd`。接收端依据它决定把载荷交给哪个协议处理函数。\n\n#### 长度下限和填充\n\n传统 Ethernet 从目的 MAC 到 FCS 的帧长至少为 64 字节。如果上层载荷太短，链路层会填充。解析上层协议时必须依据上层长度字段，而不能把填充字节误当成业务数据。\n\nCRC 能发现链路传输错误，但通常由网卡硬件生成和验证。校验失败的帧经常在进入操作系统抓包点之前就被丢弃，因此普通 tcpdump 未必看得到坏帧。", "subs": ["长度下限和填充"]}, {"title": "MAC 地址、介质访问与交换机学习", "content": "MAC 地址通常是 48 位链路层地址，例如 `02:42:ac:11:00:02`。交换机学习每个源 MAC 来自哪个端口，并根据目的 MAC 转发帧。未知单播和广播会在广播域内泛洪。\n\n```mermaid\nflowchart LR\n    A[主机 A] --> SW[交换机]\n    SW --> B[主机 B]\n    SW --> C[主机 C]\n    SW --> D[上联网关]\n```\n\n当 A 和 B 在同一子网时，A 会获取 B 的 MAC 并直接发送。若目标不在本地子网，A 的二层目的地址不是远端主机的 MAC，而是默认网关接口的 MAC。IP 目的地址仍然是最终远端地址。\n\n交换机主要扩展二层网络，路由器连接不同三层网络。VLAN 可以在同一物理交换基础设施上划分多个逻辑广播域，每个 VLAN 通常对应独立 IP 子网。\n\n#### 从共享介质到全双工交换\n\n早期总线和集线器 Ethernet 使用 CSMA/CD：发送前监听介质，检测到碰撞后停止、随机退避再重试。现代交换网络通常每个端口独占链路并使用全双工，不再发生传统碰撞，但广播和未知单播仍可能被泛洪。\n\n交换机观察进入帧的源 MAC，记录“MAC 到入端口”的映射。查到目的 MAC 时只转发到对应端口；未知时向同 VLAN 的其他端口泛洪；表项长时间不用会老化。\n\n```text\nVLAN 10  02:00:00:00:00:0a  Gi0/1\nVLAN 10  02:00:00:00:00:0b  Gi0/2\nVLAN 20  02:00:00:00:00:0c  Gi0/3\n```\n\nMAC 表震荡通常意味着同一个源 MAC 在多个端口间快速移动，可能由二层环路、错误聚合或虚拟机迁移引起。", "subs": ["从共享介质到全双工交换"]}, {"title": "ARP 如何把 IPv4 地址解析成 MAC 地址", "content": "ARP 用于在同一链路内把 IPv4 地址解析为 MAC 地址。发送方不知道目标 MAC 时广播 ARP Request，拥有目标 IP 的设备单播回复 ARP Reply，结果随后进入邻居缓存。\n\n```mermaid\nsequenceDiagram\n    participant A as 主机 A\n    participant LAN as 局域网\n    participant B as 主机 B\n    A->>LAN: 广播询问目标 IP 的 MAC\n    LAN->>B: 交付 ARP Request\n    B-->>A: 单播返回自身 MAC\n    A->>B: 发送 Ethernet 帧\n```\n\nLinux 中可以查看邻居表：\n\n```bash\nip neigh show\nip neigh get 192.168.10.1\n```\n\n邻居条目会经历 `REACHABLE`、`STALE`、`DELAY`、`PROBE`、`FAILED` 等状态。ARP 缓存不是永久可信数据；地址迁移、虚拟 IP 漂移和重复地址都可能使缓存短暂过期或错误。", "subs": []}, {"title": "ARP 报文、通告与地址冲突检测", "content": "ARP 报文不是 IP 数据包，而是直接装在 Ethernet 帧中，EtherType 为 `0x0806`。它同时携带链路层地址和协议层地址。\n\n| 字段 | 含义 | Ethernet 与 IPv4 常见值 |\n| --- | --- | --- |\n| Hardware Type | 链路类型 | `1` |\n| Protocol Type | 被解析协议 | `0x0800` |\n| Hardware Length | MAC 长度 | `6` |\n| Protocol Length | IPv4 长度 | `4` |\n| Operation | 请求或响应 | `1` 或 `2` |\n| Sender Hardware | 发送方 MAC | 6 字节 |\n| Sender Protocol | 发送方 IPv4 | 4 字节 |\n| Target Hardware | 目标 MAC | 请求时未知 |\n| Target Protocol | 目标 IPv4 | 4 字节 |\n\n#### Gratuitous ARP\n\n设备主动广播自身 IP 与 MAC 的绑定，可以刷新其他主机缓存。高可用系统切换 VIP 后常发送 Gratuitous ARP，让交换和主机尽快把流量指向新节点。\n\n#### ARP Probe\n\n主机正式使用地址前可以发送 Sender IP 为 `0.0.0.0` 的探测，询问是否已有设备占用目标地址。如果收到响应，就应停止使用该地址并报告冲突。\n\n```bash\narping -D -I eth0 192.168.10.50\narping -U -I eth0 192.168.10.50\n```\n\nARP 没有认证，攻击者可能发送伪造绑定实施中间人攻击。静态邻居、交换机动态 ARP 检查和网络分段能降低风险，但需要结合环境权衡维护成本。", "subs": ["Gratuitous ARP", "ARP Probe"]}, {"title": "IPv6 邻居发现如何替代 ARP", "content": "IPv6 不使用 ARP，而是在 ICMPv6 上实现邻居发现协议 NDP。NDP 不仅解析链路层地址，还承担路由器发现、前缀发现、邻居可达性检测和重复地址检测。\n\n| IPv4 机制 | IPv6 对应机制 |\n| --- | --- |\n| ARP Request | Neighbor Solicitation |\n| ARP Reply | Neighbor Advertisement |\n| 默认网关人工或 DHCP | Router Solicitation 与 Advertisement |\n| Gratuitous ARP | Unsolicited Neighbor Advertisement |\n\nNDP 使用组播而不是广播。排查 IPv6 邻居问题时，除了 `ip -6 neigh`，还必须确认防火墙没有错误阻断必要的 ICMPv6；完全封禁 ICMPv6 会破坏 IPv6 的基本运行。", "subs": []}, {"title": "网卡、交换机与路由器分别工作在哪一层", "content": "| 组件 | 主要层次 | 决策依据 | 作用域 |\n| --- | --- | --- | --- |\n| 网卡 | L1/L2 | 帧与接口配置 | 单台主机 |\n| 集线器 | L1 | 无智能转发 | 单个冲突域 |\n| 交换机 | L2 | MAC 地址表 | 广播域或 VLAN |\n| 路由器 | L3 | IP 路由表 | 不同子网 |\n| 防火墙 | L3-L7 | 规则与连接状态 | 安全边界 |\n| 无线接入点 | L1/L2 | 无线关联与桥接 | 无线局域网 |\n\n真实设备常同时承担多个角色，例如家用路由器通常集成交换机、无线 AP、DHCP、DNS 转发、NAT 和防火墙。排障时应按实际数据路径拆开这些逻辑角色，而不是只看设备名称。", "subs": []}, {"title": "用 Packet Tracer 直连两台主机", "content": "第一个实验只连接两台主机，用最小拓扑验证同网段通信。为 PC-A 配置 `192.168.10.10/24`，为 PC-B 配置 `192.168.10.20/24`，暂时不配置默认网关。\n\n```mermaid\nflowchart LR\n    PCA[PC A 192.168.10.10] --- PCB[PC B 192.168.10.20]\n```\n\n#### 操作与观察\n\n1. 拖入两台 PC，并用合适的 Ethernet 连接相连。\n2. 在桌面 IP 配置中设置地址和掩码。\n3. 等待接口指示变为 Up。\n4. 从 PC-A ping PC-B。\n5. 切换到 Simulation 模式，重新发起 ping。\n6. 观察第一次通信先产生 ARP，随后才出现 ICMP Echo。\n\n如果接口 Up 但 ping 失败，优先核对地址、掩码和两端是否处在同一网段。如果第一次 ping 丢一个包、之后成功，通常是等待 ARP 解析，不应直接判定链路不稳定。", "subs": ["操作与观察"]}, {"title": "用交换机和单台路由器连接局域网", "content": "先把三台 PC 接入交换机并配置同一 `/24`，验证交换机如何学习源 MAC。随后再增加第二个 LAN 和一台路由器，让两个广播域通过三层转发通信。\n\n```text\nLAN A\nPC-A  192.168.10.10/24  gateway 192.168.10.1\nPC-B  192.168.10.20/24  gateway 192.168.10.1\nR1-A  192.168.10.1/24\n\nLAN B\nPC-C  192.168.20.10/24  gateway 192.168.20.1\nR1-B  192.168.20.1/24\n```\n\n#### 分阶段验证\n\n1. 只接交换机时验证 LAN A 内主机互通。\n2. 观察第一次未知单播或 ARP 广播的泛洪。\n3. 再次发送单播，确认交换机只从目标端口转发。\n4. 接入路由器两个接口并启用端口。\n5. 配置 PC 默认网关。\n6. 从 PC-A ping `192.168.20.1`，再 ping PC-C。\n\n同网段通信不需要默认网关；跨网段通信必须把帧发给网关 MAC。若 PC 能 ping 本地网关但不能到远端，检查路由器另一接口和远端主机回程配置。\n\n原有地址规划可以表示为：\n\n```text\nPC-A  192.168.10.10/24  gateway 192.168.10.1\nR-A   192.168.10.1/24\nR-B   192.168.20.1/24\nPC-B  192.168.20.10/24  gateway 192.168.20.1\n```\n\n验证顺序：\n\n1. 检查接口是否启用、线缆是否连接。\n2. 从 PC ping 自身地址和本地网关。\n3. ping 对端路由器接口。\n4. ping 远端 PC。\n5. 在模拟模式观察 ARP、ICMP 与每跳 MAC 地址变化。\n\n这个实验最重要的不是得到 ping 成功，而是解释每一跳：主机怎样判断目标不在本地、如何解析网关 MAC、路由器怎样更换帧头并继续转发。", "subs": ["分阶段验证"]}, {"title": "用多台路由器、默认网关和静态路由连接网段", "content": "增加路由器后，每台路由器只自动知道自己的直连网段。若要访问更远网段，必须配置静态路由、默认路由或动态路由协议。\n\n```mermaid\nflowchart LR\n    LAN1[LAN A 192.168.10.0 24] --> R1[路由器一]\n    R1 --> MID[传输网 10.0.12.0 30]\n    MID --> R2[路由器二]\n    R2 --> LAN2[LAN B 192.168.20.0 24]\n```\n\n以 Linux 路由命令表示，R1 需要知道 LAN B 的下一跳：\n\n```bash\nip route add 192.168.20.0/24 via 10.0.12.2\n```\n\nR2 同样必须配置返回 LAN A 的路由。只配置单向路径经常会出现“请求已到达但响应回不来”。因此判断可达性时必须同时检查正向和回程路径。\n\n#### 完整地址表\n\n| 设备 | 接口 | 地址 | 下一跳或网关 |\n| --- | --- | --- | --- |\n| PC-A | NIC | `192.168.10.10/24` | `192.168.10.1` |\n| R1 | LAN | `192.168.10.1/24` | 直连 |\n| R1 | Transit | `10.0.12.1/30` | 直连 |\n| R2 | Transit | `10.0.12.2/30` | 直连 |\n| R2 | LAN | `192.168.20.1/24` | 直连 |\n| PC-B | NIC | `192.168.20.10/24` | `192.168.20.1` |\n\nR1 添加 `192.168.20.0/24 via 10.0.12.2`，R2 添加 `192.168.10.0/24 via 10.0.12.1`。每条静态路由描述的是远端前缀，不是某一台远端主机。\n\n#### 故障注入练习\n\n- 删除 R2 的回程路由，观察请求与响应分别停在哪里。\n- 把 PC-B 网关改错，确认本地通信和跨网段通信的差异。\n- 关闭 R1 传输接口，观察路由条目和链路状态变化。\n- 把两个 LAN 配成重叠网段，解释主机为何错误地尝试 ARP。\n\n每次只改变一个变量，并在 Simulation 模式记录帧的源 MAC、目的 MAC、源 IP 和目的 IP。跨越路由器时 MAC 逐跳变化，端到端 IP 通常保持不变。\n\n#### 第一册综合实验：从二进制到跨网段通信\n\n综合实验把地址规划、ARP、Ethernet 和路由器转发放到同一张拓扑中。不要先追求全部 ping 成功，而是逐步预测每个设备会做出的判断。\n\n```mermaid\nflowchart LR\n    A[PC A 10.10.1.10 26] --> SW1[交换机一]\n    SW1 --> R1[路由器 10.10.1.1]\n    R1 --> R2[传输网 10.255.0.0 30]\n    R2 --> SW2[交换机二]\n    SW2 --> B[PC B 10.10.2.70 26]\n```\n\n##### 第一步：完成地址规划\n\n| 区域 | 网络 | 可用范围 | 广播 |\n| --- | --- | --- | --- |\n| LAN A | `10.10.1.0/26` | `.1`–`.62` | `.63` |\n| Transit | `10.255.0.0/30` | `.1`–`.2` | `.3` |\n| LAN B | `10.10.2.64/26` | `.65`–`.126` | `.127` |\n\n为 PC-A 配置 `10.10.1.10/26`、网关 `10.10.1.1`；为 PC-B 配置 `10.10.2.70/26`、网关 `10.10.2.65`。R1 与 R2 传输接口使用 `10.255.0.1/30` 和 `10.255.0.2/30`。\n\n##### 第二步：写出转发前的判断\n\nPC-A 计算 `10.10.2.70 AND 255.255.255.192`，结果不是自己的 `10.10.1.0/26`，因此选择默认网关。它不会查询 PC-B 的 MAC，而是查询 `10.10.1.1` 的 MAC。\n\n```text\nPC A 发送的第一跳帧\nSource MAC       PC A MAC\nDestination MAC R1 LAN MAC\nSource IP        10.10.1.10\nDestination IP   10.10.2.70\n```\n\nR1 去掉收到的帧头，查找 `10.10.2.64/26`，选择 R2 为下一跳，再为传输网构造新的 Ethernet 帧。\n\n##### 第三步：配置静态路由\n\n```bash\n# 用 Linux 命令表达 R1 的意图\nip route add 10.10.2.64/26 via 10.255.0.2\n\n# 用 Linux 命令表达 R2 的回程意图\nip route add 10.10.1.0/26 via 10.255.0.1\n```\n\nPacket Tracer 的设备命令语法不同，但路由语义一致：目标前缀、掩码、下一跳。\n\n##### 第四步：记录逐跳字段\n\n| 跳 | 源 MAC | 目的 MAC | 源 IP | 目的 IP | TTL |\n| --- | --- | --- | --- | --- | ---: |\n| PC-A 到 R1 | PC-A | R1-LAN | `10.10.1.10` | `10.10.2.70` | 64 |\n| R1 到 R2 | R1-WAN | R2-WAN | `10.10.1.10` | `10.10.2.70` | 63 |\n| R2 到 PC-B | R2-LAN | PC-B | `10.10.1.10` | `10.10.2.70` | 62 |\n\n真实起始 TTL 依操作系统而异，表格只用于展示每经过一个路由器递减一次。\n\n##### 第五步：观察邻居缓存和交换学习\n\n首次通信前，各设备可能没有目标邻居条目。通信后检查：\n\n```bash\nip neigh show\nbridge fdb show 2>/dev/null\n```\n\n主机只学习本地链路邻居；PC-A 不会出现 PC-B 的 MAC。每个路由器分别学习自己直连链路中的下一跳。\n\n##### 第六步：故障注入\n\n1. 把 PC-B 前缀改成 `/24`，观察它对回程目标的本地判断。\n2. 删除 R2 回程路由，确认 Echo Request 与 Echo Reply 的不同路径。\n3. 配置重复 IPv4，观察 ARP 绑定如何来回变化。\n4. 把交换端口放入错误 VLAN，确认 ARP 广播不能跨越隔离边界。\n5. 关闭 R1 转发，区分“接口地址可 ping”和“能为他人转发”。\n\n##### 第七步：回答自测问题\n\n- 为什么 PC-A 的第一跳目的 MAC 是网关，而目的 IP 仍是 PC-B？\n- 哪些设备会保存 `10.10.2.70` 的邻居条目？\n- 如果传输网改为 `/29`，可用地址和广播地址如何变化？\n- Ethernet FCS、IPv4 头校验和与 TCP 校验和分别覆盖什么范围？\n- 为什么交换机不知道 IP 路由，却仍能把帧送到正确端口？\n- 如果 IPv6 替换 IPv4，哪些机制由 NDP 和组播接管？\n\n#### 第一册复习清单\n\n完成本册后，应能独立完成以下动作：\n\n- 在十进制、二进制和十六进制之间转换一个字节。\n- 用 AND 计算网络地址，用前缀计算块大小。\n- 区分网络地址、可用主机、广播、环回和链路本地地址。\n- 正确压缩和还原 IPv6 地址。\n- 解释 Message、Segment、Packet、Frame 和 Bits 的嵌套。\n- 写出 Ethernet II 和 ARP 的核心字段。\n- 预测同网段与跨网段通信各自查询谁的 MAC。\n- 解释交换机学习和未知单播泛洪。\n- 为两个远端网段配置成对的正向和回程路由。\n- 用抓包证明 MAC 逐跳变化而端到端 IP 通常不变。\n\n完成本册后，应能画出任意一次局域网通信中 IP 包与 Ethernet 帧的封装关系，并手工判断目标走直连还是默认网关。下一册将在此基础上讨论 TCP、UDP、路由算法以及 DNS、DHCP、NAT 等网络服务。", "subs": ["完整地址表", "故障注入练习", "第一册综合实验", "第一册复习清单"]}, {"title": "TCP Stream、五元组与抓包中的分层术语", "content": "抓包分析需要先把同一通信的身份和层次固定下来。五元组是源 IP、目的 IP、传输层协议、源端口和目的端口；它通常足以把 TCP 流与其他并发连接区分开，但 NAT、代理和负载均衡会在不同观察点改写其中字段。\n\n| 抓包字段 | 所在层 | 排障用途 |\n| --- | --- | --- |\n| MAC、EtherType | 链路层 | 判断本地链路和下一跳 |\n| 源/目的 IP、TTL、分片字段 | 网络层 | 判断路径、转发和 MTU |\n| 端口、SYN/ACK、序列号 | 传输层 | 识别连接、可靠性和方向 |\n| TLS、HTTP、DNS 载荷 | 应用/会话层 | 判断协商、请求和响应 |\n\nWireshark 的 `tcp.stream` 是基于抓包内容建立的本地编号，不是协议字段，也不应跨文件直接比较。先用五元组和时间范围缩小候选，再用 Follow Stream 查看一个连接的双向顺序。\n\n```bash\n# 在客户端观察点，仅保留目标四层流量并限制采集时长\nsudo timeout 30 tcpdump -ni any -s 128 -w client.pcap \\\n  'host 203.0.113.20 and tcp port 443'\n```\n\n抓包点只代表该接口能看到的方向。交换机未做镜像时，普通主机看不到其他端口的单播；虚拟网卡、隧道和 NAT 也可能让同一报文在不同点拥有不同的 MAC 或 IP。结论必须写明观察点和时间窗口。", "subs": []}, {"title": "分段、MSS、IP 分片与 TSO 如何影响抓包", "content": "TCP 分段发生在传输层，依据 MSS 把字节流拆成多个 TCP 段；IP 分片发生在网络层，把一个 IP 包拆成多个片。MSS 通常由端点根据接口或路径 MTU 计算并在握手中通告；接收窗口是独立的流量控制量，不能把 MSS 等同于链路 MTU。\n\n| 现象 | 可能解释 | 首项证据 |\n| --- | --- | --- |\n| 小包探测成功，大请求卡住 | PMTUD 黑洞、隧道 MTU 或防火墙阻断 ICMP | `tracepath`、DF/Packet Too Big、双端抓包 |\n| 抓包看到超大 TCP 段 | TSO/GSO 在主机抓包点尚未卸载 | 网卡 offload 设置、线上接口抓包 |\n| 大 UDP 报文出现多个片 | IPv4 分片 | Identification、Fragment Offset、MF |\n\n```bash\nip link show dev eth0\ntracepath 203.0.113.20\nping -M do -s 1400 -c 3 203.0.113.20\n```\n\n主机抓包可能发生在网卡卸载之前或之后，Wireshark 的“TCP segment of a reassembled PDU”和重传标记因此只能作为线索。需要时在发送端、接收端或镜像链路同时采集，并记录 MTU、封装层和 offload 状态。修改 MTU 前先准备回滚，验证时比较大包成功率、重传和应用延迟。", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
