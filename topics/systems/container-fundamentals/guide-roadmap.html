<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

环境\n\n**Dockerfile 示例**：\n\n```dockerfile\n# 基础镜像\nFROM centos:8.1.1911\n\n# 安装依赖\nRUN yum install -y gcc make\n\n# 复制应用程序\nCOPY ./app /app\n\n# 设置工作目录\nWORKDIR /app\n\n# 启动命令\nCMD [\"./start.sh\"]\n```\n\n**常用命令**：\n\n```bash\n# 构建镜像\ndocker build -t myapp:v1 .\n\n# 启动容器\ndocker run -d --name myapp myapp:v1\n\n# 进入容器\ndocker exec -it myapp bash\n\n# 查看容器日志\ndocker logs -f myapp\n```\n\n---", "subs": ["什么是容器？", "容器 vs 虚拟机", "容器镜像基础"]}, {"title": "1.2 Namespace 隔离机制", "content": "Namespace 是 Linux 内核提供的资源隔离机制，让容器中的进程\"看起来\"拥有独立的系统环境。\n\n#### 主要 Namespace 类型\n\n| Namespace | 隔离内容 | 系统调用标志 |\n|-----------|----------|--------------|\n| **PID** | 进程 ID | CLONE_NEWPID |\n| **Network** | 网络栈、端口 | CLONE_NEWNET |\n| **Mount** | 文件系统挂载点 | CLONE_NEWNS |\n| **UTS** | 主机名、域名 | CLONE_NEWUTS |\n| **IPC** | 进程间通信 | CLONE_NEWIPC |\n| **User** | 用户和组 ID | CLONE_NEWUSER |\n| **Cgroup** | Cgroup 根目录 | CLONE_NEWCGROUP |\n\n#### PID Namespace\n\n容器内的 1 号进程（init 进程）是容器中所有进程的祖先，但它在宿主机上只是一个普通进程。\n\n```bash\n# 容器内查看进程\n$ ps aux\nPID   USER   COMMAND\n1     root   /bin/bash    # 容器的 init 进程\n\n# 宿主机查看同一进程\n$ ps aux | grep bash\n12345 root   /bin/bash    # 对应的宿主机 PID\n```\n\n```mermaid\ngraph TD\n    subgraph Host[\"宿主机 PID Namespace\"]\n        H1[\"PID 1: systemd\"]\n        H12345[\"PID 12345: bash\"]\n    end\n\n    subgraph Container[\"容器 PID Namespace\"]\n        C1[\"PID 1: bash\"]\n    end\n\n    H12345 -.->|\"映射\"| C1\n```\n\n#### Network Namespace\n\n每个容器拥有独立的网络栈，包括：\n\n- 网络设备（lo、eth0）\n- IP 地址\n- 路由表\n- iptables 规则\n- 端口空间\n\n```bash\n# 查看容器网络接口\n$ ip addr\n1: lo: <LOOPBACK,UP> ...\n2: eth0: <BROADCAST,MULTICAST,UP> ...\n    inet 172.17.0.2/16\n```\n\n#### Mount Namespace\n\n让容器拥有独立的文件系统视图，配合 **rootfs** 和 **OverlayFS** 实现容器文件系统。\n\n---", "subs": ["主要 Namespace 类型", "PID Namespace", "Network Namespace", "Mount Namespace"]}, {"title": "1.3 Cgroups 资源控制", "content": "Cgroups（Control Groups）是 Linux 内核提供的资源限制机制，可以限制、记录和隔离进程组的资源使用。\n\n#### Cgroups 子系统\n\n| 子系统 | 功能 | 常用参数 |\n|--------|------|----------|\n| **cpu** | 限制 CPU 使用 | cpu.cfs_quota_us, cpu.shares |\n| **cpuset** | 绑定 CPU 核心 | cpuset.cpus |\n| **memory** | 限制内存使用 | memory.limit_in_bytes |\n| **blkio** | 限制块设备 I/O | blkio.throttle.read_bps_device |\n| **pids** | 限制进程数量 | pids.max |\n\n#### Cgroups 文件系统\n\nCgroups 通过文件系统接口进行配置：\n\n```bash\n# 查看 Cgroups 挂载点\n$ mount | grep cgroup\ncgroup on /sys/fs/cgroup/cpu type cgroup (rw,cpu)\ncgroup on /sys/fs/cgroup/memory type cgroup (rw,memory)\n\n# 查看容器的 CPU Cgroup\n$ cat /sys/fs/cgroup/cpu/docker/<container_id>/cpu.cfs_quota_us\n100000  # 表示 100ms（100%的一个 CPU）\n```\n\n#### CPU Cgroup 示例\n\n限制容器最多使用 0.5 个 CPU：\n\n```bash\n# 设置 CPU 配额（50ms / 100ms = 50%）\necho 50000 > /sys/fs/cgroup/cpu/docker/<id>/cpu.cfs_quota_us\necho 100000 > /sys/fs/cgroup/cpu/docker/<id>/cpu.cfs_period_us\n```\n\n对应 Docker 命令：\n\n```bash\ndocker run --cpus=0.5 myapp:v1\n```\n\n#### Memory Cgroup 示例\n\n限制容器最多使用 512MB 内存：\n\n```bash\n# 设置内存上限\necho 536870912 > /sys/fs/cgroup/memory/docker/<id>/memory.limit_in_bytes\n```\n\n对应 Docker 命令：\n\n```bash\ndocker run -m 512m myapp:v1\n```\n\n---", "subs": ["Cgroups 子系统", "Cgroups 文件系统", "CPU Cgroup 示例", "Memory Cgroup 示例"]}, {"title": "1.4 容器技术架构总览", "content": "```mermaid\ngraph TB\n    subgraph Container[\"容器\"]\n        App[\"应用进程\"]\n        Init[\"init 进程\"]\n    end\n\n    subgraph Namespaces[\"Namespace 隔离\"]\n        PID[\"PID NS\"]\n        NET[\"Network NS\"]\n        MNT[\"Mount NS\"]\n        UTS[\"UTS NS\"]\n        IPC[\"IPC NS\"]\n        USER[\"User NS\"]\n    end\n\n    subgraph Cgroups[\"Cgroup 资源控制\"]\n        CPU[\"cpu\"]\n        MEM[\"memory\"]\n        BLK[\"blkio\"]\n        PIDS[\"pids\"]\n    end\n\n    subgraph Storage[\"存储\"]\n        OFS[\"OverlayFS\"]\n        Lower[\"镜像层-只读\"]\n        Upper[\"容器层-可写\"]\n    end\n\n    App --> Init\n    Container --> Namespaces\n    Container --> Cgroups\n    Container --> OFS\n\n    OFS --> Lower\n    OFS --> Upper\n```\n\n---", "subs": []}, {"title": "本章小结", "content": "| 概念 | 作用 | 关键点 |\n|------|------|--------|\n| **Namespace** | 资源隔离 | 让容器拥有独立的进程、网络、文件系统视图 |\n| **Cgroups** | 资源限制 | 限制容器的 CPU、内存、I/O 等资源使用量 |\n| **rootfs** | 文件系统 | 容器的根文件系统，通常使用 OverlayFS 实现 |\n| **容器镜像** | 运行模板 | 由 Dockerfile 定义，包含应用程序及其依赖 |\n\n> **运维要点**：理解 Namespace 和 Cgroups 是排查容器问题的基础，很多\"容器内表现异常\"的问题都与这两个机制有关。\n\n---", "subs": []}]}, {"title": "第二章：容器进程管理", "sections": [{"title": "2.1 容器 init 进程与信号机制", "content": "> **核心问题**：为什么在容器中执行 `kill -9 1` 无法杀死 1 号进程？\n\n#### 什么是 init 进程？\n\n在 Linux 系统中，**init 进程是系统启动后创建的第一个用户态进程**，PID 为 1。它有两个重要职责：\n\n1. **创建和管理其他进程**：作为所有用户态进程的祖先\n2. **回收孤儿进程**：当父进程退出后，其子进程会被 init 进程\"收养\"\n\n```mermaid\ngraph TD\n    Kernel[\"内核\"] --> Init[\"init 进程 PID=1\"]\n    Init --> P1[\"进程 A\"]\n    Init --> P2[\"进程 B\"]\n    P1 --> P3[\"进程 C\"]\n    P2 --> P4[\"进程 D\"]\n    \n    P1 -.-|\"父进程退出\"| Orphan[\"进程 C 成为孤儿\"]\n    Orphan -->|\"被收养\"| Init\n```\n\n#### 容器中的 init 进程\n\n在容器的 PID Namespace 中，容器启动的第一个进程就是该 Namespace 的 **init 进程（PID=1）**。\n\n```bash\n# 启动容器\n$ docker run -d --name test centos sleep 3600\n\n# 查看容器内进程\n$ docker exec test ps aux\nPID   USER   COMMAND\n1     root   sleep 3600   # 这就是容器的 init 进程\n```\n\n#### Linux 信号机制基础\n\n**信号（Signal）** 是 Linux 进程间通信的一种异步机制，常见信号：\n\n| 信号 | 编号 | 默认行为 | 说明 |\n|------|------|----------|------|\n| **SIGTERM** | 15 | 终止进程 | 可被捕获/忽略，用于优雅退出 |\n| **SIGKILL** | 9 | 强制终止 | 不可被捕获/忽略 |\n| **SIGSTOP** | 19 | 暂停进程 | 不可被捕获/忽略 |\n| **SIGINT** | 2 | 终止进程 | Ctrl+C 触发 |\n| **SIGHUP** | 1 | 终止进程 | 终端断开触发 |\n\n**进程处理信号的三种方式**：\n\n```mermaid\ngraph LR\n    Signal[\"收到信号\"] --> A{\"处理方式\"}\n    A -->|\"1. 忽略\"| Ignore[\"信号被丢弃\"]\n    A -->|\"2. 捕获\"| Handler[\"执行自定义 handler\"]\n    A -->|\"3. 缺省\"| Default[\"执行内核默认行为\"]\n```\n\n**注册信号处理函数示例**：\n\n```c\n#include <signal.h>\n#include <stdio.h>\n\n// 自定义信号处理函数\nvoid sig_handler(int signo) {\n    if (signo == SIGTERM) {\n        printf(\"Received SIGTERM, cleaning up...\\n\");\n        // 执行清理工作\n        exit(0);\n    }\n}\n\nint main() {\n    // 注册 SIGTERM 的处理函数\n    signal(SIGTERM, sig_handler);\n    \n    // 忽略 SIGHUP 信号\n    signal(SIGHUP, SIG_IGN);\n    \n    while(1) {\n        sleep(1);\n    }\n    return 0;\n}\n```\n\n#### 为什么 kill -9 1 不生效？\n\n**实验验证**：\n\n```bash\n# 在容器内尝试杀死 1 号进程\n$ docker exec test kill -9 1\n\n# 检查进程是否还在\n$ docker exec test ps aux\nPID   USER   COMMAND\n1     root   sleep 3600   # 进程依然存活！\n```\n\n**根本原因**：Linux 内核对 init 进程有特殊保护机制。\n\n查看内核源码 `kernel/signal.c`：\n\n```c\nstatic bool sig_task_ignored(struct task_struct *t, int sig, bool force)\n{\n    // ...\n    \n    // 关键代码：如果进程有 SIGNAL_UNKILLABLE 标志\n    // 则 SIGKILL 和 SIGSTOP 会被忽略\n    if (unlikely(t->signal->flags & SIGNAL_UNKILLABLE) &&\n        handler == SIG_DFL && !(force && sig_kernel_only(sig)))\n        return true;\n    \n    return sig_handler_ignored(handler, sig);\n}\n```\n\n**SIGNAL_UNKILLABLE 标志**：\n\n- 每个 Namespace 的 init 进程都会被设置此标志\n- 设置此标志的进程会**忽略没有注册 handler 的信号**\n- 即使是 SIGKILL 和 SIGSTOP 也会被忽略\n\n#### 信号处理规则总结\n\n```mermaid\ngraph TD\n    A[\"发送信号给 init 进程\"] --> B{\"信号类型?\"}\n    \n    B -->|\"SIGKILL/SIGSTOP\"| C[\"永远被忽略\"]\n    B -->|\"其他信号\"| D{\"是否注册 handler?\"}\n    \n    D -->|\"是\"| E[\"执行 handler\"]\n    D -->|\"否\"| F[\"信号被忽略\"]\n    \n    C --> G[\"进程继续运行\"]\n    F --> G\n```\n\n| 场景 | init 进程行为 |\n|------|---------------|\n| `kill -9 1` (SIGKILL) | 信号被忽略，进程继续运行 |\n| `kill -15 1` (SIGTERM)，未注册 handler | 信号被忽略 |\n| `kill -15 1` (SIGTERM)，已注册 handler | 执行 handler |\n\n#### 实际验证\n\n**验证 SIGTERM 需要注册 handler 才生效**：\n\n```bash\n# 使用注册了 SIGTERM handler 的程序\n$ cat > /tmp/test.c << 'EOF'\n#include <signal.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n\nvoid handler(int sig) {\n    printf(\"Caught SIGTERM, exiting\\n\");\n    exit(0);\n}\n\nint main() {\n    signal(SIGTERM, handler);  // 注册 handler\n    while(1) sleep(1);\n    return 0;\n}\nEOF\n\n# 编译并在容器中运行\n# 这时 kill -15 1 就能正常工作了\n```\n\n#### 运维要点\n\n> [!WARNING]\n> **重要提醒**：\n>\n> 1. 容器的 1 号进程无法被 `kill -9` 杀死\n> 2. 如果需要让 1 号进程响应 SIGTERM，必须在程序中注册信号处理函数\n> 3. 使用 `docker stop` 时，Docker 会先发送 SIGTERM，超时后再发送 SIGKILL\n\n**最佳实践**：\n\n```bash\n# 推荐使用 --init 参数启动容器\n# tini 作为 init 进程会正确处理信号\n$ docker run --init -d myapp\n```\n\n---", "subs": ["什么是 init 进程？", "容器中的 init 进程", "Linux 信号机制基础", "为什么 kill", "信号处理规则总结", "实际验证", "运维要点"]}, {"title": "本节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **init 进程** | PID=1，所有用户态进程的祖先 |\n| **SIGNAL_UNKILLABLE** | 内核对 init 进程的保护标志 |\n| **SIGKILL/SIGSTOP** | 对 init 进程永远无效 |\n| **其他信号** | 需要注册 handler 才能生效 |\n\n---", "subs": []}, {"title": "2.2 僵尸进程的产生与清理", "content": "> **核心问题**：为什么容器里会出现大量僵尸进程？它们有什么危害？\n\n#### Linux 进程的五种状态\n\n在 Linux 中，进程可以处于以下五种状态：\n\n```mermaid\ngraph LR\n    R[\"RUNNING<br/>运行态\"] --> S[\"SLEEPING<br/>睡眠态\"]\n    S --> R\n    R --> Z[\"EXIT_ZOMBIE<br/>僵尸态\"]\n    Z --> D[\"EXIT_DEAD<br/>消亡态\"]\n    \n    style Z fill:#ff9999\n    style D fill:#cccccc\n```\n\n| 状态 | 标识 | 说明 |\n|------|------|------|\n| **RUNNING** | R | 正在运行或等待调度 |\n| **SLEEPING** | S/D | 等待资源（可中断/不可中断） |\n| **STOPPED** | T | 被暂停（收到 SIGSTOP） |\n| **EXIT_ZOMBIE** | Z | 进程已结束，等待父进程回收 |\n| **EXIT_DEAD** | - | 已被完全清理，不可见 |\n\n#### 什么是僵尸进程？\n\n**僵尸进程（Zombie Process）** 是已经终止，但父进程还没有调用 `wait()` 系统调用回收其资源的进程。\n\n```bash\n# 查看僵尸进程\n$ ps aux | grep Z\nUSER   PID  STAT  COMMAND\nroot   123  Z     [sleep] <defunct>  # Z 状态表示僵尸进程\n```\n\n**僵尸进程的特点**：\n\n- 进程已经退出，不再执行任何代码\n- 占用的内存已经释放\n- 但仍然占用**进程号（PID）**资源\n- 在进程表中保留一个条目\n\n#### 僵尸进程的产生过程\n\n```mermaid\ngraph TD\n    A[\"父进程 fork 创建子进程\"] --> B[\"子进程运行\"]\n    B --> C[\"子进程调用 exit 退出\"]\n    C --> D[\"进程进入 EXIT_ZOMBIE 状态\"]\n    D --> E{\"父进程调用 wait?\"}\n    \n    E -->|\"是\"| F[\"回收资源<br/>进入 EXIT_DEAD\"]\n    E -->|\"否\"| G[\"保持僵尸状态<br/>占用 PID\"]\n    \n    style G fill:#ff9999\n```\n\n**示例代码**：\n\n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <sys/wait.h>\n\nint main() {\n    pid_t pid = fork();\n    \n    if (pid == 0) {\n        // 子进程：立即退出\n        printf(\"Child process exiting\\n\");\n        exit(0);\n    } else {\n        // 父进程：不调用 wait()，导致子进程成为僵尸\n        printf(\"Parent sleeping, child becomes zombie\\n\");\n        sleep(60);  // 在这 60 秒内，子进程是僵尸状态\n    }\n    return 0;\n}\n```\n\n```bash\n# 运行程序后查看\n$ ps aux | grep defunct\nroot   456  Z   0.0  0.0  0     0  ?  Z  15:30  0:00 [a.out] <defunct>\n```\n\n#### 僵尸进程的危害\n\n> [!CAUTION]\n> **危害**：僵尸进程虽然不占用内存，但会**耗尽系统的 PID 资源**！\n\nLinux 系统的 PID 数量有限：\n\n```bash\n# 查看系统最大 PID 数\n$ cat /proc/sys/kernel/pid_max\n32768  # 默认最多 32768 个进程\n```\n\n当僵尸进程积累过多时：\n\n- PID 资源耗尽\n- 无法创建新进程\n- 系统进入不可用状态\n\n#### 容器中的僵尸进程问题\n\n**典型场景**：容器 init 进程是 shell 脚本\n\n```dockerfile\n# Dockerfile\nFROM centos\nCOPY start.sh /start.sh\nCMD [\"/bin/sh\", \"/start.sh\"]\n```\n\n```bash\n# start.sh\n#!/bin/sh\n# 启动多个后台进程\n./app1 &\n./app2 &\n./app3 &\nwait  # 只等待最后一个后台进程\n```\n\n**问题**：\n\n- shell 脚本启动的子进程退出后\n- shell 没有调用 `wait()` 回收所有子进程\n- 导致僵尸进程积累\n\n```bash\n# 容器内查看\n$ ps aux\nPID   STAT   COMMAND\n1     S      /bin/sh /start.sh\n123   Z      [app1] <defunct>\n124   Z      [app2] <defunct>\n```\n\n#### PIDs Cgroup：限制进程数量\n\n为了防止僵尸进程耗尽系统 PID，可以使用 **pids Cgroup** 限制容器的进程数：\n\n```bash\n# 限制容器最多 100 个进程\n$ docker run --pids-limit 100 myapp\n```\n\n对应的 Cgroup 配置：\n\n```bash\n$ cat /sys/fs/cgroup/pids/docker/<container_id>/pids.max\n100\n\n$ cat /sys/fs/cgroup/pids/docker/<container_id>/pids.current\n15  # 当前进程数\n```\n\n**当达到上限时**：\n\n```bash\n# 尝试创建新进程会失败\n$ fork()\nError: Resource temporarily unavailable\n```\n\n#### 正确回收僵尸进程\n\n**方法1：父进程调用 wait()**\n\n```c\n#include <sys/wait.h>\n\nint main() {\n    pid_t pid = fork();\n    \n    if (pid == 0) {\n        // 子进程\n        exit(0);\n    } else {\n        // 父进程：等待子进程结束\n        int status;\n        wait(&status);  // 或 waitpid(pid, &status, 0);\n        printf(\"Child collected\\n\");\n    }\n    return 0;\n}\n```\n\n**方法2：信号处理方式回收**\n\n```c\n#include <signal.h>\n#include <sys/wait.h>\n\nvoid sigchld_handler(int sig) {\n    // 回收所有已退出的子进程\n    while (waitpid(-1, NULL, WNOHANG) > 0);\n}\n\nint main() {\n    // 注册 SIGCHLD 信号处理函数\n    signal(SIGCHLD, sigchld_handler);\n    \n    // 创建子进程...\n    // 子进程退出时会触发 SIGCHLD 信号\n}\n```\n\n#### 容器 init 进程的职责\n\n容器的 1 号进程必须承担以下职责：\n\n1. **回收孤儿进程**：当容器内某个进程的父进程退出，其子进程会被 init 进程收养\n2. **清理僵尸进程**：主动回收已退出的子进程\n\n```mermaid\ngraph TD\n    A[\"应用进程 A\"] -->|\"启动\"| B[\"子进程 B\"]\n    A -->|\"意外退出\"| C[\"进程 B 成为孤儿\"]\n    C -->|\"被收养\"| Init[\"init 进程 PID=1\"]\n    B -->|\"退出\"| Z[\"僵尸进程\"]\n    Init -->|\"wait 回收\"| Clean[\"清理完成\"]\n    \n    style Z fill:#ff9999\n```\n\n#### 使用 tini 作为 init 进程\n\n**tini** 是一个轻量级 init 进程，专门为容器设计：\n\n```dockerfile\nFROM centos\n\n# 安装 tini\nRUN yum install -y tini\n\n# 使用 tini 作为 init 进程\nENTRYPOINT [\"/usr/bin/tini\", \"--\"]\nCMD [\"/app/start.sh\"]\n```\n\n或使用 Docker 的 `--init` 参数：\n\n```bash\ndocker run --init -d myapp\n```\n\n**tini 的功能**：\n\n- 正确转发信号给子进程\n- 自动回收僵尸进程\n- 确保容器能正常退出\n\n#### 实战排查\n\n**问题现象**：\n\n```bash\n$ docker exec myapp ps aux | grep Z\nroot   234  Z  [worker] <defunct>\nroot   235  Z  [worker] <defunct>\nroot   236  Z  [worker] <defunct>\n```\n\n**排查步骤**：\n\n```bash\n# 1. 查看僵尸进程的父进程\n$ ps -ef | grep defunct\nUID    PID   PPID  STAT\nroot   234   1     Z    # PPID=1，父进程是 init\n\n# 2. 检查 init 进程是什么\n$ docker exec myapp cat /proc/1/cmdline\n/bin/sh/start.sh  # Shell 脚本，不会回收僵尸进程\n\n# 3. 解决方案：使用 --init 或 tini\n$ docker stop myapp\n$ docker run --init -d --name myapp myapp:latest\n```\n\n---", "subs": ["Linux 进程的五种状态", "什么是僵尸进程？", "僵尸进程的产生过程", "僵尸进程的危害", "容器中的僵尸进程问题", "PIDs Cgroup", "正确回收僵尸进程", "容器 init 进程的职责", "使用 tini 作为 init 进程", "实战排查"]}, {"title": "本节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **僵尸进程** | 已退出但未被父进程回收的进程 |\n| **危害** | 占用 PID 资源，可能导致无法创建新进程 |\n| **回收方法** | 父进程调用 `wait()` 或 `waitpid()` |\n| **pids Cgroup** | 限制容器进程数量，防止 PID 耗尽 |\n| **容器最佳实践** | 使用 `--init` 或 tini 作为 init 进程 |\n\n> **运维提示**：定期检查容器中的僵尸进程数量，如果持续增长，需要修改应用代码或使用合适的 init 进程。\n\n---", "subs": []}, {"title": "2.3 容器优雅退出与信号转发", "content": "> **核心问题**：为什么在容器中的进程被强制杀死（SIGKILL）而不是收到 SIGTERM 优雅退出？\n\n#### 问题场景\n\n当我们使用 `docker stop` 停止容器时，期望应用程序能收到 SIGTERM 信号，完成清理工作后优雅退出。但实际情况往往是：\n\n```bash\n# 停止容器\n$ docker stop myapp\n# 等待 10 秒超时后...\n# 容器被强制终止（SIGKILL）\n```\n\n应用程序日志中没有看到任何清理操作，数据可能丢失。\n\n#### docker stop 的工作流程\n\n```mermaid\ngraph TD\n    A[\"docker stop\"] --> B[\"发送 SIGTERM 给 PID 1\"]\n    B --> C[\"等待 10 秒（可配置）\"]\n    C --> D{\"进程退出了?\"}\n    D -->|\"是\"| E[\"容器正常停止\"]\n    D -->|\"否\"| F[\"发送 SIGKILL 强制终止\"]\n    F --> G[\"容器强制停止\"]\n    \n    style F fill:#ff9999\n```\n\n**关键点**：\n\n- Docker 只向容器的 **PID 1 进程**发送 SIGTERM\n- 如果 PID 1 在超时时间内没有退出，则发送 SIGKILL\n\n#### 信号不传递的根本原因\n\n容器的 init 进程（PID 1）收到 SIGTERM 后，**默认不会自动转发给子进程**。\n\n```mermaid\ngraph TD\n    subgraph Container[\"容器\"]\n        Init[\"init 进程 PID=1<br/>shell 脚本\"]\n        App[\"应用进程 PID=10\"]\n    end\n    \n    SIGTERM[\"SIGTERM\"] -->|\"发送\"| Init\n    Init -.->|\"不转发\"| App\n    \n    style App fill:#ffcccc\n```\n\n**典型问题场景**：\n\n```dockerfile\n# Dockerfile\nFROM centos\nCOPY app /app\nCMD [\"/bin/sh\", \"-c\", \"/app/start.sh\"]\n```\n\n这种情况下：\n\n1. PID 1 是 `/bin/sh`\n2. 应用程序是 shell 的子进程（PID > 1）\n3. shell 收到 SIGTERM 后退出\n4. **内核向该 Namespace 的所有进程发送 SIGKILL**\n\n#### 内核源码分析\n\n当 init 进程退出时，内核会向同一 Namespace 的其他进程发送 SIGKILL：\n\n```c\n// kernel/exit.c - zap_pid_ns_processes()\nvoid zap_pid_ns_processes(struct pid_namespace *pid_ns)\n{\n    // ...\n    \n    // 向 namespace 中的所有其他进程发送 SIGKILL\n    nr = next_pidmap(pid_ns, 1);\n    while (nr > 0) {\n        task = pid_task(find_vpid(nr), PIDTYPE_PID);\n        if (task && !is_child_reaper(task))\n            group_send_sig_info(SIGKILL, SEND_SIG_PRIV, task, PIDTYPE_MAX);\n        nr = next_pidmap(pid_ns, nr);\n    }\n}\n```\n\n**这解释了为什么子进程收到的是 SIGKILL 而不是 SIGTERM**。\n\n#### 解决方案\n\n##### 方案1：让应用程序直接作为 PID 1\n\n使用 `exec` 形式的 CMD/ENTRYPOINT：\n\n```dockerfile\n# 正确写法 - exec 形式\nCMD [\"/app/myapp\"]\n\n# 错误写法 - shell 形式（会启动 /bin/sh）\nCMD /app/myapp\n```\n\n比较两种写法的进程树：\n\n| 写法 | PID 1 | 应用进程 |\n|------|--------|----------|\n| `CMD [\"/app/myapp\"]` | `/app/myapp` | 就是 PID 1 |\n| `CMD /app/myapp` | `/bin/sh -c` | PID > 1 |\n\n##### 方案2：使用 tini 转发信号\n\ntini 会正确转发 SIGTERM 给子进程：\n\n```dockerfile\nFROM centos\n\n# 安装 tini\nRUN yum install -y tini\n\n# tini 作为 init 进程\nENTRYPOINT [\"/usr/bin/tini\", \"--\"]\nCMD [\"/app/start.sh\"]\n```\n\n或使用 Docker 内置的 tini：\n\n```bash\ndocker run --init -d myapp\n```\n\n**tini 的信号转发流程**：\n\n```mermaid\ngraph TD\n    A[\"docker stop\"] --> B[\"SIGTERM 发送给 tini PID=1\"]\n    B --> C[\"tini 转发 SIGTERM 给子进程\"]\n    C --> D[\"应用进程收到 SIGTERM\"]\n    D --> E[\"应用执行清理逻辑\"]\n    E --> F[\"应用退出\"]\n    F --> G[\"tini 退出\"]\n    G --> H[\"容器正常停止\"]\n```\n\n##### 方案3：Shell 脚本中使用 exec\n\n如果必须使用 shell 脚本启动：\n\n```bash\n#!/bin/sh\n# start.sh\n\n# 设置信号处理\ntrap 'kill -TERM $PID; wait $PID' TERM\n\n# 使用 exec 替换 shell 进程\nexec /app/myapp\n\n# 或者后台运行并等待\n/app/myapp &\nPID=$!\nwait $PID\n```\n\n##### 方案4：在应用中注册信号处理\n\n```python\n# Python 示例\nimport signal\nimport sys\n\ndef graceful_shutdown(signum, frame):\n    print(\"Received SIGTERM, cleaning up...\")\n    # 执行清理操作\n    sys.exit(0)\n\nsignal.signal(signal.SIGTERM, graceful_shutdown)\n\n# 主程序逻辑\nwhile True:\n    # ...\n    pass\n```\n\n```go\n// Go 示例\npackage main\n\nimport (\n    \"os\"\n    \"os/signal\"\n    \"syscall\"\n)\n\nfunc main() {\n    sigChan := make(chan os.Signal, 1)\n    signal.Notify(sigChan, syscall.SIGTERM)\n    \n    go func() {\n        <-sigChan\n        // 执行清理操作\n        os.Exit(0)\n    }()\n    \n    // 主程序逻辑\n}\n```\n\n#### 验证信号是否正确传递\n\n```bash\n# 1. 启动容器\n$ docker run -d --name test myapp\n\n# 2. 查看进程树\n$ docker exec test ps -ef\nUID   PID  PPID  CMD\nroot  1    0     /app/myapp   # 应用直接是 PID 1 ✓\n\n# 3. 停止容器并观察日志\n$ docker stop test\n$ docker logs test\n# 应该看到 \"Received SIGTERM\" 的清理日志\n```\n\n#### 配置停止超时时间\n\n```bash\n# 设置更长的超时时间（30秒）\n$ docker stop -t 30 myapp\n```\n\nDocker Compose:\n\n```yaml\nservices:\n  myapp:\n    image: myapp:latest\n    stop_grace_period: 30s\n```\n\nKubernetes:\n\n```yaml\nspec:\n  terminationGracePeriodSeconds: 30\n```\n\n---", "subs": ["问题场景", "docker stop 的工作流程", "信号不传递的根本原因", "内核源码分析", "解决方案", "验证信号是否正确传递", "配置停止超时时间"]}, {"title": "2.3 节小结", "content": "| 问题 | 原因 | 解决方案 |\n|------|------|----------|\n| 子进程收到 SIGKILL | init 进程不转发信号 | 使用 tini 或 --init |\n| 应用不是 PID 1 | 使用了 shell 形式 CMD | 改用 exec 形式 |\n| 清理逻辑未执行 | 没有注册信号 handler | 在代码中处理 SIGTERM |\n\n> **最佳实践**：\n>\n> 1. 使用 exec 形式的 `CMD [\"/app/myapp\"]`\n> 2. 或使用 `docker run --init`\n> 3. 应用程序中注册 SIGTERM 处理函数\n\n---", "subs": []}, {"title": "2.4 CPU Cgroup 资源限制", "content": "> **核心问题**：如何限制容器的 CPU 使用量？\n\n#### CPU Cgroup 概述\n\nCPU Cgroup 是 Linux 内核提供的 CPU 资源控制机制，主要包含三种控制方式：\n\n| 控制方式 | 作用 | 适用场景 |\n|----------|------|----------|\n| **CPU 配额** | 限制 CPU 使用上限 | 防止容器占用过多 CPU |\n| **CPU 权重** | 设置 CPU 分配优先级 | 多容器竞争时的资源分配 |\n| **CPU 绑定** | 指定可使用的 CPU 核心 | 性能敏感型应用 |\n\n#### CPU Cgroup 文件系统\n\n```bash\n# 查看 CPU Cgroup 挂载点\n$ mount | grep cgroup | grep cpu\ncgroup on /sys/fs/cgroup/cpu,cpuacct type cgroup (rw,cpu,cpuacct)\n\n# 容器的 CPU Cgroup 目录\n$ ls /sys/fs/cgroup/cpu/docker/<container_id>/\ncpu.cfs_period_us\ncpu.cfs_quota_us\ncpu.shares\ncpu.stat\ntasks\n```\n\n#### CPU 配额限制（CFS Bandwidth Control）\n\n通过 `cpu.cfs_quota_us` 和 `cpu.cfs_period_us` 两个参数限制 CPU 使用上限。\n\n**核心公式**：\n\n```\nCPU 使用率上限 = cpu.cfs_quota_us / cpu.cfs_period_us\n```\n\n| 参数 | 含义 | 默认值 |\n|------|------|--------|\n| `cpu.cfs_period_us` | 调度周期（微秒） | 100000（100ms） |\n| `cpu.cfs_quota_us` | 周期内可用时间（微秒） | -1（无限制） |\n\n**配置示例**：\n\n| 配置 | quota | period | CPU 上限 |\n|------|-------|--------|----------|\n| 0.5 CPU | 50000 | 100000 | 50% |\n| 1 CPU | 100000 | 100000 | 100% |\n| 2 CPU | 200000 | 100000 | 200% |\n\n```bash\n# 限制容器使用 0.5 个 CPU\n$ echo 100000 > /sys/fs/cgroup/cpu/docker/<id>/cpu.cfs_period_us\n$ echo 50000 > /sys/fs/cgroup/cpu/docker/<id>/cpu.cfs_quota_us\n```\n\n**Docker 命令**：\n\n```bash\n# --cpus 参数（推荐）\n$ docker run --cpus=0.5 myapp      # 最多使用 0.5 个 CPU\n$ docker run --cpus=2 myapp        # 最多使用 2 个 CPU\n\n# 或分别指定 quota 和 period\n$ docker run --cpu-quota=50000 --cpu-period=100000 myapp\n```\n\n#### CPU 权重（CPU Shares）\n\n`cpu.shares` 用于设置 CPU 时间片的**相对权重**，只在 CPU 资源竞争时生效。\n\n```bash\n# 默认权重为 1024\n$ cat /sys/fs/cgroup/cpu/docker/<id>/cpu.shares\n1024\n```\n\n**权重分配示例**：\n\n| 容器 | shares | CPU 占比（竞争时） |\n|------|--------|-------------------|\n| 容器A | 1024 | 1/(1+2) = 33% |\n| 容器B | 2048 | 2/(1+2) = 67% |\n\n**Docker 命令**：\n\n```bash\n# 设置容器 CPU 权重\n$ docker run --cpu-shares=512 myapp   # 降低优先级\n$ docker run --cpu-shares=2048 myapp  # 提高优先级\n```\n\n> [!NOTE]\n> `cpu.shares` 只在 CPU 资源紧张时生效。如果系统有空闲 CPU，低权重容器也可以使用更多 CPU。\n\n#### CPU 绑定（cpuset）\n\n使用 `cpuset` 子系统将容器绑定到特定 CPU 核心。\n\n```bash\n# 查看 cpuset 配置\n$ cat /sys/fs/cgroup/cpuset/docker/<id>/cpuset.cpus\n0-3  # 可使用 CPU 0、1、2、3\n```\n\n**Docker 命令**：\n\n```bash\n# 绑定到 CPU 0 和 1\n$ docker run --cpuset-cpus=0,1 myapp\n\n# 绑定到 CPU 0-3\n$ docker run --cpuset-cpus=0-3 myapp\n```\n\n#### 三种控制方式对比\n\n| 特性 | CPU 配额 | CPU 权重 | CPU 绑定 |\n|------|----------|----------|----------|\n| 参数 | cfs_quota_us | cpu.shares | cpuset.cpus |\n| 类型 | 硬限制 | 软限制 | 硬限制 |\n| 作用时机 | 始终生效 | 竞争时生效 | 始终生效 |\n| 典型场景 | 防止资源滥用 | 优先级调度 | 性能优化 |\n\n#### Kubernetes 中的配置\n\n```yaml\napiVersion: v1\nkind: Pod\nspec:\n  containers:\n  - name: myapp\n    resources:\n      requests:\n        cpu: \"500m\"    # 0.5 CPU（影响调度）\n      limits:\n        cpu: \"1000m\"   # 1 CPU（硬限制）\n```\n\n**换算关系**：`1000m` = 1 CPU = quota 100000 / period 100000\n\n---", "subs": ["CPU Cgroup 概述", "CPU Cgroup 文件系统", "CPU 配额限制（CFS Bandwidth Control）", "CPU 权重（CPU Shares）", "CPU 绑定（cpuset）", "三种控制方式对比", "Kubernetes 中的配置"]}, {"title": "2.4 节小结", "content": "| 控制方式 | 参数 | Docker 参数 | 说明 |\n|----------|------|-------------|------|\n| **配额限制** | cfs_quota_us/cfs_period_us | --cpus | 限制 CPU 使用上限 |\n| **权重分配** | cpu.shares | --cpu-shares | 竞争时的优先级 |\n| **核心绑定** | cpuset.cpus | --cpuset-cpus | 绑定特定 CPU |\n\n> **运维建议**：生产环境建议同时设置 `--cpus` 和 `--cpu-shares`\n\n---\n\n<!-- 后续章节待补充 -->", "subs": []}, {"title": "2.5 容器 CPU 使用率的正确计算", "content": "> **核心问题**：为什么在容器内运行 `top` 看到的 CPU 使用率不准确？\n\n#### 问题现象\n\n在容器中运行 `top` 命令，看到的 CPU 使用率是**整个宿主机**的，而不是容器的：\n\n```bash\n# 在容器内运行 top\n$ docker exec myapp top\n%Cpu(s):  5.9 us,  2.3 sy,  0.0 ni, 91.2 id...\n# 这是宿主机的 CPU 使用率，不是容器的！\n```\n\n#### 原因分析\n\n`top` 命令读取的是 `/proc/stat` 文件，而 **`/proc` 文件系统没有被 Namespace 隔离**：\n\n```bash\n# 容器内和宿主机读取的是同一个文件\n$ cat /proc/stat\ncpu  12345 6789 ...  # 宿主机全局 CPU 统计\n```\n\n#### Linux CPU 使用率计算原理\n\n##### 系统级 CPU 使用率（/proc/stat）\n\n```bash\n$ cat /proc/stat\ncpu  10132153 290696 3084719 46828483 16683 0 25195 0 0 0\n#    user     nice   system  idle     iowait irq softirq ...\n```\n\n**计算公式**：\n\n```\nCPU 使用率 = (1 - idle_time / total_time) × 100%\n\ntotal_time = user + nice + system + idle + iowait + irq + softirq\n```\n\n##### 进程级 CPU 使用率（/proc/[pid]/stat）\n\n```bash\n$ cat /proc/12345/stat\n12345 (myapp) S ... 10000 5000 ...\n#                   utime stime（第14、15个字段）\n```\n\n| 字段 | 含义 |\n|------|------|\n| utime | 进程用户态 CPU 时间（clock ticks） |\n| stime | 进程内核态 CPU 时间（clock ticks） |\n\n**单进程 CPU 使用率计算**：\n\n```\n进程 CPU 使用率 = ((utime2 - utime1) + (stime2 - stime1)) / (total_time2 - total_time1) × 100%\n```\n\n> [!NOTE]\n> clock ticks 通常是 100 Hz（每秒 100 次），可通过 `getconf CLK_TCK` 查看。\n\n#### 容器 CPU 使用率的正确方法\n\n使用 **CPU Cgroup** 提供的 `cpuacct.stat` 文件：\n\n```bash\n# 查看容器的 CPU 统计\n$ cat /sys/fs/cgroup/cpu,cpuacct/docker/<container_id>/cpuacct.stat\nuser 10000   # 用户态 CPU ticks\nsystem 5000  # 内核态 CPU ticks\n```\n\n这个文件统计的是**容器内所有进程**的 CPU 时间总和。\n\n#### 容器 CPU 使用率计算方法\n\n```mermaid\ngraph TD\n    A[\"读取 cpuacct.stat<br/>t1 时刻\"] --> B[\"等待 Δt 时间\"]\n    B --> C[\"读取 cpuacct.stat<br/>t2 时刻\"]\n    C --> D[\"计算 CPU 时间差<br/>Δcpu = (user2+sys2) - (user1+sys1)\"]\n    D --> E[\"计算 CPU 使用率<br/>rate = Δcpu / (Δt × tick_rate × cpu_count)\"]\n```\n\n**计算公式**：\n\n```\n容器 CPU 使用率 = (cpuacct_usage_t2 - cpuacct_usage_t1) / (Δt × 10^9) × 100%\n```\n\n也可以使用 `cpuacct.usage`（单位：纳秒）：\n\n```bash\n$ cat /sys/fs/cgroup/cpu,cpuacct/docker/<id>/cpuacct.usage\n123456789000  # 纳秒\n```\n\n#### 实现脚本\n\n```bash\n#!/bin/bash\n# 计算容器 CPU 使用率\n\nCGROUP_PATH=\"/sys/fs/cgroup/cpu,cpuacct/docker/$1\"\n\n# 第一次采样\nusage1=$(cat $CGROUP_PATH/cpuacct.usage)\ntime1=$(date +%s%N)\n\nsleep 1\n\n# 第二次采样\nusage2=$(cat $CGROUP_PATH/cpuacct.usage)\ntime2=$(date +%s%N)\n\n# 计算 CPU 使用率\ndelta_usage=$((usage2 - usage1))\ndelta_time=$((time2 - time1))\n\ncpu_usage=$(echo \"scale=2; $delta_usage * 100 / $delta_time\" | bc)\necho \"Container CPU Usage: ${cpu_usage}%\"\n```\n\n#### Docker 和 cAdvisor 的做法\n\n**docker stats** 命令就是使用这种方法：\n\n```bash\n$ docker stats --no-stream myapp\nCONTAINER   CPU %   MEM USAGE / LIMIT\nmyapp       25.5%   128MiB / 512MiB\n```\n\n**cAdvisor** 同样读取 Cgroup 文件系统来获取容器指标。\n\n#### Kubernetes 场景\n\nKubernetes 通过 kubelet 内置的 cAdvisor 收集容器指标：\n\n```bash\n# 查看 Pod 的 CPU 使用\n$ kubectl top pod myapp\nNAME    CPU(cores)   MEMORY(bytes)\nmyapp   250m         128Mi\n```\n\n#### 常见问题排查\n\n| 现象 | 原因 | 解决方案 |\n|------|------|----------|\n| top 显示不准 | 读取的是宿主机 /proc/stat | 使用 cpuacct.stat |\n| 容器内 CPU 100% | 可能被 cfs_quota 限制 | 检查 CPU 配额设置 |\n| CPU 使用率计算为负 | 进程迁移或 Cgroup 变化 | 增加采样间隔 |\n\n#### lxcfs 解决方案\n\n**lxcfs** 可以让容器内的 `/proc` 文件返回容器级别的资源信息：\n\n```bash\n# 在宿主机安装 lxcfs\n$ yum install lxcfs\n\n# 启动容器时挂载 lxcfs\n$ docker run -v /var/lib/lxcfs/proc/cpuinfo:/proc/cpuinfo:rw \\\n             -v /var/lib/lxcfs/proc/stat:/proc/stat:rw \\\n             myapp\n```\n\n这样容器内的 `top` 就能显示正确的 CPU 使用率了。\n\n---", "subs": ["问题现象", "原因分析", "Linux CPU 使用率计算原理", "容器 CPU 使用率的正确方法", "容器 CPU 使用率计算方法", "实现脚本", "Docker 和 cAdvisor 的做法", "Kubernetes 场景", "常见问题排查", "lxcfs 解决方案"]}, {"title": "2.5 节小结", "content": "| 方法 | 数据源 | 准确性 |\n|------|--------|--------|\n| 容器内 top | /proc/stat | ❌ 不准确（宿主机数据） |\n| cpuacct.stat | Cgroup | ✅ 准确 |\n| docker stats | Cgroup | ✅ 准确 |\n| lxcfs | 虚拟 /proc | ✅ 准确 |\n\n> **运维要点**：监控容器 CPU 使用时，应使用 Cgroup 提供的 `cpuacct.stat` 或 `cpuacct.usage`，而不是依赖容器内的 `top` 命令。\n\n---", "subs": []}, {"title": "2.6 Load Average 与系统性能", "content": "> **核心问题**：为什么加了 CPU Cgroup 限制，容器还是很慢？\n\n#### 问题现象\n\n即使容器设置了 CPU 配额，应用仍然响应缓慢，而 CPU 使用率并没有达到限制。同时观察到 Load Average 异常高：\n\n```bash\n$ uptime\nload average: 8.50, 7.20, 6.80  # 在 4 核机器上这个值很高\n```\n\n#### 什么是 Load Average？\n\n**Load Average（平均负载）** 表示系统在过去 1分钟、5分钟、15分钟内的**平均活跃进程数**。\n\n```bash\n$ cat /proc/loadavg\n8.50 7.20 6.80 2/150 12345\n# 1分钟  5分钟  15分钟  运行中/总进程数\n```\n\n> [!IMPORTANT]\n> Load Average 包含的不仅是 CPU 运行队列中的进程，还包括 **D 状态（不可中断睡眠）** 的进程！\n\n#### Load Average 的组成\n\n| 进程状态 | 说明 | 是否计入 Load Average |\n|----------|------|----------------------|\n| TASK_RUNNING (R) | 正在运行或等待调度 | ✅ 是 |\n| TASK_UNINTERRUPTIBLE (D) | 不可中断睡眠 | ✅ 是 |\n| TASK_INTERRUPTIBLE (S) | 可中断睡眠 | ❌ 否 |\n\n#### D 状态进程详解\n\n**D 状态（TASK_UNINTERRUPTIBLE）** 的进程通常在等待：\n\n- 磁盘 I/O 操作\n- 网络 I/O（NFS 等）\n- 信号量或锁\n\n```bash\n# 查看 D 状态进程\n$ ps aux | awk '$8 ~ /D/'\nUSER   PID  %CPU %MEM STAT COMMAND\nroot   1234  0.0  0.1  D    dd if=/dev/sda ...\n```\n\n**D 状态的特点**：\n\n- 进程不响应信号（包括 SIGKILL）\n- 必须等待 I/O 完成才能退出该状态\n- 会计入 Load Average，但不消耗 CPU\n\n#### 为什么 CPU Cgroup 无法解决这个问题？\n\nCPU Cgroup 只能限制 **CPU 时间片**的使用，但：\n\n1. **D 状态进程不消耗 CPU**，它们在等待 I/O\n2. **CPU Cgroup 无法限制 I/O 等待**\n3. 大量 D 状态进程会导致 Load Average 升高\n\n#### 实战排查\n\n```bash\n# 步骤1：确认 Load Average 高\n$ uptime\nload average: 8.50, 7.20, 6.80\n\n# 步骤2：检查 CPU 使用率（如果 idle 高说明不是 CPU 瓶颈）\n$ top\n%Cpu(s): 25.0 us, 5.0 sy, 0.0 ni, 70.0 id...\n\n# 步骤3：统计 D 状态进程数量\n$ ps aux | awk '$8 ~ /D/ {count++} END {print count}'\n15\n\n# 步骤4：查看具体是哪些进程\n$ ps aux | awk '$8 ~ /D/ {print $0}'\n\n# 步骤5：分析等待原因\n$ cat /proc/<pid>/wchan\nwait_on_page_bit  # 说明在等待磁盘页面\n```\n\n#### 常见 D 状态原因与解决方案\n\n| 原因 | 症状 | 解决方案 |\n|------|------|----------|\n| 磁盘 I/O 慢 | iowait 高 | 优化磁盘、使用 SSD |\n| NFS 挂载问题 | 访问 NFS 路径卡住 | 检查 NFS 服务器 |\n| 内核 bug | 进程长期卡在 D 状态 | 升级内核 |\n| 存储设备故障 | dmesg 有错误日志 | 检查存储设备 |\n\n#### Load Average 判断标准\n\n以 CPU 核心数为基准：\n\n| Load Average / CPU 核心数 | 状态 |\n|--------------------------|------|\n| < 0.7 | 轻载 |\n| 0.7 - 1.0 | 理想 |\n| 1.0 - 2.0 | 需要关注 |\n| > 2.0 | 过载，需要排查 |\n\n---", "subs": ["问题现象", "什么是 Load Average？", "Load Average 的组成", "D 状态进程详解", "为什么 CPU Cgroup 无法解决这个问题？", "实战排查", "常见 D 状态原因与解决方案", "Load Average 判断标准"]}, {"title": "2.6 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **Load Average** | 包含 RUNNING + D 状态进程的平均数 |\n| **D 状态** | 不可中断睡眠，通常等待 I/O |\n| **CPU Cgroup 局限** | 只能限制 CPU 使用，无法限制 I/O 等待 |\n| **排查方法** | ps aux 查看 D 状态进程，分析 wchan |\n\n> **运维要点**：Load Average 高不一定是 CPU 问题，要先排查 D 状态进程\n\n---", "subs": []}, {"title": "第二章小结", "content": "| 节 | 主题 | 核心要点 |\n|----|------|----------|\n| 2.1 | init 进程与信号 | 1号进程的特殊保护机制 |\n| 2.2 | 僵尸进程 | wait() 回收、pids Cgroup 限制 |\n| 2.3 | 优雅退出 | 信号转发、exec 形式 CMD |\n| 2.4 | CPU Cgroup | 配额、权重、绑核 |\n| 2.5 | CPU 使用率 | cpuacct.stat、lxcfs |\n| 2.6 | Load Average | D 状态进程、I/O 瓶颈排查 |\n\n---\n\n<!-- 后续章节待补充 -->", "subs": []}]}, {"title": "第三章：容器内存管理", "sections": [{"title": "3.1 Memory Cgroup 与 OOM Killer", "content": "> **核心问题**：为什么我的容器会被 OOMKilled？\n\n#### 问题现象\n\n容器突然被终止，状态显示为 OOMKilled：\n\n```bash\n$ docker inspect myapp --format '{{.State.OOMKilled}}'\ntrue\n\n$ kubectl describe pod myapp\nLast State:  Terminated\nReason:      OOMKilled\nExit Code:   137\n```\n\n#### Linux 内存管理基础\n\n##### 内存过载提交（Overcommit）\n\nLinux 允许进程**申请超过实际物理内存**的虚拟内存：\n\n```bash\n# 查看 overcommit 策略\n$ cat /proc/sys/vm/overcommit_memory\n0  # 0=启发式, 1=总是允许, 2=严格限制\n```\n\n| 值 | 策略 | 说明 |\n|----|------|------|\n| 0 | 启发式 | 内核估算是否允许 |\n| 1 | 总是允许 | 允许任意大小的内存申请 |\n| 2 | 严格限制 | 不允许超过 swap + 物理内存 × ratio |\n\n**为什么需要 Overcommit？**\n\n- 进程申请内存（malloc）时不一定立即使用\n- 实际分配物理内存是在首次访问时（缺页中断）\n- 可以提高内存利用率\n\n##### OOM Killer 机制\n\n当物理内存真正不足时，Linux 会触发 **OOM Killer** 杀死进程释放内存。\n\n**选择进程的标准**：`oom_badness()` 函数\n\n```c\n// 简化的 oom_badness 计算\noom_score = 进程使用的物理内存页面数 + oom_score_adj 调整值\n```\n\n```bash\n# 查看进程的 OOM 分数\n$ cat /proc/<pid>/oom_score\n150\n\n# 查看/设置 OOM 调整值（-1000 到 1000）\n$ cat /proc/<pid>/oom_score_adj\n0\n```\n\n| oom_score_adj 值 | 说明 |\n|------------------|------|\n| -1000 | 永不被 OOM Kill |\n| 0 | 默认值 |\n| 1000 | 最优先被 Kill |\n\n#### Memory Cgroup 详解\n\nMemory Cgroup 为容器提供**独立的内存限制和 OOM 机制**。\n\n##### 核心参数\n\n| 参数 | 说明 |\n|------|------|\n| `memory.limit_in_bytes` | 内存使用上限（硬限制） |\n| `memory.usage_in_bytes` | 当前内存使用量 |\n| `memory.max_usage_in_bytes` | 历史最大使用量 |\n| `memory.oom_control` | OOM 控制（是否触发 OOM Killer） |\n| `memory.stat` | 详细内存统计信息 |\n\n```bash\n# 查看容器内存限制\n$ cat /sys/fs/cgroup/memory/docker/<id>/memory.limit_in_bytes\n536870912  # 512MB\n\n# 查看当前使用量\n$ cat /sys/fs/cgroup/memory/docker/<id>/memory.usage_in_bytes\n268435456  # 256MB\n```\n\n##### Docker 配置\n\n```bash\n# 限制容器内存为 512MB\n$ docker run -m 512m myapp\n\n# 限制内存 + swap 总量\n$ docker run -m 512m --memory-swap 1g myapp\n```\n\n##### Kubernetes 配置\n\n```yaml\napiVersion: v1\nkind: Pod\nspec:\n  containers:\n  - name: myapp\n    resources:\n      requests:\n        memory: \"256Mi\"   # 调度参考\n      limits:\n        memory: \"512Mi\"   # 硬限制\n```\n\n#### Memory Cgroup 的 OOM Killer\n\n当容器内存使用达到 `memory.limit_in_bytes` 时：\n\n```mermaid\ngraph TD\n    A[\"进程申请内存\"] --> B{\"usage < limit?\"}\n    B -->|\"是\"| C[\"分配成功\"]\n    B -->|\"否\"| D[\"尝试回收内存\"]\n    D --> E{\"回收后 usage < limit?\"}\n    E -->|\"是\"| C\n    E -->|\"否\"| F{\"oom_control?\"}\n    F -->|\"允许OOM\"| G[\"触发 Cgroup OOM Killer\"]\n    F -->|\"禁止OOM\"| H[\"进程阻塞等待\"]\n    G --> I[\"杀死 Cgroup 内进程\"]\n```\n\n**注意**：Cgroup OOM Killer 只会杀死**该 Cgroup 内**的进程，不会影响其他容器。\n\n#### 排查 OOM 问题\n\n##### 步骤1：检查内核日志\n\n```bash\n# 查看系统 OOM 日志\n$ dmesg | grep -i \"oom\\|killed\"\n[12345.678] Memory cgroup out of memory: Kill process 1234 (myapp)\n\n# 或使用 journalctl\n$ journalctl -k | grep -i oom\n```\n\n##### 步骤2：检查容器内存使用\n\n```bash\n# 查看容器内存状态\n$ docker stats --no-stream myapp\nCONTAINER   MEM USAGE / LIMIT   MEM %\nmyapp       500MiB / 512MiB     97.66%\n\n# 查看 Cgroup 详细统计\n$ cat /sys/fs/cgroup/memory/docker/<id>/memory.stat\ncache 134217728\nrss 268435456\n...\n```\n\n##### 步骤3：分析内存使用\n\n```bash\n# 容器内查看进程内存\n$ docker exec myapp ps aux --sort=-%mem\nUSER   PID  %MEM  RSS     COMMAND\nroot   1    45.0  230000  java -Xmx512m ...\n```\n\n#### OOM 预防与处理\n\n##### 方案1：增加内存限制\n\n```bash\n# Docker\n$ docker run -m 1g myapp\n\n# Kubernetes\nresources:\n  limits:\n    memory: \"1Gi\"\n```\n\n##### 方案2：优化应用内存使用\n\n```bash\n# Java 应用设置合理的堆大小\n$ java -Xmx400m -Xms400m -XX:+UseContainerSupport myapp.jar\n```\n\n> [!TIP]\n> Java 8u191+ 和 Java 11+ 支持 `UseContainerSupport`，会自动感知容器内存限制。\n\n##### 方案3：调整 OOM 优先级\n\n```yaml\n# Kubernetes 中使用 oom-score-adj\napiVersion: v1\nkind: Pod\nspec:\n  containers:\n  - name: myapp\n    securityContext:\n      oomScoreAdj: -500  # 降低被 OOM Kill 的优先级\n```\n\n##### 方案4：监控告警\n\n```bash\n# Prometheus 告警规则示例\n- alert: ContainerMemoryNearLimit\n  expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9\n  for: 5m\n  labels:\n    severity: warning\n```\n\n---", "subs": ["问题现象", "Linux 内存管理基础", "Memory Cgroup 详解", "Memory Cgroup 的 OOM Killer", "排查 OOM 问题", "OOM 预防与处理"]}, {"title": "3.1 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **Overcommit** | Linux 允许申请超过物理内存的虚拟内存 |\n| **OOM Killer** | 内存不足时杀死进程的机制 |\n| **oom_badness()** | 选择被杀进程的算法 |\n| **memory.limit_in_bytes** | 容器内存硬限制 |\n| **Cgroup OOM Killer** | 只杀死该 Cgroup 内的进程 |\n\n> **运维要点**：\n>\n> 1. 通过 `dmesg` 或 `journalctl -k` 查看 OOM 日志\n> 2. 设置合理的内存限制，预留一定余量\n> 3. 为关键应用设置较低的 `oom_score_adj`\n\n---", "subs": []}, {"title": "3.2 RSS 与 Page Cache", "content": "> **核心问题**：为什么容器内存使用量总是接近上限，但却没有触发 OOM？\n\n#### 问题现象\n\n容器内存使用量长期保持在接近限制的状态，但应用运行正常：\n\n```bash\n$ docker stats myapp\nCONTAINER   MEM USAGE / LIMIT   MEM %\nmyapp       500MiB / 512MiB     97.66%  # 接近上限但不 OOM\n```\n\n#### 内存的两种类型\n\n| 类型 | 说明 | 是否可回收 |\n|------|------|------------|\n| **RSS（Resident Set Size）** | 进程实际使用的物理内存 | ❌ 不可回收 |\n| **Page Cache** | 文件系统缓存 | ✅ 可回收 |\n\n#### RSS（Resident Set Size）\n\n**RSS** 是进程实际占用的物理内存，包括：程序代码段、堆内存、栈内存、共享库。\n\n```bash\n# 查看进程 RSS\n$ ps aux | grep myapp\nUSER  PID  %MEM  RSS      COMMAND\nroot  123  10.0  256000   myapp     # RSS = 256MB\n```\n\n**特点**：RSS 是应用真正需要的内存，不能被回收。\n\n#### Page Cache\n\n**Page Cache** 是 Linux 用于缓存文件数据的内存，用于加速文件读写。\n\n**特点**：\n\n- 读写文件时自动产生\n- 提高 I/O 性能\n- **内存紧张时可以被回收**\n\n#### Memory Cgroup 统计的内存\n\n**关键点**：`memory.usage_in_bytes` = RSS + Page Cache\n\n```bash\n$ cat /sys/fs/cgroup/memory/docker/<id>/memory.stat\ncache 268435456      # Page Cache = 256MB\nrss 268435456        # RSS = 256MB\n# usage_in_bytes ≈ cache + rss = 512MB\n```\n\n这就解释了为什么容器内存使用量接近上限但不 OOM：**Page Cache 可以被回收**。\n\n#### 内存回收机制\n\n当容器需要更多内存时，内核会按照 LRU（最近最少使用）算法回收 Page Cache：\n\n1. 进程申请新内存\n2. 检查可用内存是否充足\n3. 不充足则回收 Page Cache\n4. 回收后仍不足才触发 OOM\n\n#### 正确判断容器内存使用\n\n**不要只看 usage_in_bytes**，应该关注 **RSS**：\n\n```bash\n# 查看真实内存使用（RSS）\n$ cat /sys/fs/cgroup/memory/docker/<id>/memory.stat | grep -E \"^rss |^cache \"\ncache 268435456      # 可回收\nrss 134217728        # 真正的内存使用量\n```\n\n**判断标准**：\n\n| 指标 | 含义 | 是否需要关注 |\n|------|------|-------------|\n| `memory.usage_in_bytes` | RSS + Cache | 接近上限正常 |\n| `memory.stat` 中的 `rss` | 真实内存使用 | **核心指标** |\n| `memory.stat` 中的 `cache` | 文件缓存 | 可被回收 |\n\n---", "subs": ["问题现象", "内存的两种类型", "RSS（Resident Set Size）", "Page Cache", "Memory Cgroup 统计的内存", "内存回收机制", "正确判断容器内存使用"]}, {"title": "3.2 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **RSS** | 进程实际使用的物理内存，不可回收 |\n| **Page Cache** | 文件系统缓存，可以被回收 |\n| **usage_in_bytes** | RSS + Page Cache 的总和 |\n| **memory.stat 中的 rss** | 判断内存使用的核心指标 |\n\n> **运维要点**：容器内存接近上限不一定有问题，关键看 RSS\n\n---", "subs": []}, {"title": "3.3 Swap 空间与容器", "content": "> **核心问题**：容器可以使用 Swap 空间吗？使用 Swap 会有什么影响？\n\n#### 什么是 Swap？\n\n**Swap（交换空间）** 是磁盘上的一块区域，当物理内存不足时，内核会把不常用的内存页写入 Swap，腾出物理内存给更需要的进程。\n\n```bash\n# 查看 Swap 配置\n$ free -h\n              total   used   free   buff/cache   available\nMem:           16G    8G     2G        6G          7G\nSwap:          8G     1G     7G\n```\n\n#### 容器与 Swap 的关系\n\n**默认情况下**：如果宿主机开启了 Swap，容器也可以使用 Swap。\n\n**问题**：这可能导致 Memory Cgroup 限制\"失效\"：\n\n```bash\n# 容器内存限制 512MB\n$ docker run -m 512m myapp\n\n# 但实际可能使用更多内存（通过 Swap）\n# 应用性能会因为 Swap 大幅下降\n```\n\n#### swappiness 参数\n\n**swappiness** 是一个内核参数，控制内存回收时的行为：\n\n```bash\n# 查看全局 swappiness（默认 60）\n$ cat /proc/sys/vm/swappiness\n60\n```\n\n| 值 | 含义 |\n|----|------|\n| 0 | 尽量避免使用 Swap（但不是禁止） |\n| 60 | 默认值，平衡回收 |\n| 100 | 积极使用 Swap |\n\n**理解 swappiness 的真正含义**：\n\n它是一个**权重值**，决定内核在回收内存时优先回收哪种类型：\n\n| 内存类型 | 说明 | 回收目标 |\n|----------|------|----------|\n| 文件页（Page Cache） | 文件缓存 | 丢弃或写回磁盘 |\n| 匿名页（Anonymous） | 进程堆/栈 | 写入 Swap |\n\n**计算公式**：\n\n```\nanon_prio = swappiness\nfile_prio = 200 - swappiness\n```\n\n| swappiness | 匿名页优先级 | 文件页优先级 | 效果 |\n|------------|-------------|-------------|------|\n| 0 | 0 | 200 | 优先回收文件页 |\n| 60 | 60 | 140 | 倾向回收文件页 |\n| 100 | 100 | 100 | 平等对待 |\n\n#### 全局 swappiness=0 的行为\n\n> [!WARNING]\n> 全局 `swappiness=0` 并不意味着完全不使用 Swap！\n\n当 **kswapd**（内核后台回收进程）工作时，`swappiness=0` 确实不会回收匿名页。\n\n但在**直接内存回收**（进程申请内存触发）时，如果文件页回收后仍不足，还是会使用 Swap。\n\n#### Memory Cgroup 的 swappiness\n\n**关键区别**：Memory Cgroup 可以单独设置 `memory.swappiness`\n\n```bash\n# 查看容器的 swappiness\n$ cat /sys/fs/cgroup/memory/docker/<id>/memory.swappiness\n60\n\n# 设置为 0 - 禁止该 Cgroup 使用 Swap\n$ echo 0 > /sys/fs/cgroup/memory/docker/<id>/memory.swappiness\n```\n\n**Memory Cgroup 中 swappiness=0 的特殊含义**：\n\n| 全局 swappiness=0 | Cgroup swappiness=0 |\n|-------------------|---------------------|\n| 尽量不用 Swap | **完全禁止** 使用 Swap |\n| 紧急情况仍会用 | 该 Cgroup 永不 Swap |\n\n#### Docker 配置\n\n```bash\n# 禁用容器的 Swap\n$ docker run -m 512m --memory-swappiness=0 myapp\n\n# 设置 memory + swap 总量\n$ docker run -m 512m --memory-swap=512m myapp\n# memory-swap = memory 表示禁用 Swap\n```\n\n#### Kubernetes 场景\n\nKubernetes 默认要求**禁用 Swap**：\n\n```bash\n# 禁用 Swap（kubelet 要求）\n$ swapoff -a\n\n# 永久禁用：编辑 /etc/fstab 注释 swap 行\n```\n\n从 Kubernetes 1.22 开始，可以通过 feature gate 启用 Swap 支持：\n\n```bash\n# kubelet 配置\n--feature-gates=NodeSwap=true\n```\n\n#### 容器使用 Swap 的影响\n\n| 影响 | 说明 |\n|------|------|\n| **性能下降** | 磁盘 I/O 远慢于内存 |\n| **响应延迟** | 访问被交换出的数据需要等待 |\n| **不可预测** | 内存限制变得不准确 |\n| **OOM 延迟** | 可能导致问题发现变晚 |\n\n#### 最佳实践\n\n**场景1：需要严格限制内存**\n\n```bash\n$ docker run -m 512m --memory-swap=512m myapp\n# 或\n$ docker run -m 512m --memory-swappiness=0 myapp\n```\n\n**场景2：允许使用 Swap 但限制总量**\n\n```bash\n$ docker run -m 512m --memory-swap=1g myapp\n# 允许 512MB 物理内存 + 512MB Swap\n```\n\n**场景3：Kubernetes 生产环境**\n\n```bash\n# 禁用宿主机 Swap\n$ swapoff -a\n```\n\n---", "subs": ["什么是 Swap？", "容器与 Swap 的关系", "swappiness 参数", "全局 swappiness=0 的行为", "Memory Cgroup 的 swappiness", "Docker 配置", "Kubernetes 场景", "容器使用 Swap 的影响", "最佳实践"]}, {"title": "3.3 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **Swap** | 磁盘上的虚拟内存空间 |\n| **swappiness** | 控制内存回收时对 Swap 的使用倾向 |\n| **全局 swappiness=0** | 尽量不用 Swap（但不绝对） |\n| **Cgroup swappiness=0** | **完全禁止** 该 Cgroup 使用 Swap |\n| **--memory-swap** | Docker 限制内存 + Swap 总量 |\n\n> **运维建议**：\n>\n> 1. Kubernetes 生产环境建议禁用 Swap\n> 2. 需要严格内存控制时使用 `--memory-swappiness=0`\n> 3. 使用 Swap 会影响性能，需谨慎评估\n\n---", "subs": []}, {"title": "第三章小结", "content": "| 节 | 主题 | 核心要点 |\n|----|------|----------|\n| 3.1 | OOM Killer | oom_badness、Memory Cgroup 限制 |\n| 3.2 | RSS 与 Page Cache | 区分真实内存使用 |\n| 3.3 | Swap | swappiness 参数、禁用方法 |\n\n---", "subs": []}]}, {"title": "第四章：容器存储与 I/O", "sections": [{"title": "4.1 容器文件系统 OverlayFS", "content": "> **核心问题**：为什么我在容器中读写文件变慢了？\n\n#### 什么是 UnionFS？\n\n**UnionFS（联合文件系统）** 是一种将多个目录\"联合\"挂载到同一个挂载点的文件系统。分层存储，下层只读，最上层可写。\n\n#### OverlayFS 详解\n\n**OverlayFS** 是 Linux 内核中 UnionFS 的主流实现，Docker 默认使用。\n\n| 目录 | 说明 |\n|------|------|\n| **lowerdir** | 只读层（镜像各层） |\n| **upperdir** | 可写层（容器运行时修改） |\n| **merged** | 合并后的挂载点 |\n| **workdir** | OverlayFS 内部使用 |\n\n```bash\n# 挂载 OverlayFS\n$ mount -t overlay overlay \\\n    -o lowerdir=/lower,upperdir=/upper,workdir=/work \\\n    /merged\n```\n\n#### 文件操作原理\n\n| 操作 | 行为 |\n|------|------|\n| **读取** | 优先从 upperdir，不存在则从 lowerdir |\n| **修改** | Copy-on-Write，复制到 upperdir 后修改 |\n| **删除** | 在 upperdir 创建 whiteout 标记文件 |\n\n#### 性能问题：Linux 5.4 AIO\n\n在 Linux 5.4 内核中，OverlayFS 的异步 I/O（libaio）性能大幅下降。\n\n**原因**：OverlayFS 实现的 I/O 函数只支持同步模式。\n\n**解决方案**：升级到 Linux 5.6+（包含修复补丁）\n\n#### 最佳实践\n\n```bash\n# I/O 敏感应用使用数据卷\n$ docker run -v /data:/app/data myapp\n```\n\n---", "subs": ["什么是 UnionFS？", "OverlayFS 详解", "文件操作原理", "性能问题：Linux 5.4 AIO", "最佳实践"]}, {"title": "4.1 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **OverlayFS** | Linux 内核的联合文件系统实现 |\n| **lowerdir/upperdir** | 只读层/可写层 |\n| **Copy-on-Write** | 修改时复制到上层 |\n\n> **运维建议**：I/O 密集型应用使用数据卷，避免在容器层写入大量数据\n\n---", "subs": []}, {"title": "4.2 容器存储配额（XFS Quota）", "content": "> **核心问题**：为什么容器可以把宿主机的磁盘写满？\n\n#### 问题现象\n\n容器不断写入文件，最终导致宿主机磁盘空间用尽：\n\n```bash\n$ df -h\nFilesystem      Size  Used Avail Use% Mounted on\n/dev/sda1       100G  100G    0  100% /\n\n$ docker ps -a\n# 某个容器产生了大量日志或临时文件\n```\n\n#### 问题根因\n\nOverlayFS 的写入操作实际上是写入宿主机的 **upperdir** 目录：\n\n```bash\n# 容器的 upperdir 位于宿主机\n/var/lib/docker/overlay2/<container_id>/diff/\n```\n\n**OverlayFS 本身没有容量限制**，容器可以无限写入直到磁盘满。\n\n#### 解决方案：XFS Quota\n\n利用底层文件系统的 **Quota（配额）** 功能限制容器的写入量。\n\n##### XFS Quota 三种模式\n\n| 模式 | 说明 | 适用场景 |\n|------|------|----------|\n| **User** | 按用户限制 | 多用户系统 |\n| **Group** | 按用户组限制 | 共享目录 |\n| **Project** | 按目录限制 | **容器场景** |\n\n##### Project Quota 工作原理\n\n给目录标记一个 **Project ID**，然后对该 ID 设置配额：\n\n```mermaid\ngraph TD\n    A[\"容器 upperdir\"] --> B[\"设置 Project ID = 100\"]\n    B --> C[\"配置 Project 100 配额 = 10GB\"]\n    C --> D[\"该目录写入量超过 10GB 时报错\"]\n```\n\n#### 手动配置 XFS Project Quota\n\n##### 步骤1：挂载 XFS 时启用 pquota\n\n```bash\n# 检查挂载选项\n$ mount | grep xfs\n/dev/sda1 on / type xfs (rw,pquota)\n\n# 如果没有 pquota，需要重新挂载\n$ mount -o remount,pquota /\n```\n\n##### 步骤2：设置 Project ID\n\n```bash\n# 给目录设置 Project ID\n$ xfs_quota -x -c 'project -s -p /path/to/dir 100' /\n\n# 验证\n$ xfs_quota -x -c 'print' /\n```\n\n##### 步骤3：配置配额\n\n```bash\n# 设置软限制和硬限制\n$ xfs_quota -x -c 'limit -p bsoft=9g bhard=10g 100' /\n\n# 查看配额使用情况\n$ xfs_quota -x -c 'report -p' /\n```\n\n#### Docker 的存储配额\n\nDocker 通过 `--storage-opt size` 参数实现存储限制：\n\n```bash\n# 限制容器存储层最大 10GB\n$ docker run --storage-opt size=10G myapp\n```\n\n**前提条件**：\n\n- 使用 `overlay2` 存储驱动\n- 底层文件系统是 **XFS**，且启用了 `pquota`\n\n```bash\n# 检查 Docker 存储配置\n$ docker info | grep -E \"Storage Driver|Backing Filesystem\"\nStorage Driver: overlay2\nBacking Filesystem: xfs\n```\n\n##### Docker 内部实现\n\nDocker 调用系统调用设置 XFS Project Quota：\n\n1. `setProjectID()` - 给 upperdir 设置 Project ID\n2. `setProjectQuota()` - 设置该 Project 的配额限制\n\n#### Kubernetes 场景\n\nKubernetes 通过 **ephemeral-storage** 限制：\n\n```yaml\napiVersion: v1\nkind: Pod\nspec:\n  containers:\n  - name: myapp\n    resources:\n      requests:\n        ephemeral-storage: \"2Gi\"\n      limits:\n        ephemeral-storage: \"10Gi\"  # 存储限制\n```\n\n**注意**：`ephemeral-storage` 包括：\n\n- 容器可写层\n- 日志文件\n- emptyDir 卷\n\n#### 监控与告警\n\n```bash\n# 监控容器存储使用\n$ docker system df -v\nTYPE       CONTAINER ID   SIZE\nContainer  abc123         5.5GB\n\n# Prometheus 指标\ncontainer_fs_usage_bytes{container=\"myapp\"}\n```\n\n---", "subs": ["问题现象", "问题根因", "解决方案：XFS Quota", "手动配置 XFS Project Quota", "Docker 的存储配额", "Kubernetes 场景", "监控与告警"]}, {"title": "4.2 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **问题** | OverlayFS 无原生配额，容器可写满磁盘 |\n| **XFS Project Quota** | 按目录设置存储配额 |\n| **Docker --storage-opt** | 利用 XFS Quota 限制容器存储 |\n| **K8s ephemeral-storage** | 限制临时存储使用量 |\n\n> **运维建议**：\n>\n> 1. 使用 XFS 文件系统并启用 pquota\n> 2. 生产环境必须设置容器存储配额\n> 3. 监控容器存储使用，设置告警阈值\n\n---", "subs": []}, {"title": "4.3 容器磁盘限速（Blkio Cgroup）", "content": "> **核心问题**：为什么我的容器里磁盘读写不稳定？如何限制容器的磁盘 I/O？\n\n#### Blkio Cgroup 概述\n\n**Blkio Cgroup（Block I/O Cgroup）** 用于限制容器对块设备的 I/O 速率。\n\n##### 核心参数\n\n| 参数 | 说明 |\n|------|------|\n| `blkio.throttle.read_bps_device` | 读带宽限制（字节/秒） |\n| `blkio.throttle.write_bps_device` | 写带宽限制（字节/秒） |\n| `blkio.throttle.read_iops_device` | 读 IOPS 限制 |\n| `blkio.throttle.write_iops_device` | 写 IOPS 限制 |\n\n```bash\n# 查看 Blkio Cgroup 配置\n$ cat /sys/fs/cgroup/blkio/docker/<id>/blkio.throttle.read_bps_device\n253:0 10485760  # 设备 253:0 限制读 10MB/s\n```\n\n#### Docker 配置磁盘限速\n\n```bash\n# 限制读写带宽\n$ docker run --device-read-bps /dev/sda:10mb \\\n             --device-write-bps /dev/sda:10mb \\\n             myapp\n\n# 限制 IOPS\n$ docker run --device-read-iops /dev/sda:1000 \\\n             --device-write-iops /dev/sda:1000 \\\n             myapp\n```\n\n#### Direct I/O vs Buffered I/O\n\n| 类型 | 说明 | Blkio Cgroup 生效？ |\n|------|------|-------------------|\n| **Direct I/O** | 绕过 Page Cache，直接读写磁盘 | ✅ 生效 |\n| **Buffered I/O** | 经过 Page Cache | ❌ 不生效（Cgroup v1） |\n\n**问题**：大多数应用使用 Buffered I/O，Blkio Cgroup v1 无法限制！\n\n```bash\n# 测试 Direct I/O（生效）\n$ fio --direct=1 --rw=write ...\n\n# 测试 Buffered I/O（不生效）\n$ fio --direct=0 --rw=write ...\n```\n\n#### Cgroup v2 的改进\n\n**Cgroup v2** 支持 Buffered I/O 限速，但需要满足条件：\n\n1. 内核支持 Cgroup v2\n2. Docker/containerd 配置使用 Cgroup v2\n3. 启用 `io` 控制器\n\n```bash\n# 检查是否使用 Cgroup v2\n$ mount | grep cgroup2\ncgroup2 on /sys/fs/cgroup type cgroup2\n\n# Cgroup v2 的 IO 限制参数\n$ cat /sys/fs/cgroup/mycontainer/io.max\n253:0 rbps=10485760 wbps=10485760\n```\n\n#### 为什么磁盘读写不稳定？\n\n即使设置了限速，仍可能出现不稳定：\n\n| 原因 | 说明 |\n|------|------|\n| **Buffered I/O** | Cgroup v1 无法限制 |\n| **共享存储竞争** | 多容器共用同一磁盘 |\n| **Page Cache 回写** | 突发性磁盘写入 |\n| **文件系统开销** | 元数据操作 |\n\n#### 最佳实践\n\n##### 1. 使用 Cgroup v2（推荐）\n\n```bash\n# 启用 Cgroup v2（系统级配置）\n# /etc/default/grub\nGRUB_CMDLINE_LINUX=\"systemd.unified_cgroup_hierarchy=1\"\n```\n\n##### 2. 使用 Direct I/O\n\n对于数据库等 I/O 敏感应用，配置使用 Direct I/O。\n\n##### 3. 分离存储\n\n```bash\n# 为容器分配独立磁盘/分区\n$ docker run -v /dev/nvme1n1:/data myapp\n```\n\n##### 4. 使用云存储限速\n\n云平台通常提供存储 QoS：\n\n- AWS EBS：配置 IOPS 和吞吐量\n- 阿里云：云盘 IOPS 限制\n\n---", "subs": ["Blkio Cgroup 概述", "Docker 配置磁盘限速", "Direct I/O vs Buffered I/O", "Cgroup v2 的改进", "为什么磁盘读写不稳定？", "最佳实践"]}, {"title": "4.3 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **Blkio Cgroup** | 限制块设备 I/O 速率 |\n| **Direct I/O** | Cgroup v1 可限制 |\n| **Buffered I/O** | 需要 Cgroup v2 才能限制 |\n| **--device-read-bps** | Docker 限制读带宽 |\n\n> **运维建议**：\n>\n> 1. 优先使用 Cgroup v2\n> 2. I/O 敏感应用考虑 Direct I/O\n> 3. 生产环境为容器分配独立存储\n\n---", "subs": []}, {"title": "4.4 Buffered I/O 与写延时波动", "content": "> **核心问题**：为什么容器写文件的延时波动很大？\n\n#### 问题现象\n\n容器内 Buffered I/O 写文件时，延时会出现明显波动：\n\n```bash\n# 大部分写入 1ms 完成\n# 但偶尔会有 100ms+ 的延时尖峰\n```\n\n#### Buffered I/O 与 Dirty Pages\n\n当使用 Buffered I/O 写文件时：\n\n1. 数据先写入 **Page Cache**（内存）\n2. 写操作立即返回（快）\n3. 内核后台将 Page Cache 写入磁盘（脏页回写）\n\n```mermaid\ngraph LR\n    A[\"应用 write()\"] --> B[\"Page Cache<br/>dirty pages\"]\n    B -->|\"后台回写\"| C[\"磁盘\"]\n    A -->|\"立即返回\"| D[\"写入完成\"]\n```\n\n#### Dirty Pages 相关内核参数\n\n| 参数 | 说明 | 默认值 |\n|------|------|--------|\n| `dirty_background_ratio` | 后台回写触发阈值 | 10% |\n| `dirty_ratio` | 同步回写触发阈值 | 20% |\n| `dirty_writeback_centisecs` | 回写线程唤醒间隔 | 500 (5秒) |\n| `dirty_expire_centisecs` | 脏页过期时间 | 3000 (30秒) |\n\n```bash\n# 查看当前配置\n$ cat /proc/sys/vm/dirty_background_ratio\n10\n\n$ cat /proc/sys/vm/dirty_ratio\n20\n```\n\n**回写触发条件**：\n\n- 脏页比例达到 `dirty_background_ratio` → 后台回写\n- 脏页比例达到 `dirty_ratio` → **阻塞应用**，同步回写\n\n#### 容器内延时波动的根因\n\n在 **Memory Cgroup 限制**下，Page Cache 空间有限：\n\n```bash\n# 容器内存限制 512MB\n# Page Cache 可用空间很小\n# 频繁触发脏页回写\n```\n\n**关键问题**：`dirty_ratio` 是基于**系统总内存**计算的，但容器的 Page Cache 受 Memory Cgroup 限制。\n\n#### 深入分析\n\n使用 `perf` 和 `ftrace` 可以定位到：\n\n```bash\n# 延时发生在这两个函数\nmem_cgroup_try_charge()    # 申请 Page Cache 内存\ndo_try_to_free_pages()     # 回收 Page Cache\n```\n\n当容器的 Page Cache 不足时，每次写入都要：\n\n1. 尝试申请内存\n2. 发现超过 Cgroup 限制\n3. 回收旧的 Page Cache\n4. 再写入\n\n这个回收过程导致了延时波动。\n\n#### 解决方案\n\n##### 方案1：增加容器内存限制\n\n```bash\n# 预留更多内存给 Page Cache\n$ docker run -m 1g myapp  # 原来 512m\n```\n\n**估算公式**：\n\n```\n推荐内存 = RSS + 预期写入速率 × 脏页保留时间\n```\n\n##### 方案2：使用 Direct I/O\n\n绕过 Page Cache，延时稳定但平均延时更高：\n\n```c\n// 打开文件时使用 O_DIRECT\nint fd = open(\"/data/file\", O_WRONLY | O_DIRECT);\n```\n\n##### 方案3：调整 dirty 参数\n\n```bash\n# 降低阈值，更频繁地回写\n$ echo 5 > /proc/sys/vm/dirty_background_ratio\n$ echo 10 > /proc/sys/vm/dirty_ratio\n```\n\n##### 方案4：使用 tmpfs（内存文件系统）\n\n对于临时文件，使用内存文件系统避免磁盘 I/O：\n\n```bash\ndocker run --tmpfs /tmp:size=100m myapp\n```\n\n---", "subs": ["问题现象", "Buffered I/O 与 Dirty Pages", "Dirty Pages 相关内核参数", "容器内延时波动的根因", "深入分析", "解决方案"]}, {"title": "4.4 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **Buffered I/O** | 经过 Page Cache 的 I/O |\n| **Dirty Pages** | Page Cache 中待写入磁盘的数据 |\n| **延时波动原因** | Memory Cgroup 限制导致 Page Cache 频繁回收 |\n| **解决方案** | 增加内存/Direct I/O/调整 dirty 参数 |\n\n> **运维建议**：为 I/O 密集型容器预留足够的内存给 Page Cache\n\n---", "subs": []}, {"title": "第四章小结", "content": "| 节 | 主题 | 核心要点 |\n|----|------|----------|\n| 4.1 | OverlayFS | 联合文件系统、Copy-on-Write |\n| 4.2 | XFS Quota | 容器存储配额 |\n| 4.3 | Blkio Cgroup | 磁盘 I/O 限速 |\n| 4.4 | Buffered I/O | 写延时波动与 Page Cache |\n\n---", "subs": []}]}, {"title": "第五章：容器网络", "sections": [{"title": "5.1 Network Namespace 与网络参数", "content": "> **核心问题**：为什么修改了 `/proc/sys/net` 参数，在容器中不起效？\n\n#### Network Namespace 隔离\n\nNetwork Namespace 隔离容器的网络栈：网络设备、IP协议栈、端口空间、防火墙规则、部分网络参数。\n\n#### /proc/sys/net 参数分类\n\n| 类型 | 说明 |\n|------|------|\n| **Namespace 相关** | 每个 Namespace 独立（如 tcp_keepalive_time） |\n| **全局参数** | 所有 Namespace 共享（如部分 netfilter 参数） |\n\n**关键点**：创建新 Namespace 时，部分参数继承宿主机，部分使用内核默认值。\n\n#### 容器内修改的问题\n\n非特权容器中 `/proc/sys` 是**只读挂载**：\n\n```bash\n$ docker exec myapp sh -c 'echo 600 > /proc/sys/net/ipv4/tcp_keepalive_time'\nRead-only file system\n```\n\n#### 解决方案\n\n```bash\n# Docker --sysctl\n$ docker run --sysctl net.ipv4.tcp_keepalive_time=600 myapp\n```\n\n```yaml\n# Kubernetes\nspec:\n  securityContext:\n    sysctls:\n    - name: net.ipv4.tcp_keepalive_time\n      value: \"600\"\n```\n\n#### 常用网络参数\n\n| 参数 | 说明 |\n|------|------|\n| `tcp_keepalive_time` | TCP keepalive 间隔 |\n| `ip_local_port_range` | 本地端口范围 |\n| `tcp_max_syn_backlog` | SYN 队列长度 |\n\n---", "subs": ["Network Namespace 隔离", "/proc/sys/net 参数分类", "容器内修改的问题", "解决方案", "常用网络参数"]}, {"title": "5.1 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **Network Namespace** | 隔离容器网络栈 |\n| **/proc/sys/net** | 部分参数隔离，部分全局共享 |\n| **--sysctl** | 启动时设置网络参数 |\n\n> **运维建议**：通过 `--sysctl` 或 Kubernetes `sysctls` 配置容器网络参数\n\n---", "subs": []}, {"title": "5.2 容器网络调试方法", "content": "> **核心问题**：容器网络不通了要怎么调试？\n\n#### 容器网络架构（Bridge模式）\n\n```mermaid\ngraph TD\n    subgraph Container[\"容器 Network Namespace\"]\n        eth0[\"eth0<br/>172.17.0.2\"]\n    end\n    \n    subgraph Host[\"宿主机 Network Namespace\"]\n        veth[\"veth123\"]\n        docker0[\"docker0 网桥<br/>172.17.0.1\"]\n        eth_host[\"eth0<br/>192.168.1.100\"]\n    end\n    \n    subgraph External[\"外部网络\"]\n        target[\"目标地址<br/>8.8.8.8\"]\n    end\n    \n    eth0 -->|\"veth pair\"| veth\n    veth --> docker0\n    docker0 -->|\"NAT/路由\"| eth_host\n    eth_host --> target\n```\n\n#### 关键组件\n\n| 组件 | 说明 |\n|------|------|\n| **veth pair** | 虚拟网线，连接容器和宿主机 |\n| **docker0** | 网桥，连接多个容器 |\n| **NAT** | 地址转换，容器访问外网 |\n| **iptables** | 防火墙规则 |\n\n#### 调试步骤\n\n##### 步骤1：检查容器网络配置\n\n```bash\n# 查看容器 IP\n$ docker exec myapp ip addr\n# 或\n$ docker inspect myapp --format '{{.NetworkSettings.IPAddress}}'\n172.17.0.2\n\n# 查看容器路由\n$ docker exec myapp ip route\ndefault via 172.17.0.1 dev eth0\n```\n\n##### 步骤2：检查 veth pair\n\n```bash\n# 在容器内查看 eth0 的 ifindex\n$ docker exec myapp cat /sys/class/net/eth0/iflink\n15\n\n# 在宿主机查找对应 veth\n$ ip link | grep \"^15:\"\n15: veth123@if14: <BROADCAST,MULTICAST,UP> ...\n```\n\n##### 步骤3：检查网桥\n\n```bash\n# 查看 docker0 网桥\n$ brctl show docker0\nbridge name   bridge id         interfaces\ndocker0       8000.xxxx         veth123\n\n# 检查网桥 IP\n$ ip addr show docker0\ndocker0: <BROADCAST,MULTICAST,UP>\n    inet 172.17.0.1/16 ...\n```\n\n##### 步骤4：检查 ip_forward\n\n```bash\n# 必须开启 IP 转发\n$ cat /proc/sys/net/ipv4/ip_forward\n1  # 必须为 1\n\n# 如果为 0，开启它\n$ echo 1 > /proc/sys/net/ipv4/ip_forward\n```\n\n##### 步骤5：检查 iptables 规则\n\n```bash\n# 查看 NAT 规则\n$ iptables -t nat -L -n -v\nChain POSTROUTING\nMASQUERADE  all  172.17.0.0/16  0.0.0.0/0\n\n# 查看 FORWARD 规则\n$ iptables -L FORWARD -n -v\n```\n\n##### 步骤6：使用 tcpdump 抓包\n\n```bash\n# 在容器内抓包\n$ docker exec myapp tcpdump -i eth0 -nn\n\n# 在宿主机 veth 抓包\n$ tcpdump -i veth123 -nn\n\n# 在网桥抓包\n$ tcpdump -i docker0 -nn\n\n# 在物理网卡抓包\n$ tcpdump -i eth0 -nn host 8.8.8.8\n```\n\n#### 常见问题排查\n\n| 问题 | 可能原因 | 排查方法 |\n|------|----------|----------|\n| 容器内无法 ping 网关 | veth 或网桥问题 | 检查 veth 状态 |\n| 可以 ping 网关，不能访问外网 | NAT 或 ip_forward | 检查 iptables |\n| DNS 解析失败 | resolv.conf 配置 | 检查 /etc/resolv.conf |\n| 端口无法访问 | 端口映射或防火墙 | 检查 docker port 和 iptables |\n\n#### 进入容器网络命名空间\n\n```bash\n# 获取容器 PID\n$ docker inspect myapp --format '{{.State.Pid}}'\n12345\n\n# 进入该命名空间执行命令\n$ nsenter -t 12345 -n ip addr\n$ nsenter -t 12345 -n tcpdump -i eth0\n```\n\n---", "subs": ["容器网络架构（Bridge模式）", "关键组件", "调试步骤", "常见问题排查", "进入容器网络命名空间"]}, {"title": "5.2 节小结", "content": "| 调试工具 | 用途 |\n|----------|------|\n| `ip addr/route` | 查看网络配置 |\n| `brctl show` | 查看网桥 |\n| `iptables -L -t nat` | 查看 NAT 规则 |\n| `tcpdump` | 抓包分析 |\n| `nsenter -n` | 进入容器网络命名空间 |\n\n> **运维建议**：按照数据流路径逐段排查：容器 → veth → 网桥 → NAT → 物理网卡\n\n---", "subs": []}, {"title": "5.3 容器网络延时分析", "content": "> **核心问题**：容器网络延时要比宿主机上的高吗？\n\n#### 使用 netperf 测试延时\n\n```bash\n# 安装 netperf\n$ yum install netperf\n\n# 服务端\n$ netserver -bindaddr 192.168.1.100\n\n# 客户端测试 TCP_RR（请求-响应延时）\n$ netperf -H 192.168.1.100 -t TCP_RR -l 10\n```\n\n**测试结果对比**：\n\n| 场景 | 延时 |\n|------|------|\n| 宿主机之间 | ~30μs |\n| 容器（veth+bridge） | ~50μs |\n| 容器（macvlan） | ~35μs |\n\n#### 延时增加的原因\n\nveth + bridge 模式会产生额外的**软中断（softirq）**开销：\n\n```mermaid\ngraph LR\n    subgraph Container[\"容器\"]\n        A[\"发送数据\"]\n    end\n    \n    subgraph HostKernel[\"宿主机内核\"]\n        B[\"veth 驱动<br/>触发软中断\"]\n        C[\"网桥处理<br/>触发软中断\"]\n        D[\"物理网卡驱动\"]\n    end\n    \n    A --> B\n    B -->|\"softirq\"| C\n    C -->|\"softirq\"| D\n```\n\n**每次数据经过 veth 都会**：\n\n1. 触发一次 softirq\n2. 可能切换 CPU\n3. 增加处理延时\n\n#### 替代方案：macvlan\n\n**macvlan** 让容器直接使用物理网卡，绕过 veth 和网桥：\n\n```mermaid\ngraph TD\n    subgraph Container1[\"容器1\"]\n        eth0_1[\"eth0<br/>MAC: aa:bb:cc:01\"]\n    end\n    \n    subgraph Container2[\"容器2\"]\n        eth0_2[\"eth0<br/>MAC: aa:bb:cc:02\"]\n    end\n    \n    subgraph Host[\"宿主机\"]\n        phy[\"物理网卡 eth0\"]\n    end\n    \n    eth0_1 --> phy\n    eth0_2 --> phy\n```\n\n**配置示例**：\n\n```bash\n# 创建 macvlan 网络\n$ docker network create -d macvlan \\\n    --subnet=192.168.1.0/24 \\\n    --gateway=192.168.1.1 \\\n    -o parent=eth0 \\\n    mynet\n\n# 使用该网络启动容器\n$ docker run --network mynet myapp\n```\n\n#### 替代方案：ipvlan\n\n**ipvlan** 类似 macvlan，但共享 MAC 地址：\n\n| 特性 | macvlan | ipvlan |\n|------|---------|--------|\n| MAC 地址 | 每个容器独立 | 共享宿主机 MAC |\n| 适用场景 | 一般网络 | 云环境（限制MAC数量） |\n| 性能 | 低延时 | 低延时 |\n\n```bash\n# 创建 ipvlan 网络\n$ docker network create -d ipvlan \\\n    --subnet=192.168.1.0/24 \\\n    -o parent=eth0 \\\n    myipvlan\n```\n\n#### 方案对比\n\n| 网络模式 | 延时 | 隔离性 | 复杂度 |\n|----------|------|--------|--------|\n| bridge + veth | 较高 | 好 | 简单 |\n| macvlan | 低 | 较好 | 中等 |\n| ipvlan | 低 | 较好 | 中等 |\n| host | 最低 | 无隔离 | 最简单 |\n\n#### 注意事项\n\n> [!WARNING]\n> macvlan/ipvlan 在 Kubernetes 中可能与 Service 的 iptables 规则不兼容\n\n**适用场景**：\n\n- 对延时敏感的应用\n- 高频交易、实时音视频\n- 不依赖 Kubernetes Service 的场景\n\n---", "subs": ["使用 netperf 测试延时", "延时增加的原因", "替代方案：macvlan", "替代方案：ipvlan", "方案对比", "注意事项"]}, {"title": "5.3 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **veth 延时** | 每次经过 veth 产生 softirq 开销 |\n| **macvlan** | 绕过 veth/网桥，直连物理网卡 |\n| **ipvlan** | 类似 macvlan，共享 MAC 地址 |\n\n> **运维建议**：延时敏感场景考虑使用 macvlan/ipvlan 替代默认 bridge 模式\n\n---", "subs": []}, {"title": "5.4 网络乱序包与重传", "content": "> **核心问题**：为什么容器中的网络乱序包这么高？\n\n#### 问题现象\n\n容器网络的 TCP 重传率明显高于宿主机：\n\n```bash\n# 查看网络统计\n$ netstat -s | grep -E \"retrans|reorder\"\n    1234 segments retransmitted\n    567 packets reordered\n```\n\n#### TCP 重传机制\n\n##### 快速重传（Fast Retransmit）\n\n收到 3 个重复 ACK 后触发重传：\n\n```mermaid\nsequenceDiagram\n    participant Sender\n    participant Receiver\n    \n    Sender->>Receiver: Seq 1\n    Sender->>Receiver: Seq 2 (丢失)\n    Sender->>Receiver: Seq 3\n    Receiver->>Sender: ACK 2 (重复)\n    Sender->>Receiver: Seq 4\n    Receiver->>Sender: ACK 2 (重复)\n    Sender->>Receiver: Seq 5\n    Receiver->>Sender: ACK 2 (重复)\n    Note over Sender: 3个重复ACK，触发快速重传\n    Sender->>Receiver: Seq 2 (重传)\n```\n\n##### SACK（选择性确认）\n\nLinux 启用 SACK 后，收到 **1个** 重复 ACK 就可能触发重传。\n\n**问题**：如果数据包只是乱序（不是丢失），也会触发不必要的重传。\n\n#### 乱序的原因分析\n\nveth 设备两端可能由**不同 CPU** 处理：\n\n```mermaid\ngraph TD\n    subgraph Container[\"容器\"]\n        A[\"发送 Pkt1, Pkt2, Pkt3\"]\n    end\n    \n    subgraph Host[\"宿主机\"]\n        veth[\"veth\"]\n        CPU0[\"CPU 0 处理 Pkt1, Pkt3\"]\n        CPU1[\"CPU 1 处理 Pkt2\"]\n    end\n    \n    A --> veth\n    veth --> CPU0\n    veth --> CPU1\n    \n    CPU0 -->|\"先完成\"| Out[\"Pkt1, Pkt3, Pkt2<br/>顺序改变\"]\n```\n\n**根因**：\n\n1. 网卡/veth 默认可能将包分发到不同 CPU\n2. 不同 CPU 处理速度不同\n3. 导致数据包到达顺序改变\n\n#### 解决方案：RPS（Receive Packet Steering）\n\n**RPS** 可以将同一连接（5元组）的数据包调度到同一 CPU：\n\n```bash\n# 查看当前 RPS 配置\n$ cat /sys/class/net/veth123/queues/rx-0/rps_cpus\n00000000\n\n# 配置 RPS（使用所有 CPU，8核示例）\n$ echo ff > /sys/class/net/veth123/queues/rx-0/rps_cpus\n```\n\n**配置值含义**：\n\n- `ff` = 二进制 11111111 = 启用 CPU 0-7\n- `0f` = 二进制 00001111 = 启用 CPU 0-3\n\n#### RSS vs RPS\n\n| 特性 | RSS | RPS |\n|------|-----|-----|\n| 实现位置 | 硬件（网卡） | 软件（内核） |\n| 适用设备 | 物理网卡 | 任何网络设备 |\n| 性能开销 | 无 | 有一定开销 |\n\n**物理网卡配置 RSS**：\n\n```bash\n# 查看网卡队列数\n$ ethtool -l eth0\nChannel parameters for eth0:\nCombined:       8\n\n# 调整队列数\n$ ethtool -L eth0 combined 4\n```\n\n#### 自动配置脚本\n\n```bash\n#!/bin/bash\n# 为所有 veth 设备配置 RPS\n\nfor veth in $(ls /sys/class/net/ | grep veth); do\n    echo \"Configuring RPS for $veth\"\n    for rx in /sys/class/net/$veth/queues/rx-*; do\n        echo ff > $rx/rps_cpus\n    done\ndone\n```\n\n#### 验证效果\n\n```bash\n# 配置前\n$ netstat -s | grep retrans\n    5000 segments retransmitted\n\n# 配置 RPS 后\n$ netstat -s | grep retrans\n    500 segments retransmitted  # 显著减少\n```\n\n---", "subs": ["问题现象", "TCP 重传机制", "乱序的原因分析", "解决方案：RPS（Receive Packet Steering）", "RSS vs RPS", "自动配置脚本", "验证效果"]}, {"title": "5.4 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **乱序原因** | veth 数据包被不同 CPU 处理 |\n| **SACK** | 启用后对乱序更敏感 |\n| **RPS** | 将同一连接的包调度到同一 CPU |\n| **RSS** | 硬件级别的多队列负载均衡 |\n\n> **运维建议**：为容器 veth 设备配置 RPS 可显著降低重传率\n\n---", "subs": []}, {"title": "第五章小结", "content": "| 节 | 主题 | 核心要点 |\n|----|------|----------|\n| 5.1 | Network Namespace | /proc/sys/net 参数隔离 |\n| 5.2 | 网络调试 | veth/bridge/iptables 排查 |\n| 5.3 | 网络延时 | macvlan/ipvlan 低延时方案 |\n| 5.4 | 乱序与重传 | RPS 配置减少重传 |\n\n---", "subs": []}]}, {"title": "第六章：容器安全", "sections": [{"title": "6.1 Capabilities 与特权容器", "content": "> **核心问题**：我的容器真的需要 privileged 权限吗？\n\n#### 什么是 privileged 容器？\n\n**特权容器** 拥有宿主机 root 的所有能力，非常危险：\n\n```bash\n# 启动特权容器\n$ docker run --privileged myapp\n```\n\n**特权容器可以**：\n\n- 访问所有设备 `/dev/*`\n- 加载内核模块\n- 修改系统配置\n- 挂载文件系统\n- 几乎可以完全控制宿主机\n\n> [!CAUTION]\n> 特权容器等同于给容器 root 权限，可以轻易逃逸！\n\n#### Linux Capabilities 机制\n\nLinux 将 root 权限拆分为 **40+ 个独立的 Capability**，可以按需授予。\n\n##### 常用 Capabilities\n\n| Capability | 说明 |\n|------------|------|\n| `CAP_NET_ADMIN` | 网络配置（iptables、路由） |\n| `CAP_NET_BIND_SERVICE` | 绑定 <1024 端口 |\n| `CAP_SYS_ADMIN` | 挂载、设置主机名等（危险） |\n| `CAP_SYS_PTRACE` | 调试进程 |\n| `CAP_CHOWN` | 修改文件所有者 |\n| `CAP_DAC_OVERRIDE` | 绕过文件权限检查 |\n\n```bash\n# 查看进程的 Capabilities\n$ cat /proc/1/status | grep Cap\nCapInh: 0000000000000000\nCapPrm: 00000000a80425fb\nCapEff: 00000000a80425fb\nCapBnd: 00000000a80425fb\n\n# 解码 Capabilities\n$ capsh --decode=00000000a80425fb\n```\n\n#### Docker 默认 Capabilities\n\nDocker 容器默认只有部分 Capabilities：\n\n```bash\n# 查看容器的 Capabilities\n$ docker run --rm alpine cat /proc/1/status | grep Cap\nCapEff: 00000000a80425fb\n```\n\n**默认包含**：\n\n- `CAP_CHOWN`、`CAP_DAC_OVERRIDE`\n- `CAP_FOWNER`、`CAP_KILL`\n- `CAP_NET_BIND_SERVICE`、`CAP_NET_RAW`\n- 等约 14 个\n\n**默认不包含**（需要特别添加）：\n\n- `CAP_SYS_ADMIN`\n- `CAP_NET_ADMIN`\n- `CAP_SYS_PTRACE`\n\n#### 按需添加 Capabilities\n\n```bash\n# 添加单个 Capability\n$ docker run --cap-add NET_ADMIN myapp\n\n# 添加多个\n$ docker run --cap-add NET_ADMIN --cap-add SYS_PTRACE myapp\n```\n\n#### 删除不需要的 Capabilities\n\n```bash\n# 删除所有，只保留需要的\n$ docker run --cap-drop ALL --cap-add NET_BIND_SERVICE myapp\n```\n\n#### Kubernetes 配置\n\n```yaml\napiVersion: v1\nkind: Pod\nspec:\n  containers:\n  - name: myapp\n    securityContext:\n      capabilities:\n        add:\n        - NET_ADMIN\n        drop:\n        - ALL\n```\n\n#### 常见场景与 Capabilities\n\n| 场景 | 需要的 Capability |\n|------|-------------------|\n| 绑定 80 端口 | `NET_BIND_SERVICE` |\n| 修改网络配置 | `NET_ADMIN` |\n| 使用 tcpdump | `NET_RAW` |\n| strace 调试 | `SYS_PTRACE` |\n| 挂载文件系统 | `SYS_ADMIN`（危险） |\n\n#### privileged vs 单独 Capability\n\n| 特性 | `--privileged` | `--cap-add` |\n|------|----------------|-------------|\n| 权限范围 | 全部 | 指定的 |\n| 安全风险 | 极高 | 可控 |\n| 访问设备 | 全部 | 默认不变 |\n| 推荐程度 | ❌ 避免 | ✅ 推荐 |\n\n---", "subs": ["什么是 privileged 容器？", "Linux Capabilities 机制", "Docker 默认 Capabilities", "按需添加 Capabilities", "删除不需要的 Capabilities", "Kubernetes 配置", "常见场景与 Capabilities", "privileged vs 单独 Capability"]}, {"title": "6.1 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **privileged** | 赋予容器所有权限，极不安全 |\n| **Capabilities** | 细粒度的权限控制 |\n| **--cap-add** | 添加指定 Capability |\n| **--cap-drop ALL** | 最小权限原则 |\n\n> **运维建议**：\n>\n> 1. 永远不要在生产环境使用 `--privileged`\n> 2. 使用 `--cap-drop ALL` 后按需添加\n> 3. 定期审计容器的 Capabilities\n\n---", "subs": []}, {"title": "6.2 非 root 用户运行容器", "content": "> **核心问题**：在容器中不以 root 用户来运行程序可以吗？\n\n#### 为什么要避免 root？\n\n容器内的 root 用户与宿主机的 root 有相同的 UID（0）：\n\n```bash\n# 容器内 root 用户\n$ docker run --rm alpine id\nuid=0(root) gid=0(root)\n\n# 如果容器逃逸，攻击者就是宿主机的 root\n```\n\n> [!WARNING]\n> 即使有 Namespace 隔离，root 用户仍有更多权限，增加了逃逸风险。\n\n#### 方法1：Dockerfile 中指定用户\n\n```dockerfile\nFROM alpine\n\n# 创建非 root 用户\nRUN adduser -D -u 1000 appuser\n\n# 切换用户\nUSER appuser\n\n# 应用将以 appuser 身份运行\nCMD [\"./myapp\"]\n```\n\n```bash\n# 验证\n$ docker run --rm myimage id\nuid=1000(appuser) gid=1000(appuser)\n```\n\n#### 方法2：docker run --user\n\n```bash\n# 指定 UID:GID 运行\n$ docker run --user 1000:1000 myapp\n\n# 或使用用户名（需要容器内存在该用户）\n$ docker run --user appuser myapp\n```\n\n#### 方法3：Kubernetes runAsNonRoot\n\n```yaml\napiVersion: v1\nkind: Pod\nspec:\n  securityContext:\n    runAsNonRoot: true      # 强制非 root\n    runAsUser: 1000         # 指定 UID\n    runAsGroup: 1000        # 指定 GID\n    fsGroup: 1000           # 文件系统组\n  containers:\n  - name: myapp\n    image: myimage\n```\n\n**runAsNonRoot: true** 会在启动时检查，如果进程是 root 则拒绝运行。\n\n#### 常见问题与解决\n\n| 问题 | 原因 | 解决方案 |\n|------|------|----------|\n| 文件权限不足 | 文件属于 root | `chown` 修改文件所有者 |\n| 无法绑定低端口 | <1024 需要权限 | 使用 >1024 端口或 `NET_BIND_SERVICE` |\n| 无法写入目录 | 目录权限问题 | 确保目录对运行用户可写 |\n\n**Dockerfile 示例（处理权限）**：\n\n```dockerfile\nFROM alpine\n\nRUN adduser -D -u 1000 appuser && \\\n    mkdir -p /app/data && \\\n    chown -R appuser:appuser /app\n\nUSER appuser\nWORKDIR /app\nCMD [\"./myapp\"]\n```\n\n#### User Namespace 映射\n\n**User Namespace** 可以将容器内的 root 映射到宿主机的普通用户：\n\n```bash\n# Docker 启用 User Namespace（需配置 daemon.json）\n{\n  \"userns-remap\": \"default\"\n}\n```\n\n```bash\n# 映射后，容器内 root 在宿主机是普通用户\n容器: uid=0(root)  → 宿主机: uid=100000\n容器: uid=1(user)  → 宿主机: uid=100001\n```\n\n#### 安全最佳实践汇总\n\n| 层面 | 实践 |\n|------|------|\n| **镜像** | Dockerfile 中使用 `USER` 指令 |\n| **运行时** | `--user` 或 `runAsNonRoot` |\n| **文件** | 确保应用目录权限正确 |\n| **高级** | 启用 User Namespace |\n\n---", "subs": ["为什么要避免 root？", "方法1：Dockerfile 中指定用户", "方法2：docker run --user", "方法3：Kubernetes runAsNonRoot", "常见问题与解决", "User Namespace 映射", "安全最佳实践汇总"]}, {"title": "6.2 节小结", "content": "| 概念 | 说明 |\n|------|------|\n| **容器 root 风险** | UID=0 与宿主机相同 |\n| **USER 指令** | Dockerfile 中切换用户 |\n| **runAsNonRoot** | K8s 强制非 root 运行 |\n| **User Namespace** | 映射容器 UID 到宿主机不同 UID |\n\n> **运维建议**：\n>\n> 1. 所有生产容器应以非 root 用户运行\n> 2. 在 Kubernetes 中启用 `runAsNonRoot: true`\n> 3. 考虑启用 User Namespace 获得更强隔离\n\n---", "subs": []}, {"title": "第六章小结", "content": "| 节 | 主题 | 核心要点 |\n|----|------|----------|\n| 6.1 | Capabilities | 细粒度权限控制替代 privileged |\n| 6.2 | 非 root 运行 | USER 指令、runAsNonRoot |\n\n---", "subs": []}]}, {"title": "总结", "sections": [{"title": "容器核心技术架构图", "content": "本笔记涵盖了容器技术的核心知识点：\n\n| 章节 | 主题 | 核心内容 |\n|------|------|----------|\n| 第一章 | 容器基础 | Namespace + Cgroups |\n| 第二章 | 容器进程 | init进程、僵尸进程、CPU |\n| 第三章 | 容器内存 | OOM、Page Cache、Swap |\n| 第四章 | 容器存储 | OverlayFS、Quota、I/O |\n| 第五章 | 容器网络 | veth、延时、乱序 |\n| 第六章 | 容器安全 | Capabilities、非root |\n\n\n```mermaid\ngraph TB\n    subgraph Container[\"容器\"]\n        App[\"应用进程\"]\n        FS[\"rootfs<br/>文件系统\"]\n    end\n    \n    subgraph Isolation[\"隔离机制 - Namespace\"]\n        PID[\"PID Namespace\"]\n        NET[\"Network Namespace\"]\n        MNT[\"Mount Namespace\"]\n        UTS[\"UTS Namespace\"]\n        IPC[\"IPC Namespace\"]\n        USER[\"User Namespace\"]\n    end\n    \n    subgraph Limit[\"资源限制 - Cgroups\"]\n        CPU[\"CPU Cgroup\"]\n        MEM[\"Memory Cgroup\"]\n        BLKIO[\"Blkio Cgroup\"]\n        NETCLS[\"Net_cls Cgroup\"]\n    end\n    \n    subgraph Host[\"宿主机内核\"]\n        Kernel[\"Linux Kernel\"]\n    end\n    \n    Container --> Isolation\n    Container --> Limit\n    Isolation --> Kernel\n    Limit --> Kernel\n```\n\n```", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
