croVM\n\n3. 所有出网流量最好经代理\n- 便于审计\n- 便于域名白名单\n- 便于凭据注入\n\n4. 挂载目录前先清点秘密文件\n- 只读挂载也会泄露", "subs": ["还要控制网络 文件系统 凭据和隔离层", "如 gVisor 或 microVM", "便于审计", "便于域名白名单", "便于凭据注入", "只读挂载也会泄露"]}, {"title": "实战建议", "content": "1. 生产默认使用容器或更强隔离\n2. 机密凭据尽量不进 Agent 边界\n3. 默认只开放必要目录和必要域名\n4. 用代理统一做:\n- 凭据注入\n- 出网限制\n- 审计日志\n\n5. 高风险场景优先自定义工具或 MCP 代理访问外部服务", "subs": ["凭据注入", "出网限制", "审计日志"]}, {"title": "小结", "content": "`Secure Deployment` 的核心思想是 不要试图让 Agent 永远不犯错 而是通过隔离 最小权限 和分层防护 把错误的破坏范围限制在可接受边界内。`", "subs": []}]}, {"title": "16. MCP 外部工具集成 (MCP)", "sections": [{"title": "本章目标", "content": "本章讲如何通过 MCP 把 Agent 接到数据库 API 浏览器 文档系统和内部平台。重点包括:\n\n- MCP 是什么\n- 如何添加 MCP server\n- MCP 工具如何授权\n- stdio 和 HTTP/SSE 的差异\n- 大量工具时如何开启 tool search\n- 认证和排错要点", "subs": ["MCP 是什么", "如何添加 MCP server", "MCP 工具如何授权", "stdio 和 HTTP/SSE 的差异", "大量工具时如何开启 tool search", "认证和排错要点"]}, {"title": "原文要点整理", "content": "`mcp.html` 是扩展能力的核心章节。它说明:\n\n- MCP 是连接外部工具和数据源的开放标准\n- 服务可以是本地进程 远程 HTTP/SSE 服务 或 SDK 内嵌 server\n- MCP 工具默认也要受权限系统控制", "subs": ["MCP 是连接外部工具和数据源的开放标准", "服务可以是本地进程 远程 HTTP/SSE 服务 或 SDK 内嵌 server", "MCP 工具默认也要受权限系统控制"]}, {"title": "核心概念", "content": "#### 1. MCP 是 Agent 的外部能力总线\n\n有了 MCP 之后 Agent 不再只会:\n\n- 读本地文件\n- 跑本地命令\n\n而是可以访问:\n\n- GitHub\n- Slack\n- Postgres\n- 浏览器自动化\n- 内部 API\n\n#### 2. MCP 工具名称有固定前缀\n\n命名规则是:\n\n- `mcp__<server-name>__<tool-name>`\n\n这让权限控制和日志识别都更明确。\n\n#### 3. MCP 工具也必须显式授权\n\n文档强调:\n\n- 不授权 Claude 即使看到工具 也不能调用\n\n最常见方式是:\n\n- `allowed_tools=[\"mcp__github__*\"]`\n\n或者进入更宽松的权限模式。\n\n#### 4. 三种传输方式\n\n- `stdio` 本地进程型 MCP server\n- `http` 或 `sse` 远程服务型 MCP server\n- SDK MCP servers 代码内嵌\n\n选型通常取决于:\n\n- 工具是否部署在本机\n- 是否需要跨网络访问\n- 是否由你自己直接编写\n\n#### 5. Tool search 用来解决工具太多占上下文的问题\n\n当 MCP 工具很多时:\n\n- 工具定义会吃掉上下文窗口\n\n官方提供 `ENABLE_TOOL_SEARCH`:\n\n- 默认 `auto`\n- 超过阈值时延迟加载\n\n这对大型企业工具平台很重要。", "subs": ["1. MCP 是 Agent 的外部能力总线", "2. MCP 工具名称有固定前缀", "3. MCP 工具也必须显式授权", "4. 三种传输方式", "5. Tool search 用来解决工具太多占上下文的问题"]}, {"title": "MCP 接入图", "content": "```mermaid\ngraph TD\n    A[Agent SDK] --> B[Built in Tools]\n    A --> C[MCP Servers]\n    C --> D[stdio server]\n    C --> E[HTTP SSE server]\n    C --> F[SDK MCP server]\n    C --> G[GitHub DB Slack Internal API]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 添加 HTTP MCP server\n\n```python\noptions = ClaudeAgentOptions(\n    mcp_servers={\n        \"claude-code-docs\": {\n            \"type\": \"http\",\n            \"url\": \"https://code.claude.com/docs/mcp\",\n        }\n    },\n    allowed_tools=[\"mcp__claude-code-docs__*\"],\n)\n```\n\n#### 2. 添加 stdio MCP server\n\n```python\noptions = ClaudeAgentOptions(\n    mcp_servers={\n        \"github\": {\n            \"command\": \"npx\",\n            \"args\": [\"-y\", \"@modelcontextprotocol/server-github\"],\n            \"env\": {\"GITHUB_TOKEN\": os.environ[\"GITHUB_TOKEN\"]},\n        }\n    },\n    allowed_tools=[\"mcp__github__list_issues\"],\n)\n```\n\n#### 3. 启用 tool search\n\n```python\noptions = ClaudeAgentOptions(\n    mcp_servers={...},\n    env={\"ENABLE_TOOL_SEARCH\": \"auto:5\"},\n)\n```\n\n#### 4. 检查服务连接状态\n\n```python\nif isinstance(message, SystemMessage) and message.subtype == \"init\":\n    failed_servers = [\n        s for s in message.data.get(\"mcp_servers\", [])\n        if s.get(\"status\") != \"connected\"\n    ]\n```", "subs": ["1. 添加 HTTP MCP server", "2. 添加 stdio MCP server", "3. 启用 tool search", "4. 检查服务连接状态"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. MCP 是企业落地最关键的扩展点\n- 因为真实运维场景离不开外部系统\n\n2. 权限要细到 server 或 tool 级别\n- 不要一上来全放开 `mcp__*`\n\n3. Tool search 对大型工具集很重要\n- 否则上下文会被工具定义吃掉\n\n4. 认证信息要优先走环境变量 头部 或代理\n- 不要把密钥写进 prompt\n\n5. 连接状态必须在 `init` 消息阶段就检查\n- 否则 Agent 运行到一半才发现工具不可用", "subs": ["因为真实运维场景离不开外部系统", "不要一上来全放开 mcp__*", "否则上下文会被工具定义吃掉", "不要把密钥写进 prompt", "否则 Agent 运行到一半才发现工具不可用"]}, {"title": "实战建议", "content": "1. 先从只读 MCP 工具开始\n- GitHub issue 查询\n- 文档查询\n- 数据库只读查询\n\n2. 用 `allowed_tools` 做最小授权\n3. 对远程 MCP 服务统一纳入网络与代理治理\n4. 对连接失败做启动期告警\n5. 工具数很多时提前启用 tool search", "subs": ["GitHub issue 查询", "文档查询", "数据库只读查询"]}, {"title": "小结", "content": "`MCP` 是 Claude Agent SDK 连接企业外部系统的标准化扩展面。对运维和 SRE 平台来说 它往往决定了 Agent 能否真正融入现有工具链。`", "subs": []}]}, {"title": "17. 自定义工具 (Custom Tools)", "sections": [{"title": "本章目标", "content": "本章讲如何把你自己的业务能力封装成 Agent 可调用工具。重点包括:\n\n- 自定义工具和 MCP 的关系\n- 如何定义工具 schema\n- 怎样限制允许的工具\n- 工具错误怎么返回", "subs": ["自定义工具和 MCP 的关系", "如何定义工具 schema", "怎样限制允许的工具", "工具错误怎么返回"]}, {"title": "原文要点整理", "content": "`custom-tools.html` 的核心思路是:\n\n- 自定义工具本质上通过 in-process MCP server 暴露给 Agent\n- TypeScript 用 `tool` 和 `createSdkMcpServer`\n- Python 用 `@tool` 和 `create_sdk_mcp_server`\n\n也就是说 自定义工具不是旁路机制 而是 SDK 内嵌版 MCP。", "subs": ["自定义工具本质上通过 in", "TypeScript 用 tool 和 createSdkMcpServer", "Python 用 @tool 和 create_sdk_mcp_server"]}, {"title": "核心概念", "content": "#### 1. 自定义工具是业务能力的标准封装层\n\n适合封装:\n\n- 数据库查询\n- 内部 API 调用\n- CMDB 查询\n- 发布系统操作\n- 审批系统接入\n\n对 SRE 来说 这比让 Claude 直接拼 Bash 或拼 HTTP 更可靠。\n\n#### 2. 工具输入必须有 schema\n\n工具定义至少包含:\n\n- 名称\n- 描述\n- 输入 schema\n- 异步执行函数\n\n这意味着你可以把工具当作“有类型的能力接口”。\n\n#### 3. 工具暴露后仍需权限控制\n\n工具名称会变成:\n\n- `mcp__<server>__<tool>`\n\n然后继续受 `allowed_tools` 控制。这一点非常重要:\n\n- 定义工具不等于默认放开工具\n\n#### 4. 自定义工具更适合收口外部系统访问\n\n比如:\n\n- 不让 Agent 直接访问数据库\n- 而是只给一个 `query_database` 工具\n- 由工具内部完成认证 审计 和安全过滤", "subs": ["1. 自定义工具是业务能力的标准封装层", "2. 工具输入必须有 schema", "3. 工具暴露后仍需权限控制", "4. 自定义工具更适合收口外部系统访问"]}, {"title": "关键代码或配置示例", "content": "#### 1. Python 自定义工具\n\n```python\nfrom claude_agent_sdk import tool, create_sdk_mcp_server\nfrom typing import Any\n\n\n@tool(\n    \"get_weather\",\n    \"Get current temperature for a location using coordinates\",\n    {\"latitude\": float, \"longitude\": float},\n)\nasync def get_weather(args: dict[str, Any]) -> dict[str, Any]:\n    return {\n        \"content\": [\n            {\n                \"type\": \"text\",\n                \"text\": \"Temperature: 72F\",\n            }\n        ]\n    }\n\n\ncustom_server = create_sdk_mcp_server(\n    name=\"my-custom-tools\",\n    version=\"1.0.0\",\n    tools=[get_weather],\n)\n```\n\n#### 2. 接入 Agent\n\n```python\noptions = ClaudeAgentOptions(\n    mcp_servers={\"my-custom-tools\": custom_server},\n    allowed_tools=[\"mcp__my-custom-tools__get_weather\"],\n)\n```\n\n#### 3. 数据库工具示意\n\n文档里的数据库例子很有代表性:\n\n- Agent 调 `query_database`\n- 工具内部访问 DB\n- 返回结构化文本结果\n\n这比直接给 Agent DB 凭据更可控。\n\n#### 4. 错误处理\n\n工具内部应捕获异常并返回可解释错误:\n\n```python\nexcept Exception as e:\n    return {\n        \"content\": [{\"type\": \"text\", \"text\": f\"Failed to fetch data: {str(e)}\"}]\n    }\n```", "subs": ["1. Python 自定义工具", "2. 接入 Agent", "3. 数据库工具示意", "4. 错误处理"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 自定义工具是接内部系统的首选方式\n2. 它天然适合加认证 审计 限流 结果脱敏\n3. schema 设计决定了工具是否稳定好用\n4. 工具应尽量幂等或可回放", "subs": []}, {"title": "实战建议", "content": "1. 先把高价值只读能力封装成工具\n- 查询服务状态\n- 查 CMDB\n- 查工单\n- 查监控\n\n2. 写工具时把错误转为可读文本 不要把原始堆栈直接暴露给模型\n3. 用 `allowed_tools` 精确开放单个工具\n4. 不要让工具函数内部再随意拼接高危命令", "subs": ["查询服务状态", "查 CMDB", "查工单", "查监控"]}, {"title": "小结", "content": "`Custom Tools` 是把企业内部能力安全地暴露给 Agent 的最佳入口。对运维平台来说 它往往比直接开放 Bash 更可控 也更容易治理。`", "subs": []}]}, {"title": "18. 子代理 (Subagents)", "sections": [{"title": "本章目标", "content": "本章讲如何把复杂任务拆给多个专门 Agent。重点包括:\n\n- 子代理为什么有价值\n- 如何定义子代理\n- 怎样限制子代理工具\n- 如何观测和恢复子代理", "subs": ["子代理为什么有价值", "如何定义子代理", "怎样限制子代理工具", "如何观测和恢复子代理"]}, {"title": "原文要点整理", "content": "`subagents.html` 把子代理定义为:\n\n- 主代理可派生的独立 Agent 实例\n- 用于聚焦上下文 并行处理 和专项能力注入\n\n文档推荐的方式是程序化定义 `agents`。", "subs": ["主代理可派生的独立 Agent 实例", "用于聚焦上下文 并行处理 和专项能力注入"]}, {"title": "核心概念", "content": "#### 1. 子代理的本质是上下文隔离\n\n主代理不必把所有搜索细节都塞进主上下文。子代理可以:\n\n- 单独探索\n- 单独分析\n- 最后只把结论带回来\n\n这对大型代码库或复杂运维调查很重要。\n\n#### 2. 子代理还能并行\n\n一个经典场景是:\n\n- 一个子代理看安全\n- 一个看测试\n- 一个看架构\n\n相比主代理串行做 会明显更快。\n\n#### 3. 触发子代理依赖 `Task` 工具\n\n要启用子代理:\n\n- 主代理必须有 `Task`\n- 子代理自身不能再有 `Task`\n\n因为子代理不能继续生成子代理。\n\n#### 4. 描述字段决定 Claude 是否会自动委派\n\n`description` 不是装饰字段 它直接影响:\n\n- Claude 会不会选中这个子代理\n\n所以描述要写成“什么时候用它”。\n\n#### 5. 子代理也可恢复\n\n文档说明:\n\n- 子代理 transcript 独立保存\n- 可以在同一 session 中继续恢复\n- `parent_tool_use_id` 可帮助识别哪些消息来自子代理", "subs": ["1. 子代理的本质是上下文隔离", "2. 子代理还能并行", "3. 触发子代理依赖 Task 工具", "4. 描述字段决定 Claude 是否会自动委派", "5. 子代理也可恢复"]}, {"title": "主代理与子代理关系图", "content": "```mermaid\ngraph TD\n    A[Main Agent] --> B[Task tool]\n    B --> C[Code Reviewer]\n    B --> D[Test Runner]\n    B --> E[Security Reviewer]\n    C --> F[Focused context]\n    D --> G[Run commands]\n    E --> H[Read only analysis]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 定义两个子代理\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions, AgentDefinition\n\nasync for message in query(\n    prompt=\"Review the authentication module for security issues\",\n    options=ClaudeAgentOptions(\n        allowed_tools=[\"Read\", \"Grep\", \"Glob\", \"Task\"],\n        agents={\n            \"code-reviewer\": AgentDefinition(\n                description=\"Expert code review specialist.\",\n                prompt=\"Analyze code quality and suggest improvements.\",\n                tools=[\"Read\", \"Grep\", \"Glob\"],\n                model=\"sonnet\",\n            ),\n            \"test-runner\": AgentDefinition(\n                description=\"Runs and analyzes test suites.\",\n                prompt=\"Run tests and explain failures.\",\n                tools=[\"Bash\", \"Read\", \"Grep\"],\n            ),\n        },\n    ),\n):\n    print(message)\n```\n\n#### 2. 检测子代理执行\n\n文档给出的判定点包括:\n\n- `Task` 工具调用\n- `parent_tool_use_id`\n\n这让你可以在日志里识别:\n\n- 谁派生了子代理\n- 哪些消息属于子代理上下文\n\n#### 3. 恢复子代理\n\n恢复时需要:\n\n- 保存主 session ID\n- 从消息内容里提取 agent ID\n- 再用 `resume=session_id` 配合 agent ID 继续", "subs": ["1. 定义两个子代理", "2. 检测子代理执行", "3. 恢复子代理"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 子代理很适合拆分复杂调查任务\n2. 每个子代理应有最小工具集\n3. 高风险能力不要默认继承给所有子代理\n4. 子代理日志和 transcript 应单独可追踪", "subs": []}, {"title": "实战建议", "content": "1. 给子代理明确角色和使用时机\n2. 工具集尽量最小化\n3. 高价值场景优先尝试:\n- 安全审查子代理\n- 测试执行子代理\n- 文档总结子代理\n- 指标分析子代理\n\n4. 平台监控中单独标记 `Task` 和 `parent_tool_use_id`", "subs": ["安全审查子代理", "测试执行子代理", "文档总结子代理", "指标分析子代理"]}, {"title": "小结", "content": "`Subagents` 让 Agent 从单线程思考升级为分工协作系统。对运维和 SRE 来说 它尤其适合复杂排障和多维度分析。`", "subs": []}]}, {"title": "19. Slash 命令 (Slash Commands)", "sections": [{"title": "本章目标", "content": "本章讲如何在 SDK 中使用和扩展 Claude Code 的 Slash 命令。重点包括:\n\n- 内建 Slash 命令如何发现和调用\n- 自定义命令如何落在文件系统\n- 命令里的参数 占位符 文件引用和 Bash 嵌入", "subs": ["内建 Slash 命令如何发现和调用", "自定义命令如何落在文件系统", "命令里的参数 占位符 文件引用和 Bash 嵌入"]}, {"title": "原文要点整理", "content": "`slash-commands.html` 说明 Slash 命令本质上是以 `/` 开头的特殊指令。SDK 支持:\n\n- 读取已有命令列表\n- 直接发送 `/compact` `/clear`\n- 从 `.claude/commands/` 载入自定义命令", "subs": ["读取已有命令列表", "直接发送 /compact /clear", "从 .claude/commands/ 载入自定义命令"]}, {"title": "核心概念", "content": "#### 1. Slash 命令是会话控制层\n\n它不只是“快捷短语” 还可以:\n\n- 压缩上下文\n- 清空对话\n- 调用自定义工作流模板\n\n#### 2. 自定义命令本质上是 Markdown 模板\n\n一个命令文件通常包含:\n\n- frontmatter\n- 命令正文\n\nfrontmatter 可以定义:\n\n- `description`\n- `allowed-tools`\n- `argument-hint`\n\n正文则是给 Claude 的任务模板。\n\n#### 3. 命令支持动态参数和文件引用\n\n文档列出了几个很实用的能力:\n\n- `$1` `$2` `$ARGUMENTS` 参数占位\n- `@file` 引入文件内容\n- `!` 内联 Bash 输出\n\n这意味着 Slash 命令非常适合沉淀团队固定工作流。", "subs": ["1. Slash 命令是会话控制层", "2. 自定义命令本质上是 Markdown 模板", "3. 命令支持动态参数和文件引用"]}, {"title": "关键代码或配置示例", "content": "#### 1. 发送内建命令\n\n```python\nasync for message in query(prompt=\"/compact\", options={\"max_turns\": 1}):\n    if message.type == \"system\" and message.subtype == \"compact_boundary\":\n        print(\"Compaction completed\")\n```\n\n#### 2. 自定义命令文件\n\n例如 `.claude/commands/code-review.md`:\n\n```markdown\n---\nallowed-tools: Read, Grep, Glob, Bash(git diff:*)\ndescription: Comprehensive code review\n---\n\n## Changed Files\n!`git diff --name-only HEAD~1`\n\n## Detailed Changes\n!`git diff HEAD~1`\n```\n\n#### 3. 参数化命令\n\n```markdown\n---\nargument-hint: [issue-number] [priority]\ndescription: Fix a GitHub issue\n---\n\nFix issue #$1 with priority $2.\n```", "subs": ["1. 发送内建命令", "2. 自定义命令文件", "3. 参数化命令"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. Slash 命令很适合沉淀运维标准动作\n- 发布前检查\n- 配置审计\n- 变更复盘\n- 值班交接\n\n2. `@file` 和 `!bash` 让命令模板非常强大\n3. 需要注意命令本身也会引入工具权限问题", "subs": ["发布前检查", "配置审计", "变更复盘", "值班交接"]}, {"title": "实战建议", "content": "1. 把高频流程沉淀成自定义命令\n2. 优先做只读型命令模板\n3. 对 Bash 嵌入严格限制范围\n4. 给命令命名和描述统一规范", "subs": []}, {"title": "小结", "content": "`Slash 命令` 是把重复性操作模板化的方式。它特别适合团队沉淀运维工作流和固定审查清单。`", "subs": []}]}, {"title": "20. 技能 (Skills)", "sections": [{"title": "本章目标", "content": "本章讲 Skills 如何让 Claude 在适当时机自动调用专门能力。重点包括:\n\n- Skills 与 subagents 的差别\n- SDK 如何加载 Skills\n- 为什么必须启用 `Skill` 工具和 `setting_sources`\n- SDK 中的工具限制注意事项", "subs": ["Skills 与 subagents 的差别", "SDK 如何加载 Skills", "为什么必须启用 Skill 工具和 setting_sources", "SDK 中的工具限制注意事项"]}, {"title": "原文要点整理", "content": "`skills.html` 把 Skill 定义为:\n\n- 放在文件系统里的 `SKILL.md`\n- Claude 根据描述自动发现并按需触发\n\n它不是程序化注册的能力 而是文件系统工件。", "subs": ["放在文件系统里的 SKILL", "Claude 根据描述自动发现并按需触发"]}, {"title": "核心概念", "content": "#### 1. Skill 是模型自主调用的专长模块\n\n与 subagent 不同:\n\n- subagent 更像可分派子任务执行者\n- Skill 更像按场景自动触发的专用能力说明书\n\n#### 2. SDK 默认不会加载 Skills\n\n必须显式配置:\n\n- `setting_sources=[\"user\", \"project\"]`\n\n否则 `.claude/skills/` 不会被扫描。\n\n#### 3. 还必须开放 `Skill` 工具\n\n只加载目录还不够 还要:\n\n- `allowed_tools=[\"Skill\", ...]`\n\n这样 Claude 才能实际调用 Skill。\n\n#### 4. SDK 中 `SKILL.md` 的 `allowed-tools` frontmatter 不生效\n\n这是很关键的差异:\n\n- CLI 里 Skill frontmatter 可能控制工具\n- SDK 里仍应以主配置中的 `allowed_tools` 为准", "subs": ["1. Skill 是模型自主调用的专长模块", "2. SDK 默认不会加载 Skills", "3. 还必须开放 Skill 工具", "4. SDK 中 SKILL.md 的 allowed-tools frontmat"]}, {"title": "关键代码或配置示例", "content": "```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions\n\noptions = ClaudeAgentOptions(\n    cwd=\"/path/to/project\",\n    setting_sources=[\"user\", \"project\"],\n    allowed_tools=[\"Skill\", \"Read\", \"Write\", \"Bash\"],\n)\n\nasync for message in query(\n    prompt=\"Help me process this PDF document\", options=options\n):\n    print(message)\n```", "subs": []}, {"title": "运维工程师 / SRE 关注点", "content": "1. Skills 很适合沉淀团队最佳实践\n- 故障排查套路\n- 日志分析流程\n- 配置审查规则\n\n2. 它比把所有知识都塞进 prompt 更可维护\n3. 项目级与用户级 Skill 可以分层管理\n4. 权限控制仍由主 SDK 配置决定", "subs": ["故障排查套路", "日志分析流程", "配置审查规则"]}, {"title": "实战建议", "content": "1. 先为高频且规则稳定的场景写 Skills\n2. Skill 描述要写清触发条件\n3. 在 SDK 中显式开启:\n- `setting_sources`\n- `Skill` 工具\n\n4. 对 Skill 做专门测试 不要只看它是否存在", "subs": ["setting_sources", "Skill 工具"]}, {"title": "小结", "content": "`Skills` 让 Claude 能够按场景自动套用专业工作流。对于运维团队 它非常适合沉淀重复性强 规则明确的操作知识。`", "subs": []}]}, {"title": "21. 成本与用量跟踪 (Cost Tracking)", "sections": [{"title": "本章目标", "content": "本章讲如何正确统计 Agent 成本和 token 用量。重点包括:\n\n- 每次 `query()` 的成本如何读取\n- TypeScript 与 Python 的粒度差异\n- 多步工具调用如何避免重复计数\n- 错误和缓存 token 如何处理", "subs": ["每次 query() 的成本如何读取", "TypeScript 与 Python 的粒度差异", "多步工具调用如何避免重复计数", "错误和缓存 token 如何处理"]}, {"title": "原文要点整理", "content": "`cost-tracking.html` 给出的核心结论是:\n\n- 每次 `query()` 调用最终都会有 `ResultMessage`\n- 它的 `total_cost_usd` 是该次调用的权威成本\n- Python 主要看最终累计\n- TypeScript 还可以看每一步和每个模型的拆分", "subs": ["每次 query() 调用最终都会有 ResultMessage", "它的 total_cost_usd 是该次调用的权威成本", "Python 主要看最终累计", "TypeScript 还可以看每一步和每个模型的拆分"]}, {"title": "核心概念", "content": "#### 1. 成本统计单位首先是 `query()` 调用\n\n不是整个 session 自动累计。\n\n这意味着:\n\n- 如果你一个会话里调用了三次 `query()`\n- 需要自己把三次结果累加\n\n#### 2. Python 和 TypeScript 暴露粒度不同\n\n- Python 重点看 `ResultMessage.total_cost_usd` 和 `usage`\n- TypeScript 还能在 assistant message 上看每步 usage\n\n#### 3. 并行工具调用会导致消息重复\n\nTypeScript 文档特别提醒:\n\n- 多个 assistant message 可能共享同一个 message ID\n- 如果你逐条累加 会重复统计\n- 必须按 message ID 去重\n\n#### 4. 失败调用也会消耗成本\n\n即使最终结果是 error:\n\n- 仍然应该读取 `total_cost_usd`\n\n因为失败前已经消耗了 token。\n\n#### 5. 缓存 token 要单独看\n\nSDK 会自动使用 prompt caching。你可以在 usage 中看到:\n\n- `cache_creation_input_tokens`\n- `cache_read_input_tokens`\n\n这对成本优化分析很有帮助。", "subs": ["1. 成本统计单位首先是 query() 调用", "2. Python 和 TypeScript 暴露粒度不同", "3. 并行工具调用会导致消息重复", "4. 失败调用也会消耗成本", "5. 缓存 token 要单独看"]}, {"title": "关键代码或配置示例", "content": "#### 1. 读取单次调用总成本\n\n```python\nfrom claude_agent_sdk import query, ResultMessage\n\nasync for message in query(prompt=\"Summarize this project\"):\n    if isinstance(message, ResultMessage):\n        print(f\"Total cost: ${message.total_cost_usd or 0}\")\n```\n\n#### 2. 累计多次调用成本\n\n```python\ntotal_spend = 0.0\n\nfor prompt in prompts:\n    async for message in query(prompt=prompt):\n        if isinstance(message, ResultMessage):\n            cost = message.total_cost_usd or 0\n            total_spend += cost\n```\n\n#### 3. TypeScript 去重思路\n\n这章最重要的 TypeScript 细节是:\n\n- 按 `message.message.id` 去重\n- 避免把并行工具调用重复统计成多步", "subs": ["1. 读取单次调用总成本", "2. 累计多次调用成本", "3. TypeScript 去重思路"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 计费统计最好在平台层统一做\n2. 失败调用也必须记账\n3. 长会话成本容易被低估 因为它分散在多次 `query()`\n4. 子代理和多模型时 更要看 per-model usage", "subs": []}, {"title": "实战建议", "content": "1. 永远以 `ResultMessage.total_cost_usd` 为主\n2. session 级成本自行累计\n3. TypeScript 平台对每步 usage 去重统计\n4. 单独监控缓存命中相关 token\n5. 对高成本任务加预算阈值和告警", "subs": []}, {"title": "小结", "content": "`Cost Tracking` 的核心不是“看一眼花了多少钱” 而是建立一套可信的成本口径。对 SRE 来说 这直接关系到预算治理 配额控制 和平台可持续运行。`", "subs": []}]}, {"title": "22. 插件 (Plugins)", "sections": [{"title": "本章目标", "content": "本章讲如何通过插件把命令 子代理 Skills Hooks 和 MCP server 成组加载进 Agent SDK。重点包括:\n\n- 插件是什么\n- 如何加载本地插件\n- 如何验证插件已生效\n- 插件命令的命名空间规则", "subs": ["插件是什么", "如何加载本地插件", "如何验证插件已生效", "插件命令的命名空间规则"]}, {"title": "原文要点整理", "content": "`plugins.html` 把插件描述为 Claude Code 扩展包。一个插件可以包含:\n\n- Commands\n- Agents\n- Skills\n- Hooks\n- MCP servers\n\nSDK 通过本地路径加载插件目录。", "subs": ["Commands", "Agents", "Skills", "Hooks", "MCP servers"]}, {"title": "核心概念", "content": "#### 1. 插件是扩展能力的打包分发形式\n\n如果说:\n\n- Slash command 是单个模板\n- Skill 是单个专长\n- MCP server 是单个外部能力\n\n那么 Plugin 更像把这些东西打成一个可复用包。\n\n#### 2. 插件通过本地路径加载\n\n你需要传入:\n\n- 相对路径或绝对路径\n\n路径应指向插件根目录 即包含:\n\n- `.claude-plugin/plugin.json`\n\n#### 3. 插件加载后会出现在 init 消息里\n\n最可靠的验证方式是检查:\n\n- `message.plugins`\n- `message.slash_commands`\n\n这样能确认插件是否真的被 SDK 识别。\n\n#### 4. 插件命令带命名空间\n\n插件命令格式为:\n\n- `plugin-name:command-name`\n\n这有助于避免和其他命令冲突。", "subs": ["1. 插件是扩展能力的打包分发形式", "2. 插件通过本地路径加载", "3. 插件加载后会出现在 init 消息里", "4. 插件命令带命名空间"]}, {"title": "插件组成图", "content": "```mermaid\ngraph TD\n    A[Plugin Root] --> B[plugin.json]\n    A --> C[commands]\n    A --> D[agents]\n    A --> E[skills]\n    A --> F[hooks]\n    A --> G[mcp config]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 加载插件\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions\n\noptions = ClaudeAgentOptions(\n    plugins=[{\"type\": \"local\", \"path\": \"./my-plugin\"}],\n    max_turns=3,\n)\n\nasync for message in query(\n    prompt=\"What custom commands do you have available?\", options=options\n):\n    print(message)\n```\n\n#### 2. 验证插件\n\n```python\nif message.type == \"system\" and message.subtype == \"init\":\n    print(message.data.get(\"plugins\"))\n    print(message.data.get(\"slash_commands\"))\n```\n\n#### 3. 使用插件命令\n\n```python\nasync for message in query(\n    prompt=\"/demo-plugin:greet\",\n    options={\"plugins\": [{\"type\": \"local\", \"path\": \"./plugins/demo-plugin\"}]},\n):\n    print(message)\n```", "subs": ["1. 加载插件", "2. 验证插件", "3. 使用插件命令"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 插件很适合团队共享整套运维工作流\n2. 项目内可维护 project-specific plugin 保持一致性\n3. 多插件来源时要注意路径和优先级\n4. 插件本身也应纳入版本控制和审计", "subs": []}, {"title": "实战建议", "content": "1. 将成熟的命令 Skill Hook 和 MCP 配置打包为团队插件\n2. 在 init 阶段做插件加载健康检查\n3. 命令调用统一使用命名空间\n4. 相对路径不稳定时直接用绝对路径", "subs": []}, {"title": "小结", "content": "`Plugins` 是 Claude Agent SDK 的组织化扩展机制。对团队化运维场景 它能把零散能力打包成统一可复用的工作流组件。`", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
