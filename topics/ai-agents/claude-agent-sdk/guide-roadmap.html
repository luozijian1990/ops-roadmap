<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Claude Agent SDK 中文学习文档 · Roadmap</title>

    tex: {inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$'], ['\\[','\\]']]},
    options: {skipHtmlTags: ['script','noscript','style','textarea','pre','code']},

  };

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({startOnLoad:false, theme:'base', themeVariables:{
    background:'#fffdf5', primaryColor:'#fff9d6', primaryBorderColor:'#1f2933',
    primaryTextColor:'#1f2933', lineColor:'#1f2933', fontFamily:'inherit'}});
  window.__mermaid = mermaid;
</script>
<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>Claude Agent SDK 中文学习文档</h1>
  <div class="meta">
    <a class="back" href="../../../index.html">← 返回总览</a>
    <div class="legend">
      <span><span class="dot todo"></span>待学</span>
      <span><span class="dot doing"></span>在学</span>
      <span><span class="dot done"></span>已学</span>
    </div>
    <div class="progress" title="学习进度"><span id="bar"></span></div>
    <span id="progress-text">0 / 0</span>
    <span class="search"><input id="search" type="search" placeholder="搜索小节…"></span>
    <button class="reset" id="reset">重置进度</button>
  </div>
</header>
<main id="roadmap"></main>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-resizer" id="drawer-resizer" role="separator" aria-orientation="vertical"
    aria-label="调整笔记面板宽度" aria-valuemin="360" tabindex="0"></div>
  <header>
    <h2 id="d-title"></h2>
    <div class="toggle-group" data-role="status">
      <button data-status="todo">待学</button>
      <button data-status="doing">在学</button>
      <button data-status="done">已学</button>
    </div>
    <button class="edit-btn edit-only" id="edit-section">编辑</button>
    <button class="close" id="d-close">×</button>
  </header>
  <div class="nav-hint"><kbd>←</kbd><kbd>→</kbd> 切换小节</div>
  <div class="tags-bar empty" id="d-tags"></div>
  <div class="edit-actions edit-only" id="edit-actions">
    <input class="edit-title" id="edit-title" type="text" aria-label="小节标题">
    <button class="save" id="save-section">保存</button>
    <button class="cancel" id="cancel-edit">取消</button>
    <span class="save-state" id="save-state"></span>
  </div>
  <div class="body" id="d-body"></div>
  <textarea class="editor-body" id="edit-content" spellcheck="false" aria-label="小节内容"></textarea>
</aside>
<div class="diagram-backdrop" id="diagram-backdrop"></div>
<section class="diagram-modal" id="diagram-modal" role="dialog" aria-modal="true" aria-label="放大图表">
  <header>
    <strong>Mermaid 图表</strong>
    <div class="diagram-controls" aria-label="图表缩放">
      <button id="diagram-zoom-out" title="缩小">-</button>
      <span class="diagram-zoom" id="diagram-zoom">100%</span>
      <button id="diagram-zoom-in" title="放大">+</button>
    </div>
    <button class="diagram-close" id="diagram-close" title="关闭">×</button>
  </header>
  <div class="diagram-body" id="diagram-body">
    <div class="diagram-canvas" id="diagram-canvas">
      <div class="diagram-inner" id="diagram-inner"></div>
    </div>
  </div>
</section>

<script id="data" type="application/json">{"title": "Claude Agent SDK 中文学习文档", "intro": "> 适用人群: 运维工程师 / SRE\n> \n> 文档定位: 基于 Claude Agent SDK 官网文档整理的系统化中文学习笔记\n> \n> 术语说明: 下文将 `Claude Agent SDK` 简称为 `Agent SDK`", "parts": [{"title": "学习目标", "sections": [{"title": "概述", "content": "1. 理解 Claude Agent SDK 的定位 能力边界 和与 Claude Code 及普通 LLM API 的差异\n2. 掌握 Agent SDK 的核心能力 包括工具调用 会话管理 权限控制 Hooks 流式输出 结构化输出 子代理和 MCP 扩展\n3. 能从运维工程师和 SRE 视角评估如何把 Agent SDK 用于自动化巡检 变更审核 运行手册执行 审批流和外部系统集成\n4. 为后续落地生产级 Agent 打下基础 尤其关注安全 审计 成本 可恢复性 和托管方式", "subs": []}]}, {"title": "阅读建议", "sections": [{"title": "概述", "content": "1. 建议先读第 1 章到第 3 章 先建立整体认识和 API 使用方式\n2. 如果你主要关心生产落地 可重点关注第 7 章到第 16 章 包括权限 Hooks 用户输入 会话 托管 安全部署和 MCP\n3. 如果你主要关心工程扩展能力 可重点关注第 17 章到第 22 章 包括自定义工具 子代理 Slash 命令 技能 成本跟踪和插件\n4. 文中默认以 Python 和 TypeScript 两种官方支持语言为主 但会更偏向运维和 SRE 易落地的理解方式", "subs": []}]}, {"title": "术语约定", "sections": [{"title": "概述", "content": "为避免同一概念在不同章节里出现多种说法 本文采用以下约定:\n\n- `Agent` 译作“代理” 需要强调产品形态时保留 `Agent`\n- `Tool` 译作“工具”\n- `Session` 译作“会话”\n- `Subagent` 译作“子代理”\n- `Hook` 或 `Hooks` 保留原名 首次出现时按“Hook 机制”理解\n- `system prompt` 译作“系统提示词”\n- `Structured Output` 译作“结构化输出”\n- `Slash Commands` 译作“Slash 命令”\n- `Skills` 译作“技能”\n- `MCP` 保留原缩写 首次出现时按“外部工具协议接入层”理解即可", "subs": ["Agent 译作“代理” 需要强调产品形态时保留 Agent", "Tool 译作“工具”", "Session 译作“会话”", "Subagent 译作“子代理”", "Hook 或 Hooks 保留原名 首次出现时按“Hook 机制”理解", "system prompt 译作“系统提示词”"]}]}, {"title": "目录", "sections": [{"title": "概述", "content": "- [1. 概述 (Overview)](#1-概述-overview)\n- [2. 快速入门 (Quickstart)](#2-快速入门-quickstart)\n- [3. Python SDK 参考 (Python SDK Reference)](#3-python-sdk-参考-python-sdk-reference)\n- [4. 输入模式 (Streaming Input vs Single Message)](#4-输入模式-streaming-input-vs-single-message)\n- [5. 停止原因处理 (Stop Reasons)](#5-停止原因处理-stop-reasons)\n- [6. 实时流式输出 (Streaming Output)](#6-实时流式输出-streaming-output)\n- [7. 权限配置 (Permissions)](#7-权限配置-permissions)\n- [8. Hooks 机制 (Hooks)](#8-hooks-机制-hooks)\n- [9. 审批与用户输入 (User Input)](#9-审批与用户输入-user-input)\n- [10. 会话管理 (Sessions)](#10-会话管理-sessions)\n- [11. 文件检查点与回滚 (File Checkpointing)](#11-文件检查点与回滚-file-checkpointing)\n- [12. 托管与部署 (Hosting)](#12-托管与部署-hosting)\n- [13. 结构化输出 (Structured Outputs)](#13-结构化输出-structured-outputs)\n- [14. 修改系统提示词 (Modifying System Prompts)](#14-修改系统提示词-modifying-system-prompts)\n- [15. 安全部署 (Secure Deployment)](#15-安全部署-secure-deployment)\n- [16. MCP 外部工具集成 (MCP)](#16-mcp-外部工具集成-mcp)\n- [17. 自定义工具 (Custom Tools)](#17-自定义工具-custom-tools)\n- [18. 子代理 (Subagents)](#18-子代理-subagents)\n- [19. Slash 命令 (Slash Commands)](#19-slash-命令-slash-commands)\n- [20. 技能 (Skills)](#20-技能-skills)\n- [21. 成本与用量跟踪 (Cost Tracking)](#21-成本与用量跟踪-cost-tracking)\n- [22. 插件 (Plugins)](#22-插件-plugins)", "subs": ["1. 概述 (Overview)", "2. 快速入门 (Quickstart)", "3. Python SDK 参考 (Python SDK Reference)", "4. 输入模式 (Streaming Input vs Single Message", "5. 停止原因处理 (Stop Reasons)", "6. 实时流式输出 (Streaming Output)"]}]}, {"title": "1. 概述 (Overview)", "sections": [{"title": "本章目标", "content": "本章用于建立对 Claude Agent SDK 的第一层整体认知 重点回答下面几个问题:\n\n- Claude Agent SDK 到底是什么\n- 它和普通的 Claude API 或 Claude Code CLI 有什么区别\n- 它默认提供了哪些能力\n- 为什么它对运维工程师和 SRE 有现实价值\n- 第一个可以跑起来的 Agent 最少需要哪些条件", "subs": ["Claude Agent SDK 到底是什么", "它和普通的 Claude API 或 Claude Code CLI 有什么区别", "它默认提供了哪些能力", "为什么它对运维工程师和 SRE 有现实价值", "第一个可以跑起来的 Agent 最少需要哪些条件"]}, {"title": "原文要点整理", "content": "`overview.html` 是整个官方文档的总入口 页面重点传达了以下信息:\n\n1. Claude Agent SDK 本质上是把 Claude Code 背后的 Agent 能力以库的形式开放出来 让开发者可以在 Python 和 TypeScript 程序里直接使用\n2. 它不是单纯的文本生成 SDK 而是带有工具调用能力的 Agent SDK Claude 可以自动读文件 写文件 编辑代码 执行命令 搜索代码 搜索网页和抓取网页\n3. SDK 内置了 Agent 循环（Agent loop） 也就是模型发起工具调用 运行工具 再继续推理的完整闭环 开发者不需要像普通 API 那样手写一整套 tool loop\n4. 入门步骤非常直接 安装 SDK 配置 API Key 之后就能运行一个最小 Agent\n5. 除了基础工具能力 官方还强调了 Hooks Subagents MCP Permissions Sessions 等生产级能力 说明这个 SDK 的定位并不是玩具 demo 而是面向真实 Agent 应用\n6. SDK 还可以读取 Claude Code 的一部分文件系统配置 比如 Skills Slash 命令和项目级记忆等 这意味着 CLI 和 SDK 之间具备较强的迁移和复用空间\n7. 文档明确把 Agent SDK 放在 Claude 平台的能力矩阵里进行对比 它位于普通 Client SDK 和 CLI 之间 更适合程序化自动化和生产集成", "subs": []}, {"title": "核心概念", "content": "#### 1. Claude Agent SDK 是什么\n\n可以把 Claude Agent SDK 理解成一个可编程的代理运行时（Agent Runtime） 它把 Claude Code 的几个关键能力打包给开发者:\n\n- 模型推理能力\n- 工具调用能力\n- 多轮 Agent 循环\n- 上下文和会话管理\n- 权限控制\n- 与外部系统集成的扩展接口\n\n这意味着你不只是调用一个模型 然后拿到一段文本 而是在运行一个可以自主完成任务的 Agent。\n\n#### 2. 它和普通 Client SDK 的差异\n\n普通 Client SDK 更接近原始大模型 API 你负责:\n\n- 发送 prompt\n- 接收模型返回的 `tool_use`\n- 自己执行工具\n- 把工具结果再喂回模型\n- 控制多轮循环何时结束\n\n而在 Agent SDK 中 这些事情被封装好了 你只需要提供目标和配置 Claude 就会自己完成工具调用闭环。\n\n这也是它最适合运维自动化场景的原因之一 因为很多运维任务天然就是多步流程 例如:\n\n- 读取配置\n- 搜索日志\n- 执行诊断命令\n- 汇总结果\n- 给出修复建议\n\n#### 3. 它和 Claude Code CLI 的差异\n\n官方给出的定位很清晰:\n\n- CLI 适合交互式开发和一次性任务\n- SDK 适合 CI CD 自定义应用和生产自动化\n\n可以简单理解成:\n\n- 如果你想在终端里直接和 Claude 协作 用 CLI\n- 如果你想把 Claude 嵌进你的平台 工单系统 自动化系统 Web 服务或内部工具 用 SDK\n\n#### 4. 内置工具能力\n\nOverview 页面首先强调的是开箱即用的工具能力 常见内置工具包括:\n\n- `Read` 读取文件\n- `Write` 创建文件\n- `Edit` 精确修改文件\n- `Bash` 执行终端命令\n- `Glob` 按模式查找文件\n- `Grep` 按内容搜索文件\n- `WebSearch` 搜索网络信息\n- `WebFetch` 抓取网页内容\n- `AskUserQuestion` 向用户发起澄清问题\n\n对 SRE 而言 这类工具集已经足够支撑很多高频任务 例如:\n\n- 分析配置仓库\n- 读取部署文件\n- 汇总巡检结果\n- 自动生成变更说明\n- 辅助编写或修正脚本\n\n#### 5. 生产级能力并不止于工具\n\nOverview 页面还快速引出了后续章节的几个重要主题:\n\n- `Hooks` 用于拦截 审计 阻断或改写 Agent 行为\n- `Subagents` 用于把复杂任务拆分给专门子代理\n- `MCP` 用于接入外部系统和第三方工具\n- `Permissions` 用于控制工具权限和审批策略\n- `Sessions` 用于跨多轮交互保留上下文\n- Claude Code 的文件系统特性 如 `Skills` `Slash 命令` `CLAUDE.md` 和 `Plugins`\n\n这些能力叠加起来 才让 Agent SDK 真正具备进入生产环境的基础。", "subs": ["1. Claude Agent SDK 是什么", "2. 它和普通 Client SDK 的差异", "3. 它和 Claude Code CLI 的差异", "4. 内置工具能力", "5. 生产级能力并不止于工具"]}, {"title": "一个高层理解图", "content": "```mermaid\ngraph TD\n    A[Your App] --> B[Claude Agent SDK]\n    B --> C[Agent Loop]\n    B --> D[Built in Tools]\n    B --> E[Permissions]\n    B --> F[Hooks]\n    B --> G[Sessions]\n    B --> H[Subagents]\n    B --> I[MCP]\n    D --> D1[Read Write Edit]\n    D --> D2[Bash Glob Grep]\n    D --> D3[WebSearch WebFetch]\n    H --> H1[Focused Tasks]\n    I --> I1[External Systems]\n```\n\n这个图可以帮助你先建立一个正确的心智模型:\n\n- 你的业务系统调用 Agent SDK\n- Agent SDK 内部维护 Agent loop\n- Claude 通过内置工具和扩展能力执行任务\n- 权限 Hooks 和会话管理决定它能做什么 何时暂停 如何被审计\n- 外部能力通过 MCP 和子代理进一步扩展", "subs": ["你的业务系统调用 Agent SDK", "Agent SDK 内部维护 Agent loop", "Claude 通过内置工具和扩展能力执行任务", "权限 Hooks 和会话管理决定它能做什么 何时暂停 如何被审计", "外部能力通过 MCP 和子代理进一步扩展"]}, {"title": "关键代码或配置示例", "content": "#### 1. 最小可运行示例\n\n下面是 Overview 页面里最核心的最小样例之一 它说明 Agent SDK 的使用入口非常直接:\n\n```python\nimport asyncio\nfrom claude_agent_sdk import query, ClaudeAgentOptions\n\n\nasync def main():\n    async for message in query(\n        prompt=\"What files are in this directory?\",\n        options=ClaudeAgentOptions(allowed_tools=[\"Bash\", \"Glob\"]),\n    ):\n        if hasattr(message, \"result\"):\n            print(message.result)\n\n\nasyncio.run(main())\n```\n\n这个例子的含义是:\n\n- 你向 `query()` 提交任务目标\n- 通过 `ClaudeAgentOptions` 控制允许的工具\n- SDK 以异步流的方式返回消息\n- 最终结果可以从结果消息中读取\n\n对运维工程师来说 这已经足够做一个最简单的目录检查型 Agent 或配置扫描 Agent。\n\n#### 2. 安装和认证\n\nPython 安装:\n\n```bash\npip install claude-agent-sdk\n```\n\nTypeScript 安装:\n\n```bash\nnpm install @anthropic-ai/claude-agent-sdk\n```\n\n基础认证方式:\n\n```bash\nexport ANTHROPIC_API_KEY=your-api-key\n```\n\nOverview 页面还提到三类第三方后端认证方式:\n\n- Amazon Bedrock 通过 `CLAUDE_CODE_USE_BEDROCK=1`\n- Google Vertex AI 通过 `CLAUDE_CODE_USE_VERTEX=1`\n- Microsoft Azure 通过 `CLAUDE_CODE_USE_FOUNDRY=1`\n\n这说明 Agent SDK 不只绑定 Anthropic 原生 API 也为企业常见的云上模型接入方式预留了路径。\n\n#### 3. 只读审查型 Agent 示例\n\n如果你暂时不想让 Agent 修改代码或执行高风险操作 可以先从只读权限开始:\n\n```python\nimport asyncio\nfrom claude_agent_sdk import query, ClaudeAgentOptions\n\n\nasync def main():\n    async for message in query(\n        prompt=\"Review this code for best practices\",\n        options=ClaudeAgentOptions(\n            allowed_tools=[\"Read\", \"Glob\", \"Grep\"],\n        ),\n    ):\n        if hasattr(message, \"result\"):\n            print(message.result)\n\n\nasyncio.run(main())\n```\n\n这种模式非常适合运维和 SRE 在初期试点时使用 比如:\n\n- 仅读取部署仓库做配置审计\n- 只分析日志样本不落地修改\n- 只生成巡检摘要和告警解释", "subs": ["1. 最小可运行示例", "2. 安装和认证", "3. 只读审查型 Agent 示例"]}, {"title": "Claude Code 文件系统能力与 SDK 的关系", "content": "Overview 页面有一个容易被忽略但很关键的点 就是 SDK 可以加载 Claude Code 的文件系统配置能力。要启用这些能力 需要显式设置:\n\n- Python 使用 `setting_sources=[\"project\"]`\n- TypeScript 使用 `settingSources: [\"project\"]`\n\n启用后 可以读取项目中的一些约定式配置:\n\n- `Skills` 来自 `.claude/skills/SKILL.md`\n- `Slash 命令` 来自 `.claude/commands/*.md`\n- `Memory` 来自 `CLAUDE.md` 或 `.claude/CLAUDE.md`\n- `Plugins` 通过 `plugins` 选项程序化加载\n\n这意味着 如果你的团队已经在 Claude Code CLI 中维护了一套项目级知识和命令体系 那么迁移到 SDK 时可以复用一部分资产 而不是从零开始。", "subs": ["Python 使用 setting_sources=[\"project\"]", "TypeScript 使用 settingSources", "Skills 来自", "Slash 命令 来自", "Memory 来自 CLAUDE", "Plugins 通过 plugins 选项程序化加载"]}, {"title": "运维工程师 / SRE 关注点", "content": "从 SRE 视角读这一页 最值得记住的不是安装命令 而是以下五点:\n\n1. `Agent SDK = 可编排的代理运行时`\n- 它更像一个能自主完成多步任务的执行引擎 而不是单次问答接口\n\n2. `权限边界必须从第一天就设计`\n- 既然它能读文件 写文件 执行命令 权限控制就不是附加项 而是系统设计的一部分\n\n3. `审计能力需要提前考虑`\n- Hooks 和后续的用户审批机制 非常适合接入审计日志 变更记录 工单审批和操作留痕\n\n4. `会话能力很适合复杂排障`\n- 真实故障排查通常不是一句 prompt 解决的 会话恢复和上下文延续是高价值能力\n\n5. `外部系统接入是落地关键`\n- 仅靠本地文件和 Bash 不足以支撑企业运维场景 未来通常要通过 MCP 或自定义工具接入监控 CMDB 工单系统 发布系统和内部 API", "subs": ["它更像一个能自主完成多步任务的执行引擎 而不是单次问答接口", "既然它能读文件 写文件 执行命令 权限控制就不是附加项 而是系统设计的一部分", "Hooks 和后续的用户审批机制 非常适合接入审计日志 变更记录 工单审批和操作留痕", "真实故障排查通常不是一句 prompt 解决的 会话恢复和上下文延续是高价值能力", "仅靠本地文件和 Bash 不足以支撑企业运维场景 未来通常要通过 MCP 或自定义工"]}, {"title": "实战建议", "content": "如果你准备以 SRE 身份试点 Claude Agent SDK 建议先按下面顺序推进:\n\n1. 先做只读 Agent\n- 只开 `Read` `Glob` `Grep`\n- 不要一开始就开放 `Edit` 和 `Bash`\n\n2. 先做低风险场景\n- 配置审计\n- 日志归纳\n- 发布前检查\n- 巡检报告生成\n\n3. 从 Day 1 加入审计\n- 后续结合 Hooks 记录所有文件访问 工具调用和关键决策\n\n4. 明确运行环境隔离\n- 测试环境和生产环境使用不同凭据\n- 不要让同一套 Agent 默认拿到生产写权限\n\n5. 先把 Claude Code CLI 和 Agent SDK 的边界想清楚\n- 人工交互探索用 CLI\n- 要嵌入平台和自动化流程时再落到 SDK", "subs": ["只开 Read Glob Grep", "不要一开始就开放 Edit 和 Bash", "配置审计", "日志归纳", "发布前检查", "巡检报告生成"]}, {"title": "小结", "content": "Overview 页最核心的信息可以压缩成一句话:\n\n`Claude Agent SDK 是把 Claude Code 的 Agent 能力以编程库方式开放出来 让你在 Python 或 TypeScript 中构建具备工具调用 权限控制 会话管理 扩展接入和生产落地能力的 AI Agent。`\n\n对于运维工程师和 SRE 来说 它的价值不在于“能聊天” 而在于它具备成为自动化诊断 审批辅助 配置审计 运行手册执行器和外部系统编排器的潜力。\n\n后续章节会逐步展开这些能力 尤其是快速入门 Python SDK 权限 Hooks 会话 托管 安全部署和 MCP 这些真正决定能否落地生产的部分。", "subs": []}]}, {"title": "2. 快速入门 (Quickstart)", "sections": [{"title": "本章目标", "content": "本章的目标不是把所有能力讲全 而是带你完成一次最小闭环:\n\n- 准备运行环境\n- 创建一个带缺陷的示例文件\n- 写出一个最小可运行的 Agent\n- 让 Claude 自动读取文件 识别问题 并修改文件\n- 理解 Quickstart 背后最关键的几个概念 包括 `query` `prompt` `options` `allowed_tools` 和 `permission_mode`\n\n如果你是运维工程师或 SRE 可以把这一章理解成 “如何在本地先跑通第一个可控 Agent”。", "subs": ["准备运行环境", "创建一个带缺陷的示例文件", "写出一个最小可运行的 Agent", "让 Claude 自动读取文件 识别问题 并修改文件", "理解 Quickstart 背后最关键的几个概念 包括 query prompt o"]}, {"title": "原文要点整理", "content": "`quickstart.html` 的结构非常清晰 它用一个修复 Python 代码 bug 的例子 把 Agent SDK 的最小上手流程串起来:\n\n1. 准备基础环境 包括 Node.js 18+ 或 Python 3.10+ 以及 Anthropic 账号\n2. 创建一个独立项目目录 安装 Agent SDK\n3. 配置 API Key 文档示例使用项目目录下的 `.env`\n4. 创建一个故意带 bug 的 `utils.py`\n5. 编写 `agent.py` 或 `agent.ts` 调用 `query()`\n6. 给 Claude 一个明确任务 允许它使用 `Read` `Edit` `Glob` 等工具\n7. 运行 Agent 观察 Claude 如何分析文件 调用工具 并完成修改\n8. 再通过增减工具和调整选项 把 Agent 扩展成更强或更严格的版本\n\nQuickstart 真正想说明的不是“修 bug”本身 而是 Agent SDK 的执行模型:\n\n- 你给目标\n- 你给权限和配置\n- Claude 自己决定用哪些工具\n- SDK 负责协调整个 Agent loop", "subs": ["你给目标", "你给权限和配置", "Claude 自己决定用哪些工具", "SDK 负责协调整个 Agent loop"]}, {"title": "核心概念", "content": "#### 1. Quickstart 的最小闭环\n\n这一页展示的最小闭环其实只有四步:\n\n1. 让 Claude 看见目标文件\n2. 允许它使用必要工具\n3. 把执行过程以流式消息输出出来\n4. 等待结果落地到文件\n\n这说明 Agent SDK 的门槛并不高 你不需要先搭一整套复杂平台 就能验证 Agent 是否适合你的场景。\n\n#### 2. `query()` 是 Agent 的入口\n\nQuickstart 明确把 `query()` 作为核心入口函数。它返回一个异步迭代器 也就是你会持续收到消息流 而不是一次性只拿到一段最终文本。\n\n这些消息可能包括:\n\n- Claude 的文本输出\n- 工具调用信息\n- 工具执行后的结果\n- 最终完成状态\n\n这对运维场景很重要 因为很多任务不是瞬间完成的 你往往需要看到中间进度 判断 Agent 在做什么。\n\n#### 3. `prompt` 决定任务目标\n\nQuickstart 中的示例 prompt 是:\n\n`Review utils.py for bugs that would cause crashes. Fix any issues you find.`\n\n这个 prompt 的特点很值得学习:\n\n- 任务对象明确 是 `utils.py`\n- 任务范围明确 是会导致崩溃的 bug\n- 期望动作明确 是修复问题\n\n对 SRE 来说 后续你可以直接类比成:\n\n- 检查某个部署清单中的高风险配置\n- 分析某段日志里的异常模式\n- 修复某个脚本中的健壮性问题\n\n#### 4. `options` 决定边界和行为\n\nQuickstart 的 `options` 只有两个最关键字段:\n\n- `allowed_tools` 或 `allowedTools`\n- `permission_mode` 或 `permissionMode`\n\n它们分别决定:\n\n- Agent 可以做什么\n- Agent 在做这些事情时需不需要人类介入审批\n\n这也是 Agent SDK 最重要的工程思想之一: `能力` 和 `权限` 必须同时配置。\n\n#### 5. Quickstart 本质上在演示 Agent loop\n\n官方示例代码的核心不是打印输出 而是这段循环:\n\n- Claude 思考\n- Claude 请求工具\n- SDK 执行工具\n- Claude 观察结果\n- Claude 再决定下一步\n- 直到任务完成或失败\n\n这和传统 API 调用最大的区别就是 你不必自己手写这个循环。", "subs": ["1. Quickstart 的最小闭环", "2. query() 是 Agent 的入口", "3. prompt 决定任务目标", "4. options 决定边界和行为", "5. Quickstart 本质上在演示 Agent loop"]}, {"title": "快速入门执行流程图", "content": "```mermaid\ngraph TD\n    A[Setup Env] --> B[Create utils.py]\n    B --> C[Write agent.py or agent.ts]\n    C --> D[Run query]\n    D --> E[Claude reads file]\n    E --> F[Claude finds crash risks]\n    F --> G[Claude edits file]\n    G --> H[Result message]\n```\n\n你可以把这个流程看成一个最小的 Agent 运行链路。后续你做运维自动化时 只是把 `utils.py` 换成配置文件 日志 工单内容 或巡检脚本。", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 环境准备\n\nQuickstart 给出的先决条件是:\n\n- Node.js `18+` 或 Python `3.10+`\n- Anthropic 账号\n\n项目初始化方式分别是:\n\nTypeScript:\n\n```bash\nmkdir my-agent && cd my-agent\nnpm install @anthropic-ai/claude-agent-sdk\n```\n\nPython 使用 `uv`:\n\n```bash\nmkdir my-agent && cd my-agent\nuv init && uv add claude-agent-sdk\n```\n\nPython 使用 `pip`:\n\n```bash\nmkdir my-agent && cd my-agent\npython3 -m venv .venv && source .venv/bin/activate\npip3 install claude-agent-sdk\n```\n\n认证方式示例:\n\n```bash\nANTHROPIC_API_KEY=your-api-key\n```\n\n官方文档同时提到 Bedrock Vertex AI 和 Azure Foundry 三种第三方后端开关 说明 Quickstart 虽然简单 但其接入路径面向企业环境并不封闭。\n\n#### 2. 示例缺陷文件\n\nQuickstart 用一个很小的 `utils.py` 演示 Claude 如何发现“边界条件导致崩溃”的问题:\n\n```python\ndef calculate_average(numbers):\n    total = 0\n    for num in numbers:\n        total += num\n    return total / len(numbers)\n\n\ndef get_user_name(user):\n    return user[\"name\"].upper()\n```\n\n这两个 bug 分别是:\n\n1. 空列表导致除零异常\n2. `None` 导致类型异常\n\n这个设计很巧妙 因为它逼着 Agent 去做两件事:\n\n- 理解代码含义\n- 识别边界条件\n\n#### 3. 最小 Agent 示例\n\n下面这个 Python 版本是整页 Quickstart 的核心样例:\n\n```python\nimport asyncio\nfrom claude_agent_sdk import query, ClaudeAgentOptions, AssistantMessage, ResultMessage\n\n\nasync def main():\n    async for message in query(\n        prompt=\"Review utils.py for bugs that would cause crashes. Fix any issues you find.\",\n        options=ClaudeAgentOptions(\n            allowed_tools=[\"Read\", \"Edit\", \"Glob\"],\n            permission_mode=\"acceptEdits\",\n        ),\n    ):\n        if isinstance(message, AssistantMessage):\n            for block in message.content:\n                if hasattr(block, \"text\"):\n                    print(block.text)\n                elif hasattr(block, \"name\"):\n                    print(f\"Tool: {block.name}\")\n        elif isinstance(message, ResultMessage):\n            print(f\"Done: {message.subtype}\")\n\n\nasyncio.run(main())\n```\n\n这个例子要注意四个点:\n\n1. `query()` 返回的是流 不是一次性响应\n2. `allowed_tools` 只开放了完成任务所需的最小工具集\n3. `acceptEdits` 允许 Claude 自动修改文件 避免编辑阶段被审批阻塞\n4. 代码里显式区分 `AssistantMessage` 和 `ResultMessage` 这是后续处理流式输出的重要基础\n\n#### 4. Quickstart 中的自定义方向\n\n文档还给了三个最有代表性的扩展方向:\n\n- 加 `WebSearch` 让 Agent 获取外部信息\n- 加 `system_prompt` 定制输出风格和行为约束\n- 加 `Bash` 让 Agent 运行命令并进入更强的自动化模式\n\n其中 `Bash` 是一个分水岭:\n\n- 没有 `Bash` 时 Agent 主要在文件层工作\n- 有了 `Bash` 之后 Agent 可以写测试 执行测试 运行脚本 甚至触发更复杂的系统操作\n\n对 SRE 而言 这意味着风险级别会明显上升 权限策略必须同步升级。", "subs": ["1. 环境准备", "2. 示例缺陷文件", "3. 最小 Agent 示例", "4. Quickstart 中的自定义方向"]}, {"title": "运维工程师 / SRE 关注点", "content": "Quickstart 看起来像“代码修 bug 教程” 但对运维工程师和 SRE 更有价值的是下面这些迁移思路:\n\n1. 把示例文件替换成真实运维对象\n- `utils.py` 可以换成 `nginx.conf`\n- 可以换成 Kubernetes YAML\n- 也可以换成告警脚本 巡检脚本 Terraform 文件或 Helm values\n\n2. 把“修 bug”替换成“识别风险并修正”\n- 检查会导致服务不可用的配置项\n- 检查空值和边界条件\n- 自动补充缺失配置或注释\n\n3. 把“实时打印 Claude 推理过程”替换成“平台侧事件流”\n- 在你的平台里 这些消息可以进入前端日志窗口\n- 也可以进入审计系统或任务执行时间线\n\n4. 从最小权限开始\n- Quickstart 为了演示效率直接用 `acceptEdits`\n- 真正落地时 更稳妥的路径通常是先只读 再开编辑 最后才考虑 `Bash`\n\n5. 先在隔离目录验证\n- 文档建议在单独目录启动项目 这对 SRE 很重要\n- 先把 Agent 约束在可控工作目录中 再逐步扩大作用范围", "subs": ["utils.py 可以换成 nginx.conf", "可以换成 Kubernetes YAML", "也可以换成告警脚本 巡检脚本 Terraform 文件或 Helm values", "检查会导致服务不可用的配置项", "检查空值和边界条件", "自动补充缺失配置或注释"]}, {"title": "实战建议", "content": "如果你要把 Quickstart 的思路迁移到运维和 SRE 场景 建议按下面节奏落地:\n\n1. 第一阶段 只做只读分析\n- 使用 `Read` `Glob` `Grep`\n- 任务如 配置审计 日志归纳 发布前静态检查\n\n2. 第二阶段 开启受控编辑\n- 增加 `Edit`\n- 用于自动补注释 修复明显格式问题 生成变更建议稿\n\n3. 第三阶段 再考虑 `Bash`\n- 用于执行测试 巡检脚本 或只读诊断命令\n- 生产环境必须结合权限控制 审批和沙箱\n\n4. prompt 要写得像工单而不是聊天\n- 指定目标文件\n- 指定错误范围\n- 指定期望动作\n- 指定输出要求\n\n5. 把 Quickstart 当成验收模板\n- 能否正确读取文件\n- 能否调用正确工具\n- 能否在限制权限下完成任务\n- 能否把结果稳定输出给上层系统", "subs": ["使用 Read Glob Grep", "任务如 配置审计 日志归纳 发布前静态检查", "增加 Edit", "用于自动补注释 修复明显格式问题 生成变更建议稿", "用于执行测试 巡检脚本 或只读诊断命令", "生产环境必须结合权限控制 审批和沙箱"]}, {"title": "小结", "content": "Quickstart 的核心价值在于 它用最少的代码演示了 Agent SDK 的完整工作方式:\n\n- 通过 `query()` 启动 Agent loop\n- 用 `prompt` 描述任务目标\n- 用 `options` 约束工具和权限\n- 以流式消息观察 Claude 的执行过程\n- 让 Claude 在受控条件下直接完成文件分析和修改\n\n对运维工程师和 SRE 来说 这一章最重要的收获不是“如何修 Python bug” 而是理解一个生产级 Agent 的最小起步姿势:\n\n`先限定目录 再限定工具 再限定权限 然后观察 Agent 是否能在安全边界内稳定完成任务。`", "subs": ["通过 query() 启动 Agent loop", "用 prompt 描述任务目标", "用 options 约束工具和权限", "以流式消息观察 Claude 的执行过程", "让 Claude 在受控条件下直接完成文件分析和修改"]}]}, {"title": "3. Python SDK 参考 (Python SDK Reference)", "sections": [{"title": "本章目标", "content": "本章是面向 Python 使用者的 API 地图。读完后你应该能回答:\n\n- Python SDK 的两个主要入口分别是什么\n- 什么时候用 `query()` 什么时候用 `ClaudeSDKClient`\n- `ClaudeAgentOptions` 里最关键的配置项有哪些\n- Python SDK 会返回哪些消息类型\n- 如何在 Python 中接入 Hooks 自定义工具 MCP 沙箱和会话恢复", "subs": ["Python SDK 的两个主要入口分别是什么", "什么时候用 query() 什么时候用 ClaudeSDKClient", "ClaudeAgentOptions 里最关键的配置项有哪些", "Python SDK 会返回哪些消息类型", "如何在 Python 中接入 Hooks 自定义工具 MCP 沙箱和会话恢复"]}, {"title": "原文要点整理", "content": "`python-sdk.html` 是一份完整 API 参考，信息量最大。它的核心结构可以压缩为五部分:\n\n1. 入口函数和核心类\n- `query()` 适合一次性会话或新开会话\n- `ClaudeSDKClient` 适合持续会话和交互式场景\n\n2. 关键配置对象\n- `ClaudeAgentOptions` 几乎承载了所有行为控制 例如工具 权限 会话 模型 Hooks 子代理 MCP 插件和沙箱\n\n3. 消息和内容块类型\n- `AssistantMessage`\n- `ResultMessage`\n- `SystemMessage`\n- `StreamEvent`\n- 各种 `ContentBlock`\n\n4. 扩展能力\n- 自定义 MCP 工具\n- Hooks\n- Programmatic subagents\n- Structured output\n- Plugins\n\n5. 生产相关能力\n- 错误类型\n- 沙箱配置\n- 文件检查点\n- 未沙箱命令的权限回退机制", "subs": ["query() 适合一次性会话或新开会话", "ClaudeSDKClient 适合持续会话和交互式场景", "ClaudeAgentOptions 几乎承载了所有行为控制 例如工具 权限 会话", "AssistantMessage", "ResultMessage", "SystemMessage"]}, {"title": "核心概念", "content": "#### 1. `query()` 和 `ClaudeSDKClient` 的定位差异\n\nPython SDK 提供了两个核心入口:\n\n- `query()` 每次调用都会创建一个新会话\n- `ClaudeSDKClient` 用于维护持续会话\n\n官方的建议可以简单理解为:\n\n- 一次性任务 用 `query()`\n- 连续对话 多轮任务 中断恢复 流式输入 用 `ClaudeSDKClient`\n\n对运维场景而言:\n\n- 配置扫描 代码审查 巡检摘要适合 `query()`\n- 故障排查助手 值班排障会话 需要人工多轮介入的系统更适合 `ClaudeSDKClient`\n\n#### 2. `ClaudeAgentOptions` 是行为控制中心\n\n这个类相当于 Agent 的控制面板。最重要的字段包括:\n\n- `allowed_tools`\n- `disallowed_tools`\n- `permission_mode`\n- `can_use_tool`\n- `hooks`\n- `resume`\n- `continue_conversation`\n- `mcp_servers`\n- `agents`\n- `setting_sources`\n- `include_partial_messages`\n- `output_format`\n- `sandbox`\n- `enable_file_checkpointing`\n\n一个很关键的细节是:\n\n- `allowed_tools` 是“自动批准”的工具列表\n- 它不是“只允许这些工具”\n- 真正的拒绝要靠 `disallowed_tools` 或权限规则\n\n这点很容易误解 对安全设计影响很大。\n\n#### 3. Python SDK 的消息模型\n\nPython SDK 的消息流主要由以下对象组成:\n\n- `SystemMessage` 会话初始化和系统元数据\n- `AssistantMessage` Claude 的完整回复\n- `ResultMessage` 最终结果 成本和用量\n- `StreamEvent` 流式增量事件 仅在开启 `include_partial_messages=True` 后可见\n\n对 SRE 来说 这里的重点是:\n\n- `AssistantMessage` 更适合给用户界面展示\n- `ResultMessage` 更适合做审计 成本统计 最终状态判断\n- `StreamEvent` 更适合进度条 实时 UI 和故障诊断\n\n#### 4. `ClaudeSDKClient` 提供持续会话能力\n\n`ClaudeSDKClient` 支持的关键方法包括:\n\n- `query()` 发送新请求\n- `receive_response()` 读取当前响应直到 `ResultMessage`\n- `receive_messages()` 读取全部消息\n- `interrupt()` 中断当前任务\n- `set_permission_mode()` 动态切换权限模式\n- `rewind_files()` 按用户消息回滚文件\n- `get_mcp_status()` 查看 MCP 服务状态\n\n这意味着你可以把它当成一个可长期保持上下文的 Agent 会话对象。\n\n#### 5. Hooks 自定义工具和沙箱都是 Python 一等能力\n\nPython 参考页明确表明 Python SDK 不是阉割版。它具备:\n\n- Hooks\n- 自定义 MCP 工具\n- Structured output\n- 子代理\n- 插件\n- 沙箱\n- 文件检查点\n\n所以如果你的内部平台主要是 Python 栈 完全可以直接基于官方 SDK 做生产集成。", "subs": ["1. query() 和 ClaudeSDKClient 的定位差异", "2. ClaudeAgentOptions 是行为控制中心", "3. Python SDK 的消息模型", "4. ClaudeSDKClient 提供持续会话能力", "5. Hooks 自定义工具和沙箱都是 Python 一等能力"]}, {"title": "Python SDK 能力地图", "content": "```mermaid\ngraph TD\n    A[Python App] --> B[query]\n    A --> C[ClaudeSDKClient]\n    B --> D[ClaudeAgentOptions]\n    C --> D\n    D --> E[Tools Permissions]\n    D --> F[Hooks]\n    D --> G[MCP Servers]\n    D --> H[Agents]\n    D --> I[Streaming]\n    D --> J[Sandbox]\n    C --> K[receive_response]\n    C --> L[interrupt]\n    C --> M[rewind_files]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 使用 `query()` 发起一次任务\n\n```python\nimport asyncio\nfrom claude_agent_sdk import query, ClaudeAgentOptions\n\n\nasync def main():\n    options = ClaudeAgentOptions(\n        system_prompt=\"You are an expert Python developer\",\n        permission_mode=\"acceptEdits\",\n        cwd=\"/home/user/project\",\n    )\n\n    async for message in query(prompt=\"Create a Python web server\", options=options):\n        print(message)\n\n\nasyncio.run(main())\n```\n\n适合场景:\n\n- 一次性代码分析\n- 单次配置审计\n- 单个工单执行\n\n#### 2. 使用 `ClaudeSDKClient` 保持连续会话\n\n```python\nimport asyncio\nfrom claude_agent_sdk import ClaudeSDKClient\n\n\nasync def main():\n    async with ClaudeSDKClient() as client:\n        await client.query(\"Read the authentication module\")\n        async for message in client.receive_response():\n            print(message)\n\n        await client.query(\"Now explain where it is called\")\n        async for message in client.receive_response():\n            print(message)\n\n\nasyncio.run(main())\n```\n\n适合场景:\n\n- 持续排障\n- 多轮问答\n- 需要保留上下文的运维辅助\n\n#### 3. 典型 `ClaudeAgentOptions` 配置\n\n```python\nfrom claude_agent_sdk import ClaudeAgentOptions\n\noptions = ClaudeAgentOptions(\n    allowed_tools=[\"Read\", \"Edit\", \"Bash\"],\n    disallowed_tools=[\"WebFetch\"],\n    permission_mode=\"acceptEdits\",\n    resume=\"session-id\",\n    include_partial_messages=True,\n    setting_sources=[\"project\"],\n    enable_file_checkpointing=True,\n)\n```\n\n建议把这些字段按职责来理解:\n\n- 工具与权限: `allowed_tools` `disallowed_tools` `permission_mode` `can_use_tool`\n- 上下文与会话: `resume` `continue_conversation` `fork_session`\n- 可观察性: `include_partial_messages` `stderr`\n- 扩展集成: `mcp_servers` `agents` `plugins`\n- 运行环境: `cwd` `env` `add_dirs` `sandbox`\n\n#### 4. Hook 示例\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions, HookMatcher\n\n\nasync def log_tool_use(input_data, tool_use_id, context):\n    print(f\"Tool used: {input_data.get('tool_name')}\")\n    return {}\n\n\noptions = ClaudeAgentOptions(\n    hooks={\n        \"PreToolUse\": [HookMatcher(hooks=[log_tool_use])],\n        \"PostToolUse\": [HookMatcher(hooks=[log_tool_use])],\n    }\n)\n```\n\n这个模式非常适合:\n\n- 记录审计日志\n- 拦截危险 Bash\n- 做合规校验\n\n#### 5. 沙箱配置示例\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions, SandboxSettings\n\nsandbox_settings: SandboxSettings = {\n    \"enabled\": True,\n    \"autoAllowBashIfSandboxed\": True,\n    \"network\": {\"allowLocalBinding\": True},\n}\n\nasync for message in query(\n    prompt=\"Build and test my project\",\n    options=ClaudeAgentOptions(sandbox=sandbox_settings),\n):\n    print(message)\n```\n\n参考页特别强调:\n\n- 文件系统和网络访问的精细限制不只靠 `sandbox`\n- 还要结合 permission rules\n- `allowUnsandboxedCommands` 一旦开启 必须有严密审批逻辑", "subs": ["1. 使用 query() 发起一次任务", "2. 使用 ClaudeSDKClient 保持连续会话", "3. 典型 ClaudeAgentOptions 配置", "4. Hook 示例", "5. 沙箱配置示例"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. Python SDK 已经足够完整\n- 不是只能做简单问答\n- 它可以承担生产级 Agent 平台的主干能力\n\n2. `allowed_tools` 不等于白名单\n- 这是最容易误判的点\n- 真正的安全控制要再看 `disallowed_tools` `permission_mode` `can_use_tool` 和 Hooks\n\n3. `setting_sources` 默认是 `None`\n- 这意味着默认不会加载文件系统中的 Claude 配置\n- 对隔离型平台是好事\n- 对想复用项目内 `CLAUDE.md` 和 Skills 的团队需要显式开启\n\n4. `ResultMessage` 自带成本和用量\n- 这对平台计费和资源治理很重要\n\n5. 沙箱不是全部安全边界\n- 参考页明确提醒 未沙箱命令回退到权限系统\n- 如果 `bypassPermissions` 和 `allowUnsandboxedCommands` 叠加 风险极高", "subs": ["不是只能做简单问答", "它可以承担生产级 Agent 平台的主干能力", "这是最容易误判的点", "真正的安全控制要再看 disallowed_tools permission_mod", "这意味着默认不会加载文件系统中的 Claude 配置", "对隔离型平台是好事"]}, {"title": "实战建议", "content": "1. 如果你在做后台任务或 CI 用 `query()`\n2. 如果你在做交互式排障助手 用 `ClaudeSDKClient`\n3. 先显式声明 `cwd` 和 `setting_sources`\n4. 默认开启审计型 Hooks\n5. 把 `sandbox` `permission_mode` `can_use_tool` 一起设计 不要分开看\n6. 平台侧统一处理 `ResultMessage` 做成本统计 失败归因 和最终状态记录", "subs": []}, {"title": "小结", "content": "Python SDK 参考页最重要的结论是:\n\n`Python SDK 提供了完整的 Agent 运行能力 其中 query() 适合一次性任务 ClaudeSDKClient 适合持续会话 而 ClaudeAgentOptions 则是几乎所有安全 行为 和扩展能力的统一入口。`", "subs": []}]}, {"title": "4. 输入模式 (Streaming Input vs Single Message)", "sections": [{"title": "本章目标", "content": "本章帮助你区分 Agent SDK 的两种输入方式:\n\n- 流式输入模式\n- 单消息输入模式\n\n重点不是 API 形式本身 而是理解它们在交互能力 中断能力 图像输入 Hook 支持和会话连续性上的差异。", "subs": ["流式输入模式", "单消息输入模式"]}, {"title": "原文要点整理", "content": "`streaming-vs-single-mode.html` 说明 Agent SDK 有两种输入模式:\n\n1. `Streaming Input Mode`\n- 默认且推荐\n- Agent 作为长生命周期进程运行\n- 支持消息队列 中断 图像输入 Hooks 和自然多轮会话\n\n2. `Single Message Input`\n- 更简单\n- 更像一次性请求\n- 更适合无状态运行环境\n\n文档明确表态:\n\n- 如果没有特殊限制 优先使用流式输入", "subs": ["默认且推荐", "Agent 作为长生命周期进程运行", "支持消息队列 中断 图像输入 Hooks 和自然多轮会话", "更简单", "更像一次性请求", "更适合无状态运行环境"]}, {"title": "核心概念", "content": "#### 1. 流式输入是“长连接式 Agent 会话”\n\n流式输入并不只是“边生成边返回” 它真正指的是:\n\n- 应用持续向 Agent 送消息\n- Agent 会话持续存活\n- 中途可以追加消息或中断当前执行\n- 文件系统状态和会话上下文持续保留\n\n这更接近一个真正的交互式 Agent。\n\n#### 2. 单消息输入是“单轮任务投递”\n\n单消息模式更像:\n\n- 发一个请求\n- 等一个结果\n- 需要继续时再通过 `continue_conversation` 或会话恢复来衔接\n\n它的好处是:\n\n- 模型交互更简单\n- 易于接到 Lambda 这类无状态运行环境\n\n代价是:\n\n- 少了图像直传\n- 少了动态队列\n- 少了中断控制\n- 少了 Hook 集成\n\n#### 3. Python 和 TypeScript 的表现形式不同\n\n文档中的示例有一个容易忽略的点:\n\n- TypeScript 里 `query()` 可以直接接收异步消息生成器\n- Python 中更推荐用 `ClaudeSDKClient` 来承载流式输入\n\n因此 “模式” 和 “具体 API 入口” 要分开理解。", "subs": ["1. 流式输入是“长连接式 Agent 会话”", "2. 单消息输入是“单轮任务投递”", "3. Python 和 TypeScript 的表现形式不同"]}, {"title": "输入模式对比图", "content": "```mermaid\ngraph TD\n    A[Choose Input Mode] --> B[Streaming Input]\n    A --> C[Single Message]\n    B --> B1[Long lived session]\n    B --> B2[Queue messages]\n    B --> B3[Interrupt]\n    B --> B4[Images Hooks]\n    C --> C1[One shot request]\n    C --> C2[Stateless runtime]\n    C --> C3[No image queue interrupt hooks]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 流式输入示例\n\nPython 版本使用 `ClaudeSDKClient`:\n\n```python\nfrom claude_agent_sdk import ClaudeSDKClient, ClaudeAgentOptions\nimport asyncio\n\n\nasync def streaming_analysis():\n    async def message_generator():\n        yield {\n            \"type\": \"user\",\n            \"message\": {\n                \"role\": \"user\",\n                \"content\": \"Analyze this codebase for security issues\",\n            },\n        }\n\n    options = ClaudeAgentOptions(max_turns=10, allowed_tools=[\"Read\", \"Grep\"])\n\n    async with ClaudeSDKClient(options) as client:\n        await client.query(message_generator())\n        async for message in client.receive_response():\n            print(message)\n\n\nasyncio.run(streaming_analysis())\n```\n\n这个模式适合:\n\n- 安全审计助手\n- 多轮故障排查\n- 需要上传图像或架构图的分析场景\n\n#### 2. 单消息模式示例\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions, ResultMessage\nimport asyncio\n\n\nasync def single_message_example():\n    async for message in query(\n        prompt=\"Explain the authentication flow\",\n        options=ClaudeAgentOptions(max_turns=1, allowed_tools=[\"Read\", \"Grep\"]),\n    ):\n        if isinstance(message, ResultMessage):\n            print(message.result)\n\n\nasyncio.run(single_message_example())\n```\n\n适合:\n\n- 后台异步任务\n- 简单一次性分析\n- 无状态函数", "subs": ["1. 流式输入示例", "2. 单消息模式示例"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 在线值班助手优先流式输入\n- 因为你需要中断 追问 继续分析和插入新证据\n\n2. CI 或批处理任务优先单消息\n- 因为任务固定 环境短生命周期 更容易封装\n\n3. 图像和 Hook 支持是重要分界\n- 如果你需要架构图截图 审批流 运行中的细粒度拦截 单消息模式就不够用了\n\n4. 流式输入更像“会话型 Agent”\n- 单消息更像“任务型 Agent”", "subs": ["因为你需要中断 追问 继续分析和插入新证据", "因为任务固定 环境短生命周期 更容易封装", "如果你需要架构图截图 审批流 运行中的细粒度拦截 单消息模式就不够用了", "单消息更像“任务型 Agent”"]}, {"title": "实战建议", "content": "1. 交互式系统默认选流式输入\n2. 批处理和离线任务默认选单消息\n3. 如果前期不确定 先用单消息验证 Prompt 和权限设计 再升级为流式输入\n4. 如果涉及人工审批 中断恢复 图像分析 直接选流式输入 不要绕路", "subs": []}, {"title": "小结", "content": "这一章最关键的结论是:\n\n`流式输入模式是 Agent SDK 的推荐主路径 它适合真实交互式 Agent 单消息模式则适合简单 一次性 和无状态任务。`", "subs": []}]}, {"title": "5. 停止原因处理 (Stop Reasons)", "sections": [{"title": "本章目标", "content": "本章解释 Agent 为什么停止生成 以及你应该如何据此做:\n\n- 成功判断\n- 拒绝识别\n- Token 截断重试\n- 错误归因\n- 监控埋点", "subs": ["成功判断", "拒绝识别", "Token 截断重试", "错误归因", "监控埋点"]}, {"title": "原文要点整理", "content": "`stop-reasons.html` 讲的是底层 API 返回的 `stop_reason`。它能帮助你区分:\n\n- 正常结束\n- 输出被 token 限制截断\n- 模型拒绝回答\n- 生成停在 stop sequence\n- 错误发生前最后一次停止原因\n\n文档特别指出:\n\n- TypeScript 可以直接从 `ResultMessage` 取 `stop_reason`\n- Python 当前不能直接从 `ResultMessage` 读取\n- Python 需要借助 `StreamEvent` 里的 `message_delta` 事件做绕过", "subs": ["正常结束", "输出被 token 限制截断", "模型拒绝回答", "生成停在 stop sequence", "错误发生前最后一次停止原因", "TypeScript 可以直接从 ResultMessage 取 stop_reas"]}, {"title": "核心概念", "content": "#### 1. `stop_reason` 是“结束语义”而不是“任务状态”\n\n不要把 `stop_reason` 和最终业务结果混为一谈。\n\n例如:\n\n- `end_turn` 只表示模型正常完成一轮生成\n- 但任务是否真正成功 还要结合 `ResultMessage.subtype`\n\n所以更稳妥的判断方式是:\n\n- 先看结果类型是否成功\n- 再看 `stop_reason` 解释为何结束\n\n#### 2. 常见停止原因\n\n文档列出的值包括:\n\n- `end_turn` 正常结束\n- `max_tokens` 达到输出 token 上限\n- `stop_sequence` 命中停止序列\n- `refusal` 模型拒绝执行\n- `tool_use` 最后输出是工具调用\n- `null` 还没有有效 API 响应或是回放旧会话结果\n\n其中对平台最有价值的通常是:\n\n- `refusal`\n- `max_tokens`\n- `null`\n\n#### 3. 错误结果也可能有 `stop_reason`\n\n官方明确说明 即使是:\n\n- `error_max_turns`\n- `error_max_budget_usd`\n- `error_during_execution`\n\n也仍然可能携带 `stop_reason`。它表示错误出现前最后一次 assistant 消息的停止原因。\n\n这对排障很有用 因为你能知道:\n\n- 是模型正常说完后才撞上外层限制\n- 还是工具调用阶段被截断\n\n#### 4. Python 需要流式事件绕过\n\nPython 当前没有在 `ResultMessage` 上直接暴露 `stop_reason`。因此:\n\n- 必须开启 `include_partial_messages=True`\n- 监听 `StreamEvent`\n- 从 `message_delta` 的 `delta` 里提取 `stop_reason`", "subs": ["1. stop_reason 是“结束语义”而不是“任务状态”", "2. 常见停止原因", "3. 错误结果也可能有 stop_reason", "4. Python 需要流式事件绕过"]}, {"title": "关键代码或配置示例", "content": "#### 1. TypeScript 中直接读取\n\n```typescript\nfor await (const message of query({\n  prompt: \"Write a poem about the ocean\"\n})) {\n  if (message.type === \"result\") {\n    console.log(\"Stop reason:\", message.stop_reason);\n  }\n}\n```\n\n#### 2. Python 中通过 `StreamEvent` 读取\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions, ResultMessage\nfrom claude_agent_sdk.types import StreamEvent\nimport asyncio\n\n\nasync def get_stop_reason(prompt: str):\n    stop_reason = None\n    result = None\n    options = ClaudeAgentOptions(include_partial_messages=True)\n\n    async for message in query(prompt=prompt, options=options):\n        if isinstance(message, StreamEvent):\n            if message.event.get(\"type\") == \"message_delta\":\n                delta = message.event.get(\"delta\", {})\n                if \"stop_reason\" in delta:\n                    stop_reason = delta[\"stop_reason\"]\n        elif isinstance(message, ResultMessage):\n            result = message.result\n\n    return stop_reason, result\n```", "subs": ["1. TypeScript 中直接读取", "2. Python 中通过 StreamEvent 读取"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. `refusal` 应单独打标签\n- 这不是普通失败\n- 往往需要提示用户修改任务描述或做策略解释\n\n2. `max_tokens` 很适合作为自动重试信号\n- 可以提高 token 限制\n- 或让模型继续\n\n3. `null` 常提示会话回放或更早阶段失败\n- 适合做异常监控\n\n4. Python 平台如果要统一日志 需要自己补采 `stop_reason`", "subs": ["这不是普通失败", "往往需要提示用户修改任务描述或做策略解释", "可以提高 token 限制", "或让模型继续", "适合做异常监控"]}, {"title": "实战建议", "content": "1. 平台侧把 `ResultMessage.subtype` 和 `stop_reason` 一起记录\n2. 对 `refusal` 输出更友好的用户提示\n3. 对 `max_tokens` 设计自动续写或重试策略\n4. Python 服务默认在关键任务里开启部分流式事件采样 便于补齐停止原因", "subs": []}, {"title": "小结", "content": "`stop_reason` 的价值在于解释 Agent 为什么停下 它特别适合做拒绝识别 截断重试 和可观测性埋点 但不能单独替代任务成功判断。`", "subs": []}]}, {"title": "6. 实时流式输出 (Streaming Output)", "sections": [{"title": "本章目标", "content": "本章讲的是“如何实时看到 Agent 正在输出什么”。重点包括:\n\n- 如何开启流式输出\n- `StreamEvent` 是什么\n- 如何实时展示文本\n- 如何实时展示工具调用\n- 流式输出有哪些已知限制", "subs": ["如何开启流式输出", "StreamEvent 是什么", "如何实时展示文本", "如何实时展示工具调用", "流式输出有哪些已知限制"]}, {"title": "原文要点整理", "content": "`streaming-output.html` 说明 Agent SDK 默认只给你完整的 `AssistantMessage`。如果想实时拿到增量文本和工具调用过程 需要开启:\n\n- Python: `include_partial_messages=True`\n- TypeScript: `includePartialMessages=true`\n\n开启后 你会额外收到 `StreamEvent` 消息 其中封装了原始 Claude API 流式事件。\n\n文档重点讲了三件事:\n\n1. 如何从 `content_block_delta` 中提取文本增量\n2. 如何跟踪工具调用的开始 输入增量 和结束\n3. 如何把这些事件组装成一个可用的实时 UI", "subs": ["Python", "TypeScript"]}, {"title": "核心概念", "content": "#### 1. 输入流式和输出流式不是一回事\n\n这页文档讲的是输出流式:\n\n- 也就是 Agent 回消息给你时是否边生成边送达\n\n它和上一章的输入模式不同:\n\n- 输入模式解决“你怎么发消息给 Agent”\n- 输出流式解决“Agent 怎么实时把结果回给你”\n\n#### 2. `StreamEvent` 是底层事件的包装\n\n开启部分消息后 你收到的不只是最终文本 而是事件流 例如:\n\n- `message_start`\n- `content_block_start`\n- `content_block_delta`\n- `content_block_stop`\n- `message_delta`\n- `message_stop`\n\n所以你的程序不能只 `print(message)`，而要自己解析事件。\n\n#### 3. 文本和工具都可以流式显示\n\n文本类输出通常来自:\n\n- `content_block_delta`\n- 且 `delta.type == \"text_delta\"`\n\n工具调用过程通常关注:\n\n- `content_block_start` 工具开始\n- `content_block_delta` 且 `input_json_delta` 输入增量\n- `content_block_stop` 工具结束\n\n这让你可以做出比“转圈等待”更可解释的 Agent UI。", "subs": ["1. 输入流式和输出流式不是一回事", "2. StreamEvent 是底层事件的包装", "3. 文本和工具都可以流式显示"]}, {"title": "流式输出消息流", "content": "```mermaid\ngraph TD\n    A[StreamEvent message_start] --> B[content_block_start]\n    B --> C[text_delta or input_json_delta]\n    C --> D[content_block_stop]\n    D --> E[message_delta]\n    E --> F[message_stop]\n    F --> G[AssistantMessage]\n    G --> H[Tool execution or next turn]\n    H --> I[ResultMessage]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 实时打印文本\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions\nfrom claude_agent_sdk.types import StreamEvent\nimport asyncio\n\n\nasync def stream_text():\n    options = ClaudeAgentOptions(include_partial_messages=True)\n\n    async for message in query(prompt=\"Explain how databases work\", options=options):\n        if isinstance(message, StreamEvent):\n            event = message.event\n            if event.get(\"type\") == \"content_block_delta\":\n                delta = event.get(\"delta\", {})\n                if delta.get(\"type\") == \"text_delta\":\n                    print(delta.get(\"text\", \"\"), end=\"\", flush=True)\n\n    print()\n\n\nasyncio.run(stream_text())\n```\n\n#### 2. 实时跟踪工具调用\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions\nfrom claude_agent_sdk.types import StreamEvent\nimport asyncio\n\n\nasync def stream_tool_calls():\n    options = ClaudeAgentOptions(\n        include_partial_messages=True,\n        allowed_tools=[\"Read\", \"Bash\"],\n    )\n\n    current_tool = None\n    tool_input = \"\"\n\n    async for message in query(prompt=\"Read the README.md file\", options=options):\n        if isinstance(message, StreamEvent):\n            event = message.event\n            event_type = event.get(\"type\")\n\n            if event_type == \"content_block_start\":\n                content_block = event.get(\"content_block\", {})\n                if content_block.get(\"type\") == \"tool_use\":\n                    current_tool = content_block.get(\"name\")\n                    tool_input = \"\"\n\n            elif event_type == \"content_block_delta\":\n                delta = event.get(\"delta\", {})\n                if delta.get(\"type\") == \"input_json_delta\":\n                    tool_input += delta.get(\"partial_json\", \"\")\n\n            elif event_type == \"content_block_stop\":\n                if current_tool:\n                    print(f\"{current_tool}: {tool_input}\")\n                    current_tool = None\n\n\nasyncio.run(stream_tool_calls())\n```\n\n#### 3. 构建简化 UI\n\n文档里的 UI 示例本质是:\n\n- 工具执行时显示状态提示\n- 普通文本持续流式打印\n- 最终收到 `ResultMessage` 后标记完成\n\n这是构建控制台 Agent 前端或 Web 聊天前端时最实用的模式。", "subs": ["1. 实时打印文本", "2. 实时跟踪工具调用", "3. 构建简化 UI"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 流式输出极适合可观测性\n- 能看到 Agent 当前在读文件 还是在调用工具\n- 对排障和信任建立很重要\n\n2. 工具流式比文本流式更有价值\n- 对运维平台而言 “当前在执行什么动作” 往往比 Claude 正在说什么更重要\n\n3. `message_delta` 还可携带停止原因和 usage\n- 这让流式事件兼具实时 UI 和监控价值\n\n4. 不是所有功能都能流式\n- 扩展思考和结构化输出都有已知限制", "subs": ["能看到 Agent 当前在读文件 还是在调用工具", "对排障和信任建立很重要", "对运维平台而言 “当前在执行什么动作” 往往比 Claude 正在说什么更重要", "这让流式事件兼具实时 UI 和监控价值", "扩展思考和结构化输出都有已知限制"]}, {"title": "实战建议", "content": "1. 平台 UI 默认同时显示文本流和工具状态\n2. 日志系统单独记录工具调用开始和结束事件\n3. 对长任务显示当前工具名 避免用户误以为卡死\n4. 如果启用了 structured output 不要指望 JSON 结果以增量形式到达", "subs": []}, {"title": "小结", "content": "`Streaming Output` 的核心价值在于把 Agent 的工作过程显性化。它不仅能改善用户体验 还能够为审计 监控 和问题定位提供更细粒度的事件流。`", "subs": []}]}, {"title": "7. 权限配置 (Permissions)", "sections": [{"title": "本章目标", "content": "本章解释 Claude Agent SDK 的权限系统是如何做决策的。你需要读懂:\n\n- 工具请求到底按什么顺序被批准或拒绝\n- `allowed_tools` 和 `disallowed_tools` 的真实含义\n- 各种 `permission_mode` 的行为差异\n- 为什么 `bypassPermissions` 风险极高", "subs": ["工具请求到底按什么顺序被批准或拒绝", "allowed_tools 和 disallowed_tools 的真实含义", "各种 permission_mode 的行为差异", "为什么 bypassPermissions 风险极高"]}, {"title": "原文要点整理", "content": "`permissions.html` 讲的是 Agent SDK 的权限判断主链路。官方给出的顺序是:\n\n1. Hooks\n2. Deny rules\n3. Permission mode\n4. Allow rules\n5. `canUseTool` 回调\n\n这意味着权限系统不是只有一个开关 而是多层叠加:\n\n- Hooks 可以最先拦截或改写\n- Deny 规则优先级很高\n- `permission_mode` 提供全局行为\n- Allow 规则负责自动批准\n- 还没决出结果时才进入人工或程序化审批", "subs": ["Hooks 可以最先拦截或改写", "Deny 规则优先级很高", "permission_mode 提供全局行为", "Allow 规则负责自动批准", "还没决出结果时才进入人工或程序化审批"]}, {"title": "核心概念", "content": "#### 1. 权限评估顺序决定一切\n\n这一页最重要的内容就是评估顺序。你可以把它理解成:\n\n- 先看有没有更高优先级的安全逻辑\n- 再看有没有明确禁止\n- 再看当前全局模式怎么处理\n- 再看有没有明确允许\n- 最后才问人或问回调\n\n顺序错误会直接导致安全设计误判。\n\n#### 2. `allowed_tools` 是自动批准 不是可用工具全集\n\n文档反复强调:\n\n- `allowed_tools=[\"Read\", \"Grep\"]` 的意思是这两个工具自动批准\n- 不是说 Claude 只能看到这两个工具\n\n如果工具不在 `allowed_tools` 里:\n\n- 它仍然可能被 Claude 请求\n- 然后进入后续权限流程\n\n#### 3. `disallowed_tools` 是硬拒绝\n\n`disallowed_tools` 的优先级更接近“硬封禁”:\n\n- 即使在 `bypassPermissions` 模式下也有效\n- Deny 规则比全局放行更早执行\n\n所以如果你必须放开一些自动化能力 但又想死死封住部分工具 这才是更可靠的做法。\n\n#### 4. 权限模式是全局行为开关\n\n文档列出的模式包括:\n\n- `default`\n- `dontAsk` 仅 TypeScript\n- `acceptEdits`\n- `bypassPermissions`\n- `plan`\n\n其中最常用的理解方式是:\n\n- `default` 进入常规审批流\n- `acceptEdits` 自动通过文件编辑\n- `bypassPermissions` 几乎全放开\n- `plan` 只规划不执行\n\n#### 5. `bypassPermissions` 会传递给子代理\n\n这一点非常关键:\n\n- 开启 `bypassPermissions` 后 子代理会继承它\n- 子代理可能有不同提示词和更松散的任务边界\n\n所以这个模式不只是“主代理变大胆” 而是“整个代理树都失去审批约束”。", "subs": ["1. 权限评估顺序决定一切", "2. allowed_tools 是自动批准 不是可用工具全集", "3. disallowed_tools 是硬拒绝", "4. 权限模式是全局行为开关", "5. bypassPermissions 会传递给子代理"]}, {"title": "权限评估流程图", "content": "```mermaid\ngraph TD\n    A[Tool request] --> B[Hooks]\n    B --> C[Deny rules]\n    C --> D[Permission mode]\n    D --> E[Allow rules]\n    E --> F[canUseTool]\n    F --> G[Allow or Deny]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 基础权限模式设置\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions\n\nasync for message in query(\n    prompt=\"Help me refactor this code\",\n    options=ClaudeAgentOptions(\n        permission_mode=\"default\",\n    ),\n):\n    print(message)\n```\n\n#### 2. 自动批准指定工具\n\n```python\noptions = ClaudeAgentOptions(\n    allowed_tools=[\"Read\", \"Glob\", \"Grep\"],\n)\n```\n\n适合:\n\n- 只读分析 Agent\n- 配置巡检 Agent\n- 文档检索 Agent\n\n#### 3. 硬阻断危险工具\n\n```python\noptions = ClaudeAgentOptions(\n    allowed_tools=[\"Read\", \"Glob\", \"Grep\"],\n    disallowed_tools=[\"Bash\"],\n)\n```\n\n这比只写 `allowed_tools` 更安全 因为它能明确阻止 `Bash`。\n\n#### 4. `acceptEdits` 的使用边界\n\n文档说明 `acceptEdits` 会自动批准:\n\n- `Edit`\n- `Write`\n- 一些文件系统命令 如 `mkdir` `touch` `rm` `mv` `cp`\n\n但它不会自动批准所有 Bash。", "subs": ["1. 基础权限模式设置", "2. 自动批准指定工具", "3. 硬阻断危险工具", "4. acceptEdits 的使用边界"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 权限设计一定要看顺序 不能只看字段名\n2. `allowed_tools` 不是安全边界\n3. `disallowed_tools` 才适合定义硬禁区\n4. `plan` 模式很适合“先出方案 后审批再执行”\n5. `bypassPermissions` 只能用于高度隔离且完全信任的环境", "subs": []}, {"title": "实战建议", "content": "1. 默认从 `default` 或只读模式开始\n2. 初期试点优先使用:\n- `allowed_tools=[\"Read\", \"Glob\", \"Grep\"]`\n- `disallowed_tools=[\"Bash\", \"Write\", \"Edit\"]`\n\n3. 如果要允许修改 优先 `acceptEdits` 而不是 `bypassPermissions`\n4. 如果要上生产 一定把权限规则和 Hooks 一起设计\n5. 子代理场景下 尤其避免无脑使用 `bypassPermissions`", "subs": ["allowed_tools=[\"Read\"", "disallowed_tools=[\"Bash\""]}, {"title": "小结", "content": "`Permissions` 这一章最重要的认知是 权限控制不是单一开关 而是一条多层决策链。真正的安全设计要同时考虑 Hooks Deny 规则 Permission mode Allow 规则 和 canUseTool 回调。`", "subs": []}]}, {"title": "8. Hooks 机制 (Hooks)", "sections": [{"title": "本章目标", "content": "本章讲 Hooks 如何把 Agent 从“能工作”提升到“可控 可审计 可治理”。重点包括:\n\n- Hook 在什么时机触发\n- 如何通过 matcher 精确匹配\n- Hook 能做哪些事\n- 多个 Hook 如何串联\n- 哪些场景最适合运维平台接入", "subs": ["Hook 在什么时机触发", "如何通过 matcher 精确匹配", "Hook 能做哪些事", "多个 Hook 如何串联", "哪些场景最适合运维平台接入"]}, {"title": "原文要点整理", "content": "`hooks.html` 的核心主张很明确:\n\n- Hook 是 Agent 生命周期上的拦截器\n- 你可以在关键事件发生时运行自己的逻辑\n\n它支持的典型用途包括:\n\n- 阻断危险操作\n- 记录审计日志\n- 改写输入输出\n- 触发人工审批\n- 跟踪子代理和通知事件", "subs": ["Hook 是 Agent 生命周期上的拦截器", "你可以在关键事件发生时运行自己的逻辑", "阻断危险操作", "记录审计日志", "改写输入输出", "触发人工审批"]}, {"title": "核心概念", "content": "#### 1. Hook 的执行链路\n\nHook 的执行过程大致是:\n\n1. Agent 触发某个事件\n2. SDK 找到该事件上的 Hook\n3. matcher 过滤哪些 Hook 需要执行\n4. 回调收到上下文\n5. 回调返回决策或附加信息\n\n这本质上是一个策略执行层。\n\n#### 2. 常见 Hook 事件\n\n文档列出的高价值事件包括:\n\n- `PreToolUse`\n- `PostToolUse`\n- `PostToolUseFailure`\n- `UserPromptSubmit`\n- `Stop`\n- `SubagentStart`\n- `SubagentStop`\n- `PermissionRequest`\n- `Notification`\n\n其中对 SRE 最常见的三类是:\n\n- `PreToolUse` 做拦截\n- `PostToolUse` 做审计\n- `PermissionRequest` 做外部通知\n\n#### 3. matcher 只按事件目标匹配\n\n例如工具型 Hook 中:\n\n- matcher 常常匹配工具名\n- 不是直接按文件路径匹配\n\n如果你要按路径过滤:\n\n- 必须在回调里继续检查 `tool_input.file_path`\n\n#### 4. Hook 既能阻断 也能改写\n\n`PreToolUse` Hook 可以:\n\n- `deny`\n- `allow`\n- `ask`\n- `updatedInput`\n- `systemMessage`\n\n这意味着 Hook 不只是“日志插件” 它能实质改变 Agent 行为。\n\n#### 5. Hook 可以异步做副作用\n\n文档还介绍了 async 输出:\n\n- 适合发 webhook\n- 写日志\n- 记指标\n\n这类 Hook 不必阻塞主执行流。", "subs": ["1. Hook 的执行链路", "2. 常见 Hook 事件", "3. matcher 只按事件目标匹配", "4. Hook 既能阻断 也能改写", "5. Hook 可以异步做副作用"]}, {"title": "Hook 工作流", "content": "```mermaid\ngraph TD\n    A[Agent event] --> B[Find hooks]\n    B --> C[Matcher filter]\n    C --> D[Run callback]\n    D --> E[Allow Deny Modify Inject Context]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 阻止修改 `.env`\n\n```python\nfrom claude_agent_sdk import ClaudeSDKClient, ClaudeAgentOptions, HookMatcher\n\n\nasync def protect_env_files(input_data, tool_use_id, context):\n    file_path = input_data[\"tool_input\"].get(\"file_path\", \"\")\n    file_name = file_path.split(\"/\")[-1]\n\n    if file_name == \".env\":\n        return {\n            \"hookSpecificOutput\": {\n                \"hookEventName\": input_data[\"hook_event_name\"],\n                \"permissionDecision\": \"deny\",\n                \"permissionDecisionReason\": \"Cannot modify .env files\",\n            }\n        }\n    return {}\n\n\noptions = ClaudeAgentOptions(\n    hooks={\n        \"PreToolUse\": [HookMatcher(matcher=\"Write|Edit\", hooks=[protect_env_files])]\n    }\n)\n```\n\n#### 2. 改写写入路径\n\n文档中的另一个经典模式是把写入路径自动重写到沙箱目录:\n\n```python\nasync def redirect_to_sandbox(input_data, tool_use_id, context):\n    if input_data[\"tool_name\"] == \"Write\":\n        original_path = input_data[\"tool_input\"].get(\"file_path\", \"\")\n        return {\n            \"hookSpecificOutput\": {\n                \"hookEventName\": input_data[\"hook_event_name\"],\n                \"permissionDecision\": \"allow\",\n                \"updatedInput\": {\n                    **input_data[\"tool_input\"],\n                    \"file_path\": f\"/sandbox{original_path}\",\n                },\n            }\n        }\n    return {}\n```\n\n#### 3. 串联多个 Hook\n\n```python\noptions = ClaudeAgentOptions(\n    hooks={\n        \"PreToolUse\": [\n            HookMatcher(hooks=[rate_limiter]),\n            HookMatcher(hooks=[authorization_check]),\n            HookMatcher(hooks=[input_sanitizer]),\n            HookMatcher(hooks=[audit_logger]),\n        ]\n    }\n)\n```\n\n这是很适合平台化的做法:\n\n- 每个 Hook 只做一件事\n- 顺序清晰\n- 易于审查和复用", "subs": ["1. 阻止修改 .env", "2. 改写写入路径", "3. 串联多个 Hook"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. Hooks 是审计和合规的关键入口\n2. `PreToolUse` 很适合挡住高风险 Bash 和敏感路径写入\n3. `PostToolUse` 适合做统一操作日志\n4. `Notification` 和 `PermissionRequest` 可用于发 Slack 或工单提醒\n5. `SubagentStop` 很适合观察并行子任务的完成情况", "subs": []}, {"title": "实战建议", "content": "1. 默认至少配两类 Hook:\n- `PreToolUse` 安全控制\n- `PostToolUse` 审计留痕\n\n2. 用 matcher 先缩小范围 再在回调内细查参数\n3. 多 Hook 串联时保持单一职责\n4. 需要快速放行主流程的记录型 Hook 使用 async 输出\n5. 把 Hook 输出接入日志 平台事件线 和告警系统", "subs": ["PreToolUse 安全控制", "PostToolUse 审计留痕"]}, {"title": "小结", "content": "`Hooks` 是 Claude Agent SDK 的治理层。没有 Hooks Agent 只是能执行任务 有了 Hooks 之后 Agent 才真正具备审计 安全控制 事件联动 和平台级接入能力。`", "subs": []}]}, {"title": "9. 审批与用户输入 (User Input)", "sections": [{"title": "本章目标", "content": "本章解释 Agent 在什么时候必须停下来等人类输入 以及你的应用如何把这些输入回传给 SDK。重点包括:\n\n- 工具审批请求\n- 澄清问题 `AskUserQuestion`\n- `canUseTool` 回调\n- 回调返回格式", "subs": ["工具审批请求", "澄清问题 AskUserQuestion", "canUseTool 回调", "回调返回格式"]}, {"title": "原文要点整理", "content": "`user-input.html` 说明 Claude 需要用户输入时主要有两类情况:\n\n1. 工具审批\n- 比如删除文件 执行命令 修改配置\n\n2. 澄清问题\n- 通过 `AskUserQuestion` 工具向用户提出多选问题\n\n这两类都会触发同一个入口:\n\n- `canUseTool`\n\n也就是说 在 SDK 看来:\n\n- 审批和澄清 都属于“Agent 等待外部决策”的暂停点", "subs": ["比如删除文件 执行命令 修改配置", "通过 AskUserQuestion 工具向用户提出多选问题", "canUseTool", "审批和澄清 都属于“Agent 等待外部决策”的暂停点"]}, {"title": "核心概念", "content": "#### 1. `canUseTool` 是审批与问答的统一入口\n\n你的应用需要提供一个回调:\n\n- 接收 `tool_name`\n- 接收工具输入\n- 返回 allow 或 deny\n\n当 `tool_name == \"AskUserQuestion\"` 时:\n\n- 就不是普通工具审批\n- 而是 Claude 在向用户提问题\n\n#### 2. 工具审批不只是允许或拒绝\n\n文档明确列出了几种响应方式:\n\n- 批准原始请求\n- 批准但修改输入\n- 拒绝并说明原因\n- 拒绝并给出替代建议\n- 彻底改变方向 通过流式输入重新下指令\n\n这意味着审批回调本身也可以成为一种治理层。\n\n#### 3. `AskUserQuestion` 是结构化澄清接口\n\nClaude 提问时会给你一组结构化问题:\n\n- `question`\n- `header`\n- `options`\n- `multiSelect`\n\n你的任务不是自己改写问题 而是:\n\n- 展示这些选项\n- 收集用户选择\n- 把答案映射回 `answers`\n\n#### 4. Python 有一个重要前提\n\n文档特别提醒:\n\n- Python 中 `can_use_tool` 需要流式模式\n- 并且需要一个返回 `{\"continue_\": True}` 的 `PreToolUse` dummy hook\n\n否则流会提前关闭 审批回调不会被触发。", "subs": ["1. canUseTool 是审批与问答的统一入口", "2. 工具审批不只是允许或拒绝", "3. AskUserQuestion 是结构化澄清接口", "4. Python 有一个重要前提"]}, {"title": "人机协作流程图", "content": "```mermaid\ngraph TD\n    A[Claude requests tool or question] --> B[canUseTool callback]\n    B --> C{Tool or AskUserQuestion}\n    C --> D[Show approval UI]\n    C --> E[Show question UI]\n    D --> F[Allow Deny or Modify]\n    E --> G[Collect answers]\n    F --> H[Return updated input]\n    G --> H\n    H --> I[Claude continues]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 工具审批回调\n\n```python\nfrom claude_agent_sdk.types import PermissionResultAllow, PermissionResultDeny\n\n\nasync def can_use_tool(tool_name, input_data, context):\n    if tool_name == \"Bash\":\n        approved = input(\"Allow this action? (y/n): \")\n        if approved.lower() == \"y\":\n            return PermissionResultAllow(updated_input=input_data)\n        return PermissionResultDeny(message=\"User denied this action\")\n\n    return PermissionResultAllow(updated_input=input_data)\n```\n\n#### 2. Python 的 dummy hook 约束\n\n```python\nfrom claude_agent_sdk.types import HookMatcher\n\n\nasync def dummy_hook(input_data, tool_use_id, context):\n    return {\"continue_\": True}\n```\n\n这是 Python 审批流里非常关键的兼容要求。\n\n#### 3. 处理 `AskUserQuestion`\n\n```python\nasync def can_use_tool(tool_name, input_data, context):\n    if tool_name == \"AskUserQuestion\":\n        return PermissionResultAllow(\n            updated_input={\n                \"questions\": input_data.get(\"questions\", []),\n                \"answers\": {\n                    \"How should I format the output?\": \"Summary\",\n                },\n            }\n        )\n```\n\n注意返回值里必须带:\n\n- 原始 `questions`\n- 以及 `answers` 映射", "subs": ["1. 工具审批回调", "2. Python 的 dummy hook 约束", "3. 处理 AskUserQuestion"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. `canUseTool` 很适合接人工审批流\n- 比如高风险 Bash\n- 生产配置变更\n- 数据删除\n\n2. `AskUserQuestion` 很适合在 plan 模式里补需求\n- 例如问用户用哪个集群\n- 输出要摘要还是详细\n- 是否允许写文件\n\n3. 审批回调可以做“批准但改写”\n- 例如把路径重定向到沙箱\n- 把命令换成只读版本\n\n4. 不要把所有用户输入都塞进 `AskUserQuestion`\n- 它适合多选澄清\n- 更复杂的表单应使用自定义工具", "subs": ["比如高风险 Bash", "生产配置变更", "数据删除", "例如问用户用哪个集群", "输出要摘要还是详细", "是否允许写文件"]}, {"title": "实战建议", "content": "1. 高风险动作一定走 `canUseTool`\n2. 批准时优先返回“受限版输入” 而不是原始输入\n3. Python 项目提前处理 dummy hook 兼容问题\n4. 需要复杂审批链时 不要强行堆在终端交互里 而是对接工单或审批系统\n5. 对 plan 模式搭配 `AskUserQuestion` 形成“先问清 再规划”的工作流", "subs": []}, {"title": "小结", "content": "`User Input` 这一章的核心是 Agent 在需要外部决策时并不会自己猜 它会通过 canUseTool 把审批和澄清问题抛给你的应用 由你决定如何让人类参与。`", "subs": []}]}, {"title": "10. 会话管理 (Sessions)", "sections": [{"title": "本章目标", "content": "本章讲清楚 Claude Agent SDK 的会话如何创建 恢复 和分叉。读完后你应该知道:\n\n- Session ID 从哪里来\n- 怎样恢复上次会话\n- 什么是 fork session\n- 会话能力对 SRE 场景有什么现实价值", "subs": ["Session ID 从哪里来", "怎样恢复上次会话", "什么是 fork session", "会话能力对 SRE 场景有什么现实价值"]}, {"title": "原文要点整理", "content": "`sessions.html` 介绍了三件核心事情:\n\n1. 新会话启动时 SDK 会返回 session ID\n2. 你可以用 `resume` 恢复该会话\n3. 恢复时可以选择继续原会话 或 fork 出一个新分支\n\n这让 Agent 不再局限于“一问一答” 而具备了连续上下文能力。", "subs": []}, {"title": "核心概念", "content": "#### 1. 会话 ID 是恢复上下文的关键\n\n每次新会话开始时 第一条系统初始化消息里会带 session ID。你的系统应该:\n\n- 读取它\n- 持久化它\n- 在后续请求中决定是否恢复\n\n#### 2. `resume` 让会话跨请求延续\n\n当你传入:\n\n- `resume=session_id`\n\nClaude 会加载之前的上下文和历史 然后继续工作。这很适合:\n\n- 上次没处理完的排障\n- 断点续跑\n- 工单多次往返\n\n#### 3. `fork_session` 允许从同一点分叉\n\n默认恢复会继续写入原会话历史。但如果设置:\n\n- `fork_session=True`\n\n就会从当前恢复点生成一个新会话 ID。\n\n这特别适合:\n\n- 从同一个根因分析起点尝试两种方案\n- 保留原会话不被污染\n- 做方案对比", "subs": ["1. 会话 ID 是恢复上下文的关键", "2. resume 让会话跨请求延续", "3. fork_session 允许从同一点分叉"]}, {"title": "会话分支图", "content": "```mermaid\ngraph TD\n    A[Original Session] --> B[Resume same session]\n    A --> C[Fork from session]\n    B --> D[Continue linear history]\n    C --> E[New session id]\n    E --> F[Explore alternative path]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 获取 session ID\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions\n\nsession_id = None\n\nasync for message in query(\n    prompt=\"Help me build a web application\",\n    options=ClaudeAgentOptions(model=\"claude-opus-4-6\"),\n):\n    if hasattr(message, \"subtype\") and message.subtype == \"init\":\n        session_id = message.data.get(\"session_id\")\n```\n\n#### 2. 恢复会话\n\n```python\nasync for message in query(\n    prompt=\"Continue where we left off\",\n    options=ClaudeAgentOptions(resume=session_id),\n):\n    print(message)\n```\n\n#### 3. Fork 会话\n\n```python\nasync for message in query(\n    prompt=\"Try a different approach\",\n    options=ClaudeAgentOptions(\n        resume=session_id,\n        fork_session=True,\n    ),\n):\n    print(message)\n```", "subs": ["1. 获取 session ID", "2. 恢复会话", "3. Fork 会话"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 会话恢复非常适合长链路排障\n- 上一轮已经读过日志和配置\n- 下一轮可以直接继续 不必重复喂上下文\n\n2. 会话分叉很适合方案对比\n- 一条线做保守修复\n- 一条线做重构或激进优化\n\n3. Session ID 应纳入任务系统\n- 可绑定工单\n- 可绑定告警事件\n- 可绑定某次值班排障记录\n\n4. 会话恢复和文件检查点是天然搭档\n- 一个保留认知上下文\n- 一个保留文件状态回滚能力", "subs": ["上一轮已经读过日志和配置", "下一轮可以直接继续 不必重复喂上下文", "一条线做保守修复", "一条线做重构或激进优化", "可绑定工单", "可绑定告警事件"]}, {"title": "实战建议", "content": "1. 平台端把 session ID 作为一等数据保存\n2. 对关键任务支持“继续会话”和“从此处分叉”两个按钮\n3. 将会话和工单 告警 变更单关联\n4. 对长会话定期审计上下文漂移和成本增长", "subs": []}, {"title": "小结", "content": "`Sessions` 让 Claude Agent SDK 从一次性工具调用升级为可持续协作的会话系统。恢复能力适合断点续跑 分叉能力适合探索替代方案 两者都非常适合真实的运维与 SRE 工作流。`", "subs": []}]}, {"title": "11. 文件检查点与回滚 (File Checkpointing)", "sections": [{"title": "本章目标", "content": "本章解释 Agent 改坏文件之后如何回到先前状态。重点包括:\n\n- 文件检查点跟踪哪些修改\n- 如何拿到 checkpoint UUID\n- 如何调用回滚\n- 它与会话恢复的关系\n- 它的能力边界和局限", "subs": ["文件检查点跟踪哪些修改", "如何拿到 checkpoint UUID", "如何调用回滚", "它与会话恢复的关系", "它的能力边界和局限"]}, {"title": "原文要点整理", "content": "`file-checkpointing.html` 的定位很明确:\n\n- 跟踪 Agent 通过 `Write` `Edit` `NotebookEdit` 做出的文件修改\n- 在后续任意时刻按 checkpoint 回滚文件状态\n\n文档同时强调:\n\n- 它只回滚文件状态\n- 不回滚对话历史\n- 也不会捕获 Bash 直接改文件的行为", "subs": ["跟踪 Agent 通过 Write Edit NotebookEdit 做出的文件修", "在后续任意时刻按 checkpoint 回滚文件状态", "它只回滚文件状态", "不回滚对话历史", "也不会捕获 Bash 直接改文件的行为"]}, {"title": "核心概念", "content": "#### 1. 检查点跟踪的是“工具级写入”\n\n只有这几类工具写入会被记录:\n\n- `Write`\n- `Edit`\n- `NotebookEdit`\n\n如果 Agent 用 Bash 执行:\n\n- `echo > file`\n- `sed -i`\n\n这类改动默认不在检查点系统里。\n\n#### 2. 回滚是“文件回到过去” 不是“对话回到过去”\n\n这是最重要的边界:\n\n- 文件会恢复\n- 会话认知不会回退\n\n也就是说 Claude 仍然记得它做过什么 只是磁盘状态被你恢复了。\n\n#### 3. 需要额外启用并获取用户消息 UUID\n\n要用文件检查点 至少需要:\n\n- `enable_file_checkpointing=True`\n- `extra_args={\"replay-user-messages\": None}`\n\n后者的作用是让你在消息流里拿到用户消息 UUID 作为 restore point。\n\n#### 4. 恢复通常依赖会话恢复\n\n常见操作方式是:\n\n1. 捕获 checkpoint UUID\n2. 保存 session ID\n3. 之后用 `resume=session_id`\n4. 建立连接后调用 `rewind_files(checkpoint_id)`", "subs": ["1. 检查点跟踪的是“工具级写入”", "2. 回滚是“文件回到过去” 不是“对话回到过去”", "3. 需要额外启用并获取用户消息 UUID", "4. 恢复通常依赖会话恢复"]}, {"title": "文件回滚流程图", "content": "```mermaid\ngraph TD\n    A[Enable checkpointing] --> B[Capture user message uuid]\n    B --> C[Store session id]\n    C --> D[Resume session]\n    D --> E[Call rewind_files]\n    E --> F[Files restored]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 启用检查点\n\n```python\nfrom claude_agent_sdk import ClaudeAgentOptions\n\noptions = ClaudeAgentOptions(\n    enable_file_checkpointing=True,\n    permission_mode=\"acceptEdits\",\n    extra_args={\"replay-user-messages\": None},\n)\n```\n\n#### 2. 捕获 checkpoint 和 session\n\n```python\ncheckpoint_id = None\nsession_id = None\n\nasync for message in client.receive_response():\n    if isinstance(message, UserMessage) and message.uuid and not checkpoint_id:\n        checkpoint_id = message.uuid\n    if isinstance(message, ResultMessage) and not session_id:\n        session_id = message.session_id\n```\n\n#### 3. 恢复文件\n\n```python\nasync with ClaudeSDKClient(\n    ClaudeAgentOptions(enable_file_checkpointing=True, resume=session_id)\n) as client:\n    await client.query(\"\")\n    async for message in client.receive_response():\n        await client.rewind_files(checkpoint_id)\n        break\n```\n\n#### 4. 多个恢复点\n\n文档还给出了保存多个检查点的模式:\n\n- 每次用户消息都记录一个 UUID\n- 带上描述和时间戳\n- 后续可回退到某个中间状态\n\n这很适合:\n\n- 多轮重构\n- 分阶段修改\n- 每一步都想留撤销点", "subs": ["1. 启用检查点", "2. 捕获 checkpoint 和 session", "3. 恢复文件", "4. 多个恢复点"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 文件回滚非常适合高风险变更前保护\n2. 与 `acceptEdits` 结合后 可形成“先自动改 再人工验收 不满意就回滚”\n3. 它不覆盖 Bash 改写文件 所以高风险 Bash 仍需独立控制\n4. 检查点与 Session ID 一起保存 才真正可恢复", "subs": []}, {"title": "实战建议", "content": "1. 任何允许自动编辑的 Agent 默认开启文件检查点\n2. 对关键任务保存多个 checkpoint 而不是只保留一个\n3. 在 UI 或工单系统里暴露“回到上一步”的能力\n4. 对 Bash 文件写入单独限制 避免产生“以为可回滚 实际不可回滚”的错觉", "subs": []}, {"title": "小结", "content": "`File Checkpointing` 给 Agent 增加了很关键的可恢复性。它不能替代权限控制 但能显著降低自动编辑带来的试错成本。`", "subs": []}]}, {"title": "12. 托管与部署 (Hosting)", "sections": [{"title": "本章目标", "content": "本章解释 Agent SDK 为什么不能按普通无状态 API 去托管 以及常见的生产部署模式。重点包括:\n\n- 运行环境要求\n- 容器和沙箱的重要性\n- 几种典型部署模式\n- 如何评估会话与容器生命周期", "subs": ["运行环境要求", "容器和沙箱的重要性", "几种典型部署模式", "如何评估会话与容器生命周期"]}, {"title": "原文要点整理", "content": "`hosting.html` 强调 Agent SDK 与传统 LLM API 的根本差异:\n\n- 它是长运行过程\n- 会执行命令\n- 会修改文件\n- 会维护持久上下文\n\n因此它更像“有状态任务执行器” 而不是简单 HTTP 调用。\n\n文档给出四类生产模式:\n\n1. Ephemeral Sessions\n2. Long-Running Sessions\n3. Hybrid Sessions\n4. Single Containers", "subs": ["它是长运行过程", "会执行命令", "会修改文件", "会维护持久上下文"]}, {"title": "核心概念", "content": "#### 1. 容器沙箱是默认推荐部署形态\n\n文档明确建议:\n\n- 把 SDK 跑在沙箱化容器中\n\n因为你需要:\n\n- 进程隔离\n- 资源限制\n- 网络控制\n- 临时文件系统\n\n#### 2. Agent 是长生命周期进程\n\n与 stateless API 不同 Agent SDK 会:\n\n- 持续保留 shell 环境\n- 持续保留工作目录\n- 连续处理多轮交互\n\n这意味着托管设计必须考虑:\n\n- 生命周期管理\n- 空闲回收\n- 会话恢复\n- 资源配额\n\n#### 3. 四种部署模式各有适用场景\n\n- `Ephemeral Sessions` 适合一次性任务\n- `Long-Running Sessions` 适合持续服务型 Agent\n- `Hybrid Sessions` 适合间歇交互但要恢复上下文\n- `Single Containers` 更适合多 Agent 紧密协作 但隔离更难", "subs": ["1. 容器沙箱是默认推荐部署形态", "2. Agent 是长生命周期进程", "3. 四种部署模式各有适用场景"]}, {"title": "托管模式图", "content": "```mermaid\ngraph TD\n    A[Hosting Patterns] --> B[Ephemeral]\n    A --> C[Long Running]\n    A --> D[Hybrid]\n    A --> E[Single Container]\n    B --> B1[One task one container]\n    C --> C1[Persistent session]\n    D --> D1[Resume with history]\n    E --> E1[Multiple agents shared env]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "这一章不是代码页 但给了清晰的资源建议:\n\n- Python `3.10+` 或 Node `18+`\n- Claude Code CLI\n- 推荐起步资源大约 `1GiB RAM` `5GiB disk` `1 CPU`\n- 出站 HTTPS 到 `api.anthropic.com`\n\n对生产环境 这些只是下限 实际应按任务类型扩容。", "subs": ["Python 3", "Claude Code CLI", "推荐起步资源大约 1GiB RAM 5GiB disk 1 CPU", "出站 HTTPS 到 api"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. Agent 不适合随便塞进无状态函数\n- 尤其当你依赖多轮会话 工具执行 文件修改时\n\n2. 容器成本通常不是主成本\n- 文档明确说 token 才是主成本\n- 但容器生命周期仍影响整体吞吐和延迟\n\n3. 需要监控的不只是接口成功率\n- 还包括容器健康\n- 会话时长\n- Agent turns\n- MCP 连接状态\n\n4. `maxTurns` 很重要\n- Agent 不会自己超时\n- 需要上层限制死循环", "subs": ["尤其当你依赖多轮会话 工具执行 文件修改时", "文档明确说 token 才是主成本", "但容器生命周期仍影响整体吞吐和延迟", "还包括容器健康", "会话时长", "Agent turns"]}, {"title": "实战建议", "content": "1. 一次性任务先用 `Ephemeral Sessions`\n2. 值班助手或持续机器人用 `Long-Running Sessions`\n3. 既要节省资源又要保留上下文时选 `Hybrid Sessions`\n4. 从第一天就把日志 指标 健康探针带上", "subs": []}, {"title": "小结", "content": "`Hosting` 这一章的核心是 Claude Agent SDK 不是普通 stateless 推理服务 它更像一个有状态 执行型 需要隔离和生命周期管理的运行单元。`", "subs": []}]}, {"title": "13. 结构化输出 (Structured Outputs)", "sections": [{"title": "本章目标", "content": "本章讲如何让 Agent 返回稳定可编程的 JSON 结果 而不是自由文本。重点包括:\n\n- 为什么需要 structured output\n- 如何定义 schema\n- JSON Schema 与 Pydantic/Zod 的关系\n- 失败时如何处理", "subs": ["为什么需要 structured output", "如何定义 schema", "JSON Schema 与 Pydantic/Zod 的关系", "失败时如何处理"]}, {"title": "原文要点整理", "content": "`structured-outputs.html` 的核心结论是:\n\n- Agent 可以照常使用工具完成多步任务\n- 但最终结果会按照你定义的 schema 返回\n\n这解决了一个典型问题:\n\n- 模型会说话\n- 但你的系统需要结构化数据", "subs": ["Agent 可以照常使用工具完成多步任务", "但最终结果会按照你定义的 schema 返回", "模型会说话", "但你的系统需要结构化数据"]}, {"title": "核心概念", "content": "#### 1. Structured output 解决“文本不可直接消费”的问题\n\n自由文本适合聊天 不适合程序处理。结构化输出适合:\n\n- UI 渲染\n- 数据库存储\n- 下游自动化\n- 规则判断\n\n#### 2. Schema 是结果契约\n\n你需要定义:\n\n- 输出是对象还是数组\n- 有哪些字段\n- 哪些字段必填\n- 可选字段如何表达\n\nAgent 会在完成工具使用后 尝试返回满足这个契约的 JSON。\n\n#### 3. Python 推荐 Pydantic\n\n文档建议:\n\n- 简单场景可直接写 JSON Schema\n- Python 更适合用 Pydantic 生成 schema 再做校验\n\n这样可以同时获得:\n\n- 类型提示\n- 运行时校验\n- 更清晰的错误信息\n\n#### 4. 结构化输出失败会有专门错误\n\n当 Agent 多次尝试仍无法满足 schema 时:\n\n- `ResultMessage.subtype` 会变成 `error_max_structured_output_retries`\n\n所以你要把它当成独立错误类型处理。", "subs": ["1. Structured output 解决“文本不可直接消费”的问题", "2. Schema 是结果契约", "3. Python 推荐 Pydantic", "4. 结构化输出失败会有专门错误"]}, {"title": "关键代码或配置示例", "content": "#### 1. 最小 JSON Schema 示例\n\n```python\nschema = {\n    \"type\": \"object\",\n    \"properties\": {\n        \"company_name\": {\"type\": \"string\"},\n        \"founded_year\": {\"type\": \"number\"},\n        \"headquarters\": {\"type\": \"string\"},\n    },\n    \"required\": [\"company_name\"],\n}\n```\n\n#### 2. 在 `output_format` 中启用\n\n```python\nfrom claude_agent_sdk import query, ClaudeAgentOptions, ResultMessage\n\nasync for message in query(\n    prompt=\"Research Anthropic and provide key company information\",\n    options=ClaudeAgentOptions(\n        output_format={\"type\": \"json_schema\", \"schema\": schema}\n    ),\n):\n    if isinstance(message, ResultMessage) and message.structured_output:\n        print(message.structured_output)\n```\n\n#### 3. 使用 Pydantic\n\n```python\nfrom pydantic import BaseModel\n\n\nclass Step(BaseModel):\n    step_number: int\n    description: str\n    estimated_complexity: str\n\n\nclass FeaturePlan(BaseModel):\n    feature_name: str\n    summary: str\n    steps: list[Step]\n    risks: list[str]\n```\n\n然后:\n\n```python\noutput_format={\n    \"type\": \"json_schema\",\n    \"schema\": FeaturePlan.model_json_schema(),\n}\n```\n\n#### 4. 失败处理\n\n```python\nif isinstance(message, ResultMessage):\n    if message.subtype == \"success\" and message.structured_output:\n        print(message.structured_output)\n    elif message.subtype == \"error_max_structured_output_retries\":\n        print(\"Could not produce valid output\")\n```", "subs": ["1. 最小 JSON Schema 示例", "2. 在 output_format 中启用", "3. 使用 Pydantic", "4. 失败处理"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 结构化输出非常适合自动化编排\n- 例如返回巡检结果\n- 风险项列表\n- 修复计划\n- SQL 审计摘要\n\n2. Schema 要与现实任务匹配\n- 信息未必总能拿到\n- 必填字段过多会增加失败率\n\n3. 它和多步工具调用兼容\n- 适合先检索 再汇总 再返回结构化数据\n\n4. 流式输出与结构化输出不能简单混为一谈\n- 最终结构化 JSON 出现在 `ResultMessage`", "subs": ["例如返回巡检结果", "风险项列表", "修复计划", "SQL 审计摘要", "信息未必总能拿到", "必填字段过多会增加失败率"]}, {"title": "实战建议", "content": "1. 先设计最小 schema 再逐步加字段\n2. 对不稳定信息使用可选字段\n3. 在平台侧统一校验 `structured_output`\n4. 对失败子类型设计降级路径 比如退回普通文本或重试更简单 schema", "subs": []}, {"title": "小结", "content": "`Structured Outputs` 让 Agent 的结果从“能读”变成“能接入系统”。对运维和 SRE 平台来说 它是从辅助分析走向自动化编排的关键一步。`", "subs": []}]}, {"title": "14. 修改系统提示词 (Modifying System Prompts)", "sections": [{"title": "本章目标", "content": "本章解释如何改变 Agent 的默认行为风格与规则。重点包括:\n\n- 默认系统提示词（system prompt）是什么样\n- 四种修改方式有什么差别\n- `CLAUDE.md` 和 `setting_sources` 的关系\n- 什么时候该 append 什么时候该完全自定义", "subs": ["默认系统提示词（system prompt）是什么样", "四种修改方式有什么差别", "CLAUDE", "什么时候该 append 什么时候该完全自定义"]}, {"title": "原文要点整理", "content": "`modifying-system-prompts.html` 提供了四种方式:\n\n1. `CLAUDE.md`\n2. Output styles\n3. 使用 `systemPrompt` 追加说明\n4. 完全自定义 `systemPrompt`\n\n文档特别强调:\n\n- SDK 默认使用的是最小系统提示词\n- 它不等于完整 Claude Code 提示词\n- 如果想保留 Claude Code 的默认行为 需要显式指定 preset", "subs": ["SDK 默认使用的是最小系统提示词", "它不等于完整 Claude Code 提示词", "如果想保留 Claude Code 的默认行为 需要显式指定 preset"]}, {"title": "核心概念", "content": "#### 1. 默认不是完整 Claude Code 系统提示词\n\n这一点非常重要:\n\n- SDK 默认只带最基本工具说明\n- 不自动包含 Claude Code 的完整编码指南 响应风格 和项目上下文\n\n如果你要完整 Claude Code 风格 应显式设置:\n\n- `system_prompt={\"type\":\"preset\",\"preset\":\"claude_code\"}`\n\n#### 2. `CLAUDE.md` 是项目长期记忆\n\n它适合保存:\n\n- 项目约定\n- 测试命令\n- 目录结构\n- 团队规范\n\n但它不会自动加载 必须显式启用:\n\n- `setting_sources=[\"project\"]`\n\n#### 3. append 是最安全的定制方式\n\n如果你只想加一层偏好:\n\n- 比如更严格的测试要求\n- 更详细的注释\n- 特定审查重点\n\n最稳妥的方式是在 `claude_code` preset 上追加说明 而不是完全替换。\n\n#### 4. 完全自定义系统提示词 意味着你要自己承担完整责任\n\n一旦使用自定义字符串完全替代:\n\n- 默认工具说明可能丢失\n- 内建安全和风格约束也可能丢失\n- 环境上下文不再自动保留", "subs": ["1. 默认不是完整 Claude Code 系统提示词", "2. CLAUDE.md 是项目长期记忆", "3. append 是最安全的定制方式", "4. 完全自定义系统提示词 意味着你要自己承担完整责任"]}, {"title": "四种方式对比", "content": "```mermaid\ngraph TD\n    A[Modify System Prompt] --> B[CLAUDE.md]\n    A --> C[Output Styles]\n    A --> D[Preset plus Append]\n    A --> E[Custom Prompt]\n    B --> B1[Project memory]\n    C --> C1[Reusable style]\n    D --> D1[Keep built ins]\n    E --> E1[Full control full responsibility]\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 使用 Claude Code preset\n\n```python\noptions=ClaudeAgentOptions(\n    system_prompt={\n        \"type\": \"preset\",\n        \"preset\": \"claude_code\",\n    }\n)\n```\n\n#### 2. 加载 `CLAUDE.md`\n\n```python\noptions=ClaudeAgentOptions(\n    system_prompt={\n        \"type\": \"preset\",\n        \"preset\": \"claude_code\",\n    },\n    setting_sources=[\"project\"],\n)\n```\n\n#### 3. append 增量指令\n\n```python\noptions=ClaudeAgentOptions(\n    system_prompt={\n        \"type\": \"preset\",\n        \"preset\": \"claude_code\",\n        \"append\": \"Always include detailed docstrings and type hints in Python code.\",\n    }\n)\n```\n\n#### 4. 完全自定义\n\n```python\ncustom_prompt = \\\"\\\"\\\"You are a Python coding specialist.\nFollow these guidelines:\n- Write clean, well-documented code\n- Use type hints for all functions\n\\\"\\\"\\\"\n\noptions=ClaudeAgentOptions(system_prompt=custom_prompt)\n```", "subs": ["1. 使用 Claude Code preset", "2. 加载 CLAUDE.md", "3. append 增量指令", "4. 完全自定义"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. `CLAUDE.md` 很适合沉淀团队运维规范\n- 常用巡检命令\n- 变更前检查清单\n- 配置风格约束\n\n2. Output styles 适合构建不同角色 Agent\n- 例如值班助手\n- 安全审计助手\n- 变更评审助手\n\n3. 生产环境优先 append 而不是全替换\n- 因为你通常不想丢掉默认工具指令和安全边界", "subs": ["常用巡检命令", "变更前检查清单", "配置风格约束", "例如值班助手", "安全审计助手", "变更评审助手"]}, {"title": "实战建议", "content": "1. 项目级规则放 `CLAUDE.md`\n2. 可复用角色风格放 Output styles\n3. 临时任务偏好用 append\n4. 除非非常清楚后果 否则不要直接全量自定义 `system_prompt`", "subs": []}, {"title": "小结", "content": "`Modifying System Prompts` 的核心不是“怎么让 Claude 更像你想要的样子” 而是“怎么在不破坏默认能力和安全前提下进行可控定制”。`", "subs": []}]}, {"title": "15. 安全部署 (Secure Deployment)", "sections": [{"title": "本章目标", "content": "本章从生产安全视角讲如何部署 Agent。重点包括:\n\n- Threat model 是什么\n- 隔离技术怎么选\n- 凭据怎么不暴露给 Agent\n- 文件系统和网络怎么收口", "subs": ["Threat model 是什么", "隔离技术怎么选", "凭据怎么不暴露给 Agent", "文件系统和网络怎么收口"]}, {"title": "原文要点整理", "content": "`secure-deployment.html` 明确把 Agent 的风险定义为:\n\n- Prompt injection\n- 模型误判\n- 动态生成的危险操作\n\n它给出的总原则是:\n\n- Isolation\n- Least privilege\n- Defense in depth", "subs": ["Prompt injection", "模型误判", "动态生成的危险操作", "Isolation", "Least privilege", "Defense in depth"]}, {"title": "核心概念", "content": "#### 1. 把 Agent 当成半可信执行体\n\n这页文档的安全观很务实:\n\n- Agent 很强大\n- 但不能完全信任\n- 所以要像运行半可信代码一样部署它\n\n#### 2. 关键安全边界是“把敏感资源放到 Agent 外面”\n\n比如:\n\n- API key 不直接给 Agent\n- 而是放在代理层注入\n\n这样即使 Agent 被恶意 prompt 诱导:\n\n- 它也拿不到真正凭据\n\n#### 3. 隔离技术各有权衡\n\n文档比较了:\n\n- Sandbox runtime\n- Containers\n- gVisor\n- Virtual machines\n\n强度大致越来越高 代价也越来越高。\n\n#### 4. 代理模式是推荐的凭据管理方法\n\n官方建议:\n\n- 通过代理转发请求\n- 由代理注入认证信息\n- Agent 只看到工具接口或无凭据请求\n\n这对多租户场景尤其重要。\n\n#### 5. 文件系统挂载本身就可能泄密\n\n即使只读挂载代码 仍可能暴露:\n\n- `.env`\n- 云凭据\n- kubeconfig\n- 私钥\n\n所以“只读”不等于“安全”。", "subs": ["1. 把 Agent 当成半可信执行体", "2. 关键安全边界是“把敏感资源放到 Agent 外面”", "3. 隔离技术各有权衡", "4. 代理模式是推荐的凭据管理方法", "5. 文件系统挂载本身就可能泄密"]}, {"title": "安全分层图", "content": "```mermaid\ngraph TD\n    A[User or App] --> B[Agent Runtime]\n    B --> C[Sandbox or Container]\n    C --> D[Proxy]\n    D --> E[External APIs]\n    F[Credentials] --> D\n    G[Readonly Code] --> C\n```", "subs": []}, {"title": "关键代码或配置示例", "content": "#### 1. 典型容器硬化参数\n\n文档给出的 Docker 示例重点包括:\n\n- `--cap-drop ALL`\n- `--security-opt no-new-privileges`\n- `--read-only`\n- `--tmpfs`\n- `--network none`\n- `--user 1000:1000`\n\n这反映了标准硬化思路:\n\n- 去能力\n- 只读根文件系统\n- 临时可写区\n- 禁网\n- 非 root\n\n#### 2. 代理配置\n\n文档提到:\n\n- `ANTHROPIC_BASE_URL`\n- `HTTP_PROXY`\n- `HTTPS_PROXY`\n\n其中:\n\n- `ANTHROPIC_BASE_URL` 更适合采样请求代理\n- 通用 HTTPS 服务若要真正注入凭据 往往还需要 TLS 终止代理", "subs": ["1. 典型容器硬化参数", "2. 代理配置"]}, {"title": "运维工程师 / SRE 关注点", "content": "1. 安全不是只配权限模式\n- 还要控制网络 文件系统 凭据和隔离层\n\n2. 多租户场景优先考虑更强隔离\n- 如 gVisor 或 mi
