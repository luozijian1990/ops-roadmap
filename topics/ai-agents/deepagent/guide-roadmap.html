  <header>
    <h2 id="d-title"></h2>
    <div class="toggle-group" data-role="status">
      <button data-status="todo">待学</button>
      <button data-status="doing">在学</button>
      <button data-status="done">已学</button>
    </div>
    <button class="edit-btn edit-only" id="edit-section">编辑</button>
    <button class="close" id="d-close">×</button>
  </header>
  <div class="nav-hint"><kbd>←</kbd><kbd>→</kbd> 切换小节</div>
  <div class="tags-bar empty" id="d-tags"></div>
  <div class="edit-actions edit-only" id="edit-actions">
    <input class="edit-title" id="edit-title" type="text" aria-label="小节标题">
    <button class="save" id="save-section">保存</button>
    <button class="cancel" id="cancel-edit">取消</button>
    <span class="save-state" id="save-state"></span>
  </div>
  <div class="body" id="d-body"></div>
  <textarea class="editor-body" id="edit-content" spellcheck="false" aria-label="小节内容"></textarea>
</aside>
<div class="diagram-backdrop" id="diagram-backdrop"></div>
<section class="diagram-modal" id="diagram-modal" role="dialog" aria-modal="true" aria-label="放大图表">
  <header>
    <strong>Mermaid 图表</strong>
    <div class="diagram-controls" aria-label="图表缩放">
      <button id="diagram-zoom-out" title="缩小">-</button>
      <span class="diagram-zoom" id="diagram-zoom">100%</span>
      <button id="diagram-zoom-in" title="放大">+</button>
    </div>
    <button class="diagram-close" id="diagram-close" title="关闭">×</button>
  </header>
  <div class="diagram-body" id="diagram-body">
    <div class="diagram-canvas" id="diagram-canvas">
      <div class="diagram-inner" id="diagram-inner"></div>
    </div>
  </div>
</section>

<script id="data" type="application/json">{"title": "DeepAgent 中文学习笔记", "intro": "> 基于 LangChain 官方文档整理，帮助你系统学习使用 DeepAgent 开发 Python Agent。\n\n---", "parts": [{"title": "目录", "sections": [{"title": "概述", "content": "- [1. 概述 (Overview)](#1-概述-overview)\n- [2. 快速入门 (Quickstart)](#2-快速入门-quickstart)\n- [3. 自定义配置 (Customization)](#3-自定义配置-customization)\n- [4. 框架对比 (Comparison)](#4-框架对比-comparison)\n- [5. 核心能力详解 - Harness 概览](#5-核心能力详解---harness-概览)\n- [6. 后端 (Backends)](#6-后端-backends)\n- [7. 子代理 (Subagents)](#7-子代理-subagents)\n- [8. 人机协作 (Human-in-the-Loop)](#8-人机协作-human-in-the-loop)\n- [9. 长期记忆 (Long-term Memory)](#9-长期记忆-long-term-memory)\n- [10. 技能 (Skills)](#10-技能-skills)\n- [11. 沙箱 (Sandboxes)](#11-沙箱-sandboxes)\n- [12. 流式处理概览 (Streaming Overview)](#12-流式处理概览-streaming-overview)\n- [13. 前端界面 (Frontend)](#13-前端界面-frontend)\n\n---", "subs": ["1. 概述 (Overview)", "2. 快速入门 (Quickstart)", "3. 自定义配置 (Customization)", "4. 框架对比 (Comparison)", "5. 核心能力详解 - Harness 概览", "6. 后端 (Backends)"]}]}, {"title": "1. 概述 (Overview)", "sections": [{"title": "1.1 什么是 Deep Agents", "content": "Deep Agents 是使用 LLM 构建 Agent 和应用程序的**最简单方式**。它内置了以下能力:\n\n- **任务规划** (Task Planning) - 将复杂任务分解为可执行的步骤\n- **文件系统上下文管理** (File Systems for Context Management) - 通过文件系统工具管理大量上下文\n- **子代理生成** (Subagent Spawning) - 生成专门的子代理处理特定子任务\n- **长期记忆** (Long-term Memory) - 跨对话和线程持久化记忆\n\n我们可以把 `deepagents` 理解为一个**\"Agent 装具\"(Agent Harness)**。它与其他 Agent 框架使用的是相同的核心工具调用循环，但提供了内置的工具和能力。", "subs": ["任务规划 (Task Planning)", "文件系统上下文管理 (File Systems for Context Manage", "子代理生成 (Subagent Spawning)", "长期记忆 (Long"]}, {"title": "1.2 技术栈关系", "content": "```mermaid\ngraph TD\n    A[deepagents] --> B[LangChain]\n    A --> C[LangGraph]\n    B -->|提供| D[Agent 核心构建块]\n    C -->|提供| E[持久化执行]\n    C -->|提供| F[流式处理]\n    C -->|提供| G[人机协作]\n    C -->|提供| H[其他运行时特性]\n```\n\n- **LangChain**: 提供构建 Agent 的核心构建块(框架层)\n- **LangGraph**: 提供持久化执行、流式处理、人机协作等运行时特性(运行时层)\n- **Deep Agents**: 基于以上两者构建的独立库，是一个\"Agent 装具\"(应用层)", "subs": ["LangChain", "LangGraph", "Deep Agents"]}, {"title": "1.3 库的组成", "content": "`deepagents` 库包含两个主要部分:\n\n| 组件 | 描述 |\n|------|------|\n| **Deep Agents SDK** | 用于构建能处理任何任务的 Agent 的 Python 包 |\n| **Deep Agents CLI** | 基于 `deepagents` 包构建的终端编码 Agent |", "subs": []}, {"title": "1.4 创建一个 Deep Agent", "content": "以下是创建 Deep Agent 的最简示例:\n\n```python\n# pip install -qU deepagents\nfrom deepagents import create_deep_agent\n\ndef get_weather(city: str) -> str:\n    \"\"\"Get weather for a given city.\"\"\"\n    return f\"It's always sunny in {city}!\"\n\nagent = create_deep_agent(\n    tools=[get_weather],\n    system_prompt=\"You are a helpful assistant\",\n)\n\n# 运行 agent\nagent.invoke(\n    {\"messages\": [{\"role\": \"user\", \"content\": \"what is the weather in sf\"}]}\n)\n```\n\n> **提示**: 使用 [LangSmith](https://smith.langchain.com) 可以追踪请求、调试 Agent 行为和评估输出。设置 `LANGSMITH_TRACING=true` 和你的 API Key 即可开始使用。", "subs": []}, {"title": "1.5 何时使用 Deep Agents", "content": "#### 使用 Deep Agents SDK 的场景\n\n当你想构建的 Agent 需要:\n\n- **处理复杂的多步骤任务** - 需要规划和任务分解\n- **管理大量上下文** - 通过文件系统工具管理\n- **切换文件系统后端** - 使用内存状态、本地磁盘、持久化存储、沙箱或自定义后端\n- **委派工作** - 生成专门的子代理进行上下文隔离\n- **持久化记忆** - 跨对话和线程\n\n> 对于更简单的 Agent，考虑使用 LangChain 的 `create_agent` 或构建自定义 LangGraph 工作流。\n\n#### 使用 Deep Agents CLI 的场景\n\n当你想在命令行使用交互式 Deep Agent 进行编码或其他任务:\n\n- **自定义** Agent 的技能和记忆\n- **教导** Agent 你的偏好、常见模式和自定义项目知识\n- **执行代码** - 在本地机器或沙箱中运行", "subs": ["使用 Deep Agents SDK 的场景", "使用 Deep Agents CLI 的场景"]}, {"title": "1.6 核心能力", "content": "```mermaid\ngraph TD\n    DA[Deep Agent 核心能力] --> P[规划与任务分解]\n    DA --> CM[上下文管理]\n    DA --> PB[可插拔文件系统后端]\n    DA --> SS[子代理生成]\n    DA --> LTM[长期记忆]\n\n    P -->|内置工具| P1[write_todos]\n    P1 --> P2[分解复杂任务为离散步骤]\n    P1 --> P3[跟踪进度]\n    P1 --> P4[根据新信息调整计划]\n\n    CM -->|文件系统工具| CM1[ls - 列出文件]\n    CM -->|文件系统工具| CM2[read_file - 读取文件]\n    CM -->|文件系统工具| CM3[write_file - 写入文件]\n    CM -->|文件系统工具| CM4[edit_file - 编辑文件]\n\n    PB --> PB1[内存状态]\n    PB --> PB2[本地磁盘]\n    PB --> PB3[LangGraph Store 跨线程持久化]\n    PB --> PB4[沙箱 - Modal/Daytona/Deno]\n    PB --> PB5[自定义后端]\n\n    SS -->|内置工具| SS1[task 工具]\n    SS1 --> SS2[生成专门的子代理]\n    SS1 --> SS3[保持主代理上下文清洁]\n\n    LTM --> LTM1[LangGraph Memory Store]\n    LTM1 --> LTM2[跨线程保存和检索信息]\n```\n\n#### 各核心能力详解\n\n| 能力 | 描述 | 关键工具/组件 |\n|------|------|--------------|\n| **规划与任务分解** | 将复杂任务分解为离散步骤，跟踪进度，根据新信息调整计划 | `write_todos` 工具 |\n| **上下文管理** | 将大量上下文卸载到内存或文件系统存储，防止上下文窗口溢出 | `ls`、`read_file`、`write_file`、`edit_file` |\n| **可插拔文件系统后端** | 可根据用例切换的虚拟文件系统后端 | 内存、本地磁盘、LangGraph Store、沙箱、自定义 |\n| **子代理生成** | 生成专门的子代理实现上下文隔离，保持主代理上下文清洁 | `task` 工具 |\n| **长期记忆** | 使用 LangGraph 的 Memory Store 实现跨线程持久记忆 | LangGraph Memory Store |\n\n---", "subs": ["各核心能力详解"]}]}, {"title": "2. 快速入门 (Quickstart)", "sections": [{"title": "2.1 前置条件", "content": "本章将引导你创建你的第一个 Deep Agent，它具备规划、文件系统工具和子代理能力。我们将构建一个**研究 Agent**，能够进行网络调研并撰写报告。\n\n\n- 需要一个模型提供商的 API Key (如 Anthropic、OpenAI)\n- Deep Agents 需要支持**工具调用 (Tool Calling)** 的模型", "subs": ["需要一个模型提供商的 API Key (如 Anthropic、OpenAI)", "Deep Agents 需要支持工具调用 (Tool Calling) 的模型"]}, {"title": "2.2 步骤详解", "content": "#### Step 1: 安装依赖\n\n```shell\npip install deepagents tavily-python\n```\n\n> 本教程使用 [Tavily](https://tavily.com) 作为示例搜索提供商，你也可以替换为其他搜索 API (如 DuckDuckGo、SerpAPI、Brave Search)。\n\n#### Step 2: 设置 API Key\n\n```shell\nexport ANTHROPIC_API_KEY=\"your-api-key\"\nexport TAVILY_API_KEY=\"your-tavily-api-key\"\n```\n\n#### Step 3: 创建搜索工具\n\n```python\nimport os\nfrom typing import Literal\nfrom tavily import TavilyClient\nfrom deepagents import create_deep_agent\n\ntavily_client = TavilyClient(api_key=os.environ[\"TAVILY_API_KEY\"])\n\ndef internet_search(\n    query: str,\n    max_results: int = 5,\n    topic: Literal[\"general\", \"news\", \"finance\"] = \"general\",\n    include_raw_content: bool = False,\n):\n    \"\"\"Run a web search\"\"\"\n    return tavily_client.search(\n        query,\n        max_results=max_results,\n        include_raw_content=include_raw_content,\n        topic=topic,\n    )\n```\n\n#### Step 4: 创建 Deep Agent\n\n```python\n# 系统提示词，引导 Agent 成为专业研究员\nresearch_instructions = \"\"\"You are an expert researcher.\nYour job is to conduct thorough research and then write a polished report.\nYou have access to an internet search tool as your primary means of gathering information.\n\n## `internet_search`\nUse this to run an internet search for a given query.\nYou can specify the max number of results to return, the topic,\nand whether raw content should be included.\n\"\"\"\n\nagent = create_deep_agent(\n    tools=[internet_search],\n    system_prompt=research_instructions\n)\n```\n\n#### Step 5: 运行 Agent\n\n```python\nresult = agent.invoke(\n    {\"messages\": [{\"role\": \"user\", \"content\": \"What is langgraph?\"}]}\n)\n\n# 打印 Agent 的回复\nprint(result[\"messages\"][-1].content)\n```", "subs": ["Step 1", "Step 2", "Step 3", "Step 4", "Step 5"]}, {"title": "2.3 工作原理", "content": "你的 Deep Agent 会**自动**完成以下流程:\n\n```mermaid\ngraph TD\n    A[接收用户请求] --> B[规划任务]\n    B -->|write_todos| C[分解研究任务为步骤]\n    C --> D[执行研究]\n    D -->|internet_search| E[调用搜索工具收集信息]\n    E --> F[管理上下文]\n    F -->|write_file / read_file| G[将大量搜索结果卸载到文件系统]\n    G --> H{是否需要深入子任务?}\n    H -->|是| I[生成子代理]\n    I -->|task 工具| J[委派复杂子任务给专门的子代理]\n    J --> H\n    H -->|否| K[综合报告]\n    K --> L[将研究结果编译为连贯的回复]\n```\n\n具体行为包括:\n\n| 阶段 | 使用的内置工具 | 说明 |\n|------|--------------|------|\n| **规划** | `write_todos` | 将研究任务分解为可执行的步骤 |\n| **研究** | `internet_search` (自定义) | 调用搜索工具收集信息 |\n| **上下文管理** | `write_file`、`read_file` | 将大量搜索结果卸载到文件系统，避免上下文溢出 |\n| **子代理委派** | `task` | 根据需要生成子代理处理复杂子任务 |\n| **综合** | - | 将所有研究发现编译成连贯的报告 |", "subs": []}, {"title": "2.4 流式处理", "content": "Deep Agents 内置了基于 LangGraph 的**流式处理**能力，可以:\n\n- 实时观察 Agent 执行过程中的输出\n- 审查和调试 Agent 及子代理的工作 (工具调用、工具结果、LLM 响应)", "subs": ["实时观察 Agent 执行过程中的输出", "审查和调试 Agent 及子代理的工作 (工具调用、工具结果、LLM 响应)"]}, {"title": "2.5 下一步", "content": "构建完第一个 Deep Agent 后，可以继续学习:\n\n- **自定义你的 Agent** - 自定义系统提示词、工具和子代理\n- **添加长期记忆** - 启用跨对话的持久记忆\n- **部署到生产环境** - 了解 LangGraph 应用的部署选项\n\n---", "subs": ["自定义你的 Agent", "添加长期记忆", "部署到生产环境"]}]}, {"title": "3. 自定义配置 (Customization)", "sections": [{"title": "3.1 核心配置选项", "content": "`create_deep_agent` 提供了丰富的核心配置选项，让你可以根据需求定制 Agent 的行为。主要配置项包括: 模型(Model)、工具(Tools)、系统提示词(System Prompt)、中间件(Middleware)、子代理(Subagents)、后端虚拟文件系统(Backends)、人机协作(Human-in-the-loop)、技能(Skills)和记忆(Memory)。\n\n\n#### 3.1.1 连接弹性 (Connection resilience)\n\nLangChain 聊天模型默认会对网络错误、并发限制(429)和服务器错误(5xx)进行带指数退避的**自动重试(默认 6 次)**。如果你在不稳定网络下运行长时间的 Agent 任务，建议在创建模型时将 `max_retries` 参数提高到 10-15 次，并搭配 Checkpointer 持久化进度。\n\n#### 3.1.2 模型 (Model)\n\n默认情况下，Deep Agents 使用 `claude-sonnet-4-5-20250929`。你可以传入任何受支持的 `LangChain` 模型对象来更换:\n\n```python\nfrom langchain_openai import ChatOpenAI\nfrom deepagents import create_deep_agent\n\nagent = create_deep_agent(\n    model=ChatOpenAI(model=\"gpt-4o\") # 也可以简写为字符串 \"openai:gpt-4o\"\n)\n```\n\n支持 OpenAI, Anthropic, Azure, Google Gemini, AWS Bedrock 和 HuggingFace。\n\n#### 3.1.3 工具 (Tools)\n\n除了内置的规划(`write_todos`)、文件管理和子代理生成(`task`)工具外，你可以传入自定义工具:\n\n```python\nfrom langchain.tools import tool\n\n@tool\ndef my_custom_tool(query: str) -> str:\n    \"\"\"Do something custom.\"\"\"\n    return f\"Processed {query}\"\n\nagent = create_deep_agent(tools=[my_custom_tool])\n```\n\n#### 3.1.4 系统提示词 (System prompt)\n\nDeep Agents 内置了一个包含规划工具、文件系统工具和子代理详细说明的基础系统提示词。**每个 Deep Agent 都应该补充特定用例的自定义系统提示词**:\n\n```python\nagent = create_deep_agent(\n    system_prompt=\"You are a specialized financial analyst. You analyze quarterly reports...\"\n)\n```\n\n> **注意**: 当中间件添加特殊工具(如文件系统工具)时，它会自动在系统提示词末尾追加工具的说明。\n\n#### 3.1.5 结构化输出 (Structured output)\n\n你可以通过 `response_format` 参数强制 Agent 返回特定的结构化数据。模型生成的数据将被验证并存放在 Agent 状态的 `structured_response` 键中:\n\n```python\nfrom pydantic import BaseModel\nclass ResearchReport(BaseModel):\n    title: str\n    summary: str\n\nagent = create_deep_agent(response_format=ResearchReport)\n```", "subs": ["3.1.1 连接弹性 (Connection resilience)", "3.1.2 模型 (Model)", "3.1.3 工具 (Tools)", "3.1.4 系统提示词 (System prompt)", "3.1.5 结构化输出 (Structured output)"]}, {"title": "3.2 进阶配置与中间件", "content": "#### 3.2.1 中间件 (Middleware)\n\n中间件用于扩展 Agent 的核心功能。默认会自动加载以下中间件:\n\n- `TodoListMiddleware`: 跟踪和管理待办事项\n- `FilesystemMiddleware`: 处理文件系统的读写导航\n- `SubAgentMiddleware`: 生成和协调专门的子代理\n- `SummarizationMiddleware`: 对话过长时自动压缩历史记录\n- `AnthropicPromptCachingMiddleware`: (如果使用 Anthropic) 自动缓存以减少 token 消耗\n- `PatchToolCallsMiddleware`: 修复中断或异常的工具调用历史\n\n如果启用了对应功能，还会自动加载:\n\n- `MemoryMiddleware`: 通过 `memory` 参数启用记忆\n- `SkillsMiddleware`: 通过 `skills` 参数启用动态技能\n- `HumanInTheLoopMiddleware`: 通过 `interrupt_on` 参数启用需要人类审批的操作\n\n**自定义中间件**:\n你可以编写自己的中间件，通过钩子(Hooks)如 `before_agent`, `after_tool` 介入执行过程。\n> **警告**: 不要在中间件中直接修改(Mutate)实例属性(如 `self.x = 1`)，这会引起并发(子代理/并行工具)下的竞态条件。如果你需要跨钩子跟踪数据，必须使用**Graph State(状态字典)**，因为它是线程隔离的。\n\n#### 3.2.2 子代理 (Subagents)\n\n为了隔离复杂工作并避免主代理的上下文臃肿，应该配置并使用子代理委派任务。你可以指定哪些代理可以作为子代理被唤起。\n\n#### 3.2.3 后端 (Backends) - 虚拟文件系统\n\nDeep Agents 可以使用虚拟文件系统存储和编辑文件，支持不同的后端:\n\n- `StateBackend` (默认): 即时存在于 LangGraph 状态中的虚拟文件系统，仅在单次线程内持久。\n- `FilesystemBackend` 🔌: 直接映射宿主机的本地文件系统。赋予 Agent 真实的读写权限。(⚠️谨慎使用)\n- `LocalShellBackend` 🔌: 提供本地系统文件权限**加上** `execute` 工具来执行任意终端命令。(⚠️极高风险)\n- `StoreBackend` 💾: 提供跨线程持久化的长期存储系统。\n- `CompositeBackend`: 将不同的虚拟路径映射到不同的后端(如把 `/memories/` 挂载到持久存储，其余留在一次性内存中)。\n\n**沙箱后端 (Sandboxes)**:\n为了安全起见，应在隔离环境(带文件系统且能执行命令)中运行代码。支持:\n\n- **Modal** Sandbox (`langchain-modal`)\n- **Runloop** Sandbox (`langchain-runloop`)\n- **Daytona** Sandbox (`langchain-daytona`)", "subs": ["3.2.1 中间件 (Middleware)", "3.2.2 子代理 (Subagents)", "3.2.3 后端 (Backends) - 虚拟文件系统"]}, {"title": "3.3 交互与记忆系统", "content": "#### 3.3.1 人机协作 (Human-in-the-loop)\n\n对于敏感操作，你可以配置在工具执行前请求人类批准(带有 `approve/edit/reject` 等选项)。\n**注意**: 此功能强制要求传入 `checkpointer` (检查点持久化器，如 `MemorySaver`)。\n\n```python\nfrom langgraph.checkpoint.memory import MemorySaver\n\nagent = create_deep_agent(\n    tools=[delete_file, send_email],\n    interrupt_on={\n        \"delete_file\": True, # 默认支持:批准/编辑/拒绝\n        \"send_email\": {\"allowed_decisions\": [\"approve\", \"reject\"]}, # 限制不能编辑\n    },\n    checkpointer=MemorySaver() # 必须配置 Checkpointer!\n)\n```\n\n#### 3.3.2 技能库 (Skills)\n\n不像主要包含底层代码逻辑的 Tools，**Skills(技能)** 是包含执行特定任务指南、参考资料及模板的 `.md` Markdown 文件。\n技能是**动态加载**(Progressive disclosure)的——Agent 预先通过向量描述判断哪些功能适用，用到时才会将对应文献载入上下文，从而大幅包省 token 且减少启动负担。\n> **重要机制**: 如果使用了技能，需要将你的技能文件放置在虚拟文件系统的指定路径中，并通过 `skills=[\"/path/to/skills/\"]` 挂载给 Agent。\n\n#### 3.3.3 长期记忆 (Memory)\n\n你可以通过 `.md` 文件为 Agent 提供长期上下文，你可以传入系统文件或数据库存储配置给 `memory` 参数，从而让 Agent 在跨 Session 和线程间记住用户的偏好、过往设定及项目惯例。\n\n---", "subs": ["3.3.1 人机协作 (Human-in-the-loop)", "3.3.2 技能库 (Skills)", "3.3.3 长期记忆 (Memory)"]}]}, {"title": "4. 框架对比 (Comparison)", "sections": [{"title": "4.1 总览对比", "content": "本章对比 **LangChain Deep Agents**、**OpenCode** 和 **Claude Agent SDK** 三个主流 Agent 框架，帮助你选择合适的工具。\n\n\n| 方面 | LangChain Deep Agents | OpenCode | Claude Agent SDK |\n| --- | --- | --- | --- |\n| **主要用途** | 以代码方式构建生产级 Agent | 终端/桌面/IDE 中的交互式编码 Agent | 以代码方式构建生产级 Agent |\n| **模型支持** | 模型不可知论 (Anthropic, OpenAI 及 100+ 其他) | 75+ 供应商，含本地模型 (Ollama) | 仅 Claude 模型 (Anthropic, Azure, Vertex AI, Bedrock) |\n| **许可证** | MIT | MIT | MIT (底层 Claude Code 为专有) |\n| **架构形式** | Python SDK + TypeScript SDK + CLI | TypeScript SDK + 独立产品 | Python SDK + TypeScript SDK |", "subs": []}, {"title": "4.2 详细特性对比", "content": "#### 核心工具\n\n| 特性 | Deep Agents | OpenCode | Claude Agent SDK |\n| --- | --- | --- | --- |\n| 文件读写编辑 | ✅ `ls`, `read_file`, `write_file`, `edit_file` | ✅ `list`, `read`, `write`, `edit` | ✅ read, write, edit |\n| Shell 执行 | ✅ `execute` | ✅ `bash` | ✅ bash |\n| Glob/Grep 搜索 | ✅ `glob`, `grep` | ✅ `glob`, `grep` | ✅ glob, grep |\n| 网络搜索 | ✅ 支持第三方和供应商原生 | ✅ `webfetch`, `websearch` | ✅ WebSearch, WebFetch |\n| 规划/待办 | ✅ `write_todos` | ✅ Plan 模式 (只读分析) | ✅ Todo lists |\n| 子代理 | ✅ Subagents | ✅ General + Explore agents | ✅ Subagents |\n| MCP 支持 | ✅ | ✅ | ✅ |\n\n#### 交互与协作\n\n| 特性 | Deep Agents | OpenCode | Claude Agent SDK |\n| --- | --- | --- | --- |\n| 人机协作 (HITL) | ✅ Approve/Edit/Reject | ✅ Allow/Ask/Deny | ✅ Permission modes |\n| 技能系统 | ✅ Skills | ✅ Skills | ✅ Skills |\n| 长期记忆 | ✅ Memory Store | ✅ Rules | ✅ CLAUDE.md 文件 |\n| 流式处理 | ✅ Streaming | ✅ | ✅ Streaming |\n\n#### 沙箱与架构\n\n| 特性 | Deep Agents | OpenCode | Claude Agent SDK |\n| --- | --- | --- | --- |\n| Agent 运行在沙箱中 | ✅ | ✅ | ✅ |\n| Agent 把沙箱当工具使用 | ✅ 沙箱作为工具 | ❌ | ❌ |\n| 可组合中间件 | ✅ Middleware | 插件 (Plugins) | Hooks |\n| 可插拔存储后端 | ✅ Backends | ❌ | ❌ |\n| 虚拟文件系统 | ✅ 可插拔后端的虚拟文件系统 | ❌ | ❌ |\n\n#### 状态管理与可观测性\n\n| 特性 | Deep Agents | OpenCode | Claude Agent SDK |\n| --- | --- | --- | --- |\n| 会话恢复 | ✅ | ✅ Sessions | ✅ Session management |\n| 文件检查点 | ✅ Backends + Checkpoints | ✅ (基于 Git) | ✅ File checkpointing |\n| 时间旅行 (状态分支) | ✅ 完整支持 | ❌ | ✅ |\n| 原生追踪 | ✅ LangSmith | ❌ | ❌ |", "subs": ["核心工具", "交互与协作", "沙箱与架构", "状态管理与可观测性"]}, {"title": "4.3 Deep Agents 的独特优势", "content": "```mermaid\ngraph TD\n    DA[Deep Agents 独有能力] --> V1[虚拟文件系统]\n    DA --> V2[可插拔存储后端]\n    DA --> V3[沙箱当工具用]\n    DA --> V4[可组合中间件架构]\n    DA --> V5[LangSmith 原生追踪]\n    DA --> V6[完整时间旅行]\n    DA --> V7[模型不可知论 - 100+模型]\n\n    V1 --> V1A[文件操作与物理存储完全解耦]\n    V2 --> V2A[State/Filesystem/Store/Composite 多种后端]\n    V3 --> V3A[Agent 可以把 Modal/Runloop/Daytona 当工具调用]\n    V4 --> V4A[通过中间件灵活扩展 Agent 能力]\n```\n\n> **总结**: Deep Agents 在**架构灵活性**(可插拔后端、虚拟文件系统、可组合中间件)和**可观测性**(LangSmith 原生追踪)方面具有显著优势。如果你需要构建模型无关、可部署到生产环境的 Agent，Deep Agents 是首选。\n\n---", "subs": []}]}, {"title": "5. 核心能力详解 - Harness 概览", "sections": [{"title": "5.1 Agent 循环 (Agent Loop)", "content": "Harness (装具) 是 Deep Agent 底层的运行时引擎，它将 LLM 封装为一个完整的 Agent，负责工具调用循环、提示词组装、上下文管理和资源协调。\n\n\nDeep Agent 的核心执行流程如下:\n\n```mermaid\ngraph TD\n    A[用户输入] --> B[组装系统提示词]\n    B --> C[调用 LLM]\n    C --> D{LLM 返回结果}\n    D -->|包含工具调用| E[执行工具]\n    E --> F[将工具结果加入消息历史]\n    F --> C\n    D -->|纯文本响应| G[返回最终结果给用户]\n```\n\n这是一个标准的**工具调用循环 (Tool Calling Loop)**: LLM 接收消息，决定是调用工具还是直接返回文本。如果调用了工具，工具的结果会被追加到消息历史中，然后再次调用 LLM，直到 LLM 决定返回纯文本响应。", "subs": []}, {"title": "5.2 内置工具系统", "content": "Deep Agent 通过**中间件 (Middleware)** 向 Agent 注入工具。默认包含以下工具集:\n\n| 工具类别 | 工具名称 | 用途 |\n| --- | --- | --- |\n| 规划 | `write_todos` | 创建和更新待办事项列表，分解任务 |\n| 文件系统 | `ls`, `read_file`, `write_file`, `edit_file` | 管理虚拟文件系统中的文件 |\n| 搜索 | `glob`, `grep` | 在文件系统中搜索文件和内容 |\n| 子代理 | `task` | 创建子代理处理独立子任务 |\n| 代码执行 | `execute` | (仅沙箱后端) 在隔离环境中运行 Shell 命令 |", "subs": []}, {"title": "5.3 系统提示词组装", "content": "Deep Agent 的系统提示词按以下顺序动态组装:\n\n```mermaid\ngraph TD\n    SP[系统提示词组装流程] --> A[\"1. 用户自定义提示词<br/>(system_prompt 参数)\"]\n    A --> B[\"2. 规划提示词<br/>(write_todos 工具说明)\"]\n    B --> C[\"3. 记忆提示词<br/>(AGENTS.md + 使用指南, 仅当提供 memory)\"]\n    C --> D[\"4. 技能提示词<br/>(技能位置 + 前置信息列表, 仅当提供 skills)\"]\n    D --> E[\"5. 虚拟文件系统提示词<br/>(文件系统 + execute 工具文档)\"]\n    E --> F[\"6. 子代理提示词<br/>(task 工具使用说明)\"]\n    F --> G[\"7. 自定义中间件提示词\"]\n    G --> H[\"8. HITL 提示词<br/>(仅当设置 interrupt_on)\"]\n    H --> I[\"9. 本地上下文提示词<br/>(CLI 本地使用时)\"]\n```", "subs": []}, {"title": "5.4 运行时上下文管理 (Context Compression)", "content": "Deep Agent 使用**上下文压缩 (Context Compression)** 模式，在保留任务相关细节的同时，缩减 Agent 工作记忆的大小。\n\n#### 5.4.1 大内容卸载 (Offloading)\n\n当工具调用的输入或输出超过阈值时，自动卸载到文件系统:\n\n| 场景 | 触发条件 | 处理方式 |\n| --- | --- | --- |\n| **工具输入过大** | 超过 20,000 tokens | 当上下文达到模型窗口的 85% 时，截断旧的工具调用，替换为文件路径指针 |\n| **工具输出过大** | 超过 20,000 tokens | 立即卸载到后端文件系统，替换为文件路径引用 + 前 10 行预览 |\n\n> **配置**: 可通过 `tool_token_limit_before_evict` 参数调整卸载阈值。\n\n#### 5.4.2 消息历史摘要 (Summarization)\n\n当上下文大小超过模型上下文窗口限制(默认 85% 的 `max_input_tokens`)，且没有更多内容可以卸载时:\n\n1. **生成摘要**: LLM 生成一份结构化摘要(包含会话意图、已生成文件、下一步计划)，替换完整对话历史\n2. **保留原文**: 完整的原始消息被写入文件系统，作为规范记录，以便后续搜索\n\n**默认配置**:\n\n- 触发点: 模型 `max_input_tokens` 的 85%\n- 保留最近 10% 的 token 作为近期上下文\n- 如果模型配置不可用，回退到 170,000 token 触发 / 保留 6 条最新消息\n\n#### 5.4.3 长期记忆 (Long-term Memory)\n\n默认文件系统仅在单个线程内持久。要实现跨线程/跨会话持久化，需使用 `CompositeBackend`:\n\n```python\nfrom deepagents import create_deep_agent\nfrom deepagents.backends import CompositeBackend, StateBackend, StoreBackend\n\n# 配置混合存储: 常规文件用临时内存, /memories/ 路径用持久存储\ncomposite_backend = lambda rt: CompositeBackend(\n    default=StateBackend(rt),          # 临时文件\n    routes={\"/memories/\": StoreBackend(rt)}  # 持久记忆\n)\n```\n\nAgent 存储在 `/memories/` 路径下的文件(如 `/memories/preferences.txt`)会跨重启和会话持久化。", "subs": ["5.4.1 大内容卸载 (Offloading)", "5.4.2 消息历史摘要 (Summarization)", "5.4.3 长期记忆 (Long-term Memory)"]}, {"title": "5.5 代码执行", "content": "使用沙箱后端时，装具会自动暴露 `execute` 工具:\n\n- 在隔离环境中运行 Shell 命令\n- 返回 stdout/stderr、退出码\n- 大输出自动截断并保存到文件供 Agent 逐步读取\n- **安全性**: 代码运行在沙箱中，保护宿主系统\n- 没有沙箱后端时，Agent 只有文件系统工具，无法执行命令", "subs": ["在隔离环境中运行 Shell 命令", "返回 stdout/stderr、退出码", "大输出自动截断并保存到文件供 Agent 逐步读取", "安全性: 代码运行在沙箱中，保护宿主系统", "没有沙箱后端时"]}, {"title": "5.6 其他装具特性", "content": "| 特性 | 工作方式 |\n| --- | --- |\n| **人机协作 (HITL)** | 通过 `interrupt_on` 参数在指定工具调用前暂停，等待人类批准/修改/拒绝 |\n| **技能 (Skills)** | 遵循 Agent Skills 标准，每个技能是含 `SKILL.md` 的目录，使用\"渐进披露\"按需加载 |\n| **记忆 (Memory)** | 通过 `AGENTS.md` 文件提供持久上下文，始终加载(不像技能的按需加载)，Agent 可根据交互更新记忆 |\n\n---", "subs": []}]}, {"title": "6. 后端 (Backends)", "sections": [{"title": "6.1 五种内置后端", "content": "后端 (Backend) 是 Deep Agent 的**虚拟文件系统层**，为 Agent 提供文件读写、搜索等存储能力。不同的后端决定了文件的持久化方式和隔离级别。\n\n\n```mermaid\ngraph TD\n    B[Backend 后端类型] --> SB[\"StateBackend<br/>(默认, 临时内存)\"]\n    B --> FB[\"FilesystemBackend<br/>(本地磁盘)\"]\n    B --> LSB[\"LocalShellBackend<br/>(本地磁盘 + Shell)\"]\n    B --> STB[\"StoreBackend<br/>(跨线程持久化)\"]\n    B --> CB[\"CompositeBackend<br/>(混合路由)\"]\n\n    SB -->|特点| SB1[存储在 LangGraph 状态中]\n    SB -->|生命周期| SB2[仅单线程内持久]\n\n    FB -->|特点| FB1[映射宿主机真实文件系统]\n    FB -->|风险| FB2[Agent 可读写本地文件]\n\n    LSB -->|特点| LSB1[文件系统 + execute 工具]\n    LSB -->|风险| LSB2[可执行任意 Shell 命令]\n\n    STB -->|特点| STB1[使用 LangGraph Store]\n    STB -->|生命周期| STB2[跨线程跨会话持久化]\n\n    CB -->|特点| CB1[不同路径路由到不同后端]\n    CB -->|典型用法| CB2[\"临时文件用 State<br/>记忆用 Store\"]\n```\n\n| 后端 | 持久化 | Shell 执行 | 适用场景 |\n| --- | --- | --- | --- |\n| `StateBackend` | 单线程内 | ❌ | 默认选择，适合大多数场景 |\n| `FilesystemBackend` | 本地磁盘 | ❌ | 需要读写真实文件 |\n| `LocalShellBackend` | 本地磁盘 | ✅ | 需要执行命令 (⚠️ 高风险) |\n| `StoreBackend` | 跨线程持久 | ❌ | 需要跨会话保存数据 |\n| `CompositeBackend` | 混合 | 取决于路由 | 混合持久化需求 |", "subs": []}, {"title": "6.2 后端配置方式", "content": "通过 `create_deep_agent(backend=...)` 传入后端:\n\n- 传入**实例**：如 `FilesystemBackend(root_dir=\".\")`\n- 传入**工厂函数**：如 `lambda rt: StateBackend(rt)` (需要运行时对象的后端)\n- 默认值：`lambda rt: StateBackend(rt)`", "subs": ["传入实例：如 FilesystemBackend(root_dir=\".\")", "传入工厂函数", "默认值：lambda rt: StateBackend(rt)"]}, {"title": "6.3 CompositeBackend 路由配置", "content": "将不同路径映射到不同后端，最常见的场景是将 `/memories/` 持久化，其他保持临时:\n\n```python\nfrom deepagents import create_deep_agent\nfrom deepagents.backends import CompositeBackend, StateBackend, FilesystemBackend\n\ncomposite_backend = lambda rt: CompositeBackend(\n    default=StateBackend(rt),  # 默认: 临时存储\n    routes={\n        \"/memories/\": FilesystemBackend(\n            root_dir=\"/deepagents/myagent\", virtual_mode=True\n        ),  # /memories/ 路径: 持久化到本地磁盘\n    },\n)\n\nagent = create_deep_agent(backend=composite_backend)\n```\n\n**路由规则**:\n\n- `/workspace/plan.md` → `StateBackend` (临时)\n- `/memories/agent.md` → `FilesystemBackend` (持久)\n- `ls`、`glob`、`grep` 会聚合所有后端的结果\n- 更长的路径前缀优先匹配 (如 `/memories/projects/` 会覆盖 `/memories/`)", "subs": ["/workspace/plan", "/memories/agent", "ls、glob、grep 会聚合所有后端的结果", "更长的路径前缀优先匹配 (如 /memories/projects/ 会覆盖 /me"]}, {"title": "6.4 自定义虚拟文件系统", "content": "你可以实现自定义后端，将远程存储 (如 S3、Postgres) 映射为 Agent 可用的文件系统。\n\n```python\n# S3 后端示例 (骨架)\nclass S3Backend(BackendProtocol):\n    def __init__(self, bucket: str, prefix: str = \"\"):\n        self.bucket = bucket\n        self.prefix = prefix.rstrip(\"/\")\n\n    def ls_info(self, path: str) -> list[FileInfo]: ...\n    def read(self, file_path: str, offset=0, limit=2000) -> str: ...\n    def grep_raw(self, pattern, path=None, glob=None) -> list[GrepMatch] | str: ...\n    def glob_info(self, pattern, path=\"/\") -> list[FileInfo]: ...\n    def write(self, file_path: str, content: str) -> WriteResult: ...\n    def edit(self, file_path, old_string, new_string, replace_all=False) -> EditResult: ...\n```\n\n> **设计指南**: 路径使用绝对路径 (`/x/y.txt`)；外部持久化后端的 `files_update` 返回 `None`；只有状态内后端才返回 `files_update` 字典。", "subs": []}, {"title": "6.5 策略钩子 (Policy Hooks)", "content": "通过子类化或包装后端，可以实施企业级安全策略，例如禁止在特定路径下写入:\n\n```python\nclass GuardedBackend(FilesystemBackend):\n    def __init__(self, *, deny_prefixes: list[str], **kwargs):\n        super().__init__(**kwargs)\n        self.deny_prefixes = [p if p.endswith(\"/\") else p + \"/\" for p in deny_prefixes]\n\n    def write(self, file_path: str, content: str) -> WriteResult:\n        if any(file_path.startswith(p) for p in self.deny_prefixes):\n            return WriteResult(error=f\"Writes are not allowed under {file_path}\")\n        return super().write(file_path, content)\n```", "subs": []}, {"title": "6.6 BackendProtocol 接口规范", "content": "所有后端必须实现 `BackendProtocol`，包含以下方法:\n\n| 方法 | 签名 | 说明 |\n| --- | --- | --- |\n| `ls_info` | `(path) -> list[FileInfo]` | 列出目录，返回路径、大小、修改时间等 |\n| `read` | `(file_path, offset, limit) -> str` | 读取文件内容(带行号)，文件不存在返回错误字符串 |\n| `grep_raw` | `(pattern, path, glob) -> list[GrepMatch] \\| str` | 搜索内容，正则无效时返回错误字符串 |\n| `glob_info` | `(pattern, path) -> list[FileInfo]` | 通过 glob 模式匹配文件 |\n| `write` | `(file_path, content) -> WriteResult` | 创建文件(仅创建，冲突时返回错误) |\n| `edit` | `(file_path, old, new, replace_all) -> EditResult` | 编辑文件，返回替换次数 |\n\n**核心数据类型**:\n\n- `WriteResult`: 包含 `error`、`path`、`files_update`\n- `EditResult`: 包含 `error`、`path`、`files_update`、`occurrences`\n- `FileInfo`: 包含 `path` (必选)、`is_dir`、`size`、`modified_at` (可选)\n- `GrepMatch`: 包含 `path`、`line`、`text`\n\n---", "subs": ["WriteResult", "EditResult", "FileInfo", "GrepMatch"]}]}, {"title": "7. 子代理 (Subagents)", "sections": [{"title": "7.1 工作原理", "content": "子代理是 Deep Agent 实现**上下文隔离**和**任务委派**的核心机制。主代理可以将复杂子任务委派给专门的子代理，每个子代理拥有独立的上下文窗口，避免主代理上下文膨胀。\n\n\n```mermaid\ngraph TD\n    MA[主代理] -->|\"task() 工具\"| SA1[子代理 A]\n    MA -->|\"task() 工具\"| SA2[子代理 B]\n    MA -->|\"task() 工具\"| SA3[子代理 C]\n\n    SA1 -->|返回简洁结果| MA\n    SA2 -->|返回简洁结果| MA\n    SA3 -->|返回简洁结果| MA\n\n    SA1 -.->|独立上下文| CTX1[上下文窗口 A]\n    SA2 -.->|独立上下文| CTX2[上下文窗口 B]\n    SA3 -.->|独立上下文| CTX3[上下文窗口 C]\n```\n\n**核心流程**:\n\n1. 主代理通过内置的 `task()` 工具调用子代理\n2. 子代理在自己的独立上下文中执行任务\n3. 子代理将简洁的结果返回给主代理\n4. 主代理的上下文保持干净", "subs": []}, {"title": "7.2 配置子代理", "content": "每个子代理通过字典定义，传入 `subagents` 参数:\n\n```python\nfrom deepagents import create_deep_agent\n\nsubagents = [\n    {\n        \"name\": \"researcher\",              # 唯一名称\n        \"description\": \"搜索并分析信息\",     # 描述(帮助主代理决定何时调用)\n        \"system_prompt\": \"你是一个专业研究员...\",  # 系统提示词\n        \"tools\": [internet_search],         # 可用工具\n        \"model\": \"claude-sonnet-4-5-20250929\",  # 可选: 指定不同模型\n    },\n]\n\nagent = create_deep_agent(\n    system_prompt=\"你是一个协调员，使用子代理完成任务\",\n    subagents=subagents\n)\n```", "subs": []}, {"title": "7.3 最佳实践", "content": "| 实践 | 说明 |\n| --- | --- |\n| **写详细的 system_prompt** | 明确告诉子代理输入格式、执行步骤和输出格式 |\n| **最小化工具集** | 只给子代理需要的工具，提升专注度和安全性 |\n| **按任务选模型** | 长文档用大上下文模型，数值分析用擅长推理的模型 |\n| **要求简洁返回** | 指示子代理返回摘要而非原始数据，控制在 300-500 词以内 |\n\n**示例 - 精简的返回指令**:\n\n```python\ndata_analyst = {\n    \"system_prompt\": \"\"\"分析数据后返回:\n    1. 关键洞察 (3-5 个要点)\n    2. 整体置信度评分\n    3. 建议的后续行动\n\n    不要包含: 原始数据、中间计算、详细工具输出\n    保持回复在 300 词以内。\"\"\"\n}\n```", "subs": []}, {"title": "7.4 常见模式: 多专业子代理协作", "content": "```python\nsubagents = [\n    {\n        \"name\": \"data-collector\",\n        \"description\": \"从各种来源收集原始数据\",\n        \"tools\": [web_search, api_call, database_query],\n    },\n    {\n        \"name\": \"data-analyzer\",\n        \"description\": \"分析收集的数据，提取洞察\",\n        \"tools\": [statistical_analysis],\n    },\n    {\n        \"name\": \"report-writer\",\n        \"description\": \"将分析结果撰写为专业报告\",\n        \"tools\": [format_document],\n    },\n]\n```\n\n**协作流程**:\n\n```mermaid\ngraph LR\n    M[主代理: 制定计划] --> A[\"data-collector<br/>收集数据\"]\n    A --> B[\"data-analyzer<br/>分析数据\"]\n    B --> C[\"report-writer<br/>撰写报告\"]\n    C --> M\n```\n\n每个子代理在干净的上下文中专注于自己的任务。", "subs": []}, {"title": "7.5 上下文管理", "content": "#### 上下文自动传播\n\n父代理的运行时 `config`(包含 `context`) 会**自动传播**到所有子代理:\n\n```python\nagent = create_deep_agent(\n    subagents=[research_subagent],\n    context_schema={\"user_id\": str, \"session_id\": str},\n)\n\n# context 会自动流转到子代理及其工具中\nresult = await agent.invoke(\n    {\"messages\": [HumanMessage(\"查找我的最近活动\")]},\n    {\"context\": {\"user_id\": \"user-123\", \"session_id\": \"abc\"}},\n)\n```\n\n#### 按子代理传递专属配置\n\n使用**命名空间前缀**为特定子代理传递配置:\n\n```python\nresult = await agent.invoke(\n    {\"messages\": [HumanMessage(\"研究并验证\")]},\n    {\"context\": {\n        \"user_id\": \"user-123\",               # 所有代理共享\n        \"researcher:max_depth\": 3,            # 仅 researcher 使用\n        \"fact-checker:strict_mode\": True,     # 仅 fact-checker 使用\n    }},\n)\n```\n\n#### 识别调用来源\n\n当同一个工具被多个子代理共享时，通过 `lc_agent_name` 元数据识别是哪个代理发起的调用:\n\n```python\n@tool\ndef shared_lookup(query: str, config) -> str:\n    agent_name = config.get(\"metadata\", {}).get(\"lc_agent_name\")\n    if agent_name == \"fact-checker\":\n        return strict_lookup(query)\n    return general_lookup(query)\n```", "subs": ["上下文自动传播", "按子代理传递专属配置", "识别调用来源"]}, {"title": "7.6 故障排查", "content": "| 问题 | 原因 | 解决方案 |\n| --- | --- | --- |\n| **子代理未被调用** | 描述不够具体 | 写更详细的 `description`，并在主代理 system_prompt 中明确指示\"对复杂任务使用 task() 工具委派\" |\n| **上下文仍然膨胀** | 子代理返回太多数据 | 在 system_prompt 中限制返回字数(如 500 词)，大数据先存文件系统再返回摘要 |\n| **选错了子代理** | 多个子代理描述相似 | 在 description 中明确区分适用场景，如\"简单查询用 quick-researcher，深度报告用 deep-researcher\" |\n\n---", "subs": []}]}, {"title": "8. 人机协作 (Human-in-the-loop)", "sections": [{"title": "8.1 基础配置与执行恢复", "content": "深度代理装具 (Harness) 可以在指定的工具调用前暂停执行，等待人类的批准或修改。此功能通过 `interrupt_on` 参数选择性启用，并在需要防范破坏性操作或产生费用的 API 调用前提供安全保障。\n\n> **⚠️ 核心前置条件**: 必须配置**检查点 (Checkpointer)** 才能使用 HITL，因为它需要在暂停和恢复之间持久化 Agent 状态。\n\n\n#### 配置中断\n\n通过向 `create_deep_agent` 传入 `interrupt_on` 字典来定义哪些工具需要审批:\n\n```python\nfrom langgraph.checkpoint.memory import MemorySaver\n\nagent = create_deep_agent(\n    tools=[delete_file, read_file],\n    interrupt_on={\n        \"delete_file\": True,  # 默认允许: approve(批准), edit(编辑), reject(拒绝)\n        \"read_file\": False,   # 不中断\n    },\n    checkpointer=MemorySaver() # 必填项！\n)\n```\n\n#### 处理中断并恢复\n\n当 Agent 调用受保护的工具时，`invoke()` 返回的结果中将带有 `__interrupt__` 数据。你需要提供决策并通过 `Command(resume=...)` 恢复执行:\n\n```python\nfrom langgraph.types import Command\nimport uuid\n\nconfig = {\"configurable\": {\"thread_id\": str(uuid.uuid4())}}\nresult = agent.invoke({\"messages\": [{\"role\": \"user\", \"content\": \"Delete config.json\"}]}, config)\n\nif result.get(\"__interrupt__\"):\n    # 提取中断请求\n    interrupts = result[\"__interrupt__\"][0].value\n    action = interrupts[\"action_requests\"][0]\n    \n    print(f\"工具: {action['name']}, 参数: {action['args']}\")\n\n    # 构造决策 (此处选择批准)\n    decisions = [{\"type\": \"approve\"}] \n\n    # 携带决策恢复执行 (必须使用完全相同的 config)\n    result = agent.invoke(\n        Command(resume={\"decisions\": decisions}), \n        config=config\n    )\n```", "subs": ["配置中断", "处理中断并恢复"]}, {"title": "8.2 高级审批场景", "content": "#### 场景 1: 多工具并发调用 (Batching)\n\n如果 Agent 同时调用了多个需要审批的工具，它们会被分批在**一次**中断中返回。你必须严格**按照请求的顺序**为每个工具提供决策:\n\n```python\n# 假设 action_requests 长度为 2 (例如先 delete_file 再 send_email)\ndecisions = [\n    {\"type\": \"approve\"}, # 对应第一个工具 delete_file\n    {\"type\": \"reject\"}   # 对应第二个工具 send_email\n]\n```\n\n#### 场景 2: 编辑工具参数 (Edit)\n\n当允许的决策中包含 `\"edit\"` 时，你可以在人类审查环节直接修改参数，而不必让模型重试:\n\n```python\n# 假设拦截到了发邮件的操作，人类决定修改收件人\ndecisions = [{\n    \"type\": \"edit\",\n    \"edited_action\": {\n        \"name\": action_request[\"name\"], # 必须包含工具名\n        \"args\": {\"to\": \"team@company.com\", \"subject\": \"修正后的主题\"}\n    }\n}]\n```", "subs": ["场景 1: 多工具并发调用 (Batching)", "场景 2: 编辑工具参数 (Edit)"]}, {"title": "8.3 子代理中的中断机制 (Subagent Interrupts)", "content": "#### 覆盖主代理设置\n\n子代理可以拥有自己独立的 `interrupt_on` 配置，从而覆盖主代理的设置:\n\n```python\nsubagents=[{\n    \"name\": \"file-manager\",\n    \"tools\": [delete_file, read_file],\n    \"interrupt_on\": {\n        \"delete_file\": True,\n        \"read_file\": True, # 虽然主代理配了 False，但在该子代理中会被中断\n    }\n}]\n```\n\n当子代理触发中断时，主流程的捕获和恢复逻辑与上述基础用法完全相同。\n\n#### 工具内部主动中断\n\n子代理的自定义工具可以直接调用 LangGraph 的 `interrupt()` 原语主动暂停并请求确认:\n\n```python\nfrom langgraph.types import interrupt\n\n@tool\ndef request_approval(action_description: str) -> str:\n    \"\"\"内部主动发起审批请求\"\"\"\n    approval = interrupt({\n        \"type\": \"approval_request\",\n        \"action\": action_description\n    })\n    \n    if approval.get(\"approved\"):\n        return \"动作已批准，继续...\"\n    return \"动作被拒绝\"\n\n# 恢复时传入对应格式的数据结构\nagent.invoke(Command(resume={\"approved\": True}), config=config)\n```", "subs": ["覆盖主代理设置", "工具内部主动中断"]}, {"title": "8.4 最佳实践总结", "content": "1. **必须使用 Checkpointer**: 内存持久化是 HITL 工作的前提。\n2. **保持 Thread ID 一致**: `invoke(Command)` 恢复执行时传入的 `config` 必须与中断前完全一致。\n3. **决策顺序保持一致**: `decisions` 列表的顺序必须与 `action_requests` 中请求的工具顺序严格对应。\n4. **按风险等级定制权限**:\n\n| 风险等级 | 工具示例 | 配置建议 |\n| --- | --- | --- |\n| **高风险** | 删除文件、发邮件 | `{\"allowed_decisions\": [\"approve\", \"edit\", \"reject\"]}` (完全控制) |\n| **中风险** | 写入新文件 | `{\"allowed_decisions\": [\"approve\", \"reject\"]}` (禁止编辑参数) |\n| **低风险** | 读取、列表 | `False` (不中断) |\n\n---", "subs": []}]}, {"title": "9. 长期记忆 (Long-term Memory)", "sections": [{"title": "9.1 双文件系统架构", "content": "长期记忆使 Deep Agent 能够在不同线程和对话之间持久化信息。这是通过 `CompositeBackend` 将特定路径路由到持久化的 `StoreBackend` 来实现的。\n\n\n使用 `CompositeBackend` 时，Agent 同时维护两套文件系统:\n\n```mermaid\ngraph TD\n    A[Agent 文件操作] --> R{路径路由}\n    R -->|\"/memories/\" 前缀| P[\"持久文件系统 (StoreBackend)\"]\n    R -->|其他路径| T[\"临时文件系统 (StateBackend)\"]\n\n    P -->|存储位置| PS[LangGraph Store]\n    P -->|生命周期| PL[跨线程跨会话永久保存]\n    P -->|示例| PE[\"/memories/preferences.txt\"]\n\n    T -->|存储位置| TS[Agent 状态]\n    T -->|生命周期| TL[仅单线程内有效]\n    T -->|示例| TE[\"/draft.txt, /workspace/plan.md\"]\n```\n\n| 文件系统 | 后端 | 生命周期 | 路径示例 |\n| --- | --- | --- | --- |\n| **临时 (短期)** | `StateBackend` | 线程结束即消失 | `/notes.txt`, `/workspace/draft.md` |\n| **持久 (长期)** | `StoreBackend` | 跨线程、跨重启永久保存 | `/memories/preferences.txt` |\n\n> **路径路由细节**: `CompositeBackend` 在存储时会剥离路由前缀。例如 `/memories/preferences.txt` 在 `StoreBackend` 中实际存储为 `/preferences.txt`，但 Agent 始终使用完整路径。", "subs": []}, {"title": "9.2 配置方式", "content": "```python\nfrom langgraph.checkpoint.memory import MemorySaver\nfrom langgraph.store.memory import InMemoryStore\nfrom deepagents import create_deep_agent\nfrom deepagents.backends import CompositeBackend, StateBackend, StoreBackend\n\ncheckpointer = MemorySaver()\n\ndef make_backend(runtime):\n    return CompositeBackend(\n        default=StateBackend(runtime),           # 临时文件\n        routes={\"/memories/\": StoreBackend(runtime)}  # 持久记忆\n    )\n\nagent = create_deep_agent(\n    store=InMemoryStore(),  # 开发用; 部署到 LangSmith 时可省略\n    backend=make_backend,\n    checkpointer=checkpointer\n)\n```", "subs": []}, {"title": "9.3 跨线程持久化", "content": "`/memories/` 路径下的文件可以被任何线程访问:\n\n```python\nimport uuid\n\n# 线程 1: 保存偏好\nconfig1 = {\"configurable\": {\"thread_id\": str(uuid.uuid4())}}\nagent.invoke({\n    \"messages\": [{\"role\": \"user\", \"content\": \"Save my preferences to /memories/preferences.txt\"}]\n}, config=config1)\n\n# 线程 2 (全新对话): 读取偏好\nconfig2 = {\"configurable\": {\"thread_id\": str(uuid.uuid4())}}\nagent.invoke({\n    \"messages\": [{\"role\": \"user\", \"content\": \"What are my preferences?\"}]\n}, config=config2)\n# Agent 可以从线程1写入的 /memories/preferences.txt 中读取\n```", "subs": []}, {"title": "9.4 典型用例", "content": "| 用例 | 说明 | 记忆路径示例 |\n| --- | --- | --- |\n| **用户偏好** | 跨会话记住用户的配置和偏好 | `/memories/user_preferences.txt` |\n| **自改进指令** | Agent 根据反馈更新自己的行为指南 | `/memories/instructions.txt` |\n| **知识库** | 多次对话中积累项目知识 | `/memories/project_notes.txt` |\n| **研究项目** | 跨会话维护研究进度 | `/memories/research/sources.txt`、`notes.txt`、`report.md` |\n\n**自改进示例**:\n\n```python\nagent = create_deep_agent(\n    store=InMemoryStore(),\n    backend=lambda rt: CompositeBackend(\n        default=StateBackend(rt),\n        routes={\"/memories/\": StoreBackend(rt)}\n    ),\n    system_prompt=\"\"\"你有一个文件 /memories/instructions.txt 包含额外指令。\n    每次对话开始时读取它。\n    当用户说\"请总是做 X\"或\"我更喜欢 Y\"时，用 edit_file 更新该文件。\"\"\"\n)\n```", "subs": []}, {"title": "9.5 Store 实现选择", "content": "| 环境 | Store | 特点 |\n| --- | --- | --- |\n| **开发/测试** | `InMemoryStore` | 快速迭代，重启后数据丢失 |\n| **生产** | `PostgresStore` | 持久化到数据库，推荐用于生产环境 |\n| **LangSmith 部署** | 平台自动提供 | 省略 `store` 参数即可 |\n\n**生产环境配置 (PostgresStore)**:\n\n```python\nfrom langgraph.store.postgres import PostgresStore\nimport os\n\nstore_ctx = PostgresStore.from_conn_string(os.environ[\"DATABASE_URL\"])\nstore = store_ctx.__enter__()\nstore.setup()\n\nagent = create_deep_agent(\n    store=store,\n    backend=lambda rt: CompositeBackend(\n        default=StateBackend(rt),\n        routes={\"/memories/\": StoreBackend(rt)}\n    )\n)\n```", "subs": []}, {"title": "9.6 FileData 数据格式", "content": "通过 `StoreBackend` 存储的文件遵循以下 Schema:\n\n```python\n{\n    \"content\": [\"line 1\", \"line 2\"],       # 按行分割的字符串列表\n    \"created_at\": \"2024-01-15T10:30:00Z\",  # ISO 8601 创建时间\n    \"modified_at\": \"2024-01-15T11:45:00Z\"  # ISO 8601 修改时间\n}\n```\n\n可使用 `create_file_data` 辅助函数:\n\n```python\nfrom deepagents.backends.utils import create_file_data\nfile_data = create_file_data(\"Hello\\nWorld\")\n# {'content': ['Hello', 'World'], 'created_at': '...', 'modified_at': '...'}\n```", "subs": []}, {"title": "9.7 最佳实践", "content": "1. **用描述性路径组织文件**: 如 `/memories/research/topic_a/sources.txt`\n2. **在系统提示词中说明记忆结构**: 告诉 Agent 每个路径存储什么内容\n3. **定期清理旧数据**: 实施过期清理，保持存储可管理\n4. **按环境选择 Store**: 开发用 `InMemoryStore`，生产用 `PostgresStore`，多租户考虑 `assistant_id` 命名空间隔离\n\n---", "subs": []}]}, {"title": "10. 技能 (Skills)", "sections": [{"title": "10.1 技能结构", "content": "技能 (Skills) 是 Deep Agent 的**渐进式披露** (Progressive Disclosure) 能力系统。不同于始终加载的系统提示词，技能只在 Agent 判断其与当前任务相关时才被加载，从而大幅减少 Token 消耗。\n\n\n每个技能是一个包含 `SKILL.md` 文件的目录:\n\n```\n/skills/\n├── langgraph-docs/\n│   └── SKILL.md          # 必须: 指令和元数据\n│   ├── scripts/          # 可选: 辅助脚本\n│   └── templates/        # 可选: 模板文件\n├── web-search/\n│   └── SKILL.md\n└── ...\n```", "subs": []}, {"title": "10.2 SKILL.md 格式规范", "content": "每个 `SKILL.md` 文件包含 YAML 前置元数据 (frontmatter) 和 Markdown 正文:\n\n```markdown\n---\nname: langgraph-docs\ndescription: 用于获取 LangGraph 相关文档以提供准确指导\nlicense: MIT\ncompatibility: 需要互联网访问\nmetadata:\n  author: langchain\n  version: \"1.0\"\nallowed-tools: fetch_url\n---\n\n# langgraph-docs\n\n## Overview\n说明这个技能做什么...\n\n## Instructions\n### 1. 获取文档索引\n使用 fetch_url 工具读取 https://docs.langchain.com/llms.txt\n\n### 2. 选择相关文档\n根据问题选择 2-4 个最相关的 URL...\n\n### 3. 提供指导\n阅读文档后完成用户请求。\n```\n\n**前置元数据字段**:\n\n| 字段 | 必选 | 说明 |\n| --- | --- | --- |\n| `name` | ✅ | 技能的唯一名称 |\n| `description` | ✅ | 技能功能描述 (Agent通过此决定是否加载) |\n| `license` | ❌ | 许可证 |\n| `compatibility` | ❌ | 兼容性要求 |\n| `metadata` | ❌ | 额外元数据 (作者、版本等) |\n| `allowed-tools` | ❌ | 此技能允许使用的工具 |\n\n> **注意**: SKILL.md 文件必须小于 10 MB。", "subs": []}, {"title": "10.3 渐进披露工作流程", "content": "```mermaid\ngraph TD\n    A[用户发送请求] --> B[Agent 检查技能列表]\n    B -->|仅读取 description| C{是否有匹配的技能?}\n    C -->|是| D[\"读取完整 SKILL.md<br/>(read_file)\"]\n    D --> E[按指令执行任务]\n    E --> F[访问辅助文件如需要]\n    C -->|否| G[使用常规工具处理]\n```\n\n**三步流程**:\n\n1. **匹配 (Match)**: 当用户请求到达时，Agent 检查所有技能的 `description` 是否与任务匹配\n2. **读取 (Read)**: 如果技能适用，Agent 读取完整的 `SKILL.md` 文件\n3. **执行 (Execute)**: Agent 按照技能指令执行，并按需访问辅助文件", "subs": []}, {"title": "10.4 配置方式 (按后端)", "content": "#### StateBackend (默认)\n\n将技能文件通过 `invoke()` 的 `files` 参数注入:\n\n```python\nfrom deepagents import create_deep_agent\nfrom deepagents.backends.utils import create_file_data\n\nskills_files = {\n    \"/skills/langgraph-docs/SKILL.md\": create_file_data(skill_content)\n}\n\nagent = create_deep_agent(skills=[\"./skills/\"])\n\nresult = agent.invoke(\n    {\"messages\": [...], \"files\": skills_files},  # 注入技能文件\n    config={\"configurable\": {\"thread_id\": \"12345\"}},\n)\n```\n\n#### StoreBackend (持久化)\n\n将技能文件预存到 Store 中:\n\n```python\nfrom deepagents.backends import StoreBackend\nfrom langgraph.store.memory import InMemoryStore\n\nstore = InMemoryStore()\nstore.put(\n    namespace=(\"filesystem\",),\n    key=\"/skills/langgraph-docs/SKILL.md\",\n    value=create_file_data(skill_content)\n)\n\nagent = create_deep_agent(\n    backend=(lambda rt: StoreBackend(rt)),\n    store=store,\n    skills=[\"/skills/\"]\n)\n```\n\n#### FilesystemBackend (本地磁盘)\n\n直接从磁盘加载:\n\n```python\nfrom deepagents.backends.filesystem import FilesystemBackend\n\nagent = create_deep_agent(\n    backend=FilesystemBackend(root_dir=\"/Users/user/project\"),\n    skills=[\"/Users/user/project/skills/\"],\n)\n```", "subs": ["StateBackend (默认)", "StoreBackend (持久化)", "FilesystemBackend (本地磁盘)"]}, {"title": "10.5 技能优先级与子代理继承", "content": "#### 同名技能优先级\n\n当多个技能源包含同名技能时，`skills` 列表中**靠后的优先** (last wins):\n\n```python\n# 如果两个源都包含 \"web-search\" 技能, /skills/project/ 胜出\nagent = create_deep_agent(\n    skills=[\"/skills/user/\", \"/skills/project/\"],\n)\n```\n\n#### 子代理继承规则\n\n| 子代理类型 | 继承行为 |\n| --- | --- |\n| **通用子代理** | 自动继承主代理的技能，无需额外配置 |\n| **自定义子代理** | **不继承**主代理技能，需独立配置 `skills` 参数 |\n\n```python\nresearch_subagent = {\n    \"name\": \"researcher\",\n    \"tools\": [web_search],\n    \"skills\": [\"/skills/research/\"],  # 子代理专属技能\n}\n\nagent = create_deep_agent(\n    skills=[\"/skills/main/\"],       # 主代理 + 通用子代理的技能\n    subagents=[research_subagent],  # researcher 只有自己的技能\n)\n```", "subs": ["同名技能优先级", "子代理继承规则"]}, {"title": "10.6 Skills vs Memory 对比", "content": "| 维度 | Skills (技能) | Memory (记忆) |\n| --- | --- | --- |\n| **目的** | 按需发现的任务特定能力 | 始终加载的持久上下文 |\n| **加载时机** | 仅当 Agent 判定相关时 | 每次启动时注入系统提示词 |\n| **文件格式** | `SKILL.md` (放在命名目录中) | `AGENTS.md` 文件 |\n| **覆盖策略** | 用户 → 项目 (后者优先) | 用户 → 项目 (合并) |\n| **适用场景** | 任务特定、可能很大的指令 | 始终相关的项目规范和偏好 |", "subs": []}, {"title": "10.7 何时选择 Skills vs Tools", "content": "- **用 Skills**: 需要大量上下文 (减少系统提示词 Token)，或需要将多个能力打包成更大的作业流程\n- **用 Tools**: Agent 没有文件系统访问权限时，或功能简单到一个函数即可表达\n\n---", "subs": ["用 Skills", "用 Tools"]}]}, {"title": "11. 沙箱 (Sandboxes)", "sections": [{"title": "11.1 支持的沙箱供应商", "content": "沙箱是专门的后端，在**完全隔离**的环境中运行 Agent 代码。沙箱拥有自己的文件系统和 `execute` 工具，允许 Agent 安装依赖、运行脚本和执行代码，同时不会影响你的本地机器。\n\n\n| 供应商 | 安装包 | 创建沙箱 | 关闭方法 |\n| --- | --- | --- | --- |\n| **Modal** | `langchain-modal` | `modal.Sandbox.create(app=app)` | `sandbox.terminate()` |\n| **Runloop** | `langchain-runloop` | `client.devbox.create()` | `devbox.shutdown()` |\n| **Daytona** | `langchain-daytona` | `Daytona().create()` | `sandbox.stop()` |", "subs": []}, {"title": "11.2 基本用法", "content": "```python\nimport modal\nfrom langchain_anthropic import ChatAnthropic\nfrom deepagents import create_deep_agent\nfrom langchain_modal import ModalSandbox\n\n# 1. 创建沙箱\napp = modal.App.lookup(\"your-app\")\nmodal_sandbox = modal.Sandbox.create(app=app)\nbackend = ModalSandbox(sandbox=modal_sandbox)\n\n# 2. 创建带沙箱的 Agent\nagent = create_deep_agent(\n    model=ChatAnthropic(model=\"claude-sonnet-4-20250514\"),\n    system_prompt=\"你是一个 Python 编码助手，拥有沙箱访问权限。\",\n    backend=backend,\n)\n\n# 3. 使用并关闭\ntry:\n    result = agent.invoke(\n        {\"messages\": [{\"role\": \"user\", \"content\": \"创建一个 Python 包并运行 pytest\"}]}\n    )\nfinally:\n    modal_sandbox.terminate()  # 务必关闭以释放资源\n```", "subs": []}, {"title": "11.3 文件传输", "content": "沙箱提供 `upload_files()` 和 `download_files()` 方法在宿主机和沙箱之间传输文件:\n\n```mermaid\ngraph LR\n    H[宿主机] -->|\"upload_files()\"| S[沙箱环境]\n    S -->|\"download_files()\"| H\n    S -.->|Agent 内部使用| T[\"read_file / write_file\"]\n```\n\n#### 上传文件 (Seeding)\n\n```python\nbackend.upload_files([\n    (\"/src/index.py\", b\"print('Hello')\\n\"),\n    (\"/pyproject.toml\", b\"[project]\\nname = 'my-app'\\n\"),\n])\n```\n\n#### 下载文件 (Retrieving)\n\n```python\nresults = backend.download_files([\"/src/index.py\", \"/output.txt\"])\nfor result in results:\n    if result.content is not None:\n        print(f\"{result.path}: {result.content.decode()}\")\n    else:\n        print(f\"下载失败 {result.path}: {result.error}\")\n```\n\n> **注意**: `upload_files` 和 `download_files` 是给你的**应用代码**用的，Agent 在沙箱**内部**使用的是 `read_file`、`write_file` 等文件系统工具。", "subs": ["上传文件 (Seeding)", "下载文件 (Retrieving)"]}, {"title": "11.4 生命周期管理", "content": "> **⚠️ 沙箱消耗资源并产生费用**，必须在不再需要时及时关闭。\n\n#### 基本生命周期\n\n```python\n# 创建 → 使用 → 关闭\nbackend = ModalSandbox(sandbox=modal_sandbox)\nresult = backend.execute(\"echo hello\")\n# ... 使用沙箱\nmodal_sandbox.terminate()  # 释放资源\n```\n\n#### 聊天应用的按会话管理\n\n每个 `thread_id` 应使用独立的沙箱。推荐使用 **get-or-create** 模式:\n\n```python\n# 通过 thread_id 查找或创建沙箱 (以 Daytona 为例)\ntry:\n    sandbox = client.find_one(labels={\"thread_id\": thread_id})\nexcept Exception:\n    params = CreateSandboxFromSnapshotParams(\n        labels={\"thread_id\": thread_id},\n        auto_delete_interval=3600,  # 空闲1小时后自动清理\n    )\n    sandbox = client.create(params)\n\nbackend = DaytonaSandbox(sandbox=sandbox)\nagent = create_deep_agent(backend=backend)\n```\n\n> **TTL 策略**: 对于用户可能长时间不活跃的聊天应用，配置沙箱的 TTL (time-to-live)，让供应商自动清理空闲沙箱。", "subs": ["基本生命周期", "聊天应用的按会话管理"]}, {"title": "11.5 安全注意事项", "content": "沙箱隔离了代码执行，但**无法防御上下文注入攻击**。攻击者控制 Agent 输入后，可以指示 Agent 读取文件、执行命令或从沙箱中窃取数据。\n\n#### 🚨 绝对不要把密钥放进沙箱\n\nAPI Key、Token、数据库凭证等通过环境变量或挂载文件注入的密钥**都可以被上下文注入攻击读取和窃取**。\n\n#### 安全处理密钥的方式\n\n| 方式 | 说明 | 推荐度 |\n| --- | --- | --- |\n| **密钥放在沙箱外的工具中** | 在宿主环境定义处理认证的工具，Agent 调用工具但看不到凭证 | ✅ 推荐 |\n| **网络代理注入凭证** | 沙箱的 HTTP 请求经代理自动注入认证头 | ⚠️ 供应商支持有限 |\n| **直接注入沙箱** | 万不得已时，必须开启全工具 HITL + 限制网络 + 最小权限 + 最短有效期 | ❌ 不推荐 |\n\n#### 通用最佳实践\n\n- 不需要网络时**阻断沙箱网络访问**\n- 使用中间件**过滤或脱敏**工具输出中的敏感模式\n- **审查沙箱输出**后再在应用中使用\n- 将沙箱产生的一切内容视为**不受信任的输入**\n\n---", "subs": ["🚨 绝对不要把密钥放进沙箱", "安全处理密钥的方式", "通用最佳实践"]}]}, {"title": "12. 流式处理概览 (Streaming Overview)", "sections": [{"title": "12.1 基础流式输出", "content": "Deep Agents 构建在 LangGraph 之上，继承了其强大的流式处理能力。与普通大模型不同，Agent 的流式输出不仅包含文本 token，还包括内部思考、工具调用、进度更新和子代理产生的复杂事件。\n\n\n最常用的方法是使用 `stream_mode=\"messages\"` 并在主循环中处理。\n\n```python\nfor chunk in agent.stream(\n    {\"messages\": [{\"role\": \"user\", \"content\": \"帮我写个脚本\"}]},\n    stream_mode=\"messages\"\n):\n    token, metadata = chunk\n    if token.content:\n        print(token.content, end=\"\", flush=True)\n```", "subs": []}, {"title": "12.2 识别子代理流 (Subagent Streaming)", "content": "当使用子代理时，必须开启 `subgraphs=True` 才能获取子代理内部的流式事件。\n每个 yield 会返回一个 `(namespace, chunk)` 元组，你可以通过 `namespace` 区分事件来源:\n\n```python\n# 判断是否来自子代理: namespace 包含 \"tools:\"\nis_subagent = any(s.startswith(\"tools:\") for s in namespace)\nsource = next((s for s in namespace if s.startswith(\"tools:\")), \"main\") if is_subagent else \"main\"\n\nprint(f\"\\n[{source} 发言]: {chunk_content}\")\n```", "subs": []}, {"title": "12.3 监控工具调用 (Tool Calls)", "content": "可以从 `messages` 流中实时读取工具的调用和参数:\n\n```python\nfor namespace, chunk in agent.stream(inputs, stream_mode=\"messages\", subgraphs=True):\n    token, metadata = chunk\n    is_subagent = any(s.startswith(\"tools:\") for s in namespace)\n    source = \"subagent\" if is_subagent else \"main\"\n\n    # 工具调用事件 (动态输出参数)\n    if token.tool_call_chunks:\n        for tc in token.tool_call_chunks:\n            if tc.get(\"name\"): print(f\"\\n[{source}] 调用工具: {tc['name']}\")\n            if tc.get(\"args\"): print(tc[\"args\"], end=\"\", flush=True)\n\n    # 工具执行结果\n    if token.type == \"tool\":\n        print(f\"\\n[{source}] 工具结果: {str(token.content)[:100]}\")\n```", "subs": []}, {"title": "12.4 自定义进度事件 (Custom Updates)", "content": "在耗时较长的自定义工具内部，可以使用 `get_stream_writer` 抛出结构化的进度更新:\n\n```python\nimport time\nfrom langchain.tools import tool\nfrom langgraph.config import get_stream_writer\n\n@tool\ndef analyze_data(topic: str) -> str:\n    writer = get_stream_writer()\n    \n    writer({\"status\": \"starting\", \"topic\": topic, \"progress\": 0})\n    time.sleep(0.5)\n    writer({\"status\": \"analyzing\", \"progress\": 50})\n    \n    return \"Analysis complete.\"\n\n# 消费端使用 \"custom\" 模式捕获\nfor namespace, chunk in agent.stream(inputs, stream_mode=\"custom\", subgraphs=True):\n    print(\"进度:\", chunk) # [{'status': 'starting'...}, {'status': 'analyzing'...}]\n```", "subs": []}, {"title": "12.5 多流模式组合", "content": "通常你需要组合不同的流模式来获取完整的执行视图。常用的组合 `stream_mode=[\"updates\", \"messages\", \"custom\"]`:\n\n| 模式 | 作用 | 常见用途 |\n| --- | --- | --- |\n| `updates` | 跟踪节点状态变化 | 了解 Agent 运行到哪一步 (如 `model_request` -> `tools` -> 结束) |\n| `messages` | 文本和工具增量流 | 打字机效果呈现对话和思考过程 |\n| `custom` | 自定义写入事件 | 接收特定工具抛出的业务进度或结构化数据 |", "subs": []}, {"title": "12.6 追踪子代理生命周期模式", "content": "通过监听 `updates` 流，你可以完整跟踪子代理的生命周期 (Pending -> Running -> Complete):\n\n1. **Pending**: 主代理的 `model_request` 节点输出了调用 `task` 工具的消息\n2. **Running**: 收到首个 `namespace` 以 `tools:` 开头的事件\n3. **Complete**: 主代理的 `tools` 节点输出了 `type=\"tool\"` 的结果消息\n\n这种模式非常适合在前端 UI 中渲染复杂的\"任务树\"和进度动画。\n\n---", "subs": []}]}, {"title": "13. 前端界面 (Frontend)", "sections": [{"title": "13.1 过滤子代理消息", "content": "要在前端构建 Deep Agent 的用户界面，推荐使用 `@langchain/langgraph-sdk/react` 提供的 `useStream` Hook。它原生支持复杂 Agent 事件、子代理流式输出和多线程管理。\n\n\n默认情况下，子代理在各自上下文中生成的消息会混入主对话流中，这会让聊天界面显得混乱。\n**配置 `filterSubagentMessages: true`** 可以将子代理消息从主消息列表中剔除，并将它们归集到 `stream.subagents` Map 中，以便你在侧边栏或进度面板中独立渲染。\n\n```tsx\nimport { useStream } from \"@langchain/langgraph-sdk/react\";\nimport type { agent } from \"./agent\"; // 导入后端的代理类型\n\nfunction DeepAgentChat() {\n  const stream = useStream<typeof agent>({\n    assistantId: \"deep-agent\",\n    apiUrl: \"http://localhost:2024\",\n    filterSubagentMessages: true, // 关键配置：隔离子代理消息\n  });\n\n  return (\n    <div className=\"flex gap-4\">\n      {/* 主对话区: 只显示用户和主代理的消息 */}\n      <div className=\"flex-1\">\n        {stream.messages.map((m) => (\n          <div key={m.id}>{m.content}</div>\n        ))}\n      </div>\n\n      {/* 侧边栏/进度分析区: 独立渲染子代理的工作状态 */}\n      <div className=\"w-80 border-l p-4\">\n        {[...stream.subagents.values()].map((subagent) => (\n          <SubagentCard key={subagent.id} subagent={subagent} />\n        ))}\n      </div>\n    </div>\n  );\n}\n```", "subs": []}, {"title": "13.2 渲染子代理进度卡片", "content": "`stream.subagents` 提供了每个子代理的丰富状态信息 (Pending / Running / Complete / Error)，可以用来构建进度卡片 UI:\n\n```tsx\nfunction SubagentCard({ subagent }: { subagent: SubagentStream }) {\n  return (\n    <div className=\"border rounded-lg p-4 mb-4\">\n      <div className=\"flex items-center gap-2 mb-2\">\n        <StatusIcon status={subagent.status} />\n        {/* subagent_type 来自主代理调用 task() 时的参数 */}\n        <span className=\"font-medium text-sm\">\n          {subagent.toolCall.subagent_type}\n        </span>\n      </div>\n      \n      {/* Pending / Running 状态的进度展示 */}\n      {(subagent.status === \"pending\" || subagent.status === \"running\") && (\n        <div className=\"text-sm text-gray-500 animate-pulse\">\n            Processing task...\n        </div>\n      )}\n\n      {/* 实时流式输出子代理的思考过程 */}\n      {subagent.status === \"running\" && subagent.messages.length > 0 && (\n        <div className=\"mt-2 text-xs text-gray-600 prose border-l-2 pl-2\">\n            {getStreamingContent(subagent.messages)}\n        </div>\n      )}\n\n      {/* 成功结果展示 */}\n      {subagent.status === \"complete\" && subagent.result && (\n        <div className=\"mt-2 p-2 bg-green-50 rounded text-sm\">\n            {subagent.result}\n        </div>\n      )}\n\n      {/* 错误展示 */}\n      {subagent.status === \"error\" && subagent.error && (\n        <div className=\"mt-2 p-2 bg-red-50 rounded text-sm text-red-700\">\n            {subagent.error}\n        </div>\n      )}\n    </div>\n  );\n}\n```", "subs": []}, {"title": "13.3 映射: 找到触发子代理的用户消息", "content": "为了在 UI 上将\"正在工作的子代理\"挂载到触发它的\"用户提问\"下方，你可以使用 `stream.getSubagentsByMessage(messageId)` API:\n\n```tsx\n// 遍历主信息流，找到每条 HumanMessage 后紧跟的 AI 节点 ID\nconst subagents = stream.getSubagentsByMessage(nextAiMessage.id);\n\n// 在 UI 中渲染: \n// 1. User Message\n// 2. SubagentPipeline 组件 (包含该消息触发的所有子代理进度)\n// 3. AI Reply\n```", "subs": []}, {"title": "13.4 渲染子代理内嵌的工具调用", "content": "当子代理自己也在调用工具 (如搜索网络、读取文件) 时，可以通过 `subagent.toolCalls` 数组实时展示其底层工作:\n\n```tsx\n{/* 渲染子代理内部的工具调用 */}\n{subagent.toolCalls.map((tc) => (\n  <div key={tc.call.id} className=\"mb-2 p-2 bg-gray-50 rounded text-sm\">\n    <div className=\"flex items-center gap-2\">\n      <span className=\"font-mono text-xs\">{tc.call.name}</span>\n      {tc.result !== undefined ? (\n        <span className=\"text-green-600\">完毕</span>\n      ) : (\n        <span className=\"text-yellow-600 animate-pulse\">执行中...</span>\n      )}\n    </div>\n    <pre className=\"text-xs text-gray-600\">{JSON.stringify(tc.call.args)}</pre>\n  </div>\n))}\n```", "subs": []}, {"title": "13.5 会话持久化 (Thread Persistence)", "content": "通过 URL 参数保存并恢复 `threadId`，即使用户刷新页面，也能无缝切回之前的上下文和正在运行的子代理状态:\n\n```tsx\nfunction PersistentDeepAgentChat() {\n  const [threadId, onThreadId] = useThreadIdParam(); // 自定义 hook，读写 URL\n\n  const stream = useStream<typeof agent>({\n    assistantId: \"deep-agent\",\n    apiUrl: \"http://localhost:2024\",\n    threadId,\n    onThreadId,\n    reconnectOnMount: true, // 页面重载时自动恢复数据流 🚀\n  });\n  \n  // ... 渲染组件\n}\n```\n\n当页面重新加载时，`useStream` 会从服务端历史记录中重建子代理状态，将已完成的子代理及其最终结果完整呈现。", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
