<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

<script id="data" type="application/json">{"title": "Python 运维自动化与工程实践 · 第一册：语言基础", "intro": "", "parts": [{"title": "第一章 · 先弄清楚为什么运维工程师仍然要学 Python", "sections": [{"title": "Python 最适合替运维工程师解决哪些问题？", "content": "运维工作里最常见的编程需求，通常不是从零实现数据库或网络协议，而是把已有系统连接起来。\n数据可能来自日志、命令输出、HTTP API、配置文件和监控接口；处理结果则可能写回终端、文件、工单或另一个 API。\nPython 的价值首先体现在这类“胶水工作”上：语法直接、标准库覆盖面广、第三方 SDK 丰富，而且可以很快把一次人工操作变成可重复执行的程序。\n\n不过，“适合自动化”不等于“任何系统都应该用 Python”。\n语言选择要从工作负载、交付方式和维护条件出发，而不是从语言热度出发。\n\n#### 从一条人工操作链开始判断\n\n假设值班人员每天需要完成下面的工作：\n\n1. 登录三台测试主机。\n2. 读取服务状态。\n3. 从日志中统计最近一小时的错误。\n4. 把结果整理成 JSON。\n5. 失败时保留主机、命令和原因。\n\n如果人工流程的输入、判断和输出已经比较稳定，Python 很适合把它变成一个巡检工具。\n最小程序甚至不需要框架：一个入口函数、几个纯函数和标准库就能完成。\n\n```mermaid\nflowchart LR\n    A[人工输入] --> B[解析]\n    B --> C[校验]\n    C --> D[执行动作]\n    D --> E[结构化结果]\n    E --> F[退出码与审计]\n```\n\n这条流水线也是后文反复使用的信任边界：外部文本先解析再校验，副作用只接收可信模型，最后同时交付给人和自动化系统可判断的结果。\n\n```python\nfrom __future__ import annotations\n\nimport json\nfrom dataclasses import asdict, dataclass\n\n\n@dataclass(frozen=True)\nclass CheckResult:\n    target: str\n    ok: bool\n    message: str\n\n\ndef summarize(results: list[CheckResult]) -> str:\n    payload = {\n        \"checked\": len(results),\n        \"failed\": sum(not item.ok for item in results),\n        \"results\": [asdict(item) for item in results],\n    }\n    return json.dumps(payload, ensure_ascii=False, indent=2)\n\n\ndef main() -> int:\n    results = [\n        CheckResult(\"app-01\", True, \"service is active\"),\n        CheckResult(\"app-02\", False, \"health endpoint timed out\"),\n    ]\n    print(summarize(results))\n    return 0 if all(item.ok for item in results) else 2\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n```\n\n第一次读到这段代码，不必先系统学习面向对象。\n把 `class CheckResult` 暂时理解为“给一组字段命名的结果模型”；`@dataclass(...)` 是装饰器，它接收紧随其后的类，并替我们生成初始化、比较和显示等常用方法。\n后文出现的 `@pytest.fixture` 与 `@app.command` 也遵循相同阅读顺序：先看被装饰的函数或类负责什么，再看装饰器额外注册或生成了什么行为。\n装饰器可能改变调用方式，因此陌生装饰器要查其官方接口，不能只凭名字猜测。\n\n这个例子虽小，却已经包含运维工具需要关心的几个边界：\n\n- 输入被转换为明确的数据模型。\n- 汇总逻辑与终端输出分开。\n- 失败不是只打印一句话，而是产生非零退出码。\n- `main()` 返回结果，入口只负责把结果交给操作系统。\n\n运行后除了看 JSON，还要检查退出码：\n\n```bash\npython3 check_demo.py\nstatus=$?\nprintf 'exit_status=%s\\n' \"$status\"\n```\n\n预期输出中 `failed` 为 `1`，退出码为 `2`。\n如果 JSON 看起来正常但退出码仍为 `0`，自动化平台就可能把部分失败误判为成功。\n\n#### Python 特别合适的工作类型\n\n| 工作类型 | Python 的优势 | 仍需确认的边界 |\n| --- | --- | --- |\n| 文件与日志处理 | 标准库可直接处理路径、文本、JSON、CSV 和压缩文件 | 文件大小、编码、原子写入和保留期限 |\n| API 与 SDK 集成 | 云厂商、监控和基础设施系统通常提供 Python SDK | 超时、分页、限流、认证和幂等 |\n| CLI 与批处理 | 很容易把函数封装为参数化命令 | 退出码、稳定输出、dry-run 和审计 |\n| 数据整理与报表 | 字典、生成器及数据生态适合清洗和聚合 | 数据量是否仍适合单机内存处理 |\n| 小型内部服务 | 可较快交付 API、任务和管理页面 | 是否需要长期运行、恢复和独立扩缩容 |\n| 测试与验证工具 | 能快速构造假数据、调用接口和检查结果 | 测试不能直接操作真实生产环境 |\n\nPython 的快速交付来自较少的样板代码和成熟生态，不来自省略工程约束。\n只要程序会改配置、执行命令或调用生产 API，就必须处理权限、输入、失败、日志和恢复。\n\nJupyter Notebook 很适合逐步查看 API 返回值、试验清洗表达式或画一次性图表，但单元格执行顺序会隐藏状态，且不天然提供稳定入口、退出码和部署契约。\n探索得到结论后，应把可复用逻辑移入 `.py` 模块，用测试固定行为，再由 CLI 或任务入口调用。\n\n#### 哪些信号提示不要继续使用简单 Python 脚本\n\n下面这些信号不一定意味着立刻换语言，但说明需要重新评估：\n\n- 程序要作为资源敏感的常驻 Agent 分发到大量主机。\n- 交付环境不允许预装解释器或动态安装依赖。\n- 工作负载以持续的 CPU 密集计算为主，而且横向拆分收益有限。\n- 服务有明确的低延迟、高并发和资源上限要求。\n- 一个脚本已经同时承担 API、调度、任务恢复、权限和状态存储。\n- 团队对另一种语言已有成熟的构建、部署和排障体系。\n\n此时的正确动作不是争论“Python 快不快”，而是收集证据：\n\n```text\n业务目标\n  -> 任务耗时与并发\n  -> CPU 内存与启动成本\n  -> 分发和升级方式\n  -> 故障恢复与隔离要求\n  -> 团队维护能力\n  -> 语言与组件选择\n```\n\n对于一次性数据整理、控制面调用和内部自动化，Python 往往刚好够用。\n对于大量主机上的常驻二进制、严格资源预算或高并发服务，Go 可能更自然。\n真正重要的是把升级条件写出来，不要因为“以后也许会需要”提前引入复杂度。\n\n#### 从结果而不是代码行数判断是否完成\n\n一个运维脚本的完成标准至少应回答：\n\n- 输入来自哪里，格式不对时怎样失败？\n- 是否会接触生产资源，权限范围是什么？\n- 外部调用有没有超时？\n- 部分目标失败时整体退出码是什么？\n- 是否支持 dry-run 或只读验证？\n- 日志能否定位到目标和动作，又是否隐藏 Secret？\n- 重复执行会不会产生第二次副作用？\n- 谁能运行，结果保留多久？\n\n练习时可以把上面的 `CheckResult` 示例改成读取一个本地 JSON 文件。\n故意加入缺失字段、错误布尔值和重复目标，观察程序是在输入边界拒绝数据，还是带着错误继续运行。\n这个练习比再背一组语法更接近真实运维开发。\n\n本主题只讲 Python 如何调用和自动化系统；文件、进程、权限与信号的系统机制继续参考 [Linux 专题](../../systems/linux/README.md)，网络连接与协议边界参考 [网络基础专题](../../systems/network-fundamentals/README.md)。", "subs": ["从一条人工操作链开始判断", "Python 特别合适的工作类型", "哪些信号提示不要继续使用简单 Python 脚本", "从结果而不是代码行数判断是否完成"]}, {"title": "拿到一段脚本，怎样确认它会由哪个 Python 运行？", "content": "“机器上有 Python”不是一个足够精确的结论。\n同一台主机可能同时存在系统 Python、包管理器安装的 Python、项目虚拟环境和容器内 Python。\n如果解释器选错，最常见的现象是依赖找不到、语法不兼容、导入了错误版本的包，或者把依赖装进了另一个环境。\n\n#### 先收集四个事实\n\n运行未知脚本前，先确认：\n\n```bash\ncommand -v python3\npython3 --version\npython3 -c 'import sys; print(sys.executable)'\npython3 -c 'import sys; print(\"\\n\".join(sys.path))'\n```\n\n这四条信息分别回答：\n\n1. Shell 会解析到哪个命令。\n2. 解释器报告的版本是什么。\n3. Python 进程实际使用哪个可执行文件。\n4. 模块会从哪些目录查找。\n\n`command -v` 的结果和 `sys.executable` 通常一致，但在别名、包装脚本、虚拟环境和版本管理工具参与时，不能只看其中一个。\n排查 `ModuleNotFoundError` 时，`sys.path` 比“我明明安装过”更有证据价值。\n\n可以把诊断信息做成脚本自身的 `--diagnose` 输出：\n\n```python\nfrom __future__ import annotations\n\nimport json\nimport platform\nimport sys\n\n\ndef runtime_facts() -> dict[str, object]:\n    return {\n        \"python_version\": platform.python_version(),\n        \"implementation\": platform.python_implementation(),\n        \"executable\": sys.executable,\n        \"prefix\": sys.prefix,\n        \"base_prefix\": sys.base_prefix,\n        \"module_search_path\": sys.path,\n    }\n\n\nif __name__ == \"__main__\":\n    print(json.dumps(runtime_facts(), ensure_ascii=False, indent=2))\n```\n\n`sys.prefix != sys.base_prefix` 通常表示当前解释器运行在虚拟环境中。\n它适合诊断，不应被当成安全控制；程序仍要通过明确的启动方式和依赖声明保证环境一致。\n\n#### Shebang 只决定直接执行时的入口\n\n脚本第一行常见：\n\n```python\n#!/usr/bin/env python3\n```\n\n当文件具有执行权限并以 `./tool.py` 启动时，操作系统会根据 shebang 找解释器。\n`/usr/bin/env python3` 会继续使用当前 `PATH` 查找 `python3`，便于虚拟环境接管，但也意味着 `PATH` 被错误修改时可能运行到意外解释器。\n\n下面两种执行方式不完全相同：\n\n```bash\nchmod +x tool.py\n./tool.py --help\n\n/opt/ops-tool/.venv/bin/python tool.py --help\n```\n\n第一种依赖 shebang 和当前 `PATH`。\n第二种明确指定解释器，更适合 systemd、定时任务和可复现的部署脚本。\n\n不要写死个人电脑上的解释器路径再提交给所有人，也不要修改系统 Python 来迁就单个工具。\n正式项目应使用项目虚拟环境、容器或明确的运行时镜像。\n\n#### `python -m` 为什么经常比直接运行文件稳定\n\n假设项目结构如下：\n\n```text\nops_check/\n├── pyproject.toml\n└── src/\n    └── ops_check/\n        ├── __init__.py\n        ├── cli.py\n        └── parser.py\n```\n\n在包内使用相对或绝对导入时，直接执行深层文件可能改变模块搜索上下文：\n\n```bash\npython3 src/ops_check/cli.py\n```\n\n更稳妥的方式是安装项目后按模块执行，或使用定义好的命令入口：\n\n```bash\npython3 -m ops_check.cli\nops-check --help\n```\n\n`-m` 让 Python 按模块名称定位代码，并建立正确的包上下文。\n它不能替代正确的项目结构，但能减少“在某个目录运行才成功”的偶然行为。\n\n#### 不要把依赖安装命令和解释器分开猜\n\n如果环境仍使用 `pip`，优先写：\n\n```bash\npython3 -m pip --version\npython3 -m pip install -r requirements.txt\n```\n\n这样 `pip` 模块由同一个 `python3` 解释器加载。\n单独执行 `pip3` 时，它可能属于另一个 Python 安装。\n\n现代项目可以使用 `uv run`、`uv sync` 和锁文件管理环境；第三册会完整讲解。\n无论使用什么工具，目标都是同一个：运行解释器、安装位置和依赖解析必须能够被复现。\n\n#### 退出状态是程序与调用方的契约\n\n终端上打印“失败”但退出 `0`，对人可能醒目，对调度系统却仍是成功。\n相反，打印正常结果却因未处理异常退出，调用方只会看到非零状态而缺少结构化原因。\n\n推荐把退出码集中在入口决定：\n\n```python\nfrom enum import IntEnum\n\n\nclass ExitCode(IntEnum):\n    OK = 0\n    CHECK_FAILED = 2\n    INVALID_INPUT = 3\n    INTERNAL_ERROR = 70\n\n\ndef main() -> int:\n    try:\n        # parse input -> run checks -> render output\n        return ExitCode.OK\n    except ValueError as exc:\n        print(f\"invalid input: {exc}\")\n        return ExitCode.INVALID_INPUT\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n```\n\n退出码不需要设计几十种。\n应区分调用方真正会采取不同动作的类别，并在 `--help` 或使用文档中稳定说明。\n\n验证时至少覆盖：\n\n```bash\npython3 tool.py --help\nprintf 'help=%s\\n' \"$?\"\n\npython3 tool.py --unknown-option\nprintf 'invalid=%s\\n' \"$?\"\n```\n\n还要分别从交互式 Shell、CI、cron 或 systemd 的实际启动入口验证。\n环境变量、当前目录和 `PATH` 在这些环境中经常不同。\n\n#### 当前文档基线\n\n本文可执行示例以 Python 3.12 及以上版本为教学基线，因为后文使用了 `StrEnum`、`asyncio.TaskGroup` 和 `asyncio.timeout()` 等接口。\n这不是要求所有生产环境立刻升级：正式项目应在 `pyproject.toml` 中声明真实支持范围，并让 CI 覆盖实际部署版本；维护旧版本时需要为这些接口选择兼容写法。\n涉及标准库细节时，以 [Python 官方文档](https://docs.python.org/3/) 为准；本文核对日期为 2026-09-02。", "subs": ["先收集四个事实", "Shebang 只决定直接执行时的入口", "python", "不要把依赖安装命令和解释器分开猜", "退出状态是程序与调用方的契约", "当前文档基线"]}, {"title": "AI 已经能写代码了，为什么还要自己读懂和验证？", "content": "AI 可以快速生成函数、测试和项目骨架，但它不知道你所在环境的真实权限、网络、数据和恢复要求。\n一段代码“看起来合理”只说明语法和常见模式像代码，不说明它在你的系统里安全、正确或可运维。\n运维工程师不必拒绝生成代码，必须把验收责任留在自己手里。\n\n#### 先把生成结果当成未经审查的变更\n\n审查顺序可以固定为：\n\n```text\n需求和边界\n  -> 输入与输出\n  -> 外部副作用\n  -> 权限与凭证\n  -> 失败和恢复\n  -> 依赖与版本\n  -> 测试和运行证据\n  -> 才允许进入真实环境\n```\n\n不要一上来只挑语法错误。\n下面这段代码语法正确，却不适合直接用于批量运维：\n\n```python\nimport os\n\n\ndef restart(service: str) -> None:\n    os.system(f\"systemctl restart {service}\")\n```\n\n至少存在这些问题：\n\n- `service` 可能包含 Shell 元字符，形成命令注入。\n- 没有允许服务白名单。\n- 没有超时。\n- 没有捕获退出码和 stderr。\n- 没有 dry-run。\n- 没有记录操作者、目标和结果。\n- 调用方不知道重启失败。\n\n改进后的最小版本可以是：\n\n```python\nfrom __future__ import annotations\n\nimport subprocess\nfrom collections.abc import Collection\n\n\nclass RestartError(RuntimeError):\n    pass\n\n\ndef restart_service(\n    service: str,\n    *,\n    allowed: Collection[str],\n    dry_run: bool = True,\n    timeout: float = 20.0,\n) -> list[str]:\n    if service not in allowed:\n        raise ValueError(f\"service is not allowed: {service}\")\n\n    command = [\"systemctl\", \"restart\", service]\n    if dry_run:\n        return command\n\n    completed = subprocess.run(\n        command,\n        check=False,\n        capture_output=True,\n        text=True,\n        timeout=timeout,\n        shell=False,\n    )\n    if completed.returncode != 0:\n        message = completed.stderr.strip() or \"no stderr\"\n        raise RestartError(\n            f\"restart failed: service={service} \"\n            f\"status={completed.returncode} error={message}\"\n        )\n    return command\n```\n\n这仍不是完整生产实现，但它把危险输入、默认副作用、超时和失败信息变成了显式接口。\n后续还需结合权限提升方式、并发限制、服务状态复查和审计系统设计。\n\n#### 用四遍阅读法降低遗漏\n\n第一遍只看数据流：\n\n- 输入从参数、环境变量、文件还是网络进入？\n- 经过哪些转换？\n- 输出写到哪里？\n- 哪些地方改变外部状态？\n\n第二遍只看失败路径：\n\n- 什么异常会出现？\n- 哪些异常被吞掉？\n- 超时后底层任务是否仍在运行？\n- 部分成功怎样表达？\n- 重试是否可能重复执行写操作？\n\n第三遍只看安全与权限：\n\n- Secret 是否出现在源码、参数或日志中？\n- 用户输入是否进入路径、SQL、Shell 或模板？\n- TLS 校验是否被关闭？\n- 是否使用过大的云权限或 Kubernetes 权限？\n\n第四遍只看可验证性：\n\n- 核心逻辑能否在无网络环境测试？\n- 外部依赖能否替换成本地假实现？\n- 是否有明确退出码？\n- 日志能否定位到一次任务？\n- 失败能否稳定复现？\n\n#### 要求 AI 同时交付证据\n\n比“帮我写一个巡检脚本”更有效的要求是：\n\n```text\n实现只读巡检 CLI。\n输入是一份本地 JSON 主机清单。\n默认 dry-run，不执行远程写操作。\n外部调用必须设置超时和并发上限。\n输出同时支持人读表格和稳定 JSON。\n部分失败时退出码为 2。\n提供 pytest，覆盖成功、非法输入、超时和部分失败。\n列出未验证假设和生产使用前检查项。\n```\n\n这样的描述仍不能保证结果正确，但会让边界和验收条件进入生成过程。\n如果生成工具修改了依赖、CI、部署文件或权限配置，要把它们当成独立高风险变更审查。\n\n#### 最小验证不等于真实验证\n\n验证证据有层次：\n\n| 证据 | 能证明什么 | 不能证明什么 |\n| --- | --- | --- |\n| AST 或编译通过 | Python 语法可解析 | 逻辑、依赖和外部系统正确 |\n| 单元测试通过 | 已覆盖输入下的函数行为 | 真实网络、权限和部署行为 |\n| 本地集成测试通过 | 本地假服务与文件流程可运行 | 生产规模和生产故障模式 |\n| 测试环境演练通过 | 指定环境中的完整路径可用 | 所有生产流量与边界均安全 |\n| 小范围生产观察 | 真实依赖下的部分行为 | 长周期、峰值和所有故障情形 |\n\n因此报告应写“执行了什么”，不要只写“已验证”。\n例如：\n\n```text\nPASS  Python 代码块已通过 py_compile\nPASS  12 个单元测试通过\nPASS  localhost 假服务验证超时与 500 响应\nNOT VERIFIED  生产凭证权限和真实主机并发容量\n```\n\n#### 给生成代码做一次故障注入\n\n最有价值的练习不是让正常输入再跑一遍，而是主动破坏假设：\n\n- 删除必需环境变量。\n- 提供空文件、坏 JSON 和错误编码。\n- 让假 API 延迟超过超时。\n- 返回 429、500 和格式错误的 200 响应。\n- 让一半目标成功、一半失败。\n- 在写文件中途抛出异常。\n- 连续运行两次相同任务。\n- 在任务进行时发送终止信号。\n\n记录每次实验的输入、预期、实际结果和残留状态。\n代码只有在失败后仍可解释、可恢复，才开始具备运维价值。\n\n本章的结论不是“AI 不可靠”，而是生成速度不能替代工程责任。\n能读懂基础语法、追踪数据流、识别副作用并运行测试，正是 vibe coding 时代更重要的基本功。", "subs": ["先把生成结果当成未经审查的变更", "用四遍阅读法降低遗漏", "要求 AI 同时交付证据", "最小验证不等于真实验证", "给生成代码做一次故障注入"]}]}, {"title": "第二章 · 写脚本之前，先理解数据在程序里怎样变化", "sections": [{"title": "同一批有序数据，什么时候用列表，什么时候用元组？", "content": "运维脚本经常要处理“一批有顺序的数据”：主机清单、待检查端口、命令参数、时间序列采样点。\n列表和元组都能保存这些数据，也都支持遍历、索引和切片，但它们表达的承诺不同。\n\n- `list` 表示这批元素在运行中可能增加、删除、排序或替换。\n- `tuple` 表示这是一个结构固定的值，调用者不应修改它的组成。\n- 两者都不保证内部元素不可变；元组只能保证自己的槽位不能被重新赋值。\n\n先看一个容易读懂的选择：巡检目标会在过滤阶段变化，所以用列表；单个地址由主机和端口组成，结构固定，所以用元组。\n\n```python\ntargets: list[tuple[str, int]] = [\n    (\"db-a.internal\", 3306),\n    (\"cache-a.internal\", 6379),\n    (\"api-a.internal\", 443),\n]\n\ntargets.append((\"api-b.internal\", 443))\n\nfor host, port in targets:\n    print(f\"checking {host}:{port}\")\n```\n\n这里的类型从外向内读：`targets` 是列表，列表中的每一项是一个二元组。\n解包语句 `for host, port in targets` 还会验证每项恰好包含两个元素；结构不符时会立即失败，而不是悄悄把字段弄错。\n\n#### 用“是否允许变化”做第一判断\n\n不要根据“元组可能更省一点内存”决定业务模型。\n对运维工具更重要的是调用约定：谁可以改变这批数据，改变后是否会影响其他代码。\n\n```python\ndef enabled_checks(all_checks: list[str], disabled: set[str]) -> list[str]:\n    return [name for name in all_checks if name not in disabled]\n\n\nCHECK_COLUMNS: tuple[str, ...] = (\n    \"target\",\n    \"status\",\n    \"latency_ms\",\n    \"message\",\n)\n```\n\n`enabled_checks()` 返回新列表，调用者可以继续排序或追加。\n`CHECK_COLUMNS` 是输出协议的一部分，元组让“固定顺序”更明显。\n常量名使用大写只是约定，不会让对象自动只读；真正限制槽位变化的是元组类型。\n\n以下场景通常适合列表：\n\n- 逐步收集发现结果。\n- 根据条件过滤、插入或删除目标。\n- 排序后依次执行。\n- 需要就地更新某个位置。\n\n以下场景通常适合元组：\n\n- 一个固定字段组合，例如 `(host, port)`。\n- 函数需要返回多个关联值，但还没有必要定义具名类型。\n- 作为字典键或集合元素，并且其中所有成员也都可哈希。\n- 明确表达“不应通过这个引用改动容器结构”。\n\n#### 索引、切片和负数位置\n\n列表与元组都从索引 `0` 开始。\n负数索引从末尾反向计数，`-1` 是最后一项。\n切片遵循左闭右开区间：包含起点，不包含终点。\n\n```python\nsamples = [82, 87, 91, 105, 99, 88]\n\nprint(samples[0])       # 82\nprint(samples[-1])      # 88\nprint(samples[1:4])     # [87, 91, 105]\nprint(samples[:3])      # [82, 87, 91]\nprint(samples[::2])     # [82, 91, 99]\n```\n\n切片会创建一个新的外层容器。\n如果元素本身是字典或列表，新容器仍然引用相同的内部对象；这与后面的浅拷贝问题相同。\n\n访问不存在的单个索引会抛出 `IndexError`，切片越界则会安全截断：\n\n```python\nitems = [\"a\", \"b\"]\n\nprint(items[:100])\n\ntry:\n    print(items[100])\nexcept IndexError as exc:\n    print(f\"invalid position: {exc}\")\n```\n\n这种差异适合用来表达不同意图。\n“最多取前 100 条”可以切片；“结果必须存在第 101 条”则应让索引错误暴露数据不符合预期。\n\n#### 不要把可变对象藏在元组里后误以为安全\n\n元组不能替换槽位，但槽位指向的列表仍然可以变化：\n\n```python\nrecord = (\"db-a\", [3306, 33060])\nrecord[1].append(9104)\n\nprint(record)\n# ('db-a', [3306, 33060, 9104])\n```\n\n如果希望得到真正清晰的只读值，可以把内部成员也改为不可变结构，或定义冻结的数据类：\n\n```python\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True, slots=True)\nclass Endpoint:\n    host: str\n    ports: tuple[int, ...]\n\n\nendpoint = Endpoint(\"db-a\", (3306, 33060))\n```\n\n`frozen=True` 会阻止常规字段重新赋值，`slots=True` 则固定实例字段集合。\n它们改善的是模型边界，不是安全隔离；字段若仍指向可变对象，内部对象仍可能被改动。\n\n#### 用小实验验证容器行为\n\n```python\ndef normalize_hosts(raw_hosts: list[str]) -> list[str]:\n    normalized = []\n    for raw in raw_hosts:\n        host = raw.strip().lower()\n        if host:\n            normalized.append(host)\n    return normalized\n\n\nsource = [\" DB-A \", \"\", \"Api-A\"]\nresult = normalize_hosts(source)\n\nassert source == [\" DB-A \", \"\", \"Api-A\"]\nassert result == [\"db-a\", \"api-a\"]\nassert result is not source\n```\n\n这组断言验证了三件事：输入没有被修改、输出内容正确、返回值是新对象。\n当函数会修改输入时，名称应明确体现，例如 `normalize_hosts_in_place()`，文档和测试也应说明副作用。\n\n#### 本节练习：给巡检目标选模型\n\n给定以下需求，先写出类型，再解释选择：\n\n1. 用户按照命令行顺序传入的一批主机。\n2. 单个 TCP 地址的主机名与端口。\n3. 固定的 CSV 表头。\n4. 扫描过程中不断增加的告警列表。\n\n一种合理答案是：\n\n```python\ninput_hosts: list[str]\naddress: tuple[str, int]\ncsv_header: tuple[str, ...]\nalerts: list[str]\n```\n\n答案并非只能如此。\n如果地址需要校验、序列化和更多字段，`dataclass` 会比位置元组更清楚。\n选择数据结构的核心不是炫技，而是让“哪些东西会变化、哪些字段属于一个整体”在代码中一眼可见。", "subs": ["用“是否允许变化”做第一判断", "索引、切片和负数位置", "不要把可变对象藏在元组里后误以为安全", "用小实验验证容器行为", "本节练习：给巡检目标选模型"]}, {"title": "查找、去重和成员判断，为什么经常离不开字典与集合？", "content": "列表擅长保存顺序，但从很长的列表中反复查找某个值，需要从头向后比较。\n字典和集合基于哈希组织键，通常能更直接地完成按键查找、去重和成员判断。\n\n- `dict` 保存“键到值”的映射。\n- `set` 只关心某个唯一值是否存在。\n- 两者的键或元素都必须可哈希，例如字符串、整数以及成员均可哈希的元组。\n- 列表、字典和集合本身可变，因此不能直接作为字典键。\n\n#### 把线性搜索改成明确的索引\n\n假设 API 返回了主机对象，而本地任务需要按主机名多次匹配。\n每次扫描原列表既慢又容易把匹配逻辑散落在循环里。\n\n```python\nhosts = [\n    {\"name\": \"api-a\", \"owner\": \"platform\", \"enabled\": True},\n    {\"name\": \"db-a\", \"owner\": \"dba\", \"enabled\": True},\n    {\"name\": \"old-a\", \"owner\": \"legacy\", \"enabled\": False},\n]\n\nhost_by_name = {item[\"name\"]: item for item in hosts}\n\ntarget = host_by_name.get(\"db-a\")\nif target is None:\n    print(\"target not found\")\nelse:\n    print(target[\"owner\"])\n```\n\n字典推导式把列表转换为以名称为键的索引。\n`dict.get()` 在键不存在时返回 `None`；如果缺失属于程序错误，则应使用 `host_by_name[\"db-a\"]`，让 `KeyError` 暴露出来。\n\n必须先决定重复键的含义。\n上述推导式遇到两个同名主机时，后者会覆盖前者。\n如果重复代表脏数据，就应该显式拒绝：\n\n```python\ndef index_unique_hosts(items: list[dict[str, object]]) -> dict[str, dict[str, object]]:\n    indexed: dict[str, dict[str, object]] = {}\n\n    for item in items:\n        name = str(item[\"name\"])\n        if name in indexed:\n            raise ValueError(f\"duplicate host name: {name}\")\n        indexed[name] = item\n\n    return indexed\n```\n\n这段代码把数据约束放在入口，后续业务代码就能依赖“名称唯一”这一事实。\n\n#### 用集合表达去重与集合关系\n\n```python\nexpected = {\"api-a\", \"api-b\", \"db-a\"}\nreported = {\"api-a\", \"db-a\", \"unknown-a\"}\n\nmissing = expected - reported\nunexpected = reported - expected\nhealthy_scope = expected & reported\nall_seen = expected | reported\n\nprint(\"missing:\", sorted(missing))\nprint(\"unexpected:\", sorted(unexpected))\n```\n\n差集、交集和并集让意图比嵌套循环清楚。\n集合本身不承诺业务需要的展示顺序，因此输出前应使用 `sorted()`，让日志和测试结果稳定。\n\n```text\nmissing: ['api-b']\nunexpected: ['unknown-a']\n```\n\n如果既要去重又要保留首次出现顺序，可以利用字典键唯一且保持插入顺序的语言保证：\n\n```python\nraw_hosts = [\"api-a\", \"db-a\", \"api-a\", \"cache-a\"]\nunique_hosts = list(dict.fromkeys(raw_hosts))\n\nassert unique_hosts == [\"api-a\", \"db-a\", \"cache-a\"]\n```\n\n这比先转集合再转列表更适合 CLI 输入，因为用户提供的顺序可能影响执行与阅读。\n\n#### 字典遍历时明确自己需要什么\n\n```python\nports = {\"ssh\": 22, \"https\": 443, \"mysql\": 3306}\n\nfor name in ports:\n    print(name)\n\nfor port in ports.values():\n    print(port)\n\nfor name, port in ports.items():\n    print(f\"{name}={port}\")\n```\n\n直接遍历字典得到键。\n需要键和值时使用 `.items()`，可以避免循环体里再次索引。\n不要在遍历字典期间增删键，否则可能触发 `RuntimeError: dictionary changed size during iteration`。\n\n需要删除时，先计算待删除键或构造新字典：\n\n```python\nchecks = {\n    \"ssh\": {\"enabled\": True},\n    \"dns\": {\"enabled\": False},\n    \"http\": {\"enabled\": True},\n}\n\nenabled_checks = {\n    name: config\n    for name, config in checks.items()\n    if config[\"enabled\"]\n}\n```\n\n#### 缺失、空值和假值不是一回事\n\n下面的写法会把 `0`、空字符串和不存在都当成同一种情况：\n\n```python\ntimeout = config.get(\"timeout\")\nif not timeout:\n    timeout = 5\n```\n\n如果 `0` 在业务上表示“立即超时”或“禁用等待”，这段代码就改变了用户配置。\n应根据协议区分缺失与合法假值：\n\n```python\nMISSING = object()\n\nraw_timeout = config.get(\"timeout\", MISSING)\nif raw_timeout is MISSING:\n    timeout = 5.0\nelse:\n    timeout = float(raw_timeout)\n```\n\n字典的键存在性也可以直接判断：\n\n```python\nif \"timeout\" not in config:\n    print(\"using default timeout\")\n```\n\n#### 可哈希并不等于业务上适合作为键\n\n字符串容易作为键，但仍要先规范化。\n`API-A`、`api-a` 和 `api-a ` 在 Python 看来是三个不同字符串。\n\n```python\ndef normalize_host_key(value: str) -> str:\n    key = value.strip().lower()\n    if not key:\n        raise ValueError(\"host name cannot be empty\")\n    return key\n```\n\n如果在不同入口使用不同规范化规则，字典查找会产生难以解释的缺失。\n把规则集中到一个函数，并在读取配置、接收参数和解析 API 响应时统一调用。\n\n#### 本节练习：对账两份主机清单\n\n实现一个函数，接收期望主机列表和实际上报列表，返回缺失、未知、重复三类结果。\n\n```python\nfrom collections import Counter\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass InventoryDiff:\n    missing: tuple[str, ...]\n    unexpected: tuple[str, ...]\n    duplicates: tuple[str, ...]\n\n\ndef compare_inventory(expected: list[str], reported: list[str]) -> InventoryDiff:\n    expected_set = set(expected)\n    reported_set = set(reported)\n    counts = Counter(reported)\n\n    return InventoryDiff(\n        missing=tuple(sorted(expected_set - reported_set)),\n        unexpected=tuple(sorted(reported_set - expected_set)),\n        duplicates=tuple(sorted(name for name, count in counts.items() if count > 1)),\n    )\n\n\ndiff = compare_inventory(\n    expected=[\"api-a\", \"api-b\", \"db-a\"],\n    reported=[\"api-a\", \"api-a\", \"db-a\", \"old-a\"],\n)\n\nassert diff.missing == (\"api-b\",)\nassert diff.unexpected == (\"old-a\",)\nassert diff.duplicates == (\"api-a\",)\n```\n\n这个练习同时使用列表保留原始事件、集合计算关系、计数器识别重复、元组稳定输出。\n真正的数据模型往往不是四选一，而是让不同结构各自承担最适合的职责。", "subs": ["把线性搜索改成明确的索引", "用集合表达去重与集合关系", "字典遍历时明确自己需要什么", "缺失、空值和假值不是一回事", "可哈希并不等于业务上适合作为键", "本节练习：对账两份主机清单"]}, {"title": "为什么改了一个变量，另一个变量也跟着变了？", "content": "Python 变量不是装对象的盒子，更像贴在对象上的名字。\n赋值语句通常只是让另一个名字指向同一个对象，不会自动复制对象。\n\n```python\nprimary = {\"host\": \"api-a\", \"tags\": [\"prod\"]}\ncandidate = primary\n\ncandidate[\"tags\"].append(\"canary\")\n\nprint(primary)\n# {'host': 'api-a', 'tags': ['prod', 'canary']}\n```\n\n`primary` 与 `candidate` 指向同一个字典，字典中的标签列表也只有一份。\n因此通过任一名字修改，都能从另一名字观察到变化。\n\n#### `==` 比较值，`is` 比较身份\n\n```python\nleft = {\"status\": \"ok\"}\nright = {\"status\": \"ok\"}\nalias = left\n\nassert left == right\nassert left is not right\nassert alias is left\n```\n\n业务数据通常用 `==` 比较内容。\n`is` 主要用于身份判断，最常见的写法是 `value is None` 和 `value is not None`。\n不要用 `is` 比较字符串和整数；解释器内部复用对象属于实现细节，不能作为业务逻辑。\n\n#### 浅拷贝只复制第一层\n\n```python\nfrom copy import copy\n\n\noriginal = {\n    \"host\": \"api-a\",\n    \"labels\": {\"env\": \"prod\"},\n}\ncloned = copy(original)\n\ncloned[\"host\"] = \"api-b\"\ncloned[\"labels\"][\"env\"] = \"staging\"\n\nassert original[\"host\"] == \"api-a\"\nassert original[\"labels\"][\"env\"] == \"staging\"\n```\n\n外层字典是两份，所以替换 `host` 不影响原对象。\n内层 `labels` 字典仍被共享，所以修改环境标签会穿透过去。\n列表切片、`list(source)` 和 `dict(source)` 也都是浅拷贝。\n\n#### 深拷贝不是默认答案\n\n`copy.deepcopy()` 会递归复制对象图，能隔离多数嵌套可变对象：\n\n```python\nfrom copy import deepcopy\n\n\noriginal = {\"host\": \"api-a\", \"labels\": {\"env\": \"prod\"}}\ncloned = deepcopy(original)\ncloned[\"labels\"][\"env\"] = \"staging\"\n\nassert original[\"labels\"][\"env\"] == \"prod\"\n```\n\n但深拷贝也有成本和语义问题：\n\n- 大对象会增加内存和 CPU 消耗。\n- 文件句柄、锁、Socket 与外部客户端并不适合复制。\n- 对象之间刻意共享的关系可能被破坏。\n- 深拷贝掩盖了“谁拥有这份数据”的设计问题。\n\n更好的默认策略通常是缩小可变范围，并显式构造需要变化的新值：\n\n```python\ndef with_environment(record: dict[str, object], env: str) -> dict[str, object]:\n    old_labels = record.get(\"labels\", {})\n    if not isinstance(old_labels, dict):\n        raise TypeError(\"labels must be a mapping\")\n\n    return {\n        **record,\n        \"labels\": {\n            **old_labels,\n            \"env\": env,\n        },\n    }\n```\n\n这段代码明确复制了要修改的两层，而不是盲目复制整个对象图。\n\n#### 函数参数也是一次名字绑定\n\n调用函数时，形参会绑定到实参对象。\n函数若修改可变对象，调用者能够看到；函数若让形参重新绑定，调用者的变量不会随之改名。\n\n```python\ndef append_default(items: list[str]) -> None:\n    items.append(\"default\")\n\n\ndef replace_locally(items: list[str]) -> None:\n    items = [\"replacement\"]\n    print(\"inside:\", items)\n\n\nnames = [\"custom\"]\nappend_default(names)\nassert names == [\"custom\", \"default\"]\n\nreplace_locally(names)\nassert names == [\"custom\", \"default\"]\n```\n\n这不是简单的“值传递”或“引用传递”口号能完整描述的。\n实际规则是对象被传入，形参获得对该对象的新绑定；对象是否可变决定了原地操作能否被外部观察。\n\n#### 避开可变默认参数\n\n默认参数在函数定义时求值，不是每次调用时重新创建。\n把列表或字典直接放在默认值里，会让多次调用共享状态：\n\n```python\ndef collect_bad(host: str, results: list[str] = []) -> list[str]:\n    results.append(host)\n    return results\n\n\nprint(collect_bad(\"api-a\"))\nprint(collect_bad(\"db-a\"))\n# 第二次结果会包含 api-a 和 db-a\n```\n\n安全写法用 `None` 作为哨兵：\n\n```python\ndef collect(host: str, results: list[str] | None = None) -> list[str]:\n    if results is None:\n        results = []\n    results.append(host)\n    return results\n```\n\n如果函数本来就需要跨调用缓存，应该使用清楚命名的缓存对象或缓存装饰器，并说明生命周期，而不是借用默认参数制造隐式状态。\n\n#### 并发会放大共享可变状态的风险\n\n单线程脚本中，别名问题可能只是偶发的数据污染。\n多个线程或协程同时修改共享字典时，更新次序也会变得不稳定。\n\n```python\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass CheckResult:\n    target: str\n    ok: bool\n    message: str\n\n\ndef check_one(target: str) -> CheckResult:\n    # 函数只根据输入产生返回值，不修改全局 results。\n    return CheckResult(target=target, ok=True, message=\"reachable\")\n```\n\n让工作函数返回结果，再由单一汇总点收集，通常比让所有任务同时修改全局容器更易测试。\n后面的并发章节会在超时、取消和有界并发下继续使用这个模式。\n\n#### 用对象身份定位意外共享\n\n调试时可以用 `id()` 观察两个名字是否指向同一对象：\n\n```python\nconfig_a = {\"labels\": {\"env\": \"prod\"}}\nconfig_b = config_a.copy()\n\nprint(id(config_a), id(config_b))\nprint(id(config_a[\"labels\"]), id(config_b[\"labels\"]))\n```\n\n预期现象是外层 ID 不同，内层 ID 相同。\n`id()` 只适合诊断当前进程中的身份关系，不应写入持久化协议，也不能拿来跨进程判断对象是否相同。\n\n#### 本节练习：消除一次配置串改\n\n下面的代码希望为两台主机生成独立配置，却复用了嵌套标签：\n\n```python\nbase = {\"timeout\": 3, \"labels\": {\"env\": \"prod\"}}\n\napi_config = base.copy()\napi_config[\"labels\"][\"role\"] = \"api\"\n\ndb_config = base.copy()\ndb_config[\"labels\"][\"role\"] = \"db\"\n```\n\n运行后，两个配置的 `role` 都会变成最后写入的 `db`。\n可以显式复制内层字典：\n\n```python\ndef build_config(base: dict[str, object], role: str) -> dict[str, object]:\n    labels = base.get(\"labels\")\n    if not isinstance(labels, dict):\n        raise TypeError(\"base.labels must be a mapping\")\n\n    return {\n        **base,\n        \"labels\": {\n            **labels,\n            \"role\": role,\n        },\n    }\n\n\napi_config = build_config(base, \"api\")\ndb_config = build_config(base, \"db\")\n\nassert api_config[\"labels\"] == {\"env\": \"prod\", \"role\": \"api\"}\nassert db_config[\"labels\"] == {\"env\": \"prod\", \"role\": \"db\"}\nassert base[\"labels\"] == {\"env\": \"prod\"}\n```\n\n验证时不要只看新对象是否正确，还要确认基础模板没有被修改。\n这条检查对批量生成主机配置、Kubernetes 清单和告警规则都很重要。\n\n本章形成了三个可继续复用的判断：容器是否允许变化、查找是否需要键索引、数据是否被多个名字共享。\n先把这些边界想清楚，后续解析文件、调用 API 和并发执行时才不容易出现隐蔽副作用。", "subs": ["== 比较值", "浅拷贝只复制第一层", "深拷贝不是默认答案", "函数参数也是一次名字绑定", "避开可变默认参数", "并发会放大共享可变状态的风险", "用对象身份定位意外共享", "本节练习：消除一次配置串改"]}]}, {"title": "第三章 · 把外部文本变成程序可以信任的数据", "sections": [{"title": "日志出现乱码或格式错乱时，应该先检查什么？", "content": "Python 的 `str` 表示 Unicode 文本，`bytes` 表示原始字节。\n文件、网络和子进程边界上传递的最终都是字节；编码负责在两者之间转换。\n所谓“乱码”通常不是文字突然损坏，而是写入方与读取方使用了不同编码，或者字节在更早环节已经被截断。\n\n```text\n字节 --decode(编码)--> str --业务处理--> str --encode(编码)--> 字节\n```\n\n排查时先回答四个问题：\n\n1. 原始字节来自哪里，是否还能保存一份不变的样本？\n2. 生产方声明或约定的编码是什么？\n3. 当前 Python 进程实际按什么编码读取？\n4. 终端、日志采集器和下游存储又按什么编码显示？\n\n#### 文件读写显式声明编码\n\n```python\nfrom pathlib import Path\n\n\nlog_path = Path(\"fixtures\") / \"agent.log\"\n\nwith log_path.open(\"r\", encoding=\"utf-8\") as handle:\n    for line_number, line in enumerate(handle, start=1):\n        print(line_number, line.rstrip(\"\\n\"))\n```\n\n显式写 `encoding=\"utf-8\"` 能避免脚本依赖操作系统区域设置。\n`rstrip(\"\\n\")` 只去掉行尾换行，不会像无参数 `strip()` 那样连前导空格也删除；对需要保留缩进的日志尤其重要。\n\n写文件也应声明编码和换行策略：\n\n```python\nreport_path = Path(\"output\") / \"summary.txt\"\nreport_path.parent.mkdir(parents=True, exist_ok=True)\n\nwith report_path.open(\"w\", encoding=\"utf-8\", newline=\"\\n\") as handle:\n    handle.write(\"主机\\t状态\\n\")\n    handle.write(\"api-a\\t正常\\n\")\n```\n\n#### 解码失败时不要先用 `errors=\"ignore\"`\n\n严格解码会在非法字节处抛出 `UnicodeDecodeError`，其中包含编码、字节范围和失败原因。\n这是定位上游问题的重要证据。\n\n```python\nsample = b\"status=ok\\xffhost=api-a\"\n\ntry:\n    text = sample.decode(\"utf-8\")\nexcept UnicodeDecodeError as exc:\n    print(f\"encoding={exc.encoding}\")\n    print(f\"byte range={exc.start}:{exc.end}\")\n    print(f\"reason={exc.reason}\")\n```\n\n直接忽略错误会让两个字段粘在一起，后续解析可能产生看似合法但含义错误的数据。\n如果业务允许保留可见文本并继续处理，可以选择替换模式，同时记录指标与样本：\n\n```python\ndecoded = sample.decode(\"utf-8\", errors=\"replace\")\nreplacement_count = decoded.count(\"\\N{REPLACEMENT CHARACTER}\")\n\nif replacement_count:\n    print(f\"warning: replaced {replacement_count} invalid byte sequence(s)\")\n```\n\n替换字符说明数据质量下降，不能静默当作正常成功。\n原始字节可能包含敏感信息，保存样本前还要脱敏并限制访问。\n\n#### `bytes` 和 `str` 不能随意混用\n\n```python\npayload = \"主机=api-a\".encode(\"utf-8\")\nassert isinstance(payload, bytes)\n\ntext = payload.decode(\"utf-8\")\nassert isinstance(text, str)\nassert text == \"主机=api-a\"\n```\n\n正则表达式、字符串替换和 JSON 解析通常面向 `str`。\n校验文件摘要、处理压缩流或底层协议帧时则可能需要 `bytes`。\n转换应集中在 I/O 边界，业务层尽量只处理一种表示。\n\n#### 换行、制表符和不可见字符也会破坏格式\n\n日志“看起来一样”不代表字符串相同。\n常见差异包括 `\\n`、Windows 的 `\\r\\n`、制表符 `\\t`、不换行空格和零宽字符。\n调试时使用 `repr()` 比直接 `print()` 更容易发现它们：\n\n```python\nraw = \"api-a\\tOK\\r\\n\"\n\nprint(raw)\nprint(repr(raw))\n# 'api-a\\tOK\\r\\n'\n```\n\n解析结构化文本时应针对协议清理，而不是一律删除所有空白：\n\n```python\ndef parse_status_line(line: str) -> tuple[str, str]:\n    normalized = line.rstrip(\"\\r\\n\")\n    parts = normalized.split(\"\\t\")\n    if len(parts) != 2:\n        raise ValueError(f\"expected 2 tab-separated fields, got {len(parts)}\")\n\n    host, status = parts\n    if not host:\n        raise ValueError(\"host cannot be empty\")\n    return host, status\n```\n\n#### 子进程输出也有编码边界\n\n`subprocess.run(..., text=True)` 会把标准输出解码为字符串。\n若外部命令输出编码不确定，可以先收集字节并显式处理：\n\n```python\nimport subprocess\n\n\ncompleted = subprocess.run(\n    [\"printf\", \"%s\", \"status=ok\"],\n    capture_output=True,\n    check=False,\n    timeout=2,\n)\n\nstdout = completed.stdout.decode(\"utf-8\", errors=\"strict\")\nstderr = completed.stderr.decode(\"utf-8\", errors=\"replace\")\n```\n\n真实脚本还应检查退出码并限制输出大小。\n本例只是说明编码位置，完整的子进程安全模型会在第二册展开。\n\n#### 建立可复现的乱码诊断记录\n\n一份有用的诊断记录至少包含：\n\n- 文件或响应的来源与采集时间。\n- 原始数据摘要，例如 SHA-256，而不是把敏感正文贴进工单。\n- 生产方声明的编码。\n- 实际尝试的编码与异常位置。\n- 是否使用替换策略，以及替换数量。\n- Python 版本、操作系统和终端区域设置。\n\n可以安全记录字节片段的十六进制形式：\n\n```python\nfrom hashlib import sha256\n\n\ndef describe_bytes(data: bytes, sample_size: int = 24) -> dict[str, object]:\n    return {\n        \"size\": len(data),\n        \"sha256\": sha256(data).hexdigest(),\n        \"prefix_hex\": data[:sample_size].hex(),\n    }\n```\n\n十六进制前缀仍可能泄露内容，生产环境要根据数据分类决定是否保留。\n\n#### 本节练习：区分编码错误与字段错误\n\n准备三份测试数据：合法 UTF-8、含非法字节、字段数错误。\n解析器应产生三种不同结果，而不是统一返回空值。\n\n```python\ndef decode_status(data: bytes) -> tuple[str, str]:\n    text = data.decode(\"utf-8\")\n    return parse_status_line(text)\n\n\nassert decode_status(\"api-a\\tOK\\n\".encode()) == (\"api-a\", \"OK\")\n\nfor bad in (b\"api-a\\xffOK\\n\", b\"api-a OK\\n\"):\n    try:\n        decode_status(bad)\n    except (UnicodeDecodeError, ValueError) as exc:\n        print(type(exc).__name__, str(exc))\n```\n\n把异常分开，调用者才知道应该修正编码、修正字段协议，还是把问题交给上游系统。", "subs": ["文件读写显式声明编码", "解码失败时不要先用 errors=\"ignore\"", "bytes 和 str 不能随意混用", "换行、制表符和不可见字符也会破坏格式", "子进程输出也有编码边界", "建立可复现的乱码诊断记录", "本节练习：区分编码错误与字段错误"]}, {"title": "读到 JSON 或 YAML 后，为什么不能马上相信里面的数据？", "content": "JSON 或 YAML 解析成功，只说明文本符合序列化格式，不说明它符合业务约束。\n例如 `timeout` 可以存在，却是字符串 `\"forever\"`；目标列表可以是数组，却包含空主机名；动作可以是任意用户输入。\n\n可靠的入口通常分四步：\n\n1. 限制输入来源与大小。\n2. 用安全解析器转换语法。\n3. 验证类型、必需字段、取值范围和跨字段关系。\n4. 转成内部模型，后续代码不再反复猜测结构。\n\n#### JSON 解析错误需要携带位置\n\n```python\nimport json\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef load_json_file(path: Path, max_bytes: int = 1_000_000) -> Any:\n    size = path.stat().st_size\n    if size > max_bytes:\n        raise ValueError(f\"JSON file too large: {size} bytes\")\n\n    text = path.read_text(encoding=\"utf-8\")\n    try:\n        return json.loads(text)\n    except json.JSONDecodeError as exc:\n        raise ValueError(\n            f\"invalid JSON at line {exc.lineno}, column {exc.colno}: {exc.msg}\"\n        ) from exc\n```\n\n限制大小可以避免误读巨大日志或受到不受控输入拖垮内存。\n异常链 `from exc` 保留了原始原因，同时给 CLI 提供更贴近用户的错误信息。\n\n#### 用数据类建立内部边界\n\n```python\nfrom dataclasses import dataclass\nfrom typing import Any\n\n\n@dataclass(frozen=True, slots=True)\nclass Target:\n    host: str\n    port: int\n    timeout_seconds: float\n\n\ndef parse_target(raw: Any) -> Target:\n    if not isinstance(raw, dict):\n        raise ValueError(\"target must be an object\")\n\n    host = raw.get(\"host\")\n    port = raw.get(\"port\")\n    timeout = raw.get(\"timeout_seconds\", 3.0)\n\n    if not isinstance(host, str) or not host.strip():\n        raise ValueError(\"target.host must be a non-empty string\")\n    if isinstance(port, bool) or not isinstance(port, int):\n        raise ValueError(\"target.port must be an integer\")\n    if not 1 <= port <= 65535:\n        raise ValueError(\"target.port must be between 1 and 65535\")\n    if isinstance(timeout, bool) or not isinstance(timeout, (int, float)):\n        raise ValueError(\"target.timeout_seconds must be a number\")\n    if not 0.1 <= float(timeout) <= 60:\n        raise ValueError(\"target.timeout_seconds must be between 0.1 and 60\")\n\n    return Target(\n        host=host.strip().lower(),\n        port=port,\n        timeout_seconds=float(timeout),\n    )\n```\n\n注意 `bool` 是 `int` 的子类，所以只写 `isinstance(True, int)` 会意外接受布尔值作为端口。\n这种边角行为正是入口校验需要覆盖的地方。\n\n解析后的业务代码拿到的是 `Target`，不必到处写 `raw[\"host\"]`，也不必猜测超时是字符串还是数字。\n\n#### 汇总多个字段错误，而不是修一个报一个\n\n交互式 CLI 可以一次报告全部配置错误：\n\n```python\ndef validate_document(raw: object) -> list[str]:\n    errors: list[str] = []\n\n    if not isinstance(raw, dict):\n        return [\"document root must be an object\"]\n\n    targets = raw.get(\"targets\")\n    if not isinstance(targets, list):\n        return [\"targets must be an array\"]\n\n    if not targets:\n        errors.append(\"targets cannot be empty\")\n\n    for index, item in enumerate(targets):\n        try:\n            parse_target(item)\n        except ValueError as exc:\n            errors.append(f\"targets[{index}]: {exc}\")\n\n    return errors\n```\n\n外层结构完全错误时立即返回，避免产生几十条连锁噪声；独立目标错误则批量收集，减少用户反复修改配置的次数。\n\n#### YAML 必须使用安全加载方式\n\nYAML 能表达比 JSON 更复杂的类型，某些加载方式还可能构造任意 Python 对象。\n处理不受信任输入时，应使用所选库官方提供的安全加载 API，并锁定、审计依赖版本。\n\n以 PyYAML 为例：\n\n```python\nfrom pathlib import Path\nfrom typing import Any\n\nimport yaml\n\n\ndef load_yaml_file(path: Path) -> Any:\n    text = path.read_text(encoding=\"utf-8\")\n    return yaml.safe_load(text)\n```\n\n安全加载只解决对象构造风险，不替代业务校验。\nYAML 还存在容易误判的隐式类型、重复键处理和锚点扩展问题。\n如果配置不需要注释和复杂表达能力，JSON 可能是更窄、更容易审计的边界。\n\n#### 不要把 Secret 混入错误信息\n\n下面的调试写法会泄露整个配置：\n\n```python\n# 错误示例\nraise ValueError(f\"invalid config: {raw}\")\n```\n\n更稳妥的错误只指出字段路径和规则：\n\n```text\ntargets[2].timeout_seconds must be between 0.1 and 60\nauth.token is required\n```\n\n日志中也不要输出请求头、完整连接串或环境变量快照。\n第三册会建立统一的脱敏与审计字段。\n\n#### 明确未知字段的策略\n\n拼写错误最危险的表现是被静默忽略：\n\n```json\n{\n  \"host\": \"api-a\",\n  \"port\": 443,\n  \"timout_seconds\": 30\n}\n```\n\n如果程序忽略 `timout_seconds`，便会悄悄使用默认超时。\n关键配置应拒绝未知字段：\n\n```python\nALLOWED_TARGET_KEYS = {\"host\", \"port\", \"timeout_seconds\"}\n\n\ndef reject_unknown_keys(raw: dict[str, object]) -> None:\n    unknown = set(raw) - ALLOWED_TARGET_KEYS\n    if unknown:\n        names = \", \".join(sorted(unknown))\n        raise ValueError(f\"unknown target field(s): {names}\")\n```\n\n向后兼容要求较高时，也可以先告警再逐步收紧，但必须能观察到未知字段出现了多少次。\n\n#### 本节练习：从文档到可信模型\n\n测试至少覆盖以下输入：\n\n- 根节点不是对象。\n- 缺少 `targets`。\n- 目标列表为空。\n- 端口为 `true`、字符串、0 和 65536。\n- 超时为负数、极大数字和合法小数。\n- 出现拼错的未知字段。\n- 错误信息不包含 Token。\n\n期望的处理链可以表示为：\n\n```text\n文件字节\n  -> UTF-8 严格解码\n  -> JSON/YAML 安全语法解析\n  -> 文档级结构验证\n  -> 单项目标验证与规范化\n  -> Target 内部模型\n  -> 执行层\n```\n\n只要原始字典还在执行层到处流动，可信边界就没有真正建立起来。", "subs": ["JSON 解析错误需要携带位置", "用数据类建立内部边界", "汇总多个字段错误", "YAML 必须使用安全加载方式", "不要把 Secret 混入错误信息", "明确未知字段的策略", "本节练习：从文档到可信模型"]}, {"title": "日志文件太大放不进内存时，怎样边读边处理？", "content": "`read()` 和 `read_text()` 会一次性把整个文件载入内存。\n小配置这样最简单；数 GB 日志则应该逐行迭代，或按固定大小读取字节块。\n流式处理的目标不是“绝不占内存”，而是让内存与批次大小相关，而不是与全部输入大小相关。\n\n#### 文件对象本身就是可迭代对象\n\n```python\nfrom collections import Counter\nfrom pathlib import Path\n\n\ndef count_levels(path: Path) -> Counter[str]:\n    counts: Counter[str] = Counter()\n\n    with path.open(\"r\", encoding=\"utf-8\") as handle:\n        for line_number, line in enumerate(handle, start=1):\n            fields = line.rstrip(\"\\r\\n\").split(\"\\t\")\n            if len(fields) < 2:\n                print(f\"skip malformed line {line_number}\")\n                continue\n\n            level = fields[1]\n            counts[level] += 1\n\n    return counts\n```\n\n循环每次只保留当前行和计数器。\n输入再大，内存主要取决于不同级别的数量，而不是日志行数。\n\n如果任务已经变成二维表关联、时间窗口聚合或数值数组运算，Pandas 与 NumPy 可能显著减少实现成本；如果只是逐行筛选和计数，引入它们会增加安装体积与内存基线。\n先用代表性数据测量内存和耗时，再决定是否增加依赖；Notebook 中跑通的分析也要整理成模块、参数和回归测试后才能进入自动化。\n\n#### 用生成器把读取、解析和过滤拆开\n\n生成器函数包含 `yield`，调用时返回迭代器；每次请求下一个值时，它从上次暂停处继续。\n\n```python\nfrom collections.abc import Iterable, Iterator\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass LogEvent:\n    timestamp: str\n    level: str\n    message: str\n\n\ndef parse_events(lines: Iterable[str]) -> Iterator[LogEvent]:\n    for line_number, line in enumerate(lines, start=1):\n        fields = line.rstrip(\"\\r\\n\").split(\"\\t\", maxsplit=2)\n        if len(fields) != 3:\n            print(f\"skip line={line_number} reason=field_count\")\n            continue\n\n        timestamp, level, message = fields\n        yield LogEvent(timestamp, level, message)\n\n\ndef only_errors(events: Iterable[LogEvent]) -> Iterator[LogEvent]:\n    for event in events:\n        if event.level in {\"ERROR\", \"CRITICAL\"}:\n            yield event\n```\n\n组合时数据按需流动：\n\n```python\npath = Path(\"fixtures/agent.log\")\n\nwith path.open(\"r\", encoding=\"utf-8\") as handle:\n    for event in only_errors(parse_events(handle)):\n        print(event.timestamp, event.message)\n```\n\n读取层不关心错误级别，过滤层不关心文件如何打开，主流程负责资源生命周期。\n这种职责拆分也让每层可以用小型内存输入单独测试。\n\n#### 迭代器通常只能消费一次\n\n```python\nnumbers = (value for value in range(3))\n\nprint(list(numbers))  # [0, 1, 2]\nprint(list(numbers))  # []\n```\n\n如果既要统计又要输出，不能无意中先把同一生成器耗尽。\n可以在一次循环中同时完成两个动作，或明确把可接受大小的结果物化为列表。\n`itertools.tee()` 也能复制迭代视图，但缓存差距过大时仍可能占用大量内存。\n\n#### 批处理是在吞吐和资源之间设旋钮\n\n数据库或 API 往往适合按批写入。\nPython 标准库的新版本提供了若干分批工具，但为了兼容清晰，这里实现一个简单生成器：\n\n```python\nfrom collections.abc import Iterable, Iterator\nfrom itertools import islice\nfrom typing import TypeVar\n\n\nT = TypeVar(\"T\")\n\n\ndef batched(items: Iterable[T], size: int) -> Iterator[list[T]]:\n    if size < 1:\n        raise ValueError(\"batch size must be positive\")\n\n    iterator = iter(items)\n    while batch := list(islice(iterator, size)):\n        yield batch\n```\n\n```python\nwith Path(\"fixtures/agent.log\").open(\"r\", encoding=\"utf-8\") as handle:\n    events = parse_events(handle)\n    for batch in batched(events, size=500):\n        print(f\"would write {len(batch)} events\")\n```\n\n批次太小会增加请求次数，太大则增加内存、锁持有时间和失败重放范围。\n应通过压测和下游限制选取默认值，并允许在安全范围内配置。\n\n#### 坏行策略要明确\n\n流式任务运行数小时后才遇到坏行，应该停止还是跳过？\n答案取决于业务：\n\n| 策略 | 适用情况 | 必须补充的保护 |\n| --- | --- | --- |\n| 立即失败 | 配置迁移、账务、强一致导入 | 原子写入或事务、清楚的行号 |\n| 跳过继续 | 大规模日志分析、允许部分结果 | 错误计数、样本、失败阈值 |\n| 隔离坏行 | 后续要人工复核或重放 | 脱敏、独立权限、容量限制 |\n\n不能只有 `except Exception: continue`。\n至少要知道跳过多少条，并在比例超过阈值时让整个任务失败。\n\n```python\n@dataclass\nclass ParseStats:\n    total: int = 0\n    accepted: int = 0\n    rejected: int = 0\n\n\ndef rejection_rate(stats: ParseStats) -> float:\n    if stats.total == 0:\n        return 0.0\n    return stats.rejected / stats.total\n```\n\n#### 需要回看时保存检查点，而不是保存所有对象\n\n长任务可以记录已完成的文件、字节偏移或稳定事件 ID。\n检查点必须与输出提交顺序一致，否则恢复时可能漏数据。\n\n一个简化原则是：\n\n```text\n读取批次 -> 校验批次 -> 提交输出 -> 持久化检查点\n```\n\n如果先推进检查点再提交输出，进程在两者之间崩溃会造成永久遗漏。\n如果先提交输出再写检查点，恢复时可能重复，因此输出端还需要幂等键。\n第四册会完整讨论这一权衡。\n\n#### 本节练习：实现有失败预算的日志统计\n\n目标行为：\n\n- 逐行读取，不调用 `read()`。\n- 记录总行数、有效行和坏行。\n- 最多保存前 10 个坏行号，不保存原始敏感内容。\n- 坏行比例超过 1% 时返回非零退出码。\n- 空文件不出现除零错误。\n\n```python\nfrom dataclasses import dataclass, field\nfrom pathlib import Path\n\n\n@dataclass\nclass ScanReport:\n    total: int = 0\n    accepted: int = 0\n    rejected: int = 0\n    rejected_lines: list[int] = field(default_factory=list)\n\n\ndef scan_log(path: Path) -> ScanReport:\n    report = ScanReport()\n\n    with path.open(\"r\", encoding=\"utf-8\") as handle:\n        for line_number, line in enumerate(handle, start=1):\n            report.total += 1\n            try:\n                parse_status_line(line)\n            except ValueError:\n                report.rejected += 1\n                if len(report.rejected_lines) < 10:\n                    report.rejected_lines.append(line_number)\n            else:\n                report.accepted += 1\n\n    return report\n\n\ndef report_exit_code(report: ScanReport) -> int:\n    if report.total and report.rejected / report.total > 0.01:\n        return 2\n    return 0\n```\n\n验证时生成小型测试文件即可，不需要真的创建数 GB 数据。\n可用大量重复行模拟规模，再观察进程常驻内存是否随总行数持续增长。\n\n本章建立了外部输入的可信路径：字节先正确解码，结构化文本再做业务校验，大文件最后通过迭代器和批次保持资源有界。\n任何一步失败都应留下足够定位的信息，但不能泄露输入中的敏感内容。", "subs": ["文件对象本身就是可迭代对象", "用生成器把读取、解析和过滤拆开", "迭代器通常只能消费一次", "批处理是在吞吐和资源之间设旋钮", "坏行策略要明确", "需要回看时保存检查点", "本节练习：实现有失败预算的日志统计"]}]}, {"title": "第四章 · 让脚本既能跑通，也能在出错时说清原因", "sections": [{"title": "条件、循环和推导式，怎样写才不会把流程绕晕？", "content": "控制流的作用是把业务规则变成可以逐步验证的路径。\n代码行数少不等于容易理解；把过滤、转换、副作用和错误处理塞进一条表达式，通常只会让排障更慢。\n\n先用一句自然语言描述规则：\n\n> 只检查启用且属于生产环境的目标；维护中的目标记为跳过，其他目标执行检查。\n\n然后让代码保持相同顺序：\n\n```python\nfor target in targets:\n    if not target.enabled:\n        continue\n\n    if target.environment != \"prod\":\n        continue\n\n    if target.in_maintenance:\n        record_skipped(target, reason=\"maintenance\")\n        continue\n\n    run_check(target)\n```\n\n早退出减少嵌套层级。\n阅读者从上往下就能看到每个排除条件，不必在多个 `else` 中记忆状态。\n\n#### 先区分真假判断和精确状态判断\n\n空字符串、空容器、数字零和 `None` 都是假值，但业务含义可能不同。\n\n```python\nif timeout is None:\n    timeout = DEFAULT_TIMEOUT\n\nif timeout <= 0:\n    raise ValueError(\"timeout must be positive\")\n```\n\n若写成 `if not timeout`，缺省和非法零值会混在一起。\n对状态枚举也应显式比较，避免未来新增状态时被错误归入 `else`。\n\n```python\nfrom enum import StrEnum\n\n\nclass Health(StrEnum):\n    OK = \"ok\"\n    DEGRADED = \"degraded\"\n    FAILED = \"failed\"\n\n\ndef status_exit_code(health: Health) -> int:\n    match health:\n        case Health.OK:\n            return 0\n        case Health.DEGRADED:\n            return 1\n        case Health.FAILED:\n            return 2\n```\n\n`match` 适合对结构或明确状态分支。\n简单的两个条件仍用 `if` 更直观，不需要为了使用新语法而使用。\n\n#### 循环中明确跳过、停止和失败\n\n- `continue` 表示当前项目不再处理，继续下一项。\n- `break` 表示整个循环结束。\n- `return` 表示当前函数结束。\n- `raise` 表示当前路径无法正常完成，由上层决定处理。\n\n```python\ndef find_first_failed(results: list[CheckResult]) -> CheckResult | None:\n    for result in results:\n        if not result.ok:\n            return result\n    return None\n```\n\n如果任务要求收集所有失败，就不能在第一个失败处 `return`：\n\n```python\ndef collect_failed(results: list[CheckResult]) -> list[CheckResult]:\n    failed: list[CheckResult] = []\n    for result in results:\n        if not result.ok:\n            failed.append(result)\n    return failed\n```\n\n两个函数都正确，区别在于业务契约。\n写循环前先确认是 fail-fast、best-effort，还是达到失败阈值后停止。\n\n#### 推导式只承担一次清晰转换\n\n下面的推导式易读：\n\n```python\nfailed_names = [result.target for result in results if not result.ok]\n```\n\n下面的表达式混合了解析、过滤、网络调用和默认值，不适合作为“简洁”示范：\n\n```python\n# 不推荐：副作用和异常位置都难以观察\nstates = {\n    item[\"name\"]: fetch_state(item[\"url\"]) if item.get(\"enabled\") else \"disabled\"\n    for item in raw_items\n    if item.get(\"name\") and item.get(\"url\")\n}\n```\n\n把输入校验和外部调用展开后更容易加入日志、超时和失败结果：\n\n```python\nstates: dict[str, str] = {}\n\nfor item in raw_items:\n    name = item.get(\"name\")\n    url = item.get(\"url\")\n\n    if not isinstance(name, str) or not name:\n        continue\n    if not isinstance(url, str) or not url:\n        continue\n\n    if not item.get(\"enabled\", False):\n        states[name] = \"disabled\"\n        continue\n\n    states[name] = fetch_state(url)\n```\n\n#### `for ... else` 只在团队能读懂时使用\n\n循环的 `else` 会在没有触发 `break` 时执行：\n\n```python\nfor result in results:\n    if not result.ok:\n        print(f\"first failure: {result.target}\")\n        break\nelse:\n    print(\"all checks passed\")\n```\n\n它不是异常处理的 `else`，也不是与 `if` 配对。\n如果团队不熟悉，抽成函数并用提前返回往往更清楚。\n\n#### 避免用循环变量泄露业务状态\n\n循环结束后变量仍可能存在，但空输入时根本不会赋值：\n\n```python\n# 脆弱写法\nfor target in targets:\n    last_target = target\n\nprint(last_target)\n```\n\n需要最后一项时，应先验证输入或显式维护可空状态：\n\n```python\nlast_target: Target | None = None\n\nfor target in targets:\n    last_target = target\n\nif last_target is None:\n    print(\"no targets\")\nelse:\n    print(last_target.host)\n```\n\n#### 本节练习：把嵌套流程改成决策表\n\n为巡检目标定义以下规则：\n\n| enabled | environment | maintenance | 动作 |\n| --- | --- | --- | --- |\n| false | 任意 | 任意 | 忽略，不计入总数 |\n| true | 非 prod | 任意 | 忽略，不计入总数 |\n| true | prod | true | 记录 skipped |\n| true | prod | false | 执行检查 |\n\n先写表，再写四组测试输入，最后实现控制流。\n决策表能暴露条件遗漏，也能避免把复杂布尔表达式当成唯一事实来源。\n\n```python\ndef decide_target(target: TargetPolicy) -> str:\n    if not target.enabled:\n        return \"ignore\"\n    if target.environment != \"prod\":\n        return \"ignore\"\n    if target.in_maintenance:\n        return \"skip\"\n    return \"check\"\n```", "subs": ["先区分真假判断和精确状态判断", "循环中明确跳过、停止和失败", "推导式只承担一次清晰转换", "for ... else 只在团队能读懂时使用", "避免用循环变量泄露业务状态", "本节练习：把嵌套流程改成决策表"]}, {"title": "一段代码什么时候该拆成函数，参数和返回值又该怎样设计？", "content": "函数不是为了减少几行重复而存在。\n更重要的价值是给一段逻辑命名、建立输入输出边界、隔离副作用，并让失败可以独立测试。\n\n匿名函数 `lambda` 适合放在 `sorted(..., key=lambda item: item.name)` 这类短小、无副作用的键函数或回调位置。\n一旦表达式需要异常处理、多步判断、日志或复用，就改成有名字的 `def`；名字能承载业务含义，也让 traceback 和测试更容易理解。\n\n适合拆函数的信号包括：\n\n- 需要用一句注释解释“接下来做什么”。\n- 同一规则在两个入口重复出现。\n- 一段代码同时解析、校验、执行和格式化。\n- 测试某条分支必须启动整个程序。\n- 参数或局部状态多到很难判断依赖。\n- 错误信息无法说明失败属于哪个阶段。\n\n#### 从混合流程中找出阶段边界\n\n一个批量巡检 CLI 可以拆成：\n\n```text\nload_config\n  -> parse_targets\n  -> plan_checks\n  -> execute_checks\n  -> summarize_results\n  -> render_report\n  -> choose_exit_code\n```\n\n每个箭头都是可验证的契约。\n加载函数处理文件问题，解析函数处理数据问题，执行函数处理外部依赖，渲染函数不再发网络请求。\n\n#### 参数只传函数真正需要的内容\n\n把整个全局配置传给每个函数很方便，却隐藏依赖：\n\n```python\n# 依赖不透明\ndef check_target(target: Target, config: dict[str, object]) -> CheckResult:\n    ...\n```\n\n更清楚的签名会暴露超时和重试策略：\n\n```python\ndef check_target(\n    target: Target,\n    *,\n    timeout_seconds: float,\n    attempts: int,\n) -> CheckResult:\n    ...\n```\n\n星号后的参数只能按名称传入：\n\n```python\nresult = check_target(\n    target,\n    timeout_seconds=3.0,\n    attempts=2,\n)\n```\n\n调用位置不会出现含义不明的 `check_target(target, 3, 2)`。\n\n#### 返回结构化结果，不要同时打印和决定退出\n\n底层函数直接 `print()` 会让测试依赖终端文本，也让 JSON 输出和日志输出难以复用。\n\n```python\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True, slots=True)\nclass CheckResult:\n    target: str\n    ok: bool\n    latency_ms: float | None\n    message: str\n\n\ndef summarize(results: list[CheckResult]) -> dict[str, int]:\n    passed = sum(1 for result in results if result.ok)\n    failed = len(results) - passed\n    return {\"total\": len(results), \"passed\": passed, \"failed\": failed}\n```\n\n表现层再决定输出格式：\n\n```python\nimport json\nfrom typing import TextIO\n\n\ndef write_json_summary(summary: dict[str, int], stream: TextIO) -> None:\n    json.dump(summary, stream, ensure_ascii=False, sort_keys=True)\n    stream.write(\"\\n\")\n```\n\n测试可以传入 `io.StringIO`，CLI 可以传 `sys.stdout`，文件导出可以传已打开的文件句柄。\n\n#### 不要用特殊返回值隐藏失败\n\n返回 `None`、空列表还是异常，取决于结果语义：\n\n- “没有匹配项目”是正常结果，可以返回空列表。\n- “可选缓存没有命中”可以返回 `None`。\n- “配置缺少必需字段”不是正常结果，应抛出明确异常。\n- “单台目标不可达”在批量巡检中可以建模为 `CheckResult(ok=False)`。\n- “整个认证配置无效”会影响全部目标，应终止批次。\n\n```python\ndef lookup_optional_owner(host: str, owners: dict[str, str]) -> str | None:\n    return owners.get(host)\n\n\ndef require_token(env: dict[str, str]) -> str:\n    token = env.get(\"OPS_API_TOKEN\")\n    if not token:\n        raise ConfigError(\"OPS_API_TOKEN is required\")\n    return token\n```\n\n#### 函数应保持一个抽象层级\n\n下面的主流程混入了协议细节：\n\n```python\ndef run() -> int:\n    # 如果这里同时出现 open、json.loads、socket、重试循环、ANSI 颜色，\n    # 调用流程就很难一眼读懂。\n    ...\n```\n\n更理想的主流程像一份可执行目录：\n\n```python\ndef run(options: Options) -> int:\n    config = load_and_validate_config(options.config_path)\n    plan = build_check_plan(config, options)\n    results = execute_plan(plan)\n    write_report(results, options.output_format)\n    return exit_code_for(results)\n```\n\n细节并没有消失，只是进入名字与职责匹配的函数。\n如果某个函数仍有几十个条件和多种外部副作用，就继续沿阶段边界拆分，而不是机械限制行数。\n\n#### 谨慎使用位置可变参数和任意关键字\n\n`*args`、`**kwargs` 适合框架适配或薄包装，不适合掩盖不稳定接口。\n\n```python\n# 调用者不知道支持哪些键\ndef run_check(target: str, **options: object) -> CheckResult:\n    ...\n```\n\n对于业务入口，显式参数、数据类或 `TypedDict` 更容易被编辑器、类型检查器和评审者理解。\n\n#### 纯函数与副作用外壳\n\n纯函数只由输入决定输出，不读时钟、不访问网络、不修改外部状态。\n运维工具不可能完全没有副作用，但可以把副作用压到边缘：\n\n```python\ndef build_curl_arguments(url: str, timeout_seconds: float) -> list[str]:\n    if not url.startswith((\"http://\", \"https://\")):\n        raise ValueError(\"unsupported URL scheme\")\n    return [\n        \"curl\",\n        \"--fail\",\n        \"--silent\",\n        \"--show-error\",\n        \"--max-time\",\n        str(timeout_seconds),\n        url,\n    ]\n```\n\n参数构造可以纯测试；真正执行命令的薄层统一处理退出码和超时。\n但能用 HTTP 客户端库时，不必绕到 `curl`，示例只用于说明分层。\n\n#### 本节练习：给函数写契约测试\n\n为 `parse_target()` 写出契约：\n\n- 输入必须是映射。\n- 主机名会去除两端空白并转小写。\n- 端口只接受 1 到 65535 的整数，不接受布尔值。\n- 超时有默认值且被转成浮点数。\n- 输入字典不会被修改。\n\n```python\nraw = {\"host\": \" API-A \", \"port\": 443}\nbefore = raw.copy()\n\ntarget = parse_target(raw)\n\nassert target.host == \"api-a\"\nassert target.port == 443\nassert target.timeout_seconds == 3.0\nassert raw == before\n```\n\n函数签名、返回类型和失败类型共同构成契约。\n文档说明意图，类型提示降低误用，测试验证真正行为，三者不能相互替代。", "subs": ["从混合流程中找出阶段边界", "参数只传函数真正需要的内容", "返回结构化结果", "不要用特殊返回值隐藏失败", "函数应保持一个抽象层级", "谨慎使用位置可变参数和任意关键字", "纯函数与副作用外壳", "本节练习：给函数写契约测试"]}, {"title": "异常应该在哪里捕获，什么时候又应该让它继续抛出？", "content": "异常表示当前代码无法按原定路径完成。\n捕获异常的前提是这一层知道如何恢复、转换、补充上下文，或把它变成明确的用户结果。\n如果只会把异常吞掉，就不应该捕获。\n\n#### 只包住可能失败的最小范围\n\n```python\ntry:\n    raw = path.read_text(encoding=\"utf-8\")\nexcept FileNotFoundError as exc:\n    raise ConfigError(f\"config file not found: {path}\") from exc\nexcept PermissionError as exc:\n    raise ConfigError(f\"cannot read config file: {path}\") from exc\n\nconfig = parse_config(raw)\nplan = build_plan(config)\n```\n\n若把后面所有逻辑都放进同一个 `try`，一个编程错误也可能被误报为“读取配置失败”。\n异常范围越精确，错误上下文越可信。\n\n#### 捕获具体异常，而不是裸 `except`\n\n```python\n# 不推荐\ntry:\n    run_check(target)\nexcept:\n    return CheckResult(target, False, None, \"failed\")\n```\n\n裸捕获还会接住 `KeyboardInterrupt`、`SystemExit` 等控制流程异常。\n即使写 `except Exception`，也可能掩盖 `NameError`、`AttributeError` 这类代码缺陷。\n\n批量任务可以在单项目标边界捕获预期的外部失败：\n\n```python\nclass CheckTimeout(Exception):\n    pass\n\n\nclass TargetUnavailable(Exception):\n    pass\n\n\ndef execute_one(target: Target) -> CheckResult:\n    try:\n        latency = probe(target)\n    except CheckTimeout:\n        return CheckResult(target.host, False, None, \"timeout\")\n    except TargetUnavailable as exc:\n        return CheckResult(target.host, False, None, str(exc))\n\n    return CheckResult(target.host, True, latency, \"reachable\")\n```\n\n未知异常继续抛出，让测试或顶层错误处理发现程序缺陷。\n\n#### 用异常链保留根因\n\n```python\nclass ConfigError(Exception):\n    \"\"\"Configuration cannot be loaded or validated.\"\"\"\n\n\ndef load_config(path: Path) -> dict[str, object]:\n    try:\n        text = path.read_text(encoding=\"utf-8\")\n        raw = json.loads(text)\n    except OSError as exc:\n        raise ConfigError(f\"cannot read {path}\") from exc\n    except json.JSONDecodeError as exc:\n        raise ConfigError(\n            f\"invalid JSON in {path}:{exc.lineno}:{exc.colno}\"\n        ) from exc\n\n    if not isinstance(raw, dict):\n        raise ConfigError(\"config root must be an object\")\n    return raw\n```\n\n`raise ... from exc` 让 traceback 同时显示业务上下文和底层原因。\n顶层 CLI 可以给普通用户显示简洁错误，在调试模式输出完整异常链。\n\n#### `else` 和 `finally` 各自解决什么问题\n\n`try` 的 `else` 只在没有异常时运行，适合把可能抛错的范围缩小。\n`finally` 无论成功失败都会执行，适合释放本层拥有的资源。\n\n```python\nlock = acquire_lock()\n\ntry:\n    result = perform_change()\nexcept ExpectedOperationError as exc:\n    record_failure(exc)\n    raise\nelse:\n    record_success(result)\nfinally:\n    lock.release()\n```\n\n文件和锁若支持上下文管理器，优先用 `with`，它会把清理协议封装得更稳妥。\n不要在 `finally` 中 `return`，否则可能覆盖原异常。\n\n#### 重试不是普通异常处理\n\n只有短暂性失败才可能适合重试，例如连接瞬断、服务端 503 或明确的限流响应。\n认证失败、参数错误和数据校验失败通常不会因为再试一次而恢复。\n\n一个安全重试策略至少定义：\n\n- 哪些异常或状态允许重试。\n- 最大尝试次数。\n- 每次尝试的超时。\n- 退避和抖动。\n- 整体时间预算。\n- 操作是否幂等。\n- 最终失败如何记录。\n\n```python\nimport random\nimport time\nfrom collections.abc import Callable\nfrom typing import TypeVar\n\n\nR = TypeVar(\"R\")\n\n\ndef retry_transient(\n    operation: Callable[[], R],\n    *,\n    attempts: int = 3,\n    base_delay: float = 0.2,\n) -> R:\n    if attempts < 1:\n        raise ValueError(\"attempts must be positive\")\n\n    for attempt in range(1, attempts + 1):\n        try:\n            return operation()\n        except TargetUnavailable:\n            if attempt == attempts:\n                raise\n\n            delay = base_delay * (2 ** (attempt - 1))\n            delay += random.uniform(0, delay * 0.2)\n            time.sleep(delay)\n\n    raise AssertionError(\"unreachable\")\n```\n\n这仍是教学版本。\n生产代码还要支持取消、总截止时间、可注入睡眠函数和结构化日志。\n不要对创建用户、扩容、重启等非幂等动作盲目套重试。\n\n#### 顶层把异常映射为稳定退出码\n\n```python\nimport sys\n\n\nEXIT_OK = 0\nEXIT_FINDINGS = 1\nEXIT_USAGE = 2\nEXIT_RUNTIME = 3\n\n\ndef main() -> int:\n    try:\n        options = parse_options()\n        return run(options)\n    except ConfigError as exc:\n        print(f\"configuration error: {exc}\", file=sys.stderr)\n        return EXIT_USAGE\n    except KeyboardInterrupt:\n        print(\"interrupted\", file=sys.stderr)\n        return 130\n    except Exception:\n        logger.exception(\"unexpected failure\")\n        return EXIT_RUNTIME\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n```\n\n顶层可以设置最后一道保护，但意外异常必须记录 traceback，不能只输出“失败”。\n库函数不应直接 `sys.exit()`，否则调用者和测试无法决定恢复策略。\n\n#### 失败结果与异常要分层\n\n批量巡检中，单台主机不可达是预期业务结果；配置读不到则使任务无法开始；代码访问不存在属性则是缺陷。\n\n| 情况 | 表达方式 | 谁处理 |\n| --- | --- | --- |\n| 单目标超时 | `CheckResult(ok=False)` | 汇总层 |\n| 配置无效 | `ConfigError` | CLI 顶层 |\n| 用户中断 | `KeyboardInterrupt` / 信号 | 生命周期边界 |\n| 编程错误 | 原异常和 traceback | 测试、监控、维护者 |\n\n如果把所有情况都变成 `False`，调用者无法决定退出码、重试和告警级别。\n\n#### 本节练习：验证四条失败路径\n\n为批量巡检入口准备四个实验：\n\n1. 配置文件不存在，预期退出码为用法错误且 stderr 不含 traceback。\n2. 单台目标超时，其他目标仍执行，最终报告包含失败目标。\n3. 用户中断，预期退出码为 130，并停止接收新任务。\n4. 工作函数发生 `AttributeError`，预期记录完整 traceback 并返回运行时错误。\n\n输出示例：\n\n```text\n$ ops-check --config missing.json\nconfiguration error: config file not found: missing.json\n$ echo $?\n2\n```\n\n测试不仅断言文本，还应断言退出码、已执行目标数和是否留下临时文件。\n\n#### 第一册收束：能够解释，才算掌握\n\n完成第一册后，读者应能对一段 Python 运维脚本回答：\n\n- 解释器与依赖环境从哪里确定。\n- 每个变量指向什么类型的数据，哪里可能原地修改。\n- 外部字节如何解码，结构化输入在哪里完成校验。\n- 大文件是否流式处理，内存上限由什么控制。\n- 条件分支对应哪条业务规则。\n- 函数的输入、输出、副作用和异常分别是什么。\n- 单目标失败、任务级失败和程序缺陷如何区分。\n- 自动化系统能依据哪个退出码判断结果。\n\n可以用下面的最小检查表审查练习代码：\n\n```text\n[ ] 输入边界有编码、大小和结构校验\n[ ] 可变数据的所有权清楚\n[ ] 主流程能按阶段读出来\n[ ] 底层函数不随意 print 或 sys.exit\n[ ] 捕获的是预期的具体异常\n[ ] 未知异常保留 traceback\n[ ] 输出与退出码都能被测试\n[ ] 示例不依赖真实生产凭证和主机\n```\n\n这些基础不是为了手写所有代码，而是为了让你能审查生成代码、定位失败并为生产动作承担责任。\n第二册将在这个语言边界之上，真正连接路径、文件、系统命令、CLI、HTTP API 与并发任务。\n\n#### 第一册自测：不用运行代码，先预测结果\n\n读下面每段代码，先写下输出或异常，再用独立临时文件验证。\n\n```python\nitems = [\"api-a\"]\nalias = items\ncopied = items.copy()\nalias.append(\"db-a\")\n\nprint(items)\nprint(copied)\nprint(alias is items)\nprint(copied is items)\n```\n\n应能解释赋值、浅拷贝、值相等和身份相同的区别。\n\n```python\ntemplate = {\"labels\": {\"env\": \"prod\"}}\nfirst = template.copy()\nsecond = template.copy()\nfirst[\"labels\"][\"role\"] = \"api\"\n\nprint(second)\n```\n\n应能指出共享发生在内层字典，并给出显式复制边界。\n\n```python\ndef remember(value: str, values: list[str] = []) -> list[str]:\n    values.append(value)\n    return values\n\n\nprint(remember(\"a\"))\nprint(remember(\"b\"))\n```\n\n应能解释默认对象何时创建，并改用 `None` 哨兵。\n\n```python\nraw = {\"timeout\": 0}\ntimeout = raw.get(\"timeout\") or 3\nprint(timeout)\n```\n\n应能判断输出为何不是 0，并区分缺失与合法假值。\n\n```python\nrecords = (\n    {\"host\": \"api-a\", \"ports\": [80]},\n)\nrecords[0][\"ports\"].append(443)\nprint(records)\n```\n\n应能解释元组固定的是槽位，而不是递归冻结成员。\n\n```python\nstream = (number * 2 for number in range(3))\nprint(sum(stream))\nprint(list(stream))\n```\n\n应能说明迭代器为何第二次为空，并提出只遍历一次的汇总设计。\n\n```python\ntry:\n    raise ValueError(\"bad input\")\nexcept Exception as exc:\n    wrapped = ConfigError(\"cannot load\")\n    wrapped.__cause__ = exc\n    raise wrapped\n```\n\n应能用更自然的 `raise ConfigError(...) from exc` 保留异常链。\n\n```python\ndef classify(value: object) -> str:\n    if not value:\n        return \"missing\"\n    if isinstance(value, int):\n        return \"number\"\n    return \"other\"\n\n\nprint(classify(False))\nprint(classify(0))\nprint(classify(None))\n```\n\n应能发现三个不同输入被合并，并根据业务改成精确判断。\n\n每段练习都记录四项：预测、实际、机制解释、运维风险。\n只得到正确输出但解释不出原因，说明知识仍停留在记忆层面。", "subs": ["只包住可能失败的最小范围", "捕获具体异常", "用异常链保留根因", "else 和 finally 各自解决什么问题", "重试不是普通异常处理", "顶层把异常映射为稳定退出码", "失败结果与异常要分层", "本节练习：验证四条失败路径", "第一册收束：能够解释，才算掌握", "第一册自测：不用运行代码，先预测结果"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>

      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
