<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

    <button class="diagram-close" id="diagram-close" title="关闭">×</button>

  <div class="diagram-body" id="diagram-body">
    <div class="diagram-canvas" id="diagram-canvas">
      <div class="diagram-inner" id="diagram-inner"></div>
    </div>
  </div>

<script id="data" type="application/json">{"title": "Python 运维自动化与工程实践 · 第三册：工程质量与运行环境", "intro": "", "parts": [{"title": "第十章 · 让项目离开你的电脑也能正常运行", "sections": [{"title": "单个 `.py` 文件越来越乱时，项目应该怎样拆开？", "content": "单文件能快速验证想法，但当参数解析、配置、HTTP、并发和输出互相穿插时，修改一处就可能影响所有路径。\n拆分目标不是让文件数量变多，而是让依赖方向清楚。\n\n```mermaid\nflowchart LR\n    A[CLI 入口] --> B[应用编排]\n    B --> C[领域规则]\n    B --> D[文件适配器]\n    B --> E[HTTP 适配器]\n    B --> F[报告适配器]\n```\n\n箭头表示依赖方向：入口和外部适配器可以依赖稳定规则，规则不应反向导入 CLI、网络客户端或终端渲染。\n\n```text\npython-for-ops-check/\n├── pyproject.toml\n├── README.md\n├── src/\n│   └── ops_check/\n│       ├── __init__.py\n│       ├── cli.py\n│       ├── config.py\n│       ├── domain.py\n│       ├── executor.py\n│       ├── inventory.py\n│       └── report.py\n└── tests/\n    ├── test_config.py\n    ├── test_executor.py\n    └── test_report.py\n```\n\n`domain.py` 放稳定数据模型，`config.py` 建立输入边界，`executor.py` 管理执行，`report.py` 只负责表现，`cli.py` 组合它们。\n\n#### 依赖从外向内，不让核心反向依赖 CLI\n\n```text\nCLI / HTTP / 文件适配器\n          |\n          v\n      应用流程\n          |\n          v\n     领域模型与规则\n```\n\n领域函数不导入 argparse、HTTPX 或终端颜色库。\n这样规则可以在内存中测试，也能被未来的 Worker 或 Web API 复用。\n\n#### 模块名表达职责\n\n避免 `utils.py`、`helpers.py` 最终变成无边界仓库。\n函数若处理配置，就放配置模块；若提供跨模块通用时间抽象，可以命名 `clock.py` 并保持接口窄。\n\n#### 导入不应产生运行副作用\n\n```python\n# 不推荐：import 时立即读取文件和访问网络\nCONFIG = load_config(Path(\"config.json\"))\nCLIENT = httpx.Client()\n```\n\n模块导入应主要定义类型、函数和常量。\n资源在 `main()` 或应用工厂中创建，并通过参数传入。\n\n遇到“本机能导入、CI 不能导入”时，先记录 `sys.executable`、`sys.path`、当前目录和实际安装包位置，再检查是否存在与包同名的脚本。\n不要用修改 `PYTHONPATH` 或 `sys.path.insert()` 掩盖错误布局；应从仓库外执行 wheel 安装 smoke，证明导入来自分发产物。\n\n#### `__main__` 保持薄\n\n```python\nfrom .cli import main\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n```\n\n真正逻辑在可导入函数中，测试无需启动子进程。\n\n#### 本节练习\n\n把第二册的单文件工具拆成上述结构，并画出每个模块导入谁。\n若出现 `domain -> cli` 或两个模块互相导入，重新检查边界。\n拆分前后运行同一组行为测试，证明只是重构，没有改变输出协议。", "subs": ["依赖从外向内", "模块名表达职责", "导入不应产生运行副作用", "__main__ 保持薄", "本节练习"]}, {"title": "怎样让同事安装出与你一致的 Python 和依赖环境？", "content": "“在我电脑能跑”通常隐藏了 Python 小版本、系统库、依赖解析结果和环境变量差异。\n项目需要声明要求，并提供可复现安装路径。\n\n#### 虚拟环境隔离项目依赖\n\n```bash\npython3 -m venv .venv\nsource .venv/bin/activate\npython -m pip install --upgrade pip\npython -m pip install -e .\n```\n\nWindows 激活命令不同；自动化中可以直接调用 `.venv` 内解释器，不必依赖 shell 激活。\n虚拟环境不是容器，也不会隔离系统内核和外部命令版本。\n\n#### 用 `pyproject.toml` 声明项目\n\n```toml\n[build-system]\nrequires = [\"hatchling\"]\nbuild-backend = \"hatchling.build\"\n\n[project]\nname = \"ops-check\"\nversion = \"0.1.0\"\nrequires-python = \">=3.12\"\nlicense = \"MIT\"\ndependencies = [\n  \"httpx>=0.27,<1\",\n]\n\n[dependency-groups]\ndev = [\n  \"pytest>=8,<9\",\n  \"ruff>=0.6,<1\",\n]\n\n[project.scripts]\nops-check = \"ops_check.cli:main\"\n```\n\n`license` 使用 SPDX 表达式字符串；需要把许可证文件纳入分发包时，再声明 `license-files` 并检查构建后 wheel 和 sdist 的实际内容。\n字段和现代打包方式应以 [Python Packaging User Guide](https://packaging.python.org/en/latest/guides/writing-pyproject-toml/) 为准。\n入口点安装后提供 `ops-check` 命令，不再要求用户知道源码路径。\n\n#### 版本范围与锁文件解决不同问题\n\n项目元数据声明兼容范围，锁文件记录某次解析出的具体版本和摘要。\n应用通常应提交锁文件，让 CI 与部署解析同一依赖图；可复用库则需避免把依赖钉死到只适合本机的组合。\n\n使用 uv 时，创建项目、同步环境和锁定行为以 [uv 官方项目文档](https://docs.astral.sh/uv/guides/projects/) 为准：\n\n```bash\nuv sync --locked\nuv run ops-check --help\n```\n\nuv 默认会同步默认依赖组，因此这里把测试和质量工具放进 `dependency-groups.dev`；项目 extras 不会仅因为存在就自动同步。\n`--locked` 的目的，是锁文件与项目声明不一致时失败，而不是在部署时悄悄重新解析。\n\n#### Python 版本也要锁定在执行入口\n\nREADME、CI、容器镜像和 `requires-python` 应一致。\n启动时可记录解释器版本，但不要用运行时警告替代安装约束。\n\n#### 本节练习\n\n在全新临时目录或干净容器中，仅根据仓库文件完成安装并运行：\n\n```text\nops-check --help\nops-check validate --config tests/fixtures/valid.json\npython -m pytest\n```\n\n记录 Python 版本、锁文件状态和实际命令；本机已有环境成功不算可复现验证。\n\n#### 第三册综合实验：建立可以在干净环境重现的质量门禁\n\n这一实验把第二册的 `ops-check` 代码放进标准项目。\n以下版本号只是结构示例，真正采用时要根据当前官方兼容范围和锁文件决定。\n\n项目元数据：\n\n```toml\n[build-system]\nrequires = [\"hatchling>=1.27\"]\nbuild-backend = \"hatchling.build\"\n\n[project]\nname = \"ops-check-lab\"\nversion = \"0.1.0\"\ndescription = \"A bounded localhost operations checker\"\nreadme = \"README.md\"\nrequires-python = \">=3.12\"\nlicense = \"MIT\"\nlicense-files = [\"LICENSE*\"]\nauthors = [\n  {name = \"Operations Team\"},\n]\ndependencies = [\n  \"httpx>=0.27,<1\",\n]\n\n[dependency-groups]\ndev = [\n  \"build>=1.2,<2\",\n  \"mypy>=1.11,<2\",\n  \"pytest>=8,<9\",\n  \"pytest-cov>=5,<7\",\n  \"ruff>=0.6,<1\",\n]\n\n[project.scripts]\nops-check = \"ops_check.cli:main\"\n\n[tool.hatch.build.targets.wheel]\npackages = [\"src/ops_check\"]\n\n[tool.pytest.ini_options]\naddopts = [\n  \"--strict-config\",\n  \"--strict-markers\",\n  \"--showlocals\",\n]\ntestpaths = [\"tests\"]\n\n[tool.coverage.run]\nbranch = true\nsource = [\"ops_check\"]\n\n[tool.coverage.report]\nshow_missing = true\nskip_covered = true\nfail_under = 85\n\n[tool.mypy]\npython_version = \"3.12\"\nstrict = true\nfiles = [\"src\", \"tests\"]\nwarn_unreachable = true\n\n[tool.ruff]\ntarget-version = \"py312\"\nline-length = 100\nsrc = [\"src\", \"tests\"]\n\n[tool.ruff.lint]\nselect = [\n  \"E\",\n  \"F\",\n  \"I\",\n  \"B\",\n  \"UP\",\n  \"SIM\",\n  \"RUF\",\n]\n\n[tool.ruff.lint.per-file-ignores]\n\"tests/**/*.py\" = [\"S101\"]\n\n[tool.ruff.format]\nquote-style = \"double\"\nindent-style = \"space\"\nline-ending = \"lf\"\n```\n\n`fail_under` 是团队门槛，不是通用真理。\n高覆盖率也可能只覆盖无意义分支；评审仍要确认关键失败路径是否存在测试。\n\n\n#### 包入口和版本边界\n\n```python\n# src/ops_check/__init__.py\n\"\"\"Bounded operations checks.\"\"\"\n\nfrom importlib.metadata import PackageNotFoundError, version\n\n\ntry:\n    __version__ = version(\"ops-check-lab\")\nexcept PackageNotFoundError:\n    __version__ = \"0+uninstalled\"\n\n\n__all__ = [\"__version__\"]\n```\n\n```python\n# src/ops_check/__main__.py\nfrom .cli import main\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n```\n\n`python -m ops_check` 与安装后的 `ops-check` 应进入同一个 `main()`，避免两个入口行为漂移。", "subs": ["虚拟环境隔离项目依赖", "用 pyproject", "版本范围与锁文件解决不同问题", "Python 版本也要锁定在执行入口", "本节练习", "第三册综合实验", "包入口和版本边界"]}, {"title": "升级一个依赖之前，怎样知道它不会悄悄破坏工具？", "content": "依赖升级可能改变 API、默认超时、异常类型、传递依赖、最低 Python 版本和安全属性。\n“安装成功”只证明解析器找到了一个组合。\n\n#### 升级前先知道为什么依赖它\n\n记录直接依赖的用途、所有者、版本范围和替代方案。\n通过依赖树区分直接依赖与传递依赖，避免删除一个看似没 import 的构建依赖。\n\n#### 一次升级保持范围可审查\n\n```text\n1. 阅读官方发行说明和迁移说明\n2. 更新单个直接依赖或一个相关依赖组\n3. 刷新锁文件并检查差异\n4. 运行静态检查与完整测试\n5. 运行 localhost 集成测试\n6. 构建并在干净环境安装产物\n7. 小范围运行并观察指标\n```\n\n锁文件差异若带来大量不相关版本变化，应先解释解析原因。\n\n#### 对关键外部行为写契约测试\n\n```python\ndef test_timeout_is_classified(fake_server):\n    result = check_url(fake_server.url(\"/slow\"), timeout_seconds=0.05)\n    assert result.ok is False\n    assert result.category == \"timeout\"\n```\n\n这比断言库内部函数被调用更能防住升级回归。\n\n#### 安全修复也需要测试与发布计划\n\n高危漏洞可能要求加速升级，但跳过行为验证会把安全风险换成可用性风险。\n若暂时无法升级，应记录受影响路径、临时缓解、负责人和截止日期，而不是永久忽略扫描结果。\n\n#### 依赖证据要能回答代码最终从哪里来\n\n锁文件解决解析结果，不自动证明下载源、构建后内容与生产安装完全一致。\n一次候选发布至少串起四个对象：项目声明、锁文件、构建产物和部署环境中的实际版本。\n\n```mermaid\nflowchart LR\n    A[项目声明] --> B[锁文件]\n    B --> C[wheel 与 sdist]\n    C --> D[产物摘要]\n    D --> E[候选安装]\n    E --> F[运行时版本清单]\n```\n\n升级评审可以固定为下面的记录：\n\n```text\n直接依赖：\n升级原因：功能 安全 兼容 维护\n旧版本与新版本：\n新增或移除的传递依赖：\n上游变更说明：\n受影响的公开契约：\n锁文件差异：\nwheel 摘要：\n许可证变化：\n本地回归：\nlocalhost 集成：\n候选环境验证：\ncanary 指标：\n回退触发：\n仍未验证：\n```\n\n运行时清单应从当前解释器读取，而不是复制锁文件：\n\n```python\nfrom __future__ import annotations\n\nimport importlib.metadata\nimport json\nfrom pathlib import Path\n\n\ndef installed_distributions() -> list[dict[str, str]]:\n    packages = []\n    for distribution in importlib.metadata.distributions():\n        name = distribution.metadata.get(\"Name\")\n        if not name:\n            continue\n        packages.append(\n            {\n                \"name\": name,\n                \"version\": distribution.version,\n            }\n        )\n    return sorted(packages, key=lambda item: item[\"name\"].casefold())\n\n\ndef write_runtime_inventory(path: Path) -> None:\n    payload = {\n        \"schema_version\": 1,\n        \"packages\": installed_distributions(),\n    }\n    path.write_text(\n        json.dumps(payload, indent=2, sort_keys=True) + \"\\n\",\n        encoding=\"utf-8\",\n    )\n```\n\n这份清单不是完整 SBOM，也不包含系统库和容器基础层；它能证明目标解释器实际看见哪些 Python distribution。\n如果项目有供应链合规要求，应由构建系统生成标准化 SBOM、签名和来源证明，并在部署时校验摘要。\n\n依赖扫描结果还要判断漏洞路径是否可达、是否存在临时缓解以及何时复查。\n“扫描无告警”不证明业务安全，“存在 CVE”也不意味着可以不经测试直接替换生产依赖；两者都要进入带负责人和截止时间的风险决策。\n\n#### 本章检查点\n\n```text\n[ ] 核心模块不依赖 CLI 与具体外部 SDK\n[ ] import 不创建客户端或读取生产配置\n[ ] Python 版本、项目元数据和锁文件一致\n[ ] 干净环境可安装并运行入口点\n[ ] 依赖升级有锁文件审查、契约测试和回退办法\n```", "subs": ["升级前先知道为什么依赖它", "一次升级保持范围可审查", "对关键外部行为写契约测试", "安全修复也需要测试与发布计划", "依赖证据要能回答代码最终从哪里来", "本章检查点"]}]}, {"title": "第十一章 · 配置要能变化，凭证和操作却不能失控", "sections": [{"title": "默认值、配置文件、环境变量和 Secret 应该怎样分工？", "content": "第三册把第二册的配置优先级提升为项目级契约。\n默认值用于安全且通用的行为，配置文件用于非敏感环境差异，环境变量用于部署覆盖，Secret 由专门机制注入。\n\n```mermaid\nflowchart LR\n    A[安全默认值] --> E[候选配置]\n    B[配置文件] --> E\n    C[环境变量] --> E\n    D[CLI 参数] --> E\n    E --> F[类型转换]\n    F --> G[集中校验]\n    G --> H[带来源的模型]\n```\n\n优先级只解决“听谁的”，类型转换与集中校验才解决“能不能执行”。高优先级来源给出非法值时应失败，不能静默退回低优先级值。\n\n#### 默认值应安全而不是方便\n\n```python\nDEFAULT_TIMEOUT = 3.0\nDEFAULT_CONCURRENCY = 8\nDEFAULT_DRY_RUN = True\n```\n\n破坏性动作默认关闭，高并发默认受限，网络调用默认有超时。\n不能提供安全默认的必需项，例如 API 地址或身份，缺失时应失败。\n\n#### 配置模型集中校验\n\n```python\n@dataclass(frozen=True)\nclass Settings:\n    api_url: str\n    timeout_seconds: float\n    concurrency: int\n    token: str\n\n\ndef load_settings(cli: CliOptions, env: Mapping[str, str], raw: object) -> Settings:\n    # 合并、类型转换、范围校验和未知字段检查集中在这里。\n    ...\n```\n\n不要让模块各自读取 `os.environ`，否则测试无法看出依赖，配置优先级也会分裂。\n\n#### Secret 只在需要的生命周期内存在\n\n不要写进 Git、示例配置、命令行参数、异常和缓存文件。\n客户端初始化需要 Token 时传入，日志只记录凭证来源和标识的非敏感部分。\n\n#### 配置重载要定义一致性\n\n长进程若支持热重载，应先完整解析新配置，再一次替换内存快照。\n解析失败继续使用旧版本并告警，不能留下半新半旧字段。\n危险策略变化是否允许热更新，应由权限与审计要求决定。\n\n#### 本节练习\n\n测试缺少 Secret、空 Secret、配置文件误含 Secret、环境覆盖、非法并发和热重载失败。\n断言错误消息与捕获日志中都不存在实际 Token。\n\n#### 配置来源需要携带 provenance\n\n```python\nfrom dataclasses import dataclass\nfrom enum import StrEnum\nfrom typing import Generic, TypeVar\n\n\nT = TypeVar(\"T\")\n\n\nclass Source(StrEnum):\n    DEFAULT = \"default\"\n    FILE = \"file\"\n    ENVIRONMENT = \"environment\"\n    CLI = \"cli\"\n\n\n@dataclass(frozen=True, slots=True)\nclass Sourced(Generic[T]):\n    value: T\n    source: Source\n\n\n@dataclass(frozen=True, slots=True)\nclass EffectiveSettings:\n    concurrency: Sourced[int]\n    timeout_seconds: Sourced[float]\n    output: Sourced[str]\n    token: Sourced[str]\n```\n\n```python\ndef choose(\n    cli_value: T | None,\n    environment_value: T | None,\n    file_value: T | None,\n    default_value: T,\n) -> Sourced[T]:\n    if cli_value is not None:\n        return Sourced(cli_value, Source.CLI)\n    if environment_value is not None:\n        return Sourced(environment_value, Source.ENVIRONMENT)\n    if file_value is not None:\n        return Sourced(file_value, Source.FILE)\n    return Sourced(default_value, Source.DEFAULT)\n```\n\n对 Token 不输出 `.value`，只输出来源。", "subs": ["默认值应安全而不是方便", "配置模型集中校验", "Secret 只在需要的生命周期内存在", "配置重载要定义一致性", "本节练习", "配置来源需要携带 provenance"]}, {"title": "怎样让日志足够排障，又不会把密码和 Token 打出来？", "content": "日志记录事件，不是把程序全部状态倾倒出来。\n可检索字段应稳定，消息应说明发生了什么，敏感值应在进入日志系统前脱敏。\n\n```python\nimport logging\n\n\nlogger = logging.getLogger(\"ops_check\")\n\n\nlogger.info(\n    \"check completed\",\n    extra={\n        \"target\": target.host,\n        \"status\": result.category,\n        \"latency_ms\": result.latency_ms,\n        \"operation_id\": operation_id,\n    },\n)\n```\n\n标准库日志层级和配置以 [Python `logging` 官方文档](https://docs.python.org/3/library/logging.html) 为准。\n\n#### 级别表达运维意义\n\n- DEBUG：开发诊断，默认关闭。\n- INFO：正常生命周期与关键结果。\n- WARNING：可恢复异常或降级。\n- ERROR：当前操作失败，需要关注。\n- CRITICAL：服务整体无法继续。\n\n单台主机不可达是否是 WARNING 或 INFO，取决于它是预期巡检发现还是工具自身异常。\n\n#### 结构化字段优于在消息里拼字符串\n\n稳定字段便于按 `operation_id`、目标和错误分类聚合。\n时间戳使用带时区格式，持续时间使用单调时钟计算，避免把两者混为一谈。\n\n#### 中央脱敏之外还要源头避免\n\n```python\nSENSITIVE_KEYS = {\"authorization\", \"token\", \"password\", \"secret\"}\n\n\ndef redact_mapping(value: Mapping[str, object]) -> dict[str, object]:\n    return {\n        key: \"***\" if key.lower() in SENSITIVE_KEYS else item\n        for key, item in value.items()\n    }\n```\n\n嵌套结构、URL 查询参数和自由文本仍可能泄露，通用脱敏器不能覆盖全部语义。\n最可靠的策略是不把原始请求头、完整配置和环境快照交给日志函数。\n\n#### 测试日志泄露\n\n```python\ndef test_token_is_not_logged(caplog):\n    token = \"test-secret-123\"\n    run_with_token(token)\n    assert token not in caplog.text\n```\n\n测试使用专用假值，绝不把真实凭证放进测试。\n\n#### 结构化日志适配器\n\n```python\nimport json\nimport logging\nfrom datetime import UTC, datetime\nfrom typing import Any\n\n\nRESERVED = {\n    \"name\",\n    \"msg\",\n    \"args\",\n    \"levelname\",\n    \"levelno\",\n    \"pathname\",\n    \"filename\",\n    \"module\",\n    \"exc_info\",\n    \"exc_text\",\n    \"stack_info\",\n    \"lineno\",\n    \"funcName\",\n    \"created\",\n    \"msecs\",\n    \"relativeCreated\",\n    \"thread\",\n    \"threadName\",\n    \"processName\",\n    \"process\",\n}\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        document: dict[str, Any] = {\n            \"timestamp\": datetime.fromtimestamp(record.created, UTC).isoformat(),\n            \"level\": record.levelname,\n            \"logger\": record.name,\n            \"message\": record.getMessage(),\n        }\n\n        for key, value in record.__dict__.items():\n            if key not in RESERVED and not key.startswith(\"_\"):\n                document[key] = redact_value(key, value)\n\n        if record.exc_info is not None:\n            document[\"exception\"] = self.formatException(record.exc_info)\n\n        return json.dumps(document, ensure_ascii=False, sort_keys=True, default=str)\n\n\ndef redact_value(key: str, value: Any) -> Any:\n    lowered = key.lower()\n    if any(marker in lowered for marker in (\"token\", \"secret\", \"password\", \"authorization\")):\n        return \"***\"\n    return value\n\n\ndef configure_logging(verbose: bool) -> None:\n    handler = logging.StreamHandler()\n    handler.setFormatter(JsonFormatter())\n\n    root = logging.getLogger()\n    root.handlers.clear()\n    root.addHandler(handler)\n    root.setLevel(logging.DEBUG if verbose else logging.INFO)\n```\n\n真实脱敏还要覆盖嵌套映射、URL 和异常正文。\n这个适配器的首要价值是让字段稳定，而不是宣称能自动识别所有 Secret。", "subs": ["级别表达运维意义", "结构化字段优于在消息里拼字符串", "中央脱敏之外还要源头避免", "测试日志泄露", "结构化日志适配器"]}, {"title": "一个运维动作至少要记录哪些信息，事后才能追得回来？", "content": "普通运行日志帮助排障，审计记录回答谁在何时通过什么入口，对哪个对象，基于什么请求，执行了什么动作，结果怎样。\n\n```json\n{\n  \"timestamp\": \"2026-09-01T10:00:00Z\",\n  \"operation_id\": \"op-...\",\n  \"actor\": \"ci:nightly-check\",\n  \"action\": \"service.restart\",\n  \"target\": \"api-a\",\n  \"mode\": \"dry-run\",\n  \"request_digest\": \"sha256:...\",\n  \"outcome\": \"planned\",\n  \"duration_ms\": 12\n}\n```\n\n#### 审计要记录意图和结果\n\n只有“命令被调用”不足以证明动作成功；只有“成功”又无法追溯请求来源。\n变更前记录授权后的意图，变更后记录结果和外部系统返回标识。\n\n#### 身份不能只信用户参数\n\n`--actor alice` 只是自报信息。\n共享平台应从已验证身份、CI 工作负载身份或操作系统凭证得到 actor，并保留委托链。\n\n#### 审计日志本身需要保护\n\n限制写权限、设置保留期、监测丢失与篡改，并避免把它变成 Secret 仓库。\n审计写入失败时，高风险动作是拒绝执行还是降级继续，必须提前决定。\n\n#### 本章检查点\n\n```text\n[ ] 默认配置安全，必需身份缺失即失败\n[ ] 配置在单一入口合并和校验\n[ ] Secret 不进入 Git、参数、日志和异常\n[ ] 日志字段稳定并可按 operation_id 关联\n[ ] 审计包含身份、动作、目标、模式、结果和时间\n[ ] 审计不可用时的执行策略已经定义\n```\n\n#### 审计事件模型\n\n```python\nfrom dataclasses import dataclass\nfrom datetime import datetime\n\n\n@dataclass(frozen=True, slots=True)\nclass AuditEvent:\n    timestamp: datetime\n    operation_id: str\n    actor: str\n    action: str\n    target: str\n    mode: str\n    outcome: str\n    request_digest: str\n    duration_ms: float\n\n\nclass AuditSink(Protocol):\n    def write(self, event: AuditEvent) -> None: ...\n```\n\n业务代码依赖 `AuditSink` 能力；本地实验写 JSON Lines，生产可以适配不可变审计存储。", "subs": ["审计要记录意图和结果", "身份不能只信用户参数", "审计日志本身需要保护", "本章检查点", "审计事件模型"]}]}, {"title": "第十二章 · 在代码运行之前，尽量把低级错误拦下来", "sections": [{"title": "类型提示能怎样帮助我们读懂代码和发现参数错误？", "content": "类型提示不会在运行时自动验证外部输入。\n它们首先是代码契约，帮助编辑器、静态检查器和评审者追踪数据从哪里来、可能为空吗、函数返回什么。\n\n```python\nfrom collections.abc import Iterable, Mapping\nfrom pathlib import Path\n\n\ndef load_targets(\n    path: Path,\n    overrides: Mapping[str, str],\n) -> list[Target]:\n    ...\n\n\ndef summarize(results: Iterable[CheckResult]) -> Summary:\n    ...\n```\n\n`Iterable` 表示函数只需要遍历，不要求调用者构造列表；`Mapping` 表示只读取键值，不承诺修改。\n\n#### 用联合类型表达真正可空\n\n```python\ndef find_owner(host: str) -> str | None:\n    ...\n```\n\n调用者必须处理 `None`，而不是假设总有字符串。\n若缺失属于错误，直接返回 `str` 并抛出领域异常，接口会更清楚。\n\n#### `TypedDict` 描述边界字典，数据类描述内部值\n\n```python\nfrom typing import NotRequired, TypedDict\n\n\nclass RawTarget(TypedDict):\n    host: str\n    port: int\n    timeout_seconds: NotRequired[float]\n```\n\n它只帮助静态分析，不会检查 JSON。\n外部数据仍需运行时验证，验证后转换成冻结数据类。\n\n#### `Protocol` 让业务依赖能力而非实现\n\n```python\nfrom typing import Protocol\n\n\nclass Probe(Protocol):\n    def check(self, target: Target) -> CheckResult: ...\n\n\ndef execute(targets: Iterable[Target], probe: Probe) -> list[CheckResult]:\n    return [probe.check(target) for target in targets]\n```\n\n真实 HTTP 探针和测试假对象只要满足窄接口即可。\n\n#### 类型检查必须进入自动化\n\n本机偶尔运行不能形成门禁。\n固定配置与版本，在 CI 中对 `src` 和 `tests` 运行；对无法精确建模的第三方边界集中隔离，而不是到处 `# type: ignore`。\n\n#### 本节练习\n\n故意把 `timeout_seconds=\"fast\"`、可能为 `None` 的 owner 和异步函数返回值传错位置，确认类型检查器在运行前指出问题。\n再验证 JSON 中同样的错误仍需运行时校验才能发现。", "subs": ["用联合类型表达真正可空", "TypedDict 描述边界字典", "Protocol 让业务依赖能力而非实现", "类型检查必须进入自动化", "本节练习"]}, {"title": "代码风格不该靠争论，怎样交给工具自动检查？", "content": "格式化工具解决布局一致性，linter 发现未使用导入、可疑表达式和部分错误模式。\n团队应提交统一配置，让 CI 与编辑器执行同一规则。\n\nRuff 提供格式化与 lint 能力；当前命令和规则以 [Ruff 官方文档](https://docs.astral.sh/ruff/) 为准。\n\n```toml\n[tool.ruff]\nline-length = 100\ntarget-version = \"py312\"\n\n[tool.ruff.lint]\nselect = [\"E\", \"F\", \"I\", \"B\", \"UP\"]\n\n[tool.ruff.format]\nquote-style = \"double\"\nindent-style = \"space\"\n```\n\n```bash\nruff format --check .\nruff check .\n```\n\n#### 格式化与 lint 分开理解\n\n格式化会稳定换行、缩进和引号布局；lint 会检查语义模式。\n格式通过不代表没有未处理异常，lint 通过也不代表业务正确。\n\n#### 新规则分批启用\n\n一次启用数百条规则会制造巨大机械差异。\n先修现有问题，再逐步提高门槛；忽略项应尽量写在最小行并解释原因。\n\n#### 自动修复后仍要评审和测试\n\n工具可能重排导入或改写语法，不能因为是自动结果就跳过行为验证。\n格式化差异与功能差异最好分开提交，方便审查。\n\n#### 本节练习\n\n把格式检查、lint、类型检查和测试组成固定命令：\n\n```bash\nruff format --check .\nruff check .\npython -m mypy src\npython -m pytest\n```\n\n本地和 CI 使用相同 Python 与锁文件，避免“本地绿、CI 红”。\n\n#### GitHub Actions 质量门禁示例\n\n```yaml\nname: quality\n\non:\n  pull_request:\n  push:\n    branches:\n      - main\n\npermissions:\n  contents: read\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n\n    strategy:\n      fail-fast: false\n      matrix:\n        python-version:\n          - \"3.12\"\n          - \"3.13\"\n\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v7\n\n      - name: Set up Python\n        uses: actions/setup-python@v7\n        with:\n          python-version: ${{ matrix.python-version }}\n\n      - name: Install project and development dependencies\n        run: |\n          python -m pip install uv\n          uv sync --locked\n\n      - name: Check formatting\n        run: uv run --locked ruff format --check .\n\n      - name: Run linter\n        run: uv run --locked ruff check .\n\n      - name: Run type checker\n        run: uv run --locked python -m mypy src tests\n\n      - name: Run tests\n        run: uv run --locked python -m pytest --cov --cov-report=term-missing\n\n      - name: Build distributions\n        run: uv run --locked python -m build\n```\n\n示例采用 2026-09-02 核对时的当前主版本；升级主版本时还要核对 runner 的 Node 运行时要求。\n真实项目应按供应链策略固定到审核过的完整提交摘要，并由依赖更新工具提交可审查的升级；主版本标签仅用于教学可读性。\n\n#### 干净安装任务\n\n```yaml\n  install-smoke:\n    runs-on: ubuntu-latest\n    needs:\n      - test\n    timeout-minutes: 10\n\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v7\n\n      - name: Set up Python\n        uses: actions/setup-python@v7\n        with:\n          python-version: \"3.12\"\n\n      - name: Build wheel\n        run: |\n          python -m pip install build\n          python -m build --wheel\n\n      - name: Install wheel only\n        run: |\n          python -m venv smoke-venv\n          smoke-venv/bin/python -m pip install dist/*.whl\n\n      - name: Verify installed entry point\n        run: |\n          smoke-venv/bin/ops-check --version\n          smoke-venv/bin/ops-check --help\n```\n\n源码目录内执行入口可能误用工作树模块。\n更严格的 smoke test 应切换到仓库外临时目录，再运行已安装命令。\n\n#### 发布前证据清单\n\n| 证据 | 成功标准 | 不足以证明什么 |\n| --- | --- | --- |\n| `ruff format --check` | 格式无差异 | 业务正确 |\n| `ruff check` | 已选规则通过 | 未选择规则和运行时行为 |\n| mypy | 类型契约一致 | JSON 输入真实有效 |\n| pytest | 已编写场景通过 | 未编写的生产条件 |\n| coverage | 执行行和分支比例 | 断言质量 |\n| wheel build | 可生成产物 | 产物能安装和启动 |\n| clean install | 新环境入口可运行 | 真实生产权限与网络 |\n| localhost integration | 协议与超时路径可复现 | 外部服务全部行为 |\n| canary | 小范围真实运行 | 全量容量和长周期稳定性 |\n\n#### 失败注入目录\n\n```text\ntests/faults/\n├── bad-encoding.json\n├── bad-json.json\n├── duplicate-target.json\n├── empty-targets.json\n├── huge-response.json\n├── invalid-content-type.json\n├── missing-token.env.example\n├── redirect-loop.json\n├── slow-response.json\n├── unknown-field.json\n└── unsupported-schema.json\n```\n\n二进制坏编码 fixture 要由可审核脚本生成，不要在编辑器里依赖不可见字符。\n\n#### 质量门禁故障矩阵\n\n| 编号 | 层级 | 故障 | 预期门禁 |\n| --- | --- | --- | --- |\n| Q01 | 语法 | 括号缺失 | 编译或测试收集失败 |\n| Q02 | 导入 | 模块名拼错 | lint 或测试失败 |\n| Q03 | 类型 | 字符串传给并发参数 | mypy 失败 |\n| Q04 | 类型 | 忽略可空返回 | mypy 失败 |\n| Q05 | 风格 | 未使用导入 | Ruff 失败 |\n| Q06 | 风格 | 导入顺序漂移 | Ruff 失败 |\n| Q07 | 配置 | 未知字段 | 单元测试断言拒绝 |\n| Q08 | 配置 | 非法环境数字 | 不回退默认值 |\n| Q09 | Secret | Token 出现在日志 | caplog 测试失败 |\n| Q10 | Secret | Token 出现在异常 | 异常文本测试失败 |\n| Q11 | 文件 | 替换失败 | 旧文件保持完整 |\n| Q12 | 文件 | 写入中断 | 临时文件可清理 |\n| Q13 | HTTP | 连接超时 | 分类为 timeout |\n| Q14 | HTTP | 读取超时 | 分类为 timeout |\n| Q15 | HTTP | 429 | 遵守有限退避 |\n| Q16 | HTTP | 500 | 不对永久动作盲目重试 |\n| Q17 | HTTP | 200 非 JSON | invalid_response |\n| Q18 | HTTP | 重定向外域 | 默认不跟随 |\n| Q19 | 并发 | 一个 Future 异常 | 目标身份不丢失 |\n| Q20 | 并发 | 用户取消 | 取消继续传播 |\n| Q21 | 输出 | 日志混入 stdout | JSON 协议测试失败 |\n| Q22 | 输出 | 并发次序变化 | 排序后快照稳定 |\n| Q23 | CLI | 参数缺失 | 退出 2 |\n| Q24 | CLI | 巡检发现 | 退出 1 |\n| Q25 | CLI | 运行时失败 | 退出 3 |\n| Q26 | CLI | SIGINT | 退出 130 |\n| Q27 | 包 | 缺少模块 | wheel 安装 smoke 失败 |\n| Q28 | 包 | 入口点写错 | `--help` smoke 失败 |\n| Q29 | 依赖 | 锁文件过期 | locked sync 失败 |\n| Q30 | 依赖 | 最低 Python 提升 | 版本矩阵暴露 |\n| Q31 | 性能 | O(n²) 对账 | 基准趋势告警 |\n| Q32 | 资源 | 文件句柄未关闭 | 重复测试暴露增长 |\n| Q33 | 资源 | 线程未回收 | 测试进程无法正常结束 |\n| Q34 | 审计 | 结果未带 operation ID | schema 测试失败 |\n| Q35 | 审计 | 失败动作无 outcome | 审计契约测试失败 |\n| Q36 | 时间 | 使用墙钟算耗时 | 假时钟测试失败 |\n| Q37 | 重试 | 永久错误被重试 | 调用次数断言失败 |\n| Q38 | 重试 | 退避超过 deadline | 总预算测试失败 |\n| Q39 | 兼容 | 删除 JSON 字段 | schema 快照测试失败 |\n| Q40 | 清理 | 测试残留临时文件 | teardown 检查失败 |\n\n#### 性能调查记录模板\n\n```text\n问题陈述：\n用户可见影响：\n首次发生时间：\n输入规模：\n目标失败比例：\nPython 版本：\n依赖锁摘要：\nCPU 配额：\n内存限制：\n并发设置：\n单项超时：\n批次 deadline：\n基线总耗时：\n基线 P50：\n基线 P95：\n基线 P99：\n峰值 RSS：\n最大在途任务：\n队列最大深度：\n外部 429 数：\n外部 5xx 数：\nprofile 文件摘要：\n累计时间前三函数：\n调用次数异常函数：\n第一假设：\n排除实验：\n实验结果：\n第二假设：\n最小修复：\n正确性对照：\n性能对照：\n回退条件：\n未验证范围：\n```\n\n#### 门禁执行顺序\n\n快速且确定的检查放前面，让反馈更快：\n\n```text\n1. pyproject 与锁文件一致性\n2. 格式检查\n3. lint\n4. 类型检查\n5. 快速单元测试\n6. localhost 集成测试\n7. 构建 sdist 与 wheel\n8. 仓库外干净安装\n9. CLI smoke\n10. 安全与依赖扫描\n11. 测试环境故障注入\n12. 小范围 canary\n```\n\n某一步没运行就标记 `NOT VERIFIED`，不能用前一步成功替代。\n\n#### 练习验收记录\n\n```text\nPASS  `ruff format --check .`\nPASS  `ruff check .`\nPASS  严格类型检查\nPASS  单元测试与分支覆盖门槛\nPASS  localhost 超时、500、坏 JSON\nPASS  wheel 构建\nPASS  仓库外新虚拟环境安装\nPASS  安装后的 `ops-check --help`\nNOT VERIFIED  生产 CA 与真实认证\nNOT VERIFIED  目标系统限流阈值\nNOT VERIFIED  20,000 目标容量\nNOT VERIFIED  多平台信号和进程树行为\n```\n\n工程质量不是把工具名列在 README 中。\n每道门禁都要对应一种具体失败，并说明它仍然不能证明什么。", "subs": ["格式化与 lint 分开理解", "新规则分批启用", "自动修复后仍要评审和测试", "本节练习", "GitHub Actions 质量门禁示例", "干净安装任务", "发布前证据清单", "失败注入目录", "质量门禁故障矩阵", "性能调查记录模板", "门禁执行顺序", "练习验收记录"]}, {"title": "`assert`、输入校验和异常处理，分别应该用在哪里？", "content": "三者保护不同边界：\n\n- 输入校验处理用户、文件、API 等不可信数据。\n- 异常处理表达运行时失败与恢复策略。\n- `assert` 检查程序内部本应恒真的不变量。\n\n```python\ndef percentage(passed: int, total: int) -> float:\n    if total < 0 or passed < 0 or passed > total:\n        raise ValueError(\"invalid counts\")\n    if total == 0:\n        return 0.0\n    return passed / total * 100\n```\n\n这些是公开函数输入约束，不能用 `assert` 替代，因为优化模式可能移除断言，而且用户错误不应显示为内部缺陷。\n\n#### 断言适合已经验证后的内部关系\n\n```python\nsummary = summarize(results)\nassert summary.passed + summary.failed == summary.completed\n```\n\n断言失败意味着代码或内部模型有 bug，应保留 traceback 并修复。\n\n#### 不要用断言做权限检查\n\n```python\n# 严重错误示例\nassert actor.is_admin\nperform_destructive_change()\n```\n\n权限、身份、路径范围和资源限制都必须使用不可被优化关闭的显式检查。\n\n#### 异常捕获不能取代入口验证\n\n让深层代码因 `KeyError`、`TypeError` 偶然失败，会产生不稳定错误信息。\n入口先验证，深层仅处理其真正负责的外部错误。\n\n#### 本章检查点\n\n```text\n[ ] 公共函数和领域模型有有用类型\n[ ] 外部数据仍有运行时验证\n[ ] 格式、lint、类型和测试是四个独立门禁\n[ ] assert 只用于内部不变量\n[ ] 权限与用户输入使用显式错误\n```", "subs": ["断言适合已经验证后的内部关系", "不要用断言做权限检查", "异常捕获不能取代入口验证", "本章检查点"]}]}, {"title": "第十三章 · 别靠“看起来没问题”判断代码质量", "sections": [{"title": "第一个 pytest 应该测什么，才能真正防住回归？", "content": "第一个测试应覆盖最重要且容易被修改破坏的业务行为，而不是只断言函数被调用。\n对批量巡检 CLI，配置校验、结果汇总和退出码是高价值起点。\n\n测试先固定公开行为：返回值、退出码、外部调用和可观察产物。只有当内部实现本身就是契约时，才直接断言私有步骤。\n\npytest 的 fixture 与断言机制以 [pytest 官方文档](https://docs.pytest.org/) 为准。\n\n```python\nimport pytest\n\n\n@pytest.mark.parametrize(\n    (\"port\", \"message\"),\n    [\n        (0, \"between 1 and 65535\"),\n        (65536, \"between 1 and 65535\"),\n        (True, \"must be an integer\"),\n    ],\n)\ndef test_rejects_invalid_ports(port, message):\n    with pytest.raises(ValueError, match=message):\n        parse_target({\"host\": \"api-a\", \"port\": port})\n```\n\n#### 测可观察行为而不是实现细节\n\n重构内部循环不应让测试失败。\n断言返回模型、文件内容、日志字段和退出码，而不是私有函数调用次数，除非调用次数本身就是限流契约。\n\n#### 测试名称写清条件与结果\n\n`test_config()` 信息太少。\n`test_unknown_target_field_is_rejected()` 能直接告诉维护者哪条规则回归。\n\n#### 一个测试只突出一个失败原因\n\n准备最小输入，使失败时不用在几十个字段中搜索。\n共享样本可以用 fixture，但不要把所有测试塞进一个巨大 fixture，导致状态难以追踪。\n\n#### 退出码需要入口测试\n\n```python\ndef test_findings_return_exit_one(tmp_path, capsys):\n    config = tmp_path / \"targets.json\"\n    config.write_text('{\"targets\": []}', encoding=\"utf-8\")\n\n    code = main([\"validate\", \"--config\", str(config)])\n\n    captured = capsys.readouterr()\n    assert code == 2\n    assert \"targets cannot be empty\" in captured.err\n    assert captured.out == \"\"\n```\n\n#### 本节练习\n\n建立最小回归套件：合法配置、坏 JSON、未知字段、单目标超时、部分失败汇总、JSON schema 版本和用户中断映射。", "subs": ["测可观察行为而不是实现细节", "测试名称写清条件与结果", "一个测试只突出一个失败原因", "退出码需要入口测试", "本节练习"]}, {"title": "不连接真实服务器和数据库，测试还能怎样写？", "content": "```mermaid\nflowchart LR\n    A[纯函数单测] --> B[假适配器]\n    B --> C[localhost 协议测试]\n    C --> D[候选环境验证]\n    D --> E[生产观察]\n```\n\n每向右一步，真实度、成本和风险都增加；左侧通过不能替代右侧证据，但能让高成本验证聚焦在更少的未知项上。\n\n单元测试通过依赖注入把网络、时钟、随机数和文件系统换成可控实现。\n测试不是“假装生产没依赖”，而是精确制造正常和失败条件。\n\n#### `tmp_path` 提供隔离文件系统\n\n```python\ndef test_atomic_write_replaces_complete_file(tmp_path):\n    target = tmp_path / \"config.json\"\n    target.write_text('{\"version\": 1}\\n', encoding=\"utf-8\")\n\n    write_json_atomic(target, {\"version\": 2})\n\n    assert json.loads(target.read_text(encoding=\"utf-8\")) == {\"version\": 2}\n    assert list(tmp_path.glob(\"*.tmp\")) == []\n```\n\n#### `monkeypatch` 控制环境变量\n\n```python\ndef test_environment_overrides_file(monkeypatch):\n    monkeypatch.setenv(\"OPS_CONCURRENCY\", \"4\")\n    settings = load_settings_from_sources(file_value=2)\n    assert settings.concurrency == 4\n```\n\nfixture 会在测试后恢复环境，避免相互污染。\n\n#### 假客户端比全局 mock 更清楚\n\n```python\nclass FakeInventoryClient:\n    def __init__(self, targets: list[Target]) -> None:\n        self.targets = targets\n\n    def list_targets(self) -> list[Target]:\n        return list(self.targets)\n\n\ndef test_plan_filters_disabled_targets():\n    client = FakeInventoryClient([...])\n    plan = build_plan(client)\n    assert [item.host for item in plan] == [\"api-a\"]\n```\n\n#### localhost 假服务用于协议集成\n\n需要验证真实 HTTP 状态码、超时和 JSON 解码时，启动只绑定 `127.0.0.1` 的测试服务。\n不要在普通测试中访问公网或生产域名；网络波动会让结果不可复现，也可能产生真实副作用。\n\n#### Mock 不能证明第三方真实行为\n\nmock 通过只能证明你的代码按预设交互。\n关键 SDK 还需要少量契约测试或沙箱集成测试，并清楚标记是否真正运行。\n\n#### 本节练习\n\n使用 `tmp_path`、`monkeypatch`、假时钟和 localhost 服务覆盖文件、配置、退避和 HTTP 失败；每个测试执行后检查无线程、端口和临时文件残留。\n\n#### 用假时钟消除时间测试抖动\n\n```python\nfrom typing import Protocol\n\n\nclass Clock(Protocol):\n    def monotonic(self) -> float: ...\n\n\nclass FakeClock:\n    def __init__(self, values: list[float]) -> None:\n        self._values = iter(values)\n\n    def monotonic(self) -> float:\n        return next(self._values)\n\n\ndef elapsed_ms(clock: Clock, operation: Callable[[], T]) -> tuple[T, float]:\n    started = clock.monotonic()\n    result = operation()\n    finished = clock.monotonic()\n    return result, (finished - started) * 1000\n```\n\n```python\ndef test_elapsed_ms_uses_monotonic_clock() -> None:\n    clock = FakeClock([10.0, 10.125])\n\n    value, duration = elapsed_ms(clock, lambda: \"ok\")\n\n    assert value == \"ok\"\n    assert duration == pytest.approx(125.0)\n```\n\n#### 用假睡眠验证退避而不拖慢测试\n\n```python\n@dataclass\nclass FakeSleeper:\n    delays: list[float]\n\n    def sleep(self, seconds: float) -> None:\n        self.delays.append(seconds)\n\n\ndef retry(\n    operation: Callable[[], T],\n    *,\n    attempts: int,\n    sleep: Callable[[float], None],\n) -> T:\n    for attempt in range(1, attempts + 1):\n        try:\n            return operation()\n        except TransientError:\n            if attempt == attempts:\n                raise\n            sleep(0.1 * (2 ** (attempt - 1)))\n    raise AssertionError(\"unreachable\")\n```\n\n```python\ndef test_retry_stops_after_success() -> None:\n    calls = 0\n    sleeper = FakeSleeper([])\n\n    def flaky() -> str:\n        nonlocal calls\n        calls += 1\n        if calls < 3:\n            raise TransientError(\"not yet\")\n        return \"ok\"\n\n    assert retry(flaky, attempts=4, sleep=sleeper.sleep) == \"ok\"\n    assert calls == 3\n    assert sleeper.delays == [0.1, 0.2]\n```\n\n#### 日志脱敏测试\n\n```python\ndef test_json_formatter_redacts_sensitive_extra() -> None:\n    formatter = JsonFormatter()\n    record = logging.LogRecord(\n        name=\"ops_check\",\n        level=logging.INFO,\n        pathname=__file__,\n        lineno=1,\n        msg=\"request ready\",\n        args=(),\n        exc_info=None,\n    )\n    record.api_token = \"test-token-value\"\n    record.target = \"api-a\"\n\n    document = json.loads(formatter.format(record))\n\n    assert document[\"api_token\"] == \"***\"\n    assert document[\"target\"] == \"api-a\"\n    assert \"test-token-value\" not in formatter.format(record)\n```\n\n#### CLI 输出协议测试\n\n```python\ndef test_json_mode_keeps_stdout_machine_readable(capsys) -> None:\n    code = main([\n        \"run\",\n        \"--config\",\n        \"tests/fixtures/all-ok.json\",\n        \"--output\",\n        \"json\",\n    ])\n\n    captured = capsys.readouterr()\n    document = json.loads(captured.out)\n\n    assert code == 0\n    assert document[\"schema_version\"] == 1\n    assert document[\"complete\"] is True\n    assert \"starting\" not in captured.out\n```\n\n#### 原子写入失败测试\n\n```python\ndef test_failed_replace_preserves_old_report(tmp_path, monkeypatch) -> None:\n    target = tmp_path / \"report.json\"\n    target.write_text('{\"version\":\"old\"}\\n', encoding=\"utf-8\")\n\n    def fail_replace(source: str, destination: Path) -> None:\n        raise OSError(\"injected replace failure\")\n\n    monkeypatch.setattr(os, \"replace\", fail_replace)\n\n    with pytest.raises(OSError, match=\"injected\"):\n        write_report_atomic(target, {\"version\": \"new\"})\n\n    assert json.loads(target.read_text(encoding=\"utf-8\")) == {\"version\": \"old\"}\n    assert not list(tmp_path.glob(\".*.tmp\"))\n```\n\n#### 配置优先级参数化测试\n\n```python\n@pytest.mark.parametrize(\n    (\"cli\", \"environment\", \"file\", \"expected\", \"source\"),\n    [\n        (4, 3, 2, 4, Source.CLI),\n        (None, 3, 2, 3, Source.ENVIRONMENT),\n        (None, None, 2, 2, Source.FILE),\n        (None, None, None, 1, Source.DEFAULT),\n    ],\n)\ndef test_configuration_precedence(cli, environment, file, expected, source) -> None:\n    selected = choose(cli, environment, file, 1)\n    assert selected.value == expected\n    assert selected.source is source\n```\n\n\n#### 工程回归套件：测试配置、日志、审计和重试的契约\n\n先为设置对象建立不会输出 Secret 的表示：\n\n```python\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True, slots=True, repr=False)\nclass SecretValue:\n    _value: str\n\n    def reveal(self) -> str:\n        return self._value\n\n    def __repr__(self) -> str:\n        return \"SecretValue(***)\"\n\n    def __str__(self) -> str:\n        return \"***\"\n\n\n@dataclass(frozen=True, slots=True)\nclass Settings:\n    api_url: str\n    timeout_seconds: float\n    concurrency: int\n    token: SecretValue\n```\n\n这只是减少意外展示，不是加密。\n真正字符串在调用 `reveal()` 后仍可能被日志、异常或调试器观察。\n\n```python\ndef parse_positive_float(name: str, value: object) -> float:\n    if isinstance(value, bool):\n        raise ConfigError(f\"{name} must be a number\")\n\n    try:\n        parsed = float(value)\n    except (TypeError, ValueError) as exc:\n        raise ConfigError(f\"{name} must be a number\") from exc\n\n    if not 0.05 <= parsed <= 60.0:\n        raise ConfigError(f\"{name} must be between 0.05 and 60\")\n    return parsed\n\n\ndef parse_concurrency(value: object) -> int:\n    if isinstance(value, bool):\n        raise ConfigError(\"concurrency must be an integer\")\n    if not isinstance(value, int):\n        raise ConfigError(\"concurrency must be an integer\")\n    if not 1 <= value <= 64:\n        raise ConfigError(\"concurrency must be between 1 and 64\")\n    return value\n```\n\n#### Secret 类型测试\n\n```python\ndef test_secret_repr_is_redacted() -> None:\n    secret = SecretValue(\"test-only-token\")\n    assert repr(secret) == \"SecretValue(***)\"\n    assert str(secret) == \"***\"\n    assert \"test-only-token\" not in repr(secret)\n\n\ndef test_secret_requires_explicit_reveal() -> None:\n    secret = SecretValue(\"test-only-token\")\n    assert secret.reveal() == \"test-only-token\"\n\n\ndef test_settings_repr_does_not_expose_token() -> None:\n    settings = Settings(\n        api_url=\"http://127.0.0.1:8080\",\n        timeout_seconds=1.0,\n        concurrency=4,\n        token=SecretValue(\"test-only-token\"),\n    )\n    assert \"test-only-token\" not in repr(settings)\n```\n\n#### 数字解析测试\n\n```python\n@pytest.mark.parametrize(\"value\", [0.05, 1, \"2.5\", 60])\ndef test_positive_float_accepts_documented_range(value: object) -> None:\n    assert 0.05 <= parse_positive_float(\"timeout\", value) <= 60\n\n\n@pytest.mark.parametrize(\"value\", [True, False, None, \"fast\", [], {}])\ndef test_positive_float_rejects_non_numbers(value: object) -> None:\n    with pytest.raises(ConfigError, match=\"must be a number\"):\n        parse_positive_float(\"timeout\", value)\n\n\n@pytest.mark.parametrize(\"value\", [-1, 0, 0.01, 60.1, 1000])\ndef test_positive_float_rejects_out_of_range(value: object) -> None:\n    with pytest.raises(ConfigError, match=\"between 0.05 and 60\"):\n        parse_positive_float(\"timeout\", value)\n\n\n@pytest.mark.parametrize(\"value\", [1, 4, 64])\ndef test_concurrency_accepts_documented_range(value: int) -> None:\n    assert parse_concurrency(value) == value\n\n\n@pytest.mark.parametrize(\"value\", [True, 1.0, \"4\", None, [], {}])\ndef test_concurrency_rejects_wrong_type(value: object) -> None:\n    with pytest.raises(ConfigError, match=\"must be an integer\"):\n        parse_concurrency(value)\n\n\n@pytest.mark.parametrize(\"value\", [-1, 0, 65, 1000])\ndef test_concurrency_rejects_out_of_range(value: int) -> None:\n    with pytest.raises(ConfigError, match=\"between 1 and 64\"):\n        parse_concurrency(value)\n```\n\n#### 配置来源报告\n\n```python\ndef visible_settings(settings: EffectiveSettings) -> dict[str, object]:\n    return {\n        \"concurrency\": {\n            \"value\": settings.concurrency.value,\n            \"source\": settings.concurrency.source,\n        },\n        \"timeout_seconds\": {\n            \"value\": settings.timeout_seconds.value,\n            \"source\": settings.timeout_seconds.source,\n        },\n        \"output\": {\n            \"value\": settings.output.value,\n            \"source\": settings.output.source,\n        },\n        \"token\": {\n            \"value\": \"***\",\n            \"source\": settings.token.source,\n        },\n    }\n```\n\n```python\ndef test_visible_settings_redacts_secret_value() -> None:\n    token = \"test-only-token\"\n    settings = EffectiveSettings(\n        concurrency=Sourced(4, Source.CLI),\n        timeout_seconds=Sourced(1.0, Source.FILE),\n        output=Sourced(\"json\", Source.DEFAULT),\n        token=Sourced(token, Source.ENVIRONMENT),\n    )\n\n    visible = visible_settings(settings)\n    rendered = json.dumps(visible)\n\n    assert visible[\"token\"] == {\n        \"value\": \"***\",\n        \"source\": Source.ENVIRONMENT,\n    }\n    assert token not in rendered\n```\n\n#### 审计 JSON Lines 写入器\n\n```python\nfrom dataclasses import asdict\nfrom pathlib import Path\nfrom threading import Lock\n\n\nclass JsonLinesAuditSink:\n    def __init__(self, path: Path) -> None:\n        self._path = path\n        self._lock = Lock()\n\n    def write(self, event: AuditEvent) -> None:\n        document = asdict(event)\n        document[\"timestamp\"] = event.timestamp.isoformat()\n        rendered = json.dumps(\n            document,\n            ensure_ascii=False,\n            sort_keys=True,\n            separators=(\",\", \":\"),\n        )\n\n        self._path.parent.mkdir(parents=True, exist_ok=True)\n        with self._lock:\n            with self._path.open(\"a\", encoding=\"utf-8\", newline=\"\\n\") as handle:\n                handle.write(rendered)\n                handle.write(\"\\n\")\n                handle.flush()\n```\n\n本地锁只协调当前进程的线程，不解决多个进程并发追加和主机崩溃耐久性。\n生产审计应使用能满足访问、完整性和保留要求的存储。\n\n```python\nfrom datetime import UTC, datetime\n\n\ndef audit_event() -> AuditEvent:\n    return AuditEvent(\n        timestamp=datetime(2026, 9, 1, 10, 0, tzinfo=UTC),\n        operation_id=\"op-test-1\",\n        actor=\"test-runner\",\n        action=\"check.http\",\n        target=\"api-a\",\n        mode=\"dry-run\",\n        outcome=\"planned\",\n        request_digest=\"sha256:test\",\n        duration_ms=1.25,\n    )\n\n\ndef test_audit_sink_writes_one_parseable_line(tmp_path: Path) -> None:\n    path = tmp_path / \"audit.jsonl\"\n    sink = JsonLinesAuditSink(path)\n\n    sink.write(audit_event())\n\n    lines = path.read_text(encoding=\"utf-8\").splitlines()\n    assert len(lines) == 1\n    document = json.loads(lines[0])\n    assert document[\"operation_id\"] == \"op-test-1\"\n    assert document[\"mode\"] == \"dry-run\"\n\n\ndef test_audit_sink_appends_without_rewriting_old_events(tmp_path: Path) -> None:\n    path = tmp_path / \"audit.jsonl\"\n    path.write_text('{\"existing\":true}\\n', encoding=\"utf-8\")\n    sink = JsonLinesAuditSink(path)\n\n    sink.write(audit_event())\n\n    lines = path.read_text(encoding=\"utf-8\").splitlines()\n    assert json.loads(lines[0]) == {\"existing\": True}\n    assert json.loads(lines[1])[\"operation_id\"] == \"op-test-1\"\n```\n\n#### 重试分类模型\n\n```python\nclass ErrorKind(StrEnum):\n    TRANSIENT = \"transient\"\n    PERMANENT = \"permanent\"\n    UNKNOWN = \"unknown\"\n\n\nclass OperationFailure(Exception):\n    def __init__(self, message: str, kind: ErrorKind) -> None:\n        super().__init__(message)\n        self.kind = kind\n\n\ndef retryable(error: OperationFailure) -> bool:\n    return error.kind is ErrorKind.TRANSIENT\n```\n\n```python\ndef retry_classified(\n    operation: Callable[[], T],\n    *,\n    attempts: int,\n    sleep: Callable[[float], None],\n) -> T:\n    if attempts < 1:\n        raise ValueError(\"attempts must be positive\")\n\n    for attempt in range(1, attempts + 1):\n        try:\n            return operation()\n        except OperationFailure as exc:\n            if not retryable(exc):\n                raise\n            if attempt == attempts:\n                raise\n            sleep(min(2.0, 0.1 * (2 ** (attempt - 1))))\n\n    raise AssertionError(\"unreachable\")\n```\n\n```python\ndef test_permanent_failure_is_not_retried() -> None:\n    calls = 0\n\n    def operation() -> str:\n        nonlocal calls\n        calls += 1\n        raise OperationFailure(\"bad credentials\", ErrorKind.PERMANENT)\n\n    with pytest.raises(OperationFailure, match=\"bad credentials\"):\n        retry_classified(operation, attempts=5, sleep=lambda _: None)\n\n    assert calls == 1\n\n\ndef test_unknown_failure_is_not_retried() -> None:\n    calls = 0\n\n    def operation() -> str:\n        nonlocal calls\n        calls += 1\n        raise OperationFailure(\"result uncertain\", ErrorKind.UNKNOWN)\n\n    with pytest.raises(OperationFailure, match=\"uncertain\"):\n        retry_classified(operation, attempts=5, sleep=lambda _: None)\n\n    assert calls == 1\n\n\ndef test_transient_failure_obeys_attempt_limit() -> None:\n    calls = 0\n    delays: list[float] = []\n\n    def operation() -> str:\n        nonlocal calls\n        calls += 1\n        raise OperationFailure(\"temporary\", ErrorKind.TRANSIENT)\n\n    with pytest.raises(OperationFailure, match=\"temporary\"):\n        retry_classified(operation, attempts=4, sleep=delays.append)\n\n    assert calls == 4\n    assert delays == [0.1, 0.2, 0.4]\n```\n\n#### JSON 输出 schema 契约\n\n```python\ndef assert_summary_schema(document: object) -> None:\n    assert isinstance(document, dict)\n    assert document[\"schema_version\"] == 1\n    assert isinstance(document[\"complete\"], bool)\n\n    summary = document[\"summary\"]\n    assert isinstance(summary, dict)\n    assert isinstance(summary[\"planned\"], int)\n    assert isinstance(summary[\"completed\"], int)\n    assert isinstance(summary[\"passed\"], int)\n    assert isinstance(summary[\"failed\"], int)\n\n    assert summary[\"completed\"] <= summary[\"planned\"]\n    assert summary[\"passed\"] + summary[\"failed\"] == summary[\"completed\"]\n```\n\n如果机器接口长期维护，可以使用正式 JSON Schema 并做兼容性测试。\n手写断言适合教学，但容易漏字段约束。\n\n#### 构建产物检查脚本的行为要求\n\n检查 wheel 时至少验证：\n\n```text\n[ ] 文件名包含预期项目名与版本\n[ ] wheel 中含所有 `src/ops_check` 模块\n[ ] wheel 中不含 `.env`、测试 Token 和本地报告\n[ ] METADATA 的 Requires-Python 正确\n[ ] METADATA 的直接依赖与 pyproject 一致\n[ ] console_scripts 指向 `ops_check.cli:main`\n[ ] LICENSE 与 README 按项目策略包含\n[ ] 从仓库外目录安装后能够 import\n[ ] 安装后的 `--version` 与包元数据一致\n[ ] 安装后的 `--help` 不读取生产配置\n```\n\n不要只检查 `dist/` 中存在一个文件。\n\n#### 发布前 dry-run\n\n```text\n1. 从已审核提交创建干净工作树。\n2. 使用项目声明的最低 Python 版本同步锁文件。\n3. 运行格式、lint、类型和测试。\n4. 运行最高支持 Python 版本测试。\n5. 构建 sdist 和 wheel。\n6. 检查产物内容与元数据。\n7. 在仓库外新虚拟环境安装 wheel。\n8. 运行 `ops-check --version` 和 `--help`。\n9. 启动 localhost 假服务执行完整 smoke。\n10. 对产物执行安全与许可证扫描。\n11. 保存命令、摘要、退出码和 CI 链接。\n12. 不上传、不打标签，把结果交给发布审批。\n```\n\n#### canary 观察窗口\n\n小范围生产验证至少比较：\n\n```text\n提交请求数\n配置错误率\n任务完成率\n目标成功/失败分类\n请求 P50/P95/P99\n批次总耗时\n外部 429/5xx\n重试次数与预算耗尽\n峰值内存与 CPU\n线程/任务在途数\n文件描述符数量\n临时文件残留\nSIGTERM 退出耗时\n日志 Secret 扫描\n审计事件缺失率\n```\n\n新版本与旧版本使用同类目标和时间窗口对照。\n若流量结构不同，应明确这是观察限制。\n\n#### 回滚不是安装旧版本这么简单\n\n发布前回答：\n\n- 新版是否写入旧版无法读取的配置或状态？\n- JSON 输出 schema 是否被下游采用？\n- 数据库迁移是否向后兼容？\n- 已创建任务能否由旧 Worker 消费？\n- 新增审计字段在回滚后是否丢失？\n- 回滚会不会重复运行正在处理的操作？\n- 锁文件和构建产物是否可重新取得并验证摘要？\n\n#### 回滚演练记录\n\n```text\n新版本：\n旧版本：\n产物摘要：\n数据库 schema 前后版本：\n在途任务数量：\n停止新提交时间：\nWorker 排空结果：\n回滚开始时间：\n回滚完成时间：\n入口 smoke：\n旧配置读取：\n旧任务恢复：\nJSON schema 对照：\n审计连续性：\n重复副作用检查：\n最终结论：\n未验证项：\n```", "subs": ["tmp_path 提供隔离文件系统", "monkeypatch 控制环境变量", "假客户端比全局 mock 更清楚", "localhost 假服务用于协议集成", "Mock 不能证明第三方真实行为", "本节练习", "用假时钟消除时间测试抖动", "用假睡眠验证退避而不拖慢测试", "日志脱敏测试", "CLI 输出协议测试", "原子写入失败测试", "配置优先级参数化测试", "工程回归套件", "Secret 类型测试", "数字解析测试", "配置来源报告", "审计 JSON Lines 写入器", "重试分类模型", "JSON 输出 schema 契约", "构建产物检查脚本的行为要求", "发布前 dry", "canary 观察窗口", "回滚不是安装旧版本这么简单", "回滚演练记录"]}, {"title": "脚本报错或变慢时，怎样一步步找到真正原因？", "content": "诊断先保存证据，再提出假设，然后用最小实验排除。\n不要一看到慢就加并发，也不要一看到异常就扩大 `except`。\n\n#### 从完整 traceback 读起\n\n```python\ntry:\n    run_batch()\nexcept Exception:\n    logger.exception(\"batch failed\")\n    raise\n```\n\n从最底层异常位置向上看调用链，区分根因、包装异常和清理失败。\n生产日志若只保留最后一句消息，应先修复可观测性。\n\n#### `pdb` 检查可复现状态\n\n```bash\npython -m pdb -m ops_check --config tests/fixtures/bad.json\n```\n\n在最小输入上设置断点，检查变量类型、分支和异常，而不是在生产循环里随意打印 Secret。\n\n#### 先测量，再用 `cProfile`\n\n```bash\npython -m cProfile -o profile.out -m ops_check run --config fixtures/many.json\npython -m pstats profile.out\n```\n\n分析累计时间和调用次数，确认瓶颈在 DNS、HTTP 等待、JSON 解析、日志格式化还是算法。\nCPU profiler 不会自动解释异步等待；要结合请求耗时、队列深度和外部指标。\n\n#### 生成可分享、可脱敏的诊断包\n\n“在我的机器上报错”无法让另一位维护者复现。\n诊断入口应收集解释器、平台、包版本、配置来源和失败阶段，同时只允许预先批准的环境变量名。\n\n```python\nfrom __future__ import annotations\n\nimport importlib.metadata\nimport json\nimport os\nimport platform\nimport sys\nfrom dataclasses import asdict, dataclass\nfrom pathlib import Path\nfrom typing import Iterable\n\n\n@dataclass(frozen=True, slots=True)\nclass RuntimeFacts:\n    python: str\n    executable: str\n    implementation: str\n    platform: str\n    cwd: str\n    package_versions: dict[str, str]\n    environment_present: dict[str, bool]\n\n\ndef distribution_version(name: str) -> str:\n    try:\n        return importlib.metadata.version(name)\n    except importlib.metadata.PackageNotFoundError:\n        return \"not-installed\"\n\n\ndef collect_runtime_facts(\n    packages: Iterable[str],\n    environment_names: Iterable[str],\n) -> RuntimeFacts:\n    return RuntimeFacts(\n        python=platform.python_version(),\n        executable=sys.executable,\n        implementation=platform.python_implementation(),\n        platform=platform.platform(),\n        cwd=str(Path.cwd()),\n        package_versions={\n            name: distribution_version(name)\n            for name in sorted(set(packages))\n        },\n        environment_present={\n            name: name in os.environ\n            for name in sorted(set(environment_names))\n        },\n    )\n\n\ndef write_diagnostic_report(path: Path, facts: RuntimeFacts) -> None:\n    payload = {\n        \"schema_version\": 1,\n        \"runtime\": asdict(facts),\n    }\n    path.write_text(\n        json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + \"\\n\",\n        encoding=\"utf-8\",\n    )\n\n\ndef main() -> int:\n    facts = collect_runtime_facts(\n        packages=(\"ops-check-lab\", \"httpx\"),\n        environment_names=(\"OPS_CONFIG\", \"OPS_TOKEN\"),\n    )\n    write_diagnostic_report(Path(\"diagnostic.json\"), facts)\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n```\n\n报告只记录 `OPS_TOKEN` 是否存在，绝不读取其值。\n路径本身也可能透露用户名或内部目录；对外发送前仍要人工检查，并为诊断包设置保留期限。\n\n测试固定 schema 和 Secret 边界：\n\n```python\nimport json\n\n\ndef test_diagnostic_report_records_presence_not_value(tmp_path, monkeypatch):\n    monkeypatch.setenv(\"OPS_TOKEN\", \"fake-token-must-not-leak\")\n    output = tmp_path / \"diagnostic.json\"\n\n    facts = collect_runtime_facts(\n        packages=(\"package-that-does-not-exist\",),\n        environment_names=(\"OPS_TOKEN\",),\n    )\n    write_diagnostic_report(output, facts)\n\n    text = output.read_text(encoding=\"utf-8\")\n    payload = json.loads(text)\n    assert \"fake-token-must-not-leak\" not in text\n    assert payload[\"runtime\"][\"environment_present\"][\"OPS_TOKEN\"] is True\n    assert payload[\"runtime\"][\"package_versions\"][\n        \"package-that-does-not-exist\"\n    ] == \"not-installed\"\n```\n\n诊断包是事实快照，不自动等于根因。接下来仍按症状选择证据链。\n\n**只有 CI 导入失败**\n\n1. 对比 CI 与本机的 `sys.executable` 和 Python 小版本。\n2. 从仓库外运行 `python -c \"import ops_check; print(ops_check.__file__)\"`。\n3. 检查 wheel 内容是否缺少模块或包数据。\n4. 搜索同名脚本、大小写差异和未提交文件。\n5. 修复项目声明，不向 CI 临时追加 `PYTHONPATH`。\n\n通过标准是干净安装后的公开入口成功，不是工作树中直接 import 成功。\n\n**批次耗时突然增加**\n\n1. 先比较输入数量和失败比例，排除工作量变化。\n2. 分离 DNS、连接、首字节、读取和本地处理耗时。\n3. 观察并发槽是否被慢请求占满。\n4. 检查重试与限流是否放大调用次数。\n5. 固定输入后再运行 profiler 和候选改动。\n\n吞吐下降可能来自下游，不应看到 Python 函数出现在 profile 顶部就直接重写。\n\n**内存随批次持续增长**\n\n1. 比较 planned、completed、结果列表和队列深度。\n2. 检查任务、异常 traceback、响应体和日志缓冲是否仍被引用。\n3. 用较小 fixture 重复多轮，区分峰值缓存和持续增长。\n4. 把全量 Future 改为有界窗口后重新测量。\n5. 同时核对输出摘要，确保没有通过丢数据降低内存。\n\n对象数量快照能指向可疑类型，但仍需找到谁持有引用。\n\n**只有生产出现认证失败**\n\n1. 记录凭证来源、身份标识和过期时间，不记录凭证正文。\n2. 对比候选环境和生产的权限范围、受众与时钟。\n3. 检查代理是否移除或改写认证头。\n4. 用最小只读 API 验证身份，而不是直接尝试写操作。\n5. 将权限缺失归为永久错误，避免重试风暴。\n\nlocalhost 与 mock 无法证明真实 IAM；结论必须标明在哪个环境验证。\n\n**Token 出现在 traceback**\n\n1. 立即停止继续传播诊断包并按流程轮换凭证。\n2. 定位是请求对象、URL、异常消息还是环境快照泄露。\n3. 在源头改为只传凭证引用或脱敏表示。\n4. 用假 Token 覆盖同一异常路径。\n5. 检查日志采集、工单和对象存储中的历史副本。\n\n应用测试通过只证明新版本不再产生同类文本，不会自动删除已经外泄的副本。\n\n一次诊断记录至少包含：\n\n```text\n症状与首次时间：\n影响范围：\n最近变更：\n可复现输入摘要：\n解释器与依赖摘要：\n已排除假设及证据：\n当前最可能机制：\n下一项最小实验：\n修复前后正确性摘要：\n修复前后资源数据：\n未验证边界：\n负责人和复查时间：\n```\n\n记录被排除的假设，可以避免换班后重复试错。\n每次只改变一个主要变量，失败实验也保留命令和输出摘要；没有证据时写 NOT VERIFIED，不用“应该是”填空。\n\n#### 性能修复也要设正确性门禁\n\n比较相同输入下的输出摘要、失败分类和峰值资源。\n“快两倍但漏了 5% 目标”不是优化。\n\n#### 第三册收束\n\n```text\n[ ] 干净环境可安装锁定依赖\n[ ] 配置和 Secret 边界集中\n[ ] 日志可关联、可脱敏，审计可追溯\n[ ] 类型、格式、lint、测试均有自动门禁\n[ ] 外部依赖可用假对象和 localhost 复现\n[ ] 性能结论有基线、剖析和正确性对照\n```\n\n到这里，脚本已经成为可安装、可测试、可观察的工具。\n第四册将讨论它继续长大时的组件选择、生产生命周期和 Python/Go 边界。\n\n日志指标的设计原则可继续参考 [Prometheus 专题](../../observability/prometheus/README.md)；涉及数据库或消息系统时，本册只验证 Python 客户端契约，存储与消费机制分别回到 [MySQL 专题](../../data-systems/mysql/README.md) 和 [Kafka 专题](../../data-systems/kafka/README.md)。\n\n#### 故障诊断示例：批次突然变慢\n\n先把现象写成数字：\n\n```text\n版本：0.4.1 -> 0.4.2\n目标数：5,000\n并发：32\n成功比例：98%\nP95 单项耗时：0.8s -> 4.7s\n批次总耗时：140s -> 790s\nCPU：25% -> 28%\nRSS：220MiB -> 225MiB\n外部 429：0 -> 1,830\n```\n\nCPU 与内存没有明显增长，429 大量增加，优先假设是新版请求节奏或连接复用改变，而不是 Python 算法变慢。\n\n验证步骤：\n\n```text\n1. 比较 HTTP 客户端与连接池配置差异。\n2. 比较每秒请求数和同时连接数。\n3. 检查是否在每个目标创建新 Client。\n4. 在 localhost 限流假服务复现。\n5. 恢复客户端复用并降低并发。\n6. 比较 429、P95 和总耗时。\n7. 保持相同 fixture 重复三轮。\n8. 确认结果数量和失败分类没有变化。\n```\n\n#### 故障诊断示例：内存随批次增长\n\n```text\n第 1 批结束 RSS：180MiB\n第 2 批结束 RSS：260MiB\n第 3 批结束 RSS：345MiB\n第 4 批结束 RSS：430MiB\n队列深度：始终小于 100\n已完成 Future 集合：持续增长\n```\n\n优先检查结果列表、Future 映射、缓存和日志 handler 是否跨批次保留引用。\n修复后观察每批结束基线是否稳定，而不是只看单次峰值。\n\n#### 故障诊断示例：只有 CI 导入失败\n\n```text\n本地：从仓库根目录运行测试成功\nCI：安装 wheel 后 `ModuleNotFoundError`\n源码：`src/` 布局\nwheel 内容：缺少 `ops_check/report.py`\n```\n\n这说明本地工作树掩盖了打包缺失。\n应修构建配置并保留仓库外 wheel 安装 smoke，而不是在 CI 增加 `PYTHONPATH=src` 绕开产物问题。\n\n#### 故障诊断示例：Token 出现在 traceback\n\n```text\n现象：HTTP 客户端异常对象包含完整请求 URL。\n风险：URL 查询参数携带临时 Token。\n立即动作：停止把 Token 放查询参数，轮换测试凭证。\n修复：使用 Authorization 头，异常适配器仅记录域名与路径模板。\n验证：caplog 与 CLI stderr 均搜索不到假 Token。\n边界：外部代理日志也需独立检查。\n```\n\n#### 第三册能力验收\n\n学习者应能交付以下证据包：\n\n```text\npyproject.toml\n依赖锁文件\n格式与 lint 配置\n严格类型配置\n单元测试报告\n分支覆盖报告\nlocalhost 集成测试记录\n故障注入记录\nwheel 与 sdist 摘要\n产物内容检查\n仓库外安装 smoke\n配置来源与脱敏样例\n审计事件样例\n性能基线\ncanary 观察结果\n回滚演练记录\n已知风险与 NOT VERIFIED 清单\n```\n\n材料齐全仍不代表永远可靠。\n它的价值是让下一位维护者知道当前版本证明了什么、没有证明什么，以及失败后从哪里开始查。\n#### 第三册质量验证设计：按风险组合场景，不按模板凑数量\n\n质量门禁的目标不是得到更多绿色勾，而是用最少、最稳定的场景覆盖最昂贵的失败。\n先把系统分成配置、Secret、外部调用、并发汇总、构建产物和发布恢复六条边界，再为每条边界选择正常、非法、截止、重复和恢复场景。\n\n| 风险边界 | 每次提交 | 主分支或夜间 | 候选发布 |\n| --- | --- | --- | --- |\n| 配置 | 合法 缺失 类型 上下限 | 来源组合与未知字段 | 真实部署注入 |\n| Secret | 日志与异常不泄露 | 轮换和缺失凭证 | 候选环境最小权限 |\n| 外部调用 | 假客户端错误分类 | localhost 超时与坏响应 | 真实沙箱契约 |\n| 并发汇总 | 部分失败与稳定顺序 | 取消 重复和容量 | 编排器终止信号 |\n| 构建产物 | 导入与入口点 | wheel 内容和仓库外安装 | 签名 摘要和扫描 |\n| 发布恢复 | 版本兼容单测 | canary 判定脚本 | 回滚与状态兼容演练 |\n\n表格是选择入口，不是执行证据。\n下面的代表性场景展示怎样同时写清机制、观察点、通过条件与证据边界。\n\n**场景一：非法高优先级配置不得回退**\n\n配置文件中的 timeout=5 合法，环境变量却给出 OPS_TIMEOUT=fast。\n加载器必须在任何网络调用前失败，并指出值来自环境变量；若悄悄回退到文件值，部署错误会长期隐藏。\n\n~~~python\ndef test_invalid_environment_value_does_not_fall_back(monkeypatch):\n    monkeypatch.setenv(\"OPS_TIMEOUT\", \"fast\")\n\n    with pytest.raises(ValueError, match=\"OPS_TIMEOUT\"):\n        load_settings(file_values={\"timeout\": 5})\n~~~\n\n这个测试证明合并器的局部行为，不证明容器平台确实把变量注入了目标进程。\n后者需要在候选部署中记录环境来源，但不得打印 Secret 值。\n\n**场景二：Secret 在异常路径也不能出现**\n\n正常日志脱敏通过后，还要让下游抛出包含请求对象的异常。\n捕获日志与 traceback，搜索完整假 Token 和 URL 中的认证参数。\n\n~~~python\ndef test_token_is_absent_from_failure_log(caplog):\n    token = \"fake-secret-for-test\"\n    client = FailingClient(error=RuntimeError(f\"Authorization: Bearer {token}\"))\n\n    with pytest.raises(RuntimeError):\n        run_check(client=client, token=token)\n\n    assert token not in caplog.text\n~~~\n\n如果异常来自第三方库，业务层可能还要把它转换为不携带请求头的领域错误。\n假 Token 测试不能证明所有第三方版本，依赖升级时应重新运行。\n\n**场景三：超时要由假时钟验证预算，而不是让测试真的等待**\n\n把时钟和睡眠作为窄接口注入。\n测试记录每次退避值，确认下一次尝试不会越过总 deadline。\n\n~~~python\ndef test_retry_stops_before_deadline():\n    clock = FakeClock(now=0.0)\n    sleeps: list[float] = []\n    call = AlwaysTemporaryFailure()\n\n    result = retry(\n        call,\n        deadline=5.0,\n        now=clock.monotonic,\n        sleep=lambda seconds: (sleeps.append(seconds), clock.advance(seconds)),\n    )\n\n    assert result.attempts == 3\n    assert sum(sleeps) <= 5.0\n~~~\n\n接口示意中的 lambda 只用于捕获短小回调；生产代码可改为命名函数。\n还要在 localhost 测试客户端自己的连接和读取超时，因为假时钟不会驱动操作系统 Socket。\n\n**场景四：部分失败仍要保持目标对应关系**\n\n并发完成顺序通常不同于输入顺序。\n结果模型应携带目标标识，汇总后按公开规则稳定排序，并明确 complete。\n\n~~~python\ndef test_partial_failure_keeps_target_identity():\n    results = execute(\n        [\"slow\", \"broken\", \"healthy\"],\n        checker=OutOfOrderChecker(),\n        concurrency=2,\n    )\n\n    assert [item.target for item in results] == [\"broken\", \"healthy\", \"slow\"]\n    assert summarize(results).complete is True\n    assert summarize(results).failed == 1\n~~~\n\n这一场景不应断言线程内部提交顺序。\n若批次收到取消，未完成目标要进入 cancelled 或 unknown，不能伪装成健康。\n\n**场景五：重复执行只产生一次外部副作用**\n\n幂等性要从业务键进入最外层适配器，而不是只在内存集合去重。\n测试让两个相同请求共享一个记录调用次数的假客户端。\n\n~~~python\ndef test_duplicate_operation_reuses_first_result():\n    client = RecordingClient()\n    store = InMemoryOperationStore()\n\n    first = apply_change(\"change-42\", client=client, store=store)\n    second = apply_change(\"change-42\", client=client, store=store)\n\n    assert second == first\n    assert client.apply_calls == 1\n~~~\n\n进程内测试不证明数据库唯一约束和跨进程竞争。\n第四册会把相同规则提升为持久化状态机与故障演练。\n\n**场景六：wheel 必须在仓库外安装**\n\n从源码目录运行会让当前目录意外进入导入路径。\n构建后在新目录创建虚拟环境，只安装 wheel，再执行入口与最小只读命令。\n\n~~~bash\npython -m build --wheel\nsmoke_dir=\"$(mktemp -d)\"\npython -m venv \"$smoke_dir/venv\"\n\"$smoke_dir/venv/bin/python\" -m pip install dist/*.whl\n(\n  cd \"$smoke_dir\"\n  \"$smoke_dir/venv/bin/ops-check\" --help\n)\n~~~\n\n记录构建命令、Python 版本、wheel 摘要和退出码。\n这能发现包数据或入口遗漏，但不证明目标 Linux 发行版、代理和 CA 环境。\n\n**场景七：日志协议需要字段和基数边界**\n\n结构化日志至少稳定保留事件名、operation ID、目标、结果分类和耗时。\n不要把完整 URL、异常对象或任意用户标签直接变成指标标签。\n\n| 字段 | 日志 | 指标标签 | 原因 |\n| --- | --- | --- | --- |\n| event | 保留 | 可选低基数 | 表达事件类型 |\n| operation_id | 保留 | 禁止 | 基数随请求增长 |\n| target | 按权限保留 | 通常禁止 | 可能敏感且高基数 |\n| result | 保留 | 保留 | 用于聚合失败类别 |\n| duration_ms | 保留 | 作为观测值 | 不应离散成任意标签 |\n| token | 禁止 | 禁止 | 凭证不得进入遥测 |\n\n测试既检查字段存在，也检查假凭证不存在。\n生产验证还要观察采集器、转发器和存储端，因为应用日志安全不代表整条链路安全。\n\n**场景八：用户中断与部署终止要分开验证**\n\n单元测试可直接调用停止协调器；集成测试则启动真实子进程并发送信号。\n通过条件包括停止接收新任务、有限等待手中任务、写出不完整摘要和使用约定退出码。\n\n~~~text\n输入目标：20\n注入时机：第 5 个结果持久化后\n注入信号：SIGTERM\n期望：complete=false\n期望：completed 小于 planned\n期望：宽限期内退出\n期望：无临时文件和孤儿子进程\n~~~\n\nmacOS 的信号测试不能替代容器编排器中的 Linux 验证。\nWindows 还需要独立定义控制事件和子进程树收尾策略。\n\n**场景九：性能回归先守正确性**\n\n基准输入必须固定数据摘要，运行前后比较结果数量、失败分类和输出摘要。\n随后才比较吞吐、P95、峰值 RSS 和文件描述符。\n\n~~~text\n基线提交：\n候选提交：\nfixture 摘要：\n结果摘要是否一致：\n吞吐变化：\nP95 变化：\n峰值 RSS 变化：\n结论：接受 拒绝 继续调查\n~~~\n\n只跑一次的计时容易受到 DNS、缓存、CPU 调频和其他进程影响。\n记录预热、重复次数与环境，并把性能结论限制在本次代表性负载。\n\n**场景十：依赖升级要穿过三道门**\n\n第一道看锁文件差异和上游变更，第二道跑本地契约与故障测试，第三道构建候选产物并 canary。\n安全升级也不能省略回退条件。\n\n| 门禁 | 证据 | 不能证明 |\n| --- | --- | --- |\n| 解析 | 锁文件与依赖树差异 | 运行行为兼容 |\n| 回归 | 单测 localhost 和静态检查 | 真实账户权限 |\n| 候选 | wheel smoke 与 canary 指标 | 长周期容量 |\n| 回退 | 旧版安装与状态读取 | 所有历史版本 |\n\n若依赖改变持久化格式或外部请求语义，升级范围必须包含兼容与迁移方案，不能只改版本号。\n\n**场景十一：审计写入失败要符合风险等级**\n\n高风险写操作通常选择 fail-closed：审计不可用就不执行。\n只读或低风险操作可以受控降级，但要产生可监测告警和本地缓冲上限。\n\n~~~python\ndef test_high_risk_action_stops_when_audit_is_unavailable():\n    executor = RecordingExecutor()\n    audit = FailingAuditSink()\n\n    with pytest.raises(AuditUnavailable):\n        run_action(risk=\"high\", executor=executor, audit=audit)\n\n    assert executor.calls == []\n~~~\n\n此处关键断言是副作用没有发生。\n若审计在副作用之后才失败，系统必须进入 unknown 并交给对账，不能简单重试。\n\n**场景十二：回滚要验证旧版能读新版状态**\n\n回滚演练使用真实候选产物和一份可丢弃状态副本。\n先由新版写入，再切回旧版读取和继续处理，记录 schema、退出码和数据摘要。\n\n~~~text\n新版写入版本：\n旧版读取版本：\n迁移是否可逆：\n旧版能否忽略新增字段：\n在途任务如何处理：\n回滚耗时：\n数据摘要：\n结果：PASS FAIL NOT VERIFIED\n~~~\n\n如果状态迁移不可逆，就不能把“重新安装旧 wheel”写成回滚方案。\n应采用向后兼容迁移、前滚修复或明确维护窗口，并把恢复时间纳入发布决策。\n\n最终报告统一使用以下标签：\n\n~~~text\nPASS          已按场景条件执行且满足通过标准\nFAIL          已执行但实际行为不符合预期\nNOT RUN       本轮没有执行\nNOT VERIFIED  有间接证据但没有完成所需验证\nBLOCKED       环境或权限阻止执行并记录原因\n~~~\n\n每条 PASS 同时保存 Python 版本、锁文件摘要、操作系统、fixture 摘要、完整命令和退出码。\nmock、AST 或静态检查只能证明各自覆盖的边界，不能改写成真实服务、浏览器或生产验证。", "subs": ["从完整 traceback 读起", "pdb 检查可复现状态", "先测量，再用 cProfile", "生成可分享、可脱敏的诊断包", "性能修复也要设正确性门禁", "第三册收束", "故障诊断示例", "第三册能力验收", "第三册质量验证设计"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
