<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

<script id="data" type="application/json">{"title": "Go 运维开发与云原生工程 · 第一册：语言基础", "intro": "", "parts": [{"title": "第一章 · 先判断 Go 是否适合眼前的运维任务", "sections": [{"title": "Go 为什么适合单二进制、常驻进程和云原生工具？", "content": "运维工程师学习 Go，通常不是为了重写所有 Shell 或 Python 脚本，而是为了处理一类更具体的问题：程序需要长时间运行、并发访问很多目标、分发到不同机器，或者要与 Kubernetes 等 Go 生态系统深度集成。\nGo 把编译器、格式化、测试、依赖管理和交叉编译放进统一工具链，生成的程序通常可以作为一个二进制交付，这能减少目标机解释器和依赖环境的不确定性。\n\n#### 优势来自约束组合\n\n| 约束 | Go 带来的直接收益 | 仍需承担的责任 |\n| --- | --- | --- |\n| 大量主机分发 | 单二进制便于校验、替换和回滚 | 操作系统、架构、动态链接和升级兼容性 |\n| 常驻 Agent | 启动快，运行时和并发模型适合后台服务 | 内存、文件描述符、goroutine 和磁盘上限 |\n| 并发 I/O | goroutine 和 channel 降低线程编排成本 | 超时、取消、背压和数据竞争 |\n| 云原生集成 | Kubernetes、Prometheus 等生态大量使用 Go | API 版本、RBAC、客户端限流和兼容性 |\n| 团队维护 | 语法和工具链相对统一 | 设计边界、测试和可观测性不会自动出现 |\n\n下面这个最小程序已经体现了运维工具与操作系统之间的契约：输出给人看，退出码给脚本和流水线判断。\n\n```go\npackage main\n\nimport (\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"os\"\n)\n\ntype Result struct {\n\tTarget string `json:\"target\"`\n\tOK     bool   `json:\"ok\"`\n\tDetail string `json:\"detail\"`\n}\n\nfunc main() {\n\tresults := []Result{\n\t\t{Target: \"api-a\", OK: true, Detail: \"healthy\"},\n\t\t{Target: \"api-b\", OK: false, Detail: \"timeout\"},\n\t}\n\n\tif err := json.NewEncoder(os.Stdout).Encode(results); err != nil {\n\t\tfmt.Fprintln(os.Stderr, \"encode result:\", err)\n\t\tos.Exit(1)\n\t}\n\tfor _, result := range results {\n\t\tif !result.OK {\n\t\t\tos.Exit(2)\n\t\t}\n\t}\n}\n```\n\n运行时不仅要看 JSON，还要检查 `$?`。\n如果目标失败而进程仍返回 `0`，自动化平台会把错误当成成功。\n反过来，诊断文字应写入标准错误，机器可解析结果写入标准输出，避免二者混在一起破坏 JSON。\n\n#### Go 不会替你自动解决工程问题\n\n静态类型能拦住一部分类型错误，但不能证明目标地址正确、权限足够或重试安全；垃圾回收减少了手动释放内存，却不会阻止无界缓存；goroutine 很轻量，却仍会消耗栈、调度、连接和下游容量。\n选择 Go 后，仍要明确输入校验、Secret、超时、日志、幂等、退出与恢复。\n\n练习时可以给示例增加 `--json` 和文本两种输出，再故意让标准输出混入日志。\n观察 `jq` 为什么解析失败，并建立“stdout 是数据、stderr 是诊断”的 CLI 规则。\n\n#### 编译期、启动期与运行期是三种不同失败\n\n编译器负责语法、名称和类型关系，链接器负责把包和运行时组织成目标平台的程序；它们不会替你验证主机地址、权限或远端数据。\n排障时先判断失败发生在构建、进程初始化还是业务调用，分别收集编译输出、启动日志和带 request ID 的运行证据。\n练习时分别制造未定义变量、初始化函数返回错误和远端请求超时，记录 `go test`、进程 stderr 与运行日志三类输出。\n\n```mermaid\nflowchart LR\n    A[Go source] --> B[Parse]\n    B --> C[Name and type check]\n    C --> D[Compile for GOOS/GOARCH]\n    D --> E[Link packages and runtime]\n    E --> F[Start process]\n    F --> G[Call external systems]\n```\n\n#### 把“单二进制”拆成可验证事实\n\nGo 经常被概括为“编译后只有一个文件”，但这句话只在具体构建条件下成立。\n纯 Go 程序通常容易生成无需 Go 工具链即可启动的可执行文件；一旦引入 CGO、系统动态库、外部配置、CA 证书、时区数据库或模板文件，运行依赖就不再只有二进制本身。\n\n交付前可以用下面的命令收集事实：\n\n```bash\ngo build -trimpath -o dist/ops-check ./cmd/ops-check\ngo version -m dist/ops-check\nfile dist/ops-check\nshasum -a 256 dist/ops-check\n```\n\n在 Linux 目标机上还应检查动态链接：\n\n```bash\nldd ./dist/ops-check || true\n./dist/ops-check --version\n./dist/ops-check --help\n```\n\n`go version -m` 可以查看编译工具链、模块路径、依赖版本和部分构建设置。\n校验和用于确认传输后的内容与发布记录一致，不能代替签名或来源证明。\n`file` 与 `ldd` 只能说明文件格式和链接关系，不能证明程序拥有正确权限、能访问证书或在目标内核上行为正常。\n\n静态链接也不是绝对目标。\n例如启用系统 DNS 解析、FIPS 密码模块或厂商库时，动态链接可能是明确要求。\n正确决策是记录运行依赖并验证，而不是为了“一定静态”偷偷关闭业务所需能力。\n\n#### `embed`、生成文件与单二进制的真实边界\n\n`embed` 让默认配置、模板或少量证书材料进入二进制，减少目标机文件缺失的概率；它不会自动解决 Secret 轮换，也不会让被嵌入的数据从制品中消失。\n一旦数据进入二进制，任何能读取制品的人都可能拿到它，因此只嵌入公开默认值或可替换的非敏感资源。\n\n下面是一个可编译片段，要求同目录存在 `defaults.yaml`，最低 Go 版本为 1.16：\n\n```go\npackage main\n\nimport (\n\t_ \"embed\"\n\t\"fmt\"\n)\n\n//go:embed defaults.yaml\nvar defaults []byte\n\nfunc main() {\n\tfmt.Printf(\"embedded defaults: %d bytes\\n\", len(defaults))\n}\n```\n\n验证时同时记录源码、资源文件和二进制摘要：\n\n```bash\nprintf 'timeout_seconds: 5\\n' > defaults.yaml\ngo build -trimpath -o /tmp/embed-demo .\nshasum -a 256 /tmp/embed-demo\n/tmp/embed-demo\n```\n\n修改 `defaults.yaml` 后摘要必须变化；运行时环境变量或受控配置文件仍应覆盖默认值，并在诊断中报告“来源”而不是 Secret 内容。\n\n生成代码也属于构建输入。\n`go:generate` 只记录生成命令，不会被 `go build` 自动执行；CI 必须显式运行生成命令，再比较工作区是否产生未提交差异：\n\n```go\n//go:generate go run ./internal/tools/schema-gen -in schema.json -out zz_generated.go\n```\n\n```bash\ngo generate ./...\ngit diff --exit-code -- '*.go'\n```\n\n如果生成器版本、输入 schema 或排序规则不同，生成结果就可能漂移。\n因此要把生成器版本、输入摘要和生成命令写入构建记录；不要在验证脚本中静默覆盖维护者手工修改。\n\nbuild tags 适合隔离平台实现和测试替身，但 tag 组合本身也是发布矩阵的一部分。\n例如 `probe_linux.go` 使用 `//go:build linux`，`probe_other.go` 使用 `//go:build !linux`，至少分别执行目标平台构建和默认构建；“当前机器能编译”不能证明所有 tag 组合都可用。\n\n#### 运行时成本从哪些地方增长\n\n常驻程序的主要资源不只来自业务对象。\n需要同时观察：\n\n- goroutine 数量及其创建栈；\n- heap 已分配、存活对象和 GC 暂停；\n- 打开的文件描述符、socket 与连接池；\n- channel 和内存队列里的待处理对象；\n- 日志、临时文件和离线缓冲占用的磁盘；\n- CPU 使用率、调度延迟和下游等待时间。\n\n一个只占十几 MiB 的空闲 Agent，在部署到数万台主机后也会形成显著总成本。\n评审时要把“单实例看起来很轻”乘以副本或主机数量，并包含升级期间新旧版本短暂共存的峰值。\n\n最小运行观察可以先使用操作系统工具：\n\n```bash\nps -o pid,rss,vsz,%cpu,etime,command -p \"$PID\"\nlsof -p \"$PID\"\ncurl -fsS http://127.0.0.1:9090/metrics\n```\n\n随后由应用暴露稳定指标。\n诊断端点应绑定管理网络或本地地址并受访问控制，不能为了方便把 pprof 无认证暴露到公网。\n\n#### Go 与 Shell、Python 的协作边界\n\n实际运维仓库不必只保留一种语言。\n常见组合是：Shell 负责很薄的安装与启动胶水，Python 负责一次性数据整理和 SDK 调用，Go 负责需要长期运行或跨平台分发的核心工具。\n关键是为边界设定契约：输入格式、退出码、超时、版本和所有者。\n\n如果任务只有三条确定命令并由单一平台执行，改写为 Go 可能只是增加编译与发布成本。\n如果脚本开始出现并发、复杂重试、跨平台分发、长期运行和稳定 API，继续把所有逻辑堆进 Shell 又会让错误处理难以验证。\n语言迁移应由这些信号触发，而不是由代码行数触发。\n\n可以选一个现有脚本完成练习：记录它的启动频率、平均耗时、失败率、依赖、部署主机数和维护者；再分别估算保持脚本、模块化 Python 和改写 Go 的交付成本。\n最终结论允许是“不改”。", "subs": ["优势来自约束组合", "Go 不会替你自动解决工程问题", "编译期、启动期与运行期是三种不同失败", "把“单二进制”拆成可验证事实", "embed、生成文件与单二进制的真实边界", "运行时成本从哪些地方增长", "Go 与 Shell、Python 的协作边界"]}, {"title": "面对一次性脚本、CLI、Backend 和 Agent，怎样选择程序形态？", "content": "页面、命令或需求说明只能告诉我们系统“要做什么”，不能直接推出“必须有几个服务”。\n最稳妥的起点是选择最少部署单元，再让真实的可靠性、网络和权限约束推动演进。\n\n```mermaid\nflowchart LR\n    A[一次性任务] --> B[模块化程序]\n    B --> C[稳定 CLI]\n    C --> D[模块化 Backend]\n    D --> E[独立 Worker]\n    D --> F[目标机 Agent]\n    D --> G[Kubernetes Controller]\n```\n\n#### 用运行约束而不是界面元素决策\n\n- 单人、本机、一次性处理，优先小程序或脚本。\n- 需要重复执行、参数契约和流水线调用，形成 CLI。\n- 多人共享状态、集中认证或浏览器访问，才增加 Backend。\n- 任务需要重启恢复、自动重试或独立扩缩容，才考虑独立 Worker。\n- 中心端无法访问目标机，或必须在本机采集，才部署 Agent。\n- 需要持续监听资源并协调期望状态，才编写 Controller。\n\n这些组件可以组合。\n例如系统可以同时提供 Backend 和管理员 CLI，也可以由 Backend 下发任务、Agent 轮询执行。\n组合并不意味着每个组件都要成为微服务；早期完全可以把 API、业务和短任务保留在一个清晰分层的进程中。\n\n#### 写下显式排除项\n\n一份可靠的早期设计至少应说明当前为什么不引入 Redis、MQ、WebSocket、时序数据库或独立 Agent，以及什么证据出现后重新评估。\n这样做能防止“以后可能需要”变成永久部署成本，也避免真正需要恢复能力时仍把任务藏在内存里。\n\n可以用下面的最小确认表评审一个想法：\n\n```text\n运行位置：普通服务器上的单实例容器\n使用规模：少量内部用户\n外部操作：只读调用受控 HTTP API\n已有设施：复用现有数据库与 SSO\n失败处理：记录原因并允许人工重试\n当前组件：CLI 或模块化单体 Backend\n升级条件：任务超过请求时限或需要重启恢复\n```\n\n#### 从任务生命周期推导组件\n\n先画任务从创建到结束的状态，而不是先画服务框：\n\n```mermaid\nstateDiagram-v2\n    [*] --> Accepted\n    Accepted --> Running\n    Running --> Succeeded\n    Running --> Failed\n    Running --> Cancelled\n    Failed --> Accepted: RetryAllowed\n    Succeeded --> [*]\n    Cancelled --> [*]\n```\n\n如果程序退出后不需要记住 `Accepted` 和 `Running`，同步 CLI 可能足够。\n如果调用者必须稍后查询状态，就需要稳定的任务 ID 和持久存储。\n如果任务耗时超过 HTTP 请求窗口，Backend 可以只负责接收和查询，执行转交 Worker。\n如果动作只能在目标机本地发生，才把执行能力下沉到 Agent。\n\nController 与普通 Worker 的区别不在于“都循环执行”。\nWorker 消费离散任务并走向终态；Controller 周期性比较期望状态和实际状态，只要差异存在就继续协调。\n用消息队列消费一次任务，不会自动变成 Controller。\n\n#### 五类程序形态的责任清单\n\n| 形态 | 典型入口 | 状态保存 | 主要失败边界 | 最小验收 |\n| --- | --- | --- | --- | --- |\n| 一次性程序 | 文件或固定参数 | 无或输出文件 | 输入、文件、单次 API | 重复执行结果可解释 |\n| CLI | 参数、环境和 stdin | 通常无 | 退出码、stdout/stderr、信号 | 自动化契约稳定 |\n| Backend | HTTP/RPC | 数据库 | 身份、并发、过载、迁移 | 多用户和滚动发布可用 |\n| Worker | 队列或任务表 | 任务状态 | 重试、租约、毒任务 | 崩溃后不丢不重副作用 |\n| Agent | 中心轮询/本地采集 | 有界缓冲 | 断网、提权、全量升级 | 单机成本和安全可控 |\n| Controller | watch 与 workqueue | Kubernetes API | 幂等、冲突、RBAC | 重复 Reconcile 最终收敛 |\n\n这张表不是固定架构。\n早期 Backend 可以在同一进程执行短任务；等任务数量、耗时或恢复要求达到阈值再分离 Worker。\n独立进程是运维边界，意味着新制品、新部署、新指标、新告警和新值班责任，因此必须有收益证据。\n\n#### 用数字写升级阈值\n\n“以后量大了再拆”无法执行。\n把它改成可观测条件，例如：\n\n- 单次任务 p95 超过网关允许的请求时长；\n- 进程重启造成的任务丢失已不能接受；\n- 后台任务消耗使在线 API p95 连续超过 SLO；\n- 不同任务需要独立资源上限或发布节奏；\n- 中心网络无法访问超过某比例的目标主机；\n- 期望状态偏差必须在固定时间内自动收敛；\n- 当前数据库或队列接近连接、吞吐或存储预算。\n\n阈值既要有数值，也要有测量来源和观察窗口。\n例如“过去七天任务 p95 超过 90 秒，而网关 hard timeout 为 60 秒”比“任务有点慢”更能支持拆 Worker。\n\n#### 做一次架构反证\n\n选定方案后，主动证明它可能是错的：\n\n1. 如果不用 Backend，两个操作者同时执行会发生什么？\n2. 如果不用 Worker，进程在任务中途重启会留下什么状态？\n3. 如果不用 Agent，中心端能否通过现有 SSH、API 或 exporter 完成？\n4. 如果不用 MQ，数据库任务表是否已经满足吞吐和恢复？\n5. 如果不用 Controller，CronJob 或普通客户端能否完成同样目标？\n\n反证后仍保留的最小组件，才进入实现。\n练习可以对“批量重启测试环境服务”分别设计 CLI 与 Backend 方案，列出身份、并发、审批、恢复和审计差异，不需要真的实现两个系统。", "subs": ["用运行约束而不是界面元素决策", "写下显式排除项", "从任务生命周期推导组件", "五类程序形态的责任清单", "用数字写升级阈值", "做一次架构反证"]}, {"title": "AI 生成了一段 Go 代码后，最低限度应该验证什么？", "content": "AI 输出应视为一份未经审查的代码变更。\n能编译只说明语法、类型和依赖在当前条件下可接受，不说明代码满足需求，更不说明它在超时、部分失败和退出时安全。\n\n#### 四层验证顺序\n\n1. **意图**：入口、输入、输出和副作用是否与需求一致。\n2. **静态检查**：运行 `gofmt`、`go vet`，审查依赖和危险 API。\n3. **行为测试**：运行 `go test`，覆盖成功、错误、超时和取消。\n4. **运行证据**：在隔离环境观察退出码、日志、资源和目标状态。\n\n```bash\ngofmt -w .\ngo test ./...\ngo vet ./...\ngo test -race ./...\n```\n\n`-race` 只有在测试真正执行到并发路径时才有价值。\n测试通过也不等于真实主机、真实身份或真实 Kubernetes 权限已经验证。\n报告结果时应区分“编译通过”“单元测试通过”“隔离集成测试通过”和“实际环境验证通过”。\n\n#### 优先检查高风险省略\n\n生成代码常见的问题不是复杂算法错误，而是缺少边界：`http.Client` 没有超时、响应体未关闭、goroutine 无退出条件、错误被 `_` 丢弃、日志打印 Token、命令参数经过 Shell 拼接、Kubernetes 客户端使用过大权限。\n审查时从外部输入与副作用开始，比从第一行顺读更容易发现严重问题。\n\n#### 固定当前工具链事实\n\n文档写作时不把本机版本当作读者的统一版本。\n项目应通过 CI、构建镜像或版本文件声明支持范围，并让诊断命令输出真实值：\n\n本文不把“最新稳定版本”写死在学习材料里。\n写作环境实际安装的是 `go1.22.2 darwin/arm64`；项目应在 `go.mod`、CI 镜像和发布记录中声明支持范围，并在升级时重新执行示例和兼容性测试。\n\n```bash\ngo version\ngo env GOVERSION GOOS GOARCH GOPROXY GOSUMDB\ngo list -m all\n```\n\n如果生成代码使用了较新的标准库 API，必须对照项目 `go.mod` 中的 `go` 版本与 CI 工具链，而不是因为开发机能编译就合并。\n\n#### 从数据流反向审查生成代码\n\n审查顺序从副作用终点向输入起点回溯：代码会删除什么、写入什么、调用哪个 API、使用什么身份；这些动作依赖哪些未经校验的数据。\n这样可以快速发现用户输入进入 shell、路径逃逸、URL 被用作 SSRF、日志泄露 Token 等问题。\n\n```text\n外部输入\n  -> 解析和大小限制\n  -> 类型和业务校验\n  -> 授权与数据范围\n  -> 幂等和 dry-run\n  -> 文件 命令 网络或集群副作用\n  -> 结果 审计和退出码\n```\n\n对文件路径，检查清理后的路径是否仍位于允许根目录、是否跟随符号链接、权限是否过宽；对 URL，限制 scheme、目标地址与重定向；对命令，禁止拼接 shell 并限制程序和参数；对 Kubernetes，检查 namespace 与 RBAC 是否最小。\n\n#### 建立威胁与失败检查表\n\n| 检查面 | 必问问题 | 验证方法 |\n| --- | --- | --- |\n| 输入 | 大小、格式、编码、重复值是否受控 | 边界值与模糊输入测试 |\n| 网络 | 是否有 DNS、连接、TLS、响应与总超时 | 慢服务和断连故障注入 |\n| 并发 | goroutine 是否能退出，队列是否有界 | race、取消测试、profile |\n| 凭证 | 是否进入参数、日志、错误或结果 | 搜索输出并使用假 Secret 测试 |\n| 副作用 | 重复执行是否安全，是否支持 dry-run | 同一请求执行两次并比较状态 |\n| 权限 | 身份和资源范围是否最小 | 允许与拒绝矩阵 |\n| 供应链 | 新依赖为何需要，版本和许可是什么 | module diff、漏洞与许可证扫描 |\n| 恢复 | 中途崩溃后如何判断未完成工作 | 在关键提交点 kill 进程 |\n\nAI 可能生成看似合理但不存在的包、过时 API 或错误的版本参数。\n依赖必须能从官方模块信息与项目锁定文件确认；安全相关行为优先查标准库或官方文档。\n不要因为函数名“像真的”就降低验证标准。\n\n#### 测试生成代码的失败路径\n\n成功示例通常最容易生成，真正要补的是失败测试。\n以 HTTP 巡检为例，至少模拟：DNS 失败、TLS 错误、连接成功但 header 延迟、响应体无限流、429、500、无效 JSON、调用方取消和输出 writer 失败。\n每个测试都要验证函数是否在 deadline 内结束、错误是否可分类、资源是否关闭。\n\n执行外部命令时模拟不存在的命令、非零退出、stderr 很大、超时和子进程残留。\n文件写入时模拟目录只读、磁盘空间不足、rename 失败与已有文件。\nKubernetes 客户端测试权限不足、冲突、资源已删除和 API 限流。\n\n不能在单元测试中安全模拟的行为，进入隔离容器、临时 namespace 或测试账号；不要直接拿生产资源做“验证一下”。\n\n#### 记录证据等级\n\n变更说明可以使用固定标签：\n\n```text\nSTATIC    gofmt go vet dependency review passed\nUNIT      deterministic tests passed\nRACE      exercised concurrent tests with race detector\nINTEGRATION tested protocol against isolated real dependency\nRUNTIME   ran built artifact on target OS and architecture\nPROD      observed approved production rollout and health window\n```\n\n较低等级不能冒充较高等级。\n镜像构建成功不是容器启动证明；Pod Ready 不是业务成功证明；fake client 测试通过不是 Kubernetes API 行为证明。\n把证据边界写清楚，后续维护者才能决定还缺哪一层。\n\n#### AI 代码评审练习\n\n让 AI 生成一个“并发检查 URL 的 Go 程序”，暂不要求它修复。\n先独立列出需求和风险，再逐项标记代码是否满足。\n最后只提交最小修复，并为每个修复增加失败测试。\n比较修复前后的 goroutine profile、退出码与 stderr，形成一份可重复的评审记录。", "subs": ["四层验证顺序", "优先检查高风险省略", "固定当前工具链事实", "从数据流反向审查生成代码", "建立威胁与失败检查表", "测试生成代码的失败路径", "记录证据等级", "AI 代码评审练习"]}]}, {"title": "第二章 · 从工具链、模块和入口读懂一个 Go 项目", "sections": [{"title": "安装完成后，怎样确认实际使用的 Go 工具链和目标平台？", "content": "同一台机器可能同时装有系统包、版本管理器和手工解压的 Go。\n排查“本地能编、CI 不能编”时，先收集可执行文件、版本、目标平台、模块和缓存事实，不要立即删除缓存或重装。\n\n```bash\ncommand -v go\ngo version\ngo env GOROOT GOPATH GOOS GOARCH CGO_ENABLED\ngo env GOMOD GOWORK GOPROXY GOSUMDB\n```\n\n#### `GOROOT`、`GOPATH` 与模块不是同一件事\n\n`GOROOT` 指向工具链与标准库；`GOPATH` 现在主要承载模块缓存和安装的命令；`GOMOD` 指出当前生效的 `go.mod`。\n旧材料常把源码必须放进 `$GOPATH/src` 当成主流程，这对现代模块项目已经不是默认。\n维护旧仓库时要先识别其模式，再计划迁移，不要在未知状态下混用两套规则。\n\n#### 目标平台会改变产物\n\n```bash\nGOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/check-linux-amd64 ./cmd/check\nfile dist/check-linux-amd64\n```\n\n设置 `GOOS` 与 `GOARCH` 能交叉编译大量纯 Go 程序，但启用 CGO、依赖系统库或使用平台专有系统调用时，构建链会更复杂。\n交付前至少要在目标平台执行启动、网络、文件、信号与证书加载测试。\n\n#### 诊断不等于修改\n\n`go env`、`go list` 和 `go version -m <binary>` 都是低风险事实收集。\n不要把 `go clean -modcache` 当作常规修复；它会丢掉可复用缓存，也可能掩盖代理、校验或版本声明问题。\n\n#### 从 PATH 追到实际工具链\n\n`command -v go` 只告诉 Shell 解析到的入口，它可能仍是版本管理器 shim。\n继续查看符号链接和环境来源，才能解释为什么交互终端、IDE、systemd 与 CI 使用不同版本：\n\n```bash\ntype -a go\nls -l \"$(command -v go)\"\ngo env GOVERSION GOTOOLCHAIN GOROOT\nenv | sort | grep '^GO'\n```\n\n诊断记录应同时包含命令所在目录和 `go env GOMOD GOWORK`。\n在模块外运行 `go test ./...` 与在仓库根运行可能得到完全不同的包集合。\nIDE 的集成终端也可能继承旧环境，重启 IDE 后变化并不能证明配置根因已经解决。\n\n现代工具链可能根据 `go.mod` 与 `GOTOOLCHAIN` 选择或下载其他工具链，因此 `command -v go` 和实际完成构建的版本也可能不同。\nCI 若禁止动态下载，应显式提供匹配工具链，并让日志打印最终 `go version`。\n\n#### 交叉编译矩阵如何设计\n\n不要默认支持所有 `GOOS/GOARCH` 组合。\n根据真实部署清单建立矩阵：\n\n| 目标 | 构建设置 | 必测行为 |\n| --- | --- | --- |\n| Linux amd64 容器 | `linux/amd64 CGO_ENABLED=0` | DNS、CA、信号、只读根文件系统 |\n| Linux arm64 节点 | `linux/arm64` | CPU 架构、镜像 manifest、系统调用 |\n| macOS 管理端 | `darwin/arm64` | Keychain、路径、签名与隔离属性 |\n| Windows 运维端 | `windows/amd64` | 路径、服务控制、退出与换行 |\n\n共享源码可以通过 `*_linux.go`、`*_windows.go` 和 build constraints 隔离平台实现。\n平台文件仍应实现同一个小接口，让核心逻辑在任意平台测试。\n不要在核心函数里散落大量 `runtime.GOOS` 分支。\n\n#### 缓存、代理与校验故障的定位顺序\n\n依赖下载失败时依次确认模块路径和版本是否存在、Git 凭证是否有效、代理是否可达、私有范围是否匹配、校验服务是否被错误调用。\n使用 `go env GOPROXY GOPRIVATE GONOPROXY GONOSUMDB GOSUMDB` 收集配置，再用一个具体模块复现。\n\n`GONOSUMDB=*` 或 `GOSUMDB=off` 能让错误暂时消失，却会扩大供应链风险，不应作为默认修复。\n公司代理不可用时也不要把私有模块路径暴露给公共服务。\n修复后保留失败命令、原始错误、配置差异和成功验证，避免只有“清缓存好了”。\n\n#### 工具链诊断练习\n\n在一个临时目录和项目根目录分别执行 `go env GOMOD GOWORK`、`go list ./...`，解释输出差异。\n然后构建本机与 Linux 目标二进制，使用 `go version -m` 比较 build settings。\n若没有 Linux 环境，只能把结果标为构建证据，不能标为运行证据。", "subs": ["GOROOT、GOPATH 与模块不是同一件事", "目标平台会改变产物", "诊断不等于修改", "从 PATH 追到实际工具链", "交叉编译矩阵如何设计", "缓存、代理与校验故障的定位顺序", "工具链诊断练习"]}, {"title": "`package`、`main`、`init` 和导出规则怎样决定程序入口？", "content": "每个 Go 文件先声明包。\n可执行程序最终需要 `package main` 和无参数、无返回值的 `main()`；库包则通过首字母大写导出标识符。\n读陌生项目时，先找 `cmd/*/main.go`，再沿显式函数调用进入业务层，比从目录名猜架构可靠。\n\n```text\ncmd/check/main.go        进程入口 参数 信号 退出码\ninternal/checker/        核心巡检逻辑\ninternal/client/         外部 HTTP 或系统接口\ninternal/report/         文本与 JSON 输出\n```\n\n#### 初始化顺序应该可预测\n\n包级变量初始化和 `init()` 在 `main()` 前执行。\n`init()` 适合完成不可避免、无参数的注册，但不适合读取生产配置、访问网络或启动 goroutine。\n隐藏副作用会让测试难以替换依赖，也让导入包本身变成危险动作。\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc run(args []string) error {\n\tfmt.Println(\"run with\", args)\n\treturn nil\n}\n\nfunc main() {\n\tif err := run([]string{\"check\"}); err != nil {\n\t\tpanic(err)\n\t}\n}\n```\n\n真实入口不应 `panic` 处理普通错误，后续会改为集中映射错误和退出码。\n这里的重点是让 `run` 可被测试，而 `main` 只负责进程适配。\n\n#### 导出就是兼容性承诺\n\n大写名称可以被其他包使用，也扩大了长期维护面。\n优先保持包小、导出 API 少，让具体实现留在包内。\n不要为了“将来可能复用”导出所有结构体字段；调用方一旦依赖字段布局，后续修改会更困难。\n\n#### 包初始化的真实次序\n\n程序先按依赖关系初始化被导入包；同一包内先计算包级变量，再按文件顺序相关规则执行 `init`，最后进入 `main`。\n业务代码不应依赖难以看出的文件名顺序。\n需要明确顺序的注册，放进显式构造函数：\n\n```go\ntype Application struct {\n\tchecker *Checker\n\treporter Reporter\n}\n\nfunc NewApplication(cfg Config, reporter Reporter) (*Application, error) {\n\tchecker, err := NewChecker(cfg)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"create checker: %w\", err)\n\t}\n\tif reporter == nil {\n\t\treturn nil, errors.New(\"reporter is required\")\n\t}\n\treturn &Application{checker: checker, reporter: reporter}, nil\n}\n```\n\n构造过程返回错误，让入口决定打印、退出或重试。\n若把同样动作放在 `init`，调用方无法传配置，也很难在测试中模拟失败。\n\n可以用三个小包观察初始化，而不是背规则。\n`config` 的包级变量先计算并打印，`client` 导入 `config`，最后 `main` 导入 `client`。\n运行两次都应得到相同依赖顺序：\n\n```text\nconfig variable\nconfig init\nclient variable\nclient init\nmain init\nmain\n```\n\n若把网络请求或 goroutine 放入 `init`，测试仅仅导入包就会产生副作用，而且失败只能 panic。\n把这些动作移到 `NewApplication` 后，测试可以注入假 client，入口也能输出稳定错误并执行清理。\n\n#### `internal`、`cmd` 和普通包的含义\n\n`internal` 有编译器执行的导入限制：其父树之外的代码不能导入。\n它适合尚未承诺给外部模块的业务实现。\n`cmd/<name>` 是常见约定，不是语言强制；每个子目录通常对应一个 `package main`。\n普通顶层包适合真正希望其他模块使用的 API。\n\n```text\nmodule example.com/platform/ops-check\n├── cmd/ops-check/          executable adapter\n├── internal/check/         private domain behavior\n├── internal/httpclient/    private outbound adapter\n└── report/                 public only if external modules need it\n```\n\n不要创建 `utils`、`common` 作为所有零散函数的归宿。\n包名应说明能力或领域，调用处读起来像 `report.Render`、`target.Parse`。\n如果包互相循环依赖，通常说明责任切分或共享模型位置有问题，而不是需要技巧绕过编译器。\n\n#### 方法、函数和导入时副作用的评审\n\n读陌生仓库时可以执行：\n\n```bash\ngo list -f '{{.ImportPath}} -> {{join .Imports \" \"}}' ./...\ngo doc ./internal/check\ngo test -run TestName -v ./internal/check\n```\n\n先找进程入口，再找配置构造、Server 启动和 goroutine 创建点。\n搜索 `func init()`、包级 `go`、`os.Exit`、`log.Fatal` 和默认 HTTP client，定位导入即执行、深层终止进程或无超时调用。\n库包不应调用 `os.Exit`，否则上层没有清理和错误映射机会。\n\n#### API 兼容练习\n\n把一个导出的结构体字段改名，观察外部包编译如何失败；再把字段隐藏，通过构造器和方法维持契约。\n比较两种设计的升级面。\n练习目标不是把所有字段隐藏，而是理解每个导出名称都需要文档、测试和兼容策略。", "subs": ["初始化顺序应该可预测", "导出就是兼容性承诺", "包初始化的真实次序", "internal、cmd 和普通包的含义", "方法、函数和导入时副作用的评审", "API 兼容练习"]}, {"title": "新项目怎样用 Go Module 管依赖，旧 GOPATH 项目又怎么看？", "content": "`go.mod` 描述模块路径、语言版本与依赖要求，`go.sum` 记录下载内容的校验信息。\n两者都应进入版本控制。\n`go mod tidy` 会根据源码与测试调整依赖，不应在完全不了解差异时机械运行后提交大面积变化。\n\n```bash\nmkdir ops-check && cd ops-check\ngo mod init example.com/ops-check\ngo mod tidy\ngo list -m all\ngo mod verify\n```\n\n#### 版本声明是构建输入\n\n阅读 `go.mod` 时关注：模块路径是否稳定、`go` 指令、直接依赖、`replace` 和 `exclude`。\n本地 `replace ../foo` 很容易造成“开发机正常、CI 找不到目录”；合并前应移除临时替换，或把 workspace 明确限定为本地多模块开发工具。\n\n#### 私有模块需要同时配置访问和隐私\n\n私有仓库通常要设置 `GOPRIVATE`，避免把私有模块路径交给公共代理或校验服务；Git 凭证应来自受控凭证存储，不能写进模块 URL、Shell 历史或仓库。\n\n```bash\ngo env -w GOPRIVATE=git.example.internal\ngo env GOPRIVATE GONOPROXY GONOSUMDB\n```\n\n在共享主机上执行 `go env -w` 会修改用户级配置，自动化环境更适合通过进程环境或 CI Secret 注入并在日志中隐藏值。\n\n#### 供应链检查不能只看能否下载\n\n评审新增依赖时检查维护状态、许可证、间接依赖、权限和替代的标准库方案。\n更新后运行测试和漏洞检查，并保存工具版本与结果。\n`go.sum` 校验内容一致性，不代表依赖没有恶意逻辑或已知漏洞。\n\n#### `go.mod` 中容易被忽略的语义\n\n`go` 指令描述模块的语言与模块语义基线；`toolchain` 可表达建议工具链；`require` 包含直接和间接模块；`replace` 能把模块替换到另一个版本或本地目录；`retract` 由模块作者声明不应使用的版本。\n它们都会改变构建输入。\n\n```mod\nmodule example.com/ops-check\n\ngo 1.22\n\nrequire example.com/platform/sdk v1.4.2\n\nreplace example.com/platform/sdk => ../sdk\n```\n\n上面的本地 replace 只适合受控开发过程。\n发布前执行 `go list -m -json all` 并检查是否仍指向工作区。\n不要手工删除间接依赖以追求文件“干净”；让 `go mod tidy` 基于当前源码和测试计算，再审查 diff。\n\n#### 最小版本选择与升级影响\n\nGo 根据模块图选择构建列表。\n升级一个直接依赖可能同时改变多个间接依赖，因此评审不能只看一行 `require`。\n用下面的命令比较：\n\n```bash\ngo list -m all\ngo mod graph\ngo mod why -m example.com/some/module\ngo list -m -u all\n```\n\n`-u` 只提供可升级信息，不应在 CI 中自动把所有依赖升级。\n升级分支要固定范围，运行单元、集成与目标平台测试，并检查配置默认值、协议和生成代码是否改变。\n\n#### Workspace 解决什么问题\n\n`go.work` 适合本地同时修改多个模块，不需要在每个 `go.mod` 写临时 replace。\n它不天然属于生产构建输入；是否提交由仓库结构决定。\n诊断“为什么使用了本地源码”时检查 `GOWORK`：\n\n```bash\ngo env GOWORK\ngo work use ./service ./sdk\ngo list -m all\n```\n\nCI 若期望单模块可独立构建，应设置清晰工作目录并避免意外拾取父目录 `go.work`。\n发布验证最好在干净 checkout 或构建容器中完成。\n\n#### 私有依赖的凭证边界\n\n私有模块下载通常涉及 Go 命令、代理与 Git 三层。\n`GOPRIVATE` 决定哪些路径跳过公共代理/校验默认值，但不会自动提供 Git 凭证。\n凭证可以来自 SSH agent、受控 netrc 或 CI token；不得把 token 写入 `go.mod`、模块 URL 或构建日志。\n\nCI token 只授予读取所需仓库的权限，并设置过期与轮换。\n构建镜像时使用 secret mount，不把凭证留在镜像层。\n验证镜像历史和最终文件系统中没有 `.netrc`、私钥或包含凭证的 Git 配置。\n\n#### 依赖引入确认单\n\n每个重要依赖回答：标准库为什么不足；项目是否仍维护；许可证是否可接受；会增加哪些间接模块；是否使用 CGO；能否在所有目标平台构建；暴露哪些网络或文件能力；漏洞扫描结果是什么；升级和替换负责人是谁。\n\n练习时选择一个间接依赖，使用 `go mod why` 找到引入路径，再检查它是否进入最终二进制。\n理解“模块图中存在”与“代码链接进入产物”并不完全相同。", "subs": ["版本声明是构建输入", "私有模块需要同时配置访问和隐私", "供应链检查不能只看能否下载", "go.mod 中容易被忽略的语义", "最小版本选择与升级影响", "Workspace 解决什么问题", "私有依赖的凭证边界", "依赖引入确认单"]}]}, {"title": "第三章 · 让输入数据经过类型检查再进入运维逻辑", "sections": [{"title": "变量、零值和作用域怎样影响配置读取与默认值？", "content": "Go 的变量总有类型和零值，这让未初始化内存具有确定行为，却可能把“用户明确配置为零”和“完全没配置”混在一起。\n例如超时 `0` 到底表示禁用、无限等待还是缺少配置，必须由配置模型明确。\n\n```go\ntype Config struct {\n\tEndpoint string\n\tTimeout  time.Duration\n\tDryRun   bool\n}\n\nfunc (c Config) Validate() error {\n\tif c.Endpoint == \"\" {\n\t\treturn errors.New(\"endpoint is required\")\n\t}\n\tif c.Timeout <= 0 {\n\t\treturn errors.New(\"timeout must be positive\")\n\t}\n\treturn nil\n}\n```\n\n#### 用指针或额外状态表达“未提供”\n\n当零值本身是合法配置时，可以用 `*int`、`*bool` 或显式的 `Set` 标记区分缺失与零。\n不要把所有字段都改成指针；只在输入边界需要三态语义时使用，并尽快转换成内部不含歧义的值对象。\n\n#### 警惕短变量声明造成遮蔽\n\n```go\nresult, err := load()\nif err != nil {\n\treturn err\n}\nif refresh {\n\tresult, err := reload() // 新的 result 只活在 if 中\n\tif err != nil {\n\t\treturn err\n\t}\n\tfmt.Println(result)\n}\n```\n\n遮蔽不一定编译失败，却可能让外层变量保持旧值。\n缩短函数、避免重复名称，并使用静态分析发现可疑遮蔽。\n观察点是分支结束后外层值是否真的更新，而不是只看分支内日志。\n\n#### 声明方式表达不同意图\n\n`var timeout time.Duration` 强调类型与零值；`timeout := 5 * time.Second` 适合局部推断；`const` 适合编译期不变值。\n包级可变变量会制造跨测试和跨请求共享状态，应尽量由构造器注入。\n\n```go\nconst defaultWorkers = 4\n\ntype RawConfig struct {\n\tWorkers *int `json:\"workers\"`\n}\n\nfunc normalize(raw RawConfig) (int, error) {\n\tif raw.Workers == nil {\n\t\treturn defaultWorkers, nil\n\t}\n\tif *raw.Workers < 1 || *raw.Workers > 32 {\n\t\treturn 0, fmt.Errorf(\"workers must be in [1,32]\")\n\t}\n\treturn *raw.Workers, nil\n}\n```\n\n指针只存在于“是否提供”的输入层；规范化后核心拿到无歧义的 `int`。\n这样后续函数不必到处重复默认逻辑和 nil 判断。\n\n#### 配置来源与覆盖顺序\n\n运维程序常同时接收默认值、配置文件、环境变量和命令行。\n覆盖顺序要固定，例如 `CLI > environment > file > defaults`，并保存每个最终值的来源。\nSecret 只能显示来源和是否已设置，不能显示值。\n\n解析和校验分两步：解析回答“文本能否转换为类型”，校验回答“值在业务中是否允许”。\n`30s` 能解析为 duration，但可能超过巡检允许的 10 秒；端口能解析为整数，但 0 可能不允许。\n所有来源合并后再做一次跨字段校验，例如 `requestTimeout < batchDeadline`。\n\n#### 作用域与生命周期\n\n变量的词法作用域不等于其引用对象的生命周期。\n闭包捕获变量、slice 指向底层数组、goroutine 持有指针，都可能让对象活得更久。\n循环中启动 goroutine 时应确认每次迭代捕获的是预期值，并使用当前 Go 版本语义编写测试，而不是照搬旧版本结论。\n\n包级缓存、`sync.Once` 和默认客户端会跨测试存活。\n测试若修改它们，必须恢复或重新设计为实例字段。\n`t.Setenv` 能在测试结束恢复环境变量，但并行测试仍不能安全修改同一个进程全局状态。\n\n#### 配置边界测试\n\n至少测试缺失、显式零、负数、上界、上界加一、空字符串、只有空白、未知字段和来源冲突。\n输出规范化配置时将 duration 格式化为带单位字符串，列表和 map 使用稳定顺序。\n练习目标是让两名操作者对同一输入得到完全相同的可信配置和诊断。", "subs": ["用指针或额外状态表达“未提供”", "警惕短变量声明造成遮蔽", "声明方式表达不同意图", "配置来源与覆盖顺序", "作用域与生命周期", "配置边界测试"]}, {"title": "数值、字符串和 Unicode 输入需要防哪些隐式假设？", "content": "运维数据充满边界：端口不能为负、字节数可能溢出、持续时间带单位、主机名与标签可能包含非 ASCII 字符。\nGo 不会自动替你确认业务范围。\n\n```go\nfunc parsePort(raw string) (uint16, error) {\n\tn, err := strconv.ParseUint(raw, 10, 16)\n\tif err != nil {\n\t\treturn 0, fmt.Errorf(\"parse port %q: %w\", raw, err)\n\t}\n\tif n == 0 {\n\t\treturn 0, errors.New(\"port must be between 1 and 65535\")\n\t}\n\treturn uint16(n), nil\n}\n```\n\n#### 字符串长度默认是字节数\n\n`len(s)` 返回 UTF-8 字节数，不是用户看到的字符数；`s[i]` 取出一个字节。\n按 Unicode 码点处理时使用 `for range` 或 `[]rune`，但“用户感知字符”还可能由多个码点组成。\n日志截断首先按字节预算保证协议安全，再决定是否需要 Unicode 边界。\n\n```go\ns := \"节点A\"\nfmt.Println(len(s))\nfor index, r := range s {\n\tfmt.Printf(\"byte_index=%d rune=%q\\n\", index, r)\n}\n```\n\n#### 单位必须进入类型或名称\n\n不要让裸整数同时表示秒、毫秒和字节。\n持续时间使用 `time.Duration` 并通过 `time.ParseDuration` 解析；容量字段命名为 `MaxBytes`、`BatchSize`。\n对来自 JSON 的大整数要考虑浮点解码问题，必要时使用 `json.Decoder.UseNumber` 或字符串承载标识符。\n\n#### 整数范围与转换\n\n不同整数类型转换不会自动报告溢出。\n先按输入允许范围解析，再转换到目标类型：\n\n```go\nfunc parseBytes(raw string) (int64, error) {\n\tvalue, err := strconv.ParseInt(raw, 10, 64)\n\tif err != nil {\n\t\treturn 0, fmt.Errorf(\"parse bytes %q: %w\", raw, err)\n\t}\n\tif value < 0 || value > 1<<30 {\n\t\treturn 0, fmt.Errorf(\"bytes must be in [0,1073741824]\")\n\t}\n\treturn value, nil\n}\n```\n\n使用 `int` 表示内存索引和长度，使用明确位宽类型表示协议或持久化字段。\n不要把数据库 ID 解码成 `float64`；大整数超过浮点精确范围后会悄悄变化。\nID 通常更适合作为字符串处理，不参与算术。\n\n#### 时间、时区与时间窗口\n\n`time.Duration` 表达时间间隔，`time.Time` 表达时间点。\n日志和 API 时间优先使用带时区的 RFC3339；持久化时明确 UTC，展示时再转换。\n不要用固定 24 小时推导“明天同一当地时间”，因为夏令时地区可能不是 24 小时。\n\n超时使用单调时间部分计算经过时长；序列化后的时间会失去单调部分，不能拿跨进程时间戳精确计算延迟。\n验证证书、指令有效期和租约时，要考虑时钟漂移并监控 NTP 状态。\n\n#### UTF-8、无效字节与规范化\n\nGo 字符串可以包含任意字节，并不保证是合法 UTF-8。\n读取日志或文件后用 `utf8.ValidString` 判断，再决定拒绝、替换还是保留原始字节。\n协议字段若要求 ASCII，应显式限制；不要因为 Go 支持 Unicode 就放开主机名、标签键或环境变量名的所有字符。\n\n视觉上相同的 Unicode 文本可能有不同码点组合。\n需要身份、唯一键或安全比较时，先依据协议定义规范化规则；若协议没有定义，不要自行转换后声称等价。\n文件路径还涉及大小写敏感、分隔符和平台差异。\n\n#### 安全截断输出\n\n日志字段需要同时满足容量和可读性。\n先限制读取总字节，避免内存失控；显示时再沿 UTF-8 边界截断并标记 `truncated=true`。\nSecret 脱敏不能只替换固定前缀，结构化日志应从源头不加入敏感字段。\n\n测试包含中文、emoji、组合字符、无效 UTF-8、空字节和超长输入。\n观察 JSON encoder 对无效字节的处理是否符合契约，并确保截断后仍能输出合法 JSON。", "subs": ["字符串长度默认是字节数", "单位必须进入类型或名称", "整数范围与转换", "时间、时区与时间窗口", "UTF-8、无效字节与规范化", "安全截断输出"]}, {"title": "批量目标、标签和状态应该怎样选择 slice、map 与 struct？", "content": "slice 表达有序批次，map 表达按键索引，struct 表达有名称和约束的记录。\n选择容器应从业务语义出发，而不是从“哪个更快”出发。\n\n```go\ntype Target struct {\n\tName   string\n\tURL    string\n\tLabels map[string]string\n}\n\nfunc indexTargets(items []Target) (map[string]Target, error) {\n\tindex := make(map[string]Target, len(items))\n\tfor _, item := range items {\n\t\tif item.Name == \"\" {\n\t\t\treturn nil, errors.New(\"target name is required\")\n\t\t}\n\t\tif _, exists := index[item.Name]; exists {\n\t\t\treturn nil, fmt.Errorf(\"duplicate target %q\", item.Name)\n\t\t}\n\t\tindex[item.Name] = item\n\t}\n\treturn index, nil\n}\n```\n\n#### slice 是一个视图\n\nslice 包含指向底层数组的引用、长度和容量。\n切片、追加和传参可能共享底层数组；调用方若要求不被修改，函数应复制输入或明确所有权。\n`append` 有时复用原数组、有时分配新数组，不能依赖偶然容量判断隔离性。\n\n#### slice 复制的是描述，不一定是数据\n\n赋值或传参通常只复制 slice 头，多个调用者仍可能共享底层数组。\n跨 goroutine 传递前要么复制元素，要么明确只读协议；否则即使没有显式全局变量，也可能产生数据竞争和任务内容被覆盖。\n验证时让生产者修改原 slice，再比较复制版本与共享版本的结果，并用 `go test -race` 确认共享版本的风险。\n\n#### map 不是稳定顺序\n\nmap 遍历顺序不应成为输出契约。\n生成报表、配置差异或测试快照前先提取键并排序。\n并发读写普通 map 会产生数据竞争甚至运行时错误，需要锁、单一所有者 goroutine 或重新设计数据流。\n\n#### struct 让非法状态更难进入核心\n\n外部 JSON 可以先解码到输入结构，完成 URL、名称和标签校验后，再转换成内部 `Target`。\n避免让 `map[string]any` 穿过整个业务层，因为拼写错误和类型错误会延迟到运行时才暴露。\n\n#### 数组、slice 与容量变化\n\n数组长度属于类型，`[16]byte` 与 `[32]byte` 不同；它适合固定摘要和协议字段。\nslice 是对数组的一段视图。\n`len` 表示可访问元素数，`cap` 表示从起点到底层数组末尾的容量。\n\n```go\nfunc cloneTargets(in []Target) []Target {\n\tout := make([]Target, len(in))\n\tcopy(out, in)\n\tfor i := range out {\n\t\tout[i].Labels = maps.Clone(in[i].Labels)\n\t}\n\treturn out\n}\n```\n\n只复制 slice 仍是浅复制，其中的 map 继续共享。\n是否需要深复制取决于所有权契约。\n比起在每个函数防御性复制，更重要的是说明谁可以修改、何时不再修改。\n\n从大 buffer 截取很小 slice 并长期保存，会让整个底层数组无法回收。\n解析大文件后若只保留少量 token，可以复制需要部分，避免意外保留数百 MiB。\n\n#### nil 与空集合的外部契约\n\nnil slice 和长度为零的非 nil slice 都可 range、append，但 JSON 默认分别编码为 `null` 和 `[]`。\nAPI 若承诺数组字段始终为数组，需要初始化空 slice或自定义编码。\nnil map 可以读取，写入会 panic；构造可变 map 前必须 make。\n\n```go\ntype Report struct {\n\tResults []Result `json:\"results\"`\n}\n\nreport := Report{Results: make([]Result, 0)}\n```\n\n不要让内部偶然表示泄露成不稳定 API。\n测试应固定空集合、缺失字段和 null 的含义。\n\n#### map 键和并发边界\n\nmap 键必须可比较；slice、map 和 function 不能直接作为键。\n复合键可使用小 struct，避免手工拼字符串产生分隔冲突：\n\n```go\ntype targetKey struct {\n\tCluster string\n\tName    string\n}\n```\n\n普通 map 允许并发只读，但只要可能同时写就必须同步。\n最简单设计是构建后冻结，后续只读；或让单一 goroutine 拥有 map，通过消息接收变更。\n`sync.Map` 只适合特定访问模式，不是给普通 map 加并发安全的默认答案。\n\n#### struct 标签与输入模型\n\nJSON tag 决定外部字段名，`omitempty` 会改变零值输出。\n输入、领域和输出使用不同 struct 往往更安全：输入允许可选字段和原始字符串；领域模型保证不变量；输出只暴露稳定字段。\n不要把数据库模型直接作为 HTTP 响应，否则内部列和敏感字段容易意外公开。\n\n#### 泛型只解决重复类型逻辑\n\n运维代码首先要能读懂标准库 `slices`、`maps` 和项目中的简单类型参数。\n泛型适合“算法完全相同、只有元素类型不同”的纯逻辑，例如稳定去重；它不适合隐藏 HTTP、数据库或权限差异，也不应把 `any` 换成一串难读约束来追求抽象。\n\n```go\nfunc StableUnique[T comparable](items []T) []T {\n\tseen := make(map[T]struct{}, len(items))\n\tout := make([]T, 0, len(items))\n\tfor _, item := range items {\n\t\tif _, ok := seen[item]; ok {\n\t\t\tcontinue\n\t\t}\n\t\tseen[item] = struct{}{}\n\t\tout = append(out, item)\n\t}\n\treturn out\n}\n```\n\n`T comparable` 表示值可用 `==` 并可作为 map key，因此 slice、map 和 function 不能作为这个函数的元素类型。\n调用时通常由参数推断 `T`。\n测试空输入、重复项与顺序；同时检查返回 slice 是否需要与输入隔离。\n\n标准库的 `maps.Clone` 只复制 map 容器，值若含 slice、map 或指针仍会共享内部对象。\n`slices.Clone` 同样是浅复制。\n泛型没有改变所有权问题；评审时仍要问谁能修改底层数据、跨 goroutine 后是否只读。\n\n不需要为每种领域动作建立 `Repository[T]`。\n主机、任务和凭证的查询、授权、事务与错误语义不同，用一个万能泛型仓库往往隐藏了契约。\n先保留具体小接口，只有出现真实重复且行为完全一致时再抽取。\n\n#### 泛型阅读练习\n\n从 `StableUnique[string]` 开始，确认编译器可以推断类型；再尝试 `[][]byte`，观察 comparable 约束如何在编译期拒绝。\n最后把函数用于目标 ID 去重，验证输入顺序保留、原 slice 未改变，并记录项目最低 Go 版本是否支持所用标准库辅助函数。\n\n#### 容器选择练习\n\n实现“按集群和名称去重目标，并按原输入顺序输出结果”。\n使用 slice 保存顺序、`map[targetKey]int` 保存索引、struct 表达目标。\n测试重复键、空集合、标签修改、稳定 JSON 和并发只读，解释每个容器承担的业务语义。", "subs": ["slice 是一个视图", "slice 复制的是描述", "map 不是稳定顺序", "struct 让非法状态更难进入核心", "数组、slice 与容量变化", "nil 与空集合的外部契约", "map 键和并发边界", "struct 标签与输入模型", "泛型只解决重复类型逻辑", "泛型阅读练习", "容器选择练习"]}]}, {"title": "第四章 · 用函数、方法、接口和错误组织可靠代码", "sections": [{"title": "控制流怎样保持快乐路径，并让失败尽早返回？", "content": "运维代码经常包含校验、外部调用和清理。\n把错误尽早返回，可以让主路径保持从上到下，并为每个失败增加具体上下文。\n\n```go\nfunc Check(ctx context.Context, target Target, client *http.Client) (Result, error) {\n\tif err := validateTarget(target); err != nil {\n\t\treturn Result{}, fmt.Errorf(\"validate target: %w\", err)\n\t}\n\n\treq, err := http.NewRequestWithContext(ctx, http.MethodGet, target.URL, nil)\n\tif err != nil {\n\t\treturn Result{}, fmt.Errorf(\"build request: %w\", err)\n\t}\n\n\tresp, err := client.Do(req)\n\tif err != nil {\n\t\treturn Result{}, fmt.Errorf(\"request %s: %w\", target.Name, err)\n\t}\n\tdefer resp.Body.Close()\n\n\treturn decodeResult(resp)\n}\n```\n\n#### `for` 是唯一循环，但退出语义要明确\n\n无限循环适合服务主循环，却必须绑定 `context`、channel 或连接关闭条件。\n`break` 默认只离开最内层结构，复杂嵌套应拆函数或使用带名称的循环，避免“以为已经退出”导致后台任务继续运行。\n\n#### `switch` 适合显式状态分派\n\n用 `switch` 处理状态码或任务状态时，应保留 default 分支记录未知值。\n不要把未来新增状态静默当作成功。\n状态机变更需要测试每个允许与拒绝的跃迁。\n\n#### 快乐路径不是忽略清理\n\n尽早返回减少嵌套，但资源获得后必须立即安排清理。\n`defer` 在当前函数返回时执行，采用后进先出顺序。\n循环里不断 defer 会把资源保留到整个函数结束，处理大量文件时应把单次操作拆成小函数：\n\n```go\nfunc readOne(path string, limit int64) ([]byte, error) {\n\tfile, err := os.Open(path)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"open %s: %w\", path, err)\n\t}\n\tdefer file.Close()\n\n\tdata, err := io.ReadAll(io.LimitReader(file, limit+1))\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"read %s: %w\", path, err)\n\t}\n\tif int64(len(data)) > limit {\n\t\treturn nil, fmt.Errorf(\"%s exceeds %d bytes\", path, limit)\n\t}\n\treturn data, nil\n}\n```\n\n只 defer `Close` 不代表关闭错误永远可忽略。\n写文件时，flush、sync 和 close 都可能报告持久化失败，应在返回成功前检查。\nHTTP 响应体关闭主要用于连接回收，业务错误仍来自读取和协议校验。\n\n#### 循环的取消和部分结果\n\n批量处理要决定遇到一个错误是立即失败、继续并汇总，还是达到阈值后停止。\n三种都合理，但必须形成契约。\n继续模式应把目标和原因放进结构化结果；立即失败仍要取消并等待已经启动的工作。\n\n```go\nfor _, target := range targets {\n\tselect {\n\tcase <-ctx.Done():\n\t\treturn results, fmt.Errorf(\"batch cancelled: %w\", ctx.Err())\n\tdefault:\n\t}\n\tresult, err := check(ctx, target)\n\tresults = append(results, Result{Target: target, Err: err})\n}\n```\n\n不要在 tight loop 的 default 分支空转等待事件；这里 default 只做非阻塞取消检查，随后有真实工作。\n服务循环应阻塞在 channel、timer 或 I/O 上。\n\n#### 状态机显式拒绝未知状态\n\n```go\nfunc canTransition(from, to Status) bool {\n\tswitch from {\n\tcase Pending:\n\t\treturn to == Running || to == Cancelled\n\tcase Running:\n\t\treturn to == Succeeded || to == Failed || to == Cancelled\n\tcase Succeeded, Failed, Cancelled:\n\t\treturn false\n\tdefault:\n\t\treturn false\n\t}\n}\n```\n\n测试采用状态矩阵覆盖全部组合，并单独测试未知值。\n若新增状态而测试未更新，矩阵应失败，迫使维护者决定合法跃迁。\n\n#### 控制流练习\n\n把一个三层嵌套的“读取配置—遍历目标—调用 API”函数拆成输入校验、单目标处理和汇总三个函数。\n故意注入第二个目标失败与上下文取消，确认已经完成的结果、退出原因和资源关闭都符合书面契约。", "subs": ["for 是唯一循环", "switch 适合显式状态分派", "快乐路径不是忽略清理", "循环的取消和部分结果", "状态机显式拒绝未知状态", "控制流练习"]}, {"title": "函数、receiver 和组合怎样把运维动作拆成可测试单元？", "content": "函数边界应围绕责任和副作用：解析配置、选择目标、执行检查、汇总结果、渲染输出。\n把网络、时钟和文件系统作为依赖传入，测试就能替换它们，而无需访问真实环境。\n\n```go\ntype Checker interface {\n\tCheck(context.Context, Target) (Result, error)\n}\n\ntype Runner struct {\n\tchecker Checker\n}\n\nfunc NewRunner(checker Checker) *Runner {\n\treturn &Runner{checker: checker}\n}\n```\n\n#### receiver 选择表达对象语义\n\n小且不可变的值类型可用值 receiver；需要修改接收者、包含锁或复制代价明显时使用指针 receiver。\n同一类型的方法尽量保持一致。\n含 `sync.Mutex` 的结构体不能在使用后复制，否则锁保护的就不是同一份状态。\n\n#### 组合优先于模拟继承\n\n结构体嵌入可以提升字段和方法，但不能把“看起来像继承”当成设计目标。\n显式字段通常更清楚：`Runner` 拥有 `Checker`，而不是“Runner 是 Checker”。\n接口放在使用方附近，只描述调用方真正需要的能力。\n\n#### 构造函数负责建立不变量\n\nGo 没有强制构造函数，因此调用方仍可能直接写结构体字面量。\n对必须校验的类型，应隐藏字段并提供 `New...`；对简单数据结构，则不必为每个 struct 添加无价值构造器。\n\n#### 纯逻辑与副作用分离\n\n最容易测试的函数接收值并返回值，不读取环境、时钟或网络。\n把副作用推到适配器：\n\n```go\ntype Clock interface {\n\tNow() time.Time\n}\n\ntype Store interface {\n\tSave(context.Context, Report) error\n}\n\ntype Service struct {\n\tclock Clock\n\tstore Store\n}\n\nfunc (s *Service) Complete(ctx context.Context, results []Result) error {\n\treport := BuildReport(results, s.clock.Now())\n\tif err := s.store.Save(ctx, report); err != nil {\n\t\treturn fmt.Errorf(\"save report: %w\", err)\n\t}\n\treturn nil\n}\n```\n\n`BuildReport` 可用固定输入直接测试；Service 测试注入 fake clock 和 fake store；repository 集成测试再验证真实文件或数据库。\n不要为每个标准库函数创建接口，接口应围绕调用方所需行为。\n\n#### 参数与返回值设计\n\n参数过多往往说明缺少领域对象或函数承担太多责任。\n配置型参数可聚合为 struct，但不要用 `map[string]any` 隐藏类型。\n返回多个值适合结果与错误，若返回项有多个相同类型，使用命名 struct 减少位置误用。\n\n切片、map、指针作为参数会共享数据。\n函数若修改输入，应从名称、文档或类型设计看得出来。\n返回内部 map 会让调用方绕过锁和不变量，可返回副本或只提供查询方法。\n\n#### 值 receiver 与指针 receiver 的方法集合\n\n值 receiver 方法属于 `T` 和 `*T` 的方法集合；指针 receiver 方法只属于 `*T`。\n这会影响接口实现。\n选型不仅看性能，还看语义：值是否应复制、方法是否修改状态、是否包含 mutex。\n\n```go\ntype TargetID string\n\nfunc (id TargetID) String() string { return string(id) }\n\ntype Counter struct {\n\tmu sync.Mutex\n\tn  int64\n}\n\nfunc (c *Counter) Add(delta int64) {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\tc.n += delta\n}\n```\n\n`TargetID` 是小值，可用值 receiver；`Counter` 必须保持同一身份且不能复制，使用指针 receiver。\n可以加入编译期接口断言 `var _ fmt.Stringer = TargetID(\"\")`，让契约变化尽早失败。\n\n#### 嵌入不等于继承\n\n嵌入会提升方法，但外层类型并不是内层类型的子类。\n方法冲突和零值行为都需要显式理解。\n对关键依赖使用命名字段更便于查找和替换：\n\n```go\ntype Service struct {\n\tclient  *http.Client\n\tchecker Checker\n\tlogger  *slog.Logger\n}\n```\n\n构造器检查 nil、范围和必需配置，只保存已经验证的依赖。\n可选项可使用配置 struct；functional options 适合选项多且需要向后兼容的公共库，不是所有内部类型的默认样板。\n\n#### 函数边界练习\n\n把直接读取环境变量、调用 HTTP、打印 JSON 和 `os.Exit` 的函数拆成四层。\n测试核心函数时不启动服务器；测试 HTTP adapter 使用 `httptest`; 测试入口用内存 writer。\n解释每层失败由谁增加上下文、由谁映射退出码。", "subs": ["receiver 选择表达对象语义", "组合优先于模拟继承", "构造函数负责建立不变量", "纯逻辑与副作用分离", "参数与返回值设计", "值 receiver 与指针 receiver 的方法集合", "嵌入不等于继承", "函数边界练习"]}, {"title": "接口和错误链怎样表达契约，而不是隐藏失败？", "content": "接口用于解耦行为，错误用于表达未完成的操作。\n接口越小越容易实现和测试；错误越有上下文越容易定位，但又必须保留底层原因供 `errors.Is`、`errors.As` 分类。\n\n#### interface 的动态类型与动态值\n\n接口值可以抽象为动态类型和动态值两部分；只有两部分都为空时接口才是 `nil`。\n将 nil 指针放入接口后动态类型仍存在，`x == nil` 可能为假而方法内部解引用崩溃，边界构造函数应提前拒绝这种状态。\n可用一个 `var p *Target` 赋给接口的最小测试观察比较结果，并断言构造函数在进入业务层前返回稳定错误。\n\n```mermaid\nflowchart LR\n    A[interface value] --> B[dynamic type]\n    A --> C[dynamic value]\n    B --> D[method set]\n    C --> E[method receiver]\n    D --> F{both empty?}\n    F -->|yes| G[nil interface]\n    F -->|no| H[non-nil interface]\n```\n\n```go\nvar ErrUnauthorized = errors.New(\"unauthorized\")\n\nfunc fetch(ctx context.Context, c *http.Client, url string) error {\n\treq, err := http.NewRequestWithContext(ctx, http.MethodGet, url, nil)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"build request: %w\", err)\n\t}\n\tresp, err := c.Do(req)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"send request: %w\", err)\n\t}\n\tdefer resp.Body.Close()\n\tif resp.StatusCode == http.StatusUnauthorized {\n\t\treturn ErrUnauthorized\n\t}\n\tif resp.StatusCode >= 500 {\n\t\treturn fmt.Errorf(\"remote temporary failure: status=%d\", resp.StatusCode)\n\t}\n\treturn nil\n}\n```\n\n#### `nil` 接口包含类型和值两部分\n\n把一个值为 nil 的具体指针装进接口后，接口本身可能不等于 nil。\n不要用返回具体 nil 指针的方式制造 `error`；返回前让错误接口直接取 `nil`。\n遇到“打印像 nil、判断却不是 nil”时，检查动态类型和值。\n\n#### 普通失败返回 error，程序不变量破坏才考虑 panic\n\n文件不存在、远端超时、认证失败和用户输入错误都属于可预期失败，应返回错误。\n`panic` 更适合进程无法继续的编程错误或初始化不变量破坏；HTTP 中间件可以在边界 recover 防止单请求击垮进程，但必须记录堆栈并返回通用错误，不能借此忽略资源一致性。\n\n#### 错误分类驱动动作\n\n调用方关心的是能否重试、是否需要修正输入、是否需要重新认证。\n错误消息给人读，类型或哨兵错误给程序分类。\n重试前同时检查错误类别、操作幂等性、剩余 deadline 与重试预算，不能见错就重试。\n\n#### 接口由使用方定义\n\n外部 SDK 可能暴露几十个方法，而业务只需查询一个目标。\n调用方定义最小接口：\n\n```go\ntype TargetGetter interface {\n\tGetTarget(context.Context, string) (Target, error)\n}\n```\n\n真实 SDK adapter 实现它，测试 fake 只需一个方法。\n不要在提供方提前创建巨大接口，也不要为了 mock 把每个具体类型都接口化。\n接口的价值是表达替换点和行为契约，而不是追求“面向接口”口号。\n\n接受接口、返回具体类型通常让调用方更灵活；但这是经验而非绝对规则。\n构造器返回接口会隐藏具体能力和 nil 陷阱，除非确实需要多实现或封装兼容性。\n\n#### 哨兵、类型错误与包装\n\n固定类别可用哨兵错误；需要携带结构数据时用自定义类型：\n\n```go\ntype StatusError struct {\n\tCode int\n\tURL  string\n}\n\nfunc (e *StatusError) Error() string {\n\treturn fmt.Sprintf(\"request %s returned status %d\", e.URL, e.Code)\n}\n\nfunc temporary(err error) bool {\n\tvar statusErr *StatusError\n\treturn errors.As(err, &statusErr) && statusErr.Code >= 500\n}\n```\n\n每层只增加对定位有价值的上下文，使用 `%w` 保留链。\n不要同时记录并返回同一个错误导致每层重复日志；通常在能关联 request/task 并决定最终动作的边界记录一次。\n\n#### 多错误与部分失败\n\n批量操作可以用结果数组保存每目标错误，或使用 `errors.Join` 表达整体包含多个根因。\n调用方仍可用 `errors.Is/As` 检查链，但机器输出最好保留目标与错误码对应关系，而不是只打印合并字符串。\n\n```go\nvar errs []error\nfor _, target := range targets {\n\tif err := check(ctx, target); err != nil {\n\t\terrs = append(errs, fmt.Errorf(\"%s: %w\", target, err))\n\t}\n}\nreturn errors.Join(errs...)\n```\n\n`errors.Join` 从 Go 1.20 起可用；先确认项目最低 Go 版本包含所用 API，否则使用兼容的聚合错误类型。\n若不支持，使用结构化结果或自定义聚合类型，不要为了一个便利函数偷偷提高工具链要求。\n\n#### panic、recover 与 defer 的边界\n\nrecover 只有在同一 goroutine 的 deferred function 中有效。\n它适合 HTTP 请求或任务边界，防止单个未知缺陷击垮整个进程；恢复后必须记录 stack、标记操作失败，并考虑状态是否已经部分提交。\n它不能跨 goroutine 捕获，也不能把所有编程错误变成“成功”。\n\n库函数遇到外部输入错误应返回 error。\n`Must...` 形式只适合静态、在开发时即可发现的不变量，并在名称中明确可能 panic。\n生产配置和网络永远不属于 Must 场景。\n\n#### 错误契约测试\n\n测试关注 `errors.Is/As`、稳定错误码和动作，而不是完整文案。\n覆盖包装两层后仍能识别；未知错误映射为通用内部失败；认证错误不重试；临时错误在幂等和 deadline 允许时重试；取消保留 `context.Canceled` 或 `DeadlineExceeded`。\n\n#### 贯穿实验：实现配置检查器，而不是只写语法片段\n\n第一册用一个 `ops-config-check` 收束语言基础。\n它读取目标地址、并发数和标签，完成语法校验与规范化，但不访问真实网络。\n这样可以把类型、集合、函数、接口和错误放进同一条可测试链路。\n\n```go\npackage config\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"net/url\"\n\t\"sort\"\n\t\"strings\"\n)\n\nvar ErrInvalid = errors.New(\"invalid configuration\")\n\ntype Input struct {\n\tTarget  string\n\tWorkers int\n\tLabels  map[string]string\n}\n\ntype Config struct {\n\tTarget  *url.URL\n\tWorkers int\n\tLabels  []string\n}\n\nfunc Parse(in Input) (Config, error) {\n\tif in.Workers < 1 || in.Workers > 32 {\n\t\treturn Config{}, fmt.Errorf(\"%w: workers must be in [1,32]\", ErrInvalid)\n\t}\n\ttarget, err := url.ParseRequestURI(strings.TrimSpace(in.Target))\n\tif err != nil || (target.Scheme != \"http\" && target.Scheme != \"https\") {\n\t\treturn Config{}, fmt.Errorf(\"%w: target must be an HTTP URL\", ErrInvalid)\n\t}\n\n\tlabels := make([]string, 0, len(in.Labels))\n\tfor key, value := range in.Labels {\n\t\tkey, value = strings.TrimSpace(key), strings.TrimSpace(value)\n\t\tif key == \"\" || value == \"\" {\n\t\t\treturn Config{}, fmt.Errorf(\"%w: label key and value cannot be empty\", ErrInvalid)\n\t\t}\n\t\tlabels = append(labels, key+\"=\"+value)\n\t}\n\tsort.Strings(labels)\n\treturn Config{Target: target, Workers: in.Workers, Labels: labels}, nil\n}\n```\n\n这个例子刻意做了四件事：输入和可信配置使用不同类型；边界处一次完成清理；map 在输出前排序；错误既保留上下文又支持 `errors.Is(err, ErrInvalid)`。\n核心逻辑不读取环境变量、不打印日志、不调用 `os.Exit`，因此测试无需修改进程全局状态。\n\n表驱动测试至少覆盖：合法 HTTP/HTTPS、空地址、非法协议、并发下界与上界、空标签、标签排序，以及调用方能否识别 `ErrInvalid`。\n不要只比较完整错误字符串，否则增加上下文会导致无价值的测试破坏。\n\n```go\nfunc TestParse(t *testing.T) {\n\ttests := []struct {\n\t\tname    string\n\t\tinput   Input\n\t\twantErr bool\n\t}{\n\t\t{\"valid\", Input{\"https://example.com/health\", 4, map[string]string{\"env\": \"prod\"}}, false},\n\t\t{\"bad scheme\", Input{\"file:///etc/passwd\", 4, nil}, true},\n\t\t{\"zero workers\", Input{\"https://example.com\", 0, nil}, true},\n\t}\n\tfor _, tt := range tests {\n\t\tt.Run(tt.name, func(t *testing.T) {\n\t\t\t_, err := Parse(tt.input)\n\t\t\tif (err != nil) != tt.wantErr {\n\t\t\t\tt.Fatalf(\"Parse() error = %v, wantErr %v\", err, tt.wantErr)\n\t\t\t}\n\t\t\tif tt.wantErr && !errors.Is(err, ErrInvalid) {\n\t\t\t\tt.Fatalf(\"expected ErrInvalid, got %v\", err)\n\t\t\t}\n\t\t})\n\t}\n}\n```\n\n#### 从需求到包边界的落地步骤\n\n一个适合运维团队维护的最小模块可以从下面的边界开始，而不是一开始复制大型项目布局：\n\n```text\nops-config-check/\n├── go.mod\n├── cmd/ops-config-check/main.go   # 参数、输出、退出码\n└── internal/config/\n    ├── config.go                  # 类型、解析、校验\n    └── config_test.go             # 行为契约\n```\n\n`main` 只做适配：收集原始输入，调用 `config.Parse`，把已分类错误映射为稳定退出码。\n业务包不依赖命令行框架，未来放进 HTTP 服务或 Agent 时无需复制规则。\n只有出现第二个真正消费者后，再抽取公共包；不要为想象中的复用提前公开 API。\n\n推荐用以下顺序完成实验：\n\n1. 先写失败测试，固定并发范围、协议白名单和标签顺序。\n2. 实现 `Input`、`Config` 和 `Parse`，执行 `go test ./...`。\n3. 增加命令入口，区分 stdout 的机器结果与 stderr 的诊断。\n4. 执行 `go vet ./...`，检查格式和静态问题。\n5. 分别构建当前平台与目标平台，记录 `go version`、`GOOS`、`GOARCH` 和校验和。\n6. 用空参数、错误 URL 和正确输入运行二进制，核对退出码而不只看屏幕文字。\n\n#### 常见失败的定位矩阵\n\n| 现象 | 优先检查 | 不应立即采取的动作 |\n| --- | --- | --- |\n| 本地能构建，CI 找不到包 | `go env GOMOD GOWORK GOPROXY GOPRIVATE`、工作目录 | 删除 `go.sum` 后盲目重试 |\n| 配置“未填写”和“填 0”无法区分 | 字段是否需要指针、布尔标志或独立来源信息 | 在深层业务函数猜默认值 |\n| 同一输入输出顺序变化 | 是否直接遍历 map | 用测试接受任意文本输出 |\n| `errors.Is` 失效 | 包装时是否使用 `%w` | 解析错误字符串做分类 |\n| 接口值看似 nil 却进入错误分支 | 动态类型是否为 nil 指针 | 用反射到处绕过设计问题 |\n| 二进制在目标机不能运行 | `GOOS/GOARCH`、CGO、动态链接与 CPU 基线 | 把“编译成功”当成运行证明 |\n\n#### 第一册完成标准\n\n完成不是“看过语法”，而是能交付一个别人可复现的最小工具。\n验收证据包括：\n\n- 源码只有一个 H1 对应的学习项目，入口与核心逻辑分离；\n- 所有输入在进入核心逻辑前完成类型转换、范围检查和规范化；\n- 输出 map 前排序，时间与容量带单位，未知状态显式报错；\n- 失败可用 `errors.Is` 或 `errors.As` 分类，错误链没有丢失根因；\n- `gofmt`、`go test ./...`、`go vet ./...` 全部通过；\n- 目标平台二进制的版本、平台、校验和与一次实际运行结果被记录；\n- 评审者能够说明为何此任务选择 Go，以及在什么条件下应改用 Python、Shell 或现有工具。\n\n第一册完成后，读者应能建立一个模块化项目，解析可信输入、返回可分类错误，并通过 `gofmt`、`go test` 和退出码验证行为。\n下一册把这些同步函数放入受控并发链路。", "subs": ["interface 的动态类型与动态值", "nil 接口包含类型和值两部分", "普通失败返回 error", "错误分类驱动动作", "接口由使用方定义", "哨兵、类型错误与包装", "多错误与部分失败", "panic、recover 与 defer 的边界", "错误契约测试", "贯穿实验：实现配置检查器，而不是只写语法片段", "从需求到包边界的落地步骤", "常见失败的定位矩阵", "第一册完成标准"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
