<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

<script id="data" type="application/json">{"title": "Go 运维开发与云原生工程 · 第四册：Backend 与服务工程", "intro": "", "parts": [{"title": "第十三章 · 只有共享状态出现后才把 CLI 升级为 Backend", "sections": [{"title": "哪些需求说明单机 CLI 已经不足，哪些需求仍不需要服务端？", "content": "多人共享任务状态、集中认证、统一审计或浏览器 API 是 Backend 的证据；一个进度条、定时配置或趋势图不是。\n少量内部用户默认从模块化单体开始，让 API、业务规则与持久化保持清晰边界。\n\n```mermaid\nflowchart LR\n    A[React 或 CLI] --> B[HTTP Backend]\n    B --> C[业务模块]\n    C --> D[关系数据库]\n    C --> E[外部系统]\n```\n\n先记录用户数、数据量、任务时长、部署位置和失败恢复要求。\n若本机 CLI 已能可靠交付，不要为了“平台化”增加常驻服务。\n\n#### 先做一张约束卡\n\n约束卡至少记录调用者、并发、状态保留、认证来源、任务最长时间和部署位置。\n把“想看进度”翻译成低频轮询候选，而不是直接选择 WebSocket；把“定时执行”翻译成调度可靠性问题，而不是直接增加独立 Scheduler。\n若默认值会改变组件组成，设计只能标为 draft。\n\n#### CLI 到服务的迁移成本\n\n服务化会新增监听端口、TLS/网关、认证、数据库、备份、容量、健康检查、滚动发布、告警和值班。\n把这些列为长期成本，而不是只估算 handler 开发时间。\n内部用户只有两三人且不共享状态时，签名二进制加集中配置可能更便宜。\n\n#### 用状态归属做判断\n\n如果执行状态只需由调用进程知道，CLI 返回结果即可；需要多用户稍后查询、审批人与执行人分离或进程重启后恢复，状态就应由 Backend 持久管理。\n浏览器页面本身不是证据，页面也可以调用一次性 CLI 的离线结果。\n\n#### 轮询与推送\n\n任务进度每几秒变化且用户量小，条件 GET 或带退避轮询通常足够。\n只有高实时、大量并发订阅或服务器主动事件确有价值时，才评估 SSE/WebSocket，并承担连接保活、代理超时、断线续传和多副本广播。\n\n#### 服务化决策练习\n\n对“200 台主机每晚巡检”写 CLI+Cron、Backend 内任务和 Backend+Worker 三案，比较任务恢复、身份、审计、并发和运维成本。\n使用实际超时与频率选最小方案，并写升级阈值。\n\n#### 输出一份可执行决策记录\n\n决策记录写当前用户数、请求峰值、任务 p95、状态保留期、已有身份和数据库、所选最小组件、排除项和复核日期。\n每个数字注明来源；未知项不填乐观默认，而是标记待验证。\n评审者应能据此回答为什么现在不能只用 CLI，以及什么变化会触发 Worker 或 Agent。\n\n#### 用最小架构表达当前结论\n\n组件选择应同时说明代码模块和部署单元。\n少量内部用户、任务在数秒内完成且允许人工重试时，一个进程就可以包含 API、业务逻辑与短后台任务：\n\n```text\nCLI or React -> Go Backend -> existing relational database\n                     |\n                     +-> in-process bounded task runner\n```\n\n此时显式排除 Redis、MQ、独立 Worker、Agent、WebSocket 与时序数据库。\n升级条件分别是任务必须跨重启恢复、执行资源需要独立扩缩、目标机只有本地可达能力、推送延迟有量化要求，以及关系库无法满足保留和查询容量。\n排除项不是永远禁止，而是避免没有证据就承担新的部署、监控和故障边界。\n\n#### 服务化后必须新增的运行责任\n\n上线清单明确端口/TLS owner、身份依赖、数据库备份恢复、容量、健康检查、告警、值班与发布窗口。\n如果这些责任没有负责人，方案只是能启动的 demo。\n用一次网关 timeout、数据库不可用和滚动退出演练估算长期成本，再与 CLI+Cron 方案比较。", "subs": ["先做一张约束卡", "CLI 到服务的迁移成本", "用状态归属做判断", "轮询与推送", "服务化决策练习", "输出一份可执行决策记录", "用最小架构表达当前结论", "服务化后必须新增的运行责任"]}, {"title": "模块化单体怎样划分 HTTP、业务、数据和外部客户端边界？", "content": "HTTP 层处理协议，业务层执行规则，repository 处理持久化，client 封装外部系统。\n依赖从入口指向核心，业务模型不导入 Gin、SQL 驱动或 Kubernetes 类型。\n\n```text\ncmd/server       组装依赖和进程生命周期\ninternal/httpapi 路由 输入 输出 身份适配\ninternal/task    业务状态机\ninternal/store   SQL 与事务\ninternal/remote  外部 API 客户端\n```\n\n接口由使用方定义并保持小。\n事务边界围绕业务不变量，而不是每个 repository 方法各自提交。\n\n#### 用依赖方向做代码评审\n\n核心 task 包不应导入 HTTP 框架和数据库驱动；handler 不直接拼 SQL；store 不决定 HTTP 状态码。\n为每层写一个替身测试，确认业务可以在没有监听端口和数据库进程时运行。\n模块化单体的目标不是目录多，而是变化可以局部发生。\n\n#### 领域模型不携带框架类型\n\n业务函数接收领域命令并返回领域结果或错误，不接收 `*gin.Context`、`http.ResponseWriter` 或数据库 row。\nhandler 把 JSON 输入转换为 `CreateTask`，repository 把 row 转为 `Task`。\n这样迁移路由器或数据库不会重写状态机。\n\n#### 事务边界围绕不变量\n\n“创建任务并写审计”若必须同时成功，应在一个应用服务中开启事务并调用 transaction-scoped repository。\n不要让每个 repository 方法自己提交，导致中途失败留下半状态。\n远程 HTTP 不放在长事务内；使用 outbox 或任务状态协调跨系统副作用。\n\n#### 依赖组装只在入口\n\n`main` 读取配置、创建 logger、DB、clients、service 和 server，启动后不再使用 service locator 或全局单例。\n构造失败返回具体上下文并退出，shutdown 按依赖反向顺序执行。\n\n#### 模块边界测试\n\n领域包用 fake repository 测状态转换；HTTP 包用 fake service 测协议；store 包对真实数据库测 SQL。\n执行依赖扫描，确保 task 包没有导入 router 或 driver。\n若出现循环依赖，重新检查模型所有权，不建 common 包躲避。\n\n#### 用一次变化检验边界\n\n把 HTTP 输入从 JSON 改成 CLI 参数，领域测试不应改变；把内存 store 改成 PostgreSQL，handler 契约不应改变；把远端 SDK 换成 fake，任务状态机仍可运行。\n如果一个变化穿透所有层，优先修正依赖方向而不是继续增加接口。\n\n#### 请求处理链只允许单向依赖\n\n一次创建任务请求应按固定顺序经过 body 限制、解码、字段校验、身份、授权、领域命令、事务和响应映射。\n每层只返回自己的稳定错误类型，最终由 HTTP adapter 统一映射。\n业务层不得调用 `os.Exit`，repository 不打印用户响应，外部 client 不自行无限重试。\n\n```mermaid\nflowchart LR\n    A[Body limit] --> B[Decode]\n    B --> C[Validate]\n    C --> D[Identity]\n    D --> E[Authorize]\n    E --> F[Domain]\n    F --> G[Store]\n    G --> H[Response]\n```\n\n对这条链做反向测试：无效 body 不应触达身份和数据库；未授权请求不应调用领域动作；事务失败不应返回成功；响应 writer 失败只记录一次，不能重复执行领域副作用。\n\n#### 请求链是责任边界，不只是中间件顺序\n\n解码解决表示，校验解决输入不变量，认证解决主体是谁，授权解决主体能否执行，事务解决本地状态的一致提交。\n把这些责任混在一个 handler 中会让失败不可分类，也会让测试无法证明某个拒绝发生在副作用之前。\n用 `httptest` 为每一层注入计数器，提交坏 JSON、未认证和未授权请求，验证失败请求没有调用领域服务或 repository。\n\n模块评审最终保存依赖图和三类测试结果：领域无框架测试、handler 协议测试、真实 store 集成测试。", "subs": ["用依赖方向做代码评审", "领域模型不携带框架类型", "事务边界围绕不变量", "依赖组装只在入口", "模块边界测试", "用一次变化检验边界", "请求处理链只允许单向依赖", "请求链是责任边界"]}, {"title": "标准库、Gin、chi、REST 和 RPC 应该怎样按约束选择？", "content": "少量端点可直接使用 `net/http`；需要成熟路由、中间件生态时默认评估 Gin；团队偏标准库风格可选 chi。\n框架选择要落到现有经验、API 数量、性能证据和维护成本。\n\n```go\nfunc healthz(w http.ResponseWriter, r *http.Request) {\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tio.WriteString(w, `{\"status\":\"ok\"}`)\n}\n```\n\nServer 必须设置读取、响应头、写入和空闲超时；限制 body 大小；统一 request ID、recover 和错误响应。\nOpenAPI 是契约辅助，不替代兼容性测试。\n\n#### 用最小压测比较而不是用口碑选框架\n\n为候选实现同一个健康检查和一个带校验的任务创建接口，在相同工具链、日志与中间件下测量。\n若性能差异远低于外部依赖耗时，就优先团队熟悉度和可维护性。\n框架升级前运行契约与 shutdown 测试，避免只比较 requests per second。\n\n#### Server 基线与路由无关\n\n无论框架都要配置 ReadHeaderTimeout、ReadTimeout、WriteTimeout、IdleTimeout、MaxHeaderBytes 和 shutdown。\nbody 用 MaxBytesReader 限制；中间件顺序固定 request ID、recover、访问日志、身份与授权。\n框架默认值必须查明，不能假设安全。\n\n#### 路由和方法契约\n\n区分 404 与 405，路径参数先规范化和校验，尾随斜杠策略一致。\n创建返回 201 或异步 202，删除幂等语义明确。\nOpenAPI 生成或校验不能替代 handler 测试，尤其要测试未知字段、第二个 JSON 对象和错误 Content-Type。\n\n#### 基准必须包含真实中间件\n\n只压测 hello world 无法代表认证、日志、JSON 与数据库。\n候选实现相同链路，固定连接数、payload、日志级别和 CPU 配额，比较吞吐、p95/p99、分配与错误率。\n压测客户端自身不能成为瓶颈。\n\n#### 框架退出练习\n\n分别用标准库和候选框架实现三个端点，复用同一 service。\n发送慢 header、超大 body、panic 和 SIGTERM，比较状态码、日志、资源回落和关闭时间。\n以行为证据而非 API 喜好选择。\n\n#### 框架选择记录\n\n记录候选版本、维护状态、团队经验、中间件需求、基准环境和升级策略。\n结论允许选择标准库。\n若引入框架，仅在 adapter 层使用；保存慢请求、panic、超限输入和 shutdown 的测试结果，避免基准只证明空 handler。\n\n#### REST、RPC 与 gRPC 的边界\n\n浏览器和通用运维调用方默认使用 HTTP JSON API，容易经过现有网关、审计和调试工具。\n内部多语言服务间已经采用 protobuf、需要强类型双向流或高频调用时，才把 gRPC 作为备选。\nRPC 不是“比 REST 更先进”，它只是契约和传输选择不同。\n\n| 约束 | HTTP JSON | gRPC |\n| --- | --- | --- |\n| 浏览器直接调用 | 自然 | 通常需要网关或 gRPC-Web |\n| 人工调试 | curl 即可 | 需要反射或专用客户端 |\n| 契约 | OpenAPI 与兼容测试 | protobuf 与生成代码 |\n| 流式传输 | SSE/WebSocket 另选 | 原生流但连接治理更复杂 |\n| 多语言 SDK | 可生成也可手写 | 通常生成并锁定插件版本 |\n\n无论哪种风格都要定义 deadline、错误模型、幂等、分页、身份传播与版本兼容。\n不要让浏览器直连内部 gRPC 只因为后端实现方便。\n\n#### OpenAPI 是可执行契约的一部分\n\n规范固定 path、方法、schema、错误 code 和认证方式；CI 检查破坏性变化，并用 handler 契约测试验证实现。\n生成 SDK 后仍要检查分页器、超时、错误链和重试策略。\n规范生成成功只说明格式成立，不能证明授权和业务状态转换正确。", "subs": ["用最小压测比较而不是用口碑选框架", "Server 基线与路由无关", "路由和方法契约", "基准必须包含真实中间件", "框架退出练习", "框架选择记录", "REST、RPC 与 gRPC 的边界", "OpenAPI 是可执行契约的一部分"]}]}, {"title": "第十四章 · 在 API 边界完成校验、身份与错误表达", "sections": [{"title": "请求进入业务逻辑前，怎样校验输入并建立错误分类？", "content": "先限制 body，再严格解码和校验字段；未知字段是否拒绝由兼容策略决定。\n业务错误映射到稳定代码，内部堆栈不回传客户端。\n\n```go\ntype APIError struct { Code string `json:\"code\"`; Message string `json:\"message\"`; RequestID string `json:\"request_id\"` }\n```\n\n400 表示语法或字段错误，401 表示未认证，403 表示身份存在但无权，409 表示状态冲突，500 表示未分类内部故障。\n状态码和业务 code 都要写契约测试。\n\n#### 限制输入并保留可追踪错误\n\n设置 body、数组长度、字符串长度和分页上限；未知字段的兼容策略写入版本契约。\n响应包含 request ID，日志保留错误链与安全字段。\n模糊测试解析器，确认畸形 JSON 不会 panic、无限分配或泄露内部堆栈。\n\n#### 严格解码的完整步骤\n\n检查 Content-Type，设置 body 上限，DisallowUnknownFields，Decode 一次对象后再次 Decode 并要求 EOF。\n语法错误、类型错误、超限和业务校验使用不同稳定 code。\n不要把 decoder 原始错误直接返回客户端，其中可能带内部字段信息。\n\n#### 字段与跨字段校验\n\n字段校验处理长度、枚举、URL scheme 和范围；跨字段校验处理 start < end、单次 timeout < 总 deadline、生产环境必须带审批 ID。\n规范化后再查重复，避免空白和大小写绕过唯一性规则。\n\n#### 错误映射集中管理\n\nhandler 不按错误文字判断。\n领域错误通过 errors.Is/As 映射到 400/404/409，身份错误到 401/403，未知错误到 500。\n所有响应使用同一 envelope 和 request ID，错误日志在边界记录一次。\n\n#### 输入安全测试\n\n覆盖空 body、超大 body、未知字段、两个 JSON 对象、深层嵌套、无效 UTF-8、超长数组和非法 URL。\nfuzz 只要求不 panic和资源有界，业务状态码由表驱动测试固定。\n\n#### API 错误回归表\n\n为每个 code 固定 HTTP 状态、是否可重试和客户端动作。\n未知内部错误只返回通用消息，服务端日志保留链。\n契约测试读取响应 JSON，检查 Content-Type、request ID 和禁止字段；同时验证日志中能找到同一 request ID。\n\n#### 完整的严格解码片段\n\n```go\nfunc decodeJSON(w http.ResponseWriter, r *http.Request, dst any) error {\n\tr.Body = http.MaxBytesReader(w, r.Body, 1<<20)\n\tdec := json.NewDecoder(r.Body)\n\tdec.DisallowUnknownFields()\n\tif err := dec.Decode(dst); err != nil {\n\t\treturn fmt.Errorf(\"decode request: %w\", err)\n\t}\n\tif err := dec.Decode(&struct{}{}); !errors.Is(err, io.EOF) {\n\t\treturn fmt.Errorf(\"request must contain one JSON object\")\n\t}\n\treturn nil\n}\n```\n\n这是局部片段，调用者还要检查 `Content-Type`、关闭 body 并把解码错误映射为稳定 code。\n测试发送两个连续对象、未知字段、超过 1 MiB 的 body 和截断 JSON，确认领域 service 一次也没有被调用。\n\n#### 错误输出不得暴露实现\n\n测试把内部 SQL 错误、解析错误和 panic 分别注入，客户端只得到稳定 code、有限 message 与 request ID。\n服务端日志保留包装链和 stack，且同一失败只记录一次。\n响应 writer 中途失败时不重新执行业务动作；指标按稳定错误类别聚合，不把完整 error 作为标签。", "subs": ["限制输入并保留可追踪错误", "严格解码的完整步骤", "字段与跨字段校验", "错误映射集中管理", "输入安全测试", "API 错误回归表", "完整的严格解码片段", "错误输出不得暴露实现"]}, {"title": "为什么登录页不等于 JWT，内部工具应怎样优先复用身份设施？", "content": "认证先确认已有 SSO、OIDC 或网关能否传递可信身份。\n浏览器内部系统通常更适合服务端 Session 或标准 OIDC 流程，而不是把长期 JWT 放进 localStorage。\n\nBackend 只能信任经过验证的签名、issuer、audience 和时效，不能信前端自报用户名。\nToken、Cookie 与认证头不写日志；代理头只有来自受信网关时才接受。\n\n验收时至少覆盖未登录、会话过期、签名错误、issuer 或 audience 不符、用户被禁用以及网关头伪造。\n认证失败统一返回有限信息，详细原因只进入受控日志，避免帮助攻击者枚举账号和验证规则。\n\n#### 会话生命周期必须完整\n\n定义登录、刷新、注销、密钥轮换、用户禁用和时钟偏差。\nCookie 至少考虑 Secure、HttpOnly 和 SameSite；服务间身份与用户会话分开。\n生产事故演练应包含身份提供方暂时不可用，确认已有会话和新登录分别采取什么策略。\n\n#### 认证与授权分层\n\n认证回答“是谁”，授权回答“能否对该资源执行动作”。\n中间件验证凭证并生成可信 Principal，业务层根据 action、resource、scope 做授权。\n不要让 handler 从用户提供的 header 直接构造管理员身份。\n\n#### OIDC 验证要点\n\n验证签名算法、kid、issuer、audience、exp、nbf 和 nonce/state。\nJWKS 缓存要有刷新与失败策略，密钥轮换期间允许合理重叠。\n仅 decode JWT payload 不构成验证；`alg=none` 或算法混淆必须拒绝。\n\n#### Session 与 Token 保存\n\n浏览器优先 HttpOnly Secure cookie，配合 SameSite 与 CSRF 策略；不要把长期 bearer token 放 localStorage。\n服务间 token 使用短期限、明确 audience 和最小 scope，轮换不重启整个服务。\n\n#### 身份依赖故障演练\n\n模拟 JWKS 刷新失败、用户禁用、会话过期、时钟偏差和网关伪造头。\n定义缓存内有效身份能否继续、多久；新登录是否失败关闭。\n所有选择要权衡可用性与撤权时效并记录。\n\n#### 身份上线确认\n\n在隔离环境完成真实 OIDC/SSO 回调，不用 fake 结果冒充。\n检查 cookie 属性、注销、过期、密钥轮换、用户禁用和代理头伪造。\n确认身份提供方不可用时，新登录与已有会话的行为和告警符合预案。\n\n#### 认证中间件只产出可信 Principal\n\n后续业务不再读取 Cookie、Authorization 或网关头，而是接收已验证的 Principal：主体 ID、租户、角色、认证时间和凭证类型。\nPrincipal 不接受客户端 JSON 覆盖，也不把原始 Token 保存进去。\n服务间身份和代表用户的委托身份分别建模，避免后台任务继承一个已过期浏览器会话。\n\n认证设施不可用时，系统要选择失败关闭还是在短缓存窗口内继续。\n撤权敏感的高风险写操作通常失败关闭；低风险只读查询可以按已批准策略使用未过期缓存。\n选择、最大窗口和告警必须写入运行手册，不能临时由 handler 猜测。\n\n#### 身份故障的预期输出\n\n```text\n401 AUTH_REQUIRED        no valid session\n401 AUTH_EXPIRED         session expired\n503 IDENTITY_UNAVAILABLE issuer keys unavailable\n```\n\n客户端动作分别是登录、刷新/重新登录和稍后重试；不能把第三类伪装成用户密码错误。\n日志记录 issuer、kid、缓存状态与 request ID，不记录 Token。\n故障恢复后执行一次真实登录和服务身份调用，确认缓存与密钥轮换回到正常状态。\n\n把上述响应与登录、刷新、注销、撤权和密钥轮换组合成契约表，CI 固定状态码与客户端动作。\n任何认证库升级都重放这张表，而不是只验证一个正常 Token。", "subs": ["会话生命周期必须完整", "认证与授权分层", "OIDC 验证要点", "Session 与 Token 保存", "身份依赖故障演练", "身份上线确认", "认证中间件只产出可信 Principal", "身份故障的预期输出"]}, {"title": "角色、数据范围和高风险审批怎样分层，而不是只隐藏按钮？", "content": "前端隐藏按钮只是体验，授权必须在服务端对每次动作检查。\n少量固定角色可先在应用中显式编码；规则复杂、动态且需要集中治理时再评估策略引擎。\n\n```text\n主体身份 -> 动作 -> 资源 -> 数据范围 -> 环境 -> 允许或拒绝 -> 审计\n```\n\n高风险变更可增加审批，但审批记录必须绑定不可变计划摘要，避免批准 A 后执行 B。\n默认拒绝未知动作，Kubernetes 与远程系统使用最小权限凭证。\n\n#### 授权用反向测试验收\n\n除了“管理员可以”，还要测试普通用户不能跨环境、不能篡改资源 ID、不能通过批量接口绕过单项校验。\n审计记录授权决策与策略版本，但不把敏感策略上下文全部暴露给调用者。\n拒绝路径应和允许路径一样进入持续测试。\n\n#### 角色和数据范围是两个维度\n\noperator 角色可能允许重启服务，但只限自己团队和测试环境。\n查询资源后再授权容易产生 IDOR；repository 查询应带 principal scope，或领域层在返回前强制校验归属。\n批量接口逐项检查，不能只授权批次容器。\n\n#### 审批绑定不可变计划\n\n审批记录包含计划摘要、主体、目标集合、动作、过期时间和批准人。\n执行前重新计算摘要，任何参数变化都要求重新审批。\n审批本身不是授权，执行者仍需具备当前权限。\n\n#### 默认拒绝与策略版本\n\n未知动作、未知资源类型和策略加载失败默认拒绝。\n每次决策记录 policy version、principal、action、resource 和结果，Secret 与敏感资源内容不进入普通日志。\n策略缓存必须定义撤权传播延迟。\n\n#### 授权矩阵测试\n\n构造 anonymous、viewer、operator、admin 与不同团队/环境组合，测试允许和拒绝。\n增加路径参数篡改、批量混入越权项、审批过期和策略服务不可用。\n拒绝响应不暴露资源是否存在，避免枚举。\n\n#### 授权上线确认\n\n从最小角色开始授予，使用真实低权限测试账号执行允许和拒绝矩阵。\n检查批量接口、导出接口、对象不存在与跨团队路径。\n高风险动作绑定计划摘要和审批有效期，审计能追溯主体、对象、结果和策略版本。\n\n#### 拒绝矩阵必须覆盖对象存在性\n\n对无权访问的真实对象和根本不存在的对象，外部响应应避免泄露可枚举差异。\n批量请求中混入一个越权目标时，契约要明确整批拒绝还是逐项返回；高风险写操作通常整批拒绝更容易审计。\n\n策略服务或缓存故障不能默认放行。\n每个拒绝记录稳定 reason 与 policy version，但不把其他租户名称、资源内容或审批备注返回调用者。\n上线验证使用真实低权限账号，而不是只在单元测试里伪造 role 字符串。\n\n#### 审批与执行之间重新授权\n\n审批通过不冻结操作者权限。\n执行时重新检查主体、数据范围、计划摘要和审批有效期；审批后被撤权或目标环境变化时拒绝执行。\n审计把申请、批准、执行和结果用同一 operation ID 关联，并保存策略版本。\n\n批量操作测试混入一个越权对象、一个已删除对象和一个摘要变化对象。\n系统必须按书面原子性契约拒绝整批或明确逐项结果，不能只执行“碰巧成功”的子集后返回模糊 500。\n\n策略变更也走版本化发布和回滚，禁止直接在生产临时修改后失去来源。\n撤权传播延迟、缓存 TTL 与审计保留期都应成为可查询配置。\n撤权测试还要覆盖仍持有旧会话或长连接的主体，确保服务端不会只在登录时计算一次权限。", "subs": ["授权用反向测试验收", "角色和数据范围是两个维度", "审批绑定不可变计划", "默认拒绝与策略版本", "授权矩阵测试", "授权上线确认", "拒绝矩阵必须覆盖对象存在性", "审批与执行之间重新授权"]}]}, {"title": "第十五章 · 让日志、数据和任务状态能够支持排障与恢复", "sections": [{"title": "`slog` 怎样携带 request ID、task ID，又不泄露 Secret？", "content": "现代 Go 可用标准库 `log/slog` 输出结构化日志。\n`log/slog` 从 Go 1.21 进入标准库；更低版本需要兼容日志库或明确提高项目最低工具链。\n字段名保持稳定，错误作为字段传递；request ID 用于请求链，task ID 用于异步工作，不能拿高基数字段当无界指标标签。\n\n```go\nlogger := slog.New(slog.NewJSONHandler(os.Stdout, nil))\nlogger.Info(\"task finished\", \"task_id\", id, \"target\", target, \"status\", status)\n```\n\n在源头排除密码、Token、Cookie、完整配置和响应体。\n定义保留期、访问权限和删除机制；集中日志平台是可选设施，结构化与脱敏是基础责任。\n\n#### 日志与指标承担不同职责\n\n日志保存离散事件和上下文，指标表达可聚合趋势，trace 用于跨边界时序。\n不要把 target ID 等高基数字段直接做指标标签。\n用测试 handler 捕获 slog 记录，断言必要字段存在且样例 Secret 不出现；日志发送失败不能阻塞核心请求无限等待。\n\n#### 日志事件而不是打印句子\n\n事件名保持稳定，例如 `task.created`、`task.completed`，字段使用固定 snake_case。\n每个请求入口和最终结果各一条关键日志，中间步骤只在有诊断价值时记录，避免每层重复同一错误。\n\n#### request ID 与 trace\n\n只接受受信网关生成且格式合法的 request ID，否则服务生成新值。\n向下游通过标准 trace/header 传播，并在 task 创建时把 request 与 task 关联。\n异步 Worker 不继续冒充原 HTTP span，而是建立 linked trace 或记录关联字段。\n\n#### 脱敏从源头完成\n\n建立禁止字段表：authorization、cookie、password、token、secret、完整请求体。\n错误类型的 Error 方法也不能包含凭证。\n测试用醒目的假 Secret 贯穿成功与失败路径，扫描 stdout/stderr 和捕获日志确认不存在。\n\n#### 可观测性验收\n\n从一个 500 响应的 request ID 能找到日志、错误类型与相关 trace；从 task ID 能找到创建、领取、尝试和终态；指标能回答错误率和延迟趋势。\n任何单一系统不可用时，核心请求仍受有界影响。\n\n#### 从一次事故问题验证可观测性\n\n假设用户报告任务失败：能否从响应 request ID 找到 task ID、操作者、状态转换、外部依赖错误与持续时间？\n再从指标判断是单例还是总体趋势。\n若必须搜索完整目标 URL 或 Secret 才能定位，字段设计仍不合格。\n\n#### 日志失败不能扩大业务故障\n\n同步写远程日志平台会把其延迟带进请求关键路径。\n默认向 stdout 写有界结构化事件，由运行平台采集；若应用内异步发送，队列必须有容量、丢弃计数和关闭预算。\n审计事件比普通调试日志更严格：审计存储不可用时，高风险操作应失败关闭或进入明确待处理状态。\n\n用一个包含 `TOP_SECRET_TEST_VALUE` 的 fixture 穿过成功、400、500 和 panic/recover 路径，捕获所有 slog record、stdout 和 stderr 并扫描。\n脱敏测试通过后仍要评审错误类型的 `Error()`、第三方 client 日志和 trace attribute，因为泄露不只发生在显式 logger 调用。\n\n#### 可观察输出有明确保留和基数边界\n\n日志字段表标记类型、是否敏感、最大长度和保留期；指标 label 只使用有限枚举；trace attribute 对 URL、SQL 与 payload 做归一化或省略。\n运行测试提交一万个不同 task ID，确认指标时序数量不会同比增长。\n\n日志采集端阻塞或丢弃时，应用暴露 dropped/error 指标并保持有界。\n审计链路不可用则按风险策略拒绝高风险动作，普通 debug 日志不可用不应让请求无限挂起。\n\n用固定日志样例做 schema 回归，确保字段重命名不会让现有检索、告警与审计查询静默失效。\n保留期到期后执行删除验证，而不是只在配置里写一个天数。\n采集缓冲区的容量由峰值事件速率与可接受阻塞时间推导，并用压测验证丢弃策略。\n磁盘缓冲启用时还要设置空间上限和清理优先级，避免日志反过来耗尽业务磁盘。\n告警同时覆盖采集延迟、丢弃计数和审计写入失败，值班人员才能区分业务安静与观测链路失效。", "subs": ["日志与指标承担不同职责", "日志事件而不是打印句子", "request ID 与 trace", "脱敏从源头完成", "可观测性验收", "从一次事故问题验证可观测性", "日志失败不能扩大业务故障", "可观察输出有明确保留和基数边界"]}, {"title": "显式 SQL、sqlc 与 GORM 应该根据什么选择？", "content": "关系数据默认复用已有 PostgreSQL/MySQL。\nGo 新项目可从 `database/sql` 加显式 SQL 或 sqlc 开始，查询和生成类型都可审查；团队强依赖 ORM 体验时才将 GORM 作为备选。\n\n所有方案都要处理 context、连接池、事务、迁移和参数化。\nORM 不能消除 N+1、锁等待和迁移风险。\n任务状态写入关系库时，唯一约束和状态条件是幂等最后防线。\n\n选择前用真实查询做一次对照：查看生成 SQL、执行计划、返回类型和迁移差异。\n若 sqlc 已能覆盖主要查询，就不因简单 CRUD 增加 ORM；若团队已有成熟 GORM 规范，则重点验证预加载、事务和软删除等隐式行为。\n\n#### 连接池也是容量预算\n\n设置最大打开连接、空闲连接、连接寿命和请求 deadline，使所有实例连接总量低于数据库承载。\n观察等待连接时间、慢查询、锁等待和事务回滚。\n迁移使用独立版本记录并做恢复演练，不能依靠 ORM 启动时自动改表来替代评审。\n\n#### 查询边界与参数化\n\n所有外部值使用参数绑定，动态排序列和表名通过白名单映射，不能直接拼接。\n分页优先稳定游标；offset 在大表和并发变化下可能慢且重复。\n每条关键查询保存 explain 计划和预期索引。\n\n#### 事务与远程调用\n\n事务内只做数据库操作和短计算，不等待 HTTP、队列或人工审批。\n需要跨系统一致性时，先提交业务状态与 outbox，再由 Worker 投递；消费端使用幂等键。\n不要声称普通数据库事务能回滚已发生的远程副作用。\n\n#### 本地原子性与分布式副作用不同\n\n数据库事务可以保证同一数据库内的提交原子性，却不能撤回已经发送给云 API、Agent 或消息系统的请求。\n跨边界动作需要 outbox、任务状态、外部幂等键或对账流程；事务提交成功不能直接等价于整个业务完成。\n故意在远程调用成功后让本地提交失败，观察任务进入 `unknown` 或补偿路径，而不是返回一个无法解释的成功状态。\n\n```mermaid\nsequenceDiagram\n    participant A as API\n    participant D as Database\n    participant X as External API\n    A->>D: begin transaction\n    A->>X: perform side effect\n    X-->>A: success\n    A->>D: commit\n    D-->>A: failure\n    A->>D: mark unknown or enqueue compensation\n```\n\n#### 迁移采用 expand contract\n\n先增加兼容结构，部署同时支持新旧 schema 的代码，回填并切换读取，最后另一个版本删除旧结构。\n滚动期间新旧实例并存，任何破坏性 rename/drop 都要检查兼容窗口和回滚路径。\n\n#### 数据层测试\n\nfake repository 测业务分支，真实数据库集成测试约束、隔离级别、锁和迁移。\n并发提交同一幂等键，确认只有一行；制造锁等待，确认 context deadline 生效且连接归还。\n\n#### 数据方案选择记录\n\n用三条真实查询比较手写 SQL、sqlc 和 GORM：审查最终 SQL、类型、事务、分页、测试和迁移。\n记录团队已有规范与排障能力。\n选择 ORM 后仍保存慢查询和执行计划；选择 sqlc 后仍检查生成差异和数据库兼容。\n\n#### 用 SQL 约束守住并发最后一关\n\n应用层先查再写无法阻止两个副本同时创建同一任务，最终要由数据库唯一约束裁决。\n任务表至少给业务幂等键建唯一索引，并用条件更新完成状态跃迁：\n\n```sql\nUPDATE tasks\nSET status = 'running', lease_owner = $2, lease_until = $3\nWHERE id = $1\n  AND status = 'pending'\n  AND (lease_until IS NULL OR lease_until < now());\n```\n\n调用方检查影响行数：`1` 表示领取成功，`0` 表示状态已变化或租约仍有效。\n真实数据库集成测试并发执行两次领取，不能用内存 map 的 mutex 测试冒充 SQL 隔离与约束证据。\n\n#### 数据方案用同一真实查询对照\n\n选择 sqlc 或 GORM 前，用任务领取、游标分页和带事务审计三条查询比较生成 SQL、类型、执行计划和测试难度。\nORM 若产生 N+1、隐式软删除或过宽 SELECT，必须显式修正；sqlc 若需要大量动态查询，也要评估可维护性。\n\n最终记录推荐与一个备选、团队经验、迁移方式、连接预算和升级条件。\n不要同时引入多个数据访问层让同一事务跨越不同抽象。", "subs": ["连接池也是容量预算", "查询边界与参数化", "事务与远程调用", "本地原子性与分布式副作用不同", "迁移采用 expand contract", "数据层测试", "数据方案选择记录", "用 SQL 约束守住并发最后一关", "数据方案用同一真实查询对照"]}, {"title": "长任务为什么先需要任务表，再判断是否需要独立 Worker？", "content": "任务表记录操作者、输入摘要、状态、尝试次数、deadline、结果和错误。\n短任务可在进程内有界执行，但进程崩溃后应把运行中任务标为未知或失败，不能假装恢复。\n\n```text\npending -> running -> succeeded\n                   -> failed\n                   -> cancel_requested -> cancelled\n                   -> unknown -> reconciled\n```\n\n需要自动重试、重启恢复、多实例消费或独立扩缩容时才拆 Worker。\n队列负责投递，数据库负责可审计业务状态；重试必须检查幂等性和结果未知场景。\n\n#### 用崩溃点检验任务语义\n\n分别在领取后、执行副作用前、执行后但提交结果前杀死进程。\n重启后任务应进入可解释的 pending、failed 或 unknown，而不是永久 running。\n对 unknown 优先查询外部状态或人工对账，不能自动重复不可逆动作。\n\n#### 租约和心跳\n\nWorker 通过条件更新领取 pending 或过期 running 任务，写入 owner 和 lease expiry。\n长任务定期续租，但续租失败后不能继续无条件提交结果。\n数据库时间优先于各 Worker 本地时间，减少漂移影响。\n\n#### 重试和毒任务\n\n错误分类决定 retryable；attempt、最大次数和 next_run_at 限制重试。\n退避加入抖动，永久失败进入 failed 或 dead-letter 视图，并保留人工修复和重新入队操作。\n重新入队也要审计。\n\n#### 取消协议\n\n用户请求取消先写 `cancel_requested`，Worker 在安全点检查并最终写 cancelled。\n已提交不可逆副作用时取消可能失败或转为补偿任务，API 不能立即谎称 cancelled。\n状态响应区分 requested 与 completed。\n\n#### 任务一致性验收\n\n并发两个 Worker 领取同一任务、领取后 kill、执行后提交前断网、重复结果提交和取消竞争。\n验证状态转换、attempt、lease 和外部副作用数量，确保每种 unknown 都有对账路径。\n\n#### 任务恢复 runbook\n\n列出如何查询 pending/running/unknown、识别过期租约、查看 attempt 和幂等键、人工取消、重新入队与对账外部副作用。\n所有修复动作限定 task ID 和环境，执行前输出计划，执行后保存审计；禁止直接把全表 running 改成 pending。\n\n#### 三个崩溃点决定任务语义\n\n在副作用前崩溃，可以由租约到期后重新领取；副作用完成后、结果提交前崩溃，系统无法仅凭本地状态判断是否已经执行；结果已提交但确认未返回时，调用方可能重复提交。\n第三种可由幂等键解决，第二种必须向外部系统查询、使用外部幂等键，或把状态标为 `unknown` 交给对账。\n\n#### 未知结果是协议状态，不是普通错误\n\n网络超时只说明调用方没有得到确认，不说明远端没有执行。\n把未知结果单独建模，才能在重试前查询状态、按幂等键复用结果，或把任务转入人工对账，而不是盲目重复不可逆动作。\n验证实验要区分连接超时、远端明确拒绝和远端成功但响应丢失三种结果，并检查重试次数与外部副作用数量。\n\n```mermaid\nstateDiagram-v2\n    [*] --> Pending\n    Pending --> Running\n    Running --> Succeeded: confirmed response\n    Running --> Failed: explicit rejection\n    Running --> Unknown: timeout or lost response\n    Unknown --> Reconciled: query or idempotency key\n```\n\n```mermaid\nstateDiagram-v2\n    [*] --> Pending\n    Pending --> Running: Lease acquired\n    Running --> Succeeded: Result committed\n    Running --> Failed: Permanent error\n    Running --> Unknown: Side effect uncertain\n    Running --> Pending: Lease expired and retry safe\n    Unknown --> Succeeded: Reconciled complete\n    Unknown --> Failed: Reconciled absent\n```\n\n自动重试必须同时受错误类别、尝试次数、总时间预算和幂等性约束。\n毒任务达到上限后进入人工队列，并携带最后错误、尝试历史和安全的重放入口。\n结果提交应携带领取时的租约版本做条件更新，防止已失去所有权的 Worker 覆盖新执行者的状态。", "subs": ["用崩溃点检验任务语义", "租约和心跳", "重试和毒任务", "取消协议", "任务一致性验收", "任务恢复 runbook", "三个崩溃点决定任务语义", "未知结果是协议状态"]}]}, {"title": "第十六章 · 用一致的工程流程把服务交给团队维护", "sections": [{"title": "目录、规范和 Makefile 怎样形成可执行的开发入口？", "content": "目录表达依赖边界，Makefile 提供统一入口而不是隐藏复杂脚本。\n最小命令包括 format、test、lint、build 和 verify；命令必须在干净环境可重现。\n\n```makefile\n.PHONY: fmt test vet build\nfmt:\n\tgofmt -w $$(find . -name '*.go' -type f)\ntest:\n\tgo test ./...\nvet:\n\tgo vet ./...\nbuild:\n\tgo build -trimpath ./cmd/...\n```\n\n提交规范服务于审查和追踪，不代替小范围变更、测试证据和回滚计划。\n\n#### Make 目标必须可发现且可组合\n\n提供 `make help`，让 CI 调用与开发者相同的目标。\n命令失败必须保留原退出码，不能用管道掩盖错误。\n生成代码、格式化和依赖整理会修改文件，应与只读 verify 目标分开，避免验证过程偷偷重写工作区。\n\n#### 目录随真实边界增长\n\n起步只需 cmd 与少量 internal 包。\n出现第二个入口时复用应用服务，出现独立部署需求才创建新 cmd。\n不要复制大型模板得到几十个空目录；目录名必须对应可解释责任和 owner。\n\n#### 工具版本固定\n\n编译器由 go.mod/toolchain 与 CI 固定，lint、生成器和迁移工具同样固定版本。\n开发者使用 `go run tool@version` 或受控 tools 模块，CI 日志打印版本。\n`latest` 会让同一 commit 随时间产生不同结果。\n\n#### 生成代码可验证\n\nOpenAPI、mock、sqlc 或 protobuf 生成后运行 diff，CI 确认仓库无未提交变化。\n生成输入是源，输出若提交则必须同步。\nverify 目标只检查，不应悄悄改写开发者工作区。\n\n#### 新人入口练习\n\n在干净 checkout 只读 README/Make help，执行 setup、test、build 和 run。\n记录任何隐含本机路径、未声明服务或 Secret。\n目标是新维护者不依赖口头步骤获得相同结果。\n\n#### 本地入口验收\n\n在干净 checkout 执行 `make help`、只读 verify、test 和 build。\n确认不依赖个人目录、全局安装 latest 工具或未声明服务。\n故意让 formatter 和生成代码过期，verify 必须失败但不修改文件。\n\n#### Makefile 不隐藏开发者无法复现的环境\n\n目标应显示所需工具版本、外部服务和配置来源。\n真实数据库集成测试通过单独目标启动隔离依赖，并提供健康等待和清理；普通 `make test` 不应静默连接个人数据库。\n生成器输出若提交仓库，`make verify-generated` 重新生成到临时位置并比较，而不是直接覆盖用户修改。\n\n在干净容器和开发机各执行一次 help、verify、test、build，比较日志中工具链与产物摘要。\n如果 Make 目标依赖 Bash 特性、GNU 工具或 Docker，应在前置条件中明确，不能把某位维护者的系统环境当成项目契约。\n\n#### 开发入口的失败输出可行动\n\n缺工具时报告名称、所需版本和安装入口；缺外部服务时报告启动目标；生成差异时列出源文件与验证命令。\nMake 目标不吞掉子命令退出码，也不在失败后继续发布。\n\n最终由一名未参与开发的维护者从干净 checkout 重放，记录缺失步骤并回写到 `make help` 或项目文档。", "subs": ["Make 目标必须可发现且可组合", "目录随真实边界增长", "工具版本固定", "生成代码可验证", "新人入口练习", "本地入口验收", "Makefile 不隐藏开发者无法复现的环境", "开发入口的失败输出可行动"]}, {"title": "从本地提交到 CI，哪些检查必须成为不可跳过的门禁？", "content": "CI 至少执行格式差异、单元测试、vet、适用的 race、依赖漏洞检查和构建。\n固定 Go 主版本与 action 版本，缓存只改善速度，不能成为构建正确性的前提。\n\n```yaml\n- uses: actions/setup-go@v5\n  with:\n    go-version-file: go.mod\n- run: go test ./...\n- run: go vet ./...\n- run: go build -trimpath ./cmd/...\n```\n\n第三方检查工具需要固定版本。\n只有实际运行成功的门禁才标记 PASS；依赖安装成功不等于工具执行成功。\n\n#### 门禁按反馈速度排序\n\n先格式、生成文件差异和快速单测，再 vet、race、集成测试、漏洞扫描和制品构建。\n保存失败命令、工具版本和关键日志。\nrace 不必覆盖每个提交的全部长测试，但关键并发路径必须定期且可重复执行。\n\n#### 格式门禁应只读\n\nCI 用 `gofmt -d` 检查并在有差异时失败，不直接提交格式变化。\n开发者本地 `make fmt` 才修改。\n`go mod tidy` 同理，运行后 diff 非空就失败并提示修复。\n\n#### 测试分层和并行\n\n快速单测不访问网络；race 覆盖关键并发包；集成测试启动真实数据库；契约测试验证外部协议；制品 smoke test 启动最终二进制。\n能并行的任务并行，但发布必须依赖所有必需门禁结果。\n\n#### 供应链门禁\n\n检查已知漏洞、许可证、SBOM、模块来源和镜像基础层。\n扫描工具本身固定版本，数据库更新时间记录在证据中。\n发现项需要风险接受期限与 owner，不能永久 allowlist 无解释。\n\n#### CI 故障练习\n\n故意引入格式差异、race、过期生成代码和失败集成测试，确认各门禁确实执行并阻止制品。\n缓存清空后重复构建，证明缓存不是正确性依赖。\n\n#### 门禁结果的证据等级\n\nCI 通过表示固定环境里的静态、单元、race 或集成证据，具体以实际 job 为准。\n构建镜像后还需启动最终制品；部署 Ready 后还需业务 smoke。\n发布记录逐项链接日志和摘要，不能只写一个绿色 badge。\n\n#### CI 的快速反馈顺序\n\n先运行只需秒级的格式、生成代码差异、`go vet` 和单元测试，再运行 race、真实数据库集成、镜像构建、漏洞扫描和隔离环境 smoke。\n慢门禁可以并行，但不能因为耗时就长期设为可选。\n每个工具必须实际执行，安装成功或打印版本不算检查通过。\n\n```bash\ntest -z \"$(gofmt -l .)\"\ngo mod tidy\ngit diff --exit-code -- go.mod go.sum\ngo vet ./...\ngo test ./...\ngo test -race ./...\ngo build -trimpath ./cmd/...\n```\n\n`go mod tidy` 可能修改文件，因此 CI 在隔离工作区执行后用 diff 检查；开发者本地可主动接受变更。\n供应链扫描结果应锁定工具版本和策略，豁免要有到期时间。", "subs": ["门禁按反馈速度排序", "格式门禁应只读", "测试分层和并行", "供应链门禁", "CI 故障练习", "门禁结果的证据等级", "CI 的快速反馈顺序"]}, {"title": "版本、SDK、迁移、健康检查和回滚责任怎样在发布前写清楚？", "content": "版本信息应嵌入二进制并由 `version` 命令输出 commit、构建时间和脏状态。\n数据库迁移在应用流量前后何时执行、是否向后兼容、由谁回滚必须明确。\n\n存活探针回答进程是否需要重启，就绪探针回答是否可以接流量。\n依赖短暂故障通常影响就绪，不应让存活探针制造重启风暴。\n发布记录包含制品摘要、配置差异、迁移、观察窗口、回滚触发器和责任人。\n\n第四册验收应包含：API 契约测试、认证与授权拒绝测试、迁移演练、SIGTERM 摘流、任务重复提交、日志脱敏和一次从新版本回到上一制品的回滚演练。\n\n#### 发布评审记录模板\n\n```text\n制品摘要：\n配置差异：\n迁移与兼容窗口：\n健康与冒烟证据：\n观察指标和时长：\n停止发布条件：\n回滚命令与责任人：\n不可逆副作用：\n```\n\n模板中的每一项都应链接实际证据。\n空白项表示未知，不应用“无”掩盖尚未确认。\n\n#### 版本信息来自构建\n\n`version` 输出语义版本、commit、dirty、Go 版本和平台。\nrelease 构建要求干净 commit，二进制通过 `go version -m` 可审计依赖。\n构建时间若影响可复现性，放入外部 provenance 或使用固定 epoch。\n\n#### 健康检查分工\n\nliveness 只判断进程是否陷入不可恢复状态，readiness 判断当前是否接流量，startup 为慢启动提供窗口。\n数据库短暂失败可让 readiness 失败，但不应让 liveness 触发所有副本重启。\n探针处理必须快速、有界且不依赖昂贵全链路。\n\n#### 发布与迁移顺序\n\n先执行向后兼容 expand migration，再滚动应用，再回填和切换，contract 延后。\n部署期间监控错误、p95、队列、连接池和业务成功率。\n停止条件必须是可查询阈值，不能只写“异常就回滚”。\n\n#### 回滚不是只换镜像\n\n旧应用必须兼容当前 schema 与消息；外部副作用和数据回填可能不可逆。\n发布前决定应用回滚、配置回滚、迁移恢复和前滚修复的适用条件。\n实际演练一次上一制品恢复，并测量时间。\n\n#### 发布验收\n\n在隔离环境运行最终镜像，执行迁移、smoke、SIGTERM、扩容和回滚。\n生产小流量阶段保留观察窗口，责任人根据预设阈值继续或停止。\n记录镜像摘要而非可变 tag。\n\n#### 第四册综合实验：可关闭的任务 API\n\n下面的骨架把本册最重要的运行边界连在一起：Server 有超时，信号形成取消链，readiness 在关闭前翻转，handler 限制请求体，任务 ID 由服务端生成。\n示例只使用内存存储，因此明确不承诺重启恢复；真正需要恢复时再把 `TaskStore` 换成关系库实现。\n\n```go\npackage main\n\nimport (\n\t\"context\"\n\t\"encoding/json\"\n\t\"errors\"\n\t\"fmt\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"os\"\n\t\"os/signal\"\n\t\"sync\"\n\t\"sync/atomic\"\n\t\"syscall\"\n\t\"time\"\n)\n\ntype Task struct {\n\tID        string    `json:\"id\"`\n\tTarget    string    `json:\"target\"`\n\tStatus    string    `json:\"status\"`\n\tCreatedAt time.Time `json:\"created_at\"`\n}\n\ntype MemoryStore struct {\n\tmu    sync.RWMutex\n\ttasks map[string]Task\n}\n\nfunc (s *MemoryStore) Create(target string) (Task, error) {\n\tif target == \"\" {\n\t\treturn Task{}, errors.New(\"target is required\")\n\t}\n\ttask := Task{ID: fmt.Sprintf(\"task-%d\", time.Now().UnixNano()), Target: target, Status: \"pending\", CreatedAt: time.Now().UTC()}\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\ts.tasks[task.ID] = task\n\treturn task, nil\n}\n\nfunc main() {\n\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)\n\tdefer stop()\n\tlogger := slog.New(slog.NewJSONHandler(os.Stdout, nil))\n\tstore := &MemoryStore{tasks: make(map[string]Task)}\n\tvar ready atomic.Bool\n\tready.Store(true)\n\n\tmux := http.NewServeMux()\n\tmux.HandleFunc(\"GET /readyz\", func(w http.ResponseWriter, _ *http.Request) {\n\t\tif !ready.Load() {\n\t\t\thttp.Error(w, \"shutting down\", http.StatusServiceUnavailable)\n\t\t\treturn\n\t\t}\n\t\tw.WriteHeader(http.StatusNoContent)\n\t})\n\tmux.HandleFunc(\"POST /tasks\", func(w http.ResponseWriter, r *http.Request) {\n\t\tr.Body = http.MaxBytesReader(w, r.Body, 64<<10)\n\t\tvar input struct {\n\t\t\tTarget string `json:\"target\"`\n\t\t}\n\t\tdec := json.NewDecoder(r.Body)\n\t\tdec.DisallowUnknownFields()\n\t\tif err := dec.Decode(&input); err != nil {\n\t\t\thttp.Error(w, \"invalid request\", http.StatusBadRequest)\n\t\t\treturn\n\t\t}\n\t\ttask, err := store.Create(input.Target)\n\t\tif err != nil {\n\t\t\thttp.Error(w, err.Error(), http.StatusBadRequest)\n\t\t\treturn\n\t\t}\n\t\tw.Header().Set(\"Content-Type\", \"application/json\")\n\t\tw.WriteHeader(http.StatusAccepted)\n\t\t_ = json.NewEncoder(w).Encode(task)\n\t})\n\n\tserver := &http.Server{Addr: \"127.0.0.1:8080\", Handler: mux, ReadHeaderTimeout: 3 * time.Second, ReadTimeout: 5 * time.Second, WriteTimeout: 10 * time.Second, IdleTimeout: 30 * time.Second}\n\tgo func() {\n\t\t<-ctx.Done()\n\t\tready.Store(false)\n\t\tshutdownCtx, cancel := context.WithTimeout(context.Background(), 8*time.Second)\n\t\tdefer cancel()\n\t\tif err := server.Shutdown(shutdownCtx); err != nil {\n\t\t\tlogger.Error(\"shutdown failed\", \"error\", err)\n\t\t}\n\t}()\n\tlogger.Info(\"server starting\", \"address\", server.Addr)\n\tif err := server.ListenAndServe(); err != nil && !errors.Is(err, http.ErrServerClosed) {\n\t\tlogger.Error(\"server failed\", \"error\", err)\n\t\tos.Exit(1)\n\t}\n}\n```\n\n运行验收不能只执行一次 curl：\n\n```bash\ngo run ./cmd/server\ncurl -i http://127.0.0.1:8080/readyz\ncurl -i -X POST http://127.0.0.1:8080/tasks -H 'Content-Type: application/json' -d '{\"target\":\"api-a\"}'\ncurl -i -X POST http://127.0.0.1:8080/tasks -H 'Content-Type: application/json' -d '{\"target\":\"\",\"extra\":true}'\n```\n\n成功请求应返回 `202` 和任务对象；未知字段或空目标返回 `400`；发送 SIGTERM 后 `/readyz` 先变为不可用，进程在 8 秒内退出。\n进一步练习是把 ID 生成器和时钟注入、增加 request ID、为 handler 写 `httptest`、给任务表增加幂等键，再用崩溃实验说明内存存储为何无法满足恢复要求。\n\n#### 从内存示例升级为可恢复任务模型\n\n生产任务不能只保存 `target` 和 `status`。\n一个最小关系模型需要表达幂等、租约、尝试次数和时间：\n\n```sql\nCREATE TABLE tasks (\n    id               VARCHAR(36) PRIMARY KEY,\n    idempotency_key  VARCHAR(128) NOT NULL,\n    target           VARCHAR(2048) NOT NULL,\n    status           VARCHAR(32) NOT NULL,\n    attempt          INTEGER NOT NULL DEFAULT 0,\n    lease_owner      VARCHAR(128),\n    lease_expires_at TIMESTAMP NULL,\n    result_json      TEXT,\n    error_code       VARCHAR(64),\n    created_at       TIMESTAMP NOT NULL,\n    updated_at       TIMESTAMP NOT NULL,\n    UNIQUE (idempotency_key),\n    CHECK (status IN ('pending','running','succeeded','failed','cancelled'))\n);\n```\n\n创建任务时在同一事务中写入幂等键；重复请求返回已有任务，而不是创建两个副作用。\nWorker 领取任务时使用数据库支持的条件更新或行锁，只有持有未过期租约的 owner 才能提交结果。\n进程在 `running` 状态崩溃后，租约过期使任务重新可领取；`attempt` 和最大尝试次数防止永久毒任务。\n\n状态转换要集中定义：\n\n```text\npending -> running -> succeeded\n                   -> failed\n                   -> pending      # 可重试失败且预算尚存\npending/running -> cancelled       # 业务允许取消\n```\n\n禁止 `succeeded -> running`、`cancelled -> succeeded` 等逆向更新。\n数据库约束负责底线，领域函数负责给出可读错误。\n状态接口返回 `attempt`、更新时间和稳定错误码，但不暴露凭证、原始堆栈或内部 SQL。\n\n#### API 边界的完整处理链\n\n一次请求从 socket 到领域逻辑应按固定次序处理：\n\n1. Server 层先限制 header、body、读取和写入时间。\n2. 恢复中间件捕获未知 panic，记录 stack 与 request ID，返回通用 500。\n3. 可信代理规则解析客户端地址，不能无条件相信 `X-Forwarded-For`。\n4. 身份中间件验证企业 SSO、mTLS 或网关传入的已签名身份。\n5. 授权层检查动作、资源和数据范围，不以“前端没按钮”代替。\n6. handler 解码一次 JSON，拒绝未知字段和尾随第二个对象。\n7. 领域服务执行不变量与幂等判断。\n8. repository 在事务边界内持久化。\n9. response mapper 把领域错误映射为稳定状态码和错误码。\n10. 访问日志与指标记录结果、时延和主体，不记录 Secret。\n\n验证 JSON 只调用一次 `Decode` 不够，还要确认输入流已经 EOF；否则 `{\"target\":\"a\"}{\"target\":\"b\"}` 可能被错误接受。\nContent-Type、方法、body 上限和字符规范都应在进入核心前固定。\n\n#### 错误响应与可观测关联\n\n错误响应供机器判断，日志供维护者定位：\n\n```json\n{\n  \"error\": {\n    \"code\": \"TASK_TARGET_INVALID\",\n    \"message\": \"target is invalid\",\n    \"request_id\": \"01J...\"\n  }\n}\n```\n\n`code` 是兼容性承诺；`message` 可以改进措辞但不能包含内部表名或 Secret；`request_id` 让用户把一次失败与服务端日志关联。\nHTTP 映射可采用：输入错误 400、未认证 401、无权限 403、不存在 404、幂等冲突 409、容量拒绝 429、未知内部失败 500、依赖暂时不可用 503。\n不要把所有 repository 错误原样回给客户端。\n\n日志字段保持低基数且可查询：`request_id`、`task_id`、`route`、`method`、`status`、`duration_ms`、`actor`。\n指标标签不要包含 URL、任务 ID 或错误全文，否则时序数量会失控。\ntrace 用于跨服务因果，日志用于离散事件，指标用于总体趋势，三者通过 trace/request ID 关联而不是互相复制全部内容。\n\n#### 身份、授权与高风险动作\n\n内部系统优先复用现有身份提供方和网关。\n服务必须验证身份断言的签名、issuer、audience、到期时间和允许的时钟偏差；不能仅 base64 解码 JWT 后相信字段。\n密钥轮换要支持短暂重叠，验证失败不能退化为匿名管理员。\n\n授权测试从拒绝路径开始：\n\n| 主体 | 动作 | 数据范围 | 期望 |\n| --- | --- | --- | --- |\n| 未认证 | 查询任务 | 任意 | 401 |\n| viewer | 查询任务 | 自己团队 | 200 |\n| viewer | 创建执行任务 | 自己团队 | 403 |\n| operator | 创建任务 | 自己团队 | 202 |\n| operator | 删除生产任务 | 生产环境 | 403 或进入审批 |\n| admin | 高风险操作 | 已批准范围 | 成功并写审计 |\n\n审计日志与普通应用日志分开治理，记录主体、动作、对象、审批依据、结果和时间；禁止调用方覆盖主体字段。\n高风险变更应支持 dry-run、二次确认或外部审批，并为回滚保留足够上下文。\n\n#### 数据库与连接池容量\n\n`sql.DB` 是并发安全连接池，不是一条连接。\n最大打开连接数必须同时考虑：数据库总连接上限、服务副本数、迁移/管理连接和其他应用。\n例如数据库允许 200 条，本服务最多 5 副本，保留 50 条给其他用途，则单副本不能简单配置 200，初始预算最多约 `(200-50)/5=30`，还要留发布期间新旧副本并存的余量。\n\n重点指标包括打开连接、使用中连接、等待次数、等待时长、查询延迟和错误类别。\n请求超时必须传入 SQL context；慢查询结束后检查连接是否归还。\n事务范围尽量小，禁止持有事务等待远程 HTTP 或人工输入。\n\n迁移是发布的一部分。\n优先使用向后兼容的 expand/contract：先增加新列或新表并让旧版本仍能运行；部署能双写/兼容读取的新代码；回填；切换读取；最后在单独版本删除旧结构。\n一个版本中直接 rename/drop 会让滚动发布的新旧实例互相破坏。\n\n#### 服务容量与过载保护\n\nBackend 不能把无限请求转成无限 goroutine。\n至少设置：\n\n- Server header/body/timeouts，避免慢连接长期占用资源；\n- 请求级并发上限与队列上限，满载时快速返回 429/503；\n- 每个下游独立的连接池、并发和 deadline；\n- 长任务进入持久任务表，不占用 HTTP 请求直到完成；\n- 全局 shutdown deadline 与组件内部更短的清理预算；\n- 基于实际 SLO 的指标与告警，而不是只有进程存活。\n\n限流位置决定保护对象：入口限流保护本服务；按租户限流防止单租户挤占；下游并发限制保护依赖。\n重试会放大流量，应只在一层实施并计入容量模型。\n\n#### 测试金字塔与发布门禁\n\n领域测试验证状态转换、授权矩阵和错误分类；handler 测试验证 HTTP 边界；repository 集成测试运行真实数据库版本，验证约束、事务和迁移；少量端到端测试验证身份接线与完整请求链。\n用内存 fake 通过不能证明 SQL 在真实数据库上正确。\n\nCI 建议按反馈速度执行：\n\n```bash\ngofmt -d .\ngo vet ./...\ngo test ./...\ngo test -race ./...\ngo test -tags=integration ./internal/repository/...\ngo build -trimpath ./cmd/server\n```\n\n构建后生成 SBOM、校验和和镜像摘要；部署前验证迁移兼容性；部署后以真实身份执行 smoke test。\n`/livez` 只证明进程能继续服务，`/readyz` 证明当前实例可接新流量，不能把每个远程依赖都塞进 liveness 导致级联重启。\n\n#### 崩溃与关闭实验\n\n综合实验应实际执行下列时间线：\n\n1. 创建任务并确认幂等重放得到同一 task ID。\n2. Worker 领取任务后强制结束进程，确认租约到期后任务被重新领取。\n3. 在提交结果前后分别崩溃，验证副作用不会重复或有补偿记录。\n4. 发送 SIGTERM，确认 readiness 先失败，新请求不再进入。\n5. 允许已开始的短请求完成，长请求超过 shutdown deadline 后被取消。\n6. 在新旧 schema 版本同时运行时回滚应用，确认旧版本仍可读取。\n7. 人为耗尽数据库连接，确认等待指标、超时和过载响应可观察。\n\n#### 第四册完成标准\n\n- 服务化由共享状态、持续可用或多用户协作驱动，而不是因为“页面需要接口”；\n- HTTP、领域、数据和外部客户端依赖方向清楚，框架类型不污染核心；\n- 输入、身份、授权、错误响应和审计边界都有反向测试；\n- 任务状态可在崩溃后恢复，幂等键、租约和重试预算明确；\n- 数据库连接、请求并发和下游调用都有容量上限；\n- 日志、指标与 trace 能回答一次失败发生在哪一层且不泄露 Secret；\n- CI、迁移、健康检查、滚动发布和回滚均有可执行证据。\n\n#### SDK 只复用协议细节，不隐藏策略\n\n内部 Go SDK 应封装 base URL、认证注入、请求构造、响应解码、分页器和稳定错误类型；是否重试写操作、是否跨租户查询等业务决策仍由调用方明确选择。\nSDK 接口接收 context，客户端配置 timeout，并允许注入 `http.RoundTripper` 便于测试。\n\n分页器必须在空页、重复 cursor 和达到页数上限时停止。\n错误类型保存 HTTP 状态、业务 code、request ID 和可安全公开的信息，不保存完整 Token 或无限响应体。\n版本兼容测试至少用旧 SDK 调新服务、用新 SDK 调兼容窗口内的旧服务。\n\n#### SDK 兼容窗口的最小验证\n\nSDK 的“支持分页和重试”只有在边界行为被固定后才有意义。\n为每个分页器写出终止不变量：空 cursor 结束、重复 cursor 失败、页数超过上限停止；为每个重试策略写出动作不变量：只有明确可重试且仍在 deadline 内时才再次调用。\n\n可以用一个假的 `http.RoundTripper` 依次返回旧响应、新响应和 429，记录请求次数、`Retry-After`、请求 ID 与最终错误分类：\n\n```go\ntype scriptedTransport struct {\n\tresponses []*http.Response\n\tindex     int\n}\n\nfunc (t *scriptedTransport) RoundTrip(*http.Request) (*http.Response, error) {\n\tif t.index >= len(t.responses) {\n\t\treturn nil, io.EOF\n\t}\n\tresp := t.responses[t.index]\n\tt.index++\n\treturn resp, nil\n}\n```\n\n这是可编译片段，测试还必须为每个 response 提供可关闭的 body，并在断言后检查没有泄漏。\n片段所在文件需要导入 `io` 和 `net/http`；如果项目的最低 Go 版本早于 1.13，错误链和 context 的兼容写法也要单独说明。\n兼容验收至少覆盖：旧字段仍能解码、新字段被旧客户端忽略、未知错误 code 不被误判为成功、重复 cursor 不会无限循环、认证刷新最多发生一次。\n生成 SDK 只能减少样板代码，不能替调用方决定写操作是否幂等、错误是否需要人工接管或未知结果是否允许继续。\n\n#### 新旧版本共存是发布前提\n\n滚动发布期间，旧实例和新实例会同时接流量。\nschema 迁移先 expand 再 contract；协议先增加可选字段，再等调用方升级后删除旧字段；任务 payload 带 schema version，Worker 遇到未知版本必须拒绝并告警。\n回滚决策同时检查应用、数据库、任务消息和外部副作用，不能只把 Deployment 指向旧镜像。", "subs": ["发布评审记录模板", "版本信息来自构建", "健康检查分工", "发布与迁移顺序", "回滚不是只换镜像", "发布验收", "第四册综合实验", "从内存示例升级为可恢复任务模型", "API 边界的完整处理链", "错误响应与可观测关联", "身份、授权与高风险动作", "数据库与连接池容量", "服务容量与过载保护", "测试金字塔与发布门禁", "崩溃与关闭实验", "第四册完成标准", "SDK 只复用协议细节", "SDK 兼容窗口的最小验证", "新旧版本共存是发布前提"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
