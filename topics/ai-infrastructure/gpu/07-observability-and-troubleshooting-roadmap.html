<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>

<header>
  <h1>GPU AI Infrastructure 学习笔记 · Observability / Troubleshooting</h1>

    <h2 id="d-title"></h2>
    <div class="toggle-group" data-role="status">
      <button data-status="todo">待学</button>
      <button data-status="doing">在学</button>
      <button data-status="done">已学</button>
    </div>
    <button class="edit-btn edit-only" id="edit-section">编辑</button>
    <button class="close" id="d-close">×</button>

  <div class="edit-actions edit-only" id="edit-actions">
    <input class="edit-title" id="edit-title" type="text" aria-label="小节标题">
    <button class="save" id="save-section">保存</button>
    <button class="cancel" id="cancel-edit">取消</button>
    <span class="save-state" id="save-state"></span>

  <div class="body" id="d-body"></div>

</aside>
<div class="diagram-backdrop" id="diagram-backdrop"></div>
<section class="diagram-modal" id="diagram-modal" role="dialog" aria-modal="true" aria-label="放大图表">
  <header>
    <strong>Mermaid 图表</strong>
    <div class="diagram-controls" aria-label="图表缩放">
      <button id="diagram-zoom-out" title="缩小">-</button>
      <span class="diagram-zoom" id="diagram-zoom">100%</span>
      <button id="diagram-zoom-in" title="放大">+</button>
    </div>
    <button class="diagram-close" id="diagram-close" title="关闭">×</button>
  </header>
  <div class="diagram-body" id="diagram-body">
    <div class="diagram-canvas" id="diagram-canvas">
      <div class="diagram-inner" id="diagram-inner"></div>
    </div>
  </div>
</section>

<script id="data" type="application/json">{"title": "GPU AI Infrastructure 学习笔记 · Observability / Troubleshooting", "intro": "", "parts": [{"title": "第 1 章 · GPU 可观测性的四层模型", "sections": [{"title": "Hardware、Performance、Platform 和 Workload 要关联起来", "content": "GPU 监控的目标不是收集最多指标，而是解释“硬件是否健康、资源是否交付、工作是否高效、业务是否达标”：\n\n| 层次 | 对象 | 关键问题 |\n| --- | --- | --- |\n| Hardware | GPU、PCIe、NVLink、NVSwitch、Power、Cooling | 设备是否存在、可达、健康 |\n| Performance | SM、Tensor、DRAM、PCIe/NVLink、Clock | 算力和带宽用在哪里 |\n| Platform | Node、Driver、Operator、Device Plugin、HAMi | 资源是否正确交付和隔离 |\n| Workload | Pod、Job、Queue、Step、Tokens/s、Latency | 用户是否获得预期结果 |\n\n```mermaid\nflowchart TD\n    SLO[Workload SLO] --> W[Workload Metrics]\n    W --> P[Platform State]\n    P --> G[GPU Performance]\n    G --> H[Hardware Health]\n    H --> R[Alert and Runbook]\n    R --> SLO\n```\n\n四层指标需要通过 Node、GPU UUID、MIG UUID、Pod UID、Job ID 和时间窗口关联。GPU index 会在重启、MIG 重配或容器内变化，不适合作为长期唯一键。", "subs": []}, {"title": "Allocated、Active 和有效吞吐要分开统计", "content": "GPU Allocated 表示调度器已分配资源，GPU Active 表示设备在采样期有执行活动，Effective Throughput 则是 Samples/s、Tokens/s、完成任务数或服务请求吞吐。三者分别回答资源承诺、硬件活动和业务产出，不能相互替代。\n\n`Allocated` 高而 `Active` 低，可能是数据准备、队列、Barrier、初始化或资源碎片；`Active` 高而吞吐低，可能是 Memory Bound、通信、节流、算子回退或邻居争用。容量报告应把这三类指标放在同一时间窗口。\n\n建议按 `Node、GPU UUID、Pod UID、Job ID` 保存三类指标，并记录资源申请到首次 Kernel 的启动延迟。对服务场景，还要把排队请求数和拒绝数加入同一窗口，否则“已分配但无活动”可能只是没有流量。容量评审应区分承诺容量、可用容量和实际产出，避免用 Allocated 百分比直接计算利用率。", "subs": []}]}, {"title": "第 2 章 · 硬件健康和 DCGM", "sections": [{"title": "温度、功耗、时钟和 Throttling 共同解释环境约束", "content": "温度过高可能触发 Thermal Slowdown，功耗接近 Power Limit 可能触发 Power Throttling，时钟下降也可能来自应用负载、管理员锁频或 P-State 变化。单个瞬时值不能直接归因，要把温度、功耗、时钟、风扇、机房进风和业务吞吐放在同一时间线上。\n\n```bash\nnvidia-smi --query-gpu=uuid,temperature.gpu,power.draw,power.limit,clocks.sm,clocks.mem,pstate,clocks_throttle_reasons.active --format=csv\nnvidia-smi dmon -s pucvmet -d 1\nipmitool sensor 2>/dev/null | rg -i 'temp|fan|power'\n```\n\n持续降频并伴随吞吐下降时，应按节点维护流程 Cordon/Drain 后检查风道、散热器、风扇、电源和机房温度；一次 Power Limit Active 但吞吐正常，更适合作为容量和能效信号分析。", "subs": []}, {"title": "ECC、Retired Pages、Row Remap 和 XID 反映不同风险", "content": "Correctable ECC 可以被硬件纠正，但持续增长可能表示显存退化；Uncorrectable ECC 可能导致应用失败、GPU Reset 或节点隔离。Retired Pages 表示已停用的显存页面，Row Remap 表示用备用行替换故障 DRAM 行，Pending/Failure/资源耗尽通常比累计值更需要关注。\n\nXID 是 NVIDIA Driver 写入 Kernel Log 的错误编号，不是脱离上下文即可执行的处置指令。应保存编号、GPU UUID/BDF、时间、进程、前后日志和是否重复，再参考适用代际的 NVIDIA Debug Guideline。\n\n```bash\nnvidia-smi -q -d ECC,PAGE_RETIREMENT,ROW_REMAPPER\njournalctl -k --since '2 hours ago' | rg -i 'NVRM|Xid|SXid|PCIe|AER'\nnvidia-smi --query-gpu=uuid,pci.bus_id,ecc.errors.uncorrected.volatile.total,ecc.errors.corrected.volatile.total --format=csv\n```\n\n重复 Uncorrectable ECC、Fatal XID、GPU Fallen Off Bus 或 Row Remap Failure 通常应停止新作业并保留现场；单次 Correctable Counter 增加应先观察增长率和 DCGM Health。", "subs": []}, {"title": "DCGM 提供健康、诊断、分析和作业统计能力", "content": "DCGM 以 GPU、GPU Instance、Compute Instance、NVSwitch 等 Entity 管理设备，提供 Field Watch、Health、Diagnostics、Profiling、Accounting 和 Job Statistics。Health 观察错误和状态，Diagnostics 会主动施加测试负载，Profiling 提供 SM/Tensor/DRAM 等活动，Accounting 汇总进程或作业使用。\n\n```bash\nsystemctl status nvidia-dcgm\ndcgmi discovery -l\ndcgmi health -s a\ndcgmi health -c\ndcgmi diag -r 1\ndcgmi dmon -e 1001,1002,1004 -c 10\n```\n\nHealth Pass 只说明观察窗口内未发现已配置问题，不等于完整硬件验收；高等级 Diagnostic 应在节点 Drain 后运行。", "subs": []}, {"title": "DCGM Exporter 把 GPU Telemetry 暴露给 Prometheus", "content": "DCGM Exporter 可以作为 GPU Operator Operand、DaemonSet、容器或系统服务，把选定 Field 转成 Prometheus 指标。Exporter HTTP 可抓取不等于 GPU Field 有效，还要检查 UUID/Pod 映射、权限、`N/A`、采集耗时和 Cardinality。\n\n```bash\nkubectl -n gpu-operator get pods -l app=nvidia-dcgm-exporter -o wide\nkubectl -n gpu-operator logs -l app=nvidia-dcgm-exporter --tail=100\ncurl -fsS http://127.0.0.1:9400/metrics | head\n```\n\n自定义 Counter CSV 应版本化，升级后检查指标重命名、单位和标签变化。GPU、MIG、Pod 和 Job 标签不能无限扩张，否则监控系统本身会成为容量问题。", "subs": []}]}, {"title": "第 3 章 · 性能指标和业务诊断", "sections": [{"title": "SM、Tensor、DRAM、PCIe 和 NVLink 要按阶段解释", "content": "| 指标 | 高值可能表示 | 低值可能表示 |\n| --- | --- | --- |\n| GPU Utilization | 采样期有 Kernel | 无工作、等待或初始化 |\n| SM Activity | 执行资源繁忙 | 并行度低或同步等待 |\n| Tensor Activity | 矩阵低精度路径生效 | 算子回退或非矩阵负载 |\n| DRAM Activity | 显存接口繁忙 | 数据复用高或设备空闲 |\n| PCIe Throughput | Host/Device/NIC 搬运多 | 已走 NVLink 或输入不足 |\n| NVLink Throughput | P2P/Collective 活跃 | 路径未使用或链路异常 |\n\n训练 Compute、AllReduce、Checkpoint，推理 Prefill、Decode 都有不同指标模板。只有把指标和模型阶段、应用吞吐、请求队列一起看，才能区分正常工作模式和性能异常。", "subs": []}, {"title": "Queue、Pod、Job 和训练指标要形成一条时间线", "content": "平台层记录 Namespace、Pod/Job 状态、请求的 GPU/Profile、实际 UUID、分配时长、Waiting、Idle 和失败原因；训练层记录 Step Time、Samples/s、Tokens/s、Loss、Checkpoint Duration 和 Scaling Efficiency；推理层记录 Request Rate、Queue Time、Batch、TTFT、P50/P95/P99 和 Error Rate。\n\n建议明确形成 GPU 使用时间、GPU Waiting、GPU Idle、Training Throughput、Inference Latency、Tokens/s、Queue Time 和 Job Failure 八类工作负载指标，而不是试图从 DCGM 硬件 Field 反推出所有业务状态。\n\n如果 Queue 很长但 GPU Idle，优先看 Scheduler、Quota、Affinity、Fragmentation 或 Gang Admission；如果 GPU Busy 且推理 Queue 增长，才更像计算容量不足；如果训练 Step 周期性变长，应比较 DataLoader、AllReduce 和 Checkpoint 时间。\n\n#### 每个指标必须声明生产者和时间边界\n\n| 指标 | 主要生产者 | 推荐时间边界 | 不能单独证明什么 |\n| --- | --- | --- | --- |\n| GPU 使用时间 | Scheduler 分配事件、Pod/Job 生命周期 | Allocation Start 到 Release | GPU 是否真正执行有效计算 |\n| GPU Waiting | Queue 或 Job Controller | Submit 到 Admission/Allocation | 等待是否由物理 GPU 不足造成 |\n| GPU Idle | DCGM 活动指标与 Allocation Join | 已分配窗口内的非活动时间 | 无 Kernel 是否属于异常 |\n| Training Throughput | Framework/Trainer | Step、窗口或完整 Attempt | GPU 硬件是否健康 |\n| Inference Latency | Gateway/Serving Runtime | 请求入口到完成 | GPU Kernel 时间占比 |\n| Tokens/s | Trainer 或 Serving Runtime | 固定模型阶段与输入桶 | 不同模型、精度之间可直接比较 |\n| Queue Time | Scheduler、Gateway 或 Batcher | 进入队列到离开队列 | 后续执行是否满足 SLA |\n| Job Failure | Job Controller、Launcher、应用 | Attempt 结束事件 | 根因位于应用还是基础设施 |\n\nDCGM 能说明设备在某个采样窗口内做了什么，但它不知道业务请求、Scheduler Queue、模型 Revision 或训练 Step 的含义。Kubernetes 知道 Pod 被调度到哪个 Node，却不天然知道容器最终使用了哪个物理 GPU。应用知道 Step 和 Token，却可能看不到 PCIe、NVLink 或硬件错误。因此这些指标必须在观测系统中 Join，不能要求单一组件提供全部答案。\n\n#### 稳定身份把多套系统连接起来\n\n推荐的关联链如下：\n\n```text\nCluster\n  -> Node UID 和 Node Name\n  -> GPU UUID 或 MIG UUID\n  -> Namespace 和 Pod UID\n  -> Container Name 和 Container ID\n  -> Job ID 和 Attempt\n  -> Rank 和 Local Rank\n  -> Model 或 Engine Revision\n```\n\nGPU Index、容器内 Device Ordinal 和 DCGM Entity 数值 ID 都可能随重启、MIG 重配或运行时映射改变，只适合短期定位。持久记录以 GPU/MIG UUID、Pod UID、Job Attempt 和时间窗口为主，数值 ID 作为当时快照保存。多节点训练还要保存 Rank 到 Node、GPU UUID 和 HCA 的最终映射，否则只能看到“Rank 3 慢”，无法定位物理路径。\n\n| 系统 | 必留身份 | Join 目的 |\n| --- | --- | --- |\n| Kubernetes | Cluster、Node UID、Namespace、Pod UID、Container | 连接申请、调度和生命周期 |\n| Device/Runtime | GPU UUID、MIG UUID、Container ID | 证明容器最终获得的设备 |\n| DCGM/Exporter | Node、Entity、GPU/MIG UUID、Timestamp | 连接硬件状态和活动 |\n| Scheduler/Job | Job ID、Attempt、Queue、Priority、Submit/Start/End | 计算等待、运行和失败重算 |\n| Training | Global/Local Rank、Step、Checkpoint、Model Revision | 关联慢 Rank 和训练阶段 |\n| Inference | Service/Model Revision、Request Bucket、Batch、Stage | 关联 Queue、Prefill、Decode 和延迟 |\n\n#### Requested、Allocated、Active、Idle 和 Useful 是不同状态\n\n```text\nRequested Time\n  = 等待中和运行中的资源需求时间\n\nAllocated Time\n  = GPU 已经归属给工作负载的时间\n\nActive Time\n  = Allocated 窗口内设备出现有效执行活动的时间\n\nIdle Time\n  = Allocated Time - Active Time\n\nUseful Time\n  = 产生最终被接受业务结果的工作时间\n```\n\n这些公式是口径，不要求用一个 DCGM Field 精确积分。Active 需要结合采样周期和阶段定义；Useful 还要扣除失败 Attempt、恢复后重算、无效实验、被丢弃请求或未达到质量/SLA 的输出。短 Checkpoint、Evaluation、模型加载或动态批处理等待可以造成合理 Idle，不能看到一分钟低利用就立即回收资源。\n\n平台报表至少同时展示 Requested、Allocated、Active、Useful 和 Failed/Recomputed。只展示 Allocated 会把等待数据和失败重算当成有效使用；只展示 Active 又会惩罚合理的 Checkpoint、通信和服务待机。\n\n#### 时间线先对齐状态再解释指标\n\n```mermaid\nflowchart LR\n    A[Request Submitted] --> B[Queue Admission]\n    B --> C[Resource Allocated]\n    C --> D[Container Started]\n    D --> E[Framework Ready]\n    E --> F[GPU Active]\n    F --> G[Business Output]\n    G --> H[Checkpoint Or Response]\n    H --> I[Release Or Retry]\n```\n\n每个状态转换都记录事件时间。分析时先找哪一段时间变长，再查看该段的 GPU、CPU、网络、存储和应用证据。把不同 Job、不同 Attempt 或不同模型阶段的平均值混在一起，会让 Queue、启动和执行问题互相掩盖。\n\n#### 训练案例从周期性慢 Step 找到等待层\n\n假设训练 Job 已分配全部 GPU，整体 GPU Active 较高，但每隔固定周期 Step Time 明显增加。先按 Job Attempt 和 Step 对齐训练日志，再比较慢 Step 的 DataLoader、Compute、AllReduce 和 Checkpoint Duration：\n\n1. 慢点与 Checkpoint 同时出现，GPU Idle 增加且存储写入上升，优先检查 Checkpoint 并发、提交和共享存储，而不是扩 GPU。\n2. 某个 Rank 更早停止 Compute，其他 Rank 随后等待 Collective，检查该 Rank 的 CPU、数据 Shard、Clock、XID 和 GPU-NIC 路径。\n3. 所有 Rank 的 Compute 正常但 AllReduce 同时变长，比较 NVLink/RDMA Counter、NCCL 日志和同时间窗的其他 Job 流量。\n4. Attempt 最终失败时，把失败前已消耗的 GPU 时间记入 Failed/Recomputed，而不是继续计入有效训练吞吐。\n\n恢复验证使用同一模型 Revision、Batch、并行布局和 Checkpoint 周期，比较 Step Time 分布、最慢 Rank、有效 Tokens/s 和错误增量。GPU Utilization 恢复只是证据之一。\n\n#### 推理案例从 Queue 增长区分容量与供给中断\n\n当请求 Queue 和 P99 同时增长时，先按模型 Revision、输入/输出长度桶和副本查看：\n\n- GPU Active、Batch 和 Tokens/s 都接近健康上限：更像计算容量已饱和，可评估扩副本、调整 Batch 或模型优化。\n- GPU Idle 仍高且 Queue 增长：检查 Batcher、Tokenizer、CPU、模型加载、Runtime Error 和请求路由，不能直接增加 GPU。\n- GPU Active 高但 Tokens/s 下降：检查 Context 分布、KV Cache、Clock/Throttle、共享邻居和 Kernel/Engine 变更。\n- 只有一个副本异常：按 Pod UID 和 GPU UUID 比较该副本的设备、Runtime 和邻居；所有副本同步异常则优先检查流量形状或公共依赖。\n\n推理恢复要同时满足 Queue 回落、TTFT/TPOT 或端到端 P99 恢复、Tokens/s 回到同输入桶基线、错误率稳定。只看平均延迟会掩盖长 Context 和单副本离群。\n\n#### Metric 到 Runbook 的转换需要明确分支\n\n| Metric 组合 | Meaning | 典型 Symptom | Alert 条件思路 | Runbook 起点 |\n| --- | --- | --- | --- | --- |\n| Allocated 高、Active 低、Queue 有需求 | 已拿到卡但工作未送入 GPU | Job Running 但吞吐低 | 超过启动宽限并持续偏离基线 | Pod/进程、DataLoader、Storage、Barrier |\n| Active 高、Useful Throughput 低 | GPU 忙但有效产出下降 | Step/P99 变慢 | 同 Revision、同输入桶下联合偏离 | SM/Tensor/DRAM、Clock、NCCL、邻居 |\n| Queue 高、Allocated 低 | 资源未交付 | Pending/Waiting 超 SLO | Queue Age 与可放置资源联合判断 | Quota、Affinity、Fragmentation、Gang |\n| Job Failure 增长伴 XID/ECC | 失败可能来自节点健康 | 多 Attempt 在同 GPU 失败 | 按 UUID 聚合的新硬件事件 | 保存首错、Cordon、硬件 Runbook |\n| Job Failure 增长但硬件基线正常 | 更像应用或制品问题 | 同镜像跨节点失败 | 按 Model/Image Revision 聚合 | Framework、配置、数据和发布回滚 |\n\n示意 PromQL 只能表达 Join 思路，指标名需要按实际 Scheduler 和应用集成替换：\n\n```promql\navg_over_time(DCGM_FI_DEV_GPU_UTIL[15m]) < 10\nand on (namespace, pod) gpu_pod_allocated == 1\nand on (namespace, pod) workload_queue_depth > 0\n```\n\n规则还要有启动宽限、模型加载、Checkpoint、维护窗口和 Telemetry Missing 分支。指标不存在时应进入 Unknown，而不是把缺失 Series 当作 GPU Idle。", "subs": ["每个指标必须声明生产者和时间边界", "稳定身份把多套系统连接起来", "Requested、Allocated、Active、Idle 和 Useful 是", "时间线先对齐状态再解释指标", "训练案例从周期性慢 Step 找到等待层", "推理案例从 Queue 增长区分容量与供给中断", "Metric 到 Runbook 的转换需要明确分支"]}]}, {"title": "第 4 章 · 分层故障排查", "sections": [{"title": "GPU 缺失和 Driver 故障从 PCIe 到内核日志开始", "content": "```bash\nlspci -nn | rg -i 'nvidia|3d controller'\nlsmod | rg '^nvidia'\njournalctl -k -b | rg -i 'nvrm|xid|nvidia|aer'\nnvidia-smi\n```\n\n若 `lspci` 看不到设备，优先考虑插槽、电源、PCIe、固件或硬件；若设备存在但 Driver 未加载，检查内核版本、模块签名、Nouveau、DKMS 和残留版本；若出现 Fallen Off Bus、Fatal XID 或设备数量变化，应保留现场并隔离节点。", "subs": []}, {"title": "容器和 Kubernetes 故障要沿组件链路定位", "content": "`nvidia.com/gpu` 不存在时，从 Node Driver、Toolkit/Runtime、Device Plugin、Kubelet Capacity 依次检查。Pod Pending 时先看 Event，可能是 GPU 不足、Taint/Affinity、Quota、MIG Profile、HAMi Resource、Gang Admission 或 Node Unschedulable。\n\n```bash\nkubectl describe node <node> | sed -n '/Capacity:/,/System Info:/p'\nkubectl get pods -n gpu-operator -o wide\nkubectl logs -n gpu-operator <pod> --all-containers --tail=200\nkubectl describe pod <pod> -n <namespace>\nkubectl get events -n <namespace> --sort-by=.lastTimestamp | tail -50\n```\n\nOperator 异常要定位具体 Operand 和 Validator，不能只重启 Operator；同一节点 Device Plugin 反复失败或 Allocatable 突然减少时应 Cordon。", "subs": []}, {"title": "NCCL Timeout 和 Hang 要寻找首错", "content": "| 现象 | 常见原因 | 首要证据 |\n| --- | --- | --- |\n| NCCL Timeout | Rank 崩溃、Collective 不一致、网络超时 | 全 Rank 首错和时间线 |\n| NCCL Hang | Launch 顺序、接口、异步错误 | NCCL Debug、Stack、Framework Log |\n| RDMA 异常 | Port/GID/MTU/PFC/ECN/Driver | `rdma`、`ibstat`、端口计数器 |\n| 多节点变慢 | 拓扑、慢 Link、拥塞、Straggler | 分层 NCCL Tests |\n\n先用 Socket/Host Network 证明进程和基本连通，再验证 RDMA、GPU Buffer/GDR、NCCL，最后回到框架和应用。一次只改变一个诊断变量，避免用回退路径掩盖根因。", "subs": []}, {"title": "CUDA OOM、低利用率和高利用率低吞吐不是同一类问题", "content": "CUDA OOM 需要记录 OOM 前的进程显存、模型阶段、Batch/Context、Allocator Summary、共享方案和邻居占用。单个模型的峰值或碎片通常是 Workload 问题；多个无关 Pod 同时 OOM 或突破共享限制，才需要升级为平台隔离问题。\n\nGPU 长期为零时检查设备是否真正分配、进程是否初始化、DataLoader/CPU/I/O、Queue、Barrier 和错误日志；GPU 高利用率而吞吐低时检查 SM/Tensor/DRAM、Clock/Throttle、通信占比和 Kernel 效率。\n\n排障记录要标明异常开始前后的 Batch、输入长度、精度和并发，保证复测口径一致。先用单卡或最小复现确认应用行为，再与同 SKU 健康节点做微基准对照；只有跨多个工作负载复现且硬件证据一致时，才升级为节点或平台故障。", "subs": []}, {"title": "MIG 和 HAMi 分配异常要同时查设备和调度状态", "content": "MIG 配置失败常见于设备未 Drain、进程持有 GPU、Profile Placement Fragmentation、MIG Manager Label/Config 不一致、Driver/型号不支持或 Device Plugin 未重新发现。HAMi 则要分别检查 Scheduler 账本、Webhook/Annotation、Device Plugin Allocate、HAMi-Core Mount 和容器内 Quota。\n\n```bash\nnvidia-smi -L\nkubectl describe node <node> | rg -i 'mig|gpu|hami' -C 2\nkubectl describe pod <pod> -n <namespace>\nkubectl logs -n kube-system deploy/hami-scheduler --tail=200\nkubectl logs -n kube-system ds/hami-device-plugin --tail=200\n```\n\n共享控制失效可能破坏租户边界。显存限制可被越过、MIG 布局与声明资源不一致或多个 Pod 互相影响时，应停止该节点接收共享工作负载，修复后用竞争 Pod 验证边界。", "subs": []}]}, {"title": "第 5 章 · 硬件与驱动 Runbook", "sections": [{"title": "nvidia-smi 无 GPU 时先判断设备是否完成 PCIe 枚举", "content": "#### 现象和可能原因\n\n`nvidia-smi` 报无法连接 Driver、显示 No Devices Were Found，或设备数量少于资产清单。可能原因包括 GPU 未上电、PCIe 未枚举、Link/Riser 故障、Driver 未加载、设备 Fallen Off Bus 或虚拟机未完成直通。\n\n#### 检查和解释\n\n```bash\nlspci -nn | rg -i 'nvidia|3d controller'\nlsmod | rg '^nvidia'\njournalctl -k -b | rg -i 'nvrm|xid|aer|pcie'\nnvidia-smi -L\n```\n\n`lspci` 也缺设备时，从硬件、BMC、BIOS、Slot 和 PCIe 链路查起；`lspci` 有但模块缺失时转 Driver Runbook；模块存在但 `nvidia-smi` 失败时检查 XID、设备节点和 Driver 初始化。\n\n#### 处置、隔离和恢复\n\n设备数量变化、Fallen Off Bus 或 Fatal XID 应立即 Cordon，停止新作业并保存日志。需要重启、断电或重新插卡时必须 Drain。恢复后核对 Inventory、PCIe Speed/Width、DCGM Health、单卡 Burn-in 和多卡拓扑。", "subs": ["现象和可能原因", "检查和解释", "处置、隔离和恢复"]}, {"title": "NVIDIA Driver 加载失败要区分模块构建、签名和冲突", "content": "#### 可能原因\n\n常见原因包括 Kernel Header/Module 不匹配、DKMS Build 失败、Secure Boot 拒绝签名、Nouveau 占用设备、残留多个 Driver 分支、容器化 Driver 与 Host 内核不匹配，以及 Fabric Manager 版本不配对。\n\n```bash\nuname -r\nmodinfo nvidia | head\ndkms status\njournalctl -k -b | rg -i 'nvidia|nouveau|module|signature'\nls -l /dev/nvidia*\n```\n\n#### 处理和恢复\n\n不要同时覆盖安装多个发行渠道的 Driver。先确认节点池标准安装方式，再在 Drain 后修复模块、签名或冲突。恢复验证包含 Driver、FM、DCGM、Container Smoke Test、Device Plugin 和真实模型；同节点所有 Pod 受影响时保持隔离。", "subs": ["可能原因", "处理和恢复"]}, {"title": "Driver 与 CUDA 不兼容要检查实际加载的用户态库", "content": "#### 现象\n\n应用可能报告 `CUDA driver version is insufficient`、`cudaErrorCallRequiresNewerDriver`、未找到 Symbol、Kernel Image 不支持，或者 Framework CUDA 初始化失败。`nvidia-smi` 正常只能证明 Driver 基本工作。\n\n```bash\nnvidia-smi\nnvcc --version\nldconfig -p | rg 'libcuda|libcudart'\nLD_DEBUG=libs <application> 2>&1 | less\n```\n\n#### 判断和处置\n\n确认 Host Driver、容器 Runtime、Framework Build、Compute Capability 和 Compat Package，排除 Stub/旧库抢占。若整个节点池的标准镜像失败，按版本发布故障处理；若只有一个镜像失败，不隔离硬件节点。修复后运行最小 CUDA 和目标 Framework 测试。", "subs": ["现象", "判断和处置"]}, {"title": "XID Error 要依据编号、重复性和影响范围处置", "content": "#### 证据采集\n\n```bash\njournalctl -k --since '2 hours ago' | rg -i 'NVRM.*Xid'\nnvidia-smi --query-gpu=uuid,pci.bus_id --format=csv\nnvidia-smi -q\n```\n\n保存 XID 编号、UUID/BDF、时间、进程、作业、前后 Kernel Log、是否重复和是否伴随 PCIe/ECC/NVLink 错误。相同编号在不同代际和上下文中的严重度可能不同，应查当前 Debug Guideline。\n\n#### 隔离和恢复\n\nFatal、重复、影响多个作业、GPU Reset 或 Fallen Off Bus 通常需要 Cordon/Drain；单次可恢复应用错误可先保留证据并观察。Reset 有设备占用和平台限制，不能在线盲目执行。恢复后跑 DCGM Diagnostic 和目标负载。", "subs": ["证据采集", "隔离和恢复"]}, {"title": "ECC Error 要区分 Correctable、Uncorrectable 和退化趋势", "content": "```bash\nnvidia-smi -q -d ECC,PAGE_RETIREMENT,ROW_REMAPPER\ndcgmi health -c\n```\n\nCorrectable 单次增加可先观察增长率；持续增长、Retired Pages Pending 或 Row Remap 资源下降需要维护评估。Uncorrectable、Row Remap Failure 或伴随作业崩溃通常应隔离。恢复验证要包含显存压力测试、DCGM Diagnostic 和错误计数不再增长。", "subs": []}, {"title": "PCIe Error 要关联 AER、Link Width 和 GPU 状态", "content": "```bash\njournalctl -k -b | rg -i 'AER|PCIe|fallen off'\nlspci -s <BDF> -vv | rg -i 'LnkCap|LnkSta|AER'\nnvidia-smi topo -m\n```\n\nCorrected AER 偶发记录和持续 Fatal AER 的风险不同。当前 Link Speed/Width 低于能力、错误持续增长或 GPU 掉线时，检查 Slot、Riser、主板、供电和固件，并隔离节点。冷重启恢复不等于根因消失，必须长时间 Burn-in 并比较健康节点。", "subs": []}, {"title": "NVLink Error 和 NVSwitch/Fabric Manager Error 要按 Fabric 域处置", "content": "```bash\nnvidia-smi nvlink --status\nnvidia-smi nvlink --errorcounters\nnvidia-smi -q | sed -n '/Fabric/,+30p'\nsystemctl status nvidia-fabricmanager\njournalctl -u nvidia-fabricmanager -b\n```\n\n单 Link Inactive、CRC/Replay 增长会影响特定 GPU 对；NVSwitch SXid、FM 初始化失败或 Partition 异常可能影响整个 Scale-up 域。先保存拓扑和计数器，再停止新多卡任务。恢复后验证 Fabric State、P2P Matrix、NCCL Tests 和真实扩展效率。", "subs": []}, {"title": "Thermal Throttling 和 Power Throttling 要分开判断", "content": "Thermal Throttling 通常伴随温度升高、时钟降低和冷却告警；Power Throttling 表示负载触及功耗上限，可能是正常功耗管理，也可能因机架/电源策略异常降低性能。\n\n```bash\nnvidia-smi --query-gpu=uuid,temperature.gpu,power.draw,power.limit,clocks.sm,clocks.mem,clocks_throttle_reasons.active --format=csv\nipmitool sensor 2>/dev/null | rg -i 'temp|fan|power'\n```\n\n持续 Thermal Slowdown 应隔离并检查风道、风扇、冷板和机房进风；Power Limit Active 需与同型号基线和应用吞吐比较。恢复后在目标功耗下持续压测，确认时钟和吞吐稳定。", "subs": []}]}, {"title": "第 6 章 · 容器、Kubernetes 与共享 Runbook", "sections": [{"title": "Container 无法看到 GPU 要比较 Host 和最小容器", "content": "先确认 Host `nvidia-smi`，再运行受支持的最小 CUDA 容器。所有容器失败时检查 Toolkit、Runtime Handler、CDI、Device Cgroup 和 `/dev/nvidia*`；单镜像失败时检查用户、动态库、Entrypoint 和环境变量。\n\n```bash\ndocker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi\nnvidia-ctk cdi list\n```\n\n节点级注入失败影响同节点多个 Pod 时 Cordon；单应用镜像失败不隔离。恢复后从 Docker/containerd 到 Kubernetes、Framework 逐层验证。", "subs": []}, {"title": "PyTorch CUDA 不可用要先识别 CPU Build", "content": "```bash\npython - <<'PY'\nimport torch\nprint(torch.__version__, torch.version.cuda)\nprint(torch.cuda.is_available(), torch.cuda.device_count())\nPY\n```\n\n`torch.version.cuda is None` 多为 CPU Build；有版本但不可用则检查设备、Driver/Runtime、`CUDA_VISIBLE_DEVICES`、动态库和 Compute Capability。最小 CUDA 容器与其他 PyTorch 镜像正常时，按应用镜像处理，不隔离节点。", "subs": []}, {"title": "Kubernetes nvidia.com/gpu 不存在要沿注册链路检查", "content": "```bash\nkubectl describe node <node> | sed -n '/Capacity:/,/System Info:/p'\nkubectl get pods -n gpu-operator -o wide\nkubectl logs -n gpu-operator <device-plugin-pod> --tail=200\n```\n\nHost Driver 正常但 Capacity 缺失时检查 Device Plugin Registration、Socket、Plugin 日志和 kubelet；Capacity 有而 Allocatable 减少时检查设备 Health、已分配 Pod 和 kubelet Checkpoint。资源突降或插件反复失败时 Cordon，恢复后跑 CUDA Pod。", "subs": []}, {"title": "GPU Operator Operand 异常要定位具体组件", "content": "先找失败 Node 和 Operand：Driver、Toolkit、Device Plugin、GFD、MIG Manager、DCGM、Exporter 或 Validator。查看 Pod Event、Init Container、主容器日志、Node Label 和 ClusterPolicy 状态。Controller Running 不表示节点 Operand 健康。\n\nDriver/Toolkit/Device Plugin 影响设备交付时 Cordon；单 Exporter 失败可在监控降级状态修复，但要防止失去硬件告警。恢复后验证对应层及完整 CUDA 链路。\n\n先记录 ClusterPolicy、Operand Pod 的期望与实际状态，再按依赖顺序处理：Driver 决定设备可用性，Toolkit/Runtime 决定容器注入，Device Plugin 决定资源注册，DCGM/Exporter 决定观测。只重启 Operator 可能掩盖 Init Container 或节点级依赖错误。每次只变更一个 Operand，并保留变更前后的 Node Label、Capacity 和日志。", "subs": []}, {"title": "GPU Pod Pending 要按调度事件分类", "content": "```bash\nkubectl describe pod <pod> -n <namespace>\nkubectl get events -n <namespace> --sort-by=.lastTimestamp | tail -50\nkubectl get resourcequota -n <namespace>\n```\n\n常见类别包括资源不足、Taint/Toleration、Node Affinity、Quota、MIG Profile、HAMi 资源账本、Gang Admission、PVC 或镜像拉取。Pending 通常不是节点硬件故障，不应先重启 GPU Node。只有 Allocatable 与实际健康设备不一致时才转节点 Runbook。", "subs": []}, {"title": "CUDA OOM 要区分真实容量、碎片和共享越界", "content": "保存 OOM 前 Process Memory、Batch/Context/Shape、模型阶段、Allocator Summary、邻居进程和共享方案。降低 Batch 后稳定通常是容量问题；长期运行逐步增长可能是 Cache/泄漏；总空闲看似足够但大块分配失败可能是碎片。\n\n单 Pod OOM 不隔离节点。HAMi/MPS/Time-Slicing 下多个租户同时受影响或突破声明限制时，应停止该节点接收共享任务并验证隔离。\n\n判断时把 Framework 的 Allocated/Reserved 与 `nvidia-smi` 的进程视图对齐；两者差异可能来自上下文、缓存或其他进程。复现应固定输入形状并逐步增加 Batch，记录首次失败的申请大小。修复后用同样的竞争负载验证租户之间不会互相驱逐或突破配额。", "subs": []}, {"title": "MIG 配置失败要检查进程、Profile 和 Placement", "content": "检查 GPU 是否已 Drain、是否有进程持有、型号/Driver 是否支持、目标 Profile 是否能在当前布局放置、MIG Manager Label/Config 是否一致，以及 Device Plugin 是否重新发现。\n\n```bash\nnvidia-smi -L\nnvidia-smi mig -lgi\nnvidia-smi mig -lci\nkubectl describe node <node> | rg -i 'mig|nvidia.com' -C 2\n```\n\n声明资源与物理布局不一致时保持 Cordon。恢复后验证 MIG UUID、资源名、Pod 分配、DCGM Mapping 和实例间隔离。", "subs": []}, {"title": "HAMi GPU 分配异常要查调度和运行限制两条链路", "content": "一直 Pending 时检查 HAMi Scheduler、Node/GPU 账本、Resource Name、Quota 和 Annotation；Pod 已运行但看到整卡资源时检查 Device Plugin Allocate、HAMi-Core Mount/注入和容器环境。\n\n```bash\nkubectl describe pod <pod> -n <namespace>\nkubectl logs -n kube-system deploy/hami-scheduler --tail=200\nkubectl logs -n kube-system ds/hami-device-plugin --tail=200\n```\n\n显存/算力限制可被绕过会破坏多租户边界，应立即停止共享调度。恢复后用两个竞争 Pod 验证限制、OOM、性能干扰和监控归属。", "subs": []}]}, {"title": "第 7 章 · 性能与分布式通信 Runbook", "sections": [{"title": "GPU Utilization 长期为 0 要沿输入链路查找等待", "content": "先确认 Pod 分到正确 GPU、进程存在并完成 CUDA 初始化，再检查请求队列、CPU/DataLoader、存储、网络、Barrier 和错误日志。Allocated 高、Queue 长、GPU Idle 更像平台调度；无请求且 GPU Idle 可能是正常业务低谷。\n\n不因低利用率自动隔离节点。用同节点微基准确认硬件正常后，按 Workload 数据路径优化；恢复验证使用目标 Samples/s/Tokens/s，而不是只要求利用率升高。\n\n应同时查看进程是否存在、Kernel Launch 是否发生以及输入队列是否有待处理工作。若 CPU、Storage 或网络等待与 GPU 空洞同步，根因在供给链路；若没有业务请求，则属于正常空闲。将“无工作”和“有工作但未执行”分成不同告警，避免误触发节点下线。", "subs": []}, {"title": "GPU Utilization 很高但训练很慢要分离计算、显存和通信", "content": "比较 SM、Tensor、DRAM、PCIe/NVLink、Clock/Throttle、NCCL 占比和 Step Time。SM/Tensor 高可能 Compute Bound，DRAM 高可能 Memory Bound，利用率高但 SM 低可能是低效/通信 Kernel。\n\n同节点所有基准下降且伴随节流或错误时隔离；只有单模型下降且硬件微基准正常时转应用性能分析。恢复必须比较同模型、精度、Batch 和数据的吞吐。\n\n对比同一阶段的 SM、Tensor、DRAM 活动、Kernel 时间和 NCCL 时间，确认高利用率来自有效计算还是重试、通信和小 Kernel。记录基线的模型版本、精度、Batch 和拓扑；只有这些口径一致，吞吐差异才可用于回归判断。", "subs": []}, {"title": "NCCL Timeout 要寻找所有 Rank 中的第一个错误", "content": "收集全 Rank 日志并按时间排序。首错可能是 OOM、CUDA 异步错误、进程退出、接口连接失败或 Collective 参数不一致；最后报告 Timeout 的 Rank 通常只是受害者。\n\n```bash\nexport NCCL_DEBUG=INFO\nexport NCCL_DEBUG_SUBSYS=INIT,NET,GRAPH,COLL\nexport NCCL_DEBUG_FILE=/tmp/nccl.%h.%p.log\n```\n\n是否隔离取决于首错：应用 Collective 不一致不隔离，某节点 RDMA/PCIe/NVLink 重复失败则隔离。恢复后先 NCCL Tests，再真实框架任务。", "subs": []}, {"title": "NCCL Hang 要检查调用顺序和异步错误", "content": "确认所有 Rank 进入相同 Collective、Count/Datatype 一致、P2P Send/Recv 匹配、Stream 和 Group Call 正确关闭，并检查 Framework Watchdog/Stack。网络完全无错误时，应用调用顺序比调网卡参数更值得优先检查。\n\n为每个 Rank 记录最后一个成功的 Collective、参数摘要和 CUDA Stream，不要只收集超时 Rank。启用有限时长的 NCCL Debug 与框架分布式日志，避免无限增长。若某 Rank 在进入 Collective 前已退出，应先修复该 Rank 的首错，再判断网络是否只是后续症状。", "subs": []}, {"title": "RDMA 异常按 Physical、NIC、IP、RDMA 顺序排查", "content": "确认 Link、Firmware、Port Mode、IP/Route/MTU、GID、PFC/ECN、QP 和 Perftest。Host Memory 正常而 GPU Buffer 失败时检查 GPU-NIC 拓扑、Peer Memory/DMA-BUF、IOMMU 和权限。\n\n同一 HCA/Port 在多对节点重复失败时隔离对应节点或端口；跨整个交换域失败时按 Fabric 故障处理。恢复后保存 Perftest、Counter 增量和 GDR/NCCL 结果。\n\n每一层都要有正向测试：Physical 看链路和端口，NIC 看接口与固件，IP 看地址路由和 MTU，RDMA 再看 GID、QP、PFC/ECN 与 GPU Buffer。Host Memory 能通信而 GPU Buffer 失败，说明基础网络未必有问题，应转向 GDR、DMA-BUF、IOMMU 或权限。测试结果按发送端、接收端和交换机端口配对保存，便于定位单向故障。", "subs": []}, {"title": "多节点训练性能下降要用分层基准二分", "content": "比较单卡、单机多卡、两节点和多节点结果，按节点、机架、交换机、Rail 二分。观察 NCCL Bus Bandwidth、PFC/ECN/Drop、GPU-NIC 拓扑、慢 Rank、DataLoader 和 Checkpoint。\n\n只有某节点加入后下降时，隔离该节点复测；所有节点相同消息大小下降时，检查算法、MTU、拥塞和框架 Bucket。恢复验证必须使用相同拓扑和参数。\n\n先建立单卡和单机多卡基线，再逐级增加节点；首次出现效率拐点的规模就是重点调查边界。将慢 Rank、链路计数器、GPU-NIC 亲和性和 DataLoader 时间放到同一时间窗，区分通信瓶颈与输入瓶颈。更换节点或切换算法后必须重复相同消息大小和并行配置，避免测试变量同时变化。", "subs": []}]}, {"title": "第 8 章 · 告警、隔离和恢复闭环", "sections": [{"title": "每条 GPU 告警都要能导向一个动作", "content": "| Metric/事件 | 可能症状 | 告警思路 | Runbook 起点 |\n| --- | --- | --- | --- |\n| GPU Count/Health | GPU Missing | Inventory 变化或 Health Fail | PCIe、Driver、Kernel Log |\n| Temperature/Clock | Throttling、吞吐下降 | 持续超基线并关联降频 | Cooling、Power、BMC |\n| ECC/XID | Job Crash、Reset | Uncorrectable 或 Fatal XID | 保存证据、隔离、按码处置 |\n| NVLink/RDMA | NCCL Hang、扩展效率差 | Link Down、错误增长、带宽下降 | Topology、NCCL/RDMA Tests |\n| Pod/Queue | Pending、Waiting | 等待超过 SLO | Event、Quota、Fragment |\n| Tokens/s/Latency | SLA 违约 | SLO Burn Rate | Queue、Batch、GPU Timeline |\n\nRunbook 写明 Owner、Severity、抑制条件、证据命令、是否 Cordon/Drain、恢复验证和升级路径。维护窗口产生的预期重启应抑制，但不能永久屏蔽设备数量变化和 Fatal Error。", "subs": []}, {"title": "节点隔离要基于影响范围而不是错误名称", "content": "| 情况 | 默认动作 |\n| --- | --- |\n| 单个 Pod OOM 或镜像错误 | 修复工作负载，不隔离健康节点 |\n| Driver/Device Plugin 同节点反复失败 | Cordon，保留日志后修复 |\n| Fatal XID、Fallen Off Bus、Uncorrectable ECC | 停止新作业并 Drain/报修 |\n| Link Error 持续增长 | 限制通信作业并按 Fabric 域隔离 |\n| 多节点共享网络故障 | 按交换机、端口、机架域隔离 |\n\nReset、冷重启和在线配置变更都有前置条件。必须先停止持有设备的进程、确认维护窗口和回滚路径，不能把危险恢复命令放进无条件自动化。", "subs": []}, {"title": "恢复验证要覆盖故障发生的层和上层消费者", "content": "硬件修复后不仅运行 `nvidia-smi`，还要做 DCGM、容器、Device Plugin、P2P/NCCL 和目标 Workload；网络修复后从 Perftest、GDR、NCCL 到训练；HAMi/MIG 修复后验证隔离和监控。恢复证据应关联原告警并形成关闭条件。\n\n验证顺序应从底层到上层，每层记录命令、时间、目标 UUID 和结果摘要。功能测试通过但指标没有新鲜数据时，仍应保持 Telemetry Unknown；业务 Smoke 通过但错误计数继续增长时，也不能解除隔离。只有原故障路径和消费者路径都满足关闭条件，才允许重新接收生产任务。", "subs": []}]}, {"title": "第 9 章 · 指标目录和 Prometheus 告警示例", "sections": [{"title": "硬件指标要区分 Gauge、Counter 和事件", "content": "| 类型 | 示例 | 正确观察方式 |\n| --- | --- | --- |\n| Gauge | Temperature、Power、Clock、Utilization | 当前值、窗口平均、与基线偏差 |\n| Counter | ECC、PCIe Replay、NVLink Error、Drop | `increase()` 或 `rate()` 看增量 |\n| State | MIG/Fabric/Link/Health | 状态转换和持续时间 |\n| Event | XID/SXid、Job Failure | 日志事件与 UUID/Job 关联 |\n\n累计 Counter 在维护后可能不归零，直接对“非零”告警会重复触发历史问题。Counter Reset、GPU Replacement 和 Exporter Restart 也要在查询中考虑。", "subs": []}, {"title": "利用率告警要和分配、队列及业务吞吐组合", "content": "单独对 `DCGM_FI_DEV_GPU_UTIL < 50` 告警价值很低。更有意义的条件是“GPU 已分配、经过启动宽限期、业务仍有待处理工作、利用率长期低且吞吐偏离基线”。平台需要把 Scheduler/Pod/Job 和 DCGM 标签连接起来。\n\n示意查询：\n\n```promql\navg_over_time(DCGM_FI_DEV_GPU_UTIL[15m]) < 10\nand on (namespace, pod) gpu_pod_allocated == 1\nand on (namespace, pod) workload_queue_depth > 0\n```\n\n`gpu_pod_allocated` 和 `workload_queue_depth` 是平台示意指标，实际名称由集成决定。告警还要排除模型加载、Checkpoint、维护和已知空闲服务。", "subs": []}, {"title": "Temperature、Power 和 Clock 告警要形成因果组合", "content": "```promql\nmax_over_time(DCGM_FI_DEV_GPU_TEMP[10m]) > <model_threshold>\nand on (UUID) avg_over_time(DCGM_FI_DEV_SM_CLOCK[10m]) < <model_baseline>\n```\n\n阈值必须按 GPU 型号和厂商支持范围配置，不能所有型号共用一个温度。Temperature 高且 Clock/吞吐下降提高 Severity；Power 接近 Limit 但吞吐稳定可以作为容量分析，而非故障 Paging。", "subs": []}, {"title": "XID、ECC 和 Link Error 优先看新增事件", "content": "```promql\nincrease(DCGM_FI_DEV_XID_ERRORS[5m]) > 0\n```\n\n实际 XID 指标的类型、值语义和标签随 Exporter Counter 配置变化，使用前应检查 `/metrics` 和 DCGM Field 文档。Uncorrectable ECC、Fatal XID、Link Down 可以高 Severity；Correctable ECC 单次增加更适合 Warning 和趋势观察。", "subs": []}, {"title": "DCGM Exporter 自身也需要可用性和数据质量告警", "content": "Target Down、Scrape Error、采集时长、Series 数、GPU 数量变化、关键 Field 长期 `N/A` 和 Pod Mapping 缺失都应监控。Exporter Down 时不能得出 GPU 健康结论，应把节点标记为 Telemetry Unknown。\n\n```promql\nup{job=\"dcgm-exporter\"} == 0\n```\n\n升级前后比较 Metric Name、Unit、Label 和 Series Cardinality。Dashboard 空白可能只是指标改名，不能直接解释为 GPU 无负载。", "subs": []}, {"title": "告警通知必须携带最小诊断上下文", "content": "通知至少包含 Cluster、Node、GPU UUID、MIG UUID、PCI BDF、Model、Job/Pod、首次发生、持续时间、相关 XID/SXid、Dashboard 和 Runbook。不要只发 `GPU 0 error`，因为 index 在容器和重启后会变化。\n\n告警关闭条件也要明确：指标恢复、错误不再增长、节点通过验证并 Uncordon。人工 Silence 到期不能自动等同于故障恢复。", "subs": []}]}, {"title": "第 10 章 · 指标语义、采样与聚合陷阱", "sections": [{"title": "Gauge、Counter 和采样活动率需要不同查询方式", "content": "温度、功耗、显存占用通常是 Gauge；ECC、PCIe Replay、XID 出现次数等可能表现为累计 Counter；SM/Tensor/DRAM Active 是采样窗口内活动比例。三类数据不能套用同一种 PromQL。\n\n| 类型 | 常见查询 | 主要陷阱 |\n|---|---|---|\n| Gauge | 当前值、窗口平均、最大值 | 平均会掩盖尖峰 |\n| Counter | `increase`、`rate` | Reset 和 Wraparound |\n| Activity Ratio | `avg_over_time`、分位关联 | 采样窗口和阶段混合 |\n| State/Reason | 按值或 Label 聚合 | `N/A` 与 0 混淆 |\n\n例如 ECC Counter 从 100 变为 0 可能是 Driver/GPU Reset，不是错误减少。查询要结合 `resets`、Exporter Restart、Node Boot Time 和 GPU UUID。", "subs": []}, {"title": "GPU Utilization 的时间聚合会丢失 Burst 结构", "content": "一分钟平均 50% 可能是持续半载，也可能是 30 秒满载加 30 秒空闲。两者对训练 Pipeline 和推理 SLA 的意义不同。Dashboard 应允许 1 秒或较短窗口查看波形，同时保留较长聚合做容量趋势。\n\n```text\nPattern A  50 50 50 50 50 50\nPattern B 100 100 100  0  0  0\nAverage    50 percent for both\n```\n\n高频采集增加 Series、Network 和 TSDB 成本。集群默认周期用于告警，短时高频 Profiling 按事件或代表节点启用，不能无限制对所有 Field 全量采集。", "subs": []}, {"title": "Average by Node 会掩盖单 GPU 异常", "content": "8 卡节点中 7 卡正常、1 卡温度或带宽异常，节点平均可能仍在阈值内。硬件健康告警先按 GPU UUID 判断，再汇总到 Node；容量报告可以按 Node 聚合，但应保留最小值、最大值和离群数量。\n\nMIG 下还要区分 Parent GPU 与 MIG Instance。温度和功耗常属于 Parent，显存/利用率可能能按 Instance 观察。把 Parent Power 复制到每个实例相加会放大总量。", "subs": []}, {"title": "Missing Series 不是零值", "content": "Exporter Down、GPU Lost、Field Unsupported、权限失败和 Pod 不再运行都会导致 Series 消失。PromQL 默认可能让告警表达式也消失，从而没有通知。关键健康规则需要配合 `absent`、Inventory 期望值或 Node Resource Count。\n\nTelemetry Unknown 应是独立状态：不能因为没有 XID Series 就判“没有 XID”，也不能因为 GPU Utilization Series 消失就判“GPU Idle”。", "subs": []}]}, {"title": "第 11 章 · DCGM Health、Diagnostics 与 Profiling", "sections": [{"title": "DCGM Health 持续观察子系统错误", "content": "DCGM Health 可关注 PCIe、Memory、Inforom、Thermal、Power、NVLink 等子系统，具体支持项取决于硬件。Health Result 是对观察窗口和 Field 的综合，不等同于完整 Burn-in。\n\n```bash\ndcgmi discovery -l\ndcgmi health -s a\ndcgmi health -c\n```\n\n命令可能改变当前 DCGM Health Watch 配置，多租户生产环境应由平台统一执行。输出需保存 Entity、System、Status、Error Code 和 Timestamp。", "subs": []}, {"title": "Diagnostics 分不同等级施加测试负载", "content": "DCGM Diagnostics 可验证软件部署、PCIe、Memory、Compute 和压力等项目。较高等级可能长时间占用 GPU、提高功耗温度，并与业务冲突。生产运行前必须 Cordon/Drain，确认无进程并评估功耗与散热。\n\n```bash\ndcgmi diag -r 1\n```\n\n这里只示意短诊断入口；实际 Level、插件和参数要按当前 DCGM 文档与硬件支持确定。诊断通过证明测试期间未发现目标问题，不代表未来不会出现间歇硬件错误。\n\n#### 诊断结果要和现场错误关联\n\nXID 后离线诊断通过，可能是瞬态软件问题、环境抖动或测试未覆盖对应路径。应结合 XID 类型、ECC/AER、NVLink Counter、温度功耗和复现负载决定是否返场，而不是仅凭一个 PASS 立即放回生产。", "subs": ["诊断结果要和现场错误关联"]}, {"title": "Profiling Field Group 服务性能归因", "content": "SM Active、SM Occupancy、Tensor Active、DRAM Active 和 Pipeline 指标帮助区分 Compute、Memory 和调度效率。部分 Profiling Field 互相复用硬件 Counter，可能不能同时采集所有组，采样频率也有成本。\n\n平台默认 Dashboard 选择少量稳定 Field；深度事件分析临时启用额外 Group，并记录启停时间。不能把短时采集配置永久留在所有节点而不评估开销。", "subs": []}, {"title": "Accounting 和 Job Statistics 汇总节点内工作窗口", "content": "DCGM Process/Job Statistics 基于 Host Engine 已经 Watch 并保留的 GPU Field，对一个 OS PID 或调用方定义的 Job Window 生成节点级摘要。它可以汇总运行时间、能耗、显存高水位、利用率、Clock、PCIe 流量、错误、降频原因和 Health Incident，但字段是否出现取决于设备支持、权限、采样和保留窗口。\n\n它不是 Scheduler，也不是持久计费数据库：\n\n| 能力 | DCGM 负责 | DCGM 不负责 |\n| --- | --- | --- |\n| Process Statistics | 汇总被观察 PID 在选定 GPU 上的样本 | 判断 PID 属于哪个 Kubernetes/Slurm Job |\n| Job Statistics | 按调用方提供的 Job ID 和 GPU Group 汇总时间窗 | 分配、保留或隔离这些 GPU |\n| Accounting Mode | 为进程统计提供驱动侧数据条件 | 形成跨节点、跨重启的费用账本 |\n| Retained Samples | 在 Host Engine 内保存有限历史 | 替代 Prometheus、日志或长期数据仓库 |\n\nHost Engine 重启会丢失内存中的 Group、Watch、Sample 和 Job Record。需要结算、容量或审计的数据必须在 Epilogue 中导出，并与 Scheduler Job ID、Attempt、Node、GPU UUID 和时间窗口一起写入持久系统。\n\n#### Process 和 Job 使用不同时间边界\n\n- Process Mode 以一个 OS PID 为身份，适合 PID 本身就是工作单元的场景。Launcher 产生多个子进程、容器内外 PID 不同或一个 Allocation 覆盖多个 Rank 时，单 PID 不能代表完整 Job。\n- Job Mode 由集成方显式执行 Start/Stop，并把一个调用方 Job ID 与 GPU Group 绑定，适合 Scheduler Prologue/Epilogue。\n- 两种模式都无法回补未采集的历史。Watch 必须在工作开始前启用，Retention 必须覆盖作业时长、Epilogue 延迟和查询时间。\n\n采样间隔过长会漏掉短进程和峰值，保留时间过短会在 Job 结束前淘汰开头样本；采样过快、保留过长又增加 Host Engine 负担。平台应按短作业、长训练和交互服务分别定义策略，不照搬默认值。\n\n#### Scheduler 集成拥有完整生命周期\n\n以下命令展示工作流，参数和能力以节点安装版本的 `dcgmi stats --help` 为准：\n\n```bash\n# Prologue: 建立与本节点分配相同的临时 Group\ndcgmi group --create <job-group> --add gpu:<id>,gpu:<id>\n\n# 在作业开始前启用统计 Watch\ndcgmi stats --enable --group <group-id> \\\n  --update-interval <milliseconds> --max-keep-age <seconds>\n\n# 标记调用方定义的作业窗口\ndcgmi stats --jstart <job-id> --group <group-id>\n\n# Epilogue: 应用和子进程结束后停止并读取摘要\ndcgmi stats --jstop <job-id>\ndcgmi stats --job <job-id> --verbose\n\n# 先导出持久系统 再清理短生命周期状态\ndcgmi stats --jremove <job-id>\ndcgmi group --delete <group-id>\n```\n\nGroup 只是 DCGM 的观察选择器，创建 Group 不会完成资源分配或阻止其他进程使用 GPU。Job ID 还应包含或映射 Scheduler Attempt，避免重试覆盖原失败窗口；同一个多节点 Job 需要各节点产生节点级摘要，再由上层按 Job/Attempt 汇总，不能把单节点结果误称为整个训练作业的能耗和利用率。\n\n#### 结果解释要保留采样和聚合边界\n\nJob Summary 可能混合 Gauge 的最小/最大/平均、Counter Delta、Process Facts 和 Health Incident。使用时必须保留：\n\n- 采样周期、Retention 和 Watch 开始时间；\n- GPU Group、物理 UUID、MIG 层级和 Node；\n- Job ID、Attempt、Start/Stop 和进程清理时间；\n- 每 GPU 明细，避免 Group 平均掩盖一个慢卡；\n- `N/A` 的原因，包括 Field 不支持、权限不足、开始太晚或样本已淘汰；\n- Host Engine Restart 事件和集成是否重新建立状态。\n\nDCGM Job Statistics 可作为 GPU 节点证据，但计费还需要 Queue/Allocation、业务产出、失败重算和租户归属。只有把它与 M1 的 Requested、Allocated、Active、Useful 口径连接起来，才能解释“占了多久、设备做了什么、最后产生了多少有效结果”。", "subs": ["Process 和 Job 使用不同时间边界", "Scheduler 集成拥有完整生命周期", "结果解释要保留采样和聚合边界"]}, {"title": "Entity Group 让 GPU、GI、CI 和 Switch 使用统一标识", "content": "DCGM 不只管理整卡，还可表示 MIG GPU Instance、Compute Instance 和 NVSwitch 等 Entity。告警和证据要保存 Entity Group/ID 与物理 UUID 的映射，否则实例重建后无法追溯父设备。\n\nEntity Group 是 Host Engine 中可复用的选择器，不是调度分配或隔离边界。创建包含 `gpu:0`、`instance:<id>` 或 `nvswitch:<id>` 的组，不会改变 `CUDA_VISIBLE_DEVICES`、Device Cgroup 或租户权限；这些仍由调度器和容器运行时负责。组成员也必须符合被调用 DCGM 操作支持的 Entity Family。\n\n排障时先用 `dcgmi discovery --list` 和 `dcgmi discovery --compute-hierarchy` 重新发现当前 ID，再用 UUID、PCI Bus ID 和父子层级关联资产系统。MIG 重配或 Host Engine 重启后，旧的数值 ID 可能失效，不能把缓存的 Group ID 当成稳定身份。", "subs": []}, {"title": "NVLink、NVSwitch 和 ConnectX 要按 Entity 与控制边界观测", "content": "DCGM 使用统一 Entity/Field 模型观察 GPU、NVLink Endpoint、NVSwitch 和受支持的 ConnectX Adapter，但这些对象的职责不同：\n\n| 对象 | DCGM Entity/Selector 示例 | 重点证据 | 控制边界 |\n| --- | --- | --- | --- |\n| GPU | `gpu:<id>` | UUID、Topology、聚合 Link Counter、XID | Driver 管 GPU 生命周期 |\n| MIG GI/CI | 运行时发现的实例 Entity | 父 GPU、实例 ID、支持的 Activity Field | MIG Manager/Driver 管实例布局 |\n| GPU NVLink Port | `gpu_link:<gpu-id>:<port>` | Peer、U/D/X、Traffic、Error Delta | Driver/Fabric Service 管 Link |\n| NVSwitch | `nvswitch:<switch-id>` | Inventory、Temperature、Throughput、SXid | Fabric Manager/NVLSM 配置 Fabric |\n| NVSwitch Port | `switch_link:<switch-id>:<port>` | GPU Peer、Port State、Fatal/Non-Fatal Error | DCGM 只观察不建路由 |\n| ConnectX | `cx:<id>` | Health、PCIe Active/Expected Width/Speed、Temperature | NIC Driver/Firmware/Network 管数据面 |\n\nDCGM 的数值 Entity ID 来自当前 Host Engine Inventory，不保证跨主机或重启稳定。证据包要同时保存父设备、GPU UUID、PCI BDF、Port/Link ID、Peer 和采集时间。ConnectX 不是 NVLink Port，不能用 `dcgmi nvlink` 判断其 PCIe Width 或健康。\n\n#### Link State、Counter、Health 和性能回答不同问题\n\n```bash\ndcgmi discovery --list\ndcgmi nvlink --link-status --show-entity-ids\ndcgmi nvlink --errors --gpuid <gpu-id>\ndcgmi dmon --list\n```\n\nNVLink State 常见字符应结合平台预期解释：`U` 表示支持的 Link 当前 Up，`D` 表示支持的 Link Down，`X` 表示被禁用，`_` 表示该 Port Position 不支持。下划线不是故障；Disabled 也可能是设计状态。必须与健康同 SKU 拓扑、Peer Endpoint 和 Fabric 配置比较。\n\n多数 Error Counter 是累计值。一次非零不能说明当前作业遇到错误，正确流程是在同一工作窗口前后采集相同 Entity/Field，并计算 Delta。Counter 增长能证明事件发生在窗口内，但仍不能单独给出根因；还要看 Peer、Link State、XID/SXid、Fabric Manager 日志、NCCL 选路和应用表现。\n\nHealth 是基于已配置 Watch 的被动判断，Diagnostics 是可能施加负载的主动测试，Traffic Field 是时间序列，NCCL Test 才把 GPU、拓扑和通信库组合起来。任何一个 PASS 都不能替代其余层。\n\n#### Fabric 异常按照发现、影响、隔离和恢复闭环\n\n```mermaid\nflowchart TD\n    A[Communication Alert] --> B[Discover GPU Switch And Link]\n    B --> C[Compare Link State And Counter Delta]\n    C --> D[Correlate XID SXid And Fabric Logs]\n    D --> E[Measure P2P And NCCL Impact]\n    E --> F{Fault Scope}\n    F -->|One Link| G[Restrict Affected GPU Group]\n    F -->|Fabric Domain| H[Cordon And Drain Node]\n    G --> I[Repair Or Reconfigure]\n    H --> I\n    I --> J[Validate Static State]\n    J --> K[Validate P2P NCCL And Workload]\n```\n\n一个多卡训练告警可以按以下顺序处理：\n\n1. 保存 Job/Rank、Node、GPU UUID、Topology 和当前 NCCL 首错，不先重启 Fabric Manager。\n2. 运行 Discovery 和 Link Status，确认预期 GPU、NVSwitch、ConnectX 与 Link Entity 是否完整。\n3. 对相关 GPU 和 Switch Port 保存负载前后 Counter；关联 Kernel XID、NVSwitch SXid、Fabric Manager/NVLSM 与 DCGM Health 时间戳。\n4. 用 P2P Matrix 和单节点 NCCL 对比健康基线，判断是单 Link、某 GPU Pair、某 Switch Port 还是整个 Fabric 域。\n5. 单链路退化但业务仍运行时，也要按受影响 GPU Group 限制新通信任务；Fabric Incomplete、Fatal SXid、错误持续增长或多作业失败时 Cordon/Drain。\n6. 修复后先确认 Inventory、Link State、Fabric State 和 Counter 稳定，再验证 P2P、单节点 NCCL、目标 GPU Group 和代表性训练 Step。\n\n恢复不能只以服务 `active` 或 Link `U` 为终点。静态状态恢复但 NCCL Bus Bandwidth、最慢 Rank 或真实 Step Time 未回到同 SKU 基线时，节点仍保持隔离；Counter 在观察窗口继续增长时也不能解除准入。", "subs": ["Link State、Counter、Health 和性能回答不同问题", "Fabric 异常按照发现、影响、隔离和恢复闭环"]}]}, {"title": "第 12 章 · 告警分级、抑制与关联", "sections": [{"title": "Page、Ticket 和 Trend 分别服务不同响应速度", "content": "| 级别 | 典型条件 | 预期动作 |\n|---|---|---|\n| Page | GPU Lost、Fatal XID、Uncorrectable ECC、Fabric Down | 立即隔离与响应 |\n| Ticket | Link 降级、Correctable ECC 增长、持续节流 | 工作时段诊断和维修 |\n| Trend | 利用率、能效、显存水位、碎片 | 容量和优化评审 |\n\n所有非零 Counter 都 Page 会造成告警疲劳；所有问题只做日报又会延误硬件隔离。阈值要映射业务影响、可恢复性和故障扩散风险。", "subs": []}, {"title": "告警需要时间条件和变化条件", "content": "温度短时尖峰与持续过热不同，Correctable ECC 历史累计与新增长不同。规则通常组合 `for`、窗口最大/平均和 `increase`。\n\n```promql\nmax_over_time(DCGM_FI_DEV_GPU_TEMP[5m]) > 85\n```\n\n85 仅为示例，不是所有 GPU 的阈值。实际要依据型号、厂商规范、节点进风和历史健康分布。", "subs": []}, {"title": "上游故障要抑制下游症状风暴", "content": "节点断电会同时触发 Exporter Down、GPU Missing、Pod Failure、Job Failure 和低吞吐。Alertmanager 可按 Cluster/Node 抑制下游告警，同时保留关联事件。抑制不是删除，复盘仍要看到完整时间线。\n\nGPU Operator Driver Operand Failed 时，可抑制同节点 Plugin Resource Missing 的重复 Page，但如果 Driver 恢复后 Resource 仍缺失，应让下游告警重新生效。", "subs": []}, {"title": "维护窗口用 Silence 而不是改掉规则", "content": "计划 Driver 升级会产生预期 Restart 和 Series Missing。用带 Owner、Reason、Node Pool 和到期时间的 Silence 管理；不要临时删除告警或把阈值改得极高。维护结束先验证，再主动结束 Silence。", "subs": []}]}, {"title": "第 13 章 · 统一证据包和时间线", "sections": [{"title": "第一现场先采集易失信息", "content": "重启会清空进程、Runtime 和部分日志；Reset 会改变 Counter；Pod 重建会丢失容器文件系统。处置前优先采集：时间、节点、GPU UUID/BDF、进程/Pod、`nvidia-smi -q`、Kernel Log、Operator/Driver Log、Fabric/NIC 状态、最近指标和应用首错。\n\n```bash\ndate -Ins\nnvidia-smi -L\nnvidia-smi -q\ndmesg -T | tail -500\njournalctl -k -b --no-pager | tail -500\n```\n\n命令输出可能包含 Serial、Hostname、Process 和业务信息，外发厂商前需脱敏。`dmesg` 权限受系统策略限制，不应为采集长期开放不必要权限。", "subs": []}, {"title": "所有组件必须有可对齐时钟", "content": "GPU Error、Kernel、Kubernetes Event、Application Log、Switch 和 BMC 使用不同时区或时钟漂移，会让因果顺序无法判断。平台应监控 NTP/PTP Offset，日志统一记录 UTC 或带 Offset 的时间。\n\n复盘时间线至少标记：最后正常 Step、首个性能偏离、首个硬件/网络错误、应用超时、调度动作、节点隔离、恢复操作和验证完成。", "subs": []}, {"title": "证据包要机器生成但允许人工补充", "content": "采集脚本应只读、设置超时、限制文件大小并输出 Manifest/Checksum。人工补充现象、业务影响和已做实验。脚本不能自动执行 GPU Reset、重启服务或修改网络。\n\n```yaml\nincident:\n  id: example\n  first_seen: \"2026-01-01T00:00:00Z\"\nscope:\n  cluster: example\n  node: example\n  gpu_uuid: GPU-example\nartifacts:\n  - nvidia-smi-q.txt\n  - kernel-log.txt\n  - dcgm-metrics.json\n```", "subs": []}]}, {"title": "第 14 章 · 隔离决策与恢复准入", "sections": [{"title": "隔离条件由错误严重性和复发性共同决定", "content": "立即 Cordon/Drain 的典型条件包括 GPU Lost、Fatal XID、Uncorrectable ECC、重复 PCIe AER、NVLink/NVSwitch 导致作业失败、温度或供电超安全线。单次可纠正错误可先观察，但短期增长或跨任务复发应升级隔离。\n\n若节点上有不可中断训练，是否等待 Checkpoint 要权衡数据损坏、硬件扩散和任务损失。疑似不可纠正内存或 Fabric 错误时，不应为了省计算继续运行。", "subs": []}, {"title": "Cordon、Drain、Taint 和资源屏蔽表达不同状态", "content": "Cordon 阻止新调度；Drain 驱逐可驱逐 Pod；故障 Taint 可携带原因并影响特定 Toleration；Device Plugin 标 Unhealthy 可减少可分配设备。仅某张卡坏而 Plugin 不支持细粒度屏蔽时，往往只能隔离整节点。\n\n隔离动作应写入事件系统，避免另一个自动化看到 Node 空闲后自行 Uncordon。", "subs": []}, {"title": "恢复验证按原故障路径加通用基线执行", "content": "通用项包括 Inventory、Driver/Fabric、DCGM Health/Diag、ECC/XID/AER、PCIe Width/Speed、P2P、NCCL、RDMA、Kubernetes Resource、Exporter 和 Smoke Workload。原故障是温度则增加持续压力与散热验证，是 GDR 则增加 GPU Buffer RDMA。\n\n通过后还需观察窗口，确认 Counter 不再增长、性能稳定，再移除故障 Taint 并 Uncordon。一次 `nvidia-smi` 成功不能作为恢复准入。", "subs": []}]}, {"title": "第 15 章 · 性能异常的联合观测", "sections": [{"title": "低利用率先判断需求不足还是供给中断", "content": "在线服务无请求时低利用正常；Queue 有请求但 GPU Idle，检查 Batcher、CPU、Runtime 和调度；训练 Job Running 但周期空洞，检查 DataLoader、Storage、Checkpoint 和 Rank Barrier。\n\n联合面板按同一时间轴展示 Request/Job Queue、CPU、Storage、Network、GPU Activity、NCCL 和业务吞吐。单一 GPU Dashboard 无法判断上游供给。", "subs": []}, {"title": "高利用低吞吐要识别无效忙碌", "content": "GPU Utilization 高可能是通信 Kernel、低效小 Kernel、分支发散、Memory Stall 或重试。检查 SM/Tensor/DRAM、Clock/Throttle、Top Kernel、NCCL 时间和健康基线。\n\n如果功耗/时钟正常、Tensor Active 下降且新镜像开始回归，优先看算子路径；NVLink/RDMA Counter 异常且多节点才回归，优先看通信；所有节点 Clock 低则看 Power Policy/散热。", "subs": []}, {"title": "尾延迟异常要保留单请求和同卡邻居", "content": "平均推理延迟正常但 P99 上升，可能来自长输入、Dynamic Batch 等待、KV Cache 压力、JIT/加载、共享邻居或 GC/CPU 抖动。指标需有 Input Length、Batch、Model Instance、GPU UUID 和 Queue Time 标签或 Trace 关联。\n\n高基数标签不应全部直接进入 Prometheus。Request ID、完整 Prompt 等放 Trace/Log，Metrics 保留有界 Bucket 和模型维度。", "subs": []}, {"title": "Scaling Efficiency 把多卡结果归一到单卡基线", "content": "```text\nScaling Efficiency = Throughput N GPUs / (N x Throughput 1 GPU)\n```\n\n效率下降来自通信、负载不均、Batch 不足和同步。必须固定全局/单卡 Batch 口径；Strong Scaling 和 Weak Scaling 不能混合比较。趋势突然下降比绝对值更适合触发回归调查。", "subs": []}]}, {"title": "第 16 章 · 事件复盘与知识回写", "sections": [{"title": "根因要落到可修复的系统条件", "content": "“NCCL Timeout”是症状，“网络问题”仍过于宽泛。有效根因示例是某机架 RoCE Priority Mapping 在交换机升级后不一致，导致指定 Queue 丢包和 Rank Timeout，并说明为何监控未提前发现。\n\n复盘区分触发因素、根因、放大因素和检测缺口，避免把最后执行的恢复动作误写成根因。", "subs": []}, {"title": "Runbook 每次事件后更新判断分支而非追加故事", "content": "新经验应转成可复用的症状、证据、分支、动作和恢复条件。具体事件时间线保留在 Incident 文档，Runbook 只链接代表案例，防止正文变成无法执行的历史堆叠。", "subs": []}, {"title": "故障数据进入容量和变更决策", "content": "按 GPU 型号、节点 SKU、Driver、Firmware、机架和工作负载聚合 MTBF、隔离时长、重复故障和性能偏离。若某版本显著提高 XID 或重试率，应阻止扩大升级；若某机架热节流集中，应调整散热或功率，而不只是更换 GPU。", "subs": []}]}, {"title": "第 17 章 · 节点查询、显存退化与驱动故障深挖", "sections": [{"title": "Query 模式比解析默认表格更稳定", "content": "```bash\nnvidia-smi --query-gpu=timestamp,uuid,pci.bus_id,name,driver_version,pstate,temperature.gpu,power.draw,power.limit,clocks.sm,clocks.mem,memory.used,memory.total,utilization.gpu,utilization.memory --format=csv\n```\n\n字段支持随产品和 Driver 变化，采集脚本先探测，不支持值保留 `N/A`，不能转换为 0。CSV 字段中的单位要显式保留或使用 `nounits` 后由 Schema 定义。", "subs": []}, {"title": "dmon 适合短时关联而不是长期存储", "content": "`nvidia-smi dmon` 可按秒观察 Power、Utilization、Clock、PCIe 和 ECC 等组；`pmon` 观察进程。它们适合事件现场，长期监控使用 DCGM Exporter，避免 SSH 循环采集造成管理噪声。\n\n```bash\nnvidia-smi dmon -s pucvmet -d 1 -c 60\nnvidia-smi pmon -s um -c 60\n```\n\n不同 Driver 支持的 Group 字母可能不同，先查看帮助。", "subs": []}, {"title": "`nvidia-smi -q` 是快照不是完整历史", "content": "详细查询包含 ECC、Retired Page、Row Remap、Clock、Power、PCIe、Fabric 和 Process，但只反映采集时状态及部分累计值。错误发生后立即保存，并与 Prometheus 和 Kernel Log 补全历史。", "subs": []}, {"title": "修改模式命令需要变更控制", "content": "设置 Power Limit、Persistence Mode、Compute Mode、MIG Mode、Clock Lock 和 GPU Reset 都改变节点状态。观察命令与修改命令分开到不同脚本和权限角色；默认诊断包只读。", "subs": []}, {"title": "XID 是驱动报告的错误分类入口", "content": "XID 可由应用非法访问、GPU Engine、PCIe、Memory、NVLink 或 Firmware 等触发。编号本身要查对应 Driver/GPU 代际的官方目录，不能把所有 XID 归为坏卡。\n\n证据关联：XID 编号与文本、GPU UUID/BDF、PID/Process、前后 XID、ECC/AER、Fabric/Link、应用 CUDA Error、是否跨多个 Job 复发。", "subs": []}, {"title": "应用错误和硬件错误可能形成连锁", "content": "非法 Kernel 访问可触发 XID；严重硬件 XID 又让后续 CUDA API 都返回 Context Error。首个应用错误更接近触发点，最后一串错误多是后果。日志系统保留 First Error。", "subs": []}, {"title": "Correctable ECC 看增量和集中位置", "content": "单个 Correctable Error 被 ECC 修复，不一定中断任务；短时快速增长、同一地址/Page 集中或跨任务复发提示退化。按 Volatile/Aggregate、Memory Location 和 GPU UUID 记录。\n\n判断趋势时应保存故障前基线和采样窗口，用 `increase()` 或相邻快照差值观察新增量，而不是仅看累计 Counter 是否非零。若错误只在一个 GPU 或一段显存地址集中，应与该卡的温度、负载、XID 和作业失败时间对齐；跨多个工作负载重复出现时，维护优先级高于单次应用重试。", "subs": []}, {"title": "Uncorrectable ECC 优先保护数据正确性", "content": "Uncorrectable Error 可能导致任务失败或数据损坏。立即阻止新任务，保存证据，结束受影响作业并离线诊断。不要为了完成 Checkpoint 继续使用疑似不可靠 Memory，除非厂商明确判断无数据风险。", "subs": []}, {"title": "Retired Pages 和 Row Remap 描述不同代际机制", "content": "旧机制可退休坏页，新架构可用 Row Remapping 替换故障 Row。观察 Pending/Failure/Remap Availability 与累计变化。容量接近阈值、Remap Failure 或错误持续增长时需要维修评估。", "subs": []}, {"title": "清空 ECC Counter 会破坏趋势证据", "content": "Counter Clear 只在完成证据保存和厂商流程后执行。监控用 `increase` 并识别 Reset，不通过定期清零获得“零错误”面板。", "subs": []}, {"title": "热节流先判断进风、散热路径和负载持续性", "content": "现象包括 Temperature 接近阈值、Clock 下降、Thermal Slowdown Active、风扇高转和吞吐下降。对比同机箱 GPU、进风/BMC Sensor、相邻节点和持续负载。\n\n单卡温度异常更像散热接触/风道局部问题；整机/机架同时升高更像环境或冷却容量。清理风道、检查液冷和硬件维护由数据中心流程执行。", "subs": []}, {"title": "Power Throttle 区分设备限制和机架策略", "content": "检查 Power Draw、Power Limit、Default/Max Limit、Clock 和 Throttle Reason。管理员可能为机架功率设置较低 Limit；这不是硬件故障，但必须在容量基线中声明。", "subs": []}, {"title": "Idle P-State 与负载降频不同", "content": "空闲 GPU 进入低 P-State/Clock 是节能。施加负载后未提升，才检查 Persistence、Power、Thermal、Application Parallelism 和 Driver。不要用空闲 Clock 告警。", "subs": []}, {"title": "频繁 Clock 波动要与 Kernel 和功率周期对齐", "content": "工作负载阶段变化会自然改变 Clock。只有同阶段吞吐下降且 Clock/Throttle 异常，才归因硬件策略。秒级 Power/Clock、GPU Activity 和 Step Log 放在同一时间轴。", "subs": []}, {"title": "先判断 PCIe 枚举是否还存在", "content": "`lspci` 无 NVIDIA Device 指向电源、插槽、Firmware、PCIe 或硬件；`lspci` 有而 `nvidia-smi` 无，转 Driver Binding、Module、Device Node、Fabric。两层分界避免无效重装。", "subs": []}, {"title": "Module 加载失败检查四类依赖", "content": "Kernel/Header/ABI 不匹配、Secure Boot 签名、Nouveau/其他 Driver 冲突、Module/User Library API Mismatch。保存 `modprobe` Error、Kernel Log、`modinfo`、Loaded Module 和 Package。", "subs": []}, {"title": "`nvidia-smi` 卡住比立即失败更需要超时保护", "content": "管理调用卡住可能是 Driver/GPU 无响应。采集脚本为命令设置超时，超时本身作为证据，避免监控 Worker 永久阻塞。随后隔离节点并按支持流程评估 Reset/Reboot。", "subs": []}, {"title": "多卡节点少一张要检查资源账本漂移", "content": "物理 GPU Missing 后，Device Plugin/Node Capacity 是否减少；若仍暴露旧数量，新 Pod 会 Allocate 失败。先 Cordon，再让 Plugin/Kubelet Reconcile。恢复物理卡后重新生成 CDI/GFD 和拓扑基线。", "subs": []}]}, {"title": "第 18 章 · 容器、Framework 与显存异常深挖", "sections": [{"title": "容器无 GPU 分四个观测点", "content": "1. Pod 是否请求 GPU 并分配 Node；\n2. Device Plugin Allocate/CDI 是否成功；\n3. OCI Spec/容器内 Device Node 和 Library 是否存在；\n4. 应用是否正确使用 Visible Device。\n\n每层先证实再进入下一层，避免在 Framework Error 时重装 Host Driver。", "subs": []}, {"title": "PyTorch CUDA False 检查 Build、Driver 和初始化首错", "content": "输出 `torch.__version__`、`torch.version.cuda`、`is_available`、Device Count；确认不是 CPU Wheel；用最小官方 CUDA Container 对照；检查 Dynamic Library 和 Extension。若只有某 Pod 失败，比较 RuntimeClass/Security/ENV。", "subs": []}, {"title": "Fork 后 CUDA 初始化错误属于进程模型问题", "content": "CUDA Context 与 Fork/Multiprocessing 有约束。DataLoader 或服务启动方式变化后出现初始化错误，需应用使用受支持的 Spawn/进程模型。平台提供正确容器不等于能修复错误 Fork。", "subs": []}, {"title": "容器重启循环先保留 Previous Log", "content": "```bash\nkubectl logs <pod> -c <container> --previous\nkubectl describe pod <pod>\n```\n\n反复重启会覆盖首次 CUDA Error。日志采集控制器按 Pod UID 保存 Previous 实例，且区分 Exit Code、OOMKilled、Signal 和 Liveness Kill。", "subs": []}, {"title": "OOM 先区分峰值不足、碎片、泄漏和邻居抢占", "content": "固定阶段/Shape 一开始就 OOM 多为容量不足；运行很久单调增长像泄漏；Reserved 高而失败申请不大可能碎片；共享 GPU 上突发则检查邻居。\n\n复现时固定模型版本、精度、Batch、输入长度和并发，记录首次失败的申请大小与发生阶段。将 Framework 的 Allocated、Reserved、Active/Inactive Split 和分配调用栈，与 `nvidia-smi` 的进程显存及同卡邻居放在同一时间线，才能区分应用峰值、缓存碎片和平台共享越界。", "subs": []}, {"title": "Framework Snapshot 比 nvidia-smi 总量更接近分配原因", "content": "记录 Allocated、Reserved、Active、Inactive Split、失败申请和 Stack/Operator。`empty_cache` 只释放可回收 Cache，不会释放仍被 Tensor 引用的内存，也不是通用泄漏修复。\n\n`nvidia-smi` 更适合确认进程和设备级总量，不能解释哪个 Tensor 或算子持有分配。Snapshot 应在 OOM 异常处理器或失败前周期采集，并带上 GPU UUID、Rank、请求/Job ID；没有这些关联字段，多 Pod 同时运行时容易把邻居占用误归因给当前模型。", "subs": []}, {"title": "推理 OOM 关联 Context Length 和并发", "content": "保存 Prompt/Output Length、Active Sequence、KV Cache Block、Batch、模型实例和 Workspace。平均请求短不能解释长尾一次 OOM，应按长度 Bucket 做 Admission 和容量限制。", "subs": []}, {"title": "OOM 后所有 Rank 要协调退出", "content": "一个 Rank OOM，其他 Rank 可能卡在 Collective。分布式 Launcher 应传播失败、Abort Communicator、终止完整 Job 并释放 GPU。无限等待会把故障从单卡放大为整作业资源泄漏。", "subs": []}]}, {"title": "第 19 章 · NCCL Hang 与 RDMA 异常深挖", "sections": [{"title": "Hang 先确认所有 Rank 的最后进度点", "content": "收集每 Rank 最后 Step/Collective、Call Sequence、GPU UUID/HCA 和 Stack。某 Rank 未进入 Collective，多为应用/数据/前置错误；全部进入但无进展，再查 Transport/网络。", "subs": []}, {"title": "网络 Counter 无异常不排除调用不匹配", "content": "Count/Datatype/Order 不一致会让 Rank 等待，不一定产生丢包。对比框架 Distributed Debug、Collective Trace 和 Rank Log。增大网络 Buffer/PFC 不会修复调用错误。", "subs": []}, {"title": "RDMA Retry 增长要沿发送端到接收端追踪", "content": "发送 HCA Retry、交换机 Discard/ECN/PFC、接收 HCA Error 和对端进程状态按同一时间窗关联。只换发送端 NIC 可能遗漏下游拥塞或对端退出。", "subs": []}, {"title": "多节点性能下降用规模阶梯定位首次拐点", "content": "1、2、4、8 节点固定消息/模型测试。2 节点已慢看基本 GDR/网络；跨机架后才慢看 Fabric Oversubscription/Rail；规模越大逐步下降可能是算法、Bucket 或同步长尾。", "subs": []}]}, {"title": "第 20 章 · 故障自动化与恢复准入证据", "sections": [{"title": "自动化可以采集、标记和 Cordon", "content": "低风险动作包括生成证据包、创建 Incident、添加故障 Taint、Cordon、通知 Job Owner 和运行只读 Health Query。动作幂等并记录 Automation ID。", "subs": []}, {"title": "Reset、Reboot、Drain 和硬件变更需要更高门槛", "content": "它们会中断任务或改变证据，需严重性条件、Checkpoint/业务确认、权限审批和防止多节点同时操作。自动化设置每故障域最大并发，防止同机架批量重启。", "subs": []}, {"title": "自动恢复前先验证故障原因已消失", "content": "进程重启后指标短暂正常不等于硬件恢复。自动 Uncordon 必须要求 Health、Error Delta、功能测试和观察窗口；重复事件超过次数转人工/厂商。", "subs": []}, {"title": "Runbook Dry Run 验证权限和输出而不执行破坏动作", "content": "每季度在测试节点演练证据采集、告警路由、Cordon、Checkpoint 协作和恢复审批。破坏步骤用 Simulation/Mock 或受控故障注入，确保事故时命令、权限和联系人有效。", "subs": []}, {"title": "资产和设备数量恢复", "content": "预期 GPU/NVSwitch/NIC/NVMe、UUID/Serial/BDF、Node Resource 和 CMDB 一致。更换部件更新身份，不拿旧 UUID 验证。", "subs": []}, {"title": "Driver 与 Firmware 组合恢复", "content": "Loaded Module/User Library、Firmware/FM/OFED、无 API Mismatch，重启后仍成立。只在当前 Boot 成功不够。\n\n恢复证据应同时记录 `nvidia-smi` 的 Driver、实际加载库路径、Fabric Manager/OFED 状态和节点启动日志。若使用 CUDA Compatibility Package，要确认目标进程确实加载了对应目录中的库，而不是被旧 Stub 或系统库覆盖。重启后重新执行同一组检查，排除仅在当前进程或当前 Boot 有效的假恢复。", "subs": []}, {"title": "Health 和错误计数稳定", "content": "DCGM Health/Diag、ECC/XID/AER/NVLink/SXid，负载前后 Delta 无未知增长。历史 Counter 保留，计划 Reset 标注。\n\n先保存维修前后的累计值，再在短时目标负载前后取 Delta；Counter 归零或 Exporter 重启要标注为采集边界，不能直接当成“错误消失”。Health 结果通过但关键 Field 为 `N/A` 时，状态应保持 Unknown，直到确认 Field Scope、权限和采样新鲜度。", "subs": []}, {"title": "温度、功率和时钟达到同类基线", "content": "持续负载到热稳态，无 Thermal/Power 异常，Throughput/Clock 区间与同 SKU。短空闲快照不通过。", "subs": []}, {"title": "PCIe 和 NUMA 路径恢复", "content": "Gen/Width、AER、CPU/Memory/GPU/NIC Affinity、H2D/D2H。维修/BIOS 后重建指纹。", "subs": []}, {"title": "P2P、NVLink 和 Fabric 恢复", "content": "全 Pair Capability/Bandwidth/Latency、Link/Counter、FM/NVLSM/Fabric/Partition 和单节点 NCCL。\n\n逐 GPU 对验证 P2P 可达性和带宽/延迟，并保存 `nvidia-smi topo -m`、NVLink 状态与错误计数。Scale-up 域还要确认 Fabric Manager/NVLSM 和 Partition 状态一致；单卡 `nvidia-smi` 正常不能替代多卡路径验证。", "subs": []}, {"title": "RDMA 和多节点通信恢复", "content": "Link/GID/MTU、Host/GPU Buffer RDMA、Rail、NCCL 消息矩阵和 Switch Counter。Socket 回退不算高速路径恢复。", "subs": []}, {"title": "Storage 和 Checkpoint 恢复", "content": "Dataset Read/Cache、Checkpoint Write/Commit/Load、NVMe Health 和错误。网络恢复后做 Checksum/完整性。", "subs": []}, {"title": "Kubernetes 或 Slurm 资源恢复", "content": "Plugin/GRES、Node Capacity、Label/Taint/Drain、Runtime/Container、正负向调度和资源释放。先保持隔离运行测试。\n\nKubernetes 侧核对 Device Plugin 注册的 Capacity/Allocatable、RuntimeClass/CDI、Label/Taint 和 Pod 释放后的资源回收；Slurm 侧核对 GRES、节点状态、作业分配与 epilog 清理。正向测试之外要提交一个超额请求，确认调度器拒绝而不是静默超配。通过后再由 Owner 审批解除 Cordon/Drain。", "subs": []}, {"title": "MIG、HAMi 或 vGPU 状态恢复", "content": "Profile/Layout、实例身份、Resource/账本、限制、Guest/Pod 可见和邻居干扰。物理卡正常不代表虚拟资源恢复。\n\n恢复记录应包含 MIG GI/CI 或 vGPU 实例身份、父 GPU UUID、调度资源名及账本。对 HAMi/MPS 等共享方案，用两个竞争 Pod 验证显存/算力限制和监控归属；对 vGPU 还要确认 Guest Driver、License 与 framebuffer 可见。任何越界或邻居互扰都应保持节点隔离。", "subs": []}, {"title": "业务 Smoke 与性能恢复", "content": "原故障代表模型/作业，吞吐/延迟/质量和错误。微基准通过后仍需业务层。", "subs": []}, {"title": "Telemetry 和告警恢复", "content": "Fresh Series、GPU/Pod Mapping、Alert Test、Dashboard、Maintenance Silence 清理。无监控节点不直接回生产。", "subs": []}, {"title": "观察窗口无复发", "content": "长度覆盖原错误触发周期/负载，低风险 Canary 后再关键 Queue。间歇错误使用更长窗口。", "subs": []}, {"title": "Node 状态和事件闭环", "content": "Acceptance Run ID、Incident/RMA、Repair、CMDB、Taint/Drain 和 Owner 审批互链。关闭告警不自动关闭事件。\n\n关闭前确认节点状态、隔离标记和调度账本已经回到预期，证据包链接到 Incident/RMA 和维修记录，并由明确 Owner 认可观察窗口结果。若仍存在未解释的事件、Telemetry Unknown 或资源漂移，只能结束当前处理动作，不能把节点标记为生产就绪。", "subs": []}]}, {"title": "第 21 章 · DCGM Host Engine 的 systemd 生命周期", "sections": [{"title": "交互式 Shell 环境不会修改 systemd 已启动的 Host Engine", "content": "典型安装由 `nvidia-dcgm.service` 启动前台 `nv-hostengine`。服务进程的环境、用户、启动参数和重启策略由 systemd 在进程创建时提供；管理员之后在 Shell 中 `export` 变量，不会改变已经运行的 Host Engine。需要从启动生效的诊断变量或参数应写入 Unit Drop-In，并通过重启创建新进程。\n\n```bash\nsystemctl cat nvidia-dcgm.service\nsystemctl show nvidia-dcgm.service \\\n  --property=FragmentPath \\\n  --property=DropInPaths \\\n  --property=ExecStart \\\n  --property=Environment\n```\n\nVendor Unit、`/run` 生成的 Drop-In 和 `/etc` 管理员 Drop-In 会按 systemd 规则合并。完整复制 Vendor Unit 会失去后续默认更新，直接编辑 `/usr/lib` 会被包升级覆盖，编辑 `/run` 会在重启后丢失；少量站点配置优先使用 `/etc/systemd/system/nvidia-dcgm.service.d/*.conf`。", "subs": []}, {"title": "daemon-reload、restart 和 enable 解决不同问题", "content": "`daemon-reload` 只让 systemd 重新读取配置，不改变运行中进程及其环境；`restart` 会断开客户端并创建新 Host Engine；`enable` 只控制以后开机是否拉起服务。变更验证顺序是检查有效 Unit、Reload、在维护窗口 Restart，再发出实际 DCGM 请求确认服务就绪。\n\nHost Engine Restart 会丢失进程内 Group、Field Group、Watch、Retained Sample、Job、Health/Policy 和 Module State。执行前要识别长期消费者，重启后由 Exporter/Agent/平台控制器重建 Watch 与配置，并确认指标重新产生。不能只看 `active (running)` 就判定 DCGM 监控恢复。", "subs": []}, {"title": "ExecStart 和服务身份变更必须保留监督与最小权限语义", "content": "Drop-In 替换 `ExecStart=` 时需要先用空值清除原列表，再写完整命令。`nv-hostengine -n` 使真实服务保持前台供 systemd 监督；移除后可能让子进程脱离既有生命周期。Unit 的 `User=root` 决定 Host Engine 身份，而 `--service-account` 控制受支持诊断子进程身份，两者不能互相替代。\n\n服务加固要以诊断功能回归为条件。目录 Traversal、可执行文件、日志路径、临时目录、GPU Device 和网络 Listener 权限任何一项收紧都可能让部分诊断静默失败。变更后保存 `systemctl show`、Journal、DCGM 请求、Exporter Freshness 和代表性 Diagnostic 结果。", "subs": []}, {"title": "CUDA Error Log 用于进程内首错而不是节点健康结论", "content": "新 CUDA Driver API 可注册 Error Log Callback，按组件和级别接收更接近错误发生位置的消息。应用应把它与 Request/Rank/Device UUID/Stream 和时间戳关联，并限制敏感路径或用户数据进入日志。该能力有版本与回调线程约束，回调实现不能阻塞或再次制造故障。\n\nError Log 说明进程观察到什么，不证明物理 GPU 健康；XID、ECC、AER、DCGM Health 和其他租户影响仍需独立采集。反过来，节点指标正常也不能排除错误的 Stream 顺序、非法指针和 API 兼容问题。", "subs": []}]}, {"title": "第 22 章 · GPU 服务器硬件与资产配置基线", "sections": [{"title": "GPU 节点是多个可独立故障组件的组合", "content": "一台节点包含 GPU/SXM Baseboard、NVSwitch、CPU、Memory、PCIe Switch/Retimer、NIC/DPU、NVMe、PSU、Fan/Liquid Loop、BMC 和 Mainboard。`nvidia-smi` 只覆盖其中一部分。\n\n这些部件共享供电、散热、PCIe 或 NVLink 路径，一个部件的异常可能以另一个部件的告警呈现。值班检查应先建立节点级拓扑和故障域，再把 GPU 指标与 BMC SEL、主机日志、网络端口和电源事件对齐；只看 GPU Utilization 或温度无法判断整机是否可安全调度。", "subs": []}, {"title": "PCIe GPU 与 HGX/SXM 的维修单元不同", "content": "PCIe 卡通常按 Add-in Card/Slot/Riser 维修；HGX/SXM GPU 与 NVSwitch 位于 Baseboard，拆装、Torque、冷板和 Firmware 依赖 OEM 流程。Runbook 不把 PCIe 重插经验套到 SXM。\n\nPCIe 设备可在厂商许可下通过换槽或换卡做因果验证，而 SXM/HGX 的 GPU、冷板和 NVSwitch 往往是成套维修单元。维修记录必须保留原始槽位、序列号、扭矩和散热操作，避免把一次结构性拆装误当成普通热插拔。", "subs": []}, {"title": "Retimer、Riser 和 Cable 也是链路故障点", "content": "GPU/NIC 本体健康，PCIe Width 降级或 AER 增长可能来自 Riser/Retimer/Connector。资产系统记录槽位与路径，交叉换卡/换槽由维修团队执行并保存结果。\n\n链路故障的证据通常表现为协商速率下降、重试或上游多个 Endpoint 同时异常。先采集 `lspci -vv`、AER 计数和 BMC 事件，再在维护窗口做单变量 swap；未经授权拔插可能破坏保修或造成新的接触问题。", "subs": []}, {"title": "FRU 与 CRU 决定谁能更换", "content": "Customer Replaceable Unit 可由现场按手册更换，Field Replaceable 可能需厂商工程师。合同、备件和 Runbook 标明部件等级，避免无授权拆机影响保修。\n\nFRU/CRU 还决定停机窗口、备件形态和验收范围。工单中记录授权人、部件序列号、拆装前后照片以及回退方式，任何无法确认等级的操作先升级给 OEM，而不是用“重插”作为默认修复。", "subs": []}, {"title": "Serial、UUID、BDF 和槽位共同标识 GPU", "content": "UUID 用于软件/监控，Serial 用于保修，BDF 用于本次拓扑，槽位/Baseboard Position 用于现场。更换 GPU 后 UUID/Serial 变化，BDF 可能不变；CMDB 记录历史关系。\n\n调度和告警尽量使用 UUID 或 PCI Bus ID，不能依赖重启后可能变化的枚举序号。资产系统应保存设备生命周期关系，使旧 UUID 的历史告警仍能追溯到更换后的节点和工单。", "subs": []}, {"title": "NIC GUID、MAC、BDF 和交换机端口关联", "content": "RDMA 故障必须从 HCA Port/GUID 映射 Netdev、BDF、Cable 和 Switch Port。自动 LLDP/Inventory 与布线表对账，发现错接 Rail。\n\n映射完成后才能判断是单端口、单条线缆还是整条 Rail 故障。变更后重新抓取 GUID、MAC、PCIe 树和交换机邻居，避免继续沿用旧布线表排查 NCCL 或 RoCE 问题。", "subs": []}, {"title": "BOM Baseline 包含部件 Revision", "content": "同 SKU 可能使用不同 Memory/NVMe/PSU/NIC Revision。记录 Vendor/Model/Firmware，性能异常按批次聚合。采购允许替代料时，预先定义兼容与重验。\n\nBOM 基线还应包含容量、接口速率、散热件和可替代料关系。把离群错误按 Revision 聚合，常能发现共同固件或供应批次问题；没有 Revision 字段时，批量回滚和 RMA 都缺少证据。", "subs": []}, {"title": "配置快照在变更前后生成 Diff", "content": "BIOS/BMC/Firmware、PCIe Tree、GPU/NIC、Driver、FM、OFED 和 OS Package 结构化保存。Diff 变化触发对应测试，不把所有变化都归为硬件坏。\n\n快照应在变更前、重启后和验收后各保存一次，并带时间、节点身份和操作人。对比时区分预期变更与意外漂移，只有能与错误时间线对应的差异才进入故障假设。", "subs": []}]}, {"title": "第 23 章 · Firmware、BIOS 与主机 RAS", "sections": [{"title": "Server Firmware 不只是 BIOS", "content": "包含 BIOS/UEFI、BMC、CPLD、GPU VBIOS/GSP、NVSwitch、PCIe Switch/Retimer、NIC/DPU、NVMe、PSU/CDU。OEM Bundle 往往验证组合，单独升级一个部件可能脱离支持矩阵。\n\n固件升级计划应以整机 Bundle、OEM 支持矩阵和回滚介质为边界，而非只看某个版本号。升级前冻结当前版本和配置，升级后检查设备枚举、传感器、链路训练及代表性业务路径。", "subs": []}, {"title": "GPU Firmware 与 Driver 协同初始化", "content": "Driver 加载时与 GPU Firmware/GSP 交互，版本不匹配或更新失败可表现为 XID、设备初始化失败。日志保存 Firmware Version、Driver Branch 和首次 NVRM Error。\n\n初始化失败可能发生在模块加载、Fabric 建立或首个 CUDA Context 创建阶段。按时间顺序保存 dmesg、BMC SEL、`nvidia-smi -q` 和服务日志，先确认组合版本，再决定重载驱动、重启还是转硬件诊断。", "subs": []}, {"title": "NIC Firmware 与 OFED/NCCL Plugin 配套", "content": "Firmware 改变 Link、RoCE Congestion、SR-IOV 和 GDR 能力。升级后回归 Link/Port Counter、Host/GPU RDMA、Multi-Rail NCCL 和 VF。\n\nNIC 固件变更不能只用链路 Up 作为通过条件；拥塞控制、虚拟功能和 GPU Direct 可能在高负载或多 Rail 才暴露问题。测试应覆盖单端口、双向流量、错误计数增量以及实际通信库路径。", "subs": []}, {"title": "Firmware Bundle 升级要有电源和时间预算", "content": "某些部件需 Cold Power Cycle，更新中断电会损坏。维护计划确认双电源/BMC、升级时长、不可取消阶段、恢复介质和厂商支持。\n\n执行前 Drain 节点并确认冗余电源、远程控制和带外通道可用。升级脚本输出、阶段时间和失败点必须留档；遇到不可取消阶段不得强制断电，按 OEM 恢复流程处理。", "subs": []}, {"title": "Downgrade 不一定被支持", "content": "安全 Fuse、Schema 或依赖可能阻止降级。变更前明确 Rollback 是 Firmware Downgrade、切备件还是恢复旧 Image；不能把“保留旧包”当完整回滚。\n\n真正的回滚还要验证配置格式、密钥和邻接组件是否兼容。若只能更换已验证的备件或恢复整机镜像，应在变更单中明确 RTO、数据保留和升级失败后的停止条件。", "subs": []}, {"title": "CPU Machine Check 可能连带 GPU I/O", "content": "PCIe Root/Memory Controller 错误会使 GPU/NIC 异常。检查 MCE/APEI/EDAC、BMC SEL 和 Socket，避免看到 GPU XID 就只换 GPU。\n\n先按时间线判断是 CPU/Root Port 先报错还是 GPU 先失联，再定位同一 Socket、Root Port 下的设备。若多个 Endpoint 同时受影响，应优先隔离主板、供电或 PCIe 交换路径，而不是逐卡更换。", "subs": []}, {"title": "Host Memory ECC 影响 DataLoader 和 DMA Buffer", "content": "Correctable/Uncorrectable DIMM Error、Page Offline 和 NUMA 容量变化会影响训练。节点健康统一纳入 CPU/Memory RAS，不让 GPU Monitor 成为唯一告警源。\n\nCorrectable 错误的持续增长也是预警信号，不能因为任务暂时成功就忽略。检查 EDAC、内核 Page Offline 和 NUMA 可用容量，并在调度标签中反映降级，避免高内存带宽任务落到异常节点。", "subs": []}, {"title": "Power Profile、C-State 和 NUMA 需要验证", "content": "Latency/Performance Profile 可改善 CPU Feed/Network Progress，但提高 Power。使用 OEM HPC/Performance Baseline，在真实任务比较；不盲目全关节能。\n\n基线至少包含 CPU 频率、DataLoader 等待、RDMA 进度、功耗和温度。切换 Profile 后做同一 workload 的 A/B 测试，确认收益来自供给改善而非更高的热 throttling 或功耗超限。", "subs": []}, {"title": "Memory Channel 不均会降低本地带宽", "content": "DIMM 缺失/布局错误导致 Channel 不满，CPU-GPU 数据供给下降。到货验收检查容量、Channel Population、NUMA Bandwidth 和 Correctable Error。\n\n容量相同不代表带宽相同，未按 OEM 通道布局安装会让内存交错失效。验收把 DIMM 槽位、每 Socket 容量和实测带宽写入节点基线，后续换条内存也要重新验证。", "subs": []}]}, {"title": "第 24 章 · GPU、PCIe 与互连 RAS", "sections": [{"title": "ECC 检测并纠正显存位错误", "content": "Correctable Error 被修正并计数，Uncorrectable 可能影响数据/Context。Volatile 自启动/Reset，Aggregate 长期累计，语义随产品确认。\n\n排障时同时记录 Volatile 与 Aggregate，避免把重启清零误判为故障消失。对持续增长、不可纠正错误或伴随 XID 的设备执行隔离和厂商规定的诊断，不在生产随意清除累计计数。", "subs": []}, {"title": "Page Retirement 和 Row Remapping 延长可用寿命", "content": "检测问题位置后从可用空间映射出去。Pending 可能需 Reset/Reboot 才生效；Remap Spare 接近耗尽或 Failure 时安排更换。\n\nPage Retirement 保护的是后续分配，不会修复已经产生的错误数据。记录 retired page 数量、pending 状态和 remap spare 趋势，结合负载后复发情况决定观察、重启还是 RMA。", "subs": []}, {"title": "XID 把硬件和软件错误报告到 Kernel Log", "content": "分类只作为入口，结合 PID、Engine、ECC、PCIe/NVLink 和复发判断。维护当前 Driver 对应 XID Catalog，自动化映射 Severity 但允许人工覆盖。\n\n同一 XID 在不同驱动和拓扑下可能对应不同故障域。告警事件保留首次时间、进程、GPU UUID、链路计数和节点状态；自动化只负责聚合和升级，最终维修结论必须有交叉证据。", "subs": []}, {"title": "InfoROM 保存板卡信息和部分状态", "content": "InfoROM 校验/读取错误可能影响管理信息。健康检查发现异常时保存 `nvidia-smi -q` 和 Driver Log，由厂商判断 Firmware/Hardware 处理。\n\nInfoROM 异常会让序列号、板卡信息或校准字段不可读，进而影响资产关联。不要直接写入或清除内容；先保存原始输出、设备身份和固件组合，再按 OEM 工具和授权流程处理。", "subs": []}, {"title": "GPU Reset 能力受拓扑和活跃 Context 限制", "content": "NVLink/NVSwitch Group、MIG/vGPU 和 Fabric 可能要求一组设备共同 Reset 或不支持在线 Reset。必须 Drain、保存证据，按产品文档执行；失败转 Reboot/Power Cycle。\n\nReset 前确认没有活跃 Context、监控进程或其他依赖该 Fabric 的作业，并记录受影响 GPU 集合。Reset 后重新检查枚举、Fabric 状态、ECC/XID 增量和 P2P，再决定是否恢复调度。", "subs": []}, {"title": "Link Training 在启动和恢复时协商参数", "content": "Gen/Width 协商失败可降级或设备缺失。BMC/BIOS/Kernel Log、`lspci` 和 Load Test 共同判断。一次重启恢复也要追踪是否复发。\n\n冷启动、热重启和压力负载可能得到不同协商结果，因此要比较多个时间点的速率和宽度。降级链路即使没有立即报错，也会降低 H2D、P2P 或 RDMA 供给，应纳入容量和调度标签。", "subs": []}, {"title": "AER Root Port 指向上游故障域", "content": "错误日志含 Requester ID/Severity/Layer。映射 BDF 树，看 Endpoint、Switch、Root。多个下游同时报错更可能上游/供电，不逐卡独立维修。\n\n把 AER 事件按 Root Port、时间窗口和受影响设备聚合，区分 Correctable、Non-Fatal 和 Fatal。只有在上游路径稳定且故障随设备移动时，才把维修范围收窄到 Endpoint 卡本身。", "subs": []}, {"title": "NVLink 错误按 Link ID 和 Remote Endpoint 追踪", "content": "保存两端 GPU UUID、Link ID、State/Counter 和 NVSwitch Port。单向/双向 Counter 语义核对版本；负载前后 Delta 定位。\n\n计数器应在负载前后取快照并保留采样间隔，避免把历史累计值当成当前故障。将 Link ID 映射到物理端口和远端 UUID 后，再决定屏蔽单链路、隔离 GPU 还是停止整个 Fabric Group。", "subs": []}, {"title": "NVSwitch SXid 是 Fabric 级事件", "content": "关联 Switch Physical ID、Port、FM/NVLSM Log 和所有受影响 GPU。Fabric Incomplete 时停止新多卡 Job，不能只屏蔽一个表面报错 GPU。\n\nSXid 通常代表 Fabric 级初始化或运行时事件，影响范围可能超过单个 Endpoint。先保存 FM、NVLSM、BMC 和所有 GPU 状态，确认 Fabric 恢复并通过多卡通信测试后再解除调度隔离。", "subs": []}]}, {"title": "第 25 章 · DCGM Diagnostics、Burn-in 与维修决策", "sections": [{"title": "部署测试先验证软件环境", "content": "Driver Library、Device、权限和基本 API 不通过，不进入压力测试。失败节点保留 Log，防止 Burn-in 输出覆盖首错。\n\n部署测试先回答“工具能否正确访问设备”，而不是证明硬件性能。记录驱动、权限、容器和设备节点信息；初始化失败时保留首个错误并转软件环境或设备枚举排查。", "subs": []}, {"title": "Memory Test 覆盖分配、读写和错误检测", "content": "使用受支持 DCGM/厂商工具，不在生产自行编写破坏性 Pattern。测试期间记录 ECC/XID、温度、功耗和失败地址/阶段。\n\n内存测试应在隔离节点运行，并明确测试占用显存、持续时间和停止条件。把错误发生的 GPU、地址区间和温度阶段与测试日志关联，避免只保留最终 PASS/FAIL。", "subs": []}, {"title": "Compute Stress 验证持续时钟和数值", "content": "满载持续到热稳态，比较 Expected Throughput/Clock，检查错误。单纯让 GPU Utilization 100% 但不校验结果，无法发现 Silent Error。\n\n计算压力测试同时验证数值结果、时钟稳定性、功耗和温度趋势。若吞吐随热稳态下降，应区分正常功耗管理与异常降频，并把同 SKU 健康节点作为对照。", "subs": []}, {"title": "PCIe/NVLink Test 覆盖传输与错误增量", "content": "所有 Pair/Link 矩阵，负载前后 AER/NVLink Counter。多卡 Collective 补充真实并发路径。\n\n单向带宽测试可能遗漏反向拥塞或共享交换路径，验收应覆盖方向、Pair 和并发组合。测试前后保存链路宽度、错误计数和拓扑快照，失败时才能判断是链路还是上游 Fabric。", "subs": []}, {"title": "Burn-in 时间和阈值来自节点 SKU", "content": "新机、维修后、批量 Firmware 变更使用不同 Duration。阈值来自同批健康分布/OEM，记录环境温度和机架负载。\n\nBurn-in 方案应写明预热、稳态、冷却和重启后的阶段，不能把任意跑满几分钟当作寿命证明。阈值与 SKU、散热条件和厂商保修要求绑定，批量离群节点先隔离再放行。", "subs": []}, {"title": "Transient、Intermittent 和 Persistent 证据不同", "content": "Transient 单次且无法复现，保留观察；Intermittent 跨负载/时间复发，需扩大监控和换件定位；Persistent 每次测试失败，立即隔离维修。\n\n分类依据应包含复现次数、负载类型、温度和时间间隔，而不是只看告警级别。Transient 也要设观察期限；Intermittent 需要保存原始计数器，Persistent 则优先保护数据和容量。", "subs": []}, {"title": "Swap Test 一次只交换一个部件", "content": "PCIe 卡可在厂商允许时换槽/换节点：故障随卡走指向卡，留在槽位指向 Riser/Board。多组件同时换会失去因果；SXM/HGX 由 OEM 执行。\n\n每次 Swap 前冻结软件和负载条件，交换后只改变一个变量并重复同一诊断。记录旧槽、新槽、序列号和测试结果，确保维修结论可复核且不把接触问题误判为卡故障。", "subs": []}, {"title": "No Fault Found 不等于事件无效", "content": "维修时测试通过但生产有完整 XID/Counter/Job 证据，仍保留 Case 和观察。提高采样、复现特定热/通信负载，统计重复事件。\n\nNFF 说明故障具有条件性，不说明原始事件不存在。将生产证据与维修环境差异列出，安排带有目标温度、通信拓扑或长时运行的复测，并设置明确的重新升级阈值。", "subs": []}, {"title": "RMA 包含可重放证据", "content": "Serial、UUID、Node/BDF/Slot、Firmware/Driver、错误时间、XID/ECC/AER、DCGM Diag、复现步骤、维修历史和脱敏日志。避免只写“GPU 不稳定”。\n\nRMA 包应能让第三方按相同环境重放问题，并清楚区分观察事实与推断。日志保留采集命令、时间基准和脱敏范围，避免厂商拿到无法定位上下文的孤立片段。", "subs": []}, {"title": "更换后重建资产和基线", "content": "更新 Serial/UUID、Firmware，检查 Topology、MIG/Fabric、DCGM、P2P/NCCL/RDMA 和 Burn-in。旧 UUID 告警/配额/CMDB 关闭并保留历史链接。\n\n更换后的验收先验证身份和枚举，再验证链路、诊断和业务路径。只有观察窗口内无复发且性能回到同 SKU 基线，才解除 Drain；旧设备的历史记录仍保留用于重复故障分析。", "subs": []}]}, {"title": "第 26 章 · 备件、保修与硬件生命周期", "sections": [{"title": "备件按故障率、交期和故障域规划", "content": "GPU/Baseboard/NIC/PSU/NVMe/Cable 价值和更换时间不同。关键部件现场 Spare，昂贵 Baseboard 依赖厂商 SLA；数量用 Fleet Size、MTBF、Lead Time 和并发故障估算。\n\n备件模型应按故障域和共享依赖计算，而不是只按 GPU 数量乘比例。把交期、保修覆盖、替代料兼容性和同时故障情景纳入容量模拟，并定期用实际维修率校准。", "subs": []}, {"title": "Spare Node 比散件更快恢复业务", "content": "长训练可迁到完整 Spare Node，坏节点离线维修；成本高但缩短 RTO。Spare 定期上线更新/测试，防止需要时软件/硬件过期。\n\nSpare Node 必须与生产镜像、驱动、固件和网络配置保持可用状态，并定期执行轻量 Burn-in。迁移 Runbook 明确 Checkpoint、数据可达性、租户通知和回迁条件，避免备用节点成为新的单点。", "subs": []}, {"title": "保修范围和人为操作边界写入 Runbook", "content": "未授权 Firmware、拆机、散热改造可能影响保修。变更审批核对 OEM 指南，现场照片/操作人/部件保存。\n\nRunbook 还要规定防静电、断电确认、扭矩工具和旧件返还要求。任何超出 CRU 范围的动作由授权工程师执行，并在工单中保留批准和保修影响评估。", "subs": []}, {"title": "维修队列按业务风险排序", "content": "Fatal/数据风险、高复发、完整节点损失优先；可降级 Link 但已限制调度可排计划窗口。Dashboard 显示隔离 GPU、等待备件和容量影响。\n\n排序同时考虑受影响队列、Checkpoint 恢复时间和替代容量。把“可运行但性能降级”与“不可安全运行”分开，避免只按告警数量决定维修先后。", "subs": []}, {"title": "选型阶段验证支持而非只看规格", "content": "目标 Framework/Driver/OS、Server/NIC/Storage、Power/Cooling 和 Serviceability。POC 使用生产候选完整节点，而非实验室不同形态卡。\n\n选型评审把支持矩阵、备件交期、远程维护和机房功耗作为一等约束。POC 应使用目标并行规模、数据路径和故障演练验证可运维性，不能只用单卡峰值规格决策。", "subs": []}, {"title": "到货阶段执行 Inventory 与 Burn-in", "content": "逐台对 BOM、Firmware、外观、传感器、拓扑、健康和性能。同批离群先隔离，未通过节点不进入生产池。\n\n到货验收为每台设备生成可追溯基线，包含 UUID、Serial、BDF、固件组合、链路宽度和诊断原始证据。发现同批离群时先冻结该批次放量，再由供应商和平台团队共同复核。", "subs": []}, {"title": "运营阶段做趋势与预防性维护", "content": "ECC/Remap/AER、Temperature/Fan、NVMe Wear、Power 和维修率按 Fleet 聚合。趋势触发清洁、散热、Firmware 或计划更换。\n\n趋势分析应按 SKU、机架、固件和环境分层，避免把机房温度差异误判为部件老化。预防性维护动作要有阈值、责任人和复测结果，形成闭环而非只发告警。", "subs": []}, {"title": "EOL 阶段处理软件支持和容量迁移", "content": "Driver/Framework 删除旧 Compute Capability 前迁移 Workload；逐步停止新租户，导出数据/模型，安全擦除和资产处置。\n\n迁移计划列出兼容性、Checkpoint 格式、性能差异和租户截止时间。停止调度后仍保留只读验证窗口，确认模型、日志和资产数据已完成迁移，再执行擦除和报废流程。", "subs": []}, {"title": "数据擦除覆盖 Host Disk 与设备状态", "content": "NVMe/Boot Disk 使用组织标准擦除；GPU/vGPU/MIG Memory 在断电/Reset 生命周期下按厂商保证处理；BMC Credential、License 和 CMDB Identity 撤销。\n\n擦除证据包括设备序列号、工具版本、时间和结果，失败时不得把设备直接交付或报废。带外账号、密钥、租户授权和监控令牌在资产退役前统一吊销并保留审计记录。", "subs": []}]}, {"title": "第 27 章 · Fleet 指标、硬件变更与验收门禁", "sections": [{"title": "健康覆盖率是第一项 Fleet SLI", "content": "```text\nTelemetry Coverage = GPUs with fresh valid health data / Expected GPUs\n```\n\n没有数据的 GPU 单独 Unknown，不能算 Healthy。按 Node Pool/Driver/Exporter 观察缺口。\n\n覆盖率计算要区分设备存在、采集成功和数据新鲜度，并按节点池、驱动和 Exporter 版本切片。Unknown 设备应从可调度容量中扣除或触发补采集，避免静默扩大风险。", "subs": []}, {"title": "故障率按 GPU Hour 归一化", "content": "```text\nIncident Rate = Qualifying Incidents / GPU Operating Hours\n```\n\n不同 Fleet 规模可比较。定义 Qualifying Event、合并重复告警，区分用户 Kernel Error 和硬件事件。\n\n事件分母使用实际运行 GPU Hours，分子按一次故障影响的设备和时间窗口去重。指标旁边保留事件分类与排除规则，防止驱动升级产生的重复告警扭曲趋势。", "subs": []}, {"title": "MTTR 拆分检测、隔离、诊断、等待备件和恢复", "content": "总 MTTR 高可能不是维修慢，而是无备件或恢复验收排队。分阶段优化，不能只要求 On-Call 更快。\n\n把 Detect、Isolate、Diagnose、Spare Wait、Repair 和 Validate 分成时间桶，分别设目标。阶段数据能揭示真正瓶颈，例如证据采集慢、厂商响应慢或验收队列积压。", "subs": []}, {"title": "Repeat Failure 关联节点、槽位和部件", "content": "新 GPU 在同槽位复发指向系统路径，同一 GPU 跨槽复发指向卡。CMDB 历史关系使统计可用。\n\n重复故障分析至少关联节点、槽位、Riser、固件批次和维修动作。只有保留更换前后的身份关系，才能区分“坏卡反复回来”和“同一槽位持续损坏”。", "subs": []}, {"title": "性能离群也是硬件运营信号", "content": "无错误但持续低 Clock/PCIe/NCCL 的节点按同 SKU 分布检测。排除背景负载/配置后，进入预防维修。\n\n性能离群先与同 SKU、同 workload 和同功耗条件比较，再检查降频原因、链路宽度和 CPU 供给。无错误不等于健康，持续离群应降低调度优先级并安排复测。", "subs": []}, {"title": "BIOS/Firmware 变更映射重测范围", "content": "PCIe/CPU/Power 相关重测 Topology/H2D/P2P/Power；GPU/NVSwitch 重测 Fabric/NCCL；NIC 重测 RDMA/RoCE；BMC 重测 Sensor/Power Control。\n\n重测范围按变更影响图确定，并保留未变更的对照节点。每项测试记录版本、阈值、原始输出和通过时间，避免“命令跑过”被误认为链路和业务都已验收。", "subs": []}, {"title": "维修后测试强度按部件扩大", "content": "换 GPU 测单卡+所有相关 Link；换 Baseboard 测整节点；换 NIC 测所有 Port/Rail；换 PSU/冷却测持续满载。关联路径而非固定一套最小测试。\n\n测试组合应覆盖更换部件的直接功能和共享依赖，尤其是供电、散热、Fabric 与 NUMA 路径。失败时保留首次失败证据并停止扩大负载，防止维修动作制造二次损伤。", "subs": []}, {"title": "Canary 代表所有硬件 Revision", "content": "同 SKU 有不同 Revision/Firmware 时，每组至少一个 Canary。只测最新批次无法代表旧 Fleet。\n\nCanary 分层依据应包括硬件 Revision、固件 Bundle、驱动分支和机架环境。任何一层组合没有代表样本，都不能把 Canary 结果推广到整批节点。", "subs": []}, {"title": "通过后保留观察窗口", "content": "恢复节点先进入低风险/Canary Queue，观察错误和性能，再进入关键大训练。窗口长度按错误间歇性和业务风险。\n\n观察窗口内持续采集 XID、ECC、AER、温度、功耗和业务吞吐，并设置自动回退条件。间歇性故障需要覆盖其历史复发周期，不能只凭一次短测解除隔离。", "subs": []}, {"title": "变更报告更新可调度能力", "content": "若节点只能 Degraded 运行，更新 GPU Group、Fabric Tier、Power/性能基线和 Admission。不要让文档知道降级而 Scheduler 仍按完整能力分配。\n\n变更报告应同步 CMDB、监控、调度标签和租户可见容量。降级节点可承载的 workload、并行规模和 SLO 要明确，避免调度器把不可满足的任务继续放入。", "subs": []}]}, {"title": "第 28 章 · 维修工单与命令安全分级", "sections": [{"title": "现象使用可观察事实", "content": "时间、业务影响、GPU UUID/BDF/Slot、XID/ECC/AER/Link、性能差异和复发次数，不只写“卡坏了”。\n\n现象字段应能让未参与当班的人复原故障窗口：何时开始、影响哪些 Job、哪些设备仍正常、错误是否持续。把观察事实与初步判断分栏，避免标题先把责任归给 GPU。", "subs": []}, {"title": "环境记录完整版本组合", "content": "Node SKU/BOM、BIOS/BMC/Firmware、OS/Kernel/Driver/FM/OFED、Power/Cooling 和最近变更。\n\n版本组合要带采集时间和镜像 Digest，硬件则带 Revision 与拓扑位置。最近变更按时间排序，便于把首次异常与固件、驱动或布线操作关联起来。", "subs": []}, {"title": "首次证据不可覆盖", "content": "Kernel/BMC/FM/DCGM/应用日志、Counter Before Reset、图片/布线；后续操作单独追加时间线。\n\n首次证据应只读归档并计算校验值，任何裁剪或脱敏都记录规则。Reset、重启和换件前先抓快照，避免最有价值的故障状态被后续操作覆盖。", "subs": []}, {"title": "复现条件可重放", "content": "工具/镜像 Digest、命令、负载、持续时间、温度/功耗、GPU Pair/Rank；敏感数据用等价最小负载。\n\n复现记录还应说明节点放置、CPU Affinity、网络 Rail 和随机种子。将生产数据替换为最小等价负载时，验证其仍触发同一错误类别，不要为了脱敏改变故障条件。", "subs": []}, {"title": "已做操作和结果逐项列出", "content": "重启/Reset/换槽/换件/Firmware/对照，每次前后结果；避免重复高风险操作。\n\n每一步写明执行人、开始结束时间、预期、实际结果和下一步条件。对于可能扩大影响的动作设最大尝试次数，连续失败后转交更高等级或 OEM，而不是无记录反复重试。", "subs": []}, {"title": "故障归属假设与反证", "content": "GPU、Slot/Riser、Baseboard、Power/Cooling、Driver/应用候选，哪些证据支持/排除，未确定项明确。\n\n故障树用可验证证据逐项收敛：例如错误是否随卡移动、上游是否同时报错、换镜像后是否消失。未确定项保留待验证动作和负责人，不把概率最高的假设写成结论。", "subs": []}, {"title": "业务隔离和容量影响", "content": "节点 Drain/Taint、不可用 GPU/Group、受影响 Queue/SLO、临时降级和预计维修时间。\n\n容量影响要换算为可运行的 GPU 数、并行组缺口和预计排队时间，并同步调度器标签。业务隔离动作先于硬件操作，避免维修过程中仍有 Job 持有 Context 或写入设备。", "subs": []}, {"title": "备件和保修状态", "content": "Serial/Entitlement、FRU/CRU、现场 Spar
