e、RMA Case/ETA、允许操作和厂商联系人。\n\n备件状态应区分可立即使用、待测试、运输中和保修争议。工单给出 ETA 和替代路径，防止现场人员在没有授权或没有回退件时开始拆装。", "subs": []}, {"title": "修复动作有审批与停止条件", "content": "断电/拆机/Firmware/Reset、负责人、窗口、最大影响、失败回退。未 Drain 不执行。\n\n停止条件包括带外失联、温度或功耗异常、首个测试失败以及影响范围超出批准值。执行前核对 Drain、备份和远程控制，执行后按预定顺序恢复服务并回填证据。", "subs": []}, {"title": "更换部件更新身份", "content": "旧新 Serial/UUID/Firmware/Slot、CMDB/监控/License/资源映射和资产流转。\n\n身份更新必须原子完成，避免新卡已上线但监控仍绑定旧 UUID，或旧许可证继续占用。保留旧新关系、安装时间和工单号，便于后续计算部件寿命与重复率。", "subs": []}, {"title": "验收引用测试 Run", "content": "Inventory/DCGM/Burn-in/Topology/P2P/NCCL/RDMA/业务、结果/阈值/原始证据和观察窗口。\n\n验收引用具体 Test Run、版本和原始日志路径，而不是只写“测试通过”。对未执行项目注明原因与风险，观察窗口未结束时状态保持 Conditional，不提前关闭工单。", "subs": []}, {"title": "关闭条件包含无复发", "content": "恢复调度时间、Canary/关键业务、Counter/性能趋势；间歇故障未覆盖触发周期只做条件关闭。\n\n关闭条件还应包含资产、监控、调度和租户通知均已更新。若仍存在未覆盖的复发窗口，工单标记为观察中并设置复查日期，避免短期稳定被误报为永久修复。", "subs": []}, {"title": "只读查询默认可用于第一现场", "content": "Inventory、状态、日志和 Counter 查询不改变设备配置，但仍可能有权限、输出量和敏感信息风险。采集脚本设置超时、大小和脱敏。\n\n第一现场先固定目标范围：节点、GPU UUID 或作业 ID，避免在共享集群上把别的租户数据混入证据。查询结果要保留命令、退出码和采集时间；对 `journalctl`、`nvidia-smi -q` 这类可能很大的输出设置大小上限，并在外发前移除主机名、路径和业务参数。", "subs": []}, {"title": "负载测试需要独占资源和停止条件", "content": "DCGM Diagnostics、P2P/NCCL/RDMA/Storage/Burn-in 会占 GPU、网络、磁盘或功耗。Cordon/Drain 或测试队列，确认目标和最大影响。\n\n执行前应声明资源锁、预计持续时间和终止条件，例如温度、功耗、错误计数或延迟超过阈值立即停止。测试日志应同时记录开始和结束时的健康快照，才能区分测试诱发的问题与原有问题；没有独占确认时，不把生产作业的偶然空闲当作可测试许可。", "subs": []}, {"title": "状态修改必须进入维护流程", "content": "Power/Clock/MIG、Reset、Module/Service、Network QoS、Firmware、Reboot/Power Cycle 都会中断或改变证据。本文只描述边界，不把破坏命令做默认步骤。\n\n维护单至少包含影响对象、审批人、回滚动作和验证项。修改前先保存原配置与当前健康状态，修改后按相同命令复采，并验证设备重新注册、作业准入和拓扑路径；若证据需要解释故障，不应先 Reset 或清除 Counter，以免丢失时间线。", "subs": []}, {"title": "每次采集有时间、目标和版本", "content": "输出前写 ISO Timestamp、Hostname/Node、GPU UUID/BDF、Tool/Driver；多节点时钟同步。命令文本和 Exit/Timeout 一起保存。\n\n建议把上下文写入每个文件的旁车 `manifest`，并用统一时区记录事件。命令超时、权限拒绝和空输出都是证据的一部分，不能只保存成功文件；多节点采集应使用同一批次 ID，便于按时间和 Rank 对齐。", "subs": []}]}, {"title": "第 29 章 · GPU Inventory、Driver 与 Kernel 证据入口", "sections": [{"title": "列出 GPU 和 UUID", "content": "```bash\nnvidia-smi -L\n```\n\n证明 Driver/NVML 当前能枚举 GPU/MIG；不证明 CUDA Framework、性能和健康。与 CMDB 期望数量比较。\n\n`index` 只适合本机即时引用，跨重启、容器或 MIG 场景应以 UUID、Serial 和 BDF 为稳定身份。若枚举数量与 CMDB 不符，先记录命令版本、`CUDA_VISIBLE_DEVICES` 和容器设备映射，再判断是硬件缺失、驱动未加载还是视图被隔离。", "subs": []}, {"title": "查询型号、UUID、BDF 和能力", "content": "```bash\nnvidia-smi --query-gpu=index,uuid,serial,name,pci.bus_id,compute_cap,memory.total,driver_version --format=csv\n```\n\n字段支持随版本变化，`N/A` 不转 0。容器内 Index 可能重排，UUID/BDF 用于跨层。", "subs": []}, {"title": "查看详细 GPU 状态", "content": "```bash\nnvidia-smi -q\n```\n\n保存 Power/Clock/ECC/Fabric/Process 等快照。输出很长，可按 `-d` 选择 Display Group，但完整事件首次采集保留全量。\n\n详细查询适合做“前后对照”：负载前、异常发生后和恢复验证各取一次。对 Counter 记录累计值与采集时刻，后续用差值计算事件窗口；不要把一次快照中的高温、低时钟直接当作故障结论。", "subs": []}, {"title": "查看 PCIe 设备", "content": "```bash\nlspci -Dnn | egrep -i 'nvidia|mellanox|ethernet|infiniband'\nlspci -t\n```\n\n第一条盘点 Endpoint，第二条展示树。`lspci` 无 GPU 指向枚举/硬件层，不能靠重装 CUDA 修复。\n\n把 BDF 与 `nvidia-smi` 的 PCI Bus ID 交叉匹配，可发现设备被 BIOS、PCIe 热插拔或 IOMMU 视图隐藏的情况。拓扑树只说明连接关系，仍需结合 Link State、驱动日志和实际 P2P 测试确认数据面。", "subs": []}, {"title": "检查加载模块和版本", "content": "```bash\nlsmod | rg '^nvidia'\ncat /proc/driver/nvidia/version\nmodinfo nvidia | head -20\nuname -r\n```\n\n比较 Loaded Module、磁盘 Module 和 Kernel。`modinfo` 存在不表示模块已成功加载。", "subs": []}, {"title": "检查设备节点", "content": "```bash\nls -l /dev/nvidia* /dev/nvidia-caps 2>/dev/null\n```\n\n确认 Major/Minor/Permission。节点存在不证明容器 Cgroup 允许，也不证明 GPU 响应。", "subs": []}, {"title": "检查内核首错", "content": "```bash\njournalctl -k -b --no-pager | rg -i 'NVRM|XID|AER|PCIe|nvidia'\ndmesg -T | rg -i 'NVRM|XID|AER|PCIe|nvidia'\n```\n\n权限和日志持久化依系统。保存最早错误及上下文，不只 `tail` 最后一条。", "subs": []}, {"title": "检查用户态库", "content": "```bash\nldconfig -p | rg 'libcuda|libnvidia-ml'\nldd \"$(command -v nvidia-smi)\"\n```\n\n识别 NVML/Driver Library 路径和 Missing SONAME。Library 存在不证明版本与 Module 匹配。", "subs": []}]}, {"title": "第 30 章 · 性能、ECC、XID 与硬件健康证据入口", "sections": [{"title": "结构化查询性能快照", "content": "```bash\nnvidia-smi --query-gpu=timestamp,uuid,pstate,temperature.gpu,power.draw,power.limit,clocks.sm,clocks.mem,utilization.gpu,utilization.memory,memory.used,memory.total --format=csv\n```\n\n解释要结合负载阶段。空闲低 Clock/Power 正常，高 Util 不是有效吞吐。", "subs": []}, {"title": "秒级观察 GPU 波形", "content": "```bash\nnvidia-smi dmon -s pucvmet -d 1 -c 60\n```\n\n短时现场关联，Group 支持查帮助。长期用 DCGM/Prometheus；终端平均不保留历史。", "subs": []}, {"title": "观察进程级活动", "content": "```bash\nnvidia-smi pmon -s um -c 60\nnvidia-smi --query-compute-apps=pid,gpu_uuid,process_name,used_memory --format=csv\n```\n\n关联 PID/GPU/Memory。容器 PID Namespace、MIG/MPS/HAMi 归属需结合平台元数据。", "subs": []}, {"title": "修改 Power/Clock 的边界", "content": "相关 `nvidia-smi` 设置会改变性能和机架功率，只在维护/实验计划执行，记录原值和恢复验证。不能为了让 Benchmark 好看临时修改后不披露。", "subs": []}, {"title": "从详细查询读取 ECC 和 Remap", "content": "```bash\nnvidia-smi -q -d ECC,PAGE_RETIREMENT,ROW_REMAPPER\n```\n\n支持项随 GPU 变化。区分 Volatile/Aggregate、Correctable/Uncorrectable、Pending/Failure；保存 Counter 不先清零。\n\n分析时先按 GPU UUID 和采集窗口对齐 Counter，再看是否伴随 XID、AER、降频或作业错误。Correctable 的累计增长与 Uncorrectable、Page Retirement 或 Row Remap 的组合含义不同；在没有基线和时间序列时，只能报告“观察到计数”，不能直接判定需要换卡。", "subs": []}, {"title": "XID 从 Kernel Log 读取", "content": "```bash\njournalctl -k -b --no-pager | rg 'NVRM: Xid'\n```\n\n编号按当前 Driver/GPU Catalog 解释，关联 UUID/BDF/PID/ECC/AER/应用首错。不是所有 XID 都是坏卡。\n\n保留 XID 前后完整内核上下文，记录发生时的作业、温度、功耗和 PCIe/RDMA 状态。相同编号可能由软件调用、链路异常或硬件故障触发，处置应先依据首个异常和可复现实验分级，而不是见到 XID 就重启节点。", "subs": []}, {"title": "DCGM Discovery 和 Health", "content": "```bash\ndcgmi discovery -l\ndcgmi health -c\n```\n\n发现 DCGM Entity 和已配置 Health 状态。设置 Health Watch 的命令会改变监控配置，由平台统一管理。\n\nDiscovery 结果用于确认 GPU、CPU、NIC 等实体是否被 DCGM 识别；Health 结果则是已启用检查的当前视图。采集时同时记录 DCGM Hostengine/Client 版本和实体 ID，避免不同节点因配置差异产生不可比的“通过”。", "subs": []}, {"title": "DCGM Diagnostics 是负载动作", "content": "```bash\ndcgmi diag -r 1\n```\n\n短等级示意，仍可能占 GPU。高级诊断必须 Drain、热/功率停止条件；实际参数按版本文档。\n\n诊断结果应与运行前后的 ECC、XID、温度和功耗快照绑定，记录测试级别、持续时间和失败阶段。若诊断在中途超时，报告“未完成”并保留已产生的错误，不把超时改写成通过或硬件结论。", "subs": []}]}, {"title": "第 31 章 · CPU、NUMA、PCIe 与 Fabric 证据入口", "sections": [{"title": "查看 CPU/NUMA", "content": "```bash\nlscpu -e=cpu,node,socket,core\nnumactl --hardware\n```\n\n显示 Host 拓扑和内存容量/距离；不表示应用实际绑定。\n\n把 NUMA 节点与 GPU/NIC 的 PCIe 归属放在同一张记录中，才能判断 CPU 线程和内存是否走了远端路径。静态拓扑只是准入条件，仍需结合进程的 `Cpus_allowed_list`、内存页分布和作业启动参数确认运行时是否遵守绑定。", "subs": []}, {"title": "查看进程 CPU 和 NUMA", "content": "```bash\ntaskset -pc <pid>\ngrep Cpus_allowed_list /proc/<pid>/status\nhead -50 /proc/<pid>/numa_maps\n```\n\n需要目标 PID；`numa_maps` 抽样不能代替完整页汇总。容器内外 PID 映射确认。", "subs": []}, {"title": "查看 PCIe Link 能力", "content": "```bash\nlspci -s <bdf> -vv\n```\n\n关注 `LnkCap/LnkSta` Speed/Width、AER。空闲节能可能降 Speed，负载后重查；Width 降级重点调查。", "subs": []}, {"title": "查看 GPU 拓扑矩阵", "content": "```bash\nnvidia-smi topo -m\n```\n\n读取 GPU-GPU、GPU-NIC、CPU/NUMA 和 Legend。矩阵是声明/发现，需 P2P/NCCL 实测。\n\n采集时保留完整矩阵和驱动版本，避免只截取某一行造成方向误读。矩阵中的 `SYS`、`PHB`、`NV#` 等标签描述路径层级，不等于应用一定选择该路径；对关键 GPU 对还应保存 P2P 带宽或 NCCL 基准结果。", "subs": []}, {"title": "查看 NVLink 状态和能力", "content": "```bash\nnvidia-smi nvlink --status\nnvidia-smi nvlink --capabilities\n```\n\n按 GPU UUID/Link ID/Remote 保存，选项随版本。Active 不证明无错误/性能达标。", "subs": []}, {"title": "查看 Fabric Manager 服务", "content": "```bash\nsystemctl status nvidia-fabricmanager --no-pager\njournalctl -u nvidia-fabricmanager -b --no-pager\n```\n\n服务名依安装。对照 Driver/FM Version、GPU Fabric State 和初始化阶段。", "subs": []}, {"title": "查看 GPU Fabric 详细状态", "content": "```bash\nnvidia-smi -q | rg -n 'Fabric|Status|Clique|Health'\n```\n\n过滤用于导航，事件证据保留完整 `-q`。字段/缩进随 Driver 变化，不用脆弱文本解析做唯一控制。", "subs": []}, {"title": "Reset/重启 Fabric 的边界", "content": "会影响完整 GPU/Fabric Group。保存证据、Cordon/Drain、确认无 Context、按 OEM/NVIDIA 流程；恢复后全矩阵 P2P/NCCL。\n\nReset 前需确认没有持久化服务、MIG 实例或其他租户仍持有 Context，并记录操作前后的 Fabric Manager 日志。恢复验收至少包括 GPU 枚举、NVLink/Fabric 状态、拓扑矩阵和短时通信 Smoke；任一项未通过时保持节点隔离。", "subs": []}]}, {"title": "第 32 章 · RDMA、网卡与 NCCL 证据入口", "sections": [{"title": "查看 Netdev 和 RDMA Link", "content": "```bash\nip -br link\nrdma link show\nibstat\n```\n\n关联接口、HCA Port、State/Rate。Link Active 不证明 GID/Route/RDMA 数据面。\n\n同一物理端口可能以 Netdev、RDMA Device 和交换端口多个名字出现，证据中应保留映射关系。跨节点排障要在两端采集，单端 `rdma link show` 无法说明对端端口、VLAN 或交换机配置。", "subs": []}, {"title": "查看 Verbs 设备和 GID", "content": "```bash\nibv_devinfo -v\nshow_gids\n```\n\n记录 Device/Port/GID Index/RoCE Version/IP/VLAN。工具包和输出依发行版。\n\nGID 选择必须和应用使用的地址族、VLAN 与 RoCE 配置一致；只看到一个 GID 并不表示所有路径可用。把 `ibv_devinfo`、`show_gids` 输出与 NCCL 选择的 HCA/GID 日志关联，能区分 verbs 能力问题和上层选路问题。", "subs": []}, {"title": "查看接口和 RDMA Counter", "content": "```bash\nip -s link show <iface>\nethtool -S <iface>\nrdma statistic show\n```\n\n测试前后取 Delta，筛 CRC/Drop/Discard/PFC/ECN/Retry；Counter 名称依 NIC Driver。", "subs": []}, {"title": "检查 MTU 和 Route", "content": "```bash\nip -d link show <iface>\nip route get <peer-ip>\nping -M do -s <payload> <peer-ip>\n```\n\nPayload 按 IPv4/IPv6/Header 计算。Ping 只验证 IP Path，不证明 RDMA Path MTU/QoS。", "subs": []}, {"title": "开启最小 INFO 日志", "content": "```bash\nNCCL_DEBUG=INFO NCCL_DEBUG_SUBSYS=INIT,GRAPH,NET <launcher-command>\n```\n\n观察 Bootstrap、Topology、Transport、HCA/GID/Channel。多 Rank 文件分开且限额；版本支持查文档。", "subs": []}, {"title": "单节点 AllReduce 示例", "content": "```bash\n./build/all_reduce_perf -b 8M -e 4G -f 2 -g 8\n```\n\n负载型命令，占用 8 GPU；参数按节点调整。AlgBW/BusBW、错误和 Link Counter 一起保存。", "subs": []}, {"title": "多节点必须记录 Launcher", "content": "MPI/Slurm/Kubernetes 启动命令、Node/Rank/GPU per Process、Environment/Interface 和 Image。仅保存 nccl-tests 参数无法重放 World。", "subs": []}, {"title": "禁用路径只做短时二分", "content": "禁 P2P/IB/GDR、限定 HCA/Algorithm 都改变性能。记录假设/原值/结果/恢复，不作为永久“稳定配置”。\n\n二分实验一次只改一个变量，并固定消息大小、进程布局和运行次数。若禁用某路径后错误消失，只能说明该路径参与故障，仍需回到拓扑、链路 Counter 或驱动日志寻找根因；实验完成后删除临时环境变量并复查默认路径。", "subs": []}]}, {"title": "第 33 章 · CUDA、Framework、Runtime 与 CDI 证据入口", "sections": [{"title": "区分 Driver 能力和 Toolkit", "content": "```bash\nnvidia-smi\nnvcc --version\n```\n\n前者显示 Driver 支持上限提示，后者是本地 Compiler Toolkit；应用实际 Runtime 由进程/容器 Library 决定。", "subs": []}, {"title": "PyTorch 最小检查", "content": "```bash\npython -c 'import torch; print(torch.__version__, torch.version.cuda, torch.cuda.is_available(), torch.cuda.device_count())'\n```\n\n先确认 CUDA Build/可见性；真实算子和 Extension 另测。输出 False 时检查首个 Warning/Error。", "subs": []}, {"title": "动态依赖检查", "content": "```bash\nldd /path/to/extension.so\nreadelf -d /path/to/extension.so | rg 'NEEDED|RPATH|RUNPATH'\n```\n\n定位 Missing/Symbol Search。路径含业务信息，外发脱敏。", "subs": []}, {"title": "Loader Debug 仅最小复现", "content": "```bash\nLD_DEBUG=libs python -c 'import torch; print(torch.cuda.is_available())' 2>loader.log\n```\n\n输出巨大且降速，不在生产长任务全量开启。确认实际加载 `libcuda`/CUDA-X 路径。", "subs": []}, {"title": "查看 containerd Effective Config", "content": "```bash\ncontainerd config dump\ncrictl info\n```\n\n证明 Runtime 当前读取配置；磁盘文件未生效/路径错误可由此分界。输出可能含 Registry 配置，脱敏。\n\n应同时记录 containerd 版本、配置文件来源和 GPU Runtime Handler。`config dump` 是当前进程的 Effective Config，不能替代节点上实际重启后的验证；修改后必须在测试节点重启或重新加载并运行最小 GPU Pod。", "subs": []}, {"title": "查看 RuntimeClass", "content": "```bash\nkubectl get runtimeclass\nkubectl describe runtimeclass <name>\n```\n\n确认 Handler 名，不能证明节点 containerd 已配置；需最小 Pod。", "subs": []}, {"title": "查看 CDI 设备", "content": "```bash\nnvidia-ctk cdi list\n```\n\n只读列出 Qualified Device。生成 Spec 命令会写文件，由 Operator/变更流程管理。\n\n将 CDI 名称与节点上实际的 `/dev`、库挂载和 GPU UUID 对照，避免“CDI 有条目但指向旧设备”的假成功。多节点采集 CDI 列表和生成时间，发现配置漂移后再进入 Operator 或配置管理流程修复。", "subs": []}, {"title": "最小容器测试", "content": "使用组织固定 Digest 的 CUDA Smoke Image，显式请求一张 GPU，输出 UUID/简单计算。公共示例 Tag 不作为生产证据。\n\nSmoke 应验证三层结果：容器能启动并获得设备、Framework 能建立 CUDA Context、一个小算子能完成。保存镜像 Digest、Pod YAML 摘要、节点名和 UUID；仅打印 `nvidia-smi` 版本不足以证明运行时库和设备访问完整。", "subs": []}]}, {"title": "第 34 章 · Kubernetes、MIG 与 HAMi 资源证据入口", "sections": [{"title": "查看 Node Capacity/Allocatable", "content": "```bash\nkubectl get node <node> -o jsonpath='{.status.capacity}{\"\\n\"}{.status.allocatable}{\"\\n\"}'\n```\n\n与物理/GFD/Plugin 比较。资源存在不证明每张设备健康或拓扑满足。", "subs": []}, {"title": "查看 GPU Operator 组件", "content": "```bash\nkubectl get pods -n <gpu-operator-namespace> -o wide\nkubectl get clusterpolicy\n```\n\nNamespace/CR 名依安装。Running 后继续查版本、Validator、Node Label 和日志。", "subs": []}, {"title": "查看 Pod 调度和分配事件", "content": "```bash\nkubectl describe pod <pod> -n <namespace>\nkubectl get events -n <namespace> --sort-by=.lastTimestamp\n```\n\n事件保留有限，及时保存；按 Queue/Quota/Resource/Topology/Runtime 分类。", "subs": []}, {"title": "查看 Node Label/Taint", "content": "```bash\nkubectl describe node <node>\n```\n\n输出大但包含 Capacity/Allocated/Event/Condition。人工修改 Label/Taint 是状态变更，需 Workflow。", "subs": []}, {"title": "查看 MIG 状态和实例", "content": "```bash\nnvidia-smi -L\nnvidia-smi mig -lgip\nnvidia-smi mig -lcip\n```\n\n只读列能力/实例。启停 Mode、创建/销毁实例是维护动作，需 Drain。", "subs": []}, {"title": "核对 Kubernetes MIG 资源", "content": "查看 Node Capacity、GFD Label、Device Plugin Strategy 和实际 Smoke Pod，关联 Parent/MIG UUID。Physical Layout 与资源名都要一致。", "subs": []}, {"title": "核对 HAMi 分配链", "content": "Pod Request/Annotation、Scheduler/Device Plugin Log、Assigned UUID、HAMi-Core Mapping、Process Memory 和 Physical Total。具体资源键按部署版本。\n\n排查时从调度声明一路追到进程可见设备，逐层记录“请求值、分配值、实际使用值”。若逻辑配额与物理显存或计算占用不一致，应先确认 HAMi 的隔离策略、采样时刻和其他进程，再判断是否为超卖或监控口径差异。", "subs": []}, {"title": "共享干扰用双工作负载测试", "content": "基线租户固定请求，邻居逐步 Memory/Compute/Crash，记录 P99/Step/OOM/XID。测试占资源，在隔离节点执行。\n\n每个干扰级别至少保留基线窗口和恢复窗口，并固定模型、Batch、频率策略和邻居放置。把租户标识脱敏后写入 manifest；出现 OOM、XID 或 P99 超阈值时立即停止增加压力，避免把实验变成不可控故障。", "subs": []}]}, {"title": "第 35 章 · Storage、主机 I/O 与调度器证据入口", "sections": [{"title": "查看 CPU/Memory/Disk 活动", "content": "```bash\npidstat -u -r -d -p <pid> 1\niostat -x 1\n```\n\nHost 现场观察；容器 Cgroup/共享 Disk 和 Storage Backend 还需平台指标。高 IO 相关不等于根因。", "subs": []}, {"title": "查看文件系统容量和 Inode", "content": "```bash\ndf -hT <path>\ndf -ih <path>\n```\n\n只显示客户端 Mount 视角，Quota/Snapshot/Backend 另查。测试目标路径而非 `/` 泛查。", "subs": []}, {"title": "fio 写测试是破坏性负载", "content": "仅对明确专用测试文件/卷，固定 Size/Block/Depth/Jobs/Direct，审核路径，结束清理。绝不指向设备/生产 Dataset。\n\n写测试前确认挂载点、剩余空间、配额和文件归属，并让 `fio` 使用新建的测试文件。报告中记录实际命令、测试文件路径和清理结果；任何无法证明为专用卷的目标都应拒绝执行。", "subs": []}, {"title": "Checkpoint 完整性以 Manifest/Load 验证", "content": "Shell 看到文件大小不够，使用框架恢复测试、Checksum/Commit Marker；记录 World/Version 和 Load Time。\n\n分布式 Checkpoint 还要验证 shard 数量、索引或元数据是否与当前 World/并行策略兼容。恢复失败时区分文件缺失、校验不一致、版本不兼容和网络/存储超时，保留首个错误与恢复耗时，而不是只报告“目录存在”。", "subs": []}, {"title": "查看队列与原因", "content": "```bash\nsqueue -l\nscontrol show job <job-id>\n```\n\n保存 State/Reason/Node/TRES/Time/Command 摘要；命令参数可能敏感。", "subs": []}, {"title": "查看节点和 GRES", "content": "```bash\nscontrol show node <node>\n```\n\nConfigured/Allocated GRES、State/Reason、Partition。与 `nvidia-smi`/CMDB 比较。", "subs": []}, {"title": "查看作业 Accounting", "content": "```bash\nsacct -j <job-id> --format=JobID,JobName,State,ExitCode,Elapsed,AllocTRES,NodeList\n```\n\n连接 Attempt/Step/Exit/资源；GPU Activity 需 DCGM/集成指标。", "subs": []}, {"title": "Drain/Resume 是状态修改", "content": "由维护/故障 Workflow 执行，Reason/Owner/Incident 和恢复验收。不要为清理队列随意 Resume 未修复节点。\n\nDrain 前确认没有新作业继续分配，Resume 前复查 GPU、网络、存储和运行时 Smoke，并把验收结果写入同一 Incident。若节点仍有未解释的 XID、ECC 增长或拓扑异常，应保持 Drain 并升级处理。", "subs": []}]}, {"title": "第 36 章 · 证据包目录与禁止的证据捷径", "sections": [{"title": "manifest 保存采集上下文", "content": "Incident/Run ID、Time、Cluster/Node/GPU、Tool Version、Commands/Exit、Redaction、Checksum。\n\n`manifest` 是证据包索引，不承载大段原始输出。除上述字段外，建议记录采集器版本、时区、超时和文件相对路径；每个文件生成校验和，包被复制或脱敏后重新校验，避免后续无法证明内容是否改变。", "subs": []}, {"title": "inventory 保存稳定身份", "content": "GPU/NIC/CPU/Memory/PCIe/NVLink/NVSwitch/Storage/BMC，UUID/Serial/BDF/Rack 和期望对照。\n\nInventory 记录的是相对稳定的身份与期望状态，适合回答“这是谁、应该有什么”。采集时将物理身份与 Kubernetes、Slurm 或 CMDB 标识分开保存，并注明缺失字段和查询时间；不要用容器内重排的 GPU index 覆盖 UUID/BDF。", "subs": []}, {"title": "health 保存错误与环境", "content": "ECC/XID/AER/Link/DCGM、Temperature/Power/Clock、Kernel/BMC/FM，首次和负载前后。\n\nHealth 文件应保留原始错误行及其上下文，同时保存结构化快照，便于计算 Counter Delta。把“未采集”与“无错误”区分开；例如 DCGM 不可用时不能把空结果写成健康通过。", "subs": []}, {"title": "workload 保存业务与分配", "content": "Pod/Job/Rank/Tenant、Image/Model/Data/Config、GPU UUID/HCA、阶段/吞吐/延迟/首错。\n\nWorkload 证据连接业务影响和基础设施状态。配置或数据路径含敏感信息时保存脱敏摘要、版本和校验和；分布式作业要记录 Attempt、World、Rank 映射，单个 Pod 的状态不足以重建全局行为。", "subs": []}, {"title": "network 保存端到端路径", "content": "Interface/HCA/GID/MTU/Route/Rail/Switch Port、Counter Before/After、RDMA/NCCL。\n\nNetwork 文件应同时覆盖控制面可达性和数据面结果。把接口、HCA、GID、Rail 与节点/端口的映射固定下来，并对 Counter 计算测试窗口 Delta；只有单端 Link 或 Ping 输出时，结论范围应明确标为部分证据。", "subs": []}, {"title": "storage 保存 I/O 和完整性", "content": "Mount/Quota/Capacity、Client/Backend Latency/Error、Dataset/Checkpoint/Model、Checksum/Restore。\n\nStorage 证据要区分客户端看到的文件系统视角和后端服务视角。记录挂载参数、配额、读写错误、Checkpoint Manifest 及恢复结果；容量充足但延迟或后端错误异常时，不能以 `df` 正常结束排查。", "subs": []}, {"title": "timeline 合并跨系统事件", "content": "Last Healthy、First Deviation/Error、Application Impact、Alert、Isolation、Action、Validation、Recovery，统一时区。\n\n时间线按事件发生时间排序，而不是日志到达时间。对每个节点和作业保留时钟偏差、采集延迟及状态变更人，明确“首错”与“后续连锁错误”；这能避免把重启后的恢复日志误当成根因发生时刻。", "subs": []}, {"title": "conclusion 只写证据支持范围", "content": "Confirmed/Probable/Unknown、替代解释、已排除、下一实验。命令输出正常不自动证明整层健康。\n\n结论应逐条引用证据文件和时间窗口，并写出尚未验证的假设。下一实验要说明单一变量、目标指标和停止条件；若证据互相矛盾，保留矛盾本身，不用一句“环境正常”强行收敛。", "subs": []}, {"title": "`nvidia-smi` 成功不等于 CUDA 正常", "content": "还需容器/Framework/Kernel/真实工作负载。它主要证明 NVML 管理路径。\n\n最小闭环应从主机枚举、容器设备注入、Framework Context 到一个真实 CUDA 算子逐层验证。任一层失败都要记录首个错误和层级边界，避免把管理工具成功误报为应用可用。", "subs": []}, {"title": "GPU Utilization 高不等于性能好", "content": "可能小 Kernel、分支、Memory/通信、节流。用业务吞吐和时间分解。\n\n把 GPU Utilization 与 SM、Tensor Core、Memory、通信和空闲等待放在同一时间轴，再对照 Samples/s、Tokens/s 或 Step Time。高利用率伴随低吞吐时，优先检查 Kernel 形状、同步点、数据供给和功耗/温度节流。", "subs": []}, {"title": "Memory Used 高不等于带宽满", "content": "驻留权重/Cache 占容量，DRAM Activity/Bytes 才解释搬运。\n\n显存容量指标描述“放了多少”，不是“搬了多快”。要结合内存控制器利用率、读写吞吐、Kernel 时间和 Host/Device 拷贝，区分模型常驻、缓存、碎片与真正的带宽瓶颈。", "subs": []}, {"title": "Link Active 不等于无错误", "content": "负载下 Counter/带宽/延迟和路径测试。\n\nNVLink、Fabric 或 RDMA 的 Active 状态只说明链路已建立。应在目标消息大小和并行布局下做短时路径测试，同时比较错误计数、重传、带宽和延迟；空闲时通过不代表负载时没有降级或拥塞。", "subs": []}, {"title": "Ping 成功不等于 RDMA 正常", "content": "QP/MR/GID/QoS/GDR/NCCL 逐层验证。\n\nPing 只覆盖 ICMP 控制路径，不能证明 verbs 能创建 Queue Pair、Memory Region 注册成功，也不能证明 RoCE QoS、GPU Direct 或 NCCL 选到了同一 HCA。排查应从 GID/MTU 到 `ib_write_bw` 或 NCCL Smoke 逐层推进。", "subs": []}, {"title": "Pod Running 不等于 GPU 已交付", "content": "Resource/Allocate/CDI/Device/Framework 和简单计算。\n\nPod 状态只反映 kubelet 生命周期。证据链还要确认申请资源、Device Plugin 分配、CDI/运行时挂载、容器内 UUID 与 Framework Context；任何一层缺失都应把结论限定为“Pod 已运行但 GPU 交付未证实”。", "subs": []}, {"title": "Operator Ready 不等于所有节点一致", "content": "逐节点 Operand Version/Validator/Resource/Smoke 和旧组件残留。\n\nOperator 的聚合 Ready 可能掩盖单节点 CrashLoop、旧 DaemonSet 或标签漂移。按节点保存 Operand 镜像 Digest、Validator 结果、资源数量和 Smoke UUID，再与期望版本做差异比较。", "subs": []}, {"title": "Benchmark 最佳一次不等于基线", "content": "多轮分布、固定环境、健康/错误、原始数据和阈值来源。\n\n基线至少包含预热、稳定窗口和多次重复，报告中保留均值之外的分位数与异常轮次。节点健康、频率、拓扑、驱动、镜像和数据集必须固定；阈值应注明来自历史基线、容量目标还是用户协议。", "subs": []}, {"title": "重启恢复不等于根因消失", "content": "错误/性能路径、负载和观察窗口；反复重启转维修。\n\n重启只是改变状态并可能清空瞬态证据。恢复后应在相同负载下复测错误计数、链路、吞吐和延迟，并设定观察窗口；若 XID/ECC/降速重复出现，应停止循环重启，转入隔离、换卡或厂商诊断流程。", "subs": []}, {"title": "告警消失不等于节点可恢复调度", "content": "Telemetry 可能消失，必须恢复准入和事件批准。\n\n告警消失可能只是 Agent、Exporter 或网络恢复，不能替代节点准入检查。Resume 前确认监控数据连续、硬件与运行时 Smoke 通过、未有未关闭 Incident，并由责任人批准恢复调度。", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
