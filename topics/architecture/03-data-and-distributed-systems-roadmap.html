<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>架构设计学习笔记 · 第三册：数据与分布式系统 · Roadmap</title>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({startOnLoad:false, theme:'base', themeVariables:{
    background:'#fffdf5', primaryColor:'#fff9d6', primaryBorderColor:'#1f2933',
    primaryTextColor:'#1f2933', lineColor:'#1f2933', fontFamily:'inherit'}});
  window.__mermaid = mermaid;
</script>
<style>
  :root{
    --bg:#fdf6e3; --ink:#1f2933; --muted:#6b6657;
    --paper:#fffdf5; --line:#1f2933;
    --todo:#cbd5e1; --doing:#facc15; --done:#22c55e;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;}
  header{padding:32px 40px 16px;border-bottom:2px dashed var(--ink);
    position:sticky;top:0;background:var(--bg);z-index:5;}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:1px}
  .meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .progress{flex:1;min-width:220px;height:10px;background:#e7dfc7;
    border:1px solid var(--ink);border-radius:6px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .legend{display:flex;gap:14px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.todo{background:var(--todo)} .dot.doing{background:var(--doing)} .dot.done{background:var(--done)}
  button.reset, a.back{background:var(--paper);border:1px solid var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink)}
  button.reset:hover, a.back:hover{background:var(--accent)}
  main{padding:32px 40px 80px;max-width:1280px;margin:0 auto}
  .part{margin-bottom:48px;position:relative}
  .part-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .part-num{width:42px;height:42px;border-radius:50%;background:var(--ink);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;flex-shrink:0}
  .part-title{font-size:20px;font-weight:600;margin:0}
  .part-bar{flex:1;height:0;border-top:2px dashed var(--ink);opacity:.4}
  .sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding-left:56px}
  .card{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:10px;padding:12px 14px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
  .card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .card[data-status="doing"]{background:#fff9d6}
  .card[data-status="done"]{background:#d9f7d9}
  .card .status{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);
    flex-shrink:0;background:var(--todo);cursor:pointer}
  .card[data-status="doing"] .status{background:var(--doing)}
  .card[data-status="done"] .status{background:var(--done)}
  .card .ttl{font-size:13.5px;line-height:1.35;font-weight:500}
  .card .badge{margin-left:auto;font-size:11px;color:var(--muted);
    background:rgba(31,41,51,.05);border:1px solid rgba(31,41,51,.15);
    padding:1px 7px;border-radius:10px;flex-shrink:0}
  /* drawer 顶部胶囊条（1-2 排自动折行，每个胶囊不同色） */
  .tags-bar{display:flex;flex-wrap:wrap;gap:7px 8px;padding:14px 24px 14px;
    border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .tags-bar .pill{font-size:12px;color:var(--ink);
    border:1px solid var(--ink);padding:3px 10px;border-radius:14px;
    white-space:nowrap;box-shadow:1.5px 1.5px 0 var(--ink);font-weight:500}
  .tags-bar .pill.more{background:transparent;border-style:dashed;color:var(--muted);
    box-shadow:none;cursor:help}
  .tags-bar.empty{display:none}
  .search input{padding:6px 10px;border:1px solid var(--ink);border-radius:6px;font:inherit;background:var(--paper)}
  .drawer{position:fixed;top:0;right:0;width:var(--drawer-width,min(640px,92vw));height:100vh;
    background:var(--paper);border-left:2px solid var(--ink);
    max-width:calc(100vw - 28px);min-width:min(360px,92vw);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer.resizing{transition:none}
  .drawer-resizer{position:absolute;top:0;left:-10px;width:18px;height:100%;
    cursor:ew-resize;touch-action:none;z-index:2;background:transparent}
  .drawer-resizer::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:3px;
    background:transparent;border-left:1px dashed rgba(31,41,51,.5);border-right:1px dashed rgba(31,41,51,.25)}
  .drawer.open .drawer-resizer:hover::after,.drawer.open .drawer-resizer:focus-visible::after,
  .drawer.resizing .drawer-resizer::after{background:var(--accent);border-color:var(--ink)}
  body.drawer-resizing{cursor:ew-resize;user-select:none}
  .drawer header{position:sticky;top:0;display:flex;align-items:center;
    gap:12px;padding:16px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .drawer h2{margin:0;font-size:17px;flex:1}
  .drawer .body{padding:18px 24px;overflow:auto;flex:1;line-height:1.7;font-size:14.5px}
  .drawer .body pre{background:#1a1d23;color:#eee;padding:12px;border-radius:6px;overflow:auto}
  .drawer .body code{font-family:'JetBrains Mono','Menlo',monospace;font-size:13px}
  .drawer .body :not(pre) > code{background:#f1ead0;padding:2px 5px;border-radius:3px}
  .drawer .body .mermaid{background:var(--paper);border:1.5px solid var(--ink);
    border-radius:8px;padding:14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink);
    overflow:auto;text-align:center;cursor:zoom-in}
  .drawer .body .mermaid svg{max-width:100%;height:auto}
  .drawer .body h1,.drawer .body h2,.drawer .body h3,.drawer .body h4{margin:1.2em 0 .4em}
  .drawer .body table{border-collapse:collapse;margin:8px 0}
  .drawer .body th,.drawer .body td{border:1px solid #c8c0a4;padding:5px 9px}
  .drawer .toggle-group{display:flex;gap:6px}
  .drawer .toggle-group button{padding:4px 10px;border:1px solid var(--ink);
    background:transparent;border-radius:5px;font:inherit;cursor:pointer;font-size:12px}
  .drawer .toggle-group button.active{background:var(--ink);color:var(--bg)}
  .drawer .edit-only{display:none !important}
  .drawer.editable .edit-only{display:inline-flex !important}
  .drawer.editable .edit-actions.edit-only{display:none !important}
  .drawer.editable.editing .edit-btn{display:none !important}
  .drawer .edit-btn,.drawer .save,.drawer .cancel{padding:4px 10px;border:1px solid var(--ink);
    background:var(--paper);border-radius:5px;font:inherit;cursor:pointer;font-size:12px;color:var(--ink)}
  .drawer .edit-btn:hover,.drawer .save:hover,.drawer .cancel:hover{background:var(--accent)}
  .drawer.editing .body{display:none}
  .drawer .edit-actions{grid-template-columns:1fr auto auto;gap:8px;
    padding:12px 24px;border-bottom:1px dashed var(--ink);background:#fffdf5;align-items:center}
  .drawer.editable.editing .edit-actions{display:grid !important}
  .drawer .edit-title{grid-column:1 / -1;padding:8px 10px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;font-size:14px}
  .drawer .editor-body{display:none;width:calc(100% - 48px);min-height:45vh;margin:18px 24px;
    padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fffdf5;color:var(--ink);
    font:13px/1.65 'JetBrains Mono','Menlo',monospace;resize:vertical}
  .drawer.editing .editor-body{display:block !important}
  .drawer .save-state{font-size:12px;color:var(--muted);align-self:center}
  .drawer .close{background:transparent;border:none;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .drawer .nav-hint{display:flex;align-items:center;gap:6px;padding:7px 24px;
    font-size:11.5px;color:var(--muted);background:#fffdf5;border-bottom:1px dashed var(--ink)}
  .drawer .nav-hint kbd{font-family:inherit;font-size:11px;line-height:1.5;padding:0 5px;
    border:1px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:1px 1px 0 var(--ink)}
  .backdrop{position:fixed;inset:0;background:rgba(31,41,51,.35);z-index:15;display:none}
  .backdrop.open{display:block}
  .diagram-backdrop{position:fixed;inset:0;background:rgba(31,41,51,.55);z-index:35;display:none}
  .diagram-backdrop.open{display:block}
  .diagram-modal{position:fixed;inset:clamp(10px,3vmin,28px);background:var(--paper);
    border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    z-index:40;display:none;flex-direction:column;overflow:hidden}
  .diagram-modal.open{display:flex}
  .diagram-modal header{position:static;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .diagram-modal header strong{font-size:15px;flex:1}
  .diagram-controls{display:flex;align-items:center;gap:6px}
  .diagram-controls button{width:30px;height:30px;border:1px solid var(--ink);
    border-radius:6px;background:var(--paper);font:inherit;line-height:1;cursor:pointer}
  .diagram-controls button:hover{background:var(--accent)}
  .diagram-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
  .diagram-close{background:transparent;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .diagram-body{overflow:auto;flex:1;background:#fffdf5;color:var(--ink)}
  .diagram-canvas{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
  .diagram-inner{transform-origin:center center}
  .diagram-inner .mermaid{display:block;margin:0;padding:0;background:transparent;
    border:0;box-shadow:none;text-align:center;cursor:default;color:var(--ink)}
  .diagram-inner .mermaid svg{display:block;max-width:none !important;height:auto !important}
  .hidden{display:none !important}
  @media (max-width:640px){
    main{padding:18px}
    .sections{padding-left:0;grid-template-columns:1fr}
    header{padding:18px 20px 12px}
    .drawer{width:100vw;max-width:100vw;min-width:0;border-left:0}
    .drawer-resizer{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>架构设计学习笔记 · 第三册：数据与分布式系统</h1>
  <div class="meta">
    <a class="back" href="../../../index.html">← 返回总览</a>
    <div class="legend">
      <span><span class="dot todo"></span>待学</span>
      <span><span class="dot doing"></span>在学</span>
      <span><span class="dot done"></span>已学</span>
    </div>
    <div class="progress" title="学习进度"><span id="bar"></span></div>
    <span id="progress-text">0 / 0</span>
    <span class="search"><input id="search" type="search" placeholder="搜索小节…"></span>
    <button class="reset" id="reset">重置进度</button>
  </div>
</header>
<main id="roadmap"></main>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-resizer" id="drawer-resizer" role="separator" aria-orientation="vertical"
    aria-label="调整笔记面板宽度" aria-valuemin="360" tabindex="0"></div>
  <header>
    <h2 id="d-title"></h2>
    <div class="toggle-group" data-role="status">
      <button data-status="todo">待学</button>
      <button data-status="doing">在学</button>
      <button data-status="done">已学</button>
    </div>
    <button class="edit-btn edit-only" id="edit-section">编辑</button>
    <button class="close" id="d-close">×</button>
  </header>
  <div class="nav-hint"><kbd>←</kbd><kbd>→</kbd> 切换小节</div>
  <div class="tags-bar empty" id="d-tags"></div>
  <div class="edit-actions edit-only" id="edit-actions">
    <input class="edit-title" id="edit-title" type="text" aria-label="小节标题">
    <button class="save" id="save-section">保存</button>
    <button class="cancel" id="cancel-edit">取消</button>
    <span class="save-state" id="save-state"></span>
  </div>
  <div class="body" id="d-body"></div>
  <textarea class="editor-body" id="edit-content" spellcheck="false" aria-label="小节内容"></textarea>
</aside>
<div class="diagram-backdrop" id="diagram-backdrop"></div>
<section class="diagram-modal" id="diagram-modal" role="dialog" aria-modal="true" aria-label="放大图表">
  <header>
    <strong>Mermaid 图表</strong>
    <div class="diagram-controls" aria-label="图表缩放">
      <button id="diagram-zoom-out" title="缩小">-</button>
      <span class="diagram-zoom" id="diagram-zoom">100%</span>
      <button id="diagram-zoom-in" title="放大">+</button>
    </div>
    <button class="diagram-close" id="diagram-close" title="关闭">×</button>
  </header>
  <div class="diagram-body" id="diagram-body">
    <div class="diagram-canvas" id="diagram-canvas">
      <div class="diagram-inner" id="diagram-inner"></div>
    </div>
  </div>
</section>

<script id="data" type="application/json">{"title": "架构设计学习笔记 · 第三册：数据与分布式系统", "intro": "分布式系统把数据、计算和故障拆到多个节点，获得容量和可用性，也把一致性、路由、恢复和运维复杂度带进了生产环境。本册从访问模式出发，讨论复制、分片、事务、消息、集群协调，以及迁移和重平衡的验证方法。", "parts": [{"title": "第 1 章 · 从访问模式到存储选型", "sections": [{"title": "数据问题先写成访问契约", "content": "存储选型前先写出实体、读写操作、延迟目标、保留周期和一致性要求。订单系统可能同时有按 ID 点查、按用户分页和按状态扫描三种路径，它们对索引、分区和缓存的要求完全不同。只记录“每天一亿条”无法指导设计。\n\n| 维度 | 要回答的问题 | 架构影响 |\n| --- | --- | --- |\n| 读 | 点查、范围查、聚合还是全文检索 | 索引、分区和缓存 |\n| 写 | 单行、批量、顺序追加还是随机更新 | 锁、日志和批处理 |\n| 延迟 | P50、P99 和尾延迟目标 | 副本、超时和隔离 |\n| 一致性 | 能否读旧、重复或乱序 | 确认策略和补偿 |\n| 生命周期 | 保存多久、何时归档 | 冷热分层和删除 |\n\n运维验收应使用真实访问比例回放这些契约。访问模式发生变化时，存储架构应重新评审，而不是等磁盘或 QPS 到达上限才被动拆分。", "subs": []}, {"title": "OLTP、日志和对象数据的边界", "content": "事务数据库适合有约束的短事务和点查；日志型存储适合高吞吐追加和按时间扫描；对象存储适合大文件、低频访问和长周期保留。系统可以组合三者，但必须明确谁是事实源，谁是索引或派生副本。\n\n例如订单正文在数据库，支付事件写入日志，发票 PDF 放入对象存储。三者的数据生命周期并不相同，需要生命周期表、删除任务和审计记录。把所有数据放进关系库会放大备份与恢复压力；把交易数据全放对象存储则会失去事务和并发控制。", "subs": []}, {"title": "容量、吞吐和连接数估算", "content": "原始容量约为 `日写入记录数 × 平均记录大小 × 保留天数 × 副本数`，还要加入索引、WAL、临时空间和安全余量。峰值写入应从历史监控或业务事件推导，不能只用日均值乘一个习惯系数。\n\n应用实例数为 `A`、连接池上限为 `C`、数据库可承受连接为 `K` 时，必须满足 `A × C ≤ K`。否则应用水平扩容会先耗尽数据库连接。监控应同时记录 QPS、活跃连接、锁等待、缓存命中、磁盘队列和日志增长。", "subs": []}, {"title": "选型必须显式比较代价", "content": "| 方案 | 擅长场景 | 新增复杂度 | 验证方式 |\n| --- | --- | --- | --- |\n| 单体关系库 | 中小规模事务 | 单机容量和故障域 | 恢复、慢查询和容量曲线 |\n| 只读副本 | 读多写少 | 延迟和路由 | 位点延迟、读一致性 |\n| 分片关系库 | 写入或容量超单机 | 跨片事务和聚合 | 热点、迁移、路由 |\n| 日志/消息 | 追加和异步解耦 | 积压、重复和保留 | 回放、死信、消费延迟 |\n\n决策记录要写清规模假设、失败时的用户影响、团队运维能力和回退路径，不能以“分布式”或“最新”作为唯一理由。", "subs": []}]}, {"title": "第 2 章 · 读写分离和复制延迟", "sections": [{"title": "一主多从的请求路径", "content": "主库接收写入，副本承担读取，主库通过日志把变更复制出去。代码封装路由部署简单但语言侵入明显；数据库代理跨语言统一，却需要代理集群、连接池和自身故障切换。\n\n```mermaid\nflowchart LR\n  API[业务请求] --> R{读写路由}\n  R -->|写| P[主库]\n  R -->|读| S1[副本一]\n  R -->|读| S2[副本二]\n  P --> L[复制日志]\n  L --> S1\n  L --> S2\n```\n\n副本数量要与读流量和恢复目标匹配。每增加一个副本都会增加网络、磁盘和复制压力；读流量小而异地恢复要求高时，少量跨故障域副本可能更有效。", "subs": []}, {"title": "复制延迟的来源和观测", "content": "延迟可能来自主库产生日志过快、网络拥塞、副本回放慢、长事务或磁盘抖动。应同时采集发送位点、接收位点、回放位点和业务时间戳，区分字节延迟与时间延迟。\n\n```text\n提交时间 -> 主库日志位点 -> 副本收到 -> 副本回放 -> 查询可见\n```\n\n告警按副本、机房、分片和版本打标签。持续落后时先降低副本读流量，再调查磁盘、锁和网络，不要用“增加副本”掩盖根因。", "subs": []}, {"title": "读后写一致性的处理", "content": "读写绑定把会话短时间固定到主库，语义直接但增加主库压力。二次读取先查副本，版本不满足再查主库，节省主库流量但代码复杂。业务分级让支付、权限等关键路径读主库，普通列表接受最终一致。\n\n还可以让写请求返回提交位点，后续读携带位点；副本未追平时路由主库。位点令牌比固定时间窗口准确，但路由层要处理令牌过期和副本不可用。", "subs": []}, {"title": "复制确认和 RPO", "content": "异步复制提交快但可能丢失尚未发送的数据；半同步等待至少一个副本确认；多数派确认在节点故障下更安全，却依赖稳定仲裁和足够节点。\n\n| 策略 | 写延迟 | 丢失窗口 | 适用 |\n| --- | --- | --- | --- |\n| 异步 | 低 | 秒级或更高 | 日志、推荐 |\n| 半同步 | 中 | 较小 | 一般交易 |\n| 多数派 | 较高 | 接近零 | 余额、权限 |\n\nRPO 应写成时间或记录数。切换前检查位点和业务账本，无法确认时宁可限写，也不要提升不完整副本。", "subs": []}, {"title": "拓扑、提升和旧主隔离", "content": "级联复制减轻主库网络压力，但中间节点故障会影响下游；多源复制增加冲突合并复杂度。切换流程必须包含限写、候选校验、提升角色、刷新发现、清理连接池、关键读写验证和旧主 fencing。\n\n只更新 DNS 不足以防双主，旧连接仍可能写入。数据库层或存储层要拒绝旧 owner 的写入，自动切换脚本必须支持暂停和人工确认。", "subs": []}]}, {"title": "第 3 章 · 主备、备份与恢复", "sections": [{"title": "在线副本不是备份", "content": "复制会同步误删和错误更新，备份负责历史恢复、逻辑损坏和时间点回滚。备份要跨故障域保存，最好使用不可变策略，并定期在隔离环境恢复验证。快照恢复快但边界粗，逻辑备份灵活但耗时长。\n\n副本解决的是“当前数据还能否继续服务”，备份解决的是“错误已经写入后能否找回过去”。批处理误执行删除时，所有在线副本会忠实复制删除；提升副本只会把错误变成新的主库。备份策略应包含全量、增量或日志归档，并记录备份位点、加密密钥版本和保留到期时间。\n\n快照适合大容量、短 RTO 的整盘恢复，但边界通常不能精确到单条事务；逻辑备份可按表或租户恢复，却会消耗源库 I/O。生产上可采用“快照用于灾难恢复、日志用于时间点恢复、逻辑备份用于误删恢复”的组合。验收时随机抽取业务主键，而不是只检查备份命令返回码。", "subs": []}, {"title": "时间点恢复链路", "content": "时间点恢复依赖最近全量和连续日志。恢复实例后按顺序重放到目标时间，再校验表、账本和关键业务状态。日志保留周期要覆盖发现问题、审批和恢复的最长时间。\n\n```mermaid\nflowchart LR\n  F[全量备份] --> R[恢复实例]\n  L[连续日志] --> R\n  R --> V[数据校验]\n  V --> C{业务验收}\n  C -->|通过| CUT[切流]\n  C -->|失败| STOP[暂停]\n```", "subs": []}, {"title": "RTO、RPO 与恢复顺序", "content": "RTO 是恢复到可用的时间，RPO 是允许丢失的数据时间。先恢复数据库和事实源，再启动写入服务，通常比所有服务同时启动安全。恢复计划要记录依赖图、只读模式、缓存重建和消息回放顺序。\n\n恢复顺序应由事实源向派生系统展开：先恢复数据库和对象存储，再恢复事件投递和索引，最后开放写入和报表。RTO 要拆成发现、审批、拉起实例、日志重放、校验和切流六段并分别计时。恢复实例在业务校验前保持只读，缓存和搜索索引从事实源重建，不把缓存快照当作权威数据。", "subs": []}, {"title": "脑裂和 fencing", "content": "网络分区时主库和候选库可能都认为对方失联。仲裁、租约和 fencing 要组合使用，保证同时只有一个写主。旧主隔离是切换的组成部分，不应作为事后清理步骤。\n\nfencing 可以是撤销旧实例凭证、关闭旧节点网络、存储层比较递增 epoch，或由平台撤销卷挂载。仅依赖 DNS TTL、进程退出或服务发现下线都存在旧连接继续写入的窗口。切换脚本应先获得新 epoch，再让存储层接受写请求；拿不到最新 epoch 的请求直接拒绝。", "subs": []}, {"title": "恢复演练的业务证据", "content": "演练应抽样核对订单、余额、权限和消息状态，记录备份版本、日志位点、恢复耗时、数据差异和未完成项。只有成功恢复并得到业务确认的备份，才算满足灾备要求。\n\n技术证据包括备份 ID、日志位点、恢复节点和耗时；业务证据包括订单状态、余额总账、权限变更和未发送事件。恢复环境隔离生产凭证，回放消息时关闭外部扣款、短信等副作用，必要时使用沙箱端点。失败样本和整改负责人也要纳入演练报告，不能只保留成功截图。", "subs": []}]}, {"title": "第 4 章 · 分库、分表与分区", "sections": [{"title": "垂直拆分和数据所有权", "content": "按领域或列拆分可以缩小热点表、减少无关字段读取，并明确谁拥有数据。拆分后跨库 Join 和事务消失，需要代码聚合、冗余小表或异步索引。若只是把耦合从 SQL 搬到应用，复杂度不会消失。\n\n拆分前先为每个字段指定唯一 owner。订单页面可以保留用户信息的只读投影，但更新必须回到用户服务；两个库都可写会产生无法判定的冲突。同步投影要提供重建和对账入口，并记录允许的陈旧时间。评估时比较单库优化和服务拆分的故障域、权限隔离及运维成本。", "subs": []}, {"title": "水平分片和分片键", "content": "Hash 分片均匀但范围查询困难；范围分片适合时间窗口，却容易把新写入集中到末端；一致性哈希减少节点变化迁移量，但路由和热点处理更复杂。分片键应稳定、可获得、分布均匀并覆盖主要查询，不能选频繁变化字段。\n\n分片键至少评估基数、写入均匀性、查询覆盖和迁移需求。用户 ID 适合点查和租户隔离；时间范围便于归档却有尾部热点；复合键改善热点但增加路由复杂度。应按未来增长和大客户占比做倾斜模拟，并定义“单租户过大、分片满、路由缺失”的处置策略。", "subs": []}, {"title": "跨片查询、Join 和分页", "content": "跨片查询要并行执行、局部排序和全局归并，尾延迟取决于最慢分片。深分页会放大扫描，应改用游标分页，把排序键纳入索引。Count、Distinct 和 Join 要明确近似值、异步统计、小表广播或业务限制。\n\n请求应设置 fan-out 上限和总超时，归并阶段携带分片水位并检测缺片。对运营查询可返回带“部分结果”标记的数据，对扣款和权限判断则应禁止不完整结果。游标需绑定查询快照或明确接受数据变化，否则翻页期间插入会造成重复和遗漏；跨片 Join 可维护反范式投影或广播小表，但要记录新鲜度和重建成本。", "subs": []}, {"title": "分区和分片的边界", "content": "分区仍可能位于一个实例内，主要减少扫描和管理生命周期；分片把容量和故障域分散到多个实例。分区不能解决单机 CPU、连接和磁盘上限。两者组合时要分别记录备份、扩容和故障边界。\n\n按月份分区的单库仍受单实例上限约束，把分片误当分区会导致扩容只能整体迁移。组合使用时可在每个分片内按时间分区，再按租户或哈希分散到实例。测试应分别覆盖“单分片故障”和“单分区误删”，不能用一次整库恢复替代两条路径。", "subs": []}, {"title": "路由服务的版本控制", "content": "静态路由简单但变更要发布；动态路由灵活但需配置中心、本地快照和回滚。映射应携带版本或 epoch，存储层拒绝旧版本写入，避免迁移期间出现双写。\n\n路由响应应包含 mapping version、owner、有效期和迁移状态。客户端缓存旧版本时允许短时读，写入把版本带到存储层比较；版本落后直接拒绝并触发刷新，而不是猜测新分片。发布前验证无重复 owner、无空洞范围和无跨版本环路，回滚时冻结迁移并保留已产生的事件差异。", "subs": []}]}, {"title": "第 5 章 · 分布式事务和一致性", "sections": [{"title": "先缩小事务边界", "content": "跨库事务的复杂度来自多个资源共同提交。优先重新划分数据所有权，把非关键动作异步化，让关键状态由一个事实源负责。库存服务扣减成功后发布事件，订单服务更新状态，通常比两个服务共享事务更易恢复。\n\n判断是否能缩小边界，可逐项问“失败后能否重试、是否有业务补偿、是否必须同一时刻可见”。扣款等不可补偿动作应由单一事实源拥有，邮件和索引刷新可异步。拆分事务后必须补齐状态机、超时、幂等和对账，不能只是删除分布式事务配置。", "subs": []}, {"title": "两阶段提交的边界", "content": "2PC 先准备再提交，提供较强原子性，但会持有锁、依赖协调者，并在参与者超时期间阻塞。运维需要处理“已准备未提交”的悬挂事务，不能把超时简单当作失败。\n\n第一阶段留下 prepared 状态，协调者故障时参与者不能自行决定。监控 prepared 数量、最老事务年龄和协调者心跳，并保留事务上下文供人工决策。跨地域高延迟、长流程和包含外部 API 的事务通常不适合 2PC，应改用 Saga、本地事件或对账。", "subs": []}, {"title": "Saga、补偿和本地事件", "content": "Saga 将长流程拆成多个本地事务，每步配反向补偿；补偿不一定等价回滚，例如通知只能再发撤销通知。本地事件表让业务状态和待发送事件处于同一事务，再由投递器异步发布。\n\n| 模式 | 一致性 | 阻塞风险 | 运维重点 |\n| --- | --- | --- | --- |\n| 2PC | 强 | 高 | 锁、协调者和超时 |\n| Saga | 最终 | 低 | 补偿和人工介入 |\n| 本地事件 | 最终 | 低 | 事件表、投递和对账 |\n| 直接双写 | 不确定 | 中 | 丢写、重复和修复 |", "subs": []}, {"title": "对账和修复", "content": "对账任务按业务主键比较订单、支付、库存和事件状态，输出差异类型、首次发现时间和影响范围。修复接口要支持幂等、限速、审批和审计，禁止无记录地手工改生产值。\n\n差异应分类为延迟、重复、丢失、状态冲突和数据损坏，并支持水位、断点续跑和限速，避免全表扫描抢占线上 I/O。修复优先重放经过验证的事件或调用幂等接口，最后才直接 SQL；每次修复记录审批人、前后值和验证结果，修复后重新对账。", "subs": []}]}, {"title": "第 6 章 · 消息队列和可靠事件", "sections": [{"title": "消息协议和队列语义", "content": "队列带来削峰和时间隔离，也引入积压、重复、乱序和消费失败。消息应包含事件 ID、业务键、版本、发生时间、来源和幂等键。日志型队列擅长分区和回放，传统队列常强调路由和确认，数据库轮询部署简单但吞吐有限。\n\n协议还应定义 payload schema、兼容窗口、最大大小、压缩方式和敏感字段处理。事件时间、处理时间和队列时间要区分，消费者不能用本机时间推断业务顺序。分区键决定顺序和负载分布，重分区会改变并行度和回放成本，应在协议文档中固定演进规则。选择“至少一次”还是“至多一次”时，要结合副作用风险，而不是只看吞吐。", "subs": []}, {"title": "发布确认不等于业务完成", "content": "Broker 确认表示消息进入持久化位置，不表示消费者完成动作。数据库提交后发布可能丢消息，先发布再提交可能让消费者读不到事实。应使用本地事件表、可靠投递、状态查询和对账组合解决。\n\n```mermaid\nsequenceDiagram\n  participant T as 业务事务\n  participant E as 事件表\n  participant P as 投递器\n  participant Q as 队列\n  participant C as 消费者\n  T->>E: 同事务写事件\n  P->>Q: 发布 event_id\n  Q-->>P: 持久化确认\n  C->>Q: 拉取\n  C->>C: 幂等检查\n  C-->>Q: 提交位点\n```", "subs": []}, {"title": "重试和死信", "content": "超时和依赖不可用可重试，参数错误和权限失败通常不可重试。采用指数退避、随机抖动、最大次数和总时长，超限进入死信。死信保留原消息、错误分类、堆栈摘要和重放命令，避免 poison message 无限重试。\n\n重试预算应按业务时限计算，例如订单超时 15 分钟时，退避总时长不能超过该窗口。连接超时、限流、服务 5xx、参数校验和权限错误要分类，重试队列与主队列隔离，避免旧消息饿死新消息。死信重放前先修复根因，并支持按 event ID、租户或时间范围筛选和限速。", "subs": []}, {"title": "顺序和幂等", "content": "全局顺序会串行化所有分区，通常只要求同一订单、账户或设备键内有序。消费者先写幂等处理记录再产生外部副作用，或使用可恢复状态机。即使队列号称“恰好一次”，跨数据库和外部 API 仍可能重复。\n\n生产者按业务键选择分区，消费者按键串行处理并允许不同键并行。幂等记录应保存 event ID、业务键、处理结果和过期策略，过早删除会让迟到重试再次产生副作用。测试要覆盖外部调用成功但提交位点失败的窗口，确认重启后只查询或复用原结果。", "subs": []}, {"title": "积压处置", "content": "先判断积压来自流量突增、消费者变慢、下游限流还是 poison message。扩容前检查数据库连接和锁；可以降低批量、暂停低优先级主题或转移死信。积压归零后还要观察尾延迟和重试率，防止恢复操作造成二次冲击。\n\n处置顺序应先保护下游，再恢复吞吐：冻结无关发布，确认消费者实例、分区分配和单条处理耗时，必要时降低拉取批量或并发。用“最老消息年龄”和业务截止时间判断风险，比只看条数更准确。扩容后观察数据库连接、锁等待和外部 API 限流，避免消费者把积压一次性推成新的故障。", "subs": []}]}, {"title": "第 7 章 · 任务分配、发现与配置", "sections": [{"title": "任务状态和租约", "content": "任务应有待领取、处理中、成功、失败和过期状态。租约超时可回收宕机节点的任务，但过短会重复执行，过长则延迟恢复。任务带版本和幂等键，重试次数和最后错误要可查询。\n\n领取任务时写入 owner、lease_expire_at 和 fencing token，续租只允许当前 token 更新。执行者失联后，新的 owner 可以接管，但旧执行者的写入必须在存储层被拒绝。状态机要区分可重试失败、人工介入和永久失败，避免用一个“失败”状态掩盖不同处置路径。", "subs": []}, {"title": "服务发现模型", "content": "客户端发现延迟低但每种语言都要实现健康筛选；服务端发现治理集中但增加代理跳数和故障面。实例上下线需要权重、预热和摘除状态，端口可连不等于业务健康。\n\n健康检查至少分为进程存活、依赖就绪和业务可服务三层。新实例先以低权重预热，连接池建立并通过关键请求后再接收完整流量；下线先摘除、等待在途请求完成，再终止进程。客户端缓存发现结果时要设置过期和空列表保护，避免注册中心抖动导致全量拒绝。", "subs": []}, {"title": "配置发布、灰度和回滚", "content": "配置中心应提供版本、校验、灰度和审计。客户端校验快照后原子替换；中心不可用时使用最后有效版本。超时、限流和路由等高风险配置要支持过期或人工刹车。\n\n灰度按实例、租户或请求标签逐步扩大，并同时比较错误率、P99、连接数和下游压力。配置 schema 变更先兼容旧客户端，再切换默认值；回滚不仅恢复文件，还要撤销已经触发的任务或路由。中心恢复后比较本地版本，不能盲目覆盖进程当前生效配置。", "subs": []}, {"title": "fencing token 防止双重执行", "content": "心跳丢失可能是网络分区而非实例故障。租约重新分配时递增 token，存储层拒绝旧 token 写入，可避免旧持有者继续执行。监控要区分心跳延迟、租约过期和实际业务失败。\n\ntoken 必须由单调递增且持久化的 owner 服务签发，并随每次写入传到最终存储；只在应用内比较 token 没有保护作用。任务执行过程中若续租失败，应立即停止产生副作用，不能等任务自然结束。验收时隔离持有旧 token 的节点，确认数据库、对象存储或队列入口都拒绝它的写入。", "subs": []}]}, {"title": "第 8 章 · ZooKeeper、Raft 与集群算法", "sections": [{"title": "协调服务的职责边界", "content": "协调服务适合保存小型元数据、成员、选主和配置，不适合大业务数据。节点通常采用奇数形成多数派；磁盘延迟、网络抖动和时钟会影响提交和选举。客户端重连后必须重建临时节点和监听器。\n\n把业务状态写入协调服务会受到单条数据大小、watch 数量和多数派写延迟限制，也让恢复顺序变得含糊。建议只保存 owner、epoch、配置版本等可重建元数据，事实数据仍放数据库或日志。升级前检查快照、磁盘水位、客户端 session 数量和监听器风暴风险。", "subs": []}, {"title": "多数派和网络分区", "content": "只有多数侧能继续提交，少数侧应拒绝写入或只读。为“可用”让两侧都写会产生冲突。文档要写明 quorum、超时、成员变更和数据恢复流程。\n\n三节点集群可容忍一个节点故障，五节点可容忍两个，但跨地域部署还要考虑链路延迟和仲裁位置。少数侧必须有明确的拒写信号，客户端重试应识别该错误并避免把流量打向另一组孤立节点。恢复时先确认唯一多数侧，再让落后节点追日志，不能同时启动两套集群。", "subs": []}, {"title": "Raft 角色和日志", "content": "Raft 节点分为 Leader、Follower、Candidate。Leader 复制日志，多数确认后提交；任期和日志索引拒绝旧 Leader 写入。监控选举次数、任期变化、提交延迟、日志堆积和成员健康。\n\n```mermaid\nstateDiagram-v2\n  [*] --> Follower\n  Follower --> Candidate: 选举超时\n  Candidate --> Leader: 获多数票\n  Candidate --> Follower: 发现高任期\n  Leader --> Follower: 发现高任期\n```", "subs": []}, {"title": "成员变更和脑裂", "content": "成员变更应一次只替换有限节点，等待日志追平后再继续。恢复节点先清理旧状态、校验日志并同步，禁止直接把未知数据目录加入集群。旧成员隔离必须有 fencing，不能只依赖服务发现更新。\n\n成员变更期间要监控 joint consensus 或等价过渡状态、日志追平速度和选举次数。磁盘更换、IP 变化和证书轮换都应按“加入观察、追平、提升、移除旧成员”执行，并保留快照。发生脑裂迹象时先冻结成员变更和写入，再确认 epoch 与多数派，避免边修复边扩大拓扑。", "subs": []}, {"title": "协调故障下的降级", "content": "短时不可用时可用最后快照继续读，但失去租约后不应继续承担唯一写主。配置读取可缓存，权限变更和领导权通常应暂停。恢复后检查监听器、临时节点和领导权是否重建。\n\n降级策略必须按数据风险分级：静态配置和服务发现可使用有时效的快照，租约、锁和主从 owner 不能靠旧快照继续写。客户端要暴露“快照年龄”和“租约有效”状态，让上层决定返回只读、排队或失败。协调服务恢复后逐项验证 session、watch、临时节点和 leader epoch。", "subs": []}]}, {"title": "第 9 章 · 迁移、重平衡与运行闭环", "sections": [{"title": "迁移前建立基线", "content": "统计各分片记录数、字节量、热点键、读写比例、跨片查询、复制延迟和备份状态，保存为迁移前基线。还要清点报表脚本、离线任务和人工 SQL 等隐式依赖。\n\n基线应覆盖至少一个业务高峰和一个低峰，并保留采集时间、查询版本和采样误差。除技术指标外，还要记录租户等级、数据驻留要求、索引大小和预计迁移窗口。没有基线就无法判断迁移造成的延迟回归，事后也无法区分原有热点和新引入热点。", "subs": []}, {"title": "回填、双写和双读校验", "content": "迁移顺序通常是建新结构、回填历史、开启双写、校验、双读比对、小流量切换、全量切换和旧路径下线。双写失败进入可重试队列；差异按字段、版本和时间分类，不能简单用新结果覆盖旧结果。\n\n回填任务使用主键范围或变更位点断点续跑，避免全表长事务。双写阶段把旧写入和新写入的 event ID 关联，双读只做采样或影子流量，不把比较逻辑放在用户请求关键路径。差异达到阈值时自动暂停切换，并保留旧路径读能力用于回滚。", "subs": []}, {"title": "重平衡流量控制", "content": "迁移同时消耗网络、磁盘、CPU 和复制带宽。设置并发、每秒字节数、磁盘水位、业务延迟和复制落后阈值，达到条件自动暂停。先迁移小分片或非核心租户，再扩大范围。\n\n令牌桶或分时窗口可以限制迁移速率，但必须与业务优先级联动：核心租户高峰期暂停，低峰期提高配额。暂停后记录最后完成的 chunk 和校验结果，恢复时从断点继续，不能重复扫全量数据。迁移指标要与线上 SLO 对齐，单独看“迁移完成百分比”容易掩盖用户延迟。", "subs": []}, {"title": "版本化路由和 owner", "content": "映射带 epoch，旧版本写入在存储层被拒绝。切换顺序是建立新 owner、刷新路由、撤销旧 owner。读请求可短时兼容旧分片，写请求必须只有一个 owner。\n\n切换前先让新 owner 追平回填和增量日志，再发布路由版本；旧 owner 进入 draining 状态，只处理已建立连接的读请求。路由和存储返回的 epoch 应写入日志，便于定位“客户端缓存旧路由”与“存储拒绝旧版本”的比例。发现双 owner 或 epoch 倒退时立即冻结迁移。", "subs": []}, {"title": "回滚与差异保留", "content": "回滚应回到上一个明确版本，保留新路径产生的事件和差异，不能直接删除新表。停止新流量、冻结映射、导出差异并决定是否反向回放，回滚本身也要演练。\n\n回滚决策需有时间窗和数据策略：若新路径只读异常，可恢复旧读；若新路径已接收写入，则先导出新旧差异，确定以事件重放还是人工对账合并。旧表和新表都保留足够日志，直到业务确认差异清零，避免“回滚成功但丢了切换期间数据”。", "subs": []}, {"title": "指标、告警和验收", "content": "关注复制延迟、分片倾斜、跨片比例、消息速率、积压年龄、死信、选举次数、租约过期、路由版本和迁移进度。告警要关联业务影响，例如积压年龄超过订单超时比固定条数更有意义。\n\n```mermaid\nflowchart TD\n  B[建立基线] --> T[小范围迁移]\n  T --> O{指标正常?}\n  O -->|否| P[暂停并回滚路由]\n  O -->|是| E[扩大范围]\n  E --> V[数据和业务校验]\n  V --> C{通过?}\n  C -->|否| P\n  C -->|是| D[下线旧路径]\n```", "subs": []}, {"title": "运维 Runbook 的最小字段", "content": "复制切换、分片迁移、消费者扩容和协调服务变更都应记录前置检查、操作命令、观察指标、暂停条件、回滚步骤和完成校验。自动化脚本支持 dry-run、幂等和审计输出，并先在非核心集群演练。\n\nRunbook 还应标注负责人、所需权限、预计耗时、影响范围和升级联系人。每一步写出可观察的成功条件，例如“复制回放位点落后小于阈值并持续五分钟”，而不是只写“检查同步”。命令输出、路由版本和审批单号作为附件保存，便于事后复盘和重复执行。", "subs": []}, {"title": "案例：订单和支付事件链路", "content": "订单库按用户分片，支付服务保存支付事实，支付成功通过事件通知订单。支付服务在本地事务中写事实和事件表，投递器发布事件，订单消费者按 event ID 幂等更新状态。重复通知不重复扣库存，消费者宕机由租约回收，对账任务负责发现跨服务差异。\n\n验收覆盖支付库切换、投递器宕机、消息重复、消费者提交位点前宕机、热点用户和分片迁移，并记录最终状态、RPO/RTO、告警和恢复动作。", "subs": []}, {"title": "案例：分片集群扩容", "content": "新分片建立版本映射后迁移低风险租户，旧分片继续承担读流量，写入由 owner token 约束。校验记录数、校验和与业务抽样结果后切换读流量；新分片延迟升高时暂停迁移，不用追赶进度掩盖资源瓶颈。\n\n该案例的关键不是“增加机器”，而是把迁移拆成可暂停状态：准备、回填、追增量、影子读、切换和清理。每个状态都有进入条件、指标阈值和回滚动作；例如影子读差异超过千分之一时回到追增量，不允许直接全量切换。扩容后重新计算连接池、备份窗口和跨片查询 fan-out，确认容量收益没有被新瓶颈抵消。", "subs": []}, {"title": "自测与评审清单", "content": "1. 如何证明读写分离下的写后读看到了自己的写入？\n2. 为什么备份不能替代实时切换，复制不能解决误删？\n3. Hash、范围和一致性哈希分别牺牲了什么？\n4. 消费者提交位点前宕机，怎样避免副作用重复？\n5. 协调服务失去多数派时哪些操作必须暂停？\n6. 分片迁移的暂停条件和回滚证据是什么？\n\n最终评审关注事实源、失败恢复、路由可观测性和操作可暂停性，而不是分布式组件数量。\n\n#### 访问契约工作表\n\n对每个实体填写以下字段，避免容量估算和一致性讨论停留在口号层面：\n\n- 主键和业务唯一键分别是什么；\n- 最高频的三个读请求及其过滤条件；\n- 写入是否允许重试，重试后如何识别重复；\n- P50、P95、P99 延迟目标和超时上限；\n- 高峰期 QPS、并发事务数和批处理窗口；\n- 数据保留、归档、删除和合规导出要求；\n- 允许读旧数据的最长时间；\n- 数据损坏时可以接受的 RPO 和恢复方式。\n\n把工作表放入评审材料后，数据库、消息和缓存的选择就能基于同一组事实讨论。任何未填写字段都应被记录为风险，而不是默认为“后续再看”。\n\n#### 选型验证实验\n\n选型不要只比较厂商的基准数字。应使用接近生产的记录大小、索引、事务比例和故障注入，至少完成以下实验：\n\n1. 正常负载下的 P99 和磁盘队列；\n2. 副本落后时的读延迟和主库压力；\n3. 节点重启、网络抖动和磁盘满时的错误率；\n4. 全量备份和时间点恢复耗时；\n5. 数据增长到目标容量 70% 时的迁移窗口。\n\n实验结果应保存原始监控和查询计划，不能只在文档里写“性能满足要求”。\n\n#### 复制延迟排障路径\n\n当读请求返回旧值时，值班人员按以下顺序缩小范围：\n\n1. 确认请求实际命中的副本和路由版本；\n2. 比较主库提交位点、发送位点、接收位点和回放位点；\n3. 检查副本是否存在长事务、锁等待或大批量回放；\n4. 检查副本磁盘延迟、IOPS、网络丢包和 CPU steal；\n5. 暂时将关键读绑定主库并记录主库增量压力；\n6. 延迟恢复后验证副本数据和缓存是否重新一致。\n\n排障期间不要直接重建副本。重建会增加主库读盘和网络负担，只有确认日志无法追平或数据损坏时才执行。\n\n#### 复制切换前置检查\n\n切换前至少输出一份机器可读的检查结果：\n\n- 候选副本处于可写保护状态；\n- 复制延迟低于目标阈值；\n- 备份和日志保留覆盖回退窗口；\n- 应用连接池、服务发现和 DNS TTL 已确认；\n- 旧主具备 fencing 手段；\n- 监控、告警和审计系统已切换到新角色。\n\n检查项任何一项不满足，都应进入人工评审。自动化切换最怕“部分成功”：角色切了但连接、监控和权限仍指向旧主。\n\n#### 备份恢复验收记录\n\n每次恢复演练记录以下时间点：备份开始、备份完成、恢复实例可连接、日志重放完成、数据校验完成、业务只读开放和流量切换。再记录恢复前后表数量、关键账本汇总、最大数据差异和人工修复数量。\n\n恢复验证要包含一个故意删除的测试记录，证明能够恢复到删除前的时间点，而不仅是把最近快照重新挂载。生产备份的访问权限和密钥轮换也应在演练中验证。\n\n#### 分片键评估矩阵\n\n对候选分片键分别打分：分布均匀性、主要查询覆盖、更新稳定性、跨片概率、热点风险和迁移难度。用户 ID 通常利于用户域查询，但大客户会形成热点；时间键利于归档，却可能让新写入集中在末端；随机 ID 分布好，但范围扫描代价高。\n\n不要只用当前样本数据评估。应把未来一年最大租户、节日峰值和历史回放加入模拟，否则上线后才发现某个租户占据半数流量。\n\n#### 跨片查询的预算\n\n跨片请求设置明确的并行度、单片超时和总超时。一个分片失败时，接口应选择部分结果、降级为空还是整体失败。对运营报表可以异步汇总，对在线交易则应避免无界广播。\n\n全局排序要记录结果是否精确。若使用 Top-K 合并，每片只返回 K 条可能丢失边界数据；若必须精确，就需要更大返回集和更高网络成本。产品和运维应共同确认这个取舍。\n\n#### 事务模式选择问题\n\n评估跨服务事务时，逐项回答：\n\n- 是否存在一个可以成为事实源的服务；\n- 中间状态是否能被用户理解；\n- 补偿动作是否真正可逆；\n- 是否需要锁住资源，锁多久；\n- 协调者宕机时谁负责恢复；\n- 对账频率和人工修复上限是多少。\n\n如果所有问题都回答“必须原子提交”，才考虑 2PC；否则优先本地事务、可靠事件和补偿。强行使用 2PC 不能消除业务语义，只会把等待转移到协调器。\n\n#### 本地事件表运维字段\n\n事件表至少包含事件 ID、业务键、聚合版本、状态、重试次数、下一次投递时间、最近错误、创建时间和更新时间。投递器按状态和时间索引扫描，成功后保留一段观察期再归档。\n\n事件表增长速度应纳入容量模型。清理任务必须分批执行、可暂停，并在删除前确认下游已完成消费和对账，否则清理会破坏重放能力。\n\n#### 消费者幂等实现\n\n最可靠的做法是把幂等记录和业务状态写在同一事务中。若外部 API 无法参与事务，则记录请求 token、响应摘要和重试状态，超时后先查询外部结果再决定是否重试。\n\n幂等表需要唯一索引保护并发重复。唯一冲突应被识别为“已处理”而不是错误重试；指标上单独统计重复事件，帮助发现上游投递或网络问题。\n\n#### 积压年龄而非条数\n\n队列有一万条消息并不一定危险，关键是最老消息的年龄是否超过业务 SLA。应监控 oldest message age、生产速率、消费速率、失败率和预计清空时间。预计清空时间可按 `(积压量)/(有效消费速率-生产速率)` 估算。\n\n积压处理时要先保护下游。消费者并发翻倍可能让数据库锁等待和接口超时同时升高，最终有效消费速率反而下降。扩容应配合连接池、批量大小和限流联动调整。\n\n#### 租约超时调参\n\n租约时间应覆盖正常 GC、网络抖动和最长一次业务处理，并留出续租余量。过短造成频繁抢占，过长造成故障任务迟迟不恢复。用历史处理时延的 P99 和故障演练数据调参，不要直接采用默认值。\n\n#### 配置回滚演练\n\n配置发布先在一小组实例灰度，记录错误率、延迟和资源指标。发现异常时回滚配置版本，而不是重启全部实例。客户端应在拉取到非法配置时拒绝加载并继续使用旧快照。\n\n对限流、路由和超时配置设置最大值和最小值校验，防止一次误操作关闭保护或把超时设为无限。配置变更审计需包含操作者、原因、工单和影响范围。\n\n#### Raft 集群健康检查\n\n检查 Leader 是否稳定、Follower 是否持续追平、选举是否频繁、提交延迟是否升高。成员磁盘满、时钟异常和网络抖动都可能表现为选举增加，因此告警要关联底层资源指标。\n\n成员变更采用逐步替换，先加入新节点并等待日志追平，再移除旧节点。变更窗口内禁止同时进行大规模数据迁移和版本升级，以免无法区分故障来源。\n\n#### 多数派丢失时的操作边界\n\n失去多数派时允许读取最后一致快照，但暂停选主、配置写入、租约续期和分片 owner 变更。恢复多数派后先确认任期和日志，再恢复写流量。任何“临时强制单节点启动”的动作都必须有数据丢失声明和审批。\n\n#### 迁移校验方法\n\n全量校验可以比较记录数、分片大小和按主键范围计算的校验和；抽样校验检查金额、状态、时间戳和关联 ID。校验必须在双写稳定后重复执行，避免只验证迁移开始时的一致性。\n\n差异结果按“源缺失、目标缺失、字段不同、版本落后”分类。每类差异都要有处理责任人和截止时间，不能用一个总差异数掩盖高风险字段问题。\n\n#### 重平衡暂停条件\n\n建议将业务 P99、复制延迟、磁盘水位、网络带宽和错误率组合成暂停条件。例如业务 P99 连续五分钟超过基线 20%，或复制延迟超过 RPO，即自动暂停迁移。暂停后保留现场指标，便于复盘。\n\n#### 路由版本回退\n\n路由发布采用单调递增版本，客户端拒绝回退到未知版本。需要回退时由控制面发布一个明确的旧版本，并保留新版本产生的写入差异。切换期间禁止人工修改单个实例的本地路由，避免形成不可见分叉。\n\n#### 分布式系统故障注入清单\n\n至少注入副本网络隔离、单分片磁盘满、消息 broker 重启、消费者重复启动、协调节点失联、配置中心不可用和迁移任务中断。每次注入都记录检测时间、业务影响、自动动作、人工动作和恢复时间。\n\n故障注入应先在影子流量或测试集群完成，再在低峰期对非核心租户执行。没有回滚和观察窗口的实验不应直接安排在生产核心链路。\n\n#### 订单支付案例的状态表\n\n订单状态至少区分 CREATED、PAYING、PAID、CANCELLED 和 RECONCILING，支付状态区分 INIT、SUCCESS、FAILED 和 UNKNOWN。UNKNOWN 不能直接当作失败，因为支付网关可能已经成功。\n\n状态转移由事件 ID 和版本约束，旧版本事件不得覆盖新状态。对账任务发现订单 PAID、支付 UNKNOWN 时，先查询支付事实，再执行幂等补偿，而不是直接改订单字段。\n\n#### 扩容后的容量复核\n\n分片扩容完成后重新计算单分片 CPU、磁盘、连接和副本带宽余量，确认迁移产生的临时空间已经释放。观察窗口内保留旧分片只读副本，确保可以追查切换前后的差异。\n\n容量复核还应检查运维成本：备份窗口是否变长、监控时序数量是否翻倍、发布和故障切换步骤是否增加。如果容量增加却让恢复时间超过 RTO，扩容方案并未真正完成。\n\n#### 数据生命周期表\n\n为每类数据记录创建、热读、冷读、归档和删除阶段。热数据留在在线库，冷数据迁移到低成本存储，但查询入口要明确是否允许跨层访问。删除策略应包含软删、延迟清理、合规保留和恢复窗口。\n\n生命周期变化会影响索引、备份和消息保留。归档任务要限速并避开业务高峰，删除前生成可审计清单，删除后抽样确认对象存储和搜索索引没有残留。\n\n#### 数据所有权检查\n\n每个字段只能有一个权威写入方，其余系统保存派生值或缓存。跨服务直接写同一张表会让迁移、审计和故障恢复无法判断谁的值正确。所有权变更需要版本、双写窗口和回收旧写入权限。\n\n#### 慢查询与存储扩展联动\n\n分片不能替代索引和查询优化。扩容前先查看慢查询、执行计划、锁等待和缓存命中，确认瓶颈确实是单机容量或写入上限。无效查询被复制到十个分片后，网络和数据库负担会同时放大。\n\n#### 主库保护策略\n\n主库是写路径和复制源，应设置连接上限、写入限流、长事务阈值和危险语句拦截。副本延迟超过阈值时自动摘除读流量，避免副本返回过旧数据。主库保护规则要有白名单和紧急解除流程。\n\n#### 副本重建步骤\n\n重建副本前确认主库剩余磁盘、网络带宽和备份可用性。优先从最近快照恢复，再追日志；重建期间不要把新副本加入读池。追平后先执行抽样校验，再逐步放量，观察延迟和错误率。\n\n#### 分片热点识别\n\n按分片记录 QPS、写入字节、锁等待和最热业务键。平均值正常不代表没有热点，单个租户或时间桶可能占据大部分流量。热点治理可以拆租户、增加虚拟桶、读缓存或限制单键并发。\n\n#### 分片键变更\n\n分片键不能原地修改。新键需要新表或新集群、历史回填、双写和路由切换。变更期间旧键仍用于读取旧数据，新键用于新 owner；所有事件携带两个键直到旧路径下线。\n\n#### 分布式锁边界\n\n分布式锁适合短暂互斥，不适合包住长事务和外部调用。锁必须有租约、续租、持有者 token 和超时后的 fencing。锁服务不可用时应明确失败关闭还是降级执行，不能让每个客户端自行猜测。\n\n#### 幂等键生命周期\n\n幂等记录保留时间要覆盖最大重试窗口、消息回放窗口和人工补偿窗口。过早删除会让旧消息再次产生副作用；永久保留则会造成存储增长。可按业务时间分区并对历史记录做压缩或归档。\n\n#### 消息顺序验证\n\n测试同一业务键的并发更新、消费者扩缩容和分区迁移，检查版本号是否单调。顺序保证只在声明的键范围内有效，跨键的全局顺序不要写进业务假设。发现乱序时记录旧事件而不是静默覆盖。\n\n#### 死信重放流程\n\n重放前先修复根因，确认目标消费者版本和下游容量。按时间或业务键小批量重放，保留原 event ID 并增加 replay ID，避免无法区分原始投递。重放结果再次进入对账，而不是以队列成功作为最终证据。\n\n#### 消息保留和回放成本\n\n保留周期由恢复、审计和离线重算需求决定。延长保留会增加磁盘、跨区复制和索引成本；缩短保留则可能无法重建派生数据。定期演练从保留日志重建一个非核心索引，验证格式兼容和实际耗时。\n\n#### 配置与数据版本协同\n\n路由或 schema 变更时，先让消费者兼容新旧格式，再发布生产者。消息带 schema version，消费者拒绝未知版本并进入隔离队列。配置回滚不能把已经发布的新版本数据解释成旧格式，必须保留兼容读路径。\n\n#### Schema 迁移顺序\n\n采用 expand、migrate、contract：先增加兼容字段，再回填和双读，最后停止旧字段写入并清理。每一步都有观测和回滚窗口。大表变更需控制锁时间，优先使用在线 DDL 或影子表切换。\n\n#### 连接池与分片数量\n\n分片数增加会按实例复制连接池，应用连接总量可能线性增长。路由层应按实际访问分片建立连接，限制空闲连接，并在分片故障时避免连接风暴。扩容前计算最坏情况下的总连接数。\n\n#### 跨地域数据访问\n\n跨地域读写需明确延迟、数据驻留和故障切换语义。就近读降低延迟，却可能读到旧副本；跨区写增强一致性，却把 WAN 抖动引入交易路径。按数据重要性分级，关键账本优先保证单一写主。\n\n#### 对账任务的限速\n\n对账扫描不能与在线查询争抢资源。按租户、时间窗口和分片分批执行，设置最大 CPU、IO 和数据库连接占用。发现差异先记录再修复，修复任务单独限速并支持暂停。\n\n#### 观测标签设计\n\n所有复制、消息和协调指标至少带 cluster、role、shard、region、version 标签。避免把业务 ID 直接作为高基数标签，可在日志和追踪中保留。告警消息要包含当前 owner、路由版本和最近变更。\n\n#### 故障复盘结构\n\n复盘按时间线、检测、决策、数据影响、恢复和预防措施组织。区分组件故障与设计假设失效，例如“副本在线”不等于“副本可安全提升”。预防措施要有负责人、截止时间和验证方式。\n\n#### 存储变更单模板\n\n变更单必须写明目标数据集、影响分片、预计读写增量、备份版本、开始和结束条件。执行人先运行 dry-run，输出将修改的表、路由和副本，再由第二人复核。窗口内每十五分钟记录业务延迟、错误率和复制位点。\n\n变更完成后执行数据抽样、连接池检查和监控面板确认。若指标超过阈值，立即停止后续批次，保留现场日志和位点。变更单关闭前必须附上实际耗时和差异结果。\n\n#### 读写路由测试矩阵\n\n测试矩阵覆盖首次读取、写后读、跨请求读取、会话切换、主库不可用和副本延迟六类场景。每个场景记录路由目标、响应版本、延迟和错误码。测试还要验证连接池复用不会把主库连接误用于普通读流量。\n\n#### 数据库代理故障\n\n代理不可用时，应用应能切换到备用代理或明确失败，而不是无限重试。代理重启会导致连接重建和瞬时洪峰，需要连接退避、最大重连速率和实例预热。代理的路由缓存也要有版本和过期策略。\n\n#### 复制链路安全\n\n跨网络复制使用加密和双向认证，密钥轮换要支持新旧证书重叠。复制账号只拥有必要权限，禁止复用业务管理员账号。审计记录应包含复制拓扑变更、提升和降级操作。\n\n#### 备份不可变性\n\n备份存储应限制删除和覆盖权限，防止勒索或误操作同时破坏在线库和备份。定期验证备份校验和、对象版本和密钥可用性。不可变策略也要设置合理保留，避免成本失控。\n\n#### 分片容量告警\n\n容量告警按预测剩余天数和增长斜率触发，而非只看当前百分比。单分片达到 60% 时开始规划，70% 时完成扩容演练，80% 时禁止无计划大表写入。磁盘水位还要考虑回填和重建索引的临时空间。\n\n#### 跨片事务监控\n\n记录事务涉及的分片数量、准备耗时、提交耗时、超时和悬挂状态。跨片比例持续上升说明领域边界或分片键可能不合理。超过阈值的请求应进入离线流程，而不是继续放大在线尾延迟。\n\n#### 事件版本兼容\n\n生产者新增字段必须保持消费者向后兼容，删除字段要经过完整保留窗口。Schema 注册表或代码校验在发布阶段阻断不兼容变更。未知版本消息进入隔离队列，禁止消费者猜测字段含义。\n\n#### 消息时间语义\n\n事件时间、入队时间和消费时间要分别记录。用消费时间计算延迟会掩盖生产端积压；用事件时间做业务排序时要处理客户端时钟偏差。跨地域场景统一使用 UTC，并在展示层转换时区。\n\n#### 消费者扩缩容\n\n扩容前确认分区数和下游连接上限，分区不足时增加消费者不会增加吞吐。缩容要先停止领取新消息，等待处理中任务完成，再释放租约。滚动升级期间保留至少一个兼容旧格式的消费者版本。\n\n#### 协调节点磁盘维护\n\n协调节点磁盘应使用低延迟设备并监控 fsync 延迟。磁盘维护采用逐节点替换，确保始终保留多数派。快照和日志压缩不能与成员变更同时进行，避免恢复窗口不可控。\n\n#### 服务发现缓存失效\n\n实例列表缓存过期后，客户端可进入短暂 stale-while-revalidate，但不能无限使用失效地址。健康检查失败要区分连接失败、业务错误和版本不兼容。大规模实例波动时，服务发现应使用抖动和批量通知防止重连风暴。\n\n#### 配置中心灾难恢复\n\n配置快照需要跨区域复制并定期导出。中心完全不可用时，客户端从本地最后有效快照启动；快照过期超过安全窗口则拒绝高风险写操作。恢复后比较中心版本和本地版本，防止旧快照覆盖新配置。\n\n#### 迁移期间的权限\n\n迁移账号只拥有源读取、目标写入和校验所需权限，禁止删除源表。切换完成并经过观察窗口后再回收旧权限。权限回收也需要审计，避免脚本继续使用旧凭证。\n\n#### 迁移期间的成本监控\n\n记录迁移产生的额外网络、IOPS、快照和临时存储成本。跨区迁移可能产生显著流量费用，成本预算应和暂停阈值一起写入方案。成本异常时优先降低迁移速率，不要等预算耗尽才停止。\n\n#### 恢复后的缓存和索引\n\n恢复事实库后，缓存应按依赖顺序重建或主动失效，不能直接把旧缓存当作真值。搜索索引和报表是派生数据，可从事件日志重放，但要限制回放速率并标记重建进度。业务开放前检查关键查询是否命中新版本。\n\n#### 运维权限和双人复核\n\n提升主库、修改分片映射、删除消息和重放死信都属于高风险操作。使用短时授权、双人复核和命令审计，紧急操作也要在事后补齐记录。Runbook 中明确哪些步骤可以自动执行，哪些必须人工确认。\n\n#### 最终验收证据\n\n验收包应包含架构图、访问契约、容量模型、复制和消息指标、故障演练记录、备份恢复结果、迁移差异报告和回滚演练结果。每个关键结论引用一个可复现的查询、压测或演练，而不是只引用经验。", "subs": ["访问契约工作表", "选型验证实验", "复制延迟排障路径", "复制切换前置检查", "备份恢复验收记录", "分片键评估矩阵", "跨片查询的预算", "事务模式选择问题", "本地事件表运维字段", "消费者幂等实现", "积压年龄而非条数", "租约超时调参", "配置回滚演练", "Raft 集群健康检查", "多数派丢失时的操作边界", "迁移校验方法", "重平衡暂停条件", "路由版本回退", "分布式系统故障注入清单", "订单支付案例的状态表", "扩容后的容量复核", "数据生命周期表", "数据所有权检查", "慢查询与存储扩展联动", "主库保护策略", "副本重建步骤", "分片热点识别", "分片键变更", "分布式锁边界", "幂等键生命周期", "消息顺序验证", "死信重放流程", "消息保留和回放成本", "配置与数据版本协同", "Schema 迁移顺序", "连接池与分片数量", "跨地域数据访问", "对账任务的限速", "观测标签设计", "故障复盘结构", "存储变更单模板", "读写路由测试矩阵", "数据库代理故障", "复制链路安全", "备份不可变性", "分片容量告警", "跨片事务监控", "事件版本兼容", "消息时间语义", "消费者扩缩容", "协调节点磁盘维护", "服务发现缓存失效", "配置中心灾难恢复", "迁移期间的权限", "迁移期间的成本监控", "恢复后的缓存和索引", "运维权限和双人复核", "最终验收证据"]}]}, {"title": "第 10 章 · 机制实验与案例深化", "sections": [{"title": "实验：用复制位点证明读后写一致性", "content": "不要用“等待两秒”证明副本已经同步。写入时记录主库返回的提交位点（GTID 或日志序号），读请求携带该位点；路由层选择回放位点不小于令牌的副本，没有满足条件时回源主库并记录 fallback。这样可以把一致性从经验时间窗变成可观测协议。\n\n```mermaid\nsequenceDiagram\n  participant A as API\n  participant M as 主库\n  participant R as 副本\n  A->>M: 写入 order=42\n  M-->>A: commit_token=8f:120\n  A->>R: 读取(token=8f:120)\n  R-->>A: replay=8f:118\n  A->>M: fallback 读取\n  M-->>A: 返回 order=42\n```\n\n验收包括：副本落后时不返回旧状态；fallback 比例有独立指标；令牌格式错误时明确失败而非静默访问任意副本。", "subs": []}, {"title": "实验：模拟半同步复制降级", "content": "在三节点测试集群中隔离一个副本，观察半同步提交是否转为异步、写延迟和 RPO 告警。恢复网络后确认副本追平并检查复制模式是否恢复。记录 commit latency、同步副本数、发送/回放位点和写入失败率；若 RPO 不满足仍接受高价值写入，必须明确这是产品选择并配套账本补偿。\n\n```bash\n# 仅在临时测试环境执行\nsudo tc qdisc add dev eth0 root netem loss 100%\nmysql -h 127.0.0.1 -P3306 -e \"SHOW MASTER STATUS;\"\nmysql -h 127.0.0.1 -P3306 -e \"SHOW STATUS LIKE 'Rpl_semi_sync%';\"\nsudo tc qdisc del dev eth0 root\n```", "subs": []}, {"title": "案例：千万学生系统的冷热分层", "content": "学生主数据、考试结果、登录记录和头像不应共用同一张大表。关系库存放学生与考试事实，头像进入对象存储，登录记录按月分区并在三个月后归档，检索需求通过异步索引提供。\n\n| 数据 | 事实源 | 热周期 | 冷周期 | 恢复优先级 |\n| --- | --- | --- | --- | --- |\n| 学生主数据 | OLTP | 全生命周期 | 不适用 | 最高 |\n| 考试结果 | OLTP | 在校期间 | 归档只读 | 高 |\n| 登录记录 | 分区表 | 3 个月 | 对象/日志 | 中 |\n| 头像 | 对象存储 | 30 天缓存 | 低频对象 | 中 |\n\n迁移按学校或月份分批执行，归档前生成行数和校验和。恢复演练还要验证对象 URL、索引重建和学生登录链路，不能只证明数据库能连接。", "subs": []}, {"title": "分片路由的三种实现与故障面", "content": "静态客户端路由无中心依赖但每次变更都要发布应用；配置中心路由集中管理、支持版本化，却引入中心故障和缓存过期；代理转发对应用透明，但代理成为连接和网络瓶颈。三种方式都需要 owner token 和本地快照。\n\n```mermaid\nflowchart LR\n  C[客户端路由] --> S1[分片 A]\n  D[配置中心+快照] --> S2[分片 B]\n  P[路由代理] --> S3[分片 C]\n  D -. epoch .-> C\n```\n\n路由缓存过期时读可以短暂使用 stale 版本并打标，写必须重新获取映射；配置中心不可用且快照超过安全期限时拒绝高风险写入。验收时删除一个映射，确认客户端报警并停止错误写入，而不是落到默认分片。", "subs": []}, {"title": "实验：分片迁移的双写和校验", "content": "迁移脚本应把每批定义为状态机：`PENDING -> COPYING -> VERIFIED -> SWITCHED -> CLEANED`。控制库记录源范围、目标分片、最后主键、校验和、版本和操作者；重启后从最后游标继续。\n\n```mermaid\nstateDiagram-v2\n  [*] --> PENDING\n  PENDING --> COPYING: 建立目标\n  COPYING --> VERIFIED: 校验通过\n  COPYING --> PENDING: 超时重试\n  VERIFIED --> SWITCHED: 发布新 epoch\n  SWITCHED --> CLEANED: 观察窗口结束\n  SWITCHED --> VERIFIED: 回退路由\n```\n\n全量计数、分段校验和与业务抽样必须同时执行。双写任一侧失败进入补偿队列，切换后保留新旧差异至少一个完整重试窗口。\n\n```sql\nSELECT shard_id, COUNT(*) AS rows,\n       SUM(CRC32(CONCAT(id, status))) AS checksum\nFROM orders WHERE id >= 100000 AND id < 110000 GROUP BY shard_id;\n```", "subs": []}, {"title": "2PC 与 Saga 的时序对照", "content": "2PC 在 PREPARED 状态持锁等待协调者；协调者崩溃时，运维必须查询悬挂事务并决定提交或回滚。3PC 增加预提交阶段，但网络分区下仍可能产生分歧，不能当作无阻塞替代品。\n\n```mermaid\nsequenceDiagram\n  participant O as 协调者\n  participant A as 库存库\n  participant B as 订单库\n  O->>A: PREPARE\n  O->>B: PREPARE\n  A-->>O: READY\n  B-->>O: READY\n  O->>A: COMMIT\n  O->>B: COMMIT\n```\n\nSaga 把步骤提交为本地事务并定义补偿；库存扣减成功而支付失败时可释放库存，短信发送则只能发送撤销通知。监控补偿延迟、悬挂状态和人工介入数，并用对账确认最终状态。", "subs": []}, {"title": "消息可靠性：从生产到副作用的证据链", "content": "生产者确认、Broker 持久化、消费者提交位点和业务副作用是四个不同事实。事件应贯穿记录 `published_at`、`persisted_at`、`handled_at`、`effect_at`。\n\n```mermaid\nflowchart LR\n  T[本地事务] --> E[事件表]\n  E --> P[投递器]\n  P --> Q[持久队列]\n  Q --> C[消费者]\n  C --> I[幂等表]\n  I --> X[外部副作用]\n```\n\n消费者推荐“校验版本 -> 幂等占位 -> 更新事实 -> 提交位点”。外部 API 超时先用幂等 token 查询结果；死信重放保留原 event_id 并增加 replay_id，重放结果再次进入对账。", "subs": []}, {"title": "案例：消息队列方案评估", "content": "课程案例比较 Kafka、RabbitMQ 和自研集群。运维决策不能只看吞吐，还要量化 JVM 维护能力、监控接入、消息是日志回放还是业务可靠投递，以及单机房故障的 RPO。\n\n| 维度 | Kafka | RabbitMQ | 自研集群 + MySQL |\n| --- | --- | --- | --- |\n| 主要语义 | 分区日志、回放 | 路由、确认、队列 | 业务定制、轮询 |\n| 运维准备度 | 依赖 JVM/生态 | 组件较熟 | 可融入 MySQL 体系 |\n| 主要风险 | 分区与磁盘扩容 | 堆积与镜像成本 | 自研故障与测试投入 |\n| 适用判断 | 高吞吐事件流 | 低延迟业务消息 | 特殊协议且团队可维护 |\n\n评审至少要求目标峰值 P99、Broker/数据库故障行为、死信重放耗时三组证据。自研方案若无法在团队规模下完成值守，即使功能满足也不应上线。", "subs": []}, {"title": "ZooKeeper 临时节点选主实验", "content": "ZooKeeper 选主的本质是竞争同一个 ephemeral znode。创建成功者成为 Leader，其他节点 watch 删除事件并重试；watch 是一次性通知，重连后必须重新读取并注册。\n\n```bash\nzkCli.sh -server zk-1:2181\ncreate -e /ops/leader server-a\nget /ops/leader\ndelete /ops/leader\n```\n\n业务节点成为 Leader 后仍要获得租约 token，并在每次写入时携带。会话过期、网络隔离或进程暂停可能让旧节点误认为仍是主，数据层必须拒绝旧 token；仅删除 znode 不能阻止旧数据库连接继续写。", "subs": []}, {"title": "Raft 选举、日志与成员变更", "content": "Raft 复制命令日志，多数节点确认后提交到状态机。Leader 在更高任期或日志落后时退位；Follower 的 commitIndex 追平不等于业务副作用完成。监控应区分选举次数、任期变化、日志复制延迟和应用处理延迟。\n\n```mermaid\nflowchart TD\n  L[Leader append entry] --> F1[Follower 1]\n  L --> F2[Follower 2]\n  F1 --> Q{多数确认?}\n  F2 --> Q\n  Q -->|是| C[commitIndex 前进]\n  Q -->|否| R[重试或保持未提交]\n```\n\n成员变更采用一次加入一个节点：新节点追平日志后再移除旧节点。强制删除数据目录或复制其他节点目录会破坏任期和日志匹配，必须通过协议接口完成。", "subs": []}, {"title": "故障注入与最终验收矩阵", "content": "故障覆盖数据平面、控制平面和运维动作三类，每项实验都有预期告警、自动保护、人工操作、数据影响和恢复证据。\n\n| 注入场景 | 预期保护 | 必查证据 |\n| --- | --- | --- |\n| 副本网络隔离 | 摘除副本读流量 | 位点、fallback、RPO |\n| 单分片磁盘满 | 暂停迁移/写入限流 | 磁盘水位、错误码 |\n| 消费者重复启动 | 幂等拦截副作用 | 重复计数、账本 |\n| ZooKeeper 会话过期 | 旧 owner fencing | token、选主日志 |\n| Raft 少数派 | 暂停写和成员变更 | quorum、提交延迟 |\n| 死信批量重放 | 小批量限速 | replay_id、对账结果 |\n\n最终验收包包含数据流图、访问契约、容量与 RPO/RTO 计算、迁移回滚记录、消息重放记录和协调服务故障演练。每条结论附查询、命令或监控时间戳，避免只用“测试通过”作为证据。", "subs": []}, {"title": "实验：消息积压年龄与消费吞吐", "content": "压测时同时记录生产速率、有效消费速率、最老消息年龄和预计清空时间。条数相同的两个队列，业务风险可能完全不同；应以 `oldest_age` 对比业务 SLA。扩容消费者前先确认分区数、数据库连接上限和下游限流，否则并发翻倍可能让锁等待升高、有效吞吐反而下降。\n\n```promql\nmax(kafka_consumergroup_group_lag_seconds{group=\"order-worker\"}) > 30\nrate(kafka_messages_consumed_total[5m])\nrate(kafka_messages_produced_total[5m])\n```\n\n验收场景包括 poison message、下游 429、消费者滚动升级和分区重新分配。每次都要证明低优先级主题可以暂停，高优先级订单不被无限重试拖垮。", "subs": []}, {"title": "分布式锁与 fencing 的运维边界", "content": "分布式锁只适合短暂互斥，不应包住长事务和外部调用。锁必须有租约、续租、持有者 token，资源写入时校验 token；否则旧持有者在网络分区恢复后可能继续覆盖新持有者的结果。锁服务不可用时要明确 fail-close 还是只读降级，不能让各客户端自行猜测。\n\n```mermaid\nsequenceDiagram\n  participant W1 as Worker-1\n  participant L as Lock service\n  participant DB as Storage\n  W1->>L: acquire -> token=7\n  L-->>W1: lease\n  W1->>DB: write(token=7)\n  L-->>W1: lease expired\n  participant W2 as Worker-2\n  W2->>L: acquire -> token=8\n  W2->>DB: write(token=8)\n  W1->>DB: stale write(token=7)\n  DB-->>W1: reject fencing\n```", "subs": []}, {"title": "Schema 迁移与消息版本兼容", "content": "数据表和消息格式要按 expand、migrate、contract 三阶段推进。先增加兼容字段和消费者逻辑，再回填历史，最后停止旧字段写入并清理。消息必须携带 schema version，消费者遇到未知版本进入隔离队列，禁止猜测字段含义。\n\n迁移期间的回滚不能把新版本数据解释成旧格式；至少保留双读窗口和旧字段映射。大表 DDL 应使用在线变更或影子表，监控锁等待、复制延迟和临时磁盘，超过阈值自动暂停。", "subs": []}, {"title": "分片热点与容量倾斜诊断", "content": "平均分片 QPS 正常不代表没有热点。按分片记录写入字节、锁等待、最热业务键和租户占比；对时间分片特别检查末端分片是否承受全部新写入。热点治理可采用虚拟桶、租户拆分、局部缓存或单键并发限制，但每种方法都会增加路由和恢复复杂度。\n\n扩容后复核每片 CPU、磁盘、连接和副本带宽余量，确认迁移临时空间已释放。监控时序和备份窗口也会随分片数增加，若容量提升却使恢复超过 RTO，扩容方案仍未完成。", "subs": []}, {"title": "协调服务维护与恢复", "content": "ZooKeeper/etcd 节点磁盘要监控 fsync 延迟和快照大小，采用逐节点维护确保始终保留多数派。快照压缩、成员变更和大规模迁移不应同时进行。协调服务完全不可用时，可使用最后有效配置读，但失去租约后必须暂停唯一写主、权限变更和 owner 迁移。\n\n恢复后逐项检查临时节点、watch、服务发现缓存和 leader 任期。客户端重连逻辑必须幂等重建监听器，否则控制面恢复了，业务节点仍然使用过期成员列表。", "subs": []}, {"title": "运行闭环：从变更到复盘", "content": "一次分片扩容或复制切换应形成闭环：变更单声明假设和停止条件，dry-run 输出受影响对象，双人复核后小批次执行，实时记录 P99、错误率、复制位点和成本，完成后保留差异报告和回滚证据。事故复盘区分组件故障与设计假设失效，例如“副本在线”不等于“副本可安全提升”。\n\n最终验收至少包含访问契约、容量模型、数据流图、故障注入记录、备份恢复记录、迁移回滚记录、消息重放记录和权限审计。每个关键结论都附查询、命令或监控时间戳，确保下一次值班人员可以复现。", "subs": []}, {"title": "数据修复的安全阀", "content": "生产修复工具必须按业务主键、版本和审批单执行，禁止接受任意 SQL。每批设置最大记录数、QPS、并发和总时长，执行前输出 dry-run 差异，执行后重新读取事实源并写入审计日志。修复脚本自身要可重入：重复运行同一批次只能得到“已完成”，不能再次触发扣款或发货。\n\n修复任务与在线流量共享数据库时，应优先使用只读副本计算差异，再把小批量写入主库。遇到锁等待、复制延迟或下游错误，立即暂停并保留游标。恢复后先处理高价值账本和权限数据，再处理可重建索引，避免把资源耗在低优先级派生数据上。", "subs": []}, {"title": "数据与配置联合回滚", "content": "路由 epoch、Schema version 和配置版本必须作为一个变更单管理。只回滚路由而不回滚消费者，会让新格式消息进入旧代码；只回滚配置而不保留新数据，会让新 owner 继续写入旧分片。回滚前冻结高风险写入，记录当前版本、待处理事件和差异数量，回滚后重新跑读写路由矩阵。\n\n```mermaid\nflowchart TD\n  A[发现异常] --> F[冻结高风险写]\n  F --> S[保存版本/位点/差异]\n  S --> R[回滚路由与配置]\n  R --> V[验证兼容读]\n  V --> U[逐步恢复写流量]\n```", "subs": []}, {"title": "跨地域读写与数据驻留", "content": "跨地域访问先明确数据驻留、合规边界和故障切换语义。就近读降低延迟，却可能读到旧副本；跨区写增强一致性，却把 WAN 抖动带入交易路径。关键账本优先保持单一写主，普通目录可采用区域副本和最终一致。\n\n验收时分别注入跨区丢包、区域只读和 DNS 延迟，记录请求路由、数据版本、P99、复制位点和费用。故障恢复后不能只看服务返回 200，还要核对区域间账本、消息重放数量和未完成补偿，确认切换没有产生隐形双写。", "subs": []}, {"title": "观测字段和高基数控制", "content": "复制、消息和协调指标统一携带 cluster、role、shard、region、version 标签，业务 ID 保留在日志和追踪而非指标标签，避免时序数量失控。告警消息应包含当前 owner、路由 epoch、最近变更和最老积压年龄，让值班人员可以直接选择 Runbook。\n\n观测系统本身也要演练：删除一个 exporter、让指标延迟五分钟、切换日志存储，确认关键故障仍可通过数据库位点、队列状态和审计日志判断。没有观测证据的自动切换应默认暂停。", "subs": []}, {"title": "发布后的观察窗口", "content": "迁移或路由发布完成后保留明确的观察窗口，至少覆盖一个业务高峰和一次批处理周期。对比发布前基线中的错误率、P99、复制延迟、跨片比例、积压年龄、死信和数据差异；发现异常先冻结扩大范围，再判断回滚或继续观察。观察窗口结束前不要删除旧表、旧路由和回放日志，业务 owner 需确认关键状态和对账结果。\n\n迁移、切换和成员变更完成后至少保留一个完整业务周期的观察窗口，覆盖高峰、低峰和批处理时段。窗口内禁止清理旧副本或删除差异表；若出现延迟回升、重复事件或路由回退，先冻结下一批变更，再依据位点和审计记录定位。观察窗口结束时由研发、运维和业务共同签字，确认数据、性能、成本和恢复证据均满足目标。", "subs": []}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const DRAWER_WIDTH_KEY = 'learning-roadmap:drawerWidth';
  const DRAWER_MIN_WIDTH = 360;
  const DRAWER_EDGE_GAP = 28;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const EDIT = data.edit || {};
  const EDIT_ENABLED = !!EDIT.enabled;
  const SAVE_ENDPOINT = EDIT.endpoint || '/__learning_roadmap_save';

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const drawerResizer = document.getElementById('drawer-resizer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const editButton = document.getElementById('edit-section');
  const editTitle = document.getElementById('edit-title');
  const editContent = document.getElementById('edit-content');
  const saveButton = document.getElementById('save-section');
  const cancelEditButton = document.getElementById('cancel-edit');
  const saveState = document.getElementById('save-state');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;
  let currentPi = null;
  let currentSi = null;
  if (EDIT_ENABLED) drawer.classList.add('editable');
  setupDrawerResize();

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    cancelEdit();
    currentId = `${pi}-${si}`;
    currentPi = pi;
    currentSi = si;
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function renderSectionBody(sec){
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    typesetMath(dBody);
  }
  function typesetMath(root){
    if (!window.MathJax) return;
    const run = () => window.MathJax.typesetPromise ? window.MathJax.typesetPromise([root]).catch(()=>{}) : null;
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(run).catch(()=>{});
    } else {
      run();
    }
  }
  function closeDrawer(){
    cancelEdit();
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
    currentPi = null;
    currentSi = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  editButton.onclick = startEdit;
  cancelEditButton.onclick = cancelEdit;
  saveButton.onclick = saveEdit;

  function getCurrentSection(){
    if (currentPi === null || currentSi === null) return null;
    const part = data.parts[currentPi];
    return part && part.sections[currentSi] ? part.sections[currentSi] : null;
  }
  function updateDrawerTitle(sec){
    if (!sec || currentPi === null || currentSi === null) return;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${currentPi+1}.${currentSi+1}  ${cleanTitle}`;
  }
  function startEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    const sec = getCurrentSection();
    if (!sec) return;
    editTitle.value = sec.title;
    editContent.value = sec.content || '';
    saveState.textContent = '';
    drawer.classList.add('editing');
    editContent.focus();
  }
  function cancelEdit(){
    if (!drawer) return;
    drawer.classList.remove('editing');
    if (saveState) saveState.textContent = '';
  }
  async function saveEdit(){
    if (!EDIT_ENABLED || currentId === null) return;
    if (location.protocol === 'file:') {
      saveState.textContent = '需要通过 --serve --editable 打开';
      return;
    }
    const title = editTitle.value.trim();
    if (!title) {
      saveState.textContent = '标题不能为空';
      editTitle.focus();
      return;
    }
    saveButton.disabled = true;
    saveState.textContent = '保存中...';
    try {
      const response = await fetch(SAVE_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source: EDIT.source,
          roadmap: EDIT.roadmap || location.pathname.replace(/^\/+/, ''),
          sectionId: currentId,
          title,
          content: editContent.value,
          shift: EDIT.shift || 0,
          backHref: EDIT.backHref || null
        })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) {
        throw new Error(result.error || '保存失败');
      }
      applySavedSection(result.section || {title, content: editContent.value, subs: []});
      drawer.classList.remove('editing');
      saveState.textContent = '已保存';
    } catch (err) {
      saveState.textContent = err.message || '保存失败';
    } finally {
      saveButton.disabled = false;
    }
  }
  function applySavedSection(section){
    if (currentPi === null || currentSi === null) return;
    const sec = data.parts[currentPi].sections[currentSi];
    sec.title = section.title;
    sec.content = section.content || '';
    sec.subs = section.subs || [];
    updateDrawerTitle(sec);
    renderTags(sec.subs);
    renderSectionBody(sec);
    refreshCard(currentId, sec);
  }
  function refreshCard(id, sec){
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (!card) return;
    card.dataset.title = sec.title.toLowerCase();
    const titleEl = card.querySelector('.ttl');
    if (titleEl) titleEl.textContent = sec.title;
    const subCount = (sec.subs || []).length;
    let badge = card.querySelector('.badge');
    if (!subCount && badge) {
      badge.remove();
      return;
    }
    if (subCount && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge';
      card.appendChild(badge);
    }
    if (badge) {
      badge.textContent = subCount;
      badge.title = `${subCount} 个知识点`;
    }
  }
  function setupDrawerResize(){
    if (!drawer || !drawerResizer) return;
    let resizing = false;
    applySavedDrawerWidth();

    drawerResizer.addEventListener('pointerdown', e => {
      if (isCompactDrawer()) return;
      resizing = true;
      drawer.classList.add('resizing');
      document.body.classList.add('drawer-resizing');
      drawerResizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    drawerResizer.addEventListener('pointermove', e => {
      if (!resizing) return;
      const nextWidth = applyDrawerWidth(window.innerWidth - e.clientX);
      updateDrawerResizeValue(nextWidth);
    });
    drawerResizer.addEventListener('pointerup', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('pointercancel', e => finishDrawerResize(e.pointerId));
    drawerResizer.addEventListener('keydown', e => {
      if (isCompactDrawer() || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const delta = e.key === 'ArrowLeft' ? 32 : -32;
      const nextWidth = applyDrawerWidth(drawer.getBoundingClientRect().width + delta);
      saveDrawerWidth(nextWidth);
      updateDrawerResizeValue(nextWidth);
    });
    window.addEventListener('resize', applySavedDrawerWidth);

    function finishDrawerResize(pointerId){
      if (!resizing) return;
      resizing = false;
      drawer.classList.remove('resizing');
      document.body.classList.remove('drawer-resizing');
      try { drawerResizer.releasePointerCapture(pointerId); } catch (_) {}
      saveDrawerWidth(drawer.getBoundingClientRect().width);
    }
  }
  function applySavedDrawerWidth(){
    if (isCompactDrawer()) {
      drawer.style.removeProperty('--drawer-width');
      return;
    }
    const savedWidth = Number(localStorage.getItem(DRAWER_WIDTH_KEY));
    if (Number.isFinite(savedWidth) && savedWidth > 0) {
      const nextWidth = applyDrawerWidth(savedWidth);
      updateDrawerResizeValue(nextWidth);
    }
  }
  function applyDrawerWidth(width){
    const maxWidth = Math.max(DRAWER_MIN_WIDTH, window.innerWidth - DRAWER_EDGE_GAP);
    const nextWidth = clamp(width, DRAWER_MIN_WIDTH, maxWidth);
    drawer.style.setProperty('--drawer-width', Math.round(nextWidth) + 'px');
    return nextWidth;
  }
  function saveDrawerWidth(width){
    const nextWidth = applyDrawerWidth(width);
    localStorage.setItem(DRAWER_WIDTH_KEY, String(Math.round(nextWidth)));
  }
  function updateDrawerResizeValue(width){
    drawerResizer.setAttribute('aria-valuenow', String(Math.round(width)));
  }
  function isCompactDrawer(){
    return window.matchMedia('(max-width:640px)').matches;
  }
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  // 按渲染顺序扁平化所有小节，供方向键顺序切换（跨主章节连续）
  const flatIds = [];
  data.parts.forEach((part, pi) => {
    part.sections.forEach((sec, si) => flatIds.push(`${pi}-${si}`));
  });
  function navigateDrawer(delta){
    if (currentId === null) return;
    const next = flatIds.indexOf(currentId) + delta;
    if (next < 0 || next >= flatIds.length) return;  // 到头/到尾不循环
    const [pi, si] = flatIds[next].split('-').map(Number);
    openDrawer(pi, si);
    const card = document.querySelector(`.card[data-id="${flatIds[next]}"]`);
    if (card) card.scrollIntoView({block:'nearest'});
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (diagramModal.classList.contains('open')) closeDiagram();
      else closeDrawer();
      return;
    }
    // 抽屉打开时（且未在放大图表），←/→ 切换上一/下一小节（↑/↓ 留给正文滚动）
    if (currentId !== null && !diagramModal.classList.contains('open')
        && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateDrawer(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
