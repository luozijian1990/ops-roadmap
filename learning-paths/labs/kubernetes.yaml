apiVersion: v1
kind: Namespace
metadata:
  name: ops-roadmap-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab
  namespace: ops-roadmap-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: ops-roadmap-lab}
  template:
    metadata:
      labels: {app: ops-roadmap-lab}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ops-roadmap-lab:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8088}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: 8088}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8088}
          livenessProbe:
            httpGet: {path: /healthz, port: 8088}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lab
  namespace: ops-roadmap-lab
spec:
  selector: {app: ops-roadmap-lab}
  ports: [{port: 8088, targetPort: 8088}]
