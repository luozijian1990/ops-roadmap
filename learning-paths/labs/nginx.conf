log_format lab '$request_method $uri status=$status request_time=$request_time upstream_time=$upstream_response_time';
server {
    listen 80;
    access_log /var/log/nginx/access.log lab;
    location / {
        # Re-resolve the Compose service after app recreation during a version change.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend app:8088;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
}
