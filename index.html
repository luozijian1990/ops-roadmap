<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="面向运维工程师和 SRE 的中文学习路线图合集">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f2933'/%3E%3Cpath d='M16 18h32v8H16zm0 14h24v8H16zm0 14h16v8H16z' fill='%23f4c95d'/%3E%3C/svg%3E">
  <title>Ops Roadmap</title>
  <style>
    :root{--bg:#fdf6e3;--paper:#fffdf5;--ink:#1f2933;--muted:#69737d;--accent:#f4c95d;--green:#8bcf8b;--rule:#d8cfb6}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    a{color:inherit}header{padding:54px clamp(20px,6vw,80px) 36px;border-bottom:2px dashed var(--ink);background:rgba(255,253,245,.72)}
    .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}h1{margin:8px 0 12px;font-size:clamp(38px,7vw,76px);line-height:1}
    .lead{max-width:760px;margin:0;color:var(--muted);font-size:17px;line-height:1.8}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
    .stat{padding:8px 13px;background:var(--paper);border:1.5px solid var(--ink);border-radius:7px;box-shadow:2px 2px 0 var(--ink);font-size:14px}
    .toolbar{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px clamp(20px,6vw,80px);background:rgba(253,246,227,.94);border-bottom:1px dashed var(--ink);backdrop-filter:blur(8px)}
    input{flex:1;min-width:220px;max-width:420px;padding:10px 13px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);font:inherit;box-shadow:2px 2px 0 var(--ink)}
    .filters{display:flex;gap:7px;flex-wrap:wrap}.filter{padding:7px 11px;border:1px solid var(--ink);border-radius:999px;background:var(--paper);font:inherit;cursor:pointer}.filter.active{background:var(--ink);color:var(--paper)}
    main{padding:34px clamp(20px,6vw,80px) 72px}.category{margin-bottom:44px}.category.hidden,.topic.hidden{display:none}.category-title{display:flex;align-items:center;gap:12px;margin:0 0 18px;font-size:22px}.category-title:after{content:"";height:1px;flex:1;border-top:1px dashed var(--ink)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}.topic{background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:18px;box-shadow:3px 3px 0 var(--ink)}
    .topic-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}.topic h3{margin:0;font-size:19px}.count{white-space:nowrap;color:var(--muted);font-size:12px;border:1px solid var(--rule);padding:3px 7px;border-radius:999px}
    .links{display:grid;gap:8px}.roadmap{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--rule);border-radius:6px;text-decoration:none;background:#fffaf0;transition:.15s ease}.roadmap:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink);border-color:var(--ink)}
    .roadmap small{display:block;color:var(--muted);margin-top:3px}.arrow{font-size:18px}.source{font-size:12px;color:var(--muted);text-decoration:none}.source:hover{text-decoration:underline}.special{background:#fff3bd;border-color:var(--ink)}
    footer{padding:24px clamp(20px,6vw,80px);border-top:2px dashed var(--ink);color:var(--muted);font-size:13px}@media(max-width:640px){header{padding-top:38px}.toolbar{align-items:stretch}.filters{width:100%}}
  </style>
</head>
<body>
<header>
  <div class="eyebrow">Operations · SRE · Platform Engineering</div>
  <h1>Ops Roadmap</h1>
  <p class="lead">把分散的运维笔记整理成可搜索、可阅读、可跟踪进度的学习路线。选择一个主题，从一册开始。</p>
  <div class="stats"><span class="stat">20 个主题</span><span class="stat">47 份路线图</span><span class="stat">1 份 Kubernetes 动画版</span></div>
</header>
<div class="toolbar">
  <input id="search" type="search" placeholder="搜索 Linux、Kubernetes、PromQL…" aria-label="搜索路线图">
  <div class="filters" id="filters"></div>
</div>
<main id="catalog"></main>
<footer>学习进度保存在当前浏览器的 localStorage 中。通过本地 HTTP 服务或 GitHub Pages 访问，可获得更稳定的跨页面体验。</footer>
<script>
const catalog = [
  {id:'systems',name:'系统基础',topics:[
    {name:'容器核心技术',items:[['容器核心技术学习笔记','topics/systems/container-fundamentals/guide-roadmap.html']]},
    {name:'Linux 底层原理',items:[['第一册：系统基础与启动','topics/systems/linux/01-foundations-and-boot-roadmap.html'],['第二册：进程、线程与调度','topics/systems/linux/02-processes-and-scheduling-roadmap.html'],['第三册：内存管理','topics/systems/linux/03-memory-management-roadmap.html'],['第四册：文件系统与 I/O','topics/systems/linux/04-filesystems-and-io-roadmap.html'],['第五册：进程间通信','topics/systems/linux/05-ipc-roadmap.html'],['第六册：网络协议栈','topics/systems/linux/06-network-stack-roadmap.html']]},
    {name:'Linux 性能优化',items:[['第一册：CPU 与内存','topics/systems/linux-performance/01-cpu-and-memory-roadmap.html'],['第二册：I/O、网络与方法论','topics/systems/linux-performance/02-io-network-and-methodology-roadmap.html']]}
  ]},
  {id:'cloud-native',name:'云原生',topics:[
    {name:'Docker',items:[['第一册：基础与容器操作','topics/cloud-native/docker/01-basics-and-container-operations-roadmap.html'],['第二册：镜像、网络、存储与守护进程','topics/cloud-native/docker/02-images-network-storage-and-daemon-roadmap.html'],['第三册：Docker Compose','topics/cloud-native/docker/03-docker-compose-roadmap.html'],['第四册：Dockerfile 与附录','topics/cloud-native/docker/04-dockerfile-and-appendix-roadmap.html']]},
    {name:'Kubernetes',special:['完整动画版','topics/cloud-native/kubernetes/full-animated-roadmap.html'],items:[['第一册：架构与控制平面','topics/cloud-native/kubernetes/01-architecture-and-control-plane-roadmap.html'],['第二册：调度与工作负载','topics/cloud-native/kubernetes/02-scheduling-and-workloads-roadmap.html'],['第三册：生产运维与应用迁移','topics/cloud-native/kubernetes/03-production-and-migration-roadmap.html'],['第四册：Istio、多集群与安全','topics/cloud-native/kubernetes/04-istio-multicluster-and-security-roadmap.html']]},
    {name:'Kubernetes 容器网络',items:[['第一册：网络基础','topics/cloud-native/kubernetes-networking/01-network-foundations-roadmap.html'],['第二册：Cilium 基础与路由','topics/cloud-native/kubernetes-networking/02-cilium-foundations-roadmap.html'],['第三册：Cilium 高级能力','topics/cloud-native/kubernetes-networking/03-cilium-advanced-roadmap.html'],['第四册：Calico 基础与隧道','topics/cloud-native/kubernetes-networking/04-calico-foundations-roadmap.html'],['第五册：Calico 路由与生产实践','topics/cloud-native/kubernetes-networking/05-calico-production-roadmap.html'],['第六册：Flannel','topics/cloud-native/kubernetes-networking/06-flannel-roadmap.html'],['第七册：Multus 与 IPAM','topics/cloud-native/kubernetes-networking/07-multus-and-ipam-roadmap.html']]},
    {name:'Consul',items:[['第一册：基础、架构与服务管理','topics/cloud-native/consul/01-foundations-and-services-roadmap.html'],['第二册：安全、集成与故障排除','topics/cloud-native/consul/02-security-and-operations-roadmap.html']]},
    {name:'etcd',items:[['第一册：架构与核心原理','topics/cloud-native/etcd/01-architecture-and-internals-roadmap.html'],['第二册：生产实践与参考','topics/cloud-native/etcd/02-production-practices-roadmap.html']]}
  ]},
  {id:'observability',name:'可观测性',topics:[
    {name:'Prometheus',items:[['Prometheus 学习笔记','topics/observability/prometheus/guide-roadmap.html']]},
    {name:'Kube-Prometheus',items:[['Kube-Prometheus 深度学习笔记','topics/observability/kube-prometheus/guide-roadmap.html']]},
    {name:'VictoriaMetrics',items:[['第一册：核心架构与部署','topics/observability/victoria-metrics/01-core-and-deployment-roadmap.html'],['第二册：采集、告警与认证','topics/observability/victoria-metrics/02-ingestion-alerting-and-auth-roadmap.html'],['第三册：备份、恢复与实践','topics/observability/victoria-metrics/03-backup-restore-and-practices-roadmap.html']]},
    {name:'VictoriaMetrics Flags',items:[['Flag 参数学习笔记','topics/observability/victoria-metrics-flags/guide-roadmap.html']]},
    {name:'VictoriaMetrics PromQL',items:[['PromQL 学习笔记','topics/observability/victoria-metrics-promql/guide-roadmap.html']]}
  ]},
  {id:'data-systems',name:'数据系统',topics:[
    {name:'MySQL',items:[['MySQL 深度学习笔记','topics/data-systems/mysql/guide-roadmap.html']]},
    {name:'Kafka',items:[['第一册：基础、部署与客户端','topics/data-systems/kafka/01-foundations-and-clients-roadmap.html'],['第二册：内核、运维与流处理','topics/data-systems/kafka/02-internals-operations-and-streams-roadmap.html']]},
    {name:'RabbitMQ',items:[['第一册：安装与消息模型','topics/data-systems/rabbitmq/01-installation-and-messaging-roadmap.html'],['第二册：管理、监控与参考','topics/data-systems/rabbitmq/02-administration-monitoring-and-reference-roadmap.html']]}
  ]},
  {id:'delivery',name:'持续交付',topics:[{name:'Jenkins',items:[['Jenkins 学习笔记','topics/delivery/jenkins/guide-roadmap.html']]}]},
  {id:'web',name:'Web 基础设施',topics:[{name:'Nginx',items:[['第一册：基础与架构','topics/web/nginx/01-basics-and-architecture-roadmap.html'],['第二册：HTTP 模块','topics/web/nginx/02-http-modules-roadmap.html'],['第三册：反向代理与负载均衡','topics/web/nginx/03-reverse-proxy-and-load-balancing-roadmap.html'],['第四册：性能优化与源码','topics/web/nginx/04-performance-and-source-code-roadmap.html']]}]},
  {id:'ai-agents',name:'AI Agent',topics:[{name:'DeepAgent',items:[['DeepAgent 中文学习笔记','topics/ai-agents/deepagent/guide-roadmap.html']]},{name:'Claude Agent SDK',items:[['Claude Agent SDK 中文学习文档','topics/ai-agents/claude-agent-sdk/guide-roadmap.html']]}]}
];
const catalogEl=document.getElementById('catalog');
const filtersEl=document.getElementById('filters');
let active='all';
function sourceFor(href){return href.replace(/-roadmap\.html$/,'.md')}
function render(){
  catalogEl.innerHTML=catalog.map(category=>`<section class="category" data-category="${category.id}"><h2 class="category-title">${category.name}</h2><div class="grid">${category.topics.map(topic=>`<article class="topic" data-search="${(category.name+' '+topic.name+' '+topic.items.map(i=>i[0]).join(' ')).toLowerCase()}"><div class="topic-head"><h3>${topic.name}</h3><span class="count">${topic.items.length} 册</span></div><div class="links">${topic.special?`<a class="roadmap special" href="${topic.special[1]}"><span><strong>${topic.special[0]}</strong><small>包含交互教学动画</small></span><span class="arrow">→</span></a>`:''}${topic.items.map(item=>`<div><a class="roadmap" href="${item[1]}"><span><strong>${item[0]}</strong><small>交互式学习路线图</small></span><span class="arrow">→</span></a><a class="source" href="${sourceFor(item[1])}">查看 Markdown 源文档</a></div>`).join('')}</div></article>`).join('')}</div></section>`).join('');
  applyFilter();
}
function applyFilter(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('.category').forEach(section=>{
    let visible=0;
    section.querySelectorAll('.topic').forEach(card=>{const show=(active==='all'||section.dataset.category===active)&&(!q||card.dataset.search.includes(q));card.classList.toggle('hidden',!show);if(show)visible++});
    section.classList.toggle('hidden',visible===0);
  });
}
filtersEl.innerHTML=[['all','全部'],...catalog.map(c=>[c.id,c.name])].map(([id,name])=>`<button class="filter ${id==='all'?'active':''}" data-id="${id}">${name}</button>`).join('');
filtersEl.addEventListener('click',event=>{const button=event.target.closest('.filter');if(!button)return;active=button.dataset.id;document.querySelectorAll('.filter').forEach(item=>item.classList.toggle('active',item===button));applyFilter()});
document.getElementById('search').addEventListener('input',applyFilter);
render();
</script>
</body>
</html>
