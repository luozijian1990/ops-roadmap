>CA: 验证并签名 CSR\n    CA-->>Istiod: 返回证书\n    Istiod-->>Agent: 下发证书\n    Agent-->>Envoy: 提供证书和私钥\n```\n\n工作负载启动后，Envoy 向同 Pod 内的 `istio-agent` 请求身份材料；agent 生成私钥和 CSR，发送给 istiod CA；CA 验证凭据并签发证书；agent 再把证书和私钥通过 SDS 提供给 Envoy。证书临近过期时，agent 会重复流程完成轮换。\n\n对于 Istio Gateway，标准做法可以通过 `credentialName` 引用 Kubernetes TLS Secret，再由 SDS 把证书材料送给网关代理。但如果安全规范要求私钥和证书不能长期存放在同一个 Secret 中，就需要定制 SDS 或 Secret provider：例如证书从证书管理系统读取，私钥从 KMS/HSM 或专用 provider 读取，只在 Gateway Pod 内存中短暂组合后交给 Envoy 使用。\n\n证书轮换依赖 istiod 和 CA 持续可用。Istio 证书通常有效期较短，短时控制面故障不会立刻切断已有数据面连接；但如果 istiod 长时间不可用，工作负载和 Gateway 无法续签证书，证书超过有效期后 mTLS 握手会失败，局部控制面故障就可能演变成全网格通信故障。生产设计需要监控 istiod 健康、CSR 签发失败、证书剩余有效期和 Gateway SDS 状态，并准备升级回滚和临时证书恢复路径。\n\n#### Gateway 升级和流量导入风险\n\nIstio Gateway 升级可以采用滚动升级或 A/B 方式，但入口网关直接承接用户流量，readiness 不能只表示进程存活。新网关 Pod 可能已经拿到 LDS/RDS 并被判定为 ready，但 EDS、AuthorizationPolicy、PeerAuthentication 或其他策略还没有全量推送到 Envoy；此时外部负载均衡器开始导流，就可能出现短暂 503 或策略不一致。\n\n生产中应把网关 ready 条件设计得更保守：简单场景可以增加 `initialDelaySeconds`，给 xDS 和策略收敛留出缓冲；高要求场景应使用自定义探针，确认关键 listener、route、cluster endpoint 和安全策略已经进入预期状态后再接流量。升级窗口还要观察 Envoy 配置同步状态、SDS 状态和 5xx 指标，而不是只看 Kubernetes Pod Ready。\n\n后端工作负载终止时也有类似风险。某个 Pod 已进入 `terminating`，但四层负载均衡或网关的 endpoint 权重尚未归零时，连接仍可能被导向正在退出的实例。滚动升级和缩容流程应先把目标实例权重调为 0 或从上游 endpoint 中摘除，等待连接排空后再终止容器。", "subs": ["Istio 安全目标", "Istio 身份模型", "SDS 和证书供应", "Gateway 升级和流量导入风险"]}, {"title": "Istio 认证如何实现 mTLS 和策略控制", "content": "Istio 认证分为两类：PeerAuthentication 处理服务到服务身份认证，RequestAuthentication 处理最终用户或请求级凭据认证。\n\n#### PeerAuthentication 和 RequestAuthentication\n\n| 类型 | 认证对象 | 典型机制 | 作用 |\n|---|---|---|---|\n| PeerAuthentication | 服务工作负载 | mTLS | 验证对端服务身份 |\n| RequestAuthentication | 最终用户请求 | JWT | 验证请求携带的用户凭据 |\n\nPeerAuthentication 由 Envoy 在服务间通信时自动执行，应用代码无需修改。RequestAuthentication 要求应用或上游网关把 token 放入请求中，Istio 根据 issuer、JWKS 和 token 位置验证请求。\n\n```mermaid\nflowchart LR\n    User[\"最终用户\"]\n    Token[\"JWT\"]\n    Client[\"客户端服务\"]\n    ProxyA[\"客户端代理\"]\n    ProxyB[\"服务端代理\"]\n    Server[\"服务端服务\"]\n\n    User --> Token --> Client --> ProxyA\n    ProxyA --> ProxyB\n    ProxyB --> Server\n```\n\n认证策略有作用域。namespace 级策略可以覆盖一组工作负载，selector 级策略只覆盖命中的工作负载；未命中的工作负载仍按更外层或默认策略处理。生产排查时不能只看 YAML 是否存在，还要看它是否真的选中了目标代理。\n\n```mermaid\nflowchart TB\n    Admin[\"Administrators\"] --> Istiod[\"istiod\"]\n    Istiod --> PolicyFoo[\"Authentication policy<br/>namespace: Foo<br/>targets: all\"]\n    Istiod --> PolicyBar[\"Authentication policy<br/>namespace: Bar<br/>target: Workload X\"]\n\n    subgraph Foo[\"namespace Foo\"]\n        WorkloadA[\"Workload A\"]\n        ProxyA[\"Proxy\"]\n        WorkloadB[\"Workload B\"]\n        ProxyB[\"Proxy\"]\n        WorkloadA <--> ProxyA\n        WorkloadB <--> ProxyB\n        ProxyA <-->|mTLS| ProxyB\n    end\n\n    subgraph Bar[\"namespace Bar\"]\n        WorkloadX[\"Workload X\"]\n        ProxyX[\"Proxy\"]\n        WorkloadY[\"Workload Y\"]\n        ProxyY[\"Proxy\"]\n        WorkloadX <--> ProxyX\n        WorkloadY <--> ProxyY\n    end\n\n    PolicyFoo -.-> ProxyA\n    PolicyFoo -.-> ProxyB\n    PolicyBar -.-> ProxyX\n```\n\n#### mTLS 认证流程\n\n当客户端工作负载访问服务端工作负载时：\n\n1. 客户端出站流量被重定向到本地 Envoy。\n2. 客户端 Envoy 与服务端 Envoy 发起 mTLS 握手。\n3. 客户端 Envoy 校验服务端证书和安全命名映射。\n4. 服务端 Envoy 校验客户端证书和身份。\n5. 双方建立加密连接。\n6. 服务端 Envoy 在授权通过后把请求转发给本地服务。\n\n```mermaid\nsequenceDiagram\n    participant Client as Client\n    participant CProxy as Client Proxy\n    participant SProxy as Server Proxy\n    participant Server as Server\n\n    Client->>CProxy: 发起请求\n    CProxy->>SProxy: mTLS 握手\n    CProxy->>CProxy: 校验服务端身份\n    SProxy->>SProxy: 校验客户端身份\n    CProxy->>SProxy: 加密请求\n    SProxy->>Server: 本地转发\n```\n\n#### mTLS 模式\n\nPeerAuthentication 常见模式：\n\n| 模式 | 含义 | 使用场景 |\n|---|---|---|\n| `PERMISSIVE` | 同时接受明文和 mTLS | 迁移期 |\n| `STRICT` | 只接受 mTLS | 网格内强制加密 |\n| `DISABLE` | 禁用 mTLS | 特殊端口或兼容场景 |\n\n未设置网格级 PeerAuthentication 时，Istio 通常采用 `PERMISSIVE`，这样能让未注入 sidecar 的客户端和已启用 mTLS 的客户端同时访问同一服务，便于迁移。但 `PERMISSIVE` 不是强制加密：它允许明文请求继续进入服务端代理。`DISABLE` 或端口级禁用 mTLS 后，代理之间会按明文通信，除非客户端侧 DestinationRule 另有 TLS 配置。因此生产中要把 `STRICT` 作为最终目标，并用指标和访问日志确认是否仍有 plaintext 流量。\n\n服务端配置严格 mTLS：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: PeerAuthentication\nmetadata:\n  name: reviews-strict\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: reviews\n  mtls:\n    mode: STRICT\n```\n\n端口级别禁用 mTLS：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: PeerAuthentication\nmetadata:\n  name: example-port-policy\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: example-app\n  portLevelMtls:\n    8080:\n      mode: DISABLE\n```\n\n客户端侧的 TLS 行为通过 DestinationRule 描述：\n\n```yaml\napiVersion: networking.istio.io/v1beta1\nkind: DestinationRule\nmetadata:\n  name: ratings-istio-mtls\n  namespace: prod\nspec:\n  host: ratings.prod.svc.cluster.local\n  trafficPolicy:\n    tls:\n      mode: ISTIO_MUTUAL\n```\n\n`ISTIO_MUTUAL` 表示使用 Istio 自动管理的证书。`SIMPLE` 表示普通 TLS，`MUTUAL` 表示手工指定客户端证书、私钥和 CA。\n\n普通 TLS 只校验服务端证书，常用于访问网格外 HTTPS 服务：\n\n```yaml\napiVersion: networking.istio.io/v1beta1\nkind: DestinationRule\nmetadata:\n  name: external-simple-tls\n  namespace: prod\nspec:\n  host: api.external.example.com\n  trafficPolicy:\n    tls:\n      mode: SIMPLE\n      sni: api.external.example.com\n```\n\n手工 mTLS 需要显式提供客户端证书、私钥和 CA，适合接入非 Istio 管理证书体系：\n\n```yaml\napiVersion: networking.istio.io/v1beta1\nkind: DestinationRule\nmetadata:\n  name: external-mutual-tls\n  namespace: prod\nspec:\n  host: payments.external.example.com\n  trafficPolicy:\n    tls:\n      mode: MUTUAL\n      clientCertificate: /etc/certs/client-cert.pem\n      privateKey: /etc/certs/client-key.pem\n      caCertificates: /etc/certs/ca-cert.pem\n      sni: payments.external.example.com\n```\n\n#### RequestAuthentication 和 JWT\n\nRequestAuthentication 用来验证请求中的 JWT。它会检查 issuer、签名和 token 位置。需要注意：只配置 RequestAuthentication 时，不带 token 的请求默认仍可能被接受；如果要强制要求认证，必须配合 AuthorizationPolicy。\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: RequestAuthentication\nmetadata:\n  name: ingress-jwt\n  namespace: istio-system\nspec:\n  selector:\n    matchLabels:\n      istio: ingressgateway\n  jwtRules:\n  - issuer: testing@secure.istio.io\n    jwksUri: https://issuer.example.com/.well-known/jwks\n```\n\n这也体现了认证和授权的边界：认证回答“你是谁”，授权回答“你能访问什么”。JWT 验证通过只说明请求者身份可信，不代表它可以访问所有服务。", "subs": ["PeerAuthentication 和 RequestAuthentication", "mTLS 认证流程", "mTLS 模式", "RequestAuthentication 和 JWT"]}, {"title": "Istio 授权如何精细化控制服务访问", "content": "Istio 授权由 Envoy 中的授权引擎执行。请求到达代理时，Envoy 根据当前 AuthorizationPolicy 评估来源、目标、操作和条件，然后返回允许或拒绝。\n\n#### 授权策略的基本规则\n\n| 规则 | 含义 |\n|---|---|\n| 支持 `ALLOW` 和 `DENY` | 允许策略和拒绝策略都可表达 |\n| `DENY` 优先 | 拒绝策略命中时优先拒绝 |\n| 有允许策略时默认拒绝未匹配请求 | 工作负载被 ALLOW 策略覆盖后，没匹配的请求不会被放行 |\n| 未设置 selector 时作用于同 namespace 所有工作负载 | 根 namespace 可作用于全网格 |\n\n策略目标由 `metadata.namespace` 和可选的 `selector` 共同决定。普通 namespace 中的策略只影响该 namespace：设置 `selector` 时只作用于匹配标签的工作负载；不设置 `selector` 时作用于同 namespace 的全部工作负载。root namespace 中的策略可以作用于整个网格，默认 root namespace 通常是 `istio-system`，也可以通过网格配置调整。全局策略要格外谨慎，因为一个空 `selector` 的 `DENY` 策略可能把全网格流量一起拒绝。\n\n```mermaid\nflowchart TB\n    Admin[\"Administrators\"]\n    ApiServer[\"API Server configuration\"]\n    Istiod[\"istiod\"]\n    Authz[\"Authorization policies\"]\n\n    subgraph Mesh[\"Istio Mesh\"]\n        WorkloadA[\"Workload A\"]\n        ProxyA[\"Proxy A<br/>authorization engine\"]\n        WorkloadB[\"Workload B\"]\n        ProxyB[\"Proxy B<br/>authorization engine\"]\n        WorkloadA <--> ProxyA\n        ProxyA <-->|mTLS| ProxyB\n        ProxyB <--> WorkloadB\n    end\n\n    Admin --> Authz --> ApiServer --> Istiod\n    Istiod -.->|policy| ProxyA\n    Istiod -.->|policy| ProxyB\n    ProxyA -->|ALLOW / DENY| WorkloadA\n    ProxyB -->|ALLOW / DENY| WorkloadB\n```\n\n授权策略由管理员提交到 API Server，经 istiod 分发到各个 Envoy，再由每个代理本地执行。它和认证的边界很清楚：mTLS 或 JWT 让代理知道请求者是谁，AuthorizationPolicy 再根据 principal、namespace、method、path、port 和 claim 判断这次访问是否被允许。\n\n#### AuthorizationPolicy 结构\n\n核心字段：\n\n| 字段 | 作用 |\n|---|---|\n| `metadata.namespace` | 策略所在 namespace |\n| `selector` | 选择目标工作负载 |\n| `action` | ALLOW 或 DENY |\n| `rules.from` | 请求来源，如 principal、namespace |\n| `rules.to` | 请求操作，如 method、path、port |\n| `rules.when` | 附加条件，如 JWT claim、请求头 |\n\n允许来自指定 ServiceAccount 或 dev namespace 的 GET 请求，并要求 issuer 匹配：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: httpbin\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: httpbin\n      version: v1\n  action: ALLOW\n  rules:\n  - from:\n    - source:\n        principals:\n        - cluster.local/ns/default/sa/sleep\n    - source:\n        namespaces:\n        - dev\n    to:\n    - operation:\n        methods:\n        - GET\n    when:\n    - key: request.auth.claims[iss]\n      values:\n      - https://accounts.google.com\n```\n\nAuthorizationPolicy 的字符串值支持多种匹配模式：\n\n| 模式 | 示例 | 含义 |\n|---|---|---|\n| 完全匹配 | `GET` | 必须完全相等 |\n| 前缀匹配 | `/api/*` | 匹配指定前缀 |\n| 后缀匹配 | `*/admin` | 匹配指定后缀 |\n| 存在匹配 | `*` | 字段存在即可 |\n\n`when` 不只适合 JWT claim，也可以引用请求头、来源属性和连接上下文。下面的策略只允许带 `version: v1` 请求头的 GET 请求访问 `/api/` 前缀路径：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: httpbin-header-version\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: httpbin\n  action: ALLOW\n  rules:\n  - to:\n    - operation:\n        methods:\n        - GET\n        paths:\n        - /api/*\n    when:\n    - key: request.headers[version]\n      values:\n      - v1\n```\n\n拒绝非 `foo` namespace 来源：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: httpbin-deny\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: httpbin\n      version: v1\n  action: DENY\n  rules:\n  - from:\n    - source:\n        notNamespaces:\n        - foo\n```\n\n#### 默认允许、默认拒绝和公开访问\n\n允许 default namespace 中所有工作负载的全部访问：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: allow-all\n  namespace: default\nspec:\n  action: ALLOW\n  rules:\n  - {}\n```\n\n拒绝 admin namespace 中所有工作负载访问：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: deny-all\n  namespace: admin\nspec: {}\n```\n\n如果只允许经过认证的主体，可以使用 principal 通配：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: authenticated-only\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: httpbin\n  action: ALLOW\n  rules:\n  - from:\n    - source:\n        principals:\n        - \"*\"\n```\n\n如果工作负载需要公开访问，则不要限制 source，只限制操作：\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: public-read\n  namespace: foo\nspec:\n  selector:\n    matchLabels:\n      app: httpbin\n  action: ALLOW\n  rules:\n  - to:\n    - operation:\n        methods:\n        - GET\n        - POST\n```\n\n#### TCP 工作负载的授权边界\n\nIstio 授权也可以用于 TCP 工作负载，但不能依赖 HTTP 专属字段。对 MongoDB 这类 TCP 服务，应使用 principal、namespace、port 等协议无关字段。\n\n```yaml\napiVersion: security.istio.io/v1beta1\nkind: AuthorizationPolicy\nmetadata:\n  name: mongodb-policy\n  namespace: default\nspec:\n  selector:\n    matchLabels:\n      app: mongodb\n  action: ALLOW\n  rules:\n  - from:\n    - source:\n        principals:\n        - cluster.local/ns/default/sa/bookinfo-ratings-v2\n    to:\n    - operation:\n        ports:\n        - \"27017\"\n```\n\n最终可以把 Istio 安全控制理解成三层：\n\n| 层次 | 对象 | 回答的问题 |\n|---|---|---|\n| 身份 | ServiceAccount、SPIFFE、证书 | 调用方和服务端是谁 |\n| 认证 | PeerAuthentication、RequestAuthentication | 身份或请求凭据是否可信 |\n| 授权 | AuthorizationPolicy | 可信身份能访问哪些服务和操作 |\n\n这三层配合 mTLS、NetworkPolicy、RBAC 和审计，才能形成从集群控制面到服务调用面的完整安全保证。", "subs": ["授权策略的基本规则", "AuthorizationPolicy 结构", "默认允许、默认拒绝和公开访问", "TCP 工作负载的授权边界"]}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      const subCount = (sec.subs || []).length;
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
        ${subCount ? `<span class="badge" title="${subCount} 个知识点">${subCount}</span>` : ''}
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  const diagramBackdrop = document.getElementById('diagram-backdrop');
  const diagramModal = document.getElementById('diagram-modal');
  const diagramBody = document.getElementById('diagram-body');
  const diagramCanvas = document.getElementById('diagram-canvas');
  const diagramInner = document.getElementById('diagram-inner');
  const diagramZoom = document.getElementById('diagram-zoom');
  const diagramZoomOut = document.getElementById('diagram-zoom-out');
  const diagramZoomIn = document.getElementById('diagram-zoom-in');
  let diagramScale = 1;
  let diagramBaseWidth = 1;
  let diagramBaseHeight = 1;
  let currentId = null;

  const dTags = document.getElementById('d-tags');
  function pillColor(i){
    // 黄金角分布，柔和粉彩，深色 ink 字看得清
    const h = (i * 47) % 360;
    return `hsl(${h}, 72%, 86%)`;
  }
  function renderTags(subs){
    const MAX = 12;
    if (!subs || !subs.length) { dTags.className = 'tags-bar empty'; dTags.innerHTML = ''; return; }
    dTags.className = 'tags-bar';
    const visible = subs.slice(0, MAX);
    const rest = subs.slice(MAX);
    dTags.innerHTML = visible.map((s, i) =>
      `<span class="pill" style="background:${pillColor(i)}">${escapeHtml(s)}</span>`
    ).join('') + (rest.length
      ? `<span class="pill more" title="${escapeHtml(rest.join(' · '))}">+${rest.length}</span>`
      : '');
  }
  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    currentId = `${pi}-${si}`;
    // 若小节标题已含 "N.N " 或 "N.N.N " 编号，去掉避免与自动编号重复
    const cleanTitle = sec.title.replace(/^\d+(\.\d+)*\s+/, '');
    dTitle.textContent = `${pi+1}.${si+1}  ${cleanTitle}`;
    renderTags(sec.subs);
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.title = '点击放大图表';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.getElementById('diagram-close').onclick = closeDiagram;
  diagramBackdrop.onclick = closeDiagram;
  diagramZoomOut.onclick = () => setDiagramScale(diagramScale / 1.2);
  diagramZoomIn.onclick = () => setDiagramScale(diagramScale * 1.2);
  dBody.addEventListener('click', e => {
    const diagram = e.target.closest('.mermaid');
    if (diagram) openDiagram(diagram);
  });
  window.addEventListener('resize', () => {
    if (diagramModal.classList.contains('open')) fitDiagramToViewport();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (diagramModal.classList.contains('open')) closeDiagram();
    else closeDrawer();
  });

  function openDiagram(diagram){
    diagramInner.innerHTML = '';
    resetDiagramViewport();
    const clone = diagram.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('title');
    rewriteSvgIds(clone, 'zoom-' + Date.now() + '-');
    normalizeDiagramSvg(clone);
    diagramInner.appendChild(clone);
    diagramModal.classList.add('open');
    diagramBackdrop.classList.add('open');
    requestAnimationFrame(() => {
      relaxDiagramNodeLabels(clone);
      normalizeDiagramSvg(clone);
      const size = measureDiagram(clone);
      diagramBaseWidth = size.width;
      diagramBaseHeight = size.height;
      fitDiagramToViewport();
    });
  }
  function closeDiagram(){
    diagramModal.classList.remove('open');
    diagramBackdrop.classList.remove('open');
    diagramInner.innerHTML = '';
  }
  function resetDiagramViewport(){
    diagramScale = 1;
    diagramCanvas.style.width = '';
    diagramCanvas.style.height = '';
    diagramInner.style.transform = 'scale(1)';
    diagramZoom.textContent = '100%';
  }
  function fitDiagramToViewport(){
    const bodyBox = diagramBody.getBoundingClientRect();
    const roomW = Math.max(1, bodyBox.width - 32);
    const roomH = Math.max(1, bodyBox.height - 32);
    const fit = Math.min(roomW / diagramBaseWidth, roomH / diagramBaseHeight);
    const readableMin = window.innerWidth < 700 ? 0.55 : 0.75;
    setDiagramScale(clamp(fit, readableMin, 1.5));
  }
  function setDiagramScale(scale){
    diagramScale = clamp(scale, 0.1, 3);
    const pad = 32;
    diagramCanvas.style.width = Math.ceil(diagramBaseWidth * diagramScale + pad) + 'px';
    diagramCanvas.style.height = Math.ceil(diagramBaseHeight * diagramScale + pad) + 'px';
    diagramInner.style.transform = `scale(${diagramScale})`;
    diagramZoom.textContent = Math.round(diagramScale * 100) + '%';
    requestAnimationFrame(() => {
      diagramBody.scrollLeft = Math.max(0, (diagramCanvas.scrollWidth - diagramBody.clientWidth) / 2);
      diagramBody.scrollTop = Math.max(0, (diagramCanvas.scrollHeight - diagramBody.clientHeight) / 2);
    });
  }
  function measureDiagram(root){
    const svg = root.querySelector('svg');
    if (svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      if (viewBox && viewBox.width && viewBox.height) {
        return {width: viewBox.width, height: viewBox.height};
      }
      const rect = svg.getBoundingClientRect();
      if (rect.width && rect.height) return {width: rect.width, height: rect.height};
    }
    const rect = root.getBoundingClientRect();
    return {width: Math.max(1, rect.width), height: Math.max(1, rect.height)};
  }
  function normalizeDiagramSvg(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width && viewBox.height) {
      svg.setAttribute('width', viewBox.width);
      svg.setAttribute('height', viewBox.height);
      svg.style.maxWidth = 'none';
    }
  }
  function relaxDiagramNodeLabels(root){
    const svg = root.querySelector('svg');
    if (!svg) return;
    let changed = false;
    svg.querySelectorAll('g.node').forEach(node => {
      const shape = node.querySelector('rect,polygon,circle,ellipse,path');
      const foreignObject = node.querySelector('foreignObject');
      const htmlLabel = foreignObject && foreignObject.querySelector('div,span');
      if (!shape || !foreignObject || !htmlLabel) return;

      const foBox = foreignObject.getBBox();
      const foRect = foreignObject.getBoundingClientRect();
      const labelRect = htmlLabel.getBoundingClientRect();
      if (!foBox.width || !foBox.height || !foRect.width || !foRect.height) return;

      const scaleX = foRect.width / foBox.width;
      const scaleY = foRect.height / foBox.height;
      const labelWidth = labelRect.width / scaleX;
      const labelHeight = labelRect.height / scaleY;
      const nextFoWidth = Math.ceil(Math.max(foBox.width, labelWidth + 10));
      const nextFoHeight = Math.ceil(Math.max(foBox.height, labelHeight + 8));
      const dx = nextFoWidth - foBox.width;
      const dy = nextFoHeight - foBox.height;
      if (dx <= 1 && dy <= 1) return;

      centerForeignObject(foreignObject, dx, dy);
      foreignObject.setAttribute('width', nextFoWidth);
      foreignObject.setAttribute('height', nextFoHeight);
      expandNodeShape(shape, nextFoWidth + 24, nextFoHeight + 18);
      changed = true;
    });
    if (changed) refreshSvgViewBox(svg);
  }
  function centerForeignObject(foreignObject, dx, dy){
    const labelGroup = foreignObject.closest('g.label');
    if (labelGroup && labelGroup !== foreignObject.ownerSVGElement) {
      const shifted = shiftTranslate(labelGroup, -dx / 2, -dy / 2);
      if (shifted) return;
    }
    const x = parseFloat(foreignObject.getAttribute('x') || foreignObject.getBBox().x || 0);
    const y = parseFloat(foreignObject.getAttribute('y') || foreignObject.getBBox().y || 0);
    foreignObject.setAttribute('x', x - dx / 2);
    foreignObject.setAttribute('y', y - dy / 2);
  }
  function shiftTranslate(el, dx, dy){
    const transform = el.getAttribute('transform') || '';
    const match = transform.match(/translate\(\s*([-0-9.]+)(?:[ ,]+([-0-9.]+))?\s*\)/);
    if (!match) return false;
    const x = parseFloat(match[1]);
    const y = parseFloat(match[2] || '0');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    el.setAttribute('transform', transform.replace(match[0], `translate(${x + dx}, ${y + dy})`));
    return true;
  }
  function expandNodeShape(shape, minWidth, minHeight){
    const box = shape.getBBox();
    const targetWidth = Math.max(box.width, minWidth);
    const targetHeight = Math.max(box.height, minHeight);
    if (targetWidth <= box.width + 1 && targetHeight <= box.height + 1) return;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const tag = shape.tagName.toLowerCase();
    if (tag === 'rect') {
      shape.setAttribute('x', cx - targetWidth / 2);
      shape.setAttribute('y', cy - targetHeight / 2);
      shape.setAttribute('width', targetWidth);
      shape.setAttribute('height', targetHeight);
    } else if (tag === 'ellipse') {
      shape.setAttribute('rx', targetWidth / 2);
      shape.setAttribute('ry', targetHeight / 2);
    } else if (tag === 'circle') {
      shape.setAttribute('r', Math.max(targetWidth, targetHeight) / 2);
    } else if (tag === 'polygon') {
      expandPolygon(shape, box, targetWidth, targetHeight);
    }
  }
  function expandPolygon(shape, box, targetWidth, targetHeight){
    const sx = box.width ? targetWidth / box.width : 1;
    const sy = box.height ? targetHeight / box.height : 1;
    const cx = box.x + box.width / 2;
    const cy = box.y + box.height / 2;
    const points = (shape.getAttribute('points') || '').trim().split(/\s+/).map(pair => {
      const [x, y] = pair.split(',').map(Number);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return pair;
      return `${cx + (x - cx) * sx},${cy + (y - cy) * sy}`;
    });
    shape.setAttribute('points', points.join(' '));
  }
  function refreshSvgViewBox(svg){
    try {
      const box = svg.getBBox();
      const pad = 8;
      svg.setAttribute('viewBox', `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`);
    } catch (_) {}
  }
  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }
  function rewriteSvgIds(root, prefix){
    const idMap = new Map();
    root.querySelectorAll('[id]').forEach(el => {
      const oldId = el.id;
      const newId = prefix + oldId;
      idMap.set(oldId, newId);
      el.id = newId;
    });
    if (!idMap.size) return;
    const replacements = [...idMap.entries()].sort((a, b) => b[0].length - a[0].length);
    root.querySelectorAll('*').forEach(el => {
      for (const attr of [...el.attributes]) {
        let value = attr.value;
        replacements.forEach(([oldId, newId]) => {
          value = value.replaceAll(`#${oldId}`, `#${newId}`);
        });
        if (value !== attr.value) el.setAttribute(attr.name, value);
      }
    });
    root.querySelectorAll('style').forEach(style => {
      let css = style.textContent || '';
      replacements.forEach(([oldId, newId]) => {
        css = css.replaceAll(`#${oldId}`, `#${newId}`);
      });
      style.textContent = css;
    });
  }

  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>

<script id="roadmap-animation-runtime-script">
(function(){
  "use strict";

  var manifest = {"version":1,"animations":[{"animationId":"deployment-rolling-update","sectionIndex":"1.6","sectionTitle":"Pod Service Deployment StatefulSet 等核心对象如何组合业务","targetHeading":"Deployment 和 ReplicaSet","mount":"after-heading","fragment":"deployment-rolling-update.html","order":5},{"animationId":"raft","sectionIndex":"2.3","sectionTitle":"Raft 如何处理选举 日志复制和一致性","targetHeading":null,"mount":"top","fragment":"raft.html","order":10},{"animationId":"scheduler-filter-score","sectionIndex":"4.2","sectionTitle":"调度约束和优先级策略如何影响 Pod 落点","targetHeading":null,"mount":"top","fragment":"scheduler-filter-score.html","order":20},{"animationId":"controller-reconcile","sectionIndex":"4.3","sectionTitle":"Controller Manager 和控制器模式如何维持期望状态","targetHeading":"控制器模式的本质","mount":"after-heading","fragment":"controller-reconcile.html","order":30},{"animationId":"pod-network-path","sectionIndex":"4.6","sectionTitle":"CNI 和集群网络插件如何提供 Pod 网络","targetHeading":"Kubernetes 网络模型","mount":"after-heading","fragment":"pod-network-path.html","order":40},{"animationId":"pod-create","sectionIndex":"5.1","sectionTitle":"Pod 生命周期完整管理如何定义状态和驱逐","targetHeading":null,"mount":"top","fragment":"pod-create.html","order":50},{"animationId":"pod-lifecycle","sectionIndex":"5.1","sectionTitle":"Pod 生命周期完整管理如何定义状态和驱逐","targetHeading":"Phase Conditions 和展示状态","mount":"after-heading","fragment":"pod-lifecycle.html","order":60}]};
  var registry = {};
  var mounted = {};
  var overlays = [];

  function normalizeText(value){
    return String(value || "").replace(/\s+/g, " ").trim();
  }

  function parseTitle(){
    var title = document.getElementById("d-title");
    var text = normalizeText(title ? title.textContent : "");
    var match = text.match(/^(\d+\.\d+)\s+(.+)$/);
    if (!match) return null;
    return { index: match[1], title: normalizeText(match[2]) };
  }

  function isCurrentSection(item, current){
    return current &&
      item.sectionIndex === current.index &&
      normalizeText(item.sectionTitle) === current.title;
  }

  function clearAll(){
    Object.keys(mounted).forEach(function(id){
      var handle = mounted[id];
      var entry = registry[id];
      if (entry && typeof entry.unmount === "function") {
        entry.unmount();
      }
      if (handle && handle.host && handle.host.parentNode) {
        handle.host.remove();
      }
      delete mounted[id];
    });
  }

  function ensureHost(item, body){
    var hostId = "roadmap-animation-mount-" + item.animationId;
    var host = body.querySelector("#" + hostId);
    if (host) return host;
    host = document.createElement("div");
    host.id = hostId;
    host.className = "roadmap-animation-mount";
    host.dataset.animationId = item.animationId;
    host.dataset.mount = item.targetHeading ? "after-heading" : "top";
    if (!item.targetHeading) {
      body.insertBefore(host, body.firstChild);
      return host;
    }
    var headings = Array.prototype.slice.call(body.querySelectorAll("h4"));
    var target = headings.find(function(heading){
      return normalizeText(heading.textContent) === normalizeText(item.targetHeading);
    });
    if (!target) {
      console.error(
        "[RoadmapAnimations] target h4 not found for " + item.animationId +
        ": " + item.sectionIndex + " " + item.targetHeading
      );
      host.className += " roadmap-animation-error";
      host.textContent = "动画挂载失败：找不到子标题 " + item.targetHeading;
      body.insertBefore(host, body.firstChild);
      return null;
    }
    target.insertAdjacentElement("afterend", host);
    return host;
  }

  function mountCurrent(){
    var drawer = document.getElementById("drawer");
    var body = document.getElementById("d-body");
    if (!drawer || !body || !drawer.classList.contains("open")) {
      clearAll();
      return;
    }
    var current = parseTitle();
    var selected = manifest.animations.filter(function(item){
      return isCurrentSection(item, current);
    }).sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
    var wanted = {};
    selected.forEach(function(item){ wanted[item.animationId] = true; });

    Object.keys(mounted).forEach(function(id){
      if (wanted[id]) return;
      var entry = registry[id];
      if (entry && typeof entry.unmount === "function") entry.unmount();
      if (mounted[id].host && mounted[id].host.parentNode) mounted[id].host.remove();
      delete mounted[id];
    });

    selected.forEach(function(item){
      var entry = registry[item.animationId];
      if (!entry || typeof entry.mount !== "function") {
        console.error("[RoadmapAnimations] animation not registered:", item.animationId);
        return;
      }
      var host = ensureHost(item, body);
      if (!host) return;
      if (mounted[item.animationId] && mounted[item.animationId].host === host) return;
      if (mounted[item.animationId] && mounted[item.animationId].host) {
        mounted[item.animationId].host.remove();
      }
      mounted[item.animationId] = { host: host };
      entry.mount(host);
    });
  }

  function setupObservers(){
    var drawer = document.getElementById("drawer");
    var title = document.getElementById("d-title");
    var body = document.getElementById("d-body");
    if (!drawer || !title || !body) return;
    new MutationObserver(mountCurrent).observe(drawer, {
      attributes: true,
      attributeFilter: ["class"]
    });
    new MutationObserver(mountCurrent).observe(title, {
      childList: true,
      characterData: true,
      subtree: true
    });
    new MutationObserver(function(){ setTimeout(mountCurrent, 0); }).observe(body, {
      childList: true
    });
    mountCurrent();
  }

  function register(entry){
    if (!entry || !entry.animationId) {
      console.error("[RoadmapAnimations] invalid animation registration", entry);
      return;
    }
    registry[entry.animationId] = entry;
    mountCurrent();
  }

  function closeTopOverlay(){
    var top = overlays[overlays.length - 1];
    if (top && typeof top.close === "function") {
      top.close();
      return true;
    }
    var legacy = document.querySelector("#pod-create-anim-overlay.open, #raft-anim-overlay.open");
    if (legacy) {
      var zoom = legacy.querySelector(".pc-zoom, .ra-zoom");
      if (zoom) zoom.click();
      else legacy.classList.remove("open");
      return true;
    }
    return false;
  }

  function createOverlay(animationId, root, zoomButton){
    var overlay = document.getElementById("roadmap-animation-overlay-" + animationId);
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.id = "roadmap-animation-overlay-" + animationId;
      overlay.className = "roadmap-animation-overlay";
      overlay.innerHTML = '<div class="ka-ov-backdrop"></div><div class="ka-ov-box"></div>';
      document.body.appendChild(overlay);
    }
    var box = overlay.querySelector(".ka-ov-box");
    var placeholder = null;
    var api = {
      isOpen: function(){ return overlay.classList.contains("open"); },
      open: function(){
        if (!root || api.isOpen()) return;
        placeholder = document.createElement("div");
        root.parentNode.insertBefore(placeholder, root);
        box.appendChild(root);
        overlay.classList.add("open");
        overlays.push(api);
        if (zoomButton) zoomButton.textContent = "✕ 还原";
      },
      close: function(){
        if (!api.isOpen()) return;
        if (root && placeholder && placeholder.parentNode) {
          placeholder.parentNode.insertBefore(root, placeholder);
        }
        if (placeholder) placeholder.remove();
        placeholder = null;
        overlay.classList.remove("open");
        overlays = overlays.filter(function(item){ return item !== api; });
        if (zoomButton) zoomButton.textContent = "⛶ 放大";
      },
      toggle: function(){ api.isOpen() ? api.close() : api.open(); }
    };
    overlay.querySelector(".ka-ov-backdrop").onclick = api.close;
    return api;
  }

  function createPlayer(config){
    var root = config.root;
    var tabs = Array.prototype.slice.call(root.querySelectorAll("[data-ch]"));
    var caption = root.querySelector("[data-role='caption']");
    var play = root.querySelector("[data-action='play']");
    var step = root.querySelector("[data-action='step']");
    var reset = root.querySelector("[data-action='reset']");
    var speed = root.querySelector("[data-action='speed']");
    var zoom = root.querySelector("[data-action='zoom']");
    var index = 0;
    var stepIndex = 0;
    var playing = false;
    var epoch = 0;
    var speedValue = 1;
    var overlay = zoom ? createOverlay(config.animationId, root, zoom) : null;

    function wait(ms){
      var mine = epoch;
      return new Promise(function(resolve){
        setTimeout(function(){ resolve(mine === epoch); }, ms * speedValue);
      });
    }

    function setTab(nextIndex){
      epoch++;
      playing = false;
      index = nextIndex;
      stepIndex = 0;
      if (play) play.textContent = "▶ 播放本幕";
      tabs.forEach(function(tab){
        tab.classList.toggle("on", Number(tab.dataset.ch) === index);
      });
      if (typeof config.resetState === "function") config.resetState(index);
      if (typeof config.render === "function") config.render(index);
      if (caption) caption.innerHTML = config.chapters[index].intro || "";
    }

    function runStep(){
      var chapter = config.chapters[index];
      if (!chapter || stepIndex >= chapter.steps.length) return Promise.resolve(false);
      var mine = epoch;
      var current = chapter.steps[stepIndex++];
      if (caption) caption.innerHTML = current.text;
      return Promise.resolve(current.run({ wait: wait, epoch: function(){ return epoch; } }))
        .then(function(){ return mine === epoch; });
    }

    function loop(){
      var mine = epoch;
      (function next(){
        if (!playing || mine !== epoch) return;
        if (stepIndex >= config.chapters[index].steps.length) {
          playing = false;
          if (play) play.textContent = "▶ 播放本幕";
          if (caption) caption.innerHTML += config.finishedText
            ? config.finishedText(index)
            : "<br><b>本幕结束</b>，可切换页签重看。";
          return;
        }
        runStep().then(function(ok){ if (ok && playing) wait(420).then(next); });
      })();
    }

    tabs.forEach(function(tab){
      tab.onclick = function(){ setTab(Number(tab.dataset.ch)); };
    });
    if (play) {
      play.onclick = function(){
        if (stepIndex >= config.chapters[index].steps.length) setTab(index);
        playing = !playing;
        play.textContent = playing ? "⏸ 暂停" : "▶ 播放本幕";
        if (playing) loop();
      };
    }
    if (step) step.onclick = function(){ if (!playing) runStep(); };
    if (reset) reset.onclick = function(){ setTab(index); };
    if (speed) speed.onchange = function(){ speedValue = parseFloat(speed.value); };
    if (zoom && overlay) zoom.onclick = overlay.toggle;

    setTab(0);
    return {
      wait: wait,
      setTab: setTab,
      destroy: function(){
        epoch++;
        playing = false;
        if (overlay) overlay.close();
      }
    };
  }

  window.RoadmapAnimations = {
    manifest: manifest,
    register: register,
    mountCurrent: mountCurrent,
    createOverlay: createOverlay,
    createPlayer: createPlayer,
    normalizeText: normalizeText
  };

  document.addEventListener("keydown", function(event){
    if (event.key === "Escape" && closeTopOverlay()) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupObservers);
  } else {
    setupObservers();
  }
})();
</script>

<script id="deployment-rolling-update-script">
(function(){
  "use strict";
  var ID = "deployment-rolling-update";
  var NS = "http://www.w3.org/2000/svg";
  var INK = "#1f2933", PAPER = "#fffdf5", IDLE = "#e7e5d8",
      ACTIVE = "#bfdbfe", ACTIVE_BD = "#1d4ed8",
      DONE = "#bbf7d0", DONE_BD = "#15803d",
      WARN = "#fde68a", WARN_BD = "#b45309",
      FAIL = "#fecaca", FAIL_BD = "#b91c1c", MUTED = "#6b7280";
  var player = null, root = null, ui = {}, state = {};
  var podSlots = [
    ["old-1", 104, 236, "old"], ["old-2", 214, 236, "old"], ["old-3", 324, 236, "old"],
    ["new-1", 564, 236, "new"], ["new-2", 674, 236, "new"], ["new-3", 784, 236, "new"], ["new-4", 894, 236, "new"]
  ];
  var boxes = {
    deploy:[120,86,"Deployment","replicas=3"],
    controller:[350,86,"Deployment Controller","rollout reconcile"],
    oldrs:[214,164,"old ReplicaSet","template hash abc"],
    newrs:[674,164,"new ReplicaSet","template hash def"],
    service:[474,360,"Service / Endpoints","只接 Ready Pod"],
    api:[804,86,"API Server","status / scale"]
  };

  function el(tag, attrs, parent){
    var item = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function(key){ item.setAttribute(key, attrs[key]); });
    if (parent) parent.appendChild(item);
    return item;
  }
  function label(parent, x, y, text, size, weight, fill, anchor){
    var t = el("text", { x:x, y:y, "text-anchor":anchor || "middle", "font-size":size || 12.5, "font-weight":weight || 700, fill:fill || INK }, parent);
    t.textContent = text;
    return t;
  }
  function rect(parent, x, y, w, h, fill, stroke){
    return el("rect", { x:x, y:y, width:w, height:h, rx:10, fill:fill || PAPER, stroke:stroke || INK, "stroke-width":2 }, parent);
  }
  function line(parent, x1, y1, x2, y2){
    el("line", { x1:x1, y1:y1, x2:x2, y2:y2, stroke:"#9ca3af", "stroke-width":1.5, "stroke-dasharray":"5 5" }, parent);
  }
  function setPanel(name, value){ if (ui.panels[name]) ui.panels[name].textContent = value; }
  function statusColor(status){
    if (status === "active") return [ACTIVE, ACTIVE_BD];
    if (status === "ready") return [DONE, DONE_BD];
    if (status === "creating") return [WARN, WARN_BD];
    if (status === "terminating") return [FAIL, FAIL_BD];
    if (status === "gone") return ["#f3f4f6", "#cbd5e1"];
    return [PAPER, INK];
  }

  function buildDom(host){
    root = document.createElement("div");
    root.id = ID;
    root.className = "ka-anim";
    root.setAttribute("data-roadmap-animation-id", ID);
    root.innerHTML =
      '<div class="ka-head"><strong>Deployment 滚动更新动画</strong><small>old ReplicaSet scale down · new ReplicaSet scale up</small><button class="ka-zoom" data-action="zoom">⛶ 放大</button></div>' +
      '<div class="ka-tabs"><button data-ch="0">① 新旧 ReplicaSet</button><button data-ch="1">② 滚动替换</button><button data-ch="2">③ 暂停回滚</button></div>' +
      '<div class="ka-stage"><svg viewBox="0 0 980 500" role="img" aria-label="Deployment rolling update animation"></svg></div>' +
      '<div class="ka-panels"><div class="ka-panel"><b>Strategy</b><span data-panel="strategy">RollingUpdate</span></div><div class="ka-panel"><b>Replicas</b><span data-panel="replicas">desired=3 old=3 new=0</span></div><div class="ka-panel"><b>Availability</b><span data-panel="availability">available=3</span></div><div class="ka-panel"><b>Progress</b><span data-panel="progress">revision 1 stable</span></div></div>' +
      '<div class="ka-caption" data-role="caption"></div>' +
      '<div class="ka-ctrl"><button data-action="play">▶ 播放本幕</button><button data-action="step">▷ 下一步</button><button data-action="reset">⏮ 重置本幕</button><label>速度 <select data-action="speed"><option value="1.6">慢</option><option value="1" selected>正常</option><option value="0.55">快</option></select></label></div>' +
      '<div class="ka-legend"><span><i style="background:#bbf7d0"></i>Ready / available</span><span><i style="background:#fde68a"></i>creating / surge</span><span><i style="background:#fecaca"></i>terminating / unavailable</span><span>核心约束：先让新 Pod Ready，再按 maxUnavailable 缩旧 Pod</span></div>';
    host.appendChild(root);
    ui.svg = root.querySelector("svg");
    ui.panels = {};
    root.querySelectorAll("[data-panel]").forEach(function(panel){ ui.panels[panel.dataset.panel] = panel; });
    drawScene();
  }

  function drawScene(){
    var svg = ui.svg;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    line(svg, boxes.deploy[0]+74, boxes.deploy[1], boxes.controller[0]-74, boxes.controller[1]);
    line(svg, boxes.controller[0]+74, boxes.controller[1], boxes.api[0]-74, boxes.api[1]);
    line(svg, boxes.controller[0]-20, boxes.controller[1]+34, boxes.oldrs[0], boxes.oldrs[1]-36);
    line(svg, boxes.controller[0]+70, boxes.controller[1]+34, boxes.newrs[0], boxes.newrs[1]-36);
    line(svg, boxes.oldrs[0], boxes.oldrs[1]+36, boxes.service[0]-100, boxes.service[1]-35);
    line(svg, boxes.newrs[0], boxes.newrs[1]+36, boxes.service[0]+100, boxes.service[1]-35);
    Object.keys(boxes).forEach(function(key){
      var b = boxes[key];
      ui[key] = { box: rect(svg, b[0]-82, b[1]-32, 164, 64, PAPER, INK) };
      label(svg, b[0], b[1]-5, b[2], 13, 800);
      ui[key].sub = label(svg, b[0], b[1]+16, b[3], 10.5, 600, MUTED);
    });
    rect(svg, 42, 204, 336, 94, "#f8fafc", INK).setAttribute("stroke-dasharray", "7 6");
    rect(svg, 502, 204, 430, 94, "#f8fafc", INK).setAttribute("stroke-dasharray", "7 6");
    label(svg, 210, 218, "old pods", 11, 800, MUTED);
    label(svg, 716, 218, "new pods", 11, 800, MUTED);
    podSlots.forEach(function(slot){
      var id = slot[0], x = slot[1], y = slot[2];
      ui[id] = {
        box: rect(svg, x-38, y-20, 76, 40, PAPER, INK),
        text: label(svg, x, y+5, id.replace("-", " "), 11, 800)
      };
    });
    ui.arrowText = label(svg, 490, 322, "", 12, 900, WARN_BD);
  }

  function resetState(chapter){
    state = {
      strategy:"RollingUpdate maxSurge=1 maxUnavailable=1",
      replicas:"desired=3 old=3 new=0",
      availability:"available=3",
      progress: chapter === 2 ? "revision 2 partially rolled out" : "revision 1 stable",
      boxes:{deploy:"ready",controller:"idle",oldrs:"ready",newrs:"idle",service:"ready",api:"idle"},
      pods:{
        "old-1":"ready", "old-2":"ready", "old-3":"ready",
        "new-1":"gone", "new-2":"gone", "new-3":"gone", "new-4":"gone"
      },
      arrow:""
    };
  }
  function render(){
    Object.keys(boxes).forEach(function(key){
      var c = statusColor(state.boxes[key]);
      ui[key].box.setAttribute("fill", c[0]);
      ui[key].box.setAttribute("stroke", c[1]);
    });
    Object.keys(state.pods).forEach(function(key){
      var status = state.pods[key];
      var c = statusColor(status);
      ui[key].box.setAttribute("fill", c[0]);
      ui[key].box.setAttribute("stroke", c[1]);
      ui[key].box.setAttribute("opacity", status === "gone" ? ".28" : "1");
      ui[key].text.setAttribute("opacity", status === "gone" ? ".38" : "1");
      ui[key].text.textContent = status === "gone" ? "—" : key.replace("-", " ");
    });
    setPanel("strategy", state.strategy);
    setPanel("replicas", state.replicas);
    setPanel("availability", state.availability);
    setPanel("progress", state.progress);
    ui.arrowText.textContent = state.arrow;
  }
  function set(values){
    Object.keys(values).forEach(function(key){ state[key] = values[key]; });
    render();
  }
  function patchPods(next){
    Object.keys(next).forEach(function(key){ state.pods[key] = next[key]; });
    render();
  }
  function mark(active, done){
    Object.keys(state.boxes).forEach(function(key){ state.boxes[key] = "idle"; });
    (done || []).forEach(function(key){ state.boxes[key] = "ready"; });
    (active || []).forEach(function(key){ state.boxes[key] = "active"; });
    render();
  }

  var CHAPTERS = [
    {
      intro:"Deployment 更新模板后不会直接改旧 Pod，而是创建新的 ReplicaSet，再逐步调节 old/new replicas。",
      steps:[
        { text:"当前 Deployment revision 1 稳定运行：desired=3，old ReplicaSet 管着 3 个 Ready Pod。", run:function(ctx){ mark(["deploy","oldrs"], ["service"]); set({replicas:"desired=3 old=3 new=0", availability:"available=3", progress:"revision 1 stable", arrow:"old RS owns all traffic-ready Pods"}); return ctx.wait(700); } },
        { text:"用户修改镜像或模板字段。Deployment Controller 计算出新的 pod-template-hash，创建 <b>new ReplicaSet</b>，但先不删除旧 Pod。", run:function(ctx){ mark(["controller","newrs","api"], ["deploy","oldrs","service"]); set({progress:"revision 2 created", arrow:"new template hash def"}); return ctx.wait(760); } },
        { text:"此时新旧 ReplicaSet 并存：old RS 代表旧模板，new RS 代表新模板。Deployment 的任务是让 new 逐步接管 desired replicas。", run:function(ctx){ mark(["oldrs","newrs"], ["deploy","service"]); set({replicas:"desired=3 old=3 new=0", progress:"old/new RS coexist"}); return ctx.wait(760); } }
      ]
    },
    {
      intro:"RollingUpdate 的核心是受 <code>maxSurge</code> 和 <code>maxUnavailable</code> 约束的 scale up / scale down 节奏。",
      steps:[
        { text:"maxSurge=1 允许临时多出 1 个 Pod。控制器先把 new RS 扩到 1，创建 new-1。", run:function(ctx){ mark(["controller","newrs"], ["deploy","oldrs","service"]); patchPods({"new-1":"creating"}); set({replicas:"desired=3 old=3 new=1", availability:"available=3", progress:"surge +1 creating", arrow:"scale up new RS before cutting old"}); return ctx.wait(760); } },
        { text:"new-1 Ready 后进入 Service 后端，available 变成 4。此时可以安全缩旧副本。", run:function(ctx){ patchPods({"new-1":"ready"}); set({availability:"available=4", progress:"new-1 Ready", arrow:"Service only routes Ready Pods"}); return ctx.wait(720); } },
        { text:"控制器把 old RS 从 3 缩到 2，old-1 进入 Terminating。整体 available 仍满足最小可用要求。", run:function(ctx){ patchPods({"old-1":"terminating"}); set({replicas:"desired=3 old=2 new=1", availability:"available=3", progress:"scale down old RS", arrow:"maxUnavailable bounds the cutover"}); return ctx.wait(760); } },
        { text:"继续循环：new-2 创建并 Ready，然后 old-2 被缩掉。new replicas 上升，old replicas 下降。", run:function(ctx){ patchPods({"old-1":"gone","new-2":"ready","old-2":"terminating"}); set({replicas:"desired=3 old=1 new=2", availability:"available=3", progress:"new=2 old=1", arrow:"rolling window moves forward"}); return ctx.wait(820); } },
        { text:"最后 new-3 Ready，old-3 终止，old RS 缩到 0。Deployment 完成 rollout，revision 2 稳定。", run:function(ctx){ patchPods({"old-2":"gone","old-3":"gone","new-3":"ready"}); mark(["deploy","newrs"], ["controller","api","service"]); set({replicas:"desired=3 old=0 new=3", availability:"available=3", progress:"revision 2 complete", arrow:"old RS kept for rollback history, replicas=0"}); return ctx.wait(840); } }
      ]
    },
    {
      intro:"滚动更新可以暂停，也可以在新版本异常时回滚，本质仍是调节新旧 ReplicaSet 的 replicas。",
      steps:[
        { text:"发布到一半时发现新版本指标异常：new=1、old=2。可以先 <code>kubectl rollout pause</code> 暂停继续替换。", run:function(ctx){ mark(["deploy","controller"], ["oldrs","newrs","service"]); patchPods({"old-1":"gone","old-2":"ready","old-3":"ready","new-1":"ready","new-2":"gone","new-3":"gone","new-4":"gone"}); set({replicas:"desired=3 old=2 new=1", availability:"available=3", progress:"paused", arrow:"pause freezes further scale changes"}); return ctx.wait(780); } },
        { text:"暂停期间可以继续修改 Deployment 模板或排查问题；控制器不会继续把 old replicas 缩到 0。", run:function(ctx){ mark(["controller"], ["deploy","oldrs","newrs","service"]); set({progress:"paused / inspecting", arrow:"old RS still carries most traffic"}); return ctx.wait(720); } },
        { text:"如果确认新版本有问题，执行 rollback：控制器把 old RS 扩回 3，把 new RS 缩到 0。", run:function(ctx){ patchPods({"old-1":"ready","old-2":"ready","old-3":"ready","new-1":"terminating"}); mark(["controller","oldrs"], ["deploy","service"]); set({replicas:"desired=3 old=3 new=0", availability:"available=3", progress:"rollback to revision 1", arrow:"rollback is reverse scaling"}); return ctx.wait(820); } },
        { text:"如果问题修复，也可以 resume，继续按 rolling window 推进。暂停、恢复、回滚都不是直接替换 Pod，而是围绕 ReplicaSet replicas 做状态收敛。", run:function(ctx){ patchPods({"new-1":"gone"}); mark(["deploy","oldrs"], ["controller","service"]); set({replicas:"desired=3 old=3 new=0", availability:"available=3", progress:"revision 1 restored", arrow:"ReplicaSet history enables rollback"}); return ctx.wait(820); } }
      ]
    }
  ];

  function mount(host){
    if (host.querySelector("[data-roadmap-animation-id='" + ID + "']")) return;
    buildDom(host);
    player = window.RoadmapAnimations.createPlayer({
      animationId: ID,
      root: root,
      chapters: CHAPTERS,
      resetState: resetState,
      render: render,
      finishedText: function(){ return "<br><b>本幕结束</b>，关注 old/new ReplicaSet 的 replicas 如何收敛。"; }
    });
  }
  function unmount(){
    if (player) player.destroy();
    player = null;
    if (root) root.remove();
    root = null;
  }
  function init(){
    window.RoadmapAnimations.register({ animationId: ID, mount: mount, unmount: unmount });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>

<script id="raft-anim-script">
(function(){
  "use strict";
  var SECTION_KEY = "Raft 如何处理选举";
  var INK = "#1f2933", PAPER = "#fffdf5", FOLLOWER = "#e7e5d8",
      CANDIDATE = "#fde68a", LEADER = "#fca5a5",
      PENDING = "#fde68a", PENDING_BD = "#b45309",
      COMMITTED = "#bbf7d0", COMMITTED_BD = "#15803d";
  var NS = "http://www.w3.org/2000/svg";

  /* 节点布局：上半 A、B（旧 Leader 一侧），下半 C、D、E */
  var NODE_POS = { B:[250,112], A:[478,112], C:[172,332], D:[372,356], E:[572,332] };
  var CLIENT = [52, 222];

  var epoch = 0, playing = false, spd = 1, chapter = 0, stepIdx = 0;
  var nodes = {}, ui = {};

  function el(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function delay(ms){
    var myE = epoch;
    return new Promise(function(res){ setTimeout(function(){ if (myE === epoch) res(); }, ms * spd); });
  }

  function freshState(){
    ["A","B","C","D","E"].forEach(function(id){
      if (!nodes[id]) nodes[id] = { id:id };
      nodes[id].state = "follower";
      nodes[id].term = 0;
      nodes[id].log = [];
    });
  }

  function buildDom(root){
    root.innerHTML =
      '<div class="ra-head">⚡ Raft 原理动画<small>仿 thesecretlivesofdata.com/raft · 对应本节 5 节点授课场景</small>' +
        '<button class="ra-zoom" id="ra-zoom" title="放大演示">⛶ 放大</button></div>' +
      '<div class="ra-tabs">' +
        '<button data-ch="0">① 领导选举</button>' +
        '<button data-ch="1">② 日志复制</button>' +
        '<button data-ch="2">③ 网络分区与恢复</button>' +
      '</div>' +
      '<svg viewBox="0 0 720 470" id="ra-svg"></svg>' +
      '<div class="ra-caption" id="ra-caption"></div>' +
      '<div class="ra-ctrl">' +
        '<button id="ra-play">▶ 播放本幕</button>' +
        '<button id="ra-step">▷ 下一步</button>' +
        '<button id="ra-reset">⏮ 重置本幕</button>' +
        '<label>速度 <select id="ra-speed">' +
          '<option value="1.6">慢</option><option value="1" selected>正常</option><option value="0.55">快</option>' +
        '</select></label>' +
      '</div>' +
      '<div class="ra-legend">' +
        '<span><i style="background:#e7e5d8"></i>Follower</span>' +
        '<span><i style="background:#fde68a"></i>Candidate / 未提交日志</span>' +
        '<span><i style="background:#fca5a5"></i>Leader</span>' +
        '<span><i style="background:#bbf7d0"></i>已提交日志</span>' +
      '</div>';

    var svg = root.querySelector("#ra-svg");
    ui = {
      svg: svg,
      caption: root.querySelector("#ra-caption"),
      play: root.querySelector("#ra-play"),
      step: root.querySelector("#ra-step"),
      reset: root.querySelector("#ra-reset"),
      speed: root.querySelector("#ra-speed"),
      zoom: root.querySelector("#ra-zoom"),
      tabs: Array.prototype.slice.call(root.querySelectorAll(".ra-tabs button"))
    };

    /* 分区墙 */
    ui.wall = el("line", { x1:130, y1:226, x2:706, y2:226, stroke:"#b91c1c",
      "stroke-width":3.5, "stroke-dasharray":"11 9", opacity:0 }, svg);

    /* 客户端 */
    var cg = el("g", {}, svg);
    el("rect", { x:CLIENT[0]-36, y:CLIENT[1]-26, width:72, height:52, rx:9,
      fill:PAPER, stroke:INK, "stroke-width":2 }, cg);
    var ct = el("text", { x:CLIENT[0], y:CLIENT[1]+5, "text-anchor":"middle",
      "font-size":13, "font-weight":700, fill:INK }, cg);
    ct.textContent = "客户端";

    /* 节点 */
    ["A","B","C","D","E"].forEach(function(id){
      var p = NODE_POS[id];
      var g = el("g", {}, svg);
      var n = nodes[id];
      n.gfx = {
        ring: el("circle", { cx:p[0], cy:p[1], r:40, fill:"none", stroke:PENDING_BD,
          "stroke-width":3.5, opacity:0, "stroke-linecap":"round" }, g),
        circle: el("circle", { cx:p[0], cy:p[1], r:30, fill:FOLLOWER, stroke:INK,
          "stroke-width":2.5 }, g),
        letter: el("text", { x:p[0], y:p[1]+6, "text-anchor":"middle",
          "font-size":19, "font-weight":800, fill:INK }, g),
        star: el("text", { x:p[0]+22, y:p[1]-20, "font-size":15, opacity:0 }, g),
        term: el("text", { x:p[0], y:p[1]+52, "text-anchor":"middle",
          "font-size":11.5, fill:"#6b7280" }, g),
        logG: el("g", {}, g),
        badge: el("text", { x:p[0], y:p[1]-46, "text-anchor":"middle",
          "font-size":12.5, "font-weight":800, fill:COMMITTED_BD, opacity:0 }, g)
      };
      n.gfx.letter.textContent = id;
      n.gfx.star.textContent = "★";
      n.gfx.ringLen = 2 * Math.PI * 40;
      n.gfx.ring.setAttribute("stroke-dasharray", String(n.gfx.ringLen));
    });
    ui.msgLayer = el("g", {}, svg);
  }

  function render(){
    ["A","B","C","D","E"].forEach(function(id){
      var n = nodes[id], g = n.gfx, p = NODE_POS[id];
      g.circle.setAttribute("fill",
        n.state === "leader" ? LEADER : n.state === "candidate" ? CANDIDATE : FOLLOWER);
      g.star.setAttribute("opacity", n.state === "leader" ? 1 : 0);
      g.term.textContent = "term " + n.term;
      /* 日志槽 */
      while (g.logG.firstChild) g.logG.removeChild(g.logG.firstChild);
      n.log.forEach(function(entry, i){
        var x = p[0] - (n.log.length * 26 - 4) / 2 + i * 26, y = p[1] + 60;
        el("rect", { x:x, y:y, width:22, height:18, rx:4,
          fill: entry.committed ? COMMITTED : PENDING,
          stroke: entry.committed ? COMMITTED_BD : PENDING_BD, "stroke-width":2 }, g.logG);
        var t = el("text", { x:x+11, y:y+13.5, "text-anchor":"middle",
          "font-size":11.5, "font-weight":700, fill:INK }, g.logG);
        t.textContent = entry.v;
      });
    });
  }

  function badge(id, text, ok){
    var b = nodes[id].gfx.badge;
    b.textContent = text;
    b.setAttribute("fill", ok ? COMMITTED_BD : "#b91c1c");
    b.setAttribute("opacity", 1);
    var myE = epoch;
    setTimeout(function(){ if (myE === epoch) b.setAttribute("opacity", 0); }, 1600 * spd);
  }

  /* 选举计时器圆环（耗尽式） */
  function ring(id, dur){
    var g = nodes[id].gfx, myE = epoch;
    g.ring.setAttribute("opacity", 0.9);
    var t0 = performance.now(), D = dur * spd;
    return new Promise(function(res){
      (function tick(now){
        if (myE !== epoch) { g.ring.setAttribute("opacity", 0); return; }
        var f = Math.min((now - t0) / D, 1);
        g.ring.setAttribute("stroke-dashoffset", String(g.ringLen * f));
        if (f < 1) requestAnimationFrame(tick);
        else { g.ring.setAttribute("opacity", 0); g.ring.setAttribute("stroke-dashoffset", 0); res(); }
      })(t0);
    });
  }
  function stopRings(){
    ["A","B","C","D","E"].forEach(function(id){
      nodes[id].gfx.ring.setAttribute("opacity", 0);
      nodes[id].gfx.ring.setAttribute("stroke-dashoffset", 0);
    });
  }

  /* 飞行消息。kind: vote / grant / hb / entry / ack / reply / client */
  function msg(from, to, kind, dur){
    var f = from === "client" ? CLIENT : NODE_POS[from];
    var t = to === "client" ? CLIENT : NODE_POS[to];
    dur = (dur || 520) * spd;
    var shape;
    if (kind === "entry") {
      shape = el("rect", { width:15, height:13, rx:3, fill:PENDING, stroke:PENDING_BD, "stroke-width":2 }, ui.msgLayer);
    } else {
      var fill = kind === "vote" ? PAPER : kind === "grant" || kind === "ack" ? COMMITTED
               : kind === "hb" ? "#fcd34d" : kind === "reply" ? COMMITTED : INK;
      shape = el("circle", { r: kind === "hb" ? 5 : 7, fill:fill, stroke:INK, "stroke-width":2 }, ui.msgLayer);
    }
    var myE = epoch, t0 = performance.now();
    return new Promise(function(res){
      (function tick(now){
        if (myE !== epoch) { shape.remove(); return; }
        var f01 = Math.min((now - t0) / dur, 1);
        var e2 = f01 < .5 ? 2*f01*f01 : 1 - Math.pow(-2*f01+2, 2)/2;
        var x = f[0] + (t[0]-f[0]) * e2, y = f[1] + (t[1]-f[1]) * e2;
        if (kind === "entry") { shape.setAttribute("x", x-7.5); shape.setAttribute("y", y-6.5); }
        else { shape.setAttribute("cx", x); shape.setAttribute("cy", y); }
        if (f01 < 1) requestAnimationFrame(tick);
        else { shape.remove(); res(); }
      })(t0);
    });
  }
  function bcast(from, tos, kind, dur){
    return Promise.all(tos.map(function(t){ return msg(from, t, kind, dur); }));
  }

  /* ===== 三幕脚本 ===== */
  function chapterInit(ch){
    freshState();
    stopRings();
    ui.wall.setAttribute("opacity", 0);
    if (ch >= 1) {
      ["A","B","C","D","E"].forEach(function(id){ nodes[id].term = 1; });
      nodes.B.state = "leader";
    }
    if (ch >= 2) {
      ["A","B","C","D","E"].forEach(function(id){ nodes[id].log = [{ v:5, committed:true }]; });
    }
    render();
  }

  var CHAPTERS = [
  { name:"① 领导选举", intro:"五个节点以 <b>Follower</b> 身份启动（term 0）。每个节点都有一个<b>随机时长的选举计时器</b>，收不到 Leader 心跳计时器就会走完。点「播放本幕」或「下一步」。",
    steps: [
    { text:"所有节点都在倒计时。<b>B 的计时器最先走完</b>——随机超时就是为了避免大家同时发起选举、互相抢票。",
      run: function(){
        ring("A", 2600); ring("C", 2400); ring("D", 2800); ring("E", 2500);
        return ring("B", 1500).then(function(){ stopRings(); });
      } },
    { text:"B 超时后变成 <b>Candidate</b>，把任期升到 <b>term 1</b>，先给自己投一票（1/5）。",
      run: function(){ nodes.B.state = "candidate"; nodes.B.term = 1; render(); badge("B", "票数 1/5", true); return delay(900); } },
    { text:"B 向其余四个节点发送 <b>RequestVote</b>。",
      run: function(){ return bcast("B", ["A","C","D","E"], "vote", 620); } },
    { text:"A、C、D、E 在 term 1 里还没投过票，全部把票投给 B —— <b>5/5</b>，超过半数（3）。",
      run: function(){
        ["A","C","D","E"].forEach(function(id){ nodes[id].term = 1; }); render();
        return Promise.all(["A","C","D","E"].map(function(id){ return msg(id, "B", "grant", 620); })).then(function(){ badge("B", "票数 5/5 ✓", true); return delay(700); });
      } },
    { text:"B 拿到多数票，成为 <b>Leader</b>。从现在起由它接收所有写请求。",
      run: function(){ nodes.B.state = "leader"; render(); return delay(900); } },
    { text:"Leader 周期性向所有 Follower 发送<b>心跳</b>（空的 AppendEntries）。Follower 每收到一次心跳就重置自己的选举计时器——只要心跳不断，就不会有人发起新选举，集群保持稳定。",
      run: function(){
        return bcast("B", ["A","C","D","E"], "hb", 480)
          .then(function(){ return delay(420); })
          .then(function(){ return bcast("B", ["A","C","D","E"], "hb", 480); })
          .then(function(){ return delay(420); })
          .then(function(){ return bcast("B", ["A","C","D","E"], "hb", 480); });
      } }
  ]},
  { name:"② 日志复制", intro:"接上一幕：B 已是 term 1 的 Leader。这一幕演示一次完整写入——课上举的例子是客户端写一个值 <b>5</b>。",
    steps: [
    { text:"客户端把 <b>SET 5</b> 发给 Leader B。所有写请求都必须经过 Leader。",
      run: function(){ return msg("client", "B", "client", 700); } },
    { text:"B 先把 5 <b>追加到自己的日志</b>——黄色表示已写入但<b>未提交</b>，还不能被读到。",
      run: function(){ nodes.B.log.push({ v:5, committed:false }); render(); return delay(900); } },
    { text:"下一次心跳里，B 通过 <b>AppendEntries</b> 把这条日志带给所有 Follower。",
      run: function(){
        return bcast("B", ["A","C","D","E"], "entry", 620).then(function(){
          ["A","C","D","E"].forEach(function(id){ nodes[id].log.push({ v:5, committed:false }); });
          render(); return delay(300);
        });
      } },
    { text:"Follower 写入本地日志后逐个应答。B 统计确认数：<b>5/5</b>，早已超过半数（3）。",
      run: function(){
        return Promise.all(["A","C","D","E"].map(function(id){ return msg(id, "B", "ack", 620); }))
          .then(function(){ badge("B", "确认 5/5 ✓", true); return delay(700); });
      } },
    { text:"超过半数确认 → B <b>提交（commit）</b>这条日志（变绿），并响应客户端「写入成功」。注意：Leader 自己 commit 了就可以应答，这是默认的弱一致语义。",
      run: function(){
        nodes.B.log[nodes.B.log.length-1].committed = true; render();
        return msg("B", "client", "reply", 700);
      } },
    { text:"B 在后续心跳中告诉 Follower「这条日志已提交」，Follower 也各自 commit。至此整个集群对值 5 达成一致——这就是<b>日志复制（log replication）</b>。",
      run: function(){
        return bcast("B", ["A","C","D","E"], "hb", 480).then(function(){
          ["A","C","D","E"].forEach(function(id){ nodes[id].log[nodes[id].log.length-1].committed = true; });
          render(); return delay(600);
        });
      } }
  ]},
  { name:"③ 网络分区与恢复", intro:"接上一幕：B 是 term 1 的 Leader，值 5 已在全集群提交。现在网络出了问题——这正是课上重点演示的<b>脑裂</b>场景。",
    steps: [
    { text:"<b>网络分区</b>出现：上面的 A、B 和下面的 C、D、E 互相失联。",
      run: function(){ ui.wall.setAttribute("opacity", 1); return delay(900); } },
    { text:"C、D、E 收不到 Leader 的心跳，选举计时器走完。<b>C 率先超时</b>，变成 Candidate，任期升到 <b>term 2</b>。",
      run: function(){
        ring("D", 2300); ring("E", 2500);
        return ring("C", 1400).then(function(){
          stopRings(); nodes.C.state = "candidate"; nodes.C.term = 2; render(); return delay(600);
        });
      } },
    { text:"C 获得 D、E 的选票——下半边有 3 个节点，<b>3/5 本身就是多数</b>，C 成为 term 2 的新 Leader。注意：此刻集群里同时存在两个 Leader，这就是<b>脑裂</b>。",
      run: function(){
        return bcast("C", ["D","E"], "vote", 560).then(function(){
          return Promise.all([msg("D","C","grant",560), msg("E","C","grant",560)]);
        }).then(function(){
          badge("C", "票数 3/5 ✓", true);
          nodes.C.state = "leader"; nodes.D.term = 2; nodes.E.term = 2; render();
          return delay(800);
        });
      } },
    { text:"一个客户端把 <b>SET 3</b> 发给旧 Leader B。B 追加日志并复制，但隔着分区<b>只有 A 能确认：2/5 凑不齐多数</b>——这条日志永远无法提交。少数派一侧实际上退化成了只读。",
      run: function(){
        return msg("client", "B", "client", 650).then(function(){
          nodes.B.log.push({ v:3, committed:false }); render();
          return msg("B", "A", "entry", 560);
        }).then(function(){
          nodes.A.log.push({ v:3, committed:false }); render();
          return msg("A", "B", "ack", 560);
        }).then(function(){ badge("B", "确认 2/5 ✗", false); return delay(1000); });
      } },
    { text:"另一个客户端把 <b>SET 8</b> 发给新 Leader C。C、D、E 三票在手，<b>3/5 达到多数 → 提交成功</b>。「真理掌握在大多数人手里」。",
      run: function(){
        return msg("client", "C", "client", 650).then(function(){
          nodes.C.log.push({ v:8, committed:false }); render();
          return bcast("C", ["D","E"], "entry", 560);
        }).then(function(){
          nodes.D.log.push({ v:8, committed:false }); nodes.E.log.push({ v:8, committed:false }); render();
          return Promise.all([msg("D","C","ack",560), msg("E","C","ack",560)]);
        }).then(function(){
          badge("C", "确认 3/5 ✓", true);
          ["C","D","E"].forEach(function(id){ nodes[id].log[nodes[id].log.length-1].committed = true; });
          render(); return delay(900);
        });
      } },
    { text:"<b>分区恢复</b>。B 和 C 都在发心跳，但 B 的 term=1 低于 C 的 term=2 —— Raft 的规则是<b>只听任期更高的</b>。",
      run: function(){ ui.wall.setAttribute("opacity", 0); return bcast("C", ["A","B"], "hb", 620); } },
    { text:"B 看到更高任期，立刻<b>退回 Follower</b>；A、B <b>回滚</b>那条没提交的 3——未提交的尾部日志就是这样被新任期覆盖的。",
      run: function(){
        nodes.B.state = "follower"; nodes.B.term = 2; nodes.A.term = 2;
        nodes.A.log = nodes.A.log.filter(function(e){ return e.committed; });
        nodes.B.log = nodes.B.log.filter(function(e){ return e.committed; });
        render(); return delay(1100);
      } },
    { text:"新 Leader C 把 term 2 的日志复制给 A、B。五个节点的日志重新一致：<b>[5, 8]</b>，3 从未存在过。集群在分区、脑裂之后依然收敛到一个一致的状态——这就是 Raft 给 etcd 的承诺。",
      run: function(){
        return bcast("C", ["A","B"], "entry", 620).then(function(){
          nodes.A.log.push({ v:8, committed:true }); nodes.B.log.push({ v:8, committed:true });
          render(); return delay(600);
        });
      } }
  ]}
  ];

  /* ===== 放大弹层：整体搬移动画节点，保持运行状态 ===== */
  var ovPlaceholder = null;
  function ensureOverlay(){
    var ov = document.getElementById("raft-anim-overlay");
    if (ov) return ov;
    ov = document.createElement("div");
    ov.id = "raft-anim-overlay";
    ov.innerHTML = '<div class="ra-ov-backdrop"></div><div class="ra-ov-box"></div>';
    document.body.appendChild(ov);
    ov.querySelector(".ra-ov-backdrop").addEventListener("click", closeOverlay);
    return ov;
  }
  function overlayOpen(){
    var ov = document.getElementById("raft-anim-overlay");
    return !!(ov && ov.classList.contains("open"));
  }
  function openOverlay(){
    var root = document.getElementById("raft-anim");
    if (!root || overlayOpen()) return;
    var ov = ensureOverlay();
    ovPlaceholder = document.createElement("div");
    root.parentNode.insertBefore(ovPlaceholder, root);
    ov.querySelector(".ra-ov-box").appendChild(root);
    ov.classList.add("open");
    if (ui.zoom) ui.zoom.textContent = "✕ 还原";
  }
  function closeOverlay(){
    if (!overlayOpen()) return;
    var ov = document.getElementById("raft-anim-overlay");
    var root = document.getElementById("raft-anim");
    if (root && ovPlaceholder && ovPlaceholder.parentNode) {
      ovPlaceholder.parentNode.insertBefore(root, ovPlaceholder);
    }
    if (ovPlaceholder) ovPlaceholder.remove();
    ovPlaceholder = null;
    ov.classList.remove("open");
    if (ui.zoom) ui.zoom.textContent = "⛶ 放大";
  }

  /* ===== 播放器 ===== */
  function setChapter(ch){
    epoch++; playing = false; chapter = ch; stepIdx = 0;
    ui.play.textContent = "▶ 播放本幕";
    ui.tabs.forEach(function(b){ b.classList.toggle("on", +b.dataset.ch === ch); });
    chapterInit(ch);
    ui.caption.innerHTML = CHAPTERS[ch].intro;
  }
  function runStep(){
    var myE = epoch, steps = CHAPTERS[chapter].steps;
    if (stepIdx >= steps.length) return Promise.resolve(false);
    var st = steps[stepIdx++];
    ui.caption.innerHTML = st.text;
    return st.run().then(function(){ return myE === epoch; });
  }
  function playLoop(){
    var myE = epoch;
    (function next(){
      if (!playing || myE !== epoch) return;
      if (stepIdx >= CHAPTERS[chapter].steps.length) {
        playing = false; ui.play.textContent = "▶ 播放本幕";
        if (chapter < 2) ui.caption.innerHTML += '<br><b>本幕结束</b>，点上方页签进入下一幕 →';
        else ui.caption.innerHTML += '<br><b>全部演示结束</b>，可点任意页签重看。';
        return;
      }
      runStep().then(function(ok){ if (ok && playing) delay(450).then(next); });
    })();
  }

  function bindControls(){
    ui.tabs.forEach(function(b){ b.onclick = function(){ setChapter(+b.dataset.ch); }; });
    ui.play.onclick = function(){
      if (stepIdx >= CHAPTERS[chapter].steps.length) { setChapter(chapter); }
      playing = !playing;
      ui.play.textContent = playing ? "⏸ 暂停" : "▶ 播放本幕";
      if (playing) playLoop();
    };
    ui.step.onclick = function(){ if (!playing) runStep(); };
    ui.reset.onclick = function(){ setChapter(chapter); };
    ui.speed.onchange = function(){ spd = parseFloat(ui.speed.value); };
    ui.zoom.onclick = function(){ overlayOpen() ? closeOverlay() : openOverlay(); };
  }

  function mount(host){
    if (host.querySelector("#raft-anim")) return;
    closeOverlay();
    var stray = document.getElementById("raft-anim");
    if (stray) stray.remove();
    epoch++;
    var root = document.createElement("div");
    root.id = "raft-anim";
    root.setAttribute("data-roadmap-animation-id", "raft");
    host.insertBefore(root, host.firstChild);
    freshState();
    buildDom(root);
    bindControls();
    setChapter(0);
  }

  function unmount(){
    epoch++;
    closeOverlay();
    var root = document.getElementById("raft-anim");
    if (root) root.remove();
  }

  /* drawer 打开且标题命中 2.3 时挂载 */
  function check(){
    var drawer = document.getElementById("drawer");
    var title = document.getElementById("d-title");
    var body = document.getElementById("d-body");
    if (!drawer || !title || !body) return;
    if (drawer.classList.contains("open") && title.textContent.indexOf(SECTION_KEY) !== -1) mount(body);
  }
  function init(){
    if (window.RoadmapAnimations && window.RoadmapAnimations.register) {
      window.RoadmapAnimations.register({
        animationId: "raft",
        mount: mount,
        unmount: unmount
      });
      return;
    }
    var drawer = document.getElementById("drawer");
    var title = document.getElementById("d-title");
    if (!drawer || !title) return;
    new MutationObserver(check).observe(drawer, { attributes:true, attributeFilter:["class"] });
    new MutationObserver(check).observe(title, { childList:true, characterData:true, subtree:true });
    /* Esc 优先关闭动画放大层，不传给 drawer */
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && overlayOpen()) {
        e.stopImmediatePropagation();
        e.preventDefault();
        closeOverlay();
      }
    }, true);
    check();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
