<script id="scheduler-filter-score-script">
(function(){
  "use strict";
  var ID = "scheduler-filter-score";
  var NS = "http://www.w3.org/2000/svg";
  var INK = "#1f2933", PAPER = "#fffdf5", IDLE = "#e7e5d8",
      ACTIVE = "#bfdbfe", ACTIVE_BD = "#1d4ed8",
      DONE = "#bbf7d0", DONE_BD = "#15803d",
      WARN = "#fde68a", WARN_BD = "#b45309",
      FAIL = "#fecaca", FAIL_BD = "#b91c1c", MUTED = "#6b7280";
  var player = null, root = null, ui = {}, state = {};
  var nodes = {
    pod: [84, 76, "待调度 Pod", "requests 待计算"],
    queue: [280, 76, "SchedulingQueue", "activeQ"],
    filter: [496, 76, "Filter 插件", "资源 / 亲和性 / 污点 / 卷"],
    score: [710, 76, "Score 插件", "按权重汇总"],
    api: [892, 76, "API Server", "Bind"]
  };
  var nodeRows = [
    ["node-a", 126, "node-a"],
    ["node-b", 216, "node-b"],
    ["node-c", 306, "node-c"],
    ["node-d", 396, "node-d"]
  ];

  function el(tag, attrs, parent){
    var item = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function(key){ item.setAttribute(key, attrs[key]); });
    if (parent) parent.appendChild(item);
    return item;
  }
  function label(parent, x, y, text, size, weight, fill){
    var t = el("text", {
      x:x, y:y, "text-anchor":"middle", "font-size":size || 12.5,
      "font-weight":weight || 700, fill:fill || INK
    }, parent);
    t.textContent = text;
    return t;
  }
  function rect(parent, x, y, w, h, fill, stroke){
    return el("rect", {
      x:x, y:y, width:w, height:h, rx:10,
      fill:fill || PAPER, stroke:stroke || INK, "stroke-width":2
    }, parent);
  }
  function line(parent, x1, y1, x2, y2){
    el("line", {
      x1:x1, y1:y1, x2:x2, y2:y2, stroke:"#9ca3af",
      "stroke-width":1.6, "stroke-dasharray":"5 5"
    }, parent);
  }
  function setPanel(name, value){ if (ui.panels[name]) ui.panels[name].textContent = value; }
  function color(status){
    if (status === "active") return [ACTIVE, ACTIVE_BD];
    if (status === "done") return [DONE, DONE_BD];
    if (status === "warn") return [WARN, WARN_BD];
    if (status === "fail") return [FAIL, FAIL_BD];
    if (status === "muted") return [IDLE, MUTED];
    return [PAPER, INK];
  }

  function buildDom(host){
    root = document.createElement("div");
    root.id = ID;
    root.className = "ka-anim";
    root.setAttribute("data-roadmap-animation-id", ID);
    root.innerHTML =
      '<div class="ka-head"><strong>调度过滤和评分动画</strong><small>requests 计算 → Filter 淘汰 → Score 绑定</small><button class="ka-zoom" data-action="zoom">⛶ 放大</button></div>' +
      '<div class="ka-tabs"><button data-ch="0">① 资源需求计算</button><button data-ch="1">② Filter</button><button data-ch="2">③ Score 与 Bind</button></div>' +
      '<div class="ka-stage"><svg viewBox="0 0 980 520" role="img" aria-label="Kubernetes 调度过滤和评分动画"></svg></div>' +
      '<div class="ka-panels"><div class="ka-panel"><b>Pod request</b><span data-panel="request">—</span></div><div class="ka-panel"><b>当前插件</b><span data-panel="plugin">—</span></div><div class="ka-panel"><b>候选节点</b><span data-panel="candidates">A/B/C/D</span></div><div class="ka-panel"><b>绑定结果</b><span data-panel="bind">spec.nodeName: —</span></div></div>' +
      '<div class="ka-caption" data-role="caption"></div>' +
      '<div class="ka-ctrl"><button data-action="play">▶ 播放本幕</button><button data-action="step">▷ 下一步</button><button data-action="reset">⏮ 重置本幕</button><label>速度 <select data-action="speed"><option value="1.6">慢</option><option value="1" selected>正常</option><option value="0.55">快</option></select></label></div>' +
      '<div class="ka-legend"><span><i style="background:#bfdbfe"></i>当前阶段</span><span><i style="background:#bbf7d0"></i>通过 / 已完成</span><span><i style="background:#fecaca"></i>被过滤</span><span><i style="background:#fde68a"></i>等待 / 计算中</span></div>';
    host.appendChild(root);
    ui.svg = root.querySelector("svg");
    ui.panels = {};
    root.querySelectorAll("[data-panel]").forEach(function(panel){
      ui.panels[panel.dataset.panel] = panel;
    });
    drawScene();
  }

  function drawScene(){
    var svg = ui.svg;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    Object.keys(nodes).forEach(function(key){
      var n = nodes[key];
      ui[key] = { box: rect(svg, n[0]-74, n[1]-31, 148, 62, PAPER, INK) };
      label(svg, n[0], n[1]-5, n[2], 13, 800);
      ui[key].sub = label(svg, n[0], n[1]+16, n[3], 10.5, 600, MUTED);
    });
    line(svg, 158, 76, 206, 76);
    line(svg, 354, 76, 422, 76);
    line(svg, 570, 76, 636, 76);
    line(svg, 784, 76, 818, 76);
    rect(svg, 28, 145, 924, 338, "#f8fafc", INK).setAttribute("stroke-dasharray", "7 6");
    label(svg, 108, 174, "候选节点池", 13, 800, MUTED);
    nodeRows.forEach(function(row){
      var key = row[0], y = row[1];
      ui[key] = {
        box: rect(svg, 60, y, 160, 58, PAPER, INK),
        reason: label(svg, 410, y+34, "待检查", 12, 700, MUTED),
        score: label(svg, 748, y+34, "score: —", 12, 800, MUTED)
      };
      label(svg, 140, y+24, row[2], 14, 900);
      rect(svg, 256, y+12, 302, 34, PAPER, "#cbd5e1");
      rect(svg, 612, y+12, 270, 34, PAPER, "#cbd5e1");
    });
    label(svg, 408, 156, "Filter 结果 / 淘汰原因", 12, 800, MUTED);
    label(svg, 748, 156, "Score 结果 / 权重汇总", 12, 800, MUTED);
    ui.note = label(svg, 490, 506, "", 12, 800, WARN_BD);
  }

  function resetState(chapter){
    state = {
      active: {},
      done: {},
      request: chapter === 0 ? "未计算" : "800m CPU / 1Gi memory",
      plugin: "—",
      candidates: "A/B/C/D",
      bind: "spec.nodeName: —",
      note: "",
      nodes: {
        "node-a": { status:"idle", reason:"待检查", score:"score: —" },
        "node-b": { status:"idle", reason:"待检查", score:"score: —" },
        "node-c": { status:"idle", reason:"待检查", score:"score: —" },
        "node-d": { status:"idle", reason:"待检查", score:"score: —" }
      }
    };
  }
  function render(){
    Object.keys(nodes).forEach(function(key){
      var c = color(state.active[key] ? "active" : state.done[key] ? "done" : "idle");
      ui[key].box.setAttribute("fill", c[0]);
      ui[key].box.setAttribute("stroke", c[1]);
    });
    nodeRows.forEach(function(row){
      var key = row[0], item = state.nodes[key], c = color(item.status);
      ui[key].box.setAttribute("fill", c[0]);
      ui[key].box.setAttribute("stroke", c[1]);
      ui[key].reason.textContent = item.reason;
      ui[key].reason.setAttribute("fill", item.status === "fail" ? FAIL_BD : item.status === "done" ? DONE_BD : MUTED);
      ui[key].score.textContent = item.score;
      ui[key].score.setAttribute("fill", item.status === "done" || item.status === "active" ? DONE_BD : MUTED);
    });
    setPanel("request", state.request);
    setPanel("plugin", state.plugin);
    setPanel("candidates", state.candidates);
    setPanel("bind", state.bind);
    ui.note.textContent = state.note;
  }
  function mark(active, done){
    state.active = {};
    state.done = {};
    (active || []).forEach(function(key){ state.active[key] = true; });
    (done || []).forEach(function(key){ state.done[key] = true; });
    render();
  }

  var CHAPTERS = [
    {
      intro:"调度器使用 <code>requests</code> 做装箱，不用 <code>limits</code> 代替。init containers 取最大值，普通容器 requests 求和。",
      steps:[
        { text:"普通业务容器 requests 求和：app=200m/256Mi，sidecar=300m/512Mi，所以 app containers 合计 <b>500m CPU / 768Mi</b>。", run:function(ctx){ state.request="sum(app)=500m / 768Mi"; state.plugin="requests 求和"; mark(["pod"], []); return ctx.wait(650); } },
        { text:"init containers 不并发运行，调度时取最大 init request：init-db=800m/1Gi，init-migrate=400m/512Mi，所以 init 最大值是 <b>800m CPU / 1Gi</b>。", run:function(ctx){ state.request="max(init)=800m / 1Gi"; state.plugin="init 最大值"; mark(["pod"], []); return ctx.wait(650); } },
        { text:"最终用于调度的 Pod request 是 <code>max(sum(app containers), max(init containers))</code>，得到 <b>800m CPU / 1Gi</b>。", run:function(ctx){ state.request="800m CPU / 1Gi memory"; state.plugin="max(sum(app), max(init))"; state.note="limits 不参与本次调度容量计算"; mark(["pod","queue"], ["pod"]); return ctx.wait(780); } }
      ]
    },
    {
      intro:"Filter 阶段只保留可行节点；被过滤掉的节点不会回到后续评分集合。",
      steps:[
        { text:"Pod 进入调度队列，调度器开始按插件链检查四个候选节点。", run:function(ctx){ state.plugin="调度队列"; mark(["queue"], ["pod"]); return ctx.wait(620); } },
        { text:"资源检查：node-a 可用 CPU/内存不足，被淘汰，原因是 <b>Insufficient cpu</b>。", run:function(ctx){ state.plugin="资源"; state.nodes["node-a"]={status:"fail",reason:"Insufficient cpu",score:"score: —"}; state.candidates="B/C/D"; mark(["filter"], ["pod","queue"]); return ctx.wait(720); } },
        { text:"NodeAffinity 检查：node-d 缺少 <code>disk=ssd</code> 标签，被淘汰。", run:function(ctx){ state.plugin="NodeAffinity"; state.nodes["node-d"]={status:"fail",reason:"missing disk=ssd",score:"score: —"}; state.candidates="B/C"; mark(["filter"], ["pod","queue"]); return ctx.wait(720); } },
        { text:"Taint/Toleration、PodAntiAffinity 和卷拓扑继续检查。node-b、node-c 通过，node-a/node-d 不会重新加入评分。", run:function(ctx){ state.plugin="Taint / AntiAffinity / Volume"; state.nodes["node-b"].status="done"; state.nodes["node-b"].reason="通过 Filter"; state.nodes["node-c"].status="done"; state.nodes["node-c"].reason="通过 Filter"; state.candidates="B/C"; mark(["filter"], ["pod","queue"]); return ctx.wait(780); } }
      ]
    },
    {
      intro:"Score 只给 Filter 后剩余节点打分，再通过 API Server 写入绑定结果。",
      steps:[
        { text:"Score 阶段只评估 node-b 和 node-c。资源均衡、镜像本地性、亲和性和拓扑分布按权重汇总。", run:function(ctx){ state.plugin="Score"; state.nodes["node-b"].score="资源30 镜像20 亲和10 拓扑10 = 70"; state.nodes["node-c"].score="资源35 镜像10 亲和20 拓扑20 = 85"; state.nodes["node-b"].status="done"; state.nodes["node-c"].status="active"; mark(["score"], ["pod","queue","filter"]); return ctx.wait(780); } },
        { text:"node-c 得分最高。改变权重可能让装箱或打散策略偏向不同节点，但本批不展开抢占。", run:function(ctx){ state.plugin="选择最高分"; state.note="权重改变会影响最高分节点"; state.nodes["node-c"].reason="最高分"; state.nodes["node-b"].reason="可行但分数较低"; mark(["score"], ["pod","queue","filter"]); return ctx.wait(720); } },
        { text:"Scheduler 通过 API Server 执行 Bind，写入 <code>spec.nodeName=node-c</code>，并更新 PodScheduled=True。", run:function(ctx){ state.plugin="Bind"; state.bind="spec.nodeName=node-c / PodScheduled=True"; mark(["api"], ["pod","queue","filter","score"]); return ctx.wait(780); } }
      ]
    }
  ];

  function mount(host){
    if (host.querySelector("[data-roadmap-animation-id='" + ID + "']")) return;
    buildDom(host);
    player = window.RoadmapAnimations.createPlayer({
      animationId: ID,
      root: root,
      chapters: CHAPTERS,
      resetState: resetState,
      render: render,
      finishedText: function(){ return "<br><b>本幕结束</b>，可继续切换页签查看下一段调度决策。"; }
    });
  }
  function unmount(){
    if (player) player.destroy();
    player = null;
    if (root) root.remove();
    root = null;
  }
  function init(){
    window.RoadmapAnimations.register({ animationId: ID, mount: mount, unmount: unmount });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>

<script id="controller-reconcile-script">
(function(){
  "use strict";
  var ID = "controller-reconcile";
  var NS = "http://www.w3.org/2000/svg";
  var INK = "#1f2933", PAPER = "#fffdf5", IDLE = "#e7e5d8",
      ACTIVE = "#bfdbfe", ACTIVE_BD = "#1d4ed8",
      DONE = "#bbf7d0", DONE_BD = "#15803d",
      WARN = "#fde68a", WARN_BD = "#b45309",
      FAIL = "#fecaca", FAIL_BD = "#b91c1c", MUTED = "#6b7280";
  var player = null, root = null, ui = {}, state = {};
  var boxes = {
    api:[84,95,"API Server","Watch / Create"],
    informer:[278,95,"Reflector / Informer","watch → cache"],
    cache:[474,95,"Cache / Lister","本地只读视图"],

      ]
    }

        { text:"封装后的包穿过物理网络到目标节点，目标节点解封装，再按内层 Pod IP 送入 Pod B。", run:function(ctx){ state.netns="underlay → target host netns"; state.owner="目标节点 CNI"; state.encap="目标节点解封装"; mark(["phy","nodeB","podB"], ["procA","ethA","vethA","host"]); return ctx.wait(820); } },
        { text:"切换 Direct Routing：不做封装，源节点通过 BGP 或静态路由把下一跳指向目标节点。", run:function(ctx){ state.encap="不封装"; state.owner="BGP / 静态路由"; state.packet="src=10.244.1.10 dst=10.244.2.20 / next-hop=192.168.1.11"; mark(["host","phy","nodeB","podB"], ["procA","ethA","vethA"]); return ctx.wait(820); } }
      ]
    }
  ];

  function mount(host){
    if (host.querySelector("[data-roadmap-animation-id='" + ID + "']")) return;
    buildDom(host);
    player = window.RoadmapAnimations.createPlayer({
      animationId: ID,
      root: root,
      chapters: CHAPTERS,
      resetState: resetState,
      render: render,
      finishedText: function(){ return "<br><b>本幕结束</b>，注意这里没有 Service 转发字段。"; }
    });
  }
  function unmount(){
    if (player) player.destroy();
    player = null;
    if (root) root.remove();
    root = null;
  }
  function init(){
    window.RoadmapAnimations.register({ animationId: ID, mount: mount, unmount: unmount });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>

<script id="pod-create-anim-script">
(function(){
  "use strict";

  var SECTION_KEY = "Pod 生命周期完整管理";
  var NS = "http://www.w3.org/2000/svg";
  var INK = "#1f2933", PAPER = "#fffdf5", IDLE = "#e7e5d8",
      ACTIVE = "#bfdbfe", ACTIVE_BD = "#1d4ed8",
      DONE = "#bbf7d0", DONE_BD = "#15803d",
      WARN = "#fde68a", WARN_BD = "#b45309",
      FAIL = "#fecaca", MUTED = "#6b7280";

  var POS = {
    client:[78,238],
    api:[270,238],
    etcd:[480,78],
    deploy:[480,158],
    rs:[480,238],
    scheduler:[480,318],
    kubelet:[695,238],
    csi:[880,78],
    runtime:[880,168],
    cni:[880,258],
    pod:[880,368]
  };
  var LABELS = {
    client:["kubectl","客户端"],
    api:["API Server","统一入口"],
    etcd:["etcd","持久化状态"],
    deploy:["Deployment","Controller"],
    rs:["ReplicaSet","Controller"],
    scheduler:["Scheduler","Filter / Score"],
    kubelet:["kubelet","节点代理"],
    csi:["CSI / Volume","挂载存储"],
    runtime:["CRI Runtime","Sandbox / 容器"],
    cni:["CNI","网络与 Pod IP"],
    pod:["Pod","业务工作负载"]
  };

  var epoch = 0, playing = false, speed = 1, chapter = 0, stepIndex = 0;
  var state = {}, boxes = {}, ui = {};

  function svgEl(tag, attrs, parent){
    var node = document.createElementNS(NS, tag);
    for (var key in attrs) node.setAttribute(key, attrs[key]);
    if (parent) parent.appendChild(node);
    return node;
  }

  function wait(ms){
    var current = epoch;
    return new Promise(function(resolve){
      setTimeout(function(){ resolve(current === epoch); }, ms * speed);
    });
  }

  function resetState(){
    state = {
      active: {},
      done: {},
      phase: "尚未创建",
      condition: "PodScheduled —",
      nodeName: "nodeName: —",
      podIP: "podIP: —",
      ready: "Ready: False"
    };
  }

  function mark(activeIds, doneIds){
    state.active = {};
    (activeIds || []).forEach(function(id){ state.active[id] = true; });
    (doneIds || []).forEach(function(id){ state.done[id] = true; });
    render();
  }

  function buildDom(root){
    root.innerHTML =
      '<div class="pc-head">' +
        '<strong>Kubernetes Pod 创建全链路</strong>' +
        '<small>从 kubectl 请求到 Pod Ready · 参考 what-happens-when-k8s</small>' +
        '<button class="pc-zoom" id="pc-zoom" title="放大演示">⛶ 放大</button>' +
      '</div>' +
      '<div class="pc-tabs">' +
        '<button data-ch="0">① 请求入站</button>' +
        '<button data-ch="1">② 控制器展开</button>' +
        '<button data-ch="2">③ 调度绑定</button>' +
        '<button data-ch="3">④ 节点启动</button>' +
      '</div>' +
      '<div class="pc-stage">' +
        '<svg viewBox="0 0 980 500" id="pc-svg" role="img" aria-label="Kubernetes Pod 创建流程动画"></svg>' +
      '</div>' +
      '<div class="pc-caption" id="pc-caption"></div>' +
      '<div class="pc-ctrl">' +
        '<button id="pc-play">▶ 播放本幕</button>' +
        '<button id="pc-step">▷ 下一步</button>' +
        '<button id="pc-reset">⏮ 重置本幕</button>' +
        '<label>速度 <select id="pc-speed">' +
          '<option value="1.6">慢</option><option value="1" selected>正常</option><option value="0.55">快</option>' +
        '</select></label>' +
      '</div>' +
      '<div class="pc-legend">' +
        '<span><i style="background:#bfdbfe"></i>当前处理</span>' +
        '<span><i style="background:#bbf7d0"></i>本幕已完成</span>' +
        '<span><i style="background:#fde68a"></i>等待 / Pending</span>' +
        '<span><i style="background:#fffdf5"></i>尚未参与</span>' +
      '</div>';

    var svg = root.querySelector("#pc-svg");
    ui = {
      svg: svg,
      caption: root.querySelector("#pc-caption"),
      play: root.querySelector("#pc-play"),
      step: root.querySelector("#pc-step"),
      reset: root.querySelector("#pc-reset"),
      speed: root.querySelector("#pc-speed"),
      zoom: root.querySelector("#pc-zoom"),
      tabs: Array.prototype.slice.call(root.querySelectorAll(".pc-tabs button"))
    };

    var defs = svgEl("defs", {}, svg);
    var marker = svgEl("marker", {
      id:"pc-arrow", viewBox:"0 0 10 10", refX:9, refY:5,
      markerWidth:6, markerHeight:6, orient:"auto-start-reverse"
    }, defs);
    svgEl("path", { d:"M 0 0 L 10 5 L 0 10 z", fill:"#9ca3af" }, marker);

    drawZone(svg, 14, 34, 132, 382, "客户端", "#fef3c7");
    drawZone(svg, 158, 34, 432, 382, "控制面", "#dbeafe");
    drawZone(svg, 604, 34, 360, 382, "工作节点 node-a", "#dcfce7");

    [
      ["client","api"], ["api","etcd"], ["api","deploy"], ["api","rs"],
      ["api","scheduler"], ["api","kubelet"], ["kubelet","csi"],
      ["kubelet","runtime"], ["runtime","cni"], ["runtime","pod"], ["kubelet","pod"]
    ].forEach(function(pair){ drawEdge(svg, pair[0], pair[1]); });

    Object.keys(POS).forEach(function(id){ drawBox(svg, id); });

    ui.messageLayer = svgEl("g", {}, svg);
    ui.statusLayer = svgEl("g", {}, svg);
    drawStatusPanel();
  }

  function drawZone(svg, x, y, width, height, title, fill){
    svgEl("rect", {
      x:x, y:y, width:width, height:height, rx:16,
      fill:fill, opacity:.38, stroke:INK, "stroke-width":1.5,
      "stroke-dasharray":"7 6"
    }, svg);
    var text = svgEl("text", {
      x:x+12, y:y+22, "font-size":12, "font-weight":800, fill:MUTED
    }, svg);
    text.textContent = title;
  }

  function drawEdge(svg, from, to){
    var a = POS[from], b = POS[to];
    svgEl("line", {
      x1:a[0], y1:a[1], x2:b[0], y2:b[1],
      stroke:"#9ca3af", "stroke-width":1.5, "stroke-dasharray":"5 5",
      "marker-end":"url(#pc-arrow)", opacity:.72
    }, svg);
  }

  function drawBox(svg, id){
    var p = POS[id], label = LABELS[id];
    var group = svgEl("g", {}, svg);
    var width = id === "client" ? 108 : 132;
    var rect = svgEl("rect", {
      x:p[0]-width/2, y:p[1]-29, width:width, height:58, rx:10,
      fill:PAPER, stroke:INK, "stroke-width":2
    }, group);
    var title = svgEl("text", {
      x:p[0], y:p[1]-2, "text-anchor":"middle",
      "font-size":13.5, "font-weight":800, fill:INK
    }, group);
    title.textContent = label[0];
    var sub = svgEl("text", {
      x:p[0], y:p[1]+17, "text-anchor":"middle",
      "font-size":10.5, fill:MUTED
    }, group);
    sub.textContent = label[1];
    boxes[id] = { group:group, rect:rect, title:title, sub:sub };
  }

  function drawStatusPanel(){
    svgEl("rect", {
      x:28, y:432, width:924, height:50, rx:10,
      fill:"#f8fafc", stroke:INK, "stroke-width":1.5
    }, ui.statusLayer);
    var items = [
      ["phase", 48], ["condition", 250], ["nodeName", 480],
      ["podIP", 675], ["ready", 835]
    ];
    items.forEach(function(item){
      var text = svgEl("text", {
        x:item[1], y:462, "font-size":12.5,
        "font-weight": item[0] === "phase" ? 800 : 600,
        fill: item[0] === "phase" ? WARN_BD : INK
      }, ui.statusLayer);
      ui[item[0]] = text;
    });
  }

  function render(){
    Object.keys(boxes).forEach(function(id){
      var fill = PAPER, stroke = INK, strokeWidth = 2;
      if (state.done[id]) { fill = DONE; stroke = DONE_BD; }
      if (state.active[id]) { fill = ACTIVE; stroke = ACTIVE_BD; strokeWidth = 3; }
      if (id === "pod" && state.phase === "Pending" && !state.active[id]) {
        fill = WARN; stroke = WARN_BD;
      }
      if (id === "pod" && state.phase === "Running" && state.ready === "Ready: False") {
        fill = WARN; stroke = WARN_BD;
      }
      if (id === "pod" && state.ready === "Ready: True") {
        fill = DONE; stroke = DONE_BD;
      }
      boxes[id].rect.setAttribute("fill", fill);
      boxes[id].rect.setAttribute("stroke", stroke);
      boxes[id].rect.setAttribute("stroke-width", strokeWidth);
    });
    ["phase","condition","nodeName","podIP","ready"].forEach(function(key){
      ui[key].textContent = key === "phase" ? "Phase: " + state[key] : state[key];
    });
    ui.phase.setAttribute("fill",
      state.phase === "Running" ? DONE_BD :
      state.phase === "Pending" ? WARN_BD : MUTED);
  }

  function fly(from, to, kind, label, duration){
    var start = POS[from], end = POS[to], current = epoch;
    var colors = kind === "write" ? [WARN, WARN_BD] :
      kind === "ok" ? [DONE, DONE_BD] :
      kind === "network" ? [ACTIVE, ACTIVE_BD] : [PAPER, INK];
    var group = svgEl("g", {}, ui.messageLayer);
    var body = svgEl("rect", {
      x:-11, y:-8, width:22, height:16, rx:5,
      fill:colors[0], stroke:colors[1], "stroke-width":2
    }, group);
    var tag = null;
    if (label) {
      tag = svgEl("text", {
        x:0, y:-13, "text-anchor":"middle",
        "font-size":10, "font-weight":800, fill:colors[1]
      }, group);
      tag.textContent = label;
    }
    var started = performance.now(), total = (duration || 650) * speed;
    return new Promise(function(resolve){
      (function tick(now){
        if (current !== epoch) {
          group.remove();
          resolve(false);
          return;
        }
        var progress = Math.min((now-started)/total, 1);
        var eased = progress < .5
          ? 2*progress*progress
          : 1-Math.pow(-2*progress+2,2)/2;
        var x = start[0] + (end[0]-start[0])*eased;
        var y = start[1] + (end[1]-start[1])*eased;
        group.setAttribute("transform", "translate("+x+" "+y+")");
        body.setAttribute("opacity", progress < .92 ? 1 : (1-progress)*12.5);
        if (tag) tag.setAttribute("opacity", progress < .92 ? 1 : (1-progress)*12.5);
        if (progress < 1) requestAnimationFrame(tick);
        else { group.remove(); resolve(true); }
      })(started);
    });
  }

  function pulse(id, text, good){
    var p = POS[id];
    var badge = svgEl("g", {}, ui.messageLayer);
    var width = Math.max(58, text.length * 12 + 18);
    svgEl("rect", {
      x:p[0]-width/2, y:p[1]-58, width:width, height:24, rx:12,
      fill:good ? DONE : FAIL, stroke:good ? DONE_BD : "#b91c1c", "stroke-width":1.5
    }, badge);
    var label = svgEl("text", {
      x:p[0], y:p[1]-41, "text-anchor":"middle",
      "font-size":11, "font-weight":800, fill:INK
    }, badge);
    label.textContent = text;
    var current = epoch;
    setTimeout(function(){ if (current === epoch) badge.remove(); }, 1500 * speed);
  }

  var CHAPTERS = [
    {
      intro:"场景从 <code>kubectl create deployment nginx --image=nginx</code> 开始。第一幕只处理请求进入集群并成为持久化对象的过程。",
      base:function(){
        resetState();
      },
      steps:[
        {
          text:"kubectl 读取 kubeconfig、完成 API discovery 和客户端校验，然后把 Deployment 对象序列化成 HTTPS 请求。",
          run:function(){
            mark(["client"], []);
            return wait(700);
          }
        },
        {
          text:"请求到达 <b>API Server</b>。它依次执行认证、授权、字段校验，以及 mutating / validating admission；任一步拒绝，请求都不会写入 etcd。",
          run:function(){
            mark(["api"], ["client"]);
            return fly("client","api","network","POST",720);
          }
        },
        {
          text:"准入通过后，API Server 把 Deployment 的期望状态持久化到 <b>etcd</b>。etcd 不负责启动容器，它只保存集群事实。",
          run:function(){
            mark(["api","etcd"], ["client"]);
            return fly("api","etcd","write","PUT",650).then(function(){
              state.phase = "尚未创建";
              render();
              pulse("etcd","已持久化",true);
              return wait(500);
            });
          }
        },
        {
          text:"API Server 返回创建成功。此时只是 Deployment 对象存在，Pod 还没有出现；后续工作由异步控制循环接力完成。",
          run:function(){
            mark(["client","api"], ["etcd"]);
            return fly("api","client","ok","201",720);
          }
        }
      ]
    },
    {
      intro:"Deployment 和 ReplicaSet 控制器通过 informer / watch 观察对象变化，把一个高层工作负载逐级展开成具体 Pod。",
      base:function(){
        resetState();
        state.done = {client:true, api:true, etcd:true};
      },
      steps:[
        {
          text:"<b>Deployment Controller</b> 发现期望副本尚不存在，于是创建 ReplicaSet，并写回 API Server。",
          run:function(){
            mark(["deploy","api"], ["client","etcd"]);
            return fly("api","deploy","network","watch",560)
              .then(function(){ return fly("deploy","api","write","RS",620); });
          }
        },
        {
          text:"<b>ReplicaSet Controller</b> 发现实际 Pod 数少于 replicas，于是创建 Pod 对象，并用 ownerReferences 建立 Deployment → ReplicaSet → Pod 的所有权链。",
          run:function(){
            mark(["rs","api"], ["client","etcd","deploy"]);
            return fly("api","rs","network","watch",560)
              .then(function(){ return fly("rs","api","write","Pod",620); });
          }
        },
        {
          text:"Pod 对象写入 etcd，初始为 <b>Pending</b>，此时 <code>spec.nodeName</code> 仍为空，还没有任何节点负责运行它。",
          run:function(){
            state.phase = "Pending";
            state.condition = "PodScheduled: False";
            mark(["api","etcd","pod"], ["client","deploy","rs"]);
            return fly("api","etcd","write","Pod",650).then(function(){
              pulse("pod","Pending",false);
              return wait(500);
            });
          }
        },
        {
          text:"如果用户直接提交的是 Pod YAML，会跳过 Deployment 和 ReplicaSet 两级控制器；但 API Server、调度器、kubelet、CRI、CNI 这些后续阶段相同。",
          run:function(){
            mark(["api","pod"], ["client","etcd","deploy","rs"]);
            return wait(950);
          }
        }
      ]
    },
    {
      intro:"Scheduler 只处理尚未绑定节点的 Pod。现代调度框架会经过队列、过滤、评分、保留和绑定等阶段。",
      base:function(){
        resetState();
        state.phase = "Pending";
        state.condition = "PodScheduled: False";
        state.done = {client:true, api:true, etcd:true, deploy:true, rs:true};
      },
      steps:[
        {
          text:"Scheduler 通过 watch 看到一个 <code>spec.nodeName</code> 为空的 Pod，把它放入调度队列。",
          run:function(){
            mark(["api","scheduler"], ["client","etcd","deploy","rs"]);
            return fly("api","scheduler","network","Pending Pod",720);
          }
        },
        {
          text:"<b>Filter</b> 阶段排除不满足资源、亲和性、污点容忍、卷拓扑等约束的节点。没有可行节点时，Pod 会继续 Pending，并产生 FailedScheduling 事件。",
          run:function(){
            mark(["scheduler"], ["client","api","etcd","deploy","rs"]);
            pulse("scheduler","Filter: 3 → 2",true);
            return wait(1100);
          }
        },
        {
          text:"<b>Score</b> 阶段给可行节点打分，综合资源均衡、拓扑分布、亲和性等策略，最终选择 node-a。",
          run:function(){
            mark(["scheduler"], ["client","api","etcd","deploy","rs"]);
            pulse("scheduler","node-a 得分最高",true);
            return wait(1100);
          }
        },
        {
          text:"Scheduler 通过 API Server 完成 Bind，写入 <code>spec.nodeName=node-a</code>，并把 PodScheduled 条件更新为 True。",
          run:function(){
            state.condition = "PodScheduled: True";
            state.nodeName = "nodeName: node-a";
            mark(["scheduler","api","etcd"], ["client","deploy","rs"]);
            return fly("scheduler","api","write","Bind",650)
              .then(function(){ return fly("api","etcd","write","node-a",560); })
              .then(function(){ pulse("scheduler","绑定完成",true); return wait(450); });
          }
        },
        {
          text:"node-a 上的 kubelet 通过 watch 看到这个已绑定 Pod，开始执行本机的 Pod sync。控制面到节点的接力在这里完成。",
          run:function(){
            mark(["api","kubelet"], ["client","etcd","deploy","rs","scheduler"]);
            return fly("api","kubelet","network","watch",720);
          }
        }
      ]
    },
    {
      intro:"Pod 已绑定到 node-a。kubelet 接下来把声明式 PodSpec 翻译成卷、网络、sandbox 和业务容器，直到 Ready。",
      base:function(){
        resetState();
        state.phase = "Pending";
        state.condition = "PodScheduled: True";
        state.nodeName = "nodeName: node-a";
        state.done = {
          client:true, api:true, etcd:true, deploy:true, rs:true, scheduler:true
        };
      },
      steps:[
        {
          text:"kubelet 先做节点侧准入，准备 Pod 目录、cgroup、Secret 和 ConfigMap。资源不足或安全策略不满足时，Pod 可能停在 Pending。",
          run:function(){
            mark(["kubelet"], ["client","api","etcd","deploy","rs","scheduler"]);
            return wait(950);
          }
        },
        {
          text:"Volume Manager 通过 <b>CSI</b> attach / mount 所需卷。这里失败时，常见事件是 FailedAttachVolume 或 FailedMount。",
          run:function(){
            mark(["kubelet","csi"], ["client","api","etcd","deploy","rs","scheduler"]);
            return fly("kubelet","csi","write","Mount",680)
              .then(function(){ pulse("csi","卷已挂载",true); return wait(400); });
          }
        },
        {
          text:"kubelet 通过 <b>CRI</b> 调用 RunPodSandbox。容器运行时创建 Pod sandbox，准备共享的 Linux namespaces。",
          run:function(){
            mark(["kubelet","runtime"], ["client","api","etcd","deploy","rs","scheduler","csi"]);
            return fly("kubelet","runtime","network","Sandbox",680);
          }
        },
        {
          text:"运行时调用 <b>CNI</b> 配置 veth、路由和 IPAM，Pod 获得独立 IP。网络插件失败时通常表现为 ContainerCreating。",
          run:function(){
            state.podIP = "podIP: 10.42.1.23";
            mark(["runtime","cni"], ["client","api","etcd","deploy","rs","scheduler","csi","kubelet"]);
            return fly("runtime","cni","network","ADD",680)
              .then(function(){ pulse("cni","10.42.1.23",true); return wait(400); });
          }
        },
        {
          text:"运行时拉取镜像，按顺序执行 init containers，再创建并启动业务容器。拉取失败会进入 ErrImagePull / ImagePullBackOff。",
          run:function(){
            state.phase = "Pending";
            mark(["runtime","pod"], ["client","api","etcd","deploy","rs","scheduler","csi","cni","kubelet"]);
            return fly("runtime","pod","write","Start",720)
              .then(function(){ pulse("pod","ContainerCreating",false); return wait(600); });
          }
        },
        {
          text:"业务进程启动后，Pod phase 进入 <b>Running</b>；但只有 startup / readiness probe 通过后，Ready 条件才会变为 True。",
          run:function(){
            state.phase = "Running";
            state.ready = "Ready: False";
            mark(["kubelet","pod"], ["client","api","etcd","deploy","rs","scheduler","csi","cni","runtime"]);
            pulse("pod","Running · NotReady",false);
            return wait(1100);
          }
        },
        {
          text:"探针通过，kubelet 把 PodStatus 写回 API Server，最终持久化到 etcd：<b>Running / Ready</b>。随后 EndpointSlice 控制器才会把它纳入 Service 后端。",
          run:function(){
            state.phase = "Running";
            state.ready = "Ready: True";
            mark(["pod","kubelet","api","etcd"], ["client","deploy","rs","scheduler","csi","cni","runtime"]);
            return fly("kubelet","api","ok","Status",680)
              .then(function(){ return fly("api","etcd","write","Ready",560); })
              .then(function(){ pulse("pod","Ready ✓",true); return wait(650); });
          }
        }
      ]
    }
  ];

  function initChapter(index){
    epoch++;
    playing = false;
    chapter = index;
    stepIndex = 0;
    ui.play.textContent = "▶ 播放本幕";
    ui.tabs.forEach(function(button){
      button.classList.toggle("on", +button.dataset.ch === chapter);
    });
    CHAPTERS[chapter].base();
    render();
    ui.caption.innerHTML = CHAPTERS[chapter].intro;
  }

  function runStep(){
    var current = epoch, steps = CHAPTERS[chapter].steps;
    if (stepIndex >= steps.length) return Promise.resolve(false);
    var step = steps[stepIndex++];
    ui.caption.innerHTML = step.text;
    return Promise.resolve(step.run()).then(function(){
      return current === epoch;
    });
  }

  function playLoop(){
    var current = epoch;
    (function next(){
      if (!playing || current !== epoch) return;
      if (stepIndex >= CHAPTERS[chapter].steps.length) {
        playing = false;
        ui.play.textContent = "▶ 播放本幕";
        ui.caption.innerHTML += chapter < CHAPTERS.length-1
          ? "<br><b>本幕结束</b>，可切换到下一幕继续。"
          : "<br><b>Pod 创建完成</b>，现在可以从状态栏反推故障停在哪一段。";
        return;
      }
      runStep().then(function(ok){
        if (ok && playing) wait(450).then(next);
      });
    })();
  }

  function bindControls(){
    ui.tabs.forEach(function(button){
      button.onclick = function(){ initChapter(+button.dataset.ch); };
    });
    ui.play.onclick = function(){
      if (stepIndex >= CHAPTERS[chapter].steps.length) initChapter(chapter);
      playing = !playing;
      ui.play.textContent = playing ? "⏸ 暂停" : "▶ 播放本幕";
      if (playing) playLoop();
    };
    ui.step.onclick = function(){ if (!playing) runStep(); };
    ui.reset.onclick = function(){ initChapter(chapter); };
    ui.speed.onchange = function(){ speed = parseFloat(ui.speed.value); };
    ui.zoom.onclick = function(){ overlayOpen() ? closeOverlay() : openOverlay(); };
  }

  var overlayPlaceholder = null;
  function ensureOverlay(){
    var overlay = document.getElementById("pod-create-anim-overlay");
    if (overlay) return overlay;
    overlay = document.createElement("div");
    overlay.id = "pod-create-anim-overlay";
    overlay.innerHTML = '<div class="pc-ov-backdrop"></div><div class="pc-ov-box"></div>';
    document.body.appendChild(overlay);
    overlay.querySelector(".pc-ov-backdrop").addEventListener("click", closeOverlay);
    return overlay;
  }
  function overlayOpen(){
    var overlay = document.getElementById("pod-create-anim-overlay");
    return !!(overlay && overlay.classList.contains("open"));
  }
  function openOverlay(){
    var root = document.getElementById("pod-create-anim");
    if (!root || overlayOpen()) return;
    var overlay = ensureOverlay();
    overlayPlaceholder = document.createElement("div");
    root.parentNode.insertBefore(overlayPlaceholder, root);
    overlay.querySelector(".pc-ov-box").appendChild(root);
    overlay.classList.add("open");
    if (ui.zoom) ui.zoom.textContent = "✕ 还原";
  }
  function closeOverlay(){
    if (!overlayOpen()) return;
    var overlay = document.getElementById("pod-create-anim-overlay");
    var root = document.getElementById("pod-create-anim");
    if (root && overlayPlaceholder && overlayPlaceholder.parentNode) {
      overlayPlaceholder.parentNode.insertBefore(root, overlayPlaceholder);
    }
    if (overlayPlaceholder) overlayPlaceholder.remove();
    overlayPlaceholder = null;
    overlay.classList.remove("open");
    if (ui.zoom) ui.zoom.textContent = "⛶ 放大";
  }

  function mount(host){
    if (host.querySelector("#pod-create-anim")) return;
    closeOverlay();
    var stray = document.getElementById("pod-create-anim");
    if (stray) stray.remove();
    epoch++;
    boxes = {};
    var root = document.createElement("div");
    root.id = "pod-create-anim";
    root.setAttribute("data-roadmap-animation-id", "pod-create");
    host.insertBefore(root, host.firstChild);
    resetState();
    buildDom(root);
    bindControls();
    initChapter(0);
  }

  function unmount(){
    epoch++;
    closeOverlay();
    var root = document.getElementById("pod-create-anim");
    if (root) root.remove();
  }

  function check(){
    var drawer = document.getElementById("drawer");
    var title = document.getElementById("d-title");
    var body = document.getElementById("d-body");
    if (!drawer || !title || !body) return;
    if (drawer.classList.contains("open") &&
        title.textContent.indexOf(SECTION_KEY) !== -1) {
      mount(body);
    }
  }

  function init(){
    if (window.RoadmapAnimations && window.RoadmapAnimations.register) {
      window.RoadmapAnimations.register({
        animationId: "pod-create",
        mount: mount,
        unmount: unmount
      });
      return;
    }
    var drawer = document.getElementById("drawer");
    var title = document.getElementById("d-title");
    if (!drawer || !title) return;
    new MutationObserver(check).observe(drawer, {
      attributes:true, attributeFilter:["class"]
    });
    new MutationObserver(check).observe(title, {
      childList:true, characterData:true, subtree:true
    });
    document.addEventListener("keydown", function(event){
      if (event.key === "Escape" && overlayOpen()) {
        event.stopImmediatePropagation();
        event.preventDefault();
        closeOverlay();
      }
    }, true);
    check();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

<script id="pod-lifecycle-script">
(function(){
  "use strict";
  var ID = "pod-lifecycle";
  var NS = "http://www.w3.org/2000/svg";
  var INK = "#1f2933", PAPER = "#fffdf5", IDLE = "#e7e5d8",
      ACTIVE = "#bfdbfe", ACTIVE_BD = "#1d4ed8",
      DONE = "#bbf7d0", DONE_BD = "#15803d",
      WARN = "#fde68a", WARN_BD = "#b45309",
      FAIL = "#fecaca", FAIL_BD = "#b91c1c", MUTED = "#6b7280";
  var player = null, root = null, ui = {}, state = {};
  var layers = [
    ["phase", 80, "Pod Phase"],
    ["conditions", 185, "Pod Conditions"],
    ["container", 290, "Container State"],
    ["status", 395, "kubectl get pod STATUS"]
  ];

  function el(tag, attrs, parent){
    var item = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function(key){ item.setAttribute(key, attrs[key]); });
    if (parent) parent.appendChild(item);
    return item;
  }
  function label(parent, x, y, text, size, weight, fill, anchor){
    var t = el("text", { x:x, y:y, "text-anchor":anchor || "middle", "font-size":size || 12.5, "font-weight":weight || 700, fill:fill || INK }, parent);
    t.textContent = text;
    return t;
  }
  function rect(parent, x, y, w, h, fill, stroke){
    return el("rect", { x:x, y:y, width:w, height:h, rx:10, fill:fill || PAPER, stroke:stroke || INK, "stroke-width":2 }, parent);
  }
  function setPanel(name, value){ if (ui.panels[name]) ui.panels[name].textContent = value; }
  function statusColor(value, kind){
    if (/CrashLoop|Error|Failed|Evicted|Unknown/.test(value)) return [FAIL, FAIL_BD];
    if (/Pending|False|Waiting|Terminating/.test(value)) return [WARN, WARN_BD];
    if (/Running|Ready True|Succeeded|Completed/.test(value)) return [DONE, DONE_BD];
    return [PAPER, INK];
  }

  function buildDom(host){
    root = document.createElement("div");
    root.id = ID;
    root.className = "ka-anim";
    root.setAttribute("data-roadmap-animation-id", ID);
    root.innerHTML =
      '<div class="ka-head"><strong>Pod 生命周期状态转换动画</strong><small>Phase / Conditions / Container State / STATUS 四层同时看</small><button class="ka-zoom" data-action="zoom">⛶ 放大</button></div>' +
      '<div class="ka-tabs"><button data-ch="0">① 正常生命周期</button><button data-ch="1">② 故障与重启</button><button data-ch="2">③ 删除与驱逐</button></div>' +
      '<div class="ka-stage"><svg viewBox="0 0 980 500" role="img" aria-label="Kubernetes Pod 生命周期状态动画"></svg></div>' +
      '<div class="ka-panels"><div class="ka-panel"><b>Phase</b><span data-panel="phase">—</span></div><div class="ka-panel"><b>Conditions</b><span data-panel="conditions">—</span></div><div class="ka-panel"><b>Container State</b><span data-panel="container">—</span></div><div class="ka-panel"><b>kubectl STATUS</b><span data-panel="status">—</span></div></div>' +
      '<div class="ka-caption" data-role="caption"></div>' +
      '<div class="ka-ctrl"><button data-action="play">▶ 播放本幕</button><button data-action="step">▷ 下一步</button><button data-action="reset">⏮ 重置本幕</button><label>速度 <select data-action="speed"><option value="1.6">慢</option><option value="1" selected>正常</option><option value="0.55">快</option></select></label></div>' +
      '<div class="ka-legend"><span><i style="background:#bbf7d0"></i>健康 / 完成</span><span><i style="background:#fde68a"></i>等待 / 终止中</span><span><i style="background:#fecaca"></i>故障 / 驱逐 / 失联</span><span>排障：Pending 看调度/事件，CrashLoopBackOff 看容器日志，Evicted 看节点压力，Unknown 看节点和插件</span></div>';
    host.appendChild(root);
    ui.svg = root.querySelector("svg");
    ui.panels = {};
    root.querySelectorAll("[data-panel]").forEach(function(panel){ ui.panels[panel.dataset.panel] = panel; });
    drawScene();
  }

  function drawScene(){
    var svg = ui.svg;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    layers.forEach(function(layer){
      var key = layer[0], y = layer[1];
      rect(svg, 36, y-32, 900, 70, "#f8fafc", INK);
      label(svg, 138, y+6, layer[2], 14, 900, MUTED);
      ui[key] = {
        box: rect(svg, 260, y-22, 582, 44, PAPER, INK),
        text: label(svg, 551, y+6, "—", 15, 900, INK)
      };
    });
    ui.timeline = label(svg, 490, 36, "状态时间线", 15, 900, MUTED);
    ui.tip = label(svg, 490, 470, "", 12, 800, WARN_BD);
  }

  function resetState(chapter){
    state = {
      phase: chapter === 0 ? "尚未创建" : "Running",
      conditions: chapter === 0 ? "PodScheduled=False / Ready=False" : "PodScheduled=True / Ready=True",
      container: chapter === 0 ? "Waiting: PodInitializing" : "Running",
      status: chapter === 0 ? "Pending" : "Running",
      tip: ""
    };
    if (chapter === 2) {
      state.phase = "Running";
      state.conditions = "Ready=True / deletionTimestamp=—";
      state.container = "Running";
      state.status = "Running";
    }
  }
  function render(){
    layers.forEach(function(layer){
      var key = layer[0];
      var value = state[key];
      var c = statusColor(value, key);
      ui[key].box.setAttribute("fill", c[0]);
      ui[key].box.setAttribute("stroke", c[1]);
      ui[key].text.textContent = value;
      setPanel(key, value);
    });
    ui.tip.textContent = state.tip;
  }
  function set(values){
    Object.keys(values).forEach(function(key){ state[key] = values[key]; });
    render();
  }

  var CHAPTERS = [
    {
      intro:"正常生命周期同时观察四层状态：Pod Phase、Pod Conditions、Container State 和 kubectl STATUS。",
      steps:[
        { text:"对象刚创建，尚未绑定节点：Phase 是 <b>Pending</b>，PodScheduled=False，kubectl 也显示 Pending。", run:function(ctx){ set({phase:"Pending",conditions:"PodScheduled=False / Ready=False",container:"Waiting: PodInitializing",status:"Pending",tip:"Pending 优先看调度事件和 FailedScheduling"}); return ctx.wait(720); } },
        { text:"调度成功并开始拉镜像/启动容器：PodScheduled=True，但容器仍在 Waiting。", run:function(ctx){ set({phase:"Pending",conditions:"PodScheduled=True / Ready=False",container:"Waiting: ContainerCreating",status:"ContainerCreating",tip:"ContainerCreating 常看镜像、挂载和 CNI 事件"}); return ctx.wait(720); } },
        { text:"容器进程已经启动，Phase 进入 <b>Running</b>，但 Ready 仍可能是 False。", run:function(ctx){ set({phase:"Running",conditions:"PodScheduled=True / Ready=False",container:"Running",status:"Running / NotReady",tip:"Running 不等于已经接流量"}); return ctx.wait(720); } },
        { text:"readiness probe 通过，Ready=True，kubectl READY 列才会变成可用。", run:function(ctx){ set({phase:"Running",conditions:"PodScheduled=True / Ready=True",container:"Running",status:"Running / Ready",tip:"Ready=True 后才适合进入 Service 后端"}); return ctx.wait(720); } },
        { text:"普通一次性任务正常退出：容器 Terminated Completed，Pod Phase 变成 <b>Succeeded</b>。", run:function(ctx){ set({phase:"Succeeded",conditions:"Ready=False / ContainersReady=False",container:"Terminated: Completed",status:"Completed",tip:"Succeeded 常见于 Job 或一次性 Pod"}); return ctx.wait(780); } }
      ]
    },
    {
      intro:"CrashLoopBackOff 是 kubectl STATUS/容器等待原因，不是 Pod Phase。Pod phase 仍可能是 Running。",
      steps:[
        { text:"容器原本 Running，Pod Phase 也是 Running。", run:function(ctx){ set({phase:"Running",conditions:"Ready=True / ContainersReady=True",container:"Running",status:"Running",tip:"基线状态健康"}); return ctx.wait(650); } },
        { text:"进程崩溃退出：容器状态变成 Terminated/Error，Ready=False。", run:function(ctx){ set({phase:"Running",conditions:"Ready=False / ContainersReady=False",container:"Terminated: Error exitCode=1",status:"Error",tip:"先看上一次容器日志：kubectl logs --previous"}); return ctx.wait(760); } },
        { text:"kubelet 准备重启容器，状态进入 Waiting，原因是 <b>CrashLoopBackOff</b>。", run:function(ctx){ set({phase:"Running",conditions:"Ready=False / ContainersReady=False",container:"Waiting: CrashLoopBackOff",status:"CrashLoopBackOff",tip:"CrashLoopBackOff 不是 phase，phase 仍可能是 Running"}); return ctx.wait(820); } },
        { text:"退避计时增长，短时间内不会立即重启。", run:function(ctx){ set({phase:"Running",conditions:"Ready=False / ContainersReady=False",container:"Waiting: BackOff 10s → 20s → 40s",status:"CrashLoopBackOff",tip:"反复失败时看启动命令、配置、依赖和探针"}); return ctx.wait(820); } },
        { text:"退避结束后 kubelet 重启容器；如果进程稳定，重新回到 Running。", run:function(ctx){ set({phase:"Running",conditions:"Ready=False → Ready=True",container:"Restarting → Running",status:"Running",tip:"restartCount 增加，原因仍需从日志定位"}); return ctx.wait(820); } }
      ]
    },
    {
      intro:"删除、资源压力驱逐和节点失联是三条不同分支；本页签可重置后分别重放。",
      steps:[
        { text:"正常删除：API Server 设置 <code>deletionTimestamp</code>，kubectl STATUS 常显示 Terminating。", run:function(ctx){ set({phase:"Running",conditions:"Ready=False / deletionTimestamp=set",container:"Running → Terminating",status:"Terminating",tip:"正常删除会进入优雅终止流程，完整机制放在 5.2"}); return ctx.wait(760); } },
        { text:"终止完成后对象被删除，Pod 从 API 中消失，不再有 Phase。", run:function(ctx){ set({phase:"Gone",conditions:"对象已删除",container:"Stopped",status:"NotFound",tip:"Terminating 不是标准 Pod phase，是展示状态"}); return ctx.wait(760); } },
        { text:"资源压力分支：kubelet 根据 QoS 和资源压力选择驱逐对象。", run:function(ctx){ set({phase:"Running",conditions:"NodePressure=True / Ready=False",container:"Running",status:"Evicting",tip:"Evicted 优先看节点内存、磁盘、PID 压力"}); return ctx.wait(760); } },
        { text:"被驱逐后 Pod Phase 变成 <b>Failed</b>，kubectl STATUS 显示 <b>Evicted</b>。", run:function(ctx){ set({phase:"Failed",conditions:"Reason=Evicted",container:"Terminated",status:"Evicted",tip:"Evicted 是失败原因/展示状态，不是单独 phase"}); return ctx.wait(760); } },
        { text:"节点失联分支：控制面无法获得新状态，Pod Phase 可能显示 <b>Unknown</b>。", run:function(ctx){ set({phase:"Unknown",conditions:"Ready=Unknown / NodeLost",container:"Unknown",status:"Unknown",tip:"Unknown 看节点心跳、kubelet、CNI/CRI 插件和网络"}); return ctx.wait(820); } }
      ]
    }
  ];

  function mount(host){
    if (host.querySelector("[data-roadmap-animation-id='" + ID + "']")) return;
    buildDom(host);
    player = window.RoadmapAnimations.createPlayer({
      animationId: ID,
      root: root,
      chapters: CHAPTERS,
      resetState: resetState,
      render: render,
      finishedText: function(){ return "<br><b>本幕结束</b>，可重置本页签独立重放。"; }
    });
  }
  function unmount(){
    if (player) player.destroy();
    player = null;
