<script id="data" type="application/json">{"title": "Kube-Prometheus 深度学习笔记", "intro": "> **文档说明**:本笔记系统性地整理了 kube-prometheus 和 Prometheus Operator 的核心知识,适合深入学习 Kubernetes 上的 Prometheus 监控体系。\n\n---", "parts": [{"title": "目录", "sections": [{"title": "第一章:Kube-Prometheus 概述", "content": "#### 1.1 什么是 Kube-Prometheus\n\n**Kube-Prometheus** 是一个完整的 Kubernetes 集群监控解决方案，它将 Prometheus、Alertmanager、Grafana 以及相关的监控组件打包在一起，提供了开箱即用的 Kubernetes 监控体验。\n\n核心特点：\n\n- **预配置的监控规则**：内置了针对 Kubernetes 核心组件的监控规则\n- **完整的监控栈**：包含 Prometheus、Alertmanager、Grafana、Node Exporter 等\n- **基于 Operator 模式**：使用 Prometheus Operator 实现声明式配置管理\n- **生产就绪**：提供了经过验证的生产级配置\n\n#### 1.2 Kube-Prometheus vs Prometheus Operator\n\n| 对比维度             | Prometheus Operator                    | Kube-Prometheus                                             |\n| -------------------- | -------------------------------------- | ----------------------------------------------------------- |\n| **定位**       | Kubernetes Operator，提供 CRD 和控制器 | 完整的监控解决方案                                          |\n| **包含内容**   | 仅 Operator 本身及 CRD 定义            | Operator + Prometheus + Alertmanager + Grafana + 预配置规则 |\n| **使用场景**   | 需要自定义监控方案                     | 快速部署完整监控栈                                          |\n| **配置复杂度** | 需要自行配置所有监控组件               | 开箱即用，预置最佳实践配置                                  |\n| **灵活性**     | 高度灵活，完全自定义                   | 提供合理默认值，可按需调整                                  |\n\n**关系说明**：Kube-Prometheus 基于 Prometheus Operator 构建，可以理解为 Prometheus Operator + 监控最佳实践配置。\n\n#### 1.3 核心组件介绍\n\nKube-Prometheus 包含以下核心组件：\n\n**1. Prometheus Operator**\n\n- 角色：核心控制器，管理 Prometheus 和 Alertmanager 实例\n- 功能：监听 CRD 资源变化，自动生成 Prometheus 配置\n\n**2. Prometheus**\n\n- 角色：时序数据库和监控引擎\n- 功能：采集、存储、查询监控指标\n\n**3. Alertmanager**\n\n- 角色：告警管理组件\n- 功能：告警去重、分组、路由、静默、抑制\n\n**4. Grafana**\n\n- 角色：可视化展示平台\n- 功能：提供监控仪表盘和图表展示\n\n**5. kube-state-metrics**\n\n- 角色：Kubernetes 对象状态导出器\n- 功能：暴露 Deployment、Pod、Node 等资源的状态指标\n\n**6. node-exporter**\n\n- 角色：节点监控导出器\n- 功能：采集节点级别的硬件和操作系统指标\n\n**7. prometheus-adapter**\n\n- 角色：指标适配器\n- 功能：将 Prometheus 指标转换为 Kubernetes Metrics API，支持 HPA\n\n#### 1.4 架构设计理念\n\nKube-Prometheus 采用了 Kubernetes 原生的设计理念：\n\n**声明式配置**\n\n- 使用 CRD 定义监控目标和告警规则\n- 配置变更通过 Operator 自动应用\n- 符合 GitOps 实践\n\n**服务发现**\n\n- 自动发现 Kubernetes 中的监控目标\n- 通过 Label 选择器动态管理监控对象\n- 无需手动维护采集配置\n\n**高可用设计**\n\n- 支持 Prometheus 多副本部署\n- Alertmanager 支持集群模式\n- 分片机制支持大规模监控\n\n#### 1.5 Kube-Prometheus 架构图\n\n```mermaid\ngraph TD\n    A[Kubernetes API Server] --> B[Prometheus Operator]\n    B --> C[Prometheus StatefulSet]\n    B --> D[Alertmanager StatefulSet]\n  \n    E[ServiceMonitor CRD] --> B\n    F[PodMonitor CRD] --> B\n    G[PrometheusRule CRD] --> B\n    H[Probe CRD] --> B\n  \n    C --> I[kube-state-metrics]\n    C --> J[node-exporter]\n    C --> K[kubelet/cAdvisor]\n    C --> L[API Server]\n    C --> M[Application Exporters]\n  \n    C --> N[Grafana]\n    C --> D\n  \n    D --> O[钉钉/企业微信]\n    D --> P[邮件]\n    D --> Q[Webhook]\n  \n    style B fill:#ff9900\n    style C fill:#E2504B\n    style D fill:#E2504B\n    style N fill:#F89220\n```\n\n---"}, {"title": "第二章:安装部署", "content": "#### 2.1 原生 kubectl 安装方式\n\n这是使用 kube-prometheus 官方清单文件的安装方式，适合需要完全掌控部署细节的场景。\n\n##### 2.1.1 前置准备\n\n**环境要求**：\n\n- Kubernetes 集群版本：≥ 1.21\n- kubectl 已配置并可访问集群\n- 集群节点至少 2 核 CPU、4GB 内存\n\n**检查集群状态**：\n\n```bash\nkubectl cluster-info\nkubectl get nodes\n```\n\n##### 2.1.2 克隆代码仓库\n\n从 GitHub 克隆 kube-prometheus 仓库：\n\n```bash\ngit clone https://github.com/prometheus-operator/kube-prometheus\ncd kube-prometheus\n```\n\n**目录结构说明**：\n\n- `manifests/setup/`：CRD 和 namespace 定义\n- `manifests/`：监控组件的部署清单\n\n##### 2.1.3 部署 CRD 资源\n\n首先部署 Custom Resource Definitions (CRD) 和命名空间：\n\n```bash\nkubectl apply --server-side -f manifests/setup\n```\n\n**参数说明**：\n\n- `--server-side`：使用服务端应用模式，避免客户端配置过大的问题\n\n**等待 CRD 创建完成**：\n\n```bash\nkubectl wait \\\n    --for condition=Established \\\n    --all CustomResourceDefinition \\\n    --namespace=monitoring\n```\n\n这个命令会等待所有 CRD 资源状态变为 `Established`，确保后续部署不会因为 CRD 未就绪而失败。\n\n**验证 CRD**：\n\n```bash\nkubectl get crd | grep monitoring.coreos.com\n```\n\n应该看到以下 CRD：\n\n- `alertmanagers.monitoring.coreos.com`\n- `podmonitors.monitoring.coreos.com`\n- `probes.monitoring.coreos.com`\n- `prometheuses.monitoring.coreos.com`\n- `prometheusrules.monitoring.coreos.com`\n- `servicemonitors.monitoring.coreos.com`\n\n##### 2.1.4 部署监控组件\n\nCRD 就绪后，部署所有监控组件：\n\n```bash\nkubectl apply -f manifests/\n```\n\n这个命令会创建：\n\n- Prometheus Operator\n- Prometheus 实例\n- Alertmanager 实例\n- Grafana\n- kube-state-metrics\n- node-exporter\n- prometheus-adapter\n\n**查看部署状态**：\n\n```bash\nkubectl get pods -n monitoring\n```\n\n等待所有 Pod 进入 `Running` 状态。\n\n##### 2.1.5 部署流程图\n\n```mermaid\ngraph TD\n    Start[开始部署] --> Clone[克隆 kube-prometheus 仓库]\n    Clone --> ApplyCRD[kubectl apply manifests/setup]\n    ApplyCRD --> WaitCRD[等待 CRD Established]\n    WaitCRD --> CheckCRD{CRD 是否就绪}\n    CheckCRD -->|否| WaitCRD\n    CheckCRD -->|是| ApplyManifests[kubectl apply manifests/]\n    ApplyManifests --> WaitPods[等待 Pods Running]\n    WaitPods --> CheckPods{所有 Pod 是否运行}\n    CheckPods -->|否| WaitPods\n    CheckPods -->|是| Verify[访问 Prometheus/Grafana UI]\n    Verify --> End[部署完成]\n  \n    style Start fill:#90EE90\n    style End fill:#90EE90\n    style ApplyCRD fill:#FFD700\n    style ApplyManifests fill:#FFD700\n```\n\n#### 2.2 Helm Chart 安装方式\n\n使用 Helm Chart 安装是最简单快捷的方式，适合快速部署和测试环境。\n\n##### 2.2.1 添加 Helm 仓库\n\n添加 `prometheus-community` Helm 仓库：\n\n```bash\nhelm repo add prometheus-community https://prometheus-community.github.io/helm-charts\n```\n\n**更新 Helm 仓库索引**：\n\n```bash\nhelm repo update\n```\n\n##### 2.2.2 安装 kube-prometheus-stack\n\n使用默认配置安装：\n\n```bash\nhelm install kube-prometheus prometheus-community/kube-prometheus-stack\n```\n\n**参数说明**：\n\n- `kube-prometheus`：Release 名称\n- `prometheus-community/kube-prometheus-stack`：Chart 名称\n\n**指定命名空间安装**：\n\n```bash\nhelm install kube-prometheus prometheus-community/kube-prometheus-stack \\\n  --namespace monitoring \\\n  --create-namespace\n```\n\n**使用自定义配置文件**：\n\n```bash\nhelm install kube-prometheus prometheus-community/kube-prometheus-stack \\\n  -f custom-values.yaml \\\n  --namespace monitoring\n```\n\n##### 2.2.3 存储配置\n\n生产环境中，Prometheus 需要持久化存储。如果您的集群有 StorageClass，可以配置 PVC：\n\n**示例配置** (`values.yaml`):\n\n```yaml\nprometheus:\n  prometheusSpec:\n    storageSpec:\n      volumeClaimTemplate:\n        spec:\n          storageClassName: gp2  # 替换为您的 StorageClass\n          accessModes: [\"ReadWriteOnce\"]\n          resources:\n            requests:\n              storage: 50Gi\n```\n\n**应用配置**：\n\n```bash\nhelm upgrade kube-prometheus prometheus-community/kube-prometheus-stack \\\n  -f values.yaml \\\n  --namespace monitoring\n```\n\n##### 2.2.4 常用配置参数\n\n**关键配置项**：\n\n```yaml\n# Prometheus 配置\nprometheus:\n  prometheusSpec:\n    replicas: 2  # 副本数\n    retention: 15d  # 数据保留时间\n    retentionSize: \"50GB\"  # 数据保留大小\n    resources:  # 资源限制\n      requests:\n        cpu: 500m\n        memory: 2Gi\n      limits:\n        cpu: 2000m\n        memory: 4Gi\n\n# Alertmanager 配置\nalertmanager:\n  alertmanagerSpec:\n    replicas: 3  # 高可用至少3副本\n    retention: 120h\n\n# Grafana 配置\ngrafana:\n  enabled: true\n  adminPassword: \"your-secure-password\"\n  persistence:\n    enabled: true\n    size: 10Gi\n```\n\n#### 2.3 安装方式对比\n\n| 对比维度             | kubectl 原生安装     | Helm Chart 安装        |\n| -------------------- | -------------------- | ---------------------- |\n| **部署难度**   | 中等                 | 简单                   |\n| **配置灵活性** | 高（直接编辑 YAML）  | 高（通过 values.yaml） |\n| **升级管理**   | 手动                 | Helm 自动管理          |\n| **回滚能力**   | 需要手动保存历史版本 | Helm 内置回滚          |\n| **适用场景**   | 需要完全控制部署细节 | 快速部署、生产环境     |\n| **学习价值**   | 深入理解组件关系     | 快速上手               |\n\n**建议**：\n\n- **学习和测试**：使用 kubectl 原生安装，理解每个组件\n- **生产环境**：使用 Helm Chart，便于版本管理和升级\n\n#### 2.4 安装后验证\n\n##### 检查 Pod 状态\n\n```bash\nkubectl get pods -n monitoring\n```\n\n所有 Pod 应该处于 `Running` 状态。\n\n##### 访问 Prometheus UI\n\n**方法1：Port-Forward**\n\n```bash\nkubectl port-forward -n monitoring svc/prometheus-k8s 9090:9090\n```\n\n浏览器访问：`http://localhost:9090`\n\n**方法2：NodePort（测试环境）**\n\n```bash\nkubectl patch svc prometheus-k8s -n monitoring -p '{\"spec\":{\"type\":\"NodePort\"}}'\n```\n\n##### 访问 Grafana UI\n\n**获取 Grafana 密码**（kubectl 安装）：\n\n```bash\nkubectl get secret -n monitoring grafana -o jsonpath=\"{.data.admin-password}\" | base64 --decode\n```\n\n**Port-Forward**：\n\n```bash\nkubectl port-forward -n monitoring svc/grafana 3000:3000\n```\n\n浏览器访问：`http://localhost:3000`\n\n- 用户名：`admin`\n- 密码：使用上面获取的密码\n\n##### 访问 Alertmanager UI\n\n```bash\nkubectl port-forward -n monitoring svc/alertmanager-main 9093:9093\n```\n\n浏览器访问：`http://localhost:9093`\n\n##### 验证监控数据采集\n\n在 Prometheus UI 中执行查询：\n\n```promql\nup\n```\n\n应该能看到所有监控目标的状态。\n\n---"}, {"title": "第三章:Prometheus Operator CRD 资源概览", "content": "#### 3.1 CRD 资源分类\n\nPrometheus Operator 提供了 **6 个核心 CRD** 资源，用于声明式管理 Prometheus 监控栈：\n\n**1. 监控实例类 CRD**\n\n- `Prometheus`：定义 Prometheus 服务器实例\n- `Alertmanager`：定义 Alertmanager 实例\n\n**2. 监控目标发现类 CRD**\n\n- `ServiceMonitor`：通过 Kubernetes Service 发现监控目标\n- `PodMonitor`：直接监控 Pod\n- `Probe`：黑盒监控探测配置\n\n**3. 告警规则类 CRD**\n\n- `PrometheusRule`：定义告警规则和记录规则\n\n#### 3.2 CRD 资源关系图\n\n```mermaid\ngraph TD\n    A[Prometheus CRD] --> B[ServiceMonitor]\n    A --> C[PodMonitor]\n    A --> D[Probe]\n    A --> E[PrometheusRule]\n    A --> F[Alertmanager CRD]\n  \n    B --> G[Service]\n    C --> H[Pod]\n    D --> I[静态目标/Ingress]\n  \n    G --> J[Endpoints]\n    H --> J\n    I --> J\n  \n    J --> K[Prometheus 采集]\n    E --> K\n  \n    K --> L[触发告警]\n    L --> F\n  \n    style A fill:#E2504B\n    style F fill:#E2504B\n    style B fill:#4DB8E8\n    style C fill:#4DB8E8\n    style D fill:#4DB8E8\n    style E fill:#F89220\n```\n\n#### 3.3 CRD 工作原理\n\n**Operator 工作流程**：\n\n1. **监听 CRD 变化**：Prometheus Operator 持续监听 K8s API 中的 CRD 资源变化\n2. **生成配置文件**：根据 CRD 定义自动生成 Prometheus 和 Alertmanager 的配置文件\n3. **热更新配置**：通过 ConfigMap 或 Secret 注入配置，触发组件配置重载\n4. **管理生命周期**：自动管理 StatefulSet、Service、PVC 等 Kubernetes 资源\n\n**声明式管理优势**：\n\n- 用户只需声明期望状态（CRD），Operator 负责实现\n- 配置变更自动应用，无需手动重启\n- 符合 GitOps 最佳实践\n\n#### 3.4 声明式配置优势\n\n**传统方式 vs Operator 方式**：\n\n| 对比项             | 传统配置文件方式        | Kubernetes-Native (CRD) 方式 |\n| ------------------ | ----------------------- | ---------------------------- |\n| **配置管理** | 手动编辑 prometheus.yml | 创建 ServiceMonitor CRD      |\n| **服务发现** | 手动维护 targets 列表   | 自动基于 Label 选择器发现    |\n| **配置变更** | 手动 reload 或重启      | Operator 自动热更新          |\n| **版本控制** | 需要额外管理配置文件    | CRD 天然支持 kubectl apply   |\n| **回滚能力** | 手动保存历史版本        | Kubernetes 原生版本管理      |\n\n---"}, {"title": "第四章:Alertmanager CRD 详解", "content": "#### 4.1 Alertmanager 资源概述\n\n`Alertmanager` CRD 用于声明式定义 Alertmanager 实例。Alertmanager 负责接收 Prometheus 发送的告警，进行去重、分组、路由、静默和抑制，最终发送到配置的接收端（邮件、钉钉、Webhook 等）。\n\n**完整 CRD 示例**：\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: Alertmanager\nmetadata:\n  name: main\n  namespace: monitoring\nspec:\n  replicas: 3\n  version: v0.26.0\n  storage:\n    volumeClaimTemplate:\n      spec:\n        accessModes: [\"ReadWriteOnce\"]\n        resources:\n          requests:\n            storage: 10Gi\n```\n\n#### 4.2 核心 Spec 字段详解\n\n##### 4.2.1 镜像和版本配置\n\n**version** `<string>`\n\n- 说明：Alertmanager 镜像版本号\n- 示例：`v0.26.0`\n- 默认值：Operator 默认版本\n\n**baseImage** `<string>`\n\n- 说明：Alertmanager 基础镜像路径\n- 示例：`quay.io/prometheus/alertmanager`\n- 默认值：`quay.io/prometheus/alertmanager`\n\n**image** `<string>`\n\n- 说明：完整镜像地址（优先级高于 baseImage + version）\n- 示例：`my-registry.com/alertmanager:v0.26.0`\n\n**tag** / **sha** `<string>`\n\n- 说明：镜像标签或 SHA256 摘要\n- 建议：生产环境使用 SHA 锁定版本\n\n**imagePullPolicy** `<string>`\n\n- 说明：镜像拉取策略\n- 可选值：`Always` | `IfNotPresent` | `Never`\n- 默认值：`IfNotPresent`\n\n**imagePullSecrets** `<[]Object>`\n\n- 说明：拉取私有镜像的凭证\n- 示例：\n\n```yaml\nimagePullSecrets:\n  - name: my-registry-secret\n```\n\n##### 4.2.2 副本和高可用配置\n\n**replicas** `<integer>`\n\n- 说明：Alertmanager 副本数量\n- 建议：生产环境至少 3 个副本（奇数个）\n- 默认值：`1`\n\n**高可用说明**：\n\n- Alertmanager 使用 Gossip 协议（基于 memberlist）同步告警状态\n- 多个副本自动组成集群，共享静默、抑制状态\n- 任意副本宕机不影响告警处理\n\n##### 4.2.3 集群模式配置\n\n**forceEnableClusterMode** `<boolean>`\n\n- 说明：即使只有一个副本也启用集群模式\n- 默认值：`false`\n\n**clusterAdvertiseAddress** `<string>`\n\n- 说明：集群通信广播地址\n- 格式：`<IP>:<Port>` 或 `<hostname>:<Port>`\n- 示例：`alertmanager-0.alertmanager-operated:9094`\n\n**clusterGossipInterval** `<string>`\n\n- 说明：Gossip 协议同步间隔\n- 默认值：`200ms`\n- 格式：duration 字符串（如 `500ms`, `1s`）\n\n**clusterPushpullInterval** `<string>`\n\n- 说明：完整状态同步间隔\n- 默认值：`1m`\n\n**clusterPeerTimeout** `<string>`\n\n- 说明：节点超时时间\n- 默认值：`15s`\n\n**additionalPeers** `<[]string>`\n\n- 说明：额外的集群成员地址列表\n- 用途：跨集群 Alertmanager 联邦\n- 示例：\n\n```yaml\nadditionalPeers:\n  - alertmanager-cluster-a.example.com:9094\n  - alertmanager-cluster-b.example.com:9094\n```\n\n##### 4.2.4 告警配置管理\n\n**configSecret** `<string>`\n\n- 说明：包含 `alertmanager.yaml` 配置的 Secret 名称\n- 必需字段：Secret 中需包含 `alertmanager.yaml` key\n- 示例：\n\n```yaml\nconfigSecret: alertmanager-config\n```\n\n**对应 Secret**：\n\n```yaml\napiVersion: v1\nkind: Secret\nmetadata:\n  name: alertmanager-config\n  namespace: monitoring\nstringData:\n  alertmanager.yaml: |\n    global:\n      resolve_timeout: 5m\n    route:\n      group_by: ['alertname', 'cluster']\n      receiver: 'default'\n    receivers:\n      - name: 'default'\n        webhook_configs:\n          - url: 'http://webhook-receiver:5001/'\n```\n\n**alertmanagerConfiguration** `<Object>`\n\n- 说明：使用 AlertmanagerConfig CRD 管理配置（新特性）\n- 优势：更细粒度的配置分层管理\n\n**alertmanagerConfigSelector** `<Object>`\n\n- 说明：选择器，匹配要应用的 AlertmanagerConfig\n- 示例：\n\n```yaml\nalertmanagerConfigSelector:\n  matchLabels:\n    alertmanagerConfig: main\n```\n\n**alertmanagerConfigNamespaceSelector** `<Object>`\n\n- 说明：允许从哪些 namespace 加载 AlertmanagerConfig\n- 示例：\n\n```yaml\nalertmanagerConfigNamespaceSelector:\n  matchLabels:\n    alertmanager: allowed\n```\n\n**alertmanagerConfigMatcherStrategy** `<Object>`\n\n- 说明：配置匹配策略\n- 可选值：`OnNamespace` | `None`\n\n##### 4.2.5 存储配置\n\n**storage** `<Object>`\n\n- 说明：持久化存储配置\n- 重要性：保存静默、抑制状态，重启后恢复\n\n**完整示例**：\n\n```yaml\nstorage:\n  volumeClaimTemplate:\n    spec:\n      storageClassName: fast-ssd\n      accessModes:\n        - ReadWriteOnce\n      resources:\n        requests:\n          storage: 20Gi\n```\n\n**retention** `<string>`\n\n- 说明：告警数据保留时间\n- 默认值：`120h`（5天）\n- 示例：`240h`\n\n##### 4.2.6 资源和调度配置\n\n**resources** `<Object>`\n\n- 说明：CPU 和内存资源限制\n- 示例：\n\n```yaml\nresources:\n  requests:\n    cpu: 100m\n    memory: 128Mi\n  limits:\n    cpu: 500m\n    memory: 512Mi\n```\n\n**nodeSelector** `<map[string]string>`\n\n- 说明：节点选择器\n- 示例：\n\n```yaml\nnodeSelector:\n  monitoring: \"true\"\n```\n\n**affinity** `<Object>`\n\n- 说明：Pod 亲和性/反亲和性\n- 用途：控制 Pod 调度分布\n\n**tolerations** `<[]Object>`\n\n- 说明：容忍度，允许调度到有污点的节点\n- 示例：\n\n```yaml\ntolerations:\n  - key: \"monitoring\"\n    operator: \"Equal\"\n    value: \"true\"\n    effect: \"NoSchedule\"\n```\n\n**topologySpreadConstraints** `<[]Object>`\n\n- 说明：拓扑分布约束\n- 用途：确保副本均匀分布在不同可用区\n\n**priorityClassName** `<string>`\n\n- 说明：优先级类名称\n- 用途：高优先级 Pod 在资源不足时优先调度\n\n**minReadySeconds** `<integer>`\n\n- 说明：Pod 就绪最小等待秒数\n- 默认值：`0`\n\n##### 4.2.7 网络和安全配置\n\n**externalUrl** `<string>`\n\n- 说明：Alertmanager 外部访问 URL\n- 用途：生成告警通知中的链接\n- 示例：`https://alertmanager.example.com`\n\n**routePrefix** `<string>`\n\n- 说明：路由前缀\n- 示例：`/alertmanager/`\n\n**portName** `<string>`\n\n- 说明：Service 端口名称\n- 默认值：`web`\n\n**listenLocal** `<boolean>`\n\n- 说明：仅监听 localhost\n- 默认值：`false`\n\n**web** `<Object>`\n\n- 说明：Web 服务配置（TLS、HTTP/2）\n- 示例：\n\n```yaml\nweb:\n  tlsConfig:\n    certFile: /etc/alertmanager/tls/cert.pem\n    keyFile: /etc/alertmanager/tls/key.pem\n```\n\n**securityContext** `<Object>`\n\n- 说明：Pod 安全上下文\n- 示例：\n\n```yaml\nsecurityContext:\n  runAsNonRoot: true\n  runAsUser: 1000\n  fsGroup: 2000\n```\n\n**serviceAccountName** `<string>`\n\n- 说明：使用的 ServiceAccount\n- 默认值：`alertmanager`\n\n**automountServiceAccountToken** `<boolean>`\n\n- 说明：是否自动挂载 ServiceAccount Token\n- 默认值：`true`\n\n**logLevel** `<string>`\n\n- 说明：日志级别\n- 可选值：`debug` | `info` | `warn` | `error`\n- 默认值：`info`\n\n**logFormat** `<string>`\n\n- 说明：日志格式\n- 可选值：`logfmt` | `json`\n- 默认值：`logfmt`\n\n**paused** `<boolean>`\n\n- 说明：暂停 Alertmanager 实例\n- 用途：维护时临时停止但不删除\n- 默认值：`false`\n\n**其他字段**：\n\n- **containers** / **initContainers**：额外容器\n- **volumeMounts** / **volumes**：额外卷挂载\n- **configMaps** / **secrets**：额外配置和密钥\n- **hostAliases**：Pod 内 /etc/hosts 条目\n\n#### 4.3 Alertmanager Spec 字段速查表\n\n| 字段分类       | 关键字段                   | 作用          | 默认值       |\n| -------------- | -------------------------- | ------------- | ------------ |\n| **镜像** | version                    | 版本号        | Operator默认 |\n|                | image                      | 完整镜像地址  | -            |\n| **副本** | replicas                   | 副本数        | 1            |\n| **集群** | forceEnableClusterMode     | 强制集群模式  | false        |\n|                | additionalPeers            | 额外集群成员  | []           |\n| **配置** | configSecret               | 配置 Secret   | -            |\n|                | alertmanagerConfigSelector | Config 选择器 | {}           |\n| **存储** | storage                    | 持久化配置    | -            |\n|                | retention                  | 数据保留时间  | 120h         |\n| **资源** | resources                  | CPU/内存限制  | -            |\n|                | nodeSelector               | 节点选择      | {}           |\n| **网络** | externalUrl                | 外部 URL      | -            |\n|                | routePrefix                | 路由前缀      | /            |\n| **安全** | securityContext            | 安全上下文    | -            |\n|                | serviceAccountName         | SA 名称       | alertmanager |\n| **日志** | logLevel                   | 日志级别      | info         |\n|                | logFormat                  | 日志格式      | logfmt       |\n\n#### 4.4 配置示例\n\n##### 4.4.1 基础配置示例\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: Alertmanager\nmetadata:\n  name: main\n  namespace: monitoring\nspec:\n  replicas: 1\n  version: v0.26.0\n  configSecret: alertmanager-config\n  logLevel: info\n  resources:\n    requests:\n      cpu: 50m\n      memory: 64Mi\n    limits:\n      cpu: 200m\n      memory: 128Mi\n```\n\n##### 4.4.2 高可用集群配置\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: Alertmanager\nmetadata:\n  name: ha-cluster\n  namespace: monitoring\nspec:\n  replicas: 3  # 奇数副本\n  version: v0.26.0\n  configSecret: alertmanager-config\n  \n  # 高可用配置\n  storage:\n    volumeClaimTemplate:\n      spec:\n        accessModes: [\"ReadWriteOnce\"]\n        resources:\n          requests:\n            storage: 10Gi\n  \n  # 反亲和性，确保副本分布在不同节点\n  affinity:\n    podAntiAffinity:\n      requiredDuringSchedulingIgnoredDuringExecution:\n        - labelSelector:\n            matchExpressions:\n              - key: alertmanager\n                operator: In\n                values:\n                  - ha-cluster\n          topologyKey: kubernetes.io/hostname\n  \n  # 拓扑分布，确保跨可用区\n  topologySpreadConstraints:\n    - maxSkew: 1\n      topologyKey: topology.kubernetes.io/zone\n      whenUnsatisfiable: DoNotSchedule\n      labelSelector:\n        matchLabels:\n          alertmanager: ha-cluster\n  \n  resources:\n    requests:\n      cpu: 100m\n      memory: 128Mi\n    limits:\n      cpu: 500m\n      memory: 512Mi\n```\n\n##### 4.4.3 持久化存储配置\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: Alertmanager\nmetadata:\n  name: persistent\n  namespace: monitoring\nspec:\n  replicas: 2\n  version: v0.26.0\n  configSecret: alertmanager-config\n  \n  # 持久化存储\n  storage:\n    volumeClaimTemplate:\n      metadata:\n        labels:\n          app: alertmanager\n      spec:\n        storageClassName: fast-ssd  # 使用 SSD StorageClass\n        accessModes:\n          - ReadWriteOnce\n        resources:\n          requests:\n            storage: 20Gi\n  \n  # 延长数据保留时间\n  retention: 720h  # 30 天\n  \n  # 外部访问 URL\n  externalUrl: https://alertmanager.prod.example.com\n```\n\n#### 4.5 最佳实践\n\n**1. 高可用部署**\n\n- ✅ 生产环境至少 3 个副本\n- ✅ 使用反亲和性确保副本分布\n- ✅ 配置持久化存储保存状态\n\n**2. 资源规划**\n\n- CPU：基础 100m，高负载 500m-1000m\n- 内存：基础 128Mi，高负载 512Mi-1Gi\n- 存储：至少 10Gi，建议 20-50Gi\n\n**3. 安全加固**\n\n- ✅ 使用 TLS 加密通信\n- ✅ 配置 RBAC 权限最小化\n- ✅ 敏感配置使用 Secret 管理\n\n**4. 配置管理**\n\n- ✅ 将 `alertmanager.yaml` 存储在 Secret 中\n- ✅ 使用 GitOps 管理配置版本\n- ✅ 定期备份配置文件\n\n**5. 监控 Alertmanager 本身**\n\n- ✅ 配置 ServiceMonitor 监控 Alertmanager 指标\n- ✅ 告警：集群成员不健康、消息队列堆积\n- ✅ 日志收集和分析\n\n**6. 集群模式注意事项**\n\n- ✅ 确保副本间网络互通（9094 端口）\n- ✅ 使用稳定的网络标识（StatefulSet）\n- ✅ 监控 Gossip 协议健康状态\n\n---"}, {"title": "第五章:监控目标发现机制", "content": ""}, {"title": "5.1 监控目标发现概述", "content": "Prometheus Operator 提供了三种声明式监控目标发现机制，无需手动维护 `prometheus.yml` 中的 `scrape_configs`：\n\n- **ServiceMonitor**：通过 Kubernetes Service 发现监控目标\n- **PodMonitor**：直接监控 Pod，不依赖 Service\n- **Probe**：适用于黑盒监控（如HTTP探测、DNS探测等）\n\n这些CRD资源使用Label Selector自动发现监控目标，实现真正的动态服务发现。\n\n#### 5.2 ServiceMonitor 详解\n\n##### 5.2.1 ServiceMonitor 概念\n\n**ServiceMonitor** 通过 Label 选择器匹配 Kubernetes Service，并自动发现 Service 后端的 Endpoints 作为监控目标。\n\n**工作流程**：\n\n1. ServiceMonitor 通过 `selector` 匹配 Service\n2. Prometheus Operator 发现匹配的 Service\n3. 从 Service 的 Endpoints 中提取 Pod IP 和端口\n4. 生成 Prometheus 抓取配置\n\n##### 5.2.2 核心 Spec 字段\n\n**selector** `<Object>` - **必需字段**\n\n- 说明：Label 选择器，匹配要监控的 Service\n- 示例：\n\n```yaml\nselector:\n  matchLabels:\n    app: my-app\n```\n\n**namespaceSelector** `<Object>`\n\n- 说明：指定从哪些 namespace 选择 Service\n- 示例：\n\n```yaml\nnamespaceSelector:\n  matchNames:\n    - default\n    - production\n```\n\n- 或匹配全部 namespace：\n\n```yaml\nnamespaceSelector:\n  any: true\n```\n\n**endpoints** `<[]Object>` - **必需字段**\n\n- 说明：定义如何从 Service 提取监控目标\n- 关键子字段：\n  - `port`：Service 端口名称\n  - `path`：指标路径（默认 `/metrics`）\n  - `interval`：采集间隔\n  - `scrapeTimeout`：采集超时\n  - `relabelings`：标签重写规则\n  - `metricRelabelings`：指标重写规则\n\n**jobLabel** `<string>`\n\n- 说明：从 Service 的哪个 label 提取 job 名称\n- 示例：`jobLabel: app`\n\n**targetLabels** `<[]string>`\n\n- 说明：从 Service labels 复制到目标labels\n- 示例：\n\n```yaml\ntargetLabels:\n  - version\n  - team\n```\n\n**podTargetLabels** `<[]string>`\n\n- 说明：从 Pod labels 复制到目标 labels\n\n**sampleLimit** `<integer>`\n\n- 说明：单个目标最大样本数限制\n\n**targetLimit** `<integer>`\n\n- 说明：此 ServiceMonitor 最大目标数限制\n\n**labelLimit** / **labelNameLengthLimit** / **labelValueLengthLimit** `<integer>`\n\n- 说明：标签数量和长度限制\n\n**attachMetadata** `<Object>`\n\n- 说明：附加 Pod 元数据\n- 示例：\n\n```yaml\nattachMetadata:\n  node: true\n```\n\n##### 5.2.3 工作原理\n\n```mermaid\ngraph LR\n    A[ServiceMonitor] -->|selector匹配| B[Service]\n    B -->|获取| C[Endpoints]\n    C -->|解析| D[Pod IP:Port]\n    D -->|生成| E[Prometheus scrape_config]\n    E -->|采集| F[应用指标]\n  \n    style A fill:#4DB8E8\n    style B fill:#90EE90\n    style E fill:#E2504B\n```\n\n##### 5.2.4 配置示例\n\n**基础示例**：\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: ServiceMonitor\nmetadata:\n  name: example-app\n  namespace: monitoring\nspec:\n  selector:\n    matchLabels:\n      app: example-app\n  endpoints:\n    - port: metrics  # Service 端口名\n      interval: 30s\n      path: /metrics\n```\n\n**高级示例（带标签重写）**：\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: ServiceMonitor\nmetadata:\n  name: advanced-monitor\n  namespace: monitoring\nspec:\n  namespaceSelector:\n    matchNames:\n      - production\n  selector:\n    matchLabels:\n      monitoring: \"true\"\n  endpoints:\n    - port: metrics\n      interval: 15s\n      path: /custom/metrics\n      relabelings:\n        - sourceLabels: [__meta_kubernetes_pod_name]\n          targetLabel: pod\n        - sourceLabels: [__meta_kubernetes_namespace]\n          targetLabel: namespace\n  jobLabel: app\n  targetLabels:\n    - version\n  podTargetLabels:\n    - tier\n```\n\n#### 5.3 PodMonitor 详解\n\n##### 5.3.1 PodMonitor 概念\n\n**PodMonitor** 直接监控 Pod，不需要通过 Service。适用于以下场景：\n\n- StatefulSet 应用，每个 Pod 有独立身份\n- 临时任务Pod\n- 不需要 Service 的应用\n\n##### 5.3.2 核心 Spec 字段\n\nPodMonitor 的字段与 ServiceMonitor 类似，主要区别在于：\n\n**selector** / **namespaceSelector** - 直接选择 Pod 而非 Service\n\n**podMetricsEndpoints** `<[]Object>` - 对应 ServiceMonitor 的 `endpoints`\n\n- 关键子字段：\n  - `port`：容器端口名称或端口号\n  - `path`：指标路径\n  - `interval`：采集间隔\n\n其他字段(jobLabel、podTargetLabels、sampleLimit等)与 ServiceMonitor 相同。\n\n##### 5.3.3 工作原理\n\n```mermaid\ngraph LR\n    A[PodMonitor] -->|selector匹配| B[Pod]\n    B -->|提取| C[Pod IP:Port]\n    C -->|生成| D[Prometheus scrape_config]\n    D -->|采集| E[应用指标]\n  \n    style A fill:#4DB8E8\n    style B fill:#FFD700\n    style D fill:#E2504B\n```\n\n##### 5.3.4 配置示例\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: PodMonitor\nmetadata:\n  name: statefulset-monitor\n  namespace: monitoring\nspec:\n  selector:\n    matchLabels:\n      app: stateful-app\n  namespaceSelector:\n    matchNames:\n      - production\n  podMetricsEndpoints:\n    - port: metrics  # 容器端口名\n      interval: 30s\n      path: /metrics\n    - port: admin\n      interval: 60s\n      path: /admin/metrics\n  podTargetLabels:\n    - statefulset.kubernetes.io/pod-name\n```\n\n#### 5.4 Probe 详解\n\n##### 5.4.1 Probe 概念\n\n**Probe** 用于黑盒监控，集成 Prometheus Blackbox Exporter，适用于：\n\n- HTTP/HTTPS 端点探测\n- DNS 查询\n- ICMP Ping\n- TCP 连接检测\n\n##### 5.4.2 核心 Spec 字段\n\n**prober** `<Object>` - **必需字段**\n\n- 说明：Blackbox Exporter 的地址\n- 示例：\n\n```yaml\nprober:\n  url: blackbox-exporter:9115\n  scheme: http\n  path: /probe\n```\n\n**module** `<string>`\n\n- 说明：Blackbox Exporter 的模块名称\n- 默认值：`http_2xx`\n\n**targets** `<Object>`\n\n- 说明：探测目标定义\n- 子字段：\n  - `staticConfig`：静态目标列表\n  - `ingress`：从 Ingress 发现目标\n\n**interval** / **scrapeTimeout** `<string>`\n\n- 说明：探测间隔和超时时间\n\n**其他字段**：jobName、labelLimit、metricRelabelings、authorization、basicAuth、bearerTokenSecret、tlsConfig等\n\n##### 5.4.3 黑盒监控集成\n\n**部署 Blackbox Exporter**：\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: blackbox-exporter\n  namespace: monitoring\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: blackbox-exporter\n  template:\n    metadata:\n      labels:\n        app: blackbox-exporter\n    spec:\n      containers:\n        - name: blackbox-exporter\n          image: prom/blackbox-exporter:latest\n          ports:\n            - containerPort: 9115\n              name: http\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: blackbox-exporter\n  namespace: monitoring\nspec:\n  selector:\n    app: blackbox-exporter\n  ports:\n    - port: 9115\n      targetPort: 9115\n```\n\n##### 5.4.4 配置示例\n\n**静态目标探测**：\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: Probe\nmetadata:\n  name: website-health\n  namespace: monitoring\nspec:\n  prober:\n    url: blackbox-exporter.monitoring.svc:9115\n  module: http_2xx\n  targets:\n    staticConfig:\n      static:\n        - https://www.example.com\n        - https://api.example.com\n  interval: 60s\n  scrapeTimeout: 30s\n```\n\n**Ingress 探测**：\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: Probe\nmetadata:\n  name: ingress-probe\n  namespace: monitoring\nspec:\n  prober:\n    url: blackbox-exporter.monitoring.svc:9115\n  module: http_2xx\n  targets:\n    ingress:\n      selector:\n        matchLabels:\n          probe: \"true\"\n      namespaceSelector:\n        any: true\n  interval: 30s\n```\n\n#### 5.5 三种监控发现机制对比\n\n| 对比项             | ServiceMonitor            | PodMonitor            | Probe                    |\n| ------------------ | ------------------------- | --------------------- | ------------------------ |\n| **发现对象** | Service → Endpoints      | 直接选择 Pod          | 静态目标或Ingress        |\n| **适用场景** | 标准微服务应用            | StatefulSet、Job      | 黑盒监控、外部服务       |\n| **依赖**     | 需要 Service              | 无需 Service          | 需要 Blackbox Exporter   |\n| **指标类型** | 白盒监控（应用内部指标）  | 白盒监控              | 黑盒监控（可用性探测）   |\n| **动态性**   | 高（Service变化自动更新） | 高（Pod变化自动更新） | 中（静态目标需手动更新） |\n| **复杂度**   | 低                        | 低                    | 中（需配置 Exporter）    |\n\n**选择建议**：\n\n- **默认选择 ServiceMonitor**：大部分 Kubernetes 应用都有 Service\n- **StatefulSet 优先 PodMonitor**：需要区分每个 Pod\n- **外部服务、可用性监控用 Probe**\n\n#### 5.6 监控目标发现架构图\n\n```mermaid\ngraph TD\n    A[Prometheus CRD] -->|serviceMonitorSelector| B[ServiceMonitor]\n    A -->|podMonitorSelector| C[PodMonitor]\n    A -->|probeSelector| D[Probe]\n  \n    B -->|selector| E[Service]\n    E -->|获取| F[Endpoints]\n    F --> G[Pod IP:Port列表]\n  \n    C -->|selector| H[Pod]\n    H --> G\n  \n    D -->|targets| I[静态目标/Ingress]\n    I -->|通过| J[Blackbox Exporter]\n    J --> G\n  \n    G --> K[Prometheus 生成scrape_config]\n    K --> L[采集指标]\n  \n    style A fill:#E2504B\n    style B fill:#4DB8E8\n    style C fill:#4DB8E8\n    style D fill:#4DB8E8\n    style K fill:#F89220\n```\n\n#### 5.7 选择合适的监控发现方式\n\n**决策树**：\n\n```mermaid\ngraph TD\n    Start{什么类型的监控?}\n    Start -->|白盒监控| HasService{应用有Service?}\n    Start -->|黑盒监控/外部服务| UseProbe[使用 Probe]\n  \n    HasService -->|是| IsStateful{是StatefulSet?}\n    HasService -->|否| UsePodMonitor1[使用 PodMonitor]\n  \n    IsStateful -->|是且需区分Pod| UsePodMonitor2[使用 PodMonitor]\n    IsStateful -->|否| UseServiceMonitor[使用 ServiceMonitor]\n  \n    style UseServiceMonitor fill:#90EE90\n    style UsePodMonitor1 fill:#FFD700\n    style UsePodMonitor2 fill:#FFD700\n    style UseProbe fill:#FF9900\n```\n\n**最佳实践**：\n\n1. **优先考虑 ServiceMonitor**：符合 Kubernetes 服务治理理念\n2. **PodMonitor 用于特殊场景**：避免过度使用\n3. **Probe 监控关键路径**：API健康检查、DNS可用性\n4. **合理配置采集间隔**：平衡监控精度和资源消耗\n5. **使用 relabelings 优化标签**：保留有用标签，删除冗余标签\n\n---"}]}, {"title": "第六章：Prometheus CRD 详解", "sections": [{"title": "6.1 Prometheus 资源概述", "content": "`Prometheus` CRD 是 Prometheus Operator 的核心资源，用于声明式定义 Prometheus 服务器实例。\n\n**基础示例**：\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: Prometheus\nmetadata:\n  name: main\n  namespace: monitoring\nspec:\n  replicas: 2\n  version: v2.45.0\n  serviceMonitorSelector:\n    matchLabels:\n      team: frontend\n  storage:\n    volumeClaimTemplate:\n      spec:\n        accessModes: [\"ReadWriteOnce\"]\n        resources:\n          requests:\n            storage: 50Gi\n```"}, {"title": "6.2 核心 Spec 字段分类", "content": "#### 6.2.1 镜像和版本配置\n\n- **version**: Prometheus 版本号\n- **baseImage**: 基础镜像路径\n- **image**: 完整镜像地址\n- **tag/sha**: 镜像标签或摘要\n\n#### 6.2.2 副本和分片配置\n\n- **replicas**: 副本数（默认1）\n- **shards**: 分片数量，用于大规模监控\n\n#### 6.2.3 数据采集配置\n\n- **scrapeInterval**: 全局采集间隔（默认30s）\n- **scrapeTimeout**: 采集超时时间\n- **evaluationInterval**: 规则评估间隔（默认30s）\n\n#### 6.2.4 监控目标选择器配置\n\n- **serviceMonitorSelector**: 选择 ServiceMonitor\n- **serviceMonitorNamespaceSelector**: 选择 ServiceMonitor 的 namespace\n- **podMonitorSelector**: 选择 PodMonitor\n- **podMonitorNamespaceSelector**: 选择 PodMonitor 的 namespace\n- **probeSelector**: 选择 Probe\n- **probeNamespaceSelector**: 选择 Probe 的 namespace\n\n#### 6.2.5 告警配置\n\n- **alerting**: Alertmanager 配置\n- **ruleSelector**: 选择 PrometheusRule\n- **ruleNamespaceSelector**: 选择 PrometheusRule 的 namespace\n\n#### 6.2.6 远程读写配置\n\n- **remoteWrite**: 远程写入配置（如写入VictoriaMetrics、Thanos）\n- **remoteRead**: 远程读取配置\n\n#### 6.2.7 存储配置\n\n- **storage**: 持久化存储配置\n- **retention**: 数据保留时间（默认24h）\n- **retentionSize**: 数据保留大小"}, {"title": "6.3 关键字段详解", "content": "**externalLabels** `<map[string]string>`\n\n- 说明：为所有时序数据添加的外部标签\n- 用途：联邦、远程写入时区分不同集群\n\n```yaml\nexternalLabels:\n  cluster: production\n  region: us-west\n```\n\n**additionalScrapeConfigs** `<Object>`\n\n- 说明：额外的抓取配置（通过Secret引用）\n- 用途：监控外部目标或自定义采集\n\n**enableAdminAPI** `<boolean>`\n\n- 说明：启用管理API（删除数据、快照等）\n- 安全提示：生产环境谨慎启用\n\n**walCompression** `<boolean>`\n\n- 说明：启用WAL压缩\n- 建议：默认true，节省存储空间"}, {"title": "6.4 配置示例", "content": "#### 6.4.1 基础配置\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: Prometheus\nmetadata:\n  name: k8s\n  namespace: monitoring\nspec:\n  replicas: 2\n  version: v2.45.0\n  serviceAccountName: prometheus\n  serviceMonitorSelector: {}  # 选择所有 ServiceMonitor\n  podMonitorSelector: {}\n  ruleSelector:\n    matchLabels:\n      prometheus: k8s\n  retention: 15d\n  resources:\n    requests:\n      cpu: 500m\n      memory: 2Gi\n    limits:\n      cpu: 2000m\n      memory: 4Gi\n```\n\n#### 6.4.2 持久化存储配置\n\n```yaml\nspec:\n  storage:\n    volumeClaimTemplate:\n      spec:\n        storageClassName: fast-ssd\n        accessModes: [\"ReadWriteOnce\"]\n        resources:\n          requests:\n            storage: 100Gi\n  retention: 30d\n  retentionSize: 90GB\n```\n\n#### 6.4.3 分片配置\n\n```yaml\nspec:\n  replicas: 2\n  shards: 3  # 3个分片，每个分片2个副本，共6个Pod\n  serviceMonitorSelector: {}\n```\n\n#### 6.4.4 远程写入配置\n\n```yaml\nspec:\n  remoteWrite:\n    - url: http://victoriametrics:8428/api/v1/write\n      queueConfig:\n        capacity: 10000\n        maxShards: 50\n      writeRelabelConfigs:\n        - sourceLabels: [__name__]\n          regex: 'go_.*'\n          action: drop\n```"}, {"title": "6.5 Prometheus Spec 字段速查表", "content": "| 字段               | 类型    | 默认值 | 说明           |\n| ------------------ | ------- | ------ | -------------- |\n| replicas           | integer | 1      | 副本数         |\n| shards             | integer | 1      | 分片数         |\n| version            | string  | -      | Prometheus版本 |\n| retention          | string  | 24h    | 数据保留时间   |\n| retentionSize      | string  | -      | 数据保留大小   |\n| scrapeInterval     | string  | 30s    | 采集间隔       |\n| evaluationInterval | string  | 30s    | 规则评估间隔   |\n| externalLabels     | map     | {}     | 外部标签       |\n| storage            | Object  | -      | 持久化存储     |\n| resources          | Object  | -      | 资源限制       |"}, {"title": "6.6 最佳实践", "content": "1. **副本配置**：生产环境至少2个副本\n2. **存储规划**：按数据保留时间计算存储容量\n3. **资源估算**：每百万样本约需1-2GB内存\n4. **分片策略**：超过10万target时考虑分片\n5. **远程存储**：长期存储使用远程写入\n\n---"}]}, {"title": "第七章：PrometheusRule CRD 详解", "sections": [{"title": "7.1 PrometheusRule 概述", "content": "PrometheusRule 定义告警规则和记录规则，Prometheus Operator 自动将其转换为 Prometheus 配置。"}, {"title": "7.2 告警规则 vs 记录规则", "content": "| 类型               | 用途           | 输出                       |\n| ------------------ | -------------- | -------------------------- |\n| **告警规则** | 定义告警条件   | 触发告警发送到Alertmanager |\n| **记录规则** | 预计算复杂查询 | 生成新的时序数据           |"}, {"title": "7.3 Spec 结构", "content": "**groups** `<[]Object>` - 规则组\n\n- **name**: 组名（必需）\n- **interval**: 评估间隔\n- **rules**: 规则列表\n\n**rules字段**：\n\n- **alert**: 告警名称（告警规则专用）\n- **record**: 记录名称（记录规则专用）\n- **expr**: PromQL表达式（必需）\n- **for**: 持续时间才触发\n- **labels**: 添加的标签\n- **annotations**: 告警注释"}, {"title": "7.4 配置示例", "content": "#### 7.4.1 告警规则示例\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: PrometheusRule\nmetadata:\n  name: node-alerts\n  namespace: monitoring\nspec:\n  groups:\n    - name: node\n      interval: 30s\n      rules:\n        - alert: NodeDown\n          expr: up{job=\"node-exporter\"} == 0\n          for: 5m\n          labels:\n            severity: critical\n          annotations:\n            summary: \"Node {{ $labels.instance }} is down\"\n            description: \"节点已宕机超过5分钟\"\n```\n\n#### 7.4.2 记录规则示例\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: PrometheusRule\nmetadata:\n  name: recording-rules\n  namespace: monitoring\nspec:\n  groups:\n    - name: cpu-usage\n      interval: 1m\n      rules:\n        - record: node:cpu:usage:rate5m\n          expr: |\n            100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)\n```"}, {"title": "7.5 规则编写最佳实践", "content": "1. **使用for减少抖动**：避免瞬时波动引发告警\n2. **合理分组**：按服务或组件分组\n3. **标准化标签**：severity（critical/warning/info）\n4. **详细注释**：使用annotations提供上下文\n5. **记录规则命名**：level:metric:operations格式\n\n---"}]}, {"title": "第八章：高级配置", "sections": [{"title": "8.1 额外抓取配置 (Additional Scrape Config)", "content": "#### 8.1.1 使用场景\n\n- 监控外部非K8s目标\n- 使用Prometheus原生配置语法\n- 临时监控任务\n\n#### 8.1.2 配置方法\n\n**步骤1：创建配置文件**\n\n```yaml\n# prometheus-additional.yaml\n- job_name: 'external-service'\n  static_configs:\n    - targets: ['external.example.com:9090']\n      labels:\n        env: production\n```\n\n**步骤2：创建Secret**\n\n```bash\nkubectl create secret generic additional-scrape-configs \\\n  --from-file=prometheus-additional.yaml \\\n  --dry-run=client -o yaml | kubectl apply -n monitoring -f -\n```\n\n**步骤3：在Prometheus CRD中引用**\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: Prometheus\nmetadata:\n  name: main\nspec:\n  additionalScrapeConfigs:\n    name: additional-scrape-configs\n    key: prometheus-additional.yaml\n```"}, {"title": "8.2 Prometheus 分片机制 (Sharding)", "content": "#### 8.2.1 分片必要性\n\n- 单实例采集能力有限（约10万target）\n- 水平扩展采集能力\n- 降低单实例资源压力\n\n#### 8.2.2 分片工作原理\n\nPrometheus Operator 使用 `hashmod` 方式分片：\n\n- 对目标地址进行哈希\n- 取模分配到不同分片\n- 每个分片独立采集和存储\n\n#### 8.2.3 配置示例\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: Prometheus\nmetadata:\n  name: sharded\nspec:\n  replicas: 2  # 每个分片2副本\n  shards: 3    # 3个分片\n  serviceMonitorSelector: {}\n```\n\n这将创建6个Pod：\n\n- prometheus-sharded-0-0, prometheus-sharded-0-1 (分片0)\n- prometheus-sharded-1-0, prometheus-sharded-1-1 (分片1)\n- prometheus-sharded-2-0, prometheus-sharded-2-1 (分片2)\n\n#### 8.2.4 分片架构图\n\n```mermaid\ngraph TD\n    A[ServiceMonitor] --> B[Prometheus Operator]\n    B --> C[分片0<br/>prometheus-0]\n    B --> D[分片1<br/>prometheus-1]\n    B --> E[分片2<br/>prometheus-2]\n  \n    F[Target Pool<br/>10000个目标] --> G[hashmod计算]\n    G -->|hash % 3 = 0| C\n    G -->|hash % 3 = 1| D\n    G -->|hash % 3 = 2| E\n  \n    C --> H[Thanos Query/Promxy]\n    D --> H\n    E --> H\n    H --> I[统一查询入口]\n  \n    style B fill:#ff9900\n    style H fill:#4DB8E8\n```\n\n#### 8.2.5 分片数据查询\n\n使用联邦或查询层聚合：\n\n- **Thanos Query**：推荐\n- **Promxy**：轻量级\n- **Prometheus Federation**：简单场景\n\n#### 8.2.6 分片最佳实践\n\n1. **合理规划分片数**：根据target数量，一般3-10个分片\n2. **配合副本使用**：每个分片至少2副本保证高可用\n3. **使用查询层**：避免直接查询单个分片\n4. **监控分片均衡度**：检查各分片target分布\n5. **存储分离**：每个分片独立PVC"}]}, {"title": "第九章：Prometheus Operator 架构深度剖析", "sections": [{"title": "9.1 Operator 模式介绍", "content": "**Kubernetes Operator** 是一种软件扩展模式，用于管理复杂的有状态应用。\n\n**核心理念**：\n\n- 将运维知识编码到软件中\n- 通过自定义控制器自动化运维任务\n- 使用 CRD 扩展 Kubernetes API\n\n**Operator = CRD + Controller**"}, {"title": "9.2 Prometheus Operator 工作流程", "content": "```mermaid\ngraph TD\n    A[用户创建 ServiceMonitor CRD] --> B[Kubernetes API Server]\n    B --> C[Prometheus Operator Controller]\n    C --> D[监听 CRD 变化]\n    D --> E[读取所有匹配的 ServiceMonitor]\n    E --> F[生成 Prometheus 配置]\n    F --> G[创建 ConfigMap/Secret]\n    G --> H[触发 Prometheus Pod 重载]\n    H --> I[Prometheus 应用新配置]\n    I --> J[开始采集新目标]\n  \n    K[Service/Pod 变化] --> C\n    L[PrometheusRule 变化] --> C\n  \n    style C fill:#ff9900\n    style F fill:#4DB8E8\n    style I fill:#E2504B\n```\n\n**详细步骤**：\n\n1. **监听 API Server**\n\n   - Operator 通过 Informer 机制监听相关资源\n   - 包括：Prometheus、Alertmanager、ServiceMonitor、PodMonitor、PrometheusRule等\n2. **配置生成**\n\n   - Operator 收集所有匹配的 ServiceMonitor\n   - 转换为 Prometheus 原生 `scrape_configs`\n   - 生成完整的 `prometheus.yml`\n3. **配置注入**\n\n   - 将配置写入 Secret（大配置）或 ConfigMap\n   - 挂载到 Prometheus Pod\n4. **热更新**\n\n   - 发送 HTTP POST 到 `/-/reload` 端点\n   - Prometheus 重新加载配置，无需重启"}, {"title": "9.3 CRD 与配置文件生成机制", "content": "**ServiceMonitor → scrape_config 转换示例**：\n\n**输入（ServiceMonitor CRD）**：\n\n```yaml\napiVersion: monitoring.coreos.com/v1\nkind: ServiceMonitor\nmetadata:\n  name: example\nspec:\n  selector:\n    matchLabels:\n      app: example\n  endpoints:\n    - port: metrics\n      interval: 30s\n```\n\n**输出（Prometheus 配置）**：\n\n```yaml\nscrape_configs:\n  - job_name: monitoring/example/0\n    scrape_interval: 30s\n    kubernetes_sd_configs:\n      - role: endpoints\n        namespaces:\n          names:\n            - monitoring\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_service_label_app]\n        regex: example\n        action: keep\n      - source_labels: [__meta_kubernetes_endpoint_port_name]\n        regex: metrics\n        action: keep\n```\n\n**关键转换规则**：\n\n- `selector` → relabel_configs 中的 keep 规则\n- `endpoints.port` → endpoint_port_name 匹配\n- `interval` → scrape_interval\n- `namespaceSelector` → kubernetes_sd_configs.namespaces"}, {"title": "9.4 配置热更新机制", "content": "```mermaid\ngraph LR\n    A[CRD 变更] --> B[Operator 检测]\n    B --> C[生成新配置]\n    C --> D[更新 Secret]\n    D --> E[kubelet 同步到容器]\n    E --> F[Prometheus 检测文件变化]\n    F --> G[触发 reload]\n    G --> H[应用新配置]\n  \n    style B fill:#ff9900\n    style G fill:#E2504B\n```\n\n**热更新触发方式**：\n\n1. **配置文件监听**：Prometheus 使用 fsnotify 监听配置文件\n2. **HTTP reload**：Operator 发送 POST 请求到 `/-/reload`\n3. **SIGHUP 信号**：向进程发送信号"}, {"title": "9.5 完整架构图", "content": "```mermaid\ngraph TD\n    subgraph \"用户层\"\n        A[kubectl apply CRD]\n    end\n  \n    subgraph \"Kubernetes 控制平面\"\n        B[API Server]\n        C[etcd]\n    end\n  \n    subgraph \"Prometheus Operator\"\n        D[Informer/Watch]\n        E[控制循环 Reconcile]\n        F[配置生成器]\n        G[资源管理器]\n    end\n  \n    subgraph \"生成的资源\"\n        H[StatefulSet]\n        I[Service]\n        J[ConfigMap/Secret]\n        K[PVC]\n    end\n  \n    subgraph \"监控组件\"\n        L[Prometheus Pod]\n        M[Alertmanager Pod]\n    end\n  \n    A --> B\n    B --> C\n    B --> D\n    D --> E\n    E --> F\n    E --> G\n    F --> J\n    G --> H\n    G --> I\n    G --> K\n    H --> L\n    H --> M\n    J --> L\n  \n    style E fill:#ff9900\n    style L fill:#E2504B\n    style M fill:#E2504B\n```"}, {"title": "9.6 关键设计决策", "content": "**1. 为什么使用 StatefulSet？**\n\n- 稳定的网络标识（用于集群成员发现）\n- 有序的部署和扩缩容\n- 持久化存储的稳定绑定\n\n**2. 为什么配置使用 Secret？**\n\n- 支持大配置文件（ConfigMap 限制 1MB）\n- 与敏感信息的处理方式一致\n- 自动的 base64 编码/解码\n\n**3. 如何保证配置一致性？**\n\n- 使用 StatefulSet 的 `updateStrategy.rollingUpdate`\n- 配置更新触发 Pod 滚动重启\n- 通过 `minReadySeconds` 确保平滑更新\n\n**4. 多租户隔离如何实现？**\n\n- 使用 namespace 级别隔离\n- `namespaceSelector` 限制跨 namespace 发现\n- RBAC 控制 CRD 操作权限\n\n---"}]}, {"title": "第十章：生产环境最佳实践", "sections": [{"title": "10.1 资源规划", "content": "#### 10.1.1 Prometheus 资源估算\n\n**内存估算公式**：\n\n```\n内存(GB) = 目标数量 × 样本数/目标 × 保留时间(小时) × 2字节 / 10^9\n          + 2GB(基础开销)\n```\n\n**示例计算**：\n\n- 1000个目标\n- 每个目标1000个样本\n- 保留15天（360小时）\n- 内存 = 1000 × 1000 × 360 × 2 / 10^9 + 2 ≈ **2.7GB**\n\n**CPU 估算**：\n\n- 基础：100m per 1000 targets\n- 查询密集型：额外 +50%\n- 规则评估密集型：额外 +30%\n\n**存储估算**：\n\n```\n存储(GB) = 目标数量 × 样本数/目标 × 保留时间(小时) × 1.5字节 / 10^9\n```\n\n**推荐配置模板**：\n\n| 规模 | 目标数  | CPU      | 内存 | 存储  |\n| ---- | ------- | -------- | ---- | ----- |\n| 小型 | <1000   | 500m     | 2Gi  | 50Gi  |\n| 中型 | 1K-10K  | 2000m    | 8Gi  | 200Gi |\n| 大型 | 10K-50K | 4000m    | 16Gi | 500Gi |\n| 超大 | >50K    | 分片部署 | -    | -     |\n\n#### 10.1.2 Alertmanager 资源估算\n\n**轻量级组件**，固定配置：\n\n- CPU：100-200m\n- 内存：128-256Mi\n- 存储：5-10Gi（保存静默、抑制状态）\n\n#### 10.1.3 存储规划\n\n**存储类型选择**：\n\n- **SSD**：推荐，I/O 密集型\n- **HDD**：仅用于长期存储场景\n\n**保留策略**：\n\n```yaml\nspec:\n  retention: 15d  # 时间保留\n  retentionSize: 45GB  # 容量保留（先达到哪个就清理）\n```\n\n**远程存储方案**：\n\n- **VictoriaMetrics**：高性能，低成本\n- **Thanos**：长期存储，全局查询\n- **Cortex**：多租户，水平扩展"}, {"title": "10.2 高可用部署", "content": "#### 10.2.1 Prometheus 高可用\n\n**方案1：多副本独立采集**\n\n```yaml\nspec:\n  replicas: 2  # 两个独立实例\n```\n\n**特点**：\n\n- ✅ 简单可靠\n- ✅ 查询任一实例都能获取完整数据\n- ❌ 采集和存储成本翻倍\n- ❌ 需要负载均衡查询\n\n**方案2：分片 + 副本**\n\n```yaml\nspec:\n  replicas: 2\n  shards: 3  # 3分片 × 2副本 = 6 Pod\n```\n\n**特点**：\n\n- ✅ 扩展性强\n- ✅ 每个分片有副本保证可用性\n- ❌ 需要查询聚合层（Thanos Query/Promxy）\n- ❌ 配置复杂度高\n\n#### 10.2.2 Alertmanager 集群\n\n**配置要点**：\n\n```yaml\nspec:\n  replicas: 3  # 奇数副本\n  # Operator 自动配置 Gossip 集群\n```\n\n**集群特性**：\n\n- 告警去重：多个 Prometheus 发送相同告警，只通知一次\n- 状态同步：静默、抑制状态在所有节点共享\n- 故障容忍：任一节点宕机不影响告警发送\n\n#### 10.2.3 跨集群联邦\n\n**Prometheus 联邦查询**：\n\n```yaml\n# 中心 Prometheus 配置\nscrape_configs:\n  - job_name: 'federate'\n    honor_labels: true\n    metrics_path: '/federate'\n    params:\n      'match[]':\n        - '{job=\"important-metrics\"}'\n    static_configs:\n      - targets:\n        - 'prometheus-cluster-a:9090'\n        - 'prometheus-cluster-b:9090'\n```"}, {"title": "10.3 性能优化", "content": "#### 10.3.1 采集优化\n\n**1. 合理设置采集间隔**\n\n```yaml\nscrapeInterval: 30s  # 默认值\n# 根据业务调整，不是越短越好\n```\n\n**2. 限制样本数量**\n\n```yaml\nspec:\n  enforcedSampleLimit: 10000  # 单目标最大样本数\n  enforcedTargetLimit: 5000   # 最大目标数\n```\n\n**3. 使用 metric relabeling 过滤无用指标**\n\n```yaml\nmetricRelabelings:\n  - sourceLabels: [__name__]\n    regex: 'go_gc_.*|go_memstats_.*'\n    action: drop\n```\n\n#### 10.3.2 存储优化\n\n**1. 启用 WAL 压缩**\n\n```yaml\nspec:\n  walCompression: true  # 节省50%+存储\n```\n\n**2. 调整 TSDB 参数**\n\n```yaml\nspec:\n  tsdb:\n    outOfOrderTimeWindow: 30m  # 允许30分钟乱序写入\n```\n\n**3. 定期清理**\n\n- 使用 `retention` 和 `retentionSize` 自动清理\n- 避免手动删除数据（影响性能）\n\n#### 10.3.3 查询优化\n\n**1. 使用记录规则**\n\n```yaml\n# 预计算复杂查询\n- record: node:cpu:usage:rate5m\n  expr: |\n    100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)\n```\n\n**2. 限制查询范围**\n\n- 避免查询过长时间范围\n- 使用 `max_samples` 限制\n\n**3. 使用查询缓存**\n\n- Prometheus 内置查询缓存\n- 前端增加缓存层（Trickster）"}, {"title": "10.4 安全加固", "content": "#### 10.4.1 认证和授权\n\n**1. 启用基本认证**（通过 nginx-ingress）\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  annotations:\n    nginx.ingress.kubernetes.io/auth-type: basic\n    nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth\n```\n\n**2. 使用 OAuth2 Proxy**\n\n```yaml\n# 集成企业 SSO\nspec:\n  containers:\n    - name: oauth2-proxy\n      image: quay.io/oauth2-proxy/oauth2-proxy\n```\n\n#### 10.4.2 TLS 配置\n\n```yaml\nspec:\n  web:\n    tlsConfig:\n      cert:\n        secret:\n          name: prometheus-tls\n          key: tls.crt\n      keySecret:\n        name: prometheus-tls\n        key: tls.key\n```\n\n#### 10.4.3 RBAC 权限控制\n\n**最小权限 ServiceAccount**：\n\n```yaml\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: prometheus\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n  name: prometheus\nrules:\n  - apiGroups: [\"\"]\n    resources:\n      - nodes\n      - services\n      - endpoints\n      - pods\n    verbs: [\"get\", \"list\", \"watch\"]\n  - apiGroups: [\"\"]\n    resources:\n      - configmaps\n    verbs: [\"get\"]\n```"}, {"title": "10.5 监控和告警策略", "content": "**Prometheus 自监控**：\n\n```yaml\n# 监控 Prometheus 本身\n- alert: PrometheusDown\n  expr: up{job=\"prometheus\"} == 0\n  for: 5m\n  \n- alert: PrometheusTSDBCompactionsFailing\n  expr: rate(prometheus_tsdb_compactions_failed_total[5m]) > 0\n  \n- alert: PrometheusRuleEvaluationFailures\n  expr: rate(prometheus_rule_evaluation_failures_total[5m]) > 0\n```\n\n**告警分级**：\n\n- **P0/Critical**：影响业务，立即处理\n- **P1/Warning**：潜在风险，关注处理\n- **P2/Info**：信息通知，记录即可"}, {"title": "10.6 备份和恢复", "content": "**备份方案**：\n\n**1. 数据目录快照**\n\n```bash\n# 创建快照\nkubectl exec prometheus-0 -- tar -czf /tmp/backup.tar.gz /prometheus\n\n# 导出\nkubectl cp prometheus-0:/tmp/backup.tar.gz ./backup.tar.gz\n```\n\n**2. 使用 Velero**\n\n```bash\nvelero backup create prometheus-backup \\\n  --include-namespaces monitoring \\\n  --include-resources pvc,pv\n```\n\n**3. 远程存储**\n\n- 配置 remote_write，数据自动备份到远程\n\n**恢复测试**：\n\n- 定期验证备份可用性\n- 文档化恢复步骤\n- 自动化恢复脚本\n\n---"}]}, {"title": "第十一章：常见问题与故障排查", "sections": [{"title": "11.1 安装部署问题", "content": "**问题1：CRD 创建失败**\n\n```\nError: CustomResourceDefinition.apiextensions.k8s.io is invalid\n```\n\n**原因**：Kubernetes 版本过低\n**解决**：升级到 1.21+\n\n**问题2：Pod 一直 Pending**\n\n```\nWarning  FailedScheduling  pod has unbound immediate PersistentVolumeClaims\n```\n\n**原因**：没有可用的 StorageClass\n**解决**：创建 StorageClass 或使用 `emptyDir`"}, {"title": "11.2 数据采集问题", "content": "**问题1：目标显示 Down**\n\n```\nGet \"http://10.0.0.1:8080/metrics\": context deadline exceeded\n```\n\n**原因**：网络不通或超时\n**排查**：\n\n```bash\n# 从 Prometheus Pod 测试连通性\nkubectl exec prometheus-0 -- wget -O- http://目标地址:端口/metrics\n```\n\n**问题2：ServiceMonitor 不生效**\n**排查步骤**：\n\n1. 检查 selector 是否匹配\n\n```bash\nkubectl get svc -n namespace --show-labels\n```\n\n2. 检查 Prometheus 是否选中此 ServiceMonitor\n\n```bash\nkubectl get prometheus -o yaml | grep serviceMonitorSelector\n```\n\n3. 查看 Prometheus 配置\n\n```bash\nkubectl exec prometheus-0 -- cat /etc/prometheus/config_out/prometheus.env.yaml\n```"}, {"title": "11.3 告警问题", "content": "**问题1：告警不触发**\n**排查**：\n\n1. 检查规则是否加载\n\n```\n去 Prometheus UI → Status → Rules\n```\n\n2. 检查表达式是否返回结果\n\n```\n在 Prometheus 中执行 PromQL\n```\n\n3. 检查 `for` 持续时间是否过长\n\n**问题2：告警发送失败**\n**排查 Alertmanager 日志**：\n\n```bash\nkubectl logs alertmanager-0 | grep -i error\n```"}, {"title": "11.4 性能问题", "content": "**问题1：内存溢出 OOMKilled**\n**原因**：查询范围过大或目标过多**解决**：\n\n- 增加内存限制\n- 启用 WAL 压缩\n- 减少保留时间\n- 使用分片\n\n**问题2：查询缓慢**\n**优化**：\n\n- 使用记录规则预计算\n- 缩短查询时间范围\n- 添加更多 CPU 资源"}, {"title": "11.5 存储问题", "content": "**问题1：磁盘空间不足**\n\n```\nprometheus_tsdb_storage_blocks_bytes > 0.9 * volume_size\n```\n\n**解决**：\n\n- 扩容 PVC\n- 减小 retention\n- 配置 retentionSize\n\n**问题2：数据损坏**\n\n```\nError: corruption in block\n```\n\n**解决**：\n\n```bash\n# 删除损坏的 block\nkubectl exec prometheus-0 -- rm -rf /prometheus/01GXX...\n# Prometheus 会自动重建索引\n```"}, {"title": "11.6 排查工具和方法", "content": "**1. 查看 Operator 日志**\n\n```bash\nkubectl logs -n monitoring deployment/prometheus-operator\n```\n\n**2. 查看生成的配置**\n\n```bash\nkubectl exec prometheus-0 -- cat /etc/prometheus/config_out/prometheus.env.yaml\n```\n\n**3. Prometheus 内部指标**\n\n```promql\n# TSDB 状态\nprometheus_tsdb_head_series\n\n# 采集状态\nup{job=\"...\"}\n\n# 规则评估\nprometheus_rule_evaluation_duration_seconds\n```\n\n**4. 启用 Debug 日志**\n\n```yaml\nspec:\n  logLevel: debug\n```\n\n---"}]}, {"title": "第十二章：总结", "sections": [{"title": "12.1 核心知识点回顾", "content": "**Kube-Prometheus 核心概念**：\n\n1. **Operator 模式**：将运维知识编码，自动化管理复杂应用\n2. **声明式配置**：通过 CRD 描述期望状态，Operator 负责实现\n3. **动态服务发现**：基于 Label 自动发现监控目标\n\n**6 个核心 CRD**：\n\n- **Prometheus**：定义 Prometheus 实例\n- **Alertmanager**：定义 Alertmanager 实例\n- **ServiceMonitor**：通过 Service 发现目标\n- **PodMonitor**：直接监控 Pod\n- **Probe**：黑盒监控探测\n- **PrometheusRule**：告警和记录规则\n\n**关键配置要点**：\n\n- **高可用**：多副本 + 反亲和性\n- **持久化**：配置 storage volumeClaimTemplate\n- **资源规划**：根据目标数量和保留时间估算\n- **安全加固**：TLS + RBAC + 认证"}, {"title": "12.2 学习路径建议", "content": "**阶段1：入门（1-2周）**\n\n- 完成基础安装（kubectl 或 Helm）\n- 理解 CRD 资源体系\n- 创建第一个 ServiceMonitor\n- 编写简单告警规则\n\n**阶段2：进阶（2-4周）**\n\n- 深入理解 Prometheus 配置\n- 掌握 PromQL 查询语言\n- 配置 Alertmanager 告警路由\n- 实践远程存储集成\n\n**阶段3：生产（持续）**\n\n- 高可用架构设计\n- 性能调优和故障排查\n- 自定义 Exporter 开发\n- 监控体系完善"}, {"title": "12.3 进阶学习资源", "content": "**官方文档**：\n\n- Prometheus 官方文档：[https://prometheus.io/docs/](https://prometheus.io/docs/)\n- Prometheus Operator：[https://prometheus-operator.dev/](https://prometheus-operator.dev/)\n- Kube-Prometheus：[https://github.com/prometheus-operator/kube-prometheus](https://github.com/prometheus-operator/kube-prometheus)\n\n**推荐书籍**：\n\n- 《Prometheus 监控实战》\n- 《Kubernetes in Action》\n\n**社区资源**：\n\n- CNCF Slack #prometheus 频道\n- Prometheus 中文文档：[https://prometheus.fuckcloudnative.io/](https://prometheus.fuckcloudnative.io/)\n\n**实践项目**：\n\n- 搭建完整监控体系\n- 参与开源 Exporter 开发\n- 编写自定义 Operator\n\n---\n\n**🎉 恭喜！您已完成 Kube-Prometheus 深度学习笔记的全部内容！**\n\n本笔记涵盖了从基础概念到生产实践的完整知识体系，希望能帮助您掌握 Kubernetes 原生的 Prometheus 监控方案。\n\n持续学习，不断实践，祝您在云原生监控领域取得成功！"}]}]}</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('data').textContent);
  const STORAGE_KEY = 'roadmap:' + data.title;
  const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

  const root = document.getElementById('roadmap');
  let totalCount = 0;

  data.parts.forEach((part, pi) => {
    const partEl = document.createElement('section');
    partEl.className = 'part';
    partEl.innerHTML = `
      <div class="part-head">
        <div class="part-num">${pi+1}</div>
        <h2 class="part-title">${escapeHtml(part.title)}</h2>
        <div class="part-bar"></div>
      </div>
      <div class="sections"></div>
    `;
    const grid = partEl.querySelector('.sections');
    part.sections.forEach((sec, si) => {
      totalCount++;
      const id = `${pi}-${si}`;
      const status = state[id] || 'todo';
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.dataset.status = status;
      card.dataset.title = sec.title.toLowerCase();
      card.innerHTML = `
        <div class="status" title="点击切换状态"></div>
        <div class="ttl">${escapeHtml(sec.title)}</div>
      `;
      card.addEventListener('click', e => {
        if (e.target.classList.contains('status')) {
          cycleStatus(id);
        } else {
          openDrawer(pi, si);
        }
      });
      grid.appendChild(card);
    });
    root.appendChild(partEl);
  });

  // drawer
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('backdrop');
  const dTitle = document.getElementById('d-title');
  const dBody = document.getElementById('d-body');
  let currentId = null;

  function openDrawer(pi, si){
    const sec = data.parts[pi].sections[si];
    currentId = `${pi}-${si}`;
    dTitle.textContent = `${pi+1}.${si+1}  ${sec.title}`;
    dBody.innerHTML = marked.parse(sec.content || '*（此小节没有正文）*');
    // 把 ```mermaid 代码块转成可渲染节点
    dBody.querySelectorAll('pre > code.language-mermaid').forEach((code, idx) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + Date.now() + '-' + idx;
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    dBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    if (window.__mermaid) {
      window.__mermaid.run({nodes: dBody.querySelectorAll('.mermaid')}).catch(()=>{});
    }
    dBody.scrollTop = 0;
    drawer.classList.add('open');
    backdrop.classList.add('open');
    syncStatusButtons();
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    currentId = null;
  }
  document.getElementById('d-close').onclick = closeDrawer;
  backdrop.onclick = closeDrawer;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  // status toggle inside drawer
  drawer.querySelectorAll('.toggle-group button').forEach(btn => {
    btn.onclick = () => {
      if (!currentId) return;
      setStatus(currentId, btn.dataset.status);
      syncStatusButtons();
    };
  });
  function syncStatusButtons(){
    const cur = state[currentId] || 'todo';
    drawer.querySelectorAll('.toggle-group button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === cur);
    });
  }

  function cycleStatus(id){
    const order = ['todo','doing','done'];
    const cur = state[id] || 'todo';
    const next = order[(order.indexOf(cur)+1) % order.length];
    setStatus(id, next);
  }
  function setStatus(id, status){
    if (status === 'todo') delete state[id]; else state[id] = status;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.dataset.status = status;
    if (currentId === id) syncStatusButtons();
    updateProgress();
  }

  function updateProgress(){
    const done = Object.values(state).filter(v => v === 'done').length;
    document.getElementById('bar').style.width = (done / totalCount * 100) + '%';
    document.getElementById('progress-text').textContent = `${done} / ${totalCount}`;
  }
  updateProgress();

  // search
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('hidden', q && !c.dataset.title.includes(q));
    });
    document.querySelectorAll('.part').forEach(p => {
      const anyVisible = [...p.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      p.classList.toggle('hidden', !anyVisible);
    });
  });

  // reset
  document.getElementById('reset').onclick = () => {
    if (!confirm('重置所有进度？')) return;
    for (const k of Object.keys(state)) delete state[k];
    localStorage.removeItem(STORAGE_KEY);
    document.querySelectorAll('.card').forEach(c => c.dataset.status = 'todo');
    updateProgress();
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
