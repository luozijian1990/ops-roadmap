": 24 }\n  ],\n  \"default-cgroupns-mode\": \"private\",\n  \"default-gateway\": \"\",\n  \"default-gateway-v6\": \"\",\n  \"default-network-opts\": {},\n  \"default-runtime\": \"runc\",\n  \"default-shm-size\": \"64M\",\n  \"default-ulimits\": {\n    \"nofile\": { \"Hard\": 64000, \"Name\": \"nofile\", \"Soft\": 64000 }\n  },\n  \"dns\": [],\n  \"dns-opts\": [],\n  \"dns-search\": [],\n  \"exec-opts\": [],\n  \"exec-root\": \"\",\n  \"experimental\": false,\n  \"features\": {\n    \"cdi\": true,\n    \"containerd-snapshotter\": true\n  },\n  \"firewall-backend\": \"\",\n  \"fixed-cidr\": \"\",\n  \"fixed-cidr-v6\": \"\",\n  \"group\": \"\",\n  \"host-gateway-ip\": \"\",\n  \"hosts\": [],\n  \"proxies\": {\n    \"http-proxy\": \"http://proxy.example.com:80\",\n    \"https-proxy\": \"https://proxy.example.com:443\",\n    \"no-proxy\": \"*.test.example.com,.example.org\"\n  },\n  \"icc\": false,\n  \"init\": false,\n  \"init-path\": \"/usr/libexec/docker-init\",\n  \"insecure-registries\": [],\n  \"ip\": \"0.0.0.0\",\n  \"ip-forward\": false,\n  \"ip-masq\": false,\n  \"iptables\": false,\n  \"ip6tables\": false,\n  \"ipv6\": false,\n  \"labels\": [],\n  \"live-restore\": true,\n  \"log-driver\": \"json-file\",\n  \"log-format\": \"text\",\n  \"log-level\": \"\",\n  \"log-opts\": {\n    \"cache-disabled\": \"false\",\n    \"cache-max-file\": \"5\",\n    \"cache-max-size\": \"20m\",\n    \"cache-compress\": \"true\",\n    \"env\": \"os,customer\",\n    \"labels\": \"somelabel\",\n    \"max-file\": \"5\",\n    \"max-size\": \"10m\"\n  },\n  \"max-concurrent-downloads\": 3,\n  \"max-concurrent-uploads\": 5,\n  \"max-download-attempts\": 5,\n  \"mtu\": 0,\n  \"no-new-privileges\": false,\n  \"node-generic-resources\": [\n    \"NVIDIA-GPU=UUID1\",\n    \"NVIDIA-GPU=UUID2\"\n  ],\n  \"pidfile\": \"\",\n  \"raw-logs\": false,\n  \"registry-mirrors\": [],\n  \"runtimes\": {\n    \"cc-runtime\": {\n      \"path\": \"/usr/bin/cc-runtime\"\n    },\n    \"custom\": {\n      \"path\": \"/usr/local/bin/my-runc-replacement\",\n      \"runtimeArgs\": [\"--debug\"]\n    }\n  },\n  \"seccomp-profile\": \"\",\n  \"selinux-enabled\": false,\n  \"shutdown-timeout\": 15,\n  \"storage-driver\": \"\",\n  \"storage-opts\": [],\n  \"swarm-default-advertise-addr\": \"\",\n  \"tls\": true,\n  \"tlscacert\": \"\",\n  \"tlscert\": \"\",\n  \"tlskey\": \"\",\n  \"tlsverify\": true,\n  \"userland-proxy\": false,\n  \"userland-proxy-path\": \"/usr/libexec/docker-proxy\",\n  \"userns-remap\": \"\"\n}\n```\n\n#### 配置项分类说明\n\n##### 基础配置\n\n| 配置项           | 类型   | 说明                                            |\n| ---------------- | ------ | ----------------------------------------------- |\n| `data-root`    | string | Docker 数据存储目录（默认 `/var/lib/docker`） |\n| `exec-root`    | string | 执行状态文件目录                                |\n| `pidfile`      | string | PID 文件路径                                    |\n| `debug`        | bool   | 启用调试模式                                    |\n| `experimental` | bool   | 启用实验性功能                                  |\n| `group`        | string | Unix socket 所属组                              |\n\n##### 存储配置\n\n| 配置项             | 类型     | 说明                                 |\n| ------------------ | -------- | ------------------------------------ |\n| `storage-driver` | string   | 存储驱动（overlay2, aufs, btrfs 等） |\n| `storage-opts`   | []string | 存储驱动选项                         |\n\n##### 网络配置\n\n| 配置项                    | 类型     | 说明                                    |\n| ------------------------- | -------- | --------------------------------------- |\n| `bip`                   | string   | docker0 网桥 IP（如 `172.17.0.1/16`） |\n| `bip6`                  | string   | docker0 网桥 IPv6 地址                  |\n| `bridge`                | string   | 自定义网桥名称                          |\n| `fixed-cidr`            | string   | 固定 IPv4 子网                          |\n| `fixed-cidr-v6`         | string   | 固定 IPv6 子网                          |\n| `default-gateway`       | string   | 默认 IPv4 网关                          |\n| `default-gateway-v6`    | string   | 默认 IPv6 网关                          |\n| `default-address-pools` | []object | 默认地址池（base + size）               |\n| `dns`                   | []string | DNS 服务器                              |\n| `dns-opts`              | []string | DNS 选项                                |\n| `dns-search`            | []string | DNS 搜索域                              |\n| `mtu`                   | int      | 网络 MTU 值                             |\n| `ipv6`                  | bool     | 启用 IPv6                               |\n| `ip-forward`            | bool     | 启用 IP 转发                            |\n| `ip-masq`               | bool     | 启用 IP 伪装                            |\n| `iptables`              | bool     | 启用 iptables 规则管理                  |\n| `ip6tables`             | bool     | 启用 ip6tables 规则管理                 |\n| `icc`                   | bool     | 启用容器间通信                          |\n| `userland-proxy`        | bool     | 使用用户态代理                          |\n\n##### 日志配置\n\n| 配置项         | 类型   | 说明                                       |\n| -------------- | ------ | ------------------------------------------ |\n| `log-driver` | string | 日志驱动（json-file, syslog, journald 等） |\n| `log-level`  | string | 日志级别（debug, info, warn, error）       |\n| `log-format` | string | 日志格式（text, json）                     |\n| `log-opts`   | object | 日志驱动选项                               |\n| `raw-logs`   | bool   | 输出原始日志（无 ANSI 颜色）               |\n\n##### 镜像仓库配置\n\n| 配置项                       | 类型     | 说明                   |\n| ---------------------------- | -------- | ---------------------- |\n| `registry-mirrors`         | []string | 镜像加速器列表         |\n| `insecure-registries`      | []string | 非安全仓库列表（HTTP） |\n| `max-concurrent-downloads` | int      | 最大并发下载数         |\n| `max-concurrent-uploads`   | int      | 最大并发上传数         |\n| `max-download-attempts`    | int      | 最大下载重试次数       |\n\n##### 代理配置\n\n| 配置项                  | 类型   | 说明             |\n| ----------------------- | ------ | ---------------- |\n| `proxies.http-proxy`  | string | HTTP 代理地址    |\n| `proxies.https-proxy` | string | HTTPS 代理地址   |\n| `proxies.no-proxy`    | string | 不使用代理的地址 |\n\n##### TLS 配置\n\n| 配置项        | 类型     | 说明           |\n| ------------- | -------- | -------------- |\n| `tls`       | bool     | 启用 TLS       |\n| `tlsverify` | bool     | 启用 TLS 验证  |\n| `tlscacert` | string   | CA 证书路径    |\n| `tlscert`   | string   | 服务器证书路径 |\n| `tlskey`    | string   | 服务器私钥路径 |\n| `hosts`     | []string | 监听地址列表   |\n\n##### 运行时配置\n\n| 配置项                    | 类型   | 说明                                |\n| ------------------------- | ------ | ----------------------------------- |\n| `default-runtime`       | string | 默认运行时（runc）                  |\n| `runtimes`              | object | 自定义运行时配置                    |\n| `containerd`            | string | containerd socket 路径              |\n| `init`                  | bool   | 默认启用 init 进程                  |\n| `init-path`             | string | init 程序路径                       |\n| `cgroup-parent`         | string | 默认 cgroup 父路径                  |\n| `default-cgroupns-mode` | string | cgroup 命名空间模式（private/host） |\n\n##### 安全配置\n\n| 配置项                    | 类型     | 说明                  |\n| ------------------------- | -------- | --------------------- |\n| `seccomp-profile`       | string   | 默认 seccomp 配置文件 |\n| `selinux-enabled`       | bool     | 启用 SELinux          |\n| `no-new-privileges`     | bool     | 禁止获取新权限        |\n| `userns-remap`          | string   | 用户命名空间映射      |\n| `authorization-plugins` | []string | 授权插件列表          |\n\n##### 容器默认配置\n\n| 配置项               | 类型     | 说明               |\n| -------------------- | -------- | ------------------ |\n| `default-ulimits`  | object   | 默认 ulimits 限制  |\n| `default-shm-size` | string   | 默认 /dev/shm 大小 |\n| `labels`           | []string | 守护进程标签       |\n\n##### 构建器配置\n\n| 配置项                              | 类型     | 说明                 |\n| ----------------------------------- | -------- | -------------------- |\n| `builder.gc.enabled`              | bool     | 启用构建缓存垃圾回收 |\n| `builder.gc.defaultReservedSpace` | string   | 默认保留空间         |\n| `builder.gc.policy`               | []object | GC 策略规则          |\n\n##### 功能开关\n\n| 配置项                              | 类型 | 说明                        |\n| ----------------------------------- | ---- | --------------------------- |\n| `features.cdi`                    | bool | 启用 CDI（容器设备接口）    |\n| `features.containerd-snapshotter` | bool | 使用 containerd snapshotter |\n\n##### 其他配置\n\n| 配置项                           | 类型     | 说明                       |\n| -------------------------------- | -------- | -------------------------- |\n| `live-restore`                 | bool     | 守护进程重启时保持容器运行 |\n| `shutdown-timeout`             | int      | 关闭超时时间（秒）         |\n| `node-generic-resources`       | []string | 通用资源（如 GPU）         |\n| `swarm-default-advertise-addr` | string   | Swarm 默认广播地址         |\n\n---\n\n---", "subs": ["配置项分类说明"]}]}, {"title": "第九章 Docker Compose", "sections": [{"title": "9.1 Docker Compose 概述", "content": "Docker Compose 是用于定义和运行多容器 Docker 应用的工具。\n\n#### Compose 版本\n\n| 版本        | 命令               | 说明                    |\n| ----------- | ------------------ | ----------------------- |\n| V1 (已弃用) | `docker-compose` | 独立 Python 工具        |\n| V2          | `docker compose` | Docker CLI 插件（推荐） |\n\n> 📝 本章使用 V2 语法 `docker compose`\n\n---", "subs": ["Compose 版本"]}, {"title": "9.2 docker compose up", "content": "`docker compose up` 命令用于**创建并启动服务**。\n\n#### 语法格式\n\n```bash\ndocker compose up [OPTIONS] [SERVICE...]\n```\n\n#### 常用选项\n\n| 选项                 | 说明                                   |\n| -------------------- | -------------------------------------- |\n| `-d, --detach`     | 后台运行                               |\n| `--build`          | 启动前重新构建镜像                     |\n| `--force-recreate` | 强制重新创建容器                       |\n| `--no-recreate`    | 不重新创建已存在的容器                 |\n| `--no-build`       | 不构建镜像                             |\n| `--no-start`       | 创建容器但不启动                       |\n| `--pull`           | 启动前拉取镜像（always/missing/never） |\n| `--remove-orphans` | 删除未定义的孤立容器                   |\n| `--scale`          | 设置服务实例数                         |\n| `-t, --timeout`    | 关闭超时时间                           |\n| `--wait`           | 等待服务健康                           |\n| `--watch`          | 监听文件变化自动更新                   |\n\n#### 实战示例\n\n**示例 1：后台启动所有服务**\n\n```bash\n$ docker compose up -d\n[+] Running 3/3\n ✔ Network app_default  Created\n ✔ Container app-db-1   Started\n ✔ Container app-web-1  Started\n```\n\n**示例 2：重新构建并启动**\n\n```bash\ndocker compose up -d --build\n```\n\n**示例 3：强制重建容器**\n\n```bash\ndocker compose up -d --force-recreate\n```\n\n**示例 4：启动特定服务**\n\n```bash\ndocker compose up -d web api\n```\n\n**示例 5：扩展服务实例**\n\n```bash\ndocker compose up -d --scale web=3\n```\n\n**示例 6：拉取最新镜像后启动**\n\n```bash\ndocker compose up -d --pull always\n```\n\n**示例 7：等待服务健康后返回**\n\n```bash\ndocker compose up -d --wait\n```\n\n**示例 8：开发模式（监听文件变化）**\n\n```bash\ndocker compose up --watch\n```\n\n---", "subs": ["语法格式", "常用选项", "实战示例"]}, {"title": "9.3 docker compose down", "content": "`docker compose down` 命令用于**停止并删除容器、网络**。\n\n#### 语法格式\n\n```bash\ndocker compose down [OPTIONS]\n```\n\n#### 常用选项\n\n| 选项                 | 说明                  |\n| -------------------- | --------------------- |\n| `-v, --volumes`    | 同时删除卷            |\n| `--rmi`            | 删除镜像（local/all） |\n| `--remove-orphans` | 删除孤立容器          |\n| `-t, --timeout`    | 关闭超时时间          |\n\n#### 实战示例\n\n```bash\n# 停止并删除容器和网络\n$ docker compose down\n\n# 同时删除卷\n$ docker compose down -v\n\n# 同时删除构建的镜像\n$ docker compose down --rmi local\n\n# 删除所有镜像\n$ docker compose down --rmi all\n```\n\n---", "subs": ["语法格式", "常用选项", "实战示例"]}, {"title": "9.4 docker compose ps / logs", "content": "#### docker compose ps：查看服务状态\n\n```bash\n# 查看运行中的服务\n$ docker compose ps\nNAME         SERVICE   STATUS    PORTS\napp-db-1     db        running   3306/tcp\napp-web-1    web       running   0.0.0.0:80->80/tcp\n\n# 查看所有服务（包括已停止）\n$ docker compose ps -a\n\n# 静默模式\n$ docker compose ps -q\n```\n\n#### docker compose logs：查看日志\n\n```bash\n# 查看所有服务日志\n$ docker compose logs\n\n# 查看特定服务日志\n$ docker compose logs web\n\n# 实时跟踪日志\n$ docker compose logs -f\n\n# 显示时间戳\n$ docker compose logs -t\n\n# 限制行数\n$ docker compose logs --tail 100\n\n# 组合使用\n$ docker compose logs -f --tail 50 web api\n```\n\n---", "subs": ["docker compose ps", "docker compose logs"]}, {"title": "9.5 其他常用命令", "content": "#### docker compose start/stop/restart\n\n```bash\n# 启动已存在的服务\n$ docker compose start\n\n# 停止服务\n$ docker compose stop\n\n# 重启服务\n$ docker compose restart\n\n# 操作特定服务\n$ docker compose restart web\n```\n\n#### docker compose exec：进入容器\n\n```bash\n# 进入容器执行命令\n$ docker compose exec web bash\n\n# 执行单个命令\n$ docker compose exec db mysql -u root -p\n\n# 以特定用户执行\n$ docker compose exec -u root web bash\n```\n\n#### docker compose run：运行一次性命令\n\n```bash\n# 运行一次性命令\n$ docker compose run web npm test\n\n# 不启动依赖服务\n$ docker compose run --no-deps web npm test\n\n# 删除容器\n$ docker compose run --rm web npm build\n```\n\n#### docker compose pull/push\n\n```bash\n# 拉取服务镜像\n$ docker compose pull\n\n# 拉取特定服务\n$ docker compose pull web\n\n# 推送镜像\n$ docker compose push\n```\n\n#### docker compose build\n\n```bash\n# 构建服务镜像\n$ docker compose build\n\n# 不使用缓存\n$ docker compose build --no-cache\n\n# 构建特定服务\n$ docker compose build web\n\n# 并行构建\n$ docker compose build --parallel\n```\n\n#### docker compose config\n\n```bash\n# 验证并打印配置\n$ docker compose config\n\n# 只输出服务名\n$ docker compose config --services\n\n# 只输出卷名\n$ docker compose config --volumes\n```\n\n---", "subs": ["docker compose start/stop/restart", "docker compose exec", "docker compose run", "docker compose pull/push", "docker compose build", "docker compose config"]}, {"title": "9.6 compose.yaml 配置详解", "content": "#### 基本结构\n\n```yaml\nname: myapp              # 项目名称\n\nservices:                # 服务定义\n  web:\n    image: nginx:latest\n  db:\n    image: mysql:8.0\n\nvolumes:                 # 卷定义\n  data:\n\nnetworks:               # 网络定义\n  frontend:\n  backend:\n```\n\n#### 完整示例\n\n```yaml\nname: myapp\n\nservices:\n  web:\n    image: nginx:alpine\n    container_name: web\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    volumes:\n      - ./nginx.conf:/etc/nginx/nginx.conf:ro\n      - ./html:/usr/share/nginx/html\n    networks:\n      - frontend\n    depends_on:\n      - api\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 10s\n\n  api:\n    build:\n      context: ./api\n      dockerfile: Dockerfile\n      args:\n        - NODE_ENV=production\n    image: myapp-api:latest\n    environment:\n      - NODE_ENV=production\n      - DB_HOST=db\n    env_file:\n      - .env\n    ports:\n      - \"3000:3000\"\n    networks:\n      - frontend\n      - backend\n    depends_on:\n      db:\n        condition: service_healthy\n    deploy:\n      resources:\n        limits:\n          cpus: \"1\"\n          memory: 512M\n        reservations:\n          cpus: \"0.5\"\n          memory: 256M\n\n  db:\n    image: mysql:8.0\n    container_name: mysql\n    environment:\n      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}\n      MYSQL_DATABASE: myapp\n    volumes:\n      - db-data:/var/lib/mysql\n      - ./init.sql:/docker-entrypoint-initdb.d/init.sql\n    networks:\n      - backend\n    healthcheck:\n      test: [\"CMD\", \"mysqladmin\", \"ping\", \"-h\", \"localhost\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    restart: unless-stopped\n\n  redis:\n    image: redis:alpine\n    command: redis-server --appendonly yes\n    volumes:\n      - redis-data:/data\n    networks:\n      - backend\n\nvolumes:\n  db-data:\n    driver: local\n  redis-data:\n\nnetworks:\n  frontend:\n    driver: bridge\n  backend:\n    driver: bridge\n    internal: true\n```\n\n#### 常用配置项\n\n| 配置项             | 说明         |\n| ------------------ | ------------ |\n| `image`          | 使用的镜像   |\n| `build`          | 构建配置     |\n| `container_name` | 容器名称     |\n| `ports`          | 端口映射     |\n| `volumes`        | 卷挂载       |\n| `environment`    | 环境变量     |\n| `env_file`       | 环境变量文件 |\n| `networks`       | 网络配置     |\n| `depends_on`     | 服务依赖     |\n| `restart`        | 重启策略     |\n| `healthcheck`    | 健康检查     |\n| `deploy`         | 部署配置     |\n| `command`        | 覆盖默认命令 |\n| `entrypoint`     | 覆盖入口点   |\n\n---", "subs": ["基本结构", "完整示例", "常用配置项"]}, {"title": "9.7 Compose 命令小结", "content": "| 命令                       | 作用       | 示例                                |\n| -------------------------- | ---------- | ----------------------------------- |\n| `docker compose up`      | 创建并启动 | `docker compose up -d`            |\n| `docker compose down`    | 停止并删除 | `docker compose down -v`          |\n| `docker compose ps`      | 查看状态   | `docker compose ps`               |\n| `docker compose logs`    | 查看日志   | `docker compose logs -f`          |\n| `docker compose exec`    | 进入容器   | `docker compose exec web bash`    |\n| `docker compose run`     | 运行命令   | `docker compose run web npm test` |\n| `docker compose build`   | 构建镜像   | `docker compose build`            |\n| `docker compose pull`    | 拉取镜像   | `docker compose pull`             |\n| `docker compose start`   | 启动服务   | `docker compose start`            |\n| `docker compose stop`    | 停止服务   | `docker compose stop`             |\n| `docker compose restart` | 重启服务   | `docker compose restart`          |\n| `docker compose config`  | 验证配置   | `docker compose config`           |\n\n---", "subs": []}, {"title": "9.8 镜像与构建属性详解（image, build）", "content": "#### image 属性\n\n`image` 属性指定服务使用的镜像。\n\n##### 基本用法\n\n```yaml\nservices:\n  web:\n    image: nginx                    # 使用默认 latest 标签\n  \n  api:\n    image: node:18-alpine           # 指定版本标签\n  \n  db:\n    image: mysql:8.0.35             # 指定精确版本\n  \n  app:\n    image: myregistry.com/myapp:v1  # 私有仓库镜像\n```\n\n##### 镜像命名格式\n\n```yaml\n# 完整格式\nimage: [registry/][namespace/]name[:tag|@digest]\n\n# 示例\nservices:\n  # Docker Hub 官方镜像\n  redis:\n    image: redis:7\n\n  # Docker Hub 用户镜像\n  custom:\n    image: username/myimage:latest\n\n  # 私有仓库\n  private:\n    image: registry.example.com:5000/myapp:v2.1.0\n\n  # 使用 digest（不可变）\n  secure:\n    image: nginx@sha256:abc123...\n```\n\n---\n\n#### build 属性\n\n`build` 属性用于从 Dockerfile 构建镜像。\n\n##### 简写形式\n\n```yaml\nservices:\n  web:\n    build: ./app    # 指定构建上下文目录\n```\n\n##### 完整形式\n\n```yaml\nservices:\n  web:\n    build:\n      context: ./app                    # 构建上下文\n      dockerfile: Dockerfile            # Dockerfile 路径\n      args:                             # 构建参数\n        - NODE_ENV=production\n        - VERSION=1.0.0\n      target: production                # 多阶段构建目标\n      tags:                             # 镜像标签\n        - myapp:latest\n        - myapp:v1.0.0\n      cache_from:                       # 缓存来源\n        - myapp:cache\n      cache_to:                         # 缓存目标\n        - type=local,dest=/tmp/cache\n      platforms:                        # 目标平台\n        - linux/amd64\n        - linux/arm64\n      labels:                           # 镜像标签\n        - com.example.version=1.0.0\n      network: host                     # 构建网络模式\n      shm_size: 256m                    # /dev/shm 大小\n      extra_hosts:                      # 额外 hosts\n        - \"host.docker.internal:host-gateway\"\n```\n\n##### build 配置项详解\n\n| 配置项                | 说明                                |\n| --------------------- | ----------------------------------- |\n| `context`           | 构建上下文路径或 Git URL            |\n| `dockerfile`        | Dockerfile 文件名（相对于 context） |\n| `dockerfile_inline` | 内联 Dockerfile 内容                |\n| `args`              | 构建参数（对应 Dockerfile ARG）     |\n| `target`            | 多阶段构建目标阶段                  |\n| `tags`              | 构建的镜像标签列表                  |\n| `cache_from`        | 缓存来源镜像                        |\n| `cache_to`          | 缓存存储目标                        |\n| `platforms`         | 目标平台架构                        |\n| `labels`            | 镜像标签                            |\n| `network`           | 构建时网络模式                      |\n| `shm_size`          | /dev/shm 大小                       |\n| `extra_hosts`       | 构建时额外 hosts 映射               |\n| `pull`              | 构建前是否拉取基础镜像              |\n| `no_cache`          | 不使用缓存构建                      |\n| `secrets`           | 构建时 secrets                      |\n| `ssh`               | SSH 代理配置                        |\n\n---\n\n#### image + build 组合\n\n同时指定 `image` 和 `build` 时，构建的镜像将使用 `image` 指定的名称：\n\n```yaml\nservices:\n  api:\n    build:\n      context: ./api\n      dockerfile: Dockerfile\n    image: myregistry.com/myapi:${VERSION:-latest}\n```\n\n---\n\n#### 实战示例\n\n##### 示例 1：基础构建\n\n```yaml\nservices:\n  app:\n    build: .\n    image: myapp:latest\n    ports:\n      - \"3000:3000\"\n```\n\n##### 示例 2：多阶段构建\n\n```yaml\nservices:\n  app:\n    build:\n      context: .\n      target: production\n      args:\n        - NODE_ENV=production\n    image: myapp:prod\n```\n\n##### 示例 3：带缓存的构建\n\n```yaml\nservices:\n  app:\n    build:\n      context: .\n      cache_from:\n        - myapp:cache\n        - myapp:latest\n      cache_to:\n        - type=inline\n    image: myapp:latest\n```\n\n##### 示例 4：多平台构建\n\n```yaml\nservices:\n  app:\n    build:\n      context: .\n      platforms:\n        - linux/amd64\n        - linux/arm64\n    image: myapp:multiarch\n```\n\n##### 示例 5：使用 Git 仓库\n\n```yaml\nservices:\n  app:\n    build:\n      context: https://github.com/user/repo.git#main\n      dockerfile: docker/Dockerfile\n    image: myapp:latest\n```\n\n##### 示例 6：内联 Dockerfile\n\n```yaml\nservices:\n  simple:\n    build:\n      context: .\n      dockerfile_inline: |\n        FROM alpine:3.18\n        RUN apk add --no-cache curl\n        COPY . /app\n        CMD [\"./app\"]\n    image: simple-app:latest\n```\n\n---", "subs": ["image 属性", "build 属性", "image + build 组合", "实战示例"]}, {"title": "9.9 命令与入口点属性详解（command, entrypoint）", "content": "#### command 属性\n\n`command` 属性用于覆盖容器默认命令（Dockerfile 中的 `CMD`）。\n\n##### 语法格式\n\n```yaml\nservices:\n  app:\n    image: alpine\n    # 字符串格式（shell 形式）\n    command: echo \"Hello World\"\n\n  api:\n    image: node:18\n    # 列表格式（exec 形式，推荐）\n    command: [\"npm\", \"run\", \"start\"]\n```\n\n##### shell 形式 vs exec 形式\n\n| 形式  | 语法                         | 说明                     |\n| ----- | ---------------------------- | ------------------------ |\n| shell | `command: cmd arg1 arg2`   | 通过 `/bin/sh -c` 执行 |\n| exec  | `command: [\"cmd\", \"arg1\"]` | 直接执行，推荐使用       |\n\n##### 实战示例\n\n```yaml\nservices:\n  # 示例 1：覆盖默认命令\n  nginx:\n    image: nginx\n    command: [\"nginx\", \"-g\", \"daemon off;\", \"-c\", \"/etc/nginx/custom.conf\"]\n\n  # 示例 2：开发模式启动\n  api:\n    image: node:18\n    command: npm run dev\n\n  # 示例 3：使用环境变量\n  app:\n    image: python:3.11\n    command: [\"python\", \"-m\", \"flask\", \"run\", \"--host=${HOST:-0.0.0.0}\"]\n\n  # 示例 4：多行命令\n  worker:\n    image: alpine\n    command: >\n      sh -c \"\n        echo 'Starting worker...' &&\n        sleep 5 &&\n        ./worker --config /etc/config.yaml\n      \"\n```\n\n---\n\n#### entrypoint 属性\n\n`entrypoint` 属性用于覆盖容器入口点（Dockerfile 中的 `ENTRYPOINT`）。\n\n##### 语法格式\n\n```yaml\nservices:\n  app:\n    image: myapp\n    # 字符串格式\n    entrypoint: /app/entrypoint.sh\n\n  api:\n    image: node:18\n    # 列表格式（推荐）\n    entrypoint: [\"node\", \"--inspect=0.0.0.0:9229\"]\n```\n\n##### 实战示例\n\n```yaml\nservices:\n  # 示例 1：自定义入口脚本\n  app:\n    image: myapp\n    entrypoint: [\"/docker-entrypoint.sh\"]\n    command: [\"--config\", \"/etc/app.conf\"]\n\n  # 示例 2：调试模式\n  debug:\n    image: node:18\n    entrypoint: [\"node\", \"--inspect-brk=0.0.0.0:9229\"]\n    command: [\"app.js\"]\n\n  # 示例 3：禁用默认入口点\n  shell:\n    image: redis\n    entrypoint: []\n    command: [\"sh\", \"-c\", \"redis-cli ping\"]\n```\n\n---\n\n#### entrypoint + command 组合\n\n`entrypoint` 定义可执行程序，`command` 定义参数：\n\n```yaml\nservices:\n  # 最终执行: python -u app.py --debug --port 8080\n  app:\n    image: python:3.11\n    entrypoint: [\"python\", \"-u\"]\n    command: [\"app.py\", \"--debug\", \"--port\", \"8080\"]\n```\n\n##### 组合规则\n\n| Dockerfile       | compose entrypoint | compose command | 最终执行                                |\n| ---------------- | ------------------ | --------------- | --------------------------------------- |\n| ENTRYPOINT + CMD | -                  | -               | Dockerfile 定义                         |\n| ENTRYPOINT + CMD | 设置               | -               | compose entrypoint + Dockerfile CMD     |\n| ENTRYPOINT + CMD | -                  | 设置            | Dockerfile ENTRYPOINT + compose command |\n| ENTRYPOINT + CMD | 设置               | 设置            | compose entrypoint + compose command    |\n| ENTRYPOINT + CMD | `[]` (空)        | 设置            | compose command                         |\n\n---\n\n#### 常见使用场景\n\n##### 场景 1：开发环境热重载\n\n```yaml\nservices:\n  api:\n    build: .\n    command: npm run dev\n    volumes:\n      - .:/app\n```\n\n##### 场景 2：数据库初始化脚本\n\n```yaml\nservices:\n  db:\n    image: postgres:15\n    entrypoint: [\"/docker-entrypoint.sh\"]\n    command: [\"postgres\"]\n    volumes:\n      - ./init.sql:/docker-entrypoint-initdb.d/init.sql\n```\n\n##### 场景 3：等待依赖服务\n\n```yaml\nservices:\n  api:\n    image: myapi\n    entrypoint: [\"/wait-for-it.sh\", \"db:5432\", \"--\"]\n    command: [\"./start.sh\"]\n    depends_on:\n      - db\n```\n\n##### 场景 4：一次性任务\n\n```yaml\nservices:\n  migrate:\n    image: myapp\n    command: [\"npm\", \"run\", \"migrate\"]\n    profiles:\n      - tools\n```\n\n##### 场景 5：多命令执行\n\n```yaml\nservices:\n  setup:\n    image: alpine\n    command: >\n      sh -c \"\n        echo 'Step 1: Initialize' &&\n        mkdir -p /data/logs &&\n        echo 'Step 2: Set permissions' &&\n        chmod 755 /data &&\n        echo 'Step 3: Complete'\n      \"\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **重要提示**：\n>\n> 1. exec 形式（列表格式）不会进行 shell 变量替换，需要显式使用 `sh -c`\n> 2. 空 entrypoint `[]` 可以完全禁用 Dockerfile 定义的入口点\n> 3. 在生产环境建议使用 exec 形式，可以正确接收信号\n\n---", "subs": ["command 属性", "entrypoint 属性", "entrypoint + command 组合", "常见使用场景", "注意事项"]}, {"title": "9.10 端口与网络属性详解（ports, expose, networks, dns, extra_hosts）", "content": "#### ports 属性\n\n`ports` 属性用于将容器端口映射到宿主机。\n\n##### 短格式\n\n```yaml\nservices:\n  web:\n    image: nginx\n    ports:\n      - \"80\"                    # 容器端口，宿主机随机分配\n      - \"8080:80\"               # 宿主机:容器\n      - \"443:443\"               # HTTPS\n      - \"127.0.0.1:8080:80\"     # 绑定特定 IP\n      - \"8080-8090:80-90\"       # 端口范围\n      - \"6060:6060/udp\"         # UDP 协议\n```\n\n##### 长格式\n\n```yaml\nservices:\n  web:\n    image: nginx\n    ports:\n      - target: 80              # 容器端口\n        published: 8080         # 宿主机端口\n        protocol: tcp           # 协议 (tcp/udp)\n        mode: host              # host 或 ingress\n        host_ip: 0.0.0.0        # 绑定 IP\n\n      - target: 443\n        published: \"8443\"\n        protocol: tcp\n```\n\n##### 配置项说明\n\n| 配置项        | 说明                                   |\n| ------------- | -------------------------------------- |\n| `target`    | 容器端口                               |\n| `published` | 宿主机端口                             |\n| `protocol`  | 协议（tcp/udp）                        |\n| `mode`      | host（直接绑定）或 ingress（负载均衡） |\n| `host_ip`   | 绑定的宿主机 IP                        |\n\n---\n\n#### expose 属性\n\n`expose` 属性声明容器内部端口，仅供内部网络访问，**不映射到宿主机**。\n\n```yaml\nservices:\n  api:\n    image: myapi\n    expose:\n      - \"3000\"\n      - \"3001\"\n      - \"8000-8100\"\n```\n\n##### ports vs expose 对比\n\n| 属性       | 宿主机可访问 | 容器间可访问 | 用途     |\n| ---------- | ------------ | ------------ | -------- |\n| `ports`  | ✅           | ✅           | 外部服务 |\n| `expose` | ❌           | ✅           | 内部服务 |\n\n---\n\n#### networks 属性\n\n`networks` 属性配置服务使用的网络。\n\n##### 基本用法\n\n```yaml\nservices:\n  web:\n    image: nginx\n    networks:\n      - frontend\n\n  api:\n    image: myapi\n    networks:\n      - frontend\n      - backend\n\n  db:\n    image: mysql\n    networks:\n      - backend\n\nnetworks:\n  frontend:\n  backend:\n```\n\n##### 高级配置\n\n```yaml\nservices:\n  api:\n    image: myapi\n    networks:\n      backend:\n        aliases:                    # 网络别名\n          - api-service\n          - internal-api\n        ipv4_address: 172.20.0.10   # 固定 IP\n        ipv6_address: 2001:db8::10\n        priority: 100               # 优先级\n\nnetworks:\n  backend:\n    driver: bridge\n    ipam:\n      config:\n        - subnet: 172.20.0.0/16\n```\n\n---\n\n#### network_mode 属性\n\n`network_mode` 设置容器的网络模式。\n\n```yaml\nservices:\n  # 使用宿主机网络\n  host-app:\n    image: myapp\n    network_mode: host\n\n  # 不使用网络\n  isolated:\n    image: myapp\n    network_mode: none\n\n  # 共享另一个容器的网络\n  sidecar:\n    image: debug-tools\n    network_mode: service:api\n\n  # 共享另一个容器的网络（通过容器名）\n  debug:\n    image: nicolaka/netshoot\n    network_mode: container:my-container\n```\n\n##### 网络模式对比\n\n| 模式                           | 说明                 |\n| ------------------------------ | -------------------- |\n| `bridge`                     | 默认，容器有独立网络 |\n| `host`                       | 使用宿主机网络栈     |\n| `none`                       | 无网络               |\n| `service:[service_name]`     | 共享指定服务的网络   |\n| `container:[container_name]` | 共享指定容器的网络   |\n\n> ⚠️ 使用 `network_mode` 时不能同时使用 `networks` 和 `ports`\n\n---\n\n#### dns 属性\n\n`dns` 属性配置容器的 DNS 服务器。\n\n```yaml\nservices:\n  app:\n    image: myapp\n    dns:\n      - 8.8.8.8\n      - 8.8.4.4\n    dns_search:\n      - example.com\n      - internal.example.com\n    dns_opt:\n      - ndots:5\n      - timeout:3\n```\n\n---\n\n#### extra_hosts 属性\n\n`extra_hosts` 属性添加额外的 hosts 映射（写入 `/etc/hosts`）。\n\n```yaml\nservices:\n  app:\n    image: myapp\n    extra_hosts:\n      - \"db.local:192.168.1.100\"\n      - \"api.local:192.168.1.101\"\n      - \"host.docker.internal:host-gateway\"  # 访问宿主机\n```\n\n---\n\n#### 实战示例\n\n##### 示例 1：前后端分离架构\n\n```yaml\nservices:\n  nginx:\n    image: nginx\n    ports:\n      - \"80:80\"\n    networks:\n      - frontend\n\n  api:\n    image: myapi\n    expose:\n      - \"3000\"\n    networks:\n      - frontend\n      - backend\n\n  db:\n    image: postgres\n    expose:\n      - \"5432\"\n    networks:\n      - backend\n\nnetworks:\n  frontend:\n  backend:\n    internal: true    # 内部网络，无法访问外网\n```\n\n##### 示例 2：固定 IP 部署\n\n```yaml\nservices:\n  app:\n    image: myapp\n    networks:\n      mynet:\n        ipv4_address: 172.28.0.10\n\nnetworks:\n  mynet:\n    driver: bridge\n    ipam:\n      config:\n        - subnet: 172.28.0.0/16\n```\n\n##### 示例 3：调试容器\n\n```yaml\nservices:\n  api:\n    image: myapi\n    networks:\n      - appnet\n\n  debug:\n    image: nicolaka/netshoot\n    network_mode: service:api\n    profiles:\n      - debug\n```\n\n---", "subs": ["ports 属性", "expose 属性", "networks 属性", "network_mode 属性", "dns 属性", "extra_hosts 属性", "实战示例"]}, {"title": "9.11 存储与挂载属性详解（volumes, tmpfs, configs, secrets）", "content": "#### volumes 属性\n\n`volumes` 属性用于挂载卷或目录到容器。\n\n##### 短格式\n\n```yaml\nservices:\n  app:\n    image: myapp\n    volumes:\n      - /var/lib/data                      # 匿名卷\n      - mydata:/var/lib/data               # 命名卷\n      - ./config:/etc/app/config           # 绑定挂载（相对路径）\n      - /host/path:/container/path         # 绑定挂载（绝对路径）\n      - ./config:/etc/app/config:ro        # 只读挂载\n      - ./logs:/var/log:rw                 # 读写挂载\n```\n\n##### 长格式\n\n```yaml\nservices:\n  app:\n    image: myapp\n    volumes:\n      # 命名卷\n      - type: volume\n        source: mydata\n        target: /var/lib/data\n        read_only: false\n        volume:\n          nocopy: true        # 不复制容器数据到卷\n\n      # 绑定挂载\n      - type: bind\n        source: ./config\n        target: /etc/app/config\n        read_only: true\n        bind:\n          create_host_path: true    # 自动创建宿主机目录\n          selinux: z               # SELinux 标签\n\n      # tmpfs 挂载\n      - type: tmpfs\n        target: /tmp\n        tmpfs:\n          size: 100m\n          mode: 1777\n```\n\n##### 配置项说明\n\n| 配置项                    | 说明                          |\n| ------------------------- | ----------------------------- |\n| `type`                  | 挂载类型（volume/bind/tmpfs） |\n| `source`                | 源（卷名或宿主机路径）        |\n| `target`                | 容器内路径                    |\n| `read_only`             | 是否只读                      |\n| `volume.nocopy`         | 不复制数据到卷                |\n| `bind.create_host_path` | 自动创建宿主机路径            |\n| `bind.selinux`          | SELinux 标签（z/Z）           |\n\n##### 顶层 volumes 定义\n\n```yaml\nservices:\n  db:\n    image: postgres\n    volumes:\n      - db-data:/var/lib/postgresql/data\n\nvolumes:\n  db-data:                          # 默认本地驱动\n  \n  nfs-data:                         # NFS 驱动\n    driver: local\n    driver_opts:\n      type: nfs\n      o: addr=192.168.1.100,rw\n      device: \":/path/to/dir\"\n\n  external-vol:                     # 使用外部卷\n    external: true\n    name: my-existing-volume\n```\n\n---\n\n#### tmpfs 属性\n\n`tmpfs` 属性用于挂载内存文件系统。\n\n```yaml\nservices:\n  app:\n    image: myapp\n    tmpfs:\n      - /tmp\n      - /run\n\n  cache:\n    image: myapp\n    tmpfs:\n      - /tmp:size=100m,mode=1777\n```\n\n##### tmpfs 适用场景\n\n| 场景     | 说明               |\n| -------- | ------------------ |\n| 敏感数据 | 临时存储不落盘     |\n| 高速缓存 | 内存级 IO 性能     |\n| 临时文件 | 容器销毁后自动清理 |\n\n---\n\n#### configs 属性\n\n`configs` 属性用于注入配置文件到容器。\n\n```yaml\nservices:\n  web:\n    image: nginx\n    configs:\n      - my_config                           # 短格式，挂载到 /<config-name>\n      - source: nginx_config\n        target: /etc/nginx/nginx.conf       # 指定目标路径\n        uid: \"103\"                          # 文件所有者\n        gid: \"103\"\n        mode: 0440                          # 文件权限\n\nconfigs:\n  my_config:\n    file: ./my_config.txt                  # 从文件创建\n\n  nginx_config:\n    file: ./nginx.conf\n\n  external_config:\n    external: true                          # 使用外部配置\n    name: production_config\n```\n\n##### configs 与 volumes 对比\n\n| 特性     | configs              | volumes    |\n| -------- | -------------------- | ---------- |\n| 可变性   | 不可变（需重新创建） | 可变       |\n| 存储位置 | Docker 管理          | 宿主机或卷 |\n| 适用场景 | 配置文件             | 持久化数据 |\n\n---\n\n#### secrets 属性\n\n`secrets` 属性用于安全地注入敏感信息。\n\n```yaml\nservices:\n  db:\n    image: postgres\n    environment:\n      POSTGRES_PASSWORD_FILE: /run/secrets/db_password\n    secrets:\n      - db_password                        # 短格式\n\n  api:\n    image: myapi\n    secrets:\n      - source: api_key\n        target: /run/secrets/api_key       # 长格式\n        uid: \"1000\"\n        gid: \"1000\"\n        mode: 0400\n\nsecrets:\n  db_password:\n    file: ./secrets/db_password.txt        # 从文件创建\n\n  api_key:\n    environment: API_KEY                   # 从环境变量创建\n\n  external_secret:\n    external: true                          # 使用外部 secret\n```\n\n> 📝 Secrets 默认挂载到 `/run/secrets/<secret_name>`\n\n---\n\n#### 实战示例\n\n##### 示例 1：数据库持久化\n\n```yaml\nservices:\n  db:\n    image: mysql:8.0\n    volumes:\n      - db-data:/var/lib/mysql\n      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro\n    secrets:\n      - db_root_password\n    environment:\n      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password\n\nvolumes:\n  db-data:\n\nsecrets:\n  db_root_password:\n    file: ./secrets/mysql_root_password.txt\n```\n\n##### 示例 2：Nginx 配置\n\n```yaml\nservices:\n  nginx:\n    image: nginx:alpine\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    volumes:\n      - ./html:/usr/share/nginx/html:ro\n    configs:\n      - source: nginx_conf\n        target: /etc/nginx/nginx.conf\n    secrets:\n      - ssl_cert\n      - ssl_key\n\nconfigs:\n  nginx_conf:\n    file: ./nginx.conf\n\nsecrets:\n  ssl_cert:\n    file: ./certs/server.crt\n  ssl_key:\n    file: ./certs/server.key\n```\n\n##### 示例 3：多容器共享卷\n\n```yaml\nservices:\n  app:\n    image: myapp\n    volumes:\n      - shared-data:/app/data\n\n  backup:\n    image: backup-tool\n    volumes:\n      - shared-data:/data:ro\n    profiles:\n      - backup\n\nvolumes:\n  shared-data:\n```\n\n---", "subs": ["volumes 属性", "tmpfs 属性", "configs 属性", "secrets 属性", "实战示例"]}, {"title": "9.12 环境变量属性详解（environment, env_file）", "content": "#### environment 属性\n\n`environment` 属性用于设置容器环境变量。\n\n##### 列表格式\n\n```yaml\nservices:\n  app:\n    image: myapp\n    environment:\n      - NODE_ENV=production\n      - DEBUG=false\n      - API_URL=http://api:3000\n```\n\n##### 字典格式\n\n```yaml\nservices:\n  app:\n    image: myapp\n    environment:\n      NODE_ENV: production\n      DEBUG: \"false\"\n      API_URL: http://api:3000\n      EMPTY_VAR:                 # 空值\n```\n\n##### 从宿主机传递\n\n```yaml\nservices:\n  app:\n    image: myapp\n    environment:\n      - HOME                     # 传递宿主机 $HOME\n      - USER                     # 传递宿主机 $USER\n      - API_KEY                  # 传递宿主机 $API_KEY\n```\n\n---\n\n#### env_file 属性\n\n`env_file` 属性用于从文件加载环境变量。\n\n##### 基本用法\n\n```yaml\nservices:\n  app:\n    image: myapp\n    env_file:\n      - .env                     # 默认环境变量\n      - .env.local               # 本地覆盖\n```\n\n##### 长格式\n\n```yaml\nservices:\n  app:\n    image: myapp\n    env_file:\n      - path: .env\n        required: true           # 文件必须存在\n      - path: .env.local\n        required: false          # 文件可选\n```\n\n##### .env 文件格式\n\n```bash\n# 这是注释\nNODE_ENV=production\nDEBUG=false\n\n# 支持引号\nAPI_URL=\"http://api:3000\"\nMESSAGE='Hello World'\n\n# 支持变量引用\nBASE_URL=http://example.com\nAPI_ENDPOINT=${BASE_URL}/api\n\n# 空行会被忽略\n```\n\n---\n\n#### 变量优先级\n\n从高到低：\n\n| 优先级 | 来源                      | 说明             |\n| ------ | ------------------------- | ---------------- |\n| 1      | `docker compose run -e` | 命令行指定       |\n| 2      | `environment`           | Compose 文件定义 |\n| 3      | `env_file`              | 环境变量文件     |\n| 4      | Dockerfile `ENV`        | 镜像默认值       |\n\n---\n\n#### 变量替换\n\nCompose 文件支持变量替换：\n\n```yaml\nservices:\n  db:\n    image: mysql:${MYSQL_VERSION:-8.0}\n    environment:\n      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?必须设置数据库密码}\n      MYSQL_DATABASE: ${DB_NAME:-myapp}\n```\n\n##### 替换语法\n\n| 语法                | 说明                   |\n| ------------------- | ---------------------- |\n| `${VAR}`          | 变量值                 |\n| `${VAR:-default}` | 变量未设置时使用默认值 |\n| `${VAR-default}`  | 变量未定义时使用默认值 |\n| `${VAR:?error}`   | 变量未设置时报错       |\n| `${VAR?error}`    | 变量未定义时报错       |\n| `${VAR:+value}`   | 变量已设置时使用 value |\n\n---\n\n#### 实战示例\n\n##### 示例 1：多环境配置\n\n```yaml\n# compose.yaml\nservices:\n  app:\n    image: myapp\n    env_file:\n      - .env\n      - .env.${ENV:-dev}        # 根据 ENV 变量加载配置\n    environment:\n      - ENV=${ENV:-dev}\n```\n\n```bash\n# .env.dev\nDEBUG=true\nLOG_LEVEL=debug\n\n# .env.prod\nDEBUG=false\nLOG_LEVEL=info\n```\n\n##### 示例 2：数据库配置\n\n```yaml\nservices:\n  db:\n    image: postgres:15\n    env_file:\n      - ./secrets/db.env\n    environment:\n      POSTGRES_DB: ${DB_NAME:-myapp}\n\n  app:\n    image: myapp\n    env_file:\n      - .env\n    environment:\n      - DATABASE_URL=postgres://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}\n    depends_on:\n      - db\n```\n\n##### 示例 3：开发 vs 生产\n\n```yaml\nservices:\n  api:\n    image: myapi\n    environment:\n      NODE_ENV: ${NODE_ENV:-development}\n      LOG_LEVEL: ${LOG_LEVEL:-debug}\n      API_PORT: ${API_PORT:-3000}\n    env_file:\n      - path: .env\n        required: true\n      - path: .env.local\n        required: false\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **安全提示**：\n>\n> 1. 不要在 `environment` 中存储敏感信息，使用 `secrets` 或外部密钥管理\n> 2. `.env` 文件不应提交到版本控制，添加到 `.gitignore`\n> 3. 生产环境建议使用 `env_file` 配合加密存储\n\n---", "subs": ["environment 属性", "env_file 属性", "变量优先级", "变量替换", "实战示例", "注意事项"]}, {"title": "9.13 服务依赖属性详解（depends_on）", "content": "#### depends_on 概述\n\n`depends_on` 属性用于定义服务之间的启动依赖关系。\n\n##### 短格式\n\n```yaml\nservices:\n  app:\n    image: myapp\n    depends_on:\n      - db\n      - redis\n\n  db:\n    image: postgres\n\n  redis:\n    image: redis\n```\n\n> 📝 短格式只控制启动顺序，不等待依赖服务就绪\n\n---\n\n#### 长格式（推荐）\n\n长格式支持设置启动条件：\n\n```yaml\nservices:\n  app:\n    image: myapp\n    depends_on:\n      db:\n        condition: service_healthy       # 等待健康检查通过\n      redis:\n        condition: service_started       # 等待服务启动\n      migration:\n        condition: service_completed_successfully  # 等待服务成功完成\n\n  db:\n    image: postgres\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 5s\n      timeout: 5s\n      retries: 5\n\n  redis:\n    image: redis\n\n  migration:\n    image: myapp\n    command: [\"npm\", \"run\", \"migrate\"]\n```\n\n##### condition 选项\n\n| 选项                               | 说明                       |\n| ---------------------------------- | -------------------------- |\n| `service_started`                | 依赖服务已启动（默认）     |\n| `service_healthy`                | 依赖服务健康检查通过       |\n| `service_completed_successfully` | 依赖服务成功退出（exit 0） |\n\n---\n\n#### 其他选项\n\n```yaml\nservices:\n  app:\n    depends_on:\n      db:\n        condition: service_healthy\n        restart: true                    # 依赖重启时也重启此服务\n        required: true                   # 依赖必须可用（默认 true）\n```\n\n---\n\n#### 实战示例\n\n##### 示例 1：Web + API + DB 架构\n\n```yaml\nservices:\n  nginx:\n    image: nginx\n    depends_on:\n      api:\n        condition: service_healthy\n    ports:\n      - \"80:80\"\n\n  api:\n    image: myapi\n    depends_on:\n      db:\n        condition: service_healthy\n      redis:\n        condition: service_started\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3000/health\"]\n      interval: 10s\n      timeout: 5s\n      retries: 3\n\n  db:\n    image: postgres:15\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 5s\n      retries: 5\n\n  redis:\n    image: redis:alpine\n```\n\n##### 示例 2：数据库迁移\n\n```yaml\nservices:\n  app:\n    image: myapp\n    depends_on:\n      migration:\n        condition: service_completed_successfully\n\n  migration:\n    image: myapp\n    command: [\"npm\", \"run\", \"db:migrate\"]\n    depends_on:\n      db:\n        condition: service_healthy\n\n  db:\n    image: postgres:15\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready\"]\n      interval: 5s\n      retries: 10\n```\n\n##### 示例 3：初始化容器\n\n```yaml\nservices:\n  app:\n    image: myapp\n    depends_on:\n      init:\n        condition: service_completed_successfully\n    volumes:\n      - app-data:/app/data\n\n  init:\n    image: alpine\n    command: |\n      sh -c \"\n        mkdir -p /data/logs /data/cache &&\n        chmod 755 /data/*\n      \"\n    volumes:\n      - app-data:/data\n\nvolumes:\n  app-data:\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **重要提示**：\n>\n> 1. `depends_on` 只控制启动顺序，不保证应用层面的就绪状态\n> 2. 使用 `service_healthy` 时，依赖服务必须配置 `healthcheck`\n> 3. `service_completed_successfully` 用于一次性任务（如迁移、初始化）\n> 4. 生产环境应用应自行处理依赖不可用的情况（重试机制）\n\n---", "subs": ["depends_on 概述", "长格式（推荐）", "其他选项", "实战示例", "注意事项"]}, {"title": "9.14 健康检查属性详解（healthcheck）", "content": "#### healthcheck 概述\n\n`healthcheck` 属性用于定义容器健康检查，Docker 会定期执行检查命令来判断容器是否健康。\n\n##### 基本配置\n\n```yaml\nservices:\n  app:\n    image: myapp\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3000/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 40s\n      start_interval: 5s\n```\n\n---\n\n#### 配置项详解\n\n| 配置项             | 说明                     | 默认值 |\n| ------------------ | ------------------------ | ------ |\n| `test`           | 健康检查命令             | -      |\n| `interval`       | 检查间隔                 | 30s    |\n| `timeout`        | 单次检查超时             | 30s    |\n| `retries`        | 连续失败多少次判定不健康 | 3      |\n| `start_period`   | 容器启动后的初始化时间   | 0s     |\n| `start_interval` | 启动期间的检查间隔       | 5s     |\n\n---\n\n#### test 命令格式\n\n##### CMD 格式（推荐）\n\n```yaml\nhealthcheck:\n  test: [\"CMD\", \"curl\", \"-f\", \"http://localhost/health\"]\n```\n\n##### CMD-SHELL 格式\n\n```yaml\nhealthcheck:\n  test: [\"CMD-SHELL\", \"curl -f http://localhost/health || exit 1\"]\n```\n\n##### 字符串格式\n\n```yaml\nhealthcheck:\n  test: curl -f http://localhost/health || exit 1\n```\n\n---\n\n#### 禁用健康检查\n\n```yaml\nservices:\n  app:\n    image: myapp\n    healthcheck:\n      disable: true\n```\n\n---\n\n#### 健康状态\n\n| 状态          | 说明                           |\n| ------------- | ------------------------------ |\n| `starting`  | 容器启动中，在 start_period 内 |\n| `healthy`   | 健康检查通过                   |\n| `unhealthy` | 连续失败次数达到 retries       |\n\n---\n\n#### 实战示例\n\n##### 示例 1：Web 应用\n\n```yaml\nservices:\n  web:\n    image: nginx\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost\"]\n      interval: 30s\n      timeout: 5s\n      retries: 3\n      start_period: 10s\n```\n\n##### 示例 2：PostgreSQL\n\n```yaml\nservices:\n  db:\n    image: postgres:15\n    environment:\n      POSTGRES_PASSWORD: secret\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n      start_period: 30s\n```\n\n##### 示例 3：MySQL\n\n```yaml\nservices:\n  mysql:\n    image: mysql:8.0\n    environment:\n      MYSQL_ROOT_PASSWORD: secret\n    healthcheck:\n      test: [\"CMD\", \"mysqladmin\", \"ping\", \"-h\", \"localhost\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n      start_period: 60s\n```\n\n##### 示例 4：Redis\n\n```yaml\nservices:\n  redis:\n    image: redis:alpine\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 3s\n      retries: 3\n```\n\n##### 示例 5：自定义脚本\n\n```yaml\nservices:\n  app:\n    image: myapp\n    healthcheck:\n      test: [\"CMD\", \"/app/healthcheck.sh\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n```\n\n##### 示例 6：TCP 端口检查\n\n```yaml\nservices:\n  app:\n    image: myapp\n    healthcheck:\n      test: [\"CMD-SHELL\", \"nc -z localhost 8080 || exit 1\"]\n      interval: 15s\n      timeout: 5s\n      retries: 3\n```\n\n---\n\n#### 配合 depends_on 使用\n\n```yaml\nservices:\n  api:\n    image: myapi\n    depends_on:\n      db:\n        condition: service_healthy\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3000/health\"]\n      interval: 10s\n      retries: 3\n\n  db:\n    image: postgres:15\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 5s\n      retries: 5\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **最佳实践**：\n>\n> 1. `start_period` 应足够长，让应用完成初始化\n> 2. `timeout` 应小于 `interval`\n> 3. 健康检查命令应该轻量，避免影响应用性能\n> 4. 使用 CMD 格式而非 SHELL 格式可减少进程开销\n> 5. 生产环境建议为所有关键服务配置健康检查\n\n---", "subs": ["healthcheck 概述", "配置项详解", "test 命令格式", "禁用健康检查", "健康状态", "实战示例", "配合 depends_on 使用", "注意事项"]}, {"title": "9.15 资源限制属性详解（cpus, memory, deploy）", "content": "#### 直接资源限制（Compose V2）\n\n##### CPU 限制\n\n```yaml\nservices:\n  app:\n    image: myapp\n    cpus: 0.5                    # 限制使用 0.5 个 CPU 核心\n    cpu_shares: 1024             # CPU 共享权重（相对值）\n    cpu_period: 100000           # CPU 周期（微秒）\n    cpu_quota: 50000             # CPU 配额（微秒）\n    cpuset: \"0,1\"                # 绑定到指定 CPU 核心\n```\n\n##### 内存限制\n\n```yaml\nservices:\n  app:\n    image: myapp\n    mem_limit: 512m              # 内存硬限制\n    mem_reservation: 256m        # 内存软限制\n    memswap_limit: 1g            # 内存+交换分区总限制\n    mem_swappiness: 60           # 交换分区使用倾向 (0-100)\n    oom_kill_disable: false      # 禁用 OOM 杀死\n    oom_score_adj: 100           # OOM 优先级调整 (-1000 到 1000)\n```\n\n##### 资源单位\n\n| 单位           | 说明     |\n| -------------- | -------- |\n| `b`          | 字节     |\n| `k` / `kb` | 千字节   |\n| `m` / `mb` | 兆字节   |\n| `g` / `gb` | 千兆字节 |\n\n---\n\n#### blkio_config（块 IO 限制）\n\n```yaml\nservices:\n  db:\n    image: postgres\n    blkio_config:\n      weight: 500                        # IO 权重 (10-1000)\n      weight_device:\n        - path: /dev/sda\n          weight: 400\n      device_read_bps:                   # 读取速度限制\n        - path: /dev/sda\n          rate: '50mb'\n      device_write_bps:                  # 写入速度限制\n        - path: /dev/sda\n          rate: '30mb'\n      device_read_iops:                  # 读取 IOPS 限制\n        - path: /dev/sda\n          rate: 1000\n      device_write_iops:                 # 写入 IOPS 限制\n        - path: /dev/sda\n          rate: 500\n```\n\n---\n\n#### deploy（部署配置）\n\n`deploy` 主要用于 Swarm 模式，但部分属性也适用于 Compose。\n\n##### 基本配置\n\n```yaml\nservices:\n  app:\n    image: myapp\n    deploy:\n      replicas: 3                        # 副本数\n      resources:\n        limits:\n          cpus: '0.5'\n          memory: 512M\n        reservations:\n          cpus: '0.25'\n          memory: 256M\n```\n\n##### 完整配置\n\n```yaml\nservices:\n  api:\n    image: myapi\n    deploy:\n      mode: replicated                   # replicated 或 global\n      replicas: 3\n    \n      resources:\n        limits:\n          cpus: '1.0'\n          memory: 1G\n          pids: 100                      # 进程数限制\n        reservations:\n          cpus: '0.5'\n          memory: 512M\n          devices:                       # 设备预留\n            - driver: nvidia\n              count: 1\n              capabilities: [gpu]\n    \n      restart_policy:\n        condition: on-failure\n        delay: 5s\n        max_attempts: 3\n        window: 120s\n    \n      update_config:                     # 滚动更新配置\n        parallelism: 2\n        delay: 10s\n        failure_action: rollback\n        order: start-first\n    \n      rollback_config:                   # 回滚配置\n        parallelism: 1\n        delay: 5s\n```\n\n##### deploy.resources 配置项\n\n| 配置项                   | 说明               |\n| ------------------------ | ------------------ |\n| `limits.cpus`          | CPU 核心数上限     |\n| `limits.memory`        | 内存上限           |\n| `limits.pids`          | 进程数上限         |\n| `reservations.cpus`    | CPU 预留           |\n| `reservations.memory`  | 内存预留           |\n| `reservations.devices` | 设备预留（如 GPU） |\n\n---\n\n#### 实战示例\n\n##### 示例 1：Web 应用资源限制\n\n```yaml\nservices:\n  web:\n    image: nginx\n    deploy:\n      resources:\n        limits:\n          cpus: '0.5'\n          memory: 256M\n        reservations:\n          cpus: '0.25'\n          memory: 128M\n```\n\n##### 示例 2：数据库资源配置\n\n```yaml\nservices:\n  db:\n    image: postgres:15\n    deploy:\n      resources:\n        limits:\n          cpus: '2.0'\n          memory: 4G\n        reservations:\n          cpus: '1.0'\n          memory: 2G\n    blkio_config:\n      device_read_bps:\n        - path: /dev/sda\n          rate: '100mb'\n      device_write_bps:\n        - path: /dev/sda\n          rate: '50mb'\n```\n\n##### 示例 3：GPU 应用\n\n```yaml\nservices:\n  ml-app:\n    image: tensorflow/tensorflow:latest-gpu\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: all\n              capabilities: [gpu]\n```\n\n##### 示例 4：多服务资源分配\n\n```yaml\nservices:\n  api:\n    image: myapi\n    deploy:\n      replicas: 3\n      resources:\n        limits:\n          cpus: '0.5'\n          memory: 512M\n\n  worker:\n    image: myworker\n    deploy:\n      replicas: 2\n      resources:\n        limits:\n          cpus: '1.0'\n          memory: 1G\n\n  cache:\n    image: redis:alpine\n    deploy:\n      resources:\n        limits:\n          cpus: '0.25'\n          memory: 256M\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **重要提示**：\n>\n> 1. `deploy` 配置在非 Swarm 模式下需要 `docker compose` 命令（V2）\n> 2. `limits` 是硬限制，`reservations` 是软限制\n> 3. 内存限制过小可能导致 OOM，建议先监控再设置\n> 4. CPU 限制使用小数表示核心数（如 0.5 = 半个核心）\n> 5. 生产环境建议同时设置 limits 和 reservations\n\n---", "subs": ["直接资源限制（Compose V2）", "blkio_config（块 IO 限制）", "deploy（部署配置）", "实战示例", "注意事项"]}, {"title": "9.16 容器配置属性详解（container_name, hostname, restart, init）", "content": "#### container_name 属性\n\n`container_name` 属性用于指定容器名称。\n\n```yaml\nservices:\n  db:\n    image: postgres\n    container_name: my-postgres-db\n```\n\n> ⚠️ 指定 `container_name` 后无法使用 `docker compose up --scale` 扩展服务\n\n---\n\n#### hostname 属性\n\n`hostname` 属性用于设置容器主机名。\n\n```yaml\nservices:\n  web:\n    image: nginx\n    hostname: web-server\n    domainname: example.com          # 可选，域名\n```\n\n##### 相关属性\n\n```yaml\nservices:\n  app:\n    image: myapp\n    hostname: app-server\n    extra_hosts:\n      - \"host.docker.internal:host-gateway\"\n    dns:\n      - 8.8.8.8\n    dns_search:\n      - example.com\n```\n\n---\n\n#### restart 属性\n\n`restart` 属性用于设置容器重启策略。\n\n```yaml\nservices:\n  app:\n    image: myapp\n    restart: unless-stopped\n```\n\n##### 重启策略选项\n\n| 策略               | 说明                       |\n| ------------------ | -------------------------- |\n| `no`             | 不自动重启（默认）         |\n| `always`         | 始终重启                   |\n| `on-failure`     | 非正常退出时重启           |\n| `on-failure:5`   | 非正常退出时最多重启 5 次  |\n| `unless-stopped` | 除非手动停止，否则始终重启 |\n\n##### always vs unless-stopped\n\n| 场景                     | always | unless-stopped |\n| ------------------------ | ------ | -------------- |\n| 容器异常退出             | 重启   | 重启           |\n| Docker 服务重启          | 重启   | 重启           |\n| 手动 stop 后 Docker 重启 | 重启   | 不重启         |\n\n---\n\n#### init 属性\n\n`init` 属性用于在容器内运行 init 进程（PID 1），正确处理信号和回收僵尸进程。\n\n```yaml\nservices:\n  app:\n    image: myapp\n    init: true\n```\n\n##### 为什么需要 init\n\n```yaml\nservices:\n  # 不使用 init：脚本无法正确处理 SIGTERM\n  worker-bad:\n    image: alpine\n    command: [\"sh\", \"-c\", \"while true; do echo working; sleep 1; done\"]\n\n  # 使用 init：正确处理信号\n  worker-good:\n    image: alpine\n    init: true\n    command: [\"sh\", \"-c\", \"while true; do echo working; sleep 1; done\"]\n```\n\n---\n\n#### 其他相关属性\n\n```yaml\nservices:\n  app:\n    image: myapp\n  \n    # 工作目录\n    working_dir: /app\n  \n    # 用户\n    user: \"1000:1000\"\n  \n    # 标准输入\n    stdin_open: true              # docker run -i\n    tty: true                     # docker run -t\n  \n    # 停止信号和超时\n    stop_signal: SIGTERM\n    stop_grace_period: 30s\n  \n    # 标签\n    labels:\n      com.example.environment: \"production\"\n      com.example.team: \"backend\"\n```\n\n---\n\n#### 实战示例\n\n##### 示例 1：生产环境配置\n\n```yaml\nservices:\n  api:\n    image: myapi\n    container_name: prod-api\n    hostname: api\n    restart: unless-stopped\n    init: true\n    stop_grace_period: 30s\n    labels:\n      environment: production\n```\n\n##### 示例 2：开发环境配置\n\n```yaml\nservices:\n  app:\n    build: .\n    container_name: dev-app\n    restart: \"no\"\n    stdin_open: true\n    tty: true\n    working_dir: /app\n    volumes:\n      - .:/app\n```\n\n##### 示例 3：多容器命名\n\n```yaml\nservices:\n  web:\n    image: nginx\n    container_name: ${PROJECT_NAME:-myapp}-web\n    hostname: web\n\n  api:\n    image: myapi\n    container_name: ${PROJECT_NAME:-myapp}-api\n    hostname: api\n\n  db:\n    image: postgres\n    container_name: ${PROJECT_NAME:-myapp}-db\n    hostname: db\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **重要提示**：\n>\n> 1. `container_name` 在同一主机上必须唯一\n> 2. 使用 `container_name` 会限制服务扩展能力\n> 3. 生产环境建议使用 `restart: unless-stopped`\n> 4. 运行 shell 脚本的容器建议启用 `init: true`\n\n---", "subs": ["container_name 属性", "hostname 属性", "restart 属性", "init 属性", "其他相关属性", "实战示例", "注意事项"]}, {"title": "9.17 安全配置属性详解（privileged, cap_add/drop, security_opt, user）", "content": "#### privileged 属性\n\n`privileged` 属性赋予容器几乎所有主机权限。\n\n```yaml\nservices:\n  docker-in-docker:\n    image: docker:dind\n    privileged: true\n```\n\n> ⚠️ **警告**：`privileged: true` 会禁用大部分安全隔离，仅在必要时使用\n\n---\n\n#### cap_add / cap_drop 属性\n\n精细控制 Linux 能力（Capabilities）。\n\n##### 添加能力\n\n```yaml\nservices:\n  network-tool:\n    image: alpine\n    cap_add:\n      - NET_ADMIN                # 网络管理\n      - SYS_PTRACE               # 进程跟踪\n```\n\n##### 删除能力\n\n```yaml\nservices:\n  secure-app:\n    image: myapp\n    cap_drop:\n      - ALL                      # 删除所有能力\n    cap_add:\n      - NET_BIND_SERVICE         # 仅添加绑定低端口能力\n```\n\n##### 常用能力列表\n\n| 能力                    | 说明               |\n| ----------------------- | ------------------ |\n| `NET_ADMIN`           | 网络配置           |\n| `NET_BIND_SERVICE`    | 绑定 1024 以下端口 |\n| `SYS_ADMIN`           | 系统管理操作       |\n| `SYS_PTRACE`          | 跟踪进程           |\n| `SYS_TIME`            | 修改系统时间       |\n| `CHOWN`               | 修改文件所有者     |\n| `DAC_OVERRIDE`        | 绕过文件权限检查   |\n| `SETUID` / `SETGID` | 设置 UID/GID       |\n| `KILL`                | 发送信号           |\n| `MKNOD`               | 创建设备文件       |\n\n---\n\n#### security_opt 属性\n\n配置安全选项。\n\n```yaml\nservices:\n  app:\n    image: myapp\n    security_opt:\n      - no-new-privileges:true   # 禁止提升权限\n      - seccomp:unconfined       # 禁用 seccomp\n      - apparmor:unconfined      # 禁用 AppArmor\n      - label:disable            # 禁用 SELinux\n```\n\n##### 常用安全选项\n\n| 选项                              | 说明                |\n| --------------------------------- | ------------------- |\n| `no-new-privileges:true`        | 禁止进程获取新权限  |\n| `seccomp:unconfined`            | 禁用 seccomp 限制   |\n| `seccomp:/path/to/profile.json` | 自定义 seccomp 配置 |\n| `apparmor:unconfined`           | 禁用 AppArmor       |\n| `label:disable`                 | 禁用 SELinux 标签   |\n\n---\n\n#### user 属性\n\n指定容器运行用户。\n\n```yaml\nservices:\n  app:\n    image: myapp\n    user: \"1000:1000\"            # UID:GID\n\n  # 使用用户名（需镜像内存在）\n  nginx:\n    image: nginx\n    user: nginx\n```\n\n##### 用户格式\n\n| 格式                   | 说明        |\n| ---------------------- | ----------- |\n| `1000`               | UID         |\n| `1000:1000`          | UID:GID     |\n| `username`           | 用户名      |\n| `username:groupname` | 用户名:组名 |\n\n---\n\n#### 其他安全相关属性\n\n```yaml\nservices:\n  app:\n    image: myapp\n  \n    # 只读根文件系统\n    read_only: true\n  \n    # 可写临时目录\n    tmpfs:\n      - /tmp\n      - /run\n  \n    # 禁用 PID 命名空间共享\n    pid: \"host\"\n  \n    # IPC 命名空间\n    ipc: shareable\n  \n    # 系统调用限制\n    sysctls:\n      net.core.somaxconn: 1024\n```\n\n---\n\n#### 实战示例\n\n##### 示例 1：安全加固的 Web 应用\n\n```yaml\nservices:\n  web:\n    image: nginx\n    user: \"101:101\"\n    read_only: true\n    cap_drop:\n      - ALL\n    cap_add:\n      - NET_BIND_SERVICE\n      - CHOWN\n    security_opt:\n      - no-new-privileges:true\n    tmpfs:\n      - /var/cache/nginx\n      - /var/run\n```\n\n##### 示例 2：需要网络特权的工具\n\n```yaml\nservices:\n  tcpdump:\n    image: nicolaka/netshoot\n    cap_add:\n      - NET_ADMIN\n      - NET_RAW\n    network_mode: host\n```\n\n##### 示例 3：Docker in Docker\n\n```yaml\nservices:\n  dind:\n    image: docker:dind\n    privileged: true\n    environment:\n      DOCKER_TLS_CERTDIR: \"\"\n    volumes:\n      - docker-data:/var/lib/docker\n\nvolumes:\n  docker-data:\n```\n\n##### 示例 4：最小权限原则\n\n```yaml\nservices:\n  api:\n    image: myapi\n    user: \"10000:10000\"\n    read_only: true\n    cap_drop:\n      - ALL\n    security_opt:\n      - no-new-privileges:true\n    tmpfs:\n      - /tmp:size=100M,mode=1777\n    volumes:\n      - logs:/app/logs:rw\n      - ./config:/app/config:ro\n\nvolumes:\n  logs:\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **安全最佳实践**：\n>\n> 1. 避免使用 `privileged: true`，优先使用 `cap_add`\n> 2. 使用 `cap_drop: ALL` 后按需添加能力\n> 3. 始终启用 `no-new-privileges:true`\n> 4. 使用非 root 用户运行容器\n> 5. 尽可能使用 `read_only: true`\n\n---", "subs": ["privileged 属性", "cap_add / cap_drop 属性", "security_opt 属性", "user 属性", "其他安全相关属性", "实战示例", "注意事项"]}, {"title": "9.18 设备与日志属性详解（devices, gpus, logging）", "content": "#### devices 属性\n\n`devices` 属性用于将主机设备映射到容器。\n\n```yaml\nservices:\n  app:\n    image: myapp\n    devices:\n      - \"/dev/ttyUSB0:/dev/ttyUSB0\"       # 串口设备\n      - \"/dev/sda:/dev/xvda:rwm\"          # 块设备（读写+mknod）\n      - \"/dev/video0:/dev/video0\"         # 视频设备\n```\n\n##### 设备权限\n\n| 权限  | 说明                  |\n| ----- | --------------------- |\n| `r` | 读取                  |\n| `w` | 写入                  |\n| `m` | mknod（创建设备节点） |\n\n---\n\n#### device_cgroup_rules 属性\n\n允许更细粒度的设备访问控制。\n\n```yaml\nservices:\n  app:\n    image: myapp\n    device_cgroup_rules:\n      - 'c 1:3 mr'                        # 读取 /dev/null\n      - 'a 7:* rmw'                       # 所有循环设备\n```\n\n---\n\n#### gpus 属性（Compose V2.3+）\n\n`gpus` 属性用于分配 GPU 资源。\n\n##### 使用所有 GPU\n\n```yaml\nservices:\n  ml-app:\n    image: tensorflow/tensorflow:latest-gpu\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: all\n              capabilities: [gpu]\n```\n\n##### 指定 GPU 数量\n\n```yaml\nservices:\n  training:\n    image: pytorch/pytorch\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: 2\n              capabilities: [gpu]\n```\n\n##### 指定特定 GPU\n\n```yaml\nservices:\n  inference:\n    image: mymodel\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              device_ids: ['0', '3']\n              capabilities: [gpu, compute, utility]\n```\n\n##### GPU capabilities\n\n| Capability   | 说明              |\n| ------------ | ----------------- |\n| `gpu`      | GPU 基础支持      |\n| `compute`  | CUDA 计算         |\n| `utility`  | nvidia-smi 等工具 |\n| `graphics` | OpenGL 支持       |\n| `video`    | 视频编解码        |\n| `display`  | 显示输出          |\n\n---\n\n#### logging 属性\n\n`logging` 属性用于配置容器日志。\n\n##### 基本配置\n\n```yaml\nservices:\n  app:\n    image: myapp\n    logging:\n      driver: json-file\n      options:\n        max-size: \"10m\"\n        max-file: \"5\"\n```\n\n##### 常用日志驱动\n\n| 驱动          | 说明                        |\n| ------------- | --------------------------- |\n| `json-file` | JSON 文件（默认）           |\n| `local`     | 本地优化存储                |\n| `syslog`    | 发送到 syslog               |\n| `journald`  | 发送到 systemd journal      |\n| `gelf`      | Graylog Extended Log Format |\n| `fluentd`   | 发送到 Fluentd              |\n| `awslogs`   | 发送到 AWS CloudWatch       |\n| `gcplogs`   | 发送到 Google Cloud Logging |\n| `none`      | 禁用日志                    |\n\n##### json-file 选项\n\n```yaml\nservices:\n  app:\n    logging:\n      driver: json-file\n      options:\n        max-size: \"50m\"           # 单个日志文件大小\n        max-file: \"10\"            # 保留日志文件数\n        compress: \"true\"          # 压缩轮转日志\n        labels: \"env,app\"         # 添加标签到日志\n```\n\n##### syslog 选项\n\n```yaml\nservices:\n  app:\n    logging:\n      driver: syslog\n      options:\n        syslog-address: \"udp://logs.example.com:514\"\n        syslog-facility: \"daemon\"\n        tag: \"{{.Name}}\"\n```\n\n##### fluentd 选项\n\n```yaml\nservices:\n  app:\n    logging:\n      driver: fluentd\n      options:\n        fluentd-address: \"localhost:24224\"\n        tag: \"docker.{{.Name}}\"\n        fluentd-async: \"true\"\n```\n\n---\n\n#### 实战示例\n\n##### 示例 1：GPU 机器学习\n\n```yaml\nservices:\n  jupyter:\n    image: jupyter/tensorflow-notebook\n    ports:\n      - \"8888:8888\"\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: 1\n              capabilities: [gpu]\n    volumes:\n      - ./notebooks:/home/jovyan/work\n```\n\n##### 示例 2：日志聚合\n\n```yaml\nservices:\n  app:\n    image: myapp\n    logging:\n      driver: fluentd\n      options:\n        fluentd-address: \"fluentd:24224\"\n        tag: \"app.{{.Name}}\"\n    depends_on:\n      - fluentd\n\n  fluentd:\n    image: fluent/fluentd\n    ports:\n      - \"24224:24224\"\n    volumes:\n      - ./fluent.conf:/fluentd/etc/fluent.conf\n```\n\n##### 示例 3：IoT 设备访问\n\n```yaml\nservices:\n  iot-gateway:\n    image: myiot\n    devices:\n      - \"/dev/ttyUSB0:/dev/ttyUSB0\"\n      - \"/dev/ttyACM0:/dev/ttyACM0\"\n    privileged: false\n    cap_add:\n      - SYS_RAWIO\n```\n\n##### 示例 4：生产日志配置\n\n```yaml\nservices:\n  api:\n    image: myapi\n    logging:\n      driver: json-file\n      options:\n        max-size: \"100m\"\n        max-file: \"10\"\n        compress: \"true\"\n\n  worker:\n    image: myworker\n    logging:\n      driver: json-file\n      options:\n        max-size: \"50m\"\n        max-file: \"5\"\n\n  debug:\n    image: myapp\n    profiles:\n      - debug\n    logging:\n      driver: \"none\"              # 调试时禁用日志\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **重要提示**：\n>\n> 1. 使用 GPU 需要安装 nvidia-container-toolkit\n> 2. 生产环境必须配置日志轮转（max-size, max-file）\n> 3. 访问设备可能需要额外权限（cap_add 或 privileged）\n> 4. 远程日志驱动可能影响容器启动速度\n\n---", "subs": ["devices 属性", "device_cgroup_rules 属性", "gpus 属性（Compose V2", "logging 属性", "实战示例", "注意事项"]}, {"title": "9.19 其他属性详解（labels, extends, profiles）", "content": "#### labels 属性\n\n`labels` 属性用于为容器添加元数据标签。\n\n##### 服务级别标签\n\n```yaml\nservices:\n  app:\n    image: myapp\n    labels:\n      com.example.environment: \"production\"\n      com.example.team: \"backend\"\n      com.example.version: \"1.0.0\"\n```\n\n##### 列表格式\n\n```yaml\nservices:\n  app:\n    image: myapp\n    labels:\n      - \"com.example.environment=production\"\n      - \"com.example.team=backend\"\n```\n\n##### 顶层标签（项目级别）\n\n```yaml\n# 应用于整个项目\nlabels:\n  project: myproject\n  owner: devops\n\nservices:\n  app:\n    image: myapp\n```\n\n##### 常用标签约定\n\n| 标签                        | 说明                |\n| --------------------------- | ------------------- |\n| `com.example.description` | 服务描述            |\n| `com.example.environment` | 环境（dev/prod）    |\n| `com.example.team`        | 负责团队            |\n| `com.example.version`     | 版本号              |\n| `traefik.enable`          | Traefik 代理配置    |\n| `prometheus.io/scrape`    | Prometheus 抓取配置 |\n\n---\n\n#### extends 属性\n\n`extends` 属性用于继承另一个服务的配置。\n\n##### 基本用法\n\n```yaml\n# common.yaml\nservices:\n  base:\n    image: myapp\n    environment:\n      LOG_LEVEL: info\n    logging:\n      driver: json-file\n      options:\n        max-size: \"10m\"\n```\n\n```yaml\n# compose.yaml\nservices:\n  api:\n    extends:\n      file: common.yaml\n      service: base\n    ports:\n      - \"3000:3000\"\n\n  worker:\n    extends:\n      file: common.yaml\n      service: base\n    command: [\"worker\"]\n```\n\n##### 同文件继承\n\n```yaml\nservices:\n  base:\n    image: myapp\n    environment:\n      LOG_LEVEL: info\n\n  api:\n    extends:\n      service: base\n    ports:\n      - \"3000:3000\"\n\n  worker:\n    extends:\n      service: base\n    command: [\"worker\"]\n```\n\n##### 继承规则\n\n| 属性类型 | 继承行为                           |\n| -------- | ---------------------------------- |\n| 单值属性 | 覆盖（image, command 等）          |\n| 列表属性 | 合并（volumes, ports 等）          |\n| 字典属性 | 深度合并（environment, labels 等） |\n\n---\n\n#### profiles 属性\n\n`profiles` 属性用于按需启动服务。\n\n##### 基本用法\n\n```yaml\nservices:\n  app:\n    image: myapp                         # 默认启动\n\n  debug:\n    image: nicolaka/netshoot\n    profiles:\n      - debug                            # 仅在指定 profile 时启动\n\n  db-admin:\n    image: adminer\n    profiles:\n      - tools\n```\n\n##### 启动服务\n\n```bash\n# 仅启动默认服务\ndocker compose up\n\n# 启动默认服务 + debug profile\ndocker compose --profile debug up\n\n# 启动多个 profile\ndocker compose --profile debug --profile tools up\n```\n\n##### 多 profile 服务\n\n```yaml\nservices:\n  monitoring:\n    image: prometheus\n    profiles:\n      - monitoring\n      - production\n\n  grafana:\n    image: grafana/grafana\n    profiles:\n      - monitoring\n      - production\n```\n\n---\n\n#### 实战示例\n\n##### 示例 1：标签用于服务发现\n\n```yaml\nservices:\n  api:\n    image: myapi\n    labels:\n      traefik.enable: \"true\"\n      traefik.http.routers.api.rule: \"Host(`api.example.com`)\"\n      traefik.http.services.api.loadbalancer.server.port: \"3000\"\n      prometheus.io/scrape: \"true\"\n      prometheus.io/port: \"3000\"\n      prometheus.io/path: \"/metrics\"\n```\n\n##### 示例 2：服务模板继承\n\n```yaml\n# base.yaml\nservices:\n  nodejs-base:\n    image: node:18-alpine\n    working_dir: /app\n    environment:\n      NODE_ENV: production\n    logging:\n      driver: json-file\n      options:\n        max-size: \"50m\"\n        max-file: \"5\"\n```\n\n```yaml\n# compose.yaml\nservices:\n  api:\n    extends:\n      file: base.yaml\n      service: nodejs-base\n    build: ./api\n    ports:\n      - \"3000:3000\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3000/health\"]\n\n  worker:\n    extends:\n      file: base.yaml\n      service: nodejs-base\n    build: ./worker\n    command: [\"node\", \"worker.js\"]\n```\n\n##### 示例 3：开发调试工具\n\n```yaml\nservices:\n  app:\n    image: myapp\n    ports:\n      - \"8080:8080\"\n\n  # 调试工具\n  shell:\n    image: alpine\n    profiles:\n      - debug\n    command: [\"sleep\", \"infinity\"]\n    volumes:\n      - .:/app\n\n  netshoot:\n    image: nicolaka/netshoot\n    profiles:\n      - debug\n    network_mode: \"service:app\"\n\n  # 数据库管理\n  adminer:\n    image: adminer\n    profiles:\n      - tools\n    ports:\n      - \"8081:8080\"\n```\n\n##### 示例 4：多环境配置\n\n```yaml\nservices:\n  app:\n    image: myapp\n    labels:\n      environment: ${ENV:-development}\n\n  # 生产环境监控\n  prometheus:\n    image: prom/prometheus\n    profiles:\n      - production\n\n  alertmanager:\n    image: prom/alertmanager\n    profiles:\n      - production\n\n  # 开发环境工具\n  mailhog:\n    image: mailhog/mailhog\n    profiles:\n      - development\n    ports:\n      - \"8025:8025\"\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **重要提示**：\n>\n> 1. `extends` 不能继承 `depends_on`、`networks`、`volumes` 顶层定义\n> 2. `profiles` 为空的服务默认启动\n> 3. 标签键建议使用反向域名格式（如 `com.example.key`）\n> 4. 继承时子服务的配置优先于父服务\n\n---", "subs": ["labels 属性", "extends 属性", "profiles 属性", "实战示例", "注意事项"]}, {"title": "9.20 顶级 networks 定义详解", "content": "#### 基本概念\n\n`networks` 顶级键用于定义项目使用的网络。服务可以通过 `networks` 属性连接到这些网络。\n\n```yaml\nservices:\n  app:\n    networks:\n      - frontend\n      - backend\n\nnetworks:\n  frontend:\n  backend:\n```\n\n---\n\n#### 网络驱动（driver）\n\n```yaml\nnetworks:\n  # 默认桥接网络\n  app-net:\n    driver: bridge\n\n  # 覆盖网络（Swarm）\n  overlay-net:\n    driver: overlay\n\n  # 主机网络\n  host-net:\n    driver: host\n\n  # 无网络\n  none-net:\n    driver: none\n\n  # macvlan 网络\n  macvlan-net:\n    driver: macvlan\n    driver_opts:\n      parent: eth0\n```\n\n##### 网络驱动类型\n\n| 驱动        | 说明                 |\n| ----------- | -------------------- |\n| `bridge`  | 默认，隔离的桥接网络 |\n| `overlay` | Swarm 跨主机网络     |\n| `host`    | 使用主机网络         |\n| `none`    | 禁用网络             |\n| `macvlan` | 分配 MAC 地址        |\n| `ipvlan`  | 共享 MAC，不同 IP    |\n\n---\n\n#### driver_opts（驱动选项）\n\n```yaml\nnetworks:\n  custom-net:\n    driver: bridge\n    driver_opts:\n      com.docker.network.bridge.name: \"custom0\"\n      com.docker.network.bridge.enable_ip_masquerade: \"true\"\n      com.docker.network.bridge.enable_icc: \"true\"\n      com.docker.network.bridge.host_binding_ipv4: \"0.0.0.0\"\n      com.docker.network.driver.mtu: \"1500\"\n```\n\n---\n\n#### IPAM 配置\n\nIPAM（IP 地址管理）用于自定义网络的 IP 分配。\n\n```yaml\nnetworks:\n  custom-net:\n    driver: bridge\n    ipam:\n      driver: default\n      config:\n        - subnet: 172.28.0.0/16\n          ip_range: 172.28.5.0/24\n          gateway: 172.28.0.1\n          aux_addresses:\n            host1: 172.28.1.5\n            host2: 172.28.1.6\n```\n\n##### IPAM 配置项\n\n| 配置项            | 说明                 |\n| ----------------- | -------------------- |\n| `driver`        | IPAM 驱动（default） |\n| `subnet`        | 子网 CIDR            |\n| `ip_range`      | 可分配 IP 范围       |\n| `gateway`       | 网关地址             |\n| `aux_addresses` | 预留地址             |\n\n---\n\n#### 外部网络（external）\n\n使用已存在的外部网络。\n\n```yaml\nnetworks:\n  existing-net:\n    external: true\n\n  # 指定外部网络名称\n  app-net:\n    external: true\n    name: my-existing-network\n```\n\n---\n\n#### 其他网络属性\n\n```yaml\nnetworks:\n  app-net:\n    driver: bridge\n  \n    # 网络名称（覆盖默认名称）\n    name: my-app-network\n  \n    # 内部网络（无外部访问）\n    internal: true\n  \n    # 可附加（允许手动连接容器）\n    attachable: true\n  \n    # 启用 IPv6\n    enable_ipv6: true\n  \n    # 标签\n    labels:\n      com.example.environment: production\n```\n\n---\n\n#### 服务网络配置\n\n服务连接网络时的详细配置。\n\n```yaml\nservices:\n  app:\n    networks:\n      frontend:\n        aliases:\n          - webapp\n          - api\n        ipv4_address: 172.28.0.10\n        ipv6_address: 2001:db8::10\n        priority: 1000\n\nnetworks:\n  frontend:\n    ipam:\n      config:\n        - subnet: 172.28.0.0/24\n```\n\n##### 服务网络配置项\n\n| 配置项             | 说明                 |\n| ------------------ | -------------------- |\n| `aliases`        | 网络别名（DNS 解析） |\n| `ipv4_address`   | 固定 IPv4 地址       |\n| `ipv6_address`   | 固定 IPv6 地址       |\n| `priority`       | 网络优先级           |\n| `link_local_ips` | 链路本地地址         |\n\n---\n\n#### 实战示例\n\n##### 示例 1：多层网络架构\n\n```yaml\nservices:\n  nginx:\n    image: nginx\n    networks:\n      - frontend\n\n  api:\n    image: myapi\n    networks:\n      - frontend\n      - backend\n\n  db:\n    image: postgres\n    networks:\n      - backend\n\nnetworks:\n  frontend:\n    driver: bridge\n  backend:\n    driver: bridge\n    internal: true              # 数据库网络不暴露\n```\n\n##### 示例 2：自定义子网\n\n```yaml\nservices:\n  app:\n    image: myapp\n    networks:\n      app-net:\n        ipv4_address: 192.168.100.10\n\nnetworks:\n  app-net:\n    driver: bridge\n    ipam:\n      config:\n        - subnet: 192.168.100.0/24\n          gateway: 192.168.100.1\n```\n\n##### 示例 3：使用外部网络\n\n```yaml\nservices:\n  app:\n    image: myapp\n    networks:\n      - shared-net\n\nnetworks:\n  shared-net:\n    external: true\n    name: my-shared-network\n```\n\n##### 示例 4：完整网络配置\n\n```yaml\nservices:\n  web:\n    image: nginx\n    networks:\n      frontend:\n        aliases:\n          - www\n          - web\n\n  api:\n    image: myapi\n    networks:\n      frontend:\n        aliases:\n          - api\n      backend:\n        ipv4_address: 10.0.1.10\n\n  db:\n    image: postgres\n    networks:\n      backend:\n        ipv4_address: 10.0.1.20\n\nnetworks:\n  frontend:\n    driver: bridge\n    name: prod-frontend\n    labels:\n      tier: frontend\n\n  backend:\n    driver: bridge\n    name: prod-backend\n    internal: true\n    ipam:\n      config:\n        - subnet: 10.0.1.0/24\n          gateway: 10.0.1.1\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **重要提示**：\n>\n> 1. 同一网络中的容器可以通过服务名互相访问\n> 2. `internal: true` 网络无法访问外部网络\n> 3. 使用固定 IP 必须配置对应的 IPAM subnet\n> 4. 外部网络必须先手动创建\n\n---", "subs": ["基本概念", "网络驱动（driver）", "driver_opts（驱动选项）", "IPAM 配置", "外部网络（external）", "其他网络属性", "服务网络配置", "实战示例", "注意事项"]}, {"title": "9.21 顶级 volumes 定义详解", "content": "#### 基本概念\n\n`volumes` 顶级键用于定义可被服务挂载的命名卷。\n\n```yaml\nservices:\n  db:\n    image: postgres\n    volumes:\n      - db-data:/var/lib/postgresql/data\n\nvolumes:\n  db-data:\n```\n\n---\n\n#### 卷驱动（driver）\n\n```yaml\nvolumes:\n  # 默认本地驱动\n  local-vol:\n    driver: local\n\n  # NFS 卷\n  nfs-vol:\n    driver: local\n    driver_opts:\n      type: nfs\n      o: addr=192.168.1.100,rw\n      device: \":/path/to/share\"\n\n  # tmpfs 卷\n  tmpfs-vol:\n    driver: local\n    driver_opts:\n      type: tmpfs\n      device: tmpfs\n      o: size=100m\n```\n\n##### 常用驱动选项\n\n| 选项       | 说明                             |\n| ---------- | -------------------------------- |\n| `type`   | 文件系统类型（nfs, tmpfs, cifs） |\n| `device` | 设备或远程路径                   |\n| `o`      | 挂载选项                         |\n\n---\n\n#### driver_opts（驱动选项）\n\n```yaml\nvolumes:\n  # CIFS/SMB 卷\n  cifs-vol:\n    driver: local\n    driver_opts:\n      type: cifs\n      device: \"//192.168.1.100/share\"\n      o: username=user,password=pass,uid=1000,gid=1000\n\n  # 绑定挂载（不推荐）\n  bind-vol:\n    driver: local\n    driver_opts:\n      type: none\n      device: /host/path\n      o: bind\n```\n\n---\n\n#### 外部卷（external）\n\n使用已存在的外部卷。\n\n```yaml\nvolumes:\n  existing-vol:\n    external: true\n\n  # 指定外部卷名称\n  app-data:\n    external: true\n    name: my-existing-volume\n```\n\n---\n\n#### 其他卷属性\n\n```yaml\nvolumes:\n  app-data:\n    driver: local\n  \n    # 卷名称（覆盖默认名称）\n    name: my-app-data\n  \n    # 标签\n    labels:\n      com.example.environment: production\n      com.example.backup: \"true\"\n```\n\n---\n\n#### 服务卷挂载配置\n\n服务挂载卷时的详细配置。\n\n##### 短格式\n\n```yaml\nservices:\n  app:\n    volumes:\n      - data:/app/data                   # 命名卷\n      - ./config:/app/config             # 绑定挂载\n      - /host/path:/container/path:ro    # 只读挂载\n```\n\n##### 长格式\n\n```yaml\nservices:\n  app:\n    volumes:\n      - type: volume\n        source: data\n        target: /app/data\n        read_only: false\n        volume:\n          nocopy: true\n\n      - type: bind\n        source: ./config\n        target: /app/config\n        read_only: true\n        bind:\n          propagation: rprivate\n          create_host_path: true\n\n      - type: tmpfs\n        target: /tmp\n        tmpfs:\n          size: 100000000\n          mode: 1777\n```\n\n##### 挂载类型\n\n| 类型       | 说明             |\n| ---------- | ---------------- |\n| `volume` | 命名卷           |\n| `bind`   | 绑定挂载         |\n| `tmpfs`  | 临时文件系统     |\n| `npipe`  | Windows 命名管道 |\n\n##### 挂载选项\n\n| 选项            | 说明                                      |\n| --------------- | ----------------------------------------- |\n| `source`      | 卷名或主机路径                            |\n| `target`      | 容器内路径                                |\n| `read_only`   | 只读挂载                                  |\n| `consistency` | 一致性模式（cached/delegated/consistent） |\n\n---\n\n#### 实战示例\n\n##### 示例 1：数据库持久化\n\n```yaml\nservices:\n  postgres:\n    image: postgres:15\n    environment:\n      POSTGRES_PASSWORD: secret\n    volumes:\n      - postgres-data:/var/lib/postgresql/data\n\n  mysql:\n    image: mysql:8\n    environment:\n      MYSQL_ROOT_PASSWORD: secret\n    volumes:\n      - mysql-data:/var/lib/mysql\n\nvolumes:\n  postgres-data:\n  mysql-data:\n```\n\n##### 示例 2：共享卷\n\n```yaml\nservices:\n  web:\n    image: nginx\n    volumes:\n      - static-files:/usr/share/nginx/html:ro\n\n  app:\n    image: myapp\n    volumes:\n      - static-files:/app/static:rw\n\nvolumes:\n  static-files:\n```\n\n##### 示例 3：NFS 共享存储\n\n```yaml\nservices:\n  app:\n    image: myapp\n    volumes:\n      - nfs-data:/app/data\n\nvolumes:\n  nfs-data:\n    driver: local\n    driver_opts:\n      type: nfs\n      o: addr=nfs-server.example.com,nfsvers=4.1,rsize=1048576,wsize=1048576\n      device: \":/exports/app-data\"\n```\n\n##### 示例 4：完整卷配置\n\n```yaml\nservices:\n  api:\n    image: myapi\n    volumes:\n      # 持久数据\n      - type: volume\n        source: api-data\n        target: /app/data\n\n      # 配置文件（只读）\n      - type: bind\n        source: ./config\n        target: /app/config\n        read_only: true\n\n      # 临时目录\n      - type: tmpfs\n        target: /tmp\n        tmpfs:\n          size: 50000000\n\n  db:\n    image: postgres\n    volumes:\n      - type: volume\n        source: db-data\n        target: /var/lib/postgresql/data\n        volume:\n          nocopy: true\n\nvolumes:\n  api-data:\n    name: prod-api-data\n    labels:\n      backup: \"daily\"\n\n  db-data:\n    name: prod-db-data\n    labels:\n      backup: \"hourly\"\n```\n\n---\n\n#### 注意事项\n\n> ⚠️ **重要提示**：\n>\n> 1. 命名卷数据默认持久化，删除容器不会删除卷\n> 2. `docker compose down -v` 会删除卷\n> 3. 绑定挂载使用主机路径，可能存在权限问题\n> 4. 外部卷必须先手动创建\n\n---\n\n*（第九章 Docker Compose 篇完成）*\n\n---", "subs": ["基本概念", "卷驱动（driver）", "driver_opts（驱动选项）", "外部卷（external）", "其他卷属性", "服务卷挂载配置", "实战示例", "注意事项"]}]}, {"title": "第十章 Dockerfile 篇", "sections": [{"title": "10.1 Dockerfile 概述与基础语法", "content": "#### 什么是 Dockerfile\n\nDockerfile 是一个文本文件，包含构建 Docker
