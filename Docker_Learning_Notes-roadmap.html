lish-all：发布所有暴露端口", "--expose：暴露端口（不发布）", "--dns：设置 DNS 服务器", "--add-host：添加 hosts 条目", "--hostname：设置容器主机名", "--domainname：设置 NIS 域名", "--mac-address：设置 MAC 地址", "网络配置小结"]}, {"title": "3.6 存储与挂载选项（-v, --mount, --tmpfs, --volumes-from）", "content": "容器的存储配置决定了数据如何持久化以及如何与宿主机共享数据。\n\n#### -v, --volume：挂载卷或绑定目录\n\n`-v` 选项用于**挂载数据卷或绑定宿主机目录**。\n\n##### 语法格式\n\n```bash\n# 绑定挂载（bind mount）\n-v <host_path>:<container_path>[:options]\n\n# 命名卷（named volume）\n-v <volume_name>:<container_path>[:options]\n\n# 匿名卷（anonymous volume）\n-v <container_path>\n```\n\n##### 常用选项\n\n| 选项   | 说明             |\n| ------ | ---------------- |\n| `ro` | 只读挂载         |\n| `rw` | 读写挂载（默认） |\n| `z`  | SELinux 共享标签 |\n| `Z`  | SELinux 私有标签 |\n\n##### 实战示例\n\n**示例 1：绑定挂载宿主机目录**\n\n```bash\n# 挂载当前目录到容器\n$ docker run -v $(pwd):/app -w /app ubuntu pwd\n/app\n\n# 使用相对路径（Docker 23+）\n$ docker run -v ./content:/content ubuntu ls /content\n```\n\n**示例 2：命名卷**\n\n```bash\n# 创建并使用命名卷\n$ docker run -v mydata:/data alpine touch /data/test.txt\n\n# 查看卷\n$ docker volume ls\nDRIVER    VOLUME NAME\nlocal     mydata\n```\n\n**示例 3：只读挂载**\n\n```bash\ndocker run -v /host/config:/config:ro alpine cat /config/app.conf\n```\n\n**示例 4：挂载主机文件**\n\n```bash\ndocker run -v /etc/hosts:/etc/hosts:ro alpine cat /etc/hosts\n```\n\n> ⚠️ 如果宿主机路径不存在，Docker 会自动创建目录。\n\n---\n\n#### --mount：更明确的挂载语法\n\n`--mount` 选项提供**更清晰、更明确的挂载语法**，推荐使用。\n\n##### 语法格式\n\n```bash\n--mount type=<type>,source=<src>,target=<dst>[,options]\n```\n\n##### 挂载类型\n\n| 类型       | 说明                   |\n| ---------- | ---------------------- |\n| `bind`   | 绑定挂载（宿主机路径） |\n| `volume` | 数据卷                 |\n| `tmpfs`  | 临时文件系统           |\n\n##### 常用选项\n\n| 选项                         | 说明           |\n| ---------------------------- | -------------- |\n| `source, src`              | 源路径或卷名   |\n| `target, dst, destination` | 容器内目标路径 |\n| `readonly, ro`             | 只读挂载       |\n| `volume-opt`               | 卷驱动选项     |\n\n##### 实战示例\n\n**示例 1：绑定挂载**\n\n```bash\ndocker run --mount type=bind,src=/data,dst=/data alpine ls /data\n```\n\n**示例 2：数据卷**\n\n```bash\ndocker run --mount type=volume,src=mydata,dst=/data alpine touch /data/test\n```\n\n**示例 3：只读挂载**\n\n```bash\ndocker run --mount type=bind,src=/config,dst=/config,readonly alpine\n```\n\n**示例 4：结合 --read-only**\n\n```bash\n# 容器根文件系统只读，但指定目录可写\n$ docker run --read-only --mount type=volume,target=/writable alpine touch /writable/ok\n```\n\n---\n\n#### -v vs --mount 对比\n\n| 特性         | -v / --volume | --mount        |\n| ------------ | ------------- | -------------- |\n| 语法         | 简洁          | 明确           |\n| 自动创建目录 | 是            | 否（报错）     |\n| 推荐程度     | 兼容性好      | **推荐** |\n| 可读性       | 较低          | 较高           |\n\n---\n\n#### --tmpfs：挂载临时文件系统\n\n`--tmpfs` 选项用于**挂载内存文件系统**，数据不持久化。\n\n##### 基本用法\n\n```bash\ndocker run --tmpfs <container_path>[:options]\n```\n\n##### 常用选项\n\n与 Linux `mount -t tmpfs -o` 相同：\n\n- `rw` / `ro` - 读写/只读\n- `noexec` - 禁止执行\n- `nosuid` - 禁止 SUID\n- `size=<bytes>` - 大小限制\n\n##### 实战示例\n\n```bash\n# 挂载 tmpfs 到 /run\n$ docker run -d --tmpfs /run:rw,noexec,nosuid,size=65536k myimage\n\n# 查看挂载\n$ docker exec mycontainer mount | grep tmpfs\ntmpfs on /run type tmpfs (rw,nosuid,noexec,relatime,size=65536k)\n```\n\n##### 使用场景\n\n| 场景     | 说明                     |\n| -------- | ------------------------ |\n| 敏感数据 | 密钥、令牌等不应写入磁盘 |\n| 临时缓存 | 不需要持久化的缓存数据   |\n| 高性能   | 需要高速 I/O 的临时存储  |\n\n---\n\n#### --volumes-from：从其他容器挂载卷\n\n`--volumes-from` 选项用于**继承其他容器的卷挂载**。\n\n##### 基本用法\n\n```bash\ndocker run --volumes-from <container>[:mode] IMAGE\n```\n\n##### 模式选项\n\n| 模式   | 说明                         |\n| ------ | ---------------------------- |\n| `rw` | 读写（默认，继承原容器模式） |\n| `ro` | 只读                         |\n\n##### 实战示例\n\n**示例 1：共享数据卷**\n\n```bash\n# 创建数据容器\n$ docker run -v /data --name data-container alpine\n\n# 从数据容器挂载卷\n$ docker run --volumes-from data-container alpine ls /data\n```\n\n**示例 2：只读模式**\n\n```bash\ndocker run --volumes-from data-container:ro alpine\n```\n\n**示例 3：多容器共享卷**\n\n```bash\n# 创建带卷的容器\n$ docker run -d -v webdata:/var/www --name web nginx\n\n# 备份容器共享卷\n$ docker run --volumes-from web -v $(pwd):/backup alpine \\\n    tar cvf /backup/webdata.tar /var/www\n```\n\n---\n\n#### --read-only：根文件系统只读\n\n`--read-only` 选项使**容器根文件系统只读**，提高安全性。\n\n```bash\n$ docker run --read-only alpine touch /test\ntouch: /test: Read-only file system\n\n# 配合挂载使用\n$ docker run --read-only -v /writable alpine touch /writable/ok\n```\n\n---\n\n#### 存储配置小结\n\n| 选项               | 作用           | 示例                                  |\n| ------------------ | -------------- | ------------------------------------- |\n| `-v`             | 挂载卷或目录   | `-v /host:/container`               |\n| `--mount`        | 明确挂载语法   | `--mount type=bind,src=...,dst=...` |\n| `--tmpfs`        | 内存文件系统   | `--tmpfs /run:size=64k`             |\n| `--volumes-from` | 继承其他容器卷 | `--volumes-from data`               |\n| `--read-only`    | 根文件系统只读 | `--read-only`                       |\n\n---", "subs": ["-v, --volume：挂载卷或绑定目录", "--mount：更明确的挂载语法", "-v vs --mount 对比", "--tmpfs：挂载临时文件系统", "--volumes-from：从其他容器挂载卷", "--read-only：根文件系统只读", "存储配置小结"]}, {"title": "3.7 资源限制选项（--memory, --cpus, --ulimit, --blkio-weight）", "content": "资源限制确保容器不会过度消耗系统资源，是生产环境容器管理的关键。\n\n#### 内存限制\n\n##### -m, --memory：设置内存上限\n\n```bash\ndocker run -m <limit> IMAGE\n\n# 支持单位：b, k, m, g\ndocker run -m 512m nginx\ndocker run --memory 1g nginx\n```\n\n##### --memory-reservation：内存软限制\n\n当系统内存紧张时才生效的软限制：\n\n```bash\ndocker run -m 1g --memory-reservation 512m nginx\n```\n\n##### --memory-swap：交换空间限制\n\n| 值             | 说明                          |\n| -------------- | ----------------------------- |\n| 未设置         | swap = 2 × memory            |\n| 与 memory 相同 | 禁用 swap                     |\n| `-1`         | 无限制 swap                   |\n| 大于 memory    | `swap - memory` = 可用 swap |\n\n```bash\n# 内存 1G，禁用 swap\ndocker run -m 1g --memory-swap 1g nginx\n\n# 内存 1G，swap 1G（总共可用 2G）\ndocker run -m 1g --memory-swap 2g nginx\n```\n\n##### --oom-kill-disable：禁用 OOM Killer\n\n```bash\n# 禁用 OOM Killer（必须设置 -m）\ndocker run -m 512m --oom-kill-disable nginx\n```\n\n> ⚠️ **警告**：禁用 OOM Killer 可能导致系统不稳定。\n\n---\n\n#### CPU 限制\n\n##### --cpus：限制 CPU 数量\n\n```bash\n# 限制使用 1.5 个 CPU\ndocker run --cpus 1.5 nginx\n\n# 限制使用 0.5 个 CPU\ndocker run --cpus 0.5 nginx\n```\n\n##### --cpu-shares：CPU 相对权重\n\n默认值 1024，用于 CPU 竞争时的相对优先级：\n\n```bash\n# 高优先级容器\ndocker run --cpu-shares 2048 high-priority-app\n\n# 低优先级容器\ndocker run --cpu-shares 512 low-priority-app\n```\n\n> 💡 CPU shares 只在 CPU 竞争时生效，空闲时容器可使用所有可用 CPU。\n\n##### --cpuset-cpus：绑定 CPU 核心\n\n```bash\n# 只使用 CPU 0 和 1\ndocker run --cpuset-cpus 0,1 nginx\n\n# 使用 CPU 0-3\ndocker run --cpuset-cpus 0-3 nginx\n```\n\n##### --cpu-period / --cpu-quota：精细控制\n\n```bash\n# 每 100ms 内最多使用 50ms CPU（相当于 0.5 CPU）\ndocker run --cpu-period 100000 --cpu-quota 50000 nginx\n```\n\n---\n\n#### --ulimit：设置资源限制\n\n`--ulimit` 选项设置**容器的 ulimit 值**。\n\n##### 语法格式\n\n```bash\n--ulimit <type>=<soft>[:<hard>]\n```\n\n##### 常用限制类型\n\n| 类型        | 说明           |\n| ----------- | -------------- |\n| `nofile`  | 最大打开文件数 |\n| `nproc`   | 最大进程数     |\n| `core`    | 核心转储大小   |\n| `memlock` | 最大锁定内存   |\n| `stack`   | 最大栈大小     |\n\n##### 实战示例\n\n```bash\n# 设置最大打开文件数\n$ docker run --ulimit nofile=1024:1024 nginx\n\n# 设置多个限制\n$ docker run --ulimit nofile=65535 --ulimit nproc=4096 nginx\n\n# 查看容器内 ulimit\n$ docker run --rm --ulimit nofile=1024 alpine sh -c \"ulimit -n\"\n1024\n```\n\n> ⚠️ **注意**：`nproc` 限制的是用户可用进程数，而非容器进程数。\n\n---\n\n#### Block I/O 限制\n\n##### --blkio-weight：I/O 相对权重\n\n范围 10-1000，默认 0（禁用）：\n\n```bash\n# 高 I/O 优先级\ndocker run --blkio-weight 500 nginx\n\n# 低 I/O 优先级\ndocker run --blkio-weight 100 nginx\n```\n\n##### 设备级别限制\n\n```bash\n# 限制读取速率\ndocker run --device-read-bps /dev/sda:1mb nginx\n\n# 限制写入速率\ndocker run --device-write-bps /dev/sda:1mb nginx\n\n# 限制 IOPS\ndocker run --device-read-iops /dev/sda:100 nginx\ndocker run --device-write-iops /dev/sda:100 nginx\n```\n\n---\n\n#### --pids-limit：进程数限制\n\n限制容器内可创建的进程数量：\n\n```bash\n# 最多 100 个进程\ndocker run --pids-limit 100 nginx\n\n# 无限制\ndocker run --pids-limit -1 nginx\n```\n\n---\n\n#### --storage-opt：存储限制\n\n限制容器文件系统大小（需要特定存储驱动支持）：\n\n```bash\n# 限制容器大小为 10G\ndocker run --storage-opt size=10G fedora\n```\n\n> 💡 仅支持 `btrfs`, `overlay2`, `zfs` 等存储驱动。\n\n---\n\n#### 资源限制小结\n\n| 选项               | 作用        | 示例                     |\n| ------------------ | ----------- | ------------------------ |\n| `-m`             | 内存上限    | `-m 512m`              |\n| `--cpus`         | CPU 数量    | `--cpus 2`             |\n| `--cpu-shares`   | CPU 权重    | `--cpu-shares 1024`    |\n| `--cpuset-cpus`  | 绑定 CPU    | `--cpuset-cpus 0,1`    |\n| `--ulimit`       | ulimit 限制 | `--ulimit nofile=1024` |\n| `--blkio-weight` | I/O 权重    | `--blkio-weight 500`   |\n| `--pids-limit`   | 进程数限制  | `--pids-limit 100`     |\n\n---", "subs": ["内存限制", "CPU 限制", "--ulimit：设置资源限制", "Block I/O 限制", "--pids-limit：进程数限制", "--storage-opt：存储限制", "资源限制小结"]}, {"title": "3.8 环境变量与元数据选项（-e, --env-file, -l, -h, -w）", "content": "环境变量和元数据用于配置容器运行时的行为和标识。\n\n#### -e, --env：设置环境变量\n\n`-e` 选项用于**向容器传递环境变量**。\n\n##### 语法格式\n\n```bash\n# 指定变量名和值\n-e VAR=value\n\n# 传递宿主机环境变量\n-e VAR\n```\n\n##### 实战示例\n\n**示例 1：设置环境变量**\n\n```bash\n$ docker run -e MYVAR=foo --rm alpine env | grep MYVAR\nMYVAR=foo\n```\n\n**示例 2：多个环境变量**\n\n```bash\ndocker run -e VAR1=val1 -e VAR2=val2 alpine env\n```\n\n**示例 3：传递宿主机变量**\n\n```bash\n$ export MYVAR=hello\n$ docker run -e MYVAR --rm alpine env | grep MYVAR\nMYVAR=hello\n```\n\n**示例 4：用于数据库配置**\n\n```bash\n$ docker run -d \\\n  -e MYSQL_ROOT_PASSWORD=secret \\\n  -e MYSQL_DATABASE=myapp \\\n  -e MYSQL_USER=user \\\n  -e MYSQL_PASSWORD=password \\\n  mysql:8.0\n```\n\n---\n\n#### --env-file：从文件加载环境变量\n\n`--env-file` 选项用于**从文件批量加载环境变量**。\n\n##### 文件格式\n\n```bash\n# 环境变量文件 (.env)\nVAR1=value1\nVAR2=value2\n# 注释以 # 开头\nDB_HOST=localhost\nDB_PORT=3306\n```\n\n##### 实战示例\n\n```bash\n# 创建 .env 文件\n$ cat > .env << EOF\nAPP_ENV=production\nDB_HOST=mysql.example.com\nDB_PORT=3306\nLOG_LEVEL=info\nEOF\n\n# 加载环境变量\n$ docker run --env-file .env alpine env\n```\n\n> 💡 每行一个变量，`#` 开头的行为注释。\n\n---\n\n#### -l, --label：添加元数据标签\n\n`-l` 选项用于**为容器添加元数据标签**。\n\n##### 语法格式\n\n```bash\n-l <key>=<value>\n--label <key>=<value>\n```\n\n##### 实战示例\n\n**示例 1：添加标签**\n\n```bash\ndocker run -d -l app=nginx -l env=prod nginx\n```\n\n**示例 2：查看标签**\n\n```bash\n$ docker inspect --format '{{json .Config.Labels}}' <container>\n{\"app\":\"nginx\",\"env\":\"prod\"}\n```\n\n**示例 3：按标签过滤**\n\n```bash\n# 列出带特定标签的容器\n$ docker ps -f label=app=nginx\n\n# 删除带特定标签的容器\n$ docker rm $(docker ps -aq -f label=env=test)\n```\n\n##### 常用标签规范\n\n| 标签                        | 说明                     |\n| --------------------------- | ------------------------ |\n| `com.example.description` | 描述                     |\n| `com.example.version`     | 版本                     |\n| `maintainer`              | 维护者                   |\n| `environment`             | 环境（dev/staging/prod） |\n\n---\n\n#### --label-file：从文件加载标签\n\n类似于 `--env-file`，从文件批量加载标签：\n\n```bash\n$ cat > labels.txt << EOF\napp=myapp\nversion=1.0\nEOF\n\n$ docker run --label-file labels.txt nginx\n```\n\n---\n\n#### -h, --hostname：设置主机名\n\n`-h` 选项用于**设置容器的主机名**。\n\n```bash\n$ docker run -h mycontainer alpine hostname\nmycontainer\n\n# 等同于\n$ docker run --hostname mycontainer alpine hostname\n```\n\n---\n\n#### -w, --workdir：设置工作目录\n\n`-w` 选项用于**设置容器内的工作目录**。\n\n```bash\n$ docker run -w /app ubuntu pwd\n/app\n\n# 配合执行命令\n$ docker run -v $(pwd):/app -w /app node npm install\n```\n\n##### 工作目录与挂载\n\n```bash\n# 常用开发模式：挂载 + 设置工作目录\n$ docker run -it \\\n  -v $(pwd):/workspace \\\n  -w /workspace \\\n  --rm \\\n  python:3.11 python app.py\n```\n\n---\n\n#### --entrypoint：覆盖入口点\n\n`--entrypoint` 选项用于**覆盖镜像的 ENTRYPOINT**。\n\n```bash\n# 覆盖入口点为 sh\n$ docker run --entrypoint sh nginx -c \"echo hello\"\n\n# 清空入口点\n$ docker run --entrypoint \"\" nginx echo \"custom command\"\n```\n\n---\n\n#### 环境配置小结\n\n| 选项             | 作用           | 示例                        |\n| ---------------- | -------------- | --------------------------- |\n| `-e`           | 设置环境变量   | `-e DB_HOST=localhost`    |\n| `--env-file`   | 从文件加载变量 | `--env-file .env`         |\n| `-l`           | 添加标签       | `-l app=nginx`            |\n| `--label-file` | 从文件加载标签 | `--label-file labels.txt` |\n| `-h`           | 设置主机名     | `-h mycontainer`          |\n| `-w`           | 设置工作目录   | `-w /app`                 |\n| `--entrypoint` | 覆盖入口点     | `--entrypoint sh`         |\n\n---", "subs": ["-e, --env：设置环境变量", "--env-file：从文件加载环境变量", "-l, --label：添加元数据标签", "--label-file：从文件加载标签", "-h, --hostname：设置主机名", "-w, --workdir：设置工作目录", "--entrypoint：覆盖入口点", "环境配置小结"]}, {"title": "3.9 安全配置选项（--privileged, --cap-add/drop, --security-opt, -u）", "content": "安全配置决定了容器的权限级别和访问控制，是生产环境的关键考量。\n\n#### --privileged：特权模式\n\n`--privileged` 选项授予容器**几乎所有宿主机权限**。\n\n```bash\ndocker run --privileged IMAGE\n```\n\n##### 特权模式影响\n\n| 方面             | 影响                        |\n| ---------------- | --------------------------- |\n| 设备访问         | 可访问所有宿主机设备        |\n| 内核能力         | 拥有所有 Linux capabilities |\n| AppArmor/SELinux | 绑定不受限制                |\n| seccomp          | 禁用系统调用过滤            |\n\n##### 实战示例\n\n```bash\n# Docker-in-Docker（DinD）\n$ docker run --privileged -d docker:dind\n\n# 访问宿主机设备\n$ docker run --privileged -it ubuntu fdisk -l\n```\n\n> ⚠️ **警告**：特权模式严重降低安全性，仅在必要时使用！\n\n---\n\n#### --cap-add / --cap-drop：细粒度权限控制\n\n比 `--privileged` 更安全的权限管理方式。\n\n##### 基本用法\n\n```bash\n# 添加能力\ndocker run --cap-add <capability> IMAGE\n\n# 移除能力\ndocker run --cap-drop <capability> IMAGE\n\n# 添加所有，移除特定\ndocker run --cap-add ALL --cap-drop MKNOD IMAGE\n```\n\n##### 常用 Linux Capabilities\n\n| 能力             | 说明                         |\n| ---------------- | ---------------------------- |\n| `NET_ADMIN`    | 网络管理（修改路由、防火墙） |\n| `NET_RAW`      | 使用 RAW 和 PACKET 套接字    |\n| `SYS_ADMIN`    | 系统管理（mount, swapon）    |\n| `SYS_PTRACE`   | 跟踪进程（strace, gdb）      |\n| `SYS_TIME`     | 修改系统时间                 |\n| `MKNOD`        | 创建特殊文件                 |\n| `CHOWN`        | 改变文件所有者               |\n| `DAC_OVERRIDE` | 绕过文件权限检查             |\n\n##### 实战示例\n\n**示例 1：网络调试（tcpdump, iptables）**\n\n```bash\ndocker run --cap-add NET_ADMIN --cap-add NET_RAW alpine tcpdump\n```\n\n**示例 2：进程调试（strace）**\n\n```bash\ndocker run --cap-add SYS_PTRACE alpine strace ls\n```\n\n**示例 3：移除所有能力（最小权限）**\n\n```bash\ndocker run --cap-drop ALL alpine\n```\n\n**示例 4：修改系统时间**\n\n```bash\ndocker run --cap-add SYS_TIME alpine date -s \"2024-01-01\"\n```\n\n---\n\n#### -u, --user：指定运行用户\n\n`-u` 选项用于**指定容器内进程的运行用户**。\n\n##### 语法格式\n\n```bash\n-u <user>[:<group>]\n-u <uid>[:<gid>]\n```\n\n##### 实战示例\n\n```bash\n# 使用用户名\n$ docker run -u nobody alpine id\nuid=65534(nobody) gid=65534(nobody)\n\n# 使用 UID\n$ docker run -u 1000 alpine id\nuid=1000 gid=0(root)\n\n# 使用 UID:GID\n$ docker run -u 1000:1000 alpine id\nuid=1000 gid=1000\n\n# 使用当前用户\n$ docker run -u $(id -u):$(id -g) alpine id\n```\n\n> 💡 非 root 用户运行是容器安全最佳实践。\n\n---\n\n#### --security-opt：安全模块配置\n\n`--security-opt` 选项用于**配置 AppArmor、SELinux、seccomp 等安全模块**。\n\n##### 常用选项\n\n| 选项                    | 说明                  |\n| ----------------------- | --------------------- |\n| `label:disable`       | 禁用 SELinux 标签     |\n| `label:type:TYPE`     | 设置 SELinux 类型     |\n| `apparmor=PROFILE`    | 使用 AppArmor 配置    |\n| `apparmor=unconfined` | 禁用 AppArmor         |\n| `seccomp=PROFILE`     | 使用 seccomp 配置文件 |\n| `seccomp=unconfined`  | 禁用 seccomp          |\n| `no-new-privileges`   | 禁止进程提权          |\n\n##### 实战示例\n\n**示例 1：禁止进程提权**\n\n```bash\ndocker run --security-opt no-new-privileges:true alpine\n```\n\n**示例 2：禁用 AppArmor**\n\n```bash\ndocker run --security-opt apparmor=unconfined alpine\n```\n\n**示例 3：禁用 seccomp**\n\n```bash\ndocker run --security-opt seccomp=unconfined alpine\n```\n\n**示例 4：自定义 seccomp 配置**\n\n```bash\ndocker run --security-opt seccomp=./my-profile.json alpine\n```\n\n---\n\n#### --userns：用户命名空间\n\n```bash\n# 禁用用户命名空间重映射\n$ docker run --userns=host alpine\n```\n\n---\n\n#### --group-add：添加额外用户组\n\n```bash\n# 添加到 docker 组\n$ docker run --group-add docker alpine id\n\n# 添加多个组\n$ docker run --group-add audio --group-add video alpine\n```\n\n---\n\n#### 安全配置小结\n\n| 选项               | 作用       | 示例                                 |\n| ------------------ | ---------- | ------------------------------------ |\n| `--privileged`   | 特权模式   | `--privileged`                     |\n| `--cap-add`      | 添加能力   | `--cap-add NET_ADMIN`              |\n| `--cap-drop`     | 移除能力   | `--cap-drop ALL`                   |\n| `-u`             | 指定用户   | `-u 1000:1000`                     |\n| `--security-opt` | 安全模块   | `--security-opt no-new-privileges` |\n| `--group-add`    | 添加用户组 | `--group-add docker`               |\n\n##### 安全最佳实践\n\n```bash\n# 最安全的运行方式\n$ docker run \\\n  --cap-drop ALL \\\n  --security-opt no-new-privileges:true \\\n  --read-only \\\n  -u 1000:1000 \\\n  myapp\n```\n\n---", "subs": ["--privileged：特权模式", "--cap-add / --cap-drop：细粒度权限控制", "-u, --user：指定运行用户", "--security-opt：安全模块配置", "--userns：用户命名空间", "--group-add：添加额外用户组", "安全配置小结"]}, {"title": "3.10 设备与 GPU 选项（--device, --gpus）", "content": "设备选项允许容器访问宿主机硬件设备。\n\n#### --device：映射设备\n\n`--device` 选项用于**将宿主机设备映射到容器内**。\n\n##### 语法格式\n\n```bash\n--device=<host_device>:<container_device>:<permissions>\n```\n\n##### 权限选项\n\n| 权限    | 说明                  |\n| ------- | --------------------- |\n| `r`   | 读取                  |\n| `w`   | 写入                  |\n| `m`   | 创建设备文件（mknod） |\n| `rwm` | 完全访问（默认）      |\n\n##### 实战示例\n\n**示例 1：映射 USB 设备**\n\n```bash\ndocker run --device /dev/ttyUSB0 alpine\n```\n\n**示例 2：映射声卡**\n\n```bash\ndocker run --device /dev/snd alpine aplay test.wav\n```\n\n**示例 3：只读访问**\n\n```bash\ndocker run --device /dev/video0:/dev/video0:r alpine\n```\n\n**示例 4：访问磁盘设备**\n\n```bash\ndocker run --device /dev/sda alpine fdisk -l /dev/sda\n```\n\n---\n\n#### --gpus：GPU 访问\n\n`--gpus` 选项用于**配置容器的 GPU 访问**（需要 NVIDIA Container Toolkit）。\n\n##### 前置条件\n\n1. 安装 NVIDIA 驱动\n2. 安装 NVIDIA Container Toolkit\n3. 配置 Docker runtime\n\n##### 语法格式\n\n```bash\n--gpus <specification>\n```\n\n##### 规格选项\n\n| 选项                  | 说明         |\n| --------------------- | ------------ |\n| `all`               | 所有 GPU     |\n| `\"device=0\"`        | 指定 GPU 0   |\n| `\"device=0,1\"`      | 指定多个 GPU |\n| `\"device=GPU-UUID\"` | 按 UUID 指定 |\n\n##### 实战示例\n\n**示例 1：使用所有 GPU**\n\n```bash\ndocker run --gpus all nvidia/cuda:12.0-base nvidia-smi\n```\n\n**示例 2：指定 GPU**\n\n```bash\n# 使用 GPU 0\n$ docker run --gpus \"device=0\" nvidia/cuda:12.0-base nvidia-smi\n\n# 使用 GPU 0 和 1\n$ docker run --gpus \"device=0,1\" nvidia/cuda:12.0-base nvidia-smi\n```\n\n**示例 3：限制 GPU 能力**\n\n```bash\n# 只允许计算和图形功能\n$ docker run --gpus \"all,capabilities=compute,utility\" nvidia/cuda:12.0-base\n```\n\n##### GPU 能力列表\n\n| 能力         | 说明              |\n| ------------ | ----------------- |\n| `compute`  | CUDA / 计算       |\n| `compat32` | 32 位兼容         |\n| `graphics` | OpenGL / 图形     |\n| `utility`  | nvidia-smi 等工具 |\n| `video`    | 视频编解码        |\n| `display`  | 显示输出          |\n\n---\n\n#### 设备配置小结\n\n| 选项         | 作用     | 示例                      |\n| ------------ | -------- | ------------------------- |\n| `--device` | 映射设备 | `--device /dev/ttyUSB0` |\n| `--gpus`   | GPU 访问 | `--gpus all`            |\n\n##### 完整 GPU 容器示例\n\n```bash\n$ docker run -d \\\n  --gpus all \\\n  --name ml-training \\\n  -v $(pwd)/data:/data \\\n  tensorflow/tensorflow:latest-gpu \\\n  python train.py\n```\n\n---", "subs": ["--device：映射设备", "--gpus：GPU 访问", "设备配置小结"]}, {"title": "3.11 重启策略与信号选项（--restart, --stop-signal, --stop-timeout）", "content": "重启策略决定容器退出后的行为，信号选项控制容器的停止方式。\n\n#### --restart：重启策略\n\n`--restart` 选项用于**配置容器的重启策略**。\n\n##### 策略类型\n\n| 策略                 | 说明                             |\n| -------------------- | -------------------------------- |\n| `no`               | 不自动重启（默认）               |\n| `on-failure[:max]` | 仅在非零退出码时重启，可限制次数 |\n| `always`           | 始终重启                         |\n| `unless-stopped`   | 始终重启，除非手动停止           |\n\n##### 实战示例\n\n**示例 1：失败时重启**\n\n```bash\ndocker run --restart on-failure nginx\n```\n\n**示例 2：限制重启次数**\n\n```bash\n# 最多重启 3 次\n$ docker run --restart on-failure:3 nginx\n```\n\n**示例 3：始终重启**\n\n```bash\ndocker run --restart always nginx\n```\n\n**示例 4：unless-stopped（生产推荐）**\n\n```bash\ndocker run --restart unless-stopped nginx\n```\n\n##### always vs unless-stopped\n\n| 场景                     | always | unless-stopped   |\n| ------------------------ | ------ | ---------------- |\n| 容器退出                 | 重启   | 重启             |\n| Docker 重启              | 重启   | 重启             |\n| 手动 stop 后 Docker 重启 | 重启   | **不重启** |\n\n> 💡 生产环境推荐使用 `unless-stopped`，便于维护时手动停止容器。\n\n##### 修改运行中容器的重启策略\n\n```bash\ndocker update --restart unless-stopped <container>\n```\n\n> ⚠️ `--restart` 不能与 `--rm` 同时使用。\n\n---\n\n#### --stop-signal：停止信号\n\n`--stop-signal` 选项用于**指定停止容器时发送的信号**。\n\n##### 基本用法\n\n```bash\ndocker run --stop-signal <signal> IMAGE\n```\n\n##### 常用信号\n\n| 信号        | 编号 | 说明           |\n| ----------- | ---- | -------------- |\n| `SIGTERM` | 15   | 默认，优雅终止 |\n| `SIGKILL` | 9    | 强制终止       |\n| `SIGINT`  | 2    | 中断（Ctrl+C） |\n| `SIGQUIT` | 3    | 退出           |\n| `SIGHUP`  | 1    | 挂起           |\n| `SIGUSR1` | 10   | 用户自定义 1   |\n| `SIGUSR2` | 12   | 用户自定义 2   |\n\n##### 实战示例\n\n```bash\n# 使用 SIGINT 停止\n$ docker run --stop-signal SIGINT nginx\n\n# 使用信号编号\n$ docker run --stop-signal 2 nginx\n```\n\n> 💡 确保应用程序正确处理自定义停止信号。\n\n---\n\n#### --stop-timeout：停止超时\n\n`--stop-timeout` 选项用于**设置等待容器停止的超时时间**。\n\n##### 基本用法\n\n```bash\ndocker run --stop-timeout <seconds> IMAGE\n```\n\n##### 工作流程\n\n1. Docker 发送 `--stop-signal` 指定的信号\n2. 等待 `--stop-timeout` 秒\n3. 如果容器未停止，发送 SIGKILL\n\n##### 实战示例\n\n```bash\n# 等待 30 秒\n$ docker run --stop-timeout 30 nginx\n\n# 立即发送 SIGKILL（0 秒超时）\n$ docker run --stop-timeout 0 nginx\n```\n\n##### 停止命令的超时\n\n```bash\n# 使用 docker stop 时指定超时\n$ docker stop -t 30 <container>\n```\n\n---\n\n#### 重启与信号配置小结\n\n| 选项               | 作用     | 示例                         |\n| ------------------ | -------- | ---------------------------- |\n| `--restart`      | 重启策略 | `--restart unless-stopped` |\n| `--stop-signal`  | 停止信号 | `--stop-signal SIGINT`     |\n| `--stop-timeout` | 停止超时 | `--stop-timeout 30`        |\n\n##### 生产环境推荐配置\n\n```bash\n$ docker run -d \\\n  --restart unless-stopped \\\n  --stop-timeout 30 \\\n  --name myapp \\\n  myapp:latest\n```\n\n---", "subs": ["--restart：重启策略", "--stop-signal：停止信号", "--stop-timeout：停止超时", "重启与信号配置小结"]}, {"title": "3.12 日志配置选项（--log-driver, --log-opt）", "content": "日志配置决定了容器日志的收集和存储方式。\n\n#### --log-driver：日志驱动\n\n`--log-driver` 选项用于**指定容器的日志驱动**。\n\n##### 可用驱动\n\n| 驱动          | 说明                        |\n| ------------- | --------------------------- |\n| `json-file` | JSON 文件（默认）           |\n| `syslog`    | 系统日志                    |\n| `journald`  | systemd journal             |\n| `gelf`      | Graylog Extended Log Format |\n| `fluentd`   | Fluentd 日志收集器          |\n| `awslogs`   | AWS CloudWatch Logs         |\n| `splunk`    | Splunk HTTP Event Collector |\n| `etwlogs`   | Windows ETW                 |\n| `gcplogs`   | Google Cloud Logging        |\n| `local`     | 本地日志驱动（优化存储）    |\n| `none`      | 禁用日志                    |\n\n##### 实战示例\n\n```bash\n# 使用 syslog 驱动\n$ docker run --log-driver syslog nginx\n\n# 禁用日志\n$ docker run --log-driver none nginx\n\n# 使用 journald\n$ docker run --log-driver journald nginx\n```\n\n---\n\n#### --log-opt：日志选项\n\n`--log-opt` 选项用于**配置日志驱动的额外选项**。\n\n##### json-file 驱动选项\n\n| 选项         | 说明               | 默认值           |\n| ------------ | ------------------ | ---------------- |\n| `max-size` | 日志文件最大大小   | `-1`（无限制） |\n| `max-file` | 保留的日志文件数   | `1`            |\n| `compress` | 是否压缩轮转的日志 | `disabled`     |\n| `labels`   | 记录容器标签       | -                |\n| `env`      | 记录环境变量       | -                |\n\n##### 实战示例\n\n**示例 1：限制日志大小和文件数**\n\n```bash\n$ docker run \\\n  --log-driver json-file \\\n  --log-opt max-size=10m \\\n  --log-opt max-file=3 \\\n  nginx\n```\n\n**示例 2：启用日志压缩**\n\n```bash\n$ docker run \\\n  --log-driver json-file \\\n  --log-opt max-size=10m \\\n  --log-opt max-file=5 \\\n  --log-opt compress=true \\\n  nginx\n```\n\n**示例 3：记录容器标签和环境变量**\n\n```bash\n$ docker run \\\n  --log-opt labels=app,env \\\n  --log-opt env=APP_VERSION \\\n  -l app=myapp \\\n  -l env=prod \\\n  -e APP_VERSION=1.0 \\\n  nginx\n```\n\n---\n\n#### syslog 驱动选项\n\n| 选项                | 说明              |\n| ------------------- | ----------------- |\n| `syslog-address`  | syslog 服务器地址 |\n| `syslog-facility` | syslog facility   |\n| `syslog-format`   | 消息格式          |\n| `tag`             | 日志标签          |\n\n```bash\n$ docker run \\\n  --log-driver syslog \\\n  --log-opt syslog-address=tcp://192.168.1.100:514 \\\n  --log-opt tag=\"{{.Name}}\" \\\n  nginx\n```\n\n---\n\n#### fluentd 驱动选项\n\n| 选项                | 说明         |\n| ------------------- | ------------ |\n| `fluentd-address` | Fluentd 地址 |\n| `fluentd-async`   | 异步发送     |\n| `tag`             | 日志标签     |\n\n```bash\n$ docker run \\\n  --log-driver fluentd \\\n  --log-opt fluentd-address=localhost:24224 \\\n  --log-opt tag=docker.{{.Name}} \\\n  nginx\n```\n\n---\n\n#### awslogs 驱动选项\n\n| 选项               | 说明       |\n| ------------------ | ---------- |\n| `awslogs-region` | AWS 区域   |\n| `awslogs-group`  | 日志组名称 |\n| `awslogs-stream` | 日志流名称 |\n\n```bash\n$ docker run \\\n  --log-driver awslogs \\\n  --log-opt awslogs-region=us-east-1 \\\n  --log-opt awslogs-group=myapp-logs \\\n  --log-opt awslogs-stream=container-1 \\\n  nginx\n```\n\n---\n\n#### 日志配置小结\n\n| 选项             | 作用     | 示例                       |\n| ---------------- | -------- | -------------------------- |\n| `--log-driver` | 日志驱动 | `--log-driver json-file` |\n| `--log-opt`    | 驱动选项 | `--log-opt max-size=10m` |\n\n##### 生产环境推荐配置\n\n```bash\n$ docker run -d \\\n  --log-driver json-file \\\n  --log-opt max-size=100m \\\n  --log-opt max-file=5 \\\n  --log-opt compress=true \\\n  --name myapp \\\n  myapp:latest\n```\n\n> 💡 **提示**：可在 `/etc/docker/daemon.json` 中设置全局日志默认值。\n\n---", "subs": ["--log-driver：日志驱动", "--log-opt：日志选项", "syslog 驱动选项", "fluentd 驱动选项", "awslogs 驱动选项", "日志配置小结"]}, {"title": "3.13 其他选项（--pull, --init, --cgroup-parent）", "content": "本节介绍其他常用的 `docker run` 选项。\n\n#### --pull：镜像拉取策略\n\n`--pull` 选项用于**控制运行前是否拉取镜像**。\n\n##### 策略选项\n\n| 策略        | 说明                         |\n| ----------- | ---------------------------- |\n| `always`  | 始终拉取最新镜像             |\n| `missing` | 仅在本地不存在时拉取（默认） |\n| `never`   | 从不拉取，本地不存在则报错   |\n\n##### 实战示例\n\n```bash\n# 始终拉取最新镜像\n$ docker run --pull always nginx\n\n# 仅在本地不存在时拉取\n$ docker run --pull missing nginx\n\n# 从不拉取\n$ docker run --pull never nginx\n```\n\n> 💡 CI/CD 环境推荐使用 `--pull always` 确保使用最新镜像。\n\n---\n\n#### --init：使用 init 进程\n\n`--init` 选项用于**在容器中运行 init 进程作为 PID 1**。\n\n##### 为什么需要 init\n\n- 正确处理信号转发\n- 收割僵尸进程（zombie processes）\n- 确保子进程能被正确终止\n\n##### 实战示例\n\n```bash\ndocker run --init alpine sh -c \"sleep infinity\"\n```\n\n##### 查看 init 进程\n\n```bash\n$ docker run --init alpine ps aux\nPID   USER     TIME  COMMAND\n    1 root      0:00 /sbin/docker-init -- sh\n    7 root      0:00 sh\n    8 root      0:00 ps aux\n```\n\n> 💡 对于不处理信号的应用程序，建议使用 `--init`。\n\n---\n\n#### --cgroup-parent：控制组父级\n\n`--cgroup-parent` 选项用于**指定容器的 cgroup 父路径**。\n\n```bash\ndocker run --cgroup-parent=/mygroup nginx\n```\n\n> 💡 用于高级资源隔离场景。\n\n---\n\n#### --runtime：容器运行时\n\n指定容器使用的运行时：\n\n```bash\n# 使用 runc（默认）\n$ docker run --runtime runc nginx\n\n# 使用 nvidia 运行时（GPU）\n$ docker run --runtime nvidia nvidia/cuda:12.0-base\n```\n\n---\n\n#### --annotation：添加注解\n\n添加容器注解（元数据）：\n\n```bash\ndocker run --annotation \"com.example.key=value\" nginx\n```\n\n---\n\n#### --platform：指定平台\n\n指定容器的目标平台（多架构镜像）：\n\n```bash\n# 运行 ARM64 镜像\n$ docker run --platform linux/arm64 nginx\n\n# 运行 AMD64 镜像\n$ docker run --platform linux/amd64 nginx\n```\n\n---\n\n#### --health-cmd：健康检查\n\n配置容器健康检查：\n\n```bash\n$ docker run \\\n  --health-cmd \"curl -f http://localhost/ || exit 1\" \\\n  --health-interval 30s \\\n  --health-timeout 10s \\\n  --health-retries 3 \\\n  --health-start-period 5s \\\n  nginx\n```\n\n##### 健康检查选项\n\n| 选项                      | 说明         |\n| ------------------------- | ------------ |\n| `--health-cmd`          | 健康检查命令 |\n| `--health-interval`     | 检查间隔     |\n| `--health-timeout`      | 命令超时     |\n| `--health-retries`      | 失败重试次数 |\n| `--health-start-period` | 启动宽限期   |\n| `--no-healthcheck`      | 禁用健康检查 |\n\n---\n\n#### 其他选项小结\n\n| 选项                | 作用           | 示例                         |\n| ------------------- | -------------- | ---------------------------- |\n| `--pull`          | 镜像拉取策略   | `--pull always`            |\n| `--init`          | 使用 init 进程 | `--init`                   |\n| `--cgroup-parent` | cgroup 父级    | `--cgroup-parent=/mygroup` |\n| `--runtime`       | 容器运行时     | `--runtime nvidia`         |\n| `--platform`      | 目标平台       | `--platform linux/arm64`   |\n| `--health-cmd`    | 健康检查       | `--health-cmd \"curl ...\"`  |\n\n---", "subs": ["--pull：镜像拉取策略", "--init：使用 init 进程", "--cgroup-parent：控制组父级", "--runtime：容器运行时", "--annotation：添加注解", "--platform：指定平台", "--health-cmd：健康检查", "其他选项小结"]}, {"title": "3.14 docker run 完整示例", "content": "将本章所学选项组合成一个生产级别的容器配置：\n\n```bash\n$ docker run -d \\\n  --name myapp \\\n  --hostname myapp-1 \\\n  --restart unless-stopped \\\n  --pull always \\\n  --init \\\n  \\\n  # 网络配置\n  --network mynet \\\n  -p 8080:80 \\\n  --dns 8.8.8.8 \\\n  \\\n  # 存储配置\n  -v /data/app:/app \\\n  --tmpfs /run:size=64k \\\n  --read-only \\\n  \\\n  # 资源限制\n  -m 512m \\\n  --cpus 1 \\\n  --pids-limit 100 \\\n  \\\n  # 环境配置\n  -e APP_ENV=production \\\n  --env-file .env \\\n  -l app=myapp \\\n  -l env=prod \\\n  \\\n  # 安全配置\n  --cap-drop ALL \\\n  --security-opt no-new-privileges:true \\\n  -u 1000:1000 \\\n  \\\n  # 日志配置\n  --log-driver json-file \\\n  --log-opt max-size=100m \\\n  --log-opt max-file=5 \\\n  \\\n  # 健康检查\n  --health-cmd \"curl -f http://localhost/ || exit 1\" \\\n  --health-interval 30s \\\n  --health-retries 3 \\\n  \\\n  myapp:latest\n```\n\n---\n\n---", "subs": []}]}, {"title": "第四章 镜像管理", "sections": [{"title": "4.1 镜像获取命令（pull/push）", "content": "#### docker pull：拉取镜像\n\n`docker pull` 命令用于**从镜像仓库拉取镜像到本地**。\n\n##### 语法格式\n\n```bash\ndocker pull [OPTIONS] NAME[:TAG|@DIGEST]\n```\n\n##### 常用选项\n\n| 选项                        | 说明                       |\n| --------------------------- | -------------------------- |\n| `-a, --all-tags`          | 拉取所有标签               |\n| `--platform`              | 指定平台（如 linux/amd64） |\n| `-q, --quiet`             | 静默输出                   |\n| `--disable-content-trust` | 跳过镜像验证               |\n\n##### 镜像名称格式\n\n```\n[registry/][repository/]name[:tag|@digest]\n```\n\n| 组件       | 说明     | 示例                             |\n| ---------- | -------- | -------------------------------- |\n| registry   | 仓库地址 | `docker.io`, `gcr.io`        |\n| repository | 命名空间 | `library`, `nginx`           |\n| name       | 镜像名   | `nginx`, `alpine`            |\n| tag        | 标签     | `latest`, `1.25`, `alpine` |\n| digest     | 摘要     | `sha256:abc123...`             |\n\n##### 实战示例\n\n**示例 1：拉取最新版本**\n\n```bash\n$ docker pull nginx\nUsing default tag: latest\nlatest: Pulling from library/nginx\n...\nStatus: Downloaded newer image for nginx:latest\ndocker.io/library/nginx:latest\n```\n\n**示例 2：拉取指定版本**\n\n```bash\ndocker pull nginx:1.25-alpine\ndocker pull redis:7.2\ndocker pull python:3.11-slim\n```\n\n**示例 3：拉取指定摘要（不可变）**\n\n```bash\ndocker pull nginx@sha256:abc123def456...\n```\n\n**示例 4：从私有仓库拉取**\n\n```bash\n# 先登录\n$ docker login registry.example.com\n\n# 拉取镜像\n$ docker pull registry.example.com/myapp:v1.0\n```\n\n**示例 5：指定平台**\n\n```bash\n# 拉取 ARM64 版本\n$ docker pull --platform linux/arm64 nginx\n\n# 拉取 AMD64 版本\n$ docker pull --platform linux/amd64 nginx\n```\n\n**示例 6：拉取所有标签**\n\n```bash\ndocker pull -a alpine\n```\n\n> ⚠️ **注意**：拉取所有标签可能需要大量磁盘空间。\n\n---\n\n#### docker push：推送镜像\n\n`docker push` 命令用于**将本地镜像推送到镜像仓库**。\n\n##### 语法格式\n\n```bash\ndocker push [OPTIONS] NAME[:TAG]\n```\n\n##### 常用选项\n\n| 选项                        | 说明         |\n| --------------------------- | ------------ |\n| `-a, --all-tags`          | 推送所有标签 |\n| `-q, --quiet`             | 静默输出     |\n| `--disable-content-trust` | 跳过镜像签名 |\n\n##### 推送前准备\n\n1. 登录目标仓库\n2. 为镜像打标签（包含仓库地址）\n\n##### 实战示例\n\n**示例 1：推送到 Docker Hub**\n\n```bash\n# 1. 登录\n$ docker login\n\n# 2. 为镜像打标签\n$ docker tag myapp:latest username/myapp:v1.0\n\n# 3. 推送\n$ docker push username/myapp:v1.0\n```\n\n**示例 2：推送到私有仓库**\n\n```bash\n# 1. 登录私有仓库\n$ docker login registry.example.com\n\n# 2. 打标签\n$ docker tag myapp:latest registry.example.com/team/myapp:v1.0\n\n# 3. 推送\n$ docker push registry.example.com/team/myapp:v1.0\n```\n\n**示例 3：推送所有标签**\n\n```bash\ndocker push -a username/myapp\n```\n\n---\n\n#### docker login / logout：登录登出\n\n##### docker login\n\n```bash\n# 交互式登录\n$ docker login\n\n# 指定仓库\n$ docker login registry.example.com\n\n# 非交互式（CI/CD）\n$ docker login -u $USER -p $PASSWORD registry.example.com\n\n# 使用 stdin 传递密码（更安全）\n$ echo $PASSWORD | docker login -u $USER --password-stdin\n```\n\n##### docker logout\n\n```bash\n# 登出 Docker Hub\n$ docker logout\n\n# 登出指定仓库\n$ docker logout registry.example.com\n```\n\n---\n\n#### docker search：搜索镜像\n\n`docker search` 命令用于**在 Docker Hub 搜索镜像**。\n\n```bash\n# 基本搜索\n$ docker search nginx\n\n# 限制结果数\n$ docker search --limit 5 nginx\n\n# 过滤官方镜像\n$ docker search --filter is-official=true nginx\n\n# 过滤星标数\n$ docker search --filter stars=100 nginx\n```\n\n##### 输出字段\n\n| 字段        | 说明         |\n| ----------- | ------------ |\n| NAME        | 镜像名称     |\n| DESCRIPTION | 描述         |\n| STARS       | 星标数       |\n| OFFICIAL    | 是否官方     |\n| AUTOMATED   | 是否自动构建 |\n\n---\n\n#### 镜像获取命令小结\n\n| 命令              | 作用     | 示例                        |\n| ----------------- | -------- | --------------------------- |\n| `docker pull`   | 拉取镜像 | `docker pull nginx:1.25`  |\n| `docker push`   | 推送镜像 | `docker push user/app:v1` |\n| `docker login`  | 登录仓库 | `docker login`            |\n| `docker logout` | 登出仓库 | `docker logout`           |\n| `docker search` | 搜索镜像 | `docker search nginx`     |\n\n---", "subs": ["docker pull", "docker push", "docker login / logout", "docker search", "镜像获取命令小结"]}, {"title": "4.2 镜像查看命令（ls/history/inspect）", "content": "#### docker images / docker image ls：列出镜像\n\n`docker images` 命令用于**列出本地镜像**。\n\n##### 语法格式\n\n```bash\ndocker images [OPTIONS] [REPOSITORY[:TAG]]\ndocker image ls [OPTIONS] [REPOSITORY[:TAG]]\n```\n\n##### 常用选项\n\n| 选项             | 说明                       |\n| ---------------- | -------------------------- |\n| `-a, --all`    | 显示所有镜像（包括中间层） |\n| `-q, --quiet`  | 只显示镜像 ID              |\n| `--digests`    | 显示摘要                   |\n| `--no-trunc`   | 不截断输出                 |\n| `-f, --filter` | 过滤条件                   |\n| `--format`     | 格式化输出                 |\n\n##### 实战示例\n\n**示例 1：列出所有镜像**\n\n```bash\n$ docker images\nREPOSITORY   TAG       IMAGE ID       CREATED        SIZE\nnginx        1.25      a8758716bb6a   2 weeks ago    187MB\nredis        7.2       7614ae9453d1   3 weeks ago    138MB\nalpine       latest    c059bfaa849c   4 weeks ago    7.73MB\n```\n\n**示例 2：只显示镜像 ID**\n\n```bash\n$ docker images -q\na8758716bb6a\n7614ae9453d1\nc059bfaa849c\n```\n\n**示例 3：按仓库过滤**\n\n```bash\n$ docker images nginx\nREPOSITORY   TAG          IMAGE ID       CREATED        SIZE\nnginx        1.25         a8758716bb6a   2 weeks ago    187MB\nnginx        alpine       d0a9baf36a14   2 weeks ago    43.3MB\n```\n\n**示例 4：使用过滤器**\n\n```bash\n# 悬空镜像（无标签）\n$ docker images -f dangling=true\n\n# 指定时间之前创建的镜像\n$ docker images -f before=nginx:1.25\n\n# 指定标签的镜像\n$ docker images -f label=maintainer=nginx\n```\n\n**示例 5：格式化输出**\n\n```bash\n# 自定义格式\n$ docker images --format \"{{.Repository}}:{{.Tag}} - {{.Size}}\"\nnginx:1.25 - 187MB\nredis:7.2 - 138MB\n\n# 表格格式\n$ docker images --format \"table {{.Repository}}\\t{{.Tag}}\\t{{.Size}}\"\n```\n\n##### 输出列说明\n\n| 列         | 说明          |\n| ---------- | ------------- |\n| REPOSITORY | 仓库名        |\n| TAG        | 标签          |\n| IMAGE ID   | 镜像 ID（短） |\n| CREATED    | 创建时间      |\n| SIZE       | 镜像大小      |\n\n---\n\n#### docker history：查看镜像历史\n\n`docker history` 命令用于**查看镜像的构建历史**。\n\n##### 语法格式\n\n```bash\ndocker history [OPTIONS] IMAGE\n```\n\n##### 常用选项\n\n| 选项            | 说明                 |\n| --------------- | -------------------- |\n| `-H, --human` | 人类可读格式（默认） |\n| `--no-trunc`  | 不截断输出           |\n| `-q, --quiet` | 只显示镜像 ID        |\n| `--format`    | 格式化输出           |\n\n##### 实战示例\n\n**示例 1：查看镜像历史**\n\n```bash\n$ docker history nginx:1.25\nIMAGE          CREATED       CREATED BY                                      SIZE\na8758716bb6a   2 weeks ago   CMD [\"nginx\" \"-g\" \"daemon off;\"]                0B\n<missing>      2 weeks ago   STOPSIGNAL SIGQUIT                              0B\n<missing>      2 weeks ago   EXPOSE 80                                       0B\n<missing>      2 weeks ago   ENTRYPOINT [\"/docker-entrypoint.sh\"]            0B\n...\n```\n\n**示例 2：显示完整命令**\n\n```bash\ndocker history --no-trunc nginx:1.25\n```\n\n**示例 3：格式化输出**\n\n```bash\ndocker history --format \"{{.CreatedBy}}\" nginx:1.25\n```\n\n##### 输出列说明\n\n| 列         | 说明           |\n| ---------- | -------------- |\n| IMAGE      | 层 ID          |\n| CREATED    | 创建时间       |\n| CREATED BY | 创建该层的命令 |\n| SIZE       | 该层大小       |\n| COMMENT    | 注释           |\n\n---\n\n#### docker inspect：查看详细信息\n\n`docker image inspect` 命令用于**查看镜像的详细元数据**。\n\n##### 语法格式\n\n```bash\ndocker image inspect [OPTIONS] IMAGE [IMAGE...]\n```\n\n##### 常用选项\n\n| 选项             | 说明                  |\n| ---------------- | --------------------- |\n| `-f, --format` | 格式化输出（Go 模板） |\n| `-s, --size`   | 显示文件大小          |\n\n##### 实战示例\n\n**示例 1：查看完整信息**\n\n```bash\n$ docker image inspect nginx:1.25\n[\n    {\n        \"Id\": \"sha256:a8758716bb6a...\",\n        \"RepoTags\": [\"nginx:1.25\"],\n        \"Created\": \"2024-01-15T12:00:00Z\",\n        ...\n    }\n]\n```\n\n**示例 2：提取特定字段**\n\n```bash\n# 获取镜像 ID\n$ docker image inspect -f '{{.Id}}' nginx:1.25\nsha256:a8758716bb6a...\n\n# 获取创建时间\n$ docker image inspect -f '{{.Created}}' nginx:1.25\n\n# 获取暴露端口\n$ docker image inspect -f '{{.Config.ExposedPorts}}' nginx:1.25\nmap[80/tcp:{}]\n\n# 获取环境变量\n$ docker image inspect -f '{{.Config.Env}}' nginx:1.25\n\n# 获取入口点\n$ docker image inspect -f '{{.Config.Entrypoint}}' nginx:1.25\n```\n\n**示例 3：获取镜像大小**\n\n```bash\n$ docker image inspect -f '{{.Size}}' nginx:1.25\n187654321\n```\n\n**示例 4：获取镜像层**\n\n```bash\ndocker image inspect -f '{{range .RootFS.Layers}}{{println .}}{{end}}' nginx:1.25\n```\n\n##### 常用 inspect 字段\n\n| 字段路径                 | 说明         |\n| ------------------------ | ------------ |\n| `.Id`                  | 镜像 ID      |\n| `.RepoTags`            | 标签列表     |\n| `.Created`             | 创建时间     |\n| `.Size`                | 大小（字节） |\n| `.Config.Env`          | 环境变量     |\n| `.Config.Cmd`          | 默认命令     |\n| `.Config.Entrypoint`   | 入口点       |\n| `.Config.ExposedPorts` | 暴露端口     |\n| `.Config.WorkingDir`   | 工作目录     |\n| `.RootFS.Layers`       | 层列表       |\n\n---\n\n#### 镜像查看命令小结\n\n| 命令                     | 作用     | 示例                           |\n| ------------------------ | -------- | ------------------------------ |\n| `docker images`        | 列出镜像 | `docker images -q`           |\n| `docker history`       | 查看历史 | `docker history nginx`       |\n| `docker image inspect` | 查看详情 | `docker image inspect nginx` |\n\n---", "subs": ["docker images / docker image ls", "docker history", "docker inspect", "镜像查看命令小结"]}, {"title": "4.3 镜像导入导出命令（save/load/import/export）", "content": "镜像导入导出用于在不同环境之间迁移镜像，特别是在无法访问仓库的离线环境中。\n\n#### docker save：导出镜像\n\n`docker save` 命令用于**将镜像保存为 tar 归档文件**。\n\n##### 语法格式\n\n```bash\ndocker save [OPTIONS] IMAGE [IMAGE...]\n```\n\n##### 常用选项\n\n| 选项             | 说明       |\n| ---------------- | ---------- |\n| `-o, --output` | 输出到文件 |\n\n##### 实战示例\n\n**示例 1：导出单个镜像**\n\n```bash\ndocker save -o nginx.tar nginx:1.25\n```\n\n**示例 2：使用重定向**\n\n```bash\ndocker save nginx:1.25 > nginx.tar\n```\n\n**示例 3：导出多个镜像**\n\n```bash\ndocker save -o images.tar nginx:1.25 redis:7.2 alpine:latest\n```\n\n**示例 4：压缩导出**\n\n```bash\ndocker save nginx:1.25 | gzip > nginx.tar.gz\n```\n\n**示例 5：导出所有镜像**\n\n```bash\ndocker save -o all-images.tar $(docker images -q)\n```\n\n---\n\n#### docker load：导入镜像\n\n`docker load` 命令用于**从 tar 归档文件加载镜像**。\n\n##### 语法格式\n\n```bash\ndocker load [OPTIONS]\n```\n\n##### 常用选项\n\n| 选项            | 说明       |\n| --------------- | ---------- |\n| `-i, --input` | 从文件读取 |\n| `-q, --quiet` | 静默输出   |\n\n##### 实战示例\n\n**示例 1：导入镜像**\n\n```bash\n$ docker load -i nginx.tar\nLoaded image: nginx:1.25\n```\n\n**示例 2：使用重定向**\n\n```bash\ndocker load < nginx.tar\n```\n\n**示例 3：导入压缩文件**\n\n```bash\ngunzip -c nginx.tar.gz | docker load\n```\n\n**示例 4：从远程 URL 导入**\n\n```bash\ncurl -sL https://example.com/images/nginx.tar | docker load\n```\n\n---\n\n#### docker export：导出容器\n\n`docker export` 命令用于**将容器的文件系统导出为 tar 归档**。\n\n> ⚠️ **注意**：`export` 导出的是容器的文件系统，不包含镜像的历史和元数据。\n\n##### 语法格式\n\n```bash\ndocker export [OPTIONS] CONTAINER\n```\n\n##### 常用选项\n\n| 选项             | 说明       |\n| ---------------- | ---------- |\n| `-o, --output` | 输出到文件 |\n\n##### 实战示例\n\n```bash\n# 导出容器\n$ docker export -o mycontainer.tar mycontainer\n\n# 使用重定向\n$ docker export mycontainer > mycontainer.tar\n```\n\n---\n\n#### docker import：从归档创建镜像\n\n`docker import` 命令用于**从 tar 归档创建新镜像**。\n\n##### 语法格式\n\n```bash\ndocker import [OPTIONS] file|URL|- [REPOSITORY[:TAG]]\n```\n\n##### 常用选项\n\n| 选项              | 说明                 |\n| ----------------- | -------------------- |\n| `-c, --change`  | 应用 Dockerfile 指令 |\n| `-m, --message` | 提交信息             |\n\n##### 实战示例\n\n**示例 1：从文件导入**\n\n```bash\ndocker import mycontainer.tar myimage:v1\n```\n\n**示例 2：从 URL 导入**\n\n```bash\ndocker import https://example.com/rootfs.tar myimage:v1\n```\n\n**示例 3：添加元数据**\n\n```bash\ndocker import -c 'CMD [\"nginx\"]' -c 'EXPOSE 80' mycontainer.tar nginx:custom\n```\n\n---\n\n#### save/load vs export/import\n\n| 特性       | save/load | export/import |\n| ---------- | --------- | ------------- |\n| 对象       | 镜像      | 容器          |\n| 保留历史   | ✅ 是     | ❌ 否         |\n| 保留元数据 | ✅ 是     | ❌ 否         |\n| 保留层结构 | ✅ 是     | ❌ 否（单层） |\n| 文件大小   | 较大      | 较小          |\n| 用途       | 镜像迁移  | 快照、备份    |\n\n---\n\n#### 实战场景\n\n##### 场景 1：离线环境部署\n\n```bash\n# 在有网环境\n$ docker pull nginx:1.25\n$ docker save -o nginx.tar nginx:1.25\n\n# 拷贝到离线环境\n$ scp nginx.tar user@offline-server:/tmp/\n\n# 在离线环境加载\n$ docker load -i /tmp/nginx.tar\n```\n\n##### 场景 2：批量迁移镜像\n\n```bash\n# 导出所有镜像\n$ docker save -o all-images.tar $(docker images --format \"{{.Repository}}:{{.Tag}}\" | grep -v \"<none>\")\n\n# 导入所有镜像\n$ docker load -i all-images.tar\n```\n\n##### 场景 3：创建自定义基础镜像\n\n```bash\n# 创建并配置容器\n$ docker run -it --name mybase alpine sh\n# ... 安装软件、配置环境 ...\n\n# 导出容器\n$ docker export -o mybase.tar mybase\n\n# 创建镜像\n$ docker import mybase.tar mybase:v1\n```\n\n---\n\n#### 镜像导入导出命令小结\n\n| 命令              | 作用           | 示例                               |\n| ----------------- | -------------- | ---------------------------------- |\n| `docker save`   | 导出镜像       | `docker save -o nginx.tar nginx` |\n| `docker load`   | 导入镜像       | `docker load -i nginx.tar`       |\n| `docker export` | 导出容器       | `docker export -o app.tar app`   |\n| `docker import` | 从归档创建镜像 | `docker import app.tar myapp:v1` |\n\n---", "subs": ["docker save", "docker load", "docker export", "docker import", "save/load vs export/import", "实战场景", "镜像导入导出命令小结"]}, {"title": "4.4 镜像维护命令（tag/rm/prune）", "content": "镜像维护命令用于管理本地镜像，包括重命名、删除和清理操作。\n\n#### docker tag：镜像标签\n\n`docker tag` 命令用于**为镜像创建新的标签**。\n\n##### 语法格式\n\n```bash\ndocker tag SOURCE_IMAGE[:TAG] TARGET_IMAGE[:TAG]\n```\n\n##### 实战示例\n\n**示例 1：创建新标签**\n\n```bash\ndocker tag nginx:1.25 nginx:latest\n```\n\n**示例 2：准备推送到私有仓库**\n\n```bash\ndocker tag myapp:v1 registry.example.com/team/myapp:v1\n```\n\n**示例 3：创建版本标签**\n\n```bash\ndocker tag myapp:latest myapp:v1.0.0\ndocker tag myapp:latest myapp:v1.0\ndocker tag myapp:latest myapp:v1\n```\n\n**示例 4：使用镜像 ID**\n\n```bash\ndocker tag a8758716bb6a myapp:v2\n```\n\n> 💡 `docker tag` 不会复制镜像，只是创建一个指向同一镜像的新引用。\n\n---\n\n#### docker rmi / docker image rm：删除镜像\n\n`docker rmi` 命令用于**删除本地镜像**。\n\n##### 语法格式\n\n```bash\ndocker rmi [OPTIONS] IMAGE [IMAGE...]\ndocker image rm [OPTIONS] IMAGE [IMAGE...]\n```\n\n##### 常用选项\n\n| 选项            | 说明                 |\n| --------------- | -------------------- |\n| `-f, --force` | 强制删除             |\n| `--no-prune`  | 不删除未标记的父镜像 |\n\n##### 实战示例\n\n**示例 1：删除单个镜像**\n\n```bash\n$ docker rmi nginx:1.25\nUntagged: nginx:1.25\nDeleted: sha256:a8758716bb6a...\n```\n\n**示例 2：删除多个镜像**\n\n```bash\ndocker rmi nginx:1.25 redis:7.2 alpine:latest\n```\n\n**示例 3：强制删除（有容器使用时）**\n\n```bash\ndocker rmi -f nginx:1.25\n```\n\n**示例 4：使用镜像 ID 删除**\n\n```bash\ndocker rmi a8758716bb6a\n```\n\n**示例 5：删除所有镜像**\n\n```bash\ndocker rmi $(docker images -q)\n```\n\n**示例 6：删除悬空镜像**\n\n```bash\ndocker rmi $(docker images -f dangling=true -q)\n```\n\n##### 删除失败的常见原因\n\n| 错误                             | 原因           | 解决方案                   |\n| -------------------------------- | -------------- | -------------------------- |\n| image is being used              | 有容器使用     | 先停止/删除容器            |\n| image has dependent child images | 有子镜像依赖   | 先删除子镜像               |\n| conflict: unable to delete       | 镜像有多个标签 | 使用 `-f` 或删除所有标签 |\n\n---\n\n#### docker image prune：清理镜像\n\n`docker image prune` 命令用于**清理未使用的镜像**。\n\n##### 语法格式\n\n```bash\ndocker image prune [OPTIONS]\n```\n\n##### 常用选项\n\n| 选项            | 说明                             |\n| --------------- | -------------------------------- |\n| `-a, --all`   | 删除所有未使用镜像，不仅是悬空的 |\n| `-f, --force` | 不提示确认                       |\n| `--filter`    | 过滤条件                         |\n\n##### 实战示例\n\n**示例 1：清理悬空镜像**\n\n```bash\n$ docker image prune\nWARNING! This will remove all dangling images.\nAre you sure you want to continue? [y/N] y\nTotal reclaimed space: 1.2GB\n```\n\n**示例 2：清理所有未使用镜像**\n\n```bash\ndocker image prune -a\n```\n\n**示例 3：强制清理（不提示）**\n\n```bash\ndocker image prune -f\n```\n\n**示例 4：按时间过滤**\n\n```bash\n# 清理 24 小时前创建的镜像\n$ docker image prune -a --filter \"until=24h\"\n\n# 清理 7 天前的镜像\n$ docker image prune -a --filter \"until=168h\"\n```\n\n**示例 5：按标签过滤**\n\n```bash\n# 清理没有特定标签的镜像\n$ docker image prune -a --filter \"label!=keep\"\n```\n\n---\n\n#### docker system prune：系统清理\n\n`docker system prune` 命令用于**清理所有未使用的 Docker 资源**。\n\n```bash\n# 清理未使用的容器、网络、悬空镜像\n$ docker system prune\n\n# 清理所有未使用资源（包括未使用的镜像和卷）\n$ docker system prune -a --volumes\n\n# 查看磁盘使用情况\n$ docker system df\n```\n\n##### docker system df 输出示例\n\n```\nTYPE            TOTAL     ACTIVE    SIZE      RECLAIMABLE\nImages          15        3         8.2GB     5.8GB (70%)\nContainers      5         2         120MB     80MB (66%)\nLocal Volumes   8         4         2.1GB     1.2GB (57%)\nBuild Cache     25        0         1.5GB     1.5GB (100%)\n```\n\n---\n\n#### 镜像维护命令小结\n\n| 命令                    | 作用     | 示例                                   |\n| ----------------------- | -------- | -------------------------------------- |\n| `docker tag`          | 创建标签 | `docker tag nginx:1.25 nginx:latest` |\n| `docker rmi`          | 删除镜像 | `docker rmi nginx:1.25`              |\n| `docker image prune`  | 清理镜像 | `docker image prune -a`              |\n| `docker system prune` | 系统清理 | `docker system prune -a`             |\n| `docker system df`    | 查看磁盘 | `docker system df`                   |\n\n##### 清理策略建议\n\n```bash\n# 定期清理脚本\n#!/bin/bash\n\n# 清理已停止的容器\ndocker container prune -f\n\n# 清理悬空镜像\ndocker image prune -f\n\n# 清理未使用的网络\ndocker network prune -f\n\n# 清理 7 天前的构建缓存\ndocker builder prune -f --filter \"until=168h\"\n\necho \"清理完成！\"\ndocker system df\n```\n\n---\n\n---", "subs": ["docker tag", "docker rmi / docker image rm", "docker image prune", "docker system prune", "镜像维护命令小结"]}]}, {"title": "第五章 镜像构建", "sections": [{"title": "5.1 docker build 命令详解", "content": "`docker build` 命令用于**从 Dockerfile 构建镜像**。\n\n#### 语法格式\n\n```bash\ndocker build [OPTIONS] PATH | URL | -\n```\n\n- `PATH`：构建上下文路径（通常是 `.`）\n- `URL`：Git 仓库 URL\n- `-`：从标准输入读取 Dockerfile\n\n#### 常用选项\n\n| 选项            | 说明                       |\n| --------------- | -------------------------- |\n| `-t, --tag`   | 镜像名称和标签             |\n| `-f, --file`  | 指定 Dockerfile 路径       |\n| `--build-arg` | 设置构建参数               |\n| `--no-cache`  | 不使用缓存                 |\n| `--target`    | 多阶段构建目标             |\n| `--platform`  | 目标平台                   |\n| `--pull`      | 始终拉取基础镜像           |\n| `--push`      | 构建后推送（需 buildx）    |\n| `-q, --quiet` | 静默输出                   |\n| `--progress`  | 输出格式（auto/plain/tty） |\n\n---\n\n#### 基本用法\n\n**示例 1：基本构建**\n\n```bash\n# 在当前目录构建\n$ docker build -t myapp:v1 .\n```\n\n**示例 2：指定 Dockerfile**\n\n```bash\ndocker build -t myapp:v1 -f Dockerfile.prod .\n```\n\n**示例 3：从 URL 构建**\n\n```bash\ndocker build -t myapp:v1 https://github.com/user/repo.git\n```\n\n**示例 4：从标准输入构建**\n\n```bash\ndocker build -t myapp:v1 - < Dockerfile\n```\n\n---\n\n#### 构建参数（--build-arg）\n\n`--build-arg` 用于在构建时传递变量。\n\n##### Dockerfile 中定义 ARG\n\n```dockerfile\nARG VERSION=latest\nARG BASE_IMAGE=alpine\n\nFROM ${BASE_IMAGE}:${VERSION}\n```\n\n##### 构建时传递参数\n\n```bash\n$ docker build \\\n  --build-arg VERSION=3.18 \\\n  --build-arg BASE_IMAGE=ubuntu \\\n  -t myapp:v1 .\n```\n\n> 💡 `ARG` 仅在构建阶段有效，运行时使用 `ENV`。\n\n---\n\n#### 多阶段构建（--target）\n\n多阶段构建用于**减小最终镜像体积**。\n\n##### 多阶段 Dockerfile 示例\n\n```dockerfile\n# 阶段 1：构建\nFROM golang:1.21 AS builder\nWORKDIR /app\nCOPY . .\nRUN go build -o myapp\n\n# 阶段 2：运行\nFROM alpine:3.18 AS production\nCOPY --from=builder /app/myapp /usr/local/bin/\nCMD [\"myapp\"]\n\n# 阶段 3：开发（包含调试工具）\nFROM builder AS development\nRUN go install github.com/go-delve/delve/cmd/dlv@latest\nCMD [\"dlv\", \"debug\"]\n```\n\n##### 构建特定阶段\n\n```bash\n# 构建生产镜像\n$ docker build --target production -t myapp:prod .\n\n# 构建开发镜像\n$ docker build --target development -t myapp:dev .\n\n# 只构建 builder 阶段\n$ docker build --target builder -t myapp:builder .\n```\n\n---\n\n#### 缓存控制\n\n##### 不使用缓存\n\n```bash\ndocker build --no-cache -t myapp:v1 .\n```\n\n##### 始终拉取基础镜像\n\n```bash\ndocker build --pull -t myapp:v1 .\n```\n\n##### 查看构建缓存\n\n```bash\ndocker builder du\n```\n\n##### 清理构建缓存\n\n```bash\ndocker builder prune\ndocker builder prune -a  # 清理所有\n```\n\n---\n\n#### 跨平台构建（--platform）\n\n使用 `--platform` 构建不同架构的镜像。\n\n```bash\n# 构建 ARM64 镜像\n$ docker build --platform linux/arm64 -t myapp:arm64 .\n\n# 构建 AMD64 镜像\n$ docker build --platform linux/amd64 -t myapp:amd64 .\n```\n\n> 💡 跨平台构建需要 QEMU 模拟器或 buildx。\n\n---\n\n#### docker buildx（高级构建）\n\n`docker buildx` 是 Docker 的扩展构建工具，支持更多功能。\n\n##### 创建构建器\n\n```bash\ndocker buildx create --name mybuilder --use\ndocker buildx inspect --bootstrap\n```\n\n##### 多平台构建\n\n```bash\n$ docker buildx build \\\n  --platform linux/amd64,linux/arm64 \\\n  -t username/myapp:v1 \\\n  --push \\\n  .\n```\n\n##### 构建并推送\n\n```bash\n$ docker buildx build \\\n  -t username/myapp:v1 \\\n  --push \\\n  .\n```\n\n##### 构建并加载到本地\n\n```bash\n$ docker buildx build \\\n  -t myapp:v1 \\\n  --load \\\n  .\n```\n\n---", "subs": ["语法格式", "常用选项", "基本用法", "构建参数（--build-arg）", "多阶段构建（", "缓存控制", "跨平台构建（", "docker buildx（高级构建）"]}, {"title": "5.2 Dockerfile 指令详解", "content": "Dockerfile 是构建镜像的蓝图，包含一系列指令。\n\n#### 常用指令一览\n\n| 指令            | 说明                        |\n| --------------- | --------------------------- |\n| `FROM`        | 基础镜像                    |\n| `RUN`         | 执行命令                    |\n| `COPY`        | 复制文件                    |\n| `ADD`         | 复制文件（支持 URL 和解压） |\n| `WORKDIR`     | 工作目录                    |\n| `ENV`         | 环境变量                    |\n| `ARG`         | 构建参数                    |\n| `EXPOSE`      | 暴露端口                    |\n| `CMD`         | 默认命令                    |\n| `ENTRYPOINT`  | 入口点                      |\n| `USER`        | 运行用户                    |\n| `VOLUME`      | 挂载点                      |\n| `LABEL`       | 元数据标签                  |\n| `HEALTHCHECK` | 健康检查                    |\n\n---\n\n#### FROM：基础镜像\n\n```dockerfile\n# 基本用法\nFROM ubuntu:22.04\n\n# 使用别名（多阶段构建）\nFROM golang:1.21 AS builder\n\n# 使用 ARG\nARG BASE_IMAGE=alpine:3.18\nFROM ${BASE_IMAGE}\n\n# scratch（空镜像）\nFROM scratch\n```\n\n---\n\n#### RUN：执行命令\n\n```dockerfile\n# Shell 格式\nRUN apt-get update && apt-get install -y nginx\n\n# Exec 格式\nRUN [\"apt-get\", \"update\"]\n\n# 多行命令（推荐）\nRUN apt-get update && \\\n    apt-get install -y --no-install-recommends \\\n        nginx \\\n        curl \\\n    && rm -rf /var/lib/apt/lists/*\n```\n\n---\n\n#### COPY vs ADD\n\n```dockerfile\n# COPY：简单复制\nCOPY src/ /app/src/\nCOPY package*.json ./\n\n# ADD：支持 URL 和自动解压\nADD https://example.com/file.tar.gz /tmp/\nADD archive.tar.gz /app/\n```\n\n> 💡 推荐使用 `COPY`，更明确且可预测。\n\n---\n\n#### WORKDIR：工作目录\n\n```dockerfile\nWORKDIR /app\nCOPY . .\nRUN npm install\n```\n\n---\n\n#### ENV vs ARG\n\n```dockerfile\n# ARG：构建时变量\nARG VERSION=1.0\n\n# ENV：运行时环境变量\nENV APP_ENV=production\nENV NODE_ENV=production\n\n# ARG 转 ENV\nARG VERSION\nENV APP_VERSION=${VERSION}\n```\n\n---\n\n#### CMD vs ENTRYPOINT\n\n```dockerfile\n# CMD：默认命令（可被覆盖）\nCMD [\"nginx\", \"-g\", \"daemon off;\"]\n\n# ENTRYPOINT：入口点（不易覆盖）\nENTRYPOINT [\"nginx\"]\nCMD [\"-g\", \"daemon off;\"]\n\n# Shell 格式\nCMD nginx -g 'daemon off;'\n```\n\n##### CMD 与 ENTRYPOINT 组合\n\n| ENTRYPOINT          | CMD                       | 结果                     |\n| ------------------- | ------------------------- | ------------------------ |\n| 无                  | `[\"nginx\"]`             | `nginx`                |\n| `[\"nginx\"]`       | `[\"-g\", \"daemon off;\"]` | `nginx -g daemon off;` |\n| `[\"nginx\", \"-g\"]` | `[\"daemon off;\"]`       | `nginx -g daemon off;` |\n\n---\n\n#### USER：运行用户\n\n```dockerfile\n# 创建用户\nRUN addgroup --system app && adduser --system --group app\n\n# 切换用户\nUSER app\n\n# 或使用 UID\nUSER 1000:1000\n```\n\n---\n\n#### HEALTHCHECK：健康检查\n\n```dockerfile\nHEALTHCHECK --interval=30s --timeout=10s --retries=3 --start-period=5s \\\n  CMD curl -f http://localhost/ || exit 1\n\n# 禁用健康检查\nHEALTHCHECK NONE\n```\n\n---", "subs": ["常用指令一览", "FROM：基础镜像", "RUN：执行命令", "COPY vs ADD", "WORKDIR", "ENV vs ARG", "CMD vs ENTRYPOINT", "USER：运行用户", "HEALTHCHECK"]}, {"title": "5.3 Dockerfile 最佳实践", "content": "#### 减小镜像体积\n\n```dockerfile\n# 使用小基础镜像\nFROM alpine:3.18\n\n# 多阶段构建\nFROM golang:1.21 AS builder\nRUN go build -o app\n\nFROM alpine:3.18\nCOPY --from=builder /app/app /usr/local/bin/\n\n# 清理缓存\nRUN apt-get update && apt-get install -y nginx \\\n    && rm -rf /var/lib/apt/lists/*\n```\n\n#### 利用构建缓存\n\n```dockerfile\n# 先复制依赖文件\nCOPY package*.json ./\nRUN npm install\n\n# 再复制源码（变化频繁）\nCOPY . .\n```\n\n#### 安全最佳实践\n\n```dockerfile\n# 使用非 root 用户\nRUN adduser --system --no-create-home appuser\nUSER appuser\n\n# 固定版本\nFROM nginx:1.25.3-alpine\n\n# 扫描漏洞\n# docker scout cves myapp:v1\n```\n\n#### 标准 Dockerfile 模板\n\n```dockerfile\n# syntax=docker/dockerfile:1.4\n\n# ============ 构建阶段 ============\nFROM node:20-alpine AS builder\n\nWORKDIR /app\n\n# 依赖安装（利用缓存）\nCOPY package*.json ./\nRUN npm ci --only=production\n\n# 复制源码\nCOPY . .\n\n# 构建\nRUN npm run build\n\n# ============ 生产阶段 ============\nFROM node:20-alpine AS production\n\n# 安全：创建非 root 用户\nRUN addgroup --system app && adduser --system --group app\n\nWORKDIR /app\n\n# 复制构建产物\nCOPY --from=builder --chown=app:app /app/dist ./dist\nCOPY --from=builder --chown=app:app /app/node_modules ./node_modules\n\n# 切换用户\nUSER app\n\n# 暴露端口\nEXPOSE 3000\n\n# 健康检查\nHEALTHCHECK --interval=30s --timeout=10s --retries=3 \\\n  CMD wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1\n\n# 启动命令\nCMD [\"node\", \"dist/main.js\"]\n```\n\n---", "subs": ["减小镜像体积", "利用构建缓存", "安全最佳实践", "标准 Dockerfile 模板"]}, {"title": "5.4 构建命令小结", "content": "| 命令                     | 作用     | 示例                                                                |\n| ------------------------ | -------- | ------------------------------------------------------------------- |\n| `docker build`         | 构建镜像 | `docker build -t myapp:v1 .`                                      |\n| `docker buildx build`  | 高级构建 | `docker buildx build --platform linux/amd64,linux/arm64 --push .` |\n| `docker builder prune` | 清理缓存 | `docker builder prune -a`                                         |\n\n---\n\n---", "subs": []}]}, {"title": "第六章 网络管理", "sections": [{"title": "6.1 Docker 网络概述", "content": "Docker 提供多种网络驱动，用于容器间通信。\n\n#### 网络驱动类型\n\n| 驱动        | 说明                           | 使用场景         |\n| ----------- | ------------------------------ | ---------------- |\n| `bridge`  | 默认网络，容器通过虚拟网桥通信 | 单机容器通信     |\n| `host`    | 容器使用宿主机网络栈           | 高性能场景       |\n| `none`    | 无网络                         | 安全隔离         |\n| `overlay` | 跨主机容器通信                 | Swarm/K8s 集群   |\n| `macvlan` | 容器拥有独立 MAC 地址          | 直接接入物理网络 |\n| `ipvlan`  | 类似 macvlan，共享 MAC         | 特殊网络需求     |\n\n---", "subs": ["网络驱动类型"]}, {"title": "6.2 网络创建与删除命令（create/rm/prune）", "content": "#### docker network create：创建网络\n\n`docker network create` 命令用于**创建自定义网络**。\n\n##### 语法格式\n\n```bash\ndocker network create [OPTIONS] NETWORK\n```\n\n##### 常用选项\n\n| 选项             | 说明                    |\n| ---------------- | ----------------------- |\n| `-d, --driver` | 网络驱动（默认 bridge） |\n| `--subnet`     | 子网（CIDR 格式）       |\n| `--gateway`    | 网关地址                |\n| `--ip-range`   | IP 分配范围             |\n| `--internal`   | 内部网络（无外部访问）  |\n| `--attachable` | 允许手动附加容器        |\n| `-o, --opt`    | 驱动选项                |\n| `--label`      | 网络标签                |\n\n##### 实战示例\n\n**示例 1：创建默认 bridge 网络**\n\n```bash\ndocker network create mynet\n```\n\n**示例 2：指定子网和网关**\n\n```bash\n$ docker network create \\\n  --subnet 172.20.0.0/16 \\\n  --gateway 172.20.0.1 \\\n  mynet\n```\n\n**示例 3：创建内部网络**\n\n```bash\ndocker network create --internal backend-net\n```\n\n**示例 4：创建 overlay 网络（Swarm）**\n\n```bash\ndocker network create -d overlay --attachable app-net\n```\n\n**示例 5：创建 macvlan 网络**\n\n```bash\n$ docker network create -d macvlan \\\n  --subnet 192.168.1.0/24 \\\n  --gateway 192.168.1.1 \\\n  -o parent=eth0 \\\n  macvlan-net\n```\n\n**示例 6：指定 IP 范围**\n\n```bash\n$ docker network create \\\n  --subnet 10.0.0.0/16 \\\n  --ip-range 10.0.1.0/24 \\\n  --gateway 10.0.0.1 \\\n  custom-net\n```\n\n---\n\n#### docker network rm：删除网络\n\n`docker network rm` 命令用于**删除网络**。\n\n##### 语法格式\n\n```bash\ndocker network rm NETWORK [NETWORK...]\n```\n\n##### 实战示例\n\n```bash\n# 删除单个网络\n$ docker network rm mynet\n\n# 删除多个网络\n$ docker network rm net1 net2 net3\n\n# 使用 ID 删除\n$ docker network rm abc123\n```\n\n> ⚠️ **注意**：无法删除正在使用的网络，需先断开所有容器。\n\n---\n\n#### docker network prune：清理网络\n\n`docker network prune` 命令用于**清理未使用的网络**。\n\n##### 语法格式\n\n```bash\ndocker network prune [OPTIONS]\n```\n\n##### 常用选项\n\n| 选项            | 说明       |\n| --------------- | ---------- |\n| `-f, --force` | 不提示确认 |\n| `--filter`    | 过滤条件   |\n\n##### 实战示例\n\n```bash\n# 清理未使用的网络\n$ docker network prune\nWARNING! This will remove all custom networks not used by at least one container.\nAre you sure you want to continue? [y/N] y\n\n# 强制清理\n$ docker network prune -f\n\n# 按时间过滤\n$ docker network prune --filter \"until=24h\"\n```\n\n---", "subs": ["docker network create", "docker network rm", "docker network prune"]}, {"title": "6.3 网络查看命令（ls/inspect）", "content": "#### docker network ls：列出网络\n\n```bash\n# 列出所有网络\n$ docker network ls\nNETWORK ID     NAME      DRIVER    SCOPE\nabc123def456   bridge    bridge    local\ndef456ghi789   host      host      local\nghi789jkl012   none      null      local\n\n# 过滤网络\n$ docker network ls -f driver=bridge\n$ docker network ls -f name=mynet\n\n# 静默模式\n$ docker network ls -q\n```\n\n---\n\n#### docker network inspect：查看网络详情\n\n```bash\n# 查看网络详情\n$ docker network inspect mynet\n\n# 提取特定字段\n$ docker network inspect -f '{{.IPAM.Config}}' mynet\n$ docker network inspect -f '{{range .Containers}}{{.Name}}{{end}}' mynet\n```\n\n##### 常用 inspect 字段\n\n| 字段路径         | 说明       |\n| ---------------- | ---------- |\n| `.Name`        | 网络名称   |\n| `.Driver`      | 驱动类型   |\n| `.Scope`       | 作用域     |\n| `.IPAM.Config` | IP 配置    |\n| `.Containers`  | 连接的容器 |\n| `.Options`     | 驱动选项   |\n\n---", "subs": ["docker network ls", "docker network inspect"]}, {"title": "6.4 网络连接命令（connect/disconnect）", "content": "#### docker network connect：连接容器到网络\n\n```bash\n# 连接容器到网络\n$ docker network connect mynet mycontainer\n\n# 指定 IP 地址\n$ docker network connect --ip 172.20.0.10 mynet mycontainer\n\n# 指定别名\n$ docker network connect --alias db mynet mysql-container\n```\n\n---\n\n#### docker network disconnect：断开容器网络\n\n```bash\n# 断开连接\n$ docker network disconnect mynet mycontainer\n\n# 强制断开\n$ docker network disconnect -f mynet mycontainer\n```\n\n---", "subs": ["docker network connect", "docker network disconnect"]}, {"title": "6.5 网络实战场景", "content": "#### 场景 1：多容器应用网络\n\n```bash\n# 创建应用网络\n$ docker network create app-network\n\n# 启动数据库（指定网络）\n$ docker run -d --name db \\\n  --network app-network \\\n  -e MYSQL_ROOT_PASSWORD=secret \\\n  mysql:8.0\n\n# 启动应用（同一网络）\n$ docker run -d --name app \\\n  --network app-network \\\n  -e DB_HOST=db \\\n  myapp:v1\n```\n\n#### 场景 2：前后端分离网络\n\n```bash\n# 创建前端网络\n$ docker network create frontend\n\n# 创建后端网络（内部）\n$ docker network create --internal backend\n\n# API 网关连接两个网络\n$ docker run -d --name api-gateway \\\n  --network frontend \\\n  api-gateway:v1\n\n$ docker network connect backend api-gateway\n```\n\n#### 场景 3：固定容器 IP\n\n```bash\n# 创建指定子网的网络\n$ docker network create \\\n  --subnet 172.28.0.0/16 \\\n  fixed-ip-net\n\n# 启动容器并指定 IP\n$ docker run -d --name web \\\n  --network fixed-ip-net \\\n  --ip 172.28.0.100 \\\n  nginx\n```\n\n---", "subs": ["场景 1：多容器应用网络", "场景 2：前后端分离网络", "场景 3：固定容器 IP"]}, {"title": "6.6 网络命令小结", "content": "| 命令                          | 作用     | 示例                                    |\n| ----------------------------- | -------- | --------------------------------------- |\n| `docker network create`     | 创建网络 | `docker network create mynet`         |\n| `docker network rm`         | 删除网络 | `docker network rm mynet`             |\n| `docker network prune`      | 清理网络 | `docker network prune -f`             |\n| `docker network ls`         | 列出网络 | `docker network ls`                   |\n| `docker network inspect`    | 查看详情 | `docker network inspect mynet`        |\n| `docker network connect`    | 连接容器 | `docker network connect mynet app`    |\n| `docker network disconnect` | 断开容器 | `docker network disconnect mynet app` |\n\n---\n\n---", "subs": []}]}, {"title": "第七章 存储管理", "sections": [{"title": "7.1 Docker 存储概述", "content": "Docker 提供多种数据持久化方式。\n\n#### 存储类型对比\n\n| 类型       | 说明                | 管理方式          | 适用场景           |\n| ---------- | ------------------- | ----------------- | ------------------ |\n| Volume     | Docker 管理的数据卷 | `docker volume` | 生产环境首选       |\n| Bind Mount | 挂载宿主机目录      | 绝对路径          | 开发环境、配置文件 |\n| tmpfs      | 内存文件系统        | `--tmpfs`       | 敏感数据、临时文件 |\n\n#### 存储驱动\n\n| 驱动      | 说明                   |\n| --------- | ---------------------- |\n| `local` | 默认驱动，存储在宿主机 |\n| `nfs`   | NFS 网络存储           |\n| `cifs`  | Windows 共享存储       |\n\n---", "subs": ["存储类型对比", "存储驱动"]}, {"title": "7.2 存储卷命令（create/ls/prune）", "content": "#### docker volume create：创建卷\n\n`docker volume create` 命令用于**创建数据卷**。\n\n##### 语法格式\n\n```bash\ndocker volume create [OPTIONS] [VOLUME]\n```\n\n##### 常用选项\n\n| 选项             | 说明                 |\n| ---------------- | -------------------- |\n| `-d, --driver` | 卷驱动（默认 local） |\n| `--label`      | 卷标签               |\n| `-o, --opt`    | 驱动选项             |\n\n##### 实战示例\n\n**示例 1：创建默认卷**\n\n```bash\n$ docker volume create mydata\nmydata\n```\n\n**示例 2：创建带标签的卷**\n\n```bash\ndocker volume create --label env=prod --label app=mysql mysql-data\n```\n\n**示例 3：使用 NFS 驱动**\n\n```bash\n$ docker volume create \\\n  --driver local \\\n  --opt type=nfs \\\n  --opt o=addr=192.168.1.100,rw \\\n  --opt device=:/exports/data \\\n  nfs-data\n```\n\n**示例 4：指定本地路径**\n\n```bash\n$ docker volume create \\\n  --driver local \\\n  --opt type=none \\\n  --opt device=/data/myapp \\\n  --opt o=bind \\\n  myapp-data\n```\n\n---\n\n#### docker volume ls：列出卷\n\n`docker volume ls` 命令用于**列出所有数据卷**。\n\n##### 语法格式\n\n```bash\ndocker volume ls [OPTIONS]\n```\n\n##### 常用选项\n\n| 选项             | 说明       |\n| ---------------- | ---------- |\n| `-f, --filter` | 过滤条件   |\n| `-q, --quiet`  | 只显示卷名 |\n| `--format`     | 格式化输出 |\n\n##### 实战示例\n\n```bash\n# 列出所有卷\n$ docker volume ls\nDRIVER    VOLUME NAME\nlocal     mydata\nlocal     mysql-data\nlocal     nginx-config\n\n# 只显示卷名\n$ docker volume ls -q\n\n# 按标签过滤\n$ docker volume ls -f label=env=prod\n\n# 过滤悬空卷\n$ docker volume ls -f dangling=true\n\n# 格式化输出\n$ docker volume ls --format \"{{.Name}}: {{.Driver}}\"\n```\n\n---\n\n#### docker volume inspect：查看卷详情\n\n```bash\n# 查看卷详情\n$ docker volume inspect mydata\n[\n    {\n        \"CreatedAt\": \"2024-01-15T12:00:00Z\",\n        \"Driver\": \"local\",\n        \"Labels\": {},\n        \"Mountpoint\": \"/var/lib/docker/volumes/mydata/_data\",\n        \"Name\": \"mydata\",\n        \"Options\": {},\n        \"Scope\": \"local\"\n    }\n]\n\n# 提取特定字段\n$ docker volume inspect -f '{{.Mountpoint}}' mydata\n/var/lib/docker/volumes/mydata/_data\n```\n\n##### 常用 inspect 字段\n\n| 字段            | 说明       |\n| --------------- | ---------- |\n| `.Name`       | 卷名称     |\n| `.Driver`     | 驱动       |\n| `.Mountpoint` | 挂载点路径 |\n| `.CreatedAt`  | 创建时间   |\n| `.Labels`     | 标签       |\n| `.Options`    | 选项       |\n\n---\n\n#### docker volume rm：删除卷\n\n```bash\n# 删除单个卷\n$ docker volume rm mydata\n\n# 删除多个卷\n$ docker volume rm vol1 vol2 vol3\n\n# 强制删除（跳过确认）\n$ docker volume rm -f mydata\n```\n\n> ⚠️ **注意**：无法删除正在使用的卷，需先停止/删除使用该卷的容器。\n\n---\n\n#### docker volume prune：清理卷\n\n`docker volume prune` 命令用于**清理未使用的数据卷**。\n\n```bash\n# 清理未使用的卷\n$ docker volume prune\nWARNING! This will remove all local volumes not used by at least one container.\nAre you sure you want to continue? [y/N] y\n\n# 强制清理\n$ docker volume prune -f\n\n# 按标签过滤\n$ docker volume prune --filter label=temp\n```\n\n> ⚠️ **警告**：此操作会永久删除数据，请谨慎操作！\n\n---", "subs": ["docker volume create", "docker volume ls", "docker volume inspect", "docker volume rm", "docker volume prune"]}, {"title": "7.3 卷的使用方式", "content": "#### 使用 -v 挂载卷\n\n```bash\n# 具名卷\n$ docker run -d -v mydata:/app/data nginx\n\n# 匿名卷\n$ docker run -d -v /app/data nginx\n\n# Bind Mount\n$ docker run -d -v /host/path:/container/path nginx\n```\n\n#### 使用 --mount 挂载卷（推荐）\n\n```bash\n# 挂载卷\n$ docker run -d \\\n  --mount type=volume,source=mydata,target=/app/data \\\n  nginx\n\n# 只读挂载\n$ docker run -d \\\n  --mount type=volume,source=mydata,target=/app/data,readonly \\\n  nginx\n\n# Bind Mount\n$ docker run -d \\\n  --mount type=bind,source=/host/path,target=/app/data \\\n  nginx\n```\n\n#### --mount 选项详解\n\n| 选项           | 说明                          |\n| -------------- | ----------------------------- |\n| `type`       | 挂载类型（volume/bind/tmpfs） |\n| `source`     | 卷名或宿主机路径              |\n| `target`     | 容器内挂载点                  |\n| `readonly`   | 只读模式                      |\n| `volume-opt` | 卷选项                        |\n\n---", "subs": ["使用 -v 挂载卷", "使用 --mount 挂载卷（推荐）", "--mount 选项详解"]}, {"title": "7.4 存储实战场景", "content": "#### 场景 1：数据库持久化\n\n```bash\n# 创建数据卷\n$ docker volume create mysql-data\n\n# 启动 MySQL\n$ docker run -d \\\n  --name mysql \\\n  -e MYSQL_ROOT_PASSWORD=secret \\\n  --mount type=volume,source=mysql-data,target=/var/lib/mysql \\\n  mysql:8.0\n```\n\n#### 场景 2：配置文件挂载\n\n```bash\n# 挂载 Nginx 配置\n$ docker run -d \\\n  --name nginx \\\n  --mount type=bind,source=/etc/nginx/nginx.conf,target=/etc/nginx/nginx.conf,readonly \\\n  --mount type=bind,source=/var/www/html,target=/usr/share/nginx/html \\\n  nginx\n```\n\n#### 场景 3：多容器共享卷\n\n```bash\n# 创建共享卷\n$ docker volume create shared-data\n\n# 容器 1：写入数据\n$ docker run -d --name writer \\\n  --mount type=volume,source=shared-data,target=/data \\\n  alpine sh -c \"while true; do date >> /data/log.txt; sleep 5; done\"\n\n# 容器 2：读取数据\n$ docker run -it --name reader \\\n  --mount type=volume,source=shared-data,target=/data,readonly \\\n  alpine cat /data/log.txt\n```\n\n#### 场景 4：卷备份与恢复\n\n```bash\n# 备份卷\n$ docker run --rm \\\n  --mount type=volume,source=mydata,target=/data \\\n  -v $(pwd):/backup \\\n  alpine tar czf /backup/mydata-backup.tar.gz -C /data .\n\n# 恢复卷\n$ docker run --rm \\\n  --mount type=volume,source=mydata-restore,target=/data \\\n  -v $(pwd):/backup \\\n  alpine tar xzf /backup/mydata-backup.tar.gz -C /data\n```\n\n---", "subs": ["场景 1：数据库持久化", "场景 2：配置文件挂载", "场景 3：多容器共享卷", "场景 4：卷备份与恢复"]}, {"title": "7.5 存储命令小结", "content": "| 命令                      | 作用     | 示例                             |\n| ------------------------- | -------- | -------------------------------- |\n| `docker volume create`  | 创建卷   | `docker volume create mydata`  |\n| `docker volume ls`      | 列出卷   | `docker volume ls -q`          |\n| `docker volume inspect` | 查看详情 | `docker volume inspect mydata` |\n| `docker volume rm`      | 删除卷   | `docker volume rm mydata`      |\n| `docker volume prune`   | 清理卷   | `docker volume prune -f`       |\n\n---\n\n---", "subs": []}]}, {"title": "第八章 Docker 守护进程配置", "sections": [{"title": "8.1 dockerd 概述", "content": "`dockerd` 是 Docker 守护进程，负责管理容器、镜像、网络和存储。\n\n#### 架构组件\n\n```\n┌─────────────────────────────────────────────────┐\n│                   Docker Client                  │\n│               (docker CLI / API)                 │\n└─────────────────────┬───────────────────────────┘\n                      │ REST API\n┌─────────────────────▼───────────────────────────┐\n│                    dockerd                       │\n│               (Docker Daemon)                    │\n├─────────────────────┬───────────────────────────┤\n│     containerd      │       buildkit            │\n├─────────────────────┼───────────────────────────┤\n│        runc         │     容器运行时             │\n└─────────────────────┴───────────────────────────┘\n```\n\n---", "subs": ["架构组件"]}, {"title": "8.2 daemon.json 配置文件", "content": "Docker 守护进程的主要配置文件是 `/etc/docker/daemon.json`。\n\n#### 配置文件位置\n\n| 系统                   | 路径                                         |\n| ---------------------- | -------------------------------------------- |\n| Linux                  | `/etc/docker/daemon.json`                  |\n| Windows                | `C:\\ProgramData\\docker\\config\\daemon.json` |\n| macOS (Docker Desktop) | `~/.docker/daemon.json`                    |\n\n#### 常用配置项\n\n```json\n{\n  \"data-root\": \"/var/lib/docker\",\n  \"storage-driver\": \"overlay2\",\n  \"log-driver\": \"json-file\",\n  \"log-opts\": {\n    \"max-size\": \"100m\",\n    \"max-file\": \"3\"\n  },\n  \"registry-mirrors\": [\n    \"https://mirror.ccs.tencentyun.com\",\n    \"https://registry.docker-cn.com\"\n  ],\n  \"insecure-registries\": [\n    \"registry.example.com:5000\"\n  ],\n  \"dns\": [\"8.8.8.8\", \"8.8.4.4\"],\n  \"bip\": \"172.17.0.1/16\",\n  \"default-address-pools\": [\n    {\"base\": \"172.18.0.0/16\", \"size\": 24}\n  ],\n  \"live-restore\": true,\n  \"debug\": false,\n  \"tls\": true,\n  \"tlscacert\": \"/etc/docker/ca.pem\",\n  \"tlscert\": \"/etc/docker/server-cert.pem\",\n  \"tlskey\": \"/etc/docker/server-key.pem\"\n}\n```\n\n#### 配置项详解\n\n| 配置项                  | 说明                       |\n| ----------------------- | -------------------------- |\n| `data-root`           | Docker 数据目录            |\n| `storage-driver`      | 存储驱动（overlay2 推荐）  |\n| `log-driver`          | 日志驱动                   |\n| `log-opts`            | 日志选项                   |\n| `registry-mirrors`    | 镜像加速器                 |\n| `insecure-registries` | 非安全仓库                 |\n| `dns`                 | DNS 服务器                 |\n| `bip`                 | docker0 网桥 IP            |\n| `live-restore`        | 守护进程重启时保持容器运行 |\n| `debug`               | 调试模式                   |\n\n---", "subs": ["配置文件位置", "常用配置项", "配置项详解"]}, {"title": "8.3 常用配置场景", "content": "#### 场景 1：配置镜像加速器\n\n```json\n{\n  \"registry-mirrors\": [\n    \"https://mirror.ccs.tencentyun.com\",\n    \"https://registry.docker-cn.com\",\n    \"https://docker.mirrors.ustc.edu.cn\"\n  ]\n}\n```\n\n#### 场景 2：配置日志轮转\n\n```json\n{\n  \"log-driver\": \"json-file\",\n  \"log-opts\": {\n    \"max-size\": \"100m\",\n    \"max-file\": \"5\",\n    \"compress\": \"true\"\n  }\n}\n```\n\n#### 场景 3：配置私有仓库\n\n```json\n{\n  \"insecure-registries\": [\n    \"192.168.1.100:5000\",\n    \"registry.local:5000\"\n  ]\n}\n```\n\n#### 场景 4：更改数据目录\n\n```json\n{\n  \"data-root\": \"/data/docker\"\n}\n```\n\n#### 场景 5：配置网络\n\n```json\n{\n  \"bip\": \"10.200.0.1/16\",\n  \"dns\": [\"10.0.0.2\", \"8.8.8.8\"],\n  \"default-address-pools\": [\n    {\"base\": \"10.201.0.0/16\", \"size\": 24},\n    {\"base\": \"10.202.0.0/16\", \"size\": 24}\n  ]\n}\n```\n\n---", "subs": ["场景 1：配置镜像加速器", "场景 2：配置日志轮转", "场景 3：配置私有仓库", "场景 4：更改数据目录", "场景 5：配置网络"]}, {"title": "8.4 远程访问配置", "content": "#### 启用 TCP 远程访问\n\n> ⚠️ **警告**：开放 TCP 访问存在安全风险，生产环境必须启用 TLS。\n\n##### 方式 1：修改 daemon.json\n\n```json\n{\n  \"hosts\": [\"unix:///var/run/docker.sock\", \"tcp://0.0.0.0:2375\"]\n}\n```\n\n##### 方式 2：修改 systemd 配置\n\n```bash\n# 创建 override 文件\n$ sudo mkdir -p /etc/systemd/system/docker.service.d\n$ sudo cat > /etc/systemd/system/docker.service.d/override.conf << EOF\n[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H fd:// -H tcp://0.0.0.0:2375\nEOF\n\n# 重载配置\n$ sudo systemctl daemon-reload\n$ sudo systemctl restart docker\n```\n\n##### 客户端连接远程 Docker\n\n```bash\n# 使用环境变量\n$ export DOCKER_HOST=tcp://192.168.1.100:2375\n$ docker ps\n\n# 使用 -H 参数\n$ docker -H tcp://192.168.1.100:2375 ps\n```\n\n---", "subs": ["启用 TCP 远程访问"]}, {"title": "8.5 TLS 安全配置", "content": "#### 生成证书\n\n```bash\n# 创建 CA 证书\n$ openssl genrsa -aes256 -out ca-key.pem 4096\n$ openssl req -new -x509 -days 365 -key ca-key.pem -sha256 -out ca.pem\n\n# 创建服务器证书\n$ openssl genrsa -out server-key.pem 4096\n$ openssl req -subj \"/CN=docker-server\" -sha256 -new -key server-key.pem -out server.csr\n$ echo subjectAltName = DNS:docker-server,IP:192.168.1.100 >> extfile.cnf\n$ openssl x509 -req -days 365 -sha256 -in server.csr -CA ca.pem -CAkey ca-key.pem \\\n  -CAcreateserial -out server-cert.pem -extfile extfile.cnf\n\n# 创建客户端证书\n$ openssl genrsa -out key.pem 4096\n$ openssl req -subj '/CN=client' -new -key key.pem -out client.csr\n$ echo extendedKeyUsage = clientAuth > extfile-client.cnf\n$ openssl x509 -req -days 365 -sha256 -in client.csr -CA ca.pem -CAkey ca-key.pem \\\n  -CAcreateserial -out cert.pem -extfile extfile-client.cnf\n```\n\n#### 服务端配置\n\n```json\n{\n  \"hosts\": [\"unix:///var/run/docker.sock\", \"tcp://0.0.0.0:2376\"],\n  \"tls\": true,\n  \"tlsverify\": true,\n  \"tlscacert\": \"/etc/docker/ca.pem\",\n  \"tlscert\": \"/etc/docker/server-cert.pem\",\n  \"tlskey\": \"/etc/docker/server-key.pem\"\n}\n```\n\n#### 客户端连接\n\n```bash\n$ docker --tlsverify \\\n  --tlscacert=ca.pem \\\n  --tlscert=cert.pem \\\n  --tlskey=key.pem \\\n  -H=tcp://192.168.1.100:2376 \\\n  ps\n```\n\n---", "subs": ["生成证书", "服务端配置", "客户端连接"]}, {"title": "8.6 dockerd 命令行选项", "content": "#### 常用选项\n\n| 选项                    | 说明         |\n| ----------------------- | ------------ |\n| `-H, --host`          | 监听地址     |\n| `-D, --debug`         | 调试模式     |\n| `--data-root`         | 数据目录     |\n| `--storage-driver`    | 存储驱动     |\n| `--log-driver`        | 日志驱动     |\n| `--registry-mirror`   | 镜像加速器   |\n| `--insecure-registry` | 非安全仓库   |\n| `--live-restore`      | 保持容器运行 |\n\n#### 示例\n\n```bash\n# 调试模式启动\n$ dockerd --debug\n\n# 指定数据目录\n$ dockerd --data-root /data/docker\n\n# 多个监听地址\n$ dockerd -H unix:///var/run/docker.sock -H tcp://0.0.0.0:2375\n```\n\n---", "subs": ["常用选项", "示例"]}, {"title": "8.7 服务管理", "content": "#### systemctl 管理\n\n```bash\n# 启动 Docker\n$ sudo systemctl start docker\n\n# 停止 Docker\n$ sudo systemctl stop docker\n\n# 重启 Docker\n$ sudo systemctl restart docker\n\n# 查看状态\n$ sudo systemctl status docker\n\n# 开机自启\n$ sudo systemctl enable docker\n\n# 禁用开机自启\n$ sudo systemctl disable docker\n```\n\n#### 重载配置\n\n```bash\n# 修改 daemon.json 后\n$ sudo systemctl daemon-reload\n$ sudo systemctl restart docker\n```\n\n---", "subs": ["systemctl 管理", "重载配置"]}, {"title": "8.8 docker info / docker version", "content": "#### docker version\n\n```bash\n$ docker version\nClient:\n Version:           24.0.7\n API version:       1.43\n Go version:        go1.21.3\n Git commit:        afdd53b\n Built:             Thu Oct 26 09:08:17 2023\n OS/Arch:           linux/amd64\n Context:           default\n\nServer:\n Engine:\n  Version:          24.0.7\n  API version:      1.43 (minimum version 1.12)\n  Go version:       go1.21.3\n  Git commit:       311b9ff\n  Built:            Thu Oct 26 09:08:17 2023\n  OS/Arch:          linux/amd64\n```\n\n#### docker info\n\n```bash\n$ docker info\nClient:\n Context:    default\n Debug Mode: false\n\nServer:\n Containers: 5\n  Running: 3\n  Paused: 0\n  Stopped: 2\n Images: 15\n Server Version: 24.0.7\n Storage Driver: overlay2\n Logging Driver: json-file\n Cgroup Driver: systemd\n Default Runtime: runc\n Docker Root Dir: /var/lib/docker\n Registry: https://index.docker.io/v1/\n Live Restore Enabled: true\n```\n\n---", "subs": ["docker version", "docker info"]}, {"title": "8.9 守护进程配置小结", "content": "| 配置方式    | 文件/命令                                 | 优先级 |\n| ----------- | ----------------------------------------- | ------ |\n| daemon.json | `/etc/docker/daemon.json`               | 推荐   |\n| systemd     | `/etc/systemd/system/docker.service.d/` | 覆盖   |\n| 命令行      | `dockerd [OPTIONS]`                     | 临时   |\n\n#### 生产环境推荐配置\n\n```json\n{\n  \"data-root\": \"/var/lib/docker\",\n  \"storage-driver\": \"overlay2\",\n  \"log-driver\": \"json-file\",\n  \"log-opts\": {\n    \"max-size\": \"100m\",\n    \"max-file\": \"3\"\n  },\n  \"registry-mirrors\": [\"https://mirror.example.com\"],\n  \"live-restore\": true,\n  \"default-ulimits\": {\n    \"nofile\": {\n      \"Name\": \"nofile\",\n      \"Hard\": 65535,\n      \"Soft\": 65535\n    }\n  },\n  \"exec-opts\": [\"native.cgroupdriver=systemd\"]\n}\n```\n\n---", "subs": ["生产环境推荐配置"]}, {"title": "8.10 daemon.json 完整配置示例", "content": "以下是一个包含所有可用配置项的完整 daemon.json 示例：\n\n```json\n{\n  \"allow-direct-routing\": false,\n  \"authorization-plugins\": [],\n  \"bip\": \"\",\n  \"bip6\": \"\",\n  \"bridge\": \"\",\n  \"bridge-accept-fwmark\": \"\",\n  \"builder\": {\n    \"gc\": {\n      \"enabled\": true,\n      \"defaultReservedSpace\": \"10GB\",\n      \"policy\": [\n        { \"maxUsedSpace\": \"512MB\", \"keepDuration\": \"48h\", \"filter\": [ \"type=source.local\" ] },\n        { \"reservedSpace\": \"10GB\", \"maxUsedSpace\": \"100GB\", \"keepDuration\": \"1440h\" },\n        { \"reservedSpace\": \"50GB\", \"minFreeSpace\": \"20GB\", \"maxUsedSpace\": \"200GB\", \"all\": true }\n      ]\n    }\n  },\n  \"cgroup-parent\": \"\",\n  \"containerd\": \"/run/containerd/containerd.sock\",\n  \"containerd-namespace\": \"docker\",\n  \"containerd-plugins-namespace\": \"docker-plugins\",\n  \"data-root\": \"\",\n  \"debug\": true,\n  \"default-address-pools\": [\n    { \"base\": \"172.30.0.0/16\", \"size\": 24 },\n    { \"base\": \"172.31.0.0/16\", \"size\
